[LoadScreen]
WarningPSE=매우 소수의 개인이 특정 빛 패턴이나 번쩍이는 빛에 노출되면 간질성 발작을 경험할 수 있습니다. 컴퓨터 화면의 특정 패턴이나 배경에 노출되거나 비디오 게임을 하는 동안 이러한 개인에게 간질성 발작을 유발할 수 있습니다. 특정 질환은 이전에 발작이나 간질 병력이 없었던 사람에게도 이전에 발견되지 않은 간질 증상을 유발할 수 있습니다.\n\n귀하 또는 귀하의 가족 중 간질 질환이 있는 사람이 있는 경우 플레이하기 전에 의사와 상담하십시오. 비디오 또는 컴퓨터 게임을 하는 동안 현기증, 시력 변화, 눈이나 근육 경련, 의식 상실, 방향 감각 상실, 비자발적 움직임 또는 경련과 같은 다음 증상 중 하나를 경험하는 경우, 즉시 사용을 중단하고 게임을 하기 전 의사와 상담하십시오.
WarningValidity=게임 파일의 내용이 예상 해시와 일치하지 않습니다. 게임을 종료하고 /StreamingAssets/original의 내용을 삭제한 후 Steam을 통해 파일 무결성 검사를 해주세요.\\r\n\\r\n폴더 삭제를 누르면 자동으로 폴더가 삭제되어 Steam이 다음 실행 시 다시 다운로드 합니다.
