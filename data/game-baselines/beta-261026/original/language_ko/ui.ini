Doctrine=Toggle Standing Orders
DoctrineTransitTelegraph=Sets the telegraph value used by default for this platform type to transit.
DoctrineLoiterTelegraph=Sets the telegraph value used by default for this platform type to loiter.
DoctrineAllowAlignment=When enabled units will be allowed to alter course to bring weapons to bear.
DoctrineAircraftWinchesterRtb=When enabled, player aircraft return to base once they are considered Winchester.
DoctrineInterceptorAllAamRtb=When enabled, fighter aircraft stay on station until all air-to-air missiles are gone, including short-range missiles.
DoctrineFighterAllAamAndGunRtb=When enabled, fighter aircraft stay on station until all air-to-air missiles and gun ammunition are gone.
DoctrineFighterRtbCondition=Select whether aircraft consider themselves Winchester after all air-to-air missiles are gone, or only after both air-to-air missiles and gun ammunition are gone.
DoctrineHelicopterSonobuoyDeployState=Sets the default sonobuoy search depth for player helicopters. Intermittent alternates drops above and below the layer.
DoctrineAASalvoSize=Controls how many interceptors player ships fire at each incoming air threat during automatic anti-air engagements.
DoctrineShipsOnWeaponsTightEngageHostileAircraft=When enabled, player ships on Weapons Tight may automatically engage detected hostile aircraft. Warning: engaging aircraft may activate the ship's radars.
DoctrineShipsAutoUseSAMsAgainstSurfaceTargets=When enabled, player ships may automatically use surface-to-air missiles with an anti-surface mode against surface targets.
DoctrineShipsAutoUseAntiShipMissilesAgainstSurfaceTargets=When disabled, player ships on Weapons Free will not start new automatic anti-ship missile engagements against surface targets. Guns, torpedoes, ASROC, and permitted surface-capable SAMs remain eligible. Manual attack orders and already-issued salvos are unaffected.
DoctrineBombAttackProfile=Selects how player aircraft make bomb attacks. Automatic preserves loadout and altitude behavior
DoctrineFightersDoNotEngageAntiShipMissiles=When enabled, player fighter aircraft will not automatically engage detected anti-ship missiles.
DoctrineAutoAttackSurface=When enabled, player units on Weapons Free may automatically engage valid hostile surface contacts.
DoctrineCollisionAvoidance=When enabled, ships and submarines use automatic collision-avoidance manoeuvres to avoid nearby traffic.
DoctrineDropTanks=When enabled, player aircraft automatically jettison external fuel tanks when entering combat.
DoctrineFormationSprintAndDrift=Applies sprint and drift movement to all eligible ships and submarines in the selected formation.
DoctrineUnitSprintAndDrift=Makes the selected ship or submarine alternate between fast sprint legs and slow drift legs while following its normal waypoints.
DoctrineFormationBafflesClearing=Allows submarines in the selected formation to periodically turn and listen to clear their sonar baffles while moving to waypoint orders.
DoctrineUnitBafflesClearing=Allows the selected submarine to periodically turn and listen to clear its sonar baffles while moving to waypoint orders.
DoctrineRemoveEngageTaskAfter=Clears an engage task that has not been accepted from the pending task list after this many seconds.
DoctrineBombersStaysWithAAM=When enabled, bomber aircraft carrying air-to-air missiles stay on station until those missiles are expended.
DoctrineASWBombersStaysWithSonobuoys=When enabled, ASW aircraft carrying sonobuoys stay on station until those sonobuoys are expended.
DoctrineFighterBombersStaysWithAAM=When enabled, fighter-bombers carrying air-to-air missiles stay on station until those missiles are expended.
DoctrineSRFightersStaysWithGuns=When enabled, short-range fighters and fighter-bombers stay on station while gun ammunition remains.
DoctrineOverride=When this is set the Inherited value will be overridden at this level.
