[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=AAW             // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=0.263                             // in kg. Used for aircraft
AmmoPoints=0.35                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=1113         // meter per second
MaxRange=2000              // in m
CircularErrorProbable=2.4   // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=1             // Armor Piercing: penetrator rakes airframes instead of bursting on the skin
Power=0.3
ArmorPen=4                // inches of RHA
ImpactSize=Tiny           // Impact size, can be small, medium, large, verylarge
Penetration=Heavy         // can be minor, moderate, heavy, always

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitWaterSplashClass=TinyWaterSplashes
