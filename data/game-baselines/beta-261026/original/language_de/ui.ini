#Conditions
TriggerConditionsTooltip=Dieses Dropdown-Menü verwenden, um die Bedingungen für den Trigger zu konfigurieren
ConditionsListTooltip=Listet alle für diesen Trigger erstellten Bedingungen auf
AddConditionTooltip=Neue Bedingung hinzufügen
RemoveConditionTooltip=Ausgewählte Bedingung entfernen
ConditionKeyTooltip=Eindeutige Bezeichnung für diese Bedingung festlegen – Es wird empfohlen, die Vorgabe unverändert zu lassen
ConditionDescriptionTooltip=Beschreibung der Bedingung festlegen – hilfreich für Fehlersuche oder Notizen, wird in der Mission nicht angezeigt
ConditionTypeTooltip=Art der Bedingung festlegen
ConditionTypeTooltipGeneric=Generische Bedingungen sind beim Missionsbeginn immer WAHR (TRUE)
ConditionTypeTooltipTime=Zeitbedingungen lösen aus, wenn die festgelegte Missionszeit erreicht ist – sicherstellen, dass „Datum und Uhrzeit festlegen“ aktiviert ist
ConditionTypeTooltipOnMissionStart=Die Bedingung wird unmittelbar beim Start der Mission erfüllt
ConditionTypeTooltipVariableCheck=Die Bedingung wird erfüllt, wenn die konfigurierte Variablenprüfung erfolgreich ist
ConditionTypeTooltipNoIncomingWeapons=Bedingung löst aus, wenn keine anfliegenden Waffen erkannt werden, die sich der festgelegten Bedingungsseite nähern – experimentell!
ConditionTypeTooltipUnitDestroyed=Bedingung löst aus, wenn die festgelegte(n) Einheit(en) zerstört wurden
ConditionTypeTooltipUnitsInTheArea=Bedingung löst aus, wenn die festgelegte(n) Einheit(en) den auf der Karte definierten Bedingungsbereich betreten
