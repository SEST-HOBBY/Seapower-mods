DepthTooltip=Tauchtiefe der Einheit beim Missionsbeginn festlegen – nur für U-Boote und biologische Einheiten
AltitudeTooltip=Flughöhe der Einheit beim Missionsbeginn festlegen – nur für Hubschrauber und Luftfahrzeuge
SkillTooltip=Ausbildungs- und Leistungsstand der Besatzung festlegen – beeinflusst in bestimmten Lagen die Gesamtleistungsfähigkeit der Einheit
OpenFlightDeckTooltip=Fahrzeugbestand an Bord bearbeiten
OpenStoresEditorTooltip=Bord- und Magazinvorräte an Waffen für diese Einheit bearbeiten
StationRoleTooltip=Rolle dieser Einheit innerhalb der Gruppe zuweisen – gilt ausschließlich für KI-gesteuerte Einheiten
IdentifySelfTooltip=Legt fest, ob diese Einheit auf Funkanfragen zur Identifizierung antwortet. Zufällig legt per Zufall fest, ob die Einheit antwortet oder nicht.
HighValueUnitTooltip=Diese Einheit als Hochwertziel (High Value Unit) kennzeichnen
UnlimitedFuelTooltip=Wenn aktiviert, startet dieses Flugzeug oder dieser Hubschrauber mit unbegrenztem Treibstoff. Verwenden Sie diese Option, wenn für die Einheiten kein Luftwaffenstützpunkt verfügbar ist, um Abstürze bei Erreichen der Bingo-Kraftstoffmenge zu verhindern.
RadarsOnTooltip=Alle verfügbaren Radargeräte dieser Einheit aktivieren
ForceEmconTooltip=Diese KI-Einheit bleibt unter Emissionskontrolle, bis ein Trigger die Einschränkung aufhebt. Sie hält auch bei normalen Alarmzuständen Funk- und Sensorstille, darf jedoch alle aktiven Sensoren einschalten, wenn sich ein Waffensystem unmittelbar nähert, welches von ihrem Einsatzverband geortet und identifiziert wurde.
TriggerForceEmconTooltip=Versetzt die ausgewählten KI-Einheiten in Emissionskontrolle oder hebt diese Einschränkung auf. Beim Aufheben wird das normale KI-Verhalten wiederhergestellt, ohne die Sensoren sofort einzuschalten.
ActiveSonarsOnTooltip=Alle verfügbaren aktiven Sonarsysteme dieser Einheit aktivieren
TowedArrayOutTooltip=Alle verfügbaren Schleppsonar-Arrays dieser Einheit ausbringen
