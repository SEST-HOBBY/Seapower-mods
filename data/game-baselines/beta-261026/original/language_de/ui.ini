Doctrine=Doktrin ein-/ausblenden
DoctrineTransitTelegraph=Legt die Fahrstufe fest, die für diesen Plattformtyp standardmäßig bei Transitfahrten verwendet wird.
DoctrineLoiterTelegraph=Legt die Fahrstufe fest, die für diesen Plattformtyp standardmäßig beim Verweilen verwendet wird.
DoctrineAllowAlignment=Wenn aktiviert, dürfen Einheiten ihren Kurs ändern, um ihre Waffen in Feuerstellung zu bringen.
DoctrineAircraftWinchesterRtb=Wenn aktiviert, kehren Spielerluftfahrzeuge zur Basis zurück, sobald sie als „Winchester“ gelten.
DoctrineInterceptorAllAamRtb=Wenn aktiviert, verbleiben Jagdflugzeuge im Einsatzgebiet, bis sämtliche Luft-Luft-Flugkörper einschließlich Kurzstreckenflugkörper verbraucht sind.
DoctrineFighterAllAamAndGunRtb=Wenn aktiviert, verbleiben Jagdflugzeuge im Einsatzgebiet, bis sämtliche Luft-Luft-Flugkörper und die Bordkanonenmunition verbraucht sind.
DoctrineFighterRtbCondition=Legt fest, ob Luftfahrzeuge bereits nach Verbrauch aller Luft-Luft-Flugkörper als „Winchester“ gelten oder erst, wenn zusätzlich die Bordkanonenmunition verbraucht ist.
DoctrineHelicopterSonobuoyDeployState=Legt die standardmäßige Suchtiefe für von Spielerhubschraubern abgeworfene Sonarbojen fest. „Intermittierend“ lässt die Bojen abwechselnd oberhalb und unterhalb der Schicht suchen.
DoctrineAASalvoSize=Legt fest, wie viele Abfangflugkörper Spielerschiffe bei automatischen Luftabwehreinsätzen auf jede anfliegende Luftbedrohung abfeuern.
DoctrineShipsOnWeaponsTightEngageHostileAircraft=Wenn aktiviert, dürfen Spielerschiffe mit dem Waffenstatus „Waffen bereit“ erkannte feindliche Luftfahrzeuge automatisch bekämpfen.
DoctrineShipsAutoUseSAMsAgainstSurfaceTargets=Wenn aktiviert, dürfen Spielerschiffe Flugabwehrflugkörper mit Seezielmodus automatisch gegen Überwasserziele einsetzen.
DoctrineShipsAutoUseAntiShipMissilesAgainstSurfaceTargets=Wenn deaktiviert, leiten Spielerschiffe mit dem Waffenstatus „Waffen frei“ keine neuen automatischen Angriffe mit Seezielflugkörpern gegen Seeziele ein. Geschütze, Torpedos, ASROC und für den Einsatz gegen Seeziele zugelassene Flugkörper der Flugabwehr können weiterhin automatisch eingesetzt werden. Manuelle Angriffsbefehle und bereits abgefeuerte Salven bleiben davon unberührt.
DoctrineBombAttackProfile=Legt fest, wie Spielerluftfahrzeuge Bombenangriffe durchführen. „Automatisch“ behält das durch Ausrüstung und Flughöhe vorgegebene Verhalten bei; „Pop-up“ lässt das Luftfahrzeug vor dem Angriff steigen, „Horizontal“ führt einen Horizontalabwurf durch und „Sturzflug“ einen direkten Sturzangriff.
DoctrineFightersDoNotEngageAntiShipMissiles=Wenn aktiviert, greifen Spielerjagdflugzeuge erkannte Seezielflugkörper nicht automatisch an.
DoctrineAutoAttackSurface=Wenn aktiviert, dürfen Spielereinheiten mit dem Waffenstatus „Waffen frei“ gültige feindliche Seeziele automatisch bekämpfen.
DoctrineCollisionAvoidance=Wenn aktiviert, führen Schiffe und U-Boote automatisch Ausweichmanöver durch, um Kollisionen mit nahegelegenen Einheiten zu vermeiden.
DoctrineDropTanks=Wenn aktiviert, werfen Spielerluftfahrzeuge beim Eintritt in ein Gefecht automatisch ihre Außentanks ab.
DoctrineFormationSprintAndDrift=Wendet das Sprint-and-Drift-Verfahren auf alle geeigneten Schiffe und U-Boote der ausgewählten Formation an.
