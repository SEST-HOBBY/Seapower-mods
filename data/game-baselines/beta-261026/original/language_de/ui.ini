DamageConditionModeTooltip=Legt den Schadenszustand fest, den die festgelegte(n) Einheit(en) erreichen müssen.
DamageThresholdPercentTooltip=Bei einer Integritätsprüfung wird die Bedingung ausgelöst, sobald die Integrität einer Einheit diesen Prozentwert erreicht oder unterschreitet.
ConditionTypeTooltipTriggerCompleted=Die Bedingung wird ausgelöst, wenn der festgelegte Trigger erfolgreich abgeschlossen wurde.
ConditionTypeTooltipTriggerFailed=Die Bedingung wird ausgelöst, wenn der festgelegte Trigger fehlgeschlagen ist.
TriggerCompletedFailedTooltip=Legt den Trigger fest, der abgeschlossen oder fehlgeschlagen sein muss. Wird für die Bedingungstypen „Trigger abgeschlossen“ und „Trigger fehlgeschlagen“ verwendet.
SetupDateAndTimeForTheConditionTooltip=Aktivieren, um ein bestimmtes Datum und eine bestimmte Uhrzeit für die Auslösung festzulegen. Wird für den Bedingungstyp „Zeit“ verwendet.
ConditionDateTooltip=Legt das Datum für die Zeitbedingung fest.
ConditionTimeTooltip=Legt die Uhrzeit für die Zeitbedingung fest. Diese wird stets als Zulu-Zeit (UTC) angegeben. Eine Änderung der Missionszeit im Reiter „Szenario“ aktualisiert dieses Feld nicht!
ConditionSecondsTooltip=Legt den Zeitpunkt für die Auslösung der Zeitbedingung in Sekunden fest. Dieser Wert wird anhand der obigen Felder automatisch eingetragen.
AddConditionPositionTooltip=Anklicken, um die Position der Bedingung auf der Karte festzulegen.
ConditionAreaRadiusTooltip=Legt die Größe des Bedingungsbereichs auf der Karte fest.
ConditionLanguageTooltip=Legt die Lokalisierung der Beschriftung des Bedingungsbereichs auf der Karte fest.
ConditionAreaLabelTextTooltip=Legt den Text fest, der im Bedingungsbereich auf der Karte angezeigt wird. Zeilenumbrüche sind zulässig.
ConditionAreaVisibleToSideTooltip=Legt fest, ob der Bedingungsbereich für die blaue und die rote Seite auf der Karte sichtbar ist.
ConditionGroupsTooltip=Hierüber können Einheiten für das Feld 'Bedingung Einheiten' ausgewählt werden.
ConditionMinimumUnitsTooltip=Legt die Mindestanzahl an Einheiten fest, die zur Auslösung der Bedingung erforderlich ist.
ConditionUnitTypeTooltip=Legt den Einheitentyp für die Auslösung der Bedingung „Keine Einheiten des angegebenen Typs verbleiben“ fest.
ConditionUnitsInGroupTooltip=Einheiten aus der Gruppe auswählen und zu den Bedingungseinheiten hinzufügen.
ConditionUnitsTooltip=Legt die Einheiten für die Bedingung fest.
ConditionUnitsMatchingConditionTooltip=Verwendet alle Einheiten, die aktuell die ausgewählte Gebietsbedingung erfüllen, anstelle der festgelegten Liste der Aktionseinheiten.
MatchingUnitConditionTooltip=Wählen Sie eine Bedingung „Einheit erreicht Gebiet“. Deren Seite, Einheitentyp, Bereich und Mindestanzahl bestimmen, für welche Einheiten die Aktionen ausgeführt werden. Erfüllt keine Einheit die Bedingung, wartet der Trigger.
AddUnitToConditionUnitsTooltip=Anklicken, um die ausgewählte Einheit zur Liste der Bedingungseinheiten hinzuzufügen.
AddGroupToConditionUnitsTooltip=Anklicken, um alle Einheiten der Gruppe zur Liste der Bedingungseinheiten hinzuzufügen.
RemoveUnitFromConditionUnitsTooltip=Anklicken, um die ausgewählte Einheit aus der Liste der Bedingungseinheiten zu entfernen.
RemoveGroupFromConditionUnitsTooltip=Anklicken, um alle Einheiten einer Gruppe aus der Liste der Bedingungseinheiten zu entfernen.

