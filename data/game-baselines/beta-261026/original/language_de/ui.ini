GenerateAutoPathTooltip=Wenn aktiviert, werden zufällige Wegpunkte um den Gruppen-Spawnpunkt generiert und nach Erreichen des letzten Wegpunkts neu erzeugt – primär vorgesehen, damit biologische Einheiten ein bestimmtes Gebiet selbstständig durchstreifen
