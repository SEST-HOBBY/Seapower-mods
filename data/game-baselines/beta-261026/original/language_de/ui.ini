ConditionTypeTooltipUnitDetected=Bedingung löst aus, wenn die festgelegte(n) Einheit(en) von der angegebenen Bedingungsseite aufgefasst werden – „aufgefasst“ bedeutet Detektion durch Radar, Sonar, optische Mittel oder ESM
ConditionTypeTooltipUnitClassified=Bedingung löst aus, wenn die festgelegte(n) Einheit(en) von der angegebenen Bedingungsseite klassifiziert werden – „klassifiziert“ bedeutet, die Einheit ist detektiert und ihre Seite ist bekannt, jedoch möglicherweise noch nicht eindeutig identifiziert
ConditionTypeTooltipUnitsAreOutOfAmmo=Die Bedingung wird ausgelöst, wenn die festgelegten Einheiten keine Munition mehr haben – experimentell und nicht vollständig unterstützt. Der genaue Munitionstyp bzw. Klassenname muss in der Missions-INI-Datei festgelegt werden.
ConditionTypeTooltipUnitHasNoGuidanceSystems=Bedingung löst aus, wenn sämtliche Feuerleitradare der Einheit zerstört sind – vorgesehen für den Einsatz bei FlaRak-Stellungen
