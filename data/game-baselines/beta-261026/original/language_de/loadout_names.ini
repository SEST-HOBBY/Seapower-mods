[LoadoutNames]
#------------------------------------------ New system ------------------------------------------
# - LongRange means operating range of aircraft, not the weapons range
# ---------- Mandatory loadouts ----------
Default=Standard                           // Usually most common loadout for this plane
Ferry=Überführung                            // Maximum fueltanks, no weapons, except guns and chaff
Empty=Leer                                // No fueltanks, no weapons, except guns and chaff

# ---------- Anti Air loadouts ----------
AirToAir=Luft-Luft                        // Standard Air to Air loadout for the type
AirToAirLongRange=Luft-Luft Langstrecke   // Air to Air with less weapons and more fuel
AirToAirIntercept=Luft-Luft Abfangen    // Air to Air loadouts with emphasis on MRAAM/SRAAM

# ---------- Anti Surface loadouts ----------
Strike=Luftschlag                           // Dumb bombs in 1 salvo
StrikeLongRange=Luftschlag Langstrecke         // Same as Strike but less weapons, more fuel
StrikePrecision=Präzisionsluftschlag           // Guided bombs or Strike missiles (like AS-7)
StrikeHeavy=Schwerer Luftschlag                  // Strike loadout for heavy bombers. (To mark it for AI usage)
StrikeDemo=Luftschlag Bunkerbrechend              // Specialized loadout for super-heavy bombs (>1300kg) meant to obliterate point targets such as bunkers, bridges, and other hard targets
StrikeLowAlt=Luftschlag geringe Höhe          // Low-level strike meant for retarded bombs, such as Snakeye or parachute bombs

CAS=Luftnahunterstützung                     // Rockets, Cluster bombs, Bombs. Usually in small salvos to increace number of attacks
CASLight=Luftnahunterstützung Leicht           // Like CAS, but focusing on endurance over payload
AntiArmor=Panzerabwehr                         // Strike missiles mostly useful only land vehicles(like AS-7)

LandAttack=Landzielbekämpfung                     // Long-range air to surface (land attack) cruise missile loadout, e.g. AGM-86C or RGM-109C land attack missiles

# ---------- Anti Ship loadouts ----------
AntiShip=Anti-Schiff                         // Most vague loadout. Can include anything from dumb bombs to medium-range missilies
AntiShipLongRange=Anti-Schiff Langstrecke    // Same as AntiShip, but with fueltanks
AntiShipPrecision=Anti-Schiff Präzisionsschlag      // Another vague loadout. Can include guided bombs and missilies
AntiShipHeavy=Anti-Schiff Schwer          // Designed to mark heavy anti-ship bombers like Tu-22 and Tu-16

# ---------- Anti Sub loadouts ----------
ASW=U-Jagd                                   // Multirole ASW: Torpedoes, Depth Charges, Sonobuoys
ASWHunter=U-Jagd - Aufklärung                // Sonobuoys only, no weapons
ASWHunterLight=U-Jagd - Aufklärung (Leicht)           // Sonobuoys only, no weapons
ASWKiller=U-Jagd - Zerstörung                      // ASW weapons only
ASWBomb=U-Jagd - Langstrecke                         // ASW depth charges
ASWLongRange=ASW Long Range				   // Torpedo + fuel tank

# ---------- Special loadouts ----------
SEAD=SEAD                                  // Anti-radiation missilies, Cluster bombs
SEADLongRange=SEAD Langstrecke              // Same as SEAD, but less weaons and more fueltanks
SEADAdvanced=SEAD Erweitert            	   // SEAD, but using accountable, limited-supply or time-restricted ammo like HARM, STARM or AS-11

AEW=Frühaufklärung                          // Just a flavor naming to indicate plane purpose. This loadout supposed to be equal to "Empty"
Recon=Aufklärung                            // Also indicates plane purpose. In some cases used for carrying recon pods.
EW=EloKa                    				// Also indicates plane purpose. In some cases used for carrying EW pods.
Transport=Transport                        // Also indicates purpose.

Tanker=Tanker                              // Tanker loadout. Allows refueling

Gun=Nur Bordkanone                               // Only Gun ammo loaded

# ---------- Cargo loadouts ----------
Containers=Container
Munitions=Munition
MilitaryVehicles=Militärische Fahrzeuge
DryCargo=Trockenfracht
Vehicles=Fahrzeuge
Fertilizer=Dünger
Lighters=Feuerzeuge
Oil=Rohöl
Ore=Erze
Passengers=Passagiere
Troops=Truppen

