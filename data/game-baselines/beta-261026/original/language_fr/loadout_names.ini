[LoadoutNames]
#------------------------------------------ New system ------------------------------------------
# - LongRange means operating range of aircraft, not the weapons range
# ---------- Chargements obligatoires ----------
Default=Défaut                              // Équipement généralement le plus courant pour cet avion
Ferry=Pleine charge                         // Réservoirs de carburant maximum, pas d'armement, sauf les canon et de la paillettes
Empty=Minimum                               // Pas de Réservoirs de carburant fueltanks, pas d'armement, sauf les canon et de la paillettes

# ---------- Chargements anti-aériens ----------
AirToAir=Air-Air                         // Chargement air-air standard pour le type
AirToAirLongRange=Air-Air Longue Portée     // Air-Air avec moins d'armes et plus de carburant
AirToAirIntercept=Interception Air-Air      // Air-Air chargements mettant l'accent sur MRAAM/SRAAM

# ---------- Chargements anti-surface ----------
Strike=Frappe                               // Des bombes en une salve
StrikeLongRange=Frappe Longue portée        // Identique à Frappe mais avec moins d'armes et plus de carburant
StrikePrecision=Frappe de précision         // Bombes guidées ou missiles (comme AS-7)
StrikeHeavy=Frappe massive                  // Équipement de frappe pour bombardiers lourds. (Pour le marquer pour une utilisation par l'IA)
StrikeDemo=Frappe de démolition               // Specialized loadout for super-heavy bombs (>1300kg) meant to obliterate point targets such as bunkers, bridges, and other hard targets
StrikeLowAlt=Frappe Basse Altitude           // Low-level strike meant for retarded bombs, such as Snakeye or parachute bombs

CAS=Appui aérien rapproché                  // Roquettes, bombes à fragmentation, bombes. Généralement en petites salves pour augmenter le nombre de frappe
CASLight=Appui aérien léger                // Like CAS, but focusing on endurance over payload
AntiArmor=Anti-char                         // Les missiles sont principalement utiles uniquement contre les véhicules terrestres (comme l'AS-7)

LandAttack=Attaque au sol               // Long-range air to surface (land attack) cruise missile loadout, e.g. AGM-86C or RGM-109C land attack missiles

# ---------- Anti Ship loadouts ----------
AntiShip=Anti-navire                        // L'équipement le plus vague. Il peut inclure n'importe quoi, des bombes aux missiles à moyenne portée
AntiShipLongRange=Anti-navire Longue portée // Identique à Anti Ship, mais avec des réservoirs de carburant
AntiShipPrecision=Anti-navire de précision  // Un autre équipement vague. Peut inclure des bombes guidées et des missiles
AntiShipHeavy=Anti-navire lourd             // Conçu pour marquer les bombardiers lourds anti-navires comme le Tu-22 et le Tu-16 et les petits avions avec la plupart des armes

# ---------- Anti Sub loadouts ----------
ASW=ASM                                     // Multirole ASW: Torpilles, grenades sous-marines, bouées acoustiques
ASWHunter=Chasseur ASM                      // bouées acoustiques uniquement, pas d'armes
ASWHunterLight=Chasseur ASM léger           // Sonobuoys only, no weapons
ASWKiller=Tueur ASM                         // Armes ASW uniquement
ASWBomb=Grenades ASM                         // ASW depth charges
ASWLongRange=ASM Longue portée				   // Torpedo + fuel tank

# ---------- Special loadouts ----------
SEAD=SEAD                                   // Missiles anti-radiations, bombes à fragmentation
SEADLongRange=SEAD Longue portée            // Identique à SEAD, mais avec moins d'armes et plus de réservoirs de carburant
SEADAdvanced=SEAD amélioré            	   // SEAD, but using accountable, limited-supply or time-restricted ammo like HARM, STARM or AS-11

AEW=Alerte avancée                          // Juste un nom d'ambiance pour indiquer le but de l'avion. Ce chargement est censé être égal à "Vide"
Recon=Reconnaissance                        // Indique également la fonction de l'avion. Dans certains cas, il est utilisé pour transporter des modules de reconnaissance.
EW=Guerre électronique                      // Indique également le but de l'avion. Dans certains cas, il est utilisé pour transporter des nacelles EW.
Transport=Transport                         // Indique également l'objectif.

Tanker=Pétrolier                              // Tanker loadout. Allows refueling

Gun=Munitions                               // Only Gun ammo loaded

# ---------- Cargo loadouts ----------
Containers=Conteneurs
Munitions=Munitions
MilitaryVehicles=Véhicules militaires
DryCargo=Conteneurs Sec
Vehicles=Véhicules
Fertilizer=Engrais
Lighters=Embarcations de fret
Oil=Pétrole
Ore=Minerais
Passengers=Passagers
Troops=Troupes

