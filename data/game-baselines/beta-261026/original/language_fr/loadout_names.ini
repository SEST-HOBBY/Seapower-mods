Sverdlov=Leurre anti-radar Sverdlov
Kynda=Leurre anti-radar Kynda
KrestaI=Leurre anti-radar Kresta I
KrestaII=Leurre anti-radar Kresta II
Kara=Leurre anti-radar Kara
Petya=Leurre anti-radar Petya
KrivakI=Leurre anti-radar Krivak I
KrivakII=Leurre anti-radar Krivak II
