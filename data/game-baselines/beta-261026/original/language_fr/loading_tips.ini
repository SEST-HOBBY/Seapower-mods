[LoadingTips]
Count=8
Header=ASTUCE
Tip001=Les missiles Harpoon et Tomahawk antinavires n'évitent pas le relief. Vérifiez que leur trajectoire est dégagée avant le tir.
Tip002=Les formations dispersées sont plus difficiles à interpréter au radar pour l'ennemi.
Tip003=Les missiles Standard peuvent être utilisés lors d'engagements antinavires à vue directe et sont plus fiables que les Harpoon dans ce rôle.
Tip004=Les hélicoptères SH-2F fournissent aux escorteurs de l'US Navy un radar aéroporté de recherche de surface. Ils peuvent détecter des contacts de surface au-delà de la portée des radars du navire, mais pas rechercher des aéronefs.
Tip005=Les destroyers de classe Sovremenny emportent le SS-N-22 Sunburn. C'est le missile antinavire le plus performant de son époque, mais sa portée de 48 nm limite son emploi.
Tip006=Les frégates de classe Udaloy emportent le système sol-air SA-N-9, particulièrement efficace contre les missiles rasant la mer tels que le Harpoon et l'Exocet.
Tip007=Le brouillage effectué par les aéronefs réduira considérablement l'efficacité des défenses aériennes ennemies.
Tip008=L'arme antisous-marine SS-N-14A (Metel) est emportée par les navires antisous-marins des classes Krivak et Kresta II. Le SS-N-14B (Rastrub) ajoute une capacité antinavire secondaire et équipe les classes Krivak II, Kara et Udaloy, avec une portée de 27 nm.
