Header=MẸO
Tip001=Tên lửa Harpoon và Tomahawk chống hạm không tránh địa hình. Hãy xác nhận đường bay thông thoáng trước khi khai hỏa.
Tip002=Đội hình phân tán khiến đối phương khó nhận diện hơn trên radar.
Tip003=Tên lửa Standard có thể dùng trong các cuộc giao chiến chống hạm trong tầm nhìn và đáng tin cậy hơn Harpoon trong vai trò này.
Tip004=Trực thăng SH-2F cung cấp radar tìm kiếm mặt nước trên không cho các tàu hộ tống của Hải quân Hoa Kỳ. Chúng có thể phát hiện mục tiêu mặt nước ngoài tầm radar trên tàu, nhưng không thể tìm kiếm máy bay.
Tip005=Tàu khu trục lớp Sovremenny mang tên lửa SS-N-22 Sunburn. Đây là tên lửa chống hạm có năng lực cao nhất trong thời kỳ này, nhưng tầm bắn 48 nm hạn chế việc sử dụng nó.
Tip006=Tàu hộ vệ lớp Udaloy mang hệ thống tên lửa phòng không SA-N-9, đặc biệt hiệu quả trước các tên lửa bay bám biển như Harpoon và Exocet.
Tip007=Gây nhiễu từ máy bay sẽ làm giảm đáng kể hiệu quả của hệ thống phòng không đối phương.
Tip008=Vũ khí chống ngầm SS-N-14A (Metel) được trang bị cho các tàu chống ngầm lớp Krivak và Kresta II. SS-N-14B (Rastrub) bổ sung năng lực chống hạm thứ cấp và được trang bị trên các lớp Krivak II, Kara và Udaloy, với tầm bắn 27 nm.
