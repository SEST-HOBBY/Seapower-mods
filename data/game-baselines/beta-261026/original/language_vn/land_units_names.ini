DefaultDescription=M163 VADS (Vulcan Air Defense System) là xe pháo phòng không tự hành (Pháo phòng không tự hành) được phát triển để thay thế M42 trong biên chế Mỹ. Dựa trên khung gầm M113, nó được dự kiến tác chiến cùng M48 Chaparral trong nhiệm vụ phòng không tầm gần. Hệ thống không có radar trinh sát, thay vào đó sử dụng ngắm bám quang học và radar bám sát tầm ngắn. Trong thực chiến, M163 thường phát huy hiệu quả hơn ở vai trò hỏa lực chi viện mặt đất - tương tự Skink Pháo tự hànhA thời Thế chiến II.
