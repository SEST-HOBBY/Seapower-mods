DefaultDescription=12 cm tornautomatpjäs m/70 (ERSTA) là pháo phòng thủ bờ biển của Thụy Điển, thiết kế để thay thế các khẩu pháo thời Thế chiến II đã lạc hậu. Nhiệm vụ: bảo vệ khu vực trọng yếu như cảng trước lực lượng đổ bộ Liên Xô, đồng thời tạo vùng cấm/khống chế khu vực (area denial). Hệ thống được nối với các công trình bảo đảm cho phép kíp chiến đấu trụ vững tới 60 ngày - yếu tố then chốt trong kịch bản chiến trường có vũ khí hạt nhân. Cuối thập niên 1980, Na Uy cũng tiếp nhận 8 khẩu loại này.
Variant1=ERSTA Battery,Pháo phòng thủ bờ biển

