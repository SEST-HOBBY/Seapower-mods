[ -------------------- Vehicles -------------------- ]
[pla_apc_type63]
Type=Xe thiết giáp chở quân
Default=Xe thiết giáp chở quân Type 63,Type 63 APC
DefaultDescription=Tương tự như xe tăng M113 của Mỹ, xe tăng Type 63 là xe bọc thép đầu tiên của Trung Quốc được chế tạo mà không có sự hỗ trợ của Liên Xô. Giống như M113, nó có khả năng thích ứng cao và đã được cả Trung Quốc và nhiều quốc gia đồng minh của Trung Quốc sử dụng, chẳng hạn như Việt Nam, Triều Tiên, Bangladesh và Iraq. Nó đã được cung cấp cho Quân đội Bắc Việt Nam trong Chiến tranh Việt Nam và cũng tham chiến trong Chiến tranh Iran-Iraq. Trong biên chế của Trung Quốc, nó đã được thay thế bằng ZSD 89 bắt đầu từ những năm 1990.
Variant1=Xe thiết giáp chở quân Type 63,Type 63 APC

[pla_lt_type_63]
Type=Xe tăng hạng nhẹ
Default=Xe tăng hạng nhẹ Type 63,Type 63 LT
DefaultDescription=Được phát triển từ xe tăng lội nước PT-76 của Liên Xô, xe tăng lội nước Type 63 là một loại xe tăng hạng nhẹ lội nước của Trung Quốc, lần đầu tiên được đưa vào phục vụ giữa những năm 1960. Không giống như PT-76, nó có nhiều thay đổi nhỏ, chẳng hạn như kíp lái bốn người, vị trí lái xe bên trái, tháp pháo đặt ở giữa và khả năng sử dụng xích để bơi cùng với hệ thống đẩy bằng tia nước. Nó đã được xuất khẩu sang một số quốc gia đồng minh của Trung Quốc và lần đầu tiên tham chiến trong giai đoạn cuối của Chiến tranh Việt Nam. Sau đó, nó được thay thế trong biên chế tiền tuyến của Trung Quốc bởi phiên bản cải tiến Type 63A.
Variant1=Xe tăng hạng nhẹ Type 63,Type 63 LT
Variant2=Xe tăng hạng nhẹ Type 63,Type 63 LT
Variant3=Xe tăng hạng nhẹ Type 63,Type 63 LT
Variant4=Xe tăng hạng nhẹ Type 63,Type 63 LT
Variant5=Xe tăng hạng nhẹ Type 63,Type 63 LT
Variant6=Xe tăng hạng nhẹ Type 63,Type 63 LT
Variant7=Xe tăng hạng nhẹ Type 63,Type 63 LT

[pla_spaag_type63]
Type=Pháo phòng không tự hành
Default=Pháo phòng không tự hành Type 63,Type 63 SPAAG
DefaultDescription=Được chế tạo bằng cách lấy khung gầm của xe tăng T-34 và gắn thêm tháp pháo với hai khẩu pháo 37mm Type 61, pháo phòng không tự hành Type 63 được Trung Quốc cung cấp cho Quân đội Nhân dân Việt Nam trong Chiến tranh Việt Nam (mặc dù có những nguồn thông tin trái ngược nhau về nguồn gốc của nó). Sau chiến tranh, nó được cả Quân đội Nhân dân Việt Nam và Quân Giải phóng Nhân dân Trung Quốc sử dụng, cuối cùng được cho nghỉ hưu vào năm 1990.
