[AmmunitionNames]
# ------------------ AAM ------------------
fr_super-530f=Super-530F,,AAM,Super-530F là tên lửa không đối không bán chủ động tầm ngắn đến trung của Pháp. Tương đương với AIM-7, đây là bản nâng cấp của tên lửa R530 trước đó.
fr_r550=R550,Magic 1,AAM,R550 Magic 1 là tên lửa không đối không dẫn đường hồng ngoại tầm ngắn của Pháp, tương đương với AIM-9 của Mỹ. Chỉ khóa được mục tiêu từ phía sau.

pla_pl-2=PL-2,PL-2,IR AAM,PL-2 là tên lửa không đối không dẫn đường hồng ngoại của Trung Quốc. Đây là bản sao của K-13 Vympel Liên Xô, với hiệu năng rất tương đồng. Chỉ khóa được mục tiêu từ phía sau.

usaf_aim-9e=AIM-9E,Sidewinder,AAM,AIM-9E Sidewinder là tên lửa không đối không dẫn đường hồng ngoại của Mỹ. Phiên bản Echo cải thiện đáng kể hiệu suất ở mọi mặt so với các phiên bản trước, với vùng bao bắt mục tiêu tốt hơn và tầm bắn tăng lên. Chỉ khóa được mục tiêu từ phía sau.
usaf_aim-9j=AIM-9J,Sidewinder,AAM,AIM-9J Sidewinder là tên lửa không đối không dẫn đường hồng ngoại của Mỹ. Phiên bản Juliet có những thay đổi lớn so với Echo, đặc biệt là hệ thống điều khiển, với linh kiện bán dẫn thay thế cho đèn điện tử chân không cũ. Xác suất tiêu diệt được cải thiện so với các bản trước, nhưng vẫn chỉ khóa được mục tiêu từ phía sau.

usn_aim-7d=AIM-7D,Sparrow,AAM,AIM-7D Sparrow là tên lửa không đối không dẫn đường radar bán chủ động của Mỹ. Phiên bản Delta được tối ưu hóa cho tốc độ tiếp cận mục tiêu cao hơn so với phiên bản Charlie trước đó.
usn_aim-7e=AIM-7E,Sparrow,AAM,AIM-7E Sparrow là tên lửa không đối không dẫn đường radar bán chủ động của Mỹ. Phiên bản Echo tăng cường tầm bắn và hiệu suất so với các biến thể trước.
usn_aim-7m=AIM-7M,Sparrow,AAM,AIM-7M Sparrow là tên lửa không đối không dẫn đường radar bán chủ động của Mỹ. Phiên bản Mike vượt trội hoàn toàn so với thế hệ trước (AIM-7E-2, AIM-7E, AIM-7D, v.v.) chủ yếu nhờ tầm bắn. Không giống như các thế hệ Sparrow trước, AIM-7M phù hợp cho cả độ cao thấp và cao, nhưng xuất sắc nhất khi chống lại mục tiêu bay cao.
usn_aim-9b=AIM-9B,Sidewinder,AAM,AIM-9B Sidewinder là tên lửa không đối không dẫn đường hồng ngoại của Mỹ. Phiên bản Bravo là biến thể hoạt động đầu tiên của dòng AIM-9. So với các phiên bản sau này, nó có góc phóng hẹp và dễ bị đánh lừa bởi các nguồn nhiệt khác như mặt trời. Tất nhiên, nó chỉ khóa được mục tiêu từ phía sau.
usn_aim-9d=AIM-9D,Sidewinder,AAM,AIM-9D Sidewinder là tên lửa không đối không dẫn đường hồng ngoại của Mỹ. Phiên bản Delta là biến thể cải tiến so với Bravo, trang bị đầu dò tốt hơn, đầu đạn mạnh hơn và tầm bắn tăng lên. Chỉ khóa được mục tiêu từ phía sau.
usn_aim-9l=AIM-9L,Sidewinder,AAM,AIM-9L Sidewinder là tên lửa không đối không dẫn đường hồng ngoại của Mỹ. Biến thể Lima là loại Sidewinder đầu tiên có khả năng tấn công từ mọi góc độ. So với tất cả các phiên bản trước, vùng bao bắt mục tiêu được cải thiện đáng kể, với khả năng tấn công mục tiêu trực diện khi đối đầu. Tuy nhiên, bắn từ phía sau vẫn cho cự ly bắt mục tiêu xa hơn.
usn_aim-54a=AIM-54A,Phoenix,AAM,AIM-54A Phoenix là tên lửa không đối không dẫn đường radar chủ động của Mỹ. Đây là tên lửa không đối không tầm xa nhất trong kho vũ khí Mỹ và chỉ dành riêng cho F-14. Tích hợp với radar AWG-9 tiên tiến, nó giúp F-14 có khả năng tấn công đồng thời 6 mục tiêu với mỗi mục tiêu một tên lửa. Để đạt được điều này, tên lửa bay theo chế độ lái tự động trong khi máy tính trên máy bay lấy mẫu dữ liệu radar theo dõi trong khi quét (TWS) vào các tập tin theo dõi, sau đó truyền cập nhật dẫn đường cho tên lửa trong giai đoạn giữa hành trình, dẫn chúng vào 'rọ' nơi radar chủ động của chính tên lửa sẽ bắt mục tiêu ở giai đoạn cuối.

wp_aa-2a=AA-2B,Atoll B,IR AAM,AA-2A Atoll (Vympel R-3S) là tên lửa không đối không dẫn đường hồng ngoại của Liên Xô. Nó là bản sao chép ngược của AIM-9B Mỹ, với một số tinh chỉnh nhỏ về cấu trúc và hiệu năng, còn lại hoạt động y hệt. Chỉ khóa được mục tiêu từ phía sau.
wp_aa-2c=AA-2C,Atoll C,SARH AAM,AA-2C Atoll (Vympel K-13/R-3R) là tên lửa không đối không dẫn đường radar bán chủ động của Liên Xô. Nó dựa trên bản sao chép ngược AIM-9B nhưng có đầu dò hoàn toàn khác, tuy nhiên vẫn chia sẻ cùng khả năng bắt bám và góc phóng kém cỏi như nguyên mẫu Mỹ.
wp_aa-2d=AA-2D,Advanced Atoll D,IR AAM,AA-2D Advanced Atoll (Vympel K-13M) là tên lửa không đối không dẫn đường hồng ngoại của Liên Xô. Được phát triển từ AA-2A Atoll (vốn sao chép từ AIM-9) nhưng trang bị động cơ và đầu dò mới, cải thiện hiệu năng đáng kể.
wp_aa-2-2=AA-2D,Advanced Atoll 2,IR AAM,AA-2-2 Advanced Atoll (Vympel K-13M1) là tên lửa không đối không dẫn đường hồng ngoại của Liên Xô. Được phát triển từ AA-2A Atoll (vốn sao chép từ AIM-9) nhưng trang bị động cơ và đầu dò mới, cải thiện hiệu năng đáng kể.

wp_aa-3e=AA-3E,Advanced Anab,SARH AAM,AA-3E Advanced Anab E (Kaliningrad R-98MR) là tên lửa không đối không của Liên Xô dẫn đường radar bán chủ động. Đây là một trong cặp thiết kế Advanced Anab dành cho Su-15 và Yak-28P. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn một tên lửa dẫn đường radar và một tên lửa hồng ngoại vào cùng mục tiêu để tăng xác suất tiêu diệt.
wp_aa-3f=AA-3F,Advanced Anab,IR AAM,AA-3F Advanced Anab F (Kaliningrad R-98MT) là tên lửa không đối không của Liên Xô dẫn đường hồng ngoại. Đây là một trong cặp thiết kế Advanced Anab dành cho Su-15 và Yak-28P. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn một tên lửa dẫn đường radar và một tên lửa hồng ngoại vào cùng mục tiêu để tăng xác suất tiêu diệt.
wp_aa-6a=AA-6A,Acrid,SARH AAM,AA-6A Acrid (Vympel R-40R) là tên lửa không đối không tầm xa của Liên Xô dẫn đường radar bán chủ động. Nó được phát triển riêng cho tiêm kích đánh chặn MiG-25P để đối phó với XB-70 Valkyrie. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn kết hợp một tên lửa radar và một tên lửa hồng ngoại để tăng xác suất tiêu diệt.
wp_aa-6b=AA-6B,Acrid,IR AAM,AA-6B Acrid (Vympel R-40T) là tên lửa không đối không tầm xa của Liên Xô dẫn đường hồng ngoại. Nó được phát triển riêng cho tiêm kích đánh chặn MiG-25P để đối phó với XB-70 Valkyrie. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn kết hợp một tên lửa radar và một tên lửa hồng ngoại để tăng xác suất tiêu diệt.
wp_aa-6c=AA-6C,Acrid,SARH AAM,AA-6C Acrid cải tiến (Vympel R-40RD) là tên lửa không đối không tầm xa của Liên Xô dẫn đường radar bán chủ động. Nó được phát triển riêng cho tiêm kích đánh chặn mới MiG-25PD. Tầm bắn tối đa tăng lên tới 60 km. Học thuyết sử dụng vẫn là bắn cặp radar/hồng ngoại để tăng xác suất tiêu diệt.
wp_aa-6d=AA-6D,Acrid,IR AAM,AA-6D Acrid cải tiến (Vympel R-40TD) là tên lửa không đối không tầm xa của Liên Xô dẫn đường hồng ngoại. Nó được phát triển riêng cho tiêm kích đánh chặn mới MiG-25PD. Tầm bắn tối đa tăng lên tới 60 km. Học thuyết sử dụng vẫn là bắn cặp radar/hồng ngoại để tăng xác suất tiêu diệt.
wp_aa-7c=AA-7C,Apex,SARH AAM,AA-7C Apex (Vympel R-24R) là tên lửa không đối không tầm trung của Liên Xô dẫn đường radar bán chủ động. Các biến thể Charlie và Delta nâng cấp được phát triển để trang bị cho MiG-23 vào giữa thập niên 1970. Tương đương gần với AIM-7E của Mỹ, AA-7C có đầu dò monopulse giúp tăng khả năng kháng chế áp điện tử (ECM) và có khả năng khóa mục tiêu sau khi phóng.
wp_aa-7d=AA-7D,Apex,IR AAM,AA-7D Apex (Vympel R-24T) là tên lửa không đối không tầm trung của Liên Xô dẫn đường hồng ngoại. Các biến thể Charlie và Delta nâng cấp được phát triển để trang bị cho MiG-23 vào giữa thập niên 1970. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn kết hợp một tên lửa radar và một tên lửa hồng ngoại vào cùng mục tiêu để tăng xác suất tiêu diệt.
wp_aa-8=AA-8,Aphid,IR AAM,AA-8 Aphid (Vympel R-60M) là tên lửa không đối không tầm ngắn của Liên Xô dẫn đường hồng ngoại. Vũ khí này được xuất khẩu cực kỳ rộng rãi và thường gặp ở các quốc gia thân Liên Xô.
wp_aa-2-2=AA-2D,Advanced Atoll 2,IR AAM,AA-2-2 Advanced Atoll (Vympel K-13M1) là tên lửa không đối không của Liên Xô dẫn đường hồng ngoại. Nó phát triển từ AA-2A Atoll (vốn là bản sao “reverse-engineer” từ AIM-9) nhưng được trang bị động cơ và đầu dò mới, giúp cải thiện hiệu năng đáng kể.

wp_aa-3e=AA-3E,Advanced Anab,SARH AAM,AA-3E Advanced Anab E (Kaliningrad R-98MR) là tên lửa không đối không của Liên Xô dẫn đường radar bán chủ động. Đây là một trong cặp thiết kế Advanced Anab dành cho Su-15 và Yak-28P. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn một tên lửa dẫn đường radar và một tên lửa hồng ngoại vào cùng mục tiêu để tăng xác suất tiêu diệt.
wp_aa-3f=AA-3F,Advanced Anab,IR AAM,AA-3F Advanced Anab F (Kaliningrad R-98MT) là tên lửa không đối không do Liên Xô chế tạo, dẫn đường hồng ngoại. Đây là một trong cặp thiết kế Advanced Anab dành cho Su-15 và Yak-28P. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn một tên lửa dẫn đường radar và một tên lửa hồng ngoại vào cùng mục tiêu để tăng xác suất tiêu diệt.
wp_aa-6a=AA-6A,Acrid,SARH AAM,AA-6A Acrid (Vympel R-40R) là tên lửa không đối không tầm xa của Liên Xô dẫn đường radar bán chủ động. Nó được phát triển riêng cho tiêm kích đánh chặn MiG-25P để đối phó với XB-70 Valkyrie. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn một tên lửa dẫn đường radar và một tên lửa hồng ngoại vào cùng mục tiêu để tăng xác suất tiêu diệt.
wp_aa-6b=AA-6B,Acrid,IR AAM,AA-6B Acrid (Vympel R-40T) là tên lửa không đối không tầm xa của Liên Xô dẫn đường hồng ngoại. Nó được phát triển riêng cho tiêm kích đánh chặn MiG-25P để đối phó với XB-70 Valkyrie. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn một tên lửa dẫn đường radar và một tên lửa hồng ngoại vào cùng mục tiêu để tăng xác suất tiêu diệt.
wp_aa-6c=AA-6C,Acrid,SARH AAM,AA-6C Acrid cải tiến (Vympel R-40RD) là tên lửa không đối không tầm xa của Liên Xô dẫn đường radar bán chủ động. Nó được phát triển riêng cho tiêm kích đánh chặn mới MiG-25PD. Tầm bắn tối đa của tên lửa được tăng lên tới 60 km. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn một tên lửa dẫn đường radar và một tên lửa hồng ngoại vào cùng mục tiêu để tăng xác suất tiêu diệt.
wp_aa-6d=AA-6D,Acrid,IR AAM,AA-6D Acrid cải tiến (Vympel R-40TD) là tên lửa không đối không tầm xa của Liên Xô dẫn đường hồng ngoại. Nó được phát triển riêng cho tiêm kích đánh chặn mới MiG-25PD. Tầm bắn tối đa của tên lửa được tăng lên tới 60 km. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn một tên lửa dẫn đường radar và một tên lửa hồng ngoại vào cùng mục tiêu để tăng xác suất tiêu diệt.
wp_aa-7c=AA-7C,Apex,SARH AAM,AA-7C Apex (Vympel R-24R) là tên lửa không đối không tầm trung của Liên Xô dẫn đường radar bán chủ động. Các biến thể Charlie và Delta nâng cấp được phát triển để trang bị cho MiG-23 vào giữa thập niên 1970. Tương đương gần với AIM-7E của Mỹ, AA-7C có đầu dò monopulse giúp tăng khả năng kháng chế áp điện tử (ECM) và có khả năng khóa mục tiêu sau khi phóng.
wp_aa-7d=AA-7D,Apex,IR AAM,AA-7D Apex (Vympel R-24T) là tên lửa không đối không tầm trung của Liên Xô dẫn đường hồng ngoại. Các biến thể Charlie và Delta nâng cấp được phát triển để trang bị cho MiG-23 vào giữa thập niên 1970. Giống như AIM-4 Falcon trên các tiêm kích đánh chặn F-102 và F-106 của Mỹ, học thuyết sử dụng là bắn một tên lửa dẫn đường radar và một tên lửa hồng ngoại vào cùng mục tiêu để tăng xác suất tiêu diệt.
wp_aa-8=AA-8,Aphid,IR AAM,AA-8 Aphid (Vympel R-60M) là tên lửa không đối không tầm ngắn của Liên Xô dẫn đường hồng ngoại. Vũ khí này được xuất khẩu cực kỳ rộng rãi và rất dễ gặp ở các quốc gia thân Liên Xô.
# It is more maneuverable compared to the AIM-9L, but still rear aspect only, requiring the launching aircraft to get onto the targets 'six'.

# ------------------ SAM ------------------
jsdf_sam1=Tan-SAM 1,,SAM,Tên lửa đất đối không tầm ngắn dẫn đường hồng ngoại mọi góc độ của Nhật Bản. Một phần của hệ thống SAM Type 82.

plan_hq-61=HQ-61,,SAM,HQ-61 là tên lửa đất đối không của Trung Quốc, có hình dáng và tính năng gần tương đương với RIM-7F Sea Sparrow.

raf_rapier=FSB Rapier,Rapier,SAM,Hệ thống tên lửa phòng thủ điểm tầm ngắn, độ cao thấp dẫn đường quang học của Anh. Sử dụng hệ thống dẫn đường lệnh tầm nhìn (CLOS), hiệu quả của nó thay đổi tùy theo tốc độ của máy bay và tên lửa đối phương.

rn_seacat=GWS-21,Seacat,SAM,GWS-21 Seacat là ví dụ sớm nhất về hệ thống tên lửa phòng thủ điểm trên tàu. Nó gia nhập Hải quân Hoàng gia năm 1962 và được xuất khẩu rộng rãi để thay thế pháo Bofors 40mm. Sử dụng hệ thống dẫn đường lệnh tầm nhìn (CLOS), hiệu quả của nó chống lại phản lực nhanh và tên lửa là rất đáng ngờ.
usa_mim-14=MIM-14,Nike Hercules,SAM,MIM-14 Nike Hercules là hệ thống tên lửa đất đối không được Mỹ và lực lượng NATO sử dụng cho phòng không tầm trung và cao.
usa_mim-23=MIM-23,Hawk,SAM,Được phát triển tại Mỹ những năm 1960, HAWK là hệ thống Tên lửa Đất đối Không tầm trung tương đối cơ động. Bản thân tên lửa sử dụng dẫn đường bán chủ động từ Radar Chiếu xạ Công suất Cao (HPIR) thuộc tổ hợp HAWK, với mục tiêu được phát hiện bởi Radar Bắt mục tiêu Xung (PAR) cho độ cao lớn và Radar Bắt mục tiêu Sóng liên tục (CWAR) cho mục tiêu bay thấp trong nhiễu mặt đất.
rn_seawolf=GWS-25,Sea Wolf,SAM,The GWS-25 Sea Wolf is the successor to the Sea Cat, and features vastly improved performance against air targets and sea-skimming missiles. Despite its high accuracy, Sea Wolf is still a very short ranged point-defense SAM, and can only reliably protect the launching ship, and not nearby allied units.

usa_mim-14=MIM-14,Nike Hercules,SAM,MIM-14 Nike Hercules is a surface-to-air missile system used by the United States and NATO forces for medium and high-altitude air defense.
usa_mim-23=MIM-23,Hawk,SAM,Developed in the US in the 1960s the HAWK is a relatively mobile medium-range Surface to Air Missile System. The missile itself utilises semi-active homing from the HPIR (High Power Illuminator Radar) which is a part of the wider HAWK battery, with targets detected by PAR (Pulse Acquisition Radar) for high altitude targets and CWAR (Continuous Wave Acquisition Radar) for low altitude targets in ground clutter. 

usn_rim-2f=RIM-2F,Terrier,SAM/ASuW,RIM-2F Terrier là một trong những hệ thống tên lửa hạm đối không sớm nhất của Hải quân Mỹ. Nó được tạo ra để cung cấp lớp phòng thủ tầm trung cho nhóm tác chiến tàu sân bay, nằm giữa tiêm kích và pháo. Terrier ban đầu là vũ khí bám chùm (beam-riding). RIM-2F là phiên bản cải tiến dẫn đường radar bán chủ động với khả năng cơ động và xác suất tiêu diệt cao hơn. Giống như các tên lửa phòng không khác, nó có thể dùng trong vai trò chống hạm phụ trợ. Tốc độ bắn bị hạn chế do cần lắp cánh tăng cường thủ công, một bệ phóng có thể bắn 2 tên lửa mỗi 30 giây.
usn_rim-24b=RIM-24B,Tartar,SAM/ASuW,cần mô tả
usn_rim-8=RIM-8,Talos,SAM/ASuW,RIM-8 Talos là hệ thống tên lửa hạm đối không tầm xa khổng lồ được dùng chủ yếu bởi các tuần dương hạm Mỹ. Nó bay giai đoạn giữa bằng cách bám chùm và giai đoạn cuối dùng radar bán chủ động. Tên lửa cần lắp ráp trước khi phóng nên tốc độ bắn thấp hơn các hệ thống hiện đại, biểu thị qua kích thước hầm đạn rất lớn của hệ thống.
usn_rim-7=RIM-7E,Sea Sparrow,SAM/ASuW,RIM-7 Sea Sparrow là hệ thống phòng không tầm ngắn được trang bị cho nhiều tàu chiến của Mỹ và NATO. Hệ thống chủ yếu nhằm cung cấp khả năng tự vệ.
usn_rim-7h=RIM-7H,Sea Sparrow,SAM/ASuW,The RIM-7H Sea Sparrow is a short-range surface-to-air missile, and is the primary NATO shipboard point-defense missile.\nThe 'Hotel' model of Sea Sparrow is overall extremely similar to the 'Echo' model, except that RIM-7H has folding fins to fit in newer launchers, and slightly improved reliability.
usn_rim-7m=RIM-7M,Sea Sparrow,SAM/ASuW,RIM-7 Sea Sparrow là hệ thống phòng không tầm ngắn được trang bị cho nhiều tàu chiến của Mỹ và NATO. Hệ thống chủ yếu nhằm cung cấp khả năng tự vệ.
usn_rim-66a=SM-1MR,Standard,SAM/ASuW,RIM-66A Standard Missile 1 MR được phát triển như một vũ khí mới để ghép cặp với các nền tảng trước đây dùng RIM-24C Tartar. Tên lửa Standard dùng chung thân với Tartar để dễ tích hợp vật lý. Biến thể A là loại sớm nhất và đi vào phục vụ năm 1967.
usn_rim-66b=SM-1MR,Standard,SAM/ASuW,RIM-66B Standard Missile 1 MR được phát triển như một vũ khí mới để ghép cặp với các nền tảng trước đây dùng RIM-24C Tartar. Tên lửa Standard dùng chung thân với Tartar để dễ tích hợp vật lý. Biến thể B là bản nâng cấp đáng kể so với A với các linh kiện mới. Hầu hết mẫu A đều được nâng cấp lên B.
usn_rim-66c=SM-2MR,Standard,SAM/ASuW,RIM-66C Standard Missile 2 MR là phần then chốt của Hệ thống Quản lý Chiến đấu AEGIS mới trên các tàu mặt nước mới nhất của Mỹ và gói Nâng cấp Đe dọa Mới trên các tàu cũ. Nó cung cấp vũ khí mạnh hơn Standard Missile 1 cũ với việc giảm sự phụ thuộc vào radar chiếu xạ, cho phép nhiều tên lửa bay cùng lúc hơn.
usn_rim-67a=SM-1ER,Standard,SAM/ASuW,RIM-67A Standard Missile 1 ER được phát triển để thay thế RIM-8 Talos. Tên lửa giống hệt RIM-66A nhưng được lắp thêm tầng đẩy phụ để tăng tầm bắn.
usn_rim-67b=SM-2ER,Standard,SAM/ASuW,RIM-67B Standard Missile 2 ER là phần then chốt của gói Nâng cấp Đe dọa Mới (NTU) trên các tàu trước đây mang RIM-2 Terrier. Tên lửa thực tế giống hệt RIM-66C nhưng lắp thêm tầng đẩy phụ để tăng tầm bắn.

wp_sa-n-1=SA-N-1,Goa,SAM/ASuW,SA-N-1 Goa (M-1 Volna) là hệ thống tên lửa hạm đối không sớm nhất của Liên Xô. Nhằm cung cấp phòng không diện rộng và một mức độ bảo vệ trước tên lửa chống hạm bay đến. Ban đầu chỉ hiệu quả với mục tiêu bay cao, các biến thể sau có thêm khả năng chống mặt nước và khả năng diệt mục tiêu bay thấp tốt hơn, cũng như tăng tầm bắn.
wp_sa-n-1c=SA-N-1C,Goa,SAM/ASuW,SA-N-1C Goa (M-1 Volna-P) là bản sửa đổi của hệ thống tên lửa hạm đối không sớm nhất Liên Xô. Nó có khả năng kháng nhiễu và mồi bẫy tốt hơn, đồng thời diệt được mục tiêu bay thấp.
wp_sa-n-3=SA-N-3,Goblet,SAM/ASuW,SA-N-3 Goblet (M-11 Shtorm) là hệ thống tên lửa hạm đối không của Liên Xô. Hệ thống được lắp đặt trên nhiều lớp tuần dương hạm tên lửa và tàu sân bay trực thăng/STOVL của Liên Xô. Nó có khả năng phụ là chống hạm, và các phiên bản sau cải thiện hiệu năng chống mục tiêu bay thấp.
wp_sa-n-4=SA-N-4,Gecko,SAM/ASuW,SA-N-4 Gekko (9K33M Osa) là phiên bản hải quân của SA-8 Gecko (lưu ý cách viết khác nhau) với hai tên lửa trên bệ phóng xoay có thể thu gọn. Nó được lắp trên số lượng lớn tàu Liên Xô để đảm nhiệm vai trò phòng không tầm ngắn.
wp_sa-n-5=SA-N-5,Grail,SAM,SA-N-5 Grail (9K32 Strela-2) là tên lửa phòng không vác vai, còn gọi là SA-7 khi dùng trên bệ phóng mặt đất. Trên tàu, nó được dùng như hệ thống phòng thủ điểm.
wp_sa-n-6=SA-N-6,Grumble,SAM/ASuW,SA-N-6 Grumble (S-300F) là phiên bản hải quân của hệ thống tên lửa đất đối không trên bộ SA-10 (S-300P). Hệ thống tầm xa mạnh mẽ này được trang bị trên các lớp tuần dương hạm tên lửa Liên Xô, và có hiệu năng tương đương với SM-2.
wp_sa-n-7=SA-N-7,Gadfly,SAM/ASuW,SA-N-7 Gadfly (3S90 Uragan) là phiên bản hải quân của hệ thống tên lửa đất đối không trên bộ SA-11 Gadfly (9K37 Buk). SA-N-7 là hệ thống vũ khí tinh vi và mạnh mẽ, bắt đầu phục vụ trên các khu trục hạm lớp Sovremenny.
wp_sa-n-9=SA-N-9,Gauntlet,SAM/ASuW,SA-N-9 Gauntlet (3K95 Kinzhal) là phiên bản hải quân của hệ thống tên lửa SA-15 Gauntlet (9K330 Tor). Nó dùng chung đạn tên lửa với SA-15 và được trang bị trên số lượng lớn các tàu chiến mặt nước chủ lực của Liên Xô.

wp_sa-2=SA-2,Guideline,SAM,SA-2 Guideline (S-75 Dvina) là hệ thống tên lửa đất đối không tầm xa của Liên Xô. Hệ thống nhằm đối phó máy bay ném bom trên diện rộng và đã được xuất khẩu rộng rãi, sử dụng trong nhiều cuộc xung đột nhưng nổi tiếng nhất là trong chiến tranh Việt Nam.
wp_sa-3=SA-3,Goa,SAM,SA-3 Goa (S-125 Neva/Pechora) là hệ thống tên lửa đất đối không tầm trung của Liên Xô. Hệ thống nhằm đối phó với các mục tiêu cơ động hơn và bay thấp hơn.
wp_sa-4=SA-4,Ganef,SAM,SA-4 Ganef (2K11 Krug) là hệ thống tên lửa đất đối không tầm trung cơ động của Liên Xô. Hệ thống nhằm đối phó với máy bay ném bom trên diện rộng.
wp_sa-5=SA-5,Gammon,SAM,SA-5 Gammon (S-200) là hệ thống tên lửa đất đối không tầm xa của Liên Xô. Hệ thống nhằm đối phó máy bay ném bom bay cao trên diện rộng. Tên lửa tích hợp khả năng dẫn đường bám nguồn nhiễu.
wp_sa-6=SA-6,Gainful,SAM,SA-6 Gainful (2K12 Kub) là hệ thống tên lửa đất đối không cơ động của Liên Xô. Hệ thống nhằm đối phó các mối đe dọa tầm ngắn trong phạm vi khoảng 15 dặm.
wp_sa-8=SA-8,Gecko,SAM,SA-8 Gecko (9K33M3 Osa) là hệ thống tên lửa đất đối không cơ động của Liên Xô. Hệ thống nhằm cung cấp phòng không tầm ngắn cho các sư đoàn tăng và cơ giới.
wp_sa-11=SA-11,Gadfly,SAM,SA-11 Gadfly (9K37 Buk) là hệ thống tên lửa đất đối không cơ động của Liên Xô. Hệ thống nhằm đối phó các mối đe dọa tầm ngắn trong phạm vi khoảng 18 dặm.
wp_sa-13=SA-13,Gopher,SAM,SA-13 Gopher (9K35 Strela-10) là hệ thống tên lửa đất đối không tầm ngắn tính cơ động cao của Liên Xô. Hệ thống nhằm đối phó các mối đe dọa bay thấp bất ngờ xuất hiện như trực thăng.
wp_sa-8=SA-8,Gecko,SAM,SA-8 Gecko (9K33M3 Osa) là hệ thống tên lửa đất đối không cơ động của Liên Xô. Hệ thống này được thiết kế để cung cấp phòng không tầm ngắn cho các sư đoàn xe tăng và bộ binh cơ giới.
wp_sa-11=SA-11,Gadfly,SAM,SA-11 Gadfly (9K37 Buk) là hệ thống tên lửa đất đối không cơ động của Liên Xô. Hệ thống này được thiết kế để đối phó các mối đe dọa tầm ngắn ở cự ly khoảng 18 dặm.
wp_sa-13=SA-13,Gopher,SAM,SA-13 Gopher (9K35 Strela-10) là hệ thống tên lửa đất đối không tầm ngắn có tính cơ động rất cao của Liên Xô. Hệ thống này được thiết kế để đối phó các mối đe dọa bay thấp xuất hiện bất ngờ như trực thăng.

# ---------- Anti-radar Missiles ---------
usn_agm-45=AGM-45,Shrike,ARM,AGM-45 Shrike là tên lửa chống bức xạ (chống radar) của Mỹ phát triển từ thân tên lửa AIM-7 Sparrow với đầu dò mới.
usn_agm-78=AGM-78D,Standard ARM,ARM,Tên lửa AGM-78 Standard ARM (STARM) là tên lửa chống bức xạ tầm xa của Mỹ, dùng để tấn công các trận địa SAM hạng nặng từ cự ly ngoài vùng nguy hiểm. STARM phát triển từ tên lửa phòng không SM-1MR, có tầng duy trì cháy lâu và quỹ đạo bay “loft” để đạt tầm bắn lớn, kèm đầu đạn mạnh nhằm bảo đảm phá hủy hệ thống radar mà nó đánh trúng. Tuy nhiên, đây là vũ khí đắt đỏ và hiếm, nên tại một thời điểm thường chỉ dùng được rất ít (thậm chí có thể không có).
usn_agm-88a=AGM-88A,HARM,ARM,AGM-88A HARM (High-speed Anti-Radiation Missile) là tên lửa chống bức xạ tầm xa của Mỹ, có hiệu năng xuất sắc trên mọi mặt. Tính đến năm 1985, HARM là tên lửa chống bức xạ hiện đại nhất trong kho vũ khí NATO, vượt trội các đàn anh ở gần như mọi tiêu chí, đặc biệt là độ tin cậy và tốc độ tối đa. Vì còn rất mới khi vào biên chế, số lượng có thể sử dụng tại một thời điểm thường bị hạn chế (hoặc thậm chí không có).
usn_agm-122a=AGM-122A,Sidearm,ARM,AGM-122A là tên lửa chống bức xạ chiến thuật tầm ngắn, chủ yếu được thiết kế để phóng từ trực thăng và máy bay cánh cố định. Được cải biến từ AIM-9C “yểu mệnh”, Sidearm là một ARM tầm ngắn hiệu quả để xử lý các mối đe dọa SHORAD xuất hiện bất ngờ, nhưng khá kém phù hợp khi phải đối đầu với lưới phòng không mạnh.

usn_rim-8h=RIM-8H,Talos ARM,ARM,RIM-8H Talos là phiên bản chống radar của tên lửa phòng không RIM-8 Talos, tận dụng thân tên lửa cỡ lớn để đạt tầm bắn rất xa và tốc độ cao đối với một ARM phóng từ tàu. Dù có nguồn gốc từ SAM, RIM-8H không có năng lực phòng không và chỉ có thể tấn công mục tiêu mặt đất đang chủ động phát xạ radar.

wp_as-11=AS-11,Kilter,ARM,AS-11 Kilter (Kh-58) là tên lửa chống bức xạ của Liên Xô phát triển để trang bị cho máy bay cường kích Su-24M.
wp_as-12=AS-12,Kegler,ARM,AS-12 Kegler (Kh-25MP) là tên lửa chống radar siêu âm phóng từ máy bay, tầm trung của Liên Xô. Đây là loại ARM phổ biến nhất trong biên chế Liên Xô, và gần tương đương với AGM-45 Shrike của Mỹ.

wp_as-2b=AS-2B,Kipper,ASM,K-10SP là biến thể của tên lửa K-10S thay đầu đạn bằng hệ thống gây nhiễu Azaliya.

# ---------- Anti-ship Missiles ----------
is_gabriel_2=Gabriel 2,,ASM,Gabriel là tên lửa chống hạm của Israel, được cho là một trong những tên lửa bay bám biển sớm nhất. Phiên bản Gabriel 2 là bản cải tiến nhưng rất giống Gabriel 1.

it_seakiller_2=Sea Killer 2,,ASM,Sea Killer 2 là tên lửa chống hạm tầm ngắn do Ý phát triển. Sea Killer Mark 2 được Iran mua để trang bị cho các khinh hạm lớp Alvand; mỗi tàu lắp một bệ phóng 5 quả.
it_otomat_mk1=Otomat MK1,,ASM,Otomat MK1 là tên lửa chống hạm tầm trung được phát triển thông qua hợp tác giữa Ý và Pháp.

jasdf_asm-1=ASM-1,,ASM,ASM-1 là tên lửa chống hạm tấn công ngoài tầm của Nhật Bản. ASM-1 là biến thể phóng từ máy bay.

fr_as12=AS.12,,ASM,AS.12 là tên lửa chống hạm tầm ngắn phóng từ trực thăng, xuất xứ Pháp, dẫn đường bằng lệnh điều khiển (command-guided). Đây là phiên bản nâng cấp của tên lửa chống tăng SS.11, với động cơ dài hơn và đầu đạn lớn hơn đáng kể, đủ tạo ra mối đe dọa nghiêm trọng cho xuồng/ca nô cũng như các tàu cỡ nhỏ.
fr_am-39=AM39,Exocet,ASM,AM39 Exocet là tên lửa chống hạm tấn công ngoài tầm phòng không của Pháp. Đây là lựa chọn thay thế phổ biến cho Harpoon trong khối NATO và nhiều quốc gia khác. AM39 là biến thể phóng từ máy bay.
fr_mm-38=MM38,Exocet,ASM,MM38 Exocet là tên lửa chống hạm tấn công ngoài tầm phòng không của Pháp. Đây là lựa chọn thay thế phổ biến cho Harpoon trong khối NATO và nhiều quốc gia khác. MM38 là biến thể phóng từ tàu mặt nước.

knm_penguin_mk2=AGM-119,Penguin Mk2,ASM,AGM-119 Penguin là tên lửa chống hạm nhỏ phóng từ máy bay và tàu mặt nước, được phát triển hợp tác giữa Mỹ và Na Uy.

plan_sy-1=SY-1,Scrubbrush,ASM,SY-1 là phiên bản tên lửa Styx của Liên Xô được Trung Quốc sản xuất theo giấy phép.
plan_sy-1a=SY-1A,,ASM,SY-1A là phiên bản phát triển của Trung Quốc từ tên lửa Styx của Liên Xô.
plan_hy-1=HY-1,Safflower,ASM,HY-1 là phiên bản phát triển của Trung Quốc từ tên lửa Styx của Liên Xô.
plan_hy-1j=HY-1J,Safflower,ASM,HY-1J là phiên bản phát triển của Trung Quốc từ tên lửa Styx của Liên Xô.
plan_hy-1a=HY-1A,Safflower,ASM,HY-1A là phiên bản phát triển của Trung Quốc từ tên lửa Styx của Liên Xô. HY-1A là bản cải tiến của HY-1J với đầu dò tốt hơn và biên dạng bay thấp hơn, khó bị đánh chặn hơn.
plan_hy-2=HY-2,Seersucker,ASM,HY-2 là bước phát triển tiếp theo của Trung Quốc từ tên lửa Styx, với tầm bắn xa hơn, nhìn chung tương đương với P-20.
pla_hy-3=HY-3,Sawhorse,ASM,HY-3 là tên lửa chống hạm siêu âm động cơ ramjet bố trí trên bờ, tốc độ lên tới Mach 2.5 và tầm bắn 130-180 km. Việc phát triển hoàn tất đầu những năm 1990 nhưng tên lửa không được đưa vào biên chế.
pla_yj-1=YJ-1,Saples,ASM,The YJ-1 is an air launched short-range supersonic anti ship missile, with a speed exceeding Mach 2, and a sea-skimming terminal phase. While this missile was not accepted into service, a limited number of preproduction missiles were available in the late 1980s, and it was intended to be used primarily on the SH-5 flying boat.
pla_yj-6=YJ-6,Kraken,ASM,The YJ-6 is a Chinese air-launched anti-ship missile developed from the land/ship-based SY-1/HY-1, and features a longer firing range due to its air launch profile, although it uses an early seeker, and is susceptible to countermeasures like other early Styx or Silkworm models.
plan_yj-8=YJ-8,Sardine,ASM,YJ-8 là tên lửa chống hạm của Trung Quốc có hình dáng và tính năng gần tương đương tên lửa Exocet của Pháp. Sau khi phóng, tên lửa leo lên độ cao 20-30 mét rồi hạ xuống tấn công ở độ cao 5-7 mét theo biên dạng bay bám biển.

usn_agm-12b=AGM-12B,Bullpup,ASM,AGM-12 Bullpup là vũ khí tấn công từ xa siêu âm phóng từ máy bay của Mỹ. Nó dựa vào người điều khiển dẫn đường thủ công cho tên lửa, tương tự như AS-7 của Liên Xô, và mang nhiều nhược điểm tương tự, lớn nhất là máy bay phải bay thẳng về phía mục tiêu liên tục để dẫn bắn.
usn_agm-123=AGM-123,Skipper,ASM,Skipper là tên lửa chống hạm dẫn đường tầm ngắn đến trung của Mỹ, được tạo ra bằng cách kết hợp bom dẫn đường laser Paveway II với động cơ rocket nhiên liệu rắn. Điều này nhằm cung cấp cho phi công một lựa chọn thay thế cho Harpoon, loại vốn khó sử dụng trong các vùng biển đông đúc như Vịnh Ba Tư, nơi rủi ro bắn nhầm dân thường quá cao.
usn_agm-84a=AGM-84A,Harpoon,ASM,Harpoon là vũ khí chống hạm tấn công từ xa được dùng rộng rãi trong NATO. Vũ khí này có đầu dò radar chủ động được kích hoạt sau khi bay theo lộ trình lập trình sẵn. Biến thể AGM-84 là loại phóng từ máy bay.
usn_agm-84c=AGM-84C,Harpoon,ASM,Harpoon là vũ khí chống hạm tấn công từ xa được dùng rộng rãi trong NATO. Vũ khí này có đầu dò radar chủ động được kích hoạt sau khi bay theo lộ trình lập trình sẵn. Biến thể AGM-84C là loại phóng từ tàu mặt nước và không thực hiện cơ động bay vọt lên giai đoạn cuối.
usn_agm-84d=AGM-84D,Harpoon,ASM,Harpoon là vũ khí chống hạm tấn công từ xa được dùng rộng rãi trong NATO. Vũ khí này có đầu dò radar chủ động được kích hoạt sau khi bay theo lộ trình lập trình sẵn. Biến thể AGM-84 là loại phóng từ máy bay. AGM-84D là bản sửa đổi mới hơn, xuất hiện năm 1985. Nó cải thiện khả năng chống tác chiến điện tử và tầm bắn xa hơn nhờ nhiên liệu tốt hơn.

usn_rgm-84a=RGM-84A,Harpoon,ASM,Harpoon là vũ khí chống hạm tấn công từ xa của Mỹ, được dùng rộng rãi trong NATO. Vũ khí này có đầu dò radar chủ động, chỉ bật sau khi tên lửa bay theo lộ trình lập trình sẵn. Biến thể RGM-84A là loại phóng từ tàu mặt nước, có cơ động “pop-up” ở giai đoạn cuối để né các hệ thống phòng thủ tầm gần.
usn_rgm-84c=RGM-84C,Harpoon,ASM,Harpoon là vũ khí chống hạm tấn công từ xa được dùng rộng rãi trong NATO. Vũ khí này có đầu dò radar chủ động được kích hoạt sau khi bay theo lộ trình lập trình sẵn. Biến thể RGM-84C là loại phóng từ tàu mặt nước và không thực hiện cơ động bay vọt lên giai đoạn cuối.
usn_rgm-84d=RGM-84D,Harpoon,ASM,Harpoon là vũ khí chống hạm tấn công từ xa của Mỹ, được dùng rộng rãi trong NATO. Vũ khí này có đầu dò radar chủ động, chỉ bật sau khi tên lửa bay theo lộ trình lập trình sẵn. Biến thể RGM-84D là loại phóng từ tàu mặt nước. AGM-84D là bản cải tiến mới hơn, xuất hiện vào năm 1985, có khả năng ECCM tốt hơn và tầm bắn xa hơn nhờ nhiên liệu được cải thiện.
usn_rgm-109b=RGM-109B,Tomahawk,ASM,RGM-109B Tomahawk Anti-Ship Missile (TASM) là vũ khí chống hạm tấn công từ xa của Mỹ. Vũ khí này có đầu dò radar chủ động được kích hoạt sau khi bay theo lộ trình lập trình sẵn, và có thể bay theo mẫu tìm kiếm kèm các cơ động đánh lừa.

usn_ugm-84a=UGM-84A,Harpoon,ASM,Harpoon là vũ khí chống hạm tấn công từ xa được dùng rộng rãi trong NATO. Vũ khí này có đầu dò radar chủ động được kích hoạt sau khi bay theo lộ trình lập trình sẵn. Biến thể UGM-84A là loại phóng từ tàu ngầm, sử dụng ống phóng dùng một lần, và thực hiện cơ động bay vọt lên giai đoạn cuối.
usn_ugm-84b=UGM-84B,Harpoon,ASM,Harpoon là vũ khí chống hạm tấn công từ xa được dùng rộng rãi trong NATO. Vũ khí này có đầu dò radar chủ động được kích hoạt sau khi bay theo lộ trình lập trình sẵn. Biến thể UGM-84B là loại phóng từ tàu ngầm, sử dụng ống phóng dùng một lần. Khác với UGM-84A trước đó, nó không thực hiện cơ động bay vọt lên giai đoạn cuối.
usn_ugm-84c=UGM-84C,Harpoon,ASM,Harpoon là vũ khí chống hạm tấn công từ xa của Mỹ, được dùng rộng rãi trong NATO. Vũ khí này có đầu dò radar chủ động, chỉ bật sau khi tên lửa bay theo lộ trình lập trình sẵn. Biến thể UGM-84C là loại phóng từ tàu ngầm, sử dụng ống phóng (canister) dùng một lần. Khác với UGM-84A đời đầu, nó không “pop-up” ở giai đoạn cuối mà bay bám biển (sea-skimming) để tấn công tàu hiệu quả hơn.
usn_ugm-109b=UGM-109B,Tomahawk,ASM,RGM-109B Tomahawk Anti-Ship Missile (TASM) là vũ khí chống hạm tấn công từ xa của Mỹ. Vũ khí này có đầu dò radar chủ động được kích hoạt sau khi bay theo lộ trình lập trình sẵn, và có thể bay theo mẫu tìm kiếm kèm các cơ động đánh lừa.\nĐây là biến thể phóng từ tàu ngầm, triển khai độc quyền qua ống phóng ngư lôi.

wp_as-2=AS-2,Kipper,ASM,AS-2 Kipper (K-10S) là vũ khí chống hạm tấn công từ xa siêu âm phóng từ máy bay của Liên Xô, thiết kế để trang bị cho Tu-16. Tương đương với phiên bản phóng từ máy bay của SS-N-3, nó chịu nhiều nhược điểm tương tự khi đối đầu với phòng không hiện đại.
wp_as-4=AS-4,Kitchen,ASM,AS-4 Kitchen (Kh-22) là vũ khí chống hạm tấn công từ xa siêu âm phóng từ máy bay của Liên Xô, mang bởi Tu-22M hoặc Tu-95. Nó bay biên dạng độ cao lớn, tốc độ cao với pha lặn siêu âm giai đoạn cuối, khiến nó rất khó bị đánh chặn.
wp_as-6=AS-6,Kingfish,ASM,AS-6 Kingfish (Kh-26) là vũ khí tấn công từ xa và chống hạm siêu âm phóng từ máy bay của Liên Xô, thiết kế để trang bị cho Tu-16. Là người em nhỏ hơn của AS-4, nó bay biên dạng độ cao lớn, tốc độ cao với pha chúi xuống siêu âm giai đoạn cuối, khiến nó rất khó bị đánh chặn.
wp_as-7=AS-7,Kerry,ASM,AS-7 Kerry (Kh-23 Grom) là vũ khí tấn công từ xa siêu âm phóng từ máy bay của Liên Xô. Nó dựa vào người điều khiển dẫn đường thủ công cho tên lửa, tương tự như AGM-12 Bullpup của Mỹ, và mang nhiều nhược điểm tương tự.
wp_as-10=AS-10,Karen,ASM,AS-10 Karen (Kh-25/Kh-25M) là vũ khí tấn công từ xa siêu âm phóng từ máy bay của Liên Xô. Nó dùng đầu dò laser cho khả năng bắn-và-quên.
wp_as-13=AS-13,Kingbolt,ASM,AS-13 Kingbolt (Kh-59 Ovod) là vũ khí tấn công từ xa cận âm phóng từ máy bay của Liên Xô. Nó bay giai đoạn giữa bằng dẫn đường quán tính, sử dụng tọa độ mục tiêu nạp sẵn, với pha cuối dẫn đường bằng vô tuyến truyền hình (TV).
wp_as-14a=AS-14A,Kedge,ASM,AS-14A Kedge (Kh-29L) là tên lửa không đối đất siêu âm phóng từ máy bay của Liên Xô, với đầu đạn hạng nặng và dẫn đường laser.
wp_as-14b=AS-14B,Kedge,ASM,AS-14B Kedge (Kh-29T) là tên lửa không đối đất siêu âm phóng từ máy bay của Liên Xô, với đầu đạn hạng nặng và dẫn đường vô tuyến truyền hình (TV) cho tầm xa hơn, nhưng hiệu năng giảm sút vào ban đêm.

wp_ss-n-2=SS-N-2,Styx,ASM,SS-N-2 Styx (P-15 Termit) là vũ khí chống hạm tấn công từ xa cận âm phóng từ tàu mặt nước của Liên Xô. Vũ khí này được Trung Quốc sản xuất theo giấy phép với tên gọi CSS-C-2 Silkworm nổi tiếng. Nó cũng có thể dùng để tấn công cơ sở trên bộ ở ven biển.
wp_ss-n-2c=SS-N-2C,Styx,ASM,SS-N-2C Styx (P-15 Termit-M) là vũ khí chống hạm tấn công từ xa cận âm phóng từ tàu mặt nước của Liên Xô. Đây là phiên bản cải tiến của P-15 gốc với tầm bắn mở rộng và khả năng chống tác chiến điện tử (ECCM) tốt hơn. Nó cũng có thể dùng để tấn công cơ sở trên bộ ở ven biển.
wp_ss-n-3=SS-N-3,Shaddock,ASM,SS-N-3 Shaddock (P-35) là vũ khí chống hạm tấn công từ xa cận âm phóng từ tàu mặt nước của Liên Xô. Dù rất đáng sợ khi mới ra mắt, biên dạng bay cận âm ở độ cao lớn khiến nó rất dễ bị tên lửa phòng không bắn hạ. Một nhược điểm nữa là nền tảng phóng phải giữ liên lạc với tên lửa suốt hành trình, nghĩa là các tàu ngầm phải nổi lên mặt nước trong khi tấn công, khiến chúng dễ bị phản đòn.
wp_ss-n-3b=SS-N-3B,Sepal,ASM,SS-N-3B Sepal (Progress) là vũ khí chống hạm tấn công từ xa cận âm phóng từ tàu mặt nước của Liên Xô. Đây là phiên bản cải tiến của tên lửa P-35 gốc với độ cao bay thấp hơn và khả năng kháng nhiễu/mồi bẫy tốt hơn.
wp_ss-n-7=SS-N-7,Starbright,ASM,SS-N-7 Starbright (P-70 Ametist) là vũ khí chống hạm tấn công từ xa cận âm phóng từ tàu ngầm của Liên Xô. Đây là hệ thống tên lửa đầu tiên trên thế giới phóng được từ tàu ngầm đang lặn. Nó là vũ khí tầm tương đối ngắn, và bị thay thế bởi SS-N-9 Siren.
wp_ss-n-9=SS-N-9,Siren,ASM,SS-N-9 Siren (P-120 Malakhit) là vũ khí chống hạm tấn công từ xa cận âm phóng từ tàu mặt nước của Liên Xô. Nó nhanh hơn và tầm xa hơn Styx, và có thể thực hiện cơ động tránh né ở giai đoạn cuối.
wp_ss-n-12=SS-N-12,Sandbox,ASM,SS-N-12 Sandbox (P-500 Bazalt) là vũ khí chống hạm tấn công từ xa siêu âm phóng từ tàu mặt nước của Liên Xô, thiết kế thay thế SS-N-3 Shaddock. So với Shaddock, nó nhanh hơn nhiều, và tích hợp liên kết dữ liệu giữa các tên lửa cho phép phần lớn loạt đạn bay thấp trong khi một tên lửa bay cao làm nhiệm vụ trinh sát mục tiêu. Nó cũng mang theo ECM phòng thủ để tăng khả năng sống sót trước phòng không.
wp_ss-n-19=SS-N-19,Shipwreck,ASM,SS-N-19 Shipwreck (P-700 Granit) là vũ khí chống hạm tấn công từ xa siêu âm phóng từ tàu mặt nước của Liên Xô. Nó bay biên dạng CAO-THẤP và bao gồm liên kết dữ liệu tiên tiến cho phép loạt tên lửa phân chia mục tiêu với nhau bằng cách dùng một tên lửa bay cao trinh sát. Nó có khả năng cơ động tránh né ở giai đoạn cuối, mang theo máy gây nhiễu ECM và mồi bẫy trên khoang, và được bọc giáp chống đạn CIWS và mảnh văng tên lửa. Đây là vũ khí đáng sợ theo bất kỳ tiêu chuẩn nào.
wp_ss-n-22=SS-N-22,Sunburn,ASM,SS-N-22 Sunburn (P-270 Moskit) là vũ khí chống hạm tấn công từ xa siêu âm phóng từ tàu mặt nước của Liên Xô. Nó bay biên dạng THẤP-THẤP với pha cuối lướt mặt biển ở tốc độ siêu âm, trong đó tên lửa thực hiện cơ động lượn vòng rắn bò để tăng khả năng sống sót trước phòng không.

#-----------Land Strike only missiles---------
wp_as-4b=AS-4B,Kitchen-B,Land Attack,AS-4B Kitchen (Kh-22MP Storm) là tên lửa tấn công mặt đất tầm xa siêu âm do Liên Xô chế tạo.

usn_rgm-109c=RGM-109C,Tomahawk,Land Attack,Tomahawk Land Attack Missile (TLAM) là tên lửa tấn công mặt đất tầm xa của Mỹ. Những vũ khí này bay theo lộ trình lập trình sẵn tới mục tiêu mà không cần đầu vào từ nền tảng phóng sau khi bắn, sử dụng kỹ thuật so sánh biên dạng địa hình bằng radar lập bản đồ địa hình và bản đồ số trên khoang.

usn_agm-65b=AGM-65B,Maverick,Land Attack,AGM-65B là vũ khí tấn công từ xa không đối đất dẫn đường bằng vô tuyến truyền hình (TV) của Mỹ. Người điều khiển trên máy bay giữ tâm ngắm vào mục tiêu mong muốn, vũ khí khóa mục tiêu và tự động dẫn đường tới đó sau khi phóng, tương tự như AGM-62 Walleye.
usaf_agm-86c=AGM-86C,CALCM,Land Attack,Conventional Air Launched Cruise Missile (CALCM) là tên lửa hành trình tấn công mặt đất tầm xa phóng từ trên không của Mỹ và là vũ khí tầm xa chủ lực của B-52. Tên lửa bay theo lộ trình lập trình sẵn tới mục tiêu mà không cần đầu vào từ nền tảng phóng sau khi rời bệ, sử dụng kỹ thuật so khớp địa hình (TERCOM) dựa trên radar lập bản đồ địa hình và bản đồ số trên khoang.

usn_rgm-109c=RGM-109C,Tomahawk,Land Attack,Tomahawk Land Attack Missile (TLAM) là tên lửa tấn công mặt đất tầm xa (standoff) của Mỹ. Tên lửa bay theo lộ trình lập trình sẵn tới mục tiêu mà không cần dữ liệu từ bệ phóng sau khi phóng, dùng kỹ thuật so khớp địa hình (TERCOM) dựa trên radar lập bản đồ địa hình và bản đồ số trên khoang.

usn_ugm-109c=UGM-109C,Tomahawk,Land Attack,Tomahawk Land Attack Missile (TLAM) là tên lửa tấn công mặt đất tầm xa (standoff) của Mỹ. Tên lửa bay theo lộ trình lập trình sẵn tới mục tiêu mà không cần dữ liệu từ bệ phóng sau khi phóng, dùng kỹ thuật so khớp địa hình (TERCOM) dựa trên radar lập bản đồ địa hình và bản đồ số trên khoang.\nĐây là biến thể phóng từ tàu ngầm, triển khai độc quyền qua ống phóng ngư lôi. UGM-109C không thể nạp đầy nhiên liệu khi phóng từ tàu ngầm, nên tầm bắn bị giảm so với bản phóng từ tàu mặt nước.

usa_bgm-71a=BGM-71A,BGM-71A TOW,Land Attack,BGM-71 TOW là tên lửa chống tăng dẫn đường bằng dây của Mỹ. Vũ khí này được dùng trên cả trực thăng và xe thiết giáp.

wp_at-6=AT-6,Spiral,Land Attack,AT-6 Spiral (9M114 Kokon) là tên lửa chống tăng có điều khiển siêu âm của Liên Xô, được một số trực thăng tấn công sử dụng, đặc biệt là Ka-29 và Mi-24. Điểm nổi bật là tầm bắn xa, tốc độ cao và đầu đạn mạnh.
wp_at-10=AT-10,Sabber,Land Attack,AT-10 Sabber là tên lửa chống tăng có điều khiển của Liên Xô dùng cho xe tăng T-55M.

# ---------- Anti-sub Missilies ----------

ran_ikara=GWS-40,Ikara,ASW,GWS-40 Ikara là tên lửa hành trình chống ngầm của Úc, sử dụng động cơ rocket, mang và thả ngư lôi Mk-46 hoặc Mk-44 để tiêu diệt mục tiêu dưới mặt nước. Dù có tầm bắn gấp đôi ASROC của Mỹ, Ikara chậm hơn đôi chút, và do cấu hình bệ phóng nên không thể bắn nhanh nhiều quả liên tiếp.
usn_rur-5=RUR-5,ASROC,ASW,RUR-5 ASROC (Rocket chống ngầm) là vũ khí chống ngầm tầm xa. Tên lửa ASROC được phóng từ bệ phóng và thả một ngư lôi chống ngầm Mk 46 sau khi bay theo quỹ đạo đạn đạo.

wp_apr-2=APR-2,,ASW,APR-2 là ngư lôi chống ngầm thả từ máy bay của Liên Xô, với tầm hoạt động của đầu dò là 0.75 hải lý và có thể dùng tới độ sâu 600m.
wp_ss-n-14a=SS-N-14A,Silex,ASW,SS-N-14 Silex (Metel) là vũ khí chống ngầm tầm xa của Liên Xô. Tương tự Ikara của Úc, vũ khí này mang một ngư lôi bên dưới khung thân của một tên lửa hành trình nhỏ.
wp_ss-n-14b=SS-N-14B,Silex-B,ASW/ASuW,SS-N-14 Silex-B (Rastrub) là vũ khí tầm xa lưỡng dụng chống ngầm và chống hạm của Liên Xô. Tương tự Ikara của Úc, vũ khí này mang một ngư lôi bên dưới khung thân của một tên lửa hành trình nhỏ.
wp_ss-n-16=SS-N-16,Stallion,ASW,SS-N-16 Stallion (Vodopad) là vũ khí chống ngầm tầm xa của tàu ngầm Liên Xô. Nó bay theo quỹ đạo đạn đạo để thả ngư lôi xuống vùng lân cận mục tiêu.

# ------------------ RBU ------------------
knm_terne_shell=Terne III Mortar,,ASuW Mortar,Terne là hệ thống vũ khí chống ngầm đẩy bằng rocket của Na Uy phát triển những năm 1960.

plan_type62dc=FQF-1200,,ASW Mortar,FQF-1200 là bệ phóng rocket chống ngầm 5 nòng của Trung Quốc.
plan_type75dc=FQF-2500,,ASW Mortar,FQF-2500 là bệ phóng rocket chống ngầm 12 nòng của Trung Quốc.

rn_limbo_shell=LIMBO Mortar,,ASW Mortar,Limbo (hay Cối Chống Ngầm Mark 10) là cối chống ngầm do Anh chế tạo những năm 1950. Ngắm bắn bằng sonar trên tàu, nó nhắm thả ba quả bom chìm theo hình tam giác quanh mục tiêu.
rn_squid_shell=SQUID Mortar,,ASW Mortar,Squid là cối chống ngầm thời Thế Chiến II do Anh chế tạo. Ngắm bắn bằng sonar trên tàu, nó nhắm thả ba quả bom chìm theo hình tam giác quanh mục tiêu.

swe_375mm_rocket=Bofors M/50,,ASW Mortar,Bofors M/50 là bệ phóng rocket chống ngầm 375 mm của Thụy Điển.

wp_rgb-10=RBU-1000,,ASW Mortar,RBU-1000 (hay Smerch-3) là bệ phóng rocket chống ngầm 300 mm của Liên Xô. RBU-1000 có tầm bắn xấp xỉ 1000 yard.
wp_rgb-12=RBU-1200,,ASW Mortar,RBU-1200 (hay Smerch-3) là bệ phóng rocket chống ngầm 251 mm của Liên Xô. RBU-1200 có tầm bắn xấp xỉ 1200 yard.
wp_rgb-25=RBU-2500,,ASW Mortar,RBU-2500 (hay Smerch-1) là bệ phóng rocket chống ngầm 213 mm của Liên Xô. RBU-2500 có tầm bắn xấp xỉ 2500 yard.
wp_rgb-60=RBU-6000,,ASW Mortar,RBU-6000 (hay Smerch-2) là bệ phóng rocket chống ngầm 213 mm của Liên Xô. RBU-6000 có tầm bắn xấp xỉ 6000 yard.

# --------------- Torpedoes ---------------
fr_e15=E15,,ASuW Torpedo,Ngư lôi E15 của Pháp là loại ngư lôi chống hạm hạng nặng 55cm khác thường với dẫn đường sonar thụ động.
fr_l3=L3,,ASW Torpedo,Ngư lôi L3 của Pháp là loại ngư lôi chống ngầm hạng trung 55cm khác thường.

ger_dm1=DM1,,ASW Torpedo,Ngư lôi dẫn đường bằng dây đầu tiên của Đức chuyên dùng chống tàu ngầm.
ger_dm2=DM2,,ASuW Torpedo,Ngư lôi dẫn đường bằng dây của Đức chuyên dùng chống mục tiêu mặt nước.
ger_sst4=SST4,,ASuW Torpedo,Ngư lôi chống hạm hạng nặng dẫn đường bằng dây do Đức chế tạo. Sản xuất để xuất khẩu cho các hải quân khác.

it_a-244s_air=A-244,,ASW Torpedo,Ngư lôi chống ngầm hạng nhẹ thả từ trên không của Ý. Có dẫn đường sonar chủ động và thụ động.

jmsdf_type80=Type 80,,Torpedo,Ngư lôi Type 80. Thành quả của chương trình nghiên cứu GRX-1 và GRX-2 từ thập niên 1970, và ảnh hưởng bởi thiết kế Mark 37 của Hải quân Mỹ, loại ngư lôi dẫn đường bằng dây Chống ngầm/Chống hạm này có đặc tính đẩy, hiệu năng và tầm bắn tốt hơn Mark 37.
jmsdf_type54=Type 54,,Torpedo,Ngư lôi Type 54 Model 3 Mod 1. Ngư lôi đầu tiên do Nhật tự thiết kế sau Thế Chiến II. Ban đầu khá thất bại và dễ hỏng sau khi phóng, nó trải qua nhiều lần thiết kế lại và kết thúc ở biến thể sản xuất hàng loạt Model 3 Mod 1.

knm_tp612=TP612,,ASuW Torpedo,TP612 của Thụy Điển là ngư lôi hạng nặng dẫn đường bằng dây không có đầu dò. TP612 là sự phát triển của TP611 với giảm tiếng ồn và khả năng phóng tự bơi ra.
knm_tp613=TP613,,ASuW Torpedo,TP613 của Thụy Điển là ngư lôi hạng nặng dẫn đường bằng dây với đầu dò sonar thụ động. TP613 là sự phát triển của TP612 với việc bổ sung đầu dò sonar thụ động.

plan_yu-1=Yu-1,,ASuW Torpedo,Yu-1 (Ngư-1) là ngư lôi hạng nặng đầu tiên do Trung Quốc tự sản xuất. Những ngư lôi chạy thẳng này tương đối đơn giản và do đó tin cậy và hiệu quả.
plan_yu-3=Yu-3,,ASW Torpedo,Yu-3 (Ngư-3) là ngư lôi chống ngầm hạng nặng thụ động của Trung Quốc. Là một ngư lôi chậm, nó phù hợp nhất để tấn công tàu ngầm diesel-điện, vì các mục tiêu nhanh hơn có thể chạy thoát khỏi ngư lôi. Đầu dò có tầm tối đa khoảng 1600 yard.
plan_yu-4=Yu-4A,,ASuW Torpedo,Yu-4A (Ngư-4A) là ngư lôi chống hạm hạng nặng thụ động của Trung Quốc. Là một ngư lôi chậm, nó có lẽ chỉ hiệu quả ở khoảng cách rất gần.

rn_mark9_mod2=MkIX,,ASuW Torpedo,Ngư lôi Mark IX** của Anh là ngư lôi chống hạm ra mắt trong Thế Chiến 2. Thời gian chạy lâu hơn và đầu đạn mạnh hơn, đây là bản nâng cấp cuối cùng cho thiết kế Mark IX gốc thập niên 1930.

usn_mk16=Mk-16,,ASuW Torpedo,The Mark 16 torpedo is a WWII vintage straight-running torpedo used through the 1950's and 1960's as a fast, very high power anti-ship torpedo by US attack submarines. Despite the lack of guidance, short range shots that connect will almost certainly sink any target, regardless of size. The Mod 8 variant incorporates the high power warhead of the Mod 0, with the longer range of the Mod 1 torpedo.
usn_mk37=Mk-37 Mod 0,,ASW Torpedo,Ngư lôi Mark 37 là ngư lôi chống ngầm hạng nhẹ tiêu chuẩn của Hải quân Mỹ được dùng bởi nhiều quốc gia. Ra mắt năm 1959, nó trở nên quá chậm và kém hiệu quả để đối đầu với tàu ngầm hiệu năng cao hiện đại của Liên Xô.
usn_mk37_mod1=Mk-37 Mod 1,,ASW Torpedo,Ngư lôi Mark 37 là ngư lôi chống ngầm hạng nhẹ tiêu chuẩn của Hải quân Mỹ được dùng bởi nhiều quốc gia. Ra mắt năm 1959, nó trở nên quá chậm và kém hiệu quả để đối đầu với tàu ngầm hiệu năng cao hiện đại của Liên Xô. Bản Mod 1 bổ sung dẫn đường bằng dây nhưng phải đánh đổi một chút tốc độ.
usn_mk44_air=Mk-44,,ASW Torpedo,Ngư lôi Mark 44 là ngư lôi chống ngầm cổ điển của NATO và là vũ khí rất phổ biến xuyên suốt thời Chiến tranh Lạnh. Dù có độ tin cậy tốt, Mark 44 có tầm bắn ngắn và tốc độ chậm, nên khá chật vật khi đối đầu với tàu ngầm nhanh và lặn sâu.\nBiến thể này được phóng từ trên không.
usn_mk44_ship=Mk-44,,ASW Torpedo,Ngư lôi Mark 44 là ngư lôi chống ngầm cổ điển của NATO và là vũ khí rất phổ biến xuyên suốt thời Chiến tranh Lạnh. Dù có độ tin cậy tốt, Mark 44 có tầm bắn ngắn và tốc độ chậm, nên khá chật vật khi đối đầu với tàu ngầm nhanh và lặn sâu.\nBiến thể này phóng từ tàu mặt nước.
usn_mk46_air=Mk-46,,ASW Torpedo,Ngư lôi Mark 46 là chuẩn NATO cho ngư lôi hạng nhẹ dùng bởi nhiều quốc gia. Được thiết kế để tấn công tàu ngầm hiệu năng cao hiện đại của Liên Xô, biến thể này là loại thả từ trên không.
usn_mk46_ship=Mk-46,,ASW Torpedo,Ngư lôi Mark 46 là chuẩn NATO cho ngư lôi hạng nhẹ dùng bởi nhiều quốc gia. Được thiết kế để tấn công tàu ngầm hiệu năng cao hiện đại của Liên Xô, biến thể này là loại phóng từ tàu.
usn_mk48=Mk-48,,Torpedo,Mark 48 là ngư lôi hạng nặng của Mỹ. Những ngư lôi này được dẫn đường bằng dây và có khả năng đổi mục tiêu từ nền tảng phóng.

wp_45-36nu=45-36NU,,ASuW Torpedo,45-36NU là ngư lôi 450mm chạy thẳng lỗi thời thiết kế từ trước Thế Chiến II, ảnh hưởng nặng bởi thiết kế 45-F và 53-F của Ý đầu những năm 1930. Hạng nhẹ và sức công phá kém hơn các đối thủ 530mm, nó trở thành vũ khí khá kém hiệu quả vào những năm 1950. Nhưng đôi khi méo mó có hơn không.
wp_53-38=53-38,,ASuW Torpedo,53-38 là ngư lôi chạy thẳng hạng nặng của Liên Xô thời Thế Chiến II. Những ngư lôi này tương đối đơn giản và do đó tin cậy và hiệu quả. Hai vụ đánh chìm chết chóc nhất lịch sử (tàu vận tải Đức Wilhelm Gustloff và tàu chở quân Goya) được thực hiện bởi hai tàu ngầm Liên Xô dùng 53-38.
wp_53-39=53-39,,ASuW Torpedo,53-39 là ngư lôi chạy thẳng hạng nặng của Liên Xô thời Thế Chiến II. Những ngư lôi này tương đối đơn giản và do đó tin cậy và hiệu quả.
wp_53-56v=53-56,,ASuW Torpedo,53-56V là ngư lôi chạy thẳng hạng nặng của Liên Xô. Những ngư lôi này là biến thể cập nhật của 53-38.
wp_53-65K=53-65K,,WH Torpedo,53-65 là ngư lôi hạng nặng dẫn đường bằng vệt nước (wake-homing) của Liên Xô thiết kế để tiêu diệt tàu mặt nước.
wp_65-76=65-76,,WH Torpedo,65-76 là ngư lôi dẫn đường bằng vệt nước cỡ 650mm của Liên Xô được mệnh danh là sát thủ tàu sân bay. Nó được phát triển riêng để chống lại các mục tiêu cực lớn như siêu tàu sân bay. Đường kính lớn 650mm nghĩa là chỉ một số tàu ngầm mới mang được nó.
wp_at-1=AT-1,,ASW Torpedo,AT-1 là ngư lôi chống ngầm chạy điện thả từ trên không của Liên Xô với dẫn đường âm học chủ động/thụ động, chỉ mang bởi trực thăng.
wp_at-2=AT-2,,ASW Torpedo,AT-2 là ngư lôi chống ngầm hạng nặng chạy điện phóng từ trên không của Liên Xô với dẫn đường âm học chủ động/thụ động. AT-2 là một trong số ít ngư lôi hạng nặng phóng từ trên không vì đa số ngư lôi phóng từ trên không nhỏ hơn nhiều và chỉ nặng bằng một phần tư.
wp_set-40=SET-40,,ASW Torpedo,SET-40 là ngư lôi chống ngầm chạy điện hạng nhẹ của Liên Xô với dẫn đường sonar chủ động/thụ động.
wp_set-65=SET-65,,ASW Torpedo,SET-65 là ngư lôi chống ngầm chạy điện hạng nặng của Liên Xô với dẫn đường sonar chủ động.
wp_test-71=TEST-71,,ASW Torpedo,TEST-71 là ngư lôi chống ngầm hạng nặng dẫn đường bằng dây của Liên Xô. Nó cải tiến từ SET-65 với khả năng dẫn đường chủ động/thụ động tiên tiến hơn.
wp_umgt-1=UMGT-1,,ASW Torpedo,UMGT-1 là ngư lôi chống ngầm thả từ trên không của Liên Xô, cũng đóng vai trò là đầu đạn cho tên lửa chống ngầm SS-N-14 và SS-N-16. Những ngư lôi hạng nhẹ này có sức công phá kém hơn ngư lôi hạng nặng Liên Xô nhưng vẫn cực kỳ nguy hiểm.
wp_uset-80=USET-80,,Torpedo,USET-80 là ngư lôi lưỡng dụng hiện đại của Liên Xô. Nó có hệ thống dẫn đường chủ động/thụ động khiến đây là vũ khí cực kỳ nguy hiểm phải đối mặt cho cả tàu ngầm và tàu mặt nước.

# ------------------ Bombs -----------------
fr_samp_t25=SAMP-25,,Bomb,SAMP Type 25 là bom thông thường 230 kg (500 lb) của Pháp. Tương đương với Mk-82 của Mỹ.
fr_samp_t21=SAMP-21,,Bomb,SAMP Type 21 là bom thông thường 400 kg (880 lb) của Pháp. Tương đương với Mk-83 của Mỹ.

pla_type-2=Type-100-2,,Bomb,Type-100-2 là bom thông thường thả từ máy bay cỡ 100kg của Trung Quốc. Tương đương với FAB-100 của Liên Xô.
pla_type-3-250=Type-250-3,,Bomb,Type-250-3 là bom thông thường thả từ máy bay cỡ 250kg của Trung Quốc. Tương đương với FAB-250 của Liên Xô.
pla_type-3-500=Type-500-3,,Bomb,Type-500-3 là bom thông thường thả từ máy bay cỡ 500kg của Trung Quốc. Tương đương với FAB-500 của Liên Xô.

raf_bl755=BL755,,Cluster Bomb,BL755 chứa 147 bom con xuyên giáp nổ lõm rải trên diện rộng. Nó được sử dụng rộng rãi trong chiến tranh Iran-Iraq bởi Không quân Iran và ở Falklands bởi Không quân Hoàng gia Anh.

usaf_gbu-2=GBU-2,Paveway I,Guided Bomb,GBU-2 Paveway I là bom dẫn đường laser 2000 lb (907 kg) của Mỹ. Vũ khí dựa trên Mk 84 nhưng thêm đầu dò laser ở mũi và cánh lái để dẫn đường.
usaf_bolt-117=BOLT-117,,Guided Bomb,BOLT-117 là bom dẫn đường laser của Mỹ, nặng 750 lb (340 kg). Đây là bom rơi tự do M-117 được cải tiến bằng cách gắn đầu dò laser ở mũi và bộ cánh/lái để dẫn đường.
usaf_gbu-11=GBU-11,Paveway I,Guided Bomb,GBU-11 là bom dẫn đường laser của Mỹ, nặng 3000 lb (1400 kg). Đây là loại bom dẫn đường siêu nặng, dùng để tấn công các mục tiêu kiên cố như cầu hoặc boongke nhờ lượng thuốc nổ lớn.
usaf_m117=M117,,Bomb,M117 là bom 750 lb (340 kg) từ thời Chiến tranh Triều Tiên, được Không quân Mỹ sử dụng rộng rãi trong Chiến tranh Việt Nam. Nó về sau được thay thế bởi các mẫu thuộc dòng Mk 80.
usaf_m118=M118,,Demolition Bomb,M118 là bom phá hủy (demolition) siêu nặng của Mỹ, nặng 3000 lb (1400 kg), dùng để tấn công các mục tiêu điểm kiên cố như cầu, boongke, công sự, đường sắt và các kết cấu bền vững khác.
usaf_cbu-24=CBU-24,,Cluster Bomb,CBU-24 chứa 665 bom con sát thương, rải trên diện rộng. Nó được các đơn vị Wild Weasel sử dụng khá nhiều như vũ khí chống bộ binh khi tấn công các trận địa SAM.

usn_gbu-10=GBU-10,Paveway II,Bom dẫn đường,GBU-10 Paveway II là bom dẫn đường laser 2000 lb (907 kg) của Mỹ. Vũ khí dựa trên Mk 84 nhưng thêm đầu dò laser ở mũi và cánh lái để dẫn đường. Bộ kít dẫn đường trên GBU-10 là bản nâng cấp của Paveway I cũ hơn.
usn_gbu-12=GBU-12,Paveway II,Bom dẫn đường,GBU-12 Paveway II là bom dẫn đường laser 500 lb (227 kg) của Mỹ. Vũ khí dựa trên Mk 82 nhưng thêm đầu dò laser ở mũi và cánh lái để dẫn đường.
usn_gbu-16=GBU-16,Paveway II,Bom dẫn đường,GBU-16 Paveway II là bom dẫn đường laser của Mỹ, nặng 1000 lb (460 kg). Vũ khí này dựa trên bom Mk 83 nhưng được bổ sung đầu dò laser gắn ở mũi và bộ cánh/lái để dẫn đường.usn_mk-82=Mk-82,,Bomb,Mark 82 là bom thông thường cản thấp 500 lb (227 kg).
usn_mk-82_snakeye=Mk-82 Snakeye,,Bomb,Mark 82 “Snake-eye” là bom rơi tự do đa dụng 500 lb (227 kg) loại lực cản lớn, có cánh bung sau khi thả. Rất hữu dụng cho kiểu thả “laydown”, tức máy bay thả bom ở tốc độ cao và bay thấp, không cần kéo lên (pop-up) hay bổ nhào, đổi lại là thời gian bay của bom dài hơn.
usn_mk-83=Mk-83,,Bomb,Mark 83 là bom thông thường cản thấp 1000 lb (454 kg).
usn_mk-84=Mk-84,,Bomb,Mark 84 là bom thông thường cản thấp 2000 lb (900 kg).
usn_rockeye=CBU-100,Rockeye,Cluster Bomb,CBU-100 Rockeye II là bom chùm 500 lb (227 kg) của Mỹ, rải 247 đạn con.
usn_walleye2=AGM-62,Walleye II,Guided Bomb,AGM-62 Walleye là bom lượn dẫn đường bằng vô tuyến truyền hình được Quân đội Mỹ sử dụng từ thập niên 1960-1990. Đa số có đầu đạn nổ mạnh 250 lb (113 kg); một số có đầu đạn hạt nhân W72.

usn_mk54_dc=Mk-54,,Depth Bomb,Bom chìm Mark 54 là bom chìm thả từ trên không của Mỹ thiết kế trong Thế Chiến II và vẫn phục vụ suốt Chiến tranh Lạnh.

wp_fab-100=OFAB-100,,Bomb,OFAB-100-120 là bom thông thường thả từ máy bay cỡ 100 kg (220 lb) thiết kế bởi Liên Xô với đầu đạn nổ mạnh, chủ yếu dùng bởi Liên Xô và đồng minh.
wp_fab-250=FAB-250,,Bomb,FAB-250 là bom thông thường thả từ máy bay cỡ 250 kg (550 lb) thiết kế bởi Liên Xô với đầu đạn nổ mạnh, chủ yếu dùng bởi Liên Xô và đồng minh.
wp_fab-500=FAB-500,,Bomb,FAB-500 là bom thông thường thả từ máy bay cỡ 500 kg (1100 lb) thiết kế bởi Liên Xô với đầu đạn nổ mạnh, chủ yếu dùng bởi Liên Xô và đồng minh.
wp_fab-500_m54=FAB-500 M-54,,Bomb,The FAB-500 is a Soviet-designed 500 kg (1100 lb) general purpose air-dropped bomb with a high-explosive warhead primarily used by the Soviet Union and its allies. This is a shorter, medium drag bomb meant to be carried in larger quantities, usually internally, but suffers from worse accuracy over the low-drag model.

wp_kab-500l=KAB-500L,,Guided Bomb,The KAB-500L is a Soviet-designed 500 kg (1100 lb) laser-homing air-dropped bomb with a high-explosive warhead primarily used by the Soviet Union and its allies. This is based off the FAB-500, but with a laser seeker and fins for guidance.

wp_rbk-250=RBK-250,,Cluster Bomb,RBK-250 là bom chùm 250 kg (550 lb) của Liên Xô.
wp_rbk-500=RBK-500,,Cluster Bomb,RBK-500 là bom chùm 500 kg (1100 lb) của Liên Xô.

wp_plab-100=PLAB-100,,Depth Bomb,PLAB-100 là bom chìm chống ngầm thả từ trên không cỡ 100 kg (220 lb) thiết kế bởi Liên Xô, chủ yếu dùng bởi Liên Xô và đồng minh.

# ---------------- Sonobuoys ---------------
plan_skf-1=SKF-1,,Phao Sonar Thụ động,SKF-1 là phao sonar (sonobuoy) thụ động đa hướng dùng bởi Hải quân Quân Giải phóng Nhân dân Trung Quốc từ thập niên 1960.
plan_skf-2=SKF-2,,Phao Sonar Thụ động,SKF-2 là phao sonar thụ động có định hướng dùng bởi Hải quân Quân Giải phóng Nhân dân Trung Quốc từ giữa thập niên 1970.

usn_ssq-41=AN/SSQ-41,LOFAR,Phao Sonar,SSQ-41A "Jezebel" là loại phao sonar Phân tích và Ghi âm Tần số Thấp (LOFAR). Đây là loại phao thụ động phổ biến nhất của NATO, không có khả năng xác định phương vị như phao DIFAR sau này, nhưng vẫn có độ nhạy khá tốt, và có thể tìm thấy số lượng lớn trong kho dự trữ của bất kỳ hải quân phương Tây nào.
usn_ssq-47=AN/SSQ-47,Julie,Phao Sonar Chủ động,SSQ-47A "Julie" là loại phao sonar đo xa chủ động liên tục. Đây là loại phao chủ động phổ biến nhất của NATO, không có khả năng xác định phương vị như phao DICASS sau này, nhưng vẫn hữu ích để 'chốt' vị trí mục tiêu đã phát hiện trước đó bằng nhiều phao. Do phát xung chủ động liên tục, phao này chỉ có tuổi thọ 30 phút.
usn_ssq-53=AN/SSQ-53,DIFAR,Phao Sonar Thụ động,SSQ-53 là loại phao sonar Phân tích và Ghi âm Tần số Có định hướng (DIFAR). Loại này cung cấp cho người vận hành thông tin hướng từ trường, một cải tiến lớn so với loại đa hướng CRT-1 trước đó.
usn_ssq-62=AN/SSQ-62,DICASS,Phao Sonar Chủ động,AN/SSQ-62 DICASS là phao sonar chủ động dùng để chốt vị trí tàu ngầm đang lặn đã được định vị trước đó bởi phao thụ động SSQ-53.
usn_ssq-77=AN/SSQ-77,VLAD,Phao Sonar,SSQ-77A là loại phao thụ động VLAD (DIFAR Mảng Tuyến tính Thẳng đứng), được thiết kế như một cải tiến thế hệ cho loại phao thụ động DIFAR gốc. Phao này có kiến trúc tương tự DIFAR, nhưng tích hợp mảng sonar cực nhạy cho phép tầm trinh sát thụ động cực xa, khả năng cao chống lại các mục tiêu lặn sâu, yên lặng và thể hiện hiệu suất tốt trong vùng nước ồn, nhiều nhiễu.\n\nHệ quả của hiệu suất lớn hơn là trọng lượng và chi phí của phao này, nghĩa là chúng ít phổ biến hơn, và độ chính xác ở tầm xa bị kém, nên chúng chủ yếu hữu ích để khoanh vùng mục tiêu lặn.
usn_ssq-101=AN/SSQ-101,,Phao Sonar Chủ động,AN/SSQ-101 Air Deployed Active Receiver (ADAR) là phao sonar thiết kế làm bộ thu cho các hệ thống đa tĩnh (multi-static) vùng nước nông. Khi triển khai nó dùng một mảng lớn các đầu thu thủy âm để xác định phương vị chính xác.


wp_rgb-1=RGB-1,,Phao Sonar Thụ động,RGB-1 là phao sonar thụ động đa hướng dùng bởi Liên Xô.
wp_rgb-nm1=RGB-NM-1,,Phao Sonar Thụ động,RGB-NM-1 là phao sonar thụ động đa hướng dùng như một phần của tổ hợp Baku của Liên Xô.
wp_rgb-3=RGB-3,,Phao Sonar Chủ động,RGB-3 là phao sonar chủ động dùng bởi Liên Xô.
# ------------------ FFAR -----------------
usn_zuni=Zuni,,FFAR,Zuni là Rocket vây gấp phóng từ máy bay (FFAR) cỡ 5.0 inch chủ yếu mang bởi máy bay cường kích và trực thăng tấn công. Zuni có thể mang nhiều loại đầu đạn tương tự các hệ thống FFAR khác. Nó thường được bắn từ pod phóng rocket LAU-10 chứa 4 quả.
usn_hydra=Hydra 70,,FFAR,Hydra 70 là Rocket vây gấp phóng từ máy bay (FFAR) cỡ 2.75 inch dùng bởi cả tiêm kích và trực thăng. Hydra có thể lắp nhiều loại đầu đạn và thường mang trong pod chứa tới 19 quả.

wp_s-5=S-5,,FFAR,S-5 là Rocket vây gấp phóng từ máy bay (FFAR) cỡ 55 mm của Liên Xô dùng bởi tiêm kích bom và trực thăng. S-5 có nguồn gốc từ R4M của Đức cuối Thế Chiến II. Rocket thường được mang trong các pod chứa tới 32 quả.
wp_s-8=S-8,,FFAR,S-8 là Rocket vây gấp phóng từ máy bay (FFAR) cỡ 80 mm của Liên Xô dùng bởi tiêm kích bom và trực thăng. S-8 có nhiều biến thể khác nhau bao gồm cả loại chuyên phá đường băng. Rocket thường được mang trong các pod chứa tới 20 quả.
wp_s-24=S-24,,FFAR,S-24 là Rocket vây gấp phóng từ máy bay (FFAR) cỡ 240 mm của Liên Xô dùng bởi tiêm kích bom và trực thăng. Khác với đa số FFAR, nó được treo đơn lẻ.
wp_s-25=S-25,,FFAR,S-25 là Rocket vây gấp phóng từ máy bay (FFAR) cỡ 266 mm của Liên Xô dùng bởi tiêm kích bom và trực thăng. Là loại lớn nhất trong các rocket không điều khiển của Liên Xô, S-25 có đầu đạn chứa gần 60kg thuốc nổ và được treo đơn lẻ.

# ------------------ MLRS -----------------
ir_107mm_rocket=Haseb-1,,MLRS,Rocket Haseb-1 là phiên bản Iran của rocket 107mm Trung Quốc bắn từ Bệ phóng Rocket Đa nòng (MLRS) Type 63. Trong biên chế Iran cả bệ phóng và rocket đều gọi là Haseb.

usa_m26=M26,,MLRS,M26 là rocket không điều khiển 227 mm dùng bởi Hệ thống Pháo phản lực Phóng loạt (MLRS) M270 của Lục quân Mỹ. Đầu đạn rocket chứa tới 800 đạn con có thể bao phủ tới 2000 mét vuông.

wp_grad=Grad,,MLRS,Rocket M-21OF là vũ khí Liên Xô bắn từ xe phóng BM-21. Hệ thống hoàn chỉnh (M-21) thường được biết đến với tên Hệ thống Pháo phản lực Phóng loạt "Grad".

