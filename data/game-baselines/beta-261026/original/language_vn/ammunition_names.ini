usn_an_slq_25_nixie_decoy=AN/SLQ-25,Nixie,Bẫy mồi,Nixie (chính thức là AN/SLQ-25) là hệ thống mồi bẫy kéo theo được dùng chủ yếu bởi tàu mặt nước Hải quân Mỹ. Hệ thống tạo ra tín hiệu thiết kế để dụ ngư lôi đang tiếp cận ra xa khỏi tàu mẹ.

usn_moss=MOSS,MK-70,Bẫy mồi,Mk 70 MOSS (Giả lập Tàu ngầm Di động) là mồi bẫy đường kính 10 inch dùng để dụ sonar địch ra xa tàu ngầm phóng. MOSS có khả năng giả lập tiếng ồn tự thân của tàu ngầm cũng như sonar chủ động của nó.

wp_mg-44=MG-44,Korund,Bẫy mồi,MG-44 Korund là thiết bị giả lập tàu ngầm thủy âm tự hành thế hệ hai. Nó được thiết kế để phóng từ ống phóng 400mm đặc biệt trên tàu ngầm Liên Xô.

