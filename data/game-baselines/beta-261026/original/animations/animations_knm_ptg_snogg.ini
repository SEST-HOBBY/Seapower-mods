[------------------------------ Sequences ------------------------------]
[ ---------- Penguin Containers ---------- ]
[TopHatchOpen_Sequence]
NumberOfSteps=2
#Step<i>=Time|Position|Rotation|SmoothnessType
#Step<i>=0|None|0,0,0|Linear
Step1=0|None|x,y,-90|Linear	//Step1=0|None|x,y,-92.5|Linear
Step2=0.5|None|x,y,100|Linear	//Step2=3|None|x,y,22.5|Linear
#Step2=3|None|x,y,112.5|Linear  //For 2-side animation

[LowerHatchOpen_Sequence]
NumberOfSteps=2
Step1=0|None|x,y,-90|Linear
Step2=0.5|None|x,y,-135|Linear
#Step1=0|None|x,y,-92.5|Linear
#Step2=3|None|x,y,-172.5|Linear

[TopHatchClose_Sequence]
NumberOfSteps=2
#Step1=0|None|x,y,112.5|Linear  //For 2-side animation
Step1=0|None|x,y,100|Linear
Step2=1|None|x,y,-90|Linear

[LowerHatchClose_Sequence]
NumberOfSteps=2
Step1=0|None|x,y,-135|Linear
Step2=1|None|x,y,-90|Linear

