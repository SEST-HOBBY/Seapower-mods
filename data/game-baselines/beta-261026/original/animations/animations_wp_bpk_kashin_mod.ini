[VDS_Extend]
NumberOfSequencesToPlay=4
Sequence1=Door_Open
Sequence1_Model=VDS_Door
Sequence2=Winch_Extend
Sequence2_Model=VDS_Winch
Sequence3=Actuator_Extend
Sequence3_Model=VDS_Actuator
Sequence4=Cradle_Extend
Sequence4_Model=VDS_Cradle

[VDS_Retract]
NumberOfSequencesToPlay=4
Sequence1=Door_Close
Sequence1_Model=VDS_Door
Sequence2=Winch_Retract
Sequence2_Model=VDS_Winch
Sequence3=Actuator_Retract
Sequence3_Model=VDS_Actuator
Sequence4=Cradle_Retract
Sequence4_Model=VDS_Cradle

############################################################
# Deploy VDS
############################################################

[HatchOpenAnimSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=-17
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=3                // time in seconds - here for the end
RotationX2=-80
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[HatchCloseAnimSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=-80
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=3                // time in seconds - here for the end
RotationX2=-17
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Door_Open]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
RotationX2=80
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Winch_Extend]
NumberOfSteps=2
Time1=5                // time in seconds for the start
PositionZ1=-0.85
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=10                // time in seconds - here for the end
PositionZ2=-0.95
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Actuator_Extend]
NumberOfSteps=2
Time1=10                // time in seconds for the start
RotationX1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=15               // time in seconds - here for the end
RotationX2=-90
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Cradle_Extend]
NumberOfSteps=2
Time1=10                // time in seconds for the start
RotationX1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=15                // time in seconds - here for the end
RotationX2=90
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

############################################################
# Retract VDS
############################################################

[Cradle_Retract]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=90
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
RotationX2=00
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Actuator_Retract]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=-90
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5               // time in seconds - here for the end
RotationX2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Winch_Retract]
NumberOfSteps=2
Time1=5                // time in seconds for the start
PositionZ1=-0.95
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=10                // time in seconds - here for the end
PositionZ2=-0.85
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Door_Close]
NumberOfSteps=2
Time1=10                // time in seconds for the start
RotationX1=80
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=15                // time in seconds - here for the end
RotationX2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry