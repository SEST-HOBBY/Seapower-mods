Animation1=HatchOpenAnim_1
Animation2=HatchOpenAnim_2
Animation3=HatchOpenAnim_3
Animation4=HatchOpenAnim_4
Animation5=HatchCloseAnim_1
Animation6=HatchCloseAnim_2
Animation7=HatchCloseAnim_3
Animation8=HatchCloseAnim_4

Animation9=VDS_Extend
Animation10=VDS_Retract

[HatchOpenAnim_1]
NumberOfSequencesToPlay=1
Sequence1=HatchOpenAnimSequence
Sequence1_Model=Missile_Hatch_1

[HatchOpenAnim_2]
NumberOfSequencesToPlay=1
Sequence1=HatchOpenAnimSequence
Sequence1_Model=Missile_Hatch_2

[HatchOpenAnim_3]
NumberOfSequencesToPlay=1
Sequence1=HatchOpenAnimSequence
Sequence1_Model=Missile_Hatch_3

[HatchOpenAnim_4]
NumberOfSequencesToPlay=1
Sequence1=HatchOpenAnimSequence
Sequence1_Model=Missile_Hatch_4

[HatchCloseAnim_1]
NumberOfSequencesToPlay=1
Sequence1=HatchCloseAnimSequence
Sequence1_Model=Missile_Hatch_1

[HatchCloseAnim_2]
NumberOfSequencesToPlay=1
Sequence1=HatchCloseAnimSequence
Sequence1_Model=Missile_Hatch_2

[HatchCloseAnim_3]
NumberOfSequencesToPlay=1
Sequence1=HatchCloseAnimSequence
Sequence1_Model=Missile_Hatch_3

[HatchCloseAnim_4]
