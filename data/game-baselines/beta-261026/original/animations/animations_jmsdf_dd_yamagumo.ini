[Animations]
NumberOfAnimations=2
Animation1=VDS_Extend
Animation2=VDS_Retract

[VDS_Extend]
NumberOfSequencesToPlay=5
Sequence1=Door_Open
Sequence1_Model=VDS_Door_L
Sequence2=Door_Open
Sequence2_Model=VDS_Door_R
Sequence3=Winch_Extend
Sequence3_Model=VDS_Winch
Sequence4=Actuator_Extend
Sequence4_Model=VDS_Actuator
Sequence5=Cradle_Extend
Sequence5_Model=VDS_Cradle

[VDS_Retract]
NumberOfSequencesToPlay=5
Sequence1=Door_Close
Sequence1_Model=VDS_Door_L
Sequence2=Door_Close
Sequence2_Model=VDS_Door_R
Sequence3=Winch_Retract
Sequence3_Model=VDS_Winch
Sequence4=Actuator_Retract
Sequence4_Model=VDS_Actuator
Sequence5=Cradle_Retract
Sequence5_Model=VDS_Cradle

############################################################
# Deploy VDS
############################################################

[Door_Open]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationZ1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
RotationZ2=-90
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Winch_Extend]
NumberOfSteps=2
Time1=5                // time in seconds for the start
PositionZ1=-0.735
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=10                // time in seconds - here for the end
PositionZ2=-0.782
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Actuator_Extend]
NumberOfSteps=2
Time1=10                // time in seconds for the start
RotationX1=7.5
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=15               // time in seconds - here for the end
RotationX2=-30
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Cradle_Extend]
NumberOfSteps=2
Time1=10                // time in seconds for the start
RotationX1=35
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=15                // time in seconds - here for the end
RotationX2=30
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

############################################################
# Retract VDS
############################################################

[Cradle_Retract]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=30
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
RotationX2=35
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Actuator_Retract]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=-30
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5               // time in seconds - here for the end
RotationX2=7.5
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Winch_Retract]
NumberOfSteps=2
Time1=5                // time in seconds for the start
PositionZ1=-0.782
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=10                // time in seconds - here for the end
PositionZ2=-0.735
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Door_Close]
NumberOfSteps=2
Time1=10                // time in seconds for the start
RotationZ1=-90
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=15                // time in seconds - here for the end
RotationZ2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry