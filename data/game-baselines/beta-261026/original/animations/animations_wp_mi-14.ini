[Animations]
NumberOfAnimations=4
Animation1=WeaponsBay_OpenAnim
Animation2=WeaponsBay_CloseAnim
Animation3=Gear_Extend
Animation4=Gear_Retract

[WeaponsBay_OpenAnim]
NumberOfSequencesToPlay=2
Sequence1=BayOpenDoorLAnimSequence
Sequence1_Model=Left_Bay_Door
Sequence2=BayOpenDoorRAnimSequence
Sequence2_Model=Right_Bay_Door

[WeaponsBay_CloseAnim]
NumberOfSequencesToPlay=2
Sequence1=BayCloseDoorLAnimSequence
Sequence1_Model=Left_Bay_Door
Sequence2=BayCloseDoorRAnimSequence
Sequence2_Model=Right_Bay_Door

[Gear_Extend]
NumberOfSequencesToPlay=6
Sequence1=Gear_Door_Open
Sequence1_Model=Left_Gear_Door
Sequence2=Gear_Door_Open
Sequence2_Model=Right_Gear_Door
Sequence3=Forward_Gear_Extend
Sequence3_Model=Left_Nose_Gear
Sequence4=Forward_Gear_Extend
Sequence4_Model=Right_Nose_Gear
Sequence5=Rear_Gear_Extend
Sequence5_Model=Left_Main_Gear
Sequence6=Rear_Gear_Extend
Sequence6_Model=Right_Main_Gear

[Gear_Retract]
NumberOfSequencesToPlay=6
Sequence1=Gear_Door_Close
Sequence1_Model=Left_Gear_Door
Sequence2=Gear_Door_Close
Sequence2_Model=Right_Gear_Door
Sequence3=Forward_Gear_Retract
Sequence3_Model=Left_Nose_Gear
Sequence4=Forward_Gear_Retract
Sequence4_Model=Right_Nose_Gear
Sequence5=Rear_Gear_Retract
Sequence5_Model=Left_Main_Gear
Sequence6=Rear_Gear_Retract
Sequence6_Model=Right_Main_Gear
#-------------------------------------------------- Open Bay Doors --------------------------------------------------
[BayOpenDoorLAnimSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationZ1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1            // time in seconds - here for the end
RotationZ2=-90
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[BayOpenDoorRAnimSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationZ1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1            // time in seconds - here for the end
RotationZ2=90
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

#-------------------------------------------------- Close Bay Doors --------------------------------------------------
[BayCloseDoorLAnimSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationZ1=-90
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1            // time in seconds - here for the end
RotationZ2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[BayCloseDoorRAnimSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationZ1=90
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1            // time in seconds - here for the end
RotationZ2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry


[Gear_Door_Open]
NumberOfSteps=2
Step1=0|x,y,z|0,0,0|Linear
Step2=5|x,y,z|-105,0,0|Linear

[Forward_Gear_Extend]
NumberOfSteps=2
Step1=3|x,y,z|x,-90,110|Linear
Step2=8|x,y,z|x,-90,0|Linear

[Rear_Gear_Extend]
NumberOfSteps=2
Step1=3|x,y,z|x,-90,-75|Linear
Step2=8|x,y,z|x,-90,0|Linear


[Gear_Door_Close]
NumberOfSteps=2
Step1=3|x,y,z|-105,0,0|Linear
Step2=8|x,y,z|0,0,0|Linear

[Forward_Gear_Retract]
NumberOfSteps=2
Step1=0|x,y,z|x,-90,0|Linear
Step2=5|x,y,z|x,-90,110|Linear

[Rear_Gear_Retract]
NumberOfSteps=2
Step1=0|x,y,z|x,-90,0|Linear
Step2=5|x,y,z|x,-90,-75|Linear