[Animations]
NumberOfAnimations=2
Animation1=SA-N-9_HatchOpenAnim_1
Animation2=SA-N-9_HatchCloseAnim_1


[SA-N-9_HatchOpenAnim_1]
NumberOfSequencesToPlay=1
Sequence1=SA-N-9_OpenHatchSequence
Sequence1_Model=SA-N-9_Bin_1_Hatch

[SA-N-9_HatchCloseAnim_1]
NumberOfSequencesToPlay=1
Sequence1=SA-N-9_CloseHatchSequence
Sequence1_Model=SA-N-9_Bin_1_Hatch

# open sequences

[SA-N-9_OpenHatchSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionY1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1                // time in seconds - here for the end
PositionY2=0.007
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

# close sequences

[SA-N-9_OpenHatchSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionY1=0.007
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1                // time in seconds - here for the end
PositionY2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry
