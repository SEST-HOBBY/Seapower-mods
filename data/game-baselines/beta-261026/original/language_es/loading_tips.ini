[LoadingTips]
Count=12
Header=CONSEJO
Tip001=Los misiles Harpoon y Tomahawk antibuque no evitan el terreno. Confirme una trayectoria despejada antes de disparar.
Tip002=Las formaciones dispersas son más difíciles de interpretar para el enemigo en el Radar.
Tip003=Los misiles estándar pueden utilizarse en enfrentamientos de superficie con línea de visión y son más fiables que los Harpoon en este cometido.
Tip004=Los helicópteros SH-2F proporcionan Radar de búsqueda de superficie aerotransportado para los buques escolta de la Armada de los EE. UU. Pueden detectar contactos de superficie más allá del alcance del Radar del buque, pero no pueden buscar aeronaves.
Tip005=Los destructores clase Sovremenny portan el SS-N-22 Sunburn. Este es el misil antibuque más capaz de la época, pero está limitado por su alcance de 48 mn.
Tip006=Las fragatas clase Udaloy portan el sistema SAM SA-N-9, que es especialmente efectivo contra misiles de vuelo a ras de mar como el Harpoon y el Exocet.
Tip007=La interferencia de aeronaves reducirá significativamente la efectividad de las defensas aéreas enemigas.
Tip008=El arma antisubmarina SS-N-14A (Metel) es portada por los buques antisubmarinos clase Krivak y Kresta II. El SS-N-14B (Rastrub) añade una capacidad antibuque secundaria y está instalado en las clases Krivak II, Kara y Udaloy, con un alcance de 27 mn.
Tip009=Pulse Tab para maximizar rápidamente la Pantalla Táctica (mapa).
Tip010=Pulse Z para usar prismáticos, optrónica o periscopios desde las unidades compatibles.
Tip011=Utilice las herramientas de mapa para dibujar el alcance máximo de los SAM y misiles antibuque de las unidades enemigas identificadas.
Tip012=Mantenga pulsada la tecla Alt mientras pasa el ratón sobre un arma en la barra inferior para mostrar sus arcos de tiro en el mapa táctico y en la vista 3D.