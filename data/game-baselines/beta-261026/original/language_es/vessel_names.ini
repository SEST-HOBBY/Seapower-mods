[usn_phm_pegasus]
Type=PTG,Lancha Misilera
Default=clase Pegasus,Pegasus
DefaultDescription=Originalmente concebidos como un gran proyecto multinacional de la OTAN para contrarrestar a las FAC soviéticas (como la clase Osa), los hidroalas clase Pegasus podían alcanzar velocidades de hasta 50 nudos y portaban ocho misiles RGM-84 Harpoon, junto con un cañón de 76mm a proa. Tras importantes problemas de desarrollo y gastos, solo se construyeron seis de estos buques únicos. En servicio, realizaron misiones antinarcóticos desde la Estación Aeronaval de Cayo Hueso en Florida, sin llegar nunca a utilizarse para su cometido original de contrarrestar a las lanchas misileras del Pacto de Varsovia en los litorales de la OTAN.
