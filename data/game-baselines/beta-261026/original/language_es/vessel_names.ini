DefaultDescription=El buque de carga clase Qiongsha es una clase de buques chinos armados de carga y transporte de tropas para la PLAN, derivados de diseños de buques de transporte civil. Su versatilidad se manifiesta en sus numerosos roles en servicio, desde transporte de tropas hasta buques de suministro, e incluso desempeñando un papel de buque hospital auxiliar en el mar, siendo buques auxiliares valiosos para la PLAN.
