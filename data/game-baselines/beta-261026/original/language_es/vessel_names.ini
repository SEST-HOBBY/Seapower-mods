DefaultDescription=Aumentando y luego reemplazando a la clase Uzushio, la clase Yushio es la tercera serie de submarinos de flota de la JMSDF tras la Segunda Guerra Mundial. Actualizaron el casco en forma de gota o Albacore de la clase anterior y tuvieron un mejor rendimiento, convirtiéndolos en buques potentes, modernos y casi silenciosos. Diez buques de la clase fueron construidos en dos tandas y sirvieron desde principios de los años 80 hasta finales de los años 2000.
