DefaultDescription=Los petroleros tipo T2 fueron construidos en gran número por los Estados Unidos durante la Segunda Guerra Mundial. Después de la guerra, algunos de los petroleros supervivientes fueron convertidos para uso comercial, mientras que otros fueron modernizados y continuaron sirviendo en la Armada.
