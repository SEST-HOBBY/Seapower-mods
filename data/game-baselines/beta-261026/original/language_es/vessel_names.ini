[usn_ssn_los_angeles]
Type=SSN,Submarino Nuclear de Ataque
Default=clase Los Angeles Flight 1,L.A. Flt1
DefaultDescription=Una gran y poderosa clase de submarinos nucleares de ataque, la clase Los Angeles fue diseñada para proporcionar escolta antisubmarina a grupos de portaaviones. Estos submarinos son silenciosos y están equipados con complejos sistemas digitales de control de tiro y seguimiento, diseñados desde el principio para portar el sonar digital BQQ-5 y el Sonar Remolcado TB-16. Más adelante en su vida operativa recibieron (o fueron construidos con) la capacidad de disparar misiles Harpoon y Tomahawk tanto en versión antibuque como de ataque a tierra.
