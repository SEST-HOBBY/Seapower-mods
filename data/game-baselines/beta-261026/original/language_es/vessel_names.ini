[****************************** Japan ******************************]
[jmsdf_ddh_haruna]
Type=DDH,Destructor
Default=clase Haruna,Haruna
DefaultDescription=Demostrando el enfoque casi exclusivo de la JMSDF en la guerra antisubmarina, dos de los destructores clase Haruna fueron construidos a principios de la década de 1970. El armamento principal de estos buques es el trío de helicópteros ASW HSS-2 (un SH-3 construido bajo licencia) en su hangar. Sus otros sistemas son similares a los de la clase Takatsuki, un poco anterior.
Variant1=Haruna DDH-141,Haruna
Variant2=Hiei DDH-142,Hiei

[jmsdf_ddg_tachikaze]
Type=DDG,Destructor de Misiles Guiados
Default=clase Tachikaze,Tachikaze
DefaultDescription=Construidos tras la experiencia de la JMSDF con el Amatsukaze, tres de estos pequeños DDG sirvieron desde mediados hasta finales de la década de 1970 y hasta principios de la década de 2010. Al igual que la mayoría de los buques de guerra japoneses de la década de 1970, su función principal es la guerra antisubmarina, pero están equipados con el mismo lanzador Mk 13 "One Armed Bandit" que la clase Oliver-Hazard Perry, lo que les otorga una capacidad antiaérea relativamente potente.
Variant1=Tachikaze DDG-168,Tachikaze
Variant2=Asakaze DDG-169,Asakaze
Variant3=Sawakaze DDG-170,Sawakaze

[jmsdf_dd_minegumo]
Type=DD,Destructor
Default=clase Minegumo,Minegumo
DefaultDescription=Tres de estos destructores de guerra antisubmarina fueron construidos para la JMSDF a finales de la década de 1960, un desarrollo de la clase Yamagumo. Estos buques fueron equipados para manejar el helicóptero no tripulado antisubmarino QH-50D DASH a expensas del lanzador de cohetes ASROC. El QH-50 no fue un gran éxito y las instalaciones para él fueron finalmente eliminadas, recuperando estos buques un lanzador ASROC en la década de 1980. El resto de la batería consistía en torpedos y un lanzacohetes ASW de fabricación sueca.
Variant1=Minegumo DD-116,Minegumo
Variant2=Natsugumo DD-117,Natsugumo
Variant3=Murakumo DD-118,Murakumo

[jmsdf_dd_takatsuki]
Type=DD,Destructor
Default=clase Takatsuki,Takatsuki
DefaultDescription=Estos son típicos buques de guerra japoneses con una pesada batería ASW que consiste en ASROC y un lanzacohetes ASW de fabricación sueca. Tienen un armamento de cañones pesado, pero por lo demás carecen de capacidades ASuW y AAW, en línea con el énfasis casi total de la Fuerza Marítima de Autodefensa de Japón en la guerra antisubmarina. Cuatro buques de la clase Takatsuki sirvieron desde mediados de la década de 1960 hasta principios de la década de 2000.
Variant1=Takatsuki DD-164,Takatsuki
Variant2=Kikuzuki DD-165,Kikuzuki
Variant3=Mochizuki DD-166,Mochizuki
Variant4=Nagatsuki DD-167,Nagatsuki

[jmsdf_dd_yamagumo]
Type=DD,Destructor
Default=Clase Yamagumo,Yamagumo
DefaultDescription=Seis de estos destructores ligeros fueron construidos en dos tandas para la JMSDF. Son típicos de los primeros buques de guerra japoneses con una batería ASW pesada que consiste en ASROC y un lanzacohetes ASW de fabricación sueca. A diferencia de algunos buques más grandes posteriores, estos barcos solo llevan el cañón estadounidense de 3"/50 como arma de superficie.
Variant1=Yamagumo DD-113,Yamagumo
Variant2=Makigumo DD-114,Makigumo
Variant3=Asagumo DD-115,Asagumo
Variant4=Aokumo DD-119,Aokumo
Variant5=Akigumo DD-120,Akigumo
Variant6=Yugumo DD-121,Yugumo

[jmsdf_ss_asashio]
Type=SS,Submarino de Patrulla
Default=Clase Asashio,Asashio
DefaultDescription=La clase Asashio se considera generalmente la primera clase de submarinos de flota construidos para la JMSDF en el período posterior a la Segunda Guerra Mundial, entrando en servicio a finales de los años 60. Estos buques extendieron el alcance de las fuerzas submarinas de la JMSDF de vuelta a alta mar, y fueron diseñados específicamente para tener buenas cualidades marineras con un gran almacenamiento de torpedos. Su maquinaria era totalmente de fabricación japonesa y permanecieron en servicio hasta mediados de los años 80.
Variant1=SS-562 Asashio,Asashio
Variant2=SS-563 Harushio,Harushio
Variant3=SS-564 Michishio,Michishio
Variant4=SS-565 Arashio,Arashio

[jmsdf_ss_uzushio]
