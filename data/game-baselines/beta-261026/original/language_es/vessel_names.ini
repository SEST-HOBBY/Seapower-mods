DefaultDescription=La clase Uzushio fue la segunda generación de submarinos de flota de la JMSDF tras la Segunda Guerra Mundial, introduciendo el casco en forma de gota de agua estilo Albacore en la JMSDF. Siete de estos submarinos en tres tandas fueron introducidos en la JMSDF a principios de los años 70 y sirvieron hasta mediados de los años 90.
