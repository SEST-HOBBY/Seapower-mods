DefaultDescription=En 1971, Estados Unidos transfirió dos escoltas oceánicos de piquete radar de la clase Edsall a la Marina de Vietnam del Sur (RVNN). Estos barcos fueron los buques de superficie más grandes operados por la RVNN, estando en servicio hasta 1975, cuando cayó Vietnam del Sur. De los dos barcos en servicio, el Trần Khánh Dư (HQ-4) fue capturado por los norvietnamitas en el astillero naval de Saigón, mientras que el Trần Hưng Đạo (HQ-1) escapó a Filipinas, donde entró en servicio como BRP Rajah Lakandula (PF-4). Nota: estos barcos están representados en Sea Power por una versión modificada del destructor clase Gearing, con un armamento equivalente al de las fragatas vietnamitas de la época.
