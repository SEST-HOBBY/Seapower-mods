[plan_ff_chengdu]
Type=FF,Fragata
Default=clase Chengdu,Chengdu
DefaultDescription=Desarrollada a partir de la fragata ASW soviética clase Riga proporcionada a la RPC antes de la ruptura sino-soviética. La clase Chengdu mejora la capacidad de guerra de superficie sustituyendo los tubos lanzatorpedos triples originales por un lanzador doble para el misil Safflower, derivado del Styx. La capacidad ASW es muy débil, comprendiendo solo morteros ASW dobles RBU-1200. Esta clase forma la base a partir de la cual han evolucionado todas las fragatas posteriores de la PLAN.
Variant1=Kunming FF-505,Kunming
Variant2=Chengdu FF-506,Chengdu
Variant3=Guiyang FF-507,Guiyang
Variant4=Hengyang FF-508,Hengyang

[plan_ff_jianghu1]
Type=FFG,Fragata
Default=clase Jianghu I,Jianghu I
DefaultDescription=Estos barcos son los sucesores de la clase Chengdu, y mejoran principalmente la capacidad de guerra de superficie duplicando la dotación de misiles a cuatro SSM CSS-N-2 Safflower. El armamento AAW mejora marginalmente al montar 6 afustes de 37mm en comparación con solo 2 en el Chengdu. La capacidad ASW sigue siendo muy débil, comprendiendo solo morteros ASW dobles FQF-1200 y lanzadores de cargas de profundidad.
Variant1=Changde FF-509,Changde
Variant2=Shaoxing FF-510,Shaoxing
