DefaultDescription=Diseñados a principios de la Segunda Guerra Mundial, 32 destructores clase C fueron botados entre 1943 y 1945. El diseño se basó principalmente en el diseño de la clase J de antes de la guerra para permitir una construcción rápida. Cuatro de esta clase llegaron a Pakistán, donde sirvieron en las guerras indo-pakistaníes.
Variant1=PNS Alamgir,Alamgir
Variant2=PNS Shah Jahan,Shah
Variant3=PNS Taimur,Taimur
Variant4=PNS Jahangir,Jahangir
Variant5=Crescent,Crescent

[rn_dd_z-class]
Type=DD,Destructor
Default=clase Z,clase Z
DefaultDescription=Contemporánea a grandes rasgos con la clase Battle, y muy similar a la clase C, la clase Z fue una clase de 8 destructores botados entre 1943 y 1945. El diseño se basó principalmente en los diseños anteriores de las clases U y V para permitir una construcción rápida. Después de la Segunda Guerra Mundial, 4 de ellos fueron vendidos a Israel y Egipto y otros fueron desguazados.
Variant1=INS Eilat,Eilat
Variant2=INS Yaffo,Yaffo
Variant3=ENS El Qaher,Qaher
Variant4=ENS El Fateh,Fateh
Variant5=Zest,Zest

