[usn_avp_barnegat]
Type=FF,Fragata
Default=clase Barnegat,Barnegat
DefaultDescription=Desarrollada durante la Segunda Guerra Mundial como un pequeño buque auxiliar de hidroaviones para la Marina de los EE. UU., la clase Barnegat quedó rápidamente obsoleta gracias al declive de los hidroaviones después de la guerra. Como resultado, muchos fueron dados de baja. Sin embargo, los que permanecieron en servicio pasaron a convertirse en buques de reconocimiento o buques de patrulla y/o entrenamiento en armadas extranjeras como Etiopía, Italia, Noruega, Vietnam del Sur y Filipinas. Dieciocho también fueron transferidos a la Guardia Costera de los EE. UU., donde se convirtieron en el patrullero clase Casco.
Variant1=Trần Quang Khải HQ-02,HQ-02
Variant2=Trần Nhật Duật HQ-03,HQ-03
