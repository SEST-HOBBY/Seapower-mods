[usn_cgn_alaska]
Type=CGN,Crucero de Misiles Guiados
Default=clase Alaska,Alaska
DefaultDescription=El CGN clase Alaska es la clase de CGN más grande de la Armada de los EE. UU. hasta la fecha; derivado del programa CSGN de finales de la década de 1970, incluye el nuevo sistema de armas AEGIS con misiles SM-2MR, misiles de crucero Tomahawk, el cañón Mk 71 de 8 pulgadas para apoyo de fuego naval y un hangar muy espacioso para operar helicópteros grandes o aeronaves VTOL especiales. Comparado con la clase Ticonderoga, la clase Alaska tiene mayor protección de blindaje y una profundidad de santabárbara significativamente mayor con todos sus sistemas de armas. Esta clase se incluye en Sea Power como un interesante escenario hipotético.
Variant1=Alaska CGN-42,Alaska
Variant2=Hawaii CGN-43,Hawaii
Variant3=Puerto Rico CGN-44,Puerto Rico
Variant4=Samoa CGN-45,Samoa

[usn_cgn_california]
Type=CGN,Crucero de Misiles Guiados
Default=clase California,California
DefaultDescription=Los dos cruceros clase California fueron comisionados en la USN entre 1974 y 1975, sirviendo como escoltas ideales para fuerzas de tarea de portaaviones rápidos con su alcance efectivamente ilimitado. Diseñados desde cero en torno a la propulsión nuclear, estos buques fueron descritos como las primeras unidades de superficie de propulsión nuclear destinadas a la producción en serie (frente a los precedentes Long Beach, Bainbridge y Truxtun, todos buques singulares). La construcción resultó muy costosa, y las unidades siguientes fueron canceladas en favor de los posteriores cruceros clase Virginia. En servicio, fueron buques capaces que montaban lanzadores de misiles Mark 13 a proa y popa y cañones de 5", con un lanzador ASROC y recargas a proa. Las reformas a principios de los 80 añadieron el CIWS Phalanx y actualizaron la suite de guerra electrónica al AN/SLQ-32(V)3. Ambos buques fueron retirados a finales de los 90, a pesar de las costosas reformas de reabastecimiento de combustible emprendidas solo unos años antes.
Variant1=California CGN-36,California
Variant2=South Carolina CGN-37,South Carolina

[usn_cgn_virginia]
Type=CGN,Crucero de Misiles Guiados
Default=clase Virginia,Virginia
DefaultDescription=Cuatro clase Virginia fueron comisionados para la USN entre 1976 y 1980, estos buques de más de 10000 toneladas eran de doble extremo tanto para misiles como para cañones de calibre medio. Son extremadamente caros de operar pero muy potentes. A mediados de la década de 1980, los cuatro buques fueron actualizados para llevar lanzadores Tomahawk ABL (reemplazando el hangar de helicópteros) y fueron equipados con CIWS Phalanx y SM-2MR bajo el estándar CG/SM-2, siendo la única clase de buque armado con Tartar en ser equipada con SM-2 antes del programa NTU.
Variant1=Virginia CGN-38,Virginia
Variant2=Texas CGN-39,Texas
Variant3=Mississippi CGN-40,Mississippi
Variant4=Arkansas CGN-41,Arkansas

[usn_cgn_long_beach_73]
Type=CGN,Crucero de Misiles Guiados
Default=clase Long Beach,Long Beach
DefaultDescription=El Long Beach fue concebido como escolta para el portaaviones de propulsión nuclear Enterprise. Tiene gran parte del mismo equipo de sensores que conduce a la apariencia de 'cubo', y una potente batería antiaérea que consiste en lanzadores gemelos Terrier y un lanzador Talos.
Variant1=Long Beach CGN-9,Long Beach

[usn_cgn_long_beach_83]
Type=CGN,Crucero de Misiles Guiados
Default=clase Long Beach,Long Beach
DefaultDescription=El Long Beach fue concebido como escolta para el portaaviones de propulsión nuclear Enterprise. En los años 80, el Radar SCANFAR y el sistema SAM Talos fueron eliminados y reemplazados por radares convencionales y CIWS Phalanx, misiles Harpoon y Tomahawk, otorgándole una capacidad de ataque a tierra.
Variant1=Long Beach CGN-9,Long Beach

[usn_clg_oklahoma_city]
Type=CLG,Crucero de Misiles Guiados
Default=clase Galveston,Galveston
DefaultDescription=Tres cruceros ligeros clase Cleveland fueron convertidos en los cruceros de misiles clase Galveston a finales de la década de 1950. Se sometieron a una modificación significativa en la estructura de popa para eliminar las torretas e instalar un lanzador para el misil Talos.
Variant1=Galveston CLG-3,Galveston
Variant2=Little Rock CLG-4,Little Rock
Variant3=Oklahoma City CLG-5,OK City

[usn_cv_forrestal_75]
Type=CV,Portaaviones
Default=clase Forrestal,Forrestal
DefaultDescription=Considerada la primera clase de superportaaviones, cuatro de los portaaviones de propulsión convencional clase Forrestal fueron construidos a finales de la década de 1950. Estos buques eran extremadamente grandes para su época y transportaban grupos aéreos masivos.
Variant1=Forrestal CV-59,Forrestal
Variant2=Saratoga CV-60,Saratoga
Variant3=Ranger CV-61,Ranger
Variant4=Independence CV-62,Independence

[usn_cv_america_79]
Type=CV,Portaaviones
Default=clase America,America
DefaultDescription=Tres portaaviones clase Kitty Hawk (más un desarrollo de los mismos) fueron construidos para la USN a principios de la década de 1960. Estos buques son en cierto nivel un desarrollo de los superportaaviones clase Forrestal. Estos barcos fueron equipados originalmente con sistemas para operar el SAM Terrier, pero estos fueron eliminados más tarde. El USS America es una ligera modificación de las dos plataformas originales y generalmente se considera uno de los tres Kitty Hawks.
Variant1=America CV-66,America

[usn_cv_kitty_hawk]
Type=CV,Portaaviones
Default=clase Kitty Hawk,Kitty Hawk
DefaultDescription=Tres portaaviones clase Kitty Hawk (más un desarrollo de los mismos) fueron construidos para la USN a principios de la década de 1960. Estos buques son en cierto nivel un desarrollo de los superportaaviones clase Forrestal. Estos barcos fueron equipados originalmente con sistemas para operar el SAM Terrier, pero estos fueron eliminados más tarde.
Variant1=Kitty Hawk CV-63,Kitty Hawk
Variant2=Constellation CV-64,Constellation

[usn_cvn_enterprise]
Type=CVN,Portaaviones
Default=clase Enterprise,Enterprise
DefaultDescription=El primer portaaviones de propulsión nuclear en la Armada de los EE. UU., el USS Enterprise fue planeado originalmente como el primero de seis barcos, pero sus gemelos fueron cancelados debido al costo. En consecuencia, tuvo una serie de características únicas entre todos los portaaviones de la Guerra Fría. Esto incluía el temperamental, pero extremadamente capaz radar de fase SCANFAR, que podía mejorar enormemente la cobertura de escaneo de un grupo de batalla. Al mismo tiempo, recibió una modesta suite de misiles defensivos, que consistía en dos lanzadores Mk.26 que llevaban misiles Sparrow III. En la mayoría de los demás aspectos, como la capacidad del grupo aéreo y las operaciones, es esencialmente igual que otros superportaaviones como la posterior clase Nimitz.
Variant1=Enterprise CVN-65,Enterprise

[usn_cvn_nimitz]
Type=CVN,Portaaviones
Default=clase Nimitz,Nimitz
DefaultDescription=Los buques de guerra más grandes en servicio en la USN durante la Guerra Fría, la clase Nimitz es un superportaaviones de propulsión nuclear que desplaza más de 100000 toneladas. Estos buques son una de las formas más amenazantes que tiene la USN para proyectar poder lejos de la costa estadounidense.
Variant1=Nimitz CVN-68,Nimitz
Variant2=Dwight D. Eisenhower CVN-69,Eisenhower
#Variant3=Carl Vinson CVN-70,Vinson

