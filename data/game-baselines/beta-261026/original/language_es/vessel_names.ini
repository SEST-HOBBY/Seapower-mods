[plan_ff_jianghu3]
Type=FF,Fragata
Default=clase Jianghu III,Jianghu III
DefaultDescription=Estos barcos son los primeros buques de guerra modernos construidos por China, caracterizados por una superestructura cerrada con aire acondicionado y protección NBQ, además de un armamento de misiles antisuperficie mucho más potente. La capacidad ASW sigue siendo muy débil, consistiendo solo en morteros ASW orientables dobles FQF-1200D.
Variant1=Huangshi FF-535,Huangshi
Variant2=Wuhu FF-536,Wuhu
