[usn_bb_iowa]
Type=BB,Acorazado
Default=clase Iowa,Iowa
DefaultDescription=El Iowa es una clase de acorazados de los Estados Unidos. Fueron diseñados como acorazados "rápidos", capaces de depender de una mezcla equilibrada de velocidad y potencia de fuego, y capaces de navegar a la misma velocidad que la fuerza de portaaviones. Durante su modernización en la década de 1980, los Iowa fueron equipados con cuatro montajes CIWS Phalanx, así como lanzadores de misiles Harpoon y Tomahawk.
Variant1=Iowa BB-61,Iowa
Variant2=New Jersey BB-62,New Jersey
Variant3=Missouri BB-63,Missouri
Variant4=Wisconsin BB-64,Wisconsin

[usn_cg_belknap]
Type=CG,Crucero de Misiles Guiados
Default=clase Belknap,Belknap
DefaultDescription=Dentro de la década de entrar en servicio, la clase Belknap se sometió a una importante modernización que reemplazó un gran número de sus sistemas y reelaboró el armamento. El Radar fue actualizado al mucho más capaz AN/SPS-48, y el barco recibió el sistema de guerra electrónica AN/SLQ-32. El lanzador Mk 10 fue actualizado nuevamente, permitiéndole lanzar el misil Standard SM-2, y el barco recibió un CIWS y ocho tubos de lanzamiento Harpoon hacia la popa del buque, que reemplazaron el montaje de cañón de 3". Proporcionando un golpe efectivo en todas direcciones, permitió a los Belknap servir hasta las décadas de 1970 y 80 como un complemento efectivo a buques de guerra más nuevos como el crucero clase Ticonderoga.
Variant1=Josephus Daniels CG-27,Daniels
Variant2=Wainwright CG-28,Wainwright
Variant3=Jouett CG-29,Jouett
Variant4=Horne CG-30,Horne
Variant5=Sterett CG-31,Sterett
Variant6=William H. Standley CG-32,Standley
Variant7=Fox CG-33,Fox
Variant8=Biddle CG-34,Biddle

[usn_cg_belknap_72]
Type=DLG,Crucero de Misiles Guiados
Default=clase Belknap,Belknap
DefaultDescription=El destructor líder clase Belknap, fue concebido como una modificación relativamente limitada de la clase Charles Adams para tareas de escolta rápida. La diferencia más importante se logró mejorando el lanzador Mk.10 del Terrier para también disparar el ASROC, eliminando así la necesidad de un lanzador separado, además de alargar el casco en 14 pies. Gran parte del espacio se dedicó luego a crear una plataforma de aterrizaje que pudiera operar el helicóptero ASW no tripulado DASH. Además, los barcos recibieron sensores actualizados, como el Radar SPG-55B y el Sonar AN/SQS-26. Si bien son combatientes completos efectivos, generalmente deberían centrarse en amenazas submarinas, dada su impresionante capacidad de Sonar y ASW.
Variant1=Belknap DLG-26, Belknap
Variant2=Josephus Daniels DLG-27,Daniels
Variant3=Wainwright DLG-28,Wainwright
Variant4=Jouett DLG-29,Jouett
Variant5=Horne DLG-30,Horne
Variant6=Sterett DLG-31,Sterett
Variant7=William H. Standley DLG-32,Standley
Variant8=Fox DLG-33,Fox
Variant9=Biddle DLG-34,Biddle

[usn_cg_leahy]
Type=CG,Crucero de Misiles Guiados
Default=clase Leahy,Leahy
DefaultDescription=La clase Leahy se construyó a principios de la década de 1960 como una clase de 9 líderes de destructor (DLG), pero fueron reclasificados como cruceros en 1975. Estos buques poseen una configuración de doble extremo con lanzadores de misiles a proa y popa. La clase fue equipada originalmente con misiles Terrier pero más tarde convertida a misiles Standard. Estas plataformas son inusuales ya que no tienen un cañón de calibre medio, contando solo con dos montajes gemelos de 3"/50. Reformas posteriores reemplazaron estos cañones con lanzadores Harpoon, dejando a los buques sin armamento de artillería.
Variant1=Leahy CG-16,Leahy
Variant2=Harry E. Yarnell CG-17,Yarnell
