[usn_avp_barnegat_mod]
Type=FF,Fragata
Default=clase Barnegat (Modificada),Barnegat
DefaultDescription=Desarrollada durante la Segunda Guerra Mundial como un pequeño buque auxiliar de hidroaviones para la Marina de los EE. UU., la clase Barnegat quedó rápidamente obsoleta gracias al declive de los hidroaviones después de la guerra. Como resultado, muchos fueron dados de baja. Sin embargo, los que permanecieron en servicio pasaron a convertirse en buques de reconocimiento o buques de patrulla y/o entrenamiento en armadas extranjeras como Etiopía, Italia, Noruega, Vietnam del Sur y Filipinas. Dieciocho también fueron transferidos a la Guardia Costera de los EE. UU., donde se convirtieron en el patrullero clase Casco. En servicio filipino, estos barcos fueron modernizados con una cubierta de vuelo y soportes para misiles antibuque Harpoon, aunque nunca se instalaron en tiempos de paz, podrían montarse fácilmente al inicio de la guerra.
