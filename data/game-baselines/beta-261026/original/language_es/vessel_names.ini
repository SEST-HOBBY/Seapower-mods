DefaultDescription=La clase Oberon fue una serie de 27 submarinos de ataque y patrulla diésel-eléctricos de diseño británico, desarrollados como una continuación mejorada de la clase Porpoise, utilizando materiales de casco más resistentes y equipos modernizados. La Marina Real Australiana encargó seis submarinos de la clase Oberon en dos lotes, con modificaciones menores respecto al estándar de la Royal Navy, destacando principalmente el uso de armas estadounidenses como el torpedo Mark 37. La Marina Real Australiana inició un programa de modernización (SWUP) a finales de la década de 1970 para actualizar los sensores y armamento de los submarinos con el fin de afrontar las amenazas esperadas de la década de 1980 y posteriores. Esto incluyó torpedos Mark 48 de la USN, sonar pasivo de flanco MicroPUFFS y, finalmente, el misil Harpoon, y los seis buques fueron modernizados con estos sistemas para 1985.
