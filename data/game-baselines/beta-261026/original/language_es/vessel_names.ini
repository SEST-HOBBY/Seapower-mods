[usn_aoe_sacramento]
Type=AOE,Buque Auxiliar
Default=clase Sacramento,Sacramento
DefaultDescription=Cuatro buques de apoyo rápido de combate clase Sacramento fueron construidos entre 1961 y 1969 para la USN para realizar reabastecimiento en curso de combustible y suministros. Una combinación de petrolero auxiliar, buque de suministros refrigerados y buque de municiones, la clase Sacramento son buques rápidos diseñados para seguir el ritmo de los grupos de batalla.
Variant1=Sacramento AOE-1,Sacramento
