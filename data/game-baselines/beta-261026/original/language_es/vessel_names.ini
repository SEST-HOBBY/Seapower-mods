DefaultDescription=Alrededor de 50 de estos barcos fueron construidos como petroleros comerciales durante la década de 1950, algunos asignados a la Armada desde 1960. La clase guarda un gran parecido con los petroleros T-2 estadounidenses de la época de la guerra, pero fueron adaptados para el reabastecimiento en curso con un gran mástil de dos patas y grúas más pequeñas para el reabastecimiento de provisiones secas, mientras que el reabastecimiento de combustible se limita a un solo barco utilizando el ineficiente método de reabastecimiento por popa.
