[usn_cg_ticonderoga]
Type=CG,Crucero de Misiles Guiados
Default=clase Ticonderoga (Mk-26),Ticonderoga
DefaultDescription=Un diseño icónico e instantáneamente reconocible con sus 4 arrays PESA de panel plano SPY-1, los cruceros clase Ticonderoga son un desarrollo del destructor clase Spruance enfocado en guerra antiaérea y equipado con el nuevo sistema de gestión de combate AEGIS. Estos buques fueron pioneros en la técnica de construcción modular en EE. UU.
Variant1=Ticonderoga CG-47,Ticonderoga
