[wp_rkr_kirov]
Type=TARKR,Crucero de Misiles Guiados
Default=clase Kirov,Kirov
DefaultDescription=Conocidos por los soviéticos como Sea Eagle (Proyecto 1144), los clase Kirov son cruceros de misiles guiados masivos de propulsión nuclear. Con dimensiones similares a las de un acorazado de la Segunda Guerra Mundial, se encuentran entre los buques de combate de superficie más potentes jamás construidos, con dos de estos barcos construidos desde 1980 y otros dos en construcción. Su gran tamaño es necesario para acomodar una gran batería de misiles antibuque, así como un sistema SAM de defensa de área con varias defensas de punto como respaldo.\n\nAunque están equipados con Radar avanzado y armas ASW de largo alcance, estos barcos generalmente operan como buques insignia de grupos de combate de superficie protegidos por buques ASW dedicados.
Variant1=Kirov RKR-181,Kirov

[wp_rkr_kresta1]
Type=RKR,Crucero de Misiles Guiados
Default=clase Kresta,Kresta
DefaultDescription=El Proyecto 1134 Golden Eagle, o clase Kresta I, fue diseñado como un sucesor más grande y capaz de los cruceros de misiles clase Kynda, que resultaron ser demasiado pesados en la parte superior y con poco espacio. El Kresta I está destinado al papel antibuque, pero tiene capacidades mucho mejores para la guerra antiaérea y antisubmarina. Si se permite que estos barcos entren en las rutas de los convoyes del Atlántico Norte, podrían resultar una amenaza real para la OTAN como asaltantes.
Variant1=Admiral Zozulya RKR-060,Zozulya
Variant2=Vladivostok RKR-097,Vladivostok
Variant3=Vice-Admiral Drozd RKR-072,Drozd
Variant4=Sevastopol RKR-048,Sevastopol

