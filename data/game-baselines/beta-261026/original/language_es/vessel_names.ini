[plan_ffg_jiangdong]
Type=FF,Fragata
Default=clase Jiangdong,Jiangdong
DefaultDescription=Estos barcos son sucesores de la clase Chengdu, y fueron concebidos como escoltas de defensa aérea, empleando el SAM de corto alcance HQ-61 y montando 4 monturas dobles de 37mm en lugar de solo 2 en la Chengdu. La capacidad ASW sigue siendo muy débil, consistiendo solo en morteros ASW dobles FQF-1200 y lanzadores de cargas de profundidad.
Variant1=Yingtan FFG-531,Yingtan
Variant2=Zhongdong FFG-532,Zhongdong

[plan_k_type_037]
Type=FS,Corbeta
Default=Tipo 037 (Hainan),Hainan
DefaultDescription=Una clase prolífica de cazasubmarinos utilizada por la PLAN y otras muchas marinas, la clase Hainan (Tipo 037) es una corbeta pequeña, rápida y de gran autonomía que ha demostrado ser capaz de operar en aguas por todo el Pacífico Sur. Estos barcos cumplen una miríada de funciones, destacando principalmente como patrulleras cañoneras rápidas con capacidades ASW, y están equipadas con un armamento respetable para su tamaño. Esto, combinado con su sonar y morteros ASW, otorga a la clase Hainan capacidades polivalentes amplias, aunque su rendimiento ASW no es impresionante.
Variant1=Zhaoyuan 605,Zhaoyuan

[plan_lst_yukan]
Type=LST,Buque de Desembarco
Default=clase Yukan,Yukan
DefaultDescription=Los LST de la clase Yukan (Tipo 072) son la primera generación de nuevos buques de desembarco de tanques para la PLAN, y reemplazaron a los antiguos buques de desembarco estadounidenses de la era de la Segunda Guerra Mundial en la función de apoyo al asalto anfibio. Al igual que muchos otros buques de desembarco, estas unidades están armadas con cañones de calibre medio para defenderse y apoyar un desembarco anfibio, dado que estos barcos deben varar en la playa para desplegar vehículos desde la rampa delantera. Alternativamente, estos barcos pueden desplegar lanchas de desembarco y también pueden llevar una carga útil significativa en la cubierta.
Variant1=Yuntaishan LST-927,Yuntaishan
Variant2=Wufengshan LST-928,Wufengshan
Variant3=Zijinshan LST-929,Zijinshan

[plan_msc_type_010]
Type=MSO,Minador
Default=Tipo 010,Tipo 010
DefaultDescription=El minador de la clase Tipo 010 es un derivado chino del minador soviético de la clase T-43K, con potencia de fuego adicional de ametralladora. Estos buques son patrulleras numerosas, baratas y, lo más importante, efectivas para la PLAN debido a su mayor autonomía y comodidad para la tripulación en comparación con el diseño soviético original, además de un armamento más pesado.
Variant1=364,364

[plan_pt_shanghai2]
Type=PT,Patrullera
Default=clase Shanghai II,Shanghai II
DefaultDescription=La patrullera Shanghai II (Tipo 062) es una cañonera pequeña y fuertemente armada de corto alcance de la PLAN, adecuada para operaciones costeras y para enfrentarse a buques de guerra más pesados a pesar de su pequeño tamaño. Este es un lote temprano de cañoneras clase Shanghai II, con un mortero ASW y una pequeña superestructura.
Variant1=Shanghai II,Shanghai II

[plan_pt_shanghai2b]
Type=PT,Patrullera
Default=clase Shanghai IIB,Shanghai IIB
DefaultDescription=La patrullera Shanghai IIB (Tipo 062) es una cañonera pequeña y fuertemente armada de corto alcance de la PLAN, adecuada para operaciones costeras y para enfrentarse a buques de guerra más pesados a pesar de su pequeño tamaño. Este es un lote tardío de cañoneras clase Shanghai II, con una superestructura ampliada, reemplazando el mortero ASW.
Variant1=Shanghai IIB,Shanghai IIB

