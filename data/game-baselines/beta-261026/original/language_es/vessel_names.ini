[wp_takr_kiev]
Type=TAVKR,Portaaviones
Default=clase Kiev,Kiev
DefaultDescription=En servicio desde 1975, estos portaaviones V/STOL son el diseño sucesor de los cruceros-helicóptero clase Moskva. Destinados a la misión pro-submarina, estos barcos portan una impresionante gama de misiles antibuque y antiaéreos, además de extensas capacidades ASW. A diferencia de los portaaviones de la Marina de EE. UU., su principal fuerza ofensiva radica en su batería de misiles de crucero, y las aeronaves a bordo se utilizan principalmente para cobertura aérea. Estos barcos operan a menudo como buques insignia en grupos de ataque o de búsqueda y destrucción.
