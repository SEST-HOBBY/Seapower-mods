[****************************** Canada ******************************]
[rcn_ss_oberon]
Type=SS,Submarino de Patrulla
Default=clase Oberon (RCN),Oberon
DefaultDescription=La clase Oberon fue una serie de 27 submarinos de ataque y patrulla diésel-eléctricos de diseño británico, desarrollados como una continuación mejorada de la clase Porpoise, utilizando materiales de casco más resistentes y equipos modernizados. La Marina Real Canadiense encargó tres submarinos de la clase Oberon en dos lotes, con modificaciones menores respecto al estándar de la Royal Navy, destacando principalmente el uso de armas estadounidenses como el torpedo Mark 37. La Marina Real Canadiense inició un programa de modernización (SOUP) a finales de la década de 1970 para extender la vida útil de los buques hasta las décadas de 1980 y 1990, comenzando la actualización del primer buque en 1980. Esto añadió la capacidad para el Mark 48, aunque los torpedos Mark 48 no se entregaron hasta la década de 1990, por lo que se utilizó el torpedo interino Mk-37C/E durante el resto de la Guerra Fría.
Variant1=S72 Ojibwa,Ojibwa
Variant2=S73 Onondaga,Onondaga
Variant3=S74 Okanagan,Okanagan

[****************************** Australia ******************************]
[ran_ddg_perth]
Type=DDG,Destructor
Default=clase Perth,Perth
DefaultDescription=Cerca de 30 destructores de la clase Charles F Adams se construyeron a finales de la década de 1950 y principios de la de 1960 para la USN, la RAN (como clase Perth) y la Armada de Alemania Occidental (como clase Lütjens). Los destructores clase Adams fueron de los primeros buques equipados con misiles guiados en la USN, inicialmente armados con el Tartar. A mediados de la década de 1970, los clase Adams fueron actualizados con nuevos sistemas de armas y radares para soportar el misil Standard.
Variant1=Perth D-38,Perth
Variant2=Hobart D-39,Hobart
Variant3=Brisbane D-41,Brisbane

[ran_ffg_adelaide_shorthull]
Type=FFG,Fragata
Default=clase Adelaide (casco corto),Adelaide
DefaultDescription=La fragata de misiles guiados clase Adelaide es una serie de seis FFG en servicio australiano, y es una variante de la clase estadounidense Oliver Hazard Perry, con los cuatro primeros buques construidos en astilleros de EE. UU. Estas fragatas estuvieron en servicio con la Marina Real Australiana a partir de 1980 para compensar el fallido proyecto de destructor ligero de la década de 1970. Están construidas bajo un estándar muy similar a sus homólogos de la USN y, por tanto, incluyen un conjunto moderno de sistemas de guerra antiaérea, antibuque y antisubmarina (ASW). Los tres primeros buques se construyeron con la configuración de casco corto y carecen de Sonar Remolcado, además de no poder operar helicópteros LAMPS Mk.III, viéndose obligados a transportar el helicóptero no armado AS-350 para usos no de combate.
Variant1=Adelaide FFG-1,Adelaide
Variant2=Canberra FFG-2,Canberra
Variant3=Sydney FFG-3,Sydney

[ran_ss_oberon]
