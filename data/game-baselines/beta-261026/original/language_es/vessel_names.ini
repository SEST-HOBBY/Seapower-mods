[usn_ae_kilauea]
Type=AE,Buque Auxiliar
Default=clase Kilauea,Kilauea
DefaultDescription=Ocho buques de municiones clase Kilauea fueron construidos entre 1968 y 1972 para la USN para realizar reabastecimiento en curso. Inicialmente fueron buques de guerra comisionados, pero pasaron a la operación civil más tradicional para auxiliares a finales de la década de 1980.
