[plan_dd_luda1]
Type=DD,Destructor
Default=clase Luda I,Luda I
DefaultDescription=Desarrollados a partir de los destructores soviéticos clase Neustrashimy, los clase Luda fueron los primeros destructores de misiles guiados modernos construidos en China. Conocidos como Tipo 051 en el servicio de la PLAN, estos barcos estaban equipados con dos lanzadores triples para el misil antibuque HY-1A y se especializaron en guerra antisuperficie. Variantes posteriores mejoraron los sensores, sistemas de combate y armamento. Se construyeron diecisiete unidades de esta clase entre 1971 y 1990, constituyendo la mayor clase de combatientes de superficie de la PLAN.
Variant1=Guangzhou DD-160,Guangzhou
