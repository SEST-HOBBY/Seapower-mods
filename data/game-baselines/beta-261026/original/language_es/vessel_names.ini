[plan_ff_jianghu2]
Type=FF,Fragata
Default=clase Jianghu II,Jianghu II
DefaultDescription=Estos barcos son los sucesores de la clase Chengdu, y mejoran principalmente la capacidad de guerra de superficie al duplicar la dotación de misiles a cuatro SSM CSS-N-2 Safflower. La Jianghu II también sustituye las monturas dobles de 100mm en lugar de las monturas simples de 100mm de la Jianghu I, a costa de una reducida capacidad antiaérea al perder dos monturas de 37mm en el proceso para compensar los cañones más pesados. La capacidad ASW sigue siendo muy débil, consistiendo solo en morteros ASW dobles FQF-1200 y lanzadores de cargas de profundidad.
Variant1=Taizhou FF-533,Taizhou
