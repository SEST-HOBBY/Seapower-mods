# ----------------- Decoys ----------------
usn_an_slq_25_nixie_decoy=AN/SLQ-25,Nixie,Señuelo,El Nixie (formalmente AN/SLQ-25) es un sistema de señuelo remolcado utilizado principalmente por los buques de superficie de la USN. El sistema genera señales diseñadas para atraer a los torpedos que se aproximan lejos de la plataforma anfitriona.

usn_moss=MOSS,MK-70,Señuelo,El Mk 70 MOSS (Simulador Móvil de Submarino) es un señuelo de 10 pulgadas de diámetro utilizado para desviar el sonar enemigo lejos del submarino lanzador. El MOSS es capaz de simular el ruido propio de un submarino así como su sonar activo.

wp_mg-44=MG-44,Korund,Señuelo,El MG-44 Korund es un simulador de submarino hidroacústico autopropulsado de segunda generación. Está diseñado para ser lanzado desde tubos especiales de 400mm en submarinos soviéticos.
wp_mg-74=MG-74,Korund-2,Señuelo,El MG-74 Korund-2 es un simulador de submarino hidroacústico autopropulsado de tercera generación. A diferencia del anterior MG-44, puede lanzarse desde tubos estándar de 533mm e incluye capacidades altamente sofisticadas de generación de ruido, emisión engañosa o interferencia acústica, y también puede ser desplegado desde aeronaves.

