[AmmunitionNames]
# ------------------ AAM ------------------
it_aspide_1a=Aspide Mk.1A,,AAM,El misil Aspide es un misil aire-aire italiano de medio alcance, derivado del misil estadounidense Sparrow. Derivado del AIM-7E, este misil cuenta con un motor mejorado, que aumenta el alcance y la velocidad, y también presenta un cabezal buscador monopulso muy mejorado, lo que permite el disparo a baja altitud y avances en el rendimiento ECCM.

fr_r530em=R-530K (SARH),,SARH AAM,El R530K es un misil aire-aire francés de corto alcance semiactivo. Al ser uno de los primeros misiles aire-aire de origen francés, el R530 no es un arma particularmente fiable o potente, pero tiene un motor de combustión relativamente larga y un alcance decente para sus contemporáneos de la época.
fr_super-530f=Super-530F,,SARH AAM,El Super-530F es un misil aire-aire francés semiactivo de corto a medio alcance. Aproximadamente análogo al AIM-7, es una mejora respecto al misil R530 anterior.
fr_r550=R550,Magic 1,AAM,El R550 Magic 1 es un misil aire-aire francés de corto alcance con guiado infrarrojo, comparable al AIM-9 estadounidense. Solo es de aspecto trasero.

pla_pl-2=PL-2A,,IR AAM,El PL-2A (霹雳-2) es un misil aire-aire chino de corto alcance con guiado infrarrojo y aspecto trasero. Es una copia del Vympel K-13 soviético, con un rendimiento muy similar. Solo de aspecto trasero.
pla_pl-2b=PL-2B,,IR AAM,El PL-2B (霹雳-2) es un misil aire-aire chino de corto alcance con guiado infrarrojo y aspecto trasero. El PL-2B utiliza un cono de nariz más largo para albergar un buscador ligeramente mejorado, pero por lo demás es una mejora menor en fiabilidad en comparación con el PL-2A.
pla_pl-5b=PL-5B,,IR AAM,El PL-5B (霹雳-5) es un misil aire-aire chino de corto alcance con guiado infrarrojo y aspecto trasero. Desarrollado junto al PL-2B, el PL-5B nació del fallido misil PL-5A con guiado por Radar. Utiliza un buscador infrarrojo derivado del PL-2B, pero con una estructura más capaz en términos de alcance y rendimiento de giro. Solo de aspecto trasero.
pla_pl-5c=PL-5C,,IR AAM,El PL-5C (霹雳-5) es un misil aire-aire chino de corto alcance con guiado infrarrojo omnidireccional. Una mejora importante sobre la serie PL-2 y PL-5B, el PL-5C incorpora un buscador de matriz cruzada de vanguardia, que permite el disparo omnidireccional y un grado significativo de resistencia a contramedidas. También cuenta con un motor de combustión más larga y un mejor rendimiento de giro.

usaf_aim-9e=AIM-9E,Sidewinder,AAM,El AIM-9E Sidewinder es un misil aire-aire estadounidense con guiado infrarrojo. La versión Echo tiene un rendimiento significativamente mejorado en todas las áreas que las versiones anteriores, con una envolvente de adquisición mejorada y un mayor alcance. Solo de aspecto trasero.
usaf_aim-9j=AIM-9J,Sidewinder,AAM,El AIM-9J Sidewinder es un misil aire-aire estadounidense con guiado infrarrojo. La versión Juliet presenta cambios significativos respecto a la Echo, particularmente en los sistemas de control, con electrónica de estado sólido que reemplaza la antigua electrónica de tubos de vacío. La probabilidad de derribo mejora con respecto a versiones anteriores, pero sigue siendo solo de aspecto trasero.
usaf_aim-9p=AIM-9P,Sidewinder,AAM,El AIM-9P Sidewinder es un misil aire-aire estadounidense con guiado infrarrojo. El modelo Papa es la versión de exportación del modelo Juliet, y cuenta con una nueva espoleta, un nuevo motor, un buscador mejorado, y permite disparos de aspecto lateral, además de una mayor fiabilidad.

usn_aim-7d=AIM-7D,Sparrow,AAM,El AIM-7D Sparrow es un misil aire-aire estadounidense con guiado por Radar semiactivo. El Delta fue optimizado para mayores velocidades de cierre en comparación con el anterior Charlie.
Notable deficiencia contra blancos de baja cota y tiene un gran alcance mínimo.
usn_aim-7e=AIM-7E,Sparrow,AAM,El AIM-7E Sparrow es un misil aire-aire estadounidense con guiado por Radar semiactivo. El Echo tiene mayor alcance y rendimiento en comparación con las variantes anteriores.
Notable deficiencia contra blancos de baja cota y tiene un gran alcance mínimo.
usn_aim-7e2=AIM-7E-2,Sparrow,AAM,El AIM-7E-2 "Dogfight" Sparrow es un misil aire-aire estadounidense con guiado por Radar semiactivo. El Echo-2 es una subvariante del modelo Echo original, tras detectarse deficiencias en su rendimiento contra cazas en Vietnam. Presenta un menor alcance mínimo, un rendimiento ligeramente mejor a baja altitud y una mayor maniobrabilidad en la fase de aceleración del vuelo.
usn_aim-7e4=AIM-7E-4,Sparrow,AAM,El AIM-7E-4 Sparrow es un misil aire-aire estadounidense con guiado por Radar semiactivo. El Echo-4 es un modelo mejorado de la US Navy, para hacer uso de un Radar significativamente más potente que el de los cazas anteriores, y tiene características de buscador ligeramente mejoradas contra interferencias y contramedidas.
usn_aim-7f=AIM-7F,Sparrow,AAM,El AIM-7F Sparrow es un misil aire-aire estadounidense con guiado por Radar semiactivo. El Foxtrot es un rediseño de la estructura original del Sparrow III e incorpora un moderno motor de empuje sostenido para un mayor alcance, junto con una espoleta mejorada y un buscador más capaz, con mejoras de rendimiento en todos los aspectos.
A pesar de esto, su rendimiento a baja altitud y contra el ECCM aún no es excepcional, y su buscador no puede aprovechar al máximo el largo alcance de este misil.
usn_aim-7m=AIM-7M,Sparrow,AAM,El AIM-7M Sparrow es un misil aire-aire estadounidense con guiado por Radar semiactivo. El Mike es una mejora del modelo Foxtrot, con un cabezal buscador monopulso muy mejorado, que permite el disparo efectivo contra blancos que vuelan a ras del mar, y aumenta significativamente sus capacidades ECCM, junto con un aumento en el alcance efectivo debido al nuevo buscador.
usn_aim-9b=AIM-9B,Sidewinder,AAM,El AIM-9B Sidewinder es un misil aire-aire estadounidense con guiado infrarrojo. La Bravo fue la primera variante operativa de la serie AIM-9. En comparación con versiones posteriores, tiene una envolvente de lanzamiento estrecha y una tendencia a ser fácilmente engañado por otra fuente de calor como el sol. No hace falta decir que es solo de aspecto trasero.
usn_aim-9c=AIM-9C,Sidewinder,AAM,El AIM-9C Sidewinder es un misil aire-aire estadounidense con guiado por Radar semiactivo. El Charlie es el único modelo Sidewinder con guiado por Radar que entró en servicio, y es idéntico al modelo Delta excepto por el buscador por Radar semiactivo, que permite disparos omnidireccionales a mayores alcances. Al ser exclusivo para el F-8 de la Armada, y generalmente no apreciado por las tripulaciones, el AIM-9C fue retirado pocos años después de entrar en servicio.
usn_aim-9d=AIM-9D,Sidewinder,AAM,El AIM-9D Sidewinder es un misil aire-aire estadounidense con guiado infrarrojo. El Delta es una variante mejorada frente al Bravo, con un buscador mejorado, una ojiva mejorada y un mayor alcance. Solo de aspecto trasero.
usn_aim-9g=AIM-9G,Sidewinder,AAM,El AIM-9G Sidewinder es un misil aire-aire estadounidense con guiado infrarrojo. El Golf es una variante mejorada frente al Delta, con un mayor ángulo de disparo, y también fue exportado a otras naciones. Solo de aspecto trasero.
usn_aim-9h=AIM-9H,Sidewinder,AAM,El AIM-9H Sidewinder es un misil aire-aire estadounidense con guiado infrarrojo. El Hotel es una versión de estado sólido del modelo Golf y cuenta con un buscador más sensible que permite también disparos de aspecto lateral, además de una mejor maniobrabilidad y fiabilidad.
usn_aim-9l=AIM-9L,Sidewinder,AAM,El AIM-9L Sidewinder es un misil aire-aire estadounidense con guiado infrarrojo. La variante Lima fue el primer Sidewinder con la capacidad de atacar desde todas las direcciones. En comparación con todas las versiones anteriores, la envolvente de adquisición mejora enormemente, con la capacidad de atacar blancos de frente durante el encuentro. Sin embargo, un disparo de aspecto trasero todavía permite un mayor alcance de adquisición.
usn_aim-9m=AIM-9M,Sidewinder,AAM,El AIM-9M Sidewinder es un misil aire-aire estadounidense con guiado infrarrojo. La variante Mike es la versión más moderna en servicio, y es un modelo Lima con capacidades mejoradas de rechazo a Flares y un mayor alcance del buscador.
usn_aim-54a=AIM-54A,Phoenix,AAM,El AIM-54A Phoenix es un misil aire-aire estadounidense con guiado por Radar activo. Este es el misil aire-aire de mayor alcance en el inventario de EE. UU. y es exclusivo del F-14. Integrado con el avanzado Radar AWG-9, proporciona al F-14 la capacidad de atacar 6 blancos con 1 misil cada uno simultáneamente. Para lograr esto, los misiles vuelan en piloto automático mientras las computadoras a bordo del avión muestrean los datos del Radar de seguimiento mientras escanea (track-while-scan) en archivos de seguimiento, los cuales luego se utilizan para transmitir actualizaciones de guía a los misiles mientras están en la fase de curso medio, guiándolos hacia una "cesta" donde el propio buscador de Radar activo del misil adquiere el blanco para la fase terminal.

wp_aa-2a=AA-2B,Atoll B,IR AAM,El AA-2A Atoll (Vympel R-3S) es un misil aire-aire soviético de aspecto trasero con guiado infrarrojo. Es una copia de ingeniería inversa del AIM-9B estadounidense, con pequeños ajustes en la construcción y el rendimiento, y por lo demás funciona de manera idéntica. Solo de aspecto trasero.
wp_aa-2c=AA-2C,Atoll C,SARH AAM,El AA-2C Atoll (Vympel K-13/R-3R) es un misil aire-aire soviético con guiado por Radar semiactivo. Se basa en un AIM-9B de ingeniería inversa pero tiene un buscador completamente diferente, aunque comparte las mismas envolventes de adquisición y lanzamiento pobres del progenitor estadounidense.
wp_aa-2d=AA-2D,Advanced Atoll D,IR AAM,El AA-2D Advanced Atoll (Vympel K-13M) es un misil aire-aire soviético con guiado infrarrojo. Deriva del AA-2A Atoll (él mismo copiado mediante ingeniería inversa del AIM-9) pero presenta un nuevo motor y buscador, lo que mejora enormemente el rendimiento.
wp_aa-2-2=AA-2D,Advanced Atoll 2,IR AAM,El AA-2-2 Advanced Atoll (Vympel K-13M1) es un misil aire-aire soviético con guiado infrarrojo. Deriva del AA-2A Atoll (él mismo copiado mediante ingeniería inversa del AIM-9) pero presenta un nuevo motor y buscador, lo que mejora enormemente el rendimiento.

wp_aa-3e=AA-3E,Advanced Anab,SARH AAM,El AA-3E Advanced Anab E (Kaliningrad R-98MR) es un misil aire-aire soviético con guiado por Radar semiactivo. Uno de un par de diseños Advanced Anab desarrollados para el Su-15 y el Yak-28P. Al igual que el AIM-4 Falcon utilizado en los interceptores estadounidenses F-102 y F-106, la doctrina era disparar un misil guiado por Radar y uno infrarrojo al blanco, mejorando la probabilidad de derribo.
wp_aa-3f=AA-3F,Advanced Anab,IR AAM,El AA-3 Advanced Anab F (Kaliningrad R-98MT) es un misil aire-aire de construcción soviética con guiado infrarrojo. Uno de un par de diseños Advanced Anab desarrollados para el Su-15 y el Yak-28P. Al igual que el AIM-4 Falcon utilizado en los interceptores estadounidenses F-102 y F-106, la doctrina era disparar un misil guiado por Radar y uno infrarrojo al blanco, mejorando la probabilidad de derribo.
wp_aa-6a=AA-6A,Acrid,AAM,El AA-6A Acrid (Vympel R-40R) es un misil aire-aire soviético de largo alcance con guiado por Radar semiactivo. Fue desarrollado específicamente para el interceptor MiG-25P para contrarrestar al XB-70 Valkyrie. Al igual que el AIM-4 Falcon utilizado en los interceptores estadounidenses F-102 y F-106, la doctrina era disparar un misil guiado por Radar y uno infrarrojo al blanco, mejorando la probabilidad de derribo.
wp_aa-6b=AA-6B,Acrid,IR AAM,El AA-6B Acrid (Vympel R-40T) es un misil aire-aire soviético de largo alcance con guiado infrarrojo. Fue desarrollado específicamente para el interceptor MiG-25P para contrarrestar al XB-70 Valkyrie. Al igual que el AIM-4 Falcon utilizado en los interceptores estadounidenses F-102 y F-106, la doctrina era disparar un misil guiado por Radar y uno infrarrojo al blanco, mejorando la probabilidad de derribo.
wp_aa-6c=AA-6C,Acrid,AAM,El mejorado AA-6C Acrid (Vympel R-40RD) es un misil aire-aire soviético de largo alcance con guiado por Radar semiactivo. Fue desarrollado específicamente para el nuevo interceptor MiG-25PD. El alcance máximo del misil se aumentó hasta 60 km. Al igual que el AIM-4 Falcon utilizado en los interceptores estadounidenses F-102 y F-106, la doctrina era disparar un misil guiado por Radar y uno infrarrojo al blanco, mejorando la probabilidad de derribo.
wp_aa-6d=AA-6D,Acrid,AAM,El mejorado AA-6D Acrid (Vympel R-40TD) es un misil aire-aire soviético de largo alcance con guiado infrarrojo. Fue desarrollado específicamente para el nuevo interceptor MiG-25PD. El alcance máximo del misil se aumentó hasta 60 km. Al igual que el AIM-4 Falcon utilizado en los interceptores estadounidenses F-102 y F-106, la doctrina era disparar un misil guiado por Radar y uno infrarrojo al blanco, mejorando la probabilidad de derribo.
wp_aa-7c=AA-7C,Apex,SARH AAM,El AA-7C Apex (Vympel R-24R) es un misil aire-aire soviético de medio alcance con guiado por Radar semiactivo. Las variantes actualizadas Charlie y Delta se desarrollaron para equipar al MiG-23 a mediados de la década de 1970. Aproximadamente análogo al AIM-7E estadounidense, el AA-7C cuenta con un buscador monopulso con mayor resistencia a ECM y capacidad de enganche después del lanzamiento.
wp_aa-7d=AA-7D,Apex,IR AAM,El AA-7D Apex (Vympel R-24T) es un misil aire-aire soviético de medio alcance con guiado infrarrojo. Las variantes actualizadas Charlie y Delta se desarrollaron para equipar al MiG-23 a mediados de la década de 1970. Al igual que el AIM-4 Falcon utilizado en los interceptores estadounidenses F-102 y F-106, la doctrina era disparar un misil guiado por Radar y uno infrarrojo al blanco, mejorando la probabilidad de derribo.
wp_aa-8=AA-8,Aphid,AAM,El AA-8 Aphid (Vympel R-60M) es un misil aire-aire soviético de corto alcance con guiado infrarrojo. El arma se ha exportado muy ampliamente y es probable que sea común encontrarla en estados alineados con los soviéticos.
wp_aa-11=AA-11,Archer,AAM,El AA-11 Archer (Vympel R-73A) es un misil aire-aire soviético de corto alcance con guiado infrarrojo. Este es el misil de corto alcance de mayor rendimiento en el arsenal soviético, y sigue siendo extremadamente competitivo en comparación con la competencia extranjera, y representa un arma extremadamente letal a corto alcance en todos los aspectos.

# ------------------ SAM ------------------
it_aspide_1=Aspide Mk.1A,,SAM/ASuW,El misil Aspide es un misil tierra-aire italiano de medio alcance, derivado del misil estadounidense Sparrow. Derivado del AIM-7E, este misil cuenta con un motor mejorado, que aumenta el alcance y la velocidad, y también presenta un cabezal buscador monopulso muy mejorado, lo que permite el disparo a baja altitud y avances en el rendimiento ECCM.
El modelo de lanzamiento desde superficie tiene menor alcance y velocidad que el modelo de lanzamiento aéreo, aunque sigue siendo mucho mejor que el RIM-7E.

jsdf_sam1=Tan-SAM 1,,SAM,Un misil tierra-aire japonés de corto alcance con guiado infrarrojo omnidireccional. Parte del sistema SAM Tipo 82.

plan_hq-61=HQ-61,,SAM,El HQ-61 es un misil tierra-aire chino, y es el primer SAM naval desarrollado para la Armada del Ejército Popular de Liberación (PLAN). Si bien el misil fue aceptado en servicio en la década de 1980, tiene un rendimiento significativamente peor que sus contemporáneos, y es aproximadamente equivalente en rendimiento al Sea Sparrow RIM-7E estadounidense.

raf_rapier=FSB Rapier,Rapier,SAM,Un sistema de misiles británico de defensa de punto, corto alcance y baja altitud, guiado ópticamente. Utilizando el sistema de guía de comando a la línea de visión (CLOS), tiene una eficacia variable contra aviones rápidos y misiles.

rn_seacat=GWS-21,Sea Cat Mk.1,SAM,El GWS-21 Seacat es el ejemplo más temprano de un sistema de misiles de defensa de punto a bordo de buques. Entró en servicio en la Royal Navy en 1962 y también se ha exportado ampliamente como reemplazo del Bofors de 40 mm. Utilizando el sistema de guía de comando a la línea de visión (CLOS), tiene una eficacia cuestionable contra aviones rápidos y misiles.
rn_seacat_mk2=GWS-24,Sea Cat Mk.2,SAM,El GWS-24 Seacat es un modelo mejorado del Sea Cat Mk.1 (GWS-20) con mejor rendimiento a baja altitud, mayor alcance, mayor fiabilidad y se combina con un sistema de control de fuego más avanzado. Desafortunadamente, este sigue siendo un misil muy inferior, y es de eficacia cuestionable.

usa_mim-14=MIM-14,Nike Hercules,SAM,El MIM-14 Nike Hercules es un sistema de misiles tierra-aire utilizado por los Estados Unidos y las fuerzas de la OTAN para la defensa aérea de media y gran altitud.
usa_mim-23=MIM-23,Hawk,SAM,Desarrollado en EE. UU. en la década de 1960, el HAWK es un sistema de misiles tierra-aire de medio alcance relativamente móvil. El misil en sí utiliza guiado semiactivo del HPIR (High Power Illuminator Radar), que es parte de la batería HAWK más amplia, con blancos detectados por el PAR (Pulse Acquisition Radar) para blancos de gran altitud y el CWAR (Continuous Wave Acquisition Radar) para blancos de baja altitud en el desorden del suelo.

usn_rim-8=RIM-8J,Talos,SAM/ASuW,El RIM-8J Talos es un sistema de misiles tierra-aire masivo de largo alcance utilizado principalmente por los cruceros de la USN. Vuela en una fase de curso medio de guiado por haz con una fase terminal de guiado por Radar semiactivo. El misil requiere algo de ensamblaje antes del lanzamiento, por lo que la cadencia de fuego es menor que en sistemas más modernos, como lo indica el gran tamaño físico del cargador utilizado por el sistema.

usn_rim-7=RIM-7E,Sea Sparrow,SAM/ASuW,El RIM-7E Sea Sparrow es un misil tierra-aire de corto alcance, y es el principal misil de defensa de punto a bordo de buques de la OTAN.
Este es el primer modelo de Sea Sparrow, y es idéntico en rendimiento al AIM-7E lanzado desde el aire, excepto que su alcance y velocidad se ven muy disminuidos, lo que limita las distancias de disparo efectivas al corto alcance.
Hereda las deficiencias del AIM-7E en el rendimiento del buscador y las capacidades de disparo a baja altitud, que son notablemente pobres.
usn_rim-7h=RIM-7H,Sea Sparrow,SAM/ASuW,El RIM-7H Sea Sparrow es un misil tierra-aire de corto alcance, y es el principal misil de defensa de punto a bordo de buques de la OTAN.
El modelo 'Hotel' del Sea Sparrow es en general extremadamente similar al modelo 'Echo', excepto que el RIM-7H tiene aletas plegables para encajar en lanzadores más nuevos, y una fiabilidad ligeramente mejorada.
usn_rim-7m=RIM-7M,Sea Sparrow,SAM/ASuW,El RIM-7M Sea Sparrow es un misil tierra-aire de corto alcance, y es el principal misil de defensa de punto a bordo de buques de la OTAN.
El modelo 'Mike' es idéntico al AIM-7M lanzado desde el aire, excepto que su alcance y velocidad son significativamente menores.
En comparación con los modelos anteriores, el 'Mike' es el primero de la serie que tiene la capacidad de atacar misiles y aviones que vuelan a ras del mar, y es un misil de defensa de punto fiable a pesar de su corto alcance y velocidad.

# RIM-2 Terrier
usn_rim-2f=RIM-2F,Terrier,SAM/ASuW,El RIM-2F Terrier es uno de los primeros sistemas de misiles tierra-aire introducidos por la USN. Fue concebido para proporcionar una capa defensiva de medio alcance a los grupos de batalla de portaaviones que se situaba entre los cazas y los cañones. El Terrier original era un arma de guiado por haz. El RIM-2F es un arma mejorada de guiado por Radar semiactivo con mayor maniobrabilidad y probabilidad de derribo. Al igual que otros misiles tierra-aire, se puede utilizar en un papel secundario antisuperficie. El intervalo de salva se ve afectado negativamente por la necesidad de ensamblar manualmente las aletas del propulsor, con un lanzador capaz de disparar 2 misiles cada 30 segundos.
usn_rim-24b=RIM-24B,Tartar,SAM/ASuW,El RIM-24 Tartar es un SAM guiado por Radar de corto alcance con capacidad antisuperficie secundaria. Siendo el componente de corto alcance de la familia de misiles "3T" (Talos, Terrier, Tartar), el RIM-24B comparte componentes con el misil Terrier RIM-2E y tiene un mejor rendimiento que el RIM-24A original.

# RIM-66 SM-1MR/SM-2MR
usn_rim-66a=RIM-66A,SM-1MR,SAM/ASuW,El Standard Missile 1 es una familia de misiles tierra-aire de defensa de área con guiado por Radar (con una capacidad antisuperficie secundaria de corto alcance) caracterizados por sus propulsores de larga combustión y su rendimiento completo contra la mayoría de las amenazas. El Standard Missile 1 fue diseñado como una mejora más fiable respecto a los misiles anteriores Terrier RIM-2 y Tartar RIM-24, pero aún comparte sus limitaciones en capacidad de control de fuego y capacidad contra blancos de baja cota.

El SM-1MR Block IV (RIM-66A-4) es la versión de medio alcance de la serie SM-1, que reemplazó los componentes analógicos del Tartar con electrónica de estado sólido, mejorando enormemente la fiabilidad y las capacidades ECCM.
usn_rim-66b=RIM-66B,SM-1MR,SAM/ASuW,El Standard Missile 1 es una familia de misiles tierra-aire de defensa de área con guiado por Radar (con una capacidad antisuperficie secundaria de corto alcance) caracterizados por sus propulsores de larga combustión y su rendimiento completo contra la mayoría de las amenazas. El Standard Missile 1 fue diseñado como una mejora más fiable respecto a los misiles anteriores Terrier RIM-2 y Tartar RIM-24, pero aún comparte sus limitaciones en capacidad de control de fuego y capacidad contra blancos de baja cota.

El SM-1MR Block V (RIM-66B-2) es la versión de medio alcance mejorada de la serie SM-1, que actualizó el anterior RIM-66A con un motor de cohete más potente para un mayor alcance, y un nuevo conjunto de espoleta y buscador para mejorar su rendimiento ECCM.
usn_rim-66e=RIM-66E,SM-1MR,SAM/ASuW,El Standard Missile 1 es una familia de misiles tierra-aire de defensa de área con guiado por Radar (con una capacidad antisuperficie secundaria de corto alcance) caracterizados por sus propulsores de larga combustión y su rendimiento completo contra la mayoría de las amenazas. El Standard Missile 1 fue diseñado como una mejora más fiable respecto a los misiles anteriores Terrier RIM-2 y Tartar RIM-24, pero aún comparte sus limitaciones en capacidad de control de fuego.

El SM-1MR Block VI (RIM-66E) es la versión de medio alcance de la serie SM-1, la actualización del Block VI incluye electrónica del SM-2MR Block I (RIM-66C/D) como un buscador monopulso mejorado y una nueva ojiva, y también incluye una espoleta mejorada para rastrear mejor los misiles que vuelan a ras del mar.
usn_rim-66c=RIM-66C,SM-2MR,SAM/ASuW,El Standard Missile 2 es una familia de misiles tierra-aire de defensa de área guiados por Radar (con una capacidad antisuperficie secundaria de corto alcance) caracterizados por sus propulsores de larga combustión y su rendimiento completo contra la mayoría de las amenazas. El Standard Missile 2 reemplaza el buscador SM-1 de guiado por Radar semiactivo con una guía de curso medio por enlace de datos avanzado, con guiado terminal por Radar en los últimos segundos de vuelo. El SM-2 permite mantener muchos más misiles en el aire a la vez que iluminadores hay disponibles, lo que proporciona una ventaja masiva sobre los buques armados con SM-1.

El SM-2MR Block I (RIM-66C) es la versión AEGIS de la serie SM-2MR, y es generalmente idéntica al RIM-66B excepto por la inclusión de un enlace de datos, un buscador monopulso mejorado y una ojiva mejorada.
usn_rim-66d=RIM-66D,SM-2MR,SAM/ASuW,El Standard Missile 2 es una familia de misiles tierra-aire de defensa de área guiados por Radar (con una capacidad antisuperficie secundaria de corto alcance) caracterizados por sus propulsores de larga combustión y su rendimiento completo contra la mayoría de las amenazas. El Standard Missile 2 reemplaza el buscador SM-1 de guiado por Radar semiactivo con una guía de curso medio por enlace de datos avanzado, con guiado terminal por Radar en los últimos segundos de vuelo. El SM-2 permite mantener muchos más misiles en el aire a la vez que iluminadores hay disponibles, lo que proporciona una ventaja masiva sobre los buques armados con SM-1.

El SM-2MR Block I (RIM-66D) es la versión CG(N)/SM-2(MR) de la serie SM-2MR utilizada exclusivamente en cruceros de la clase Virginia reacondicionados, y es idéntica al RIM-66C (AEGIS) en todos los aspectos, salvo que es menos capaz en términos de canales de control de fuego y requiere un período de iluminación terminal más largo.
usn_rim-66g=RIM-66G,SM-2MR,SAM/ASuW,El Standard Missile 2 es una familia de misiles tierra-aire de defensa de área guiados por Radar (con una capacidad antisuperficie secundaria de corto alcance) caracterizados por sus propulsores de larga combustión y su rendimiento completo contra la mayoría de las amenazas. El Standard Missile 2 reemplaza el buscador SM-1 de guiado por Radar semiactivo con una guía de curso medio por enlace de datos avanzado, con guiado terminal por Radar en los últimos segundos de vuelo. El SM-2 permite mantener muchos más misiles en el aire a la vez que iluminadores hay disponibles, lo que proporciona una ventaja masiva sobre los buques armados con SM-1.

El SM-2MR Block II (RIM-67G) es la versión AEGIS (Mark 26) de la familia SM-2 Block II, con un nuevo propulsor para aumentar drásticamente el alcance, e incluye una nueva espoleta para mejorar el rendimiento contra blancos que vuelan a baja altitud y alta velocidad.

# RIM-67 SM-1ER/SM-2ER
usn_rim-67a=RIM-67A,SM-1ER,SAM/ASuW,El Standard Missile 1 es una familia de misiles tierra-aire de defensa de área con guiado por Radar (con una capacidad antisuperficie secundaria de corto alcance) caracterizados por sus propulsores de larga combustión y su rendimiento completo contra la mayoría de las amenazas. El Standard Missile 1 fue diseñado como una mejora más fiable respecto a los misiles anteriores Terrier RIM-2 y Tartar RIM-24, pero aún comparte sus limitaciones en capacidad de control de fuego y capacidad contra blancos de baja cota.

El SM-1ER (RIM-67A-2) es la versión de alcance extendido de la serie SM-1, que reemplazó los componentes analógicos del Terrier con electrónica de estado sólido, mejorando enormemente la fiabilidad, junto con una nueva espoleta y conjunto de buscador para mejorar su rendimiento ECCM.
usn_rim-67b=RIM-67B,SM-2ER,SAM/ASuW,El Standard Missile 2 es una familia de misiles tierra-aire de defensa de área guiados por Radar (con una capacidad antisuperficie secundaria de corto alcance) caracterizados por sus propulsores de larga combustión y su rendimiento completo contra la mayoría de las amenazas. El Standard Missile 2 reemplaza el buscador SM-1 de guiado por Radar semiactivo con una guía de curso medio por enlace de datos avanzado, con guiado terminal por Radar en los últimos segundos de vuelo. El SM-2 permite mantener muchos más misiles en el aire a la vez que iluminadores hay disponibles, lo que proporciona una ventaja masiva sobre los buques armados con SM-1.

El SM-2ER Block I (RIM-67B) es la versión de alcance extendido de la familia SM-2 Block I, utilizada en buques CG/SM-2 modernizados desde finales de los años 70 hasta mediados de los 80 para actualizar la potencia de fuego de los destructores y cruceros armados con Terrier existentes.
usn_rim-67c=RIM-67C,SM-2ER,SAM/ASuW,El Standard Missile 2 es una familia de misiles tierra-aire de defensa de área guiados por Radar (con una capacidad antisuperficie secundaria de corto alcance) caracterizados por sus propulsores de larga combustión y su rendimiento completo contra la mayoría de las amenazas. El Standard Missile 2 reemplaza el buscador SM-1 de guiado por Radar semiactivo con una guía de curso medio por enlace de datos avanzado, con guiado terminal por Radar en los últimos segundos de vuelo. El SM-2 permite mantener muchos más misiles en el aire a la vez que iluminadores hay disponibles, lo que proporciona una ventaja masiva sobre los buques armados con SM-1.

El SM-2ER Block II (RIM-67C) es la versión de alcance extendido de la familia SM-2 Block II, con un nuevo propulsor para aumentar drásticamente el alcance, e incluye una nueva espoleta para mejorar el rendimiento contra blancos que vuelan a baja altitud y alta velocidad.


wp_sa-n-1=SA-N-1,Goa,SAM/ASuW,El SA-N-1 Goa (M-1 Volna) es el sistema de misiles tierra-aire naval soviético más temprano. Está destinado a proporcionar defensa aérea de área y cierto grado de protección contra misiles antisuperficie entrantes. Originalmente solo efectivo contra blancos aéreos de gran altitud, las variantes posteriores introdujeron una capacidad antisuperficie y una mejor capacidad para atacar blancos a baja altitud, así como un mayor alcance.
wp_sa-n-1c=SA-N-1C,Goa,SAM/ASuW,El SA-N-1C Goa (M-1 Volna-P) es una modificación del sistema de misiles tierra-aire naval soviético más temprano. Tiene mejor resistencia a la interferencia y al Chaff y es capaz de atacar blancos de baja altitud.
wp_sa-n-3=SA-N-3,Goblet,SAM/ASuW,El SA-N-3 Goblet (M-11 Shtorm) es un sistema de misiles tierra-aire naval soviético. El sistema se instaló en varias clases de cruceros de misiles y en los portahelicópteros y portaaviones STOVL de la Unión Soviética. Tiene una capacidad antisuperficie secundaria, y las versiones posteriores mejoraron el rendimiento contra blancos de baja altitud.
wp_sa-n-4=SA-N-4,Gecko,SAM/ASuW,El SA-N-4 Gekko (9K33M Osa) es la versión naval del SA-8 Gecko (nótese la diferencia en la ortografía) con dos misiles en un lanzador giratorio retráctil. Se ha instalado en un número significativo de plataformas soviéticas para cumplir el papel de defensa aérea de corto alcance.
wp_sa-n-5=SA-N-5,Grail,SAM,El SA-N-5 Grail (9K32 Strela-2) es un misil tierra-aire portátil, también conocido como el SA-7 cuando se utiliza desde lanzadores terrestres. En los barcos se utiliza como un sistema de defensa de punto.
wp_sa-n-6=SA-N-6,Grumble,SAM/ASuW,El SA-N-6 Grumble (S-300F) es la versión naval del sistema de misiles tierra-aire terrestre SA-10 (S-300P). Este potente sistema de largo alcance está instalado en las clases de cruceros de misiles soviéticos y ofrece un rendimiento comparable al del SM-2.
wp_sa-n-7=SA-N-7,Gadfly,SAM/ASuW,El SA-N-7 Gadfly (3S90 Uragan) es la versión naval del sistema de misiles tierra-aire terrestre SA-11 Gadfly (9K37 Buk). El sistema SA-N-7 es un sistema de armas sofisticado y capaz, y entró en servicio en los destructores de la clase Sovremenny.
wp_sa-n-9=SA-N-9,Gauntlet,SAM/ASuW,El SA-N-9 Gauntlet (3K95 Kinzhal) es la versión naval del sistema de misiles SA-15 Gauntlet (9K330 Tor). Utiliza el mismo misil que el SA-15 y está instalado en un número significativo de los principales buques de combate de superficie soviéticos.

wp_sa-2=SA-2,Guideline,SAM,El SA-2 Guideline (S-75 Dvina) es un sistema de misiles tierra-aire soviético de largo alcance. El sistema está destinado a contrarrestar bombarderos sobre grandes áreas y ha sido exportado ampliamente, habiendo sido utilizado en muchos conflictos, pero más famosamente durante la guerra de Vietnam.
wp_sa-3=SA-3,Goa,SAM,El SA-3 Goa (S-125 Neva/Pechora) es un sistema de misiles tierra-aire soviético de medio alcance. El sistema está destinado a contrarrestar blancos más maniobrables y a menor altitud.
wp_sa-4=SA-4,Ganef,SAM,El SA-4 Ganef (2K11 Krug) es un sistema de misiles tierra-aire móvil soviético de medio alcance. El sistema está destinado a contrarrestar bombarderos sobre grandes áreas.
wp_sa-5=SA-5,Gammon,SAM,El SA-5 Gammon (S-200) es un sistema de misiles tierra-aire soviético de largo alcance. El sistema está destinado a contrarrestar bombarderos de gran altitud sobre grandes áreas. Los misiles incorporan una capacidad de orientación hacia la interferencia (home-on-jam).
wp_sa-6=SA-6,Gainful,SAM,El SA-6 Gainful (2K12 Kub) es un sistema de misiles tierra-aire móvil soviético. El sistema está destinado a contrarrestar amenazas de corto alcance hasta aproximadamente 15 millas.
wp_sa-8=SA-8,Gecko,SAM,El SA-8 Gecko (9K33M3 Osa) es un sistema de misiles tierra-aire móvil soviético. El sistema está destinado a proporcionar defensa aérea de corto alcance para divisiones de tanques y motorizadas.
wp_sa-11=SA-11,Gadfly,SAM,El SA-11 Gadfly (9K37 Buk) es un sistema de misiles tierra-aire móvil soviético. El sistema está destinado a contrarrestar amenazas de corto alcance hasta aproximadamente 18 millas.
wp_sa-13=SA-13,Gopher,SAM,El SA-13 Gopher (9K35 Strela-10) es un sistema de misiles tierra-aire de corto alcance altamente móvil soviético. El sistema está destinado a contrarrestar amenazas emergentes de baja altitud como los helicópteros.

# ---------- Anti-radar Missiles ---------
usn_agm-45=AGM-45B,Shrike,ARM,El AGM-45 Shrike es un misil antirradar estadounidense desarrollado a partir del fuselaje del AIM-7 Sparrow y un nuevo buscador. Tiene corto alcance, velocidad poco impresionante, una ojiva pequeña y solo puede guiarse en un número limitado de bandas de Radar (bandas S, C, X), pero su bajo coste y peso ligero significan un uso ubicuo.
usn_agm-78=AGM-78D,Standard ARM,ARM,El AGM-78 Standard ARM (STARM) es un ARM estadounidense de largo alcance destinado a atacar emplazamientos de SAM de alto nivel desde distancias de separación (standoff). El STARM deriva del SAM SM-1MR, tiene un propulsor de larga combustión y un perfil de trayectoria lofted para alcanzar un largo alcance, y tiene una ojiva potente para garantizar la destrucción de cualquier sistema de Radar al que impacte. Desafortunadamente, esta es un arma costosa y rara, por lo que pocos o ninguno pueden ser utilizados en un momento dado.
usn_agm-88a=AGM-88A,HARM,ARM,El AGM-88A HARM (Misil Antirradar de Alta Velocidad) es un ARM estadounidense de largo alcance, con un rendimiento excepcional en todas las categorías. El HARM es el misil antirradar más moderno en el arsenal de la OTAN en 1985, y supera a sus predecesores en casi todas las categorías, especialmente en fiabilidad y velocidad máxima. Debido a que este misil es muy nuevo en servicio, solo un número limitado (o ninguno en absoluto) puede ser utilizado en un momento dado.
usn_agm-122a=AGM-122A,Sidearm,ARM,El AGM-122A es un misil antirradar táctico de corto alcance diseñado principalmente para su uso desde helicópteros y aviones de ala fija. Modificado a partir del AIM-9C de corta duración, el Sidearm es un ARM de corto alcance efectivo para lidiar con amenazas SHORAD emergentes, pero no es muy adecuado para enfrentarse a defensas aéreas significativas.

usn_rgm-8h=RGM-8H,Talos ARM,ARM,El RGM-8H Talos es la versión antirradar del SAM RIM-8 Talos, y utiliza su gran fuselaje para alcanzar un muy largo alcance y alta velocidad para un ARM lanzado desde buques. Aunque el RGM-8H se basa en un SAM, este misil no tiene capacidad antiaérea, y solo es capaz de atacar blancos de superficie que emitan activamente con un Radar.

wp_as-11=AS-11,Kilter,ARM,El AS-11 Kilter (Kh-58) es un misil antirradar soviético desarrollado para equipar el avión de ataque Su-24M. Este es uno de los ARM más avanzados para las fuerzas aéreas soviéticas, y tiene un alcance muy largo cuando se dispara a velocidades supersónicas.
wp_as-12=AS-12,Kegler,ARM,El AS-12 Kegler (Kh-25MP) es un misil antirradar soviético de medio alcance lanzado desde el aire y supersónico. Este es el ARM más común en servicio soviético, y es aproximadamente análogo al AGM-45 Shrike estadounidense.

wp_as-2b=AS-2B,Kipper,ASM,El K-10SP es una variante del misil K-10S que intercambia la ojiva por el sistema de interferencia Azaliya.

# ---------- Anti-ship Missiles ----------
is_gabriel_2=Gabriel 2,,ASM,Gabriel es un misil antisuperficie israelí con guiado por Radar semiactivo (SARH) y un alcance relativamente corto, que vuela bajo para evitar el fuego enemigo. Este es un modelo mejorado del Gabriel 1 original, y está destinado a mejorar las capacidades ECCM junto con la fiabilidad general.
is_gabriel_3=Gabriel 3,,ASM,El Gabriel 3 es un misil antisuperficie israelí de corto alcance con capacidades de vuelo a ras del mar y un buscador de Radar activo. Este es un misil Gabriel 2 mejorado, con una nariz rediseñada para acomodar un buscador de Radar activo avanzado, y permite la operación "dispara y olvida".
is_gabriel_3as=Gabriel 3AS,,ASM,El Gabriel 3AS es un misil antisuperficie israelí de corto alcance con capacidades de vuelo a ras del mar y un buscador de Radar activo. Esta es la versión de lanzamiento aéreo del Gabriel 3, y tiene un mayor alcance y un fuselaje rediseñado.

it_seakiller_2=Sea Killer 2,,ASM,El Sea Killer 2 es un misil antisuperficie de corto alcance desarrollado en Italia. El Sea Killer Mark 2 fue comprado por Irán para armar sus fragatas de la clase Alvand, cada una de las cuales estaba equipada con un lanzador único de cinco rondas.
it_otomat_mk1=Otomat MK1,,ASM,El Otomat MK1 es un misil antisuperficie de medio alcance desarrollado en cooperación entre Italia y Francia.

jasdf_asm-1=ASM-1,,ASM,El ASM-1 es un misil antisuperficie japonés de lanzamiento a distancia (standoff). El ASM-1 es la variante lanzada desde el aire.

fr_as12=AS.12,,ASM,El AS.12 es un ASM de corto alcance guiado por comando lanzado desde helicópteros de origen francés. Este es un ATGM SS.11 mejorado, con un motor más largo y una ojiva significativamente más grande, y puede representar una amenaza seria tanto para barcos como para buques pequeños.
fr_am-39=AM39,Exocet,ASM,El AM39 Exocet es un misil antisuperficie francés de lanzamiento a distancia (standoff). Es una alternativa popular al Harpoon en toda la OTAN y en varias otras naciones. El AM39 es la variante lanzada desde el aire.
fr_mm-38=MM38,Exocet,ASM,El MM38 Exocet es un misil antisuperficie francés de lanzamiento a distancia (standoff). Es una alternativa popular al Harpoon en toda la OTAN y en varias otras naciones. El MM38 es la variante lanzada desde superficie.
fr_sm-39=SM39,Exocet,ASM,El SM39 Exocet es un misil antisuperficie francés de lanzamiento a distancia (standoff). Es una alternativa popular al Harpoon en toda la OTAN y en varias otras naciones. El SM39 es la variante lanzada desde submarino, y cuenta con mejores ECCM y un mayor alcance que el Exocet original lanzado desde buques, debido a que se basa en una versión mejorada AM-39 Mod 2.

knm_penguin_mk2=AGM-119,Penguin Mk2,ASM,El AGM-119 Penguin es un misil antisuperficie pequeño lanzado desde el aire y desde superficie desarrollado en colaboración entre EE. UU. y Noruega.

plan_sy-1=SY-1,Scrubbrush,ASM,El SY-1 es una versión construida bajo licencia china del misil soviético Styx.
plan_sy-1a=SY-1A,Scrubbrush,ASM,El SY-1A es un desarrollo chino del misil soviético Styx, con un buscador mejorado y una fase de vuelo terminal a ras del mar, y también puede utilizarse tanto en barcos como en lanzadores terrestres.
plan_hy-1=HY-1,Silkworm,ASM,El HY-1 es un desarrollo chino del misil soviético Styx, con un alcance extendido debido a un tanque de combustible alargado.
plan_hy-1j=HY-1J,Safflower,ASM,El HY-1J es la versión naval del misil chino HY-1, con un rendimiento idéntico en el resto de sus características.
plan_hy-1a=HY-1A,Safflower,ASM,El HY-1A es una mejora china del misil HY-1J que presenta un buscador mejorado y un radioaltímetro, lo que permite una fase de vuelo terminal a ras de mar (sea-skimming).
plan_hy-2=HY-2,Seersucker,ASM,El HY-2 es un derivado chino del misil HY-1 e incluye un depósito de combustible ampliado para aumentar su alcance. Esto hace que el HY-2 sea exclusivamente un sistema de misiles basado en tierra, ya que ningún lanzador embarcado es lo suficientemente largo como para albergarlo.
pla_hy-3=HY-3,Sawhorse,ASM,El HY-3 es un misil antibuque supersónico basado en tierra, propulsado por estatorreactores, capaz de alcanzar hasta Mach 2.5 y con un alcance de entre 130 y 180 kilómetros. Su desarrollo se completó a principios de los años 90, pero el misil no entró en servicio.
plan_hy-4=HY-4,Sadsack,ASM,El HY-4 es un derivado chino del misil HY-2, con un motor turborreactor que sustituye a la propulsión original por cohete de combustible líquido. Esto permite una mejora significativa en el alcance, aunque la voluminosa estructura del HY-4 hace que vuele a una altitud relativamente alta y a baja velocidad durante gran parte de su trayectoria.
pla_yj-1=YJ-1,Saples,ASM,El YJ-1 es un misil antibuque supersónico de corto alcance lanzado desde el aire, con una velocidad superior a Mach 2 y una fase terminal a ras de mar. Aunque este misil no fue aceptado para el servicio, un número limitado de misiles de preproducción estuvo disponible a finales de los años 80, y estaba destinado principalmente a ser utilizado en el hidroavión SH-5.
pla_yj-6=YJ-6,Kraken,ASM,El YJ-6 es un misil antibuque chino lanzado desde el aire, desarrollado a partir del sistema SY-1/HY-1 de base terrestre/naval. Cuenta con un mayor alcance de disparo debido a su perfil de lanzamiento aéreo, aunque utiliza un buscador antiguo y es susceptible a las contramedidas, al igual que otros modelos antiguos del Styx o Silkworm.
plan_yj-8=YJ-8,Sardine,ASM,El YJ-8 es un misil antibuque chino que se asemeja, y es aproximadamente equivalente, al misil francés Exocet. Tras el lanzamiento, el misil asciende a 20-30 metros y desciende para atacar a 5-7 metros en un perfil de vuelo a ras de mar.

usn_agm-12b=AGM-12B,Bullpup,ASM,El AGM-12 Bullpup es un arma de ataque supersónica estadounidense lanzada desde el aire. Depende de que un operador guíe manualmente el misil, de forma similar al AS-7 soviético, y presenta gran parte de los mismos inconvenientes, siendo el principal la necesidad de mantener la aeronave volando en línea recta hacia el objetivo.
usn_agm-123=AGM-123,Skipper,ASM,El Skipper es un misil guiado antibuque estadounidense de corto a medio alcance, producido combinando una bomba guiada por láser Paveway II con un propulsor de cohete sólido. Se hizo para ofrecer a las tripulaciones aéreas una alternativa al Harpoon, que resultó difícil de usar en aguas muy congestionadas como el Golfo Pérsico, donde el riesgo de alcanzar a civiles es demasiado elevado.
usn_agm-84a=AGM-84A,Harpoon,ASM,El Harpoon es un arma antibuque estadounidense de tipo standoff utilizada ampliamente en toda la OTAN. El arma posee un buscador de Radar activo que se activa después de seguir una ruta preprogramada. La variante AGM-84 se lanza desde el aire.
usn_agm-84c=AGM-84C,Harpoon,ASM,El Harpoon es un arma antibuque estadounidense de tipo standoff utilizada ampliamente en toda la OTAN. El arma posee un buscador de Radar activo que se activa después de seguir una ruta preprogramada. La variante AGM-84C se lanza desde el aire y no realiza una maniobra terminal de ascenso (pop-up), sino que tiene una fase de vuelo a ras de mar para atacar los buques con mayor eficacia.
usn_agm-84d=AGM-84D,Harpoon,ASM,El Harpoon es un arma antibuque estadounidense de tipo standoff utilizada ampliamente en toda la OTAN. El arma posee un buscador de Radar activo que se activa después de seguir una ruta preprogramada. La variante AGM-84 se lanza desde el aire. El AGM-84D es una modificación más reciente, aparecida en 1985. Cuenta con capacidades de ECCM mejoradas y un mayor alcance debido a un combustible mejorado.

usn_rgm-84a=RGM-84A,Harpoon,ASM,El Harpoon es un arma antibuque estadounidense de tipo standoff utilizada ampliamente en toda la OTAN. El arma posee un buscador de Radar activo que se activa después de seguir una ruta preprogramada. La variante RGM-84A se lanza desde superficie, con una maniobra terminal de ascenso (pop-up) para evadir los sistemas de armas de defensa de punto (CIWS).
usn_rgm-84c=RGM-84C,Harpoon,ASM,El Harpoon es un arma antibuque estadounidense de tipo standoff utilizada ampliamente en toda la OTAN. El arma posee un buscador de Radar activo que se activa después de seguir una ruta preprogramada. La variante RGM-84C se lanza desde superficie y no realiza una maniobra terminal de ascenso (pop-up), sino que tiene una fase de vuelo a ras de mar para atacar los buques con mayor eficacia.
usn_rgm-84d=RGM-84D,Harpoon,ASM,El Harpoon es un arma antibuque estadounidense de tipo standoff utilizada ampliamente en toda la OTAN. El arma posee un buscador de Radar activo que se activa después de seguir una ruta preprogramada. La variante RGM-84D se lanza desde superficie. El RGM-84D es una modificación más reciente, aparecida en 1985. Cuenta con capacidades de ECCM mejoradas y un mayor alcance debido a un combustible mejorado.
usn_rgm-109b=RGM-109B,Tomahawk,ASM,El misil antibuque Tomahawk (TASM) RGM-109B es un arma antibuque estadounidense de tipo standoff. El arma cuenta con un buscador de Radar activo que se activa tras seguir una ruta preprogramada, y es capaz de realizar un patrón de búsqueda con maniobras engañosas.

usn_ugm-84a=UGM-84A,Harpoon,ASM,El Harpoon es un arma antibuque estadounidense de tipo standoff utilizada ampliamente en toda la OTAN. El arma posee un buscador de Radar activo que se activa después de seguir una ruta preprogramada. La variante UGM-84A se lanza desde submarino, utilizando un contenedor desechable, y realiza una maniobra terminal de ascenso (pop-up).
usn_ugm-84b=UGM-84B,Harpoon,ASM,El Harpoon es un arma antibuque estadounidense de tipo standoff utilizada ampliamente en toda la OTAN. El arma posee un buscador de Radar activo que se activa después de seguir una ruta preprogramada. La variante UGM-84B está fabricada específicamente para la Royal Navy, siendo la versión lanzada desde submarino. A diferencia del anterior UGM-84A, no realiza una maniobra terminal de ascenso (pop-up), sino que tiene una fase de vuelo a ras de mar para atacar los buques con mayor eficacia.
usn_ugm-84c=UGM-84C,Harpoon,ASM,El Harpoon es un arma antibuque estadounidense de tipo standoff utilizada ampliamente en toda la OTAN. El arma posee un buscador de Radar activo que se activa después de seguir una ruta preprogramada. La variante UGM-84C se lanza desde submarino, utilizando un contenedor desechable. A diferencia del anterior UGM-84A, no realiza una maniobra terminal de ascenso (pop-up), sino que tiene una fase de vuelo a ras de mar para atacar los buques con mayor eficacia.
usn_ugm-109b=UGM-109B,Tomahawk,ASM,El misil antibuque Tomahawk (TASM) RGM-109B es un arma antibuque estadounidense de tipo standoff. El arma posee un buscador de Radar activo que se activa tras seguir una ruta preprogramada, y es capaz de realizar un patrón de búsqueda con maniobras engañosas. Este es el modelo lanzado desde submarino, desplegado exclusivamente desde los tubos lanzatorpedos.

wp_as-2=AS-2,Kipper,ASM,El AS-2 Kipper (K-10S) es un arma antibuque supersónica soviética de tipo standoff lanzada desde el aire, diseñada para ser transportada por el Tu-16. Aproximadamente análogo a un SS-N-3 lanzado desde el aire, sufre prácticamente los mismos inconvenientes frente a defensas aéreas incluso moderadamente modernas.
wp_as-4=AS-4,Kitchen,ASM,El AS-4 Kitchen (Kh-22) es un arma antibuque supersónica soviética de tipo standoff lanzada desde el aire, transportada por el Tu-22M o el Tu-95. Vuela siguiendo un perfil de gran altitud y alta velocidad con un picado terminal supersónico, lo que hace que sea muy difícil de contrarrestar.
wp_as-6=AS-6,Kingfish,ASM,El AS-6 Kingfish (Kh-26) es un arma de ataque y antibuque supersónica soviética de tipo standoff lanzada desde el aire, diseñada para ser transportada por el Tu-16. Un primo más pequeño del AS-4, vuela siguiendo un perfil de gran altitud y alta velocidad con un picado terminal supersónico, lo que hace que sea muy difícil de contrarrestar.
wp_as-7=AS-7,Kerry,ASM,El AS-7 Kerry (Kh-23 Grom) es un arma de ataque supersónica soviética de tipo standoff lanzada desde el aire. Depende de que un operador guíe manualmente el misil, de forma similar al AGM-12 Bullpup estadounidense, y presenta gran parte de los mismos inconvenientes.
wp_as-10=AS-10,Karen,ASM,El AS-10 Karen (Kh-25/Kh-25M) es un arma de ataque supersónica soviética de tipo standoff lanzada desde el aire. Utiliza un buscador láser para ofrecer capacidad de disparo y olvido.
wp_as-13=AS-13,Kingbolt,ASM,El AS-13 Kingbolt (Kh-59 Ovod) es un arma de ataque subsónica soviética de tipo standoff lanzada desde el aire. Realiza la trayectoria intermedia bajo guía inercial, utilizando coordenadas de objetivo preprogramadas, con una fase terminal de búsqueda por TV.
wp_as-14a=AS-14A,Kedge,ASM,El AS-14A Kedge (Kh-29L) es un misil aire-tierra supersónico soviético lanzado desde el aire, con una ojiva pesada y guía láser.
wp_as-14b=AS-14B,Kedge,ASM,El AS-14B Kedge (Kh-29T) es un misil aire-tierra supersónico soviético lanzado desde el aire, con una ojiva pesada y guía por TV para mayor alcance, aunque tiene un rendimiento degradado durante la noche.

wp_ss-n-2=SS-N-2,Styx,ASM,El SS-N-2 Styx (P-15 Termit) es un arma antibuque subsónica soviética de tipo standoff lanzada desde superficie. El arma fue producida bajo licencia por China como el conocido CSS-C-2 Silkworm. También puede utilizarse para atacar instalaciones terrestres en la costa.
wp_ss-n-2c=SS-N-2C,Styx,ASM,El SS-N-2C Styx (P-15 Termit-M) es un arma antibuque subsónica soviética de tipo standoff lanzada desde superficie. Es una versión mejorada del P-15 original con mayor alcance y mejores ECCM. También puede utilizarse para atacar instalaciones terrestres en la costa.
wp_ss-n-3=SS-N-3,Shaddock,ASM,El SS-N-3 Shaddock (P-35) es un arma antibuque subsónica soviética de tipo standoff lanzada desde superficie. Aunque era temible en el momento de su introducción, el perfil de vuelo subsónico a gran altitud lo hace muy vulnerable a los misiles superficie-aire. Otro inconveniente es la necesidad de que la plataforma de lanzamiento mantenga el contacto con el misil durante todo el vuelo, lo que significa que las plataformas sumergidas deben permanecer expuestas en la superficie durante un ataque, dejándolas vulnerables a contraataques.
wp_ss-n-3b=SS-N-3B,Sepal,ASM,El SS-N-3B Sepal (Progress) es un arma antibuque subsónica soviética de tipo standoff lanzada desde superficie. Es una versión mejorada del misil P-35 original con menor altitud de vuelo y mejor resistencia a las interferencias y al Chaff.
wp_ss-n-7=SS-N-7,Starbright,ASM,El SS-N-7 Starbright (P-70 Ametist) es un arma antibuque transónica soviética de tipo standoff lanzada desde submarino. Fue el primer sistema de misiles del mundo en ser lanzado desde un submarino sumergido. Es un arma de alcance relativamente corto y fue sustituida por el SS-N-9 Siren.
wp_ss-n-9=SS-N-9,Siren,ASM,El SS-N-9 Siren (P-120 Malakhit) es un arma antibuque subsónica soviética de tipo standoff lanzada desde superficie. Es más rápido y tiene más alcance que el Styx, y puede realizar maniobras evasivas en la fase terminal.
wp_ss-n-12=SS-N-12,Sandbox,ASM,El SS-N-12 Sandbox (P-500 Bazalt) es un arma antibuque supersónica soviética de tipo standoff lanzada desde superficie, diseñada para sustituir al SS-N-3 Shaddock. En comparación con el Shaddock, es mucho más rápido e incorpora un enlace de datos entre misiles que permite que la mayoría de la salva permanezca a baja altitud mientras un solo misil vuela alto actuando como observador de objetivos. También lleva ECM defensiva para aumentar la supervivencia frente a las defensas antiaéreas.
wp_ss-n-19=SS-N-19,Shipwreck,ASM,El SS-N-19 Shipwreck (P-700 Granit) es un arma antibuque supersónica soviética de tipo standoff lanzada desde superficie. Vuela siguiendo un perfil HI-LO e incluye un enlace de datos avanzado entre misiles que permite que varios misiles en una salva distribuyan los objetivos entre ellos utilizando un solo misil como observador a gran altura. Es capaz de realizar maniobras evasivas en la fase terminal, lleva un bloqueador ECM y señuelos integrados, y está blindado contra el fuego de CIWS y fragmentos de misiles. Es un arma temible bajo cualquier estándar.
wp_ss-n-22=SS-N-22,Sunburn,ASM,El SS-N-22 Sunburn (P-270 Moskit) es un arma antibuque supersónica soviética de tipo standoff lanzada desde superficie. Vuela siguiendo un perfil LO-LO con una fase terminal supersónica a ras de mar, durante la cual el misil realiza maniobras evasivas serpenteantes para aumentar la supervivencia frente a las defensas aéreas.

#----------- Land Strike only missiles---------
wp_as-4b=AS-4B,Kitchen-B,Land Attack,El AS-4B Kitchen (Kh-22MP Storm) es un misil de ataque a tierra supersónico soviético de tipo standoff.

fr_as11=AS.11,,Land Attack,El SS.11/AS.11 es un misil antitanque de corto alcance, guiado por mando y de origen francés. Este modelo posee una ojiva semi-perforante para atacar pequeñas embarcaciones, en lugar de una carga hueca para atacar tanques.

usn_agm-65b=AGM-65B,Maverick,Land Attack,El AGM-65B es un arma aire-tierra estadounidense de tipo standoff guiada por TV. Un operador en la aeronave de lanzamiento mantiene la retícula sobre el objetivo deseado, el arma se bloquea en el objetivo y luego se guía autónomamente hacia él tras el lanzamiento, de forma similar al AGM-62 Walleye.
usaf_agm-86c=AGM-86C,CALCM,Land Attack,El misil de crucero de lanzamiento aéreo convencional (CALCM) es un misil de ataque a tierra estadounidense de tipo standoff lanzado desde el aire y la principal arma standoff del B-52. Estas armas vuelan por una ruta preprogramada hacia un objetivo sin intervención de la plataforma de lanzamiento, utilizando el seguimiento del contorno del terreno mediante un Radar de mapeo del terreno y mapas digitales integrados.

usn_rgm-109c=RGM-109C,Tomahawk,Land Attack,El misil de ataque a tierra Tomahawk (TLAM) es un misil de ataque a tierra estadounidense de tipo standoff. Estas armas vuelan por una ruta preprogramada hacia un objetivo sin intervención de la plataforma de lanzamiento, utilizando el seguimiento del contorno del terreno mediante un Radar de mapeo del terreno y mapas digitales integrados.

usn_ugm-109c=UGM-109C,Tomahawk,Land Attack,El misil de ataque a tierra Tomahawk (TLAM) es un misil de ataque a tierra estadounidense de tipo standoff. Estas armas vuelan por una ruta preprogramada hacia un objetivo sin intervención de la plataforma de lanzamiento, utilizando el seguimiento del contorno del terreno mediante un Radar de mapeo del terreno y mapas digitales integrados. Este es el modelo lanzado desde submarino, desplegado exclusivamente desde los tubos lanzatorpedos. El UGM-109C no puede cargarse completamente de combustible para su lanzamiento desde submarino, por lo tanto, tiene un alcance algo menor que el modelo lanzado desde buque.

usa_bgm-71a=BGM-71A,TOW,Land Attack,El BGM-71 TOW es un misil antitanque estadounidense guiado por cable. El arma se utiliza tanto desde helicópteros como desde vehículos blindados. Tiene un alcance relativamente corto y una ojiva pequeña, lo que limita su capacidad contra blindaje moderno, ya que puede requerir varios disparos para destruir un solo tanque.
usa_bgm-71c=BGM-71C,I-TOW,Land Attack,El BGM-71 I-TOW es un misil antitanque estadounidense guiado por cable. El arma se utiliza tanto desde helicópteros como desde vehículos blindados. Este es el modelo mejorado I-TOW, con alcance mejorado (como en el BGM-71B) y una sonda de separación para derrotar el blindaje de tanques modernos, aunque todavía puede tener dificultades contra los últimos tanques de combate soviéticos.
usa_bgm-71d=BGM-71D,TOW 2,Land Attack,El BGM-71D TOW 2 es un misil antitanque estadounidense guiado por cable. El arma se utiliza tanto desde helicópteros como desde vehículos blindados. Se trata de un rediseño del BGM-71 TOW original con una ojiva mucho más grande y un motor mejorado, lo que le permite derrotar fácilmente las últimas amenazas blindadas.

wp_at-6=AT-6,Spiral,Land Attack,El AT-6 Spiral (9M114 Kokon) es un misil antitanque guiado supersónico soviético utilizado por algunos helicópteros de ataque, particularmente el Ka-29 y el Mi-24. Destaca por su largo alcance, alta velocidad y una potente ojiva.
wp_at-10=AT-10,Sabber,Land Attack,El AT-10 Sabber es un misil antitanque guiado soviético utilizado por el tanque T-55M.

# ---------- Anti-sub  Missilies ----------
ran_ikara=GWS-40,Ikara,ASW,El GWS-40 Ikara es un misil de crucero antisubmarino australiano, propulsado por un motor cohete, que despliega un torpedo Mk-46 o Mk-44 para derrotar amenazas submarinas. Aunque tiene el doble de alcance que el ASROC estadounidense, el Ikara es algo más lento y no se pueden disparar múltiples misiles rápidamente debido a la configuración de lanzamiento.

usn_rur-5=RUR-5,ASROC,ASW,El RUR-5 ASROC (cohete antisubmarino) es un arma antisubmarina de tipo standoff. El misil ASROC se lanza desde la plataforma de disparo y despliega un torpedo ASW Mk 46 después de seguir una trayectoria balística.

wp_apr-2=APR-2,,ASW,El APR-2 es un torpedo antisubmarino soviético lanzado desde el aire, con un alcance de buscador de 0,75 millas náuticas y puede utilizarse hasta una profundidad de 600m.
wp_ss-n-14a=SS-N-14A,Silex,ASW,El SS-N-14 Silex (Metel) es un arma antisubmarina soviética de tipo standoff. Similar al Ikara australiano, estas armas transportan un torpedo bajo una pequeña estructura de misil de crucero.
wp_ss-n-14b=SS-N-14B,Silex-B,ASW/ASuW,El SS-N-14 Silex-B (Rastrub) es un arma de tipo standoff soviética de doble propósito, antisubmarina y antisuperficie. Similar al Ikara australiano, estas armas transportan un torpedo bajo una pequeña estructura de misil de crucero.
wp_ss-n-16=SS-N-16,Stallion,ASW,El SS-N-16 Stallion (Vodopad) es un arma antisubmarina soviética de tipo standoff para submarinos. Vuela siguiendo una trayectoria balística para lanzar un torpedo en las proximidades del objetivo.

# ------------------ RBU ------------------
knm_terne_shell=Terne III Mortar,,ASW Mortar,Terne es un sistema de armas antisubmarino noruego propulsado por cohetes, desarrollado en los años 60.

plan_type62dc=FQF-1200,,ASW Mortar,El FQF-1200 es un lanzacohetes antisubmarino chino de 5 tubos.
plan_type75dc=FQF-2500,,ASW Mortar,El FQF-2500 es un lanzacohetes antisubmarino chino de 12 tubos.

rn_limbo_shell=LIMBO Mortar,,ASW Mortar,Limbo (o mortero antisubmarino Mark 10) es un mortero antisubmarino británico construido en los años 50. Apuntado utilizando el Sonar del buque, su objetivo es lanzar tres cargas de profundidad en un triángulo alrededor del objetivo.
rn_squid_shell=SQUID Mortar,,ASW Mortar,Squid es un mortero antisubmarino británico de la época de la Segunda Guerra Mundial. Apuntado utilizando el Sonar del buque, su objetivo es lanzar tres cargas de profundidad en un triángulo alrededor del objetivo.

swe_375mm_rocket=Bofors M/50,,ASW Mortar,El Bofors M/50 es un lanzacohetes antisubmarino sueco de 375 mm.

wp_rgb-10=RBU-1000,,ASW Mortar,El RBU-1000 (o Smerch-3) es un lanzacohetes antisubmarino soviético de 300 mm. El RBU-1000 tiene un alcance de aproximadamente 1000 yardas.
wp_rgb-12=RBU-1200,,ASW Mortar,El RBU-1200 (o Smerch-3) es un lanzacohetes antisubmarino soviético de 251 mm. El RBU-1200 tiene un alcance de aproximadamente 1200 yardas.
wp_rgb-25=RBU-2500,,ASW Mortar,El RBU-2500 (o Smerch-1) es un lanzacohetes antisubmarino soviético de 213 mm. El RBU-2500 tiene un alcance de aproximadamente 2500 yardas.
wp_rgb-60=RBU-6000,,ASW Mortar,El RBU-6000 (o Smerch-2) es un lanzacohetes antisubmarino soviético de 213 mm. El RBU-6000 tiene un alcance de aproximadamente 6000 yardas.

# --------------- Torpedoes ---------------
fr_e15=E15,,ASuW Torpedo,El torpedo francés E15 es un inusual torpedo antisuperficie pesado de 55 cm con guía por Sonar pasivo.
fr_l3=L3,,ASW Torpedo,El torpedo francés L3 es un inusual torpedo antisubmarino de peso medio de 55 cm. Actualizado.
fr_l5_mod3=L5,Mod 3,ASW Torpedo,El torpedo francés L5 es un torpedo antisubmarino de peso medio de 55 cm. Esta es una versión más rápida y de mayor alcance del torpedo antisubmarino L3, pensada para seguir el ritmo de los alcances de detección por Sonar más largos y las velocidades más altas de los submarinos.
fr_f17_mod1=F17,Mod 1,ASuW Torpedo,El torpedo francés F17 es un torpedo antisuperficie pesado de 53 cm guiado por cable. Esta es una versión más rápida y de mayor alcance del torpedo antisuperficie E15, con guía por cable para maniobrar o navegar por debajo de la capa térmica, y dos modos de velocidad.
fr_f17_mod2=F17,Mod 2,Torpedo,El torpedo francés F17 es un torpedo de doble propósito pesado de 53 cm guiado por cable. Esta es una versión mejorada del torpedo F17 original, con capacidad antisubmarina mediante buscador activo-pasivo, mayor velocidad, mayor profundidad de inmersión y mayor alcance.
fr_f17p=F17P,,Torpedo,El torpedo francés F17P ("Polyvalent") es un torpedo de doble propósito pesado de 53 cm guiado por cable. Esta es una versión mejorada del torpedo F17 original, destinada exclusivamente a la exportación, con capacidad antisubmarina mediante buscador activo-pasivo, lo que lo convierte en un torpedo de doble propósito capaz de ser utilizado desde buques y submarinos.

ger_dm1=DM1,,ASW Torpedo,El primer torpedo guiado por cable de Alemania dedicado contra submarinos.
ger_dm2=DM2,,ASuW Torpedo,El torpedo guiado por cable de Alemania dedicado contra objetivos de superficie.
ger_sst4=SST4,,ASuW Torpedo,Torpedo pesado antisuperficie guiado por cable de fabricación alemana. Producido para exportación a otras armadas.

it_a-244s_air=A-244,,ASW Torpedo,Torpedo antisubmarino ligero italiano lanzado desde el aire. Cuenta con guía por Sonar activo y pasivo.

jmsdf_type80=Type 80,,Torpedo,Torpedo Type 80. Fruto de los programas de investigación GRX-1 y GRX-2 de los años 70, e influenciado por el diseño Mark 37 de la USN, este torpedo guiado por cable ASW/ASuW cuenta con mejores características en propulsión, rendimiento y alcance que el Mark 37.
jmsdf_type54=Type 54,,Torpedo,Torpedo Type 54 Model 3 Mod 1. Primer torpedo de diseño japonés de posguerra. Inicialmente bastante infructuoso y propenso a fallos tras el lanzamiento, pasó por varios rediseños terminando en la variante de producción en masa Model 3 Mod 1.

knm_tp612=TP612,,ASuW Torpedo,El TP612 sueco es un torpedo pesado guiado por cable sin buscador. El TP612 es un desarrollo del TP611 con reducción de ruido y capacidad de lanzamiento por expulsión.
knm_tp613=TP613,,ASuW Torpedo,El TP613 sueco es un torpedo pesado guiado por cable con buscador por Sonar pasivo. El TP613 es un desarrollo del TP612 con la incorporación de un buscador por Sonar pasivo.

plan_yu-1=Yu-1,,ASuW Torpedo,El Yu-1 (Fish Type-1) es el primer torpedo pesado de producción nacional china. Estos torpedos de trayectoria recta son relativamente simples y, por tanto, fiables y eficaces.
plan_yu-1g=Yu-1G,,ASuW Torpedo,El Yu-1G (Fish Type-1A) es el primer torpedo pesado de producción nacional china. Se trata de un torpedo Yu-1 mejorado, con una capacidad de guiado pasivo añadida para atacar con mayor eficacia a buques en maniobra.
plan_yu-3=Yu-3,,ASW Torpedo,El Yu-3 (Fish Type-3) es un torpedo antisubmarino pesado pasivo chino. Al ser un torpedo lento, es más adecuado para atacar submarinos diésel-eléctricos, ya que los objetivos más rápidos podrían dejar atrás al torpedo. El buscador tiene un alcance máximo de unas 1600 yardas.
plan_yu-4=Yu-4A,,ASuW Torpedo,El Yu-4A (Fish Type-4) es un torpedo antisuperficie pesado pasivo chino. Es un torpedo lento y probablemente solo sea eficaz a distancias muy cortas.

rn_mark9_mod2=Mark IX,,ASuW Torpedo,El torpedo británico Mark IX** es un torpedo antisuperficie de trayectoria recta introducido durante la Segunda Guerra Mundial. Con mayor tiempo de funcionamiento y una ojiva más potente, es la mejora final del diseño original Mark IX de los años 30.
rn_mark8_mod4=Mark VIII,,ASuW Torpedo,El torpedo británico Mark VIII Mod 4 es un torpedo antisuperficie de trayectoria recta introducido durante la Segunda Guerra Mundial. Esta es la versión final de la serie Mark 8 lanzada desde submarino de la era de los años 20, y es utilizada por la Royal Navy hasta bien entrados los años 80, careciendo de un sustituto antisuperficie suficiente hasta después de la Guerra Fría.
rn_mark20s=Mark 20S,Bidder,ASW Torpedo,El Mark 20S "Bidder" es un torpedo antisubmarino británico de peso medio de los años 50, y se consideraba obsoleto antes incluso de entrar en servicio. El Mark 20S es la versión lanzada desde submarino del torpedo, y aunque es el primer torpedo autoguiado de este tipo de la Royal Navy, tiene una fiabilidad extremadamente baja, poco alcance, velocidad lenta y un rendimiento del buscador deficiente, lo que lo hace inadecuado contra objetivos modernos. Esta arma se mantuvo en servicio hasta los años 70 debido a su capacidad para ser disparada desde los tubos lanzatorpedos de "contramedidas" de popa de los submarinos clase Oberon y Porpoise.
#rn_mark20c
rn_mark23=Mark 23,Grog,Torpedo,El Mark 23 "Grog" es un torpedo antisubmarino británico de peso medio de los años 50 con una capacidad secundaria antisuperficie, y se consideraba obsoleto antes incluso de entrar en servicio. El Mark 23 es una mejora importante sobre el torpedo Mark 20 original, con un segmento de batería extendido y capacidad de guía por cable, aunque todavía hereda el buscador extremadamente deficiente y la baja velocidad del Bidder. Debido a la pobre fiabilidad y rendimiento de esta arma, su capacidad contra submarinos y buques de superficie modernos es, en el mejor de los casos, cuestionable.

usn_mk16=Mk-16,,ASuW Torpedo,El torpedo Mark 16 es un torpedo de trayectoria recta de la época de la Segunda Guerra Mundial utilizado durante los años 50 y 60 como un torpedo antisuperficie rápido y de muy alta potencia por los submarinos de ataque estadounidenses. A pesar de la falta de guía, los disparos a corta distancia que conectan casi con toda seguridad hundirán cualquier objetivo, independientemente de su tamaño. La variante Mod 8 incorpora la ojiva de alta potencia del Mod 0 con el mayor alcance del torpedo Mod 1.
usn_mk37=Mk-37 Mod 0,,Torpedo,El torpedo Mark 37 es el torpedo antisubmarino ligero estándar de la USN utilizado en múltiples naciones. Introducido en 1959, era demasiado lento y poco eficiente para hacer frente a los modernos submarinos soviéticos de alto rendimiento.
usn_mk37_mod1=Mk-37 Mod 1,,Torpedo,El torpedo Mark 37 es el torpedo antisubmarino ligero estándar de la USN utilizado en múltiples naciones. Introducido en 1959, era demasiado lento y poco eficiente para hacer frente a los modernos submarinos soviéticos de alto rendimiento. El Mod 1 añade guía por cable a costa de algo de velocidad.
usn_mk37_mod3=Mk-37 Mod 3,,Torpedo,El torpedo Mark 37 es el torpedo antisubmarino ligero estándar de la USN utilizado en múltiples naciones. Introducido en 1959, era demasiado lento y poco eficiente para hacer frente a los modernos submarinos soviéticos de alto rendimiento. El torpedo Mk-37 Mod 3 incluye un nuevo buscador para mejorar la fiabilidad y el alcance de adquisición, aunque el resto del torpedo es idéntico al Mod 0 original.
usn_mk37_mod2=Mk-37 Mod 2,,Torpedo,El torpedo Mark 37 es el torpedo antisubmarino ligero estándar de la USN utilizado en múltiples naciones. Introducido en 1959, era demasiado lento y poco eficiente para hacer frente a los modernos submarinos soviéticos de alto rendimiento. El torpedo Mk-37 Mod 2 includes un nuevo buscador para mejorar la fiabilidad y el alcance de adquisición, aunque el resto del torpedo es idéntico al Mod 1 guiado por cable.
usn_mk37c=Mk-37C,,Torpedo,El torpedo Mark 37C es una versión mejorada del torpedo Mk-37 de la USN, con combustible Otto y guía por cable, y supone una mejora significativa respecto al torpedo original. Utilizado exclusivamente por socios de exportación a partir de mediados de los años 70, el Mk-37C (NT-37C) incluye una propulsión mejorada para una velocidad un 150% mayor y casi el doble de alcance, a costa de ser un torpedo ligeramente más ruidoso.
usn_mk37e=Mk-37E,,Torpedo,El torpedo Mark 37E es una versión mejorada del torpedo Mk-37C con capacidad de seguimiento de estela (wake-homing) y un buscador rediseñado. Utilizado exclusivamente por socios de exportación, el Mk-37E (NT-37E) tiene capacidades antisuperficie mejoradas y refinamientos menores en la propulsión, lo que permite un torpedo antisubmarino y antisuperficie muy competente para mediados de los años 80.
usn_mk44_air=Mk-44,,ASW Torpedo,El torpedo Mark 44 es el torpedo antisubmarino heredado de la OTAN, y es un arma común a lo largo de toda la Guerra Fría. Aunque presenta una buena fiabilidad, el Mark 44 tiene un alcance corto y una velocidad lenta, y tiene dificultades contra submarinos rápidos que bucean a gran profundidad.\nEste modelo es lanzado desde el aire.
usn_mk44_ship=Mk-44,,ASW Torpedo,El torpedo Mark 44 es el torpedo antisubmarino heredado de la OTAN, y es un arma común a lo largo de toda la Guerra Fría. Aunque presenta una buena fiabilidad, el Mark 44 tiene un alcance corto y una velocidad lenta, y tiene dificultades contra submarinos rápidos que bucean a gran profundidad.\nEste modelo es lanzado desde superficie.
usn_mk46_air=Mk-46 Mod 2,,ASW Torpedo,El torpedo Mark 46 Mod 2 es el estándar de la OTAN para torpedos ligeros utilizados en múltiples naciones. Diseñado para atacar a modernos submarinos soviéticos de alto rendimiento, esta variante es lanzada desde el aire.
usn_mk46_ship=Mk-46 Mod 2,,ASW Torpedo,El torpedo Mark 46 Mod 2 es el estándar de la OTAN para torpedos ligeros utilizados en múltiples naciones. Diseñado para atacar a modernos submarinos soviéticos de alto rendimiento, esta variante es lanzada desde buque.
usn_mk46_mod5_air=Mk-46 Mod 5,NEARTIP,Torpedo,El torpedo Mark 46 Mod 5 NEARTIP es el estándar de la OTAN para torpedos ligeros utilizados en múltiples naciones. Diseñado para atacar a modernos submarinos soviéticos de alto rendimiento, esta variante es lanzada desde el aire.\n\nEl Mk-46 Mod 5 NEARTIP (Programa de Mejora a Corto Plazo) es una reconstrucción completa del torpedo Mk46, que permite un mayor alcance mediante una fase de tránsito más lenta y silenciosa, contramedidas mejoradas y la actualización del torpedo para poder rastrear submarinos en aguas poco profundas y en superficie, aunque con una eficacia limitada.
usn_mk46_mod5_ship=Mk-46 Mod 5,NEARTIP,Torpedo,El torpedo Mark 46 Mod 5 NEARTIP es el estándar de la OTAN para torpedos ligeros utilizados en múltiples naciones. Diseñado para atacar a modernos submarinos soviéticos de alto rendimiento, esta variante es lanzada desde buque.\n\nEl Mk-46 Mod 5 NEARTIP (Programa de Mejora a Corto Plazo) es una reconstrucción completa del torpedo Mk46, que permite un mayor alcance mediante una fase de tránsito más lenta y silenciosa, contramedidas mejoradas y la actualización del torpedo para poder rastrear submarinos en aguas poco profundas y en superficie, aunque con una eficacia limitada.
usn_mk48=Mk-48 Mod 1,,Torpedo,El Mark 48 Mod 1 es un torpedo estadounidense pesado de doble propósito. Es un torpedo de muy largo alcance y gran velocidad, con capacidad de guiado por cable y un buscador muy sofisticado. La versión Mod 1 fue la primera en entrar en servicio en 1972, sustituyendo a las antiguas cargas Mk-37 y Mk-14/16 por un único torpedo de alto rendimiento, aunque solo dispone de guiado por cable unidireccional.
usn_mk48_mod4=Mk-48 Mod 4,,Torpedo,El Mark 48 Mod 4 es un torpedo estadounidense pesado de doble propósito. Es un torpedo de muy largo alcance y gran velocidad, con capacidad de guiado por cable y un buscador muy sofisticado. La versión Mod 4 es la actualización de los años 80, que añadió mejoras en el buscador para seguir a los objetivos más modernos, como los SSN clase Alfa, e incluye guiado por cable bidireccional que mejora la capacidad de rechazo de contramedidas.
usn_mk48_mod4_adcap=Mk-48 ADCAP,,Torpedo,El Mark 48 Mod 4 (ADCAP) es un torpedo estadounidense pesado de doble propósito. Es un torpedo de muy largo alcance y gran velocidad, con capacidad de guiado por cable y un buscador muy sofisticado. La versión Mod 4 ADCAP (independiente del programa de nueva construcción del Mk-48 Mod 5 ADCAP) es una actualización de 1985 para los torpedos Mod 4 existentes con una nueva placa oscilante y bomba de combustible, llevando los límites del torpedo existente aún más lejos con una velocidad terminal de 65 nudos, junto con mejoras en el buscador para aumentar la capacidad de rechazo de contramedidas.

wp_45-36nu=45-36NU,,Torpedo ASuW,El 45-36NU es un torpedo de 450 mm de trayectoria recta, de diseño obsoleto anterior a la Segunda Guerra Mundial, fuertemente influenciado por los diseños italianos 45-F y 53-F de principios de los años 30. Al ser ligero y tener menos pegada que sus homólogos de 530 mm, se convirtió en un arma bastante ineficaz en los años 50. Pero a veces hay que arreglárselas con lo que hay.
wp_53-38=53-38,,Torpedo ASuW,El 53-38 es un torpedo soviético pesado de trayectoria recta de la Segunda Guerra Mundial. Estos torpedos son relativamente sencillos y, por tanto, fiables y eficaces. Los dos hundimientos más mortíferos de la historia (el transporte alemán Wilhelm Gustloff y el transporte de tropas Goya) fueron realizados por dos submarinos soviéticos utilizando torpedos 53-38.
wp_53-39=53-39,,Torpedo ASuW,El 53-39 es un torpedo soviético pesado de trayectoria recta de la Segunda Guerra Mundial. Estos torpedos son relativamente sencillos y, por tanto, fiables y eficaces.
wp_53-56v=53-56,,Torpedo ASuW,El 53-56V es un torpedo soviético pesado de trayectoria recta. Estos torpedos son variantes actualizadas del 53-38.
wp_53-65K=53-65K,,Torpedo WH,El 53-65 es un torpedo soviético pesado con guiado por estela diseñado para destruir buques de superficie.
wp_65-76=65-76,,Torpedo WH,El 65-76 es un torpedo soviético de 650 mm con guiado por estela conocido como «mataportaviones». Fue desarrollado específicamente para su uso contra objetivos extremadamente grandes, como superportaaviones. Su mayor diámetro de 650 mm significa que solo algunos submarinos pueden transportarlo.
wp_at-1=AT-1,,Torpedo ASW,El AT-1 es un torpedo antisubmarino eléctrico soviético lanzado desde el aire con guiado acústico activo/pasivo transportado solo por helicópteros.
wp_at-2=AT-2,,Torpedo ASW,El AT-2 es un torpedo antisubmarino eléctrico soviético pesado lanzado desde el aire con guiado acústico activo/pasivo. El AT-2 es uno de los pocos torpedos pesados lanzados desde el aire, ya que la mayoría de los torpedos lanzados desde el aire son mucho más pequeños y solo tienen una cuarta parte de su peso.
wp_set-40=SET-40,,Torpedo ASW,El SET-40 es un torpedo antisubmarino eléctrico ligero soviético con guiado por Sonar activo/pasivo.
wp_set-65=SET-65,,Torpedo ASW,El SET-65 es un torpedo antisubmarino eléctrico pesado soviético con guiado por Sonar activo.
wp_test-71=TEST-71,,Torpedo ASW,El TEST-71 es un torpedo antisubmarino pesado soviético guiado por cable. Mejora al SET-65 con capacidades de búsqueda activa/pasiva más avanzadas.\nDebido a las limitaciones del cable y de los datos, el TEST-71 solo puede guiarse por cable horizontalmente y no puede cambiar de profundidad tras el lanzamiento.
wp_test-71m=TEST-71M,,Torpedo ASW,El TEST-71M es un torpedo antisubmarino pesado soviético guiado por cable. El TEST-71M cuenta con una sección de guiado digital mejorada y una unidad de guiado por cable actualizada para eliminar las restricciones previas del guiado por cable, permitiendo un disparo más flexible.
wp_umgt-1=UMGT-1,,Torpedo ASW,El UMGT-1 es un torpedo antisubmarino soviético lanzado desde el aire que también sirve como carga útil para los misiles ASW SS-N-14 y SS-N-16. Estos torpedos ligeros tienen menos pegada que los torpedos pesados soviéticos, pero siguen siendo extremadamente peligrosos.
wp_uset-80=USET-80,,Torpedo,El USET-80 es un torpedo soviético moderno de doble propósito. Posee un sistema de búsqueda activo/pasivo, lo que lo convierte en un arma extremadamente peligrosa tanto para submarinos como para buques de superficie.

# ------------------ Bombs -----------------
fr_samp_t25=SAMP-25,,Bomba,La SAMP Tipo 25 es una bomba tonta francesa de 230 kg (500 lb). Es comparable a la Mk-82 estadounidense.
fr_samp_t21=SAMP-21,,Bomba,La SAMP Tipo 21 es una bomba tonta francesa de 400 kg (880 lb). Es comparable a la Mk-83 estadounidense.

pla_type-2=Type-100-2,,Bomba,La Type-100-2 es una bomba china de propósito general de 100 kg lanzada desde el aire. Comparable a la FAB-100 soviética.
pla_type-3-250=Type-250-3,,Bomba,La Type-250-3 es una bomba china de propósito general de 250 kg lanzada desde el aire. Comparable a la FAB-250 soviética.
pla_type-3-500=Type-500-3,,Bomba,La Type-500-3 es una bomba china de propósito general de 500 kg lanzada desde el aire. Comparable a la FAB-500 soviética.

raf_bl755=BL755,,Bomba de racimo,La BL755 contiene 147 submuniciones anticarro HEAT dispersadas sobre una amplia área. Fue ampliamente utilizada durante la guerra Irán-Irak por la IRIAF y en las Malvinas por la RAF.

usaf_gbu-2=GBU-2,Paveway I,Bomba guiada,La GBU-2 Paveway I es una bomba estadounidense de 2000 libras (907 kg) guiada por láser. El arma se basa en la Mk 84, pero con la adición de un buscador láser montado en el morro y aletas para el guiado.
usaf_gbu-15=GBU-15,,Bomba guiada,La GBU-15(V)2 es una bomba planeadora guiada por infrarrojos que fue utilizada por la USAF en ciertos aviones tácticos supersónicos, como el F-111 y el F-4E, y fue exportada a múltiples naciones. Esta arma tiene un buscador de infrarrojos de barrido (IIR), que es altamente fiable y puede utilizarse en todas las condiciones meteorológicas, y también cuenta con una capacidad de enlace de datos para volver a fijar objetivos y transmitir datos del buscador a la plataforma de lanzamiento.
usaf_bolt-117=BOLT-117,,Bomba guiada,La BOLT-117 es una bomba estadounidense de 750 libras (340 kg) guiada por láser. El arma es una bomba convencional M-117 modificada, pero con la adición de un buscador láser montado en el morro y aletas para el guiado.
usaf_gbu-11=GBU-11,Paveway I,Bomba guiada,La GBU-11 es una bomba estadounidense de 3000 libras (1400 kg) guiada por láser. Es una bomba guiada superpesada destinada a ser utilizada contra objetivos duros, como puentes o búnkeres, debido a su alto rendimiento explosivo.
usaf_m117=M117,,Bomba,La M117 es una bomba de 750 libras (340 kg) de la época de la guerra de Corea, utilizada ampliamente por la USAF durante la campaña de Vietnam. Fue sustituida por los distintos modelos de la serie Mk 80.
usaf_m118=M118,,Bomba de demolición,La M118 es una bomba de demolición estadounidense superpesada de 3000 libras (1400 kg) destinada a ser utilizada contra objetivos de punto duro como puentes, búnkeres, fortificaciones, vías férreas y otras estructuras resistentes.
usaf_cbu-24=CBU-24,,Bomba de racimo,La CBU-24 contiene 665 submuniciones de fragmentación dispersadas sobre una amplia área. Fue ampliamente utilizada como arma antipersonal por las unidades Wild Weasel que atacaban sitios SAM.

usn_gbu-10=GBU-10,Paveway II,Bomba guiada,La GBU-10 Paveway II es una bomba estadounidense de 2000 libras (907 kg) guiada por láser. El arma se basa en la Mk 84, pero con la adición de un buscador láser montado en el morro y aletas para el guiado. El kit de guiado de la GBU-10 es una actualización de la antigua Paveway I.
usn_gbu-12=GBU-12,Paveway II,Bomba guiada,La GBU-12 Paveway II es una bomba estadounidense de 500 libras (227 kg) guiada por láser. El arma se basa en la Mk 82, pero con la adición de un buscador láser montado en el morro y aletas para el guiado.
usn_gbu-16=GBU-16,Paveway II,Bomba guiada,La GBU-16 Paveway II es una bomba estadounidense de 1000 libras (460 kg) guiada por láser. El arma se basa en la Mk 83, pero con la adición de un buscador láser montado en el morro y aletas para el guiado.
usn_gbu-24=GBU-24,Paveway III,Bomba guiada,La GBU-24 Paveway III es una bomba estadounidense de 2000 libras (907 kg) guiada por láser de alcance extendido. Es una mejora sobre la Paveway II con un guiado mejorado y un mayor alcance de planeo, junto con una mayor fiabilidad y un perfil de vuelo a baja altitud más eficiente.
usn_mk-82=Mk-82,,Bomba,La Mark 82 es una bomba tonta de propósito general de baja resistencia de 500 libras (227 kg).
usn_mk-82_snakeye=Mk-82 Snakeye,,Bomba,La Mark 82 "Snake-eye" es una bomba tonta de propósito general de alta resistencia de 500 libras (227 kg) con aletas desplegables. Útil para la entrega de "tendido", donde la aeronave despliega las bombas a alta velocidad y baja altitud, sin necesidad de ascenso y sin picado, aunque a costa de un mayor tiempo de vuelo.
usn_mk-83=Mk-83,,Bomba,La Mark 83 es una bomba tonta de propósito general de baja resistencia de 1000 libras (454 kg).
usn_mk-84=Mk-84,,Bomba,La Mark 84 es una bomba tonta de propósito general de baja resistencia de 2000 libras (900 kg).
usn_rockeye=CBU-100,Rockeye,Bomba de racimo,La CBU-100 Rockeye II es una bomba de racimo estadounidense de 500 libras (227 kg) que dispensa 247 submuniciones.
usn_walleye2=AGM-62,Walleye II,Bomba guiada,La AGM-62 Walleye es una bomba planeadora guiada por televisión que fue utilizada por las Fuerzas Armadas de los Estados Unidos desde los años 60 hasta los 90. La mayoría tenían una ojiva de alto explosivo de 250 libras (113 kg); algunas tenían una ojiva nuclear W72.

usn_mk54_dc=Mk-54,,Bomba de profundidad,La bomba de profundidad Mark 54 es una bomba de profundidad aérea estadounidense diseñada durante la Segunda Guerra Mundial que permaneció en servicio durante toda la Guerra Fría.

wp_fab-100=OFAB-100,,Bomba,La OFAB-100-120 es una bomba de propósito general de 100 kg (220 lb) lanzada desde el aire, de diseño soviético, con ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados.
wp_fab-250=FAB-250,,Bomba,La FAB-250 es una bomba de propósito general de 250 kg (550 lb) lanzada desde el aire, de diseño soviético, con ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados.
wp_fab-500=FAB-500 M-62,,Bomba,La FAB-500 es una bomba de propósito general de 500 kg (1100 lb) lanzada desde el aire, de diseño soviético, con ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados.
wp_fab-500_m54=FAB-500 M-54,,Bomba,La FAB-500 es una bomba de propósito general de 500 kg (1100 lb) lanzada desde el aire, de diseño soviético, con ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados. Se trata de una bomba más corta y de resistencia media pensada para ser transportada en mayores cantidades, generalmente de forma interna, pero que sufre de peor precisión que el modelo de baja resistencia.
wp_fab-1500_m54=FAB-1500 M-54,,Bomba,La FAB-1500 es una bomba de propósito general de 1500 kg (3300 lb) lanzada desde el aire, de diseño soviético, con ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados. Este es el modelo de 1500 kg en una familia de bombas de alto explosivo grandes, y se utiliza principalmente contra objetivos duros como grandes buques de guerra, búnkeres o bases aéreas.
wp_fab-3000_m54=FAB-3000 M-54,,Bomba,La FAB-3000 es una bomba de propósito general de 3000 kg (6600 lb) lanzada desde el aire, de diseño soviético, con ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados. Este es el modelo de 3000 kg en una familia de bombas de alto explosivo grandes, y se utiliza principalmente contra objetivos duros como grandes buques de guerra, búnkeres o bases aéreas.
wp_fab-9000_m54=FAB-9000 M-54,,Bomba,La FAB-1500 es una bomba de propósito general de 9000 kg (20.000 lb) lanzada desde el aire, de diseño soviético, con ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados. Este es el modelo de 9000 kg en una familia de bombas de alto explosivo grandes, y es una de las bombas convencionales más grandes jamás utilizadas en combate, con un enfoque en la obliteración de objetivos endurecidos.

wp_kab-500l=KAB-500L,,Bomba guiada,La KAB-500L es una bomba de 500 kg (1100 lb) con guiado láser lanzada desde el aire, de diseño soviético, con ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados. Se basa en la FAB-500, pero con un buscador láser y aletas para el guiado.

wp_rbk-250=RBK-250,,Bomba de racimo,La RBK-250 es una bomba de racimo soviética de 250 kg (550 lb).
wp_rbk-500=RBK-500,,Bomba de racimo,La RBK-500 es una bomba de racimo soviética de 500 kg (1100 lb).

wp_plab-100=PLAB-100,,Bomba de profundidad,La PLAB-100 es una bomba antisubmarina de 100 kg (220 lb) lanzada desde el aire, de diseño soviético, utilizada principalmente por la Unión Soviética y sus aliados.

# ---------------- Sonobuoys ---------------
plan_skf-1=SKF-1,,Sonoboya Pasiva,La SKF-1 es una sonoboya pasiva omnidireccional utilizada por la Armada del Ejército Popular de Liberación desde los años 60.
plan_skf-2=SKF-2,,Sonoboya Pasiva,La SKF-2 es una sonoboya pasiva direccional utilizada por la Armada del Ejército Popular de Liberación desde mediados de los años 70.

usn_ssq-41=AN/SSQ-41,LOFAR,Sonoboya,La SSQ-41A "Jezebel" es una sonoboya de tipo Análisis y Grabación de Baja Frecuencia (LOFAR). Es la sonoboya pasiva de la OTAN más común y no tiene capacidad para determinar el rumbo como la posterior sonoboya DIFAR, pero sigue teniendo una sensibilidad decente y puede encontrarse en grandes cantidades en el arsenal de cualquier marina occidental.
usn_ssq-47=AN/SSQ-47,Julie,Sonoboya Activa,La SSQ-47A "Julie" es una sonoboya de tipo activo continuo solo de alcance. Es la sonoboya activa de la OTAN más común y no tiene capacidad para determinar el rumbo como la posterior sonoboya DICASS, pero sigue siendo útil para "fijar" un objetivo previamente detectado con varias boyas. Como resultado del ping activo continuo, esta sonoboya tiene una vida útil de solo 30 minutos.
usn_ssq-53=AN/SSQ-53,DIFAR,Sonoboya Pasiva,La SSQ-53 es una sonoboya de tipo Análisis y Grabación de Frecuencia Direccional (DIFAR). Esto proporciona al operador de la sonoboya información sobre el rumbo magnético, lo cual es una mejora enorme respecto a la anterior omnidireccional CRT-1.
usn_ssq-62=AN/SSQ-62,DICASS,Sonoboya Activa,La AN/SSQ-62 DICASS es una sonoboya activa utilizada para fijar un submarino sumergido que ha sido localizado previamente con sonoboyas pasivas SSQ-53.
usn_ssq-77=AN/SSQ-77,VLAD,Sonoboya,La SSQ-77A es una sonoboya pasiva de tipo VLAD (DIFAR de línea vertical), diseñada como una mejora generacional de la sonoboya pasiva de tipo DIFAR original. Esta boya tiene una arquitectura similar a la de la DIFAR, pero incorpora un conjunto de Sonar extremadamente sensible que permite un alcance pasivo muy largo para una sonoboya, alta capacidad contra objetivos silenciosos y de inmersión profunda, y presenta un buen rendimiento operando en aguas ruidosas y complejas.\n\nLa consecuencia de este mayor rendimiento es el peso y el coste de esta boya, lo que significa que son menos comunes, y su precisión a larga distancia es pobre, por lo que son útiles sobre todo para la localización de objetivos sumergidos.
usn_ssq-101=AN/SSQ-101,,Sonoboya Activa,La AN/SSQ-101 ADAR (Receptor Activo Desplegado desde el Aire) es una sonoboya diseñada como receptor para sistemas multiestáticos en aguas poco profundas. Cuando se despliega, utiliza un gran conjunto de hidrófonos para determinar rumbos precisos.

wp_rgb-1=RGB-1,,Sonoboya Pasiva,La RGB-1 es una sonoboya pasiva omnidireccional utilizada por la Unión Soviética.
wp_rgb-nm1=RGB-NM-1,,Sonoboya Pasiva,La RGB-NM-1 es una sonoboya pasiva omnidireccional utilizada como parte del conjunto Baku por la Unión Soviética.
wp_rgb-3=RGB-3,,Sonoboya Activa,La RGB-3 es una sonoboya activa utilizada por la Unión Soviética.

# ------------------ FFAR -----------------
usn_zuni=Zuni,,FFAR,El Zuni es un cohete aéreo de aletas plegables (FFAR) de 5.0 pulgadas transportado principalmente por aviones de ataque a tierra y helicópteros de ataque. El Zuni puede utilizarse para transportar varios tipos de ojivas similares a otros sistemas FFAR. Normalmente se dispara desde el lanzacohetes LAU-10 con capacidad para cuatro cohetes.
usn_hydra=Hydra 70,,FFAR,El Hydra 70 es un cohete aéreo de aletas plegables (FFAR) de 2.75 pulgadas utilizado tanto por cazas como por helicópteros. El Hydra puede equiparse con una gama de ojivas y normalmente se transporta en contenedores de hasta 19 cohetes.

wp_s-5=S-5,,FFAR,El S-5 es un cohete aéreo de aletas plegables (FFAR) soviético de 55 mm utilizado por cazabombarderos y helicópteros. El S-5 puede rastrear su herencia hasta el alemán R4M de finales de la Segunda Guerra Mundial. El cohete se transporta normalmente en contenedores de hasta 32.
wp_s-8=S-8,,FFAR,El S-8 es un cohete aéreo de aletas plegables (FFAR) soviético de 80 mm utilizado por cazabombarderos y helicópteros. El S-8 tiene una serie de variantes diferentes, incluyendo variantes especializadas para la denegación de pistas. El cohete se transporta normalmente en contenedores de hasta 20.
wp_s-24=S-24,,FFAR,El S-24 es un cohete aéreo de aletas plegables (FFAR) soviético de 240 mm utilizado por cazabombarderos y helicópteros. A diferencia de la mayoría de los FFAR, se transporta individualmente.
wp_s-25=S-25,,FFAR,El S-25 es un cohete aéreo de aletas plegables (FFAR) soviético de 266 mm utilizado por cazabombarderos y helicópteros. El mayor de los cohetes no guiados de la Unión Soviética, el S-25, tiene una ojiva que contiene casi 60 kg de explosivos y se transporta individualmente.

# ------------------ MLRS -----------------
ir_107mm_rocket=Haseb-1,,MLRS,El cohete Haseb-1 es una versión iraní del cohete chino de 107 mm disparado por el lanzacohetes múltiple Tipo 63. En el servicio iraní, tanto el lanzador como el cohete se llaman Haseb.

usa_m26=M26,,MLRS,El M26 es un cohete no guiado de 227 mm utilizado por el sistema de lanzacohetes múltiples (MLRS) M270 del Ejército de los EE. UU. La carga útil del cohete consiste en hasta 800 submuniciones capaces de cubrir hasta 2000 metros cuadrados.

wp_grad=Grad,,MLRS,El cohete M-21OF es un arma soviética disparada desde el vehículo de lanzamiento BM-21. El sistema completo (el M-21) es más conocido como el sistema de lanzacohetes múltiple "Grad".

