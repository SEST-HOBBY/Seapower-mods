[LoadoutNames]
#------------------------------------------ New system ------------------------------------------
# - LongRange means operating range of aircraft, not the weapons range
# ---------- Mandatory loadouts ----------
Default=Predeterminado // Habitualmente la configuración más común para esta aeronave
Ferry=Ferry // Máximos tanques de combustible, sin armas, excepto cañones y Chaff
Empty=Vacío // Sin tanques de combustible, sin armas, excepto cañones y Chaff

# ---------- Anti Air loadouts ----------
AirToAir=Aire-Aire // Configuración estándar aire-aire para el tipo
AirToAirLongRange=Aire-Aire Largo Alcance // Aire-aire con menos armas y más combustible
AirToAirIntercept=Aire-Aire Intercepción // Configuración aire-aire con énfasis en MRAAM/SRAAM

# ---------- Anti Surface loadouts ----------
Strike=Ataque // Bombas de caída libre en 1 salva
StrikeLongRange=Ataque Largo Alcance // Igual que Ataque pero con menos armas y más combustible
StrikePrecision=Ataque de Precisión // Bombas guiadas o misiles de ataque (como el AS-7)
StrikeHeavy=Ataque Pesado // Configuración de ataque para bombarderos pesados. (Para marcarlo para uso de la IA)
StrikeDemo=Ataque Demolición // Configuración especializada para bombas superpesadas (>1300 kg) destinadas a aniquilar objetivos puntuales como búnkeres, puentes y otros objetivos reforzados
StrikeLowAlt=Ataque Baja Cota // Ataque a baja altura destinado a bombas frenadas, como Snakeye o bombas de paracaídas

CAS=Apoyo Aéreo Cercano // Cohetes, bombas de racimo, bombas. Habitualmente en salvas pequeñas para aumentar el número de ataques
CASLight=Apoyo Aéreo Cercano Ligero // Igual que CAS, pero centrado en la autonomía sobre la carga útil
AntiArmor=Antitanque // Misiles de ataque útiles principalmente solo para vehículos terrestres (como el AS-7)

LandAttack=Ataque a Tierra // Configuración de misiles de crucero aire-superficie (ataque a tierra) de largo alcance, p. ej. AGM-86C o RGM-109C

# ---------- Anti Ship loadouts ----------
AntiShip=Antibuque // La configuración más genérica. Puede incluir cualquier cosa desde bombas de caída libre hasta misiles de medio alcance
AntiShipLongRange=Antibuque Largo Alcance // Igual que Antibuque, pero con tanques de combustible
AntiShipPrecision=Antibuque de Precisión // Otra configuración genérica. Puede incluir bombas guiadas y misiles
AntiShipHeavy=Antibuque Pesado // Diseñado para marcar bombarderos antibuque pesados como Tu-22 y Tu-16 y aviones pequeños con la mayoría de las armas

# ---------- Anti Sub loadouts ----------
ASW=ASW // ASW multipropósito: Torpedos, cargas de profundidad, sonoboyas
ASWHunter=Cazador ASW // Solo sonoboyas, sin armas
ASWHunterLight=Cazador ASW (Ligero) // Solo sonoboyas, sin armas
ASWKiller=Asesino ASW // Solo armas ASW
ASWBomb=ASW (Cargas de profundidad) // Cargas de profundidad ASW
ASWLongRange=ASW Largo Alcance // Torpedo + tanque de combustible

# ---------- Special loadouts ----------
SEAD=SEAD // Misiles antirradiación, bombas de racimo
SEADLongRange=SEAD Largo Alcance // Igual que SEAD, pero con menos armas y más tanques de combustible
SEADAdvanced=SEAD Avanzado // SEAD, pero utilizando munición contable, de suministro limitado o de tiempo restringido como HARM, STARM o AS-11

AEW=Alerta Temprana // Solo un nombre descriptivo para indicar el propósito del avión. Esta configuración se supone que es igual a "Vacío"
Recon=Reconocimiento // También indica el propósito del avión. En algunos casos se usa para transportar pods de reconocimiento.
EW=Guerra Electrónica // También indica el propósito del avión. En algunos casos se usa para transportar pods de EW.
Transport=Transporte // También indica el propósito.

Tanker=Cisterna // Configuración de cisterna. Permite reabastecimiento

Gun=Solo Cañón // Solo munición de cañón cargada

# ---------- Cargo loadouts ----------
Containers=Contenedores
Munitions=Municiones
MilitaryVehicles=Vehículos Militares
DryCargo=Carga Seca
Vehicles=Vehículos
Fertilizer=Fertilizante
Lighters=Lanchones
Oil=Petróleo
Ore=Mineral
Passengers=Pasajeros
Troops=Tropas

