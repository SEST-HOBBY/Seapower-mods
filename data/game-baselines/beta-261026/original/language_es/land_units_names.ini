[usa_aaa_m51]
Type=Artillería Antiaérea
Default=M51 Skysweeper,M51 AAA
DefaultDescription=El M51 Skysweeper fue un montaje de artillería antiaérea estadounidense que incorporaba un Radar de dirección de tiro, cargador automático y un director de tiro analógico destinado a atacar objetivos de corto alcance, ya que las plataformas SAM de la época eran ineficaces a esas distancias. Fue retirado del servicio estadounidense a finales de la década de 1950, y operadores extranjeros como Japón y Turquía los utilizaron hasta las décadas de 1960/70.
