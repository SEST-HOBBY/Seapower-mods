[swe_ersta]
Type=Artillería Costera
Default=Batería ERSTA,Artillería Costera
DefaultDescription=El 12 cm tornautomatpjäs m/70 (también conocido como ERSTA) es una pieza de artillería costera sueca diseñada como reemplazo de cañones más antiguos de la Segunda Guerra Mundial. Está diseñado para defender áreas vitales como puertos frente a fuerzas de desembarco soviéticas, así como para realizar denegación de área. Estos cañones estaban conectados a instalaciones de apoyo que permitían a las dotaciones autosostenerse hasta 60 días, lo cual sería importante en un potencial campo de batalla nuclear. Ocho de estos cañones fueron exportados también a Noruega a finales de la década de 1980.
Variant1=Batería ERSTA,Artillería Costera

