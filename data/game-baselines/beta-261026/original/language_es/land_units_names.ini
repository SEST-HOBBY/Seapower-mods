[ -------------------- Vehicles -------------------- ]
[pla_apc_type63]
Type=APC
Default=APC Tipo 63,APC Tipo 63
DefaultDescription=Comparable al M113 estadounidense, el Tipo 63 es el primer vehículo blindado chino construido sin ayuda soviética. Al igual que el M113, es altamente adaptable y ha sido utilizado tanto por China como por varias naciones aliadas, como Vietnam, Corea del Norte, Bangladesh e Irak. Fue suministrado al Ejército de Vietnam del Norte durante la Guerra de Vietnam y también vio servicio en la Guerra Irán-Irak. En el servicio chino, fue reemplazado por el ZSD 89 a partir de la década de 1990.
Variant1=APC Tipo 63,APC Tipo 63

[pla_lt_type_63]
Type=Tanque ligero
Default=LT Tipo 63,LT Tipo 63
DefaultDescription=Desarrollado a partir del PT-76 soviético, el Tipo 63 es un tanque ligero anfibio chino que entró en servicio a mediados de la década de 1960. A diferencia del PT-76, incorpora numerosos cambios menores, como una tripulación de cuatro hombres, posición del conductor a la izquierda, torreta montada centralmente y la capacidad de usar sus cadenas para nadar junto a la propulsión por chorro de agua. Ha sido exportado a varias naciones aliadas de China y entró en acción por primera vez durante las etapas finales de la Guerra de Vietnam. Más tarde fue reemplazado en el servicio chino de primera línea por el modificado Tipo 63A.
Variant1=LT Tipo 63,LT Tipo 63
Variant2=LT Tipo 63,LT Tipo 63
Variant3=LT Tipo 63,LT Tipo 63
Variant4=LT Tipo 63,LT Tipo 63
Variant5=LT Tipo 63,LT Tipo 63
Variant6=LT Tipo 63,LT Tipo 63
Variant7=LT Tipo 63,LT Tipo 63

[pla_spaag_type63]
Type=SPAAG
Default=SPAAG Tipo 63,SPAAG Tipo 63
DefaultDescription=Fabricado tomando el chasis de un T-34 y acoplándole una torreta con cañones gemelos Tipo 61 de 37 mm, el SPAAG Tipo 63 fue suministrado por China al Ejército de Vietnam del Norte durante la Guerra de Vietnam (aunque existen fuentes contradictorias sobre su origen). Después de la guerra, fue utilizado tanto por el NVA como por el PLA, retirándose finalmente en 1990.
Variant1=SPAAG Tipo 63,SPAAG Tipo 63

