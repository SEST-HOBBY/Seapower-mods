[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.20

Length=93.9								// In meters
Beam=14.2								// In meters

CompartmentsHeight=0.18					// Governs buoyancy compartment height and also missile aimpoint
ArmorType=None							// None, Minor, Moderate, Heavy

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[---------- Physics and Control ----------]
[Physics]
Displacement=2700						// In tons

MaxForwardVelocity=22.0					// Sets the max forward velocity
MaxBackwardVelocity=7.0					// Sets the max backward velocity
LinearDrag=0.96							// This is for velocity damping (linear drag)
MaxAccelerationFactor=1.06
MinAccelerationFactor=0.1

RudderTurnRate=4.5						// Turn rate of the rudder in degrees per second
RudderForce=0.55						// Multiplicator defining how agile the ship can turn

TiltFactor=1.2							// Defines how strong the tilting will be
PitchFactor=0.5							// Defines how strong the pitch will be based on speed and acceleration

TrimDepth=1.5							// Default trim depth in feet
TrimAngle=0.0							// Default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0					// Distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.03,0					// Center of mass for physics
CavitationSpeed=5		 	  			// Defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.50							// Density of water is 1. Density < 1 means it will float
OutOfWaterDrag=25.0						// Drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0						// Drag for the water physics in case the vessel is below the water line

[SensorData]
# Visual
VisualIdentificationRange=12.0			// Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=130							// Base sound level in dB at 1m distance (140 as OHP long hull ref)
FlowNoise=1								// Additional flow noise per knot in dB (20 kn would be +20 dB)
CavitationNoise=5						// Additional noise for cavitation in dB
BladesCount=5							// Number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5		// In dB, minimal value of noise to begin classification/identification
ElectricFrequency=50					// In Hz

[Animations]
NumberOfAnimationReferences=2
AnimationFile_1=animations_ae_opv_meteoro
AnimationFile_2=eu_animations_NSM

