[Language_en]
Name=SEST Banda - Fury Wingmen
Description=BANDA SEA, mid-morning. A PLAAF J-16 pair has held a combat air patrol over the northern Banda since dawn, and the strike waiting behind it cannot launch until the patrol is gone.

One Super Hornet from the carrier and three FQ-44 Fury wingmen: two escorts with AMRAAM and Sidewinder, and an EW Fury carrying the jammer. Nobody has flown the naval Fury in anger. Keep the wingmen behind the Super Hornet, point the jammer at the J-16s, and let the Furys take the first shots. The Super Hornet comes home.
Objective_CAP=Shoot down the J-16 patrol
Objective_Lead=Bring the Super Hornet home
Taskforce1StartMessage=<color=yellow>Fury Wingmen</color>|BANDA SEA, mid-morning. A PLAAF J-16 pair has held a combat air patrol over the northern Banda since dawn, and the strike waiting behind it cannot launch until the patrol is gone.

One Super Hornet from the carrier and three FQ-44 Fury wingmen: two escorts with AMRAAM and Sidewinder, and an EW Fury carrying the jammer. Nobody has flown the naval Fury in anger. Keep the wingmen behind the Super Hornet, point the jammer at the J-16s, and let the Furys take the first shots. The Super Hornet comes home.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The patrol is down and the strike can launch. The wingmen did the shooting.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The Super Hornet is lost, or the patrol still holds the northern Banda.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The Super Hornet is lost, or the patrol still holds the northern Banda.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The patrol is down and the strike can launch. The wingmen did the shooting.
