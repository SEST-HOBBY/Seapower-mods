Taskforce1startMessage=Russia has launched a massive ground attack on the baltic nations. Especially the region surrounding the Suwalki gap has seen extensive combat. A forward element of Russian ground units has broken through Lithuanian defences and is threatening to surround Klaipeda trying to block Nato from reinforcing their units already in the Baltics via sea. \r\n\r\nA large surface task force has been detected in the Gulf of Finland. It is likely tasked with intercepting Nato reinforcements. \r\n\r\n\r\nObjective: Deliver reinforcements to Klaipeda\r\n\r\nOptional: Find out where the ongoing land attack on Klaipeda is being coordinated from and destroy the command center. Alternatively, destroy all attacking tanks.
