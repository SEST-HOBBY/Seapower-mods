[Language_en]
Name=SEST Banda - Sanctioned Cargo
Description=BANDA SEA, first light. Three hulls broke out of the Bayu-Undan anchorage overnight under a sanctioned flag and are running east for the Seram passage. Two are lifts. One is an armed escort, and the fourth contact in the group has been squawking as a merchant since it sailed - the last four vessels that did that in this corridor turned out to be the same decoy hull.\n\nYou have ANZAC and ARUNTA, detached from the Darwin surface group and 40 nautical miles south of the lane. The Banda corridor carries real traffic: a vehicle carrier and two fishing boats are inside your weapons envelope right now and none of them are yours to sink. Identify before you shoot. The lifts must not reach the passage.
Objective_Lifts=Stop both sanctioned lifts
Objective_Neutrals=Harm no neutral shipping
Objective_Ships=Bring both frigates home
Taskforce1StartMessage=<color=yellow>Sanctioned Cargo</color>|BANDA SEA, first light. Three hulls broke out of the Bayu-Undan anchorage overnight under a sanctioned flag and are running east for the Seram passage. Two are lifts. One is an armed escort, and the fourth contact in the group has been squawking as a merchant since it sailed - the last four vessels that did that in this corridor turned out to be the same decoy hull.\n\nYou have ANZAC and ARUNTA, detached from the Darwin surface group and 40 nautical miles south of the lane. The Banda corridor carries real traffic: a vehicle carrier and two fishing boats are inside your weapons envelope right now and none of them are yours to sink. Identify before you shoot. The lifts must not reach the passage.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Both lifts are on the bottom and the passage is closed. The escort can run home and explain it.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Both frigates lost. The lane is open and Darwin knows it.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|Both frigates lost. The lane is open and Darwin knows it.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Both lifts are on the bottom and the passage is closed. The escort can run home and explain it.
NeutralLossMessage=<color=orange>Neutral vessel hit.</color>|A neutral crew is in the water. That will be on the record.
