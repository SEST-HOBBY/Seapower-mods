Name=SEST Intercept Model
Description=Restores the eight global intercept keys that the Tu-95/AS-15 mod's pre-0.8.x ammunition/damage.ini deletes from the whole collection, including InterceptChanceOutOfAltitudeOverride, the hard 5% ceiling on out-of-altitude intercepts, and the five InterceptSizeBonus values no round can opt out of. Every mod here was authored against a stock game where these are live, so the current state is an accidental global buff from an unrelated bomber mod. That mod's VeryLarge impact tier is carried forward unchanged so its own content still works. Ships with the two overrides that make restoring the table safe: Red Storm Arsenal's SM-6 family (usn_rim_174a/b/c) drops its 70,000 ft engagement floor to 15 ft, matching the ESSM and SM-2 that mod puts on the same hulls and the Euromod SM-6 of the same ceiling, and David's Sling (idf_stunner) has its MaxAttackAltitude rewritten without the thousands separator that reads as 51 feet under some locales. Generated by integration/intercept-model/build_patch.py; must load above every workshop mod.

