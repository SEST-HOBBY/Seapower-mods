Name=SEST Cross-Deck
Description=Allied flight decks operate the similar allied aircraft: a deck that already flies one Seahawk, NH90, Lynx or Wildcat, Merlin, Sea King, AB 212, Panther, Seasprite, Cougar, CH-53, Osprey, Harrier, AV-8B/F-35B or catapult type takes the allied members of that family too, so an Australian MH-60R lands on a Type 45 or a Maya and a Royal Navy Merlin on a FREMM. One Anchor Chain extend per deck; the hull's own list is kept and only existing allied aircraft are added.

