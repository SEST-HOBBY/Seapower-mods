Name=SEST Cross-Deck
Description=Allied flight decks operate the similar allied aircraft: a deck that already flies one Seahawk, NH90, Lynx or Wildcat, Merlin, Sea King, AB 212, Panther, Seasprite, Cougar, Wasp, Alouette, CH-53, Osprey, Harrier, AV-8B/F-35B or catapult type takes the allied members of that family too, so an MH-60R lands on an Iver Huitfeldt, a Royal Navy Merlin on an Italian FREMM and a Rafale M on the Nimitz. One Anchor Chain extend per deck; the hull's own list is kept and only existing allied aircraft are added.

