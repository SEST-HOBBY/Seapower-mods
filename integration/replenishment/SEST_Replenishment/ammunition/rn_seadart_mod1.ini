[General]
# GWS.30 Sea Dart mod 1
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=ShoreTargetsOnly  // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=550                              // in kg. Used for aircraft
AmmoPoints=4080                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
SupplyCategory=SEST_LongRangeSAM              // For Supply System. Makes that presence of such category is required for replenishment of this weapon

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
IOCDate=1982						   // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=1985						   // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available


DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

FrontalArea=0.1159
SideArea=1.2
BottomArea=1.2
Volume=0.3082
[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=20
ImpactSize=Medium                    // Impact size, can be small, medium, large, verylarge
Penetration=Always                      // can be minor, moderate, heavy, always

FuzeProximityDistance=30.0              // for proximity fuze: distance to target in meters. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.85                     // Base chance to hit
InterceptSpeedPenaltyMultiplier=0.75                  // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
InterceptOutOfAltitudePenalty=0.4                  // base value used for out-of-altitude calculations, 0.20 is excellent, 0.30 is good, 0.40 is average, 0.50 is poor
InterceptSizePenaltyMultiplier=0.85					// multiplier to the size penalty, 1.0 is default
[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=2
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=2.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=10.0                      // Climb angle for initial loft
MaxLoftAlt=5000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=1000              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
TerminalDiveDistance=6                 // in N. miles. Ignored if TerminalLoft=True
#=========================================  Kinematics  ============================================================
ApplyKinematics=False                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=1800.0                     // Maximum speed in knots
MaxTurnRate=15.0                       // Maximum turnrate in degrees per second
MaxTurnG=25                       // Maximum G-limit of missile turns
#AccelerationTime=4                  // Burn time for initial booster burn
Acceleration=8                      // Gs of acceleration in initial burn
#SustainerAccelerationTime=200            // Time of sustainer burn. -1 if there is no sustainer burn
#SustainerAcceleration=1.0               // Acceleration of sustainer burn. -1 if there is no sustainer
#TypicalTargetAlt=0					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
#TypicalFiringAlt=0				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
#TypicalLaunchVelocity=0				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
#DragCoefficient=1               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
#VelocityBleed=0.8                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
#MaxFlightTime=80               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TerminalLoft=True
#TimeLimited=True
#========================================= Launch stats ============================================================
MinLaunchRange=2.2                     // Minimum launch range in nautical miles
MaxLaunchRange=40.0                    // Maximum launch range in nautical miles
MinAttackAltitude=30                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=60000                // Maximum altitude of target, in feet
MaxAttackVelocity=2000				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=0.98                 // Chance that engine will start on launch, used with 'DudDiscardAngles' to eject failed rounds overboard
SeekerReliability=0.98                 // Chance that seeker will activate properly and will be able to track targets
WarheadReliability=0.98                // Chance that warhead will detonate upon hit
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=50.0                         // Seeker gain in dB
SeekerFOV=120.0                         // Seeker field-of-view in degrees
SeekerActiveRange=0.0                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=80.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
#Misc Guidance Properties
#InsDrift=120							   // In degrees per minute of unguided flight. Shifts the weapon's nose by this amount per minute whenever the missile is not being actively guided (RC, Wire, tracking a target with its seeker)
# cass: meant for making missiles drift when they lose their target, blocked for now due to unresolved issues
#ECCM
AntiCountermeasuresBonus=0.35           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.3                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=2.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/rn_seadart/
ResourcesRoot=rn_seadart
ResourcesMesh=rn_seadart
ResourcesMaterial=rn_seadart_mat
ResourcesMeshForLaunch=rn_seadart_dummy
ResourcesMeshSwitchTime=0.1  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

[---------- Launchers ----------]
# References to the launchers are just used for positioning relative to the launcher of the missile
[Launchers]
NumberOfLaunchers=2
Launcher1=GWS-30
Launcher2=GWS-30_Mod0

[GWS-30]
LoadedPosition=0,0,0.014
UnloadedPosition=0,0,-0.06
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[GWS-30_Mod0]
LoadedPosition=0,0,0.012
UnloadedPosition=0,0,-0.06
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
DudExplosionClass=SmallFlakExplosions
BoosterEffect=effects/weapons/emitters/rn_seadart_booster
BoosterEffectPosition=0,0,0
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.018
InFlightEffectStartTime=6.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/new_motor_effects/aam_medium_effect_new_sustain_clean
SustainerEffectPosition=0,0,-0.0181
SustainerEffectStartTime=3.0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07
