[General]
# Hycore
Type=Missile
TargetType=ASuW
LandAttackCapability=None

Mass=3000                              
AmmoPoints=8500                       
SupplyCategory=SEST_LandAttack              // For Supply System. Makes that presence of such category is required for replenishment of this weapon

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

CIWSDefenceBonus=50                     
MissileDefenceBonus=0.35                    

DecalClass=Standard

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=0.05
# Sonar related
# Transient
TransientRCS=VerySmall                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=0
Power=100
ImpactSize=Large                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
[Guidance]
GuidanceType=3
MidCourseCorrection=0
TargetRequired=True                 
InitialFlightPhaseDuration=5.0
PerformsSlightBallisticInitialFlight=True
TerrainFollowFlight=False
ApplyKinematics=False                        // If we should use full kinematics rules. If this is true, we will only use kinematics 
#======================================== Flight Profile ===========================================================
#flight phase 1: loft -----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=85.0
MaxLoftAlt=70000.0              // feet
#flight phase 2: sea skimming ---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=490                      
SeaSkimmingMaxDescentAngle=35.0       
SeaSkimmingNoseUp=1.0                  
SeaSkimmingStartDistToTarget=100      
#flight phase 3: final flight phase ------------------------------------------------------------------------------
#flight phase 4: terminal approach ------------------------------------------------------------------------------------------------------
FinalFlightPhaseAlt=21.0            
FinalFlightPhaseMaxAngle=39.0
FinalFlightPhaseDistToTarget=39.0 
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=15.0
TerminalVelocity=2400                  
TerminalAlt=15                         
TerminalDiveDistance=12                 
SupportsBanking=True                   
IgnoreHeightDifferenceForTargetDist=True
SupportsBanking=True


#============================================= Misc ================================================================
AltitudeOverClutter=40
#========================================= Launch stats ============================================================
MaxVelocity=6500.0                              
VelocityBleed=0.5    
AccelerationTime=600                                    
Acceleration=8.5                                                                       
MaxTurnRate=7.0        
MinLaunchDepth=50                                             
MinLaunchRange=30.0                                                      
MaxLaunchRange=550.0                                                
LaunchReliability=97                   
#========================================     Seeker     ===========================================================
#Homing
CircularErrorRadiusInstallation=15
SeekerGain=80                        // Seeker gain in dB
SeekerFOV=30                          // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerActiveRange=20.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=0                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                      // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=60.0                         // Active radar seeker output peak power in kW
DefaultIgnoredTypes=LandUnit           // Seeker ignores objects of this type while in default mode
UseFinalFlightInLandMode=False         // Skip FinalFlightPhase when in LandAttack mode
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#Misc Guidance Properties
RangeGate=4							   // 
SizeGate=10						   //
#ECCM
AntiCountermeasuresBonus=0.25          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.15                   // This value substracted from probability of being jammed  (0...1)
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=10.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/K_weapon/models/
ResourcesRoot=K_weapon.obj
ResourcesMesh=Hycore
ResourcesMaterialFolder=assets/K_weapon/materials/ko_Hycore
ResourcesMaterial=Hycore_mat.ini
ResourcesMeshForLaunch=eu_launch_ircps
ResourcesMeshCanister=eu_launch_ircps
ResourcesMeshSwitchTime=0.0 // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/s-300_effect
BoosterEffectPosition=0,0,-0.04

InFlightEffect=effects/weapons/emitters/usn_rur-5_separation
InFlightEffectPosition=0,0,0.060
InFlightEffectStartTime=11.9

SustainerEffect=effects/weapons/emitters/sam_medium_effect
SustainerEffectPosition=0,0,-0.033
SustainerEffectStartTime=6.0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
#creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.02
