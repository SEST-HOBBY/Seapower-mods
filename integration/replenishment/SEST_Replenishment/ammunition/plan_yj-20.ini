[General]
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation    // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=3800                             // in kg. Used for aircraft
AmmoPoints=11050                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
SupplyCategory=SEST_LandAttack              // For Supply System. Makes that presence of such category is required for replenishment of this weapon

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

CIWSDefenceBonus=30                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.33                //because euro rim-174b have 95% unaffected hit chance when dive     // added chance to evade missile compounded by below factors

DecalClass=Standard          // referenced in effects/decals.ini

SaturationValue=8
DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=7  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=1.3
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=110                          // low warhead but high kinetic energy
ImpactSize=Medium            // low warhead but high kinetic energy
Penetration=Always              // can be minor, moderate, heavy, always

[OnBoardSystems]
ECM=YJ-21_ECM

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=3                            //Should be TV homing irl?
MidCourseCorrection=1                 // 0 = None, 1 = Radio Command, 2 = Wire Guided
TargetRequired=False                    // Cannot be launched to bearing
InitialFlightPhaseDuration=8.0        // time in seconds where the missile moves straight on without guiding
TerrainFollowFlight=False
PerformsSlightBallisticInitialFlight=False

#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=60.0                      // Climb angle for initial loft
MaxLoftAlt=262467          //120km          // in feet. Maximum altitude for lofting
MaxLoftVelocity=6600                 // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=262467                     // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=0.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=1100      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
#TerminalDelay=0                        // Overrides standart terminal delay
TerminalApproachDist=25              // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalAlt=20
TerminalDiveDistance=26                 // in N. miles.
SupportsBanking=True                   // if the missile will bank when turning
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
LocalTerminalOnly=False
TerminalVerticalTurnRate=25            // Override of vertical turn rate in terminal (intended for Pop-up)
#========================================= Launch stats ============================================================
ApplyKinematics=True                   // 如果我们使用完整的运动学规则。如果这是真的，我们将只使用运动学
MaxVelocity=6600                    // Stall at 500 knots   // Maximum speed in knots
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
AccelerationTime=55                  // 55 初始助推器燃烧的燃烧时间
Acceleration=6.5                   // 6.5 初始燃烧阶段的加速度Gs
SustainerAccelerationTime=15            // 持续燃烧时间。若无持续燃烧，则记为-1
SustainerAcceleration=2.0               // 持续燃烧加速。若无持续燃烧，则值为-1
#---- Total Δv ≈ 3407 ≈ 10Ma


TypicalLaunchVelocity=0 
TypicalFiringAlt=0                    //SAM的阻力计算应该从0高度开始
TypicalTargetVelocity=30 
TypicalTargetAlt=0                    //ASM的阻力计算应该让目标0高度0速度
//It should have significant drag at low altitudes

DragCoefficient=2.4               // 阻力系数。0表示无阻力，1表示默认阻力，数值越大表示阻力越大。默认值为-1，此时我们会根据导弹的最大射程来计算阻力系数

#MaxFlightTime=              // 基于电池等因素，导弹完全失效前的运行时间作为硬限制。默认值：无限

MaxTurnRate=12                         // Maximum turnrate in degrees per second
MinLaunchRange=60                     // Minimum launch range in nautical miles
MaxLaunchRange=995                    // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
WobblingStrength=4                   // amplitude of wobbling. Marks thatmissile performs some wobbling flight
WobblingSpeed=1.2                      // frequency of wobbling
VerticalWobblingStrength=4                   // amplitude of wobbling. Marks that missile performs some wobbling flight
VerticalWobblingSpeed=1                      // frequency of wobbling
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=15     // Circular error vs 'Installation' land units
CircularErrorProbable=15     // radius in meters at max range for shells to impact
#Homing
SeekerGain=100                          // Seeker gain in dB
SeekerFOV=45                           // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerActiveRange=26             // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=0                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                       //Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=500                           // Active radar seeker output peak power in kW
TargetMemory=False                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.750          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.6                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=20.0                 // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/ammunition/
ResourcesRoot=YJ-20.obj
ResourcesMesh=yj-20
ResourcesMaterial=yj-20_mat.ini
ResourcesMeshForLaunch=launch
ResourcesMeshCanister=launch
ResourcesMeshSwitchTime=8  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

# Optional debris related stuff
[Debris]
DebrisProbability=95            // probability for debris to happen
ResourcesMeshForDebris=wp_as-4  // optional debris mesh after destruction
DebrisPosition=0.05             // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.99
DebrisHeightLossAdd=0.0005      // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=effects/weapons/emitters/s-300_effect
BoosterEffectPosition=0,0,-0.072

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.095
InFlightEffectStartTime=0.5  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/sam_medium_effect
SustainerEffectPosition=0,0,-0.03
SustainerEffectStartTime=0.6
SustainerEffectScale=3,3,3

HitShipExplosionClass=LargeShipHitExplosion
HitShipExplosionRotation=0,25,0
HitAirExplosionClass=LargeMissileExplosions
HitAirExplosionRotation=0,25,0
HitDefaultExplosionClass=LargeMissileExplosions
HitDefaultExplosionRotation=0,25,0
HitWaterSplashClass=LargeWaterSplashes
HitWaterSplashRotation=0,25,0

DebrisTrail=effects/aircraft/emitters/helicopterfireeffect
DebrisSplashClass=MediumWaterSplashes
ExplosionOverwaterSplash=False

[---------- Colliders ----------]
