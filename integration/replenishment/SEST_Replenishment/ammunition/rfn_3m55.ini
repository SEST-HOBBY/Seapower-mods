[General]

Type=Missile
TargetType=ASuW                        // can be AAW, ASuW, ASW

CIWSDefenceBonus=20                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.3                    // Less chance to be intercepted by SAM because of anti-interception maneuvers

Mass=3000                            // in kg. Used for aircraft
AmmoPoints=5000                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
SupplyCategory=SEST_LandAttack              // For Supply System. Makes that presence of such category is required for replenishment of this weapon

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

SaturationValue=2

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance
TransientBaseNoise=240                 // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = HighExplosive     =  100% damage to structre
#1 = Armor Piercing		TBD
#2 = HEAT				TBD
#3 = Illumination		TBD
#4 = Cluster           =  -50% damage to structre
#5 = Runway Cratering	TBD
#6 = Fragmentation     =  -50% damage to structre
[WarheadData]
WarheadType=0
Power=52
ImpactSize=Large                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                       // can be minor, moderate, heavy, always

[OnBoardSystems]
ECM=SS-N-19_ECM

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3.0         // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=True  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=50.0                      // Climb angle for initial loft
MaxLoftAlt=45932.0                     // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=33                      // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=20          // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=120        // in N. miles.
#flight phase 3: final flight phase------------------------------------------------------------------------------
FinalFlightPhaseAlt=15                 // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=15.0
FinalFlightPhaseDistToTarget=25.0      // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=16                 // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalVelocity=1336                  // Maximum speed in knots when missile is locked on target
TerminalAlt=15                         // in feet. Weapon will try to get to this altitude at the start of terminal approach
SupportsBanking=True                   // if the missile will bank when turning

GroupSize=24                            // Indicates that missiles can join into groups
GroupJoinRange=20                      // in miles
GroupSpacing=0.4                       // in miles. interval between misseles in line
GroupLeaderAlt=16.0                    // in feet. altitude of leading missile. Only for FinalFlightPhase
GroupWingmanAlt=16.0                   // in feet. altitude of non-leading missile. FinalFlightPhase
#========================================= Launch stats ============================================================
MaxVelocity=1737                       // Maximum speed in knots
Acceleration=16.0                      // Acceleration factor
LaunchTurnRate=50                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
MinLaunchRange=10                       // Minimum launch range in nautical miles
MaxLaunchRange=430                   // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=38.0                        // Seeker gain in dB
SeekerFOV=60,10                        // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SecondaryPassiveRadarGuidanceType=Full // Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
SeekerActiveRange=27.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=100                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
Frequency=Ku-Band                      // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=35                           // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
DefaultIgnoredTypes=LandUnit           // Seeker ignores objects of this type while in default mode
UseFinalFlightInLandMode=False         // Skip FinalFlightPhase when in LandAttack mode
#ECCM
AntiCountermeasuresBonus=0.6           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.6                    // This value substracted from probability of being jammed  (0...1)
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/ammunition/3m55/
ResourcesRoot=3m55.obj
ResourcesMesh=3m55
ResourcesMaterial=3m55_mat.ini
ResourcesMeshForLaunch=3m55launch
ResourcesMeshCanister=3m55launch
ResourcesMeshSwitchTime=3  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=effects/weapons/emitters/s-300_effect
BoosterEffectPosition=0,0,-0.05
InFlightEffect=effects/weapons/emitters/turbojet_sustainer
InFlightEffectPosition=0,0,-0.05
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes

ExplosionOverwaterSplash=False

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=coll_main

[coll_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.01,0.01,0.13