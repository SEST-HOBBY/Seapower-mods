[General]
UnitType=Vessel
Type=FSG
Nation=GER
YearIntroduced=2025
NumberOfVariants=5
DefaultCameraDistance=2.0
MinCameraDistanceForeAft=1.0
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.15

Length=89.1                     // in meters
Beam=13.3                      // in meters

CompartmentsHeight=0.05        // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None
NumberOfDCTeams=1

[---------- FlightDeck Definitions ----------]
[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
// all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1840             // in tons

MaxForwardVelocity=26.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.72                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=7.0             // turn rate of the rudder in degrees per second
RudderForce=1.0                // multiplicator defining how agile the ship can turn

TiltFactor=1.2               // defines how strong the tilting will be
PitchFactor=0.2               // defines how strong the pitch will be based on speed and acceleration

TrimDepth=1.5                  // default trim depth in feets
TrimAngle=-0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=5		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                  // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=20.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=20.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=13.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=250
# Sonar related
BaseNoise=125                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=4               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
PropellerType=Skewback
MachineryRaftingGeneration=2
TonalRPMModifier=100
NoiseFrequencies=LF,MF
DistinctiveNoise=False
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset

[Animations]
NumberOfAnimationReferences=3
AnimationFile_1=eu_animations_mk49
AnimationFile_2=eu_animations_RBS15
AnimationFile_3=eu_animations_parts

[---------- AI related ----------]
[AI]
UnitCostValue=1840            // value for the unit cost for least valuable target checks
UnitScoreValue=4              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=4
ASuW_Capability=4
ASW_Capability=0

#Defence
MissilesToSaturate=4        //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=2       //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD          //Anti-Missile Defence
ATD_Capability=TBD          //Anti-Torpedo Defence
