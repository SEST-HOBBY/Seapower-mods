# ger_ffg_f126  F126 Niedersachsen class as contracted. Built from the German Navy Euromod templates (F125 MLU, F127, F125). Not tested in game yet.
[General]
UnitType=Vessel
DefaultCameraDistance=3.4
MinCameraDistanceForeAft=1.8
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.2

Length=166                     // in meters
Beam=21.7                      // in meters

CompartmentsHeight=0.08        // Governs bouyancy compartment height and also missile aimpoint
ArmorType=Minor
NumberOfDCTeams=2

[---------- FlightDeck Definitions ----------]

[AirGroup]
ger_nh90=Squadron1,2

[FlightDeck]
AircraftCapacity=2
NumberOfElevators=2
NumberOfLaunchPoints=1
NumberOfRecoveryPoints=1
NumberOfTaxiPaths=4
AircraftSupported=de_nh90,ger_nh90,de_sea_lynx_mk88,ger_sea_lynx_mk88
LaunchDelay=5

HoldStackSeparation=200 //In feet
HoldSpeed=200           //In knots. Landing is permitted once speed was lower than this

SystemGroup=SG_Hangar
Collider=coll_hangar

# ---------- Flight Deck Ammunition ----------
FlightDeck_AmmoCapacity=2500/2500             // Ammo points. Can be numerical value or "Unlimited"

FlightDeck_NumberOfAccountableAmmunitionCategories=1
FlightDeck_AccountableAmmunitionCategory_1=AirTorpedo,16/16

# Hoehen fuer den NH90 (de_nh90, GroundPivot 0,-0.006,0): das Spiel setzt den GroundPivot auf den Punkt, die ausgefahrenen
# Hauptraeder liegen 0.00311 darueber. Punkt = Hangarboden 0.04899 bzw. Flugdeck 0.04883 minus 0.00311 (Bugrad 0.09 m tiefer).
[Elevator1]
AssociatedLaunchPoints=1
BlocksElevators=2

HangarOpenAnimation=F126_RollerOpenRight
HangarCloseAnimation=F126_RollerCloseRight

SpawnPosition=-0.05804,0.04588,-0.64611
RidePosition=-0.05804,0.04588,-0.64611

SingleVehicle=True
CloseDoorsAfterTaxi=True
RequiresFreeLaunchpoint=True

[Elevator2]
AssociatedLaunchPoints=1
BlocksElevators=1

HangarOpenAnimation=F126_RollerOpenLeft
HangarCloseAnimation=F126_RollerCloseLeft

SpawnPosition=0.05804,0.04588,-0.64611
RidePosition=0.05804,0.04588,-0.64611

SingleVehicle=True
CloseDoorsAfterTaxi=True
RequiresFreeLaunchpoint=True

[LaunchPoint1]
AllowedType=Helicopter
AssociatedElevators=1,2
BlocksRecoveryPoints=1
Position=0.00000,0.04572,-1.03671

[RecoveryPoint1]
AllowedType=Helicopter
AssociatedElevators=1,2
BlocksLaunchPoints=1
Position=0.00000,0.04572,-1.03671
Rotation=0    
                  // in degrees
CircuitWaypoints=0,100,-0.4

[TaxiPath1]
From=Elevator1
To=LaunchPoint1
IsBackwards=True
Waypoints=-0.05804,0.04572,-0.88106|-0.05804,0.04572,-0.88106

[TaxiPath2]
From=RecoveryPoint1
To=Elevator1
Waypoints=-0.05804,0.04572,-0.88106|-0.05804,0.04572,-0.88106

[TaxiPath3]
From=Elevator2
To=LaunchPoint1
IsBackwards=True
Waypoints=0.05804,0.04572,-0.88106|0.05804,0.04572,-0.88106

[TaxiPath4]
From=RecoveryPoint1
To=Elevator2
Waypoints=0.05804,0.04572,-0.88106|0.05804,0.04572,-0.88106

[---------- Physics and Control ----------]

[Physics]
// all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=10550            // in tons

MaxForwardVelocity=26.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=7.0             // turn rate of the rudder in degrees per second
RudderForce=0.7                // multiplicator defining how agile the ship can turn

TiltFactor=2.4               // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.0                  // default trim depth in feets
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=5		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.366                  // waterline -2.27 m = (Density - 0.5) x 16.92 m (half bounds height of the hit colliders); draft 5.9 m over the keel
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=13.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Large
# Radar related (RCS => radar cross section)
RCS=1500
# Sonar related
BaseNoise=120                    // base sound level in db at 1m distance
FlowNoise=0.8                    // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=4                // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
MachineryRaftingGeneration=4
PropellerType=Skewback
NoiseFrequencies=LF,MF
TonalRPMModifier=100
DistinctiveNoise=False
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset

[Animations]
NumberOfAnimationReferences=4
AnimationFile_1=eu_animations_mk49
AnimationFile_2=eu_animations_mk41_v2
AnimationFile_3=eu_animations_NSM
AnimationFile_4=animations_F126

