[torpedo_tubes_1]
# Twin 324 mm torpedo launcher in the style of the Mk 32 Mod 9 (port): two tubes one above the other (MIL-T-82571A 3.1),
# muzzle ring and bore, bands, breech with door, hinge and handwheel, firing valves, two frame plates with clamps,
# legs, air valve block with gauge and charging hose, junction box.
# Tubes point outboard and forward at 55 deg to the centre line like LaunchAngle; fully inside the torpedo room (torp_rooms)
