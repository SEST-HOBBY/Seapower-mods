[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.12

Length=175                     // in meters
Beam=23                      // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=48000             // in tons

MaxForwardVelocity=32.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=15.0
MaxBackwardVelocity=5.0        // sets the max backward velocity
MaxBackwardVelocitySurfaced=5.0
TelegraphVelocities=-5,0,5,10,15,20,32

BowUnderWater=19.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=55.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.8                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=20.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=-3                 // To hide screws...
#TrimDepth=-2                 // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=65.0            // in feet
CrushDepth=2000.0              // in feet

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=7.5  // Biggest range in nm at which this unit can be visually identified
IRSignature=Meager
# Radar related (RCS => radar cross section)
RCS=Meager
# Sonar related
BaseNoise=130                  // base sound level in db at 1m distance
FlowNoise=1.1                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=30             // additional noise for cavitation in db
TargetReflectionStrength=25    // in dB for broad side
BladesCount=8                  //number of blades on vessel's propulsion systems
ElectricFrequency=50           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_wp_ssbn_typhoon

[---------- AI related ----------]
[AI]
UnitCostValue=10000           // value for the unit cost for least valuable target checks
UnitScoreValue=10             // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=8
ASW_Capability=6

#Defence
#Special
Role=SSBN

