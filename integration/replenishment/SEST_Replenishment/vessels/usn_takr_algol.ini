# the one supplier here that is NOT Role=RAS - it is Role=Transport, an MSC
# fast sealift Ro-Ro. Top tier all the same, and on its own merits: at 288 m
# it is the LONGEST hull in this table, longer than the Sacramento, with 31
# cargo slots of military materiel. Strategic sealift is precisely the thing
# that moves the heaviest items - so no size ceiling, and it will pass a
# Granit at 21000 like the ammunition ships. What it does not have is a
# replenishment rig, and that is where the cost sits instead of in a
# ceiling: 45 points/sec against an AOE's 120, and 8 kn on a hull that makes
# 33. It carries anything, slowly, very nearly stopped

