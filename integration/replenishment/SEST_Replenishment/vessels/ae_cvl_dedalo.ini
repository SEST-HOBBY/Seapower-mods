[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=3.25
MinCameraDistanceForeAft=1.8
MinCameraDistanceBroadside=0.9
CameraPivotHeight=0.25

Length=189.9							// In meters
Beam=21.8								// In meters

CompartmentsHeight=0.25					// Governs bouyancy compartment height and also missile aimpoint
ArmorType=Minor

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=16416						// In tons

MaxForwardVelocity=26.0					// Sets the max forward velocity
MaxBackwardVelocity=5.0					// Sets the max backward velocity
LinearDrag=0.97							// This is for velocity damping (linear drag)
MaxAccelerationFactor=0.30
MinAccelerationFactor=0.15

RudderTurnRate=2.3						// Turn rate of the rudder in degrees per second
RudderForce=0.4							// Multiplicator defining how agile the ship can turn

TiltFactor=6							// Defines how strong the tilting will be
PitchFactor=1.0							// Defines how strong the pitch will be based on speed and acceleration

TrimDepth=2.0							// Default trim depth in feet
TrimAngle=0.0							// Default base trim angle (x-axis, so pitch)
CenterToKeelDist=-0.105					// Distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0,0.03					// Center of mass for physics

CavitationSpeed=3						// Defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5								// Density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0						// Drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0						// Drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=15.0			// Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge
# Sonar related
BaseNoise=170							// Base sound level in db at 1m distance
FlowNoise=1								// Additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10						// Additional noise for cavitation in db
BladesCount=4							// Number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5		// In dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60					// In Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_ae_cvl_dedalo

[---------- AI related ----------]
[AI]
UnitCostValue=6000						// Value for the unit cost for least valuable target checks
UnitScoreValue=8						// Value for calculation of mission score

