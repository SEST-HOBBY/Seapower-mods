[AmmunitionNames]
# ---------- SEST AIM-424 MALICE ----------
sest_aim-424=AIM-424,MALICE,AAM,The Raytheon AIM-424 LRAAM is a very-long-range air-to-air missile revealed by the US Navy in August 2026 and already in flight test. It is a 680 kg solid-propellant round 4.11 m long on the same 34.3 cm diameter as the SM-6 - short enough to fit the F-35C internal weapons bay - and the Navy states a range in excess of 250 nautical miles. It pushes the carrier air wing's reach out to the high-value aircraft behind an attack: airborne early-warning radars and tankers and standoff jammers. Active-radar terminal homing with two-way datalink midcourse guidance is backed by a passive anti-emitter mode that homes on radars and jammers alike so a target that shuts down its radar does not break the engagement. Like the AIM-174B it keeps a secondary anti-surface mode.
# ---------- taken in from the RAAF F-35A ----------
usaf_aim-120c7=AIM-120C-7,AMRAAM,AAM,AIM-120 is an active radar-guided air-to-air missile of the United States, used to replace the old Sparrow semi-active radar-guided air-to-air missile. It is relatively small and can be carried by most aircraft.
usaf_gbu-31_v1=GBU-31(V)1,JDAM,Land Strike,The Joint Direct Attack Munition is an air-dropped bomb accessory developed jointly by Boeing for the U.S. Navy and Air Force. It is installed on traditional bombs dropped by aircraft to transform the originally uncontrolled traditional aerial bombs into controllable precision-guided weapons that can be used in severe weather conditions.
usaf_gbu-53=GBU-53,StormBreaker,Land Strike,The GBU-53 is an air-launched precision-guided glide bomb. The bomb was developed by Raytheon. In the initial bidding, the team of Boeing and Lockheed Martin won the contract for the bomb, but it was shelved for several years due to the Darlene Drewyn corruption case and was not re-bid until September 2005.
