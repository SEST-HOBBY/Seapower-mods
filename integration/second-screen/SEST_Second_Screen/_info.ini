[Language_en]
Name=SEST Second Screen
Description=Parks the tactical map (1416px square) and the Formation Manager window on the 'aux' monitor, for a game window spanning 5120x1440. The 3D view keeps the other monitor to itself. REQUIRES a window that actually spans both screens (Surround/Eyefinity, or a borderless window sized to the pair) - on a single 2560px-wide screen the map lands off-view. The bottom unit row, right-click order menus and the pause menus stay on the main screen: the game exposes no geometry for them. Rebuild in single-screen mode before playing on one monitor.

[Compatibility]
