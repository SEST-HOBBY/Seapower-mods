[sov_mi6]
# copied from 3840530663/language_en/sov_mi6_aircraft_names.ini
Type=Transport Helicopter
Default=Mi-6A,Mi-6A
DefaultDescription=Mi-6A (NATO: Hook-A) Soviet heavy transport helicopter, for years the largest helicopter in the world. Two D-25V turboshafts drive a five-blade 35 m main rotor; a small wing unloads the rotor in cruise. Carries 65 equipped troops, 41 stretchers or 12,000 kg of cargo through the rear clamshell doors. Defensive armament: one A-12.7 12.7 mm machine gun in the nose, aimed by the navigator.
Squadron1=Mi-6A Soviet Air Force,Mi-6A

[sov_mi26]
# copied from 3841089493/language_en/sov_mi26_aircraft_names.ini
Type=Transport Helicopter
Default=Mi-26,Mi-26
DefaultDescription=Mi-26 (NATO: Halo) Soviet heavy transport helicopter, in service from 1983 and the largest helicopter ever built in series. Two D-136 turboshafts of 11,400 hp drive an eight-blade main rotor, 32 m across, the first on a production helicopter; the five-blade tail rotor sits on the right. Carries 82 equipped troops, 60 stretchers or 20,000 kg of cargo, such as an armoured vehicle, through the rear ramp and clamshell doors. Unarmed.
Squadron1=Mi-26 Soviet Air Force,Mi-26

[sov_be12]
# copied from 3841609974/language_en/sov_be12_aircraft_names.ini
Type=Maritime Patrol,MPA
Default=Be-12,Be-12
DefaultDescription=Beriev Be-12 Chayka (NATO: Mail), Soviet twin-turboprop amphibian for anti-submarine patrol, accepted into service in 1965. Gull wing with two AI-20D engines, boat hull with a retractable tailwheel undercarriage, twin fins and a magnetometer boom. Initsiativa-2B search radar in the nose, sonobuoys, and a bomb bay behind the hull step for AT-1 torpedoes or depth bombs, plus four underwing pylons. Crew of four.
Squadron1=Be-12 Soviet Naval Aviation,Be-12
Squadron2=Be-12 Vietnam People's Air Force 933rd Regiment,Be-12

[sov_be12n]
# copied from 3841609974/language_en/sov_be12_aircraft_names.ini
Type=Maritime Patrol,MPA
Default=Be-12N,Be-12N
DefaultDescription=Beriev Be-12N, the Be-12 refitted with the Nartsiss-12 search and attack system from the early 1970s: Initsiativa-2BN radar, APM-73S magnetometer and RGB-NM-1 sonobuoys; 27 aircraft were converted. Same airframe and bomb bay as the Be-12, here with the heavier AT-2 torpedo as the standard weapon.
Squadron1=Be-12N Soviet Naval Aviation,Be-12N

