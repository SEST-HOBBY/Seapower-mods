
[Language_en]
Name=SEST Banda Front Lean v2
Description=Sandbox, narrowed: Borneo and Java through the Moluccas and Papua to northern Australia. RAAF bases with Patriot/THAAD/NASAMS, US Marines and a French battle group at Darwin, an A-10/F-16/MQ-9 wing at Zamboanga, PLA lodgements at the Chinese industrial parks of Kalimantan, Java, Halmahera and Sulawesi, a Russian S-400 regiment at Biak, DF-21/26 batteries in Papua, and TNI, RMAF and Bruneian bases, refineries, LNG plants and ports. Civil shipping follows the real lanes. Lean edition: every site trimmed to its core, neutral airfields grounded. SEST Living Seas: added civil sea and air traffic, modern combat and support air wings, an allied Ford carrier patrol and a red Fujian main fleet. Bayu-Undan and Greater Sunrise are seized red platforms. Three sanctioned convoys operate among neutral shipping in the Timor and Banda corridors
