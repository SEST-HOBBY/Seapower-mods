[Language_en]
Name=SEST Banda - Mogami's Corner
Description=BANDA SEA, last hour before midnight. A Type 093B went quiet somewhere in this box six hours ago and has not been heard since. Two Mogamis have the corner: shallow water, a thermal layer that comes and goes, and a fishing fleet working right through the search area.

The Mogami is built for exactly this and carries one helicopter to do it with. A nuclear boat in shallow water is quieter than the sea around it and faster than you, so this is a problem of patience and geometry rather than speed - and every contact has to be resolved before it is attacked, because two of them are trawlers.
Objective_Boat=Find and kill the submarine
Objective_Fishing=Leave the fishing fleet alone
Objective_Ships=Keep both frigates
