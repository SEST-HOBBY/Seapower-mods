[Language_en]
Name=SEST Banda - Tigers over Papua
Description=PAPUA, before dawn. A DF-21D and a DF-26B are sitting on an airlift field 600 miles inside the red lodgement, and while they are there no allied carrier operates east of the Banda Sea. They move at first light.\n\nYou have a single B-1B staging out of the south with the ARRW testbed fit - six rounds, hypersonic, launched from outside everything the lodgement owns. That is the whole plan and the whole margin: the launchers are soft, the window is short, and there is no second pass. Put the TELs down before the sun comes up.
Objective_TELs=Destroy both launchers
Objective_Field=Hit the airlift field
Objective_Lancer=Bring the bomber home
Taskforce1StartMessage=<color=yellow>Tigers over Papua</color>|PAPUA, before dawn. A DF-21D and a DF-26B are sitting on an airlift field 600 miles inside the red lodgement, and while they are there no allied carrier operates east of the Banda Sea. They move at first light.\n\nYou have a single B-1B staging out of the south with the ARRW testbed fit - six rounds, hypersonic, launched from outside everything the lodgement owns. That is the whole plan and the whole margin: the launchers are soft, the window is short, and there is no second pass. Put the TELs down before the sun comes up.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Both launchers are wreckage. The eastern Banda is open again.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The launchers moved. Everything east of here is now in range.
