[Language_en]
Name=SEST Banda - Triton's Picture
Description=ARAFURA SEA. HOBART has the missiles and no idea where to put them. The Triton has the picture and nothing to shoot with. Between them that is a working kill chain, and it holds exactly as long as the drone does.

Two J-16s are already up and looking for it. An MQ-4C is a high-altitude sailplane with a radar: it cannot turn, it cannot run and it cannot hide, so keeping it alive is a matter of where you fly it, not how. Get the targeting solution, pass it, and do not lose the drone doing it.
Objective_SAG=Sink the surface group
Objective_Triton=Keep the Triton flying
