[Language_en]
Name=SEST Banda - Viper Zero
Description=OFF KALIMANTAN. A Type 071 is standing in toward the Chinese industrial park with a 054A and a 056A screening her, and whatever is in her well deck is meant to be ashore by nightfall.

You have four F-2s of the JASDF detachment, ASM-2 under the wings. The Viper Zero was built for precisely this and for nothing else: it is a strike fighter with a sea-search radar and no business within reach of a frigate's SAMs. The 054A's HQ-16 is the ruler here - launch outside it and you are a nuisance they cannot answer, cross it and you are four aircraft Japan does not have spare.
Objective_LPD=Sink the landing ship
Objective_Escort=Deal with the escorts
Objective_Flight=Bring the flight home
