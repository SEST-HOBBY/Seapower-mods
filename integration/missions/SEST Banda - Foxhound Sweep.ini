[Language_en]
Name=SEST Banda - Foxhound Sweep
Description=HIGH OVER THE ARAFURA. The Wedgetail and the tanker are the reason the allied air picture exists out here, and both of them are slow, large and unable to defend themselves. Two MiG-31s have come off Biak climbing hard on a vector that only makes sense if they know exactly where the orbit is.

You have two Raptors on station. The Foxhound is the one aircraft in theatre that can out-run and out-reach you: the R-37 is shot from above 50,000 feet at speeds you cannot chase, and a stern chase is a waste of fuel you do not have. Break the shot, not the aircraft. If the Wedgetail dies, the picture goes with it.
Objective_HVA=Keep the Wedgetail and the tanker alive
Objective_Foxhounds=Turn the interceptors back
Taskforce1StartMessage=<color=yellow>Foxhound Sweep</color>|HIGH OVER THE ARAFURA. The Wedgetail and the tanker are the reason the allied air picture exists out here, and both of them are slow, large and unable to defend themselves. Two MiG-31s have come off Biak climbing hard on a vector that only makes sense if they know exactly where the orbit is.

You have two Raptors on station. The Foxhound is the one aircraft in theatre that can out-run and out-reach you: the R-37 is shot from above 50,000 feet at speeds you cannot chase, and a stern chase is a waste of fuel you do not have. Break the shot, not the aircraft. If the Wedgetail dies, the picture goes with it.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Both Foxhounds down and the orbit never moved. The picture holds.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The high-value aircraft are gone. Everything east goes blind.
