[Language_en]
Name=SEST Banda - Fujian's Shadow
Description=NORTH OF THE BANDA SEA. FORD is 200 nautical miles south of the Fujian group and both sides know it. The red carrier has been cycling deck launches for an hour and the pattern has stopped looking like training: two sweeps forward, then a stream behind them.\n\nYou have the carrier, two Burkes and the Hobart. The F-35Cs and the JATM are the reason this is survivable - the missile outranges theirs and the aircraft sees first - but there are more of them than you have missiles for, and the Growlers can only blind one axis at a time. Keep FORD alive. Everything else is negotiable.
Objective_Ford=Keep FORD afloat and fighting
Objective_Raid=Break up the strike
Objective_Screen=Keep the screen intact
Taskforce1StartMessage=<color=yellow>Fujian's Shadow</color>|NORTH OF THE BANDA SEA. FORD is 200 nautical miles south of the Fujian group and both sides know it. The red carrier has been cycling deck launches for an hour and the pattern has stopped looking like training: two sweeps forward, then a stream behind them.\n\nYou have the carrier, two Burkes and the Hobart. The F-35Cs and the JATM are the reason this is survivable - the missile outranges theirs and the aircraft sees first - but there are more of them than you have missiles for, and the Growlers can only blind one axis at a time. Keep FORD alive. Everything else is negotiable.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Fujian is burning. The Banda front just became a one-carrier war.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|FORD is gone. There is no second carrier this side of Guam.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|FORD is gone. There is no second carrier this side of Guam.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Fujian is burning. The Banda front just became a one-carrier war.
