[Language_en]
Name=SEST Banda - Narco Transit
Description=TIMOR CORRIDOR, middle watch. Border Force has a pattern: something small and very quiet runs this line twice a week, snorting at periscope depth between the fishing fleets, and nothing with a hull number has ever caught it. Tonight you have the Anzac's Seahawk and a sea state of one.\n\nA narco boat is a poor sonar target and a worse visual one, and the trawlers out here work at night with their gear down. You are looking for something the size of a bus that does not want to be found, in water busy enough that every contact has to be resolved before it is attacked.
Objective_Boat=Find and stop the transit
Objective_Fishing=Leave the fishing fleet alone
Taskforce1StartMessage=<color=yellow>Narco Transit</color>|TIMOR CORRIDOR, middle watch. Border Force has a pattern: something small and very quiet runs this line twice a week, snorting at periscope depth between the fishing fleets, and nothing with a hull number has ever caught it. Tonight you have the Anzac's Seahawk and a sea state of one.\n\nA narco boat is a poor sonar target and a worse visual one, and the trawlers out here work at night with their gear down. You are looking for something the size of a bus that does not want to be found, in water busy enough that every contact has to be resolved before it is attacked.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Transit stopped. Border Force will want the recording.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|It got through. Again.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|It got through. Again.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Transit stopped. Border Force will want the recording.
NeutralLossMessage=<color=orange>Neutral vessel hit.</color>|A neutral crew is in the water. That will be on the record.
