[Language_en]
Name=SEST Banda - Black Widow Debut
Description=CERAM SEA, high. A KJ-500 has been orbiting north of the Banda for two days, and every red intercept in this half of the archipelago has been run off its picture. It flies with a pair of J-36s tucked in behind it, which is the whole problem: the tailless jet sees far and is hard to see.

Two YF-23s, the only pair in theatre. This is the matchup nobody has data on - both sides are stealthy, both shoot long, and whoever gets the first uncued track probably wins. The controller is the target. The escorts are only in the way.
Objective_AEW=Shoot down the KJ-500
Objective_Escort=Deal with the escorts
Objective_Pair=Bring both aircraft home
