#--------------- Strike Aircraft ----------------

# - LongRange means operating range of aircraft, not the weapons range
# ---------- Mandatory loadouts ----------
Default=默认                            // Usually most common loadout for this plane
Ferry=转场                                // Maximum fueltanks, no weapons, except guns and chaff
Empty=空载                                // No fueltanks, no weapons, except guns and chaff

# ---------- Anti Air loadouts ----------
AirToAir=空对空                        // Standard Air to Air loadout for the type
AirToAirLongRange=空对空 远程    // Air to Air with less weapons and more fuel
AirToAirIntercept=空对空 截击     // Air to Air loadouts with emphasis on MRAAM/SRAAM
AirToAirInterceptLongRange=空对空 截击 远程

# ---------- Anti Surface loadouts ----------
Strike=打击                              // Dumb bombs in 1 salvo
Strike2=打击 2
Strike3=打击 3
StikePrecision=精确打击		   // Guided bombs or Strike missiles (like AS-7)
StrikePrecision2=精确打击 2
StrikePrecision3=精确打击 3
StrikeLongRange=远程打击          // Same as Strike but less weapons, more fuel
StrikePrecisionLongRange=精确打击 远程
StrikeHeavy=重型打击                   // Strike loadout for heavy bombers. (To mark it for AI usage)
StrikePrecisionHeavy=重型精确打击
AntiRunway=反跑道

CAS=近距空中支援                      // Rockets, Cluster bombs, Bombs. Usually in small salvos to increace number of attacks
CAS2=近距空中支援 2
CASHeavy=近距空中支援 重型
AntiArmor=反坦克                         // Strike missiles mostly useful only land vehicles(like AS-7)

# ---------- Anti Ship loadouts ----------
AntiShip=反舰                         // Most vague loadout. Can include anything from dumb bombs to medium-range missilies
AntiShip2=反舰 2
AntiShipLongRange=反舰 远程     // Same as AntiShip, but with fueltanks
AntiShipPrecision=反舰 精确      // Another vague loadout. Can include guided bombs and missilies
AntiShipHeavy=反舰 重型              // Designed to mark heavy anti-ship bombers like Tu-22 and Tu-16 and small planes with most weapons

# ---------- Anti Sub loadouts ----------
ASW=反潜                                    // Multirole ASW: Torpedoes, Depth Charges, Sonobuoys
ASWHunter=反潜猎手                       // Sonobuoys only, no weapons
ASWKiller=反潜杀手                       // ASW weapons only

# ---------- Special loadouts ----------
SEAD=防空压制                                  // Anti-radiation missilies, Cluster bombs
SEAD2=防空压制 2
SEAD3=防空压制 3
#SEADLongRange=SEAD Long Range              // Same as SEAD, but less weaзons and more fueltanks

AEW=预警                          // Just a flavor naming to indicate plane purpose. This loadout supposed to be equal to "Empty"
Recon=侦察                                // Also indicates plane purpose. In some cases used for carrying recon pods.
EW=电子战                      // Also indicates plane purpose. In some cases used for carrying EW pods.
Transport=运输                        // Also indicates purpose.

#--------------- SEST F-35C JATM ----------------
Intercept260=隐身截击 (AIM-260)
Intercept260Beast=重挂截击 (10x AIM-260)
