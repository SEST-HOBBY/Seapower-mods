[Language_en]
Name=SEST B-52 ARRW
Description=AGM-183A across every in-service B-52, flying a real boost-glide profile. The Dingtools round that wins the load order models the ARRW as a sea-skimmer with the skim altitude set to 90000 feet - a hypersonic weapon reduced to a level high-altitude cruise, with no boost duration and nothing holding its speed through the glide. This restores the profile the ARRW mod's own author gave the same airframe: a steep 75 degree boost to 99000 feet over 35 seconds, booster separation on the mesh swap already in the file, then a descending hypersonic glide onto the target that keeps most of its speed. Also the W62 on the B-52H, ARRW on Red Storm Arsenal's B-52O, and the 419th FLTS testbed's unreachable loadouts declared.
