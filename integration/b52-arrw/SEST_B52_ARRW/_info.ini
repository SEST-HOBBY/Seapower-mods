Name=SEST B-52 ARRW
Description=AGM-183A across every in-service B-52: the lofted boost-glide profile it was missing, the W62 on the B-52H, and ARRW on Red Storm Arsenal's B-52O. The three bombers also now share their fits - the B-52H's 20x LRASM load flies on the B-52O (replacing a 16-round one) and on the 419th FLTS testbed, and the testbed's own usn_arrw fit flies on both B-52s and on the B-1B.
