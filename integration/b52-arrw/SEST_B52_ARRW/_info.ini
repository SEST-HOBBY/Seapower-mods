[Language_en]
Name=SEST B-52 ARRW
Description=AGM-183A across every in-service B-52, flying a real boost-glide profile. The Dingtools round that wins the load order models the ARRW as a sea-skimmer with the skim altitude set to 90000 feet - a hypersonic weapon reduced to a level high-altitude cruise. This restores the profile the ARRW mod's own author gave the same airframe: a steep 75 degree boost to 99000 feet over 35 seconds, booster separation on the mesh swap already in the file, then a descending hypersonic glide that keeps most of its speed. Also the W62 on the B-52H and ARRW on Red Storm Arsenal's B-52O. The three bombers now share their fits - the B-52H's 20x LRASM load flies on the B-52O (replacing a 16-round one) and on the 419th FLTS testbed, and the testbed's own usn_arrw fit flies on both B-52s and on the B-1B.
