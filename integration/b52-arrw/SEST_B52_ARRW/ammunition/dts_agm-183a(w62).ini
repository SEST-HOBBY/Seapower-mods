#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# AGM-183A (W62 Nuclear warhead)
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All     // can be  All, Installation, Mobile, ShoreTargetsOnly
#CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode


Mass=2270                               // in kg. Used for aircraft
AmmoPoints=8000                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=TorpedoImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=1000
ImpactSize=3000                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                      // can be minor, moderate, heavy, always

FuzeProximityDistance=100

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=1.5                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0.5         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
============================================================
SeaSkimming=False
SeaSkimmingStartDistToTarget=1000
SeaSkimmingMaxDescentAngle=50
SeaSkimmingAlt=90000.0
MaxLoftAngle=75.0
MaxLoftAlt=99000.0
AccelerationTime=0.01
SustainerAccelerationTime=35.0
SustainerAcceleration=16.0
VelocityBleed=0.6
IgnoreHeightDifferenceForTargetDist=True
TerminalVelocity=3800
TerminalApproachDist=40.0 
TerminalDiveDistance=40                 // in N. miles.
TerminalPopup=False
MaxVelocity=5291                       // Maximum speed in knots
Acceleration=2.0
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
MinLaunchRange=50.0                     // Minimum launch range in nautical miles
MaxLaunchRange=865                    // Maximum launch range in nautical miles
MinLaunchAltitude=10000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=100000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)


#========================================     Seeker     ===========================================================
#Homing
SeekerGain=0.0                         // Seeker gain in dB
SeekerFOV=0.1                         // Seeker field-of-view in degrees
SeekerActiveRange=0.0
SeekerPassiveRange=100.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
NightVisionLevel=1.0
Zoom=2
#ECCM
AntiCountermeasuresBonus=0.9           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.8                    // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct 
SelfDestructAfterTargetGone=False
SelfDestructDelay=5.0                  // delay in seconds for self destruction


[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/183/
ResourcesRoot=arrw.obj
ResourcesMesh=Glider
ResourcesMeshForLaunch=agm-183
ResourcesMeshSwitchTime=35.0
ResourcesMaterial=arrw_mat.ini
############################################################

NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
SustainerEffect=effects/weapons/emitters/sam_medium_effect
SustainerEffectPosition=0,0,-0.072
SustainerEffectStartTime=0


HitShipExplosion=effects/explosions/emitters/Ammo_ship_explosion_1
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosion=effects/explosions/emitters/Ammo_ship_explosion_1
HitWaterSplashClass=SmallWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes

UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.022

[---------- Colliders ----------]
[Colliders]
#creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.0099
Rotation=0,0,0
Scale=0.008,0.003,0.042