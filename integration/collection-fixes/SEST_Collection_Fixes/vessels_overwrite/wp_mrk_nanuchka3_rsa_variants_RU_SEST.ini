#!extend vessels/wp_mrk_nanuchka3_rsa_variants.ini
# SEST Collection Fixes - wp_mrk_nanuchka3_rsa: the Russian Federation, not
# the USSR.
# Red Storm Arsenal (3413868677) registers it Soviet. Registered here to the
# game's Russia key (Russian Federation in this pack's
# language_en/nations.ini): the Nanuchka III class in its 2019 fit
# ([Default]) and Smerch, the one ship refitted to it: four quad Uran and an
# AK-176MA in place of the triple SS-N-9, 2017 to 2019 (Wikipedia, Russian
# corvette Smerch). Shtil', Aysberg, Mirazh, Rassvyet, Zyb', Geyzer, Passat,
# Livien', Iney, Moroz and Razliv served Russia in 2019 but were never
# refitted with Uran (only Smerch was; Wikipedia, Nanuchka-class corvette),
# so in this fit they are fictional and stay as the author has them; Burun,
# Vyetyer, Tucha, Uragan, Priboy, Priliv and Meteor, decommissioned by 2005,
# and Perekat, never completed, stay Soviet too. Only Nation is set, on the
# sections named below; every other key, the file and its credit stay the
# author's.
# The sections with no Nation below are listed empty, in the file's order,
# only so the game keeps the author's variant order: it reads this file
# first, and the Mission Editor saves a variant by its place in that order.
# An empty header sets nothing.

