#!extend vessels/wp_rkr_slava_16_variants.ini
# SEST Collection Fixes - wp_rkr_slava_16: the Russian Federation, not the
# USSR.
# Red Storm Arsenal (3413868677) registers it Soviet. Registered here to the
# game's Russia key (Russian Federation in this pack's
# language_en/nations.ini): the Slava class in its 2016 fit ([Default]) and
# the three Slavas Russia sailed after 1991: Slava (Moskva from 1995),
# Marshal Ustinov and Chervona Ukrayina (Varyag from December 1995).
# Variant4 to Variant8 stay Soviet: Admiral Lobov was never completed for
# Russia (Ukraine's unfinished Ukrayina), and Oktyabrskaya Revolutsiya,
# Admiral Gorshkov, Vladivostok and Sevastopol were never built. Only Nation
# is set, on the sections named below; every other key, the file and its
# credit stay the author's.

[Default]
Nation=Russia

[Variant1]
Nation=Russia

[Variant2]
Nation=Russia

[Variant3]
Nation=Russia
