#!extend vessels/wp_ssgn_belgorod_variants.ini
# SEST Collection Fixes - wp_ssgn_belgorod: the Russian Federation, not the
# USSR.
# Russian Submarines (3468260539) registers it Soviet. Project 09852
# Belgorod (K-329, laid down at Sevmash 1992, in service 2022): post-1991
# and Russian-built, so it registers the game's Russia key (Russian
# Federation in this pack's language_en/nations.ini). Only Nation is set, on
# the sections that resolve to Soviet; every other key, the file and its
# credit stay the author's.

[Default]
Nation=Russia

[Variant1]
Nation=Russia
