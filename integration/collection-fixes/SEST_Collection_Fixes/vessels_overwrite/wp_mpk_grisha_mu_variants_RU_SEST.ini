# SEST Collection Fixes - wp_mpk_grisha_mu: the Russian Federation, not the
# USSR.
# THE REDFOR MOD (3732654992) registers it Soviet. Registered here to the
# game's Russia key (Russian Federation in this pack's
# language_en/nations.ini): the two Grishas launched after 1991, both at
# Zelenodolsk (Wikipedia, Grisha-class corvette): MPK-59 Snezhnogorsk (1993)
# and MPK-14 Monchegorsk (1992). [Default], the boats launched by 1991 and
# MPK-20, never completed, stay Soviet; U205 Lutsk and U209 Ternopil were
# completed in Kyiv for Ukraine, not built in Russia, so they stay as the
# author has them. Only Nation is set, on the sections named below; every
# other key, the file and its credit stay the author's.
# The sections with no Nation below are listed empty, in the file's order,
# only so the game keeps the author's variant order: it reads this file
# first, and the Mission Editor saves a variant by its place in that order.
# An empty header sets nothing.

