# SEST Collection Fixes - the game's own ammunition/usn_cal_25mm_m2.ini, verbatim, over the
# stale copy in 3412480633.
# Ground Upgrade: IFV's copy has no AmmoPoints or Mass and adds an AAW role.
# The Mk 38 on forty SEST-forked destroyers and frigates fires this round.
[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW             // can be AAW, ASuW, ASW

Mass=0.5                               // in kg. Used for aircraft
AmmoPoints=0.5                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability


DecalClass=GunImpacts      // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=900         // meter per second
MaxRange=2400              // in m
CircularErrorProbable=40  // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=0.5
ImpactSize=Tiny            // Impact size, can be small, medium, large, verylarge
Penetration=Minor          // can be minor, moderate, heavy, always

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini
TrailEffect=None
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitDefaultExplosionClass=SmallFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
