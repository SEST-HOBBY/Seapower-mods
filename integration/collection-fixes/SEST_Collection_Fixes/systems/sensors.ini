# SEST Collection Fixes - sensor types that units mount but no mod
# defines, so the sensor does nothing at all. systems/ files merge
# section-by-section, so these ADD the missing definitions without
# overriding anything. Every one is cloned from the closest
# same-class, same-era definition; none is invented.

# Side_Globe: Soviet shipboard noise jammer, NATO's Side Globe. Donor is vanilla's own Side Globe, which 0.8.3 (1 Oct 2026) added under its Soviet name Gurzuf for Kiev, Kirov, Slava, Kara and Kresta (until then the donor was Start_ECM, the Sovremenny's smaller set). Mounted under this name by ru_cv_varyag and wp_rkr_kirov_improved, both fielded.
# Cloned from [Gurzuf] in _vanilla/original.
[Side_Globe]
#2nd generation noise jammer, very high output,
Kind=ECM
Frequencies=S-Band,C-Band,X-Band,Ku-Band       //radar frequency bands the ECM suite can jam
Type=Defensive      // can be Defensive, Offensive, Universal
JamChance=0.3       // For Defensive and Universal jammers. Base chance to jam the attacking weapon
ModuleType=BigSensor
NoiseJamPower=15						// Allows for DECM to noise jam, reducing fire control range when using radar guided weapons against the DECM-carrying unit
Gain=1.0        //Offensive ECM jammer gain in db, more -> better

# Rum_Tub: Soviet shipboard ESM array, the receive half of the same suite as Side Globe. Mounted by wp_rkr_kirov_improved.
# Cloned from [Start_ESM] in _vanilla/original.
[Rum_Tub]
Kind=ESM
Gain=7                              // gain of sensor in dB
HasDataLink=True                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=10.0              // in degrees
Frequencies=S-Band,C-Band,X-Band,Ku-Band    //Frequencies that current ESM system can detect
OverHorizonMultiplier=2           // The multiplier for ESM horizon for over horison (OTH) passive detection capability
ModuleType=SmallSensor

# J/OPS-20: JMSDF navigation radar. Donor is Euromod's modern naval navigation radar. Mounted by jmsdf_ddg_maya, fielded.
# Cloned from [eu_nav_radar] in 3629144864.
[J/OPS-20]
Kind=Radar
Type=Search                       // Classes can be "Search", "Targeting"                                                                   
HasDataLink=True                  // true means the sensor data will be used for the entire task force via data link, false local use only  
Role=AirAndSurface                      // Role can be "Surface", "Air", "AirAndSurface"                                                          
Mode=Illuminate                   // Can be "Illuminate", "RadioCommand"                                                                
RotationDirection=1               // -1 means left, 1 means right                                                                           
TargetChannels=50                 // if applicable number of targets it can track simultaneously                                            
WeaponChannels=0                  // if applicable number of weapons (missiles) it can guide simultaneously                                 
RPM=24                            // revolutions per minute    
ViewArcs=-181,181|-12.5,12.5           // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles                                                                             
MinRange=0.027                    // min range in km                                                                                        
MaxRange=24.0                     // max range in km                                                                                        
MinAltitude=0                     // min altitude in meters, relevant for air, unused for surface                                           
MaxAltitude=10000                  // max altitude in meters, relevant for air, unused for surface                                           
RangeResolution=2.0               // defines the minimum range where two targets behind can be recognized as two; in meters                 
BeamWidth=1.0                     // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)                     
SubClutterVisibility=15   // clutter rejection vs sea return in dB; 0 = no MTI, 20-30 = MTI, 40+ = pulse-Doppler; Euromod: 47 = intermediate tier, 50 = maximum
Gain=44.6                         // gain in dB on the sensor                                                                               
Frequency=X-Band                  // frequency band                                                                                         
PeakPower=0.190                    // output peak power in kW                                                                                
CanDetectPeriscope=True
UseSignature=Surface
ModuleType=SmallSensor

# pla_pod_kg-800: PLAN escort jamming pod on the J-15D, the type's whole reason to exist. Donor is vanilla's Soviet EW-aircraft jammer at 5 kW - deliberately a fraction of the NGJ's 75 kW in SEST_Growler_NGJ_MALICE, so red gets a working jammer rather than a Growler. 8 airframes fielded.
# Cloned from [Azaliya_OECM] in _vanilla/original.
[pla_pod_kg-800]
Kind=ECM
Frequencies=UHF-Band,L-Band,S-Band,C-Band,X-Band //radar frequency bands the ECM suite can jam
Type=Universal                      // can be Defensive, Offensive, Universal
PeakPower=5.0                      // output peak power in kW, more power increase effectivness of offensive ECM jammers
MaxRange=1000.0                       // max range in km
Gain=5                            // Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=30.0                // For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChance=0.3                      // For Defensive and Universal jammers. Base chance to jam the attacking weapon

# 4th_Gen_FLIR: EO/IR turret on the Z-9D. Donor is vanilla's advanced optical sight.
# Cloned from [AdvancedOptics] in _vanilla/original.
[4th_Gen_FLIR]
# LLTV Ship sensor, 80s image intensifier mounted on a modern optical sight/periscope
Kind=Visual
VIDRangeMultiplier=2.4           // Target VID range multiplied by this for identification check
MaxRangeMultiplier=2.8           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.5           // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.25            // the portion of full daylight added to the visibility level where 1 is roughly a mid-day
WeaponGuidancePenalty=0.15        // SAM probability to kill will be reduced by this number if it is fired by using this system for guiding.

FCSolutionGainRate=1.5

# ZW06: Signaal ZW06 surface-search radar on Euromod-Brazilian Armed Forces' Niteroi and Niteroi 2005. EUROMOD-Armada de Chile defined it until its 22 Oct 2026 update, which dropped its own copy for Euromod's eu_zw06, the donor here. The world campaign places two Niteroi 2005 at Rio.
# Cloned from [eu_zw06] in 3629144864.
[ZW06]
Kind=Radar
Type=Search
HasDataLink=False
Role=Surface                                                        
Mode=Illuminate                                                                     
RotationDirection=1                                                                  
TargetChannels=1                                          
WeaponChannels=1  
RPM=24                                                                             
MinRange=0.25                                                                                   
MaxRange=26.0                                                                                         
MinAltitude=0                                           
MaxAltitude=6100.0                                          
RangeResolution=10.0
BeamWidth=0.9
SubClutterVisibility=20   // clutter rejection vs sea return in dB; 0 = no MTI, 20-30 = MTI, 40+ = pulse-Doppler; Euromod: 47 = intermediate tier, 50 = maximum
Gain=31.0                                                                               
Frequency=X-band                                                                                     
PeakPower=60.0                                                                              
ModuleType=MediumSensor

# EOMS-NG: Safran EOMS-NG electro-optical search sensor (40 km, air and surface, datalinked): SensorSystem6 on fr_cvn_charles-de-gaulle, SensorSystem5 on fr_cvn_charles-de-gaulle_late. Charles De Gaulle & Modern French Navy renamed its definition [EOMS_NG] in the 28 Oct 2026 export and left both carriers naming EOMS-NG. The donor is that renamed section, so the clone is the author's current definition, which dropped the old one's RPM=60 and Bonus IRST range multipliers. Southern Watch D3 places the carrier, the RAN campaigns' allied rosters sell it and the World Sandbox fields both hulls.
# Cloned from [EOMS_NG] in 3567256221.
[EOMS-NG]
Kind=Visual 			// Classes can be "Search", "Targeting"
Type=Search
HasDataLink=True 
Role=AirAndSurface 
Mode=Illuminate 
MinRange=0.1 
MaxRange=40.0 
MinAltitude=0 
MaxAltitude=30000 
AngularResolution=0.2 
RangeResolution=30.0 
Gain=55.0 
UseIRValues=True 
ModuleType=MediumSensor

# KQT-8: KQT-8 MAD, the magnetic anomaly detector the PLAN Pack's own plan_y-8fq and plan_y-9fq mount (SensorSystem5) and its language files name "KQT-8 MAD". The Y-8/Y-9 family (3637954857), removed from the Workshop on 12 Nov 2026, was its only definer. SEST models it on the game's own airborne MAD: [WP_MAD], the Il-38's and Tu-142M's, four-engine turboprop patrol aircraft like the Y-8FQ and Y-9FQ (1.0 nm datalinked detection and no ModuleType; the P-3C's stock [AN/ASQ-81V2] matched it until 0.9.0 cut that set to 0.5 nm). Red Line places the Y-9FQ in four missions and sells it in its roster; Global Maritime Operations 2028 fields both.
# Cloned from [WP_MAD] in _vanilla/original.
[KQT-8]
Kind=MAD
HasDataLink=True                     // true means the sensor data will be used for the entire task force via data link, false local use only
MaxDetectionRange=1.0                //in nm
ModuleType=SmallSensor

# Morden_RWR: Radar warning receiver the Pakistani Pack's paf_zdk-03 mounts (SensorSystem3, #RWR). The Y-8/Y-9 family (3637954857), removed from the Workshop on 12 Nov 2026, was its only definer. SEST models it on the game's own generic aircraft RWR. Makran Line fields the ZDK-03.
# Cloned from [AircraftRWR] in _vanilla/original.
[Morden_RWR]
Kind=ESM
Type=RWR
Gain=5                              // gain of sensor in dB
HasDataLink=True                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=25.0              // in degrees
Frequencies=C-Band,X-Band           // Frequencies that current ESM system can detect

# Game sensor sections restored over a mod's stale redefinition.

# The Royal Navy's [Type2031] cuts the towed array's PassiveRange from
# 90 km to 23 km and its Gain from 56 to 50 dB; the Type 23s SEST
# fields tow it.
# The game's own definition, restored over 3491248180.
[Type2031]
#highly performing shipboard towed array; twice as long as SQR-19
Kind=Sonar
HasDataLink=False        // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=4.0    // in degrees
RangeResolution=120.0    // TODO defines the minimum range where two targets behind can be recognized as two; in meters
PassiveRange=90          // in km
Gain=56                  // in db, gain of the sensor
Type=Towed               //Hull: hull mounted sonar, Towed: towed passive sonar, VDS: variable depth active sonar, Dipping: dipping sonar
SonarFrequency=1hz                 // can be defined as either "10khz" or "10000hz"
SignalProcessing=10
MaxConvergenceZones=4				// maximum number of CZs this sonar can detect out to, 0 if incapable of using CZ/BB effects
ModuleType=SonarSensor

# Sea Power 0.9.0 cut this MAD's MaxDetectionRange from 1.0 to 0.5 nm.
# The Chinese Navy (PLAN) mod restates the section as the game had it
# before, so the Sea Kings, the MV-75 and the other aircraft that
# mount it kept the old range.
# The game's own definition, restored over 3417801942, 3499239964.
[AN/ASQ-81V2]
#Users: usn_sh-2f usn_s-3a
Kind=MAD
HasDataLink=True                     // true means the sensor data will be used for the entire task force via data link, false local use only
MaxDetectionRange=0.5                //in nm
