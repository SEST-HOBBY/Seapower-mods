# SEST Collection Fixes - sensor types that units mount but no mod
# defines, so the sensor does nothing at all. systems/ files merge
# section-by-section, so these ADD the missing definitions without
# overriding anything. Every one is cloned from the closest
# same-class, same-era definition; none is invented.

# Side_Globe: Soviet shipboard defensive jammer. Donor is vanilla's own Soviet ship ECM (Sovremenny, Udaloy, Krivak). Mounted by ru_cv_varyag and wp_rkr_kirov_improved, both fielded.
# Cloned from [Start_ECM] in _vanilla/original.
[Side_Globe]
#All variants of both MP-401 "Start" and MP-407 "Start-2"
Kind=ECM
Frequencies=C-Band,X-Band,Ku-Band       //radar frequency bands the ECM suite can jam
Type=Defensive      // can be Defensive, Offensive, Universal
JamChance=0.35      // For Defensive and Universal jammers. Base chance to jam the attacking weapon
ModuleType=SmallSensor

# Rum_Tub: Soviet shipboard ESM array, the receive half of the same suite as Side Globe. Mounted by wp_rkr_kirov_improved.
# Cloned from [Start_ESM] in _vanilla/original.
[Rum_Tub]
Kind=ESM
Gain=7                              // gain of sensor in dB
HasDataLink=True                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=10.0              // in degrees
Frequencies=S-Band,C-Band,X-Band,Ku-Band    //Frequencies that current ESM system can detect
OverHorizonMultiplier=2           // The multiplier for ESM horizon for over horison (OTH) passive detection capability
ModuleType=SmallSensor

# J/OPS-20: JMSDF navigation radar. Donor is Euromod's modern naval navigation radar. Mounted by jmsdf_ddg_maya, fielded.
# Cloned from [eu_nav_radar] in 3629144864.
[J/OPS-20]
Kind=Radar
Type=Search                       // Classes can be "Search", "Targeting"                                                                   
HasDataLink=True                  // true means the sensor data will be used for the entire task force via data link, false local use only  
Role=AirAndSurface                      // Role can be "Surface", "Air", "AirAndSurface"                                                          
Mode=Illuminate                   // Can be "Illuminate", "RadioCommand"                                                                
RotationDirection=1               // -1 means left, 1 means right                                                                           
TargetChannels=50                 // if applicable number of targets it can track simultaneously                                            
WeaponChannels=0                  // if applicable number of weapons (missiles) it can guide simultaneously                                 
RPM=24                            // revolutions per minute    
ViewArcs=-181,181|-12.5,12.5           // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles                                                                             
MinRange=0.027                    // min range in km                                                                                        
MaxRange=24.0                     // max range in km                                                                                        
MinAltitude=0                     // min altitude in meters, relevant for air, unused for surface                                           
MaxAltitude=10000                  // max altitude in meters, relevant for air, unused for surface                                           
RangeResolution=2.0               // defines the minimum range where two targets behind can be recognized as two; in meters                 
BeamWidth=1.0                     // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)                     
Gain=44.6                         // gain in dB on the sensor                                                                               
Frequency=X-Band                  // frequency band                                                                                         
PeakPower=0.190                    // output peak power in kW                                                                                
CanDetectPeriscope=True
UseSignature=Surface
ModuleType=SmallSensor

# pla_pod_kg-800: PLAN escort jamming pod on the J-15D, the type's whole reason to exist. Donor is vanilla's Soviet EW-aircraft jammer at 5 kW - deliberately a fraction of the NGJ's 75 kW in SEST_Growler_NGJ_MALICE, so red gets a working jammer rather than a Growler. 8 airframes fielded.
# Cloned from [Azaliya_OECM] in _vanilla/original.
[pla_pod_kg-800]
Kind=ECM
Frequencies=UHF-Band,L-Band,S-Band,C-Band,X-Band //radar frequency bands the ECM suite can jam
Type=Universal                      // can be Defensive, Offensive, Universal
PeakPower=5.0                      // output peak power in kW, more power increase effectivness of offensive ECM jammers
MaxRange=80.0                       // max range in km
Gain=5                            // Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=30.0                // For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChance=0.25                      // For Defensive and Universal jammers. Base chance to jam the attacking weapon

# 4th_Gen_FLIR: EO/IR turret on the Z-9D. Donor is vanilla's advanced optical sight.
# Cloned from [AdvancedOptics] in _vanilla/original.
[4th_Gen_FLIR]
# LLTV Ship sensor, 80s image intensifier mounted on a modern optical sight/periscope
Kind=Visual
VIDRangeMultiplier=2.4           // Target VID range multiplied by this for identification check
MaxRangeMultiplier=2.8           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.5           // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.25            // the portion of full daylight added to the visibility level where 1 is roughly a mid-day
WeaponGuidancePenalty=0.1        // SAM probability to kill will be reduced by this number if it is fired by using this system for guiding.
