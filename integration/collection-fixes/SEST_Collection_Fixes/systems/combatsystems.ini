# SEST Collection Fixes - combat-system (OODA) profiles for the hulls the
# SEST packs assign one to (RAN Fleet, Mogami, and the #!extend files in
# vessels_overwrite/). Each is a clone of a Euromod profile under a SEST
# name, so nothing here depends on another mod's ids; systems/ merges
# section by section, so these add to the game's 55 without replacing
# any. The one edited key is marked on its clone. See common/combat.py.

# SEST_AEGIS_BL9: Aegis Baseline 9: the Hobart (the RAN's Aegis refresh), the 2027 Ticonderogas, Korea's KDX-III.
# Cloned from [AEGIS_BL9] in 3629144864.
[SEST_AEGIS_BL9]
ReactionTime=VeryFast
DatalinkTier=5
DatalinkSource=True
SignalProcessingBonus=0
CICSlots=160
EvaluationSlots=6

