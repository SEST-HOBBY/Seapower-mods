Name=SEST Collection Fixes
Description=Value-level corrections from the collection-wide override audit: restores the vanilla-fidelity AGM-88 HARM the F-16 fleet was authored against, opens the GBU-53/B StormBreaker's 200-ft release window to 500-45000 ft, returns the GBU-12D and GBU-24 to conventional Paveway behaviour, gives the ESSM its only ECCM bonuses, re-unites the AC-130's 30mm definition with Euromod's ballistics, lifts the Hellfire's 2000-ft launch ceiling for the gunship, fixes AIM-9L/M impact size and speed-penalty keys, raises the AIM-9X turn rate, sharpens the GBU-39 SDB to its author's 1.5 m CEP, gives the KD-88 its 108 nm range and the AKF-98A its active-radar seeker, restores the eight Nimitz Expanded carriers with the CVN-70 typo fixed, keeps the Nimitz (2000s)'s type, class and hull names now that the retired mod that alone supplied them is gone, and repairs the MH-60R's dangling Penguin seat reference, gives the MH-60R an 816 Squadron RAN squadron under the Australian flag and returns the S-70B-2 to the Australian flag it only ever flew under, restores the loft angle the SM-3, SM-6 and PAC-3 MSE had commented out, and brings the SM-3's unreachable 220,000-ft target floor down to 150,000 ft, where the ballistic threats it exists to intercept actually fly. Generated by integration/collection-fixes/build_patch.py; must load above every workshop mod.

