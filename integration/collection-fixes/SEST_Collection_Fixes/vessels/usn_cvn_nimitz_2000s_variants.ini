# SEST Collection Fixes - base: 3430135740's (2000s) Nimitz variants table.
# Two deltas: NumberOfVariants 2 -> 3, so the CVN-70 Carl Vinson block the
# donor already ships is selectable (AUS DEF names it), and Variant3's
# hull-number/emblem wiring taken from Nimitz Expanded (3432592449), whose
# CVN-70 textures exist; the donor's ui/number/ path pointed at nothing.
