Name=SEST Aegis BMD
Description=Repairs the Euromod SM-3 family. Drops the RIM-161B/C/D engagement floor from 220,000 to 100,000 ft, an outlier 2.2x higher than any other interceptor in the collection that had nearly every SM-3 shot scored out-of-altitude; folds the Anchor Chain overwrite's flight model (loft angle, launch turn rate, time limit, 5 s initial phase, 50 nm terminal handover, 100 nm / 90 deg seeker) into the base files so the missiles fly correctly without the unverified preloader; corrects the Block IIA's 1500 nm declared range to the 729 nm its own speed and flight time allow, which also un-breaks the drag model derived from it; returns its TypicalTargetAlt and speed penalty to the family values; and gives all three a LiftFactor. Generated by integration/aegis-bmd/build_patch.py; must load above every workshop mod.

