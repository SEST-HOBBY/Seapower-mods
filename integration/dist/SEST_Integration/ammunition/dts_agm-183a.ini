#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# AGM-183A (Penetrator warhead)
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All             // can be  All, Installation, Mobile, ShoreTargetsOnly
#CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode

Mass=2270                               // in kg. Used for aircraft
AmmoPoints=10000                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=TorpedoImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=300
ImpactSize=VeryLarge                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                      // can be minor, moderate, heavy, always

FuzeProximityDistance=100                // for proximity fuze: distance to target in meter

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=5                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=20.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
SeaSkimming=True 
SeaSkimmingStartDistToTarget=1000
SeaSkimmingMaxDescentAngle=50
SeaSkimmingAlt=90000.0
MaxLoftAngle=45.0
MaxLoftAlt=90000.0
IgnoreHeightDifferenceForTargetDist=True
TerminalVelocity=3800
TerminalApproachDist=40.0 
TerminalDiveDistance=40                 // in N. miles.
TerminalPopup=False
MaxVelocity=5291                       // Maximum speed in knots
Acceleration=6.0 
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
MinLaunchRange=50.0                     // Minimum launch range in nautical miles
MaxLaunchRange=865                    // Maximum launch range in nautical miles
MinLaunchAltitude=10000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=100000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)


#========================================     Seeker     ===========================================================
#Homing
SeekerGain=100000                        // Seeker gain in dB
SeekerFOV=10                         // Seeker field-of-view in degrees
SeekerActiveRange=0.0
SeekerPassiveRange=1000.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
NightVisionLevel=1.0
Zoom=10
#ECCM
AntiCountermeasuresBonus=1           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=1                    // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct 
SelfDestructAfterTargetGone=False
SelfDestructDelay=5.0                  // delay in seconds for self destruction
TargetMemory=True

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/models/weapon/ammunition/agm-183/
ResourcesRoot=dts_agm-183a.obj
ResourcesMesh=AGM
ResourcesMeshForLaunch=launch

ResourcesMaterialFolder=assets/models/weapon/ammunition/agm-183/textures/
ResourcesMaterial=dts_agm-183a_mat.ini
ResourcesMeshSwitchTime=15  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
Rotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.02

InFlightEffectClass=effects/weapons/emitters/turbojet_sustainer
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions

HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=VeryLargeGroundHitExplosions

[---------- Colliders ----------]
[Colliders]
#creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.0099
Rotation=0,0,0
Scale=0.008,0.003,0.042