# SEST AGR-30 Redback - dts_apkws-ii (proven in-pod, lofting) with an
# IR seeker, 15 nm reach and a raised loft. Minimum-delta rebase after
# the M282-based build froze the game twice.
[General]
Type=Missile                        // can be Projectile, Missile, RBU, ASROC, Torpedo,AerialRocket,MLRS
TargetType=AAW                        // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW 
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=14                                // in kg. Used for aircraft
AmmoPoints=20                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=2
Power=5
ImpactSize=Small                    // Impact size, can be small, medium, large, verylarge
Penetration=Minor                       // can be minor, moderate, heavy, always
FuzeType=1
FuzeProximityDistance=0.5              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.6                  // Base chance to hit

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.5           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
#AxialRotation=180                      // In degrees per second. Doesnt work when "SupportsBanking" is true
#========================================= Launch stats ============================================================
MaxLoftAngle=12.0                      // Climb angle for initial loft
MaxLoftAlt=4000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,

TerminalApproachDist=100              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
TerminalAlt=Maintain
TerminalDiveDistance=2              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
MaxVelocity=2000                       // Maximum speed in knots
MaxTurnRate=50.0                       // Maximum turnrate in degrees per second
AccelerationTime=1                  // Burn time for initial booster burn
Acceleration=200                     // Gs of acceleration in initial burn

MinLaunchRange=0.16                    // Minimum launch range in nautical miles
MaxLaunchRange=15                      // Maximum launch range in nautical miles

MinLaunchAltitude=0                  // Minimum launch altitude in feet.
MaxLaunchAltitude=20000                 // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=0.2             // Circular error radius in meter
#Homing
IsRearAspectOnly=False                  // Rear aspect ammunition can lock on targets from their rear cone only
SeekerFOV=15                            // Seeker field-of-view in degrees
SeekerGimbalFOV=90                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=8                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)

#ECCM
#GravityFactor=32.0
# Torpedo related
#SelfDestruct
[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/models/weapon/ammunition/apkws/
ResourcesRoot=dts_apkws_ii.obj
ResourcesMesh=rocket
ResourcesMaterial=dts_apkws_ii_mat.ini

ResourcesMeshForLaunch=launch
ResourcesMeshSwitchTime=0.1  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

BoosterEffect=effects/weapons/emitters/rocket_small_launch_effect
BoosterEffectPosition=0,0,0

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0

HitDefaultExplosionClass=RocketShipHitExplosion
HitShipExplosionClass=RocketShipHitExplosion
HitAirExplosionClass=RocketShipHitExplosion

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

ExplosionOverwaterSplash=effects/splashes/emitters/splash_small

############################################################
# Sounds
############################################################
#Not needed here

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043