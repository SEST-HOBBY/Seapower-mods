=========================================================================================================================================================
[General]
# Naval Strike Missile Block Ia
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
LandAttackCapability=All  // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=1450                              // in kg. Used for aircraft
AmmoPoints=8000                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
SupplyCategory=SEST_LandAttack              // For Supply System. Makes that presence of such category is required for replenishment of this weapon

CIWSDefenceBonus=60                     // added chance to evade CIWS compounded by below factors
MissileDefenceBonus=0.40                    // added chance to evade missile compounded by below factors
#weaving terminal maneuver + stealth

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=2  // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=0.01
# Sonar related
# Transient
TransientRCS=VerySmall                    // Transient visibility on the radar
TransientVisualIdentificationRange=10  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=1
LandAttackGuidanceType=0
Power=34
ImpactSize=Large                       // Impact size, can be small, medium, large, verylarge
Penetration=heavy                      // can be minor, moderate, heavy, always
#FuzeType=0 

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=False  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
TargetRequired=False                 
TerrainFollowFlight=True
SupportsBanking=True                   // if the missile will bank when turning
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=12.0                    // height in feet for sea skimming TODO:make terrain following
SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=6                 // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=15.0
FinalFlightPhaseDistToTarget=20.0      // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=12.0               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalVerticalTurnRate=35            // Override of vertical turn rate in terminal (intended for Pop-up)
#========================================= Launch stats ============================================================
MaxVelocity=620                       // Maximum speed in knots
Acceleration=10.0                      // Acceleration factor
MaxTurnRate=16.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=40                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MinLaunchRange=0.1                     // Minimum launch range in nautical miles
MaxLaunchRange=165.6                     // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
WobblingStrength=120.5                   // amplitude of wobbling. Marks that missile performs some wobbling flight
WobblingSpeed=1.5                      // frequency of wobbling
VerticalWobblingStrength=4.5                   // amplitude of wobbling. Marks that missile performs some wobbling flight
VerticalWobblingSpeed=2                      // frequency of wobbling
#========================================     Seeker     ===========================================================
#Homing
SeekerFOV=120,10                        // Seeker field-of-view in degrees
SeekerActiveRange=0.0                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=20.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SecondaryPassiveRadarGuidanceType=Full  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
;TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#Misc Guidance Properties
;RangeGate=2							   // 
;SizeGate=3						   //
#ECCM
AntiCountermeasuresBonus=0.6           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.6                   // This value substracted from probability of being jammed  (0...1)
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=20.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-66c
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-66c_mat
AssetBundleMeshHullCollider=usn_rim-66c_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_NSM
ResourcesMaterialFolder=assets/europack/materials/NSM/
ResourcesMaterial=NSM_mat.ini
ResourcesMeshForLaunch=eu_launch_NSM
ResourcesMeshCanister=eu_launch_NSM
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[Debris]
DebrisProbability=95                // probability for debris to happen
ResourcesMeshForDebris=usaf_agm-86c_d // optional debris mesh after destruction
DebrisPosition=0.05                 // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.99
DebrisHeightLossAdd=0.0005          // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/wp_as-13_booster   //wp_ss-n-2_booster
BoosterEffectPosition=0,0,0.0110 ///0.0056,0.0059
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.025    /0,0,-0.025
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/wp_ss-n-3_sustainer
SustainerEffectPosition=0,0,0.010
SustainerEffectScale=0.3,0.3,0.3
SustainerEffectStartTime=1.0

HitShipExplosionClass=LargeShipHitExplosion 
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07