# SEST re-mesh: f-18_fuletank is a submesh of the fa-18e aircraft model
# and carries its origin, riding low under every pylon. The vanilla
# F-15C 610 gal tank mesh (what usn_tank_1200_f-18 renders) sits flush
# on the same stations, so it is used here. Fuel data untouched.
ResourcesFolder=aircraft/usaf_f-15c/
ResourcesRoot=usaf_f-15c
ResourcesMesh=usaf_f-15c_tank_610
ResourcesMaterialFolder=aircraft/usaf_f-15c/
ResourcesMaterial=usaf_f-15c_tank_mat

