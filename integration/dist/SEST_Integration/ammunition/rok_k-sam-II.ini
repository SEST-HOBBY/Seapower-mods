# SEST Intercept Model - base: 3789208859's rok_k-sam-II.ini, one delta:
# MinAttackAltitude 70000 -> 15 ft. The file is Red Storm Arsenal's
# usn_rim_174a under another name - the same 70000 ft floor, 130000 ft ceiling,
# anti-ship and shore roles and 260 nm reach - and its author calls it the
# 'SM-2 ver.': an area SAM, not a high-altitude interceptor. It takes the SM-6
# fix, 15 ft, which is also what the K-SAAM on the same frigate uses. It
# is ko_ffg-828's only area SAM; with this pack's restored 5% clamp and the old
# floor it would be capped at 5% against everything below 70,000 ft.
[General]
# ROK_SAM-II
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=ShoreTargetsOnly  // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=1000                              // in kg. Used for aircraft
AmmoPoints=4200                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=35
ImpactSize=Medium                       // Impact size, can be small, medium, large, verylarge
Penetration=Heavy                     // can be minor, moderate, heavy, always

FuzeProximityDistance=23.0             // for proximity fuze: distance to target in yard
KillProbability=4.5                     //Chance to intercept missile
InterceptOutOfAltitudePenalty=0.40 //0.40                  // yay!
InterceptSpeedPenaltyMultiplier=0.01                  // yay!
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3         // time in seconds where the missile moves straight on without guiding
Retargetable=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=65.0                      // Climb angle for initial loft
MaxLoftAlt=110000.0                     // in feet. Maximum altitude for lofting
MaxLoftVelocity=3500.0                 // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=14                 // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
#TerminalVerticalTurnRate=90
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
LocalTerminalOnly=True                 // if true connection with a guiding radar will be severed upon entering terminal approach stage
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=3500.0                     // Maximum speed in knots
MaxTurnRate=35.0                       // Maximum turnrate in degrees per second
#LaunchTurnRate=14                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=6.0                       // Burn time for initial booster burn
Acceleration=11.8                      // Gs of acceleration in initial burn
SustainerAccelerationTime=44            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=3.15               // Acceleration of sustainer burn. -1 if there is no sustainer
#174kN - 6.0s Boost
#22kN - 44s Sustain
TypicalTargetAlt=80000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0		           		// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0		       		// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=1.45 //0.14                        // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.3                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=240                       // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MinLaunchRange=2.0                     // Minimum launch range in nautical miles
MaxLaunchRange=260.0                    // Maximum launch range in nautical miles
MinAttackAltitude=15                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=130000               // Maximum altitude of target, in feet
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=68.0                        // Seeker gain in dB
SeekerFOV=60.0                          // Seeker field-of-view in degrees
SeekerGimbalFOV=120                     // Seeker gimbal FOV in degrees
SeekerActiveRange=22.0                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=50.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=8.0                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
#ECCM
AntiCountermeasuresBonus=0.50           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.55                   // This value substracted from probability of being jammed  (0...1)
#SelfDestruct
SelfDestructDelay=2.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/K_weapon/models/
ResourcesRoot=K_weapon.obj
ResourcesMesh=rok_K-SAM-II
ResourcesMaterialFolder=assets/K_weapon/materials/rok_k-sam-II/
ResourcesMaterial=rok_k-sam-II_mat.ini
ResourcesMeshForLaunch=eu_launch_SM-6
ResourcesMeshCanister=eu_launch_SM-6
ResourcesMeshSwitchTime=3  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/wp_as-13_booster
BoosterEffectPosition=0,0,-0.012
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.025
InFlightEffectStartTime=0.1  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/sam_medium_effect
SustainerEffectPosition=0,0,-0.033
SustainerEffectStartTime=4.0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion
[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.05
