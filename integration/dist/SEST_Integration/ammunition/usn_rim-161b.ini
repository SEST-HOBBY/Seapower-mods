# SEST Collection Fixes - base: 3629144864's usn_rim-161b. One delta:
# MaxLoftAngle=85.0 un-commented. The author wrote the value and then
# disabled the line, which left MaxLoftAlt with no climb angle: the round
# is told what altitude to reach and not how steeply to get there.
# MaxLoftAlt 300000 -> Target, so it climbs to the target instead of
# stopping at 91 km inside a band that reaches 500-914 km.
# InterceptOutOfAltitudePenalty -> 0.10, the value its opposite number
# pla_hq-19 carries; it had 0.50 ('poor'), and the C had an off-scale 1.10.
# MaxFlightTime 300 -> 600 s, enough to actually fly its declared range.
# MinAttackAltitude 220000 -> 150000, where the ballistic threats fly.
# From the Anchorchain overwrite, so it flies the same without the preloader:
# InitialFlightPhaseDuration=5, MaxLoftAngle=90.0, TerminalApproachDist=50.0,
# SeekerFOV=90, SeekerPassiveRange=100, LaunchTurnRate=5, TimeLimited=True.
[General]
#RIM-161B SM-3 Block IA
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
CanNotAttackTypes=Aircraft,Helicopter     // Seeker ignores objects of this type while in default mode

Mass=1600                              // in kg. Used for aircraft
AmmoPoints=9000                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

FrontalArea=0.103
SideArea=1.65
[SensorData]
#Visual
VisualIdentificationRange=1  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=0.1
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=1
Power=100
ImpactSize=Large                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

FuzeProximityDistance=23.0             // for proximity fuze: distance to target in yard
KillProbability=0.85                     //Chance to intercept missile
InterceptSpeedPenaltyMultiplier=0.01                  // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
InterceptOutOfAltitudePenalty=0.10                  // base value used for out-of-altitude calculations, 0.20 is excellent, 0.30 is good, 0.40 is average, 0.50 is poor
InterceptSizePenaltyMultiplier=0.50					// multiplier to the size penalty, 1.0 is default

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=5         // time in seconds where the missile moves straight on without guiding
;PerformsSlightBallisticInitialFlight=False  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
TargetRequired=False
;Retargetable=False
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=90.0                      // Climb angle for initial loft
MaxLoftAlt=Target
;MaxLoftVelocity=5832.0                 // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=50.0              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                    // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=5832.0                      // Maximum speed in knots
MaxTurnRate=20.0                        // Maximum turnrate in degrees per second
MaxTurnG=25                             // Maximum G-limit of missile turns
LaunchTurnRate=5                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=6.0                    // Burn time for initial booster burn
Acceleration=12.0                       // Gs of acceleration in initial burn
SustainerAccelerationTime=40            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=4.5                 // Acceleration of sustainer burn. -1 if there is no sustainer
#174kN - 5.0s Boost
#22kN - 40s Sustain
TypicalTargetAlt=800000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0		           		// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0		       		// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=-1                      // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.6                       // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
TimeLimited=True
MaxFlightTime=600                       // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MinLaunchRange=50.0                      // Minimum launch range in nautical miles
MaxLaunchRange=486.0                    // Maximum launch range in nautical miles
MinAttackAltitude=150000                    // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=1640000               // Maximum altitude of target, in feet
MaxAttackVelocity=9000				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=98                    // The lower the value, the greater risk of misfire or accident (0...100)
AutoAttackOutsideAltitudes=False
#========================================     Seeker     ===========================================================
#Homing
IsRearAspectOnly=False                 //Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=120                     //Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=90                          // Seeker field-of-view in degrees
SeekerGimbalFOV=90                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=100                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=1.0           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=1.0                    // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=2.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_SM-3_Blk1
ResourcesMaterialFolder=assets/europack/materials/RIM-161/
ResourcesMaterial=RIM-161C_mat.ini
ResourcesMeshForLaunch=eu_launch_SM-3_Blk1
#ResourcesMeshCanister=launch
ResourcesMeshSwitchTime=18  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/usn_rgm-109_booster
BoosterEffectPosition=0,0,0.0088
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.025
InFlightEffectStartTime=0.1  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/sam_medium_effect
SustainerEffectPosition=0,0,-0.033
SustainerEffectStartTime=4.0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.015,0.015,0.07
