# SEST Collection Fixes - vanilla's loading-screen tips, verbatim.
# Another mod files a [LoadingTips] section under language_en/ (3732654992/loading_tips.ini),
# and the key-by-key merge would otherwise hand the game that mod's tips
# under the English folder. Nothing here is SEST's own text.
[LoadingTips]
Count=19
Header=TIP
Tip001=Harpoon and anti-ship Tomahawk missiles do not avoid terrain. Confirm a clear route before firing.
Tip002=Dispersed formations are harder for the enemy to interpret on radar.
Tip003=Standard missiles can be used in line-of-sight anti-surface engagements and are more reliable than Harpoon in this role.
Tip004=SH-2F helicopters provide airborne surface-search radar for US Navy escort ships. They can detect surface contacts beyond shipboard radar range, but cannot search for aircraft.
Tip005=Sovremenny-class destroyers carry the SS-N-22 Sunburn. This is the most capable anti-ship missile of the time, but it is limited by its 50 nm range.
Tip006=Udaloy-class frigates carry the SA-N-9 SAM system, which is especially effective against sea-skimming missiles such as Harpoon and Exocet.
Tip007=Aircraft jamming will significantly reduce the effectiveness of enemy air defenses.
Tip008=The SS-N-14A (Metel) anti-submarine weapon is carried by the Krivak and Kresta II class anti-submarine ships. The SS-N-14B (Rastrub) adds a secondary anti-ship capability and is fitted to the Krivak II, Kara, and Udaloy classes, with 27 nm range.
Tip009=Press Tab to quickly maximize the Tactical Display (map).
Tip010=Press Z to use binoculars, optronics, or periscopes from supported units.
Tip011=Use the map tools to draw out the max range of SAMs and anti-ship missiles of identified enemy units.
Tip012=Hold Alt while hovering over a weapon in the bottom bar to display its firing arcs on the tactical map and in the 3D view.
Tip013=Wire-guided torpedoes can be manually controlled in speed, in depth, and in targeted position, except for earlier torpedoes like TEST-71 which can only adjust its speed and course after launch.
Tip014=The Status panel popout, located on the bottom bar, contains relevant details depending on the context - selected unit's radiated noise level, helicopter survivor transport capacity, liferaft beacon distance, and available 'Accountable' ammunition types such as AIM-54 or AGM-84 on flight decks.
Tip015=All types of sonar can be used to detect all contacts that generate noise. This is especially valuable when using shipboard towed arrays (SQR-18, SQR-19) to detect enemy ships well beyond the radar horizon.
Tip016=Most helicopters have some form of transport capacity to allow for survivor pickup, however some smaller helicopters cannot carry many (or any) survivors unless ASW equipment is removed in the 'Transport' loadout.
Tip017=Some high-tier Soviet surface combatants are equipped with over-the-horizon (OTH-T) detection capability using ESM, particularly the Kara, Slava, Sovremenny, and Kirov classes can use these sensors to fire anti-ship missiles from well beyond the normal radar horizon so long as their targets are radiating.
Tip018=AGM-84D, RGM-84D, and UGM-84D have a variable pop-up mode depending on the size of its target, small boats and surfaced submarines are attacked with a pop-up trajectory, and surface ships are attacked with a sea-skimming trajectory.
Tip019=Most low-power surface search radar sets on military warships are indistinguishable from civilian navigation radars, and cannot be readily identified on ESM. However, high-power surface search radars (those with air search capability) are distinct and will give away your identity.