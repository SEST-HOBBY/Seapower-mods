sest_apkws_er=M282ER,APKWS II-ER,GFFAR,Extended-range development of the AGR-20 APKWS II laser-guided 70mm rocket. An uprated motor stretches the launch envelope from 3.5 to 8 nautical miles - a medium-range precision strike round at rocket cost. Same guidance kit and warhead as the M282.
sest_agr-30=AGR-30,Redback,GFFAR,What-if evolution of the 70mm guided rocket family: the AGR-30 Redback replaces the APKWS II laser kit with an imaging-infrared seeker - true fire and forget out to 15 nautical miles with a lofted profile and terminal dive. Same airframe and warhead as the APKWS II; missile performance at rocket cost.
sest_aim-424=AIM-424,MALICE,AAM,The AIM-424 MALICE is a what-if very-long-range air-to-air missile developed from the AGM-88G AARGM-ER airframe and sized for internal carriage on the F-35. It trades a little of the AIM-174B's reach for a far better seeker: active-radar terminal homing at 40 nm with datalink midcourse guidance and a full passive anti-emitter mode that homes on radars and jammers alike. A secondary anti-surface capability comes with the AARGM-ER heritage.
sest_rim-162_essm=RIM-162,ESSM Blk II,SAM/ASuW,The RIM-162 Evolved SeaSparrow Missile (ESSM) is a development of the RIM-7 Sea Sparrow missile used to protect ships from attacking missiles and aircraft. ESSM is designed to counter supersonic maneuvering anti-ship missiles. ESSM also has the ability to be "quad-packed" in the Mark 41 Vertical Launch System, allowing up to four ESSMs to be carried in a single cell.
