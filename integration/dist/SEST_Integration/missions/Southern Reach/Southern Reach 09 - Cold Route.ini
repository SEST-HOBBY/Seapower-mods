[Language_en]
Name=Southern Reach 09 - Cold Route
Description=SOUTH OF AUSTRALIA, 48 South, morning. The January voyage is two days out of Hobart: SOUTHERN ENDEAVOUR with Casey's second lift, DERWENT SPIRIT with a new plate and the winter's fuel, CORAL PIONEER, AURORA TRADER and DAVIS PROVIDER. Twelve knots, south-west, and the whole force with them.\n\nThe protection group's carrier is a hundred and fifty miles south-east with two frigates and a corvette, and its air wing flew over the fishing fleet for the cameras on New Year's Eve. Today it flies for the convoy. A nuclear boat the group calls a fisheries survey asset is somewhere ahead of the track. WEDGETAIL 05 and KIWI 05 are up out of Edinburgh; no fighter in Australia reaches this water and comes home, and the destroyer's magazine is the air defence.\n\nFour of five into the handover box, Southern Endeavour among them. The trawlers and the Hobart-bound bulker are not part of this and will not move out of your way.
Objective_Convoy=Four of five convoy hulls, Southern Endeavour among them, into the handover box
Objective_Tanker=MT Derwent Spirit must survive
Objective_Wedgetail=Keep the Wedgetail flying
Objective_Neutrals=Harm no trawler or merchant
Taskforce1StartMessage=<color=yellow>Cold Route</color>|SOUTH OF AUSTRALIA, 48 South, morning. The January voyage is two days out of Hobart: SOUTHERN ENDEAVOUR with Casey's second lift, DERWENT SPIRIT with a new plate and the winter's fuel, CORAL PIONEER, AURORA TRADER and DAVIS PROVIDER. Twelve knots, south-west, and the whole force with them.\n\nThe protection group's carrier is a hundred and fifty miles south-east with two frigates and a corvette, and its air wing flew over the fishing fleet for the cameras on New Year's Eve. Today it flies for the convoy. A nuclear boat the group calls a fisheries survey asset is somewhere ahead of the track. WEDGETAIL 05 and KIWI 05 are up out of Edinburgh; no fighter in Australia reaches this water and comes home, and the destroyer's magazine is the air defence.\n\nFour of five into the handover box, Southern Endeavour among them. The trawlers and the Hobart-bound bulker are not part of this and will not move out of your way.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Four hulls in the box and Southern Endeavour among them. The carrier's air wing spent its morning and the boat spent its chance. Marsh, from the Endeavour's bridge: 'We saw the missiles. We saw yours too.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The voyage is broken south of Australia with the stations' winter in it. Casey gets what the first lift left.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The voyage is broken south of Australia with the stations' winter in it. Casey gets what the first lift left.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Four hulls in the box and Southern Endeavour among them. The carrier's air wing spent its morning and the boat spent its chance. Marsh, from the Endeavour's bridge: 'We saw the missiles. We saw yours too.'
TimeoutMessage=<color=red>Out of time.</color>|Ninety minutes and the convoy is still short of the box with the carrier's second strike forming. The route is theirs today.
SupportLoss1Intel=DERWENT SPIRIT is gone with the winter's fuel in her. Last Ship South sails without a tanker, and Casey's winter is whatever the first lift put ashore.  - Mercer
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
