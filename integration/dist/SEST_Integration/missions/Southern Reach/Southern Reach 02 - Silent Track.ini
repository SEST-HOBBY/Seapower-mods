[Language_en]
Name=Southern Reach 02 - Silent Track
Description=MACQUARIE RIDGE, before dawn. A longliner south of Campbell Island reported a possible submarine on the sixth. Subsequent acoustic reporting suggests a nuclear boat, designated VICTOR, near the resupply route. Distance from a tender does not identify its propulsion or class; establish a fresh contact.\n\nCOLLINS is at periscope depth on the ridge's western flank with thirty-one days of patrol left in her. KIWI 05, a New Zealand Poseidon out of Ohakea with Squadron Leader Rewi's crew, has one sortie and a field of buoys. NAN HAI 27, the research trawler that shadowed the Storm Bay convoy, is thirty miles north. Her presence is a search cue, not a submarine fix.\n\nClassify VICTOR, then take Collins east off the ridge to the exit point. Do not attack it. RV SOUTHERN SURVEYOR is on the ridge with a science party; a Bluff longliner and a whale are also in the area. Distinguish those contacts before classifying the boat. The ceasefire is twelve days old and nobody fires first here.
Objective_Track=Classify the contact, then take Collins to the exit point
Objective_Named=Put a name on VICTOR for the record
Objective_Restraint=Do not attack the contact: the ceasefire holds
Objective_Collins=HMAS Collins must survive
Objective_Kiwi=Do not lose Kiwi 05
Objective_Traffic=Harm no research vessel, fishing boat or whale
Taskforce1StartMessage=<color=yellow>Silent Track</color>|MACQUARIE RIDGE, before dawn. A longliner south of Campbell Island reported a possible submarine on the sixth. Subsequent acoustic reporting suggests a nuclear boat, designated VICTOR, near the resupply route. Distance from a tender does not identify its propulsion or class; establish a fresh contact.\n\nCOLLINS is at periscope depth on the ridge's western flank with thirty-one days of patrol left in her. KIWI 05, a New Zealand Poseidon out of Ohakea with Squadron Leader Rewi's crew, has one sortie and a field of buoys. NAN HAI 27, the research trawler that shadowed the Storm Bay convoy, is thirty miles north. Her presence is a search cue, not a submarine fix.\n\nClassify VICTOR, then take Collins east off the ridge to the exit point. Do not attack it. RV SOUTHERN SURVEYOR is on the ridge with a science party; a Bluff longliner and a whale are also in the area. Distinguish those contacts before classifying the boat. The ceasefire is twelve days old and nobody fires first here.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Collins has reached the eastern exit with VICTOR classified. Rewi's crew has filed the acoustic record. No assessment of whether the submarine detected Collins is available.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|Collins is lost on a ridge nobody was fighting over, and the ceasefire in the south is now a question.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|Collins is lost on a ridge nobody was fighting over, and the ceasefire in the south is now a question.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Collins has reached the eastern exit with VICTOR classified. Rewi's crew has filed the acoustic record. No assessment of whether the submarine detected Collins is available.
TimeoutMessage=<color=red>Operational window closed.</color>|Seventy minutes and the contact is still a contact. She is off the ridge and so is the picture, and the next convoy crosses it blind.
StageIntel=ASW REPORT: Contact classified as Akula-class, designated VICTOR. The acoustic record has been passed to Wellington and Canberra. Continue tracking with available sensors while Collins withdraws east; this classification does not authorise an attack.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
