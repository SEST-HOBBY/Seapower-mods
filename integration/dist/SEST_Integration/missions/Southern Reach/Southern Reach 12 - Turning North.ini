[Language_en]
Name=Southern Reach 12 - Turning North
Description=THE TASMAN APPROACHES, morning. The protection group is fifty miles north-east of you, transiting at fourteen knots: LIAONING, a frigate, a corvette, a replenishment ship, the research trawler NAN HAI 27 and the Russian research vessel AKADEMIK FERSMAN, all in company, all going the same way. The fishing fleet it came to protect has been left to fish.\n\nYou have what came out of the south, WEDGETAIL 05 out of East Sale, and for the first time since the southern deployment began a fighter that can reach the water you are in. Coastal traffic and the Melbourne-Auckland service are in the same box.\n\nShadow the group. Classify the carrier, the replenishment ship and the collector. Hold the shadowing line behind them. The opposing formation is reported under restrictive engagement orders. Your own orders prohibit opening fire. Hold the shadowing line and report any change in the contacts' behaviour.
Objective_Network=Classify the carrier, the replenishment ship and the collector
Objective_Shadow=Then hold the shadowing line behind the group
Objective_Restraint=Fire on nothing: shadow, do not start the Tasman war
Objective_Wedgetail=Keep the Wedgetail flying
Objective_Flagship=Bring your flagship out intact
Objective_Neutrals=Harm no merchant, trawler or aircraft
Taskforce1StartMessage=<color=yellow>Turning North</color>|THE TASMAN APPROACHES, morning. The protection group is fifty miles north-east of you, transiting at fourteen knots: LIAONING, a frigate, a corvette, a replenishment ship, the research trawler NAN HAI 27 and the Russian research vessel AKADEMIK FERSMAN, all in company, all going the same way. The fishing fleet it came to protect has been left to fish.\n\nYou have what came out of the south, WEDGETAIL 05 out of East Sale, and for the first time since the southern deployment began a fighter that can reach the water you are in. Coastal traffic and the Melbourne-Auckland service are in the same box.\n\nShadow the group. Classify the carrier, the replenishment ship and the collector. Hold the shadowing line behind them. The opposing formation is reported under restrictive engagement orders. Your own orders prohibit opening fire. Hold the shadowing line and report any change in the contacts' behaviour.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The escort has reached the shadowing line with the carrier, replenishment ship and collector classified. Sydney and Wellington have an identified formation to monitor as the force moves into the Tasman.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The shadowing operation has failed. Sydney and Wellington require the surviving force's report before they can meet the formation in the Tasman.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The shadowing operation has failed. Sydney and Wellington require the surviving force's report before they can meet the formation in the Tasman.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The escort has reached the shadowing line with the carrier, replenishment ship and collector classified. Sydney and Wellington have an identified formation to monitor as the force moves into the Tasman.
TimeoutMessage=<color=red>Operational window closed.</color>|Seventy minutes and the group is over the horizon with half its network unnamed. Sydney meets it without a picture.
StageIntel=SURFACE PICTURE: LIAONING, the Type 901 replenishment ship HULUNHU and NAN HAI 27 are classified. Their identities have been passed to Sydney and Wellington for the next patrol's correlation. Hold the shadowing line; reacquire any contact that leaves sensor coverage.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
