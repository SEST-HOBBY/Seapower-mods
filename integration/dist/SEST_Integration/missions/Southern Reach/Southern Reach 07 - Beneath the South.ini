[Language_en]
Name=Southern Reach 07 - Beneath the South
Description=THE DEEP SOUTHERN OCEAN, 57 South, Christmas Eve. VICTOR fired on DERWENT SPIRIT on the twenty-first and has been running south ever since, toward the research vessel that keeps her at sea. The vessel is here, sixty miles south-west, holding station where the boat will come to her.\n\nYou have what you rearmed at Bluff, the Seahawk, and a Poseidon out of Hobart with fuel for one field of buoys before she has to turn for home. The Wedgetail cannot hear a submarine and the Triton cannot drop a buoy: the Poseidon is the one that matters. A Bear-F is coming to look at what you are doing.\n\nSink VICTOR. Leave RV AKADEMIK FERSMAN alone whatever she does - she is a merchant hull under a state flag with forty scientists aboard, and she is not the boat. A factory trawler and a whale are in the same water.
Objective_Boat=Sink VICTOR
Objective_Tender=Leave the research vessel alone
Objective_Flagship=Bring your flagship out intact
Objective_Neutrals=Harm no trawler or whale
Taskforce1StartMessage=<color=yellow>Beneath the South</color>|THE DEEP SOUTHERN OCEAN, 57 South, Christmas Eve. VICTOR fired on DERWENT SPIRIT on the twenty-first and has been running south ever since, toward the research vessel that keeps her at sea. The vessel is here, sixty miles south-west, holding station where the boat will come to her.\n\nYou have what you rearmed at Bluff, the Seahawk, and a Poseidon out of Hobart with fuel for one field of buoys before she has to turn for home. The Wedgetail cannot hear a submarine and the Triton cannot drop a buoy: the Poseidon is the one that matters. A Bear-F is coming to look at what you are doing.\n\nSink VICTOR. Leave RV AKADEMIK FERSMAN alone whatever she does - she is a merchant hull under a state flag with forty scientists aboard, and she is not the boat. A factory trawler and a whale are in the same water.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|VICTOR is on the bottom at 57 South. The research vessel is still afloat, still flagged and still researching, which is the sentence Canberra wanted to be able to say on Boxing Day.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The escort is gone and the boat is not. The route south is hers for the rest of the season.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The escort is gone and the boat is not. The route south is hers for the rest of the season.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|VICTOR is on the bottom at 57 South. The research vessel is still afloat, still flagged and still researching, which is the sentence Canberra wanted to be able to say on Boxing Day.
TimeoutMessage=<color=red>Out of time.</color>|Eighty minutes and VICTOR is still a contact. She has her tender and the ice edge to hide in, and the January voyage sails through her.
SR02BoatNamedIntel=Collins's datum from the ninth: VICTOR is on your plot as a classified contact from the first minute, with the signature Rewi's crew logged on the ridge. You know what she sounds like. Now find where.
SR07AkulaSunkIntel=VICTOR is on the bottom. The boat that fired the first shot in the south will not be in the line at the ice edge, and the research vessel has nothing left to tend.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
