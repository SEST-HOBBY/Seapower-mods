[Language_en]
Name=Southern Reach 06 - Broken Supply Line
Description=SOUTH OF THE AUCKLAND ISLANDS, early morning. DERWENT SPIRIT took a torpedo forward at 0210 - the first shot fired in the south - and she is still afloat because the Chief got a collision mat over the hole and the tanks aft are full. One engine, six knots, Bluff. CORAL PIONEER is in company because her master, Leila Santos, would not be elsewhere.\n\nAcoustic reporting links the attack to VICTOR, the Akula HMAS Collins named on the Macquarie Ridge on the ninth. The last estimated position is ahead of the coaster's track, between here and the islands; establish the present contact before acting. A Type 054A flying the fisheries-protection flag is fifty miles east with its helicopter up and has been keeping station on the coaster since first light, which is not something a fisheries patrol does. A Bear is coming up from the south-west and will be overhead inside the half hour.\n\nYou have the force already allocated and what Macquarie left in the magazines. Bring the coaster to the handover line. The expedition ship out of the islands, the longliner and the whale are in the same water; nobody in New Zealand's region will forgive a dead tourist. Weapons tight on anything that has not fired; on the boat, answer her if she fires again - the hunt waits on Wellington and Canberra.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nSUBMARINE ATTACHMENT: HMAS Rankin is allocated to this operation in an independent patrol box, submerged with weapons held. You command the boat. Deconflict its movements from the convoy and your ASW weapons before releasing it to engage. It is an authored theatre attachment for this operation, not a purchased hull carried into every later battle.
Objective_Coaster=Bring DERWENT SPIRIT to the handover line
Objective_Cargo=MV Coral Pioneer must survive
Objective_Flagship=Bring your flagship out intact
Objective_Neutrals=Harm no expedition ship, fishing boat or whale
Taskforce1StartMessage=<color=yellow>Broken Supply Line</color>|SOUTH OF THE AUCKLAND ISLANDS, early morning. DERWENT SPIRIT took a torpedo forward at 0210 - the first shot fired in the south - and she is still afloat because the Chief got a collision mat over the hole and the tanks aft are full. One engine, six knots, Bluff. CORAL PIONEER is in company because her master, Leila Santos, would not be elsewhere.\n\nAcoustic reporting links the attack to VICTOR, the Akula HMAS Collins named on the Macquarie Ridge on the ninth. The last estimated position is ahead of the coaster's track, between here and the islands; establish the present contact before acting. A Type 054A flying the fisheries-protection flag is fifty miles east with its helicopter up and has been keeping station on the coaster since first light, which is not something a fisheries patrol does. A Bear is coming up from the south-west and will be overhead inside the half hour.\n\nYou have the force already allocated and what Macquarie left in the magazines. Bring the coaster to the handover line. The expedition ship out of the islands, the longliner and the whale are in the same water; nobody in New Zealand's region will forgive a dead tourist. Weapons tight on anything that has not fired; on the boat, answer her if she fires again - the hunt waits on Wellington and Canberra.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nSUBMARINE ATTACHMENT: HMAS Rankin is allocated to this operation in an independent patrol box, submerged with weapons held. You command the boat. Deconflict its movements from the convoy and your ASW weapons before releasing it to engage. It is an authored theatre attachment for this operation, not a purchased hull carried into every later battle.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Derwent Spirit is at the line with a tug coming down from Bluff, and Coral Pioneer is beside her. The Chief's mat held. Brand: 'She is in our hands now. Nobody touches her.'
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The coaster is gone with the winter's fuel in her, three hundred miles from a slipway. Casey's January is a different problem now.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The coaster is gone with the winter's fuel in her, three hundred miles from a slipway. Casey's January is a different problem now.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Derwent Spirit is at the line with a tug coming down from Bluff, and Coral Pioneer is beside her. The Chief's mat held. Brand: 'She is in our hands now. Nobody touches her.'
TimeoutMessage=<color=red>Operational window closed.</color>|One hundred and twelve minutes and the coaster is still short of the line with a boat somewhere ahead of her. The tug from Bluff has nothing to meet yet.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 75-minute window has closed. Command will hold the line for about 37 minutes more. Finish the task now.
SituationReport1Intel=KILA: The submarine detachment watches the outer approach while your convoy escort stays close. Its weapons are held until you decide; a second blue hull under water does not classify VICTOR for you.
SR06RankinLostIntel=SUBMARINE CONTROL: Rankin is lost. Her attachment will be unavailable at Cold Route.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
