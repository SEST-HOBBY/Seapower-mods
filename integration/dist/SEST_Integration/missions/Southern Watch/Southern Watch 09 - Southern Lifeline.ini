[Language_en]
Name=Southern Watch 09 - Southern Lifeline
Description=REAR SUPPORT AREA, east of the Cape. COLLINS has been out for thirty-one days and comes home next week whatever happens today. She is surfaced alongside STALWART taking fuel, stores and two crew off for medical, and while she is up there she is a very large grey target making four knots.\n\nThe service window is thirty-five minutes and it runs on the clock, not on how much crossed the hose. STALWART and COLLINS stay inside the service box - five miles around the rendezvous - until it has run; if either of them is outside it when the window closes, the transfer nobody made is the whole transfer. Break off to chase something and the clock does not stop for you. When the thirty-five minutes are up, both of them come south together to the withdrawal line, and COLLINS dives the moment she is clear of the hose.\n\nSTALWART has the duty. MV Coral Provider was pencilled in with the dry stores; whether she sailed depends on what Steel Highway left the corridor to sail with.\n\nA Tu-214R came down the outside of the box last night and did not go home, which usually means somebody now knows where to look. There is an Akula unaccounted for to the south-east, and a Flanker pair within range of here with a Helix spotting for them off a tender that has been loitering north of the box since Tuesday. Assume one of those Flankers is carrying something for a ship. Keep the window open and get everybody out of it.
Objective_Service=Hold the service box for the 35-minute window, then bring STALWART and COLLINS south together to the withdrawal line
Objective_Collins=HMAS Collins must survive
Objective_Supply=HMAS Stalwart must survive
Taskforce1StartMessage=<color=yellow>Southern Lifeline</color>|REAR SUPPORT AREA, east of the Cape. COLLINS has been out for thirty-one days and comes home next week whatever happens today. She is surfaced alongside STALWART taking fuel, stores and two crew off for medical, and while she is up there she is a very large grey target making four knots.\n\nThe service window is thirty-five minutes and it runs on the clock, not on how much crossed the hose. STALWART and COLLINS stay inside the service box - five miles around the rendezvous - until it has run; if either of them is outside it when the window closes, the transfer nobody made is the whole transfer. Break off to chase something and the clock does not stop for you. When the thirty-five minutes are up, both of them come south together to the withdrawal line, and COLLINS dives the moment she is clear of the hose.\n\nSTALWART has the duty. MV Coral Provider was pencilled in with the dry stores; whether she sailed depends on what Steel Highway left the corridor to sail with.\n\nA Tu-214R came down the outside of the box last night and did not go home, which usually means somebody now knows where to look. There is an Akula unaccounted for to the south-east, and a Flanker pair within range of here with a Helix spotting for them off a tender that has been loitering north of the box since Tuesday. Assume one of those Flankers is carrying something for a ship. Keep the window open and get everybody out of it.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The window held, Collins is dived and heading for Stirling, and Stalwart still has enough in her tanks to do this again next week. Kila, from Moresby: 'Send the next one.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The support group is broken. Every boat in the north now has to come all the way home to do what should take four hours out here.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The support group is broken. Every boat in the north now has to come all the way home to do what should take four hours out here.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The window held, Collins is dived and heading for Stirling, and Stalwart still has enough in her tanks to do this again next week. Kila, from Moresby: 'Send the next one.'
TimeoutMessage=<color=red>Out of time.</color>|Eighty-five minutes and the group is still in the area. Whatever crossed the hose, COLLINS goes home the long way on what she has, and STALWART is still up here when the next Flanker pair comes.
StageIntel=The window has run. STALWART reports the hose is in and COLLINS is casting off - get them south together, to the withdrawal line, before somebody comes to look where the Tu-214R was looking.
