[Language_en]
Name=Southern Watch 04 - The Quiet Passenger
Description=BANDA APPROACHES, middle watch. Something small and low is running south out of the Seram passage with almost no freeboard and no transponder. It may be carrying weapons for the airfield-and-port enclave Meridian's hard-liners still hold, it may be carrying people, and the difference decides what you are allowed to do about it.\n\nYour ship is working this water, with your Seahawk and Poseidon if you have them to fly. There is also a real submarine in this water - a Type 039 that has been quiet for eleven hours - and a biologic contact that three different ships have now reported as a hostile boat.\n\nSEARCH the lane south of the passage for her: she shows little on radar and less on sonar, and your helicopter and Poseidon are your best eyes. CLASSIFY her before anybody fires - on a night like this the fishing boat and the whale look the same. Then STOP her. Have your ship in the handover box to the south when she reaches it and she heaves to under your guns for the boarding party: her surrender and her cargo are the full result. If she will not stop, or you cannot be there in time, you are cleared to sink her once she is classified.\n\nDo not lose the ship doing it.
Objective_Track=Find and classify the low-profile craft, then stop her: be in the handover box with her when she arrives, or sink her
Objective_Seized=Take her intact: your ship in the handover box when she arrives
Objective_Patrol=Keep your flagship afloat
Objective_Neutrals=Do not shoot the wildlife or the fishermen
Taskforce1StartMessage=<color=yellow>The Quiet Passenger</color>|BANDA APPROACHES, middle watch. Something small and low is running south out of the Seram passage with almost no freeboard and no transponder. It may be carrying weapons for the airfield-and-port enclave Meridian's hard-liners still hold, it may be carrying people, and the difference decides what you are allowed to do about it.\n\nYour ship is working this water, with your Seahawk and Poseidon if you have them to fly. There is also a real submarine in this water - a Type 039 that has been quiet for eleven hours - and a biologic contact that three different ships have now reported as a hostile boat.\n\nSEARCH the lane south of the passage for her: she shows little on radar and less on sonar, and your helicopter and Poseidon are your best eyes. CLASSIFY her before anybody fires - on a night like this the fishing boat and the whale look the same. Then STOP her. Have your ship in the handover box to the south when she reaches it and she heaves to under your guns for the boarding party: her surrender and her cargo are the full result. If she will not stop, or you cannot be there in time, you are cleared to sink her once she is classified.\n\nDo not lose the ship doing it.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|WHISKEY has heaved to in the handover box under your guns, and the boarding party is aboard her. Her cargo and her crew are the Indonesian authorities' now. Forward all additional submarine and traffic reports separately.
SunkVictoryMessage=<color=lime>Operation complete.</color>|WHISKEY would not stop and is on the bottom of the Banda Sea, cargo and all. The route is closed for tonight; the evidence went down with her.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The passenger is gone - into the handover without you, into the passage, or onto the bottom before anybody knew what she was. Either way the route it was running is still a rumour, and the only thing you positively identified all night had a blowhole.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The passenger is gone - into the handover without you, into the passage, or onto the bottom before anybody knew what she was. Either way the route it was running is still a rumour, and the only thing you positively identified all night had a blowhole.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|WHISKEY has heaved to in the handover box under your guns, and the boarding party is aboard her. Her cargo and her crew are the Indonesian authorities' now. Forward all additional submarine and traffic reports separately.
TimeoutMessage=<color=red>Operational window closed.</color>|The passenger is into the passage and gone. Whatever the route was, it still is.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 45-minute window has closed. Command will hold the line for about 23 minutes more. Finish the task now.
StageIntel=ESCORT CONTACT REPORT: WHISKEY classified as a low-profile semi-submersible. She has not answered the order to heave to. Get your ship into the handover box with her and she surrenders to the boarding party. If she will not stop, you are cleared to sink her.
O2KiwiPictureIntel=ASW CELL: Kiwi 01's earlier report links MV Harbour Light to a submarine working this route. Its last reported position is on your display as a datum and will age off in fifteen minutes. That contact is not the passenger; classify before you act.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
