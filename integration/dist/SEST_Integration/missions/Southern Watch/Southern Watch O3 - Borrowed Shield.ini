[Language_en]
Name=Southern Watch O3 - Borrowed Shield
Description=TIMOR SEA, western approach. SEJONG THE GREAT and DAEGU are coming in from the Lombok side with the stores ship BUSAN PIONEER, on the Korean government's own arrangement: one fortnight, one destroyer, one frigate, and Captain Han fires when fired upon or when you are.\n\nA Kilo has been reported on the approach they are using, and the enclave has a strike pair on alert that came south twice this week to look at the same water. Your detachment meets them at the join point; until then the shield has to bring itself in.\n\nBoth warships reach the join point or there is no fortnight. The stores ship is worth fifteen minutes of anybody's time, but she is not the reason Seoul sent a destroyer.
Objective_Shield=Bring SEJONG THE GREAT and DAEGU to the join point
Objective_Stores=Do not lose Busan Pioneer
Objective_Traffic=Harm no neutral shipping
Taskforce1StartMessage=<color=yellow>Borrowed Shield</color>|TIMOR SEA, western approach. SEJONG THE GREAT and DAEGU are coming in from the Lombok side with the stores ship BUSAN PIONEER, on the Korean government's own arrangement: one fortnight, one destroyer, one frigate, and Captain Han fires when fired upon or when you are.\n\nA Kilo has been reported on the approach they are using, and the enclave has a strike pair on alert that came south twice this week to look at the same water. Your detachment meets them at the join point; until then the shield has to bring itself in.\n\nBoth warships reach the join point or there is no fortnight. The stores ship is worth fifteen minutes of anybody's time, but she is not the reason Seoul sent a destroyer.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The shield is in. Sejong the Great and Daegu are in company with your detachment, Busan Pioneer or not, and Captain Han has a signal to send that says the fortnight has started.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The detachment is broken before it joined. Seoul's fortnight ends before it began, and the corridor is back to one navy's magazines.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The detachment is broken before it joined. Seoul's fortnight ends before it began, and the corridor is back to one navy's magazines.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The shield is in. Sejong the Great and Daegu are in company with your detachment, Busan Pioneer or not, and Captain Han has a signal to send that says the fortnight has started.
TimeoutMessage=<color=red>Out of time.</color>|The join point is empty at the end of the window. The Korean detachment turns back for Surabaya, and the fortnight was spent on the approach.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
