[Language_en]
Name=Southern Watch 08 - The Open Door
Description=THE ENCLAVE, before dawn. Local authorities have negotiated a seventy-minute window to move civilians and emergency supplies out of the port. The battery covering the approach is an S-400 the first reports called man-portable, and it is not being run by the people who seized the airfield.\n\nGRIZZLY has the jamming and the anti-radiation shots. The F-35 pair carries the follow-up. The relief aircraft are behind you and they will not come in while that radar is up.\n\nSuppress the battery, put the launcher out of the argument, and let the transports through. You are not levelling a regional industrial complex to do it. Everything on that field that is not shooting at you is somebody's town.
Objective_Window=Get the relief aircraft through to the safe box
Objective_Battery=Neutralise the surface-to-air battery
Objective_Town=Leave the civilian buildings on the field standing
Taskforce1StartMessage=<color=yellow>The Open Door</color>|THE ENCLAVE, before dawn. Local authorities have negotiated a seventy-minute window to move civilians and emergency supplies out of the port. The battery covering the approach is an S-400 the first reports called man-portable, and it is not being run by the people who seized the airfield.\n\nGRIZZLY has the jamming and the anti-radiation shots. The F-35 pair carries the follow-up. The relief aircraft are behind you and they will not come in while that radar is up.\n\nSuppress the battery, put the launcher out of the argument, and let the transports through. You are not levelling a regional industrial complex to do it. Everything on that field that is not shooting at you is somebody's town.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Both transports are south with the first hundred people out. The battery is off the air and the window held.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The window closed with the transports still holding. The next negotiation starts from a worse place.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The window closed with the transports still holding. The next negotiation starts from a worse place.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Both transports are south with the first hundred people out. The battery is off the air and the window held.
TimeoutMessage=<color=red>Out of time.</color>|The relief window expired. The next negotiation starts from a worse place than this one did.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
