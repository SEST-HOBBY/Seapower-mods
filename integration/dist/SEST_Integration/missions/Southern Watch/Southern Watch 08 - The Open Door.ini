[Language_en]
Name=Southern Watch 08 - The Open Door
Description=THE ENCLAVE, BIAK, before dawn. Local Indonesian authorities have negotiated a seventy-minute window to move civilians and emergency supplies out of the port. The battery covering the approach is an S-400 the first reports called man-portable. Its crews are from the Russian detachment, not Meridian's hard-line faction, which seized the airfield.\n\nGRIZZLY, the Growler, has the jamming and the anti-radiation shots, off the US carrier THEODORE ROOSEVELT. The F-35 pair carries the follow-up strike, out of Langgur on the Kai group - Captain Prasetyo has lent the strip for this one operation and not an hour longer, and the pair recovers there, not on the carrier. The two relief KC-130Js are holding to the west and will not come in while that radar is up. If the coasters got fuel into Langgur on the tenth, a KC-46 is on the track south of the box and the pair can hold on station twice as long; if not, the pair has what it took off with.\n\nSuppress the battery, put its launcher out of the argument, and let the transports through. You are not levelling a regional industrial complex to do it. Everything on that field that is not shooting at you is somebody's town.
Objective_Window=Get the relief aircraft through to the safe box
Objective_Battery=Neutralise the surface-to-air battery
Objective_Town=Leave the civilian buildings on the field standing
Taskforce1StartMessage=<color=yellow>The Open Door</color>|THE ENCLAVE, BIAK, before dawn. Local Indonesian authorities have negotiated a seventy-minute window to move civilians and emergency supplies out of the port. The battery covering the approach is an S-400 the first reports called man-portable. Its crews are from the Russian detachment, not Meridian's hard-line faction, which seized the airfield.\n\nGRIZZLY, the Growler, has the jamming and the anti-radiation shots, off the US carrier THEODORE ROOSEVELT. The F-35 pair carries the follow-up strike, out of Langgur on the Kai group - Captain Prasetyo has lent the strip for this one operation and not an hour longer, and the pair recovers there, not on the carrier. The two relief KC-130Js are holding to the west and will not come in while that radar is up. If the coasters got fuel into Langgur on the tenth, a KC-46 is on the track south of the box and the pair can hold on station twice as long; if not, the pair has what it took off with.\n\nSuppress the battery, put its launcher out of the argument, and let the transports through. You are not levelling a regional industrial complex to do it. Everything on that field that is not shooting at you is somebody's town.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Both transports are south with the first hundred people out. The battery is off the air and the window held.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|A relief transport is down, and the window with it. The next negotiation starts from a worse place.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|A relief transport is down, and the window with it. The next negotiation starts from a worse place.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Both transports are south with the first hundred people out. The battery is off the air and the window held.
TimeoutMessage=<color=red>Out of time.</color>|The relief window expired. The next negotiation starts from a worse place than this one did.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
