[Language_en]
Name=Southern Watch C1 - After the Wake
Description=GULF OF PAPUA, first light. MV Kerema Trader sailed independent - Santos's people call it going without - and went down at 2140 last night with twenty-six aboard, forty miles off the convoy track. Eleven are accounted for. The rest are somewhere inside a drift box that has been growing all night.\n\nYour detachment is just south of the box. The Type 039C that sank her has not left the area - it is inside torpedo range of the box - and the search you need to run is exactly the pattern it will expect.\n\nTake your lead ship through the box to its northern edge, whatever you find. A Seahawk, if you have one embarked, covers more water than any hull. If the boat presents itself, classify it: that is a bonus and not the reason you are here. Your weapons are tight.
Objective_Survivors=Take your lead ship through the drift box to its northern edge
Objective_Contact=Classify the submarine
Objective_Assist=Do not lose an assisting merchant or harm other traffic
Taskforce1StartMessage=<color=yellow>After the Wake</color>|GULF OF PAPUA, first light. MV Kerema Trader sailed independent - Santos's people call it going without - and went down at 2140 last night with twenty-six aboard, forty miles off the convoy track. Eleven are accounted for. The rest are somewhere inside a drift box that has been growing all night.\n\nYour detachment is just south of the box. The Type 039C that sank her has not left the area - it is inside torpedo range of the box - and the search you need to run is exactly the pattern it will expect.\n\nTake your lead ship through the box to its northern edge, whatever you find. A Seahawk, if you have one embarked, covers more water than any hull. If the boat presents itself, classify it: that is a bonus and not the reason you are here. Your weapons are tight.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Fourteen more out of the water, and the ones who did not make it are named rather than missing. That is the whole of what this operation could achieve, and it achieved it.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The box is open at the northern end and the weather is building. The rest of that crew stays missing.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The box is open at the northern end and the weather is building. The rest of that crew stays missing.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Fourteen more out of the water, and the ones who did not make it are named rather than missing. That is the whole of what this operation could achieve, and it achieved it.
TimeoutMessage=<color=red>Out of time.</color>|The drift box is open at the northern end and the weather is building. The rest of that crew stays missing.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
