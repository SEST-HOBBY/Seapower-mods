[Language_en]
Name=Southern Watch 02 - Steel Highway
Description=GULF OF PAPUA, morning. Port Moresby has asked for engineering plant, medical stores and fuel, and under the Pukpuk Treaty, Australia's defence treaty with Papua New Guinea, we deliver them. Four priority merchant ships are in company with your flagship, the patrol vessel EYRE and the replenishment ship SUPPLY, and a Wedgetail is up with a tanker behind it.\n\nNinety minutes ago a Poseidon laid a sonobuoy field on a diesel-electric contact across the planned track. The masters want to press on at twelve knots. We want time to classify it. You will not get both.\n\nThree of four must reach the Moresby approach box, and two of the three are fixed: Kokoda Star, the medical and engineering ship, and Coral Pioneer. Background traffic in this sea is ordinary commerce - it is not joining your convoy and it is not your enemy.
Objective_Cargo=Get three of four priority ships, Kokoda Star and Coral Pioneer among them, into the Moresby approach box
Objective_Medical=MV Kokoda Star must arrive
Objective_Neutrals=Harm no neutral shipping
Taskforce1StartMessage=<color=yellow>Steel Highway</color>|GULF OF PAPUA, morning. Port Moresby has asked for engineering plant, medical stores and fuel, and under the Pukpuk Treaty, Australia's defence treaty with Papua New Guinea, we deliver them. Four priority merchant ships are in company with your flagship, the patrol vessel EYRE and the replenishment ship SUPPLY, and a Wedgetail is up with a tanker behind it.\n\nNinety minutes ago a Poseidon laid a sonobuoy field on a diesel-electric contact across the planned track. The masters want to press on at twelve knots. We want time to classify it. You will not get both.\n\nThree of four must reach the Moresby approach box, and two of the three are fixed: Kokoda Star, the medical and engineering ship, and Coral Pioneer. Background traffic in this sea is ordinary commerce - it is not joining your convoy and it is not your enemy.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|At least three ships, including Kokoda Star and Coral Pioneer, have reached the Gulf handover. Moresby's pilots can take over the arrival. Report which additional cargoes made it through.
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|The convoy is short and Moresby's hospital is still on generator. The next one will have to be bigger, slower and later.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|The convoy is short and Moresby's hospital is still on generator. The next one will have to be bigger, slower and later.
Taskforce2DefeatMessage=<color=red>Command report.</color>|At least three ships, including Kokoda Star and Coral Pioneer, have reached the Gulf handover. Moresby's pilots can take over the arrival. Report which additional cargoes made it through.
TimeoutMessage=<color=red>Operational window closed.</color>|The window at Moresby closed. The plant and the medical stores are still at sea and the wharf party has gone home.
SupportLoss1Intel=COMMAND | SUPPLY confirmed lost. Her support allocation is no longer available. The next logistics plan must use the surviving ships and any replacement command can release. - Mercer
SupportLoss2Intel=AIR COMPONENT | The tanker is lost. Its support for this operation has ended. Reassess aircraft recovery and report remaining fuel; later allocations will require a new plan. - Ward
O1BeaconFoundIntel=ASW CELL | Torres Light's recovered bridge record has been correlated with the submarine report on this route. The matching contact is classified on the plot. Establish local contact and apply the current engagement orders; a historical datum alone is not permission to fire.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. Command has suspended the operation. Preserve the contact and engagement records.
