[Language_en]
Name=Southern Watch O8 - Bomber Stream
Description=TIMOR SEA, 2130. Wedgetail 02 has a raid out of the north-west: four H-6K and two J-16, three hundred and forty miles from Darwin and closing at four hundred and forty knots. Signals say YJ-12. The target is the anchorage, where the ships for the Common Sea convoy are forming.\n\nTaipan 11 to 14, No. 75 Squadron F-35As with AIM-260, are on CAP a hundred and forty miles out; Raptor 31 and 32, USAF F-22s out of Tindal, are behind them. Dragon 41, a KC-30A, is south of the CAP. The bombers' own radar will not give them a track on the anchorage until they are inside two hundred miles, and that is the line.\n\nShoot down at least three of the four before any of them reaches it. Darwin-Denpasar 112 is on her normal track and has been told nothing; she will cross the raid's path. Identify before you fire.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Raid=Shoot down three of the four bombers before they reach launch range
Objective_Escorts=Shoot down both J-16s
Objective_Fighters=Lose no fighter
Objective_Anchorage=Lose no ship at Darwin
Objective_Airliner=Harm no civil aircraft
Taskforce1StartMessage=<color=yellow>Bomber Stream</color>|TIMOR SEA, 2130. Wedgetail 02 has a raid out of the north-west: four H-6K and two J-16, three hundred and forty miles from Darwin and closing at four hundred and forty knots. Signals say YJ-12. The target is the anchorage, where the ships for the Common Sea convoy are forming.\n\nTaipan 11 to 14, No. 75 Squadron F-35As with AIM-260, are on CAP a hundred and forty miles out; Raptor 31 and 32, USAF F-22s out of Tindal, are behind them. Dragon 41, a KC-30A, is south of the CAP. The bombers' own radar will not give them a track on the anchorage until they are inside two hundred miles, and that is the line.\n\nShoot down at least three of the four before any of them reaches it. Darwin-Denpasar 112 is on her normal track and has been told nothing; she will cross the raid's path. Identify before you fire.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The raid is broken short of the line. What is left of it is turning north, and the anchorage did not see a missile.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The bombers reached launch range, or the fighters paid too much to stop them. The Common Sea convoy is counting what it has left.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The bombers reached launch range, or the fighters paid too much to stop them. The Common Sea convoy is counting what it has left.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The raid is broken short of the line. What is left of it is turning north, and the anchorage did not see a missile.
TimeoutMessage=<color=red>Operational window closed.</color>|2300, and the raid is still in the air between the fighters and Darwin. The anchorage is putting to sea in the dark.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 60-minute window has closed. Command will hold the line for about 30 minutes more. Finish the task now.
SituationReport1Intel=AIR CONTROL: A bomber's turn is not necessarily its launch cue. Keep a fighter pair with the protected anchorage while the other pair works the stream. The airliner is still neutral.
Denied1Message=<color=red>Operation failed.</color>|WEDGETAIL 02: A bomber is inside two hundred miles of the anchorage and her radar has the ships. Missiles away. The raid is through the line.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
