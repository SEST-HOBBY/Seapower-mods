[Language_en]
Name=Southern Watch O10 - Ballistic Shield
Description=KAI ISLANDS, 0350. Last night's imagery shows the enclave's new pads on Biak: two Fattah-1 launchers, a Fattah-2, an Emad and a Shahed 238 battery with eight jet drones. Everything on them reaches Langgur. A Tu-214R has flown the same track south towards the Kai group three nights running; tonight it will be looking for the batteries.\n\nOn Kai Kecil: a THAAD launcher with its AN/TPY-2, a Patriot PAC-3 launcher with its radar, and a US Army Steelfin battery, the first of its kind deployed outside a range. EAGLE II 31 and 32 are up out of Langgur with ARRW and SENTRY 05, an RAAF Triton, is off Biak to find the pads for them.\n\nDestroy three of the five launchers and keep the strip in action. If Second Ring took down the S-350 and S-300 radars on the fourteenth, the pads have no cover; if it did not, the S-350 is still over them. Tual's ferry and its fishing boats are out tonight.\n\nDISPERSED SUPPORT TARGETS: Military missile stores west of the pads, the eastern fuel reserve and a command truck in the northern hide are separate optional aimpoints. Reconnoitre them and allocate remaining weapons before completing the third launcher kill, which ends the operation. The launchers already hold their first rounds; destroying a support site does not magically disarm them. Civilian infrastructure is not a target.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. The field team is on friendly Yapen, south of hostile Biak, with a portable launcher and recovery lane; no friendly airfield has been established inside the enclave. Two reserve UAVs are with the team from the start. They are unarmed and have finite fuel. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Objective_Pads=Destroy three of the five launchers on Biak
Objective_Strip=Keep the Langgur strip in action
Objective_Radar=Lose nothing of the THAAD battery
Objective_Coot=Shoot down the Tu-214R
Objective_Traffic=Harm no ferry or fishing boat
Objective_MissileStores=Destroy the western military ammunition site
Objective_MilitaryFuel=Destroy the eastern military fuel reserve
Objective_LaunchControl=Destroy the enclave command truck
Objective_ForwardRecon=Obtain a current classification of the land target area
Taskforce1StartMessage=<color=yellow>Ballistic Shield</color>|KAI ISLANDS, 0350. Last night's imagery shows the enclave's new pads on Biak: two Fattah-1 launchers, a Fattah-2, an Emad and a Shahed 238 battery with eight jet drones. Everything on them reaches Langgur. A Tu-214R has flown the same track south towards the Kai group three nights running; tonight it will be looking for the batteries.\n\nOn Kai Kecil: a THAAD launcher with its AN/TPY-2, a Patriot PAC-3 launcher with its radar, and a US Army Steelfin battery, the first of its kind deployed outside a range. EAGLE II 31 and 32 are up out of Langgur with ARRW and SENTRY 05, an RAAF Triton, is off Biak to find the pads for them.\n\nDestroy three of the five launchers and keep the strip in action. If Second Ring took down the S-350 and S-300 radars on the fourteenth, the pads have no cover; if it did not, the S-350 is still over them. Tual's ferry and its fishing boats are out tonight.\n\nDISPERSED SUPPORT TARGETS: Military missile stores west of the pads, the eastern fuel reserve and a command truck in the northern hide are separate optional aimpoints. Reconnoitre them and allocate remaining weapons before completing the third launcher kill, which ends the operation. The launchers already hold their first rounds; destroying a support site does not magically disarm them. Civilian infrastructure is not a target.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. The field team is on friendly Yapen, south of hostile Biak, with a portable launcher and recovery lane; no friendly airfield has been established inside the enclave. Two reserve UAVs are with the team from the start. They are unarmed and have finite fuel. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Three of the launchers are burning on Biak and the strip is still turning aircraft round. Whatever is left on the pads has to come out of hiding to fire.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The strip is out of action, or the launchers are still standing. Langgur will not be anybody's alternate this week.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The strip is out of action, or the launchers are still standing. Langgur will not be anybody's alternate this week.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Three of the launchers are burning on Biak and the strip is still turning aircraft round. Whatever is left on the pads has to come out of hiding to fire.
TimeoutMessage=<color=red>Operational window closed.</color>|0535, and the pads on Biak are still standing. Whatever they have left will come south when they choose, not when we do.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 70-minute window has closed. Command will hold the line for about 35 minutes more. Finish the task now.
SituationReport1Intel=LANGGUR / ELLIS: The RQ-7 team is on friendly Yapen, south of the Biak enclave. Work the southern approach, confirm launchers and optional support sites, and recover before fuel runs short. Moth has no protection against a live SAM belt.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
