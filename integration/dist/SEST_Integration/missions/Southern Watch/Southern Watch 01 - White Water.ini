[Language_en]
Name=Southern Watch 01 - White Water
Description=ARAFURA SEA, 0540 local. MV Coral Pioneer missed her rendezvous forty minutes ago. Her last report mentioned an engine casualty and an escort claiming the authority to inspect the convoy. The Indonesian patrol sent to investigate has reported gunfire and nothing since.\n\nYou are the escort, with the Seahawk you brought - if you bought one at requisition and put it on Ship's Flight; the deck is otherwise empty - a Poseidon on task for the first part of the morning and a Triton high to the north. Bring the merchants together and walk them east to the handover box.\n\nThe lane is working traffic: a bulker, a chartered coaster, a relief freighter, trawlers and the 0600 Denpasar service overhead. One contact in that picture is a Meridian escort with weapons and one is a container hull putting out the radars of a warship it is not - do not let your ESM operator pick the wrong one. Identify before you shoot. Your weapons are tight.
Objective_Convoy=Walk the merchant group into the eastern handover box
Objective_Neutrals=Harm no neutral shipping or aircraft
Objective_Warramunga=Bring your flagship out intact
Objective_Identify=Classify the Meridian escort before the handover
Taskforce1StartMessage=<color=yellow>White Water</color>|ARAFURA SEA, 0540 local. MV Coral Pioneer missed her rendezvous forty minutes ago. Her last report mentioned an engine casualty and an escort claiming the authority to inspect the convoy. The Indonesian patrol sent to investigate has reported gunfire and nothing since.\n\nYou are the escort, with the Seahawk you brought - if you bought one at requisition and put it on Ship's Flight; the deck is otherwise empty - a Poseidon on task for the first part of the morning and a Triton high to the north. Bring the merchants together and walk them east to the handover box.\n\nThe lane is working traffic: a bulker, a chartered coaster, a relief freighter, trawlers and the 0600 Denpasar service overhead. One contact in that picture is a Meridian escort with weapons and one is a container hull putting out the radars of a warship it is not - do not let your ESM operator pick the wrong one. Identify before you shoot. Your weapons are tight.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The merchants are in the box and their crews are alive. The escort has been identified, and so has everything you did not shoot. Santos, on Ch16: 'Understood, escort. We were not going to heave to anyway.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The convoy is scattered and Coral Pioneer is not answering. Whatever this was, it worked.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The convoy is scattered and Coral Pioneer is not answering. Whatever this was, it worked.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The merchants are in the box and their crews are alive. The escort has been identified, and so has everything you did not shoot. Santos, on Ch16: 'Understood, escort. We were not going to heave to anyway.'
TimeoutMessage=<color=red>Out of time.</color>|0630, half an hour after sunrise, and the merchants are still short of the Arafura. Whatever this was, it worked.
SupportLoss1Intel=Bluefin 21 is down. The Poseidon was the only thing holding the picture past Warramunga's horizon, and 92 Wing has no spare airframe in the north this week.  - Ward
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
