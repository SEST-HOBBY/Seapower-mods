[Language_en]
Name=Red Line 02 - Routes They Can See
Description=BIAK APPROACHES, 2310. The detachment on the enclave field flies on fuel that comes by sea, and it is down to two days. MT HAI YANG 7, chartered, is in company with a full load of aviation fuel. At dawn the coalition's relief window opens over the enclave and its aircraft will be over the southern approach. A tanker there at first light is a target and an incident, so she goes into the northern roads tonight.\n\nTwo nights ago a submarine put a torpedo into the Russian detachment's auxiliary in the approaches. Nobody has said whose boat it was, or whether she tells a Russian hull from a chartered one. Assume she does not. She is designated GOLF.\n\nA RAAF Poseidon has been over the route since dusk. It is recording, not attacking. Leave it alone.\n\nYour frigate and its flight, a Y-9 out of the enclave field if one is allocated, and HAI YANG 7 at twelve knots. Numfor's fishing boats and a coaster bound east for Jayapura are on the same water.
Objective_Fuel=Bring Hai Yang 7 into Biak's northern roads
Objective_Tanker=Keep Hai Yang 7 afloat
Objective_Restraint=Do not fire on the patrol aircraft
Objective_Boat=Classify the submarine on the route
Objective_Traffic=Harm no fishing boat or coaster
Taskforce1StartMessage=<color=yellow>Routes They Can See</color>|BIAK APPROACHES, 2310. The detachment on the enclave field flies on fuel that comes by sea, and it is down to two days. MT HAI YANG 7, chartered, is in company with a full load of aviation fuel. At dawn the coalition's relief window opens over the enclave and its aircraft will be over the southern approach. A tanker there at first light is a target and an incident, so she goes into the northern roads tonight.\n\nTwo nights ago a submarine put a torpedo into the Russian detachment's auxiliary in the approaches. Nobody has said whose boat it was, or whether she tells a Russian hull from a chartered one. Assume she does not. She is designated GOLF.\n\nA RAAF Poseidon has been over the route since dusk. It is recording, not attacking. Leave it alone.\n\nYour frigate and its flight, a Y-9 out of the enclave field if one is allocated, and HAI YANG 7 at twelve knots. Numfor's fishing boats and a coaster bound east for Jayapura are on the same water.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|HAI YANG 7 is in the northern roads and discharging, and the detachment flies tomorrow. The Poseidon has four hours of a frigate escorting a tanker, which is what it was.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|HAI YANG 7 is lost, or the patrol aircraft is down. Either way the enclave's week has started badly, and the group's name is on it.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|HAI YANG 7 is lost, or the patrol aircraft is down. Either way the enclave's week has started badly, and the group's name is on it.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|HAI YANG 7 is in the northern roads and discharging, and the detachment flies tomorrow. The Poseidon has four hours of a frigate escorting a tanker, which is what it was.
TimeoutMessage=<color=red>Operational window closed.</color>|0045, and HAI YANG 7 is still outside the roads with no time left to discharge before the relief window opens. She turns back; the detachment flies on what it has.
RL02GolfSunkIntel=SONAR REPORT: Contact GOLF destroyed. Log the time, the weapon and what she was doing when it was used; the group will be asked.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
