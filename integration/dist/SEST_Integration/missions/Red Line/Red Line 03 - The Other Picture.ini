[Language_en]
Name=Red Line 03 - The Other Picture
Description=EASTERN BANDA SEA, 1030. The coalition's next convoy is forming west of the Kai Islands with a Japanese escort detachment, and it sails tomorrow. Headquarters wants names: which merchant matters, and which escorts hunt submarines.\n\nDRAGON EYE 05, a KJ-500, has the long look from the north-west, and a J-15 pair keeps it company. Your frigate shadows from outside the escorts' reach and closes only as far as a classification needs. Two Australian F-35s are covering the convoy at weapons Tight. If they fire, you may reply against the aircraft that fired and nothing else. Nothing in that convoy or its escort is a target.\n\nThe picture you build goes to headquarters. What is done with it tomorrow will be done by people this group does not command.\n\nKai fishing boats, a stern trawler and the Tual-Ambon ferry are in the box.
Objective_Picture=Classify MV Coral Pioneer and both Japanese escorts, then take the frigate back north-west
Objective_Restraint=Fire on nothing in the convoy or its escort
Objective_Eye=Bring Dragon Eye 05 home
Objective_Fighters=Classify the covering fighters
Objective_Traffic=Harm no fishing boat or ferry
Taskforce1StartMessage=<color=yellow>The Other Picture</color>|EASTERN BANDA SEA, 1030. The coalition's next convoy is forming west of the Kai Islands with a Japanese escort detachment, and it sails tomorrow. Headquarters wants names: which merchant matters, and which escorts hunt submarines.\n\nDRAGON EYE 05, a KJ-500, has the long look from the north-west, and a J-15 pair keeps it company. Your frigate shadows from outside the escorts' reach and closes only as far as a classification needs. Two Australian F-35s are covering the convoy at weapons Tight. If they fire, you may reply against the aircraft that fired and nothing else. Nothing in that convoy or its escort is a target.\n\nThe picture you build goes to headquarters. What is done with it tomorrow will be done by people this group does not command.\n\nKai fishing boats, a stern trawler and the Tual-Ambon ferry are in the box.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Coral Pioneer, Mogami and Maya are classified and the frigate is back on the group's line. The picture has gone to headquarters. The convoy sails tomorrow, and this group will not be the one that meets it.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The group has fired on the convoy or its escort, the day before a passage the coalition has announced to the world. The picture no longer matters; the incident does.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The group has fired on the convoy or its escort, the day before a passage the coalition has announced to the world. The picture no longer matters; the incident does.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Coral Pioneer, Mogami and Maya are classified and the frigate is back on the group's line. The picture has gone to headquarters. The convoy sails tomorrow, and this group will not be the one that meets it.
TimeoutMessage=<color=red>Operational window closed.</color>|1145. The convoy has the names the coalition gave it and none this group confirmed. Headquarters will send what it has, which is a guess.
StageIntel=PICTURE REPORT: MV Coral Pioneer, JS Mogami and JS Maya classified and passed to headquarters. The frigate may withdraw to the group's line.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
