[Language_en]
Name=Red Line 03 - The Other Picture
Description=EASTERN BANDA SEA, 1030. DRAGON EYE 05 is collecting the convoy picture west of Kai. The coalition has ordered a two-aircraft intercept. Expect the F-35s at about minute eight, closing from the south-east; they are cleared to engage our aircraft. You may defend the KJ-500 and engage those fighters.\n\nTwo J-15s, FLYING SHARK 83 and 84, are allocated to escort DRAGON EYE regardless of your purchases. Your own CAP pair and patrol aircraft can reinforce them if allocated. Use the first minutes to establish the escort and ready the screen's air defence. Stay between the interceptors and the KJ-500; do not send every fighter after a retreating contact and leave the radar aircraft bare.\n\nBreak the intercept by destroying at least one fighter, then bring DRAGON EYE into the return box north-west, with no incoming weapons still threatening the force. Classifying CORAL PIONEER, MOGAMI and MAYA earns a separate intelligence bonus and does not block the exit. The three merchants, both Japanese escorts, the Growler and Rivet Joint use neutral tactical symbols: their protection is real and defensive weapons settings do not authorise an attack on them.\n\nThe Kai fishing boats, ferry and Sydney-Hong Kong service remain protected. Nothing here decides tomorrow's Common Sea engagement.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Picture=Break the fighter intercept and bring Dragon Eye to the return box
Objective_Restraint=Do not attack the convoy or protected surveillance aircraft
Objective_Eye=Keep Dragon Eye 05 alive
Objective_Fighters=Destroy at least one intercepting fighter
Objective_Names=Classify Coral Pioneer and both Japanese escorts if practicable
Objective_Traffic=Harm no protected non-belligerent or civil contact
Taskforce1StartMessage=<color=yellow>The Other Picture</color>|EASTERN BANDA SEA, 1030. DRAGON EYE 05 is collecting the convoy picture west of Kai. The coalition has ordered a two-aircraft intercept. Expect the F-35s at about minute eight, closing from the south-east; they are cleared to engage our aircraft. You may defend the KJ-500 and engage those fighters.\n\nTwo J-15s, FLYING SHARK 83 and 84, are allocated to escort DRAGON EYE regardless of your purchases. Your own CAP pair and patrol aircraft can reinforce them if allocated. Use the first minutes to establish the escort and ready the screen's air defence. Stay between the interceptors and the KJ-500; do not send every fighter after a retreating contact and leave the radar aircraft bare.\n\nBreak the intercept by destroying at least one fighter, then bring DRAGON EYE into the return box north-west, with no incoming weapons still threatening the force. Classifying CORAL PIONEER, MOGAMI and MAYA earns a separate intelligence bonus and does not block the exit. The three merchants, both Japanese escorts, the Growler and Rivet Joint use neutral tactical symbols: their protection is real and defensive weapons settings do not authorise an attack on them.\n\nThe Kai fishing boats, ferry and Sydney-Hong Kong service remain protected. Nothing here decides tomorrow's Common Sea engagement.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Dragon Eye is back in the return box, the intercept is broken and its recordings are going to headquarters. The convoy and its protected escorts remain intact for tomorrow.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|Dragon Eye is lost, or a protected ship or observer has been destroyed. The reconnaissance has failed.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|Dragon Eye is lost, or a protected ship or observer has been destroyed. The reconnaissance has failed.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Dragon Eye is back in the return box, the intercept is broken and its recordings are going to headquarters. The convoy and its protected escorts remain intact for tomorrow.
TimeoutMessage=<color=red>Operational window closed.</color>|1138. Dragon Eye is not safely back with the intercept broken.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 45-minute window has closed. Command will hold the line for about 23 minutes more. Finish the task now.
SituationReport1Intel=AIR OPERATIONS: Keep the allocated J-15s with Dragon Eye. The intercept enters at minute eight; the grey convoy and surveillance aircraft are protected. The north-west return box is the exit, not another ship-classification gate.
SituationReport2Intel=AIR OPERATIONS: The allocated J-15 pair protects Dragon Eye even without a purchased CAP. Break the intercept, keep the radar aircraft covered and recover it to the north-west. Naval classification is a bonus, not an exit gate.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
