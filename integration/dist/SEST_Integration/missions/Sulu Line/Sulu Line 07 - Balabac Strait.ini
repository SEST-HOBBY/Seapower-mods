[Language_en]
Name=Sulu Line 07 - Balabac Strait
Description=BALABAC STRAIT, 0530, 23 NOVEMBER. At 0300 Beijing announced the closure of the southern passages to coalition shipping 'for the period of the negotiations'. The southern surface group - a Type 052D, two Type 054A and two Type 056A - is in the South China Sea seventy miles west of the strait, coming east. A JH-7A strike regiment is airborne from Mischief Reef.\n\nThe convoy for Balabac and the Sulu is at the anchorage east of the strait. If the surface group gets through, it closes the island road from the west, and everything the group has fought for since October goes with it.\n\nHold the strait. Three of the five ships sunk will turn the group back. Your ships are weapons Free. There is no rearm after this: what is in the magazines and the supply ships is the whole war. A submarine was reported in the strait two days ago and has not been seen since.
Objective_Strait=Sink three of the five ships of the surface group
Objective_Convoy=Keep the convoy at the anchorage afloat
Objective_Flagship=Sink the Type 052D
Objective_Traffic=Harm no fishing boat
Taskforce1StartMessage=<color=yellow>Balabac Strait</color>|BALABAC STRAIT, 0530, 23 NOVEMBER. At 0300 Beijing announced the closure of the southern passages to coalition shipping 'for the period of the negotiations'. The southern surface group - a Type 052D, two Type 054A and two Type 056A - is in the South China Sea seventy miles west of the strait, coming east. A JH-7A strike regiment is airborne from Mischief Reef.\n\nThe convoy for Balabac and the Sulu is at the anchorage east of the strait. If the surface group gets through, it closes the island road from the west, and everything the group has fought for since October goes with it.\n\nHold the strait. Three of the five ships sunk will turn the group back. Your ships are weapons Free. There is no rearm after this: what is in the magazines and the supply ships is the whole war. A submarine was reported in the strait two days ago and has not been seen since.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The surface group has turned west with three ships left behind it. The strait is open. The convoy sails for Balabac at noon, and the ceasefire talks have a new map.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The strait is closed. The convoy is lost or turned back, and the island road is shut from the west for the rest of the war.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The strait is closed. The convoy is lost or turned back, and the island road is shut from the west for the rest of the war.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The surface group has turned west with three ships left behind it. The strait is open. The convoy sails for Balabac at noon, and the ceasefire talks have a new map.
TimeoutMessage=<color=red>Operational window closed.</color>|0845, and the surface group is still in the strait. The convoy will not sail.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 130-minute window has closed. Command will hold the line for about 65 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
