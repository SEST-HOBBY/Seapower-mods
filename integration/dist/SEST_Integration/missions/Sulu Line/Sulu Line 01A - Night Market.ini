[Language_en]
Name=Sulu Line 01A - Night Market
Description=SULU SEA, NORTH OF TAWI-TAWI, 0140, flat calm and no moon. The Drug Enforcement Agency has a source in Sandakan who says a semi-submersible left the Sabah coast at dusk with a load for Tawi-Tawi: the kind of cargo that pays for what Meridian is putting ashore on Jolo. She sits a foot out of the water and makes thirteen knots.\n\nThe Navy's Tawi-Tawi patrol group has the night. BRP Emilio Jacinto is north-east of the route, BRP Jose Loor Sr. and BRP Juan Magluyan are working the fishing grounds to the west and north, and the Navy's helicopter is up out of Sanga-Sanga. About six fishing boats are out tonight, and the Bongao ferry is on its usual run.\n\nTwo fast boats are waiting off the north coast of Tawi-Tawi to take the load. A civilian AS350 has been circling the route since midnight; it is chartered, it is unarmed and it is watching for you. Weapons are Free on the semi-submersible and the pickup boats once classified. Nothing else.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Semisub=Stop the semi-submersible before she reaches the Tawi-Tawi coast
Objective_Identify=Classify the semi-submersible
Objective_Pickup=Stop the pickup boats
Objective_Eye=Classify the runners' spotter helicopter
Objective_Traffic=Harm no fishing boat, ferry or civilian aircraft
Taskforce1StartMessage=<color=yellow>Night Market</color>|SULU SEA, NORTH OF TAWI-TAWI, 0140, flat calm and no moon. The Drug Enforcement Agency has a source in Sandakan who says a semi-submersible left the Sabah coast at dusk with a load for Tawi-Tawi: the kind of cargo that pays for what Meridian is putting ashore on Jolo. She sits a foot out of the water and makes thirteen knots.\n\nThe Navy's Tawi-Tawi patrol group has the night. BRP Emilio Jacinto is north-east of the route, BRP Jose Loor Sr. and BRP Juan Magluyan are working the fishing grounds to the west and north, and the Navy's helicopter is up out of Sanga-Sanga. About six fishing boats are out tonight, and the Bongao ferry is on its usual run.\n\nTwo fast boats are waiting off the north coast of Tawi-Tawi to take the load. A civilian AS350 has been circling the route since midnight; it is chartered, it is unarmed and it is watching for you. Weapons are Free on the semi-submersible and the pickup boats once classified. Nothing else.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The semi-submersible is stopped short of the coast. Whatever she carried is not going to buy anything on Jolo this month, and the Agency has her navigation set.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The load is ashore on Tawi-Tawi. Somebody in Bongao is counting money tonight, and some of it is going north to the ridge above Patikul.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The load is ashore on Tawi-Tawi. Somebody in Bongao is counting money tonight, and some of it is going north to the ridge above Patikul.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The semi-submersible is stopped short of the coast. Whatever she carried is not going to buy anything on Jolo this month, and the Agency has her navigation set.
TimeoutMessage=<color=red>Operational window closed.</color>|0425, and the semi-submersible is still somewhere among the fishing boats. She will make the coast before first light.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 110-minute window has closed. Command will hold the line for about 55 minutes more. Finish the task now.
SituationReport1Intel=MARKET WATCH: Follow the semi-submersible while the patrol craft cover its exits. The helicopter over the boats may be the lookout, not the cargo. Classify before crossing fire through local traffic.
Denied1Message=<color=red>Operation failed.</color>|The semi-submersible has reached the boats off Tawi-Tawi. The load is ashore before dawn, and the money with it.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
