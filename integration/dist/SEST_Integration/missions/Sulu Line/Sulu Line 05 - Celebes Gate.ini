[Language_en]
Name=Sulu Line 05 - Celebes Gate
Description=CELEBES SEA, 0550. Naval intelligence has a source in Bitung who says the weapons for Jolo left last night on a coaster under the Panama flag, armed and escorted. Four coasters are running north for the Basilan Strait this morning, with the Bitung-Zamboanga ferry and the Sandakan service in the same water.\n\nThe source does not know which coaster. Classify them. The one with an armed escort and a spotter drone over her is the one, but the escort will try to stay clear of her. Stop her before she reaches the strait.\n\nYour ships are weapons Free. A neutral sunk by mistake ends the mission and gives Meridian the story it wants. The group has had one rearm in a month; spend accordingly.
Objective_Runner=Stop the gun-runner before she reaches the Basilan Strait
Objective_Identify=Classify the gun-runner
Objective_Escort=Sink her escort
Objective_Traffic=Harm no coaster, ferry or airliner that is what it says it is
Taskforce1StartMessage=<color=yellow>Celebes Gate</color>|CELEBES SEA, 0550. Naval intelligence has a source in Bitung who says the weapons for Jolo left last night on a coaster under the Panama flag, armed and escorted. Four coasters are running north for the Basilan Strait this morning, with the Bitung-Zamboanga ferry and the Sandakan service in the same water.\n\nThe source does not know which coaster. Classify them. The one with an armed escort and a spotter drone over her is the one, but the escort will try to stay clear of her. Stop her before she reaches the strait.\n\nYour ships are weapons Free. A neutral sunk by mistake ends the mission and gives Meridian the story it wants. The group has had one rearm in a month; spend accordingly.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The gun-runner is stopped short of the strait. What comes ashore on Jolo this month will be what Meridian already had.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The gun-runner is through. The ridge above Patikul will be armed again by the end of the week, and the Marines know it.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The gun-runner is through. The ridge above Patikul will be armed again by the end of the week, and the Marines know it.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The gun-runner is stopped short of the strait. What comes ashore on Jolo this month will be what Meridian already had.
TimeoutMessage=<color=red>Operational window closed.</color>|0820, and the gun-runner is still a coaster among coasters. She will be in the strait after dark.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 100-minute window has closed. Command will hold the line for about 50 minutes more. Finish the task now.
Denied1Message=<color=red>Operation failed.</color>|The gun-runner has reached the Basilan Strait and the coast. Whatever she carried is ashore on Jolo by tonight.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
