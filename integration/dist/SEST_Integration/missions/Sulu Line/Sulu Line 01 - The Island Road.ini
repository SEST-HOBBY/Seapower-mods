[Language_en]
Name=Sulu Line 01 - The Island Road
Description=SULU SEA, 0640. MV PALAWAN PIONEER and MT PRINCESA STAR sailed from Honda Bay at first light with the Balabac outpost's stores and fuel. They are the season's first convoy down the Sulu side of Palawan, and the only one this month. The outpost has eleven days of diesel left.\n\nTwo Meridian fast attack craft left Cagayancillo before dawn and are running north-west at speed. Meridian calls them escorts. One of them fired on BRP Kagitingan off Tubbataha in September. A trawler with no nets out has been keeping station on the convoy since it cleared the bay.\n\nBring both ships into the head of the Balabac lane, thirty miles south-west. Your ships are weapons Free. Nothing is rearmed after today: what you fire comes back only from a supply ship you own, alongside, at eight knots or less.\n\nFishing bancas and the Puerto Princesa-Cuyo ferry are on the water. Identify before you fire.
Objective_Convoy=Bring the convoy into the head of the Balabac lane
Objective_Ships=Lose neither convoy ship
Objective_Raiders=Sink the Meridian boats if they close
Objective_Traffic=Harm no banca, ferry or airliner
Taskforce1StartMessage=<color=yellow>The Island Road</color>|SULU SEA, 0640. MV PALAWAN PIONEER and MT PRINCESA STAR sailed from Honda Bay at first light with the Balabac outpost's stores and fuel. They are the season's first convoy down the Sulu side of Palawan, and the only one this month. The outpost has eleven days of diesel left.\n\nTwo Meridian fast attack craft left Cagayancillo before dawn and are running north-west at speed. Meridian calls them escorts. One of them fired on BRP Kagitingan off Tubbataha in September. A trawler with no nets out has been keeping station on the convoy since it cleared the bay.\n\nBring both ships into the head of the Balabac lane, thirty miles south-west. Your ships are weapons Free. Nothing is rearmed after today: what you fire comes back only from a supply ship you own, alongside, at eight knots or less.\n\nFishing bancas and the Puerto Princesa-Cuyo ferry are on the water. Identify before you fire.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|PALAWAN PIONEER and PRINCESA STAR are in the head of the lane, and the outpost will have its diesel. Naval Forces West has the convoy's track and the Meridian boats' on one plot.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The convoy is broken. Balabac will be on rationed fuel by the end of the month, and the next ships will not sail without a bigger escort than the Navy has.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The convoy is broken. Balabac will be on rationed fuel by the end of the month, and the next ships will not sail without a bigger escort than the Navy has.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|PALAWAN PIONEER and PRINCESA STAR are in the head of the lane, and the outpost will have its diesel. Naval Forces West has the convoy's track and the Meridian boats' on one plot.
TimeoutMessage=<color=red>Operational window closed.</color>|0925, and the convoy is still short of the lane. The outpost's next delivery is now a week late.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 110-minute window has closed. Command will hold the line for about 55 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
