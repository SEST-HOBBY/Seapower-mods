[Language_en]
Name=SEST Southern Watch D8 - The Long Perimeter
Description=SOUTHERN PAPUA, last light. The relief corridor out of the enclave runs overland now, and the column has stopped twice today because the road is covered from a ridge nobody has cleared.\n\nA US package has been allocated for one evening: Apaches on the road, a Warthog pair on the ridge, a gunship on the loiter and a Strike Eagle section holding the long shots. A Polish F-16 detachment transiting to the theatre has been pulled in for escort.\n\nGet the column to the airhead. The gunship is only usable because nothing in this sector has a working radar - if the J-16D re-establishes the picture, it leaves.
Objective_Column=Get the relief column to the airhead
Objective_Gunship=Do not lose the gunship
Objective_Village=Leave the settlements alone
Taskforce1StartMessage=<color=yellow>The Long Perimeter</color>|SOUTHERN PAPUA, last light. The relief corridor out of the enclave runs overland now, and the column has stopped twice today because the road is covered from a ridge nobody has cleared.\n\nA US package has been allocated for one evening: Apaches on the road, a Warthog pair on the ridge, a gunship on the loiter and a Strike Eagle section holding the long shots. A Polish F-16 detachment transiting to the theatre has been pulled in for escort.\n\nGet the column to the airhead. The gunship is only usable because nothing in this sector has a working radar - if the J-16D re-establishes the picture, it leaves.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The column is at the airhead and the gunship went home with fuel to spare. The corridor stays overland for another week.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The road is closed and the relief corridor with it. Everything now has to fly, and there are not enough aircraft.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The road is closed and the relief corridor with it. Everything now has to fly, and there are not enough aircraft.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The column is at the airhead and the gunship went home with fuel to spare. The corridor stays overland for another week.
TimeoutMessage=<color=red>Out of time.</color>|Dark, and the column is still short of the airhead with the ridge uncleared. The corridor goes back to flying.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
