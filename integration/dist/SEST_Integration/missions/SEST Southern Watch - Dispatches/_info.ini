Name=SEST Southern Watch - Dispatches
Description=Optional episodes outside the twelve-mission Southern Watch spine. Allied Dispatches rotate a European, French/Spanish or US detachment through the same crisis; Red Line plays the opposing side's logistics problem; Range Week fires the missile-defence and ballistic systems where such things are actually fired; Future Front is an openly speculative 2034 branch for the collection's experimental aircraft and weapons; Cold Sea is a 1988 exercise for its retired types. Each one states its own fiction in the briefing.
