[Language_en]
Name=SEST Southern Watch D3 - The Relief Ship
Description=HALMAHERA. The port never changed hands but the roads to it did, and twelve thousand people have been on emergency rations since the second week of the crisis. The coastal authority has asked France and Spain to land relief, and the arrangement is narrow: this beach, this window, these vehicles.\n\nCHARLES DE GAULLE is offshore with a Horizon destroyer and Rafales overhead. The lift is Panthers and Spanish Harriers covering the approach road, with an armoured column going ashore to hold the distribution point rather than to take anything.\n\nNothing here is a target unless it shoots first. The people you are feeding will be living with whoever runs this town next month.
Objective_Relief=Get the relief column to the distribution point
Objective_Town=Leave the port and its people alone
Objective_Group=Bring the amphibious group out
Taskforce1StartMessage=<color=yellow>The Relief Ship</color>|HALMAHERA. The port never changed hands but the roads to it did, and twelve thousand people have been on emergency rations since the second week of the crisis. The coastal authority has asked France and Spain to land relief, and the arrangement is narrow: this beach, this window, these vehicles.\n\nCHARLES DE GAULLE is offshore with a Horizon destroyer and Rafales overhead. The lift is Panthers and Spanish Harriers covering the approach road, with an armoured column going ashore to hold the distribution point rather than to take anything.\n\nNothing here is a target unless it shoots first. The people you are feeding will be living with whoever runs this town next month.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The distribution point is open and the column is ashore without a shot fired in the town. The coastal authority says so publicly, which matters more than the tonnage.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The relief did not land. The next request for help goes to somebody else.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The relief did not land. The next request for help goes to somebody else.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The distribution point is open and the column is ashore without a shot fired in the town. The coastal authority says so publicly, which matters more than the tonnage.
TimeoutMessage=<color=red>Out of time.</color>|The beach window closed. The distribution point never opened and the request for help goes elsewhere.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
