[Language_en]
Name=SEST Southern Watch D2 - Flight Deck Day
Description=CORAL SEA. Two carriers are working the same box: one recovering a long-range package, one running deck drills with a new air department. A Seawolf is riding shotgun below and an E-3G is holding the wider picture while the Wedgetail is off task.\n\nThe tanker is the schedule. Everything airborne today is planned around one KC-10, and the Reaper on the southern track is watching a merchant that has been drifting off its filed route for two days.\n\nThere is a distinguished-visitor lift inbound - a VH-3D bringing the coalition maritime commander across for the afternoon. That airframe gets deck priority over everything else that is not on fire. Keep the cycle running and get the visitor aboard.
Objective_Visit=Get the VH-3D into the carrier box
Objective_Cycle=Keep both carriers operating
Objective_Tanker=Do not lose the tanker
Taskforce1StartMessage=<color=yellow>Flight Deck Day</color>|CORAL SEA. Two carriers are working the same box: one recovering a long-range package, one running deck drills with a new air department. A Seawolf is riding shotgun below and an E-3G is holding the wider picture while the Wedgetail is off task.\n\nThe tanker is the schedule. Everything airborne today is planned around one KC-10, and the Reaper on the southern track is watching a merchant that has been drifting off its filed route for two days.\n\nThere is a distinguished-visitor lift inbound - a VH-3D bringing the coalition maritime commander across for the afternoon. That airframe gets deck priority over everything else that is not on fire. Keep the cycle running and get the visitor aboard.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The visitor is aboard, the package is down and the deck cycle never broke. A quiet day, which is the point of the exercise.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The cycle broke. Somebody will write a report about the afternoon the carriers stopped flying.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The cycle broke. Somebody will write a report about the afternoon the carriers stopped flying.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The visitor is aboard, the package is down and the deck cycle never broke. A quiet day, which is the point of the exercise.
TimeoutMessage=<color=red>Out of time.</color>|The cycle broke and the visit was waved off. Somebody will write a report about the afternoon the carriers stopped flying.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
