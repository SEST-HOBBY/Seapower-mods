[Language_en]
Name=Southern Watch D8 - The Long Perimeter
Description=SOUTHERN PAPUA, last light. With the Biak airlift over, relief moves by road, and the column has stopped twice today because the road is covered from a ridge nobody has cleared.\n\nA US package has been allocated for one evening: Apaches on the road, a Warthog on the ridge, a gunship on the loiter and a Strike Eagle holding the long shots. A Polish F-16 detachment transiting to the theatre has been pulled in for escort.\n\nTwo Marine Ospreys are bringing the airhead's first lift in behind the column, and the ridge covers their approach as surely as it covers the road.\n\nGet the column - the relief truck is the column - to the airstrip. The gunship is usable only while no fighter radar is watching this sector: if the J-16 comes up, pull the gunship the moment its radar does. Losing the gunship ends the operation.
Objective_Column=Get the relief truck to the airstrip
Objective_Gunship=Do not lose the gunship
Objective_Village=Leave the settlements alone
Objective_Lift=Land the Osprey lift at the airstrip
Taskforce1StartMessage=<color=yellow>The Long Perimeter</color>|SOUTHERN PAPUA, last light. With the Biak airlift over, relief moves by road, and the column has stopped twice today because the road is covered from a ridge nobody has cleared.\n\nA US package has been allocated for one evening: Apaches on the road, a Warthog on the ridge, a gunship on the loiter and a Strike Eagle holding the long shots. A Polish F-16 detachment transiting to the theatre has been pulled in for escort.\n\nTwo Marine Ospreys are bringing the airhead's first lift in behind the column, and the ridge covers their approach as surely as it covers the road.\n\nGet the column - the relief truck is the column - to the airstrip. The gunship is usable only while no fighter radar is watching this sector: if the J-16 comes up, pull the gunship the moment its radar does. Losing the gunship ends the operation.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The relief truck has reached the airhead and the gunship remains available. Report the Osprey lift separately and arrange recovery for the supporting aircraft.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The road is closed and the relief corridor with it. Everything now has to fly, and there are not enough aircraft.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The road is closed and the relief corridor with it. Everything now has to fly, and there are not enough aircraft.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The relief truck has reached the airhead and the gunship remains available. Report the Osprey lift separately and arrange recovery for the supporting aircraft.
TimeoutMessage=<color=red>Operational window closed.</color>|Dark, and the column is still short of the airhead with the ridge uncleared. The corridor goes back to flying.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
