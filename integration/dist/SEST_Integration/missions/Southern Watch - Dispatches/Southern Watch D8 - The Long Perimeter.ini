[Language_en]
Name=Southern Watch D8 - The Long Perimeter
Description=SOUTHERN PAPUA, last light. With the Biak airlift over, relief moves by road, and the column has stopped twice today because the road is covered from a ridge nobody has cleared.\n\nA US package has been allocated for one evening: Apaches on the road, a Warthog pair on the ridge, a gunship on the loiter and a Strike Eagle holding the long shots. A Polish F-16 detachment transiting to the theatre has been pulled in for escort.\n\nTwo Marine Ospreys are bringing the airhead's first lift in behind the column, and the ridge covers their approach as surely as it covers the road.\n\nGet the column - the relief truck is the column - to the airstrip. The gunship is usable only while no fighter radar is watching this sector: the enclave can have the J-16 up within about ten minutes, and when it comes up, pull the gunship the moment its radar does. Losing the gunship ends the operation.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. Two reserve UAVs are at the forward recovery section from the start. They are unarmed, have finite fuel and a local recovery field. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Objective_Column=Get the relief truck to the airstrip
Objective_Gunship=Do not lose the gunship
Objective_Village=Leave the settlements alone
Objective_Lift=Land the Osprey lift at the airstrip
Objective_ForwardRecon=Obtain a current classification of the land target area
Taskforce1StartMessage=<color=yellow>The Long Perimeter</color>|SOUTHERN PAPUA, last light. With the Biak airlift over, relief moves by road, and the column has stopped twice today because the road is covered from a ridge nobody has cleared.\n\nA US package has been allocated for one evening: Apaches on the road, a Warthog pair on the ridge, a gunship on the loiter and a Strike Eagle holding the long shots. A Polish F-16 detachment transiting to the theatre has been pulled in for escort.\n\nTwo Marine Ospreys are bringing the airhead's first lift in behind the column, and the ridge covers their approach as surely as it covers the road.\n\nGet the column - the relief truck is the column - to the airstrip. The gunship is usable only while no fighter radar is watching this sector: the enclave can have the J-16 up within about ten minutes, and when it comes up, pull the gunship the moment its radar does. Losing the gunship ends the operation.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. Two reserve UAVs are at the forward recovery section from the start. They are unarmed, have finite fuel and a local recovery field. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The relief truck has reached the airhead and the gunship remains available. Report the Osprey lift separately and arrange recovery for the supporting aircraft.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The road is closed and the relief corridor with it. Everything now has to fly, and there are not enough aircraft.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The road is closed and the relief corridor with it. Everything now has to fly, and there are not enough aircraft.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The relief truck has reached the airhead and the gunship remains available. Report the Osprey lift separately and arrange recovery for the supporting aircraft.
TimeoutMessage=<color=red>Operational window closed.</color>|Dark, and the column is still short of the airhead with the ridge uncleared. The corridor goes back to flying.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 80-minute window has closed. Command will hold the line for about 40 minutes more. Finish the task now.
SituationReport1Intel=BORDER LIAISON: The new UAV section can inspect the ridge and vehicle park. Keep the reconnaissance track clear of your own strike line and remember that a quiet radar can still come back on.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
