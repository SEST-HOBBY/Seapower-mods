[Language_en]
Name=Southern Watch D1 - Western Passage
Description=WESTERN APPROACH. The coalition's escort corridor runs on fuel that arrives from outside it, and the replenishment group coming up from the Indian Ocean is the reason anything in the Banda still has range.\n\nThe escort is a European rotation: a Type 45 with its Merlin, a German F124, a Dutch Karel Doorman, a Danish Iver Huitfeldt, an Italian FREMM and an older Type 23 that was already in the region when the crisis began. Two RAF Typhoons out of Curtin hold the air, with a Swedish AEW aircraft lent for the transit.\n\nThe Russian expeditionary detachment supporting the Biak enclave has put a MiG-35 pair and a Su-24MP up along the northern edge. They are here to find the tankers, and one of the MiGs carries an anti-ship missile. Take them down before they do.\n\nAIR PICTURE / ARGUS 70: The Swedish GlobalEye reports a MiG-35 pair and a Su-24MP along the northern edge of the corridor. The force assesses one MiG as an anti-ship threat. Use the AEW picture to cue the Typhoons and ship sensors; keep both tankers covered while confirming the approaching tracks.
Objective_Oiler=The replenishment group reaches the eastern box
Objective_Escorts=Keep the escort rotation intact
Objective_Shadow=Splash the shadowers before they find the tankers
Taskforce1StartMessage=<color=yellow>Western Passage</color>|WESTERN APPROACH. The coalition's escort corridor runs on fuel that arrives from outside it, and the replenishment group coming up from the Indian Ocean is the reason anything in the Banda still has range.\n\nThe escort is a European rotation: a Type 45 with its Merlin, a German F124, a Dutch Karel Doorman, a Danish Iver Huitfeldt, an Italian FREMM and an older Type 23 that was already in the region when the crisis began. Two RAF Typhoons out of Curtin hold the air, with a Swedish AEW aircraft lent for the transit.\n\nThe Russian expeditionary detachment supporting the Biak enclave has put a MiG-35 pair and a Su-24MP up along the northern edge. They are here to find the tankers, and one of the MiGs carries an anti-ship missile. Take them down before they do.\n\nAIR PICTURE / ARGUS 70: The Swedish GlobalEye reports a MiG-35 pair and a Su-24MP along the northern edge of the corridor. The force assesses one MiG as an anti-ship threat. Use the AEW picture to cue the Typhoons and ship sensors; keep both tankers covered while confirming the approaching tracks.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both tankers are in the eastern box. The corridor has fuel for another fortnight, whatever the rotation paid to bring it.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|A tanker is gone. Everything east of here now plans around a tank that does not refill.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|A tanker is gone. Everything east of here now plans around a tank that does not refill.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Both tankers are in the eastern box. The corridor has fuel for another fortnight, whatever the rotation paid to bring it.
TimeoutMessage=<color=red>Operational window closed.</color>|The group is still west of the line. The corridor plans around a tank that does not refill.
