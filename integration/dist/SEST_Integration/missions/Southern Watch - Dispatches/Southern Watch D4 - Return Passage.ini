[Language_en]
Name=Southern Watch D4 - Return Passage
Description=BANDA SEA, first watch. The auxiliary took a torpedo forward eleven days ago and has been making six knots ever since. She carries the detachment's remaining missile stocks and the only workshop between here and home.\n\nYou have the heavy cruiser, a Project 11356 frigate, a Felon pair off the dispersal field and a Chinese J-16D lent for the passage. Your bombers can reach but they cannot loiter, and every sortie you fly tells the other side where you are going.\n\nGet her south-east past the corridor. This is not a raid. If you start a fleet action to protect a workshop ship you will lose both.
Objective_Auxiliary=Bring the auxiliary through to the south-east
Objective_Cruiser=Do not lose the heavy cruiser
Objective_Restraint=Avoid a fleet action you cannot finish
Taskforce1StartMessage=<color=yellow>Return Passage</color>|BANDA SEA, first watch. The auxiliary took a torpedo forward eleven days ago and has been making six knots ever since. She carries the detachment's remaining missile stocks and the only workshop between here and home.\n\nYou have the heavy cruiser, a Project 11356 frigate, a Felon pair off the dispersal field and a Chinese J-16D lent for the passage. Your bombers can reach but they cannot loiter, and every sortie you fly tells the other side where you are going.\n\nGet her south-east past the corridor. This is not a raid. If you start a fleet action to protect a workshop ship you will lose both.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|She is past the corridor and making for home at six knots with the stocks intact. Nobody on either side had to explain a fleet action to a government this week.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The auxiliary is on the bottom with the detachment's magazines in her. Whatever is left ashore now fights with what it is holding.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The auxiliary is on the bottom with the detachment's magazines in her. Whatever is left ashore now fights with what it is holding.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|She is past the corridor and making for home at six knots with the stocks intact. Nobody on either side had to explain a fleet action to a government this week.
TimeoutMessage=<color=red>Out of time.</color>|Daylight, and the auxiliary is still in the corridor at six knots with every coalition sensor in the Banda looking for her.
