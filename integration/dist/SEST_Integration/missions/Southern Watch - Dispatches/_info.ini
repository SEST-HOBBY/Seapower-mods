Name=Southern Watch - Dispatches
Description=Operations around the northern approaches. Western Passage, Flight Deck Day, The Relief Ship and The Long Perimeter follow European and American detachments through the crisis. Return Passage follows a Russian auxiliary's withdrawal. Range Week records a live counter-launcher and missile-defence trial. Long Reach follows a bomber escort in March 2034, while Before the Lifeline returns to the 1988 PITCH BLACK exercise in the same waters.
