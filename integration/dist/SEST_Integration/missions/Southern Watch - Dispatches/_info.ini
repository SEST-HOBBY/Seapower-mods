Type=Scenario

[Language_en]
Name=Southern Watch - Dispatches
Description=Eight optional episodes outside the twelve-mission Southern Watch spine, each stating its own fiction in the briefing. Allied Dispatch - Western Passage, Flight Deck Day, The Relief Ship and The Long Perimeter - rotates a European, French/Spanish or US detachment through the same crisis. Return Passage plays the opposing side's logistics problem. Range Week fires the missile-defence and ballistic systems where such things are actually fired. Long Reach is an openly speculative 2034 branch for the collection's experimental aircraft and weapons. Before the Lifeline is a 1988 exercise in the same water, for its retired types.
