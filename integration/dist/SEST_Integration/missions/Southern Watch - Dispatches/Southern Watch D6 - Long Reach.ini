[Language_en]
Name=Southern Watch D6 - Long Reach
Description=BANDA SEA, MARCH 2034. A mobile launcher complex threatens the north-eastern passage. An RQ-180 is ahead of the bomber package; the escort includes YF-23s and aircraft carrying long-range missile fits.\n\nOpposing J-36 and J-50 fighters cover the complex, with a Tu-95MA contributing a further missile threat. Earlier imagery narrows the launcher search area, but mobile equipment must be located and identified before attack.\n\nStrike the launcher complex and preserve a recovery route for the package. Darwin is beyond the escorts' reach on this task: they recover to Langgur in the Kai Islands or to USS Enterprise, south-east of the track.
Objective_Stream=Put the stream's release on the launcher complex
Objective_Escort=Keep the escort fighters alive
Objective_Sensor=Keep the RQ-180 alive
Taskforce1StartMessage=<color=yellow>Long Reach</color>|BANDA SEA, MARCH 2034. A mobile launcher complex threatens the north-eastern passage. An RQ-180 is ahead of the bomber package; the escort includes YF-23s and aircraft carrying long-range missile fits.\n\nOpposing J-36 and J-50 fighters cover the complex, with a Tu-95MA contributing a further missile threat. Earlier imagery narrows the launcher search area, but mobile equipment must be located and identified before attack.\n\nStrike the launcher complex and preserve a recovery route for the package. Darwin is beyond the escorts' reach on this task: they recover to Langgur in the Kai Islands or to USS Enterprise, south-east of the track.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|A launcher target in the complex has been destroyed. Account for the bomber package, escorts and reconnaissance aircraft before committing to another attack.
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|The strike has failed. Account for the surviving package and report the launcher threats that remain.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|The strike has failed. Account for the surviving package and report the launcher threats that remain.
Taskforce2DefeatMessage=<color=red>Command report.</color>|A launcher target in the complex has been destroyed. Account for the bomber package, escorts and reconnaissance aircraft before committing to another attack.
TimeoutMessage=<color=red>Operational window closed.</color>|The strike has failed. Account for the surviving package and report the launcher threats that remain.
