[Language_en]
Name=Southern Watch D6 - Long Reach
Description=BANDA SEA, 2034. None of this is real and none of it is a forecast. The YF-23 went into production in this timeline, the AIM-260 and the AIM-424 exist in quantity, the Rafale F5 carries LRASM and the J-36 and J-50 are operational squadrons rather than airframes on a taxiway.\n\nA bomber stream is going north-west against a relocatable launcher complex with the RQ-180 ahead of it, and the opposing force has put up everything it does not officially have.\n\nTreat the weapons performance here as authored fiction. It is the branch where the collection's experimental content gets to be the point instead of an embarrassing exception in a 2028 briefing.
Objective_Stream=Get the bomber stream through to release
Objective_Escort=Keep the escort fighters alive
Objective_Sensor=Keep the RQ-180 on task
Taskforce1StartMessage=<color=yellow>Long Reach</color>|BANDA SEA, 2034. None of this is real and none of it is a forecast. The YF-23 went into production in this timeline, the AIM-260 and the AIM-424 exist in quantity, the Rafale F5 carries LRASM and the J-36 and J-50 are operational squadrons rather than airframes on a taxiway.\n\nA bomber stream is going north-west against a relocatable launcher complex with the RQ-180 ahead of it, and the opposing force has put up everything it does not officially have.\n\nTreat the weapons performance here as authored fiction. It is the branch where the collection's experimental content gets to be the point instead of an embarrassing exception in a 2028 briefing.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The stream released on the complex and the escorts came home. In this timeline the aircraft that were cancelled in ours got to matter.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The stream broke up short of release. Even in fiction, range is range.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The stream broke up short of release. Even in fiction, range is range.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The stream released on the complex and the escorts came home. In this timeline the aircraft that were cancelled in ours got to matter.
TimeoutMessage=<color=red>Out of time.</color>|The stream broke up short of release. Even in fiction, range is range.
