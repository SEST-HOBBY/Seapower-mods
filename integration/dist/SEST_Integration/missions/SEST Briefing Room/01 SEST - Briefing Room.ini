[Language_en]
Name=SEST Briefing Room - the collection on film
Description=Southern Watch, Southern Reach, Red Line and Sulu Line: the collection's forces in real photographs, with the lines the loading screen and the briefings quote. Photo credits in _data/VIDEO_CREDITS.txt beside the film and in the pack's Gallery folder; the quotations and their sources in docs/quotes.md of the SEST repository.<LineBreak/><LineBreak/>FIELD NOTES<LineBreak/>- The Situation button at the bottom right of the campaign screen lists the enemy forces the campaign's missions place, nation by nation.<LineBreak/>- A date-time group on a signal reads day, time Zulu, month, year. 210600Z OCT 28 is 21 October 2028 at 0600 Zulu.<LineBreak/>- A contact handed to you as a datum ages off the plot in minutes unless your own sensors hold it. Classification is yours.<LineBreak/>- Loadouts whose names begin SEST are this collection's own fits - AIM-260 JATM, AIM-424 MALICE and LRASM on allied airframes. Their figures follow public sources and are fiction where the sources stop.<LineBreak/>- In an Open Allocation campaign every buy window sells the whole roster, and a unit of your own nation costs a fifth less.<LineBreak/>- The side operations - the Dispatches, the optional and contingency missions - sail your own ships, and what you lose there stays lost.<LineBreak/>- Survivors your helicopters and ships pick up are paid for at the debrief. A liferaft beacon is worth the detour.<LineBreak/>- REQUIRED-MODS.txt beside each campaign lists every mod its missions reach, and LOAD-ORDER.txt the order they were built against. A unit that spawns with a stock fit is a mod that has moved.<LineBreak/>- To reload missiles and torpedoes at sea, bring a supply ship within about a mile and slow down. Most auxiliaries stop supplying above 13 knots.<LineBreak/>- An oiler such as the Henry J. Kaiser passes guns, ESSM, Harpoon and torpedoes but no strike missiles. Tomahawks need a Supply-class, Sacramento or Lewis and Clark.<LineBreak/>- Surface your submarines before you replenish them. The game will rearm a boat underwater; the SEST campaigns treat that as off limits.<LineBreak/>- Reaching a SEST mission's planned time brings a Behind Schedule signal, not a loss. The operation closes at one and a half times the plan.<LineBreak/>- Identify before you shoot. In the SEST campaigns, losing a protected neutral cancels the operation.<LineBreak/>- Every SEST briefing ends with a Recognition section: real photographs of your own forces and the expected opposition.<LineBreak/>- After Steam updates the SEST pack or a collection mod, close the game and run SETUP again from the pack's folder.<LineBreak/>- The SEST pack's Gallery folder holds real photographs of the collection's units. Open gallery.html in your web browser.<LineBreak/><LineBreak/>THE QUOTATIONS<LineBreak/>"Air superiority is not guaranteed. It must be earned every day." - Gen. Kenneth S. Wilsbach, Chief of Staff, US Air Force, 2025<LineBreak/>"Neither air superiority nor victory are American birthrights. Both are at significant risk." - Gen. Mark Kelly, Commander, Air Combat Command, 2021<LineBreak/>"Victory smiles upon those who anticipate the changes in the character of war, not upon those who wait to adapt themselves after the changes occur." - Giulio Douhet, 1921<LineBreak/>"We must think in terms of tomorrow." - Gen. Henry H. 'Hap' Arnold, US Army Air Forces<LineBreak/>"It's not enough to talk about deterrence: I believe we must demonstrate that we can deliver air power to degrade, disrupt, destroy, and defeat." - Air Marshal Stephen Chappell, Chief of Air Force, RAAF, 2026<LineBreak/>"Simply stated, strategic deterrence is about communicating capability and intent." - Adm. Cecil D. Haney, Commander, US Strategic Command<LineBreak/>"Saying so, unfortunately, does not make it true; and if true, saying so does not always make it believed." - Thomas C. Schelling<LineBreak/>"Stability is not a passive state of affairs - it's achieved through strength and active diplomacy." - Air Marshal Robert Chipman, Chief of Air Force, RAAF, 2023<LineBreak/>"Readiness is critical to an effective deterrence, not only in Air Force, but across all domains." - Air Vice-Marshal Harvey Reynolds, Deputy Chief of Air Force, RAAF<LineBreak/>"If deterrence fails, we'll provide a decisive response. Decisive in every way that word means." - Gen. John E. Hyten, Commander, US Strategic Command, 2018<LineBreak/>"An attack on one is an attack on all." - NATO Ankara Summit Declaration, 2026<LineBreak/>"Readiness is our first responsibility." - Gen. Kenneth S. Wilsbach, Chief of Staff, US Air Force, 2025<LineBreak/>"We are not training for our best day out. We are training for our worst day and then the next day and the day after." - Wing Commander Tim Hurford, RAAF, 2026<LineBreak/>"This is so we can fight not just the way we want to, but the way we have to." - Air Vice-Marshal Glen Braz, Air Commander Australia, 2026<LineBreak/>"Combat is unforgiving, and victory belongs to the side that adapts faster, fights harder, and endures longer." - Gen. Eric M. Smith, Commandant of the Marine Corps, 2025<LineBreak/>"If we fail to adapt, fail to innovate, fail to develop and grow, we will find ourselves forever reacting and struggling." - Gen. Anthony Zinni, US Marine Corps<LineBreak/>"Train, train, train, and train some more." - Gen. Leon E. Salomon, US Army<LineBreak/>"Plans are worthless, but planning is everything." - Dwight D. Eisenhower, 1957<LineBreak/>"Under pressure, you don't rise to the occasion - you sink to the level of your training." - military training maxim, speaker unknown; often called a SEAL saying<LineBreak/>"The more you sweat in training, the less you bleed in battle." - traditional training maxim<LineBreak/>"An understanding of both pure logistics and the broad aspects of applied logistics is essential to the exercise of high command." - Rear Adm. Henry E. Eccles, US Navy, 1959<LineBreak/>"During deployment, it is too late to practice battlefield sustainment skills." - Gen. Gustave F. Perna, US Army Materiel Command, 2019<LineBreak/>"Our stockpiles need to be replenished. And we need this to happen fast." - Radmila Shekerinska, NATO Deputy Secretary General, 2026<LineBreak/>"There is no strong defence without a strong defence industry." - Mark Rutte, NATO Secretary General, 2026<LineBreak/>"'Better' is the enemy of 'good enough'." - Soviet naval maxim, reportedly displayed in Adm. Sergey Gorshkov's office<LineBreak/>"United we fought and united we prevail." - Fleet Adm. Chester W. Nimitz, 1945
