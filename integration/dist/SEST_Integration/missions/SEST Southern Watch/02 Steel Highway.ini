[Language_en]
Name=02 Steel Highway
Description=CORAL SEA. Port Moresby has asked for engineering plant, medical stores and fuel, and the Pukpuk arrangements mean we deliver them. Four priority hulls are in company with HOBART, ARAFURA and SUPPLY, and a Wedgetail is up with a tanker behind it.\n\nNinety minutes ago a Poseidon dropped a field on a diesel-electric contact across the planned track. The masters want to press on at twelve knots. We want time to classify it. You will not get both.\n\nThree of four must reach the Moresby approach box, and the medical and engineering ship is not one of the three you can trade away. Background traffic in this sea is ordinary commerce - it is not joining your convoy and it is not your enemy.
Objective_Cargo=Get three of four priority ships into the Moresby box
Objective_Medical=MV Kokoda Star must arrive
Objective_Neutrals=Harm no neutral shipping
Taskforce1StartMessage=<color=yellow>Steel Highway</color>|CORAL SEA. Port Moresby has asked for engineering plant, medical stores and fuel, and the Pukpuk arrangements mean we deliver them. Four priority hulls are in company with HOBART, ARAFURA and SUPPLY, and a Wedgetail is up with a tanker behind it.\n\nNinety minutes ago a Poseidon dropped a field on a diesel-electric contact across the planned track. The masters want to press on at twelve knots. We want time to classify it. You will not get both.\n\nThree of four must reach the Moresby approach box, and the medical and engineering ship is not one of the three you can trade away. Background traffic in this sea is ordinary commerce - it is not joining your convoy and it is not your enemy.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Three hulls alongside at Moresby, Kokoda Star among them. The engineering plant is ashore and the route is a route again.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The convoy is short and Moresby is still waiting. The next one will have to be bigger, slower and later.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The convoy is short and Moresby is still waiting. The next one will have to be bigger, slower and later.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Three hulls alongside at Moresby, Kokoda Star among them. The engineering plant is ashore and the route is a route again.
NeutralLossMessage=<color=orange>Neutral contact hit.</color>|That one was not ours to shoot. It goes in the record.
