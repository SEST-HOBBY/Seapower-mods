[Language_en]
Name=SEST Southern Watch 05 - Warramunga's Shot
Description=TIMOR CORRIDOR. A surface action group is working south-west across the corridor screening an amphibious transport, and it has begun turning merchant traffic back by radio and then by gun.\n\nYou are WARRAMUNGA again, alone, sixty miles on their disengaged bow with the weather in your favour and a full deck-launcher load. The convoy you are covering is four hulls and a tug's worth of speed behind you.\n\nEstablish the military threat, engage it, and be somewhere else when the counter-strike arrives - their maritime strike regiment is within range of this box and their helicopter is already up. The merchants in the lane are not targets because somebody wrote SANCTIONED on a manifest.
Objective_Escort=Neutralise the armed escort group
Objective_Convoy=The protected merchants must pass
Objective_Magazine=Bring Warramunga out with rounds left
Taskforce1StartMessage=<color=yellow>Warramunga's Shot</color>|TIMOR CORRIDOR. A surface action group is working south-west across the corridor screening an amphibious transport, and it has begun turning merchant traffic back by radio and then by gun.\n\nYou are WARRAMUNGA again, alone, sixty miles on their disengaged bow with the weather in your favour and a full deck-launcher load. The convoy you are covering is four hulls and a tug's worth of speed behind you.\n\nEstablish the military threat, engage it, and be somewhere else when the counter-strike arrives - their maritime strike regiment is within range of this box and their helicopter is already up. The merchants in the lane are not targets because somebody wrote SANCTIONED on a manifest.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The escort is burning and the transport has turned north. The convoy passed behind you while it happened, which was the entire point.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Warramunga is gone or the lane is closed. Either way nothing moves through this corridor tomorrow.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|Warramunga is gone or the lane is closed. Either way nothing moves through this corridor tomorrow.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The escort is burning and the transport has turned north. The convoy passed behind you while it happened, which was the entire point.
