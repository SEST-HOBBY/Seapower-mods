[Language_en]
Name=12 The First Ship Through
Description=ARAFURA SEA. The ceasefire came into effect at midnight and traffic started moving at first light because insurers move faster than diplomats. CORAL PIONEER is at the head of the first convoy through, with a bearing running hot and eleven knots on a good hour.\n\nThere are two groups in the box. One has acknowledged its withdrawal order and is heading north at steady speed. The other has not acknowledged anything since 0400 and has a maritime strike flight within range.\n\nTell them apart. Get the convoy home. Do not be the incident that restarts this - a withdrawing ship you sink today is the reason there is no ceasefire on Monday.
Objective_Convoy=Bring the convoy into Darwin's approaches
Objective_Ceasefire=Do not fire on the withdrawing group
Objective_Escorts=Bring the escorts home
Taskforce1StartMessage=<color=yellow>The First Ship Through</color>|ARAFURA SEA. The ceasefire came into effect at midnight and traffic started moving at first light because insurers move faster than diplomats. CORAL PIONEER is at the head of the first convoy through, with a bearing running hot and eleven knots on a good hour.\n\nThere are two groups in the box. One has acknowledged its withdrawal order and is heading north at steady speed. The other has not acknowledged anything since 0400 and has a maritime strike flight within range.\n\nTell them apart. Get the convoy home. Do not be the incident that restarts this - a withdrawing ship you sink today is the reason there is no ceasefire on Monday.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Coral Pioneer is alongside at Darwin on one shaft and the rest of the convoy is behind her. The withdrawing group went north and nobody shot at it. The route is a route again.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The first ship through did not get through, and the ceasefire is now a thing that was tried once.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The first ship through did not get through, and the ceasefire is now a thing that was tried once.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Coral Pioneer is alongside at Darwin on one shaft and the rest of the convoy is behind her. The withdrawing group went north and nobody shot at it. The route is a route again.
NeutralLossMessage=<color=orange>Neutral contact hit.</color>|That one was not ours to shoot. It goes in the record.
