[Language_en]
Name=Tasman Shield 10B - Southern Priority
Description=THE GULF ST VINCENT APPROACHES, afternoon, a light southerly. MT OSBORNE SPIRIT is fourteen miles short of the Outer Harbor approach with your detachment and a fortnight's crude for the refinery. The Kangaroo Island ferry is on the Cape Jervis-Penneshaw crossing, two tuna boats are bound out for Port Lincoln, a grain bulker is coming down from Port Giles for Backstairs Passage, and the Adelaide-Melbourne service is overhead.\n\nA Type 054A came through Backstairs Passage at 0300 and is forty miles south-west of the tanker, weapons tight, closing at twelve knots to 'escort' her. A Kilo came through with her and is somewhere between the frigate and the tanker's track with a Z-9 dipping between her and the frigate.\n\nEdinburgh's Poseidon flies your maritime patrol from thirty miles away. Get the tanker to the Outer Harbor approach. Classify the Kilo. Harm nothing that is South Australia's. Hold this and the southern element stays in the Gulf instead of going east.
Objective_Approaches=MT Osborne Spirit reaches the Outer Harbor approach
Objective_Boat=Classify the Kilo
Objective_Traffic=Harm no ferry, fishing boat, merchant or aircraft
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>Southern Priority</color>|THE GULF ST VINCENT APPROACHES, afternoon, a light southerly. MT OSBORNE SPIRIT is fourteen miles short of the Outer Harbor approach with your detachment and a fortnight's crude for the refinery. The Kangaroo Island ferry is on the Cape Jervis-Penneshaw crossing, two tuna boats are bound out for Port Lincoln, a grain bulker is coming down from Port Giles for Backstairs Passage, and the Adelaide-Melbourne service is overhead.\n\nA Type 054A came through Backstairs Passage at 0300 and is forty miles south-west of the tanker, weapons tight, closing at twelve knots to 'escort' her. A Kilo came through with her and is somewhere between the frigate and the tanker's track with a Z-9 dipping between her and the frigate.\n\nEdinburgh's Poseidon flies your maritime patrol from thirty miles away. Get the tanker to the Outer Harbor approach. Classify the Kilo. Harm nothing that is South Australia's. Hold this and the southern element stays in the Gulf instead of going east.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Osborne Spirit is at the Outer Harbor approach with the pilot aboard and the frigate twenty miles astern of her with nothing to escort. The southern element stays in the Gulf.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The tanker is lost in Adelaide's front door, or the flagship is, and the southern element goes east to join the group.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The tanker is lost in Adelaide's front door, or the flagship is, and the southern element goes east to join the group.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Osborne Spirit is at the Outer Harbor approach with the pilot aboard and the frigate twenty miles astern of her with nothing to escort. The southern element stays in the Gulf.
TimeoutMessage=<color=red>Out of time.</color>|Sixty minutes and Osborne Spirit is still short of Outer Harbor with the frigate alongside her offering an escort. The southern element leaves for the Tasman tonight.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
