[Language_en]
Name=Tasman Shield 08A - The Defector
Description=EASTERN GREAT AUSTRALIAN BIGHT, first light. RV SEVERNY VETER, a support vessel attached to the Russian research detachment, has stopped southwest of your force. Her chief mate reports that a bridge party has refused orders to return to the detachment and requests Australian protection. Some of the crew opposed the move. The account has not been independently verified.\n\nSEVERNY VETER remains plotted on the opposing side. Hold fire on her. Take YOUR FLAGSHIP into the two-mile rendezvous around her reported position. On contact she will accept your navigational control. Then give her a course and speed: she is stopped and will not sail herself to safety. Bring both her and your flagship into the marked handover area to the northeast within 95 minutes. A helicopter overflight does not complete the rendezvous.\n\nA separate Udaloy-class recovery escort is closing from the southwest with a Ka-27 searching ahead. Its intercepted orders authorise force against a foreign escort intervening. Defend your ships and the people asking for protection. Sinking the pursuer does not complete the escort task. Two Port Lincoln fishing boats and a westbound merchant are crossing the sector; harm none of them. The Seahawk and Edinburgh's patrol aircraft are available if assigned.\n\nThis diversion offers no stores or repairs. The convoy still sails on the nineteenth. Your task is safe passage; the decision on the crew's request belongs ashore.
Objective_Passage=Accept Severny Veter's handover, then bring her and your flagship into the handover area
Objective_Traffic=Harm no fishing boat or merchant
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>The Defector</color>|EASTERN GREAT AUSTRALIAN BIGHT, first light. RV SEVERNY VETER, a support vessel attached to the Russian research detachment, has stopped southwest of your force. Her chief mate reports that a bridge party has refused orders to return to the detachment and requests Australian protection. Some of the crew opposed the move. The account has not been independently verified.\n\nSEVERNY VETER remains plotted on the opposing side. Hold fire on her. Take YOUR FLAGSHIP into the two-mile rendezvous around her reported position. On contact she will accept your navigational control. Then give her a course and speed: she is stopped and will not sail herself to safety. Bring both her and your flagship into the marked handover area to the northeast within 95 minutes. A helicopter overflight does not complete the rendezvous.\n\nA separate Udaloy-class recovery escort is closing from the southwest with a Ka-27 searching ahead. Its intercepted orders authorise force against a foreign escort intervening. Defend your ships and the people asking for protection. Sinking the pursuer does not complete the escort task. Two Port Lincoln fishing boats and a westbound merchant are crossing the sector; harm none of them. The Seahawk and Edinburgh's patrol aircraft are available if assigned.\n\nThis diversion offers no stores or repairs. The convoy still sails on the nineteenth. Your task is safe passage; the decision on the crew's request belongs ashore.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Severny Veter and your flagship have reached the handover area. The ship's people and records can now be received by the relief organisation. Their account remains to be examined. Mercer: 'You brought them out. We will deal with the questions ashore.'
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The protection operation has failed. Preserve the engagement record and report the loss; the convoy task remains ahead.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The protection operation has failed. Preserve the engagement record and report the loss; the convoy task remains ahead.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Severny Veter and your flagship have reached the handover area. The ship's people and records can now be received by the relief organisation. Their account remains to be examined. Mercer: 'You brought them out. We will deal with the questions ashore.'
TimeoutMessage=<color=red>Operational window closed.</color>|The handover window has closed without both Severny Veter and your flagship in the marked area after the rendezvous. Safe passage has not been established.
StageIntel=Severny Veter has accepted your navigational control. She is stopped. Set her course and speed and escort her northeast. Both she and your flagship must reach the marked handover area before the window closes.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
