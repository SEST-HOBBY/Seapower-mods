[Language_en]
Name=Tasman Shield 03 - Chatham Watch
Description=EAST OF NEW ZEALAND, 44 South, first light. KIWI 05 found them at 0400: TANGO surfaced near MV AUSTRAL COMPLIANCE in an apparent support rendezvous, two hundred miles west of the Chatham Islands and sixty miles east of you. The tender has been steaming in circles out here for two days waiting for her.\n\nWellington has authorised the engagement under the New Zealand zone's rules and Canberra has concurred. TANGO is the boat that lay on the Tasman cable at periscope depth; she is a target. The tender is not: the engagement authority specifically excludes AUSTRAL COMPLIANCE. Document her activity without attacking her. Classify her and leave her.\n\nKIWI 05 is back on station out of Ohakea with your own Poseidon if assigned. The Chatham Islands freighter and two longliners are in the box, and a whale that sounds like a boat on a bad day. Seventy minutes. Treat the surfaced report as perishable and be prepared for the boat to submerge.
Objective_Boat=Destroy TANGO
Objective_Tender=Classify MV Austral Compliance
Objective_Restraint=The tender is not a target
Objective_Neutrals=Harm no freighter, longliner or whale
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>Chatham Watch</color>|EAST OF NEW ZEALAND, 44 South, first light. KIWI 05 found them at 0400: TANGO surfaced near MV AUSTRAL COMPLIANCE in an apparent support rendezvous, two hundred miles west of the Chatham Islands and sixty miles east of you. The tender has been steaming in circles out here for two days waiting for her.\n\nWellington has authorised the engagement under the New Zealand zone's rules and Canberra has concurred. TANGO is the boat that lay on the Tasman cable at periscope depth; she is a target. The tender is not: the engagement authority specifically excludes AUSTRAL COMPLIANCE. Document her activity without attacking her. Classify her and leave her.\n\nKIWI 05 is back on station out of Ohakea with your own Poseidon if assigned. The Chatham Islands freighter and two longliners are in the box, and a whale that sounds like a boat on a bad day. Seventy minutes. Treat the surfaced report as perishable and be prepared for the boat to submerge.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|TANGO is confirmed lost west of the Chathams. Report the tender's condition and any identification obtained; the submarine's destruction does not settle those separate questions.
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|The flagship is gone east of New Zealand, or the tender is, and the boat that lay on the cable is still at sea.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|The flagship is gone east of New Zealand, or the tender is, and the boat that lay on the cable is still at sea.
Taskforce2DefeatMessage=<color=red>Command report.</color>|TANGO is confirmed lost west of the Chathams. Report the tender's condition and any identification obtained; the submarine's destruction does not settle those separate questions.
TimeoutMessage=<color=red>Operational window closed.</color>|The engagement window has closed without confirmation of TANGO's loss. Reassess the submarine's position and the tender's movements before committing another search.
TS01TenderNamedIntel=FUSION CELL | The tender at the reported rendezvous matches AUSTRAL COMPLIANCE, classified off Puysegur. Its identity is entered on the plot. It remains excluded from the engagement authority.
TS02SubNamedIntel=ASW CELL | The submarine report has been correlated with TANGO's Cook Strait record. TANGO is classified on the plot. Wellington has authorised engagement of this contact; confirm the current position before firing.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. Command has suspended the operation. Preserve the contact and engagement records.
