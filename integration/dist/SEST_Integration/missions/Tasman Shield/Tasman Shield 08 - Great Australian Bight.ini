[Language_en]
Name=Tasman Shield 08 - Great Australian Bight
Description=THE GREAT AUSTRALIAN BIGHT, a hundred and forty miles offshore, before dawn. Two sectors: HMAS COLLINS in the western at periscope depth, your escorts in the eastern with the Seahawk and a Poseidon out of Edinburgh, three hundred miles behind you. The Virginia on the Western Australia rotation is somewhere west of Collins and is not on your plot.\n\nSIERRA-TWO, the Yasen, is the Russian detachment's second boat; the January summary credited her and nobody has held her. She is in the Bight because MARSHAL SHAPOSHNIKOV and the oiler BORIS CHILIKIN are seventy miles south-west of you, stopped, with a Ka-27 up - a rendezvous, and the one place she will come shallow.\n\nFind the boat and sink her before she reaches them. Two Port Lincoln tuna boats, a Bight bulker and a whale are in the sectors. The Udaloy has not fired; classify the oiler and leave the Udaloy unless she gives you no choice. Eighty minutes is the point.
Objective_Boat=Destroy SIERRA-TWO
Objective_Oiler=Classify the oiler at the rendezvous
Objective_Collins=HMAS Collins must survive
Objective_Neutrals=Harm no tuna boat, merchant or whale
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>Great Australian Bight</color>|THE GREAT AUSTRALIAN BIGHT, a hundred and forty miles offshore, before dawn. Two sectors: HMAS COLLINS in the western at periscope depth, your escorts in the eastern with the Seahawk and a Poseidon out of Edinburgh, three hundred miles behind you. The Virginia on the Western Australia rotation is somewhere west of Collins and is not on your plot.\n\nSIERRA-TWO, the Yasen, is the Russian detachment's second boat; the January summary credited her and nobody has held her. She is in the Bight because MARSHAL SHAPOSHNIKOV and the oiler BORIS CHILIKIN are seventy miles south-west of you, stopped, with a Ka-27 up - a rendezvous, and the one place she will come shallow.\n\nFind the boat and sink her before she reaches them. Two Port Lincoln tuna boats, a Bight bulker and a whale are in the sectors. The Udaloy has not fired; classify the oiler and leave the Udaloy unless she gives you no choice. Eighty minutes is the point.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|SIERRA-TWO is on the bottom of the Bight short of her rendezvous, and the Udaloy has turned for the west with her oiler. The Southern Convoy sails with nothing Russian under it.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Collins is lost in the Bight, or the flagship is, and the Yasen reaches her rendezvous with full stores.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|Collins is lost in the Bight, or the flagship is, and the Yasen reaches her rendezvous with full stores.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|SIERRA-TWO is on the bottom of the Bight short of her rendezvous, and the Udaloy has turned for the west with her oiler. The Southern Convoy sails with nothing Russian under it.
TimeoutMessage=<color=red>Out of time.</color>|Eighty minutes and SIERRA-TWO is alongside the oiler with the Udaloy over her. She is under the Southern Convoy's track by the nineteenth.
TS08YasenSunkIntel=SIERRA-TWO is gone, short of her rendezvous. The Russian detachment's second boat is on the bottom of the Bight, and the Southern Convoy sails without her.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
