# SEST Raptor Squadrons - squadron definitions for usaf_f-22.
# Upstream declares NumberOfSquadrons=7 but defines [Squadron1] only, so
# SquadronReference=Squadron2..7 does not resolve. These are the F-22's real
# operating squadrons. The mod has no per-squadron livery textures and its
# model carries no serial/emblem decal submodels, so they differ by identity
# and callsign rather than by paint.
[General]
SerialnumberReferences=AF_Serial
EmblemReference=Emblem
NationFlagReference=Flag1
NumberOfSquadrons=7

[Default]
Nation=US

[Squadron1]  #27th FS 'Fighting Eagles' - 1st Fighter Wing, JB Langley-Eustis, Virginia
Nation=US

[Squadron2]  #94th FS 'Hat in the Ring' - 1st Fighter Wing, JB Langley-Eustis, Virginia
Nation=US

[Squadron3]  #90th FS 'Pair O Dice' - 3rd Wing, JB Elmendorf-Richardson, Alaska
Nation=US

[Squadron4]  #525th FS 'Bulldogs' - 3rd Wing, JB Elmendorf-Richardson, Alaska
Nation=US

[Squadron5]  #199th FS 'Mytai Fighters' - 154th Wing HI ANG, JB Pearl Harbor-Hickam
Nation=US

[Squadron6]  #19th FS 'Gamecocks' - 15th Wing, JB Pearl Harbor-Hickam, Hawaii
Nation=US

[Squadron7]  #43rd FS 'Hornets' - 325th Fighter Wing (training unit), Eglin AFB
Nation=US
