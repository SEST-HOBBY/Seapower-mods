Name=SEST Integration Pack
Description=One mod folder carrying every SEST fix and the Southern Watch campaign, so a single Mod Manager entry at the top of the list covers all of it. Put it ABOVE your Workshop mods: these are whole-file replacements, and anything that outranks them wins instead. REQUIRED-MODS.txt and LOAD-ORDER.txt inside this folder list the Workshop mods the campaign needs and the order it was tested in. Includes: SEST ADF Persistent ISR, SEST Allied Fixes, SEST B-52 ARRW, SEST Collection Fixes, SEST F-15EX Revamp, SEST F-16CM JATM, SEST F-35C JATM, SEST Growler NGJ + MALICE, SEST JMSDF Mogami, SEST RAAF Bases, SEST RAAF F-35A JATM, SEST RAAF Wedgetail, SEST RAN Fleet, SEST Rafale F5, SEST Raptor Squadrons, SEST TacMap Colors, Southern Watch.

