Name=SEST Integration Pack
Description=One mod folder carrying every SEST fix and the campaigns, so a single Mod Manager entry at the top of the list covers all of it. Put it ABOVE your Workshop mods: these are whole-file replacements, and anything that outranks them wins instead. REQUIRED-MODS.txt and LOAD-ORDER.txt inside this folder list the Workshop mods the campaigns need and the order they were tested in. Includes: SEST A-10C+, SEST ADF Persistent ISR, SEST Allied Fixes, SEST B-52 ARRW, SEST Collection Fixes, SEST F-15EX Revamp, SEST F-16CM JATM, SEST F-35C JATM, SEST Growler NGJ + MALICE, SEST Intercept Model, SEST JMSDF Mogami, SEST RAAF Bases, SEST RAAF F-35A JATM, SEST RAAF Wedgetail, SEST RAN Fleet, SEST Rafale F5, SEST Raptor Squadrons, SEST Replenishment At Sea, SEST TacMap Colors, Southern Watch - Southern Reach - Red Line.

