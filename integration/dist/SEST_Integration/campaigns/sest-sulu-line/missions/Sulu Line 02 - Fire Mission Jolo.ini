[Language_en]
Name=Sulu Line 02 - Fire Mission Jolo
Description=OFF JOLO, 0930. Marine Battalion Landing Team 7 went ashore east of Jolo town two days ago to clear the coast road. It is pinned below the ridge above Patikul. The Meridian network has armed the ridge: two drone launch rails, two gun trucks and an air-defence vehicle that drove the Air Force's helicopters off yesterday afternoon.\n\nThe battalion has asked for naval gunfire. Your ships are twenty-five miles north of the coast. Close to gun range and destroy at least three of the five positions. The Marines' fire control party has them plotted and they are on your map.\n\nThe launch rails can put a drone on a ship as easily as on the Marines, and Meridian keeps a fast attack craft at Basilan. Nothing you fire today comes back except from your own supply ship. Bancas are working the coast.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. Two reserve UAVs are at the forward recovery section from the start. They are unarmed, have finite fuel and a local recovery field. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Objective_Fire=Destroy three of the five positions on the ridge
Objective_Gunline=Keep the lead ship afloat
Objective_Raider=Sink the Meridian boat if it comes out
Objective_Traffic=Harm no banca
Objective_ForwardRecon=Obtain a current classification of the land target area
Taskforce1StartMessage=<color=yellow>Fire Mission Jolo</color>|OFF JOLO, 0930. Marine Battalion Landing Team 7 went ashore east of Jolo town two days ago to clear the coast road. It is pinned below the ridge above Patikul. The Meridian network has armed the ridge: two drone launch rails, two gun trucks and an air-defence vehicle that drove the Air Force's helicopters off yesterday afternoon.\n\nThe battalion has asked for naval gunfire. Your ships are twenty-five miles north of the coast. Close to gun range and destroy at least three of the five positions. The Marines' fire control party has them plotted and they are on your map.\n\nThe launch rails can put a drone on a ship as easily as on the Marines, and Meridian keeps a fast attack craft at Basilan. Nothing you fire today comes back except from your own supply ship. Bancas are working the coast.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. Two reserve UAVs are at the forward recovery section from the start. They are unarmed, have finite fuel and a local recovery field. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The ridge is quiet. BLT 7 is moving on the coast road, and its fire control party has sent the ships its thanks and its new grid.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The gun line is broken and the ridge still holds. The battalion is back inside its perimeter, waiting for a gun that is not coming.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The gun line is broken and the ridge still holds. The battalion is back inside its perimeter, waiting for a gun that is not coming.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The ridge is quiet. BLT 7 is moving on the coast road, and its fire control party has sent the ships its thanks and its new grid.
TimeoutMessage=<color=red>Operational window closed.</color>|1215, and the ridge is still firing. The Marines have pulled back to the beach for the night.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 110-minute window has closed. Command will hold the line for about 55 minutes more. Finish the task now.
SituationReport1Intel=MARINE LIAISON / VEGA: The forward UAV can distinguish the launchers from vehicles on the ridge. Give the gunline a current target report, then move it before answering every radio call.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
