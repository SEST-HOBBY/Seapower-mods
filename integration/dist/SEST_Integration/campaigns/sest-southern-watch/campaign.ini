Name_en=PAPER TRAIL
Description_en=Banda approaches, north of Tanimbar
MissionSequenceName_en=OPTIONAL
MapShortName_en=O5
MissionIntro_en=Optional. A Meridian-escorted merchant is going to hand something over north of Tanimbar. Two uncrewed boats can get close enough to see to whom; the patrol ship must not be seen.
MissionImage_en=campaigns/sest-southern-watch/art/southern_watch_o5_sheet.png
MissionSpecialNote_en=Optional operation. HMAS Eyre with an RAN uncrewed surface vessel and one lent by the US Navy: your task group remains on the Coral Sea passage. Identify the ship that receives the Meridian merchant's cargo. What she is tells The Quiet Passenger and the next convoy which lane to watch. Closes when Rig Seventeen is complete.

