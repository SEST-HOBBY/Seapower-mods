[Language_en]
Name=Southern Watch (Royal Australian Navy)
Description=SOUTHERN WATCH - The Northern Lifeline. October 2028. A confrontation elsewhere in the Indo-Pacific has drawn most of America's ready combat power north. Above Australia, forged movement orders, missing cargo records and insurers refusing cover are closing the sea lanes. The Meridian Maritime Group offers escorts, inspections and access to its terminals; some of its vessels carry armed teams. When one escort fires on an Indonesian patrol in the Arafura Sea, HMAS Warramunga is the nearest warship. Over six weeks, the Australian-led task group must protect people, fuel and supplies as the confrontation spreads to the Biak enclave and Chinese carrier groups in the Banda approaches. Allied detachments, recovered intelligence and the condition of surviving ships shape the next passage. A ceasefire eventually opens a route home, but the withdrawing forces and those still prepared to attack must be distinguished.

