[Language_en]
Name=Southern Watch 11 - Fujian's Shadow
Description=WIDER BANDA APPROACHES. The ceasefire talks open on Friday and the opposing fleet has been told to make the corridor unusable before they do. FUJIAN is a hundred and thirty miles north-north-west with LIAONING astern of her, screened by a Luda, a Sovremenny and a Type 054A, and the strike she is building is aimed at the transports, at FORD and at you.\n\nFORD arrived on Tuesday on Washington's terms: one strike group, a fixed window in theatre, and a departure date that does not move. You have her air wing, two Burkes and the last of the Australian escorts.\n\nThe protected transports and FORD herself have to come out of this usable. If their carrier turns north having achieved nothing, that is the whole victory - you are not chasing it across the Celebes Sea to prove a point.
Objective_Transports=Two of the three transports, Coral Pioneer among them, pass to the south-east
Objective_Ford=USS Gerald R. Ford must survive
Objective_Strike=Shoot down the YJ-83-armed J-15D before it launches
Taskforce1StartMessage=<color=yellow>Fujian's Shadow</color>|WIDER BANDA APPROACHES. The ceasefire talks open on Friday and the opposing fleet has been told to make the corridor unusable before they do. FUJIAN is a hundred and thirty miles north-north-west with LIAONING astern of her, screened by a Luda, a Sovremenny and a Type 054A, and the strike she is building is aimed at the transports, at FORD and at you.\n\nFORD arrived on Tuesday on Washington's terms: one strike group, a fixed window in theatre, and a departure date that does not move. You have her air wing, two Burkes and the last of the Australian escorts.\n\nThe protected transports and FORD herself have to come out of this usable. If their carrier turns north having achieved nothing, that is the whole victory - you are not chasing it across the Celebes Sea to prove a point.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The transports are through and Ford is intact with her window unexpired. Their carrier group is heading north-west and the talks open on Friday with the corridor open.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The corridor is closed and the talks open with that as the first fact on the table.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The corridor is closed and the talks open with that as the first fact on the table.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The transports are through and Ford is intact with her window unexpired. Their carrier group is heading north-west and the talks open on Friday with the corridor open.
TimeoutMessage=<color=red>Out of time.</color>|The transports never cleared the approaches. The talks open on Friday with the corridor closed.
SW06NorthernGroupClassifiedIntel=Two of the escorts ahead of you are hulls Sentry 06 put a name to on 6 November, and the third keeps the company they kept. The screen is on your plot from the start. What is behind it is not - that you still have to find.
SW11FujianSunkIntel=FUJIAN is down. LIAONING is still out there and still flying, but the newest deck in their fleet is on the bottom of the Banda Sea, and the corridor knows it before the talks open.
