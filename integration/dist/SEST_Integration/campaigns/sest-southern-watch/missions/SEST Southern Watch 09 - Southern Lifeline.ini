[Language_en]
Name=SEST Southern Watch 09 - Southern Lifeline
Description=REAR SUPPORT AREA, east of the Cape. COLLINS has been out for thirty-one days and comes home on Thursday whatever happens today. She is surfaced alongside SUPPLY taking fuel, stores and two crew off for medical, and while she is up there she is a very large grey target moving at eight knots.\n\nThe service window is the mission. Nothing transfers while she is dived, and nothing transfers while the group is manoeuvring hard, so every minute you spend avoiding something is a minute added to the end.\n\nA Tu-214R came down the outside of the box last night and did not come back, which usually means somebody now knows where to look. There is an Akula unaccounted for and a Flanker pair within range of here. Keep the window open and get everybody out of it.
Objective_Service=Hold the service window and withdraw south
Objective_Collins=HMAS Collins must survive
Objective_Supply=HMAS Supply must survive
Taskforce1StartMessage=<color=yellow>Southern Lifeline</color>|REAR SUPPORT AREA, east of the Cape. COLLINS has been out for thirty-one days and comes home on Thursday whatever happens today. She is surfaced alongside SUPPLY taking fuel, stores and two crew off for medical, and while she is up there she is a very large grey target moving at eight knots.\n\nThe service window is the mission. Nothing transfers while she is dived, and nothing transfers while the group is manoeuvring hard, so every minute you spend avoiding something is a minute added to the end.\n\nA Tu-214R came down the outside of the box last night and did not come back, which usually means somebody now knows where to look. There is an Akula unaccounted for and a Flanker pair within range of here. Keep the window open and get everybody out of it.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The window held, Collins is dived and heading for Stirling, and Supply still has enough in her tanks to do this again next week.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The support group is broken. Every boat in the north now has to come all the way home to do what should take four hours out here.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The support group is broken. Every boat in the north now has to come all the way home to do what should take four hours out here.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The window held, Collins is dived and heading for Stirling, and Supply still has enough in her tanks to do this again next week.
