[Language_en]
Name=Southern Watch O2 - Southern Cross
Description=ARAFURA SEA, mid-morning. A coaster with no transponder has been pacing the lane for three days, always outside the twelve-mile limit, always where the next convoy will be. Her name is what we want.\n\nKIWI 01 is a New Zealand Poseidon out of Darwin on a national allocation: one sortie, Squadron Leader Rewi's crew, and she goes home to Darwin when it is done - she is not yours to keep and not yours to lose. The patrol vessel PILBARA is on the lane with the ordinary traffic, and a Meridian escort boat has been working the same water since Sunday with a Forpost drone spotting for it, low over the lane.\n\nTAIPAN 21 and 22, RAAF F-35As out of Darwin, are airborne over the lane to cover Kiwi 01. The drone is unmanned and may be engaged: it is too small for most radars to hold at range, so take it with the fighters, or with Pilbara's guns when it comes within a few miles of her.\n\nGet Kiwi 01 close enough to put a name on the coaster, keep her out of the escort boat's reach, and bring her to the assigned recovery handover for Darwin. Everything else on the lane is somebody's living.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Picture=Identify the coaster, then recover Kiwi 01 to Darwin
Objective_Kiwi=Do not lose Kiwi 01
Objective_Drone=Shoot down the spotter drone
Objective_Traffic=Harm no lane traffic
Taskforce1StartMessage=<color=yellow>Southern Cross</color>|ARAFURA SEA, mid-morning. A coaster with no transponder has been pacing the lane for three days, always outside the twelve-mile limit, always where the next convoy will be. Her name is what we want.\n\nKIWI 01 is a New Zealand Poseidon out of Darwin on a national allocation: one sortie, Squadron Leader Rewi's crew, and she goes home to Darwin when it is done - she is not yours to keep and not yours to lose. The patrol vessel PILBARA is on the lane with the ordinary traffic, and a Meridian escort boat has been working the same water since Sunday with a Forpost drone spotting for it, low over the lane.\n\nTAIPAN 21 and 22, RAAF F-35As out of Darwin, are airborne over the lane to cover Kiwi 01. The drone is unmanned and may be engaged: it is too small for most radars to hold at range, so take it with the fighters, or with Pilbara's guns when it comes within a few miles of her.\n\nGet Kiwi 01 close enough to put a name on the coaster, keep her out of the escort boat's reach, and bring her to the assigned recovery handover for Darwin. Everything else on the lane is somebody's living.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Kiwi 01 has reached the recovery handover with the coaster classified. Rewi's crew can now file the report for Wellington and the coalition intelligence cell.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The Poseidon is down and the allocation with her. Wellington will want to know why its one aircraft was inside a gunboat's reach.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The Poseidon is down and the allocation with her. Wellington will want to know why its one aircraft was inside a gunboat's reach.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Kiwi 01 has reached the recovery handover with the coaster classified. Rewi's crew can now file the report for Wellington and the coalition intelligence cell.
TimeoutMessage=<color=red>Operational window closed.</color>|Kiwi 01 is at the end of her allocation with the coaster unnamed. Wellington's hours were spent and nothing came of them.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 70-minute window has closed. Command will hold the line for about 35 minutes more. Finish the task now.
SituationReport1Intel=REWI / KIWI: I can lay a barrier or follow a contact; I cannot do both everywhere at once. Hold your patrol ship clear of the sonobuoy field and tell me which question you need answered first.
StageIntel=CONTACT CORRELATION / KIWI 01: Coaster identified as MV HARBOUR LIGHT. Rewi's crew has logged the collection fit and a report of submarine activity in company. Pass the separate surface and acoustic records to Darwin and Wellington, then bring Kiwi 01 to the Darwin recovery handover.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
