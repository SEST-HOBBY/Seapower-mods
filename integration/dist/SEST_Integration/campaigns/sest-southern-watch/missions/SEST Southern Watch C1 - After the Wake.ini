[Language_en]
Name=SEST Southern Watch C1 - After the Wake
Description=CORAL SEA, first light. MV Lae Provider went down at 2140 last night with twenty-six aboard. Eleven are accounted for. The rest are somewhere inside a drift box that has been growing all night.\n\nHOBART is detached from the escort task with a Seahawk. The submarine that did it has not left the area and the search pattern you need to fly is exactly the pattern it will expect.\n\nSearch the box. Do not lose the helicopter doing it. If the boat presents itself, that is a bonus and not the reason you are here.
Objective_Survivors=Work the drift box to its northern edge
Objective_Helicopter=Bring the search helicopter home
Objective_Assist=Do not lose an assisting merchant
Taskforce1StartMessage=<color=yellow>After the Wake</color>|CORAL SEA, first light. MV Lae Provider went down at 2140 last night with twenty-six aboard. Eleven are accounted for. The rest are somewhere inside a drift box that has been growing all night.\n\nHOBART is detached from the escort task with a Seahawk. The submarine that did it has not left the area and the search pattern you need to fly is exactly the pattern it will expect.\n\nSearch the box. Do not lose the helicopter doing it. If the boat presents itself, that is a bonus and not the reason you are here.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Fourteen more out of the water, and the ones who did not make it are named rather than missing. That is the whole of what this operation could achieve, and it achieved it.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The box is open at the northern end and the weather is building. The rest of that crew stays missing.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The box is open at the northern end and the weather is building. The rest of that crew stays missing.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Fourteen more out of the water, and the ones who did not make it are named rather than missing. That is the whole of what this operation could achieve, and it achieved it.
TimeoutMessage=<color=red>Out of time.</color>|The drift box is open at the northern end and the weather is building. The rest of that crew stays missing.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
