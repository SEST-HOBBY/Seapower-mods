[Language_en]
Name=Southern Watch O4 - Weather Alternate
Description=KAI ISLANDS, afternoon. Captain Prasetyo has lent us the strip at Langgur for the enclave relief window and not an hour longer. LANGGUR PROVIDER and KEI STAR carry the fuel bladders and the ground party; you take them the last fifteen miles up the open-water western approach to the offshore transfer anchorage. Local craft take the bladders ashore to Langgur; neither coaster is to enter the passages between the Kai islands.\n\nThe enclave knows what Langgur is for. A Meridian escort pair has been working the Kai passages since Tuesday, and the last transit reported a drone launcher site on Kai Besar, across the strait east of the anchorage. Langgur town is beyond the anchorage and every building in it is somebody's.\n\nGet both coasters in. Put the launcher out of the argument if you can do it without touching the town.
Objective_Fuel=Get both coasters into the western transfer anchorage
Objective_Site=Neutralise the Kai Besar launcher site
Objective_Town=Leave Langgur alone
Taskforce1StartMessage=<color=yellow>Weather Alternate</color>|KAI ISLANDS, afternoon. Captain Prasetyo has lent us the strip at Langgur for the enclave relief window and not an hour longer. LANGGUR PROVIDER and KEI STAR carry the fuel bladders and the ground party; you take them the last fifteen miles up the open-water western approach to the offshore transfer anchorage. Local craft take the bladders ashore to Langgur; neither coaster is to enter the passages between the Kai islands.\n\nThe enclave knows what Langgur is for. A Meridian escort pair has been working the Kai passages since Tuesday, and the last transit reported a drone launcher site on Kai Besar, across the strait east of the anchorage. Langgur town is beyond the anchorage and every building in it is somebody's.\n\nGet both coasters in. Put the launcher out of the argument if you can do it without touching the town.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both coasters are in the anchorage and the ground party is pumping before the light goes. The Open Door has a second tanker on the track.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The bladders are on the bottom short of Langgur. The Open Door has Texaco 52 but no second tanker to extend the support window.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The bladders are on the bottom short of Langgur. The Open Door has Texaco 52 but no second tanker to extend the support window.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Both coasters are in the anchorage and the ground party is pumping before the light goes. The Open Door has a second tanker on the track.
TimeoutMessage=<color=red>Operational window closed.</color>|The light went with the bladders still short of Langgur. The Open Door has Texaco 52 but no second tanker to extend the support window.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 70-minute window has closed. Command will hold the line for about 35 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
