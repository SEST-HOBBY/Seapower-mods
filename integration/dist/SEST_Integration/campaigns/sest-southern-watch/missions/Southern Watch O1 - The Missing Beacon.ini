[Language_en]
Name=Southern Watch O1 - The Missing Beacon
Description=ARAFURA SEA, late afternoon. MV Torres Light stopped transmitting nineteen hours ago on a coastal route that carries no traffic worth interfering with. A Poseidon found her an hour ago: adrift, holed above the waterline, crew in the boats and her bridge recorder still aboard.\n\nShe was not alone yesterday. A Meridian supply ship, a Delvar-class hull with a crane and no business on this route, was in company with her and has turned back towards her from the south-east. Her master says it is a salvage claim. What is on that recorder says otherwise.\n\nYour detachment is eighteen miles out; Meridian's ship is fourteen, and slow. Identify Torres Light and get your lead ship alongside her first. Meridian's ship has not fired and is not a target - sinking her settles the race and starts the argument this whole month is about. The lane between you carries ordinary traffic. Your weapons are tight.
Objective_Search=Identify Torres Light and get your lead ship alongside her before Meridian's ship
Objective_Restraint=Do not sink the Meridian ship
Objective_Traffic=Harm no lane traffic
Taskforce1StartMessage=<color=yellow>The Missing Beacon</color>|ARAFURA SEA, late afternoon. MV Torres Light stopped transmitting nineteen hours ago on a coastal route that carries no traffic worth interfering with. A Poseidon found her an hour ago: adrift, holed above the waterline, crew in the boats and her bridge recorder still aboard.\n\nShe was not alone yesterday. A Meridian supply ship, a Delvar-class hull with a crane and no business on this route, was in company with her and has turned back towards her from the south-east. Her master says it is a salvage claim. What is on that recorder says otherwise.\n\nYour detachment is eighteen miles out; Meridian's ship is fourteen, and slow. Identify Torres Light and get your lead ship alongside her first. Meridian's ship has not fired and is not a target - sinking her settles the race and starts the argument this whole month is about. The lane between you carries ordinary traffic. Your weapons are tight.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Torres Light is found, her crew is off and the recordings from her bridge are in a bag on your quarterdeck. Meridian's ship has turned away. Somebody is going to have to explain what is on them.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Torres Light's recorder is not in our hands, and without it nobody on this side can say what happened to her.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|Torres Light's recorder is not in our hands, and without it nobody on this side can say what happened to her.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Torres Light is found, her crew is off and the recordings from her bridge are in a bag on your quarterdeck. Meridian's ship has turned away. Somebody is going to have to explain what is on them.
TimeoutMessage=<color=red>Out of time.</color>|Dark, and nobody alongside Torres Light. She drifts through the night with her recorder still aboard, and whoever reaches her first in the morning will read it.
StageIntel=Torres Light, adrift and holed above the waterline, crew in the boats. Her bridge recorder is still aboard. Get your lead ship alongside before the Meridian ship does.
Denied1Message=<color=red>Mission failed.</color>|Meridian's ship is alongside Torres Light and her crane is working. Whatever that recorder held is going aboard a ship we cannot stop without sinking her.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
