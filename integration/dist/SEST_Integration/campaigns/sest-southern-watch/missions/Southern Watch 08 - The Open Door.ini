[Language_en]
Name=Southern Watch 08 - The Open Door
Description=THE ENCLAVE, BIAK, before dawn. Local Indonesian authorities have negotiated a seventy-minute window to move civilians and emergency supplies out of the port. The battery covering the approach is an S-400 the first reports called man-portable. Its crews are from the Russian detachment, not Meridian's hard-line faction, which seized the airfield. The battery went dark when the window was agreed; nobody expects it to stay dark, and its radars should be back up within about five minutes.\n\nGRIZZLY, the Growler, has the jamming and the anti-radiation shots, off the US carrier THEODORE ROOSEVELT. DOOM 41 and 42, B-52H with conventional ARRW, have the opening airfield strike. Fire early from the southern launch line; target the military runway and dispersal complexes. They recover to Tindal. Civilian shelters and the power station remain protected. Captain Prasetyo keeps Langgur open for local aircraft. The two relief KC-130Js are holding to the west and will not come in while that radar is up. If the coasters got fuel into Langgur on the tenth, a second KC-46, TEXACO 53, backs up TEXACO 52 on the refuelling tracks south-west of the box. TEXACO 52 is available either way. Langgur also has a modern resident detachment: F-16CMs, a Saab GlobalEye, F-35As, Growlers, P-8s, a KC-46 and Seahawks. THEODORE ROOSEVELT is in the Arafura Sea, south of Papua.\n\nSuppress the battery, put its launcher out of the argument, and let the transports through. You are not levelling a regional industrial complex to do it. Everything on that field that is not shooting at you is somebody's town.\n\nROOSEVELT AIR OPERATIONS: The carrier has a specified US Navy wing, including six Growlers and US-flagged Super Hornets. Two Growlers are ready for launch. The airborne Growler is also American. Military buildings and detached helicopters destroyed here remain absent in Second Ring; mobile replacement SAMs arrive independently. Destroying the airfield is useful, but the relief movement remains the main task.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. The field team uses a portable launcher and local recovery lane. Two reserve UAVs are with the team from the start. They are unarmed and have finite fuel. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Objective_Window=Get the relief aircraft through to the safe box
Objective_Battery=Neutralise the surface-to-air battery
Objective_Town=Leave the civilian buildings on the field standing
Objective_Airfield=Disable the military runway complex
Objective_Dispersal=Disable the military dispersal complex
Objective_ForwardRecon=Obtain a current classification of the land target area
Taskforce1StartMessage=<color=yellow>The Open Door</color>|THE ENCLAVE, BIAK, before dawn. Local Indonesian authorities have negotiated a seventy-minute window to move civilians and emergency supplies out of the port. The battery covering the approach is an S-400 the first reports called man-portable. Its crews are from the Russian detachment, not Meridian's hard-line faction, which seized the airfield. The battery went dark when the window was agreed; nobody expects it to stay dark, and its radars should be back up within about five minutes.\n\nGRIZZLY, the Growler, has the jamming and the anti-radiation shots, off the US carrier THEODORE ROOSEVELT. DOOM 41 and 42, B-52H with conventional ARRW, have the opening airfield strike. Fire early from the southern launch line; target the military runway and dispersal complexes. They recover to Tindal. Civilian shelters and the power station remain protected. Captain Prasetyo keeps Langgur open for local aircraft. The two relief KC-130Js are holding to the west and will not come in while that radar is up. If the coasters got fuel into Langgur on the tenth, a second KC-46, TEXACO 53, backs up TEXACO 52 on the refuelling tracks south-west of the box. TEXACO 52 is available either way. Langgur also has a modern resident detachment: F-16CMs, a Saab GlobalEye, F-35As, Growlers, P-8s, a KC-46 and Seahawks. THEODORE ROOSEVELT is in the Arafura Sea, south of Papua.\n\nSuppress the battery, put its launcher out of the argument, and let the transports through. You are not levelling a regional industrial complex to do it. Everything on that field that is not shooting at you is somebody's town.\n\nROOSEVELT AIR OPERATIONS: The carrier has a specified US Navy wing, including six Growlers and US-flagged Super Hornets. Two Growlers are ready for launch. The airborne Growler is also American. Military buildings and detached helicopters destroyed here remain absent in Second Ring; mobile replacement SAMs arrive independently. Destroying the airfield is useful, but the relief movement remains the main task.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. The field team uses a portable launcher and local recovery lane. Two reserve UAVs are with the team from the start. They are unarmed and have finite fuel. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|A relief transport has reached the safe area and both transports remain available. Report the remaining aircraft and the battery's status so the relief authorities can plan the next movement.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|A relief transport is down, and the window with it. The next negotiation starts from a worse place.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|A relief transport is down, and the window with it. The next negotiation starts from a worse place.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|A relief transport has reached the safe area and both transports remain available. Report the remaining aircraft and the battery's status so the relief authorities can plan the next movement.
TimeoutMessage=<color=red>Operational window closed.</color>|The relief window expired. The next negotiation starts from a worse place than this one did.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 70-minute window has closed. Command will hold the line for about 35 minutes more. Finish the task now.
SituationReport1Intel=ROURKE / DOOM: The military runway and dispersal are separate aimpoints. Launch the opening ARRWs early, then assess. Another salvo into a civilian shelter will not buy the relief aircraft another minute.
SW08MainFieldLostIntel=DAMAGE ASSESSMENT: Enclave runway complex destroyed. Second Ring will reflect this loss.
SW08DispersalLostIntel=DAMAGE ASSESSMENT: Russian dispersal destroyed. Second Ring will reflect this loss.
SW08HindLostIntel=DAMAGE ASSESSMENT: Hind detachment destroyed. Second Ring will reflect this loss.
SW08HipEWLostIntel=DAMAGE ASSESSMENT: Hip electronic-warfare detachment destroyed. Second Ring will reflect this loss.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
