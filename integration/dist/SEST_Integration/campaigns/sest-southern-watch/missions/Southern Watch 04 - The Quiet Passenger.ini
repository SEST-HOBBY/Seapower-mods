[Language_en]
Name=Southern Watch 04 - The Quiet Passenger
Description=BANDA APPROACHES, middle watch. Something small and low is running south out of the Seram passage with almost no freeboard and no transponder. It may be carrying weapons for the enclave, it may be carrying people, and the difference decides what you are allowed to do about it.\n\nYou have your ship, a Seahawk and a Poseidon working the same box. There is also a real submarine in this water - a Type 039 that has been quiet for eleven hours - and a biologic contact that three different ships have now reported as a hostile boat.\n\nTrack the passenger into the handover box to the south. Classify what else is down there. Do not lose the ship doing it.
Objective_Track=Walk the low-profile craft into the handover box
Objective_Patrol=Keep your flagship afloat
Objective_Neutrals=Do not shoot the wildlife or the fishermen
Taskforce1StartMessage=<color=yellow>The Quiet Passenger</color>|BANDA APPROACHES, middle watch. Something small and low is running south out of the Seram passage with almost no freeboard and no transponder. It may be carrying weapons for the enclave, it may be carrying people, and the difference decides what you are allowed to do about it.\n\nYou have your ship, a Seahawk and a Poseidon working the same box. There is also a real submarine in this water - a Type 039 that has been quiet for eleven hours - and a biologic contact that three different ships have now reported as a hostile boat.\n\nTrack the passenger into the handover box to the south. Classify what else is down there. Do not lose the ship doing it.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The passenger is in the box with a boarding party alongside and the Type 039 knows exactly how long you held it. The route is on paper now.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The passenger is gone - into the passage, or onto the bottom with whatever it was carrying. Either way the route it was running is still a rumour, and the only thing you positively identified all night had a blowhole.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The passenger is gone - into the passage, or onto the bottom with whatever it was carrying. Either way the route it was running is still a rumour, and the only thing you positively identified all night had a blowhole.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The passenger is in the box with a boarding party alongside and the Type 039 knows exactly how long you held it. The route is on paper now.
TimeoutMessage=<color=red>Out of time.</color>|The passenger is into the passage and gone. Whatever the route was, it still is.
StageIntel=WHISKEY classified: one low-profile semi-submersible, running south on the surface with almost no freeboard. Walk her into the box. Do not sink the evidence.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
