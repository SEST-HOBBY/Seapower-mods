[Language_en]
Name=Southern Watch 06 - Blind Horizon
Description=ARAFURA SEA, first light. Your flagship is covering a convoy across the top of the Gulf and can hold an air picture out to about her own horizon. The surface group that matters is somewhere north of that line.\n\nSENTRY 06 is your Triton, launched from Tindal, and it is the only thing that can find them before they are inside missile range. It is unarmed, it is slow, and a pair of J-16s has come south off the enclave field on a vector that only makes sense if they know where the orbit is.\n\nClassify that surface group and it stays on your plot for the rest of the morning. To do it the Triton has to go north, into the part of the sky the J-16s own. If Borrowed Shield brought her in, SEJONG THE GREAT is in your screen for this one operation under Captain Han's rules - she fires when fired upon, or when you are - and she sails for Guam on the eighth either way. Hold the Triton south and she lives, and your flagship fights on her own horizon.\n\nTwo Tindal F-35As are your entire air cover. You can spend them protecting the orbit or holding close escort on the convoy. You cannot do both, and whatever you lose today you do not have tomorrow.\n\nIf the group is classified, expect the picture to raise a question it does not answer, and expect it while the Triton is still north.
Objective_Convoy=The convoy reaches its passage window
Objective_Picture=Classify the northern surface group
Objective_Sentry=Keep the Triton flying
Objective_Hobart=Your flagship survives
Objective_Airlift=Identify the transport running into the enclave
Taskforce1StartMessage=<color=yellow>Blind Horizon</color>|ARAFURA SEA, first light. Your flagship is covering a convoy across the top of the Gulf and can hold an air picture out to about her own horizon. The surface group that matters is somewhere north of that line.\n\nSENTRY 06 is your Triton, launched from Tindal, and it is the only thing that can find them before they are inside missile range. It is unarmed, it is slow, and a pair of J-16s has come south off the enclave field on a vector that only makes sense if they know where the orbit is.\n\nClassify that surface group and it stays on your plot for the rest of the morning. To do it the Triton has to go north, into the part of the sky the J-16s own. If Borrowed Shield brought her in, SEJONG THE GREAT is in your screen for this one operation under Captain Han's rules - she fires when fired upon, or when you are - and she sails for Guam on the eighth either way. Hold the Triton south and she lives, and your flagship fights on her own horizon.\n\nTwo Tindal F-35As are your entire air cover. You can spend them protecting the orbit or holding close escort on the convoy. You cannot do both, and whatever you lose today you do not have tomorrow.\n\nIf the group is classified, expect the picture to raise a question it does not answer, and expect it while the Triton is still north.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The convoy is through the window. Whatever Sentry 06 brought back or did not, the convoy is where it is supposed to be, and tomorrow starts from there.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The orbit is gone. Everything north of the horizon is now a rumour, and the convoy is inside somebody's launch basket.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The orbit is gone. Everything north of the horizon is now a rumour, and the convoy is inside somebody's launch basket.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The convoy is through the window. Whatever Sentry 06 brought back or did not, the convoy is where it is supposed to be, and tomorrow starts from there.
TimeoutMessage=<color=red>Out of time.</color>|The passage window closed. The convoy is holding in open water inside somebody's launch basket.
PictureIntel=Sentry 06 has the northern group classified: two escorts on a south-westerly course, with the fighters that came for her now on your plot. The picture holds for the rest of the operation.
SupportLoss1Intel=Sentry 06 is lost. The surface picture north of the horizon goes with her, and a replacement Triton is 60 points and a week of crew work at Edinburgh.  - Ward
AirliftIntel=Those escorts are screening a track, not a patrol line. There is a transport running south-west into the enclave field and nobody has put a name on it. Sentry 06 is the only thing in range that can.
