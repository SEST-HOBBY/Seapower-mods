[Language_en]
Name=Southern Watch 02 - Steel Highway
Description=GULF OF PAPUA. Port Moresby has asked for engineering plant, medical stores and fuel, and the Pukpuk arrangements mean we deliver them. Four priority hulls are in company with your flagship, EYRE and SUPPLY, and a Wedgetail is up with a tanker behind it.\n\nNinety minutes ago a Poseidon dropped a field on a diesel-electric contact across the planned track. The masters want to press on at twelve knots. We want time to classify it. You will not get both.\n\nThree of four must reach the Moresby approach box, and the medical and engineering ship is not one of the three you can trade away. Background traffic in this sea is ordinary commerce - it is not joining your convoy and it is not your enemy.
Objective_Cargo=Get three of four priority ships, Coral Pioneer among them, into the Gulf box
Objective_Medical=MV Kokoda Star must arrive
Objective_Neutrals=Harm no neutral shipping
Taskforce1StartMessage=<color=yellow>Steel Highway</color>|GULF OF PAPUA. Port Moresby has asked for engineering plant, medical stores and fuel, and the Pukpuk arrangements mean we deliver them. Four priority hulls are in company with your flagship, EYRE and SUPPLY, and a Wedgetail is up with a tanker behind it.\n\nNinety minutes ago a Poseidon dropped a field on a diesel-electric contact across the planned track. The masters want to press on at twelve knots. We want time to classify it. You will not get both.\n\nThree of four must reach the Moresby approach box, and the medical and engineering ship is not one of the three you can trade away. Background traffic in this sea is ordinary commerce - it is not joining your convoy and it is not your enemy.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Three hulls through the approach box, Kokoda Star among them. Moresby's pilots have them from here, and the route is a route again.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The convoy is short and Moresby is still waiting. The next one will have to be bigger, slower and later.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The convoy is short and Moresby is still waiting. The next one will have to be bigger, slower and later.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Three hulls through the approach box, Kokoda Star among them. Moresby's pilots have them from here, and the route is a route again.
TimeoutMessage=<color=red>Out of time.</color>|The window at Moresby closed. The plant and the medical stores are still at sea and the wharf party has gone home.
SupportLoss1Intel=SUPPLY is gone. Every operation after this one plans around a tank that does not refill, and 140 points is most of a mission's allocation to put another hull in her place.  - Mercer
SupportLoss2Intel=The tanker is down. The allied detachment that lent her will want a reason, and until she is replaced every sortie past Darwin's radius is planned around a tanker that is not there.  - Ward
O1BeaconFoundIntel=Torres Light's bridge recorder put a submarine on this route two days before she went missing. Her last datum is on your plot as a classified contact: treat the first ping as hostile.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
