[Language_en]
Name=Red Line O2 - The Ships from the North
Description=CERAM SEA, 0920. Two Japanese escorts came south past the Talaud Islands two days ago and are crossing the Ceram Sea this morning for the Kai Islands, where the coalition's next convoy is forming. Fleet headquarters wants their names before they join it: which ships they are, and which of them hunts submarines.\n\nSEA EAR 31, the enclave detachment's Y-9, has the look from the east. FLYING SHARK 81 and 82, J-15s the carrier air wing has released to the enclave field, keep it company. The two ships are eighty-five miles west of the aircraft, steaming south-east for the passage east of Seram.\n\nExpect a JASDF F-2A pair up from Langgur, the detachment that flew against the northern element's ships yesterday, to see the Y-9 off. They will be at weapons Tight, and so are yours. If they fire, you may reply against the aircraft that fired and nothing else - by direct order: fighters left free will go for the ships, and that ends the operation. Nothing afloat is a target.\n\nClassify both escorts, then take SEA EAR 31 back east towards the field. A Misool fishing boat and a coaster bound for Sorong are in the same water.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Names=Classify both Japanese escorts, then take Sea Ear 31 back east
Objective_Restraint=Fire on nothing afloat
Objective_Eye=Bring Sea Ear 31 home
Objective_Fighters=Classify the Japanese fighters
Objective_Traffic=Harm no fishing boat or coaster
Taskforce1StartMessage=<color=yellow>The Ships from the North</color>|CERAM SEA, 0920. Two Japanese escorts came south past the Talaud Islands two days ago and are crossing the Ceram Sea this morning for the Kai Islands, where the coalition's next convoy is forming. Fleet headquarters wants their names before they join it: which ships they are, and which of them hunts submarines.\n\nSEA EAR 31, the enclave detachment's Y-9, has the look from the east. FLYING SHARK 81 and 82, J-15s the carrier air wing has released to the enclave field, keep it company. The two ships are eighty-five miles west of the aircraft, steaming south-east for the passage east of Seram.\n\nExpect a JASDF F-2A pair up from Langgur, the detachment that flew against the northern element's ships yesterday, to see the Y-9 off. They will be at weapons Tight, and so are yours. If they fire, you may reply against the aircraft that fired and nothing else - by direct order: fighters left free will go for the ships, and that ends the operation. Nothing afloat is a target.\n\nClassify both escorts, then take SEA EAR 31 back east towards the field. A Misool fishing boat and a coaster bound for Sorong are in the same water.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|SEA EAR 31 is on her way home with both escorts classified: JS Mogami and JS Maya. Tomorrow's picture of the convoy starts with two names, and the F-2As have a recording of a Y-9 that did nothing but look.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|A Japanese ship is hit, or the Y-9 is down. Either way the group has an incident with a navy it is not at war with, two days before the convoy sails.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|A Japanese ship is hit, or the Y-9 is down. Either way the group has an incident with a navy it is not at war with, two days before the convoy sails.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|SEA EAR 31 is on her way home with both escorts classified: JS Mogami and JS Maya. Tomorrow's picture of the convoy starts with two names, and the F-2As have a recording of a Y-9 that did nothing but look.
TimeoutMessage=<color=red>Operational window closed.</color>|1120, and the escorts are through the Ceram Sea with no names this group confirmed. They join the convoy tonight as two contacts.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 80-minute window has closed. Command will hold the line for about 40 minutes more. Finish the task now.
SituationReport1Intel=AIR OPERATIONS: Classify from the edge of their radar, not the middle of it. The fighters from Langgur are there to be seen seeing us off; keep ours between them and the Y-9, and keep both at Tight.
StageIntel=PICTURE REPORT / SEA EAR 31: Both escorts classified: JS Mogami, a frigate with a towed array, and JS Maya, a destroyer with her own air defence. The recording goes to headquarters for tomorrow's picture. Take the aircraft home.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
