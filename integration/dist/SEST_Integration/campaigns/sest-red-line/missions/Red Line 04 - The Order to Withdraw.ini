[Language_en]
Name=Red Line 04 - The Order to Withdraw
Description=BANDA SEA, 0310, 27 NOVEMBER. The ceasefire took effect at 0000. The group acknowledged the order to withdraw at 2304 last night and is carrying it out: LIAONING, the replenishment ship and HAI YANG 7, chartered, north-west for the Manipa approaches with what the twenty-third left, and your frigate on the starboard quarter. Not every group in the corridor has acknowledged. This one has, and the coalition is watching to see which is which.\n\nMV MERIDIAN HARMONY is not withdrawing. She is one of Meridian's armed coasters; she joined the group on the twenty-fourth asking for protection, and headquarters let her keep company. At 0240 she turned south for the Arafura lane, where the coalition's first convoy sails at first light tomorrow. She has been told to stop, twice, on the group's net and on channel 16, and has not answered. Meridian is not a party to the ceasefire. If she reaches that lane, whatever she does there she will have done from this group's company.\n\nA coalition Poseidon is overhead, recording the withdrawal, and a submarine may be astern. Neither is to be touched. Your frigate and its flight start at weapons Hold: engage the coaster by direct order, because a ship left free may find the Poseidon on its own. Stop her before she clears the screen, then take LIAONING and the replenishment ship across the line north-west.\n\nA Banda fishing boat and the Banda Neira ferry are on the water.
Objective_Withdrawal=Take Liaoning and the replenishment ship north-west across the line
Objective_Spoiler=Stop Meridian Harmony before she clears the screen
Objective_Restraint=Fire on nothing but Meridian Harmony
Objective_Carrier=Bring Liaoning through intact
Objective_Traffic=Harm no fishing boat or ferry
Taskforce1StartMessage=<color=yellow>The Order to Withdraw</color>|BANDA SEA, 0310, 27 NOVEMBER. The ceasefire took effect at 0000. The group acknowledged the order to withdraw at 2304 last night and is carrying it out: LIAONING, the replenishment ship and HAI YANG 7, chartered, north-west for the Manipa approaches with what the twenty-third left, and your frigate on the starboard quarter. Not every group in the corridor has acknowledged. This one has, and the coalition is watching to see which is which.\n\nMV MERIDIAN HARMONY is not withdrawing. She is one of Meridian's armed coasters; she joined the group on the twenty-fourth asking for protection, and headquarters let her keep company. At 0240 she turned south for the Arafura lane, where the coalition's first convoy sails at first light tomorrow. She has been told to stop, twice, on the group's net and on channel 16, and has not answered. Meridian is not a party to the ceasefire. If she reaches that lane, whatever she does there she will have done from this group's company.\n\nA coalition Poseidon is overhead, recording the withdrawal, and a submarine may be astern. Neither is to be touched. Your frigate and its flight start at weapons Hold: engage the coaster by direct order, because a ship left free may find the Poseidon on its own. Stop her before she clears the screen, then take LIAONING and the replenishment ship across the line north-west.\n\nA Banda fishing boat and the Banda Neira ferry are on the water.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|LIAONING and the replenishment ship are north-west of the line, and MERIDIAN HARMONY is stopped short of the lane. The ship's flight is searching for her crew. The group's report will say what was done and why; the Poseidon has the same account.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The withdrawal has become an incident: LIAONING is lost, or the Poseidon or the boat astern is down. The ceasefire is hours old, and the group is in its first violation report.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The withdrawal has become an incident: LIAONING is lost, or the Poseidon or the boat astern is down. The ceasefire is hours old, and the group is in its first violation report.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|LIAONING and the replenishment ship are north-west of the line, and MERIDIAN HARMONY is stopped short of the lane. The ship's flight is searching for her crew. The group's report will say what was done and why; the Poseidon has the same account.
TimeoutMessage=<color=red>Operational window closed.</color>|0430, and the group is still south of the line. The withdrawal order had a time on it, and the coalition's aircraft has recorded the group missing it.
Denied1Message=<color=red>Operation failed.</color>|MERIDIAN HARMONY has cleared the screen and is running south for the lane at full speed. The group cannot follow her and keep its withdrawal order. Whatever she does tomorrow, she sailed from this group's company.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
