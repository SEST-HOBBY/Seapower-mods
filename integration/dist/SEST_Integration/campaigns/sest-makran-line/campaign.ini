[Language_en]
Name=Makran Line - The Fuel Road (Pakistan Navy)
Description=MAKRAN LINE - The Fuel Road. October 2028. With America's ready combat power drawn east to the western Pacific, insurers are refusing cover on the tanker road from the Gulf to Karachi, and the Meridian Maritime Group is offering the tankers its own armed escorts. A Pakistan Navy task group, Task Force 88, is sent to keep the road open: the Karachi approaches, the Gwadar anchorage, a submarine trail off the Makran coast and the last convoy into Port Qasim. The opponent is Meridian alone, in armed merchants and trawlers. The task group is what the collection can field for 2028: the Tughril-class frigates, PNS Alamgir, their Z-9CE and Sea King flights, and the Air Force's JF-17s and ZDK-03 from the second week. There is no Pakistani supply ship, so the ships rearm at Karachi between missions. Meridian, its ships, the merchants and the commander are fiction.

