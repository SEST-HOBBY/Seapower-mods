[Language_en]
Name=Makran Line 04 - Port Qasim
Description=KARACHI APPROACHES, 0500. MT LANDHI, MT KORANGI CREEK and MT THATTA SPIRIT weighed from the Karachi outer anchorage at 0300 with the month's fuel for Port Qasim and are on the deep-water route, twenty-four miles south-west of the Port Qasim anchorage. Three Meridian armed trawlers are coming in from the south-west, and an armed ro-ro, MV SEA FALCON, from the south.\n\nMV MERIDIAN SENTINEL, their mothership, was off the Indus mouths at midnight. She is now running south for the open sea. If she reaches the marked circle south of the delta, she is clear to sea and Meridian keeps the ship that fuels its boats.\n\nBring at least two of the three tankers within four miles of the Port Qasim anchorage. Stop SENTINEL before she reaches that circle: sink her, or close her with the screen's lead ship to within about three miles, and she will heave to and follow your orders into the Karachi roads. From then she is a protected neutral; her loss ends the operation. Set the lead ship's weapons to Hold before closing her, or it may engage her on the way in. The convoy is in when two tankers are inside the anchorage circle, SENTINEL is sunk or has hove to, and no incoming weapon is still tracked against the task group.\n\nFishing dhows, a bulk carrier at the Port Qasim anchorage and the Dubai service are on the water and in the air. Identify before you fire.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Convoy=Bring two of the three tankers within four miles of the Port Qasim anchorage
Objective_Mothership=Also required: stop Meridian Sentinel before she reaches the marked circle south of the delta, by sinking her or closing her until she heaves to
Objective_Ships=Lose none of the three tankers
Objective_Raiders=Sink three of the four Meridian boats coming for the convoy
Objective_Traffic=Harm no dhow, merchant or airliner, nor Meridian Sentinel once she has hove to
Taskforce1StartMessage=<color=yellow>Port Qasim</color>|KARACHI APPROACHES, 0500. MT LANDHI, MT KORANGI CREEK and MT THATTA SPIRIT weighed from the Karachi outer anchorage at 0300 with the month's fuel for Port Qasim and are on the deep-water route, twenty-four miles south-west of the Port Qasim anchorage. Three Meridian armed trawlers are coming in from the south-west, and an armed ro-ro, MV SEA FALCON, from the south.\n\nMV MERIDIAN SENTINEL, their mothership, was off the Indus mouths at midnight. She is now running south for the open sea. If she reaches the marked circle south of the delta, she is clear to sea and Meridian keeps the ship that fuels its boats.\n\nBring at least two of the three tankers within four miles of the Port Qasim anchorage. Stop SENTINEL before she reaches that circle: sink her, or close her with the screen's lead ship to within about three miles, and she will heave to and follow your orders into the Karachi roads. From then she is a protected neutral; her loss ends the operation. Set the lead ship's weapons to Hold before closing her, or it may engage her on the way in. The convoy is in when two tankers are inside the anchorage circle, SENTINEL is sunk or has hove to, and no incoming weapon is still tracked against the task group.\n\nFishing dhows, a bulk carrier at the Port Qasim anchorage and the Dubai service are on the water and in the air. Identify before you fire.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The convoy is at the Port Qasim anchorage, and MERIDIAN SENTINEL is sunk off the delta. Meridian's boats have lost the ship that fuelled them, and the masters at the Gulf end of the road are asking for the next sailing date.
PathHoveToVictoryMessage=<color=lime>Operation complete.</color>|The convoy is at the Port Qasim anchorage, and MERIDIAN SENTINEL has hove to and is under escort into the Karachi roads with her crew. Meridian's boats have lost the ship that fuels them.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The convoy is broken: two of the three tankers are lost. Port Qasim will be short of fuel by the end of the month, and Meridian's escorts will be the only ones the masters can get.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The convoy is broken: two of the three tankers are lost. Port Qasim will be short of fuel by the end of the month, and Meridian's escorts will be the only ones the masters can get.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The convoy is at the Port Qasim anchorage, and MERIDIAN SENTINEL is sunk off the delta. Meridian's boats have lost the ship that fuelled them, and the masters at the Gulf end of the road are asking for the next sailing date.
PathHoveToTaskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The convoy is at the Port Qasim anchorage, and MERIDIAN SENTINEL has hove to and is under escort into the Karachi roads with her crew. Meridian's boats have lost the ship that fuels them.
TimeoutMessage=<color=red>Operational window closed.</color>|0800, and the convoy is not in: two tankers are not inside the anchorage circle, or MERIDIAN SENTINEL is neither sunk nor hove to. The tankers anchor short of Port Qasim and wait for daylight.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 120-minute window has closed. Command will hold the line for about 60 minutes more. Finish the task now.
SituationReport1Intel=TF-88 STAFF: The convoy and the mothership pull the screen two ways. Keep a second ship with the tankers and send the lead ship for Sentinel: she stops when it is within about three miles, and a ship that has hove to is protected.
ProgressHalfwayIntel=CONVOY COMMODORE: Two tankers are halfway to the Port Qasim anchorage. Keep the screen between them and the boats to the south-west.
ProgressFirstInIntel=PORT QASIM CONTROL: The first tanker is inside the four-mile circle off the anchorage. The convoy is in when two are, MERIDIAN SENTINEL is sunk or has hove to, and nothing is inbound.
ProgressRunningIntel=FLEET OPERATIONS: MERIDIAN SENTINEL is halfway to clearing the delta. Sink her or close her now.
MK03MotherNamedIntel=FLEET OPERATIONS: HANGOR's recording of the sixth, correlated with tonight's picture, puts MERIDIAN SENTINEL here. The position is on your display as a datum and will age off in fifteen minutes. It is a record, not a contact: find her with your own sensors.
Denied1Message=<color=red>Operation failed.</color>|MERIDIAN SENTINEL has cleared the delta and is running south-west for the open sea. The task group cannot follow her and keep the convoy. Meridian keeps its mothership.
TurnBackHeaveToIntel=BRIDGE: MERIDIAN SENTINEL has stopped engines and answered. She has hove to and is turning for the Karachi roads under our orders. She is no longer hostile; do not fire on her.
TurnBackHeaveToLostMessage=<color=red>Operation failed.</color>|MERIDIAN SENTINEL had hove to and was under escort when she was sunk. Her crew had surrendered their ship, and the Navy will answer for it.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
