[Language_en]
Name=Makran Line 03 - Hangor
Description=SOUTH OF GWADAR, 0130. MV MERIDIAN SENTINEL, the merchant fleet intelligence believes fuels and arms Meridian's trawlers, is steaming east fifty miles south of the coast without lights. Two of the trawlers are waiting for her somewhere ahead.\n\nPNS HANGOR is dived across her track. Classify SENTINEL on passive sonar, then take the boat within three miles of the trail datum marked east of you, on her rendezvous. The trail is complete when SENTINEL has been classified and HANGOR is inside that circle afterwards. If any Meridian ship classifies HANGOR, the trail is blown and the operation has failed. Nothing is fired: the boat starts at weapons Hold, and a torpedo on any ship here ends the operation.\n\nDhows and a tanker bound for the Gulf are in the sonar picture. Use them.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Trail=Classify Meridian Sentinel, then take Hangor within three miles of the trail datum
Objective_Unseen=Keep Hangor off Meridian's plot: no Meridian ship may classify her
Objective_Restraint=Fire on nothing
Objective_Boat=Bring Hangor through intact
Objective_Traffic=Harm no dhow or tanker
Taskforce1StartMessage=<color=yellow>Hangor</color>|SOUTH OF GWADAR, 0130. MV MERIDIAN SENTINEL, the merchant fleet intelligence believes fuels and arms Meridian's trawlers, is steaming east fifty miles south of the coast without lights. Two of the trawlers are waiting for her somewhere ahead.\n\nPNS HANGOR is dived across her track. Classify SENTINEL on passive sonar, then take the boat within three miles of the trail datum marked east of you, on her rendezvous. The trail is complete when SENTINEL has been classified and HANGOR is inside that circle afterwards. If any Meridian ship classifies HANGOR, the trail is blown and the operation has failed. Nothing is fired: the boat starts at weapons Hold, and a torpedo on any ship here ends the operation.\n\nDhows and a tanker bound for the Gulf are in the sonar picture. Use them.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|HANGOR is on SENTINEL's rendezvous with her signature on tape, and nobody on the Meridian ships knows a submarine was there. The Port Qasim escort will know her when it hears her.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|HANGOR has been seen, or has fired, or is lost. Meridian knows the Navy has a boat on its mothership, and SENTINEL will not come this way again.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|HANGOR has been seen, or has fired, or is lost. Meridian knows the Navy has a boat on its mothership, and SENTINEL will not come this way again.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|HANGOR is on SENTINEL's rendezvous with her signature on tape, and nobody on the Meridian ships knows a submarine was there. The Port Qasim escort will know her when it hears her.
TimeoutMessage=<color=red>Operational window closed.</color>|0322, and the trail is not complete. SENTINEL is past the rendezvous and HANGOR has lost her in the morning traffic.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 75-minute window has closed. Command will hold the line for about 37 minutes more. Finish the task now.
SituationReport1Intel=BOAT CONTROL: A trail is won by patience. Let the merchant's own noise bring her to you, classify her on passive sonar, and keep below the layer; nothing is fired on this patrol.
StageIntel=SONAR / HANGOR: Contact classified: MV MERIDIAN SENTINEL, single screw, heavy, a generator forward that a merchant does not need. Her signature is logged for the Port Qasim escort. Take the boat on to the trail datum.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
