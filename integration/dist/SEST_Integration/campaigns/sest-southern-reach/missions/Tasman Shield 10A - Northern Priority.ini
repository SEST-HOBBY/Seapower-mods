[Language_en]
Name=Tasman Shield 10A - Northern Priority
Description=THE HAURAKI GULF, morning, flat calm. MV HAURAKI TRADER, a container ship with the port of Auckland's week in her, is in the outer Gulf inbound for the Rangitoto Channel. The Great Barrier ferry, the Tauranga container service outbound, two fishing boats and the Auckland-Sydney service are in the same water, which is narrow. The French frigate FS COURBET sailed from Devonport this morning for Noumea and is going north past Tiritiri with her Panther up. She is not part of this, and she is not a target.\n\nOff the Colville Channel, eighteen miles north-east, a Type 056A, the research trawler NAN HAI 27 and MV AUSTRAL COMPLIANCE are steaming slow circles and broadcasting a 'compliance station' on the port's working channel: an intention to stop and inspect. The corvette is weapons tight.\n\nYour detachment is with the container ship; KIWI 05 is up out of Whenuapai, thirty miles away. Get HAURAKI TRADER to the Rangitoto approach, classify the tender, harm nothing that is New Zealand's. Hold this and the northern element stays here instead of joining the group in the western Tasman.
Objective_Approaches=MV Hauraki Trader reaches the Rangitoto Channel approach
Objective_Station=Classify MV Austral Compliance
Objective_Traffic=Harm no ferry, merchant, fishing boat, aircraft or the French frigate
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>Northern Priority</color>|THE HAURAKI GULF, morning, flat calm. MV HAURAKI TRADER, a container ship with the port of Auckland's week in her, is in the outer Gulf inbound for the Rangitoto Channel. The Great Barrier ferry, the Tauranga container service outbound, two fishing boats and the Auckland-Sydney service are in the same water, which is narrow. The French frigate FS COURBET sailed from Devonport this morning for Noumea and is going north past Tiritiri with her Panther up. She is not part of this, and she is not a target.\n\nOff the Colville Channel, eighteen miles north-east, a Type 056A, the research trawler NAN HAI 27 and MV AUSTRAL COMPLIANCE are steaming slow circles and broadcasting a 'compliance station' on the port's working channel: an intention to stop and inspect. The corvette is weapons tight.\n\nYour detachment is with the container ship; KIWI 05 is up out of Whenuapai, thirty miles away. Get HAURAKI TRADER to the Rangitoto approach, classify the tender, harm nothing that is New Zealand's. Hold this and the northern element stays here instead of joining the group in the western Tasman.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Hauraki Trader has reached the Rangitoto approach. The northern detachment remains committed to the Hauraki Gulf, reducing the force available for the next interception. Brand: 'Auckland noticed. That was the point.'
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The container ship is lost in the Gulf, or the flagship is, and the northern element goes south to join the group with Auckland's week on the bottom behind it.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The container ship is lost in the Gulf, or the flagship is, and the northern element goes south to join the group with Auckland's week on the bottom behind it.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Hauraki Trader has reached the Rangitoto approach. The northern detachment remains committed to the Hauraki Gulf, reducing the force available for the next interception. Brand: 'Auckland noticed. That was the point.'
TimeoutMessage=<color=red>Operational window closed.</color>|Ninety minutes and Hauraki Trader is still in the outer Gulf with the corvette between her and the channel. The northern element leaves for the Tasman with a story to tell.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 60-minute window has closed. Command will hold the line for about 30 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
