[Language_en]
Name=Tasman Shield 06 - Bass Strait
Description=BASS STRAIT, morning. MT BASS PROVIDER, Geelong-bound with a cargo Melbourne has been waiting a fortnight for, is thirty miles east of Wilsons Promontory with your force. The strait around her is its ordinary self: two Devonport ferries on the crossing, a bulker westbound, two supply boats running out to the Gippsland platforms, three of which are on your plot some sixty miles north-east, and the Melbourne-Hobart service overhead.\n\nMV SOUTHERN COMPLIANCE, an Austral Meridian Services merchant, has been radiating a frigate's search radar since dawn: she is a decoy and a provocation, and she is a merchant. A Kilo is inside the strait somewhere south-west of the tanker's track. A Type 056A with a Z-9 up is coming in from the east past the platforms.\n\nThe tanker to the western line. The platforms are not to be touched - a missile that finds a rig instead of a corvette ends the campaign in a courtroom. East Sale's F-35As are on the CAP row. The Kilo has not fired. Classify her if you can; sink her if she does.
Objective_Tanker=MT Bass Provider reaches the western line
Objective_Platforms=The Gippsland platforms are not to be touched
Objective_Boat=Classify the Kilo
Objective_Traffic=Harm no ferry, merchant, supply boat or aircraft
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>Bass Strait</color>|BASS STRAIT, morning. MT BASS PROVIDER, Geelong-bound with a cargo Melbourne has been waiting a fortnight for, is thirty miles east of Wilsons Promontory with your force. The strait around her is its ordinary self: two Devonport ferries on the crossing, a bulker westbound, two supply boats running out to the Gippsland platforms, three of which are on your plot some sixty miles north-east, and the Melbourne-Hobart service overhead.\n\nMV SOUTHERN COMPLIANCE, an Austral Meridian Services merchant, has been radiating a frigate's search radar since dawn: she is a decoy and a provocation, and she is a merchant. A Kilo is inside the strait somewhere south-west of the tanker's track. A Type 056A with a Z-9 up is coming in from the east past the platforms.\n\nThe tanker to the western line. The platforms are not to be touched - a missile that finds a rig instead of a corvette ends the campaign in a courtroom. East Sale's F-35As are on the CAP row. The Kilo has not fired. Classify her if you can; sink her if she does.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Bass Provider is west of the line with the ferries still crossing and every platform where it was. The corvette went home past the rigs it was hoping you would hit.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The tanker is lost in Bass Strait, or a platform is, and Melbourne's fortnight becomes a month.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The tanker is lost in Bass Strait, or a platform is, and Melbourne's fortnight becomes a month.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Bass Provider is west of the line with the ferries still crossing and every platform where it was. The corvette went home past the rigs it was hoping you would hit.
TimeoutMessage=<color=red>Out of time.</color>|Seventy minutes and the tanker is still east of the line with a Kilo somewhere under her track. She anchors off Wilsons Promontory and waits for tomorrow.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
