[Language_en]
Name=Tasman Shield 09 - The Southern Convoy
Description=SOUTH OF PORTLAND, 38 South, mid-morning, a south-westerly. The Southern Convoy: the tanker PORTLAND SPIRIT, the bulker LIMESTONE COAST, the freighter GLENELG, the car carrier BASS HIGHWAY and CORAL PIONEER, thirteen knots, bound for the split point off Portland where the Adelaide hulls turn west and the Melbourne hulls go on.\n\nThe protection group is eighty miles south-west and it has stopped pretending: LIAONING, the Type 052D that has commanded the group since October, two frigates and a corvette, a Z-18F and the destroyer's Z-20 up. Liaoning's deck is still spotting the rest: expect her Ka-31 up within about five minutes, and three J-15s with anti-ship missiles and a J-15D with them forming up beyond her within about ten. If Farncomb missed ROMEO on the fourth, she is under the convoy; if the Bight search missed SIERRA-TWO, so is she.\n\nYou have the whole force: the Seahawk, Edinburgh's Poseidon and WEDGETAIL 05, Edinburgh's F-35As for fighter cover, and for the first time Super Hornets and Growlers tasked to strike, recovering at Edinburgh. TEXACO 61, a USAF KC-46A on the Enhanced Air Cooperation rotation, holds a tanker track south-east of Edinburgh, outside the reach of the Type 052D's surface-to-air missiles. A coastal ro-ro, a bulker and the Melbourne-Perth service are in the box. Four of five to the split point.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nSUBMARINE ATTACHMENT: HMAS Sheean is allocated to this operation in an independent patrol box, submerged with weapons held. You command the boat. Deconflict its movements from the convoy and your ASW weapons before releasing it to engage. It is an authored theatre attachment for this operation, not a purchased hull carried into every later battle.
Objective_Convoy=Four of five convoy hulls into the split point off Portland
Objective_Wedgetail=Keep the Wedgetail flying
Objective_Neutrals=Harm no merchant or aircraft
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>The Southern Convoy</color>|SOUTH OF PORTLAND, 38 South, mid-morning, a south-westerly. The Southern Convoy: the tanker PORTLAND SPIRIT, the bulker LIMESTONE COAST, the freighter GLENELG, the car carrier BASS HIGHWAY and CORAL PIONEER, thirteen knots, bound for the split point off Portland where the Adelaide hulls turn west and the Melbourne hulls go on.\n\nThe protection group is eighty miles south-west and it has stopped pretending: LIAONING, the Type 052D that has commanded the group since October, two frigates and a corvette, a Z-18F and the destroyer's Z-20 up. Liaoning's deck is still spotting the rest: expect her Ka-31 up within about five minutes, and three J-15s with anti-ship missiles and a J-15D with them forming up beyond her within about ten. If Farncomb missed ROMEO on the fourth, she is under the convoy; if the Bight search missed SIERRA-TWO, so is she.\n\nYou have the whole force: the Seahawk, Edinburgh's Poseidon and WEDGETAIL 05, Edinburgh's F-35As for fighter cover, and for the first time Super Hornets and Growlers tasked to strike, recovering at Edinburgh. TEXACO 61, a USAF KC-46A on the Enhanced Air Cooperation rotation, holds a tanker track south-east of Edinburgh, outside the reach of the Type 052D's surface-to-air missiles. A coastal ro-ro, a bulker and the Melbourne-Perth service are in the box. Four of five to the split point.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nSUBMARINE ATTACHMENT: HMAS Sheean is allocated to this operation in an independent patrol box, submerged with weapons held. You command the boat. Deconflict its movements from the convoy and your ASW weapons before releasing it to engage. It is an authored theatre attachment for this operation, not a purchased hull carried into every later battle.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|At least four ships have reached the Portland split point. Adelaide-bound cargo can turn west while the Melbourne ships continue east. Command is accounting for losses and remaining ammunition before the next passage.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|Two hulls lost south of Portland with a month of two cities' cargo in them. The group broke the convoy where it said it would.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|Two hulls lost south of Portland with a month of two cities' cargo in them. The group broke the convoy where it said it would.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|At least four ships have reached the Portland split point. Adelaide-bound cargo can turn west while the Melbourne ships continue east. Command is accounting for losses and remaining ammunition before the next passage.
TimeoutMessage=<color=red>Operational window closed.</color>|One hundred and thirty-five minutes and the convoy is still short of the split point with the carrier's second strike forming. Portland's pilot boat waits for a convoy that turned back.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 90-minute window has closed. Command will hold the line for about 45 minutes more. Finish the task now.
SituationReport1Intel=MERCER: Three axes compete for your sensors: the carrier group, the submarine screen and the convoy route. The supporting submarine begins outside the merchant lane. Keep it there until the plot is reconciled.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
