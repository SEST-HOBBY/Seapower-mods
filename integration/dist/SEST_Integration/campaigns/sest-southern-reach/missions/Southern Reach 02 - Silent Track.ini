[Language_en]
Name=Southern Reach 02 - Silent Track
Description=MACQUARIE RIDGE, before dawn. A longliner south of Campbell Island reported a contact on the sixth that no diesel boat could be, twelve hundred miles from a tender in December. It is nuclear, it is working the ridge, and the ridge is where every ship for the ice crosses.\n\nCOLLINS is at periscope depth on the ridge's western flank with thirty-one days of patrol left in her. KIWI 05, a New Zealand Poseidon out of Ohakea with Squadron Leader Rewi's crew, has one sortie and a field of buoys. The research trawler that shadowed the Storm Bay convoy is thirty miles north, which tells you where the boat is not.\n\nClassify the contact, then take Collins east off the ridge to the exit point. Do not attack it. RV SOUTHERN SURVEYOR is on the ridge with a science party, a Bluff longliner is working the shelf, and there is a whale that three sonar operators will call a submarine. The ceasefire holds down here until somebody says it does not.
Objective_Track=Classify the contact, then take Collins to the exit point
Objective_Named=Put a name on VICTOR for the record
Objective_Restraint=Do not attack the contact: the ceasefire holds
Objective_Collins=HMAS Collins must survive
Objective_Kiwi=Do not lose Kiwi 05
Objective_Traffic=Harm no research vessel, fishing boat or whale
Taskforce1StartMessage=<color=yellow>Silent Track</color>|MACQUARIE RIDGE, before dawn. A longliner south of Campbell Island reported a contact on the sixth that no diesel boat could be, twelve hundred miles from a tender in December. It is nuclear, it is working the ridge, and the ridge is where every ship for the ice crosses.\n\nCOLLINS is at periscope depth on the ridge's western flank with thirty-one days of patrol left in her. KIWI 05, a New Zealand Poseidon out of Ohakea with Squadron Leader Rewi's crew, has one sortie and a field of buoys. The research trawler that shadowed the Storm Bay convoy is thirty miles north, which tells you where the boat is not.\n\nClassify the contact, then take Collins east off the ridge to the exit point. Do not attack it. RV SOUTHERN SURVEYOR is on the ridge with a science party, a Bluff longliner is working the shelf, and there is a whale that three sonar operators will call a submarine. The ceasefire holds down here until somebody says it does not.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Collins is off the ridge with a name on the boat, and the boat never knew how long she was held. Rewi, on the way home: 'One Akula. One whale. No torpedoes. Good morning.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Collins is lost on a ridge nobody was fighting over, and the ceasefire in the south is now a question.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|Collins is lost on a ridge nobody was fighting over, and the ceasefire in the south is now a question.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Collins is off the ridge with a name on the boat, and the boat never knew how long she was held. Rewi, on the way home: 'One Akula. One whale. No torpedoes. Good morning.'
TimeoutMessage=<color=red>Out of time.</color>|Seventy minutes and the contact is still a contact. She is off the ridge and so is the picture, and the next convoy crosses it blind.
StageIntel=VICTOR classified: an Akula-class nuclear boat, running north-east along the ridge at eight knots. Rewi's crew has the datum logged for Wellington and Canberra both. Take Collins east, off her track, and do not give her a reason.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
