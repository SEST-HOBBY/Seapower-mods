[Language_en]
Name=Southern Reach 03 - Search Datum
Description=THE SOUTHERN ROUTE, mid-morning. WILKINS 03, the A319 airlink to Wilkins Aerodrome, lost contact on the Hobart-Casey track at 0352 and put down on the water eighteen minutes later. Her EPIRB ran for forty minutes and then stopped, which is what happens when somebody switches it off.\n\nA longliner heard it and reported it. A factory trawler from the fleet that shadowed the Storm Bay convoy was closer, and the trawler is now holding position sixty miles west of the datum, answering nobody, with the research trawler NAN HAI 27 steaming to meet her.\n\nYou have your escort group with the Seahawk and the Poseidon you brought, and SENTRY 21 high to the south. Six contacts are in the search box: longliners, a factory trawler that is only fishing, the expedition cruise ship POLAR HORIZON southbound, a whale, and the one that matters. Classify her and put your flagship within three miles of her. Your weapons are tight, and a shot at the wrong hull is a shot at the crew.
Objective_Datum=Classify the trawler holding the crew, then put your flagship within three miles of her
Objective_Neutrals=Harm no fishing boat, cruise ship or whale
Objective_Flagship=Bring your flagship out intact
Objective_Collector=Classify Nan Hai 27 as well
Taskforce1StartMessage=<color=yellow>Search Datum</color>|THE SOUTHERN ROUTE, mid-morning. WILKINS 03, the A319 airlink to Wilkins Aerodrome, lost contact on the Hobart-Casey track at 0352 and put down on the water eighteen minutes later. Her EPIRB ran for forty minutes and then stopped, which is what happens when somebody switches it off.\n\nA longliner heard it and reported it. A factory trawler from the fleet that shadowed the Storm Bay convoy was closer, and the trawler is now holding position sixty miles west of the datum, answering nobody, with the research trawler NAN HAI 27 steaming to meet her.\n\nYou have your escort group with the Seahawk and the Poseidon you brought, and SENTRY 21 high to the south. Six contacts are in the search box: longliners, a factory trawler that is only fishing, the expedition cruise ship POLAR HORIZON southbound, a whale, and the one that matters. Classify her and put your flagship within three miles of her. Your weapons are tight, and a shot at the wrong hull is a shot at the crew.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|A boarding party is on Nan Hai 24's deck and the airlink's crew are in the flagship's wardroom. The trawler's master says he was taking them to the nearest medical facility. He was steaming away from it.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The trawler is gone west with the crew aboard, or gone under with them. Either way Wilkins 03's people do not come home this week.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The trawler is gone west with the crew aboard, or gone under with them. Either way Wilkins 03's people do not come home this week.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|A boarding party is on Nan Hai 24's deck and the airlink's crew are in the flagship's wardroom. The trawler's master says he was taking them to the nearest medical facility. He was steaming away from it.
TimeoutMessage=<color=red>Out of time.</color>|The search box is worked and the collector has the trawler in company, and both are steaming west with the crew aboard. The search is over; the negotiation starts.
StageIntel=NAN HAI 24 classified: the Okean hull with her nets stowed and eleven people on deck who are not fishermen. She is holding for the collector. Get the flagship alongside before it arrives.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
