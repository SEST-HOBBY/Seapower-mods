[Language_en]
Name=Southern Reach 05 - Empty Horizon
Description=THE SOUTHERN OCEAN, 56 South, mid-morning. The protection group's command element - a frigate, a corvette, the research trawler NAN HAI 27 and whatever is keeping them fuelled - has been south of the fishing fleet for a week, and every report of it is a fishing master's word.\n\nSENTRY 22 is high and BLUEFIN 32 is under the cloud, both out of Hobart, both with the fuel for one look. The fleet is three factory trawlers, a Russian oiler that visits it, and the expedition ship POLAR HORIZON coming home to the west of them.\n\nClassify the frigate and the corvette, then recover the Triton to the point north. The frigate's missiles reach forty miles and nobody has fired at an aircraft yet; you are not going to be the first. Nothing here is a target. The picture is the mission.
Objective_Picture=Classify the frigate and the corvette
Objective_Recover=Then bring Sentry 22 to the recovery point north
Objective_Sentry=Do not lose the Triton
Objective_Bluefin=Do not lose the Poseidon
Objective_Neutrals=Harm no trawler, cruise ship or whale
Taskforce1StartMessage=<color=yellow>Empty Horizon</color>|THE SOUTHERN OCEAN, 56 South, mid-morning. The protection group's command element - a frigate, a corvette, the research trawler NAN HAI 27 and whatever is keeping them fuelled - has been south of the fishing fleet for a week, and every report of it is a fishing master's word.\n\nSENTRY 22 is high and BLUEFIN 32 is under the cloud, both out of Hobart, both with the fuel for one look. The fleet is three factory trawlers, a Russian oiler that visits it, and the expedition ship POLAR HORIZON coming home to the west of them.\n\nClassify the frigate and the corvette, then recover the Triton to the point north. The frigate's missiles reach forty miles and nobody has fired at an aircraft yet; you are not going to be the first. Nothing here is a target. The picture is the mission.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The Triton is at the recovery point with the group's command element classified and on file. Ward: 'That is the whole south on one plot. Now bring the aeroplane home.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Sentry 22 is down at 56 South. Everything south of the fleet is a fishing master's word until March.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|Sentry 22 is down at 56 South. Everything south of the fleet is a fishing master's word until March.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The Triton is at the recovery point with the group's command element classified and on file. Ward: 'That is the whole south on one plot. Now bring the aeroplane home.'
TimeoutMessage=<color=red>Out of time.</color>|Fuel. Both aircraft turn for Hobart with the frigate still a contact and the corvette still a rumour.
StageIntel=Sentry 22 has them: a Type 054A and a Type 056A holding station south of the fleet with the collector in company. The command element has a class. Bring the Triton north.
SR01ShadowNamedIntel=Storm Bay's picture from the sixth: the research trawler you named there is with the command element, and she is on your plot as a classified contact. Where she is, the frigate is.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
