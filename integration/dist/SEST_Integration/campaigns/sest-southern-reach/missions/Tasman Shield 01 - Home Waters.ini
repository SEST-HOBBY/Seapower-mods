[Language_en]
Name=Tasman Shield 01 - Home Waters
Description=THE FIORDLAND APPROACHES, 46 South, morning. The task group is twenty-five miles off Puysegur Point in the busiest water it has seen since Sydney: two cruise ships bound for Milford Sound, the Bluff cray fleet on the grounds, a longliner, the Fisheries New Zealand patrol vessel, and the Invercargill-Queenstown service overhead.\n\nMV AUSTRAL COMPLIANCE, the Austral Meridian Services tender that followed the protection group north, is thirty miles south-west broadcasting closed grounds on the fishing channels. NAN HAI 27, the group's intelligence collector since October, is somewhere east of her, between her and the Solanders. A conventional submarine, contact TANGO, is reported twenty miles south-west of you, heading away from the traffic; monitor the report without abandoning the surface patrol.\n\nKIWI 05 is out of Invercargill with the New Zealand picture. Your own Seahawk and Poseidon fly, and an Arafura sails for the inshore work, if they were assigned at Sydney. Classify the tender - her radars, her signals, her name on the stern - then hold the patrol line to the south-west. The opposing formation is reported under restrictive engagement orders; your own orders also remain restrictive. The cray boats do not move for warships.
Objective_Tender=Classify MV Austral Compliance, then hold the patrol line to the south-west
Objective_Boat=Classify the submarine reported to the south-west
Objective_Traffic=Harm no cruise ship, fishing boat, patrol vessel or aircraft
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>Home Waters</color>|THE FIORDLAND APPROACHES, 46 South, morning. The task group is twenty-five miles off Puysegur Point in the busiest water it has seen since Sydney: two cruise ships bound for Milford Sound, the Bluff cray fleet on the grounds, a longliner, the Fisheries New Zealand patrol vessel, and the Invercargill-Queenstown service overhead.\n\nMV AUSTRAL COMPLIANCE, the Austral Meridian Services tender that followed the protection group north, is thirty miles south-west broadcasting closed grounds on the fishing channels. NAN HAI 27, the group's intelligence collector since October, is somewhere east of her, between her and the Solanders. A conventional submarine, contact TANGO, is reported twenty miles south-west of you, heading away from the traffic; monitor the report without abandoning the surface patrol.\n\nKIWI 05 is out of Invercargill with the New Zealand picture. Your own Seahawk and Poseidon fly, and an Arafura sails for the inshore work, if they were assigned at Sydney. Classify the tender - her radars, her signals, her name on the stern - then hold the patrol line to the south-west. The opposing formation is reported under restrictive engagement orders; your own orders also remain restrictive. The cray boats do not move for warships.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The tender is named, the line is held, and nobody in Fiordland lost a boat. Rewi: 'That is how you are welcome here.'
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|The Fiordland patrol has failed. Report the losses and last confirmed contacts to Wellington before another patrol is assigned.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|The Fiordland patrol has failed. Report the losses and last confirmed contacts to Wellington before another patrol is assigned.
Taskforce2DefeatMessage=<color=red>Command report.</color>|The tender is named, the line is held, and nobody in Fiordland lost a boat. Rewi: 'That is how you are welcome here.'
TimeoutMessage=<color=red>Operational window closed.</color>|Sixty-five minutes and the tender is still a shape on the horizon with the cray fleet between you. She keeps her anonymity for whatever she is here to meet.
StageIntel=IDENTIFICATION REPORT | AUSTRAL COMPLIANCE classified: the Austral Meridian Services coaster reported with the protection group. Its emissions and registration have been recorded for comparison with later contacts. Hold the patrol line south-west of the traffic. Classification alone does not authorise an attack.
SR12NetworkNamedIntel=FUSION CELL | The 14 January identification of NAN HAI 27 matches the collector reported east of AUSTRAL COMPLIANCE. The contact is classified on the plot. Its association with Austral Meridian Services is assessed; the contents of its current transmissions are unconfirmed.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. Command has suspended the operation. Preserve the contact and engagement records.
