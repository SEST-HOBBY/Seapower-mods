[Language_en]
Name=Southern Reach - Tasman Shield (Royal Australian Navy)
Description=SOUTHERN REACH - and its second chapter, TASMAN SHIELD. One continuous Task Force campaign, December 2028 to March 2029, following Southern Watch south: twelve missions escort the Antarctic resupply season through the Southern Ocean - Storm Bay, the Macquarie Ridge, the ice edge - where contacts are sparse, the weather sets the force you have, and identifying a trawler is most of the work; then twelve more defend the homeland approaches with the same worn force - Fiordland, Cook Strait, the Tasman, Bass Strait, the Bight - among ferries, tankers, rigs and cable routes. Australia and New Zealand carry the story; allied support is bounded and named. Fiction throughout. Needs the Steam Workshop mods in this pack's REQUIRED-MODS.txt; the campaign's own folder carries its narrower closure.

