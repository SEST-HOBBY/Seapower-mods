; SEST's own Anchor Chain plugin, matched to the inspected Sea Power 0.8.7 build (261021) only.
; On any other build it stays inactive whatever these options say.
; Restart the game after changing these. Native behavior is retained on failure.
[Runtime]
TowedSensorGuard=1
CampaignCombatCosts=1
CombatCostInventories=1
CumulativeCombatCosts=1
TerrainClearance=1
TaskForceDebrief=1
PreparationMap=1
; Beta runtime (1.5.2 beta, Build 261026) only; the 261021 plugin ignores these.
; Both default to 1 when the key is missing. ModifierRegistry rescans the
; game's #!extend files once the Workshop folders are registered;
; HideVersionWatermark hides the beta's own build text over the game view.
ModifierRegistry=1
HideVersionWatermark=1
