# (Wikipedia, Nanuchka-class corvette): Shtil', Aysberg, Mirazh, Rassvyet,
# Zyb', Geyzer, Passat, Livien', Smerch, Iney, Moroz and Razliv. Burun,
# Vyetyer, Tucha, Uragan, Priboy, Priliv and Meteor, decommissioned by 2005,
# and Perekat, never completed, would carry a fit they never had: those
# sections stay Soviet. Only Nation is set, on the sections named below;
