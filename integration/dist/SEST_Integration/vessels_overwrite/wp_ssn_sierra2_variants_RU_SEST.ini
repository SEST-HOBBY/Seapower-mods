#!extend vessels/wp_ssn_sierra2_variants.ini
# SEST Collection Fixes - wp_ssn_sierra2: the Russian Federation, not the
# USSR.
# Russian Submarines (3468260539) registers it Soviet. Registered here to
# the game's Russia key (Russian Federation in this pack's
# language_en/nations.ini): B-336 Pskov, the Sierra II launched after 1991
# (Wikipedia, Sierra-class submarine): laid down on 29 June 1989, launched
# on 28 July 1992 and commissioned on 17 December 1993. [Default] (the
# class, ServiceDate 1990) and B-534 Nizhny Novgorod, launched on 8 July
# 1989 and commissioned in 1990, stay Soviet. Only Nation is set, on the
# sections named below; every other key, the file and its credit stay the
# author's.
# The sections with no Nation below are listed empty, in the file's order,
# only so the game keeps the author's variant order: it reads this file
# first, and the Mission Editor saves a variant by its place in that order.
# An empty header sets nothing.

[Default]

[Variant1]

[Variant2]
Nation=Russia
