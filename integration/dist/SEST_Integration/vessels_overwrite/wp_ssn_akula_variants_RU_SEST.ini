#!extend vessels/wp_ssn_akula_variants.ini
# SEST Collection Fixes - wp_ssn_akula: the Russian Federation, not the
# USSR.
# Russian Submarines (3468260539) registers it Soviet. Registered here to
# the game's Russia key (Russian Federation in this pack's
# language_en/nations.ini): the seven Akulas launched after 1991 (Wikipedia,
# Akula-class submarine): K-328 Leopard (1992), K-154 Tigr (1993), K-157
# Vepr, the Akula II (1994), K-419 Kuzbass (1992), K-335 Gepard, the Akula
# III (1999), K-295 Samara (1994) and K-152 Nerpa (2006). [Default] (the
# class, from 1984) and the eight boats launched by 1991, K-461 Volk (June
# 1991) the last, stay Soviet, as do Kuguar, Rys and Irbis, never completed.
# Only Nation is set, on the sections named below; every other key, the file
# and its credit stay the author's.
# The sections with no Nation below are listed empty, in the file's order,
# only so the game keeps the author's variant order: it reads this file
# first, and the Mission Editor saves a variant by its place in that order.
# An empty header sets nothing.

