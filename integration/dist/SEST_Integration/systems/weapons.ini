# SEST Collection Fixes - systems/weapons.ini. systems/ files merge section
# by section across the load order, and the SEST pack sits on top, so each
# section here is the one the game reads. Two kinds:
#   restored  the game's own 0.8.3 text for a section that four aircraft
#             mods' stale copies of the whole file otherwise shadow
#             (STALE_VANILLA_COPIES in build_patch.py);
#   retuned   a mod's CIWS moved onto the 0.8.3 burst model
#             (CIWS_RETUNE in build_patch.py), its own values kept
#             wherever the model did not change them.

