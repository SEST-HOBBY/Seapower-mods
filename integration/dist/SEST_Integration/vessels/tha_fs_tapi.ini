[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.3
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.18

Length=83.8                    // in meters
Beam=10.1                       // in meters

CompartmentsHeight=0.04       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=Medium

FrontalArea=147
SideArea=805
BottomArea=680
[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1191               // in tons

MaxForwardVelocity=20          // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=3
MinAccelerationFactor=0.2

RudderTurnRate=2.5             // turn rate of the rudder in degrees per second
RudderForce=0.4                // multiplicator defining how agile the ship can turn

#TiltFactor=-2.0                // defines how strong the tilting will be, negative means it turns into the direction of turning
TiltFactor=1.4
PitchFactor=-2.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-1                 	// default trim depth in feet
TrimAngle=0               		// default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.01,0          // center of mass for physics
CavitationSpeed=3		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=9.5  // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium
# Sonar related
BaseNoise=155                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10               // additional noise for cavitation in db
BladesCount=4					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=0
#AnimationFile_1=animations_ins_ptg_aliya
#AnimationFile_2=animations_gabriel   //probably not needed

[---------- AI related ----------]
[AI]
UnitCostValue=100            // value for the unit cost for least valuable target checks
UnitScoreValue=2              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=Small
ASuW_Capability=Small
ASW_Capability=

#Defence
MissilesToSaturate=2      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD    //Anti-Missile Defence
HasChaff=True
ATD_Capability=TBD      //Anti-Torpedo Defence

#Special
Role=FAC

