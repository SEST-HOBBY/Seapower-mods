[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.15

Length=110                    // in meters
Beam=10                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=6180              // in tons

MaxForwardVelocity=34.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=20.0
MaxBackwardVelocitySurfaced=3.0
MaxBackwardVelocity=7.0        // sets the max backward velocity
TelegraphVelocities=-7,0,5,10,15,22,34

CavitationParameters=8,-40
BowUnderWater=19.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=40.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=6.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.8                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.5
MaxRollAngle=30.0
RollChangeRate=6.0

BallastTankChangeRate=0.0005  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=7.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=0                 // default trim depth in feet
TrimAngle=0                 // default base trim angle (x-axis, so pitch)
#TrimAngle=-0.1                 // default base trim angle (x-axis, so pitch)
CenterToKeelDist=-0.068        // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=50.0            // in feet
CrushDepth=1400.0              // in feet

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
BaseNoise=120                  // base sound level in db at 1m distance
FlowNoise=0.80                    // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=17             // additional noise for cavitation in db
TargetReflectionStrength=18    // in dB for broad side
BladesCount=7                  //number of blades on vessel's propulsion systems
ElectricFrequency=60           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usn_ssn_los_angeles_flt2_3

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
AAW_Capability=0
ASuW_Capability=10
ASW_Capability=8

#Defence
#Special
Role=SSN

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
Collider=coll_cic
ModuleType=CIC

[MainPowerSystem]
############################################################
# Main Power System (engine room, boiler, reactor)
############################################################
