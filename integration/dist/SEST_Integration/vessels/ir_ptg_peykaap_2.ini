[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=0.75
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.02

Length=13                      // in meters
Beam=2.7                       // in meters

CompartmentsHeight=0.02        //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=14                 // in tons
IntegrityOverride=1
HorsePower=2400                // relevant for the acceleration

MaxForwardVelocity=52.0        // sets the max forward velocity
MaxBackwardVelocity=4.0        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=15
MinAccelerationFactor=0.2

RudderTurnRate=10.0            // turn rate of the rudder in degrees per second
RudderForce=2.0                // multiplicator defining how agile the ship can turn

#TiltFactor=-2.0                // defines how strong the tilting will be, negative means it turns into the direction of turning
TiltFactor=-0.2
PitchFactor=-4.0                // defines how strong the pitch will be based on speed and acceleration
LiftFactor=0.1
LiftVelocityInKnots=10,20

MaxSeaStateForPitchAndLift=4

TrimDepth=0.0                  // default trim depth in feet
TrimAngle=-1.0                 // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

CenterOfMass=0,-0.00,0          // center of mass for physics

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=155                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=4					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=0
#AnimationFile_1=


