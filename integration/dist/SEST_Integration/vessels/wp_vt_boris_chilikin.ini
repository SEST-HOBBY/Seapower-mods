AmmoLoadSpeed=80              // Ammo points per second, per target
AmmoCapacity=200000           // Ammo points
MaxAmmoPoints=13000           // Rounds costing more than this are refused outright
SupplyRange=0.5               // In nautical miles
MaxTargets=2                  // Simultaneous receivers, each at the full load speed
MaxOwnVelocity=13             // In knots. Above this replenishment is impossible
MaxTargetVelocity=16          // In knots. Above this replenishment is impossible
