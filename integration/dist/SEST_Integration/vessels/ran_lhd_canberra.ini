[---------- General Data ----------]

[General]
UnitType=Vessel
DefaultCameraDistance=3.75
MinCameraDistanceForeAft=1.8
MinCameraDistanceBroadside=0.9
CameraPivotHeight=0.25

Length=231								// In meters
Beam=32									// In meters

CompartmentsHeight=0.25					// Governs bouyancy compartment height and also missile aimpoint
ArmorType=Minor							// None

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
