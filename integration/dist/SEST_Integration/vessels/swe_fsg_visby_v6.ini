[General]
UnitType=Vessel
DefaultCameraDistance=2.0
MinCameraDistanceForeAft=1.0
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.15

Length=72.7                     // in meters
Beam=10.4                      // in meters

CompartmentsHeight=0.05        // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None
NumberOfDCTeams=1

[---------- FlightDeck Definitions ----------]
[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
// all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=640                 // in tons

MaxForwardVelocity=36.0         // sets the max forward velocity
MaxBackwardVelocity=7.0         // sets the max backward velocity
LinearDrag=0.968                // this is for velocity damping (linear drag)
MaxAccelerationFactor=1.63
MinAccelerationFactor=0.1

RudderTurnRate=7.0            // turn rate of the rudder in degrees per second
RudderForce=0.9                // multiplicator defining how agile the ship can turn

TiltFactor=0.6
PitchFactor=-4.0               // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0                  // default trim depth in feets
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.01,0          // center of mass for physics

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=13.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=100
# Sonar related
BaseNoise=105                   // base sound level in db at 1m distance
FlowNoise=0.60                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=2.5             // additional noise for cavitation in db
BladesCount=0					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=7 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

MachineryRaftingGeneration=5
PropellerType=Pumpjet
NoiseFrequencies=LF,MF
TonalRPMModifier=100
DistinctiveNoise=False
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset
LowMagneticHull=True

