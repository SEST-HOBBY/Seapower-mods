# ae_ao_teide
# ver. 20260818
#

[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.6
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.2

Length=117.5							// In meters
Beam=14.8								// In meters

NumberOfDCTeams=1
CompartmentsHeight=0.06					// Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[---------- AI related ----------]
############################################################
# AI related values
############################################################
[AI]
UnitCostValue=4000						// Value for the unit cost for least valuable target checks
UnitScoreValue=4						// Value for calculation of mission score

#Sensors
Radar_Capability=1
Sonar_Capability=0
AirRecon_Capability=0

#Offence
AAW_Capability=0
ASW_Capability=0
ASuW_Capability=0

#Defence
MissilesToSaturate=4					// AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1					// AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=0						//Anti-Missile Defence
ATD_Capability=0						//Anti-Torpedo Defence

#Special
Role=RAS

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=8190						// In tons

MaxForwardVelocity=12					// Sets the max forward velocity
MaxBackwardVelocity=5.0					// Sets the max backward velocity
LinearDrag=0.96							// This is for velocity damping (linear drag)
MaxAccelerationFactor=0.2
MinAccelerationFactor=0.1

RudderTurnRate=5.0						// Turn rate of the rudder in degrees per second
RudderForce=1.0							// Multiplicator defining how agile the ship can turn

TiltFactor=0.8							// Defines how strong the tilting will be
PitchFactor=0.0							// Defines how strong the pitch will be based on speed and acceleration

TrimDepth=6								// Default trim depth in feet
TrimAngle=0.0							// Default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0					// Distance from the center of the mesh to the keel in Unity units
CavitationSpeed=3		 	  			// Defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.4								// Density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0						// Drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0						// Drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=9.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium
# Sonar related
BaseNoise=170							// Base sound level in db at 1m distance
FlowNoise=1.4							// Additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10						// Additional noise for cavitation in db
BladesCount=4							// Number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=3		// In dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50					// In Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

