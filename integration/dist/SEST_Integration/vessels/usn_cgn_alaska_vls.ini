[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.8
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.24

Length=216.1                     // in meters
Beam=23.3                        // in meters

CompartmentsHeight=0.12        //Governs bouyancy compartment height and also missile aimpoint
ArmorType=Heavy

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=17500	           // in tons

MaxForwardVelocity=33.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.53
MinAccelerationFactor=0.1

RudderTurnRate=2.5             // turn rate of the rudder in degrees per second
RudderForce=0.6                // multiplicator defining how agile the ship can turn

TiltFactor=1.6                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=2.0                  // default trim depth in feet
TrimAngle=0.3                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=5		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=15.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge
# Sonar related
BaseNoise=155                    // base sound level in db at 1m distance
FlowNoise=1                      // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10               // additional noise for cavitation in db
BladesCount=5                    // number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 // in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             // in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
Prairie=True                     // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset
MachineryRaftingGeneration=2

[Animations]
NumberOfAnimationReferences=2
AnimationFile_1=animations_usn_cgn_alaska
AnimationFile_2=animations_usn_mk_41_vls

[---------- AI related ----------]
[AI]
UnitCostValue=5000            // value for the unit cost for least valuable target checks
UnitScoreValue=7              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=6
ASuW_Capability=6
ASW_Capability=6

#Defence
MissilesToSaturate=16        //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=2        //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD          //Anti-Missile Defence
ATD_Capability=TBD          //Anti-Torpedo Defence
HasChaff=True

#Special
Role=AAW,ASuW,ASW

[TaskForce]
TaskForceCost=55
LoadoutCost_Late=10

