 [---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.6
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.2

Length=151.18                     // in meters
Beam=19.81                        // in meters

CompartmentsHeight=0.1         // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None
NumberOfDCTeams=3

#HideIn=Encyclopedia,MissionEditor,Signatures

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab,bridge_binocular_eoss_stab_thermal
DefaultView=binocular_7x50

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=7291              // in tons

MaxForwardVelocity=31.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.0
MinAccelerationFactor=0.2

RudderTurnRate=7.5             // turn rate of the rudder in degrees per second
RudderForce=0.95                // multiplicator defining how agile the ship can turn

TiltFactor=1.5               // defines how strong the tilting will be
PitchFactor=0.0               // defines how strong the pitch will be based on speed and acceleration

TrimDepth=3.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=13.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=900
# Sonar related
BaseNoise=136                   // base sound level in db at 1m distance
FlowNoise=0.8                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=4               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
MachineryRaftingGeneration=4
PropellerType=Skewback
NoiseFrequencies=LF,MF
TonalRPMModifier=100
DistinctiveNoise=False
Prairie=True 					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset

[Animations]
NumberOfAnimationReferences=3
AnimationFile_1=animations_usn_ffg_constellation
AnimationFile_2=animations_NSM_launcher
AnimationFile_3=animations_usn_mk_41_vls

