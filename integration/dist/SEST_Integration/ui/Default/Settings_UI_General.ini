; SEST Collection Fixes: 3779799226's copy (the load-order winner) with
; 16 [NationFlags] entries added at the end of that section.
; Settings_UI_General.ini - Operation STEADFAST LANTERN
;
; Registers the Nordverband so the flag beside a ship's name matches the
; ensign on its mast. [NationFlags] maps a unit's Nation= onto the panel
; icon; a name that is not in this list gets the built-in flag_missing and
; the engine never even looks for a file - which is why nothing appears in
; the log when it happens.
;
; This is a UNION of every Settings_UI_General.ini in the install (base game
; plus the flag-carrying Workshop packs), so it cannot cost another mod its
; nations whichever copy the engine ends up using. Base-game entries take
; precedence; only 'nordverband' is genuinely new.
;
; Art: ui/bottom/flag_nordverband.png (panel)
;      ships/materials/textures/flag_nordverband.png (mast, 32x32)

