[Language_en]
Name=SEST Banda - Warramunga's Shot
Description=TIMOR SEA. A red surface action group is working south-west out of the Sunrise field, screening the second sanctioned convoy. You are WARRAMUNGA, alone, 60 nautical miles on their disengaged bow with the weather in your favour and a full deck-launcher load of Naval Strike Missile.\n\nThis is a shooting problem, not a fair fight. The NSM outranges anything they can answer with, but only while they do not know where you are: your own radar is the thing most likely to tell them. The Seahawk is the other way to find them. Get a solution, take the shot, and be somewhere else when the counter-battery arrives.
Objective_Escort=Sink the armed escort
Objective_Lifts=Stop the sanctioned lifts
Objective_Warramunga=Survive
Taskforce1StartMessage=<color=yellow>Warramunga's Shot</color>|TIMOR SEA. A red surface action group is working south-west out of the Sunrise field, screening the second sanctioned convoy. You are WARRAMUNGA, alone, 60 nautical miles on their disengaged bow with the weather in your favour and a full deck-launcher load of Naval Strike Missile.\n\nThis is a shooting problem, not a fair fight. The NSM outranges anything they can answer with, but only while they do not know where you are: your own radar is the thing most likely to tell them. The Seahawk is the other way to find them. Get a solution, take the shot, and be somewhere else when the counter-battery arrives.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The escort is gone and the convoy is naked. NSM works when nobody sees you coming.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|WARRAMUNGA lost. They found you first.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|WARRAMUNGA lost. They found you first.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The escort is gone and the convoy is naked. NSM works when nobody sees you coming.
NeutralLossMessage=<color=orange>Neutral vessel hit.</color>|A neutral crew is in the water. That will be on the record.
