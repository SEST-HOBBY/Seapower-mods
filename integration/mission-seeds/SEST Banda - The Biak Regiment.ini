[Language_en]
Name=SEST Banda - The Biak Regiment
Description=BIAK, 0430. A Russian S-400 regiment sits on the airfield with its big radar up, and while it is up nothing allied flies the northern route. The airfield has a modern fighter regiment on it as well.\n\nYou have Growlers and Eagles out of the forward field. The Growler's jamming buys you the approach, not the kill: the HARM shot has to come from inside the engagement envelope, which is the whole problem with a 40N6. Pull the radar off the air, put the launchers down, and get the package home. Losses here are measured in aircraft you do not get back for the rest of the campaign.
Objective_SAM=Destroy the S-400 site
Objective_Field=Crater the airfield
Objective_Package=Bring the package home
