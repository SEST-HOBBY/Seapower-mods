Name=SEST RAAF Wedgetail
Description=Defines the E-7A Wedgetail's real operating squadrons (No. 2 Squadron and No. 42 Wing RAAF, No. 8 Squadron RAF, Turkish 131 Filo and the ROKAF 51st Air Control Group). Upstream ships a Default squadron only, so any mission asking for SquadronReference=Squadron1 fails to resolve. Squadrons differ by nation rather than livery because the mod carries no alternative skin textures. Requires the E-7A Wedgetail mod and must sit ABOVE it.

