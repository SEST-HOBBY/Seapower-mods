[Language_en]
Name=SEST A-10C+
Description=A selectable upgraded A-10C as a new unit beside the standard one. The A-10C mod ships a Litening targeting pod and an AN/AAQ-28 laser designator in its own systems file that no aircraft ever uses - and its Warthog's hardpoint names a SensorSystem5 the aircraft never declares. This fits those two sensors into that slot and the one beside it so the reference resolves. It also registers the Maverick infrared head as a sensor module - it lacks ModuleType=Sensor upstream which is why the aircraft reads as having no infrared at all - corrects a squadron count of seven against two defined liveries which is the likeliest reason only one scheme appears - and upgrades every self-defence rail from AIM-9M to AIM-9X across all ten loadouts. No radar is added: the real A-10C has none and the Litening pod is the ground sensor. Requires the A-10C mod. Deploys inside the SEST Integration Pack.

