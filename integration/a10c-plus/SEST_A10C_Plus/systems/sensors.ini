# SEST A-10C+ sensors. Lifted verbatim from the A-10C mod (3459682829),
# under names nothing else defines: six mods declare [Litening] and
# [AN/AAQ-28], the highest wins the key, so referencing them by name
# binds to whichever mod outranks - not to the values tuned for here.
[SEST_A10C_FLIR]
Kind=Visual
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=2.2          // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=4           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.95            // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

[SEST_A10C_LASER]
Kind=LaserDesignator
MaxRange=20.0                       // max distance in nm
NightCapable=True                   // is the designator can be used in low-visibility conditions
TargetChannels=2                    // number of targets that can be tracked at once
WeaponChannels=1000                 // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                           // Field of View of the designator

