[Language_en]
Name=SEST Allied Fixes
Description=Small allied corrections: the P-8's anti-ship fit pointed at a Harpoon no mod defines (loaded empty), HMS Ocean could not operate the Apache AH1 her sister hulls already support, the RNZAF and ROKN P-8 squadrons named nations the game has no flag for, and the A-10C's infrared head was never registered as a sensor module while its squadron file declared seven squadrons against two defined liveries. Also SEST's AGR-30 Redback - an infrared fire-and-forget 70mm guided rocket, 30 nm, a boost then a low cruise - as a SEST_REDBACK fit on the Apaches, the A-10s, the MQ-9s, the Seahawks and the RAAF Hornets.

