# SEST RQ-7 field team. Model and launch/recovery layout from
# FallschimJager705, Small and Medium-Sized UAV Series (3601891050).
# Uses the subscribed mod's dronesquad assets; no mesh is redistributed.

[General]
UnitType=LandUnit

LandUnitSubType=Airbase //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DisplayClassName=RQ-7 field detachment
DefaultCameraDistance=0.15
MinCameraDistanceForeAft=0.08
MinCameraDistanceBroadside=0.08
CameraPivotHeight=0.02

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=30  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=5              // value for calculation of mission score
Role=Airfield

[SensorData]
#Visual
VisualIdentificationRange=20.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=tiny
# Radar related (RCS => radar cross section)
RCS=tiny

[---------- FlightDeck Definitions ----------]
[AirGroup]
usn_rq7705=Squadron1,2
[FlightDeck]
AircraftCapacity=3
NumberOfElevators=1
NumberOfLaunchPoints=1
NumberOfRecoveryPoints=1
NumberOfTaxiPaths=2

ForwardsTaxiVelocity=15	//15
BackwardsTaxiVelocity=-10
SlowTaxiVelocity=10	//6

LaunchDelay=1
LandingWhileLaunching=True

#HoldWaypoints=0.5,800,0|-0.75,800,1.25|-2,800,0|-0.75,800,-1.25
#LargeHoldWaypoints=3,800,0|0,800,3|-3,800,0|0,800,-3
#HoldStackSeparation=200 //In feet
#HoldEnterDistance=5     //In nautical miles. At this range hold waypoints are generated and aircraft enters hold
LandingSpeeds=45,45,20   //Hold,Circuit,Approach in knots

#LandingWhileLaunching=False
#Collider=coll_runway,coll_road,coll_hangars_1,coll_hangars_2,coll_hangar_big
Integrity=0.1

HoldStackSeparation=1000  //In feet
HoldEnterDistance=0.1     //In nautical miles. At this range hold waypoints are generated and aircraft enters hold

HelicopterHoldStackSeparation=20
HelicopterHoldEnterDistance=0.05
HelicopterInitialWaypoint=-0.05,20,0.05  //nmi,feet,nmi
AircraftSupported=usn_rq7705
[Elevator1]  #Plane Pad 1
AssociatedLaunchPoints=1
SpawnPosition=-0.066017,0.016602,0.016615
RidePosition=-0.066017,0.016602,0.016615

[LaunchPoint1] #Airstrip right
AllowedType=Plane,VTOL
Position=-0.066017,0.026602,0.066576
Rotation=0
TakeOffTime=0
CatapultLength=25

[RecoveryPoint1] #Airstrip right
AllowedType=Plane,VTOL
AssociatedElevators=1
Position=-0.066017,0.026602,0.016615
ExitPosition=-0.066017,0.026602,0.016615
Rotation=0                              // in degrees
LandingInterval=1

[ ==================== Aircraft Taxi ==================== ]
[ -------------------- Takeoff  -------------------- ]
[ ---------- Taxi to queue  ---------- ]
[TaxiPath1] #E1->TaxiPoint1
From=Elevator1
To=LaunchPoint1
IsBackwards=False

[TaxiPath2] #E2->TaxiPoint1
From=RecoveryPoint1
To=Elevator1

[ ==================== Helicopter Taxi ==================== ]
[ ---------- Takeoff  ---------- ]
[ ---------- Recover  ---------- ]
[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.02,0
ModuleType=Bridge

[---------- HitZones ----------]
[HitZones]
NumberOfHitZones=2
[HitZone1]
Collider=coll_hitbox
Integrity=15 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
Collider=coll_collider
Integrity=15 //the number of hit points substracted from the overall damage points count when the system is destroyed

[--------------------------- Target Points definitions ---------------------------]
[TargetingData]
NumberOfTargetPoints=2

TargetPointPosition1=0,0.017,-0.0023
TargetPointAssociatedSystems1=HitZone1
TargetPointPriority1=High

TargetPointPosition2=0,0.003,-0.0023
TargetPointAssociatedSystems2=HitZone2
TargetPointPriority2=Medium


[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=0

[---------- WeaponMagazines ----------]
[--------------------------- Mesh definitions ---------------------------]
[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=assets/models/scenery/
ResourcesRoot=dronesquad.obj
ResourcesMesh=squad
ResourcesMaterial=squad_mat.ini

[Submodels]
SubModel1=net

[net]
Mesh=net
Material=net_mat.ini
Position=0,0.0,0

[---------- Effects ----------]
[Particles]
SmallFireEffectClass=SmallShipFire	//SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.01742,-0.0023
Rotation=0,0,0
Scale=0.04,0.035,0.07
Layer=Default

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default
