sest_agr-30=AGR-30,Redback,GFFAR,What-if evolution of the 70mm guided rocket family: the AGR-30 Redback replaces the APKWS II laser kit with an imaging-infrared seeker for fire and forget out to 30 nautical miles. A rocket boost then a sustained cruise at about 600 knots - low and terrain following like the NSM - to a target at sea or ashore. Same airframe and warhead as the APKWS II.
