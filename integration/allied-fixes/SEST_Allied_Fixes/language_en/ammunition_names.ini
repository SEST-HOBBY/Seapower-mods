[AmmunitionNames]
sest_apkws_er=M282ER,APKWS II-ER,GFFAR,Extended-range development of the AGR-20 APKWS II laser-guided 70mm rocket. An uprated motor stretches the launch envelope from 3.5 to 8 nautical miles - a medium-range precision strike round at rocket cost. Same guidance kit and warhead as the M282.
sest_agr-30=AGR-30,Redback,GFFAR,What-if evolution of the 70mm guided rocket family: the AGR-30 Redback replaces the APKWS laser kit with an imaging-infrared seeker and a datalink - fire and forget out to 15 nautical miles. A boosted motor lofts it to 20000 ft for a steep terminal dive onto the target. Same airframe and M282 warhead; missile performance at rocket cost.
