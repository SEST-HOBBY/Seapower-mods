sest_agr-30=AGR-30,Redback,GFFAR,What-if evolution of the 70mm guided rocket family: the AGR-30 Redback adds active terminal homing and radio midcourse retargeting out to 30 nautical miles. A ten-second motor and loft to approximately 2 km precede a gradual slowdown toward 150 knots. The final descent is tuned for roughly 45 degrees against surface targets, with a 220-knot terminal speed target. This is an experimental game profile. Eligible against aircraft, drones, ships and land targets. Its slow cruise is intended for surface targets and slow aircraft. Same airframe and warhead as the APKWS II.
