sest_agr-30=AGR-30,Redback,GFFAR,What-if evolution of the 70mm guided rocket family: the AGR-30 Redback adds active terminal homing and radio midcourse retargeting out to 30 nautical miles. A six-second motor burn and a loft to approximately 2 km precede a 150-knot cruise and terminal dive. Eligible against aircraft, drones, ships and land targets. Its slow cruise is intended for surface targets and slow aircraft. Same airframe and warhead as the APKWS II.
