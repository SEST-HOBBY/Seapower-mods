sest_agr-30=AGR-30,Redback,GFFAR,What-if evolution of the 70mm guided rocket family: the AGR-30 Redback adds fire-and-forget active radar homing out to 30 nautical miles, its seeker searching from 2 nautical miles out. It leaves the pod hard, climbs to approximately 2 km under a ten-second motor flame and slows steadily to a 150-knot cruise. The final descent is tuned for roughly 45 degrees against surface targets, with a 220-knot terminal speed target. This is an experimental game profile. Eligible against aircraft, drones, ships and land targets. Its slow cruise is intended for surface targets and slow aircraft. Same airframe and warhead as the APKWS II.
