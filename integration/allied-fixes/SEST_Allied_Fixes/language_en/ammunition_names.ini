sest_apkws_er=M282ER,APKWS II-ER,GFFAR,Extended-range development of the AGR-20 APKWS II laser-guided 70mm rocket. An uprated motor stretches the launch envelope from 3.5 to 8 nautical miles - a medium-range precision strike round at rocket cost. Same guidance kit and warhead as the M282.
