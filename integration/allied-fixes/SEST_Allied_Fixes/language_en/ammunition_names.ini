sest_agr-30=AGR-30,Redback,GFFAR,What-if evolution of the 70mm guided rocket family: the AGR-30 Redback replaces the APKWS II laser kit with an imaging-infrared seeker for fire and forget out to 30 nautical miles. A rocket boost, then a sustained cruise at about 600 knots in a shallow climb and a dive onto the target. Built from the counter-drone APKWS, it takes aircraft and drones first, ships and land targets second. Same airframe and warhead as the APKWS II.
