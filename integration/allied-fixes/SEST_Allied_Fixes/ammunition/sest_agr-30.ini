# SEST AGR-30 Redback - fictional 30 nm guided rocket.
# Ten-second flame / run-up toward 450 kt / straight-line bleed to a 150 kt climb and cruise / 220 kt terminal target.
# 2 km loft and 1.1 horizontal NM dive start approximate a 45-degree surface attack.
# Active radar seeker, fire and forget: no carrier guidance channel needed. Playtest required.
[General]
Type=Missile                        // can be Projectile, Missile, RBU, ASROC, Torpedo,AerialRocket,MLRS
TargetType=ASuW
SecondaryTargetType=AAW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=14                                // in kg. Used for aircraft
AmmoPoints=20                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=2
Power=5
ImpactSize=Small                    // Impact size, can be small, medium, large, verylarge
Penetration=Minor                       // can be minor, moderate, heavy, always
FuzeType=1
FuzeProximityDistance=0.5              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.95                  // Base chance to hit

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=0  // fire and forget: needs no guidance channel on the carrier (23 Oct 2026)
InitialFlightPhaseDuration=0.5           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
#AxialRotation=180                      // In degrees per second. Doesnt work when "SupportsBanking" is true
#========================================= Launch stats ============================================================
MaxLoftAngle=35.0
MaxLoftAlt=6562  // feet: approximately 2 km
MaxLoftVelocity=150  // climb and cruise speed target, knots

TerminalApproachDist=2.0  // seeker on 2 NM out, after the 2 km climb (23 Oct 2026)
TerminalAlt=Maintain
TerminalDiveDistance=1.1
TerminalVelocity=220  // legacy terminal phase target, knots
IgnoreHeightDifferenceForTargetDist=True
MaxVelocity=450  // launch run-up speed target, knots
ApplyKinematics=False
MaxFlightTime=1500
TimeLimited=True
MaxTurnRate=20.0  // soften the nose-over while retaining target correction
AccelerationTime=6  // the game's default: the motor also works when an aircraft fires it
Acceleration=12  // about 275 kt/s run-up
Deceleration=0.25  // about 4.8 kt/s bleed to the 150 kt cruise (23 Oct 2026)
SustainerAccelerationTime=10  // the flame's ten seconds
SustainerAcceleration=8

MinLaunchRange=0.16                    // Minimum launch range in nautical miles
MaxLaunchRange=30                      // Maximum launch range in nautical miles

MinLaunchAltitude=0                  // Minimum launch altitude in feet.
MaxLaunchAltitude=20000                 // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=0.2             // Circular error radius in meter
#Homing
IsRearAspectOnly=False                  // Rear aspect ammunition can lock on targets from their rear cone only
SeekerFOV=60                            // Seeker field-of-view in degrees
SeekerGimbalFOV=120                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=0
SeekerActiveRange=35
SeekerGain=50
Frequency=Ka-Band
PeakPower=11.0
MinAttackAltitude=0
MaxAttackAltitude=20000
SeekerReliability=0.99
TargetMemory=True
Retargetable=True
SelfDestructAfterTargetGone=False

#ECCM
#GravityFactor=32.0
# Torpedo related
#SelfDestruct
[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/models/weapon/ammunition/apkws/
ResourcesRoot=dts_apkws_ii.obj
ResourcesMesh=rocket
ResourcesMaterial=dts_apkws_ii_mat.ini

ResourcesMeshForLaunch=launch
ResourcesMeshSwitchTime=0.1  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion


SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.02
SustainerEffectStartTime=0

HitDefaultExplosionClass=RocketShipHitExplosion
HitShipExplosionClass=RocketShipHitExplosion
HitAirExplosionClass=RocketShipHitExplosion

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

ExplosionOverwaterSplash=effects/splashes/emitters/splash_small

############################################################
# Sounds
############################################################
#Not needed here

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043