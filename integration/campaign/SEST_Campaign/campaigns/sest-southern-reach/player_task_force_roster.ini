; SEST Southern Reach requisition roster.
; Generated by integration/campaign/build_pack.py - edit southern_reach/tables.py.
;
; Points are fictional balance values. The variant and squadron lists
; are not: each one is checked against the file that wins the load
; order, so a price can never name a fit the hull does not offer.

[AllowedVessels]
; syntax is: <unit_type>=<variant_or_squadron>,...|<points_cost>
; Arunta, Warramunga, Parramatta, Ballarat, Toowoomba and Perth; Variant1 (HMAS Anzac, decommissioned 2024) and Variant4 (Stuart, under repair after the north) stay out
ran_ffh_anzac=Variant2,Variant3,Variant5,Variant6,Variant7,Variant8|240
ran_ddg_hobart=Variant1,Variant2,Variant3|480
; on sale from the Tasman chapter only; the windows enforce it
ran_opv_arafura=Variant1|100

[AllowedAircraft]
; syntax is: <unit_type>=<variant_or_squadron>,...|<points_cost>
; 3 and 77 Squadrons, RAAF Base Williamtown - the Tasman chapter's fighter base, checked against the SEST RAAF Bases air group
raaf_f-35a=Squadron1,Squadron2|45
; Australian squadron in the SEST Growler pack's output
usn_fa-18f_blk3=Squadron8|35
; conventional EW/SEAD fits; MALICE stays out of 2029
usn_ea-18g=Squadron6|55
; No. 11 and 12 Squadrons fly the same file; Squadron3 is the RAAF livery. Squadron6 is the RNZAF one and is never sold
usn_p8=Squadron3|45
E7A_Wedgetail=Squadron1|80
; unarmed in this implementation
raaf_mq-4c_triton=Squadron1|60

[AllowedHelicopters]
; syntax is: <unit_type>=<variant_or_squadron>,...|<points_cost>
; 816 Squadron RAN; one family chosen explicitly - usn_mh-60r_26 is a different unit and is never substituted for it
usn_mh-60r=Squadron20|20

[LoadoutPrices]
; Aircraft loadouts are included in the aircraft purchase cost.
; Naval loadout presets are not advertised until they are authored
; and tested.
; ran_opv_arafura declares Containers, AntiShip, AntiAir; none is priced here.
