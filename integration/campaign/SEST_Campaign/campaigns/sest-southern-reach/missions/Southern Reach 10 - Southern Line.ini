[Language_en]
Name=Southern Reach 10 - Southern Line
Description=THE ICE EDGE, 60 South, midday. The protection group's command element has come south to the fishing fleet: the carrier, a frigate, a corvette, the research trawler NAN HAI 27, a Ka-31 over it all. It is holding station where every voyage to Casey must pass, to be seen there, and to be fired on first.\n\nThe weather at Hobart has grounded the Poseidons and the Triton, and no field in the world reaches here for anything else. Your aviation is the Seahawk. The Russian research vessel is at the ice with the trawlers, a research vessel again; and if VICTOR survived Christmas Eve she is somewhere in this line.\n\nIdentify the carrier and the collector by class and name, and withdraw north to the line. Everything red starts weapons tight. Fire on nothing that has not fired; a shot at the collector is the incident they came here to have.
Objective_Identify=Classify the carrier and the collector, then withdraw north to the line
Objective_Restraint=Do not fire on the collector
Objective_Flagship=Bring your flagship out intact
Objective_Neutrals=Harm no trawler, research vessel or whale
Taskforce1StartMessage=<color=yellow>Southern Line</color>|THE ICE EDGE, 60 South, midday. The protection group's command element has come south to the fishing fleet: the carrier, a frigate, a corvette, the research trawler NAN HAI 27, a Ka-31 over it all. It is holding station where every voyage to Casey must pass, to be seen there, and to be fired on first.\n\nThe weather at Hobart has grounded the Poseidons and the Triton, and no field in the world reaches here for anything else. Your aviation is the Seahawk. The Russian research vessel is at the ice with the trawlers, a research vessel again; and if VICTOR survived Christmas Eve she is somewhere in this line.\n\nIdentify the carrier and the collector by class and name, and withdraw north to the line. Everything red starts weapons tight. Fire on nothing that has not fired; a shot at the collector is the incident they came here to have.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The escort is north of the line with the carrier and the collector named, and nothing in the south fired first. The photographs are ours this time.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The escort is gone at the ice edge, or the incident happened. Either way the group has what it came south for.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The escort is gone at the ice edge, or the incident happened. Either way the group has what it came south for.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The escort is north of the line with the carrier and the collector named, and nothing in the south fired first. The photographs are ours this time.
TimeoutMessage=<color=red>Out of time.</color>|Sixty minutes and the escort is still in the line with the carrier a contact and no name. The group will be there tomorrow; the last voyage will not.
StageIntel=The carrier is LIAONING, and the collector is the same Nan Hai 27 that shadowed Storm Bay in December. The group has a name, a flagship and a face. Withdraw north to the line - and do not give them the shot they came for.
SR05GroupClassifiedIntel=Sentry 22's picture from Empty Horizon: the frigate and the corvette in that line are the two she classified on the eighteenth, and they are identified on your plot from the start. The carrier and the collector are not - that you still have to do.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
