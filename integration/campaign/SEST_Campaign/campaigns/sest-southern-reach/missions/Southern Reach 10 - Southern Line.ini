[Language_en]
Name=Southern Reach 10 - Southern Line
Description=THE ICE EDGE, 60 South, midday. The protection group's command element has come south to the fishing fleet: the carrier, a frigate, a corvette, the research trawler NAN HAI 27, a Ka-31 over it all. It is holding station where every voyage to Casey must pass, to be seen there, and to be fired on first.\n\nThe weather at Hobart has grounded the Poseidons and the Triton, and no alternative fixed-wing detachment is allocated within reach. Your aviation is the Seahawk. AKADEMIK FERSMAN, VICTOR's tender at Christmas, is at the ice with the trawlers, a research vessel again; and if VICTOR survived Christmas Eve she is somewhere in this line.\n\nIdentify the carrier and the collector by class and name, and pull back north to the withdrawal line. The opposing formation is reported under restrictive engagement orders. Fire on nothing that has not fired; a shot at the collector is the incident they came here to have.\n\nINTELLIGENCE: Recent satellite radar imagery gives the formation's last observed area despite cloud cover. It does not establish hull identities or continuous tracks. With the fixed-wing sorties grounded, use ship sensors and the Seahawk to identify the carrier and collector locally.
Objective_Identify=Classify the carrier and the collector, then pull back north to the withdrawal line
Objective_Restraint=Do not fire on the collector
Objective_Flagship=Bring your flagship out intact
Objective_Neutrals=Harm no trawler, research vessel or whale
Taskforce1StartMessage=<color=yellow>Southern Line</color>|THE ICE EDGE, 60 South, midday. The protection group's command element has come south to the fishing fleet: the carrier, a frigate, a corvette, the research trawler NAN HAI 27, a Ka-31 over it all. It is holding station where every voyage to Casey must pass, to be seen there, and to be fired on first.\n\nThe weather at Hobart has grounded the Poseidons and the Triton, and no alternative fixed-wing detachment is allocated within reach. Your aviation is the Seahawk. AKADEMIK FERSMAN, VICTOR's tender at Christmas, is at the ice with the trawlers, a research vessel again; and if VICTOR survived Christmas Eve she is somewhere in this line.\n\nIdentify the carrier and the collector by class and name, and pull back north to the withdrawal line. The opposing formation is reported under restrictive engagement orders. Fire on nothing that has not fired; a shot at the collector is the incident they came here to have.\n\nINTELLIGENCE: Recent satellite radar imagery gives the formation's last observed area despite cloud cover. It does not establish hull identities or continuous tracks. With the fixed-wing sorties grounded, use ship sensors and the Seahawk to identify the carrier and collector locally.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The escort has reached the northern withdrawal line with the carrier and collector identified. The report distinguishes the naval formation from nearby fishing and research traffic.
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|The escort is gone at the ice edge, or the incident happened. Either way the group has what it came south for.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|The escort is gone at the ice edge, or the incident happened. Either way the group has what it came south for.
Taskforce2DefeatMessage=<color=red>Command report.</color>|The escort has reached the northern withdrawal line with the carrier and collector identified. The report distinguishes the naval formation from nearby fishing and research traffic.
TimeoutMessage=<color=red>Operational window closed.</color>|Sixty minutes and the escort is still at the ice edge with the carrier a contact and no name. The group will be there tomorrow; the last voyage will not.
StageIntel=IDENTIFICATION REPORT | Carrier confirmed as LIAONING; collector confirmed as NAN HAI 27. Joint intelligence has accepted the identifications and updated the surface picture. Withdraw north to the line. Existing engagement restrictions remain in force.
SR05GroupClassifiedIntel=FUSION CELL | Sentry 22's frigate and corvette records from 18 December have been correlated with reporting at the ice edge. Those two escorts are identified on the plot. The carrier and collector still require local confirmation.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. Command has suspended the operation. Preserve the contact and engagement records.
