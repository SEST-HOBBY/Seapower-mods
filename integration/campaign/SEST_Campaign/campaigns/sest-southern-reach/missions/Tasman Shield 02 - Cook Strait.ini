[Language_en]
Name=Tasman Shield 02 - Cook Strait
Description=COOK STRAIT, late morning, a northerly building. CS TASMAN RELIANCE - a cable repair ship, a stand-in - is on the declared corridor twelve miles south-west of Oteranga Bay with the Tasman cable's fault under her. The corridor is a box on a chart, five miles around her: she has to be inside it when twenty-five minutes have run, and then make Wellington's approach.\n\nTwo Interislander ferries are crossing - Wellington to Picton and back - with a Marlborough fishing boat, a coastal tanker and the Wellington-Christchurch service in the same box. TANGO, the boat from Fiordland, is at periscope depth on the corridor. The Type 056A that inspected the freighters off Lyttelton is coming up from Cape Campbell, weapons tight, to do it again.\n\nYour detachment is eight miles east of the corridor. KIWI 05 is out of Ohakea. Hold the corridor, get the cable ship to the approach, classify the boat if you can. Fire on nothing that has not fired; a ferry in this strait is a thousand people.
Objective_Corridor=Tasman Reliance holds the corridor box for 25 minutes, then reaches Wellington's approach
Objective_Contact=Classify the submarine on the corridor
Objective_Ferries=The Interislander ferries are not targets
Objective_Traffic=Harm no fishing boat, tanker or aircraft
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>Cook Strait</color>|COOK STRAIT, late morning, a northerly building. CS TASMAN RELIANCE - a cable repair ship, a stand-in - is on the declared corridor twelve miles south-west of Oteranga Bay with the Tasman cable's fault under her. The corridor is a box on a chart, five miles around her: she has to be inside it when twenty-five minutes have run, and then make Wellington's approach.\n\nTwo Interislander ferries are crossing - Wellington to Picton and back - with a Marlborough fishing boat, a coastal tanker and the Wellington-Christchurch service in the same box. TANGO, the boat from Fiordland, is at periscope depth on the corridor. The Type 056A that inspected the freighters off Lyttelton is coming up from Cape Campbell, weapons tight, to do it again.\n\nYour detachment is eight miles east of the corridor. KIWI 05 is out of Ohakea. Hold the corridor, get the cable ship to the approach, classify the boat if you can. Fire on nothing that has not fired; a ferry in this strait is a thousand people.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The cable is repaired, the ferries crossed, and the corvette inspected nothing. Rewi: 'Wellington heard it on the news, which is how it should be.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The cable ship is lost in the strait, or a ferry is, and the Tasman war has its first hull.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The cable ship is lost in the strait, or a ferry is, and the Tasman war has its first hull.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The cable is repaired, the ferries crossed, and the corvette inspected nothing. Rewi: 'Wellington heard it on the news, which is how it should be.'
TimeoutMessage=<color=red>Out of time.</color>|Sixty minutes and the cable ship is still short of the approach with the corvette closing. Wellington's cable is spliced and the strait belongs to whoever is left in it.
StageIntel=The splice is made and the corridor has held. TASMAN RELIANCE is recovering her gear: bring her to Wellington's approach before the corvette is alongside her.
SR08CorvetteNamedIntel=The Gateway's picture: the corvette coming up from Cape Campbell is the one that inspected the freighters off Lyttelton, and she is on your plot classified. Her captain has done this before.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
