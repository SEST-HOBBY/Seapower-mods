[Language_en]
Name=Tasman Shield 11A - The Twelve-Mile Line
Description=OFF GREEN CAPE, 0455, dark; first light about 0620. Your detachment is off Twofold Bay on passage to Sydney, where the force is to be made ready for the relief convoy. At 2155 last night one of the protection group's Type 056A corvettes, on picket a hundred and eighty miles east-south-east of Gabo Island, left her station, turned onto 295 and stopped radiating. At 0120 a voice giving his rank as her commanding officer called BLUEFIN 31, the RAAF Poseidon watching the group, on channel 16. He asked for the protection of the Australian government for his ship's company. He and her political officer hold the bridge and the engine room; those who did not join them hold the operations room, unharmed, and her weapons are made safe, guns trained fore and aft. Canberra accepted at 0415.\n\nShe is twenty-six miles east-south-east of Green Cape, steering for Eden at about twenty-one knots on engines that have not been opened up since October. A Type 054A of her screen turned to follow her at 0030 and is sixteen miles astern, closing slowly, with her Z-9 over the corvette marking her. She has been ordering her back on the group's net all night.\n\nINTELLIGENCE: A partial decrypt of Fleet headquarters to the group at 0350 reads '...is not to reach a foreign port...'. It is an hour old and gives the frigate's orders, not her intentions now. Assess that she will use force as the corvette nears Australian waters, and not before; she will not follow her inside twelve miles.\n\nOffensive action against the group is paused tonight for the talks; self-defence and the defence of others stand. Your detachment is weapons tight. Do not fire on the frigate or her helicopter before they show hostile intent against the corvette. From then, defend her: the missiles first, and the frigate or her helicopter if nothing less will do. A YJ-83 fired at her goes for the first ship its seeker finds, and yours are the ships beside her. Nothing fired here is replaced before Southern Cross. A coastal bulker for Port Kembla and two Eden fishing boats are in the water.
Objective_Protection=Bring the corvette inside the twelve-mile line off Green Cape
Objective_Restraint=Do not fire first on the frigate or her helicopter
Objective_Flagship=Bring your flagship out intact
Objective_Traffic=Harm no fishing boat or merchant
Taskforce1StartMessage=<color=yellow>The Twelve-Mile Line</color>|OFF GREEN CAPE, 0455, dark; first light about 0620. Your detachment is off Twofold Bay on passage to Sydney, where the force is to be made ready for the relief convoy. At 2155 last night one of the protection group's Type 056A corvettes, on picket a hundred and eighty miles east-south-east of Gabo Island, left her station, turned onto 295 and stopped radiating. At 0120 a voice giving his rank as her commanding officer called BLUEFIN 31, the RAAF Poseidon watching the group, on channel 16. He asked for the protection of the Australian government for his ship's company. He and her political officer hold the bridge and the engine room; those who did not join them hold the operations room, unharmed, and her weapons are made safe, guns trained fore and aft. Canberra accepted at 0415.\n\nShe is twenty-six miles east-south-east of Green Cape, steering for Eden at about twenty-one knots on engines that have not been opened up since October. A Type 054A of her screen turned to follow her at 0030 and is sixteen miles astern, closing slowly, with her Z-9 over the corvette marking her. She has been ordering her back on the group's net all night.\n\nINTELLIGENCE: A partial decrypt of Fleet headquarters to the group at 0350 reads '...is not to reach a foreign port...'. It is an hour old and gives the frigate's orders, not her intentions now. Assess that she will use force as the corvette nears Australian waters, and not before; she will not follow her inside twelve miles.\n\nOffensive action against the group is paused tonight for the talks; self-defence and the defence of others stand. Your detachment is weapons tight. Do not fire on the frigate or her helicopter before they show hostile intent against the corvette. From then, defend her: the missiles first, and the frigate or her helicopter if nothing less will do. A YJ-83 fired at her goes for the first ship its seeker finds, and yours are the ships beside her. Nothing fired here is replaced before Southern Cross. A coastal bulker for Port Kembla and two Eden fishing boats are in the water.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The corvette is inside twelve miles off Green Cape and the frigate has turned away at the line. A boarding officer from your detachment is on her bridge at her captain's invitation, and Eden's pilot is coming out. Canberra has told Beijing the ship will be returned after the talks. Her ship's company will be landed at Twofold Bay: those who ask for protection will be heard, and those who want to go home will be sent home.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The corvette is lost short of the line, or there is nothing left of the detachment to bring her in. The group has the ending it wanted: a ship that did not arrive, and a story about who stopped her.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The corvette is lost short of the line, or there is nothing left of the detachment to bring her in. The group has the ending it wanted: a ship that did not arrive, and a story about who stopped her.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The corvette is inside twelve miles off Green Cape and the frigate has turned away at the line. A boarding officer from your detachment is on her bridge at her captain's invitation, and Eden's pilot is coming out. Canberra has told Beijing the ship will be returned after the talks. Her ship's company will be landed at Twofold Bay: those who ask for protection will be heard, and those who want to go home will be sent home.
TimeoutMessage=<color=red>Operational window closed.</color>|One hundred and twenty-eight minutes, and the corvette is still outside the twelve-mile line, crippled or stopped, with the frigate standing off. What happens to her now is not in your report.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 85-minute window has closed. Command will hold the line for about 43 minutes more. Finish the task now.
RestraintLiftIntel=BLUEFIN 31: The frigate's fire-control radar is locked on the corvette. Hostile intent. You are cleared to defend her: the missiles first, and the frigate or her helicopter if that is what it takes. Weapons tight is self-defence only - go free, or engage the missiles by hand.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
