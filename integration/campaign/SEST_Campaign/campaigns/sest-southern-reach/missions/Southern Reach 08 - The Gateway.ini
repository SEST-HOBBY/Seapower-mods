[Language_en]
Name=Southern Reach 08 - The Gateway
Description=CHRISTCHURCH APPROACHES, afternoon. The gateway traffic for the American programme's summer is coming into Lyttelton: POLAR GIANT with McMurdo's cargo and CANTERBURY SPIRIT with its fuel, both in Pegasus Bay and both making twelve knots south-west across Pegasus Bay to the pilot station.\n\nA corvette flying the protection flag has been working the Canterbury coast for four days and has asked three tankers for their environmental compliance certificates. It is south-east of the peninsula with its helicopter up, and the research trawler NAN HAI 27 is off Akaroa. KIWI 05 is overhead out of Christchurch and stays overhead; the Chatham freighter, the pilot launch, two trawlers and the afternoon Sydney flight are in the same water and sky.\n\nWalk both ships into the Lyttelton approach. Classify the corvette. Weapons tight: nobody fires first in this bay, and if the corvette does, you answer it and Wellington answers everything else.
Objective_Gateway=Bring POLAR GIANT and CANTERBURY SPIRIT into the Lyttelton approach
Objective_Corvette=Classify the inspecting corvette
Objective_Traffic=Harm no freighter, launch, trawler or aircraft
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>The Gateway</color>|CHRISTCHURCH APPROACHES, afternoon. The gateway traffic for the American programme's summer is coming into Lyttelton: POLAR GIANT with McMurdo's cargo and CANTERBURY SPIRIT with its fuel, both in Pegasus Bay and both making twelve knots south-west across Pegasus Bay to the pilot station.\n\nA corvette flying the protection flag has been working the Canterbury coast for four days and has asked three tankers for their environmental compliance certificates. It is south-east of the peninsula with its helicopter up, and the research trawler NAN HAI 27 is off Akaroa. KIWI 05 is overhead out of Christchurch and stays overhead; the Chatham freighter, the pilot launch, two trawlers and the afternoon Sydney flight are in the same water and sky.\n\nWalk both ships into the Lyttelton approach. Classify the corvette. Weapons tight: nobody fires first in this bay, and if the corvette does, you answer it and Wellington answers everything else.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Both ships are at the pilot station with Lyttelton's tugs coming out, and the corvette has a class, a name and a recording of itself asking a tanker for a certificate. Brand: 'That is the gateway. It stays open.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|A gateway ship is lost in New Zealand's front yard and the American programme's summer goes to Hobart. Wellington will say what it says.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|A gateway ship is lost in New Zealand's front yard and the American programme's summer goes to Hobart. Wellington will say what it says.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Both ships are at the pilot station with Lyttelton's tugs coming out, and the corvette has a class, a name and a recording of itself asking a tanker for a certificate. Brand: 'That is the gateway. It stays open.'
TimeoutMessage=<color=red>Out of time.</color>|Sixty-five minutes and the ships are still short of the Heads with the corvette between them and the pilot. The gateway is a question again.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
