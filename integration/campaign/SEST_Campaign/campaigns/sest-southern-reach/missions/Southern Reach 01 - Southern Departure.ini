[Language_en]
Name=Southern Reach 01 - Southern Departure
Description=STORM BAY, 0620. The first resupply convoy of the season cleared the Derwent an hour ago: RSV SOUTHERN ENDEAVOUR with Casey's people and stores, MV CORAL PIONEER chartered for the Macquarie Island run, and the fuel coaster DERWENT SPIRIT. They make twelve knots together and they will not make more.\n\nA factory-trawler fleet has been working the shelf edge since October under a fisheries-protection flag, and one hull in it carries an electronics fit no trawler needs. It has been forty miles off the Derwent every time a ship has sailed for the ice. This morning it is closer. Sixty miles south-east, a frigate flying the same flag has been calling merchant masters to ask for their environmental compliance paperwork. It has not been told to stop.\n\nYou are the escort, with the Seahawk you brought if you put one on Ship's Flight at requisition. BLUEFIN 31 is a Poseidon out of Edinburgh for the first half of the morning and SENTRY 21 is a Triton high to the south. Walk the convoy south out of the bay to the handover line and classify the trawler that is not one. An expedition cruise ship, two Tasmanian fishing boats and the morning airlink to Wilkins are in the same water and the same sky. Identify before you shoot. Your weapons are tight.
Objective_Convoy=Walk the convoy south out of Storm Bay to the handover line
Objective_Neutrals=Harm no fishing boat, merchant or aircraft
Objective_Flagship=Bring your flagship out intact
Objective_Identify=Classify the research trawler before the handover
Taskforce1StartMessage=<color=yellow>Southern Departure</color>|STORM BAY, 0620. The first resupply convoy of the season cleared the Derwent an hour ago: RSV SOUTHERN ENDEAVOUR with Casey's people and stores, MV CORAL PIONEER chartered for the Macquarie Island run, and the fuel coaster DERWENT SPIRIT. They make twelve knots together and they will not make more.\n\nA factory-trawler fleet has been working the shelf edge since October under a fisheries-protection flag, and one hull in it carries an electronics fit no trawler needs. It has been forty miles off the Derwent every time a ship has sailed for the ice. This morning it is closer. Sixty miles south-east, a frigate flying the same flag has been calling merchant masters to ask for their environmental compliance paperwork. It has not been told to stop.\n\nYou are the escort, with the Seahawk you brought if you put one on Ship's Flight at requisition. BLUEFIN 31 is a Poseidon out of Edinburgh for the first half of the morning and SENTRY 21 is a Triton high to the south. Walk the convoy south out of the bay to the handover line and classify the trawler that is not one. An expedition cruise ship, two Tasmanian fishing boats and the morning airlink to Wilkins are in the same water and the same sky. Identify before you shoot. Your weapons are tight.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The convoy is past the handover line and the escort has put a name on the trawler that was not one. Santos, on channel 16: 'Same escort as October. Good.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|SOUTHERN ENDEAVOUR is not going south this week, and the stations start the season on what the winter left them.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|SOUTHERN ENDEAVOUR is not going south this week, and the stations start the season on what the winter left them.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The convoy is past the handover line and the escort has put a name on the trawler that was not one. Santos, on channel 16: 'Same escort as October. Good.'
TimeoutMessage=<color=red>Out of time.</color>|0720 and the convoy is still in the bay. The frigate has its paperwork question answered: nothing sailed.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
