[Language_en]
Name=Sulu Line - The Island Road (Philippine Navy)
Description=SULU LINE - The Island Road. October 2028. With most of America's ready combat power drawn north, the Philippine Navy holds the island supply road alone: Puerto Princesa to the Balabac outpost, the gun line off Jolo, the boats to Ayungin Shoal. The Meridian network is arming the Sulu coast and Chinese ships are pushing on the shoals. A Philippine-led task group with a Royal Thai Navy detachment, and later one Australian frigate, escorts the convoys and fires for the Marines ashore. There is no free rearm. What a ship fires stays fired until a supply ship you bought comes alongside at sea - BRP Tarlac, the Thai oiler Chula or a chartered barge carrier - or a convoy you escorted holds its service window. Supply ships are sold at three points in the campaign. Lose one and what it carried is gone.

