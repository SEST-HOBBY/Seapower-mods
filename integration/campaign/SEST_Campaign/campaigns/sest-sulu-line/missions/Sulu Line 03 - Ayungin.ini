[Language_en]
Name=Sulu Line 03 - Ayungin
Description=WEST PHILIPPINE SEA, 0600. M/L KALAYAAN, a chartered supply boat with the Marines' rotation, water and rations, is twenty-four miles east of Ayungin Shoal. BRP SIERRA MADRE has been aground in the lagoon since 1999 and her detachment has not been resupplied in five weeks.\n\nTwo China Coast Guard cutters and three militia trawlers are between the boat and the shoal, as they were the last three times. A Chinese intelligence ship is holding north of the shoal, towards Mischief Reef, and an early-warning aircraft is overhead.\n\nTake the boat into the lagoon. Your ships start at weapons Hold. Nobody here is going to shoot, and if the task group does it will have started something the Navy cannot finish this week. Use your hulls and your helicopter. Fishing boats are working the reef.
Objective_Resupply=Bring M/L Kalayaan into Ayungin's lagoon
Objective_Boat=Keep the supply boat afloat
Objective_Restraint=Fire on nothing: not the cutters, the trawlers, the intelligence ship or the aircraft
Objective_Traffic=Harm no fishing boat
Objective_Watchers=Classify the intelligence ship to the north
Taskforce1StartMessage=<color=yellow>Ayungin</color>|WEST PHILIPPINE SEA, 0600. M/L KALAYAAN, a chartered supply boat with the Marines' rotation, water and rations, is twenty-four miles east of Ayungin Shoal. BRP SIERRA MADRE has been aground in the lagoon since 1999 and her detachment has not been resupplied in five weeks.\n\nTwo China Coast Guard cutters and three militia trawlers are between the boat and the shoal, as they were the last three times. A Chinese intelligence ship is holding north of the shoal, towards Mischief Reef, and an early-warning aircraft is overhead.\n\nTake the boat into the lagoon. Your ships start at weapons Hold. Nobody here is going to shoot, and if the task group does it will have started something the Navy cannot finish this week. Use your hulls and your helicopter. Fishing boats are working the reef.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|KALAYAAN is in the lagoon and alongside SIERRA MADRE. The Marines have their water and their relief. The cutters have gone back to station. Nothing was fired.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The run to Ayungin has failed. The detachment on SIERRA MADRE will go another week without relief, and Manila is asking what was fired.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The run to Ayungin has failed. The detachment on SIERRA MADRE will go another week without relief, and Manila is asking what was fired.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|KALAYAAN is in the lagoon and alongside SIERRA MADRE. The Marines have their water and their relief. The cutters have gone back to station. Nothing was fired.
TimeoutMessage=<color=red>Operational window closed.</color>|0830, and KALAYAAN is still outside the lagoon. The tide will not let her in again today.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 100-minute window has closed. Command will hold the line for about 50 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
