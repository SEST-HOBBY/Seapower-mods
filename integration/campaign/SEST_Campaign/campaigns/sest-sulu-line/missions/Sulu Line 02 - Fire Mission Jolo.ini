[Language_en]
Name=Sulu Line 02 - Fire Mission Jolo
Description=OFF JOLO, 0930. Marine Battalion Landing Team 7 went ashore east of Jolo town two days ago to clear the coast road. It is pinned below the ridge above Patikul. The Meridian network has armed the ridge: two drone launch rails, two gun trucks and an air-defence vehicle that drove the Air Force's helicopters off yesterday afternoon.\n\nThe battalion has asked for naval gunfire. Your ships are twenty-five miles north of the coast. Close to gun range and destroy at least three of the five positions. The Marines' fire control party has them plotted and they are on your map.\n\nThe launch rails can put a drone on a ship as easily as on the Marines, and Meridian keeps a fast attack craft at Basilan. Nothing you fire today comes back except from your own supply ship. Bancas are working the coast.
Objective_Fire=Destroy three of the five positions on the ridge
Objective_Gunline=Keep the lead ship afloat
Objective_Raider=Sink the Meridian boat if it comes out
Objective_Traffic=Harm no banca
Taskforce1StartMessage=<color=yellow>Fire Mission Jolo</color>|OFF JOLO, 0930. Marine Battalion Landing Team 7 went ashore east of Jolo town two days ago to clear the coast road. It is pinned below the ridge above Patikul. The Meridian network has armed the ridge: two drone launch rails, two gun trucks and an air-defence vehicle that drove the Air Force's helicopters off yesterday afternoon.\n\nThe battalion has asked for naval gunfire. Your ships are twenty-five miles north of the coast. Close to gun range and destroy at least three of the five positions. The Marines' fire control party has them plotted and they are on your map.\n\nThe launch rails can put a drone on a ship as easily as on the Marines, and Meridian keeps a fast attack craft at Basilan. Nothing you fire today comes back except from your own supply ship. Bancas are working the coast.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The ridge is quiet. BLT 7 is moving on the coast road, and its fire control party has sent the ships its thanks and its new grid.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The gun line is broken and the ridge still holds. The battalion is back inside its perimeter, waiting for a gun that is not coming.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The gun line is broken and the ridge still holds. The battalion is back inside its perimeter, waiting for a gun that is not coming.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The ridge is quiet. BLT 7 is moving on the coast road, and its fire control party has sent the ships its thanks and its new grid.
TimeoutMessage=<color=red>Operational window closed.</color>|1215, and the ridge is still firing. The Marines have pulled back to the beach for the night.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 110-minute window has closed. Command will hold the line for about 55 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
