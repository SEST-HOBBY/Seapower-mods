[Language_en]
Name=Sulu Line 05A - The Drone Yard
Description=SULU SEA, 0530. Two coasters were sunk off Pearl Bank last week by drones that flew faster than anything the network has used before: Shahed 238s, the jet version. Signals put their yard on Cagayan de Tawi-Tawi, the island the charts call Mapun, a hundred and sixty miles from anywhere. The Air Force has imagery of two launchers and a rail at the south end of the island, and two guns.\n\nMV Pag-asa Uno, chartered by the Navy with stores for Balabac, is fifty miles north-east of Mapun with BRP Artemio Ricarte. She cannot change her route without losing a day. Meridian's spotter drone flies from the same yard and is usually up by ten past the hour.\n\nTabak 11 and Tabak 12 are inbound from Puerto Princesa with precision bombs. Weapons Free on the yard. The village of Mapun is at the north end of the island and the fishing boats are off it.
Objective_Yard=Destroy the drone launchers on Mapun
Objective_Charter=MV Pag-asa Uno is not lost
Objective_Spotter=Shoot down the spotter drone
Objective_Guns=Silence the yard's guns
Objective_Traffic=Harm no fishing boat
Taskforce1StartMessage=<color=yellow>The Drone Yard</color>|SULU SEA, 0530. Two coasters were sunk off Pearl Bank last week by drones that flew faster than anything the network has used before: Shahed 238s, the jet version. Signals put their yard on Cagayan de Tawi-Tawi, the island the charts call Mapun, a hundred and sixty miles from anywhere. The Air Force has imagery of two launchers and a rail at the south end of the island, and two guns.\n\nMV Pag-asa Uno, chartered by the Navy with stores for Balabac, is fifty miles north-east of Mapun with BRP Artemio Ricarte. She cannot change her route without losing a day. Meridian's spotter drone flies from the same yard and is usually up by ten past the hour.\n\nTabak 11 and Tabak 12 are inbound from Puerto Princesa with precision bombs. Weapons Free on the yard. The village of Mapun is at the north end of the island and the fishing boats are off it.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The yard on Mapun is burning and the charter is on her way to Balabac. Whatever Meridian flies next will have to come from somewhere further away.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The yard is still there, or the charter is not. What is left on Mapun will be on Palawan within the week.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The yard is still there, or the charter is not. What is left on Mapun will be on Palawan within the week.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The yard on Mapun is burning and the charter is on her way to Balabac. Whatever Meridian flies next will have to come from somewhere further away.
TimeoutMessage=<color=red>Operational window closed.</color>|0745, and the launchers on Mapun are still standing. The charter is out of the strike pair's reach, and the drones are not.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 90-minute window has closed. Command will hold the line for about 45 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
