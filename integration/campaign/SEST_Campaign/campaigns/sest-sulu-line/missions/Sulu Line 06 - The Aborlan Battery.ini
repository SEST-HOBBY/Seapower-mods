[Language_en]
Name=Sulu Line 06 - The Aborlan Battery
Description=OFF ABORLAN, 1000. Two nights ago a Meridian landing craft put two truck-mounted Silkworm launchers ashore on the Aborlan coast, thirty miles south of Puerto Princesa, with a fire-control radar and two anti-aircraft guns. Yesterday the battery fired on a coaster off Narra and missed. Nothing has sailed for Balabac since.\n\nThe launchers reach about twenty-five miles. Your ships are thirty-eight miles south of them, outside that range, and the Balabac convoy is held at the Narra anchorage, twenty miles from them and inside their reach.\n\nDestroy both launchers. A 76 mm gun reaches them from eight miles; a helicopter or an FA-50 from wherever the guns let it. The battery will fire at what its radar finds. Every round you fire comes back only from a supply ship, and this is the last window that sells them.
Objective_Battery=Destroy both Silkworm launchers
Objective_Convoy=Keep the Balabac convoy afloat
Objective_Gunline=Keep the lead ship afloat
Objective_Radar=Destroy the fire-control radar
Objective_Traffic=Harm no banca
Taskforce1StartMessage=<color=yellow>The Aborlan Battery</color>|OFF ABORLAN, 1000. Two nights ago a Meridian landing craft put two truck-mounted Silkworm launchers ashore on the Aborlan coast, thirty miles south of Puerto Princesa, with a fire-control radar and two anti-aircraft guns. Yesterday the battery fired on a coaster off Narra and missed. Nothing has sailed for Balabac since.\n\nThe launchers reach about twenty-five miles. Your ships are thirty-eight miles south of them, outside that range, and the Balabac convoy is held at the Narra anchorage, twenty miles from them and inside their reach.\n\nDestroy both launchers. A 76 mm gun reaches them from eight miles; a helicopter or an FA-50 from wherever the guns let it. The battery will fire at what its radar finds. Every round you fire comes back only from a supply ship, and this is the last window that sells them.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both launchers are burning on the Aborlan beach. The convoy has weighed anchor for Balabac, and Naval Forces West has a Marine company on its way to the site.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The battery still holds the road. The convoy is going back to Puerto Princesa, and Balabac goes on rationed fuel.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The battery still holds the road. The convoy is going back to Puerto Princesa, and Balabac goes on rationed fuel.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Both launchers are burning on the Aborlan beach. The convoy has weighed anchor for Balabac, and Naval Forces West has a Marine company on its way to the site.
TimeoutMessage=<color=red>Operational window closed.</color>|1245, and the launchers are still firing. The convoy will not sail tonight.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 110-minute window has closed. Command will hold the line for about 55 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
