; SEST Southern Watch requisition roster.
; Generated by integration/campaign/build_pack.py - edit campaign_data.py.
;
; Points are fictional balance values. The variant and squadron lists
; are not: each one is checked against the file that wins the load
; order, so a price can never name a fit the hull does not offer.

[AllowedVessels]
; syntax is: <unit_type>=<variant_or_squadron>,...|<points_cost>
; Warramunga and Perth; HMAS Anzac herself decommissioned in 2024, so Variant1 stays out of the core roster
ran_ffh_anzac=Variant3,Variant8|240
ran_ddg_hobart=Variant1,Variant2,Variant3|480
; donor Meteoro fit is richer than the real Arafura; one hull (HMAS Arafura) is on sale until the fit is corrected - Eyre and Pilbara sail as scripted hulls
ran_opv_arafura=Variant1|100

[AllowedAircraft]
; syntax is: <unit_type>=<variant_or_squadron>,...|<points_cost>
; No. 75 Squadron, RAAF Base Tindal - checked against the squadron file's own comment
raaf_f-35a=Squadron3|45
; Australian squadron in the SEST Growler pack's output
usn_fa-18f_blk3=Squadron8|35
; conventional EW/SEAD fits; MALICE stays in Future Front
usn_ea-18g=Squadron6|55
; the squadron file labels every entry USN; Squadron3 is the bible's choice, and the label is worth fixing upstream
usn_p8=Squadron3|55
; No. 2 Squadron RAAF, from the SEST Wedgetail pack
E7A_Wedgetail=Squadron1|80
; unarmed in this implementation, so priced under the P-8 and the F-35A
raaf_mq-4c_triton=Squadron1|40

[AllowedHelicopters]
; syntax is: <unit_type>=<variant_or_squadron>,...|<points_cost>
; 816 Squadron RAN; one family chosen explicitly - usn_mh-60r_26 is a different unit and is never substituted for it
usn_mh-60r=Squadron20|20

[LoadoutPrices]
; Aircraft loadouts are included in the aircraft purchase cost.
; Naval loadout presets are not advertised until they are authored
; and tested.
; ran_opv_arafura declares Containers, AntiShip, AntiAir; none is priced here.
