[Language_en]
Name=Southern Watch O4 - Weather Alternate
Description=KAI ISLANDS, afternoon. Captain Prasetyo has lent us the strip at Langgur for the enclave relief window and not an hour longer. LANGGUR PROVIDER and KEI STAR carry the fuel bladders and the ground party; you take them the last fifteen miles up the open-water western approach to the offshore transfer anchorage. Local craft take the bladders ashore to Langgur; neither coaster is to enter the passages between the Kai islands.\n\nThe enclave knows what Langgur is for. A Meridian escort pair has been working the Kai passages since Tuesday, and the last transit reported a drone launcher site on Kai Besar, across the strait east of the anchorage. Langgur town is beyond the anchorage and every building in it is somebody's.\n\nGet both coasters in. Put the launcher out of the argument if you can do it without touching the town.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. The field team uses a portable launcher and local recovery lane. Two reserve UAVs are with the team from the start. They are unarmed and have finite fuel. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Objective_Fuel=Get both coasters into the western transfer anchorage
Objective_Site=Neutralise the Kai Besar launcher site
Objective_Town=Leave Langgur alone
Objective_ForwardRecon=Obtain a current classification of the land target area
Taskforce1StartMessage=<color=yellow>Weather Alternate</color>|KAI ISLANDS, afternoon. Captain Prasetyo has lent us the strip at Langgur for the enclave relief window and not an hour longer. LANGGUR PROVIDER and KEI STAR carry the fuel bladders and the ground party; you take them the last fifteen miles up the open-water western approach to the offshore transfer anchorage. Local craft take the bladders ashore to Langgur; neither coaster is to enter the passages between the Kai islands.\n\nThe enclave knows what Langgur is for. A Meridian escort pair has been working the Kai passages since Tuesday, and the last transit reported a drone launcher site on Kai Besar, across the strait east of the anchorage. Langgur town is beyond the anchorage and every building in it is somebody's.\n\nGet both coasters in. Put the launcher out of the argument if you can do it without touching the town.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. The field team uses a portable launcher and local recovery lane. Two reserve UAVs are with the team from the start. They are unarmed and have finite fuel. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both coasters are in the anchorage and the ground party is pumping before the light goes. The Open Door has a second tanker on the track.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The bladders are on the bottom short of Langgur. The Open Door has Texaco 52 but no second tanker to extend the support window.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The bladders are on the bottom short of Langgur. The Open Door has Texaco 52 but no second tanker to extend the support window.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Both coasters are in the anchorage and the ground party is pumping before the light goes. The Open Door has a second tanker on the track.
TimeoutMessage=<color=red>Operational window closed.</color>|The light went with the bladders still short of Langgur. The Open Door has Texaco 52 but no second tanker to extend the support window.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 70-minute window has closed. Command will hold the line for about 35 minutes more. Finish the task now.
SituationReport1Intel=LANGGUR / PRASETYO: Keep the coasters on the western offshore route. Local launches will take the bladders ashore. The UAV section is looking at the launch site, not clearing the island passages for a merchant.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
