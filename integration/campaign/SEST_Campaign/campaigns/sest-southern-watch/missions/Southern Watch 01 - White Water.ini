[Language_en]
Name=Southern Watch 01 - White Water
Description=ARAFURA SEA, 0540 local. MV Coral Pioneer missed her rendezvous forty minutes ago. Her last report mentioned an engine casualty and an escort claiming the authority to inspect the convoy. The Indonesian patrol sent to investigate has reported gunfire and nothing since.\n\nYou are WARRAMUNGA with a Seahawk on the deck, a Poseidon on task for the first part of the morning and a Triton high to the north. Bring the merchants together and walk them east to the handover box.\n\nThe lane is working traffic: a bulker, a chartered coaster, a relief freighter, trawlers and the 0600 Denpasar service overhead. One contact in that picture is a Meridian escort with weapons and one is a decoy hull that has squawked as a merchant since it sailed. Identify before you shoot. Your weapons are tight.
Objective_Convoy=Walk the merchant group into the eastern handover box
Objective_Neutrals=Harm no neutral shipping or aircraft
Objective_Warramunga=Bring Warramunga out intact
Taskforce1StartMessage=<color=yellow>White Water</color>|ARAFURA SEA, 0540 local. MV Coral Pioneer missed her rendezvous forty minutes ago. Her last report mentioned an engine casualty and an escort claiming the authority to inspect the convoy. The Indonesian patrol sent to investigate has reported gunfire and nothing since.\n\nYou are WARRAMUNGA with a Seahawk on the deck, a Poseidon on task for the first part of the morning and a Triton high to the north. Bring the merchants together and walk them east to the handover box.\n\nThe lane is working traffic: a bulker, a chartered coaster, a relief freighter, trawlers and the 0600 Denpasar service overhead. One contact in that picture is a Meridian escort with weapons and one is a decoy hull that has squawked as a merchant since it sailed. Identify before you shoot. Your weapons are tight.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The merchants are in the box and their crews are alive. The escort has been identified, and so has everything you did not shoot.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The convoy is scattered and Coral Pioneer is not answering. Whatever this was, it worked.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The convoy is scattered and Coral Pioneer is not answering. Whatever this was, it worked.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The merchants are in the box and their crews are alive. The escort has been identified, and so has everything you did not shoot.
TimeoutMessage=<color=red>Out of time.</color>|Last light, and the merchants are still scattered across forty miles of the Arafura. Whatever this was, it worked.
SupportLoss1Intel=Bluefin 21 is down. The Poseidon was the only thing holding the picture past Warramunga's horizon, and 92 Wing has no spare airframe in the north this week. Replacing her is 45 points out of an allocation of 100.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
