[Language_en]
Name=Southern Watch C2 - Broken Wake
Description=BANDA SEA, before dawn. STUART has one shaft, thirty-one wounded and a six-knot engineering limit. Bring her south-south-east to Darwin's tug handover line. The recovery remains the main task; sinking the opposing ships is not a substitute for a live frigate at the line.\n\nSCREEN AND SEARCH: A Kilo is working the south-western approach. Flying Shark 31 and 32 are already committed and join from the north at minute five. Keep the helicopter or an escort ahead of Stuart while the air-defence ship covers the straggler. HMAS SHEEAN is allocated on the eastern barrier, submerged with weapons held. You command her; deconflict her patrol from the flight's torpedo attacks. She is a theatre attachment for this operation, not a new permanent roster purchase.\n\nBREAK THE RELAY: An armed Okean trawler, operating as BANDA SURVEYOR, is east of the recovery lane. She is due to release a fast missile craft at minute twenty-five. Identify the contact among the civilian traffic. If you destroy this hostile relay before that deadline, the follow-on craft never joins. Once released, sinking the relay will not recall it. The first air raid and Kilo are independent. Continue searching for the other threats with your own sensors.\n\nCHOICES AND CONSEQUENCES: Split the screen to hunt the relay and risk the southern submarine approach, or keep the escorts close and prepare for the later surface attack. Classifying the relay, silencing it, neutralizing the Kilo and preserving Sheean earn separate credit. They are optional; the main recovery ends the mission, so do them before Stuart reaches the line if you choose. MT BANDA SPIRIT and MV TANIMBAR TRADER remain neutral throughout. Harming either fails the operation.\n\nCHIEF MASON has taped a red spider over the broken shaft repeater. Mercer says the spider is the only member of this detachment authorized to move faster than six knots.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Stuart=Bring STUART to the line
Objective_Traffic=Harm no neutral shipping
Objective_RelayID=Classify the armed relay trawler
Objective_Relay=Silence the armed relay trawler
Objective_ClearDatum=Neutralize the Kilo on the recovery approach
Objective_Sheean=Preserve SHEEAN
Taskforce1StartMessage=<color=yellow>Broken Wake</color>|BANDA SEA, before dawn. STUART has one shaft, thirty-one wounded and a six-knot engineering limit. Bring her south-south-east to Darwin's tug handover line. The recovery remains the main task; sinking the opposing ships is not a substitute for a live frigate at the line.\n\nSCREEN AND SEARCH: A Kilo is working the south-western approach. Flying Shark 31 and 32 are already committed and join from the north at minute five. Keep the helicopter or an escort ahead of Stuart while the air-defence ship covers the straggler. HMAS SHEEAN is allocated on the eastern barrier, submerged with weapons held. You command her; deconflict her patrol from the flight's torpedo attacks. She is a theatre attachment for this operation, not a new permanent roster purchase.\n\nBREAK THE RELAY: An armed Okean trawler, operating as BANDA SURVEYOR, is east of the recovery lane. She is due to release a fast missile craft at minute twenty-five. Identify the contact among the civilian traffic. If you destroy this hostile relay before that deadline, the follow-on craft never joins. Once released, sinking the relay will not recall it. The first air raid and Kilo are independent. Continue searching for the other threats with your own sensors.\n\nCHOICES AND CONSEQUENCES: Split the screen to hunt the relay and risk the southern submarine approach, or keep the escorts close and prepare for the later surface attack. Classifying the relay, silencing it, neutralizing the Kilo and preserving Sheean earn separate credit. They are optional; the main recovery ends the mission, so do them before Stuart reaches the line if you choose. MT BANDA SPIRIT and MV TANIMBAR TRADER remain neutral throughout. Harming either fails the operation.\n\nCHIEF MASON has taped a red spider over the broken shaft repeater. Mercer says the spider is the only member of this detachment authorized to move faster than six knots.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Stuart is at the line with her people aboard and a tug coming up from Darwin. Thirty-one wounded get their hospital, and the ship gets a dockyard instead of a reef.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|Stuart is gone with her wounded aboard, two days short of a ceasefire. The recovery that should have been routine is a court of inquiry.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|Stuart is gone with her wounded aboard, two days short of a ceasefire. The recovery that should have been routine is a court of inquiry.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Stuart is at the line with her people aboard and a tug coming up from Darwin. Thirty-one wounded get their hospital, and the ship gets a dockyard instead of a reef.
TimeoutMessage=<color=red>Operational window closed.</color>|Stuart is still short of the line at first light with a Kilo somewhere astern, and the tug from Darwin has nothing to meet.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 75-minute window has closed. Command will hold the line for about 37 minutes more. Finish the task now.
SituationReport1Intel=ELLIS: Seven minutes to the relay deadline. If Banda Surveyor is still afloat, classify the eastern contact and decide whether you can stop it without stripping Stuart's screen. This report gives no target reveal.
SituationReport2Intel=STUART / CHIEF MASON: Shaft vibration is steady at six knots. Keep the screen ahead of our bow and the merchants clear of the recovery lane. Nobody in my engine room has authorized a dash.
SituationReport3Intel=ENGINE ROOM: A straggler is a second defended point. Put the flight or a detached escort between her and the incoming axis before moving the rest of the force away.
ReinforcementCancelled1Intel=ELLIS: The armed relay was silenced before its scheduled transmission. The follow-on fast-craft attack has been cancelled. The Kilo and the already committed J-15Ds are unaffected.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
