[Language_en]
Name=Southern Watch O2 - Southern Cross
Description=ARAFURA SEA, mid-morning. A coaster with no transponder has been pacing the lane for three days, always outside the twelve-mile limit, always where the next convoy will be. Her name is what we want.\n\nKIWI 01 is a New Zealand Poseidon out of Darwin on a national allocation: one sortie, Squadron Leader Rewi's crew, and she goes home to Darwin when it is done - she is not yours to keep and not yours to lose. The patrol vessel PILBARA is on the lane with the ordinary traffic, and a Meridian escort boat has been working the same water since Sunday with a drone spotting for it.\n\nGet Kiwi 01 close enough to put a name on the coaster, keep her out of the escort boat's reach, and recover her to Darwin. Everything else on the lane is somebody's living.
Objective_Picture=Identify the coaster, then recover Kiwi 01 to Darwin
Objective_Kiwi=Do not lose Kiwi 01
Objective_Traffic=Harm no lane traffic
Taskforce1StartMessage=<color=yellow>Southern Cross</color>|ARAFURA SEA, mid-morning. A coaster with no transponder has been pacing the lane for three days, always outside the twelve-mile limit, always where the next convoy will be. Her name is what we want.\n\nKIWI 01 is a New Zealand Poseidon out of Darwin on a national allocation: one sortie, Squadron Leader Rewi's crew, and she goes home to Darwin when it is done - she is not yours to keep and not yours to lose. The patrol vessel PILBARA is on the lane with the ordinary traffic, and a Meridian escort boat has been working the same water since Sunday with a drone spotting for it.\n\nGet Kiwi 01 close enough to put a name on the coaster, keep her out of the escort boat's reach, and recover her to Darwin. Everything else on the lane is somebody's living.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Kiwi 01 is on the ground at Darwin with a name, a submarine's datum and a recording, and Rewi's crew is already writing the report Wellington will read first. The next contact briefing has that submarine in it.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The Poseidon is down and the allocation with her. Wellington will want to know why its one aircraft was inside a gunboat's reach.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The Poseidon is down and the allocation with her. Wellington will want to know why its one aircraft was inside a gunboat's reach.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Kiwi 01 is on the ground at Darwin with a name, a submarine's datum and a recording, and Rewi's crew is already writing the report Wellington will read first. The next contact briefing has that submarine in it.
TimeoutMessage=<color=red>Out of time.</color>|Kiwi 01 is at the end of her allocation with the coaster unnamed. Wellington's hours were spent and nothing came of them.
StageIntel=Kiwi 01 has her: MV Harbour Light, chartered through the same Singapore office as the Meridian boats, with a towed array she has no business owning. Rewi's crew has a datum on the submarine she is working with. Bring the aircraft home.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
