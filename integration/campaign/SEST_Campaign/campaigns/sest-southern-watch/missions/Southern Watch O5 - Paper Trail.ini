[Language_en]
Name=Southern Watch O5 - Paper Trail
Description=BANDA APPROACHES, NORTH OF TANIMBAR, 1040. MV Kota Meridian, a logistics merchant under a Meridian escort boat, has been working north from the Arafura since dawn. Signals intelligence expects a handover to a second ship somewhere north of the Tanimbar group this afternoon, and three ships are waiting there: two Indonesian traders and a trawler, any of which could be the receiver.\n\nHMAS Eyre has two uncrewed boats in company. KRAKEN 1 is the RAN's own K5, three months in service; CORSAIR 41 is a Saronic Corsair the US Navy lent the RAN for the fortnight. Both are unarmed, both are quick, and neither has anyone aboard to lose.\n\nIdentify the receiver and put a boat within three miles of the handover. The escort boat is weapons tight; so are you. Keep Eyre out of its sight if you can: a Meridian report naming an Australian warship off Tanimbar is a story Canberra does not want this week.
Objective_Trail=Identify the receiver, then put a boat within three miles of the handover
Objective_Unseen=Keep HMAS Eyre unidentified by Meridian
Objective_Restraint=Do not fire on the merchant
Objective_Traffic=Harm no lane traffic
Taskforce1StartMessage=<color=yellow>Paper Trail</color>|BANDA APPROACHES, NORTH OF TANIMBAR, 1040. MV Kota Meridian, a logistics merchant under a Meridian escort boat, has been working north from the Arafura since dawn. Signals intelligence expects a handover to a second ship somewhere north of the Tanimbar group this afternoon, and three ships are waiting there: two Indonesian traders and a trawler, any of which could be the receiver.\n\nHMAS Eyre has two uncrewed boats in company. KRAKEN 1 is the RAN's own K5, three months in service; CORSAIR 41 is a Saronic Corsair the US Navy lent the RAN for the fortnight. Both are unarmed, both are quick, and neither has anyone aboard to lose.\n\nIdentify the receiver and put a boat within three miles of the handover. The escort boat is weapons tight; so are you. Keep Eyre out of its sight if you can: a Meridian report naming an Australian warship off Tanimbar is a story Canberra does not want this week.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The receiver has a name and the handover is on camera. The intelligence cell has the Seram passage route, and nothing was fired by anyone.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The handover happened and nobody can say to whom. Whatever Kota Meridian carried is somewhere in the Banda Sea.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The handover happened and nobody can say to whom. Whatever Kota Meridian carried is somewhere in the Banda Sea.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The receiver has a name and the handover is on camera. The intelligence cell has the Seram passage route, and nothing was fired by anyone.
TimeoutMessage=<color=red>Operational window closed.</color>|1310, and the handover has happened somewhere among three ships nobody has named. Kota Meridian is going home empty.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 100-minute window has closed. Command will hold the line for about 50 minutes more. Finish the task now.
StageIntel=KRAKEN 1 / CORSAIR 41: Receiver identified, KM Sinar Harapan, Indonesian flag, Meridian charter. Her owners run two more coasters on the Seram passage. Hold a boat within three miles of the handover until the camera has it.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
