[Language_en]
Name=SEST Southern Watch O1 - The Missing Beacon
Description=ARAFURA SEA, late afternoon. MV Torres Light stopped transmitting nineteen hours ago on a coastal route that carries no traffic worth interfering with. Her beacon is silent and the weather is closing from the north-west.\n\nARAFURA and a Seahawk have until last light. The lane has ordinary traffic in it and one of those hulls was in company with her yesterday, which is worth a conversation rather than a missile.\n\nFind her, establish what happened, and bring the search aircraft home. If this is what the last week suggests it is, the evidence is worth as much as the crew.
Objective_Search=Reach the missing coaster's last reported position
Objective_Aircraft=Bring the search helicopter home
Objective_Traffic=Harm no lane traffic
Taskforce1StartMessage=<color=yellow>The Missing Beacon</color>|ARAFURA SEA, late afternoon. MV Torres Light stopped transmitting nineteen hours ago on a coastal route that carries no traffic worth interfering with. Her beacon is silent and the weather is closing from the north-west.\n\nARAFURA and a Seahawk have until last light. The lane has ordinary traffic in it and one of those hulls was in company with her yesterday, which is worth a conversation rather than a missile.\n\nFind her, establish what happened, and bring the search aircraft home. If this is what the last week suggests it is, the evidence is worth as much as the crew.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Torres Light is found, her crew is off and the recordings from her bridge are in a bag on Arafura's quarterdeck. Somebody is going to have to explain them.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Last light came and went. The search resumes tomorrow with worse weather and colder water.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|Last light came and went. The search resumes tomorrow with worse weather and colder water.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Torres Light is found, her crew is off and the recordings from her bridge are in a bag on Arafura's quarterdeck. Somebody is going to have to explain them.
TimeoutMessage=<color=red>Out of time.</color>|Dark. The search resumes tomorrow in worse weather and colder water.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
