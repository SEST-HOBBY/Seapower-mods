[Language_en]
Name=Southern Watch 03 - Rig Seventeen
Description=TIMOR SEA, late afternoon. Rig Seventeen stopped answering its shore office on Tuesday. Forty-one contract staff are still aboard, and the people holding the platform have a helicopter deck, a shore battery on the nearest headland and an air-defence vehicle they were not supposed to have.\n\nThe coastal state has asked for help and set the boundary: you may cover an evacuation, you may not level the installation. CHOULES is in company with CANBERRA and there are two Super Stallions for the lift.\n\nGet the transports in, get the people off, get everybody out before the light goes. Not every platform out here is theirs and most of this coast is working its ordinary week.
Objective_Evacuate=Get the lift helicopters clear to the south
Objective_Platform=Leave the civilian platform standing
Objective_Ships=Bring both amphibious ships home
Taskforce1StartMessage=<color=yellow>Rig Seventeen</color>|TIMOR SEA, late afternoon. Rig Seventeen stopped answering its shore office on Tuesday. Forty-one contract staff are still aboard, and the people holding the platform have a helicopter deck, a shore battery on the nearest headland and an air-defence vehicle they were not supposed to have.\n\nThe coastal state has asked for help and set the boundary: you may cover an evacuation, you may not level the installation. CHOULES is in company with CANBERRA and there are two Super Stallions for the lift.\n\nGet the transports in, get the people off, get everybody out before the light goes. Not every platform out here is theirs and most of this coast is working its ordinary week.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The lifters are south of the line with the platform crew aboard. Rig Seventeen is still standing and somebody else can argue about who owns it.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The window closed with people still on the deck. There will not be another one this week.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The window closed with people still on the deck. There will not be another one this week.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The lifters are south of the line with the platform crew aboard. Rig Seventeen is still standing and somebody else can argue about who owns it.
TimeoutMessage=<color=red>Out of time.</color>|The evacuation window expired with people still on the deck. There will not be another one this week.
StageIntel=Lifter over the platform. The crew is on the helideck and coming aboard - get them south of the line.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
