[Language_en]
Name=Southern Watch 05 - Weapons Free
Description=TIMOR CORRIDOR. A Chinese surface action group is working south-east down the corridor screening an amphibious transport, and it has begun turning merchant traffic back by radio and then by gun.\n\nYou send one ship, alone, sixty miles on their disengaged bow with the weather in your favour and a full deck-launcher load. The four merchants you are covering are ten miles behind you at a tug's speed, and ESCORT SEVEN, the Meridian boat that tried to stop Coral Pioneer on the eighteenth, is on their track to hold them for the surface group.\n\nEstablish the military threat, engage it, and be somewhere else when the counter-strike arrives - their JH-7A strike pair is within range of this box and their helicopter is already up. The merchants in the lane are not targets because somebody wrote SANCTIONED on a manifest.
Objective_Escort=Neutralise the Sovremenny screening the transport
Objective_Convoy=Lose no more than one merchant, and not Coral Pioneer
Objective_Magazine=Bring your ship out with anti-ship rounds left
Taskforce1StartMessage=<color=yellow>Weapons Free</color>|TIMOR CORRIDOR. A Chinese surface action group is working south-east down the corridor screening an amphibious transport, and it has begun turning merchant traffic back by radio and then by gun.\n\nYou send one ship, alone, sixty miles on their disengaged bow with the weather in your favour and a full deck-launcher load. The four merchants you are covering are ten miles behind you at a tug's speed, and ESCORT SEVEN, the Meridian boat that tried to stop Coral Pioneer on the eighteenth, is on their track to hold them for the surface group.\n\nEstablish the military threat, engage it, and be somewhere else when the counter-strike arrives - their JH-7A strike pair is within range of this box and their helicopter is already up. The merchants in the lane are not targets because somebody wrote SANCTIONED on a manifest.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The hostile escort has been neutralised. Report the convoy's position and remaining threats, then prepare to disengage with the ammunition you have left.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|Your ship is gone or the convoy is broken. Either way nothing moves through this corridor tomorrow. Captain Prasetyo's report to Jakarta will be short, and it will be accurate.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|Your ship is gone or the convoy is broken. Either way nothing moves through this corridor tomorrow. Captain Prasetyo's report to Jakarta will be short, and it will be accurate.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The hostile escort has been neutralised. Report the convoy's position and remaining threats, then prepare to disengage with the ammunition you have left.
TimeoutMessage=<color=red>Operational window closed.</color>|The escort is still between the convoy and the corridor, and the convoy has turned back.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
