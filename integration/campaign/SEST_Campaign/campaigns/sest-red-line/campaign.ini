[Language_en]
Name=Red Line - The Other Watch (People's Liberation Army Navy)
Description=RED LINE - The Other Watch. November 2028 to February 2029, from the other bridge. A Chinese carrier group commander is sent into the Banda approaches under a protection-and-evacuation mandate and an order that says the group will not fire first. He puts a class on the Australian submarine trailing his carrier, gets fuel into the Biak enclave ahead of the coalition's relief window, builds the picture of a convoy that other people will attack, and in the first hours of the ceasefire stops the one ship in his own company that wants the war back. On the side, the enclave's patrol aircraft puts a class on a boat nobody has claimed and names the ships coming south to escort the convoy, and the screen races an Australian patrol vessel to a pilot in the water. In December he is sent south with Liaoning to take over the fisheries protection group, and its submarines have to pass the coalition's patrol aircraft without being classified. Every operation is won by restraint, escort or evasion, and there is nearly always a coalition aircraft overhead, recording.

