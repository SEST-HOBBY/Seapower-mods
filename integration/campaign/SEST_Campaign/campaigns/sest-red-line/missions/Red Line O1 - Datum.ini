[Language_en]
Name=Red Line O1 - Datum
Description=NORTH OF BIAK, 0640. At 2340 last night a torpedo hit the Russian detachment's auxiliary in the northern approaches. She is afloat and making six knots, and she is the Russian detachment's business, not this headquarters'. The boat that fired is not.\n\nNobody has claimed her. Fleet headquarters has designated her GOLF and wants a class on her before HAI YANG 7 goes into the northern roads tomorrow night. SEA EAR 31, the enclave detachment's Y-9, is airborne with a full load of buoys. GOLF has had seven hours, and she is assessed to be within thirty miles of where the auxiliary was hit, north-east of the aircraft.\n\nA RAAF Poseidon is over the same water, recording. Leave it alone.\n\nPut a class on GOLF, then bring the aircraft back over the enclave field. Fire nothing: SEA EAR 31 starts at weapons Hold, and a torpedo from it would be the group firing first on a boat it cannot name. Biak's fishing boats and a coaster bound for Jayapura are on the water.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Datum=Classify the submarine, then bring Sea Ear 31 back over the enclave field
Objective_Restraint=Fire on nothing: not the boat, not the patrol aircraft
Objective_Aircraft=Bring Sea Ear 31 home
Objective_Watchers=Classify the patrol aircraft over the buoy field
Objective_Traffic=Harm no fishing boat or coaster
Taskforce1StartMessage=<color=yellow>Datum</color>|NORTH OF BIAK, 0640. At 2340 last night a torpedo hit the Russian detachment's auxiliary in the northern approaches. She is afloat and making six knots, and she is the Russian detachment's business, not this headquarters'. The boat that fired is not.\n\nNobody has claimed her. Fleet headquarters has designated her GOLF and wants a class on her before HAI YANG 7 goes into the northern roads tomorrow night. SEA EAR 31, the enclave detachment's Y-9, is airborne with a full load of buoys. GOLF has had seven hours, and she is assessed to be within thirty miles of where the auxiliary was hit, north-east of the aircraft.\n\nA RAAF Poseidon is over the same water, recording. Leave it alone.\n\nPut a class on GOLF, then bring the aircraft back over the enclave field. Fire nothing: SEA EAR 31 starts at weapons Hold, and a torpedo from it would be the group firing first on a boat it cannot name. Biak's fishing boats and a coaster bound for Jayapura are on the water.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|SEA EAR 31 is over the enclave field with GOLF's class on tape. The fuel run tomorrow night starts with her signature, and the Poseidon's recording shows an aircraft laying buoys.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The boat or the Poseidon is lost, or the Y-9 is. The group has fired first, or lost the aircraft that was to keep it from having to; either way the fuel run goes in blind.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The boat or the Poseidon is lost, or the Y-9 is. The group has fired first, or lost the aircraft that was to keep it from having to; either way the fuel run goes in blind.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|SEA EAR 31 is over the enclave field with GOLF's class on tape. The fuel run tomorrow night starts with her signature, and the Poseidon's recording shows an aircraft laying buoys.
TimeoutMessage=<color=red>Operational window closed.</color>|0748, and GOLF still has no class. The fuel run goes in tomorrow night with a boat on its route that nobody can name.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 45-minute window has closed. Command will hold the line for about 23 minutes more. Finish the task now.
SituationReport1Intel=AIR OPERATIONS: A class is a buoy pattern and patience. Lay the field ahead of her drift, keep the aircraft off the Poseidon's track, and log what the buoys hear for the escort tomorrow night.
StageIntel=SONAR REPORT / SEA EAR 31: Contact GOLF classified: a nuclear submarine, dived, slow, working west. The class is logged and her signature goes to the group for tomorrow night. It does not say whose she is, and it does not authorise an attack. Bring the aircraft home.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
