[Language_en]
Name=Red Line 01 - Trailing Contact
Description=MOLUCCA SEA, 0710. Two missile craft hired through a Meridian charter have attacked a coastal patrol outside the group's area and are now closing FUJIAN from the east and north-east. Their launchers are trained towards the group. Headquarters has declared those two craft hostile: engage them. Expect the first missile salvo at about minute eight if they are left alone, and another bearing shortly afterwards.\n\nYour screen is already ahead of the carrier. Bring FUJIAN to the nearby morning station and destroy both missile craft. Use the preparation phase to ready her flight deck, set the screen's sensors and weapons, and decide whether to intercept the shooters or meet their missiles. You do not have to wait for them to fire.\n\nDIPPER 21 also has a diesel-submarine report twelve miles astern of FUJIAN: ALPHA. A class on her earns intelligence credit but does not hold up completion. She has not attacked. The Australian Poseidon, Triton and Wedgetail are also observing. These non-belligerents use neutral tactical symbols and are protected; normal defensive settings can engage the hostile craft without authorising fire on them.\n\nA ferry, two tuna boats, a coaster and the Manado-Ambon service cross the picture. Identify the two missile craft; the rest of the traffic is not a target.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Contact=Destroy both missile craft and bring Fujian to the morning station
Objective_Raiders=Stop both hostile missile craft
Objective_Restraint=Do not attack the trailing submarine or surveillance aircraft
Objective_Carrier=Keep Fujian afloat
Objective_Trail=Classify ALPHA if the screen can spare the search
Objective_Traffic=Harm no protected observer or civil contact
Taskforce1StartMessage=<color=yellow>Trailing Contact</color>|MOLUCCA SEA, 0710. Two missile craft hired through a Meridian charter have attacked a coastal patrol outside the group's area and are now closing FUJIAN from the east and north-east. Their launchers are trained towards the group. Headquarters has declared those two craft hostile: engage them. Expect the first missile salvo at about minute eight if they are left alone, and another bearing shortly afterwards.\n\nYour screen is already ahead of the carrier. Bring FUJIAN to the nearby morning station and destroy both missile craft. Use the preparation phase to ready her flight deck, set the screen's sensors and weapons, and decide whether to intercept the shooters or meet their missiles. You do not have to wait for them to fire.\n\nDIPPER 21 also has a diesel-submarine report twelve miles astern of FUJIAN: ALPHA. A class on her earns intelligence credit but does not hold up completion. She has not attacked. The Australian Poseidon, Triton and Wedgetail are also observing. These non-belligerents use neutral tactical symbols and are protected; normal defensive settings can engage the hostile craft without authorising fire on them.\n\nA ferry, two tuna boats, a coaster and the Manado-Ambon service cross the picture. Identify the two missile craft; the rest of the traffic is not a target.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both launch platforms are stopped and FUJIAN is on station. The group has defended itself without attacking the coalition's observers.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|FUJIAN is lost, or the group has attacked a protected observer. The defence has become an incident.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|FUJIAN is lost, or the group has attacked a protected observer. The defence has become an incident.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Both launch platforms are stopped and FUJIAN is on station. The group has defended itself without attacking the coalition's observers.
TimeoutMessage=<color=red>Operational window closed.</color>|0810, and the group has not cleared both missile craft and brought the carrier to her station.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 40-minute window has closed. Command will hold the line for about 20 minutes more. Finish the task now.
SituationReport1Intel=GROUP STAFF: The eastern and north-eastern missile craft are declared hostile. Intercept them before their scheduled launch windows if possible. ALPHA is an optional ASW task; keep the carrier on her short southbound leg.
SituationReport2Intel=FUJIAN / DEFENCE: Two declared hostile missile craft threaten different bearings. Clear their launchers and keep the carrier moving. ALPHA is an optional search; the grey coalition observers remain protected.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
