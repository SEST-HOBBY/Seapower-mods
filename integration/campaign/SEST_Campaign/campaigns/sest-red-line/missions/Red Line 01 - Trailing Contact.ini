[Language_en]
Name=Red Line 01 - Trailing Contact
Description=MOLUCCA SEA, 0710. The group came down from the Philippine Sea at first light, bound for its station in the Banda approaches. Last night DIPPER 21's sonar heard a diesel boat twelve miles astern of FUJIAN. She has been there since the Talaud Islands, matching the carrier's speed and keeping her distance. She is designated ALPHA.\n\nA RAAF Poseidon and a Triton are over the group. They are recording everything it does, and anything it does to that boat.\n\nPut a class on ALPHA, so the group knows what has been following it, then take FUJIAN to her morning station, twenty-two miles down the track. Your ships and helicopters start at weapons Hold. Set them free and the ship's flight may put a torpedo on the boat without being told, and that ends the operation.\n\nThe Ternate-Bitung ferry, two tuna boats and a coaster bound north for the Sangihe islands are in the same water. Identify before you act.
Objective_Contact=Classify ALPHA, then take Fujian south to her morning station
Objective_Restraint=Fire on nothing: not the boat, not the aircraft
Objective_Carrier=Bring Fujian through intact
Objective_Traffic=Harm no ferry, fishing boat or coaster
Objective_Watchers=Classify the patrol aircraft over the group
Taskforce1StartMessage=<color=yellow>Trailing Contact</color>|MOLUCCA SEA, 0710. The group came down from the Philippine Sea at first light, bound for its station in the Banda approaches. Last night DIPPER 21's sonar heard a diesel boat twelve miles astern of FUJIAN. She has been there since the Talaud Islands, matching the carrier's speed and keeping her distance. She is designated ALPHA.\n\nA RAAF Poseidon and a Triton are over the group. They are recording everything it does, and anything it does to that boat.\n\nPut a class on ALPHA, so the group knows what has been following it, then take FUJIAN to her morning station, twenty-two miles down the track. Your ships and helicopters start at weapons Hold. Set them free and the ship's flight may put a torpedo on the boat without being told, and that ends the operation.\n\nThe Ternate-Bitung ferry, two tuna boats and a coaster bound north for the Sangihe islands are in the same water. Identify before you act.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|FUJIAN is on her station and the boat astern has a class: Collins-class, Australian. She is still there. The Poseidon's recording shows a carrier group going about its business.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The group's first morning in the approaches has ended in an incident: something the orders protected is lost. Fleet headquarters has asked for the log, and the coalition already has the recording.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The group's first morning in the approaches has ended in an incident: something the orders protected is lost. Fleet headquarters has asked for the log, and the coalition already has the recording.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|FUJIAN is on her station and the boat astern has a class: Collins-class, Australian. She is still there. The Poseidon's recording shows a carrier group going about its business.
TimeoutMessage=<color=red>Operational window closed.</color>|0820, and FUJIAN is short of her station with a boat astern that still has no class. The group arrives late, and followed.
StageIntel=SONAR REPORT: Contact ALPHA classified as a Collins-class diesel submarine, Australian. She is holding twelve miles astern and has not changed speed. The classification is logged. It does not authorise an attack.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
