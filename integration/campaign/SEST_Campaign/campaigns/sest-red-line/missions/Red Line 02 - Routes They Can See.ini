[Language_en]
Name=Red Line 02 - Routes They Can See
Description=BIAK APPROACHES, 2310. HAI YANG 7 is already on the final leg into the northern roads, about eleven miles from the holding point. She makes twelve knots: keep her moving while the escort clears the approaches. There is no need to sail the earlier open-water leg.\n\nContact GOLF is east of the route and closing across it. Expect her first torpedo attack at about minute ten if she is not stopped, with a second attack window at eighteen. The allocated Z-18F, DIPPER 23, is already ahead of the tanker; use it for the search rather than waiting for an optional purchased aircraft. A ship's flight and a Y-9 can add coverage if allocated.\n\nA Meridian missile craft has also been identified north of the lane. Its launcher can reach the tanker and an attack is expected around minute fourteen. It is a declared hostile, separate from the submarine: screen both bearings. You may engage either shooter before it fires. GOLF's loss is remembered in the withdrawal mission.\n\nIf Sea Ear 31 completed Datum, its fifteen-minute position record remains available. It is a datum, not a fresh sonar contact. Classification earns a bonus; protecting the tanker and delivering her are the task.\n\nThe RAAF Poseidon records the run and is a protected non-belligerent with a neutral symbol. It is not providing the hostile craft's orders. Numfor's fishing boats and the coaster are protected too.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Fuel=Bring Hai Yang 7 into Biak's northern roads
Objective_Tanker=Keep Hai Yang 7 afloat
Objective_Restraint=Do not fire on the patrol aircraft
Objective_Boat=Classify the submarine on the route
Objective_Raider=Stop the missile craft on the northern flank
Objective_Traffic=Harm no fishing boat or coaster
Taskforce1StartMessage=<color=yellow>Routes They Can See</color>|BIAK APPROACHES, 2310. HAI YANG 7 is already on the final leg into the northern roads, about eleven miles from the holding point. She makes twelve knots: keep her moving while the escort clears the approaches. There is no need to sail the earlier open-water leg.\n\nContact GOLF is east of the route and closing across it. Expect her first torpedo attack at about minute ten if she is not stopped, with a second attack window at eighteen. The allocated Z-18F, DIPPER 23, is already ahead of the tanker; use it for the search rather than waiting for an optional purchased aircraft. A ship's flight and a Y-9 can add coverage if allocated.\n\nA Meridian missile craft has also been identified north of the lane. Its launcher can reach the tanker and an attack is expected around minute fourteen. It is a declared hostile, separate from the submarine: screen both bearings. You may engage either shooter before it fires. GOLF's loss is remembered in the withdrawal mission.\n\nIf Sea Ear 31 completed Datum, its fifteen-minute position record remains available. It is a datum, not a fresh sonar contact. Classification earns a bonus; protecting the tanker and delivering her are the task.\n\nThe RAAF Poseidon records the run and is a protected non-belligerent with a neutral symbol. It is not providing the hostile craft's orders. Numfor's fishing boats and the coaster are protected too.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|HAI YANG 7 is in the northern roads and discharging, and the detachment flies tomorrow. The Poseidon has a night's recording of a frigate escorting a tanker, which is what it was.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|HAI YANG 7 is lost, or the patrol aircraft is down. Either way the enclave's week has started badly, and the group's name is on it.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|HAI YANG 7 is lost, or the patrol aircraft is down. Either way the enclave's week has started badly, and the group's name is on it.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|HAI YANG 7 is in the northern roads and discharging, and the detachment flies tomorrow. The Poseidon has a night's recording of a frigate escorting a tanker, which is what it was.
TimeoutMessage=<color=red>Operational window closed.</color>|0032, and HAI YANG 7 is still outside the roads with no time left to discharge before the relief window opens. She turns back; the detachment flies on what it has.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 55-minute window has closed. Command will hold the line for about 27 minutes more. Finish the task now.
SituationReport1Intel=ASW CONTROL: Dipper 23 is already ahead of the tanker. GOLF is east of the route; start the search before her ten-minute attack window. The missile craft north of the lane is a separate threat. The grey Poseidon is protected, not its spotter.
SituationReport2Intel=GROUP STAFF: Dipper 23 searches ahead while the tanker keeps making twelve knots. GOLF has two torpedo windows and the northern missile craft is a separate shooter. Do not confuse the grey Poseidon with a hostile target.
RLO1GolfDatumIntel=AIR OPERATIONS: Sea Ear 31's buoy recordings of the eleventh, correlated with tonight's picture, put GOLF here. That position is on your display as a datum and will age off in fifteen minutes. It is a record, not a contact: find her with your own sensors.
RL02GolfSunkIntel=SONAR REPORT: Contact GOLF destroyed. Log the time, the weapon and what she was doing when it was used; the group will be asked.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
