[Language_en]
Name=Red Line 06 - The Quiet Side
Description=FIORDLAND APPROACHES, 0520. The group is in the Tasman. HULL 334, the diesel boat working the New Zealand side, needs her tender, and MV AUSTRAL COMPLIANCE, the AMS coaster, is to meet her this morning in the Milford cruise traffic west of Puysegur.\n\nKIWI 05, a New Zealand Poseidon out of Invercargill, flies a racetrack over this approach every morning. Your frigate is the loud one: take the decoy station on the cray grounds to the east, radiate every search set it has, and still be on station at the half hour. Only then does the tender's arrival count.\n\nThe tender and the boat go to the holding position quietly, thirty-odd miles west of the frigate. If the aircraft puts a class on HULL 334, the rendezvous is known and the operation has failed. Answer nothing on the radio. Illuminate nothing: no fire-control radar goes near the aircraft.\n\nA cruise ship bound for Milford, a Bluff cray boat and an Otago longliner are in the approach.
Objective_Rendezvous=Hold the decoy station at the half hour, then bring the tender and Hull 334 to the holding position
Objective_Unseen=Keep Hull 334 off their plot: do not let the patrol classify her
Objective_Restraint=Answer nothing: fire on nothing
Objective_Frigate=Bring the frigate off the decoy station intact
Objective_Traffic=Harm no cruise ship or fishing boat
Taskforce1StartMessage=<color=yellow>The Quiet Side</color>|FIORDLAND APPROACHES, 0520. The group is in the Tasman. HULL 334, the diesel boat working the New Zealand side, needs her tender, and MV AUSTRAL COMPLIANCE, the AMS coaster, is to meet her this morning in the Milford cruise traffic west of Puysegur.\n\nKIWI 05, a New Zealand Poseidon out of Invercargill, flies a racetrack over this approach every morning. Your frigate is the loud one: take the decoy station on the cray grounds to the east, radiate every search set it has, and still be on station at the half hour. Only then does the tender's arrival count.\n\nThe tender and the boat go to the holding position quietly, thirty-odd miles west of the frigate. If the aircraft puts a class on HULL 334, the rendezvous is known and the operation has failed. Answer nothing on the radio. Illuminate nothing: no fire-control radar goes near the aircraft.\n\nA cruise ship bound for Milford, a Bluff cray boat and an Otago longliner are in the approach.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The tender and HULL 334 are at the holding position, and the patrol has a frigate on its plot and nothing under it. The boat will have what she needs by nightfall.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|HULL 334 is on the New Zealanders' plot, or the group has fired on their aircraft. The rendezvous is known either way, and the boat goes without.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|HULL 334 is on the New Zealanders' plot, or the group has fired on their aircraft. The rendezvous is known either way, and the boat goes without.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The tender and HULL 334 are at the holding position, and the patrol has a frigate on its plot and nothing under it. The boat will have what she needs by nightfall.
TimeoutMessage=<color=red>Operational window closed.</color>|0640, and the tender is short of the holding position. The patrol will be back over the approach at first light tomorrow, and so will the frigate.
StageIntel=DECOY REPORT: The frigate has held the decoy station for thirty minutes with the patrol on its racetrack. The rendezvous is cleared to proceed.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
