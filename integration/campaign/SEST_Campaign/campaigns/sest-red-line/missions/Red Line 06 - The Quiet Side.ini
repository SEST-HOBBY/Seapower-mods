[Language_en]
Name=Red Line 06 - The Quiet Side
Description=FIORDLAND APPROACHES, 0520. AUSTRAL COMPLIANCE is on the final approach to meet HULL 334. One of Meridian's contractor vessels, FV AUSTRAL WARDEN, has rejected the handover and is closing the tender. It is a Q-ship with a wake-homing torpedo, not another fishing boat. Expect its attack around minute twelve if it is left alone. The Q-ship is declared hostile and may be engaged before it fires.\n\nYour screen still provides the loud decoy on the eastern station, but it needs to be there at minute eight while the tender completes the final leg. The screen is some thirty miles from the rendezvous; HULL 334 is the nearby combat unit and can counter the Q-ship while the screen holds the patrol's attention. Keep enough time for a torpedo to reach the Q-ship before its own shot reaches the slow tender.\n\nDestroy the Q-ship and bring the tender and boat together in the holding box. KIWI 05 remains a protected patrol aircraft. Leave it alone. Keep HULL 334 quiet where possible: classification loses the concealment bonus but does not end the mission. Report the compromise and continue the defence and rendezvous.\n\nThe Milford cruise ship and local fishing boats are protected. They are not cover for an indiscriminate attack.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Rendezvous=Cover the decoy station at minute eight, stop the Q-ship, then bring the tender and Hull 334 to the holding position
Objective_Unseen=Avoid classification if possible; detection does not end the mission
Objective_Restraint=Do not attack Kiwi 05 or civil traffic
Objective_Frigate=Bring the screen off the decoy station intact
Objective_Tender=Keep Austral Compliance afloat
Objective_Boat=Keep Hull 334 afloat
Objective_Qship=Destroy the hostile Q-ship threatening the tender
Objective_Traffic=Harm no cruise ship or fishing boat
Taskforce1StartMessage=<color=yellow>The Quiet Side</color>|FIORDLAND APPROACHES, 0520. AUSTRAL COMPLIANCE is on the final approach to meet HULL 334. One of Meridian's contractor vessels, FV AUSTRAL WARDEN, has rejected the handover and is closing the tender. It is a Q-ship with a wake-homing torpedo, not another fishing boat. Expect its attack around minute twelve if it is left alone. The Q-ship is declared hostile and may be engaged before it fires.\n\nYour screen still provides the loud decoy on the eastern station, but it needs to be there at minute eight while the tender completes the final leg. The screen is some thirty miles from the rendezvous; HULL 334 is the nearby combat unit and can counter the Q-ship while the screen holds the patrol's attention. Keep enough time for a torpedo to reach the Q-ship before its own shot reaches the slow tender.\n\nDestroy the Q-ship and bring the tender and boat together in the holding box. KIWI 05 remains a protected patrol aircraft. Leave it alone. Keep HULL 334 quiet where possible: classification loses the concealment bonus but does not end the mission. Report the compromise and continue the defence and rendezvous.\n\nThe Milford cruise ship and local fishing boats are protected. They are not cover for an indiscriminate attack.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The Q-ship is stopped and Austral Compliance has met Hull 334. The tender and boat survived; concealment is scored separately from the completed rendezvous.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The tender or Hull 334 is lost, or the protected patrol aircraft has been destroyed. The rendezvous cannot proceed.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The tender or Hull 334 is lost, or the protected patrol aircraft has been destroyed. The rendezvous cannot proceed.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The Q-ship is stopped and Austral Compliance has met Hull 334. The tender and boat survived; concealment is scored separately from the completed rendezvous.
TimeoutMessage=<color=red>Operational window closed.</color>|0628, and the tender and boat have not completed their defended rendezvous.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 45-minute window has closed. Command will hold the line for about 23 minutes more. Finish the task now.
SituationReport1Intel=TENDER CONTROL: Austral Warden is the hostile Q-ship, west of the tender. Hull 334 can engage it; the frigate should not abandon the decoy station before minute eight. Losing concealment costs points, not the whole operation.
SituationReport2Intel=TENDER CONTROL: Austral Warden is the Q-ship threatening the tender. Hull 334 can counter it while the screen covers the decoy station at minute eight. Classification costs the stealth bonus; it no longer ends the operation.
StageIntel=DECOY REPORT: The screen is on the decoy station at minute eight. The rendezvous is cleared to proceed.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
