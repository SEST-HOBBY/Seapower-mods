[Language_en]
Name=Red Line 04 - The Order to Withdraw
Description=TACTICAL UPDATE: A second Meridian vessel, the Q-ship FV MERIDIAN WARDEN, has turned on HULUNHU. Expect a torpedo attack around minute nine. Your screen must split its attention between the escaping coaster and the supplier; both Meridian vessels are declared hostile. The grey Poseidon and any surviving GOLF are protected non-belligerents. Do not attack them.\n\nBANDA SEA, 0310, 27 NOVEMBER. The ceasefire took effect at 0000. The group acknowledged the order to withdraw at 2304 last night and is carrying it out: LIAONING, the replenishment ship HULUNHU and HAI YANG 7, chartered, north-west for the Manipa approaches with what the twenty-third left, and your frigate on the starboard quarter. Not every group in the corridor has acknowledged. This one has, and the coalition is watching to see which is which.\n\nMV MERIDIAN HARMONY is not withdrawing. She is one of Meridian's armed coasters; she joined the group on the twenty-fourth asking for protection, and headquarters let her keep company. At 0240 she turned south for the Arafura lane, where the coalition's first convoy sails at first light tomorrow. She has been told to stop, twice, on the group's net and on channel 16, and has not answered. Meridian is not a party to the ceasefire. If she reaches that lane, whatever she does there she will have done from this group's company.\n\nA coalition Poseidon is overhead, recording the withdrawal, and a submarine may be astern. Neither is to be touched. Your frigate and its flight start at defensive settings: engage only the two Meridian vessels. The protected observers are non-belligerents. Stop the coaster before she reaches the marked circle south-east, where she clears the screen. Sink her, or close her with the screen's lead ship to within about three miles: she will heave to and follow the group, and from then she is a protected neutral whose loss ends the operation. Set the lead ship's weapons to Hold before closing, or she may open fire first. Then bring LIAONING and HULUNHU both within five miles of the withdrawal point north-west. The order is complete when both are inside that circle, MERIDIAN HARMONY is sunk or has hove to, and no incoming weapon is still tracked against the group.\n\nA Banda fishing boat and the Banda Neira ferry are on the water.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Withdrawal=Bring Liaoning and Hulunhu inside the withdrawal circle north-west
Objective_Spoiler=Also required: stop Meridian Harmony before she clears the screen, by sinking her or closing her until she heaves to
Objective_Restraint=Engage only the two declared hostile Meridian vessels, and not Meridian Harmony once she has hove to
Objective_Boat=Leave the boat astern alone, if she is there
Objective_Carrier=Bring Liaoning through intact
Objective_Supply=Keep Hulunhu afloat during the withdrawal
Objective_Qship=Stop the Q-ship attacking the replenishment ship
Objective_Traffic=Harm no protected contact or civil traffic
Taskforce1StartMessage=<color=yellow>The Order to Withdraw</color>|TACTICAL UPDATE: A second Meridian vessel, the Q-ship FV MERIDIAN WARDEN, has turned on HULUNHU. Expect a torpedo attack around minute nine. Your screen must split its attention between the escaping coaster and the supplier; both Meridian vessels are declared hostile. The grey Poseidon and any surviving GOLF are protected non-belligerents. Do not attack them.\n\nBANDA SEA, 0310, 27 NOVEMBER. The ceasefire took effect at 0000. The group acknowledged the order to withdraw at 2304 last night and is carrying it out: LIAONING, the replenishment ship HULUNHU and HAI YANG 7, chartered, north-west for the Manipa approaches with what the twenty-third left, and your frigate on the starboard quarter. Not every group in the corridor has acknowledged. This one has, and the coalition is watching to see which is which.\n\nMV MERIDIAN HARMONY is not withdrawing. She is one of Meridian's armed coasters; she joined the group on the twenty-fourth asking for protection, and headquarters let her keep company. At 0240 she turned south for the Arafura lane, where the coalition's first convoy sails at first light tomorrow. She has been told to stop, twice, on the group's net and on channel 16, and has not answered. Meridian is not a party to the ceasefire. If she reaches that lane, whatever she does there she will have done from this group's company.\n\nA coalition Poseidon is overhead, recording the withdrawal, and a submarine may be astern. Neither is to be touched. Your frigate and its flight start at defensive settings: engage only the two Meridian vessels. The protected observers are non-belligerents. Stop the coaster before she reaches the marked circle south-east, where she clears the screen. Sink her, or close her with the screen's lead ship to within about three miles: she will heave to and follow the group, and from then she is a protected neutral whose loss ends the operation. Set the lead ship's weapons to Hold before closing, or she may open fire first. Then bring LIAONING and HULUNHU both within five miles of the withdrawal point north-west. The order is complete when both are inside that circle, MERIDIAN HARMONY is sunk or has hove to, and no incoming weapon is still tracked against the group.\n\nA Banda fishing boat and the Banda Neira ferry are on the water.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|LIAONING and HULUNHU are inside the withdrawal circle, and MERIDIAN HARMONY is sunk short of the lane. The ship's flight is searching for her crew. The group's report will say what was done and why; the Poseidon has the same account.
PathHoveToVictoryMessage=<color=lime>Operation complete.</color>|LIAONING and HULUNHU are inside the withdrawal circle, and MERIDIAN HARMONY has hove to and is following the group north-west. The group's report will say what was done and why; the Poseidon has the same account.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The withdrawal has failed: LIAONING or HULUNHU is lost, or the Poseidon is down. The ceasefire is hours old, and the group is in its first violation report.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The withdrawal has failed: LIAONING or HULUNHU is lost, or the Poseidon is down. The ceasefire is hours old, and the group is in its first violation report.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|LIAONING and HULUNHU are inside the withdrawal circle, and MERIDIAN HARMONY is sunk short of the lane. The ship's flight is searching for her crew. The group's report will say what was done and why; the Poseidon has the same account.
TimeoutMessage=<color=red>Operational window closed.</color>|0425, and the group is still short of the withdrawal circle. The withdrawal order had a time on it, and the coalition's aircraft has recorded the group missing it.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 50-minute window has closed. Command will hold the line for about 25 minutes more. Finish the task now.
SituationReport1Intel=GROUP STAFF: The coaster is the escape problem; the Q-ship is the immediate threat to Hulunhu. Use separate assignments, and do not send the whole screen away from the replenishment ship.
SituationReport2Intel=GROUP STAFF: The coaster is escaping while the Q-ship threatens Hulunhu. Split assignments without stripping the supplier of its screen. The grey coalition observers are protected by the ceasefire.
ProgressHalfwayIntel=GROUP STAFF: LIAONING and HULUNHU are halfway to the withdrawal point. Keep the screen between them and the Q-ship.
ProgressFirstInIntel=GROUP STAFF: The first of LIAONING and HULUNHU is inside the withdrawal circle. The order is complete when both are, MERIDIAN HARMONY is stopped and nothing is inbound.
ProgressRunningIntel=GROUP STAFF: MERIDIAN HARMONY is halfway to clearing the screen. Sink her or close her now.
Denied1Message=<color=red>Operation failed.</color>|MERIDIAN HARMONY has cleared the screen and is running south for the lane at full speed. The group cannot follow her and keep its withdrawal order. Whatever she does tomorrow, she sailed from this group's company.
TurnBackHeaveToIntel=BRIDGE: MERIDIAN HARMONY has answered at last. She has hove to and is turning to follow the group north-west. She is no longer a declared hostile; do not fire on her.
TurnBackHeaveToLostMessage=<color=red>Operation failed.</color>|MERIDIAN HARMONY had hove to and was following the group when she was sunk. Under the ceasefire that is the group's violation, and the Poseidon has it recorded.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
