[Language_en]
Name=Makran Line 01 - The Fuel Road
Description=KARACHI APPROACHES, 0630. MT SINDH VOYAGER and MT ORMARA TRADER weighed at first light from the outer roads with crude for the refinery and diesel for the city. They are the first tankers to sail for Karachi since the war-risk listing, and the masters sailed on the Navy's word that they would be escorted.\n\nTwo Meridian armed trawlers left the coast west of Sonmiani before dawn and are running east at their best speed. Meridian calls them escorts. Last week one of them ordered a Liberian tanker to divert to a Meridian terminal and put a burst of 40 mm across her bow when she would not. A third trawler, with no nets out, has kept station on the convoy since it weighed.\n\nBring both tankers within six miles of the Karachi pilot station, twenty-six miles north-east. The convoy's task is complete when both are inside that circle. Your ships are weapons Free. If the Meridian boats close the convoy, stop them. The trawler keeping company is Meridian's eyes on the convoy; she has not fired.\n\nFishing dhows, an outbound freighter and the morning Dubai service are on the water and in the air. Identify before you fire.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Convoy=Bring both tankers within six miles of the Karachi pilot station
Objective_Ships=Lose neither tanker
Objective_Raiders=Sink the two Meridian boats if they close the convoy
Objective_Traffic=Harm no dhow, freighter or airliner
Taskforce1StartMessage=<color=yellow>The Fuel Road</color>|KARACHI APPROACHES, 0630. MT SINDH VOYAGER and MT ORMARA TRADER weighed at first light from the outer roads with crude for the refinery and diesel for the city. They are the first tankers to sail for Karachi since the war-risk listing, and the masters sailed on the Navy's word that they would be escorted.\n\nTwo Meridian armed trawlers left the coast west of Sonmiani before dawn and are running east at their best speed. Meridian calls them escorts. Last week one of them ordered a Liberian tanker to divert to a Meridian terminal and put a burst of 40 mm across her bow when she would not. A third trawler, with no nets out, has kept station on the convoy since it weighed.\n\nBring both tankers within six miles of the Karachi pilot station, twenty-six miles north-east. The convoy's task is complete when both are inside that circle. Your ships are weapons Free. If the Meridian boats close the convoy, stop them. The trawler keeping company is Meridian's eyes on the convoy; she has not fired.\n\nFishing dhows, an outbound freighter and the morning Dubai service are on the water and in the air. Identify before you fire.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|SINDH VOYAGER and ORMARA TRADER are at the pilot station and the first pilot is climbing aboard. Two more masters at the Gulf end of the route have asked to sail under the same escort.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|A tanker is lost. The war-risk listing will stay, and the next masters will take Meridian's escort rather than the Navy's.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|A tanker is lost. The war-risk listing will stay, and the next masters will take Meridian's escort rather than the Navy's.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|SINDH VOYAGER and ORMARA TRADER are at the pilot station and the first pilot is climbing aboard. Two more masters at the Gulf end of the route have asked to sail under the same escort.
TimeoutMessage=<color=red>Operational window closed.</color>|0915, and the convoy is still short of the pilot station. The masters anchor where they are and ask Karachi why.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 110-minute window has closed. Command will hold the line for about 55 minutes more. Finish the task now.
SituationReport1Intel=FLEET OPERATIONS / TF-88: The Meridian boats will offer an escort before they show a weapon. Keep the frigate between them and the tankers, and identify every dhow before you fire.
ProgressHalfwayIntel=CONVOY COMMODORE: Both tankers are halfway to the pilot station. Keep the screen between them and the boats to the west.
ProgressFirstInIntel=KARACHI PORT CONTROL: The first tanker is inside the six-mile circle off the pilot station. The convoy is in when both are.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
