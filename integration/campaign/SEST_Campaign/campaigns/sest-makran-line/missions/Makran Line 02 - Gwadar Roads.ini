[Language_en]
Name=Makran Line 02 - Gwadar Roads
Description=GWADAR ROADS, 0550. MT INDUS PRIDE and MT HAB RIVER have been at anchor seven miles south of the port for three days, with Gwadar's fuel. Two merchants are at anchor west of them, waiting for a berth, and a third freighter anchored among them last night without answering the port.\n\nFleet intelligence assesses that she is MERIDIAN's: a freighter with SS-N-2 launchers under her hatch covers, sent to put a missile into the tankers at anchor. Three armed trawlers left the fishing grounds off Jiwani before dawn and are running north-east for the roads. The Air Force has released JF-17s and a ZDK-03 to the task group from Gwadar's field.\n\nSink the three trawlers and the armed freighter. The operation is complete when all four are sunk. Classify the anchored ships before you fire into the roads: two of them are merchants, and their crews are aboard. Your ships are weapons Free; the shore battery and the air-defence site at Gwadar start at Hold and are yours to release.\n\nFishing dhows are working the bay. Keep a missile defence over the two tankers.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Raiders=Sink the three Meridian armed trawlers
Objective_Launcher=Also required: find the armed freighter among the anchored ships and sink her
Objective_Anchorage=Lose neither tanker at anchor
Objective_Named=Classify the armed freighter among the anchored ships
Objective_Traffic=Harm no merchant or dhow that is what it says it is
Taskforce1StartMessage=<color=yellow>Gwadar Roads</color>|GWADAR ROADS, 0550. MT INDUS PRIDE and MT HAB RIVER have been at anchor seven miles south of the port for three days, with Gwadar's fuel. Two merchants are at anchor west of them, waiting for a berth, and a third freighter anchored among them last night without answering the port.\n\nFleet intelligence assesses that she is MERIDIAN's: a freighter with SS-N-2 launchers under her hatch covers, sent to put a missile into the tankers at anchor. Three armed trawlers left the fishing grounds off Jiwani before dawn and are running north-east for the roads. The Air Force has released JF-17s and a ZDK-03 to the task group from Gwadar's field.\n\nSink the three trawlers and the armed freighter. The operation is complete when all four are sunk. Classify the anchored ships before you fire into the roads: two of them are merchants, and their crews are aboard. Your ships are weapons Free; the shore battery and the air-defence site at Gwadar start at Hold and are yours to release.\n\nFishing dhows are working the bay. Keep a missile defence over the two tankers.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The three trawlers and the armed freighter are sunk, and the tankers are still at anchor with Gwadar's fuel. The port has sent out its first pilot in four days.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|A tanker at anchor is burning. Gwadar's fuel is in the sea, and the roads will be empty of shipping by tonight.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|A tanker at anchor is burning. Gwadar's fuel is in the sea, and the roads will be empty of shipping by tonight.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The three trawlers and the armed freighter are sunk, and the tankers are still at anchor with Gwadar's fuel. The port has sent out its first pilot in four days.
TimeoutMessage=<color=red>Operational window closed.</color>|0820, and Meridian still has ships in the roads. The port keeps its pilots ashore and the tankers sail for Karachi with their fuel.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 100-minute window has closed. Command will hold the line for about 50 minutes more. Finish the task now.
SituationReport1Intel=TF-88 STAFF: One of the ships at anchor is not a merchant. Classify before you shoot into the anchorage, keep a missile defence over the two tankers, and let the JF-17s work the trawlers to the south-west.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
