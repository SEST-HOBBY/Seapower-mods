Name=Southern Watch - Southern Reach - Red Line - Sulu Line
Description=SOUTHERN WATCH - The Northern Lifeline. October 2028. A confrontation elsewhere in the Indo-Pacific has drawn most of America's ready combat power north. Above Australia, forged movement orders, missing cargo records and insurers refusing cover are closing the sea lanes. The Meridian Maritime Group offers escorts, inspections and access to its terminals; some of its vessels carry armed teams. When one escort fires on an Indonesian patrol in the Arafura Sea, HMAS Warramunga is the nearest warship. Over six weeks, the Australian-led task group must protect people, fuel and supplies as the confrontation spreads to the Biak enclave and Chinese carrier groups in the Banda approaches. Allied detachments, recovered intelligence and the condition of surviving ships shape the next passage. A ceasefire eventually opens a route home, but the withdrawing forces and those still prepared to attack must be distinguished. SOUTHERN REACH - Tasman Shield. December 2028. Nine days after the northern ceasefire, the network that tried to close the Arafura has come south under a new flag. A fisheries and research protection group - a frigate, two corvettes, an intelligence trawler and, in the new year, the carrier Liaoning - is stopping Antarctic-bound ships off Tasmania. Its contractor, Austral Meridian Services, sells compliance corridors while a Russian submarine works the Macquarie Ridge. The Australian task group that held the north escorts the resupply season from Storm Bay to the ice edge at 60 South. As the formation turns north, the escort task follows it through Fiordland, Cook Strait, the Tasman, Bass Strait and the Bight. New Zealand's Poseidons support the search among ferries, tankers, gas platforms and undersea cables. Operations near Auckland and Adelaide decide which opposing detachments rejoin the carrier group for the fleet action in the western Tasman. RED LINE - The Other Watch. A PLAN commander's campaign across the northern crisis and southern summer. Defend Fujian against missile craft, escort the Biak fuel run through torpedo and missile attacks, fight for the reconnaissance aircraft, and stop a ceasefire spoiler while protecting the withdrawal. A compact submarine passage and a contested tender rendezvous vary the pace. Two optional air operations and a short pilot-recovery race sit between the six core missions. Coalition non-belligerents and civil traffic remain protected; declared hostile shooters can be engaged. SULU LINE - The Island Road. October 2028. With most of America's ready combat power drawn north, the Philippine Navy holds the island supply road alone: Puerto Princesa to the Balabac outpost, the gun line off Jolo, the boats to Ayungin Shoal. The Meridian network is arming the Sulu coast and Chinese ships are pushing on the shoals. A Philippine-led task group with a Royal Thai Navy detachment, and later one Australian frigate, escorts the convoys and fires for the Marines ashore. There is no free rearm. What a ship fires stays fired until a supply ship you bought comes alongside at sea - BRP Tarlac, the Thai oiler Chula or a chartered barge carrier - or a convoy you escorted holds its service window. Supply ships are sold at three points in the campaign. Lose one and what it carried is gone. Needs the Steam Workshop mods listed in REQUIRED-MODS.txt in this mod's folder; LOAD-ORDER.txt beside it is the Mod Manager order it was built and tested against. SETUP: Open Folder on this entry, quit the game, double-click "SETUP - double-click me.cmd" - it checks the subscriptions, installs the Anchor Chain preloader and sets the whole order for you.

