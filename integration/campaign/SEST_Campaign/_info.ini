Name=Southern Watch
Description=SOUTHERN WATCH - The Northern Lifeline. Twelve connected missions, October-November 2028: Australia and its regional partners keep the northern sea routes open through a maritime coercion campaign that escalates into a limited regional war, with four optional operations and two contingencies whose results later missions read. Survivors your helicopters and ships pick up are paid as requisition points at each debrief - with Automatic SAR, right-click a helicopter or ship and choose Start automatic SAR. Eight optional dispatches - allied rotations, an opposing-force passage, a weapons range, an openly speculative future branch and a Cold War anthology - give the rest of the collection a purposeful role. Fiction throughout. Needs the Steam Workshop mods listed in REQUIRED-MODS.txt, in this mod's own folder; LOAD-ORDER.txt beside it is the Mod Manager order it was built and tested against.

