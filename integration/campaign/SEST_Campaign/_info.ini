Name=Southern Watch - Southern Reach
Description=SOUTHERN WATCH - The Northern Lifeline. October 2028. A confrontation elsewhere in the Indo-Pacific has drawn most of America's ready combat power north, and the sea lanes above Australia are closing without a shot fired: forged movement orders, missing cargo records, insurers refusing cover. The Meridian Maritime Group offers escorts, inspections and its own terminals, and some of its ships carry armed teams. When one of its escorts fires on an Indonesian patrol in the Arafura Sea, HMAS Warramunga is the nearest warship. Twelve missions over six weeks take an Australian task group from convoy escort under tight rules of engagement to a contested enclave, a Chinese carrier group in the Banda approaches, and a ceasefire convoy that has to cross without restarting the war. Four optional operations and two contingencies change what later missions hold. Eight dispatches follow allied detachments, the other side's supply run, a live-fire range week, a 2034 what-if and a 1988 exercise in the same waters. SOUTHERN REACH - Tasman Shield. December 2028. Nine days after the northern ceasefire, the network that tried to close the Arafura has come south under a new flag. A 'fisheries and research protection group' - a frigate, two corvettes, an intelligence trawler and, in the new year, the carrier Liaoning - is stopping ships bound for Antarctica sixty miles off Tasmania, its contractor Austral Meridian Services is selling 'compliance corridors' to the trade, and a Russian submarine is working the Macquarie Ridge. Twelve missions escort the Antarctic resupply season from Storm Bay to the ice edge at 60 South, where contacts are few and naming a trawler is half the fight. Then Tasman Shield: twelve more with the same worn ships, through Fiordland, Cook Strait, the Tasman, Bass Strait and the Bight, among ferries, tankers, gas platforms and undersea cables, with New Zealand's Poseidons overhead. Two optional operations decide who reinforces the last fight off Sydney. Needs the Steam Workshop mods listed in REQUIRED-MODS.txt in this mod's folder; LOAD-ORDER.txt beside it is the Mod Manager order it was built and tested against.

