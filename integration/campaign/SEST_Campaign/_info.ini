[Language_en]
Name=Southern Watch - Southern Reach
Description=SOUTHERN WATCH - The Northern Lifeline. Twelve connected missions, October-November 2028: Australia and its regional partners keep the northern sea routes open through a maritime coercion campaign that escalates into a limited regional war, with four optional operations and two contingencies whose results later missions read. Survivors your helicopters and ships pick up are paid as requisition points at each debrief - with Automatic SAR, right-click a helicopter or ship and choose Start automatic SAR. Eight optional dispatches - allied rotations, an opposing-force passage, a weapons range, an openly speculative future branch and a Cold War anthology - give the rest of the collection a purposeful role. Fiction throughout. Needs the Steam Workshop mods listed in REQUIRED-MODS.txt, in this mod's own folder; LOAD-ORDER.txt beside it is the Mod Manager order it was built and tested against. SOUTHERN REACH - and its second chapter, TASMAN SHIELD. One continuous Task Force campaign, December 2028 to March 2029, following Southern Watch south: twelve missions escort the Antarctic resupply season through the Southern Ocean - Storm Bay, the Macquarie Ridge, the ice edge - where contacts are sparse, the weather sets the force you have, and identifying a trawler is most of the work; then twelve more defend the homeland approaches with the same worn force - Fiordland, Cook Strait, the Tasman, Bass Strait, the Bight - among ferries, tankers, rigs and cable routes. Australia and New Zealand carry the story; allied support is bounded and named. Fiction throughout. Needs the Steam Workshop mods in this pack's REQUIRED-MODS.txt; the campaign's own folder carries its narrower closure.

