Type=Scenario

[Language_en]
Name=Southern Watch - Dispatches
Description=Eight episodes alongside Southern Watch's twelve missions. Western Passage, Flight Deck Day, The Relief Ship and The Long Perimeter follow European, French and Spanish, and US detachments through the same crisis. Return Passage runs the other side's supply convoy. Range Week fires the missile-defence and ballistic systems on a live range. Long Reach is a 2034 what-if for the newest aircraft and weapons. Before the Lifeline is a 1988 exercise in the same waters, for the retired types.
