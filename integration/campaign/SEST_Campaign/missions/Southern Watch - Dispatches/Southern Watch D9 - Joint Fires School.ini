[Language_en]
Name=Southern Watch D9 - Joint Fires School
Description=TINDAL JOINT FIRES RANGE, 2030. This is a labelled exercise branch. An allied demonstration section brings a K9 and a PzH 2000; the opposing instrumented batteries use 2S19 and 2S43 models. They can return fire. The lesson is reconnaissance, target allocation and counter-battery timing, not a free barrage.\n\nELLIS has MOTH 21, a small RQ-7, and a local recovery strip. Work an oblique track, classify both gun positions, then choose which battery to suppress first. Your guns start with weapons held. The range safety buildings are protected. A red spider has been painted under the school sign; Ellis will not say whether it is the original one.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Guns=Silence both opposing gun batteries
Objective_Section=Preserve both allied guns
Objective_Safety=Harm no range-safety buildings
Objective_Observe=Classify both gun positions
Taskforce1StartMessage=<color=yellow>Joint Fires School</color>|TINDAL JOINT FIRES RANGE, 2030. This is a labelled exercise branch. An allied demonstration section brings a K9 and a PzH 2000; the opposing instrumented batteries use 2S19 and 2S43 models. They can return fire. The lesson is reconnaissance, target allocation and counter-battery timing, not a free barrage.\n\nELLIS has MOTH 21, a small RQ-7, and a local recovery strip. Work an oblique track, classify both gun positions, then choose which battery to suppress first. Your guns start with weapons held. The range safety buildings are protected. A red spider has been painted under the school sign; Ellis will not say whether it is the original one.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The two batteries are silent. Preserve the UAV recording and compare the first salvo with the corrected fire mission. The range staff can reset the targets; the lesson is yours to keep.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|Range control ends the serial. Review the reconnaissance track, target allocation and protected buildings before resetting.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|Range control ends the serial. Review the reconnaissance track, target allocation and protected buildings before resetting.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The two batteries are silent. Preserve the UAV recording and compare the first salvo with the corrected fire mission. The range staff can reset the targets; the lesson is yours to keep.
TimeoutMessage=<color=red>Operational window closed.</color>|The firing window has closed. The unneutralised batteries remain the next crew's problem.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 75-minute window has closed. Command will hold the line for about 37 minutes more. Finish the task now.
SituationReport1Intel=ELLIS: Confirm the UAV's own camera or sensor contact before correcting the guns. The two enemy models are different batteries; count their outgoing fire separately from your own impacts.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
