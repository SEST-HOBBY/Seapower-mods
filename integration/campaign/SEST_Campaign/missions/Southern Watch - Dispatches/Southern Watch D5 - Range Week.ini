[Language_en]
Name=Southern Watch D5 - Range Week
Description=NORTHERN TERRITORY RANGES. This is a trial, not a battle. The coalition has brought its layered-defence systems to the Darwin range for a fortnight of live shots, and the threat side of the range is run by the trials unit with captured and purchased launchers.\n\nToday's serial is the hard one. The range's own southern pads launch a mixed ballistic and cruise raid; a THAAD battery and a David's Sling pair defend against it while a Warthog flies the counter-launcher shot at the pads. The Sejjil pad is a target, not a shooter: everything on this range is inside its minimum range. A Japanese Type 12 battery is firing a separate anti-ship serial at the seaward target.
Objective_Pads=Destroy three of the four range threat pads
Objective_Serial=Put the anti-ship serial into the seaward target
Objective_Safety=Hit nothing outside the danger area
Objective_Battery=Keep all four launchers and radars in action
Taskforce1StartMessage=<color=yellow>Range Week</color>|NORTHERN TERRITORY RANGES. This is a trial, not a battle. The coalition has brought its layered-defence systems to the Darwin range for a fortnight of live shots, and the threat side of the range is run by the trials unit with captured and purchased launchers.\n\nToday's serial is the hard one. The range's own southern pads launch a mixed ballistic and cruise raid; a THAAD battery and a David's Sling pair defend against it while a Warthog flies the counter-launcher shot at the pads. The Sejjil pad is a target, not a shooter: everything on this range is inside its minimum range. A Japanese Type 12 battery is firing a separate anti-ship serial at the seaward target.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Three of four pads down, the anti-ship serial into the target and the trials staff already arguing about the fourth. Good week.
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|The serial is a write-off and the trials report will say so at length.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|The serial is a write-off and the trials report will say so at length.
Taskforce2DefeatMessage=<color=red>Command report.</color>|Three of four pads down, the anti-ship serial into the target and the trials staff already arguing about the fourth. Good week.
TimeoutMessage=<color=red>Operational window closed.</color>|The serial ran out of range time with pads still standing. The trials report will say so at length.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. Command has suspended the operation. Preserve the contact and engagement records.
