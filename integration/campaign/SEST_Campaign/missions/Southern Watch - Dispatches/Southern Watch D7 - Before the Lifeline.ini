[Language_en]
Name=Southern Watch D7 - Before the Lifeline
Description=DARWIN APPROACHES, July 1988. Exercise PITCH BLACK's maritime phase, with an American carrier group south of the Arafura and a mixed aggressor force flying the other side's profiles.\n\nA Bear G is running the maritime strike serial with a Badger tanker behind it, a Dragon Lady is high over the exercise box, and the Nighthawk detachment is flying its first Southern Hemisphere sortie with the F-8s of the aggressor squadron as its problem.\n\nIt was an exercise until 0412, when the Bear released a live round at the range ship and the aggressors started answering with real missiles. The umpires are still on the net: the Badger tanker is out of play and a shot at it is scored against you. It is also the only place in this collection where a Tomcat, an F-117, a Tornado and a Bear G share a sky without somebody having to invent a reason.
Objective_Serial=Kill the Bear before its release line
Objective_Recovery=Bring Dragon 41 home
Objective_Umpire=The tanker is out of play - a shot at it is scored against you
Taskforce1StartMessage=<color=yellow>Before the Lifeline</color>|DARWIN APPROACHES, July 1988. Exercise PITCH BLACK's maritime phase, with an American carrier group south of the Arafura and a mixed aggressor force flying the other side's profiles.\n\nA Bear G is running the maritime strike serial with a Badger tanker behind it, a Dragon Lady is high over the exercise box, and the Nighthawk detachment is flying its first Southern Hemisphere sortie with the F-8s of the aggressor squadron as its problem.\n\nIt was an exercise until 0412, when the Bear released a live round at the range ship and the aggressors started answering with real missiles. The umpires are still on the net: the Badger tanker is out of play and a shot at it is scored against you. It is also the only place in this collection where a Tomcat, an F-117, a Tornado and a Bear G share a sky without somebody having to invent a reason.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The strike serial was broken outside its release line and everybody recovered. The debrief will still take four hours.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The serial got through. Somebody's squadron is buying the drinks and writing the report.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The serial got through. Somebody's squadron is buying the drinks and writing the report.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The strike serial was broken outside its release line and everybody recovered. The debrief will still take four hours.
TimeoutMessage=<color=red>Out of time.</color>|The exercise serial expired. The umpires have scored it against you.
Denied1Message=<color=red>Mission failed.</color>|Bear G 90 is at its release line with the serial intact. The umpires score the simulated launch against the surface group.
