[Language_en]
Name=Southern Watch D10 - The Far Picture - Clear
Description=BANDA INSTRUMENTED RANGE, 2034. This is the openly speculative test branch. Two identical US Navy F/A-18F aircraft carry SEST MALICE and SEST AIM-260 respectively; a third carries the AIM-174B Gunslinger interceptor fit. All start at the same altitude and speed, with weapons held. The target set contains a Felon, a J-20A, a J-15D and a KJ-500 at individually separated stations.\n\nCLEAR disables target sensors. CONTESTED restores their normal sensor and electronic-warfare systems; nothing else in the scenario changes. Allow the engine to establish its tracks. Select one shooter, retain the others on Hold, and record the offered solution before closing the range. Repeat from a fresh start for the next weapon. The test is not deterministic: crew, detection, target manoeuvre and seeker behaviour can still vary.\n\nThe targets fly local loops with weapons held. The range ends when all four are destroyed. You can instead quit after recording a useful comparison. Use the same launch altitude, speed, target bearing and target state in both copies. Roosevelt is not deployed here; all blue aircraft recover to Langgur.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Trial=Complete the four target engagements or exit after recording the comparison
Objective_Aircraft=Preserve the three test aircraft
Taskforce1StartMessage=<color=yellow>The Far Picture - Clear</color>|BANDA INSTRUMENTED RANGE, 2034. This is the openly speculative test branch. Two identical US Navy F/A-18F aircraft carry SEST MALICE and SEST AIM-260 respectively; a third carries the AIM-174B Gunslinger interceptor fit. All start at the same altitude and speed, with weapons held. The target set contains a Felon, a J-20A, a J-15D and a KJ-500 at individually separated stations.\n\nCLEAR disables target sensors. CONTESTED restores their normal sensor and electronic-warfare systems; nothing else in the scenario changes. Allow the engine to establish its tracks. Select one shooter, retain the others on Hold, and record the offered solution before closing the range. Repeat from a fresh start for the next weapon. The test is not deterministic: crew, detection, target manoeuvre and seeker behaviour can still vary.\n\nThe targets fly local loops with weapons held. The range ends when all four are destroyed. You can instead quit after recording a useful comparison. Use the same launch altitude, speed, target bearing and target state in both copies. Roosevelt is not deployed here; all blue aircraft recover to Langgur.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The target set is complete. Compare the recorded engagement solutions, flight times and terminal outcomes before changing any missile definition.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The test ended before completion. Preserve the observations already recorded.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The test ended before completion. Preserve the observations already recorded.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The target set is complete. Compare the recorded engagement solutions, flight times and terminal outcomes before changing any missile definition.
TimeoutMessage=<color=red>Operational window closed.</color>|The range window is closed. Retain the engagement records and reset for a matched comparison.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 80-minute window has closed. Command will hold the line for about 40 minutes more. Finish the task now.
SituationReport1Intel=RANGE CONTROL: Clear run. Target sensors are disabled. Record the offered launch solution before switching any test shooter to Free. Restart before comparing a different weapon against the same geometry.
