[Language_en]
Name=SEST Southern Watch D5 - Range Week
Description=NORTHERN TERRITORY RANGES. This is a trial, not a battle. The coalition has brought its layered-defence systems to Delamere for a fortnight of live shots, and the threat side of the range is run by the trials unit with captured and purchased launchers.\n\nToday's serial is the hard one: a THAAD battery and a David's Sling pair engaging a mixed ballistic and cruise raid launched from the range's own northern pads. A Japanese Type 12 battery is firing a separate anti-ship serial at the seaward target, and an ARRW round is being flown out of the range field.\n\nEverything red here belongs to the range. Nothing ashore is somebody's country. Score the intercepts and do not put a round outside the danger area.
Objective_Intercepts=Defeat the range raid
Objective_Serial=Complete the anti-ship serial
Objective_Safety=Keep everything inside the danger area
Taskforce1StartMessage=<color=yellow>Range Week</color>|NORTHERN TERRITORY RANGES. This is a trial, not a battle. The coalition has brought its layered-defence systems to Delamere for a fortnight of live shots, and the threat side of the range is run by the trials unit with captured and purchased launchers.\n\nToday's serial is the hard one: a THAAD battery and a David's Sling pair engaging a mixed ballistic and cruise raid launched from the range's own northern pads. A Japanese Type 12 battery is firing a separate anti-ship serial at the seaward target, and an ARRW round is being flown out of the range field.\n\nEverything red here belongs to the range. Nothing ashore is somebody's country. Score the intercepts and do not put a round outside the danger area.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Three of four range rounds intercepted, the anti-ship serial away and the trials staff already arguing about the fourth. Good week.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The serial is a write-off and the trials report will say so at length.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The serial is a write-off and the trials report will say so at length.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Three of four range rounds intercepted, the anti-ship serial away and the trials staff already arguing about the fourth. Good week.
NeutralLossMessage=<color=orange>Neutral contact hit.</color>|That one was not ours to shoot. It goes in the record.
