[Language_en]
Name=SEST Southern Watch D1 - Western Passage
Description=WESTERN APPROACH. The corridor runs on fuel that arrives from outside it, and the replenishment group coming up from the Indian Ocean is the reason anything in the Banda still has range.\n\nThe escort is a European rotation: a Type 45 with its Merlin, a German F124, a Dutch De Zeven Provincien, a Danish Iver Huitfeldt, an Italian FREMM and an older Type 23 that was already east when this started. Typhoons out of Butterworth hold the air, with a Swedish AEW aircraft lent for the transit.\n\nThe expeditionary detachment has put a MiG-35 pair and a Su-24 up along the northern edge. They are here to find the oiler, not to fight your escorts. Do not let them do either.
Objective_Oiler=The replenishment group reaches the eastern box
Objective_Escorts=Keep the escort rotation intact
Objective_Shadow=Deny the shadowers a targeting solution
Taskforce1StartMessage=<color=yellow>Western Passage</color>|WESTERN APPROACH. The corridor runs on fuel that arrives from outside it, and the replenishment group coming up from the Indian Ocean is the reason anything in the Banda still has range.\n\nThe escort is a European rotation: a Type 45 with its Merlin, a German F124, a Dutch De Zeven Provincien, a Danish Iver Huitfeldt, an Italian FREMM and an older Type 23 that was already east when this started. Typhoons out of Butterworth hold the air, with a Swedish AEW aircraft lent for the transit.\n\nThe expeditionary detachment has put a MiG-35 pair and a Su-24 up along the northern edge. They are here to find the oiler, not to fight your escorts. Do not let them do either.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The group is in the eastern box and every escort in the rotation is still answering. The corridor has fuel for another fortnight.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The oiler is gone. Everything east of here now plans around a tank that does not refill.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The oiler is gone. Everything east of here now plans around a tank that does not refill.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The group is in the eastern box and every escort in the rotation is still answering. The corridor has fuel for another fortnight.
TimeoutMessage=<color=red>Out of time.</color>|The group is still west of the line. The corridor plans around a tank that does not refill.
