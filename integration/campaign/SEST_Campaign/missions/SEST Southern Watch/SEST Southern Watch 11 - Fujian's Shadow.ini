[Language_en]
Name=SEST Southern Watch 11 - Fujian's Shadow
Description=WIDER BANDA APPROACHES. The ceasefire talks open on Friday and the opposing fleet has been told to make the corridor unusable before they do. FUJIAN is three hundred miles north-west with LIAONING astern of her, and the strike they are building is aimed at the transports, not at you.\n\nFORD arrived on Tuesday under a bounded arrangement: one strike group, a defined window, and a departure date that does not move. You have her air wing, two Burkes and the last of the Australian escorts.\n\nThe protected transports and FORD herself have to come out of this usable. If their carrier turns north having achieved nothing, that is the whole victory - you are not chasing it across the Celebes Sea to prove a point.
Objective_Transports=The transport group must pass to the south-east
Objective_Ford=USS Gerald R. Ford survives the window
Objective_Strike=Break up the opposing strike
Taskforce1StartMessage=<color=yellow>Fujian's Shadow</color>|WIDER BANDA APPROACHES. The ceasefire talks open on Friday and the opposing fleet has been told to make the corridor unusable before they do. FUJIAN is three hundred miles north-west with LIAONING astern of her, and the strike they are building is aimed at the transports, not at you.\n\nFORD arrived on Tuesday under a bounded arrangement: one strike group, a defined window, and a departure date that does not move. You have her air wing, two Burkes and the last of the Australian escorts.\n\nThe protected transports and FORD herself have to come out of this usable. If their carrier turns north having achieved nothing, that is the whole victory - you are not chasing it across the Celebes Sea to prove a point.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The transports are through and Ford is intact with her window unexpired. Their carrier group is heading north-west and the talks open on Friday with the corridor open.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The corridor is closed and the talks open with that as the first fact on the table.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The corridor is closed and the talks open with that as the first fact on the table.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The transports are through and Ford is intact with her window unexpired. Their carrier group is heading north-west and the talks open on Friday with the corridor open.
TimeoutMessage=<color=red>Out of time.</color>|The transports never cleared the approaches. The talks open on Friday with the corridor closed.
