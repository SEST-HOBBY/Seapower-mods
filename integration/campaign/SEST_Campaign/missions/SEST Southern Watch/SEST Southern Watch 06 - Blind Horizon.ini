[Language_en]
Name=SEST Southern Watch 06 - Blind Horizon
Description=ARAFURA SEA, first light. HOBART is covering a convoy across the top of the Gulf and can hold an air picture out to about her own horizon. The surface group that matters is somewhere north of that line.\n\nSENTRY 06 is your Triton, launched from Tindal, and it is the only thing that can find them before they are inside missile range. It is unarmed, it is slow, and a pair of J-16s has come south off the enclave field on a vector that only makes sense if they know where the orbit is.\n\nClassify that surface group and it stays on your plot for the rest of the morning. To do it the Triton has to go north, into the part of the sky the J-16s own. Hold her south and she lives, and HOBART fights on her own horizon.\n\nTwo Tindal F-35As are your entire air cover. You can spend them protecting the orbit or holding close escort on the convoy. You cannot do both, and whatever you lose today you do not have tomorrow.
Objective_Convoy=The convoy reaches its passage window
Objective_Picture=Classify the northern surface group
Objective_Sentry=Keep the Triton flying
Objective_Hobart=Hobart survives
Taskforce1StartMessage=<color=yellow>Blind Horizon</color>|ARAFURA SEA, first light. HOBART is covering a convoy across the top of the Gulf and can hold an air picture out to about her own horizon. The surface group that matters is somewhere north of that line.\n\nSENTRY 06 is your Triton, launched from Tindal, and it is the only thing that can find them before they are inside missile range. It is unarmed, it is slow, and a pair of J-16s has come south off the enclave field on a vector that only makes sense if they know where the orbit is.\n\nClassify that surface group and it stays on your plot for the rest of the morning. To do it the Triton has to go north, into the part of the sky the J-16s own. Hold her south and she lives, and HOBART fights on her own horizon.\n\nTwo Tindal F-35As are your entire air cover. You can spend them protecting the orbit or holding close escort on the convoy. You cannot do both, and whatever you lose today you do not have tomorrow.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The convoy is through the window and Sentry 06 is on its way back to Tindal with the surface picture. Tomorrow starts with information.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The orbit is gone. Everything north of the horizon is now a rumour, and the convoy is inside somebody's launch basket.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The orbit is gone. Everything north of the horizon is now a rumour, and the convoy is inside somebody's launch basket.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The convoy is through the window and Sentry 06 is on its way back to Tindal with the surface picture. Tomorrow starts with information.
TimeoutMessage=<color=red>Out of time.</color>|The passage window closed. The convoy is holding in open water inside somebody's launch basket.
PictureIntel=Sentry 06 has the northern group classified: two escorts on a south-westerly course, with the fighters that came for her now on your plot. The picture holds for the rest of the operation.
SupportLoss1Intel=Sentry 06 is lost. The surface picture north of the horizon goes with her, and a replacement Triton is 60 points and a week of crew work at Edinburgh.
