[Language_en]
Name=Red Line 05 - Under the Convergence
Description=SOUTH OF THE BIGHT, 0430. LIAONING is three days astern. HULL 419 goes ahead of her, and nobody is to know the boat is in the Southern Ocean until the carrier is.\n\nThe RAAF has flown a Poseidon barrier across this line since Christmas Eve. Canberra and Wellington have authorised action against one submarine, the Russian boat they blame for the coaster torpedoed on the twenty-first, and their aircraft carry torpedoes. At forty-seven south, on a sonobuoy, one nuclear boat sounds much like another.\n\nTake HULL 419 through the barrier to the forward box. Nothing is fired. If the patrol puts a class on her, the boat is a named contact before the carrier arrives and the operation has failed.\n\nA longliner, an expedition cruise ship bound for the ice, a bulker for Hobart and a humpback are in the sonar picture. Use them.
Objective_Passage=Take Hull 419 through the barrier to the carrier's forward box
Objective_Unseen=Keep Hull 419 off their plot: do not let the patrol classify her
Objective_Restraint=Fire on nothing
Objective_Boat=Bring Hull 419 through intact
Objective_Traffic=Harm no fishing boat, merchant or whale
Taskforce1StartMessage=<color=yellow>Under the Convergence</color>|SOUTH OF THE BIGHT, 0430. LIAONING is three days astern. HULL 419 goes ahead of her, and nobody is to know the boat is in the Southern Ocean until the carrier is.\n\nThe RAAF has flown a Poseidon barrier across this line since Christmas Eve. Canberra and Wellington have authorised action against one submarine, the Russian boat they blame for the coaster torpedoed on the twenty-first, and their aircraft carry torpedoes. At forty-seven south, on a sonobuoy, one nuclear boat sounds much like another.\n\nTake HULL 419 through the barrier to the forward box. Nothing is fired. If the patrol puts a class on her, the boat is a named contact before the carrier arrives and the operation has failed.\n\nA longliner, an expedition cruise ship bound for the ice, a bulker for Hobart and a humpback are in the sonar picture. Use them.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|HULL 419 is in the forward box and the coalition's plot has no Type 093B on it. The coalition knows a carrier is coming. It does not know her submarine is already here.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|HULL 419 is on the coalition's plot, or on the bottom. Either way the group's screen boat is a named contact before the carrier arrives, and the southern task starts from that.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|HULL 419 is on the coalition's plot, or on the bottom. Either way the group's screen boat is a named contact before the carrier arrives, and the southern task starts from that.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|HULL 419 is in the forward box and the coalition's plot has no Type 093B on it. The coalition knows a carrier is coming. It does not know her submarine is already here.
TimeoutMessage=<color=red>Operational window closed.</color>|0550, and HULL 419 is short of the box. She will be in it by nightfall, a day behind the plan the carrier is sailing to.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
