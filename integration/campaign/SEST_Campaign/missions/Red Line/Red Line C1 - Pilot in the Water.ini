[Language_en]
Name=Red Line C1 - Pilot in the Water
Description=BANDA SEA, 0610. At 0447 FLYING SHARK 85, a J-15 on LIAONING's dawn patrol, reported a fire warning sixty miles south-east of the group and went into the sea at 0452. The pilot ejected. His beacon has been transmitting since 0455, and he is on your plot, alive in his raft.\n\nThe Australians heard it too. A patrol vessel of theirs in the southern approaches turned for the beacon at 0540 and is closing at about twenty knots, a little under nine miles off him. Nobody aboard her has fired at anybody. Anything that happens to her, or to the Poseidon overhead, is the group firing on a ship that is recovering a man.\n\nYour detachment is about seven miles north-west of him: closer than she is, and faster. Short of your best speed she is there first. Get the lead ship close alongside, inside three cables, stopped, put the boat in the water and hold there until he is aboard: about four minutes. If the patrol vessel is alongside him first, he goes home on the Australians' timetable, and the coalition has a photograph of a Chinese pilot on an Australian deck.\n\nYour ships and the ship's flight start at weapons Hold. Two Banda fishing boats are on the water.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Pilot=Get the lead ship alongside the pilot and hold there until he is aboard, before the patrol vessel reaches him
Objective_Restraint=Fire on nothing: not the patrol vessel, not the aircraft
Objective_Watchers=Classify the patrol vessel and the aircraft over her
Objective_Traffic=Harm no fishing boat
Taskforce1StartMessage=<color=yellow>Pilot in the Water</color>|BANDA SEA, 0610. At 0447 FLYING SHARK 85, a J-15 on LIAONING's dawn patrol, reported a fire warning sixty miles south-east of the group and went into the sea at 0452. The pilot ejected. His beacon has been transmitting since 0455, and he is on your plot, alive in his raft.\n\nThe Australians heard it too. A patrol vessel of theirs in the southern approaches turned for the beacon at 0540 and is closing at about twenty knots, a little under nine miles off him. Nobody aboard her has fired at anybody. Anything that happens to her, or to the Poseidon overhead, is the group firing on a ship that is recovering a man.\n\nYour detachment is about seven miles north-west of him: closer than she is, and faster. Short of your best speed she is there first. Get the lead ship close alongside, inside three cables, stopped, put the boat in the water and hold there until he is aboard: about four minutes. If the patrol vessel is alongside him first, he goes home on the Australians' timetable, and the coalition has a photograph of a Chinese pilot on an Australian deck.\n\nYour ships and the ship's flight start at weapons Hold. Two Banda fishing boats are on the water.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
FlightDeckPrepMessage=AIRCRAFT AND UNIT PREPARATION|Choose Start preparation to close this message. Keep the simulation paused; select your ships and ground teams on the map or in Formation Manager. Open each Flight Deck window and assign aircraft and loadouts. Set weapon status and individual sensor switches using the normal unit controls. When flight-deck timings are enabled, the native preparation phase finishes queued aircraft preparation at the first unpause. Review air-defence orders before unpausing; the operation clock and enemy action then begin.|Start preparation
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The pilot of FLYING SHARK 85 is aboard and the detachment is turning for the group. The patrol vessel has stopped short of the raft and is recovering her own boat. The Poseidon's recording shows two ships racing for one man, and the right one winning.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The patrol vessel or the Poseidon has been fired on. The group has done the one thing its orders say it will not do, over a man in the water, and the coalition has it recorded.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The patrol vessel or the Poseidon has been fired on. The group has done the one thing its orders say it will not do, over a man in the water, and the coalition has it recorded.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The pilot of FLYING SHARK 85 is aboard and the detachment is turning for the group. The patrol vessel has stopped short of the raft and is recovering her own boat. The Poseidon's recording shows two ships racing for one man, and the right one winning.
TimeoutMessage=<color=red>Operational window closed.</color>|0702, and nobody has the pilot. Whichever ship reaches him now, he has been in the water too long.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 35-minute window has closed. Command will hold the line for about 17 minutes more. Finish the task now.
SituationReport1Intel=SEA BOAT: The beacon is the datum. Run straight at it, put the flight overhead to mark him, and stop the ship upwind of the raft. Do not cross the patrol vessel's bow; she has the same right to be there that we do.
StageIntel=SEA BOAT: The ship is alongside the raft and the boat is in the water. Hold her here, stopped, until the pilot is aboard.
StageHeldMessage=<color=yellow>Pilot aboard.</color>|SEA BOAT: The pilot of Flying Shark 85 is aboard, cold and talking. The boat is coming back to the davit.
Denied1Message=<color=red>Operation failed.</color>|The Australian patrol vessel is alongside the raft and her boat has the pilot. He goes home when Canberra says so, and the coalition has the photograph.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
