Name=Southern Watch
Description=SOUTHERN WATCH - The Northern Lifeline. October 2028. A confrontation elsewhere in the Indo-Pacific has drawn most of America's ready combat power north, and the sea lanes above Australia are closing without a shot fired: forged movement orders, missing cargo records, insurers refusing cover. The Meridian Maritime Group offers escorts, inspections and its own terminals, and some of its ships carry armed teams. When one of its escorts fires on an Indonesian patrol in the Arafura Sea, HMAS Warramunga is the nearest warship. Twelve missions over six weeks take an Australian task group from convoy escort under tight rules of engagement to a contested enclave, a Chinese carrier group in the Banda approaches, and a ceasefire convoy that has to cross without restarting the war. Four optional operations and two contingencies change what later missions hold. Eight dispatches follow allied detachments, the other side's supply run, a live-fire range week, a 2034 what-if and a 1988 exercise in the same waters.
