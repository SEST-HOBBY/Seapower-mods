[Language_en]
Name=Southern Watch 09 - Southern Lifeline
Description=REAR SUPPORT AREA, east of the Cape. COLLINS has been out for thirty-one days and comes home on Thursday whatever happens today. She is surfaced alongside SUPPLY taking fuel, stores and two crew off for medical, and while she is up there she is a very large grey target moving at eight knots.\n\nThe service window is thirty-five minutes and it runs on the clock, not on how much crossed the hose. Break off to chase something and the clock does not stop for you - what you lose is the part of the transfer nobody makes, not the deadline. When the thirty-five minutes are up, SUPPLY and COLLINS come south together or the window has failed.\n\nA Tu-214R came down the outside of the box last night and did not come back, which usually means somebody now knows where to look. There is an Akula unaccounted for and a Flanker pair within range of here. Keep the window open and get everybody out of it.
Objective_Service=Bring SUPPLY and COLLINS south together once the 35-minute window has run
Objective_Collins=HMAS Collins must survive
Objective_Supply=HMAS Supply must survive
Taskforce1StartMessage=<color=yellow>Southern Lifeline</color>|REAR SUPPORT AREA, east of the Cape. COLLINS has been out for thirty-one days and comes home on Thursday whatever happens today. She is surfaced alongside SUPPLY taking fuel, stores and two crew off for medical, and while she is up there she is a very large grey target moving at eight knots.\n\nThe service window is thirty-five minutes and it runs on the clock, not on how much crossed the hose. Break off to chase something and the clock does not stop for you - what you lose is the part of the transfer nobody makes, not the deadline. When the thirty-five minutes are up, SUPPLY and COLLINS come south together or the window has failed.\n\nA Tu-214R came down the outside of the box last night and did not come back, which usually means somebody now knows where to look. There is an Akula unaccounted for and a Flanker pair within range of here. Keep the window open and get everybody out of it.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The window held, Collins is dived and heading for Stirling, and Supply still has enough in her tanks to do this again next week. Kila, from Moresby: 'Send the next one.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The support group is broken. Every boat in the north now has to come all the way home to do what should take four hours out here.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The support group is broken. Every boat in the north now has to come all the way home to do what should take four hours out here.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The window held, Collins is dived and heading for Stirling, and Supply still has enough in her tanks to do this again next week. Kila, from Moresby: 'Send the next one.'
TimeoutMessage=<color=red>Out of time.</color>|The service window ran out with the boat still on the surface. She goes home the long way, on what she has.
SupportLoss1Intel=SUPPLY is gone with the service half-finished. Collins goes home on what she has, and the corridor loses the one hull that let it operate east of the Cape.  - Mercer
