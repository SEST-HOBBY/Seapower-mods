[Language_en]
Name=Southern Watch O7 - Second Ring
Description=THE BIAK ENCLAVE, 0410. Since The Open Door the enclave has had three nights of Russian transports. Imagery shows an S-350 Vityaz battery with its 50N6 radar west of the field, an S-300PMU2 launcher with its 30N6E2 to the east, a Buk-M3 on the northern ridge and a Nebo-U early-warning radar on the coast above them all. An Iskander-M launcher arrived last night.\n\nThe package is two hundred miles south over New Guinea: DOOM 41 and 42, B-52H out of Tindal with ARRW; GRIZZLY 31 and 32, RAAF Growlers with AGM-88G; EAGLE II 21 and 22 as escort; and WEDGETAIL 04 for the picture. The S-300 reaches a hundred miles and the S-350 sixty-five; stay outside both until the Growlers have a fix.\n\nThe win is the two engagement radars. Two J-16s are on the enclave field and will be up within ten minutes of the first emission. A relief ship is in the anchorage south of the field: she is not a target, and neither is the town.
Objective_Ring=Destroy the S-350's 50N6 radar and the S-300's 30N6E2
Objective_Buk=Destroy the Buk-M3
Objective_Nebo=Destroy the Nebo-U radar
Objective_Iskander=Destroy the Iskander-M launcher
Objective_Bombers=Lose neither B-52
Objective_Relief=Harm no relief shipping
Taskforce1StartMessage=<color=yellow>Second Ring</color>|THE BIAK ENCLAVE, 0410. Since The Open Door the enclave has had three nights of Russian transports. Imagery shows an S-350 Vityaz battery with its 50N6 radar west of the field, an S-300PMU2 launcher with its 30N6E2 to the east, a Buk-M3 on the northern ridge and a Nebo-U early-warning radar on the coast above them all. An Iskander-M launcher arrived last night.\n\nThe package is two hundred miles south over New Guinea: DOOM 41 and 42, B-52H out of Tindal with ARRW; GRIZZLY 31 and 32, RAAF Growlers with AGM-88G; EAGLE II 21 and 22 as escort; and WEDGETAIL 04 for the picture. The S-300 reaches a hundred miles and the S-350 sixty-five; stay outside both until the Growlers have a fix.\n\nThe win is the two engagement radars. Two J-16s are on the enclave field and will be up within ten minutes of the first emission. A relief ship is in the anchorage south of the field: she is not a target, and neither is the town.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both engagement radars are burning. The belt round the enclave is launchers and nothing to aim them with, and the bombers are on their way home.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The belt still stands, or a bomber did not come back. Whatever the enclave sends south next week will fly under it.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The belt still stands, or a bomber did not come back. Whatever the enclave sends south next week will fly under it.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Both engagement radars are burning. The belt round the enclave is launchers and nothing to aim them with, and the bombers are on their way home.
TimeoutMessage=<color=red>Operational window closed.</color>|0625, and both engagement radars are still radiating. The package turns for home on its fuel, and the belt stays up.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 90-minute window has closed. Command will hold the line for about 45 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
