[Language_en]
Name=Southern Watch O7 - Second Ring
Description=BIAK, THE NEXT NIGHT. The Open Door's B-52s have gone back to the southern launch pool. LIGHTNING 41 to 44 are four RAAF F-35As carrying internal JSM from Langgur, supported by Grizzly's conventional SEAD pair, two Eagle IIs and Wedgetail 04. Suppress the new S-350 and S-300 engagement radars before committing the JSM package.\n\nThe mobile missile belt was delivered separately. The runway, Russian dispersal, Hind and Hip EW assets are present only if they survived The Open Door. Losing a complex removes its local fighter support, not the replacement SAMs. A standalone Second Ring starts with the surviving-defence case because it has no earlier damage record.\n\nDestroy both engagement radars. The Buk, Nebo and Iskander are secondary targets; the relief ship and town remain protected. Prasetyo's ground crew have chalked a small red spider under the squadron board. Ward says it is not a kill marking.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. Two reserve UAVs are at the forward recovery section from the start. They are unarmed, have finite fuel and a local recovery field. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Objective_Ring=Destroy the S-350's 50N6 radar and the S-300's 30N6E2
Objective_Buk=Destroy the Buk-M3
Objective_Nebo=Destroy the Nebo-U radar
Objective_Iskander=Destroy the Iskander-M launcher
Objective_Bombers=Bring all four JSM F-35As home
Objective_Relief=Harm no relief shipping
Objective_ForwardRecon=Obtain a current classification of the land target area
Taskforce1StartMessage=<color=yellow>Second Ring</color>|BIAK, THE NEXT NIGHT. The Open Door's B-52s have gone back to the southern launch pool. LIGHTNING 41 to 44 are four RAAF F-35As carrying internal JSM from Langgur, supported by Grizzly's conventional SEAD pair, two Eagle IIs and Wedgetail 04. Suppress the new S-350 and S-300 engagement radars before committing the JSM package.\n\nThe mobile missile belt was delivered separately. The runway, Russian dispersal, Hind and Hip EW assets are present only if they survived The Open Door. Losing a complex removes its local fighter support, not the replacement SAMs. A standalone Second Ring starts with the surviving-defence case because it has no earlier damage record.\n\nDestroy both engagement radars. The Buk, Nebo and Iskander are secondary targets; the relief ship and town remain protected. Prasetyo's ground crew have chalked a small red spider under the squadron board. Ward says it is not a kill marking.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. Two reserve UAVs are at the forward recovery section from the start. They are unarmed, have finite fuel and a local recovery field. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both engagement radars are down. The four-ship JSM package can disengage; Ballistic Shield will meet launchers without this radar cover.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The replacement belt still covers the enclave. Account for every Lightning before planning the next sortie.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The replacement belt still covers the enclave. Account for every Lightning before planning the next sortie.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Both engagement radars are down. The four-ship JSM package can disengage; Ballistic Shield will meet launchers without this radar cover.
TimeoutMessage=<color=red>Operational window closed.</color>|0625, and both engagement radars are still radiating. The package turns for home on its fuel, and the belt stays up.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 90-minute window has closed. Command will hold the line for about 45 minutes more. Finish the task now.
SituationReport1Intel=WARD: Four internal-JSM Lightnings, two radar aimpoints. Check the surviving airfield support before committing the package. The new mobile belt is not proof that yesterday's runway has repaired itself.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
