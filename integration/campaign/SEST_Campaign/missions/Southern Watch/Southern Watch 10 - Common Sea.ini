[Language_en]
Name=Southern Watch 10 - Common Sea
Description=EASTERN BANDA CORRIDOR. The convoy has to cross a patrol box where the submarine and surface threats overlap, and after three weeks the Australian escort force cannot cover both.\n\nMOGAMI and MAYA are here under the Japanese government's own arrangements, with an SH-60K and an SH-60J that are the best ASW pair in this sea. A Japanese F-2A detachment forward at Langgur has one sortie allocation today and it is loaded for ships: use it on the frigate coming in from the east, not on the fighters.\n\nTwo of the three priority merchants have to reach the handover, and CORAL PIONEER has to be one of them; lose her, or lose two, and the corridor is closed. The Type 039C is the threat that ends the mission - she carries YJ-18 as well as torpedoes, and the fighters overhead are her eyes as much as they are the thing that makes you spend the day looking up instead of down. One of them is carrying something for a ship.
Objective_Cargo=Two of the three priority merchants, Coral Pioneer among them, reach the handover point
Objective_Allies=Keep the Japanese escorts in the fight
Objective_Submarine=Locate and classify the submarine
Taskforce1StartMessage=<color=yellow>Common Sea</color>|EASTERN BANDA CORRIDOR. The convoy has to cross a patrol box where the submarine and surface threats overlap, and after three weeks the Australian escort force cannot cover both.\n\nMOGAMI and MAYA are here under the Japanese government's own arrangements, with an SH-60K and an SH-60J that are the best ASW pair in this sea. A Japanese F-2A detachment forward at Langgur has one sortie allocation today and it is loaded for ships: use it on the frigate coming in from the east, not on the fighters.\n\nTwo of the three priority merchants have to reach the handover, and CORAL PIONEER has to be one of them; lose her, or lose two, and the corridor is closed. The Type 039C is the threat that ends the mission - she carries YJ-18 as well as torpedoes, and the fighters overhead are her eyes as much as they are the thing that makes you spend the day looking up instead of down. One of them is carrying something for a ship.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The cargo is at the handover. Whatever it cost the detachment to get it there, the corridor has a Japanese escort force in it for the first time since October.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The convoy is short and the allied detachment is going home for repairs. The corridor is back to one navy again.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The convoy is short and the allied detachment is going home for repairs. The corridor is back to one navy again.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The cargo is at the handover. Whatever it cost the detachment to get it there, the corridor has a Japanese escort force in it for the first time since October.
TimeoutMessage=<color=red>Out of time.</color>|The handover time passed. The cargo is still in the corridor and the Japanese detachment is out of allocation.
