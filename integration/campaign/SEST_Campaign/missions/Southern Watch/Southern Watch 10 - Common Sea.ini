[Language_en]
Name=Southern Watch 10 - Common Sea
Description=EASTERN BANDA CORRIDOR. The convoy has to cross a patrol box where the submarine and surface threats overlap, and after three weeks the Australian escort force cannot cover both.\n\nMOGAMI and MAYA are here under the Japanese government's own arrangements, with two SH-60Ks that are the best ASW asset in this sea. A Japanese F-2A detachment forward at Biak has one sortie allocation today and will use it on the surface group, not on your convoy's CAP.\n\nGet the priority cargo to the handover. The Type 039 is the threat that ends the mission; the fighters overhead are the threat that makes you spend the day looking up instead of down.
Objective_Cargo=The priority convoy reaches the handover point
Objective_Allies=Keep the Japanese escorts in the fight
Objective_Submarine=Locate and break off the submarine
Taskforce1StartMessage=<color=yellow>Common Sea</color>|EASTERN BANDA CORRIDOR. The convoy has to cross a patrol box where the submarine and surface threats overlap, and after three weeks the Australian escort force cannot cover both.\n\nMOGAMI and MAYA are here under the Japanese government's own arrangements, with two SH-60Ks that are the best ASW asset in this sea. A Japanese F-2A detachment forward at Biak has one sortie allocation today and will use it on the surface group, not on your convoy's CAP.\n\nGet the priority cargo to the handover. The Type 039 is the threat that ends the mission; the fighters overhead are the threat that makes you spend the day looking up instead of down.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The cargo is at the handover and both Japanese ships are still on station. The corridor has a second usable escort force for the first time since October.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The convoy is short and the allied detachment is going home for repairs. The corridor is back to one navy again.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The convoy is short and the allied detachment is going home for repairs. The corridor is back to one navy again.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The cargo is at the handover and both Japanese ships are still on station. The corridor has a second usable escort force for the first time since October.
TimeoutMessage=<color=red>Out of time.</color>|The handover time passed. The cargo is still in the corridor and the Japanese detachment is out of allocation.
