[Language_en]
Name=Southern Watch O6 - The Second Convoy
Description=BANDA SEA APPROACHES, 0540, between the Tanimbar and Kai groups. A Meridian convoy left the Arafura last night with its transponders off and is going north for the Banda Sea and Biak: two cargo ships, the armed merchant MV Meridian Vigilant with a 57 mm gun, two fast attack craft ahead and a trawler astern. A sixth hull is radiating like a frigate and is almost certainly not one: the same trick Meridian Assurance played on the eighteenth of October.\n\nWeapons Free has held for a day. The cargo ships are lawful targets under the new rules; the Indonesian fishing boats and the tanker going south are not. Your detachment is south-west of the convoy, forty miles off, with the Seahawk if you embarked one.\n\nStop both cargo ships before they reach the Banda Sea entrance. The boats will come for you when they see you, the armed merchant will fight, and the trawler astern is the one that sank a fishing boat off Dobo last week with something that was not a gun.
Objective_Convoy=Stop both cargo ships before they reach the Banda Sea
Objective_Vigilant=Sink the armed merchant Meridian Vigilant
Objective_Decoy=Classify the radar decoy
Objective_Flagship=Bring your lead ship out
Objective_Traffic=Harm no fishing boat or tanker
Taskforce1StartMessage=<color=yellow>The Second Convoy</color>|BANDA SEA APPROACHES, 0540, between the Tanimbar and Kai groups. A Meridian convoy left the Arafura last night with its transponders off and is going north for the Banda Sea and Biak: two cargo ships, the armed merchant MV Meridian Vigilant with a 57 mm gun, two fast attack craft ahead and a trawler astern. A sixth hull is radiating like a frigate and is almost certainly not one: the same trick Meridian Assurance played on the eighteenth of October.\n\nWeapons Free has held for a day. The cargo ships are lawful targets under the new rules; the Indonesian fishing boats and the tanker going south are not. Your detachment is south-west of the convoy, forty miles off, with the Seahawk if you embarked one.\n\nStop both cargo ships before they reach the Banda Sea entrance. The boats will come for you when they see you, the armed merchant will fight, and the trawler astern is the one that sank a fishing boat off Dobo last week with something that was not a gun.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both cargo ships are stopped short of the Banda Sea. What the enclave was waiting for is on the bottom between Tanimbar and Kai.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|A cargo ship is through, or the detachment's lead ship is lost. The enclave will be fighting with this month's stores after all.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|A cargo ship is through, or the detachment's lead ship is lost. The enclave will be fighting with this month's stores after all.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Both cargo ships are stopped short of the Banda Sea. What the enclave was waiting for is on the bottom between Tanimbar and Kai.
TimeoutMessage=<color=red>Operational window closed.</color>|0825, and the cargo ships are still moving north in the dark with the armed merchant between you and them. They will be in the Banda Sea before the detachment can get a clean shot.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 110-minute window has closed. Command will hold the line for about 55 minutes more. Finish the task now.
O5ReceiverNamedIntel=INTELLIGENCE CELL: The charter papers taken off KM Sinar Harapan's owners name both cargo ships, MV Ocean Pearl and MV Golden Wren. Both are on your plot, classified. The rest of the convoy is yours to sort.
Denied1Message=<color=red>Operation failed.</color>|ESCORT WATCH: A cargo ship is into the Banda Sea and under Indonesian archipelagic rules, where we do not follow without Jakarta. The enclave gets its month.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
