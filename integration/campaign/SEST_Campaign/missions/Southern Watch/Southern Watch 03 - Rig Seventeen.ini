[Language_en]
Name=Southern Watch 03 - Rig Seventeen
Description=TIMOR SEA, late afternoon. Rig Seventeen has not answered its shore office since the weekend. Thirty contract staff are still aboard, and the armed Meridian contractors holding the platform have a helicopter deck, a shore battery on the Timor coast to the north and an air-defence vehicle they were not supposed to have.\n\nIndonesia has asked for help and set the boundary: you may cover an evacuation, you may not level the installation. CHOULES is in company with CANBERRA, and the US Marine Rotational Force in Darwin has lent the lift for one afternoon at the end of its rotation: a Super Stallion and an Osprey off Canberra's deck, each with a seat for everyone on that platform.\n\nGet the lifters in, get the people off, get everybody out before the light goes. Not every platform out here is hostile, and most of this coast is working its ordinary week. The lifter that takes the crew off is the lifter that has to bring them south - lose her after the pickup and they are gone with her.
Objective_Evacuate=Get a lift helicopter back to the amphibious group with the platform crew
Objective_Platform=Leave the civilian platform standing
Objective_Ships=Keep both amphibious ships afloat
Taskforce1StartMessage=<color=yellow>Rig Seventeen</color>|TIMOR SEA, late afternoon. Rig Seventeen has not answered its shore office since the weekend. Thirty contract staff are still aboard, and the armed Meridian contractors holding the platform have a helicopter deck, a shore battery on the Timor coast to the north and an air-defence vehicle they were not supposed to have.\n\nIndonesia has asked for help and set the boundary: you may cover an evacuation, you may not level the installation. CHOULES is in company with CANBERRA, and the US Marine Rotational Force in Darwin has lent the lift for one afternoon at the end of its rotation: a Super Stallion and an Osprey off Canberra's deck, each with a seat for everyone on that platform.\n\nGet the lifters in, get the people off, get everybody out before the light goes. Not every platform out here is hostile, and most of this coast is working its ordinary week. The lifter that takes the crew off is the lifter that has to bring them south - lose her after the pickup and they are gone with her.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|A lifter is back with the amphibious group and the platform crew aboard. Rig Seventeen is still standing and somebody else can argue about who owns it.
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|The evacuation window closed with people still on the platform. There will not be another one this week.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|The evacuation window closed with people still on the platform. There will not be another one this week.
Taskforce2DefeatMessage=<color=red>Command report.</color>|A lifter is back with the amphibious group and the platform crew aboard. Rig Seventeen is still standing and somebody else can argue about who owns it.
TimeoutMessage=<color=red>Operational window closed.</color>|The evacuation window expired with people still on the deck. There will not be another one this week.
StageIntel=AMPHIBIOUS CONTROL | The lifter is within Rig Seventeen's pickup area. The platform crew reports ready on the helideck. Complete the pickup and return the helicopter to the amphibious group; keep the approach clear of the patrol boat.
StageLostMessage=<color=red>Operation suspended.</color>|The lifter with the platform crew aboard is down. There is nobody left to bring south.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. Command has suspended the operation. Preserve the contact and engagement records.
