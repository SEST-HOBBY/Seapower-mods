[Language_en]
Name=Southern Watch 03 - Rig Seventeen
Description=TIMOR SEA, late afternoon. Rig Seventeen has not answered its shore office since the weekend. Thirty contract staff are still aboard, and the armed Meridian contractors holding the platform have a helicopter deck, a shore battery on the Timor coast to the north and an air-defence vehicle they were not supposed to have.\n\nIndonesia has asked for help and set the boundary: you may cover an evacuation, you may not level the installation. CHOULES is in company with CANBERRA, and the US Marine Rotational Force in Darwin has lent the lift for one afternoon at the end of its rotation: a Super Stallion and an Osprey, airborne south of the rig. Canberra has two Army Apaches on deck, armed with Hellfire and ready to launch, for the patrol boats, and two Romeos. Meridian has two missile boats closing from the north and north-west, a fast gunboat coming in from the east, and a Hind gunship expected to join after fifteen minutes. Those are military targets; the civilian platform and passing traffic are not.\n\nBring BOTH lifters over the platform, within three miles of it, and hold them there for three minutes while the crew is loaded - half go in each aircraft. AMPHIBIOUS CONTROL will tell you when everybody is aboard. Then bring both lifters back to the amphibious group before the light goes. Lose either lifter and the people in it are lost with her. Not every platform out here is hostile, and most of this coast is working its ordinary week.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. Two reserve UAVs are at the forward recovery section from the start. They are unarmed, have finite fuel and a local recovery field. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Objective_Evacuate=Hold both lifters at the rig until the crew is aboard, then bring both back to the amphibious group
Objective_Platform=Leave the civilian platform standing
Objective_Ships=Keep both amphibious ships afloat
Objective_ForwardRecon=Obtain a current classification of the land target area
Taskforce1StartMessage=<color=yellow>Rig Seventeen</color>|TIMOR SEA, late afternoon. Rig Seventeen has not answered its shore office since the weekend. Thirty contract staff are still aboard, and the armed Meridian contractors holding the platform have a helicopter deck, a shore battery on the Timor coast to the north and an air-defence vehicle they were not supposed to have.\n\nIndonesia has asked for help and set the boundary: you may cover an evacuation, you may not level the installation. CHOULES is in company with CANBERRA, and the US Marine Rotational Force in Darwin has lent the lift for one afternoon at the end of its rotation: a Super Stallion and an Osprey, airborne south of the rig. Canberra has two Army Apaches on deck, armed with Hellfire and ready to launch, for the patrol boats, and two Romeos. Meridian has two missile boats closing from the north and north-west, a fast gunboat coming in from the east, and a Hind gunship expected to join after fifteen minutes. Those are military targets; the civilian platform and passing traffic are not.\n\nBring BOTH lifters over the platform, within three miles of it, and hold them there for three minutes while the crew is loaded - half go in each aircraft. AMPHIBIOUS CONTROL will tell you when everybody is aboard. Then bring both lifters back to the amphibious group before the light goes. Lose either lifter and the people in it are lost with her. Not every platform out here is hostile, and most of this coast is working its ordinary week.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.\n\nFORWARD RECON: MOTH 11, a small RQ-7 reconnaissance UAV, joins over the local approach at minute ten, allowing time for initial air-defence suppression. Two reserve UAVs are at the forward recovery section from the start. They are unarmed, have finite fuel and a local recovery field. Use their sensors to classify the military installations and update strike aimpoints. The small airframes are vulnerable; no scripted reveal grants a target solution. Keep a recovery margin and reposition the initial track as needed.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both lifters are back with the amphibious group and the platform crew aboard. Rig Seventeen is still standing and somebody else can argue about who owns it.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|A lifter is down, or the evacuation window closed with people still on the platform. There will not be another one this week.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|A lifter is down, or the evacuation window closed with people still on the platform. There will not be another one this week.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Both lifters are back with the amphibious group and the platform crew aboard. Rig Seventeen is still standing and somebody else can argue about who owns it.
TimeoutMessage=<color=red>Operational window closed.</color>|The evacuation window expired with people still on the deck. There will not be another one this week.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 60-minute window has closed. Command will hold the line for about 30 minutes more. Finish the task now.
SituationReport1Intel=RIG CONTROL / ELLIS: The last shift is on the helideck. Cover the lifters' return route as well as their approach; a rocket attack on an empty platform still kills the people waiting for the second lift.
StageIntel=AMPHIBIOUS CONTROL: Both lifters are over Rig Seventeen. The platform crew is coming up to the helideck. Hold both aircraft at the platform until loading is complete.
StageHeldMessage=<color=yellow>Rig crew loaded.</color>|AMPHIBIOUS CONTROL: All thirty aboard, half in each lifter. Bring both back to the amphibious group; keep the approach clear of the patrol craft and gunship.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
