[Language_en]
Name=Southern Watch O9 - Viper Zero
Description=BANDA SEA, SOUTH OF SERAM, 0650. JS Hyuga and JS Asahi are coming south out of the Manipa Strait for the Kai Islands and Common Sea. A hundred and fifteen miles east of them, a PLAN group is closing at eighteen knots: a Type 054A, a Type 056A and the Type 071 Changbai Shan, which has been carrying stores for the Biak enclave. The 054A's YJ-83A reaches eighty-five miles, and she is closing on Hyuga to use it.\n\nVIPER 51 to 54, JASDF F-2As from the Langgur detachment, are airborne with four ASM-3 each. JAMMER 71, an EC-2 of the Electronic Warfare Operations Group, is on station south of the group to jam the frigate's search and fire-control radars while they run in.\n\nSink the 054A and the 056A. The Japanese ships are weapons tight under their own rules and will defend themselves. A Pelni ferry and Banda fishing boats are in the same water.
Objective_Group=Sink the Type 054A and the Type 056A
Objective_Hyuga=JS Hyuga is not hit
Objective_Lander=Sink the Type 071
Objective_Vipers=Lose no F-2A
Objective_Traffic=Harm no ferry or fishing boat
Taskforce1StartMessage=<color=yellow>Viper Zero</color>|BANDA SEA, SOUTH OF SERAM, 0650. JS Hyuga and JS Asahi are coming south out of the Manipa Strait for the Kai Islands and Common Sea. A hundred and fifteen miles east of them, a PLAN group is closing at eighteen knots: a Type 054A, a Type 056A and the Type 071 Changbai Shan, which has been carrying stores for the Biak enclave. The 054A's YJ-83A reaches eighty-five miles, and she is closing on Hyuga to use it.\n\nVIPER 51 to 54, JASDF F-2As from the Langgur detachment, are airborne with four ASM-3 each. JAMMER 71, an EC-2 of the Electronic Warfare Operations Group, is on station south of the group to jam the frigate's search and fire-control radars while they run in.\n\nSink the 054A and the 056A. The Japanese ships are weapons tight under their own rules and will defend themselves. A Pelni ferry and Banda fishing boats are in the same water.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both warships are sinking and Changbai Shan has turned north. Hyuga comes south untouched, and the EC-2 has every emitter the group had on tape.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The group is still between Hyuga and the Kai Islands, or Hyuga has been hit. Tokyo will reconsider how far south its ships come.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The group is still between Hyuga and the Kai Islands, or Hyuga has been hit. Tokyo will reconsider how far south its ships come.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Both warships are sinking and Changbai Shan has turned north. Hyuga comes south untouched, and the EC-2 has every emitter the group had on tape.
TimeoutMessage=<color=red>Operational window closed.</color>|0842, and the frigate is still afloat and closing. The F-2As are back at Langgur with nothing left, and Hyuga turns north for the strait.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 75-minute window has closed. Command will hold the line for about 37 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
