[Language_en]
Name=Southern Watch O4 - Weather Alternate
Description=KAI ISLANDS, afternoon. Captain Prasetyo has lent us the strip at Langgur for the enclave relief window and not an hour longer. LANGGUR PROVIDER and KEI STAR carry the fuel bladders and the ground party; you take them the last forty miles into the anchorage.\n\nThe enclave knows what Langgur is for. A Meridian escort pair has been working the Kai passages since Tuesday, and the last transit reported a drone launcher site on Kai Besar, across the strait east of the anchorage. Langgur town is at the head of it and every building in it is somebody's.\n\nGet both coasters in. Put the launcher out of the argument if you can do it without touching the town.
Objective_Fuel=Get both coasters into the Langgur anchorage
Objective_Site=Neutralise the Kai Besar launcher site
Objective_Town=Leave Langgur alone
Taskforce1StartMessage=<color=yellow>Weather Alternate</color>|KAI ISLANDS, afternoon. Captain Prasetyo has lent us the strip at Langgur for the enclave relief window and not an hour longer. LANGGUR PROVIDER and KEI STAR carry the fuel bladders and the ground party; you take them the last forty miles into the anchorage.\n\nThe enclave knows what Langgur is for. A Meridian escort pair has been working the Kai passages since Tuesday, and the last transit reported a drone launcher site on Kai Besar, across the strait east of the anchorage. Langgur town is at the head of it and every building in it is somebody's.\n\nGet both coasters in. Put the launcher out of the argument if you can do it without touching the town.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Both coasters are in the anchorage and the ground party is pumping before the light goes. The Open Door has a tanker on the track.
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|The bladders are on the bottom forty miles short. The Open Door flies on internal fuel and Prasetyo's strip is a runway with nothing on it.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|The bladders are on the bottom forty miles short. The Open Door flies on internal fuel and Prasetyo's strip is a runway with nothing on it.
Taskforce2DefeatMessage=<color=red>Command report.</color>|Both coasters are in the anchorage and the ground party is pumping before the light goes. The Open Door has a tanker on the track.
TimeoutMessage=<color=red>Operational window closed.</color>|The light went with the bladders still forty miles short. The Open Door flies on internal fuel and Prasetyo's strip is a runway with nothing on it.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. Command has suspended the operation. Preserve the contact and engagement records.
