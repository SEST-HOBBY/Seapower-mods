[Language_en]
Name=Southern Watch 07 - Long Way Home
Description=HIGH OVER THE BANDA ARC. Weather over the enclave pushed the morning package forty minutes long and everybody is coming home on somebody else's fuel. TEXACO 41 is the only tanker in the corridor and three different flights are booked on it.\n\nThe expeditionary detachment supporting the enclave has put two MiG-31s up out of the northern field, climbing hard, on a vector toward the tanker track. Their AEW aircraft is behind them and their own tanker is behind that, which tells you this was planned.\n\nYou have a Raptor pair and a Growler with the returning Super Hornets. The Foxhound is the one aircraft here you cannot chase: it shoots from above fifty thousand feet at speeds you will not catch, and a stern chase is time you do not have - the gas is on the clock, not on the gauge. Break the shot, not the aircraft. Bring the tanker home.
Objective_Tanker=TEXACO 41 must reach the recovery line
Objective_Package=Bring the returning flight home
Objective_Raptors=Do not trade the Raptors for the interceptors
Taskforce1StartMessage=<color=yellow>Long Way Home</color>|HIGH OVER THE BANDA ARC. Weather over the enclave pushed the morning package forty minutes long and everybody is coming home on somebody else's fuel. TEXACO 41 is the only tanker in the corridor and three different flights are booked on it.\n\nThe expeditionary detachment supporting the enclave has put two MiG-31s up out of the northern field, climbing hard, on a vector toward the tanker track. Their AEW aircraft is behind them and their own tanker is behind that, which tells you this was planned.\n\nYou have a Raptor pair and a Growler with the returning Super Hornets. The Foxhound is the one aircraft here you cannot chase: it shoots from above fifty thousand feet at speeds you will not catch, and a stern chase is time you do not have - the gas is on the clock, not on the gauge. Break the shot, not the aircraft. Bring the tanker home.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The tanker is south of the line and the package is behind it. Both Foxhounds turned back with nothing to show a staff officer.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The tanker is down, or the package is. Either way every sortie in the north tomorrow gets shorter, and the ones over the enclave do not happen at all.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The tanker is down, or the package is. Either way every sortie in the north tomorrow gets shorter, and the ones over the enclave do not happen at all.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The tanker is south of the line and the package is behind it. Both Foxhounds turned back with nothing to show a staff officer.
TimeoutMessage=<color=red>Out of time.</color>|The tanker never made the recovery line. Every sortie in the north tomorrow gets shorter.
