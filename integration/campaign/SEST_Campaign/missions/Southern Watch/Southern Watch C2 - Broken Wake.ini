[Language_en]
Name=Southern Watch C2 - Broken Wake
Description=BANDA SEA, before dawn. HMAS STUART, an Anzac-class frigate, took a hit forward on the twenty-third screening Ford's oiler group north of here, outside your part of the fleet action. She has one shaft, six knots, and thirty-one wounded who need a hospital that is a day and a half away at the speed she can make.\n\nFord's group went north-west without her. A Kilo has been working the southern approaches since the fleet action, and the enclave still has a strike pair that comes south to look. The ceasefire is two days off and nobody has told either of them.\n\nBring her south-south-east to the line where the tug from Darwin meets her. The Chief Engineer requests six knots to protect the damaged shaft. Match the escort plan to that speed and keep the route ahead clear.
Objective_Stuart=Bring STUART to the line
Objective_Traffic=Harm no neutral shipping
Taskforce1StartMessage=<color=yellow>Broken Wake</color>|BANDA SEA, before dawn. HMAS STUART, an Anzac-class frigate, took a hit forward on the twenty-third screening Ford's oiler group north of here, outside your part of the fleet action. She has one shaft, six knots, and thirty-one wounded who need a hospital that is a day and a half away at the speed she can make.\n\nFord's group went north-west without her. A Kilo has been working the southern approaches since the fleet action, and the enclave still has a strike pair that comes south to look. The ceasefire is two days off and nobody has told either of them.\n\nBring her south-south-east to the line where the tug from Darwin meets her. The Chief Engineer requests six knots to protect the damaged shaft. Match the escort plan to that speed and keep the route ahead clear.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Stuart is at the line with her people aboard and a tug coming up from Darwin. Thirty-one wounded get their hospital, and the ship gets a dockyard instead of a reef.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|Stuart is gone with her wounded aboard, two days short of a ceasefire. The recovery that should have been routine is a court of inquiry.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|Stuart is gone with her wounded aboard, two days short of a ceasefire. The recovery that should have been routine is a court of inquiry.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Stuart is at the line with her people aboard and a tug coming up from Darwin. Thirty-one wounded get their hospital, and the ship gets a dockyard instead of a reef.
TimeoutMessage=<color=red>Operational window closed.</color>|Stuart is still short of the line at first light with a Kilo somewhere astern, and the tug from Darwin has nothing to meet.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
