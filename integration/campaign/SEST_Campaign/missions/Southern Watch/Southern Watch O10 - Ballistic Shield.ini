[Language_en]
Name=Southern Watch O10 - Ballistic Shield
Description=KAI ISLANDS, 0350. Last night's imagery shows the enclave's new pads on Biak: two Fattah-1 launchers, a Fattah-2, an Emad and a Shahed 238 battery with eight jet drones. Everything on them reaches Langgur. A Tu-214R has flown the same track south towards the Kai group three nights running; tonight it will be looking for the batteries.\n\nOn Kai Kecil: a THAAD launcher with its AN/TPY-2, a Patriot PAC-3 launcher with its radar, and a US Army Steelfin battery, the first of its kind deployed outside a range. EAGLE II 31 and 32 are up out of Langgur with ARRW and SENTRY 05, an RAAF Triton, is off Biak to find the pads for them.\n\nDestroy three of the five launchers and keep the strip in action. If Second Ring took down the S-350 and S-300 radars on the fourteenth, the pads have no cover; if it did not, the S-350 is still over them. Tual's ferry and its fishing boats are out tonight.
Objective_Pads=Destroy three of the five launchers on Biak
Objective_Strip=Keep the Langgur strip in action
Objective_Radar=Lose nothing of the THAAD battery
Objective_Coot=Shoot down the Tu-214R
Objective_Traffic=Harm no ferry or fishing boat
Taskforce1StartMessage=<color=yellow>Ballistic Shield</color>|KAI ISLANDS, 0350. Last night's imagery shows the enclave's new pads on Biak: two Fattah-1 launchers, a Fattah-2, an Emad and a Shahed 238 battery with eight jet drones. Everything on them reaches Langgur. A Tu-214R has flown the same track south towards the Kai group three nights running; tonight it will be looking for the batteries.\n\nOn Kai Kecil: a THAAD launcher with its AN/TPY-2, a Patriot PAC-3 launcher with its radar, and a US Army Steelfin battery, the first of its kind deployed outside a range. EAGLE II 31 and 32 are up out of Langgur with ARRW and SENTRY 05, an RAAF Triton, is off Biak to find the pads for them.\n\nDestroy three of the five launchers and keep the strip in action. If Second Ring took down the S-350 and S-300 radars on the fourteenth, the pads have no cover; if it did not, the S-350 is still over them. Tual's ferry and its fishing boats are out tonight.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Three of the launchers are burning on Biak and the strip is still turning aircraft round. Whatever is left on the pads has to come out of hiding to fire.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The strip is out of action, or the launchers are still standing. Langgur will not be anybody's alternate this week.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The strip is out of action, or the launchers are still standing. Langgur will not be anybody's alternate this week.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Three of the launchers are burning on Biak and the strip is still turning aircraft round. Whatever is left on the pads has to come out of hiding to fire.
TimeoutMessage=<color=red>Operational window closed.</color>|0535, and the pads on Biak are still standing. Whatever they have left will come south when they choose, not when we do.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 70-minute window has closed. Command will hold the line for about 35 minutes more. Finish the task now.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
