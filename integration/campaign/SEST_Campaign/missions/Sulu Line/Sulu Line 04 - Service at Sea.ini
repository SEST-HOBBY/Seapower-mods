[Language_en]
Name=Sulu Line 04 - Service at Sea
Description=SULU SEA, 0700. MV SULU PROVIDER, a C8 barge carrier on charter to Military Sealift Command, is at the rendezvous east of Cagayancillo. She has the task group's ammunition: 76 mm, MICA, Harpoon and torpedoes, from the stocks the Seventh Fleet left at Subic.\n\nShe is the group's rearm. Her supply system is live: a ship that comes within half a mile of her at eight knots or less takes stores across, one ship at a time. Keep your lead ship within three miles of her for thirty minutes while the others go alongside, then bring her north to the withdrawal box, twenty miles up.\n\nMeridian has her movement. Three fast attack craft sailed from Cagayancillo at 0500 and a drone has been overhead since first light. A ship alongside and slowed down is the easiest target in the Sulu Sea; keep a screen out while the others replenish.
Objective_Service=Hold the lead ship by SULU PROVIDER for thirty minutes, then bring her to the withdrawal box
Objective_Charter=Keep MV Sulu Provider afloat
Objective_Raiders=Sink the Meridian boats
Objective_Traffic=Harm no freighter or banca
Taskforce1StartMessage=<color=yellow>Service at Sea</color>|SULU SEA, 0700. MV SULU PROVIDER, a C8 barge carrier on charter to Military Sealift Command, is at the rendezvous east of Cagayancillo. She has the task group's ammunition: 76 mm, MICA, Harpoon and torpedoes, from the stocks the Seventh Fleet left at Subic.\n\nShe is the group's rearm. Her supply system is live: a ship that comes within half a mile of her at eight knots or less takes stores across, one ship at a time. Keep your lead ship within three miles of her for thirty minutes while the others go alongside, then bring her north to the withdrawal box, twenty miles up.\n\nMeridian has her movement. Three fast attack craft sailed from Cagayancillo at 0500 and a drone has been overhead since first light. A ship alongside and slowed down is the easiest target in the Sulu Sea; keep a screen out while the others replenish.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|SULU PROVIDER is north of the box with what is left in her barges. The ships that went alongside have their magazines back. Naval Forces West will hold her at Puerto Princesa for the next time the group needs her.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The rendezvous is broken. SULU PROVIDER is gone, or the group never held its window, and the ammunition is still in her barges or at the bottom.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The rendezvous is broken. SULU PROVIDER is gone, or the group never held its window, and the ammunition is still in her barges or at the bottom.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|SULU PROVIDER is north of the box with what is left in her barges. The ships that went alongside have their magazines back. Naval Forces West will hold her at Puerto Princesa for the next time the group needs her.
TimeoutMessage=<color=red>Operational window closed.</color>|1000, and SULU PROVIDER is still south of the box. Meridian has her position for another night.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 120-minute window has closed. Command will hold the line for about 60 minutes more. Finish the task now.
SupportLoss1Intel=LOGISTICS REPORT: SULU PROVIDER is lost with her cargo. There is no second charter. The group's ammunition from now on is what is in its magazines and in its own supply ships.
StageIntel=SULU PROVIDER: Thirty minutes. The rendezvous is complete. Ships still needing stores may continue alongside; the charter is to proceed north to the withdrawal box.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
