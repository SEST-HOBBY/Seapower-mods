[Language_en]
Name=Sulu Line 03A - The Okean
Description=SIBUTU PASSAGE, 0320. Signals and a fisherman in Sitangkai agree that a trawler under the Panama flag came out of Tarakan two days ago and is coming north up the passage tonight, low in the water. Two fast boats left Tawi-Tawi at midnight and are waiting for her west of Sibutu. What she carries was bought with the money that rides the semi-submersibles: rifles, mortars, parts for the drones on the Jolo ridge.\n\nTwo other Okean-class trawlers are fishing the passage tonight, both Philippine. A container ship is northbound for Sandakan's anchorage and a Malaysian tanker is going south. A helicopter has been flying from the Sabah side to a point in the passage and back since 0200 without a flight plan.\n\nBRP Apolinario Mabini is east of the passage, BRP Florencio Inigo in it to the south, and Tawi 22 is up out of Sanga-Sanga. Weapons are Free on the trawler, the boats and the helicopter once each is classified. Fishermen in Sitangkai say she has a tube in her stern housing. Believe them.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Objective_Trawler=Stop the armed trawler before she reaches the boats
Objective_Identify=Classify the armed trawler
Objective_Boats=Stop the fast boats
Objective_Shuttle=Classify the shuttle helicopter
Objective_Patrol=Bring BRP Apolinario Mabini home
Objective_Traffic=Harm no fishing trawler or merchant ship
Taskforce1StartMessage=<color=yellow>The Okean</color>|SIBUTU PASSAGE, 0320. Signals and a fisherman in Sitangkai agree that a trawler under the Panama flag came out of Tarakan two days ago and is coming north up the passage tonight, low in the water. Two fast boats left Tawi-Tawi at midnight and are waiting for her west of Sibutu. What she carries was bought with the money that rides the semi-submersibles: rifles, mortars, parts for the drones on the Jolo ridge.\n\nTwo other Okean-class trawlers are fishing the passage tonight, both Philippine. A container ship is northbound for Sandakan's anchorage and a Malaysian tanker is going south. A helicopter has been flying from the Sabah side to a point in the passage and back since 0200 without a flight plan.\n\nBRP Apolinario Mabini is east of the passage, BRP Florencio Inigo in it to the south, and Tawi 22 is up out of Sanga-Sanga. Weapons are Free on the trawler, the boats and the helicopter once each is classified. Fishermen in Sitangkai say she has a tube in her stern housing. Believe them.\n\nCOMMAND NET: A mission-specific tactical report follows eight minutes after the start. It is advice from the command team, not a new sensor detection.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The trawler is stopped short of the boats. The Agency will spend a month on what comes up from her hold. Meridian has lost the cargo and the money that bought it.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The trawler made her rendezvous, or the patrol lost a ship finding her. The crates are on their way north.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The trawler made her rendezvous, or the patrol lost a ship finding her. The crates are on their way north.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The trawler is stopped short of the boats. The Agency will spend a month on what comes up from her hold. Meridian has lost the cargo and the money that bought it.
TimeoutMessage=<color=red>Operational window closed.</color>|0620, and the trawler is still a trawler among trawlers. The boats will find her before dawn.
BehindScheduleMessage=<color=yellow>Behind schedule.</color>|The planned 120-minute window has closed. Command will hold the line for about 60 minutes more. Finish the task now.
SituationReport1Intel=VEGA: Do not let the trawler's torpedo threat bring both patrol boats onto the same line. Keep a cross-bearing and enough separation to cover the speedboats.
SLNarcoTakenIntel=PDEA: The semi-submersible's navigation set had one name in it twice: the trawler Hai Xing 7. She is the one coming north. Her position is on your plot.
Denied1Message=<color=red>Operation failed.</color>|The trawler is alongside the boats west of Sibutu and the crates are going over. By dawn they are on Tawi-Tawi; by the end of the week, on Jolo.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
