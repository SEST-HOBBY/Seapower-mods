[Language_en]
Name=Tasman Shield 01 - Home Waters
Description=THE FIORDLAND APPROACHES, 46 South, morning. The task group is twenty-five miles off Puysegur Point in the busiest water it has seen since Sydney: two cruise ships bound for Milford Sound, the Bluff cray fleet on the grounds, a longliner, the Fisheries New Zealand patrol vessel, and the Invercargill-Queenstown service overhead.\n\nMV AUSTRAL COMPLIANCE, the Australian Maritime Services tender that followed the protection group north, is thirty miles south-west broadcasting closed grounds on the fishing channels. The research trawler that Turning North named is somewhere south of her. A conventional submarine was reported off the Solander Islands yesterday; it is not routed at anyone and it is not the mission.\n\nKIWI 05 is out of Invercargill with the New Zealand picture. Your own Seahawk and Poseidon fly if bought; the Arafura goes on sale here for the inshore work. Classify the tender - her radars, her signals, her name on the stern - then hold the patrol line to the south-west. Everything red is weapons tight and so are you. The cray boats do not move for warships.
Objective_Tender=Classify MV Austral Compliance, then hold the patrol line south-west of her
Objective_Boat=Classify the submarine off the Solander Islands
Objective_Traffic=Harm no cruise ship, fishing boat, patrol vessel or aircraft
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>Home Waters</color>|THE FIORDLAND APPROACHES, 46 South, morning. The task group is twenty-five miles off Puysegur Point in the busiest water it has seen since Sydney: two cruise ships bound for Milford Sound, the Bluff cray fleet on the grounds, a longliner, the Fisheries New Zealand patrol vessel, and the Invercargill-Queenstown service overhead.\n\nMV AUSTRAL COMPLIANCE, the Australian Maritime Services tender that followed the protection group north, is thirty miles south-west broadcasting closed grounds on the fishing channels. The research trawler that Turning North named is somewhere south of her. A conventional submarine was reported off the Solander Islands yesterday; it is not routed at anyone and it is not the mission.\n\nKIWI 05 is out of Invercargill with the New Zealand picture. Your own Seahawk and Poseidon fly if bought; the Arafura goes on sale here for the inshore work. Classify the tender - her radars, her signals, her name on the stern - then hold the patrol line to the south-west. Everything red is weapons tight and so are you. The cray boats do not move for warships.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|The tender is named, the line is held, and nobody in Fiordland lost a boat. Rewi: 'That is how you are welcome here.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The flagship is gone off Puysegur, or a New Zealand hull is, and the Tasman chapter opens with Wellington asking why.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The flagship is gone off Puysegur, or a New Zealand hull is, and the Tasman chapter opens with Wellington asking why.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|The tender is named, the line is held, and nobody in Fiordland lost a boat. Rewi: 'That is how you are welcome here.'
TimeoutMessage=<color=red>Out of time.</color>|Sixty-five minutes and the tender is still a shape on the horizon with the cray fleet between you. She keeps her anonymity for the Chathams.
StageIntel=AUSTRAL COMPLIANCE has a name and a class: the same tender that fuelled the group off Macquarie in December, now with a navigation radar Rewi's people say is a frigate's. Hold the patrol line south-west of her. Chatham Watch will know her by her emitters.
SR12NetworkNamedIntel=Turning North's picture: the research trawler you named in the Tasman approaches is south of the tender, and she is on your plot as a classified contact. Where she is, the tender is being told what to say.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
