[Language_en]
Name=Tasman Shield 12 - Southern Cross
Description=MID-TASMAN, 40 South, morning, under a ceasefire that is nine hours old. The relief convoy for New Zealand: CORAL PIONEER, the freighter AOTEAROA RELIEF, the bulker WAIRAU TRADER and the tanker TASMAN SPIRIT, eleven knots, east for Auckland, with your escorts - what the Tasman left of them - and KIWI 05 and WEDGETAIL 05 up. East Sale's and Williamtown's F-35As can give you fighter cover at the end of their reach.\n\nTwo groups are in the box. The WITHDRAWING GROUP - a Type 054A and the Qiongsha-class supply ship - is forty miles east steaming north under the ceasefire, complying, and is neutral. The SPOILER is a second Type 054A south-west of the convoy on a course to intercept it, with the research trawler NAN HAI 27 ahead of her, ROMEO under her if Farncomb missed her on 4 February, and a J-15 pair coming if LIAONING is afloat to send it.\n\nThree of four into the box east, Coral Pioneer among them. The spoiler is a target when she fires; the withdrawing group is not a target at all. A Tasman bulker and the Sydney-Wellington service are in the box. Seventy-five minutes and it is over.\n\nINTELLIGENCE: Joint reporting distinguishes the declared withdrawing formation from the suspected spoiler. Check those assessments against current movement, emissions and hostile acts. Shared ship classes or an old position report are insufficient to place both groups under the same engagement authority.
Objective_Convoy=Three of four convoy hulls into the box east, Coral Pioneer among them
Objective_Ceasefire=The withdrawing group is not a target
Objective_Escorts=Bring your flagship home
Objective_Wedgetail=Keep the Wedgetail flying
Objective_Neutrals=Harm no merchant or aircraft
Taskforce1StartMessage=<color=yellow>Southern Cross</color>|MID-TASMAN, 40 South, morning, under a ceasefire that is nine hours old. The relief convoy for New Zealand: CORAL PIONEER, the freighter AOTEAROA RELIEF, the bulker WAIRAU TRADER and the tanker TASMAN SPIRIT, eleven knots, east for Auckland, with your escorts - what the Tasman left of them - and KIWI 05 and WEDGETAIL 05 up. East Sale's and Williamtown's F-35As can give you fighter cover at the end of their reach.\n\nTwo groups are in the box. The WITHDRAWING GROUP - a Type 054A and the Qiongsha-class supply ship - is forty miles east steaming north under the ceasefire, complying, and is neutral. The SPOILER is a second Type 054A south-west of the convoy on a course to intercept it, with the research trawler NAN HAI 27 ahead of her, ROMEO under her if Farncomb missed her on 4 February, and a J-15 pair coming if LIAONING is afloat to send it.\n\nThree of four into the box east, Coral Pioneer among them. The spoiler is a target when she fires; the withdrawing group is not a target at all. A Tasman bulker and the Sydney-Wellington service are in the box. Seventy-five minutes and it is over.\n\nINTELLIGENCE: Joint reporting distinguishes the declared withdrawing formation from the suspected spoiler. Check those assessments against current movement, emissions and hostile acts. Shared ship classes or an old position report are insufficient to place both groups under the same engagement authority.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|At least three merchants, including Coral Pioneer, have reached the Auckland handover and the withdrawing group remains protected. Account for the ships still at sea and maintain the ceasefire. Santos, from the bridge: 'Auckland on the bow. Southern Cross overhead. We are through.'
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The relief convoy is broken in the middle of the Tasman on the first morning of the ceasefire, or the ceasefire is broken by us. Either way the ledger closes in the red.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The relief convoy is broken in the middle of the Tasman on the first morning of the ceasefire, or the ceasefire is broken by us. Either way the ledger closes in the red.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|At least three merchants, including Coral Pioneer, have reached the Auckland handover and the withdrawing group remains protected. Account for the ships still at sea and maintain the ceasefire. Santos, from the bridge: 'Auckland on the bow. Southern Cross overhead. We are through.'
TimeoutMessage=<color=red>Operational window closed.</color>|The convoy has not met the handover requirement within seventy-five minutes. Suspend the passage and report the ships' positions. Their eventual arrival and the spoiler's next move remain unconfirmed.
SR03CrewRecoveredIntel=FUSION CELL: The Wilkins airlink search record of 12 December identifies the collector ahead of the spoiler as NAN HAI 27. The contact is identified on the plot and held there for the operation. Intelligence assesses a possible spotting role; the contents of its current transmissions remain unknown.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
