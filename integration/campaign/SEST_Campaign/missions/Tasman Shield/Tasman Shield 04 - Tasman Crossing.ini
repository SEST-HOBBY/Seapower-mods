[Language_en]
Name=Tasman Shield 04 - Tasman Crossing
Description=MID-TASMAN, early afternoon. Two merchant groups on the Auckland run: GROUP A is CORAL PIONEER and the bulker WAIRAU TRADER, thirty miles south-east of GROUP B, the freighter TASMAN VENTURE and the car carrier HAURAKI HIGHWAY, both groups making for the same turning point north-east. Neither group would wait for the other and both want the same escort.\n\nLIAONING is two hundred miles south-east with a frigate, and the J-15s that flew over the fishing fleet for the cameras in December are already up with anti-ship missiles, a hundred and thirty miles from group B and closing. WEDGETAIL 05 is up out of Williamtown and, for the first time in the Tasman, so is a fighter that can reach you: the F-35As are on the CAP row and the Super Hornets and Growlers go on sale here.\n\nThree of four hulls into the box, north-east. The Sydney-Auckland service, a cruise ship and a bulker are crossing the same water. The carrier's aircraft have not fired at a merchant yet; today they will.
Objective_Crossing=Three of four merchant hulls into the box north-east
Objective_Wedgetail=Keep the Wedgetail flying
Objective_Neutrals=Harm no airliner, cruise ship or merchant
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>Tasman Crossing</color>|MID-TASMAN, early afternoon. Two merchant groups on the Auckland run: GROUP A is CORAL PIONEER and the bulker WAIRAU TRADER, thirty miles south-east of GROUP B, the freighter TASMAN VENTURE and the car carrier HAURAKI HIGHWAY, both groups making for the same turning point north-east. Neither group would wait for the other and both want the same escort.\n\nLIAONING is two hundred miles south-east with a frigate, and the J-15s that flew over the fishing fleet for the cameras in December are already up with anti-ship missiles, a hundred and thirty miles from group B and closing. WEDGETAIL 05 is up out of Williamtown and, for the first time in the Tasman, so is a fighter that can reach you: the F-35As are on the CAP row and the Super Hornets and Growlers go on sale here.\n\nThree of four hulls into the box, north-east. The Sydney-Auckland service, a cruise ship and a bulker are crossing the same water. The carrier's aircraft have not fired at a merchant yet; today they will.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Three hulls in the box and the strike flight spent. Santos, from Coral Pioneer: 'Group B says thank you. Group A says nothing, which is what we always say.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Two hulls lost in the middle of the Tasman with Auckland's cargo in them. The charterers were right not to wait.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|Two hulls lost in the middle of the Tasman with Auckland's cargo in them. The charterers were right not to wait.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Three hulls in the box and the strike flight spent. Santos, from Coral Pioneer: 'Group B says thank you. Group A says nothing, which is what we always say.'
TimeoutMessage=<color=red>Out of time.</color>|Eighty minutes and the groups are still short of the box with the carrier's second flight forming. The crossing is made tomorrow, or not.
SR12NetworkNamedIntel=Turning North's picture: the frigate with the carrier is the Type 054A you named in the Tasman approaches, and she is on your plot classified. Where she is, the carrier is: a mile off her beam.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
