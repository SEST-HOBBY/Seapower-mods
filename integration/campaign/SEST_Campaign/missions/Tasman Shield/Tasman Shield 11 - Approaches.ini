[Language_en]
Name=Tasman Shield 11 - Approaches
Description=THE WESTERN TASMAN, 39 South, late morning. The last movement - three transports with the vehicles and stores of New Zealand's relief detachment - is on 045 for New Zealand with the whole force, WEDGETAIL 05, and every aircraft it can task: the Seahawk, the Poseidon, East Sale's F-35As two hundred miles away, Williamtown's four hundred, and the Super Hornets and Growlers tasked to strike.\n\nThe group is eighty miles south-east: LIAONING, the Type 052D that has commanded it since October, a frigate, three J-15s with anti-ship missiles and a J-15D, a Ka-31 and a Z-18F up. If Auckland's approaches were not held, the Type 056A and NAN HAI 27 from the Hauraki Gulf have joined it; if Adelaide's were not, the Type 054A from Gulf St Vincent has too.\n\nTwo of three transports into the box north-east. Sink the destroyer. Sink the carrier if you can. A coastal bulker, a trawler and the Sydney-Hobart service are in the box. Ninety minutes, and the strike goes when it is ready, not when the clock says.
Objective_Movement=Two of three transports into the box north-east
Objective_Flagship=Destroy the Type 052D
Objective_Carrier=Destroy Liaoning
Objective_Wedgetail=Keep the Wedgetail flying
Objective_Neutrals=Harm no merchant, trawler or aircraft
Taskforce1StartMessage=<color=yellow>Approaches</color>|THE WESTERN TASMAN, 39 South, late morning. The last movement - three transports with the vehicles and stores of New Zealand's relief detachment - is on 045 for New Zealand with the whole force, WEDGETAIL 05, and every aircraft it can task: the Seahawk, the Poseidon, East Sale's F-35As two hundred miles away, Williamtown's four hundred, and the Super Hornets and Growlers tasked to strike.\n\nThe group is eighty miles south-east: LIAONING, the Type 052D that has commanded it since October, a frigate, three J-15s with anti-ship missiles and a J-15D, a Ka-31 and a Z-18F up. If Auckland's approaches were not held, the Type 056A and NAN HAI 27 from the Hauraki Gulf have joined it; if Adelaide's were not, the Type 054A from Gulf St Vincent has too.\n\nTwo of three transports into the box north-east. Sink the destroyer. Sink the carrier if you can. A coastal bulker, a trawler and the Sydney-Hobart service are in the box. Ninety minutes, and the strike goes when it is ready, not when the clock says.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Two transports in the box, and the ledger says whether the destroyer that commanded the group since October is on the bottom. What is left of the group turns for home, or waits for the relief convoy; the second of March will show which.
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|Two transports lost in the western Tasman with the relief in them. The group holds the water and the relief convoy sails into it anyway.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|Two transports lost in the western Tasman with the relief in them. The group holds the water and the relief convoy sails into it anyway.
Taskforce2DefeatMessage=<color=red>Command report.</color>|Two transports in the box, and the ledger says whether the destroyer that commanded the group since October is on the bottom. What is left of the group turns for home, or waits for the relief convoy; the second of March will show which.
TimeoutMessage=<color=red>Operational window closed.</color>|Ninety minutes and the transports are still short of the box with the group between them and New Zealand. The movement turns back for Sydney and the relief waits.
TS11CarrierSunkIntel=DAMAGE REPORT | LIAONING confirmed lost. Its contribution to the next convoy interception is removed from the air threat assessment. Surface ships and submarines remain threats; maintain the escort screen.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. Command has suspended the operation. Preserve the contact and engagement records.
