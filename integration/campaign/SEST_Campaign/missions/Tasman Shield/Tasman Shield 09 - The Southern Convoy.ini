[Language_en]
Name=Tasman Shield 09 - The Southern Convoy
Description=SOUTH OF PORTLAND, 38 South, mid-morning, a south-westerly. The Southern Convoy: the tanker PORTLAND SPIRIT, the bulker LIMESTONE COAST, the freighter GLENELG, the car carrier BASS HIGHWAY and CORAL PIONEER, thirteen knots, bound for the split point off Portland where the Adelaide hulls turn west and the Melbourne hulls go on.\n\nThe protection group is eighty miles south-west and it has stopped pretending: LIAONING, the Type 052D that has commanded the group since October, two frigates and a corvette, three J-15s with anti-ship missiles and a J-15D with them, a Ka-31 and a Z-18F up. If Under the Tasman missed ROMEO she is under the convoy; if the Bight missed SIERRA-TWO, so is she.\n\nYou have the whole force: the Seahawk, Edinburgh's Poseidon and WEDGETAIL 05, Edinburgh's F-35As on the CAP row, and for the first time the Super Hornets and Growlers on the Attack row, recovering at Edinburgh. A coastal ro-ro, a bulker and the Melbourne-Perth service are in the box. Four of five to the split point.
Objective_Convoy=Four of five convoy hulls into the split point off Portland
Objective_Wedgetail=Keep the Wedgetail flying
Objective_Neutrals=Harm no merchant or aircraft
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>The Southern Convoy</color>|SOUTH OF PORTLAND, 38 South, mid-morning, a south-westerly. The Southern Convoy: the tanker PORTLAND SPIRIT, the bulker LIMESTONE COAST, the freighter GLENELG, the car carrier BASS HIGHWAY and CORAL PIONEER, thirteen knots, bound for the split point off Portland where the Adelaide hulls turn west and the Melbourne hulls go on.\n\nThe protection group is eighty miles south-west and it has stopped pretending: LIAONING, the Type 052D that has commanded the group since October, two frigates and a corvette, three J-15s with anti-ship missiles and a J-15D with them, a Ka-31 and a Z-18F up. If Under the Tasman missed ROMEO she is under the convoy; if the Bight missed SIERRA-TWO, so is she.\n\nYou have the whole force: the Seahawk, Edinburgh's Poseidon and WEDGETAIL 05, Edinburgh's F-35As on the CAP row, and for the first time the Super Hornets and Growlers on the Attack row, recovering at Edinburgh. A coastal ro-ro, a bulker and the Melbourne-Perth service are in the box. Four of five to the split point.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Four hulls at the split point and the group's air wing spent south of Portland. Santos: 'Adelaide turns west here. So do we, for once, with something to show.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Two hulls lost south of Portland with a month of two cities' cargo in them. The group broke the convoy where it said it would.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|Two hulls lost south of Portland with a month of two cities' cargo in them. The group broke the convoy where it said it would.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Four hulls at the split point and the group's air wing spent south of Portland. Santos: 'Adelaide turns west here. So do we, for once, with something to show.'
TimeoutMessage=<color=red>Out of time.</color>|Ninety minutes and the convoy is still short of the split point with the carrier's second strike forming. Portland's pilot boat waits for a convoy that turned back.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
