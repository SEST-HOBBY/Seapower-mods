[Language_en]
Name=Tasman Shield 05 - Under the Tasman
Description=THE TASMAN CABLE CORRIDOR, 36 South, the small hours. HMAS FARNCOMB is at periscope depth on the corridor, three hundred miles from the nearest coast, with the cable somewhere under her and a group coming up it from the south-west at eight knots.\n\nRV AUSTRAL SURVEY is following the cable with a towed array. Intelligence assesses ROMEO, the Type 093B, as escorting her; a Type 054A is over the top of both with a Z-9 dipping ahead of them. A thermal layer is reported near 120 feet. It may complicate acoustic contact, but does not guarantee concealment from the frigate, helicopter or submarine.\n\nWeapons free on the boat and the frigate. The survey ship is not a target. A Tasman bulker and a whale are in the box, and the whale sounds like a boat. Seventy-five minutes. Enemy awareness of Farncomb is unknown. Do not assume that silence means the boat is undetected.
Objective_Romeo=Destroy ROMEO
Objective_Survey=The survey ship is not a target
Objective_Farncomb=Bring Farncomb home
Objective_Neutrals=Harm no merchant or whale
Taskforce1StartMessage=<color=yellow>Under the Tasman</color>|THE TASMAN CABLE CORRIDOR, 36 South, the small hours. HMAS FARNCOMB is at periscope depth on the corridor, three hundred miles from the nearest coast, with the cable somewhere under her and a group coming up it from the south-west at eight knots.\n\nRV AUSTRAL SURVEY is following the cable with a towed array. Intelligence assesses ROMEO, the Type 093B, as escorting her; a Type 054A is over the top of both with a Z-9 dipping ahead of them. A thermal layer is reported near 120 feet. It may complicate acoustic contact, but does not guarantee concealment from the frigate, helicopter or submarine.\n\nWeapons free on the boat and the frigate. The survey ship is not a target. A Tasman bulker and a whale are in the box, and the whale sounds like a boat. Seventy-five minutes. Enemy awareness of Farncomb is unknown. Do not assume that silence means the boat is undetected.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|ROMEO is confirmed lost. Farncomb remains available to withdraw; retain the survey ship's contact record and report the frigate's status. This boat will no longer threaten the southern convoy.
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|Farncomb is lost under the Tasman, and ROMEO, which has screened the group since January, is still down there.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|Farncomb is lost under the Tasman, and ROMEO, which has screened the group since January, is still down there.
Taskforce2DefeatMessage=<color=red>Command report.</color>|ROMEO is confirmed lost. Farncomb remains available to withdraw; retain the survey ship's contact record and report the frigate's status. This boat will no longer threaten the southern convoy.
TimeoutMessage=<color=red>Operational window closed.</color>|Seventy-five minutes and ROMEO has passed up the corridor with the survey ship over her. She is in the Southern Convoy's water by the nineteenth.
TS03TenderNamedIntel=FUSION CELL | AUSTRAL SURVEY carries an emitter set recorded at AUSTRAL COMPLIANCE's rendezvous on 28 January. The surface contact is classified on the plot. This supports an association with the tender network; establish an acoustic contact to locate ROMEO.
TS05RomeoSunkIntel=ROMEO is gone. The Type 093B that crossed the convoy's track on 2 January and lay under the last voyage south is on the bottom of the Tasman. The Southern Convoy sails without her beneath it.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. Command has suspended the operation. Preserve the contact and engagement records.
