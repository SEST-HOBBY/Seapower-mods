[Language_en]
Name=Tasman Shield 05 - Under the Tasman
Description=THE TASMAN CABLE CORRIDOR, 36 South, the small hours. HMAS FARNCOMB is at periscope depth on the corridor, three hundred miles from the nearest coast, with the cable somewhere under her and a group coming up it from the south-west at eight knots.\n\nRV AUSTRAL SURVEY - a survey ship, a stand-in - is following the cable with a towed array. ROMEO is under her, escorting; a Type 054A is over the top of both with a Z-9 dipping ahead of them. The layer is at a hundred and twenty feet and the frigate's sonar does not see below it.\n\nWeapons free on the boat and the frigate. The survey ship is not a target. A Tasman bulker and a whale are in the box, and the whale sounds like a boat. Seventy-five minutes. Nothing on the surface knows Farncomb is here until she fires.
Objective_Romeo=Destroy ROMEO
Objective_Survey=The survey ship is not a target
Objective_Farncomb=Bring Farncomb home
Objective_Neutrals=Harm no merchant or whale
Taskforce1StartMessage=<color=yellow>Under the Tasman</color>|THE TASMAN CABLE CORRIDOR, 36 South, the small hours. HMAS FARNCOMB is at periscope depth on the corridor, three hundred miles from the nearest coast, with the cable somewhere under her and a group coming up it from the south-west at eight knots.\n\nRV AUSTRAL SURVEY - a survey ship, a stand-in - is following the cable with a towed array. ROMEO is under her, escorting; a Type 054A is over the top of both with a Z-9 dipping ahead of them. The layer is at a hundred and twenty feet and the frigate's sonar does not see below it.\n\nWeapons free on the boat and the frigate. The survey ship is not a target. A Tasman bulker and a whale are in the box, and the whale sounds like a boat. Seventy-five minutes. Nothing on the surface knows Farncomb is here until she fires.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|ROMEO is on the bottom of the Tasman with the cable under her, and the survey ship has turned for home with her towed array still streaming. Farncomb goes deep. The Southern Convoy sails without a boat beneath it.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Farncomb is lost under the Tasman. The boat that has screened the group since Cold Route is still under it.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|Farncomb is lost under the Tasman. The boat that has screened the group since Cold Route is still under it.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|ROMEO is on the bottom of the Tasman with the cable under her, and the survey ship has turned for home with her towed array still streaming. Farncomb goes deep. The Southern Convoy sails without a boat beneath it.
TimeoutMessage=<color=red>Out of time.</color>|Seventy-five minutes and ROMEO has passed up the corridor with the survey ship over her. She is in the Southern Convoy's water by the nineteenth.
TS03TenderNamedIntel=Chatham Watch's picture: the survey ship on the corridor carries the tender's emitters - the same navigation set, the same signals fit - and she is on your plot classified. Where she is, the boat is under her.
TS05RomeoSunkIntel=ROMEO is gone. The boat that crossed the track at Cold Route and lay under Last Ship South is on the bottom of the Tasman. The Southern Convoy sails without her beneath it.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
