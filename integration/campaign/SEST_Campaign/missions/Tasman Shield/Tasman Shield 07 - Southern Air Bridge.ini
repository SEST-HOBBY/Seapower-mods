[Language_en]
Name=Tasman Shield 07 - Southern Air Bridge
Description=THE TASMAN AIR ROUTE, a hundred miles off the New South Wales coast, afternoon. RELIEF 21 - an A330, a civil charter carrying the New Zealand relief detachment's advance party - is inbound to Sydney on the air bridge with WEDGETAIL 06 beside her and SENTRY 23, a Triton, above them both. Two Sydney-Auckland services are on the same route and a cruise ship and a coastal bulker are under it.\n\nLIAONING is two hundred and fifty miles south-east. A J-15 pair with a J-15D behind them is routed onto the charter's track and the flight is assessed as an armed interception threat. Your force is on the track with the destroyer's missiles as the surface half of the umbrella; Williamtown is a hundred and ninety-five miles north, and its F-35As are available for fighter cover, readied on its flight line for the first time.\n\nRelief 21 to the box off Sydney Heads. Keep the Wedgetail flying. Nobody shoots at an airliner in this box, and the way to make sure of that is to be between the carrier's flight and both of them.
Objective_Bridge=Relief 21 reaches the box off Sydney Heads
Objective_Wedgetail=Keep Wedgetail 06 flying
Objective_Neutrals=Harm no airliner, cruise ship or merchant
Objective_Flagship=Bring your flagship out intact
Taskforce1StartMessage=<color=yellow>Southern Air Bridge</color>|THE TASMAN AIR ROUTE, a hundred miles off the New South Wales coast, afternoon. RELIEF 21 - an A330, a civil charter carrying the New Zealand relief detachment's advance party - is inbound to Sydney on the air bridge with WEDGETAIL 06 beside her and SENTRY 23, a Triton, above them both. Two Sydney-Auckland services are on the same route and a cruise ship and a coastal bulker are under it.\n\nLIAONING is two hundred and fifty miles south-east. A J-15 pair with a J-15D behind them is routed onto the charter's track and the flight is assessed as an armed interception threat. Your force is on the track with the destroyer's missiles as the surface half of the umbrella; Williamtown is a hundred and ninety-five miles north, and its F-35As are available for fighter cover, readied on its flight line for the first time.\n\nRelief 21 to the box off Sydney Heads. Keep the Wedgetail flying. Nobody shoots at an airliner in this box, and the way to make sure of that is to be between the carrier's flight and both of them.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Relief 21 is in the box off the Heads with the Wedgetail beside her and both airliners on schedule. Ward: 'They came to see what we do. Now they know.'
Taskforce1DefeatMessage=<color=red>Operation suspended.</color>|The charter is down in the Tasman with the advance party in it, or the Wedgetail is. The air bridge closes and the relief detachment comes by sea, late.
Taskforce2VictoryMessage=<color=lime>Command report.</color>|The charter is down in the Tasman with the advance party in it, or the Wedgetail is. The air bridge closes and the relief detachment comes by sea, late.
Taskforce2DefeatMessage=<color=red>Command report.</color>|Relief 21 is in the box off the Heads with the Wedgetail beside her and both airliners on schedule. Ward: 'They came to see what we do. Now they know.'
TimeoutMessage=<color=red>Operational window closed.</color>|Sixty minutes and Relief 21 is still short of the Heads with the carrier's flight between her and Sydney. She diverts to Williamtown, which is not what the bridge was for.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. Command has suspended the operation. Preserve the contact and engagement records.
