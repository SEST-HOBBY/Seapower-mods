[Language_en]
Name=Southern Reach 04 - Macquarie Passage
Description=MACQUARIE ISLAND, morning. SUPPLY and CORAL PIONEER are in Buckles Bay under the station, with the island's year going ashore by boat and by helicopter while the weather allows it, which is about one day in three. This is the day.\n\nThe service window is thirty minutes and it runs on the clock, not on what crosses the beach. Both ships have to be inside the service box - five miles around the anchorage - when the window closes; what you do with them in between is your judgement. Hold it and your ships are rearmed before their next operation; miss it and they sail it on what they have. When the thirty minutes are up, both ships come north together to the withdrawal line.\n\nVICTOR, the Akula HMAS Collins named on the Macquarie Ridge, or one very like it, is fifty-five miles south-west and closing at twenty knots. The Russian research vessel AKADEMIK FERSMAN, keeping station west of the island, is her tender, and a Bear-F is coming up from the south-west over the anchorage with a Midas tanker somewhere behind it. The Bear is a reconnaissance flight until it is not; the tender is a research vessel with a flag. Your weapons are tight. Hold the window and get everybody out of it.
Objective_Service=Have SUPPLY and CORAL PIONEER inside the service area at 30 minutes, then bring both to the northern withdrawal line
Objective_Supply=HMAS Supply must survive
Objective_Cargo=MV Coral Pioneer must survive
Objective_Restraint=Fire on nothing that has not fired: the boat, the Bear and the tender are not targets
Objective_Neutrals=Harm no fishing boat or whale
Taskforce1StartMessage=<color=yellow>Macquarie Passage</color>|MACQUARIE ISLAND, morning. SUPPLY and CORAL PIONEER are in Buckles Bay under the station, with the island's year going ashore by boat and by helicopter while the weather allows it, which is about one day in three. This is the day.\n\nThe service window is thirty minutes and it runs on the clock, not on what crosses the beach. Both ships have to be inside the service box - five miles around the anchorage - when the window closes; what you do with them in between is your judgement. Hold it and your ships are rearmed before their next operation; miss it and they sail it on what they have. When the thirty minutes are up, both ships come north together to the withdrawal line.\n\nVICTOR, the Akula HMAS Collins named on the Macquarie Ridge, or one very like it, is fifty-five miles south-west and closing at twenty knots. The Russian research vessel AKADEMIK FERSMAN, keeping station west of the island, is her tender, and a Bear-F is coming up from the south-west over the anchorage with a Midas tanker somewhere behind it. The Bear is a reconnaissance flight until it is not; the tender is a research vessel with a flag. Your weapons are tight. Hold the window and get everybody out of it.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|The service check is complete and both ships have reached the withdrawal line. The island's resupply can continue, and the force has secured its next ammunition allocation.
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The anchorage is broken. The island gets what was ashore before the window closed and nothing more until next summer.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The anchorage is broken. The island gets what was ashore before the window closed and nothing more until next summer.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The service check is complete and both ships have reached the withdrawal line. The island's resupply can continue, and the force has secured its next ammunition allocation.
TimeoutMessage=<color=red>Operational window closed.</color>|Seventy-five minutes and the ships are still south of the line with a boat somewhere in the bay. Whatever crossed the beach, the group is not out of the anchorage, and the Bear has the photographs.
StageIntel=SERVICE CONTROL: Both ships are inside the service area at the scheduled check. The rendezvous is complete and the next ammunition allocation is released. Withdraw SUPPLY and CORAL PIONEER north together; continue screening the south-western approach.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
