[Language_en]
Name=Southern Reach 06 - Broken Supply Line
Description=SOUTH OF THE AUCKLAND ISLANDS, early morning. DERWENT SPIRIT took a torpedo forward at 0210 - the first shot fired in the south - and she is still afloat because the Chief got a collision mat over the hole and the tanks aft are full. One engine, six knots, Bluff. CORAL PIONEER is in company because her master, Leila Santos, would not be elsewhere.\n\nAcoustic reporting links the attack to VICTOR, the Akula HMAS Collins named on the Macquarie Ridge on the ninth. The last estimated position is ahead of the coaster's track, between here and the islands; establish the present contact before acting. A Type 054A flying the fisheries-protection flag is fifty miles east with its helicopter up and has been keeping station on the coaster since first light, which is not something a fisheries patrol does. A Bear is overhead.\n\nYou have the force already allocated and what Macquarie left in the magazines. Bring the coaster to the handover line. The expedition ship out of the islands, the longliner and the whale are in the same water; nobody in New Zealand's region will forgive a dead tourist. Weapons tight on anything that has not fired; on the boat, answer her if she fires again - the hunt waits on Wellington and Canberra.
Objective_Coaster=Bring DERWENT SPIRIT to the handover line
Objective_Cargo=MV Coral Pioneer must survive
Objective_Flagship=Bring your flagship out intact
Objective_Neutrals=Harm no expedition ship, fishing boat or whale
Taskforce1StartMessage=<color=yellow>Broken Supply Line</color>|SOUTH OF THE AUCKLAND ISLANDS, early morning. DERWENT SPIRIT took a torpedo forward at 0210 - the first shot fired in the south - and she is still afloat because the Chief got a collision mat over the hole and the tanks aft are full. One engine, six knots, Bluff. CORAL PIONEER is in company because her master, Leila Santos, would not be elsewhere.\n\nAcoustic reporting links the attack to VICTOR, the Akula HMAS Collins named on the Macquarie Ridge on the ninth. The last estimated position is ahead of the coaster's track, between here and the islands; establish the present contact before acting. A Type 054A flying the fisheries-protection flag is fifty miles east with its helicopter up and has been keeping station on the coaster since first light, which is not something a fisheries patrol does. A Bear is overhead.\n\nYou have the force already allocated and what Macquarie left in the magazines. Bring the coaster to the handover line. The expedition ship out of the islands, the longliner and the whale are in the same water; nobody in New Zealand's region will forgive a dead tourist. Weapons tight on anything that has not fired; on the boat, answer her if she fires again - the hunt waits on Wellington and Canberra.
Taskforce1VictoryMessage=<color=lime>Operation complete.</color>|Derwent Spirit is at the line with a tug coming down from Bluff, and Coral Pioneer is beside her. The Chief's mat held. Brand: 'She is in our hands now. Nobody touches her.'
Taskforce1DefeatMessage=<color=red>Operation failed.</color>|The coaster is gone with the winter's fuel in her, three hundred miles from a slipway. Casey's January is a different problem now.
Taskforce2VictoryMessage=<color=lime>Opposing force prevailed.</color>|The coaster is gone with the winter's fuel in her, three hundred miles from a slipway. Casey's January is a different problem now.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|Derwent Spirit is at the line with a tug coming down from Bluff, and Coral Pioneer is beside her. The Chief's mat held. Brand: 'She is in our hands now. Nobody touches her.'
TimeoutMessage=<color=red>Operational window closed.</color>|Seventy-five minutes and the coaster is still short of the line with a boat somewhere ahead of her. The tug from Bluff has nothing to meet yet.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|A protected contact has been destroyed. The operation has failed. Preserve the contact and engagement records.
