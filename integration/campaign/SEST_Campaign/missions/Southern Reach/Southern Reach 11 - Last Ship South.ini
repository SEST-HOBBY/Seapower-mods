[Language_en]
Name=Southern Reach 11 - Last Ship South
Description=THE DEEP TRANSIT, 55 South, morning. SOUTHERN ENDEAVOUR is on the last voyage of the season with Casey's winter aboard; DERWENT SPIRIT is in company if Cold Route left her afloat. Twelve knots, south-west, and what remains of the force around them.\n\nThe frigate and the corvette that screened the carrier on the second are coming north-east to meet the voyage; the nuclear boat that was ahead of the January convoy is across this track too. The carrier is two hundred miles east and has a pair loaded for ships with its Ka-31 up. Hobart is eleven hundred miles behind you - nothing with wings reaches here and comes home. The Seahawk is your aviation and the magazines are what Cold Route left.\n\nBring Southern Endeavour to the handover line. Bring the tanker if she is with you. The trawler and the whale are in the same water.
Objective_Endeavour=Bring RSV Southern Endeavour to the handover line
Objective_Tanker=Do not lose Derwent Spirit, if she sailed
Objective_Flagship=Bring your flagship out intact
Objective_Neutrals=Harm no trawler or whale
Taskforce1StartMessage=<color=yellow>Last Ship South</color>|THE DEEP TRANSIT, 55 South, morning. SOUTHERN ENDEAVOUR is on the last voyage of the season with Casey's winter aboard; DERWENT SPIRIT is in company if Cold Route left her afloat. Twelve knots, south-west, and what remains of the force around them.\n\nThe frigate and the corvette that screened the carrier on the second are coming north-east to meet the voyage; the nuclear boat that was ahead of the January convoy is across this track too. The carrier is two hundred miles east and has a pair loaded for ships with its Ka-31 up. Hobart is eleven hundred miles behind you - nothing with wings reaches here and comes home. The Seahawk is your aviation and the magazines are what Cold Route left.\n\nBring Southern Endeavour to the handover line. Bring the tanker if she is with you. The trawler and the whale are in the same water.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Southern Endeavour is at the line and Casey has its winter. Whatever the escort spent getting her there is in the ledger; Marsh's message, in full: 'You were.'
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The last ship south is lost with the winter in her. The stations close early, and the season the task group sailed to keep is over.
Taskforce2VictoryMessage=<color=lime>Red victory.</color>|The last ship south is lost with the winter in her. The stations close early, and the season the task group sailed to keep is over.
Taskforce2DefeatMessage=<color=red>Red defeat.</color>|Southern Endeavour is at the line and Casey has its winter. Whatever the escort spent getting her there is in the ledger; Marsh's message, in full: 'You were.'
TimeoutMessage=<color=red>Out of time.</color>|Eighty minutes and the Endeavour is short of the line with a frigate closing and a boat under her. The voyage turns back for Hobart, and Casey winters on what it has.
NeutralLossMessage=<color=orange>Neutral contact lost.</color>|That one was not ours to shoot. The operation ends here and it goes in the record.
