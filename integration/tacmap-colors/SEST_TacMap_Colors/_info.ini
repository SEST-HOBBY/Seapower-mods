[Language_en]
Name=SEST TacMap Colors
Description=Makes tactical map waypoint lines readable: vanilla draws them at 39 percent alpha which turns into a dark tangle on a busy map. Lines are now black by day and white at night, fully opaque, at 1.5x thickness, with the selected route in red and formation tethers faded back. Note the game has only ONE waypoint line colour - air, surface and ground routes cannot be coloured separately through data. Place ABOVE nothing in particular; it only overrides the vanilla UI file.

