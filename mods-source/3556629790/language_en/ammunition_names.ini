#-----------Land Strike only missiles---------
wp_rt-23=RT-23,Molodets,ASM,The RT-23 Molodets (NATO reporting name SS-24 Scalpel) was a cold-launched, three-stage, solid-fueled intercontinental ballistic missile developed and produced before 1991 by the Yuzhnoye Design Bureau. It came in silo- and rail-based variants and was armed with 10 MIRV warheads.

usaf_lgm-30g=LGM-30G,Minuteman III,ASM,The LGM-30 Minuteman is an American land-based intercontinental ballistic missile (ICBM) in service with the Air Force Global Strike Command. As of 2024, the LGM-30G is the only land-based ICBM in service in the United States and represents the land leg of the U.S. nuclear triad