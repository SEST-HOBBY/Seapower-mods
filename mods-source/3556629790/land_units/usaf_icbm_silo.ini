[General]
UnitType=LandUnit
LandUnitSubType=MissileSite //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=3
MinCameraDistanceForeAft=1.3
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.15

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Heavy
DamagePoints=600  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=TEL
Tag=Ground+Vehicle

[AI]
UnitScoreValue=10              // value for calculation of mission score
Role=ASuW,ASM

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

