#=========================================================================================================================================================
# RGB-NM-2 "Gagara" - Advanced Active Sonobuoy (2025 Russian, custom mod)
# Active + passive directional. Long life, datalink relay, modern narrowband processing.
#=========================================================================================================================================================
[General]
# RGB-NM-2
# Users:
Type=Sonobuoy                          // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW
LifeTime=14400                         // For sonobouy it is a time in seconds while its sonar works (4h)

Mass=16                                // in kg. Used for aircraft
AmmoPoints=30                          // For Supply System. Premium 2025 active sonobuoy

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0

DecalClass=Standard                    // referenced in effects/decals.ini
[SensorData]
IRSignature=VeryTiny
RCS=VerySmall                   //radar related (RCS => radar cross section) i.e how visible is target

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
ParachuteSlowDown=0.99                   // speed damping
ParachuteEndVelocity=100               // slow down end speed in knots of torpedo with parachute
TrimDepth=-0.004                         //Depth offset in units. Negative numbers move object deeper, positive - higher

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=-1

[OnBoardSystems]
Sonar=RGB-NM-2_Sonar
#ActiveTestSonar                   //Sonar used for the detection. Must be in sensors.ini
SonarDepth=150                          //Depth of sonar relative to sonobouy in feet
TransmitterRange=3000                     //Range in nautical miles in which friendly units are able to receive data from buoy

[---------- Guidance ----------]
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.5         // Time in seconds before colliders are enabled
EjectVelocity=20                        // Initial forward speed in knots
MinLaunchRange=0                       // Minimum launch range in nautical miles
MaxLaunchRange=100                   // Maximum launch range in nautical miles
MinLaunchAltitude=200                  // Minimum launch altitude in feet.
MaxLaunchAltitude=1000                 // Maximum launch altitude in feet.
MaxTurnRate=1                        // Maximum turnrate in degrees per second
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
CircularErrorRadius=20               // Circular error radius in meters
[---------- Mesh definitions----------]
[Models]
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_mk-82
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_mk-82_mat
AssetBundleMeshHullCollider=usn_mk-82_coll
ResourcesFolder=weapons/wp_rgb-1/
ResourcesRoot=wp_rgb-1
ResourcesMesh=wp_rgb-1_dummy
ResourcesMaterial=wp_rgb-1_mat
ResourcesMeshForLaunch=wp_rgb-1_dummy
NumberOfSubModels=1
SubModel1=AntennaShallow //100ft (30m) deep model
[AntennaShallow]
Type=Antenna
Mesh=wp_rgb-1
[---------- Effects ----------]
[Particles]
ParachuteEffect=effects/weapons/emitters/parachute_square
ParachuteEffectPosition=0,0,-0.005
InFlightEffect=None
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0
HitShipExplosion=effects/Particle Emitters/impact_medium_shell
HitAirExplosion=effects/Particle Emitters/impact_medium_shell
HitDefaultExplosion=effects/Particle Emitters/impact_medium_shell
HitWaterSplashClass=SmallWaterSplashes
ExplosionOverwaterSplashClass=SmallWaterSplashes
[---------- Sounds ----------]
[Sounds]
SoundMode=1
BoosterAudioClip=
BoosterAudioRollOff=Logarithmic
BoosterAudioDistance=1,20
BoosterAudioPitchRange=0.4,1
SustainerAudioClip=
SustainerAudioRollOff=Logarithmic
SustainerAudioDistance=1,20
SustainerAudioPitchRange=0.1,0.6
InflightAudioClip=audio/weapons/TorpedoEngine
InflightAudioRollOff=Logarithmic
InflightAudioDistance=1,20
InflightAudioPitchRange=0.1,0.6
[---------- Colliders ----------]
[Colliders]
Collider=col_main
[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637
