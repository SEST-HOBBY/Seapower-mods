#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# AT-2UM
# Users: 
Type=Torpedo                           // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW

Mass=1380                              // in kg. Used for aircraft
AmmoPoints=2450                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
SupplyCategory=AirTorpedo              // For Supply System. Makes that presence of such category is required for replenishment of this weapon
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related //TODO: Placeholder values! Need to be replaced!
BaseNoise=120                   // base sound level in db at 1m distance
FlowNoise=0.5                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0               // additional noise for cavitation in db
TargetReflectionStrength=1      // in dB for broad side
# Transient - not needed, air-launched

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
ParachuteSlowDown=0.99                   // speed damping
ParachuteEndVelocity=100.0               // slow down end speed in knots of torpedo with parachute
MaxAngleWithParachute=80.0               // defines how steep the angle can become with the parachute

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=60
ImpactSize=Medium                       // Impact size, can be small, medium, large, verylarge
Penetration=Always       // can be minor, moderate, heavy, always
FuzeProximityDistance=10         // for proximity fuze: distance to target in meter

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
#10 = Combined Active&Passive Sonar Homing
[Guidance]
GuidanceType=10
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided 
InitialFlightPhaseDuration=2.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
TerminalVelocity=40.0                  // Maximum speed in knots when torpedo is locked on target
#========================================= Launch stats ============================================================
MaxVelocity=45.0                       // Maximum speed in knots
Acceleration=12.0                      // Acceleration factor
MaxTurnRate=15.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.3                     // Minimum launch range in nautical miles
MaxLaunchRange=21                     // Maximum launch range in nautical miles
MinLaunchAltitude=100                  // Minimum launch altitude in feet.
MaxLaunchAltitude=1000                 // Maximum launch altitude in feet.

MaxDepth=2000                         // Maximum allowed depth in feet.

LaunchReliability=85                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerFOV=80                         // Seeker field-of-view in degrees
SeekerActiveRange=3.5                  // Seeker active range in nautical miles
SeekerPassiveRange=4                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed /Dot: TBD to more fancy guidance

SeekerGain=18.0                        // Seeker gain in dB
SeekerOutputPower=230                  // Active seeker output power in dB, unused for passive ones
#ECCM
AntiCountermeasuresBonus=0.5          // This value substracted from probability of spoofing by countermeasures (0...1)
MinAfterSpoofEffectTime=10.0            // Min time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
MaxAfterSpoofEffectTime=27.0           // Max time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
# Torpedo related
SearchMode=3                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
SearchVelocity=30.0                    // velocity in search mode in knots
ReattackMode=1                         // 0 = None, 1 = Circle, 2 = Drive-around
ReattackCircleDegreesPerSecond=15.0    // degrees per second for circle reattack pattern
LadderParams=0.0,0.0                   // First leg, second leg in feet
SnakeSearchAngle=30.0                  // going left/right using that angle
SnakeSearchTurnCycleTime=6.0           // time in seconds it takes for one complete snake cycle (left/right)
SpiralSearchParams=65,900              // Ceiling, floor in feet
SpiralSearchRadius=0.3                 // search radius in nautical miles
SpiralSearchAngle=11.0                 // up/down angle for spiral search
DefaultDepth=200.0                     // default depth in feet a torpedo is using for submerged targets for bearing only launches

