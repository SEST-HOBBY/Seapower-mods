dvd_kh-59mk2=Kh-59Mk2,,Land Attack,The Kh-59Mk2 is a new generation of composite guided cruise missile that is compatible with stealth fifth generation aircraft missile compartments and enables out of zone strikes.

wp_at-2um=AT-2UM(533mm),Torpedo,ASW, The (fictional) AT-2UM is the latest generation of ultra heavy anti submarine torpedo, with a caliber of 533mm and a body length of 7m. It is designed specifically to respond to ultra quiet US Navy submarines and can be deployed by surface vessels or maritime patrol aircraft.

dvd_rgb-58b=RGB-58B,,Active sonar buoy,the latest active sonar buoy developed by the Soviet Union, has excellent performance, but its corresponding cost is also high
dvd_rgb-78b=RGB-78B,,Passive sonar buoy,the latest passive sonar buoy developed by the Soviet Union, has excellent performance and incorporates various advanced technological means to ensure its detection capability for submarines with excellent noise reduction performance
dvd_rgb-4a=RGB-4A,,Passive sonar buoy,a cost-effective passive sonar buoy developed by the Soviet Union, has average performance but the advantage is that it has a very low cost and can be used for wide net deployment schemes