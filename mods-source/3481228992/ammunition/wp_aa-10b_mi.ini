[General]
#R-27T
#Ranges info: https://baike.baidu.com/item/AA-10%E7%A9%BA%E7%A9%BA%E5%AF%BC%E5%BC%B9/8853229
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
Mass=245                               // in kg. Used for aircraft

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
#Visual
VisualIdentificationRange=3  // at what range in nm this unit can be visually identified
# Radar related (RCS => radar cross section)
RCS=VerySmall
IRSignature=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=20
ImpactSize=Small                   // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

FuzeProximityDistance=20.0             // for proximity fuze: distance to target in meters
KillProbability=0.8                   // Base chance to hit
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=0.2                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0.8         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=1000              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
#========================================= Launch stats ============================================================
MaxVelocity=2432           //4m          // Maximum speed in knots
VelocityBleed=0.7                   // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
AccelerationTime=12                  // Time until start of the velocity bleed, in seconds
Acceleration=18                      // Acceleration factor
MaxTurnRate=43                       // Maximum turnrate in degrees per second
MinLaunchRange=0.3                     // Minimum launch range in nautical miles
MaxLaunchRange=21.6           //80km           // Maximum launch range in nautical miles
LaunchReliability=95                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
IsRearAspectOnly=False                 // Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=120                     // Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=2                            // Seeker field-of-view in degrees
SeekerGimbalFOV=45                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=9.72                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True
#ECCM
CounterMeasuresRejection=90            // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=80                      // The lower the value, the greater risk of spoofing by jamming	(0...100)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=4.0                  // delay in seconds for self destruction

