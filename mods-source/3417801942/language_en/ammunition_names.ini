# ---------------- Sonobuoys ---------------
plan_sq-4=SQ-4,DIFAR,Sonobuoy,The SQ-4 is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional sonobouys.

