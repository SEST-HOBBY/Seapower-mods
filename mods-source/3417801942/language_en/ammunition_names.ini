[AmmunitionNames]
# ------------------ AAM ------------------

plan_pl-10=PL-10,CH-AA-9,AAM,The PL-10 is a Chinese short-range infrared homing air-to-air missile. It is more maneuverable compared to the AIM-9L, but still rear aspect only, requiring the launching aircraft to get onto the targets 'six'.

plan_pl-15=PL-15,CH-AA-15 Abaddon,SARH AAM,The PL-15 is a Chinese long-range semi-active radar homing air-to-air missile. Roughly analogous to the US AIM-7E, the PL-15 features a monopulse seeeker with increased ECM resistance and lock-on-after-launch capability.

# ------------------ SAM ------------------
plan_hhq-7=CH-SA-4,,SAM,The HHQ-7 (Hóng Qí-7 Red Banner-7) is a short-range surface-to-air missile (SAM) from the People's Republic of China. It was reverse-engineered by the Changfeng Electromechanical Technology Design Institute from the French R-440 Crotale SAM. It entered service in the early 1980s.

# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------
plan_hy-1j=HY-1J,CSS-N-2 Safflower,ASM,The HY-1J is a Chinese subsonic anti-ship cruise missile. It is manufactured by the China Aerospace Science and Industry Corporation Fifth Academy.  The name CSSC-2 Silkworm is popularly used for the entire SY and HY family. As a NATO reporting name, it applies only to the land-based variant of the HY-1.  The ship-launched version (HY-1J) had the NATO reporting name CSS-N-2 Safflower.

plan_hy-1ja=HY-1JA,CSS-N-2C Safflower,ASM,The HY-1JA is a Chinese subsonic anti-ship cruise missile. It is manufactured by the China Aerospace Science and Industry Corporation Fifth Academy.  It is an improved ship-to-ship variant with a longer range, and a new radar seeker for better anti-jamming capability and accuracy.

plan_yj-83=CSS-N-8,Saccade,ASM,The YJ-83 is a Chinese subsonic anti-ship cruise missile. It is manufactured by the China Aerospace Science and Industry Corporation Third Academy.

