# ---------- Anti-sub  Missilies ----------

# ------------------ RBU ------------------
plan_fqf-2500=FQF-2500,,ASW Mortar,The FQF-2500 is a 213mm Chinese anti-submarine rocket launcher. The FQF-2500 has a range of approximately 2500 yards, and is based on the Soviet RBU-2500.


# --------------- Torpedoes ---------------
plan_yu-3=YU-3,,ASW Torpedo,The YU-3 is a Chinese heavyweight electrical anti-submarine torpedo with active sonar guidance.

plan_yu-5=YU-5,,ASW Torpedo,The YU-5 is a Chinese heavyweight anti-submarine wire-guided torpedo. It improves on the YU-3 with more advanced active/passive homing capabilities.

plan_yu-6=YU-6,,ASW Torpedo,The YU-6 torpedo is the Chinese counterpart of the US Mark 48 torpedo, and it is the first domestic Chinese torpedo designed to counter both surface ships and submarines from the very start. Guidance can be by wire, active and passive homing, or wake homing. Domestic Chinese sources have claimed that the Yu-6 torpedo is in the same class as the Mk 48 Mod. 4 torpedo, and it is believed to have been cloned from a captured sample, but official information on the Yu-6 torpedo is limited.

plan_yu-7_air=YU-7,,ASW Torpedo,The YU-7 torpedo is the standard PLAN lightweight torpedoes used across multiple nations. Designed to attack modern high-performance submarines this variant is air dropped.  It is suspected to have been derived from 40 A244/S torpedoes purchased for evaluation from Italy in 1987. Additional technology may have been reverse engineered from a United States Mark 46 Mod 2 torpedo recovered from the South China Sea in 1978 by Chinese fishermen.

plan_yu-7_ship=YU-7,,ASW Torpedo,The YU-7 torpedo is the PLAN standard for lightweight torpedoes used across multiple nations. Designed to attack modern high-performance submarines this variant is ship launched.  It is suspected to have been derived from 40 A244/S torpedoes purchased for evaluation from Italy in 1987. Additional technology may have been reverse engineered from a United States Mark 46 Mod 2 torpedo recovered from the South China Sea in 1978 by Chinese fishermen.


