#---------------------------------------- Sonar ----------------------------------------

Pegas-2M=Pegas-2M «Pegasus»|Pegas-2M (NATO Reporting name: Buck Toe) is a Soviet keel-mounted, medium frequency passive/active sonar array dating from the late 1960's.

SJD-1=H/SJD-1 Type 601|H/SJD-N (Type 601) sonar is an indigenously developed ‘bow-mounted’ sonar, first of its kind in China. Initial proposal of adopting Soviet ‘Tamir-11’ (MG-11, NATO reporting name Stag Hoof) designed for search, light sonar was rejected, because it was not considered adequate enough due to its single beam search capability, which means the low speed of search cycle would easily lose targets. A more capable indigenous Chinese sonar was ordered to be developed, with Mr. Huo Guo-zheng named as the ‘General Designer’. The resulting indigenous Chinese domestic sonar developed was the ‘SJD-1’ low frequency (LF), high power, large aperture sonar with a cylindrical array (designated as ‘Type 601’ Sonar Array). 

SJD-N=H/SJD-N Type 675|H/SJD-1 (Type 675) sonar is an indigenously developed ‘bow-mounted’ sonar.  It was discovered that SJD-1 sonar cannot provide accurate locations of targets, and the error was too great to be adequate enough to provide fire solutions to onboard ASW weapons. Therefore, the design of ‘Type 051D’ incorporated an additional high frequency (HF) active attack sonar designated as SJD-N (with ‘Type 675’ sonar transducer array) to provide fire solutions, and this attack sonar was subsequently fitted on all Luda class ships. SJD-N was subsequently upgraded to ‘SJD-4’ standards.


