#---------------------------------------- Naval Guns ----------------------------------------
Type66-37mm=Type66 37mm Gun|37mm Gun|The Type 66 37mm is a twin-barrel 37mm mount that equips PLAN warships built during the mid Cold War period. It is more capable against modern aircraft than the earlier 57mm mounts used by the PLAN.

Type76-57mm=Type 76 57mm Gun|57mm Gun|The Type 76 57mm is a twin-barrel 57mm mount that equips some PLAN warships built during the early Cold War. Being loaded from 3-round clips and only being able to fire 50 rounds before having to be cooled by running seawater through the barrels, these guns are of questionable utility against modern aircraft.

Type76-130mm=Type 76 130mm Gun|130mm Gun|The Type 76 130mm is a twin-barrel quickfiring 130mm gun that equips PLAN warships built during late Cold War. It is most effective against small surface combatants and subsonic aircraft. It is less effective against missiles.

