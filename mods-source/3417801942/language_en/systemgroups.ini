#SPS-40=SPS-40|The AN/SPS-40 is a long range 2D air search radar common on many US ships. As a 2D radar it provides only azimuth and slant range data. Additional sensors must be used to determine height.

Type_354=Type 354|The Type 354 is a 3D long-range air search radar use to provide bearing, range and altitude.  The 3D radar acts as an intermediary between the 2D early warning radar and the fire-control radars used for engaging targets.

Type_364=Type 364|The Type 364 is a short range surface search radar commonly used aboard PLAN ships for the detection and tracking of surface and very low-flying contacts.

Type_517=Type 517|The Type 517 is a long range 2D air search radar common on PLAN ships. As a 2D radar it provides only azimuth and slant range data. Additional sensors must be used to determine height.

