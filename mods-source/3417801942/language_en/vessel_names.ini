[****************************** China ******************************]
[plan_cv_fujian]
Type=CV,Aircraft Carrier
Default=Fujian-class,Fujian
DefaultDescription=Fujian, named after Fujian province, is a Chinese aircraft carrier serving in the People's Liberation Army Navy. It is the third aircraft carrier of the Chinese aircraft carrier programme and the first of the Type 003 class (NATO/OSD Fujian class).  It succeeds the Type 002 Shandong which is described as a modified Kuznetsov-class aircraft carrier. It is China's first indigenously designed carrier, and its first capable of catapult-assisted take-offs; previous Chinese carriers used ski-jumps.
Variant1=Fujian Type 003,Fujian

[plan_ddg_luda_typ_051]
Type=DDG,Destroyer
Default=Luda-class (Type 051),Luda
DefaultDescription=The Type 051 destroyer (NATO: Luda-class 051 Destroyer) was a class of guided missile destroyers, based on the hull of the Soviet Neustrashimy-class destroyer, deployed by China. It was the first guided missile destroyer fielded by the People's Liberation Army Navy (PLAN), and the first designed and built in China. 17 were built from 1970 to 1990;
Variant1=Guangzhou DDG-160,Guangzhou
Variant2=Xi'an DDG-106,Xi'an
Variant3=Changsha DDG-161,Changsha
Variant4=Yinchuan DDG-107,Yinchuan
Variant5=Nanning DDG-162,Nanning
Variant6=Nanjing DDG-131,Nanjing

[plan_ddg_luda_typ_051d]
Type=DDG,Destroyer
Default=Luda-class (Type 051D),Luda D
DefaultDescription=The 051D destroyer is the second batch of Type 051 ships that are officially finalized and starting to be built in batches. The denomination D stands for Dingxing or "finalized design". The focus of this variant of the class is to correct the problems exposed in the construction and service use of the basic Type 051. The main change is to replace the double 57mm naval gun with a double 37mm naval gun that has a radar GFCS. The firing rate of the original double 57mm gun was not high and caused it to eventually be abandoned.  Improved sonars were also added.
Variant1=Xining DDG-108,Xining
Variant2=Nanchang DDG-163,Nanchang
Variant3=Chongqing DDG-133,Chongqing
Variant4=Zunyi DDG-134,Zunyi
Variant5=Guilin DDG-164,Guilin

[plan_ddg_luda_typ_051dt]
Type=DDG,Destroyer
Default=Luda-class (Type 051DT),Luda DT
DefaultDescription=The Type 051DT was a modernized Type 051D. Kaifeng and Dalian were modernized to somewhat different designs.  Kaifeng initially received the Thomson-CSF Tavitac combat data system, the Type 393 surface search radar, and HQ-7 (Crotale derivative) surface-to-air missiles (SAM); the missiles replaced "X" turret. In 1999, YJ-8 missiles replaced the HY-series, and electronic warfare systems were upgraded.  Dalian received a similar modernization as Kaifeng. A notable difference was Dalian used the ZKJ-1 combat data system, which was also used on the Type 051Z.  They were later equipped with YJ-83 anti-ship missiles.  The Type 051DT was part of the Luda III class, and later the Luda IV class.
Variant1=Kaifeng DDG-109,Kaifeng
Variant2=Dalian DDG-110,Dalian

[plan_em_sovremenny]
Type=EM,Destroyer
Default=Hangzhou-class (Sovremennyy),Hangzhou
DefaultDescription=Known in Russian as the Buzzard (Project 956) the Sovremenny-class is intended to fight alongside the Udaloy-class, but optimised for the anti-ship mission. Compared to the earlier Kresta II BPKs, it has an improved area air-defence capability, and the use of the SS-N-22 Sunburn missile gives it a fearsome anti-ship capability, especially in littoral waters. 4 of these vessels were built for the Chinese Peoples Liberation Army Navy (PLAN).  They are named after Chinese Cities.
Variant1=Hangzhou 956E,Hangzhou
Variant2=Fuzhou 956E,Fuzhou
Variant3=Taizhou 956EM,Taizhou
Variant4=Ningbo 956EM,Ningbo

