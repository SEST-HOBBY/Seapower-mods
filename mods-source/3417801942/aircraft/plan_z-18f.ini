MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.0

GroundedPitchAngle=-1.5  // this angle is the pitch (x) angle at ground with gears down
OnGroundOffset=0.036       // defines the distance between center coordinates and the wheels on ground
