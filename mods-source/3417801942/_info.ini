[Language_en]
Name=PRC Chinese Navy (PLAN)
Description=This Mod adds a few People's Liberation Army Navy (PLAN) Vessels to the game.

Included vessels:

Fujian-class        China's first indigenously designed Carrier
Hangzhou-class      Chinese built Sovremenny-class Destroyers
Luda Type 051       The first DDG class designed and built in China 
Luda Type 051D      A finalized version of the Type 051
Luda Type 051DT     A modernized version of the Type 051D

Ming-class          A Chinese variant of the Soviet Romeo-class Submarine
Yuan Zheng-class    A Chinese built variant of the Soviet Kilo-class Submarine
Han-class           China's first-generation nuclear-powered attack submarine 
Jin-class Type 094  Chinese nuclear-powered ballistic missile submarine

Included aircraft:

J-15A Flying Shark  Chinese 4.5 generation multirole fighter based on the Russian Su-33
KJ-600A             Chinese AEW&C aircraft
Z-18F               Chinese ASW Helicopter derived from the Aérospatiale SA 321 Super Frelon
Z-18J               Chinese AEW Helicopter derived from the Aérospatiale SA 321 Super Frelon

The Mod uses kit-bashing, and slight changes to game files to try to minimize impact from patches and upgrades to the base game by Triassic Games.  
