DefaultDescription=The Ka-27RLD helicopter is a maritime AEW helicopter in service with the Soviet Navy. Developed by Kamov Design Bureau Joint Stock Company as an improvement over the Ka-29, it is deployed aboard the Russian aircraft carrier Kuznetsov. In addition to serving as a carrier-based aircraft, the helicopter can also be deployed on cruisers, destroyers, and frigates, or used as a shore-based early warning platform. First prototypes were issued in 1986 to be tested on Kiev carriers. It is primarily deployed on carriers and major capital shops, where it performs beyond-line-of-sight search and guidance missions for anti-ship cruise missiles, as well as low-altitude surveillance duties.
