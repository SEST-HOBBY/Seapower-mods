[N001]
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Air               // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=2       // if applicable number of targets it can track simultaneously
WeaponChannels=1       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-60,60|-55,60      // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=0.8      // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0.4           // min range in km
MaxRange=140.0         // max range in km
MinAltitude=50        // min altitude in meters, relevant for air, unused for surface
MaxAltitude=27000      // max altitude in meters, relevant for air, unused for surface
RangeResolution=30.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.2          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=48.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=10.0        // output peak power in kW

