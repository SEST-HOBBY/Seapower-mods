[oeps-27]
Kind=Visual
Infrared=Ture
VIDRangeMultiplier=0.8             // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=1.5          // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.3           // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.9

