[AmmunitionNames]
su_aa-10a=R-27R,,AAM,,The Vympel R-27R (AA-10A Alamo) is a Soviet semi-active radar-guided medium-range air-to-air missile that innovatively uses an inverted trapezoidal wing to enhance the missile's maneuverability.

su_aa-10b=R-27T,,AAM,,The Vympel R-27T (AA-10B Alamo) is a Soviet semi-active radar-guided medium-range air-to-air missile with an infrared seeker and a shorter range than the R-27R.

su_aa-10c=R-27ER,,AAM,,The Vympel R-27ER (AA-10C Alamo) is a Soviet semi-active radar-guided medium-range air-to-air missile. It is an improved version of the R-27R, which has been extended to increase the range of the missile.

su_aa-10d=R-27ET,,AAM,,The Vympel R-27ET (AA-10D Alamo) is a Soviet semi-active radar-guided medium-range air-to-air missile with an infrared seeker and a shorter range than the R-27ER.

su_aa-11=R-73,,AAM,The Vympel R-73 (AA-11 Archer) is an infrared AAM missile developed by the Soviet Union in the 1970s and 1980s. The R-73 pioneered the use of a vector engine, giving the missile far greater maneuverability than its contemporary missiles. It is considered one of the most threatening AAM missiles.

su_aa-12=R-77,,AAM,The Vympel R-77（AA-12 Adder）It is Russia's active radar-guided medium-range air-to-air missile. The research and development work began in the Soviet era, but it was not completed until after the disintegration of the Soviet Union. The missile uses a unique grid-wing aerodynamic layout, which brings excellent high-speed performance to the missile, but also increases the resistance at low speed.

su_aa-12_1=R-77-1,,AAM,The Vympel R-77-1（AA-12 Adder）It is Russia's active radar-guided medium-range air-to-air missile, an improvement on the R-77 with a longer range.

su_aa-12_pd=R-77-PD,,AAM,The Vympel R-77-PD（AA-12 Adder）It is Russia's active radar-guided long-range air-to-air missile, using a ramjet engine, and its range has been greatly increased compared to the previous model.

su_aa-12_m=R-77M,,AAM,The Vympel R-77M（AA-12 Adder）It is Russia's active radar-guided long-range air-to-air missile,This missile employs a more powerful active phased array seeker and a dual-pulse engine, resulting in a significant performance improvement.

su_aa-13=R-37M,,AAM,The Vympel R-37M（AA-13 Axehead）It is Russia's active radar-guided ultra-long-range air-to-air missile with high speed and long range, and is used to perform interception missions.
# ------------------ SAM ------------------

# ---------- Anti-radar Missiles ---------

su_as-17a=KH-31P,,ARM,Tactical Missiles Corporation Kh-31P（AS-17 Krypton）It is a Soviet supersonic anti-radiation missile, similar to the P-270 in many aspects. It looks like a smaller version of the P-270. There are reportedly plans to convert it into a long-range air-to-air missile.

# ---------- Anti-ship Missiles ----------

su_as-17=KH-31A,,ASM,Tactical Missiles Corporation Kh-31A（AS-17 Krypton）It is a Soviet supersonic anti-radiation missile, similar to the P-270 in many aspects. It looks like a smaller version of the P-270. There are reportedly plans to convert it into a long-range air-to-air missile.

su_as-18=Kh-59M,,ASM,Tactical Missiles Corporation Kh-59M (AS-18 Kazoo) It is a Russian subsonic air-to-surface/ship missile. Compared with the Kh-59, the M type has a longer range and a higher speed.

su_as-20=Kh-35,,ASM,Zvezda Kh-35 (AS-20 Kayak) It is a Russian subsonic anti-ship missile. Because its appearance and performance are similar to those of the American Harpoon missile, it is nicknamed "Harpoonski". It is designed to attack ships under 5,000 tons.

#-----------Land Strike only missiles---------

su_as-14=Kh-29T,,AGM,Vympel Kh-29T（AS-14 Kedge）It is a Soviet television-guided supersonic air-to-ground missile with great power that can be used to destroy ships not exceeding 10,000 tons.

su_kab-1500kr=KAB-1500KR,,AGM,Tactical Missiles Corporation KAB-1500KR is a Russian TV-guided bomb, similar to the American GBU-8/15 guided bomb, but the KAB-1500KR has better performance.

su_kh-35=Kh-35,,AGM,Zvezda Kh-35 (AS-20 Kayak) It is a Russian subsonic anti-ship missile. Because its appearance and performance are similar to those of the American Harpoon missile, it is nicknamed "Harpoonski". It is designed to attack ships under 5,000 tons.It can also be used to attack ground targets.

su_kh-38=Kh-38ME,,AGM,Tactical Missiles Corporation Kh-38ME is Russia's tactical missile. The missile is a modular weapon with multiple guidance heads. ME is active radar guided.
