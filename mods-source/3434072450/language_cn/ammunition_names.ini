[AmmunitionNames]
# ------------------ AAM ------------------
su_aa-10a=R-27R,,空对空,信号旗R-27R（AA-10A白杨）是苏联的半主动雷达制导中程空对空导弹，十分创新的使用了倒梯形翼，加强了导弹的机动能力。

su_aa-10b=R-27T,,空对空,信号旗R-27T(AA-10B白杨)是苏联的红外制导中程空对空导弹，由于采用红外导引头，相比R-27R，射程更近。

su_aa-10c=R-27ER,,空对空,信号旗R-27ER（AA-10C白杨）是苏联的半主动雷达制导中程空对空导弹，是R-27R的改进型，对导弹进行了增程处理，提高了导弹的射程。

su_aa-10d=R-27ET,,空对空,信号旗R-27ET(AA-10D白杨)是苏联的红外制导中程空对空导弹，由于采用红外导引头，相比R-27ER，射程更近。

su_aa-11=R-73,,空对空,闪电机械R-73（AA-11射手）是苏联在1970~80年代研发的一种红外空对空导弹，R-73开创性的使用了矢量发动机，让导弹拥有远超同时期导弹的机动性，被认为是最具威胁的空对空导弹之一。

su_aa-12=R-77,,空对空,信号旗R-77（AA-12蝰蛇）是俄罗斯的主动雷达制导中程空对空导弹，研发工作开始于苏联时期，但是直到苏联解体后才被完成，该弹使用了独特的格栅翼气动布局，为导弹带来了优秀的高速性能，但也同时增大了低速的阻力。

su_aa-12_1=R-77-1,,空对空,信号旗R-77-1（AA-12蝰蛇）是俄罗斯的主动雷达制导中程空对空导弹，对R-77进行了改进，拥有更远的射程。

su_aa-12_pd=R-77-PD,,空对空,信号旗R-77-PD（AA-12蝰蛇）是俄罗斯的主动雷达制导远程空对空导弹，采用冲压发动机，射程相比前型增加甚多。

su_aa-12_m=R-77M,,空对空,信号旗R-77M（AA-12蝰蛇）是俄罗斯的主动雷达制导远程空对空导弹，该弹采用了更加强大的有源相控阵导引头与双脉冲发动机，性能方面得到了巨大的提升。

su_aa-13=R-37M,,空对空,信号旗R-37M(AA-13斧头)是俄罗斯的主动雷达制导超远程空对空导弹，速度快，射程远，用于执行拦截任务。
# ------------------ SAM ------------------

# ---------- Anti-radar Missiles ---------

su_as-17a=KH-31P,,反辐射,战术导弹集团Kh-31P（AS-17氪星）是苏联的超音速反辐射导弹，在许多方面与P-270类似，看起来就像是缩小版的P-270，据称有将其改装为远程空对空导弹的计划。

# ---------- Anti-ship Missiles ----------

su_as-17=KH-31A,,反水面,战术导弹集团Kh-31A（AS-17氪星）是苏联的超音速反舰导弹，在许多方面与P-270类似，看起来就像是缩小版的P-270，据称有将其改装为远程空对空导弹的计划。

su_as-18=Kh-59M,,反水面,战术导弹集团Kh-59M (AS-18卡祖笛) 是俄罗斯的亚音速空对地/舰导弹，相比Kh-59，M型增加了射程，并速度有所提高。

su_as-20=Kh-35,,反水面,红星研究所Kh-35 (AS-20皮划艇) 是俄罗斯的亚音速反舰导弹，因外观与性能和美国鱼叉导弹近似，因此被戏称为“鱼叉斯基”，其设计是用于攻击五千吨以下的舰艇。
#-----------Land Strike only missiles---------

su_as-14=Kh-29T,,空对地,信号旗Kh-29T（AS-14锚）是苏联的电视制导超音速空对地导弹，威力巨大，可以用于摧毁不超过10000吨的船只。

su_kab-1500kr=KAB-1500KR,,空对地,战术导弹集团KAB-1500KR是俄罗斯的电视制导炸弹，与美国的GBU-8/15制导炸弹类似，但KAB-1500KR拥有更好的性能。

su_kh-35=Kh-35,,空对地,红星研究所Kh-35 (AS-20皮划艇) 是俄罗斯的亚音速反舰导弹，因外观与性能和美国鱼叉导弹近似，因此被戏称为“鱼叉斯基”，其设计是用于攻击五千吨以下的舰艇。也可用于攻击地面目标。

su_kh-38=Kh-38ME,,空对地,战术导弹集团Kh-38ME是俄罗斯的战术导弹，该导弹属于模块化武器，有多种导引头，ME为主动雷达制导。
