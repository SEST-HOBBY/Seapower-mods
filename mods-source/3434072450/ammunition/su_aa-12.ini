#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# R-77
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
Mass=175                               // in kg. Used for aircraft
AmmoPoints=1220
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // 目视识别范围at what range in nm this unit can be visually identified
IRSignature=VeryTiny   // 红外识别范围
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation     // 预制破片弹
#1 = Armor Piercing            // 穿甲弹
#2 = HEAT                           // 破甲弹
#3 = Illumination                 // 照明弹
#4 = Cluster                        // 集束炸弹
#5 = Runway Cratering        // 跑道破坏弹

[WarheadData]
WarheadType=0
Power=19
ImpactSize=10                       // 影响大小Impact size, can be small, medium, large, verylarge
Penetration=Always                     // 穿深？can be minor, moderate, heavy, always

FuzeProximityDistance=20.0             // 近炸引信for proximity fuze: distance to target in yard
KillProbability=0.85                  // 爆炸概率Chance to intercept missile
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing  //红外
# 2 = Semi-Active Radar Homing  // 半主动雷达寻的
# 3 = Active Radar Homing  // 主动雷达寻的
# 4 = Anti-Radiation Homing  // 反辐射
# 5 = Laser-Homing  // 激光制导
# 6 = TV-Homing  // 电视制导
# 7 = Active Sonar Homing  // 主动声呐
# 8 = Passive Sonar Homing  // 被动声呐
# 9 = Wake Homing  // 尾流自导
[Guidance]
GuidanceType=3
#In reality a SARH correction is used at long range
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
DropDuration=0.5                       // 离架自由落体time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0.8         // 离架直线运动time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=5.0                      // Climb angle for initial loft
MaxLoftAlt=40000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=6.0                // 目标末端距离in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=True                 // 末端断开半主动寻的 if true connection with a guiding radar will be severed upon entering terminal approach stage
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
MaxVelocity=1600                       // Maximum speed in knots
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
AccelerationTime=6                  // 初始助推器燃烧的燃烧时间
Acceleration=13.2                     // 初始燃烧阶段的加速度Gs
SustainerAccelerationTime=-1            // 持续燃烧时间。若无持续燃烧，则记为-1
SustainerAcceleration=-1               // 持续燃烧加速。若无持续燃烧，则值为-1
#---- Total Δv ≈ 779 ≈ 2.29Ma
DragCoefficient=-1               // 阻力系数。0表示无阻力，1表示默认阻力，数值越大表示阻力越大。默认值为-1，此时我们会根据导弹的最大射程来计算阻力系数
TypicalTargetAlt=40000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=600						// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=40000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=600				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
MaxTurnRate=42.0                       // 扭转能力Maximum turnrate in degrees per second
MaxTurnG=50                       // Maximum G-limit of missile turns
MaxFlightTime=60              // 基于电池等因素，导弹完全失效前的运行时间作为硬限制。默认值：无限
#========================================= Launch stats ============================================================
MinLaunchRange=0.6                       // 最小射程Minimum launch range in nautical miles
MaxLaunchRange=40                    // 最大射程Maximum launch range in nautical miles
MinLaunchAltitude=100                  // Minimum launch altitude in feet.
MaxLaunchAltitude=70000                // Maximum launch altitude in feet.
MinAttackAltitude=80                  // 最小目标高度Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=90000                // Maximum altitude of target, in feet
MaxAttackVelocity=1500				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=95                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=35.0                        // 导引头增益Seeker gain in dB
SeekerFOV=60                        
SecondaryPassiveRadarGuidanceType=HomeOnJam  //次要被动雷达寻的
PassiveRadarGuidanceFrequencies=All    // 本导弹能够探测的频率Frequences Anti-Radiation and HomeOnJam weapons can detect
SeekerPassiveRange=8.6        // 导引头被动范围（海里）与红外制导、半主动雷达制导、反辐射制导、电视制导、被动声纳制导和被动声纳制导相关Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=8.6                 // 导引头有效范围（海里）。适用于半主动雷达寻的、主动雷达寻的、激光寻的和主动声纳寻的Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       // 无线电指令波段 Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=14.0                          // 主动雷达功率Active radar seeker output peak power in kW
TargetMemory=True                      // 记忆目标Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.35          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.25                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // 断连后自爆时间delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/r77/
ResourcesRoot=r-77.obj
ResourcesMesh=body
ResourcesMaterial=wp_aa-12_mat.ini
############################################################
Rotation=0,0,45
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_effect
BoosterEffectPosition=0,-0.0015,-0.015

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,-0.0015,-0.02
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,-0.0015,-0.02 
SustainerEffectStartTime=2.0

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07