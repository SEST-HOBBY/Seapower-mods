DefaultDescription=B-52H是波音公司为美国空军研制的远程亚音速战略轰炸机，也是著名的“同温层堡垒”家族中现役的唯一型号。它配备八台普惠TF33-P-3涡轮风扇发动机，最大载弹量约31吨，能够携带常规炸弹、巡航导弹及核武器，经过现代化升级后具备发射AGM-183A高超音速导弹的能力。凭借超过1.6万公里的航程、自1955年首飞以来逾60年的持续服役历史，以及美国空军计划通过发动机换新等方式使其服役至2050年左右的预期，B-52H已成为战略轰炸机中长寿与可靠性的代表。

