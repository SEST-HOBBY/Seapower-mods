DefaultDescription=The B-52H is a long‑range subsonic strategic bomber developed by Boeing for the U.S. Air Force. It is the only remaining active model of the famous “Stratofortress” family. Powered by eight Pratt & Whitney TF33‑P‑3 turbofan engines, it has a maximum payload of approximately 31 tons and can carry conventional bombs, cruise missiles, and nuclear weapons. Following modernization upgrades, it is also capable of launching AGM‑183A hypersonic missiles. With a range exceeding 16,000 kilometers, over 60 years of continuous service since its first flight in 1955, and the U.S. Air Force’s plan to keep it in service until around 2050 through engine replacement and other enhancements, the B‑52H has become a symbol of longevity and reliability among strategic bombers.  

