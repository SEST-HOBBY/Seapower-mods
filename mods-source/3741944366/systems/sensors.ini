[GPS_Link]
Kind=Radar
Type=Targeting    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface              // Role can be "Surface", "Air", "AirAndSurface"
Mode=RadioCommand       // Can be "Illuminate", "RadioCommand"
CanDetectLandTargets=True  // True means the radar can see ground objects
TargetChannels=100       // if applicable number of targets it can track simultaneously
WeaponChannels=100       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-180,180|-180,180     // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=1     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0           // min range in km
MaxRange=400.0           // max range in km
MinAltitude=9          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=9.1     // max altitude in meters, relevant for air, unused for surface
RangeResolution=1.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.5         // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=0              // gain in dB on the sensor
Frequency=UHF       // frequency band
PeakPower=0           // output peak power in kW