[usn_fury_escort]
Type=Anduril FQ-44
Default=Anduril FQ-44 Escort,FQ-44 E
DefaultDescription=The Fury began as Blue Force Technologies' design for an aggressor drone. Anduril bought the company in 2023 and developed the aircraft for the US Air Force's Collaborative Combat Aircraft program, where it was chosen for Increment 1 as the YFQ-44A alongside General Atomics' YFQ-42A. It first flew, semi-autonomously, on October 31, 2025. These US Navy versions imagine the Fury as a carrier wingman for crewed fighters, with catapult launch, an arresting hook and a data link that shares contacts with the flight.\nThe escort version carries four AIM-120D AMRAAMs, or two AIM-9X Block II Sidewinders with two AIM-120Ds.
Callsigns=Default,Fury

