#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# P-500 Basalt
# Users: wp_takr_kiev, wp_rkr_slava
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

CIWSDefenceBonus=5                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

SaturationValue=2
DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6            // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=240                 // In db
[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=158
ImpactSize=Large            // Impact size, can be small, medium, large, verylarge
Penetration=Always               // can be minor, moderate, heavy, always

[OnBoardSystems]
ECM=SS-N-12_ECM

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1           // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight = False
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=40.0                      // Climb angle for initial loft
MaxLoftAlt=44300.0                     // in feet. Maximum altitude for lofting
MaxLoftVelocity=1615.0                 // Maximum speed in knots for lofting
LoftToSkim=False
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=16400.0                 // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=40.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=1                    // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=260.0     // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=160.0              // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=25.0
FinalFlightPhaseDistToTarget=30.0      // in N. miles. Recommended to set this distance equal to the seeker range
SearchForTargetsTime=20                // in seconds. Missile will wait this time after finding before going to terminal if it 
MaxSearchTime=60                       // in seconds. Missile will wait this time after enabling seeker before going to terminal if it 
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=15.0               // in N. miles. Recommended to set this distance slightly less than the seeker range
#TerminalVelocity=5.0                   // Maximum speed in knots when missile is locked on target
TerminalDiveDistance=3                  // in N. miles.
#============================================= Misc ================================================================
GroupSize=8                            //Indicates that missiles can join into groups
GroupJoinRange=20                      //in miles
GroupSpacing=0.1                       // in miles. interval between misseles in line
GroupLeaderAlt=2000                   // TBD in feet. altitude of leading missile. Only for FinalFlightPhase
GroupWingmanAlt=160.0                   // TBD in feet. altitude of non-leading missile. FinalFlightPhase
#RequiresTargetToProceed=True           //Will not change its flight phase unles have a target selected by operator
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=1300                       // Maximum speed in knots
Acceleration=6.0                       // Acceleration factor
MaxTurnRate=8.0                        // Maximum turnrate in degrees per second
MinLaunchRange=30                      // Minimum launch range in nautical miles
MaxLaunchRange=297.0                   // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=38.0                        // Seeker gain in dB
SeekerFOV=70                           // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerActiveRange=20                   // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=0                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=38                           // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.3           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.1                    // This value substracted from probability of being jammed  (0...1)

#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/wp_ss-n-12/
ResourcesRoot=wp_ss-n-12
ResourcesMesh=wp_ss-n-12
ResourcesMaterial=wp_ss-n-12_mat
ResourcesMeshForLaunch=wp_ss-n-12_dummy
ResourcesMeshCanister=wp_ss-n-12_dummy
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/wp_ss-n-12_booster
BoosterEffectPosition=0,0,0

InFlightEffect=effects/weapons/emitters/turbojet_sustainer
InFlightEffectPosition=0,0,-0.072
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
#creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,-0.0051,0
Rotation=0,0,0
Scale=0.01,0.01703,0.16