[AN/APQ-164]
#Users: b1b
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface              // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
CanDetectLandTargets=True  // True means the radar can see ground objects
TargetChannels=0       // if applicable number of targets it can track simultaneously
WeaponChannels=0       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-60,60|-60,30      // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=0.8     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=1           // min range in km
MaxRange=270           // max range in km
MinAltitude=60          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=24000     // max altitude in meters, relevant for air, unused for surface
RangeResolution=15.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.5         // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=45.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=60          // output peak power in kW

[AN/ALQ-161(RWR)] 
Kind=ESM
Type=RWR
Gain=5                              // gain of sensor in dB
HasDataLink=True                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=25.0              // in degrees
Frequencies=All           // Frequencies that current ESM system can detect

[AN/ALQ-161(ECM)]
Kind=ECM
Frequencies=L-Band,S-Band,C-Band,X-Band
#VHF-Band,UHF-Band,L-Band,S-Band,C-Band,X-Band,Ku-Band,K-Band,Ka-Band  //radar frequency bands the ECM suite can jam
Type=Defensive      // Can be Defensive, Offensive, Universal
JamChance=0.35       // For Defensive and Universal jammers. Base chance to jam the attacking weapon

[GPS_Link]
Kind=Radar
Type=Targeting    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface              // Role can be "Surface", "Air", "AirAndSurface"
Mode=RadioCommand       // Can be "Illuminate", "RadioCommand"
CanDetectLandTargets=True  // True means the radar can see ground objects
TargetChannels=100       // if applicable number of targets it can track simultaneously
WeaponChannels=100       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-180,180|-180,180     // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=1     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0           // min range in km
MaxRange=400.0           // max range in km
MinAltitude=9          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=9.1     // max altitude in meters, relevant for air, unused for surface
RangeResolution=1.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.5         // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=0              // gain in dB on the sensor
Frequency=UHF       // frequency band
PeakPower=0           // output peak power in kW

[AN/AAQ-33(L)] # laser targeting pod
Kind=LaserDesignator
MaxRange=60                           // max distance in nm
NightCapable=True                 // is the designator can be used in low-visibility conditions
TargetChannels=1                    // number of targets that can be tracked at once
WeaponChannels=1000          // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                       // Field of View of the designator

[AN/AAQ-33(V)] # FLIR detector pod
Kind=Visual
#Infrared
NightCapable=True                   // is the designator can be used in low-visibility conditions
VIDRangeMultiplier=6.0        // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=6.8          // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.8          // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1