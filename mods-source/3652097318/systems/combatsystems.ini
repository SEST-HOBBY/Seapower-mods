# AN/ASQ-184 Offensive/Defensive Avionics System - B-1B
# Level radar bombing off the AN/APQ-164; the airframe never tosses, so the
# orbit is a level run and the aim error does not grow with release altitude.
[ASQ-184]
TossBombing=True
AimErrorFixedWithAltitude=True
PreferLevelBombing=True
MovingTargetPenalty=0.35
BombingAccuracy=1.2
BombingWeatherPenalty=0.1
