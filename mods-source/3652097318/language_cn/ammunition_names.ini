[AmmunitionNames]
dts_gbu-31=GBU-31,JDAM,制导炸弹,GBU-31是美国的2000磅GPS制导炸弹

dts_gbu-53=GBU-53/B,SDB II,制导炸弹,GBU-53/B “风暴破坏者” 是美军第二代小直径精确制导滑翔炸弹，由雷神公司研制。采用折叠弹翼设计，最大射程达 110 公里。核心优势是三模制导系统（毫米波雷达、红外成像、半主动激光）与双向数据链，可全天候对抗复杂电磁干扰，精准打击固定及移动目标（坦克、舰艇等）。

dts_agm-154a=AGM-154A,JSOW,对地攻击,Land Attack,AGM-154是GPS/惯性导航制导的空对地滑翔炸弹，于1999年服役，并在多场战争中投入使用。其射程在低空为28公里，高空为74公里，携带145枚BLU-97/B子弹药，可打击装甲车辆和防空阵地等面目标

dts_agm-158b-2=AGM-158B-2,JASSM-ER,对地攻击,由洛克希德·马丁公司研制的AGM-158B-2增程型联合空对地防区外导弹是一种隐身远程巡航导弹，采用涡轮风扇发动机，射程超过1900公里。它配备惯性导航+GPS+红外成像末制导系统和454公斤弹头，具备升级后的GPS接收机和抗干扰软件，能够对高价值目标实施防区外打击，并与多种战斗机兼容
dts_agm-158c-3=AGM-158C-3,LRASM-ER,反水面,AGM-158C-3 是洛克希德·马丁公司为美海空军研发的 AGM-158C 远程反舰导弹（LRASM）最新改进型，拥有更远射程、更强协同攻击与隐身突防能力。可从 B-1B、F/A-18E/F、F-15EX 等平台发射。

dts_agm-183a=AGM-183A,ARRW,弹道导弹,AGM-183A（ARRW，空射快速响应武器）是美国洛克希德・马丁公司为空军研制的助推滑翔式高超音速导弹，全长约 5.89 米，重 2.27 吨，最大速度达 10 马赫，射程超 926 千米。它采用惯性 + GPS 复合制导，配备 68 千克高爆钨制破片战斗部
dts_agm-183a(w62)=AGM-183A(W62),ARRW,弹道导弹,AGM-183A（ARRW，空射快速响应武器）是美国洛克希德・马丁公司为空军研制的助推滑翔式高超音速导弹，这个版本搭载了一枚W62核弹头。请注意：不当使用可能会导致世界末日！



