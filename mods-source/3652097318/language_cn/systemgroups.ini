[SystemNames]
AN/APQ-164=AN/APQ-164|AN/APQ-164 是诺斯罗普・格鲁曼为 B-1B 研制的多模式无源相控阵攻击雷达，具备单脉冲地图测绘、地形跟随 / 规避、精确武器瞄准等 11 种模式，以低可探测天线增强突防能力，是 B-1B 攻击航电核心.

AN/ALQ-161(RWR)=AN/ALQ-161(RWR)|AN/ALQ-161 是 B-1B 专属集成射频电子战系统，由 L3Harris 等研发，1980 年代列装，提供 360 度威胁接收与干扰，可自动排序威胁并联动 ALE-49 箔条 / 红外诱饵对抗，具备尾部导弹预警，经多轮升级持续适配新威胁，是 B-1B 远程突防的关键防御屏障。

