[AmmunitionNames]
dts_gbu-31=GBU-31,JDAM,Guided Bomb,The GBU-31 is an American 2000lb GPS-guided Bomb.

dts_gbu-53=GBU-53/B,SDB II,Guided Bomb,The GBU-53/B StormBreaker, developed by Raytheon, is the U.S. military’s second-generation small-diameter precision-guided glide bomb. It features foldable wings and a maximum range of 110km. Its core strength lies in the tri-mode seeker (millimeter-wave radar, infrared imaging, semi-active laser) and encrypted two-way data link, enabling all-weather, anti-jamming strikes against stationary and moving targets (tanks, ships, etc.)

dts_agm-154a=AGM-154A,JSOW,Guided Bomb,Land Attack,The AGM-154 is GPS/INS-guided air-to-ground glide bomb, entered service in 1999 and saw action in multiple wars.It has a range of 28km (low altitude) and 74km (high altitude), carrying 145 BLU-97/B submunitions to strike area targets like armored vehicles and air defense positions

dts_agm-158b-2=AGM-158B-2,JASSM-ER,AGM,Developed by Lockheed Martin, The AGM-158B-2 JASSW-ER is a stealthy extended-range cruise missile powered by a turbofan engine with a range exceeding 1,900km. Equipped with inertial navigation+GPS+infrared imaging terminal guidance and a 454kg warhead, it features an upgraded GPS receiver and anti-jamming software, enabling standoff strikes against high-value targets and compatible with multiple fighters.
dts_agm-158c-3=AGM-158C-3,LRASM-ER,ASM,The AGM-158C-3 is the latest variant of Lockheed Martin’s AGM-158C Long Range Anti-Ship Missile (LRASM), developed for the U.S. Air Force and Navy. It features extended range, enhanced cooperative engagement capabilities, and improved stealth penetration. it can be launched from platforms including the B-1B, F/A-18E/F, and F-15EX.

dts_agm-183a=AGM-183A,ARRW,AGM,Developed by Lockheed Martin, The AGM-183A (ARRW, Air-launched Rapid Response Weapon) is a hypersonic boost-glide missile developed by Lockheed Martin for the U.S. Air Force. Measuring approximately 5.89 meters long and weighing 2.27 tons, it reaches a top speed of Mach 10 with a range exceeding 926 km. Equipped with an inertial + GPS combined guidance system and a 68-kg high-explosive tungsten fragmentation warhead
dts_agm-183a(w62)=AGM-183A(W62),ARRW,AGM,Developed by Lockheed Martin, The AGM-183A (ARRW, Air-launched Rapid Response Weapon) is a hypersonic boost-glide missile developed for the U.S. Air Force.This type has a W62 170kT nuclear warhead.Be mind that this weapon could lead to the end of world.