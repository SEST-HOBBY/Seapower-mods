AN/APQ-164=AN/APQ-164|The AN/APQ-164 is a multi-mode passive phased array attack radar developed by Northrop Grumman for the B-1B.It features 11 modes including monopulse ground mapping, terrain following/avoidance, and precision weapon targeting. 

