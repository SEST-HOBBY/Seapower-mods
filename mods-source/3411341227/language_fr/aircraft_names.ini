Description=Candidat au titre d'avion le plus bruyant au monde, le Tu-95 est un gros bombardier stratégique et une plate-forme de missiles équipé de turbopropulseurs contrarotatifs caractéristiques. Cet avion pourrait être considéré comme l'équivalent soviétique du B-52, remplissant un rôle similaire de bombardier stratégique. Cette version est une reconstruction du Bear B/C des années 1960, armé de missiles de croisière Kh-22 Storm (nom de code OTAN AS-4 Kitchen) et équipé du radar d'attaque PNA-B Rubin Down Beat développé pour le Tu-22M Backfire.

