Description=Die Tu-95, ein Kandidat für das lauteste Flugzeug der Welt, ist ein großer strategischer Bomber und eine Raketenplattform mit Turboprop-Antrieb und charakteristischen gegenläufigen Turboprop-Triebwerken. Das Flugzeug könnte als sowjetisches Pendant zur B-52 angesehen werden, da es eine ähnliche strategische Bomberrolle erfüllt. Diese Version ist eine Neuauflage der Bear B/C aus den 1960er Jahren, bewaffnet mit Kh-22 Storm-Marschflugkörpern (NATO-Bezeichnung AS-4 Kitchen) und ausgestattet mit dem für die Tu-22M Backfire entwickelten PNA-B Rubin Down Beat-Angriffsradar.

