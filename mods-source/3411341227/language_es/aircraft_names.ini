Description=El Tu-95, candidato a ser el avión más ruidoso del mundo, es un gran bombardero estratégico propulsado por turbopropulsores y una plataforma de misiles con distintivos turbopropulsores contrarrotatorios. El avión podría considerarse el equivalente soviético del B-52, ya que cumple una función similar como bombardero estratégico. Esta versión es una reconstrucción del Bear B/C de la década de 1960, armado con misiles de crucero Kh-22 Storm (nombre de la OTAN: AS-4 Kitchen) y equipado con el radar de ataque PNA-B Rubin Down Beat desarrollado para el Tu-22M Backfire.

