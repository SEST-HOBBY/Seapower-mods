Description=A candidate for the world's loudest aircraft the Tu-95 is a large turboprop-powered strategic bomber and missile platform with distinctive contra-rotating turboprops. The aircraft could be considered the Soviet equivalent of the B-52, fulfilling a similar strategic bomber role. This version is a rebuild of the 1960s Bear B/C, armed with Kh-22 Storm (NATO reporting name AS-4 Kitchen) cruise missiles and fitted with the PNA-B Rubin Down Beat attack radar developed for the Tu-22M Backfire.
