# A partir de es_ffg_baleares.ini vanilla
# ver. 20260818
#
[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.15

Length=88.8                  			// In meters
Beam=10.4                     			// In meters

CompartmentsHeight=0.04       			// Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1479              			// In tons

MaxForwardVelocity=26.2        			// Sets the max forward velocity
MaxBackwardVelocity=7.0        			// Sets the max backward velocity
LinearDrag=0.96                 		// This is for velocity damping (linear drag)
MaxAccelerationFactor=0.97
MinAccelerationFactor=0.1

#These values yield a turning circle of 300m for Knox class as per sources
RudderTurnRate=2.5             			// Turn rate of the rudder in degrees per second
RudderForce=0.7                			// Multiplicator defining how agile the ship can turn

TiltFactor=1.4                 			// Defines how strong the tilting will be
PitchFactor=-1.0                		// Defines how strong the pitch will be based on speed and acceleration

TrimDepth=0                 			// Default trim depth in feets
TrimAngle=0.0                  			// Default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           			// Distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.01,0          			// Center of mass for physics

CavitationSpeed=4						// Defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.55                  			// Density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            			// Drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             			// Drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=10.0  		// Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium
# Sonar related
BaseNoise=145                   		// Base sound level in db at 1m distance
FlowNoise=1                     		// Additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               		// Additional noise for cavitation in db
BladesCount=4					 		// Number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 		// In dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             		// In Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

# [Animations] #TODO
# NumberOfAnimationReferences=2
# AnimationFile_1=animations_usn_ff_knox
# AnimationFile_2=animations_rails-launcher

[---------- AI related ----------]
[AI]
UnitCostValue=1500            			// Value for the unit cost for least valuable target checks
UnitScoreValue=2              			// Value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=2
ASuW_Capability=3
ASW_Capability=5

#Defence
MissilesToSaturate=2      				// AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     				// AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD      				// Anti-Missile Defence
ATD_Capability=TBD      				// Anti-Torpedo Defence

#Special
Role=ASW,ASuW_Gun

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
IsCoveredByMainArmor=True
Collider=coll_cic
ModuleType=CIC

[MainPowerSystem]
############################################################
# Main Power System (engine room, boiler, reactor)
############################################################
Type=Diesel
HorsePower=16000
ArmorType=Minor
IsCoveredByMainArmor=True
Collider=coll_engineroom

[PropulsionSystems]
