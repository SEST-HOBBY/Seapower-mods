[General]
UnitType=Submarine
DefaultCameraDistance=1.6
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.35
CameraPivotHeight=0.1

Length=95								// In meters
Beam=8.3								// In meters

ArmorType=None							// Possible values: Heavy, Moderate, Minor, None
MaxGuidanceWires=2

FrontalArea=49.9						// TODO
SideArea=625							// TODO
BottomArea=474							// TODO

[OpticalView]
Views=standard_periscope
DefaultView=standard_periscope

[Physics]
Displacement=2415						// In tons

MaxForwardVelocity=10					// Max submerged forward velocity in knots
MaxForwardVelocitySurfaced=18
MaxBackwardVelocity=3					// Max submerged backward velocity in knots
MaxBackwardVelocitySurfaced=3
TelegraphVelocities=-3,0,2,4,6,8,10		// Overrides default telegraph values

BowUnderWater=10.0						// Depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=31.0						// Depth in feet, from where the sail is under water
LinearDrag=0.96							// This is for velocity damping (linear drag)
MaxAccelerationFactor=0.45
MinAccelerationFactor=0.1

RudderTurnRate=3.5						// Turn rate of the rudder in degrees per second
DepthRudderTurnRate=4					// Turn rate of the depth rudders in degrees per second
RudderForce=0.5							// Multiplicator defining how agile the ship can turn

MaxPitchAngle=15.0
PitchChangeRate=1.5
MaxRollAngle=20.0
RollChangeRate=4.0

BallastTankChangeRate=0.00025			// Just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0			// In feet per second using ballast tanks only (no propulsion)

TrimDepth=0								// Default trim depth in feet
TrimAngle=0								// Default base trim angle (x-axis, so pitch)
CenterToKeelDist=0						// Distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=50.0						// In feet
CrushDepth=750							// In feet
CavitationParameters=8					// Defines the speed in knots at 100m depth that the submarine will cavitate at

[Buoyancy]
Density=0.5								// Density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0						// Drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0						// Drag for the water physics in case the vessel is below the water line

[SensorData]
# Visual
VisualIdentificationRange=5.0			// Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=145							// Base sound level in db at 1m distance
FlowNoise=1.5							// Additional flow noise per knot in db (20kn would be +27db)
CavitationNoise=12						// Additional noise for cavitation in db
TargetReflectionStrength=16				// In dB for broad side
BladesCount=5							// Number of blades on vessel's propulsion systems
ElectricFrequency=60					// In Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
DistinctiveNoise=False					// If True, this vessel can be identified easier than usually by passive sonars

MachineryRaftingGeneration=1
PropellerType=Conventional

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_ae_ss_s30

[AI]
UnitCostValue=2000
UnitScoreValue=2

# Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

# Offence
AAW_Capability=0
ASuW_Capability=1
ASW_Capability=2

# Defence
# Special
Role=SS

# Control System
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

# Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=4610
AdditionalNoise=25						// Added to current noise level when running on this power
Collider=coll_engineroom

[AuxPowerSystem]
Type=Electric
HorsePower=2740
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
Capacity=22000
DischargeRate=1.8						// Rate of discharging batteries. Lower values provide more range on low underwater speed on batteries
RechargeRate=0.5						// Capacity per second when charging batteries. When a unit goes at Standard telegraph setting or slower, the charge rate doubles
Collider=coll_battery_1,coll_battery_2

