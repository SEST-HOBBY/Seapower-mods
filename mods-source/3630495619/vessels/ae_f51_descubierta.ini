# Corbeta clase Descubierta (1954) proyecto original
# ver. 20261120
#

[General]
UnitType=Vessel
DefaultCameraDistance=2.5
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.12

Length=75.5								// In meters
Beam=10.2								// In meters

CompartmentsHeight=0.04					// Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1101						// In tons

MaxForwardVelocity=18					// Sets the max forward velocity
MaxBackwardVelocity=5.0					// Sets the max backward velocity
LinearDrag=0.96							// This is for velocity damping (linear drag)
MaxAccelerationFactor=0.92
MinAccelerationFactor=0.1

#These values yield a turning circle of 300m for Knox class as per sources
RudderTurnRate=4.0						// Turn rate of the rudder in degrees per second
RudderForce=0.9							// Multiplicator defining how agile the ship can turn

TiltFactor=0.9							// Defines how strong the tilting will be
PitchFactor=-1.0						// Defines how strong the pitch will be based on speed and acceleration

TrimDepth=-1.5							// Default trim depth in feets
TrimAngle=0.0							// Default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0					// Distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.01,0					// Center of mass for physics

CavitationSpeed=4						// Defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.55							// Density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0						// Drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0						// Drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=4.5			// Biggest range in nm at which this unit can be visually identified
IRSignature=Low
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=130							// Base sound level in db at 1m distance
FlowNoise=1								// Additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5						// Additional noise for cavitation in db
BladesCount=4					 		// Number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 		// In dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50					// In Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[---------- AI related ----------]
[AI]
UnitCostValue=300						// Value for the unit cost for least valuable target checks
UnitScoreValue=1						// Value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=2
ASuW_Capability=3
ASW_Capability=2

#Defence
MissilesToSaturate=1					// AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1					// AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=1						// Anti-Missile Defence
ATD_Capability=0						// Anti-Torpedo Defence

#Special
Role=ASW,ASuW_Gun

[ControlSystem]
IsCoveredByMainArmor=True
Collider=coll_cic
ModuleType=CIC

[MainPowerSystem]
Type=Diesel
HorsePower=3200
ArmorType=Minor
