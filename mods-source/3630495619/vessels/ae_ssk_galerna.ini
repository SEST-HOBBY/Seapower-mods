[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.1

Length=67.6								// In meters
Beam=6.8								// In meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[OpticalView]
Views=standard_periscope
DefaultView=standard_periscope

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1790						// In tons
HorsePower=4600

MaxForwardVelocity=20					// Max submerged forward velocity in knots
MaxForwardVelocitySurfaced=12.0
MaxBackwardVelocity=5.0					// Max submerged backward velocity in knots
MaxBackwardVelocitySurfaced=3

TelegraphVelocities=-5,0,3,5,13,17.5,20 // Overrides default telegraph values

BowUnderWater=10						// Depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=25						// Depth in feet, from where the sail is under water

LinearDrag=0.96							// This is for velocity damping (linear drag)
MaxAccelerationFactor=0.69
MinAccelerationFactor=0.1

RudderTurnRate=5.0						// Turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0					// Turn rate of the depth rudders in degrees per second
RudderForce=0.6							// Multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=20.0
RollChangeRate=4.0

BallastTankChangeRate=0.00025			// Just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0			// In feet per second using ballast tanks only (no propulsion)

TrimDepth=0								// Default trim depth in feet
TrimAngle=0.0							// Default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.070					// Distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=32						// In feet
CrushDepth=1225.0						// In feet
CavitationParameters=12					// Defines the speed in knots at 100m depth that the submarine will cavitate at

[Buoyancy]
Density=0.4								// Density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0						// Drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0						// Drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0			// Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=127							// Base sound level in db at 1m distance
FlowNoise=1.4							// Additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10						// Additional noise for cavitation in db
TargetReflectionStrength=15				// In dB for broad side
BladesCount=5							// Number of blades on vessel's propulsion systems
ElectricFrequency=50					// In Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
DistinctiveNoise=False					// If True, this vessel can be identified easier than usually by passive sonars
TonalRPMModifier=90

MachineryRaftingGeneration=2
PropellerType=Conventional				// Conventional, Skewback, Tandem

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_ae_ssk_galerna

[---------- AI related ----------]
