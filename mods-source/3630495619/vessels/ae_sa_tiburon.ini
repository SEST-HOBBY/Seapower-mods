[General]
UnitType=Submarine
DefaultCameraDistance=0.7
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.0

Length=19.8								// In meters
Beam=2.4								// In meters

ArmorType=Minor							// Hull armor: None, Minor, Moderate, Heavy

[OpticalView]
Views=standard_periscope
DefaultView=standard_periscope

[---------- Physics and Control ----------]
[Physics]

Displacement=79.30						// In tons - Sumergido

MaxForwardVelocity=14.5					// Sets the max forward velocity
MaxForwardVelocitySurfaced=10.2
MaxBackwardVelocitySurfaced=4.0
MaxBackwardVelocity=6.0					// Sets the max backward velocity
TelegraphVelocities=-6,0,3,5,8,10,14.5

BowUnderWater=3							// Depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=9						// Depth in feet, from where the sail is under water
LinearDrag=0.96							// This is for velocity damping (linear drag)
MaxAccelerationFactor=1.40
MinAccelerationFactor=0.2

RudderTurnRate=5.0						// Turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0					// Turn rate of the depth rudders in degrees per second
RudderForce=0.8							// Multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=15.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025			// Just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0			// In feet per second using ballast tanks only (no propulsion)

TrimDepth=1								// Default trim depth in feet
TrimAngle=0.5							// Default base trim angle (x-axis, so pitch)
CenterToKeelDist=0						// -0.022105 - Distance from the center of the mesh to the keel in Unity units
# CenterOfMass=0,0,0.001				// Center of mass for physics

PeriscopeDepth=15						// In feet
CrushDepth=300							// In feet

CavitationParameters=10					// Defines the speed in knots at 100m depth that the submarine will cavitate at

[Buoyancy]
Density=0.4								// Density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25						// Drag for the water physics in case the vessel is above the water line
SubmergedDrag=25						// Drag for the water physics in case the vessel is below the water line

[SensorData]
VisualIdentificationRange=2.5			// Biggest range in nm at which this unit can be visually identified
IRSignature=Small
RCS=Small
BaseNoise=115							// Base sound level in db at 1m distance
FlowNoise=0.8							// Additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=20						// Additional noise for cavitation in db
TargetReflectionStrength=6				// In dB for broad side
BladesCount=3							// Number of blades on vessel's propulsion systems
ElectricFrequency=60					// In Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

MachineryRaftingGeneration=0
PropellerType=Conventional				// Conventional, Skewback, Tandem

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_ae_sa_tiburon

[---------- AI related ----------]
[AI]
