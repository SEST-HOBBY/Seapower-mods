Time1=0 
RotationY1=-100.0
Smoothness1=EaseInOut
Time2=3                
RotationY2=0.0
Smoothness2=EaseInOut

[BowTubeOpenSequenceR]
NumberOfSteps=2
Time1=0 
RotationY1=0.0
Smoothness1=EaseInOut
Time2=3                
RotationY2=100.0
Smoothness2=EaseInOut

[BowTubeCloseSequenceR]
NumberOfSteps=2
Time1=0 
