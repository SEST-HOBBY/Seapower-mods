[BowTubeOpenSequenceL]
NumberOfSteps=2
Time1=0 
RotationY1=0.0
Smoothness1=EaseInOut
Time2=3                
RotationY2=-100.0
Smoothness2=EaseInOut

[BowTubeCloseSequenceL]
