#animations for 20mm gun sponsons foldable screens both sides of main superstructure, each sponson have 3 foldable screens which must be downed previous to gun operation.
# ver. 20260413
#
[Animations]
NumberOfAnimations=4
Animation1=HatchOpenAnim_1
Animation2=HatchOpenAnim_2
Animation3=HatchCloseAnim_1
Animation4=HatchCloseAnim_2

[HatchOpenAnim_1]
NumberOfSequencesToPlay=3
Sequence1=HatchOpenAnimSequence_F1
Sequence1_Model=abatible_r_f
Sequence2=HatchOpenAnimSequence_M1
Sequence2_Model=abatible_r_m
Sequence3=HatchOpenAnimSequence_R1
Sequence3_Model=abatible_r_r

[HatchOpenAnim_2]
NumberOfSequencesToPlay=3
Sequence1=HatchOpenAnimSequence_F2
Sequence1_Model=abatible_l_f
Sequence2=HatchOpenAnimSequence_M2
Sequence2_Model=abatible_l_m
Sequence3=HatchOpenAnimSequence_R2
Sequence3_Model=abatible_l_r

[HatchCloseAnim_1]
NumberOfSequencesToPlay=3
Sequence1=HatchCloseAnimSequence_F1
Sequence1_Model=abatible_r_f
Sequence2=HatchCloseAnimSequence_M1
Sequence2_Model=abatible_r_m
Sequence3=HatchCloseAnimSequence_R1
Sequence3_Model=abatible_r_r

[HatchCloseAnim_2]
NumberOfSequencesToPlay=3
Sequence1=HatchCloseAnimSequence_F2
Sequence1_Model=abatible_l_f
Sequence2=HatchCloseAnimSequence_M2
Sequence2_Model=abatible_l_m
Sequence3=HatchCloseAnimSequence_R2
Sequence3_Model=abatible_l_r

// possible values for rotations are either a complete vector (x,y,z)
// or single axis like RotationX1, RotationY1, RotationZ1
// same is true for positions
// both rotation and position values are optional, so if you leave the position away,
// only the rotation will be applied

[HatchOpenAnimSequence_F1]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationZ1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=3                // time in seconds - here for the end
RotationZ2=-170
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

