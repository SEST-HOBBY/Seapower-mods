[SystemNames]
Binoculars_Optics=Binoculars|Prismáticos avanzados. Ofrecen un mayor alcance visual que los modelos ópticos convencionales.

#---------------------------------------- Aviones ----------------------------------------

#---- Aire/Aire y Superficie ----
NASARR_F-15A=NASARR F-15A|El NASARR es un radar de búsqueda y seguimiento fabricado en Estados Unidos a mediados de la década de 1960. Posee una capacidad de mapeo terrestre notablemente avanzada para su época, lo que lo hace especialmente útil para misiones de ataque a tierra. Por esta razón, se incluye en la variante de cazabombardero F-104G de la familia F-104 Starfighter.
Searchwater=Searchwater|El radar Searchwater, en su variante LAST (Low Altitude Surveillance Task), fue integrado en tres helicópteros Sikorsky SH-3D Sea King de la Armada Española (apodados cariñosamente como "Paqueteras") a partir de 1987. Esta decisión fue una lección directa de la Guerra de las Malvinas, donde la falta de alerta temprana causó graves bajas a la Royal Navy.

#---- ECM ----
Guffo_Mk2000_ECM=Guffo Mk.2000 ECM|El sistema de guerra electrónica Mk 2000 «Guffo», «búho» en italiano, se instaló en 1980 en cuatro helicópteros de la 3.ª Escuadrilla como consecuencia de la necesidad de la Armada de disponer de un equipo moderno, versátil y helitransportado que fuera capaz de detectar, identificar y perturbar un amplio espectro de emisiones electromagnéticas.
Beta_Mk1000_ECM=Beta Mk1000 ECM|En la década de 1980, para equipar a las corbetas de la clase Descubierta y modernizar los sistemas de las fragatas de la clase Baleares (que originalmente estaban equipadas con el obsoleto AN/WLR1C), la Armada optó por el equipo ESM/ECM ofrecido por la firma italiana Elettronica SPA. El sistema elegido para estos buques fue el Beta MK 1000, que incluía componentes tanto de ESM (medidas de apoyo electrónico) como de ECM (contramedidas electrónicas).
Ceselsa_CANOPUS_ECM=CANOPUS ECM|Este programa se implementó en el subsistema ECM de DENEB, el cual estaba vinculado al programa de lanzamiento de señuelos KOCHAB. El objetivo era integrar el sistema de lanzamiento de señuelos con el sistema de guerra electrónica, utilizando los lanzadores de señuelos estadounidenses Mk36 SRBOC, ampliamente extendidos. Dado que utilizaban prácticamente el mismo equipamiento que el instalado en las fragatas de la clase Baleares, los equipos de los buques de la clase Descubierta se modernizaron de manera similar bajo los programas DENEB, CANOPUS y ELNATH.
Ceselsa_NETTUNEL_ECM=NETTUNEL ECM|NETTUNEL es un sistema integrado de Guerra Electrónica naval (ESM/ECM) desarrollado por CESELSA y Elettronica. Diseñado para detectar, clasificar y perturbar amenazas de radar y misiles, equipó a buques de la Armada Española como el portaaviones Príncipe de Asturias y las fragatas de la clase F-80.
ELT_Nettuno_Mk3000_ECM=Mk3000 ECM|Mk3000 ECM|Desarrollado por Elettronica, el Nettuno Mk 3000 es un sistema ECM naval de alto rendimiento diseñado para la perturbación y el engaño electrónico contra modernos misiles antibuque guiados por radar y radares de control de tiro. Está instalado en las fragatas españolas más recientes de la clase F-80 (como la Canarias F-86) y la clase Santa María.

#---- ESM ----
Guffo_Mk2000_ESM=Guffo Mk.2000 ESM|El sistema de guerra electrónica Mk 2000 «Guffo», «búho» en italiano, se instaló en 1980 en cuatro helicópteros de la 3.ª Escuadrilla como consecuencia de la necesidad de la Armada de disponer de un equipo moderno, versátil y helitransportado que fuera capaz de detectar, identificar y perturbar un amplio espectro de emisiones electromagnéticas.
Beta_Mk1000_ESM=Beta Mk1000 ESM|En la década de 1980, para equipar a las corbetas de la clase Descubierta y modernizar los sistemas de las fragatas de la clase Baleares (que originalmente estaban equipadas con el obsoleto AN/WLR1C), la Armada optó por el equipo ESM/ECM ofrecido por la firma italiana Elettronica SPA. El sistema elegido para estos buques fue el Beta MK 1000, que incluía componentes tanto de ESM (medidas de apoyo electrónico) como de ECM (contramedidas electrónicas).
Ceselsa_DENEB_ESM=DENEB ESM|A mediados de la década de 1980 se puso en marcha el primer programa naval de guerra electrónica de España, conocido como Deneb. Aunque conservaba los sistemas analógicos básicos originales del Beta, el programa buscaba automatizar el sistema introduciendo tecnologías informáticas en el procesamiento de señales para lograr la identificación automática mediante la correlación con bases de datos.
Ceselsa_NETTUNEL_ESM=NETTUNEL ESM|NETTUNEL es un sistema integrado de Guerra Electrónica naval (ESM/ECM) desarrollado por CESELSA y Elettronica. Diseñado para detectar, clasificar y perturbar amenazas de radar y misiles, equipó a buques de la Armada Española como el portaaviones Príncipe de Asturias y las fragatas de la clase F-80.
ELT_Nettuno_Mk3000_ESM=Mk3000 ESM|Mk3000 ESM|Desarrollado por la firma italiana Elettronica SPA, el Nettuno Mk 3000 es un sistema avanzado de Medidas de Apoyo Electrónico (ESM) naval diseñado para la detección de alta precisión, el análisis y la identificación automática de emisiones de radar complejas en entornos electromagnéticos densos. Está instalado en las fragatas españolas más recientes de la clase F-80 (como la Canarias F-86) y la clase Santa María.

#---- RWR ----
APR-25=AN/APR-25|Un receptor de detección y localización por radar instalado en multitud de aeronaves estadounidenses de la década de 1960.


#---------------------------------------- Barcos ----------------------------------------

Meroka_CIWS=Meroka CIWS|20mm Meroka Mod2b CIWS|El Meroka CIWS es un sistema de armas de defensa cercana (CIWS) de desarrollo español que consta de doce cañones Oerlikon L/120 de 20 mm dispuestos en dos filas ligeramente desplazadas de seis cañones cada una, diseñado principalmente para la defensa puntual de buques de guerra contra misiles antibuque, aeronaves de bajo vuelo y otras municiones guiadas de precisión.

#---- Fire Control ----
RAN_12L=RAN-12L FCS|El radar de búsqueda de baja cota Alenia RAN-12L de banda D (1-2 GHz) funciona como unidad de control de tiro para el sistema CIWS Meroka.
WM25_FCS=WM25|El radar de control de tiro Signaal WM25 opera en banda X con seguimiento y escaneo. Diseñado específicamente para la defensa aérea a baja altitud, utiliza un sistema integrado con funciones antiinterferencias y anticamuflaje.
MK92_Mod6_FCS=Mk92 Mod6 FCS|Mk92 Mod6 FCS|El Sistema de Control de Tiro (FCS) Mark 92 Mod 6 proporciona canales múltiples e integrados de seguimiento y guiado de reacción rápida para sistemas de misiles y artillería naval. Como parte de la actualización CORT, cuenta con un ordenador digital avanzado para controlar múltiples canales de combate de forma simultánea, automatizando la evaluación de amenazas y la asignación de armas.
MK92_Mod6_CORT_SearchRadar=Mk92 Mod6 CORT|Mk92 Mod6 CORT|El radar de búsqueda de horizonte Mk 92 Mod 6 CORT utiliza un transmisor y receptor totalmente coherentes para ofrecer contramedidas electrónicas avanzadas (ECCM). Funciona mediante un modo de seguimiento a la vez que escaneo (TWS) diseñado específicamente para la detección de alta precisión de misiles que vuelan a ras del suelo o del mar, con una sección transversal de radar pequeña, en entornos con alta densidad de ecos parásitos e interferencias.
VPS-2_Sharpshooter=VPS-2 Sharpshooter|Pequeño radar balístico para corregir el tiro del CIWS Meroka, montado en la parte superior de cada montaje.

#---- Radar ----
DA_05=DA05|El Signaal DA05 es un radar de búsqueda aérea naval que opera en banda S para vigilancia de medio alcance e indicación de objetivos.
Decca_TM-626=Decca TM-626|Radar marítimo comercial en Banda X de la serie británica Decca Transar, utilizado por la Armada Española en fragatas, dragaminas y remolcadores para navegación costera de alta resolución hasta 20 millas.
Decca_Type-12=Decca Type 12|El Tipo 12 fue un radar de navegación comercial que operaba en la banda X.\n\nEl Tipo 12 utilizaba una denominada "antena de doble queso" de 1.2 metros de ancho y un transceptor en el mástil.
Marconi_992=Marconi 992|El radar Tipo 992 es un radar de control de armas en banda S con una potencia de impulsos muy elevada. También puede utilizarse como radar de reconocimiento de medio alcance.\n\nEn la versión original, se utilizaba una "antena de queso", que era aerodinámica para las altas velocidades de rotación.\n\nLa banda de frecuencias está cubierta por tres magnetrones intercambiables refrigerados por agua y sintonizables.
ZW_06=ZW06|El Signaal ZW06 es un radar de búsqueda y navegación de superficie que opera en la banda X. Este radar es especialmente adecuado para la búsqueda de superficie, el relleno de huecos a baja elevación, el control de helicópteros y la navegación.

#---- Sonar ----
DE1160=DE 1160|El DE-1160 es un sonar de detección de submarinos activo/pasivo con capacidades muy limitadas. Es un sistema montado en el casco, diseñado para buques del tamaño de fragatas o corbetas.
DE1160LF=DE 1160LF|El DE-1160LF es una evolución avanzada del modelo estándar DE-1160 (SQS-56), específicamente modificado para operar en baja frecuencia (LF). Al operar en frecuencias acústicas más bajas, logra un mayor alcance de detección y una mejor penetración en capas térmicas en comparación con su predecesor. Esta variante incorpora un procesamiento digital modernizado para una discriminación de objetivos mejorada en entornos litorales complejos.

#---- ASWweapons ----
ASW375twin=375mm ASW rocket|La familia de cohetes antisubmarinos de 375 mm es un sistema de lanzamiento frontal desarrollado por Bofors. El sistema cuenta con un lanzador de dos cañones y entró en servicio en la década de 1950.


#---------------------------------------- Submarinos  ----------------------------------------

#---- Radar ----
spa_SS-2=SS-2|El SS-2 era un radar de búsqueda en superficie diseñado para detectar buques, aeronaves a baja cota y ayudar en la navegación nocturna o con niebla. Operaba en la banda X a través de un mástil elevable desde la vela del submarino, pudiendo usarse en superficie o a profundidad de periscopio.\n\nEstuvo en servicio activo desde 1959 hasta 1984. Equipada de origen a toda la Serie 30 (los cinco submarinos de procedencia norteamericana S-31 a S-35), siendo su principal herramienta de detección visual lejana antes de ser reemplazado tecnológicamente en clases posteriores.
spa_SPS-2A=SPS-2A|El SPS-2A es un radar compacto de exploración y búsqueda de superficie que opera en la banda X, diseñado específicamente para equipar submarinos. Su antena parabólica va montada sobre un mástil telescópico en la vela del buque, lo que le permite detectar barcos, aeronaves que vuelen a muy baja cota y servir como ayuda a la navegación en condiciones de visibilidad cero. Puede operar con el submarino en superficie o a profundidad de periscopio.\n\nLlegó a España de la mano de los acuerdos de asistencia mutua con los Estados Unidos a comienzos de la década de 1970. Estuvo en servicio activo desde 1971 hasta 1984.\n\nSirvió como el radar de exploración principal de los submarinos de la Clase Balao modernizados al estándar GUPPY IIA de la Flotilla de Submarinos.

#---- Sónar ----
spa_BQG-3=BQG-3|El sónar Pasivo Telemétrico AN/BQG-3 (PUFFS) es un sistema de sonar pasivo analógico diseñado para calcular la distancia y rumbo de blancos submarinos mediante triangulación acústica.\n\nUtiliza tres conjuntos de hidrófonos integrados a lo largo del casco del submarino para medir la sutil diferencia en el tiempo de llegada de los ruidos radiados por el objetivo.\n\nAl operar de forma completamente pasiva, permite obtener soluciones de tiro y guiar torpedos de ataque sin emitir pulsos activos, manteniendo la máxima discreción térmica y acústica.
spa_BQS-2=BQS-2|El BQS-2 era un sonar de casco de exploración activa (Hull Mounted Scanning Sonar) operado en frecuencias medias. Su transductor estaba optimizado para emitir pulsos acústicos ("pings") y barrer sectores específicos, calculando de forma rápida la marcación y distancia de posibles amenazas submarinas o de superficie, facilitando las tareas de ataque y evasión táctica.\n\nEntró en servicio con la incorporación del primer submarino transferido por los Estados Unidos bajo los planes de asistencia mutua. Estuvo operativo aproximadamente desde 1959 hasta principios de la década de 1970.\n\nSirvió como el sensor acústico activo principal del primer submarino de la Flotilla de Submarinos de la Armada Española posterior a la Segunda Guerra Mundial S-31 Almirante García de los Reyes (Clase Balao / "B-1", ex-USS Kraken), en su configuración original antes de las modernizaciones mayores de la flotilla.
spa_BQR-2B=BQR-2B|El BQR-2B era un sonar puramente pasivo de baja frecuencia montado en el casco (con una característica disposición semicircular de hidrófonos en la proa). Disponía de dos formadores de haces analógicos: uno controlado manualmente por el operador para el seguimiento preciso de un blanco y otro en rotación continua automática que escaneaba los 360 grados para alerta temprana. Solía trabajar integrado con el sonar activo BQS-4, compartiendo la misma matriz de hidrófonos para optimizar espacio y procesamiento acústico.\n\nEntró en servicio con la llegada de la asistencia militar estadounidense de los años 70. Estuvo operativo en aguas españolas desde 1971 hasta 1984.\n\nSirvió como el sistema de escucha principal de largo alcance de los submarinos de la Clase Balao modernizados a los estándares GUPPY IIA y GUPPY III.
spa_BQS-4C=BQS-4C|El BQS-4C era un sonar de casco de frecuencia media capaz de operar tanto en modo activo como pasivo.\n\nDiseñado habitualmente como una extensión integrada sobre la matriz de hidrófonos del sonar pasivo BQR-2B, utilizaba la transmisión de impulsos ("pings") para determinar con extrema precisión la distancia, velocidad y rumbo de sumergibles enemigos, complementando la alerta pasiva de largo alcance.\n\nEntró en servicio tras los acuerdos de transferencia de material bélico con el gobierno estadounidense. Estuvo en servicio operativo desde 1959 hasta 1984.\n\nSirvió como el sensor activo principal de la totalidad de los buques de la Serie 30 (Clase Balao, GUPPY IIA y GUPPY III) de la Flotilla de Submarinos.

#---- Sónar Remolcado ----
SolarSUB-B=SolarSUB-B|Sistema de sonar por cable pasivo remolcado, instalado desde 2006 en submarinos SSK de la clase Galerna.

#---- ESM ----
spa_WLR-3=ESM AN/WLR-3|El AN/WLR-3 era un receptor pasivo de alerta táctica y contramedidas electrónicas (Electronic Support Measures - ESM).\n\nSu propósito clave era interceptar, analizar e identificar señales de radares enemigos de alta frecuencia, en particular las ondas electromagnéticas utilizadas por los nuevos buscadores (seekers) activos de los misiles superficie-superficie y aire-superficie de la época.\n\nLlegó a España a través de las transferencias de buques de procedencia estadounidense a partir de la década de 1970. Estuvo operativo en la flota aproximadamente desde 1972 hasta finales de los años 80, formando parte fundamental de las suites de guerra electrónica de defensa pasiva.

