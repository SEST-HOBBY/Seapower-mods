[ae_sa_tiburon]
Type=SS,Submarino de Bolsillo
Default=Clase Tiburón,Tiburón
DefaultDescription=La clase Tiburón fue una serie de submarinos de bolsillo españoles desarrollada en la década de 1960 para operaciones de asalto en aguas poco profundas y de fuerzas especiales. Con un desplazamiento sumergido de unas 78 toneladas, estas embarcaciones en miniatura estaban armadas con dos tubos lanzatorpedos de 533 mm y optimizadas para el reconocimiento sigiloso. Solo se construyeron dos unidades experimentales (SA-51 y SA-52). Aunque nunca entraron en servicio activo en la flota, sirvieron como importantes bancos de pruebas para los conceptos de propulsión silenciosa de España.
Variant1=SA51 Tiburón I,SA-51
Variant2=SA52 Tiburón II,SA-52

