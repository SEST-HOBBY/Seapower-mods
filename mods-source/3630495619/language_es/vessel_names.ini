[ae_ss_s31]
Type=SS,Submarino de Patrulla
Default=Balao "Fleet snorkel",S31
DefaultDescription=El S-31 era un submarino pesado de la clase Balao (variante Fleet Snorkel).\n\nTenía una eslora de 95 metros y estaba propulsado por un sistema diésel-eléctrico.\nSu armamento incluía 10 tubos lanzatorpedos de 533 mm (para torpedos Mk 14).\n\nSu llegada supuso un salto tecnológico inmenso para las dotaciones españolas, que hasta entonces operaban buques obsoletos de la preguerra.\n\nPrestó un servicio ininterrumpido y vital desde 1959 hasta 1982.\n\nFue apodado cariñosamente por sus tripulantes como "El Treinta y Único", debido a que durante más de una década (hasta la llegada de los GUPPY en 1971) fue el único submarino verdaderamente operativo y moderno con el que contó España.
Variant1=S-31 Garcia de los Reyes - Inicial,Reyes
Variant2=S-31 Garcia de los Reyes - Modernizado,Reyes

[[ae_ss_s32]
Type=SS,Submarino de Patrulla
Default=GUPPY IIA (vela modernizada),GUPPY IIA
DefaultDescription=El S-32, S-34 y S-35 fueron submarinos oceánicos diésel-eléctricos de 93,3 metros de eslora.\n\nGracias a la conversión GUPPY IIA, se eliminaron sus cañones de cubierta y se redondeó la vela para minimizar la resistencia hidrodinámica y el ruido, convirtiéndolos en cazadores submarinos eficaces para su época.\nSu armamento principal consistía en 10 tubos lanzatorpedos de 533 mm compatibles con el torpedo Mk 14.\n\nPrestaron servicio entre 1971 y 1984.\n\nActuaron como buques escuela y de primera línea mientras se construía la clase Delfín (S-60), sufriendo bajas escalonadas debido a la fatiga de sus materiales y problemas mecánicos.\n\nHistorial de las Unidades:\n\n - S-32 Isaac Peral (ex-USS Ronquil): En servicio de 1971 a 1984. Fue el buque insignia de la flotilla GUPPY.\n - S-34 Cosme García (ex-USS Bang): En servicio de 1972 a 1983.\n - S-35 Narciso Monturiol (ex-USS Jallao): En servicio de 1974 a 1984. Heredó el nombre del S-33 tras la baja de este último.\n\nEquiparon los siguientes sistemas: radar SS-2 / SPS-2A, sónar pasivo AN/BQR-2B y sónar activo AN/BQS-4C.
Variant1=S-32 Isaac Peral,Peral
Variant3=S-34 Cosme Garcia,Cosme
Variant4=S-35 Narciso Monturiol,Monturiol

[ae_ss_s33]
Type=SS,Submarino de Patrulla
Default=GUPPY IIA class (vela inicial),S33
DefaultDescription=S-33 Narciso Monturiol (ex-USS Picuda). En servicio de 1972 a 1977.\n\nSufrió una avería irreparable en su sistema de propulsión y fue dado de baja prematuramente, usándose como fuente de repuestos.
Variant1=S-33 Narciso Monturiol,Monturiol

[ae_sa_tiburon]
Type=SS,Submarino de Bolsillo
Default=Tiburón,Tiburón
DefaultDescription=La clase Tiburón fue una serie de submarinos de bolsillo españoles desarrollada en la década de 1960 para operaciones de asalto en aguas poco profundas y de fuerzas especiales. Con un desplazamiento sumergido de unas 78 toneladas, estas embarcaciones en miniatura estaban armadas con dos tubos lanzatorpedos de 533 mm y optimizadas para el reconocimiento sigiloso. Solo se construyeron dos unidades experimentales (SA-51 y SA-52). Aunque nunca entraron en servicio activo en la flota, sirvieron como importantes bancos de pruebas para los conceptos de propulsión silenciosa de España.
Variant1=SA51 Tiburón I,SA-51
Variant2=SA52 Tiburón II,SA-52

