DefaultDescription=Los tres primeros buques de la clase Aggressive de la Armada de los Estados Unidos fueron transferidos y puestos en servicio en julio de 1971, y el cuarto fue entregado en abril de 1972. Entre 1984 y 1986 se llevó a cabo una modernización para extender su vida útil hasta 1992, cuando fueron reemplazados por los MCMV de la clase Segura.
