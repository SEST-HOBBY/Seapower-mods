DefaultDescription=Modernizados con un sistema mejorado de control de tiro de torpedos, nuevos periscopios ESM e infrarrojos. Se instalaron nuevas baterías principales con sistema de control centralizado. La gran carena del Galerna comenzó en abril de 1993 y finalizó a finales de 1994, la del Siroco, a mediados de 1995; la del Tramontana, a principios de 1997, y la del Mistral, en 2000. Se instalaron paneles solares remolcados Solarsub en todos los buques de la clase durante las revisiones.
