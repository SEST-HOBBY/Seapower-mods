Default=Clase Castilla,Paul Revere
DefaultDescription=Ambos buques, antiguos transportes anfibios de ataque de la clase Paul Revere, entraron en servicio a mediados de 1980 y estuvieron en servicio hasta 1998 (L21) y 2000 (L22).
Variant1=L21 Castilla,Castilla
Variant2=L22 Aragón,Aragón

[ae_lsd_galicia]
Type=LSD,Buque de Desembarco Anfibio
Default=Clase Galicia,Casa Grande
DefaultDescription=Denominación en la Armada Española para el buque dique de desembarco (LSD) de la clase Casa Grande de la US Navy.\n\nComisionado originalmente como USS San Marcos (LSD-25) en 1945, fue transferido a España el 1 de julio de 1971 prestando servicio como Galicia (inicialmente TA-31 y posteriormente L-31).\n\nA lo largo de su vida operativa participó en misiones destacadas como el apoyo durante la Marcha Verde en 1975. Armado con cañones Bofors de 40 mm y equipado con cubierta de vuelo para hasta tres helicópteros AB-212, causó baja a principios de 1988.
Variant1=L31 Galicia,Galicia

[ae_lst_hernan_cortes]
Type=LST,Buque de Desembarco Anfibio
Default=Clase Hernan Cortes-class,Newport
DefaultDescription=Clase Newport de la USN. El primero fue transferido desde EE. UU. como L41 en agosto de 1994 y dada de baja en 2009, el segundo, transferido en abril de 1995 como L42 y dada de baja en 2012. Todo el armamento original fue desmantelado para su transferencia, por lo que el Phalanx no estaba operativo. Tenían su base en Rota.
Variant1=L41 Hernan Cortes,Hernan Cortes
Variant2=L42 Pizarro,Pizarro

