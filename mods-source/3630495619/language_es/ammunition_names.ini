[AmmunitionNames]
spa_aim-9juli=AIM-9JULI,Sidewinder,AAM,El AIM-9JULI Sidewinder es un kit de conversión para actualizar los sistemas de guiado y control del AIM-9J/N/P al estándar AIM-9L. La clave de esta actualización reside en la instalación del buscador DSQ-29 del AIM-9L, que sustituye al buscador original del J/N/P para ofrecer capacidades mejoradas. Solo se vendió a España.
spa_rim-66e_VIb=RIM-66E_6B,SM-1MR,SAM/ASuW,El misil RIM-66B Standard Missile 1 MR se desarrolló como un nuevo sustituto para combinarse con plataformas que anteriormente utilizaban el RIM-24C Tartar.\n\nEl Standard Missile comparte fuselaje con el Tartar para facilitar la integración física.\n\nLa variante E fue un rediseño de la electrónica del modelo B, utilizando componentes del SM-2MR, y presenta una capacidad limitada para interceptar misiles de crucero de vuelo rasante.\n\nLa versión final de producción de la familia SM-1MR, la 6B, se optimizó para proteger a las flotas contra armas antibuque de que vuelen a baja altitud.

spa_br-250=BR-250,,Bomb,La BR-250 (Baja Resistencia, 250 kg) es una bomba de propósito general de fabricación española, desarrollada por la empresa Expal (Explosivos Alaveses). Fue diseñada para cumplir con los requerimientos del Ejército del Aire de España, basándose en la serie estadounidense Mark 80.
spa_br-500=BR-500,,Bomb,La BR-500 (Baja Resistencia, 500 kg) es una bomba de propósito general de fabricación española, desarrollada por la empresa Expal (Explosivos Alaveses). Fue diseñada para cumplir con los requerimientos del Ejército del Aire de España, basándose en la serie estadounidense Mark 80.
spa_brp-250=BRP-250,,Bomb,La BRP-250 (Baja Resistencia Paracaídas, 250 kg) es una bomba de propósito general de diseño español, frenada por paracaídas. Fabricada por Expal (Explosivos Alaveses), es una evolución de la serie estadounidense Mark 80, optimizada específicamente para lanzamientos a alta velocidad y baja cota.
spa_brps-250=BRPS-250,,Bomb,La BRPS-250 (Baja Resistencia Paracaídas Súper-frenada, 250 kg) es la variante de frenado extremo de la familia de 250 kg. Mientras que la BRP estándar es para cotas bajas, la BRPS está optimizada para ataques a altitudes extremadamente bajas, permitiendo vuelos casi a ras de suelo.
spa_brps-500=BRPS-500,,Bomb,La BRPS-500 (Baja Resistencia Paracaídas Súper-frenada, 500 kg) es la variante de frenado extremo de la familia de 500 kg. Mientras que la BRP estándar es para cotas bajas, la BRPS está optimizada para ataques a altitudes extremadamente bajas, permitiendo vuelos casi a ras de suelo.
spa_bme-330=BME-330,,Cluster Bomb,La BME-330 (Bomba de Municiones Especiales, 330 kg) es una familia de bombas de racimo (cluster) desarrolladas por Expal. Fue diseñada para lanzamientos de precisión a baja cota mediante un sistema de frenado por paracaídas opcional.
spa_bmep-330=BMEP-330,,Cluster Bomb,La BME-330 (Bomba de Municiones Especiales, 330 kg) es una familia de bombas de racimo (cluster) desarrolladas por Expal. Fue diseñada para lanzamientos de precisión a baja cota mediante un sistema de frenado por paracaídas.

spa_f17mod2=F17 mod 2,,ASW Torpedo,El torpedo francés F17 es un torpedo antisubmarino y también antibuque pesado de 533 mm.
spa_l5mod4=L5 mod 4,,ASW Torpedo,El torpedo francés L5 es un torpedo acústico activo pesado de 533 mm, lanzado desde submarinos o superficie.

spa_mcc23_mine=Mina MCC-23,Mina MCC-23,Mina,La MCC-23 (designación francesa TSM 3510) es una mina de fondo multi-influencia desplegable desde tubos lanzatorpedos de 533 mm, fabricada por EXPAL y SAES para los submarinos de las clases S-60 y S-70 de la Armada Española.\n\nDiseñada para misiones de minado ofensivo y defensivo en aguas someras y pasos estratégicos, detecta blancos mediante una combinación de sensores acústicos, magnéticos y de presión.\n\nAlmacena una potente cabeza explosiva de 600 kg capaz de destruir la estructura de buques mediante una onda de choque hidrostática y el colapso de la quilla.

