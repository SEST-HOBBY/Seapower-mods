APR-25=AN/APR-25|A radar detection and homing receiver installed on a multitude of US aircraft of the 1960s.


#---------------------------------------- Ships  ----------------------------------------

Meroka_CIWS=Meroka CIWS|20mm Meroka Mod2b CIWS|The Meroka CIWS is a Spanish-developed close-in weapon system (CIWS) consisting of twelve 20 mm Oerlikon L/120 guns arranged in two slightly offset rows of six barrels each, designed primarily for the terminal point defense of naval vessels against anti-ship missiles, low-flying aircraft, and other precision-guided munitions.

#---- Fire Control ----
RAN_12L=RAN-12L FCS|The Alenia RAN-12L D-band (1-2 GHz) low level search radar works as fire-control unit for Meroka CIWS.
WM25_FCS=WM25|The Signaal WM25 operates in X band track while scan fire-control radar. Designed specifically for low-level air defense and uses an integrated system concept with anti-clutter and anti-jamming features.
MK92_Mod6_FCS=Mk92 Mod6 FCS|Mk92 Mod6 FCS|The Mark 92 Mod 6 Fire Control System (FCS) provides integrated, quick-reaction multi-channel tracking and guidance for naval gun and missile systems. As part of the CORT upgrade, it features an advanced digital computer to control multiple engagement channels simultaneously, automating threat evaluation and weapon assignment.
MK92_Mod6_CORT_SearchRadar=Mk92 Mod6 CORT|Mk92 Mod6 CORT|The Mk 92 Mod 6 CORT horizon search radar utilizes a fully coherent receiver and transmitter to deliver advanced electronic counter-countermeasures (ECCM). It operates via a Track-While-Scan (TWS) mode designed specifically for high-precision detection of small radar cross-section, low-flying sea-skimming missiles in dense clutter and jamming environments.
VPS-2_Sharpshooter=VPS-2 Sharpshooter|Small ballistic radar to correct firing of Meroka CIWS, mounted on top of each mount.

#---- Radar ----
DA_05=DA05|The Signaal DA05 is an naval air search radar operating in S band for medium-range surveillance and target indication. 
Decca_TM-626=Decca TM-626|Commercial X-band marine radar from the British Decca Transar series, used by the Spanish Navy on frigates, minesweepers, and tugs for high-resolution coastal navigation up to 20 miles.
Decca_Type-12=Decca Type 12|The Type 12 was an early commercial navigation radar operating in the X band.\n\nType 12 used a so called “Double Cheese Antenna” 4ft wide and an upmast transceiver.
Marconi_992=Marconi 992|Type 992 is a high power, operating in S band naval radar providing rapid target indication for weapons. It can also be used as medium range air and surface warning radar.\n\nIn the original version, a so-called “cheese antenna” was used, which was streamlined for high rotational speeds.\n\nThe frequency band is covered by three interchangeable liquid cooled magnetrons.
ZW_06=ZW06|The Signaal ZW06 is a surface search and navigation radar operating in the X band. This radar is particularly suited for surface search, low elevation gap filler, helicopter control and navigation. 

#---- Sonar ----
DE1160=DE 1160|The DE 1160 is an active/passive submarine detection sonar with severely limited capabilities. It is a hull-mounted system designed for frigate/corvette-sized ships. 
DE1160LF=DE 1160LF|The DE 1160LF is an advanced evolution of the standard DE-1160 (SQS-56), specifically modified for Low Frequency (LF) operations. By shifting to lower acoustic frequencies, it achieves superior detection ranges and better penetration of thermal layers compared to its predecessor. This variant features modernized digital processing for enhanced target discrimination in complex littoral environments.

#---- ASWweapons ----
ASW375twin=375mm ASW rocket|The 375 mm ASW rocket family is an ahead-throwing anti-submarine rocket system developed by Bofors. The system has a launcher with two barrels, and entered service in the 1950s.


#---------------------------------------- Submarines  ----------------------------------------

#---- Radar ----
spa_SS-2=SS-2|The SS-2 was a surface-search radar designed to detect enemy ships, low-flying aircraft, and assist in navigation during nighttime or heavy fog. Operating in the X-band via an extendable mast inside the sail, it could be deployed while surfaced or at periscope depth.\n\n It remained in active service from 1959 until 1984. It was standard equipment on all 30-Series submarines (the five ex-US Navy vessels, S-31 to S-35), serving as their primary long-range surface detection sensor before the introduction of newer submarine classes.
spa_SPS-2A=SPS-2A|The SPS-2A is a compact X-band surface-search and navigation radar designed explicitly for submarine operations. Featuring a parabolic antenna mounted on a retractable mast within the submarine's sail, it is utilized for tracking surface vessels, low-flying aircraft, and assisting in zero-visibility piloting. It can be deployed either while running on the surface or at periscope depth.\n\nThis radar system was transferred to Spain under the military assistance agreements with the United States in the early 1970s. It remained in active service from 1971 until 1984.\n\nIt served as the primary surface-search sensor on the Balao-class submarines upgraded to the GUPPY IIA standard.

#---- Sonar ----
spa_BQG-3=BQG-3|The BQG-3 Passive Ranging Sonar (PUFFS) is an analog passive ranging sonar system designed to compute target range and bearing through acoustic triangulation.\n\nIt utilizes three distinctive hydrophone arrays spaced along the submarine's outer hull to measure the precise time-delay arrival of a target's radiated noise.\n\nOperating entirely in passive mode, it delivers accurate fire control solutions and torpedo guidance without transmitting active pulses, ensuring maximum stealth and acoustic discretion.
spa_BQS-2=BQS-2|The BQS-2 was an early Cold War-era, hull-mounted active scanning sonar designed for submarine platforms. Operating at medium frequencies, its primary function was to transmit acoustic pulses ("pings") to scan designated underwater sectors, providing swift and precise range and bearing data on surface or submerged targets for tactical engagement and navigation.\n\nIt entered service following the transfer of Spain’s first post-WWII fleet submarine from the United States under mutual defense programs. It was actively deployed from roughly 1959 until the early 1970s.\n\nIt served as the primary active acoustic sensor aboard the pioneer of the Spanish Navy's modern Submarine Flotilla S-31 Almirante García de los Reyes (Balao-class / "B-1", former USS Kraken), in its original fleet snorkel configuration before subsequent major class overhauls.
spa_BQR-2B=BQR-2B|The BQR-2B was a long-range, hull-mounted passive detection and tracking sonar operating at low-to-medium frequencies.\n\nIt featured a large bow array of hydrophones and relied on two distinct broadband beamformers: one manually steered by the sonar tech for precise tracking, and another continuously scanning 360 degrees to maintain comprehensive situational awareness.\n\nTo save space, it commonly served as the receiver foundation for the integrated BQS-4 active scanning sonar.\n\nTransferred under the US military aid programs of the early Cold War era, it remained in active service with Spain from 1971 until 1984.
spa_BQS-4C=BQS-4C|The BQS-4C was a mid-frequency, hull-mounted active and passive scanning sonar system. Developed as a tightly integrated active transmitter component utilizing the large hydrophone base of the BQR-2B passive system, it emitted precise acoustic energy pulses ("pings") to accurately calculate the speed, exact bearing, and distance of sub-surface contacts.\n\nTransferred under the mutual military assistance defense acts between Spain and the United States, it remained in continuous active service from 1959 until 1984.\n\nIt acted as the prime tactical active acoustic sensor for all 30-Series (Balao-class, GUPPY IIA, and GUPPY III) fleet submarines.

#---- Towed Array ----
SolarSUB-B=SolarSUB-B|Passive-Only Towed Array Sonar System, since 2006 mounted on Galerna class SSK.

#---- ESM ----
spa_WLR-3=AN/WLR-3 ESM|The AN/WLR-3 was a broadband passive Radar Warning Receiver (RWR) and Electronic Support Measures (ESM) system.\n\nIt was engineered to intercept, identify, and analyze high-frequency electromagnetic emissions, specifically filling a capability gap by detecting the active radar seekers utilized by modern anti-ship surface-to-surface and air-to-surface missiles.

