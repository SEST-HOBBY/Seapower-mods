#---------------------------------------- Aircrafts  ----------------------------------------

#---- Air/Air&Surface ----
NASARR_F-15A=NASARR F-15A|The NASARR is a search and tracking radar produced in the United States in the mid 1960s. It features a notably advanced ground-mapping capabilty for its time, making it especially useful for ground-strike missions. For this reason it is featured on the F-104G fighter-bomber variant of the F-104 Starfighter family.
Searchwater=Searchwater|The Searchwater radar, in its LAST (Low Altitude Surveillance Task) variant, was integrated into three Sikorsky SH-3D Sea King helicopters of the Spanish Navy (affectionately nicknamed "Paqueteras") starting in 1987. This decision was a direct lesson from the Falklands War, where the lack of early warning caused serious losses to the Royal Navy.

#---- ECM ----
Guffo_Mk2000_ECM=Guffo Mk.2000 ECM|The Mk 2000 “Guffo” electronic warfare system—“owl” in Italian—was installed in 1980 on four helicopters of the 3rd Escuadrilla in response to the Navy’s need for modern, versatile, helicopter-mounted equipment capable of detecting, identifying, and jamming a wide spectrum of electromagnetic emissions.
Beta_Mk1000_ECM=Beta Mk1000 ECM|In the 1980s, to equip the Descubierta-class corvettes and modernize the systems on the Baleares-class frigates (which were originally fitted with the outdated AN/WLR1C), the Navy opted for the ESM/ECM equipment offered by the Italian firm Elettronica SPA. The system chosen for these ships was the Beta MK 1000, which included both ESM and ECM components.
Ceselsa_CANOPUS_ECM=CANOPUS ECM|This program was implemented in the ECM subsystem of DENEB, which was linked to the KOCHAB decoy launch program. The goal was to integrate the decoy launch system with the electronic warfare system, using the widely used U.S. Mk36 SRBOC decoy launchers. Since they used virtually the same equipment as that installed on the Baleares-class frigates, the equipment on the Descubierta-class ships was similarly modernized under the DENEB, CANOPUS, and ELNATH programs.
Ceselsa_NETTUNEL_ECM=NETTUNEL ECM|NETTUNEL is an integrated naval Electronic Warfare system (ESM/ECM) developed by CESELSA and Elettronica. Designed to detect, classify, and jam radar and missile threats, it equipped Spanish Navy vessels like the Príncipe de Asturias and F-80 frigates.
ELT_Nettuno_Mk3000_ECM=Mk3000 ECM|Mk3000 ECM|Developed by Elettronica, the Nettuno Mk 3000 is a high-performance naval ECM system designed for electronic jamming and deception against modern radar-guided anti-ship missiles and fire control radars. Installed on latest F86 and F86 Santa María class spanish frigates.

#---- ESM ----
Guffo_Mk2000_ESM=Guffo Mk.2000 ESM|The Mk 2000 “Guffo” electronic warfare system—“owl” in Italian—was installed in 1980 on four helicopters of the 3rd Escuadrilla in response to the Navy’s need for modern, versatile, helicopter-mounted equipment capable of detecting, identifying, and jamming a wide spectrum of electromagnetic emissions.
Beta_Mk1000_ESM=Beta Mk1000 ESM|In the 1980s, to equip the Descubierta-class corvettes and modernize the systems on the Baleares-class frigates (which were originally fitted with the outdated AN/WLR1C), the Navy opted for the ESM/ECM equipment offered by the Italian firm Elettronica SPA. The system chosen for these ships was the Beta MK 1000, which included both ESM and ECM components.
Ceselsa_DENEB_ESM=DENEB ESM|In the mid-1980s, Spain’s first naval electronic warfare program, known as Deneb, was launched. While retaining the Beta’s original basic analog systems, the program sought to automate the system by introducing computer technologies into signal processing for automatic identification through correlation with databases.
Ceselsa_NETTUNEL_ESM=NETTUNEL ESM|NETTUNEL is an integrated naval Electronic Warfare system (ESM/ECM) developed by CESELSA and Elettronica. Designed to detect, classify, and jam radar and missile threats, it equipped Spanish Navy vessels like the Príncipe de Asturias and F-80 frigates.
ELT_Nettuno_Mk3000_ESM=Mk3000 ESM|Mk3000 ESM|Developed by the Italian firm Elettronica SPA, the Nettuno Mk 3000 is an advanced naval Electronic Support Measures (ESM) system designed for high-precision detection, analysis, and automatic identification of complex radar emissions in dense electromagnetic environments. Installed on latest F86 and F86 Santa María class spanish frigates.

