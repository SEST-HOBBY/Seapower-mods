DefaultDescription=The Santa María class of guided missile frigates is the Spanish Navy's designation for six warships based on the United States Oliver Hazard Perry-class frigates. Spanish ships have a slightly bigger beam and were built with a greater weight reserve for future improvements. Other changes from the basic model include Meroka replacing Phalanx and a RAN-12L air search radar to provide low horizon coverage against sea skimmers cueing the Meroka CIWS mount. All based at Rota as the 41st Squadron, served in the Spanish Navy from october 1986 to current days.
