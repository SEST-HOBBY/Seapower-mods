Default=Galicia-class,Casa Grande
DefaultDescription=Spanish Armada designation for the US Navy Casa Grande-class dock landing ship (LSD).\n\nOriginally commissioned as USS San Marcos (LSD-25) in 1945, it was transferred to Spain on July 1, 1971, and served as Galicia (initially designated TA-31 and later L-31).\n\nThroughout its operational life, it participated in major missions including the Marcha Verde evacuation support in 1975. Armed with Bofors 40mm guns and equipped with a flight deck for up to three AB-212 helicopters, it was decommissioned in early 1988.
