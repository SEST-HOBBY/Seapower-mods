[ae_ffg_descubierta_late]
Type=FS,Corvette
Default=Descubierta-class (Late),Descubierta
DefaultDescription=From 1986 onwards, the Spanish Navy modernized the class to address early electronic warfare and air defense limitations. The obsolete Italian Beta 1000 system was replaced by the domestic CESELSA Deneb ESM processor, closely integrated with active Canopus ECM jammers and automated Mk-36 SRBOC decoy launchers. Combat capabilities were further refined through the TRITAN command system for better Link-data sharing within the Fleet, and the standardization of the Albatros/Aspide SAM system to improve jam-resistance. They retained these high-intensity combat features until their conversion into patrol craft after 2000.
Variant1=F31 Descubierta,Descubierta
Variant2=F32 Diana,Diana
Variant3=F33 Infanta Elena,Infanta Elena
Variant4=F34 Infanta Cristina,Infanta Cristina
Variant5=F35 Cazadora,Cazadora
Variant6=F36 Vencedora,Vencedora

