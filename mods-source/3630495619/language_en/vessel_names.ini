[ae_ao_teide]
Type=AO,Fleet Auxiliary
Default=Teide-class,Teide
DefaultDescription=Designed in 1952 and built by Empresa Nacional Bazán in Cartagena, the Teide was a fleet oiler that served in the Spanish Navy from 1956 to 1988. Based on a commercial merchant ship design, it was adapted for underway replenishment and served for over three decades as the primary logistics support unit providing fuel to Spanish naval forces.
Variant1=BP11 Teide,Teide

[ae_cvl_dedalo]
Type=CVL,Aircraft Carrier
Default=Dedalo-class (Early),Dedalo
DefaultDescription=The Dédalo (1967) in her initial configuration served as the flagship of the Spanish Navy and the core of its anti-submarine warfare (ASW) capability. Initially loaned by the US after being reactivated from the reserve, the ex-USS Cabot operated during this period exclusively as a helicopter carrier, deploying SH-3 Sea King and AB-204/212 aircraft to track submarine threats. In this early era, the ship still retained her original World War II and early Cold War electronics suite, and her defense relied on traditional 40mm Bofors gun mounts, serving as a vital naval aviation platform prior to the introduction of fixed-wing aircraft.
Variant1=R01 Dedalo,Dedalo

[ae_cvl_dedalo_late]
Type=CVL,Aircraft Carrier
Default=Dedalo-class (Late),Dedalo
DefaultDescription=Following pioneering modifications in the mid-1970s, which included applying steel plating to the aft section of her flight deck to withstand thermal exhaust, the Dédalo became the world's first carrier to regularly operate AV-8S Matador (Harrier) STOVL fighters. This profound upgrade transformed the veteran vessel from an ASW helicopter carrier into a platform for fleet air defense and light strike, incorporating new air search radars, modern communication systems, and an updated electronics suite that kept her as the centerpiece of the Alfa Task Force in the Mediterranean until her decommissioning in 1989. She was replaced by the Principe de Asturias.
Variant1=R01 Dedalo,Dedalo

[ae_cvl_principe_asturias]
Type=CVL,Aircraft Carrier
Default=Principe de Asturias-class,R11
DefaultDescription=Príncipe de Asturias, originally named Almirante Carrero Blanco, was an aircraft carrier and former flagship of the Spanish Navy. She was built in Bazan's Shipyards and delivered to the Spanish Navy on 30 May 1988. Previous aircraft Carrier Dedalo was replaced as the navy's fleet flagship by Príncipe de Asturias. The ship was permanently assigned to the Alpha Group, comprising the carrier and six Santa Maria-class frigates (a Spanish version of the USN Oliver Hazard Perry class). Other vessels such as logistic ships, tankers and corvettes are frequently assigned to the Group when required. Príncipe de Asturias and the Alpha Group have participated in peace support operations in the Adriatic Sea. The ship became a victim of defence cuts, being officially decommissioned on 6 February 2013.
Variant1=R11 Principe de Asturias,Principe de Asturias

