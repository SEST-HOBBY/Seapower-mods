[spa_ab212]
Type=ASW Helicopter
Default=AB-212 ASW,AB-212
DefaultDescription=The AB-212 is a lisenced build twin engine Bell UH-1 Huey by the Italian company Agusta for use with the Italian Navy for various roles,with production starting in the mid 70's. In 1974, the Spanish Navy's air force began receiving the first of 14 Agusta Bell Model 212 helicopters to gradually replace the obsolete AB-204 anti-submarine warfare helicopters. Ten aircraft remained in service until July 30, 2024, when they were decommissioned. They are based in Rota as 3ª Escuadrilla, operating from the ships of the amphibious group or the aircraft carrier Príncipe de Asturias.
Squadron1=3ª Escuadrilla (Blue scheme)
Squadron2=3ª Escuadrilla (Grey scheme)
Callsigns=Squadron1,Gato|Squadron2,Gato

[spa_ah-1g]
Type=Attack Helicopter
Default=AH-1G,AH-1G
DefaultDescription=The AH-1 is an attack helicopter first fielded during the Vietnam War. It was later developed into a twin engine variant, which sees service with US allies. The AH-1J is a twin engined upgrade over the original AH-1, with examples exported to the Shah of Iran before the Islamic revolution.
Squadron1=AH-1G 7ªEscuadrilla, AH-1G
Callsigns=Squadron1,Cobra

[spa_av-8a]
Type=Fighter
Default=AV-8S, AV-8S Matador
DefaultDescription=The AV-8A is the USMC's version of the British GR 1. These aircraft were built in the UK on the same production line as the British GR 1 and GR 3s, a massive export success for the factory in Kingston. It is a development of the Kestrel and P.1127 which were used by a tripartite evaluation squadron in Europe.
Squadron1=AV-8S 8ª Escuadrilla,AV-8S
Callsigns=Squadron1,Matador

[spa_f1c]
Type=Fighter
Default=Mirage F1CE,F1CE
DefaultDescription=The Mirage F1CE represents the primary interceptor variant of the Spanish Air Force (Ejército del Aire) during the late Cold War. Optimized for high-speed air defense, this 'C' model is equipped with the Cyrano IV radar and armed with Matra Magic and eventually Super 530 missiles. In the Spanish theater, these 'Abuelas' served as the backbone of the Quick Reaction Alert (QRA) force, defending the Iberian Peninsula and the Canary Islands with unmatched scramble performance.
Squadron1=Escuadron 141,F1CE
Squadron2=Escuadron 142,F1CE
Callsigns=Squadron1,Chico|Squadron2,Dardo

[spa_f1e]
Type=Fighter
Default=Mirage F1EE,F1EE
DefaultDescription=The Mirage F1EE is the enhanced multi-role version of the Spanish F1 fleet. Distinguished by its fixed refueling probe for extended range, the 'EE' variant features an improved inertial navigation system (INS) and specialized air-to-ground capabilities. Within the Spanish context, these aircraft provided a sophisticated strike and maritime attack platform, capable of projecting power across the Mediterranean and Atlantic while maintaining a lethal air-to-air punch.
Squadron1=Escuadron 462,F1EE
Callsigns=Squadron1,Alcon

[spa_f-4c]
Type=Fighter
Default=F-4C,F-4C
DefaultDescription=The F-4 is an US built long-range supersonic jet interceptor and fighter-bomber which was originally designed for the United States Navy. The airframe was found to be extremely flexible and was used by both the USN and the USAF. The F-4D is the second variant of the F-4 used by the USAF, having slightly better avionics than the earlier F-4C.
Squadron1=F-4C Escuadron 121,F-4C
Squadron2=F-4C Escuadron 122,F-4C
Callsigns=Squadron1,Poker|Squadron2,Tenis

[spa_f104g]
Type=Fighter
Default=F-104G,F-104G
DefaultDescription=The F-104 Starfighter is a supersonic interceptor manufactured in the United States as part of the "Century Series" of fighter aircraft and one of the most recognizable jets in aviation history. Built in the 1960s it was designed with an airframe as small and simple as possible while acheiving the maximum possible altitude and climb performance. The F-104G is an improved fighter-bomber variant of the Starfighter developed at the request of a number of foreign operators, featuring a strengthened fuselage and wings, the new NASARR F-15A radar and a Litton LN-3 inertial navigation system (the first on a production fighter). It is the most produced variant of the F-104 and the most common used by European operators such as Italy and West Germany.
Squadron1=F-104G Escuadron 61,F-104G
Callsigns=Squadron1,Dardo

[spa_md500]
Type=ASW Helicopter
Default=MD500,MD500
DefaultDescription=The MD500 were first delivered way back in 1972 and the six still remaining in service provide a reliable and easily maintained training platform. However, spares are now becoming an issue as the Armada struggle to access new spare parts, resulting in other airframes being canibalised to maintain sufficient flight hours. As with some of the other helicopters in the fleet the Hughes first saw service as an ASW platform, capable of carrying a Metal Anomaly Detector (MAD) and MK-44/46 torpedoes before moving on to its primary flight training mission of today.
Squadron1=MD500 6ªEscuadrilla (Blue scheme), MD500
Squadron2=MD500 6ªEscuadrilla (Grey scheme), MD500
Callsigns=Squadron1,Argo|Squadron2,Argo

[spa_p-3a]
Type=Maritime Patrol,MPA
Default=P-3A,P-3A
DefaultDescription=Developed from the unsuccessful Electra airliner the P-3 is an incredibly popular anti-submarine and maritime surveillance aircraft developed for the USN. Over the years, the P-3 has seen numerous design developments, most notably in its electronics packages. Numerous navies and air forces around the world continue to use the type primarily for maritime patrol, reconnaissance, anti-surface warfare and anti-submarine warfare. A total of 757 P-3s have been built.
Squadron1=P-3A Grupo 22,P-3A
Callsigns=Squadron1,Cisne

[spa_mirage_iii]
Type=Fighter
Default=Mirage IIIEE,M.IIIEE
DefaultDescription=The Mirage IIIEE is the ground-attack and multi-role variant of the Spanish Mirage III fleet. Distinguished by its longer fuselage to accommodate advanced avionics, the 'EE' variant features an improved navigation radar and specialized all-weather ground-strike capabilities. Within the Spanish context, these aircraft provided the Ejército del Aire with its first true supersonic all-weather interceptor and fighter-bomber platform, serving as a cornerstone of Spain's air defense and tactical strike capability during the Cold War era.
Squadron1=Escuadron 111 (Early),Mirage IIIEE
Squadron2=Escuadron 111 (Late),Mirage IIIEE
Callsigns=Squadron1,Dolar|Squadron2,Dolar

[spa_sh-3d]
Type=ASW Helicopter
Default=SH-3D,SH-3D
DefaultDescription=Developed to counter the increasingly threatening prospect of the Soviet submarine forces the SH-3D is a capable anti-submarine warfare platform used extensively across NATO. Numerous subvariants of the aircraft exist, providing capabilities from SAR to AEW. The SH-3 in its civilian guise is also operated by a number of airlines, particularly in the North Sea Oil Fields.
Squadron1=SH-3D 5ª Escuadrilla blue scheme,SH-3D
Squadron2=SH-3D 5ª Escuadrilla grey scheme,SH-3D
Callsigns=Squadron1,Morsa|Squadron2,Morsa

[spa_sh-3d_AEW]
Type=AEW Helicopter
Default=SH-3D AEW,SH-3D AEW
DefaultDescription=The SH-3D AEW is a specialized airborne early warning variant of the iconic Sikorsky Sea King helicopter, adapted primarily for the Spanish Navy to provide maritime surveillance and air protection for its combat groups.
Squadron1=SH-3D AEW 5ª Escuadrilla,SH-3D AEW
Callsigns=Squadron1,Morsa
