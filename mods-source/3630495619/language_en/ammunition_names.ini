spa_aim-9juli=AIM-9JULI,Sidewinder,AAM,The AIM-9JULI Sidewinder is a conversion kit for upgrading AIM-9J/N/P guidance and control assemblies to the AIM-9L standard. The core of this upgrade is the fitting of the DSQ-29 seeker unit of the AIM-9L, replacing the original J/N/P seeker to give improved capabilities. Only sold to Spain
spa_rim-66e_VIb=RIM-66E_6B,SM-1MR,SAM/ASuW,The RIM-66B Standard Missile 1 MR was developed as a new effector to be paired with platforms that previously used the RIM-24C Tartar.\n\nThe Standard Missile shares a fuselage with the Tartar to ease physical integration.\n\nThe E variant was a redesign of the electronics of the B model, using SM-2MR components, and features a limited ability to engage sea-skimming cruise missiles.\n\nThe final production iteration of the SM-1MR family, 6B, was optimized to protect fleets against low-altitude anti-ship weapons.

spa_br-250=BR-250,,Bomb,The BR-250 (Baja Resistencia, 250 kg) is a Spanish general-purpose bomb manufactured by Expal (Explosivos Alaveses). It was developed based on the American Mark 80 series to meet the requirements of the Spanish Air Force.
spa_br-500=BR-500,,Bomb,The BR-500 (Baja Resistencia, 500 kg) is a Spanish general-purpose bomb manufactured by Expal (Explosivos Alaveses). It was developed based on the American Mark 80 series to meet the requirements of the Spanish Air Force.
spa_brp-250=BRP-250,,Bomb,The BRP-250 (Baja Resistencia Paracaídas, 250 kg) is a Spanish-designed parachute-retarded general-purpose bomb. Manufactured by Expal (Explosivos Alaveses), it is an evolution of the American Mark 80 series specifically optimized for high-speed, low-level delivery.
spa_brps-250=BRPS-250,,Bomb,The BRPS-250 (Baja Resistencia Paracaídas Súper-frenada) is the "Super-Retarded" variant of the Spanish Expal 250 kg bomb family. While the standard BRP-250 is a low-drag parachute-retarded bomb, the BRPS version is specifically optimized for extremely low-altitude strikes, often referred to as nap-of-the-earth flying.
spa_brps-500=BRPS-500,,Bomb,The BRPS-500 (Baja Resistencia Paracaídas Súper-frenada) is the "Super-Retarded" variant of the Spanish Expal 500 kg bomb family. While the standard BRP-500 is a low-drag parachute-retarded bomb, the BRPS version is specifically optimized for extremely low-altitude strikes, often referred to as nap-of-the-earth flying.
spa_bme-330=BME-330,,Cluster Bomb,The BME-330 (Bomba de Municiones Especiales, 330 kg) is a family of air-dropped cluster bombs developed by the Spanish company Expal (Explosivos Alaveses). Designed for the Spanish Air Force and export, it was engineered for high-precision, low-altitude delivery using a optional parachute-retardation system.
spa_bmep-330=BMEP-330,,Cluster Bomb,The BME-330 (Bomba de Municiones Especiales, 330kg) is a family of air-dropped cluster bombs developed by the Spanish company Expal (Explosivos Alaveses). Designed for the Spanish Air Force and export, it was engineered for high-precision, low-altitude delivery using a parachute-retardation system.

spa_f17mod2=F17 mod 2,,ASW Torpedo,The French F17 Torpedo is an 533mm heavyweight anti-submarine/ship torpedo.
spa_l5mod4=L5 mod 4,,ASW Torpedo,The French L5 Torpedo is an 533mm heavyweight submarine/surface launched active acoustic torpedo.

spa_mcc23_mine=MCC-23D Mine,MCC-23 Mine,Mine,The MCC-23 (French designation TSM 3510) is a multi-influence bottom mine deployable from standard 533mm torpedo tubes, produced by EXPAL and SAES for the Spanish Navy's S-60 and S-70 class submarines.\n\nDesigned for offensive and defensive mining operations in shallow waters and strategic chokepoints, it detects targets using a combination of acoustic, magnetic, and pressure sensors.\n\nIt houses a powerful 600 kg explosive warhead capable of destroying ship hulls via hydrostatic shockwaves and severe keel breakage.

