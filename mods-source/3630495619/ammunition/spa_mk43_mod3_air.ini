#!alias ammunition/usn_mk44_air.ini
# ver. 20261029
# Users:S-55
#
[General]
Type=Torpedo							// Can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW							// Can be AAW, ASuW, ASW

Mass=120								// In kg. Used for aircraft
AmmoPoints=260							// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
IOCDate=1951						   // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)
#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=1953						   // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

FrontalArea=0.0518
SideArea=0.5564
BottomArea=0.5606
Volume=0.0941

[WarheadData]
Power=18

[Guidance]
TerminalVelocity=21						// Maximum speed in knots when torpedo is locked on target
MaxVelocity=21							// Maximum speed in knots

MaxLaunchRange=2.22						// Maximum launch range in nautical miles
MinLaunchAltitude=90					// Minimum launch altitude in feet.
MaxLaunchAltitude=300					// Maximum launch altitude in feet.

SeekerReliability=0.83					// Chance that seeker will activate properly and will be able to track targets

SeekerFOV=70							// Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerGain=30							// Seeker gain in dB
SeekerOutputPower=190					// Active seeker output power in dB, unused for passive ones

AntiCountermeasuresBonus=0.03			// This value substracted from probability of spoofing by countermeasures (0...1)
MinAfterSpoofEffectTime=8				// Min time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max

SearchVelocity=21						// Velocity in search mode in knots

[Models]
ResourcesFolder=ammunition/spa_mk43/
ResourcesRoot=spa_mk43.obj
ResourcesMesh=spa_mk43
ResourcesMaterial=spa_mk43_mat.ini
ResourcesMeshForLaunch=spa_mk43

SubModel1=Propeller

[Propeller]
Type=Propulsion
RotationDirection=Left
Mesh=prop
Rotation=0,90,-90

#EoF