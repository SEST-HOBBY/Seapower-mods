# MINA DE INFLUENCIA MCC-23D (FRENCH TSM-3510)
# Ver. 20260805
#
[General]
Type=Torpedo							// Can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW							// Can be AAW, ASuW, ASW
SecondaryTargetType=ASW

Mass=850								// In kg. Used for aircraft
AmmoPoints=1500							// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard						// Referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
RCS=VerySmall
# Sonar related
BaseNoise=0								// Base sound level in db at 1m distance
FlowNoise=0.5							// Additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0						// Additional noise for cavitation in db
TargetReflectionStrength=1				// In dB for broad side
# Transient
TransientRCS=-1							// Transient visibility on the radar
TransientVisualIdentificationRange=-1	// Transient can be visually detected at this distance in nmi
TransientBaseNoise=0					// In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=68
ImpactSize=VeryLarge					// Impact size, can be small, medium, large, verylarge
Penetration=Always						// Can be minor, moderate, heavy, always
SmartFuse=False							// True = get as close as possible before exploding, False = explode as soon as target in proximity radius
FuzeProximityDistance=100				// For proximity fuze: distance to target in meter
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=2					// 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=600			// Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
#========================================= Launch stats ============================================================
Acceleration=10.0						// Acceleration factor
MaxTurnRate=10.0						// Maximum turnrate in degrees per second

SpeedSettings=0.1						// Selectable speeds in knots, lowest to highest
SpeedSettingRanges=50					// Full tank range in nautical miles at each of the speeds above

MinLaunchRange=0.01						// Minimum launch range in nautical miles
MinLaunchAltitude=30					// Minimum launch altitude in feet.
MaxLaunchAltitude=200					// Maximum launch altitude in feet.
WireControlsDepth=True					// The wire can pass depth orders and target depth data to the torpedo
WireBreakSpeed=10						// Launch platform speed in knots above which the wire breaks (default 20)
MaxSpeedOnWire=2						// Torpedo speed in knots above which it snaps its own wire (default unlimited)
WireMinSeafloorClearance=0				// Wire breaks if the launching sub runs closer to the seafloor than this (feet, 0 = disabled)
WireCountermeasureBonus=0.2				// Extra countermeasure rejection while on the wire; kept after a break if homing already started (default 0)
MaxDepth=150							// Maximum allowed depth in feet.

LaunchReliability=85                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerFOV=360.0							// Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerPassiveRange=1					// Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
SeekerGain=35.0							// Seeker gain in dB
FractionOfRangeToActivateSeeker=0.8		// Fraction of seeker range left to target before activation of seeker for wire guided torpedoes

#ECCM
AntiCountermeasuresBonus=0.10			// This value substracted from probability of spoofing by countermeasures (0...1)
MinAfterSpoofEffectTime=10.0			// Min time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
MaxAfterSpoofEffectTime=27.0			// Max time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
#Torpedo related
SearchMode=0							// 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
SearchVelocity=0.1						// Velocity in search mode in knots
SnakeSearchAngle=30.0					// Going left/right using that angle
SnakeSearchTurnCycleTime=6.0			// Time in seconds it takes for one complete snake cycle (left/right)
ReattackMode=1							// 0 = None, 1 = Circle
ReattackCircleDegreesPerSecond=600		// Degrees per second for circle reattack pattern
DefaultDepth=100.0						// Default depth in feet a torpedo is using for submerged targets for bearing only launches
DestructionDepth=350.0					// Depth in feet where the torpedo is destructed

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=ammunition/spa_mcc23_mine/
ResourcesRoot=spa_mcc23_mine.obj
ResourcesMesh=spa_mcc23_mine
ResourcesMaterialFolder=ships/materials/
ResourcesMaterial=usn_parts
############################################################

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# E.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# Or
# BoosterEffectClass=BoosterEffects		// This will be referenced in effects.ini

# Possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
BoosterEffectPosition=0,0,0
# InFlightEffect=effects/weapons/emitters/aswtorpedo_cavitation_particle
# InFlightEffectPosition=0,0,-0.04
# InFlightEffectStartTime=0
HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes
ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo
############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
PropAudioClip=audio/weapons/torpedo
PropAudioRollOff=Logarithmic
PropAudioDistance=1,20
PropAudioPitch=1.0
PropAudioPosition=0,0,0
PropAudioAudibility=Below

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# Creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,-0.0051,0.0053
Rotation=0,0,0
Scale=0.01,0.01703,0.09293