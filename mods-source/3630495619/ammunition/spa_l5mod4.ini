#!alias ammunition/fr_l5_mod3.ini
#French L5 mod 4 torpedo                                                 
# L5 mod 4 - https://foro.todoavante.es/viewtopic.php?f=82&t=2344
# ver. 20260906
#

[General]
# L5 Mod 4
Type=Torpedo   
TargetType=ASW

Mass=935								// In kg. Used for aircraft

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
IOCDate=1986							// Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=1988							// Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

FrontalArea=0.1633
SideArea=1.88
BottomArea=1.88

[Guidance]
#10 = Combined Active&Passive Sonar Homing
GuidanceType=10

MaxLaunchRange=5.15						// Maximum launch range in nautical miles

MaxDepth=1820							// Maximum allowed depth in feet.
DestructionDepth=1900					// Depth in feet where the torpedo is destructed
