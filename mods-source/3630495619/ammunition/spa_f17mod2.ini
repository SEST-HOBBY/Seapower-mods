[General]
Type=Torpedo                          	// Can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                        	// Can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=1406                              	// In kg. Used for aircraft
AmmoPoints=3800                        	// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

[SensorData]
BaseNoise=105                          	// Base sound level in db at 1m distance
TransientBaseNoise=140                 	// In db

[WarheadData]
Power=65
FuzeProximityDistance=10               	// For proximity fuze: distance to target in meter
SmartFuse=True                  		// Explodes not immediately but when when target start to go away

[Guidance]
#10 = Combined Active&Passive Sonar Homing
GuidanceType=10
MidCourseCorrection=2                  	// 0 = None, 1 = Radio Command, 2 = Wire Guided
VesselAttackGuidanceType=8

TerminalVelocity=40.0                   // Maximum speed in knots when torpedo is locked on target
MaxVelocity=40

Acceleration=12.0                      	// Acceleration factor
MaxTurnRate=12.0                       	// Maximum turnrate in degrees per second

MinLaunchRange=0.5	                    // Minimum launch range in nautical miles
MaxLaunchRange=15.50               	    // Maximum launch range in nautical miles

SpeedSettings=24,40                    	// Selectable speeds in knots, lowest to highest
SpeedSettingRanges=15.50,10.75         	// Full tank range in nautical miles at each of the speeds above
WireControlsDepth=True                 	// The wire can pass depth orders and target depth data to the torpedo
WireCountermeasureBonus=0.4            	// Extra countermeasure rejection while on the wire; kept after a break if homing already started (default 0)
WireBreakSpeed=20                      	// Launch platform speed in knots above which the wire breaks (default 20)
WireMinSeafloorClearance=0            	// Wire breaks if the launching sub runs closer to the seafloor than this (feet, 0 = disabled)

MaxDepth=1968                          	// Maximum allowed depth in feet.
DestructionDepth=2100	                // Depth in feet where the torpedo is destructed

LaunchReliability=90                   	// The lower the value, the greater risk of misfire or accident (0...100)

#Homing
SeekerActiveRange=1.0                  	// Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=0.55                	// Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
SeekerGain=40.0                        	// Seeker gain in dB
SeekerOutputPower=300                	// Active seeker output power in dB, unused for passive ones

#Torpedo related
SearchMode=1                           	// 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
SearchVelocity=34.0                    	// Velocity in search mode in knots
ReattackMode=1                         	// 0 = None, 1 = Circle

#SelfDestruct
SelfDestructDelay=6                    	// For sonobouy it is a time in seconds while its sonar works <- not used here atm TODO: Decide merge or no