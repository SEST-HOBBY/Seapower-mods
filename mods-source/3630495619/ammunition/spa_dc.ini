[General]
#Depth charge
Type=AirDepthCharge						// Can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW							// Can be AAW, ASuW, ASW

Mass=190								// In kg. Used for aircraft
AmmoPoints=165							// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=DepthChargeImpacts			// Referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
BaseNoise=100							// Base sound level in db at 1m distance
FlowNoise=1								// Additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=1						// Additional noise for cavitation in db
TargetReflectionStrength=14				// In dB for broad side
# Transient
TransientRCS=-1							// Transient visibility on the radar
TransientVisualIdentificationRange=5	// Transient can be visually detected at this distance in nmi
TransientBaseNoise=190					// In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=57
ImpactSize=Medium						// Impact size, can be small, medium, large, verylarge
Penetration=Moderate					// Can be minor, moderate, heavy, always

FuzeProximityDistance=2.0				// For proximity fuze: distance to target in meters
KillProbability=0.1						// Chance to intercept torpedo

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing

[Guidance]
GuidanceType=0
MidCourseCorrection=0					// 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1.5			// Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
SinkRate=2.4							// Sink rate in m/s (for depth charges)
MaxDepth=300							// Max depth in feet (for depth charges)
#========================================= Launch stats ============================================================
MaxVelocity=33							// 100	// Maximum speed in knots
Acceleration=1							// Acceleration factor
MaxTurnRate=3.0							// Maximum turnrate in degrees per second

MinLaunchRange=0.005					// Minimum launch range in nautical miles
MaxLaunchRange=0.2						// Maximum launch range in nautical miles

WarheadReliability=0.97					// Chance that warhead will detonate upon hit

WobblingStrength=1.0					// Amplitude of wobbling
WobblingSpeed=2.0						// Frequency of wobbling
#========================================     Seeker     ===========================================================
CircularErrorRadius=15.0				// Circular error radius in meter
