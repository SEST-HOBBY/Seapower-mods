[Physics]
MuzzleVelocity=845						// Meter per second
MaxRange=6600							// In m
GravityFactor=4
CircularErrorProbable=10				// Radius in meters at max range for shells to impact

[WarheadData]
Power=0.96
ImpactSize=VerySmall					// Impact size, can be Tiny, VerySmall, Small, SemiSmall, Medium, Large, VeryLarge
Penetration=Minor						// Can be Minor, Moderate, Heavy, Always
FuzeProximityDistance=5					// In meters
KillProbability=0.008					// Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[Models]
ResourcesMaterial=shell_mat_red

[Particles]
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi

