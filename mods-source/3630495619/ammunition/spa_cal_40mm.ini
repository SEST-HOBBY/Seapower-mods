[General]
Type=Projectile							// Can be Projectile, Missile, Torpedo
TargetType=AAW							// Can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=2.5								// In kg. Used for aircraft
AmmoPoints=2.5							// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

[Physics]
MuzzleVelocity=1025						// Meter per second
MaxRange=10000							// In m
GravityFactor=2.7
CircularErrorProbable=15				// Radius in meters at max range for shells to impact

[WarheadData]
Power=1.5
ImpactSize=VerySmall					// Impact size, can be Tiny, VerySmall, Small, SemiSmall, Medium, Large, VeryLarge
Penetration=Minor						// Can be Minor, Moderate, Heavy, Always
FuzeProximityDistance=10				// In meters
KillProbability=0.01					// Chance to intercept missile. Relevant for Guns, irrelevant for CIWS
