#!alias ammunition/usn_mk-83.ini
# BRPS-500:  Variante con mayor paracaídas de frenado para bombardeo a baja altitud.
# ver. 20260901
#

Type=Bomb								// Can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW							// Can be AAW, ASuW, ASW

Mass=520								// In kg. Used for aircraft
AmmoPoints=520							// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
IOCDate=1981							// Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=1984							// Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
ParachuteSlowDown=0.99					// Speed damping
ParachuteEndVelocity=50.0				// Slow down end speed in knots of bomb with parachute
MaxAngleWithParachute=80.0				// Defines how steep the angle can become with the parachute

[WarheadData]
WarheadType=0
Power=37								// 150kg de Tritonal frente a 202kg de Mk-83.  37 vs 43 en Mk-83

[Guidance]
InitialFlightPhaseDuration=0.1
MaxTurnRate=10.0						// Maximum turnrate in degrees per second
MinLaunchAltitude=100					// Minimum launch altitude in feet.
MaxLaunchAltitude=40000					// Maximum launch altitude in feet.

[Models]
ResourcesFolder=ammunition/spa_brps-500/
ResourcesRoot=spa_brps-500.obj
ResourcesMesh=brps500
ResourcesMaterial=spa_brps-500_mat.ini

[Particles]
ParachuteEffect=effects/weapons/emitters/parachute_square
ParachuteEffectPosition=0,0,-0.018
