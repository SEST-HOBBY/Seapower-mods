[General]
#Mark 14 mod 3
Type=Torpedo							// Can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW							// Can be AAW, ASuW, ASW

Mass=1388								// In kg. Used for aircraft
AmmoPoints=2316							// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
IOCDate=1930							// Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=1931							// Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3

[SensorData]
BaseNoise=130							// Base sound level in db at 1m distance

[WarheadData]
Power=70
MaxDepth=300							// Maximum allowed depth in feet.

[Guidance]
TerminalVelocity=46						// Maximum speed in knots
Acceleration=10.0						// Acceleration factor
MaxVelocity=46							// Maximum speed in knots

MaxLaunchRange=4.4						// Maximum launch range in nautical miles

SpeedSettings=30.5,46						// Selectable speeds in knots, lowest to highest
SpeedSettingRanges=4.4,2.2				// Full tank range in nautical miles at each of the speeds above

LaunchReliability=84					// The lower the value, the greater risk of misfire or accident (0...100)

DefaultDepth=12							// Default depth in feet a torpedo is using for submerged targets for bearing only launches

[Models]
ResourcesMaterialFolder=ammunition/spa_mk14/
ResourcesMaterial=spa_mk14_mat.ini

