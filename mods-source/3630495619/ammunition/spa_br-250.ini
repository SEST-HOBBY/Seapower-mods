#!alias ammunition/usn_mk-82.ini
# BR-250: Variante convencional con cola fija.
# ver. 20260901
#

Type=Bomb								// Can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW							// Can be AAW, ASuW, ASW

Mass=250								// In kg. Used for aircraft
AmmoPoints=250							// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
IOCDate=1972							// Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=1975							// Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

[WarheadData]
WarheadType=0
Power=32								// 112kg de Tritonal frente a 87kg de Mk-82.  32 vs 28 en Mk-82

[Guidance]
MinLaunchAltitude=100					// Minimum launch altitude in feet.
MaxLaunchAltitude=40000					// Maximum launch altitude in feet.
CircularErrorRadius=15					// Circular error radius in meters

[Models]
ResourcesFolder=ammunition/spa_br-250/
ResourcesRoot=spa_br-250.obj
ResourcesMesh=br250
ResourcesMaterial=spa_br-250_mat.ini
