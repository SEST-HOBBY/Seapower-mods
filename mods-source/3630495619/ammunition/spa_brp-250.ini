#!alias ammunition/usn_mk-82.ini
# BRP-250:  Variante con paracaídas de frenado para bombardeo a baja altitud.
# ver. 20260429
#

Type=Bomb                              	// Can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        	// Can be AAW, ASuW, ASW

Mass=260                               	// In kg. Used for aircraft
AmmoPoints=275                         	// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
ParachuteSlowDown=0.99                  // Speed damping
ParachuteEndVelocity=100.0              // Slow down end speed in knots of bomb with parachute
MaxAngleWithParachute=60.0              // Defines how steep the angle can become with the parachute

[WarheadData]
WarheadType=0
Power=32								// 112kg de Tritonal frente a 87kg de Mk-82.  32 vs 28 en Mk-82

[Guidance]
InitialFlightPhaseDuration=0.1 
MaxTurnRate=5.0                        	// Maximum turnrate in degrees per second
MinLaunchAltitude=100                  	// Minimum launch altitude in feet.
MaxLaunchAltitude=40000                	// Maximum launch altitude in feet.
CircularErrorRadius=15                 	// Circular error radius in meters

[Models]
ResourcesFolder=ammunition/spa_brp-250/
ResourcesRoot=spa_brp-250.obj
ResourcesMesh=brp250
ResourcesMaterial=spa_brp-250_mat.ini

[Particles]
ParachuteEffect=effects/weapons/emitters/parachute_square
ParachuteEffectPosition=0,0,-0.012
