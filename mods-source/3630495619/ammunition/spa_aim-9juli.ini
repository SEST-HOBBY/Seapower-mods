#!alias ammunition/usaf_aim-9j.ini
#https://www.zona-militar.com/foros/threads/el-mirage-f-1er-del-ejercito-del-aire-espa%C3%B1ol.18613/page-2
#https://publicaciones.defensa.gob.es/media/downloadable/files/links/c/l/claex_25_a_os.pdf
# Users: spa_f1c,spa_f1e,spa_fa-18a,spa_ef2000
# ver. 20260822
#
[General]
# AIM-9JULI Sidewinder (1998)
Type=Missile							// Can be Projectile, Missile, Torpedo
TargetType=AAW							// Can be AAW, ASuW, ASW

Mass=82									// In kg. Used for aircraft
AmmoPoints=120							// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True						// For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  					// Referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=3.5			// At what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Warhead Data ----------]

[WarheadData]
WarheadType=0							// 0 = Blast Fragmentation
Power=9
ImpactSize=VerySmall                    // Impact size, can be small, medium, large, verylarge
Penetration=Always                      // Can be minor, moderate, heavy, always

FuzeProximityDistance=5.0               // For proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
InterceptSpeedPenaltyMultiplier=0.75	// Multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
KillProbability=0.85                    // Base chance to hit
[---------- Guidance ----------]
[Guidance]
GuidanceType=1							// 1 = IR Homing
InitialFlightPhaseDuration=0.25         // Time in seconds where the missile moves straight on without guiding
MidCourseCorrection=0					// 0 = None, 1 = Radio Command, 2 = Wire Guided
TerminalApproachDist=1000				// In N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough

#=========================================  Kinematics  ============================================================
ApplyKinematics=True                    // If we should use full kinematics rules. If this is true, we will only use kinematics
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=1400.0						// Maximum speed in knots
MaxTurnRate=24.0                       	// Maximum turnrate in degrees per second - Similar al 9L Vanilla
MaxTurnG=40                       		// Maximum G-limit of missile turns - Similar al 9L Vanilla
AccelerationTime=5.20					// Burn time for initial booster burn
Acceleration=14.0						// Gs of acceleration in initial burn
SustainerAccelerationTime=-1            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=-1                // Acceleration of sustainer burn. -1 if there is no sustainer
DragCoefficient=-1						// Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
TypicalTargetAlt=20000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=300					// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=20000					// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=500				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
VelocityBleed=0.8						// Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=60						// How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MinLaunchRange=0.1						// Minimum launch range in nautical miles
MaxLaunchRange=9.7						// Maximum launch range in nautical miles
MinLaunchAltitude=30					// Minimum launch altitude in feet.
MaxLaunchAltitude=63000					// Maximum launch altitude in feet.
MinAttackAltitude=30					// Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=70000					// Maximum altitude of target, in feet
MaxAttackVelocity=1100					// Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=95					// The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
IsRearAspectOnly=False                  // Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=200                      // Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=4								// Seeker field-of-view in degrees
SeekerGimbalFOV=90						// Seeker gimbal FOV in degrees
SeekerPassiveRange=4.5					// Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#ECCM
AntiCountermeasuresBonus=0.10			// This value substracted from probability of spoofing by countermeasures (0...1)
SelfDestructDelay=4.0

[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usaf_aim-9j
AssetBundleDamagedMesh=
AssetBundleMaterial=usaf_aim-9j_mat
AssetBundleMeshHullCollider=usaf_aim-9j_coll
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=ammunition/spa_aim-9juli/
ResourcesRoot=spa_aim-9juli.obj
ResourcesMesh=spa_aim-9juli
ResourcesMaterialFolder=ammunition/spa_aim-9juli/
ResourcesMaterial=spa_aim-9juli_mat.ini
############################################################
#NumberOfSubModels=0

[Particles]
BoosterEffect=effects/weapons/emitters/aam_small_smokeless_effect
BoosterEffectPosition=0,0,-0.018

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.020
InFlightEffectStartTime=2.0  // In seconds, after that the Inflight Effect will be played if available

# SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
# SustainerEffectPosition=0,0,-0.018
# SustainerEffectStartTime=0.1

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043