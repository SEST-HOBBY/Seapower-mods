#!alias ammunition/usn_rockeye.ini
# BME-330 
# ver. 20260429
#

Type=Bomb                              	// Can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        	// Can be AAW, ASuW, ASW

Mass=330                               	// In kg. Used for aircraft
AmmoPoints=457                         	// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
ParachuteSlowDown=0.99                  // Speed damping
ParachuteEndVelocity=50.0               // Slow down end speed in knots of bomb with parachute
MaxAngleWithParachute=80.0              // Defines how steep the angle can become with the parachute

[WarheadData]
WarheadType=0
Power=29

[Guidance]
InitialFlightPhaseDuration=0.1 
MaxTurnRate=10.0                       	// Maximum turnrate in degrees per second
MinLaunchAltitude=100                  	// Minimum launch altitude in feet.
MaxLaunchAltitude=40000                	// Maximum launch altitude in feet.

[Models]
ResourcesFolder=ammunition/spa_bme-330/
ResourcesRoot=spa_bme-330.obj
ResourcesMesh=bme330
ResourcesMaterial=spa_bme-330_mat.ini

[Particles]
ParachuteEffect=effects/weapons/emitters/parachute_square
ParachuteEffectPosition=0,0,-0.015