Taskforce2_NumberOfIntelItems=0
Taskforce1_IntelligenceTime1=1973,11,25,12,0,0
Taskforce1_IntelligenceItem1=To Commander ASW Dedalo Group\r\n\r\nYour mission is to reach Barcelona port before 21:00 h Zulu.\r\n\r\nA unknown number of Red submarines will oppose your transit to Barcelona, they will try to simulate attacks on your formation.\r\n\r\nUse all your assets to search and simulate attacks on the submarines while transiting to your destination.\r\n\r\nArriving to Barcelona without damage or "sinking" the red submarines will be considered as you winning the exercise.
