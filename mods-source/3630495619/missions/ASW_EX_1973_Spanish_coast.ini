Name=ASW Ex-1973, Spanish coast
Description=Spanish Navy organize an ASW exercise to test its recent purchased material from the US.\r\n \r\nBlue side: Dedalo (Ex US CVL Cabot) with an escort of  4 FRAMM destroyers.\r\n\r\nRed side: two Delfin and one german 205  clase submarine.\r\n \r\nThis is an scenario modified and adapted by Javier Moreno "Jabeitor" from Command Modern Operations to Sea Power with permission from the original author Miguel Molina 'Meroka37' (member of CMANO PdL Design Team), \r\n
