# ------------------ SAM ------------------

usa_mim-104b_mi=MIM-104B,爱国者,面对空导弹,MIM-104爱国者导弹（英语：MIM-104 Patriot）是美国雷神公司制造的中程地对空导弹系统。它取代胜利女神导弹与MIM-23鹰式导弹，成为美军中高空防空武器。爱国者先进能力升级（PAC）第一阶段是为了使爱国者导弹具有反战术弹道导弹的能力进行的地面设备软件升级。

usa_mim-104c_mi=MIM-104C,爱国者,面对空导弹,MIM-104爱国者导弹（英语：MIM-104 Patriot）是美国雷神公司制造的中程地对空导弹系统。它取代胜利女神导弹与MIM-23鹰式导弹，成为美军中高空防空武器。爱国者先进能力升级（PAC）第二阶段进一步改善了地面雷达算法，并且第一次对拦截弹进行了升级。

usa_mim-104d_mi=MIM-104D,爱国者,面对空导弹,MIM-104爱国者导弹（英语：MIM-104 Patriot）是美国雷神公司制造的中程地对空导弹系统。它取代胜利女神导弹与MIM-23鹰式导弹，成为美军中高空防空武器。爱国者先进能力升级（PAC）第二阶段进一步改善了地面雷达算法，并且第一次对拦截弹进行了升级。制导增强型导弹（Guidance Enhanced Missiles，GEM）于1996年开始装备，编号为MIM-104D。主要改进内容包括4点：改进导弹的动力装置、引信和C波段前置接收机，从而提高了导弹的射程、射高和制导精度，使其能够拦截射程达600公里的战术弹道导弹。

usa_mim-104e_mi=MIM-104E,爱国者,面对空导弹,MIM-104爱国者导弹（英语：MIM-104 Patriot）是美国雷神公司制造的中程地对空导弹系统。它取代胜利女神导弹与MIM-23鹰式导弹，成为美军中高空防空武器。制导增强型导弹（Guidance Enhanced Missiles，GEM）于1996年开始装备，GEM进一步升级为GEM-T（MIM-104E），加装了一个Ka波段毫米波主动雷达制导头，使引导头成为采用半主动C波段雷达制导头与主动制导头相结合的双模制导头。

usa_mim-104f_mi=MIM-104F,爱国者,面对空导弹,MIM-104爱国者导弹（英语：MIM-104 Patriot）是美国雷神公司制造的中程地对空导弹系统。它取代胜利女神导弹与MIM-23鹰式导弹，成为美军中高空防空武器。第三阶段PAC-3(3)系统采用了体积更小，具有主动雷达制导引导头和直接动能碰撞（KKV）战斗部的新型专用弹道导弹拦截弹ATM2，也可同时之前系统的拦截弹兼容。

