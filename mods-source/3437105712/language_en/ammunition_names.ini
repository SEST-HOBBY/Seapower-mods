# ------------------ SAM ------------------

usa_mim-104b_mi=MIM-104B,Patriot,SAM,The MIM-104 Patriot is a mobile interceptor missile surface-to-air missile (SAM) system, the primary such system used by the United States Army and several allied states.Patriot Advanced Capability (PAC-1), known today as the PAC-1 upgrade, was a software-only upgrade. The most significant aspects of this upgrade were changing the way the radar searched and the way the system defended its assets.

usa_mim-104c_mi=MIM-104C,Patriot,SAM,The MIM-104 Patriot is a mobile interceptor missile surface-to-air missile (SAM) system, the primary such system used by the United States Army and several allied states.PAC-2 saw Patriot's first major missile upgrade, with the introduction of the MIM-104C, or PAC-2 missile. This missile was optimized for ballistic missile engagements. 

usa_mim-104d_mi=MIM-104D,Patriot,SAM,The MIM-104 Patriot is a mobile interceptor missile surface-to-air missile (SAM) system, the primary such system used by the United States Army and several allied states.The main upgrade to the original GEM missile was a new, faster proximity fuzed warhead.

usa_mim-104e_mi=MIM-104E,Patriot,SAM,The MIM-104 Patriot is a mobile interceptor missile surface-to-air missile (SAM) system, the primary such system used by the United States Army and several allied states.The GEM-T was given a new fuze which was further optimized against ballistic missiles and a new low noise oscillator which increases the seeker's sensitivity to low radar cross-section targets.

usa_mim-104f_mi=MIM-104F,Patriot,SAM,The MIM-104 Patriot is a mobile interceptor missile surface-to-air missile (SAM) system, the primary such system used by the United States Army and several allied states.The PAC-3 upgrade carried with it a new missile design, nominally known as MIM-104F and called PAC-3 by the Army.Due to miniaturization, a single canister can hold four PAC-3 missiles, as opposed to one PAC-2 missile per canister. 

