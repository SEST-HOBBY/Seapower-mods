; Add variation to any response without code changes.
; Put '|' separated alternatives in one key. They replace the internal list for that key.
; Keys checked:
;   Responses/Hail_Comply, Responses/Redirect_Comply, Responses/Generic_Comply
;   Responses/<Phrase>_Refuse  (e.g. Hail_Refuse, Warning_Refuse, Surrender_Refuse)
; Example (uncomment to use):
;Hail_Comply=This is {name}. We identify ourselves. That is all.|{sender}, this is {name}. Identity confirmed.|This is {name}. Name and flag provided. Over.

[Watch]
; Ship's-own-life ambience (Ambience tab feed, never the Event Log). Merged from UnpaidFlavor.
Enabled=true
BellsEnabled=true
IntervalMinutes=240
Pools=Japan
UseCommanderPool=true
SuppressInCombat=true
CombatDeferMinutes=10

[Chatter]
; Periodic staff chatter into the Ambience tab feed. | separates alternatives.
Generic=Bridge: course {course:D3} steady, speed {speed} knots.|CIC: no new contacts, sweeping sector {sector}.|TAO: routine status report - all stations manned and ready.|Helm: rudder amidships, steady as she goes.|Engine: answering {speed} knots, plant steady.|Lookout: visibility {vis} miles, horizon clear.|Ops: watch turnover complete, new watch has the conn.|Radio: routine comms check on {shipName}, channel clear.|{officer}: {shipName} steady on course {course:D3}.
Anchored=Deck: anchor watch reports chain holding at {scope}m scope on {shipName}.|Bosun: anchor lights rigged, watch posted fore and aft on {shipName}.|Bridge: {shipName} at anchor, swinging to {course:D3}, engines on standby.|{officer}: anchor watch steady, {shipName} holding.
Misc=Galley: {officer} reports coffee ready on {shipName}.|Deck: {shipName} swabbing complete, {officer} inspecting.
Enabled=true
MinIntervalSec=180
MaxIntervalSec=480
Chance=0.35
RequiresPlayerVessel=true
SuppressInCombat=true
SuppressDuringIdxActivity=true

[ChatterShip]
Generic=Bridge: {shipName} steady on course {course:D3}, speed {speed} knots.|CIC: surface search sweeping sector {sector}, no new contacts.|Helm: rudder amidships on {shipName}, steady as she goes.|Engine: answering {speed} knots, plant steady on {shipName}.|Lookout: horizon clear from {shipName}, visibility {vis} miles.
Anchored=Deck: {shipName} anchor watch reports chain at {scope}m, holding well.|Bosun: anchor lights rigged on {shipName}, watch posted fore and aft.|Bridge: {shipName} at anchor, swinging to {course:D3}, engines on standby.

[ChatterSub]
Generic=Sonar: {shipName} bearing {course:D3} faint contact, holding.|Diving Officer: {shipName} depth steady, trim good.|Control: rig for ultra-quiet on {shipName}, bearing {course:D3}.|Sonar: no transient contacts on {shipName}, sea state quiet.
Anchored=Control: {shipName} at periscope depth, holding station.|Sonar: {shipName} moored, quiet on the berth.

[ChatterAir]
Generic=Tower: {shipName} pattern clear, orbit sector {sector}.|Pilot: {shipName} on station, course {course:D3} steady.|Crew: {shipName} fuel state good, continuing patrol.
Anchored=Tower: {shipName} chocked and chained, rotors secured.|Deck: {shipName} tied down, winds {speed} knots across the deck.