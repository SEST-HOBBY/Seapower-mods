# IFF Transponder - minimal ELINT mimic for 3-taskforce + Allied 4th-side
# Ka-Band chosen because vanilla almost never uses it (only TestAirSearchRadar). Clean squawk channel.
# Transponder = always-on low-power Radar (beacon). Interrogator = passive ESM listening only on Ka-Band.
# Workflow: add IFF_Transponder_NATO to civ/friendly you want protected, add IFF_Interrogator_NATO to your shooters.
# DLL then blocks isValidTarget/DoesAmmoMatchTarget if interrogator sees transponder echo at ~ Radar horizon.
# No Kind=IFF - keeps Loader happy (SensorMetadataProvider only handles Radar/Sonar/ESM/ECM/Visual/MAD/LaserDesignator).

[IFF_Transponder_NATO]
# NATO squawk - beacon, intentionally weak so ESM range ~37km (Type1010 model) not global
Kind=Radar
Type=Search
HasDataLink=False
Role=AirAndSurface
Mode=Illuminate
RotationDirection=1
TargetChannels=0
WeaponChannels=0
RPM=12
MinRange=0
MaxRange=37           # beacon range = ESM detection horizon, matches Type1010 IFF: sines.ini:7769
MinAltitude=0
MaxAltitude=30480
RangeResolution=1500.0
BeamWidth=12
Gain=15               # low gain = low RCS, but ESM gain handles detection
Frequency=Ka-Band     # squawk channel
PeakPower=2.0         # like Type1010, detectable but not a search radar
ModuleType=SmallSensor
# custom flags for DLL, ignored by vanilla IniHandler
Transponder=True
IFFCode=NATO

[IFF_Transponder_WP]
Kind=Radar
Type=Search
HasDataLink=False
Role=AirAndSurface
Mode=Illuminate
RotationDirection=1
TargetChannels=0
WeaponChannels=0
RPM=12
MinRange=0
MaxRange=37
MinAltitude=0
MaxAltitude=30480
RangeResolution=1500.0
BeamWidth=12
Gain=15
Frequency=K-Band      # second channel for WP/hostile spoof separation
PeakPower=2.0
ModuleType=SmallSensor
Transponder=True
IFFCode=WP

[IFF_Interrogator_NATO]
# NATO interrogator - passive ESM, only Ka-Band. Detects IFF_Transponder_NATO echo via RadarCalculator.getSignalStrength
Kind=ESM
Gain=12
HasDataLink=True
AngularResolution=10.0
Frequencies=Ka-Band   # only this channel - friendly beacon
OverHorizonMultiplier=2.0  # ~2x radar horizon for OTH ESM, tune for 40-80km interrogation
IdentificationRate=5.0     # fast - vs 0.15 WLR-1: sines.ini:4500
ModuleType=SmallSensor
Interrogator=True
IFFCode=NATO

[IFF_Interrogator_WP]
Kind=ESM
Gain=12
HasDataLink=True
AngularResolution=10.0
Frequencies=K-Band
OverHorizonMultiplier=2.0
IdentificationRate=5.0
ModuleType=SmallSensor
Interrogator=True
IFFCode=WP

# Civilian default - add to your mission's civ ships if you want them protected by NATO interrogators
[IFF_Civil_Transponder]
Kind=Radar
Type=Search
HasDataLink=False
Role=AirAndSurface
Mode=Illuminate
RPM=12
MinRange=0
MaxRange=25
MinAltitude=0
MaxAltitude=5000
RangeResolution=1500.0
BeamWidth=12
Gain=10
Frequency=Ka-Band
PeakPower=1.0
ModuleType=SmallSensor
Transponder=True
IFFCode=NATO
