Taskforce1startMessage=Title=To Deckhands and Fellow Privateers\nBody=The Malacca Strait - the richest hunting ground in Asia, and the patrols know it. A full SAG is working the channel: a Knox, two ex-RVNN Barnegats, a Pegasus and a Blackwood, with air cover out of the local base. Good news: our backers came through - a frigate is waiting at the anchorage. Bring her.\n\nThis is the big one.\nButtonText=Start mission\nPopupStyle=Intro
