Taskforce1startMessage=Title=To Deckhands and Fellow Privateers\nBody=You are famous now - so famous the Americans and the Soviets stopped shooting at each other to come shoot at YOU. Both patrols are in the Strait, aircraft overhead, radars on both shores. Transit the Strait. Stay quiet, stay fast, and do not stop for anything.\n\nLive through this and you are legends.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1endMessage=Title=To Deckhands and Fellow Privateers\nBody=Through the Strait. They threw everything and we are still floating. Drink.\nButtonText=Continue playing\nPopupStyle=Outro
