
[Language_en]
Name=Leviathan
Description=Your continuous movement towards SEA has been tracked down by US Intelligence. Both Superpowers have decided to set everything aside for now to focus on making sure that you, a flotilla of "undertrained, conscripted evildoers and criminals" are sunk to the bottom of the ocean. Your survival is not guaranteed.
