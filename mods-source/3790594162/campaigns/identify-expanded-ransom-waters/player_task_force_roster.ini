; RANSOM WATERS - pirate flotilla roster (VANILLA ONLY)
; Only pirate-usable small craft from the base game: go-fast, gun/patrol boats,
; torpedo boats, smaller missile boats, and one small corvette + hydrofoil.
; Task Force Builder checks this file first; missions further restrict via TaskForceModeAllowedRosterUnits in campaign.ini.
; Syntax: <unit_type>=<variant>|<points_cost>  (variants pinned to Variant1-2/4 for sanity; full counts noted)
; Explicit costs override defaults - tuned so a starting flotilla hurts and the Alvand must be saved for.
; Starting pool (Moderate) is 350: e.g. Osa 90 + Shershen 55 + 2x Zhuk 80 + Boghammar 30 = 255, rest is repair reserve.
; All units below resolve to original/vessels (base game).

[AllowedVessels]
; Boghammar go-fast - cheap eyes and boarders
ir_fab_boghammar=Variant1|30
; Kaivan patrol boat
ir_pt_kaivan=Variant1,Variant2,Variant3,Variant4|45
; Parvin patrol boat
ir_pt_parvin=Variant1,Variant2,Variant3|45
; Kaivan gunboat
ir_ptg_kaivan=Variant1,Variant2|45
; Zhuk patrol boat (22 variants exist, pinned to 2)
wp_pb_zhuk=Variant1,Variant2|40
; Zhuk Middle-East fit - mission 01 placeholder hull (50 variants exist, pinned to 2)
wp_pb_zhuk_ME=Variant1,Variant2|40
; Shershen torpedo boat (71 variants exist, pinned to 2)
wp_pt_shershen=Variant1,Variant2|55
; Turya torpedo boat (28 variants exist, pinned to 2)
wp_pt_turya=Variant1,Variant2|55
; Komar missile boat (9 variants exist, pinned to 2)
wp_ptg_komar=Variant1,Variant2|70
; Osa-I missile boat (144 variants exist, pinned to 2)
wp_ptg_osa1=Variant1,Variant2|90
; Tarantul missile corvette/boat (13 variants exist, pinned to 2)
wp_ptg_tarantul=Variant1,Variant2|90
; Tiger missile boat (20 variants exist, pinned to 2)
fgs_ptg_tiger=Variant1,Variant2|90
; Hauk missile boat (14 variants exist, pinned to 2)
knm_ptg_hauk=Variant1,Variant2|90
; Bayandor corvette (4 variants exist, pinned to 2)
ir_pf_bayandor=Variant1,Variant2|130
; Pegasus missile hydrofoil (6 variants exist, pinned to 2)
usn_phm_pegasus=Variant1,Variant2|140
; Alvand frigate - UNLOCKED FROM M4 ONWARD (4 variants exist, pinned to 2)
; Gated by per-mission TaskForceModeAllowedRosterUnits, NOT by this file
; Priced at a full campaign of savings: ~3 missions of rewards after flotilla upkeep
ir_ffg_alvand=Variant1,Variant2|350

; SELL OUT TRACK - better tech, offered only on loop-2 / M6-B builders and later
; Gated by per-mission TaskForceModeAllowedRosterUnits, NOT by this file
; Barnegat tender - helo truck and pirate mothership (4 Philippine variants, all in)
usn_avp_barnegat_mod=Variant1,Variant2,Variant3,Variant4|150
; Garcia gun frigate with a real deck (10 variants exist, pinned to 2)
usn_ff_garcia=Variant1,Variant2|450

; PRIZE HULLS - sale-value test, NOT purchasable
; Same variants the M1/M2 merchants sail. Kept OUT of every mission allowlist,
; so the builder can never sell them - the roster price exists only so dismissal
; valuation has a number to work with. Flat 60 for the test; flavor-price later.
; If captures still sell for 1pt, valuation ignores roster price (paid-cost only).
civ_ms_amra=Variant13,Variant4|60
civ_ms_c8=Variant26,Variant7|60
civ_ms_freighter_a=Variant10,Variant33|60
civ_ms_murom=Variant16,Variant5|60
civ_ms_super_p=Variant14,Variant3|60


[AllowedSubmarines]
; Pirates have no submarines in Ransom Waters - left empty intentionally.
; Syntax if needed: <unit_type>=<variant>,<variant>|<points_cost>

[LoadoutPrices]
; Syntax: <unit_type>=<loadout_name>,<points_cost>|<loadout_name>,<points_cost>
; Aircraft loadouts are included in the aircraft purchase cost


[AllowedHelicopters]
; Old, tiny, pirate-compatible whirlybirds - fit Bayandor/Alvand decks.
; Squadron IDs mirror the vanilla Pacific Strike roster (proven valid).
; Syntax: <unit_type>=<squadron>,<squadron>|<points_cost_per_aircraft>
; Alouette II (1956!) - eyes and liaison, fits anywhere
rw_alouette_II=Squadron10|10
; QH-50D DASH drone (1960s) - expendable scout
rw_qh-50d=Squadron2|10
; SH-2F Seasprite (1960s) - proper ASW/ASuW helo for the frigate
rw_sh-2f=Squadron8|20
; SH-3H Sea King (1960s) - big lifter, Alvand deck only
rw_sh-3h=Squadron1|25


[AllowedAircraft]
; Pirates have no military fixed-wing - but civilian spotter planes are deniable.
; Squadron1 refs work for civ airframes (proven by Task Force ALL UNLOCKED roster).
; Syntax: <unit_type>=<squadron>,<squadron>|<points_cost_per_aircraft>
; Bonanza spotter - cheap eyes
rw_v35=Squadron1|15
; Cessna 340 twin - longer legs, pricier
rw_c340=Squadron1|25
