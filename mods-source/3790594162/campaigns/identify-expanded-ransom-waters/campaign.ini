Name_en=LEVIATHAN
MissionSequenceName_en=MISSION 5
MapShortName_en=05
Description_en=Strait of Malacca (transit)
MissionImage_en=campaigns/identify-expanded-ransom-waters/art/pacific_strike_05_sheet.png
MissionIntro_en=You are infamous now - so infamous the Americans and Soviets stopped shooting at each other to come shoot at you. An Adams missile destroyer, a Knox, a Pegasus, a Kashin, a Krivak and an Osa work the Strait, with Orions and Mays overhead and radars on both shores. Transit the Strait. Do not stop for anything.
MissionWarningPopup_en=DEPLOYMENT ADVISORY|Command recommends dispersing the task force deployment for this operation. Heavy weather will aid concealment, but a compact formation of radar contacts may allow enemy reconnaissance to classify the task force before the coordinated strike. Are you sure you want to proceed?|I have dispersed my task force, start mission|Return to deployment planning
MissionResupplyRules_en=Task Force will be operating away from resupply for this mission. Anti-ship missiles and weapons expended cannot be replaced - spend them wisely.
TaskForceModeBuilderSituation_en=At the far end of the strait. Two navies are waiting inside it - quiet boats and long-range weapons only. The Alvand is not optional anymore.

Name_ru=Охота на монстра
MissionSequenceName_ru=МИССИЯ 5
MapShortName_ru=05
Description_ru=Дарвин, Австралия
MissionIntro_ru=После отступления союзных войск к Австралии противник пытается воспользоваться своим преимуществом, отправив в Индийский океан мощную эскадру, центром которой является тяжёлый крейсер «Киров». Это соединение было обнаружено прошлой ночью в Ломбокском проливе и, вероятно, движется на восток, для ведения боевых действий возле Австралии. Используйте все доступные силы союзников, находящиеся на этом театре военных действий, чтобы найти и потопить «Киров» и его эскорт.
MissionResupplyRules_ru=Ваша группа действует в зоне базы снабжения. После миссии вам будет доступен ремонт и планировщик группы. Боекомплект будет автоматически восполнен.

Name_de=ANGRIFF AUF DAS MONSTER
MissionSequenceName_de=MISSION 5
MapShortName_de=05
Description_de=Vor Broome, Australien
MissionImage_de=campaigns/identify-expanded-ransom-waters/art/pacific_strike_05_sheet.png
MissionIntro_de=Nachdem die alliierten Kräfte bis nach Australien zurückgedrängt wurden, versucht der Feind, seinen Vorteil auszunutzen, indem er einen schweren Kampfverband um den Schlachtkreuzer Kirov in den Indischen Ozean verlegt. Dieser Verband wurde vergangene Nacht beim Durchqueren der Lombokstraße aufgeklärt und bewegt sich vermutlich nach Osten, um Australien zu bedrohen. Nutzen Sie sämtliche verfügbaren alliierten Marinekräfte im Einsatzraum, um die Kirov und ihre Begleitschiffe aufzuklären und zu vernichten.

Name_ja=巨獣への一撃
MissionSequenceName_ja=MISSION 5
MapShortName_ja=05
Description_ja=オーストラリア、ブルーム沖
MissionImage_ja=campaigns/identify-expanded-ransom-waters/art/pacific_strike_05_sheet.png
MissionIntro_ja=同盟軍がオーストラリアへ後退させられた中、敵はこの優位を利用すべく、巡洋戦艦キーロフを中心とする有力な襲撃部隊をインド洋へ投入した。この部隊は昨夜、ロンボク海峡を通過したのが探知されており、オーストラリアを脅かすため東進中であるとみられる。戦区内のすべての同盟軍海軍資産を動員し、キーロフと護衛艦艇を捜索・撃沈せよ。
MissionResupplyRules_ja=本ミッションの終了後、任務部隊の兵装は完全に再補給され、修理施設および増援が利用可能となる。

