Name_en=SHIPS ARE FREE
MissionSequenceName_en=MISSION 2
MapShortName_en=02
Description_en=Northern Mozambique Channel
MissionImage_en=campaigns/identify-expanded-ransom-waters/art/pacific_strike_02_sheet.png
MissionIntro_en=More fat merchants crossing the hunting grounds - but a lone gun destroyer has started patrolling the sea lanes. She is big guns and old sensors: stay out of her gun range, work the merchants with hail and surrender demands, and use torpedoes or Styx if she comes looking for you.
MissionResupplyRules_en=After this mission, your flotilla will be fully rearmed, with repair facilities and reinforcements available.
TaskForceModeBuilderSituation_en=Still operating from the quiet anchorage. The patrols have noticed us - expect warships from here on.

Name_ru=Бой в Тайваньском проливе
MissionSequenceName_ru=МИССИЯ 2
MapShortName_ru=02
Description_ru=Остров Дунъинь, рядом с Китаем
MissionImage_ru=campaigns/identify-expanded-ransom-waters/art/pacific_strike_02_sheet.png
MissionIntro_ru=В рамках боевых действий в западной части Тихого океана НОАК начала наступательную операцию против островов в Тайваньском пролие. Вам приказано нанести удар по китайскому десанту, приближающемуся к острову Дунъинь. Выдвигайтесь к западу от Окинавы, атакуйте и уничтожте силы вторжения.
MissionResupplyRules_ru=Ваша группа действует в зоне базы снабжения. После миссии вам будет доступен ремонт и планировщик группы. Боекомплект будет автоматически восполнен.

Name_de=GEFECHT IN DER TAIWANSTRASSE
MissionSequenceName_de=MISSION 2
MapShortName_de=02
Description_de=Insel Dongyin, vor der Küste Chinas
MissionImage_de=campaigns/identify-expanded-ransom-waters/art/pacific_strike_02_sheet.png
MissionIntro_de=Während im gesamten westlichen Pazifik Kampfhandlungen im Gange sind, haben die Chinesen die Gelegenheit genutzt, eine Offensive gegen die von den Nationalisten gehaltenen Inseln in der Taiwanstraße zu starten. {TaskForceName} hat den Auftrag erhalten, chinesische Landungstruppen anzugreifen, die sich der Insel Dongyin nähert. Verlegen Sie von Okinawa aus nach Westen und bekämpfen Sie alle gegnerischen Kräfte.

Name_ja=台湾海峡の戦闘
MissionSequenceName_ja=MISSION 2
MapShortName_ja=02
Description_ja=中国沿岸、東引（ドンイン）島
MissionImage_ja=campaigns/identify-expanded-ransom-waters/art/pacific_strike_02_sheet.png
MissionIntro_ja=西部太平洋全域で敵対行動が開始される中、中国軍はこの機に乗じて台湾海峡の国民党支配下の諸島に対する攻勢作戦を発動した。貴官は東引島へ接近しつつある中国軍揚陸部隊への打撃任務を命じられた。沖縄から西進し、この侵攻部隊を捕捉・撃滅せよ。
MissionResupplyRules_ja=本ミッションの終了後、任務部隊の兵装は完全に再補給され、修理施設および増援が利用可能となる。

