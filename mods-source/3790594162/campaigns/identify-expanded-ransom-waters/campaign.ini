MapShortName_ru=03
Description_ru=К западу от Палавана, Филиппинские острова
MissionIntro_ru=Ваша оперативная группа выводится с Окинавы и должна отправиться на юг, чтобы присоединиться к обороне Сингапура. Пройдите по Палаванскому проливу, чтобы достигнуть Сандакана и присоединиться к формирующейся там группе подкрепления. Ожидайте засады вражеских подводных лодок.
MissionResupplyRules_ru=Ваша оперативная группа действует в отрыве от баз снабжения. Ремонт и пополнение боекомплекта недоступны. Используйте ваши ресурсы осмотрительно.

Name_de=DURCHFAHRT DURCH DIE PALAWAN-PASSAGE
MissionSequenceName_de=MISSION 3
MapShortName_de=03
Description_de=Westlich von Palawan, Philippinische Inseln
MissionImage_de=campaigns/identify-expanded-ransom-waters/art/pacific_strike_03_sheet.png
MissionIntro_de=Ihre Task Force muss von Okinawa nach Süden verlegen, um sich der Verteidigung Singapurs anzuschließen. Durchqueren Sie die Palawan-Passage, erreichen Sie Sandakan und schließen Sie sich dort den alliierten Verbänden an. Es ist mit starkem Widerstand durch U-Boote zu rechnen. Hinweis: Aufgrund der kurzfristigen Durchführung dieser Operation stehen in Sandakan keine Kapazitäten für eventuelle Reparaturen oder eine Wiederbewaffnung zur Verfügung. Setzen Sie Ihre Munition mit Bedacht ein.

Name_ja=パラワン海峡突破
MissionSequenceName_ja=MISSION 3
MapShortName_ja=03
Description_ja=フィリピン諸島、パラワン島西方
MissionImage_ja=campaigns/identify-expanded-ransom-waters/art/pacific_strike_03_sheet.png
MissionIntro_ja=沖縄の配備を解かれた任務部隊は、シンガポール防衛に加わるため南下しなければならない。パラワン海峡を強行突破してサンダカンへと到達し、同地で編成中の同盟軍増援部隊に合流せよ。敵潜水艦による激しい抵抗が予想される。
MissionResupplyRules_ja=本ミッション中、任務部隊は補給および修理施設から離れて作戦行動を行うことになる。兵器の消費は計画的に行え。

