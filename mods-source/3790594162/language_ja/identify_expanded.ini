[Transmissions]
Hail=こちら {senderAffiliation} {senderName}。身元を特定し、意図を報告せよ。
Warning=こちら {senderAffiliation} {senderName}。これは警告である：貴艦は現在 {senderAffiliation} の管轄下にある海域に侵入している。 {WarningSuffix}
WarningSuffix_Polite=意図を報告されたい。
WarningSuffix_Neutral=意図を報告せよ。
WarningSuffix_Aggressive=直ちに針路を変更せよ。さもなくば相応の報いを受けることになる。
Redirect={name}、こちら {senderAffiliation} {senderName}。これは警告である：貴艦は {senderAffiliation} の管轄下にある海域に侵入している。 {RedirectSuffix}
RedirectSuffix_Polite=方位 {awayBearing} へ転進することを命令する。
RedirectSuffix_Neutral=方位 {awayBearing} へ転進せよ。
RedirectSuffix_Aggressive=直ちに方位 {awayBearing} へ転進せよ。繰り返す、直ちにだ。
Destination={name}、こちら {senderAffiliation} {senderName}。出港地および目的地を報告されたい。 {DestinationSuffix}
DestinationSuffix_Polite=情報を提供していただければ幸いである。
DestinationSuffix_Neutral=これは {senderAffiliation} の方針に基づく要求である。
DestinationSuffix_Aggressive=直ちに回答せよ。
Cargo={name}、こちら {senderAffiliation} {senderName}。積載貨物および当海域における目的を申告されたい。 {CargoSuffix}
CargoSuffix_Polite=情報を提供していただければ幸いである。
CargoSuffix_Neutral=これは {senderAffiliation} の方針に基づく要求である。
CargoSuffix_Aggressive=直ちに完全な申告を行え。
Stop={name}、こちら {senderAffiliation} {senderName}。直ちに機関を停止し、停船（ヒーブ・トゥ）せよ。 {StopSuffix}
StopSuffix_Polite=次の指示を待たれたい。
StopSuffix_Neutral=次の指示を待て。
StopSuffix_Aggressive=従わない場合は敵対行為とみなす。
Speed=こちら {senderAffiliation} {senderName}。接近速度が速すぎる。直ちに速度を半減せよ。 {SpeedSuffix}
SpeedSuffix_Polite=次の指示をお待ちいただきたい。
SpeedSuffix_Neutral=次の指示を待て。
SpeedSuffix_Aggressive=我々に強硬手段をとらせるな。
FinalWarning={senderAffiliation} {senderName} から {name} へ。これは最終警告である。貴艦は {senderAffiliation} の警戒海域に侵入している。直ちに針路変更を行い、身元と意図を明確に報告せよ。さもなくば攻撃を開始する。
StandDown={senderAffiliation} {senderName} から {name} へ。貴艦の射撃指揮レーダーが当艦を捉えている。直ちにロックオンを解除し、兵装を安全状態にせよ。 {StandDownSuffix}
StandDownSuffix_Polite=当方としては事態のエスカレーションを望まない。
StandDownSuffix_Neutral=責任は貴艦にある。
StandDownSuffix_Aggressive=いかなるロックオンも敵対行為とみなす。
Acknowledge=こちら {senderAffiliation} {senderName}。身元を確認、通航を許可する。現在の針路を維持して進行されたい。以上。
ExecuteRam={senderAffiliation} {senderName} から {name} へ。貴艦は我が領海を侵犯している。当艦は衝角（ラム）攻撃を実施する。衝撃に備えよ！ {ExecuteRamSuffix}
ExecuteRamSuffix_Polite=直ちに針路を変更されたい。
ExecuteRamSuffix_Neutral=警告はしたぞ。
ExecuteRamSuffix_Aggressive=押し出してやる！
PaintFCR={senderAffiliation} {senderName} から {name} へ。貴艦を射撃指揮レーダーで照射中。ロックオン完了。直ちに離脱せよ。 {PaintFCRSuffix}
PaintFCRSuffix_Polite=反転離脱せよ、然ればロックオンを解除する。
PaintFCRSuffix_Neutral=照射中である。応答せよ。
PaintFCRSuffix_Aggressive=攻撃前の最終警告だ。
AimGuns={senderAffiliation} {senderName} から {name} へ。当艦の主砲は貴艦を捉えている。直ちに針路を変更せよ。 {AimGunsSuffix}
AimGunsSuffix_Polite=反転離脱せよ、然れば砲の照準を外す。
AimGunsSuffix_Neutral=照準中である。応答せよ。
AimGunsSuffix_Aggressive=攻撃前の最終警告だ。
WarningShot={senderAffiliation} {senderName} から {name} へ。艦首へ警告射撃を行う。直ちに停船せよ。 {WarningShotSuffix}
WarningShotSuffix_Polite=機関を停止し指示を待たれたい。
WarningShotSuffix_Neutral=次弾は直撃させる。
WarningShotSuffix_Aggressive=次の斉射は外さない。
AdvisoryNav={name}、こちら {senderAffiliation} {senderName}。航行勧告：貴艦の位置に航行上の危険あり、針路変更を勧告する。 {AdvisorySuffix}
AdvisoryWeather={name}、こちら {senderAffiliation} {senderName}。気象勧告：航路上で荒天が予想される。 {AdvisorySuffix}
AdvisoryTraffic={name}、こちら {senderAffiliation} {senderName}。海上交通勧告：周囲の交通量が多いため、警戒を怠るな。 {AdvisorySuffix}
AdvisoryDiplomatic={name}、こちら {senderAffiliation} {senderName}。外交勧告：当海域は外交的制限下にあるため、注意して現在の針路を維持されたい。 {AdvisorySuffix}
AdvisoryMilitary={name}、こちら {senderAffiliation} {senderName}。軍事勧告：当海域にて軍事作戦が展開中であるため、距離を置くよう勧告する。 {AdvisorySuffix}
AdvisorySuffix_Polite=注意して進行されることを勧告する。
AdvisorySuffix_Neutral=注意して進行せよ。
AdvisorySuffix_Aggressive=必要に応じて直ちに針路変更せよ。

