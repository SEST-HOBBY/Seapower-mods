[ResponseVariations]
; Add variation to any response without code changes.
; Put '|' separated alternatives in one key. They replace the internal list for that key.
; Keys checked:
;   Responses/Hail_Comply, Responses/Redirect_Comply, Responses/Generic_Comply
;   Responses/<Phrase>_Refuse  (e.g. Hail_Refuse, Warning_Refuse, Surrender_Refuse)
