[Vars]
OrgName=Katsuragi Security Service
; Fixed redirect heading: 0 = auto (random ±25° from bearing to target), 1-359 = fixed bearing. Set in [Vars].
;RedirectBearing=0
TtsEnabled=false
; Prerecorded bridge voiceover for OUR orders/challenges (audio/voiceover/**).
; false = text log only — no sound when issuing commands or challenges.
; Hot-reloads while playing: flip this line and it applies within ~1 s. No restart.
VoiceEnabled=true
; Surrendered-enemy-crew rescue ledger for campaigns (boarding/mission-end crediting).
; false = don't open rescue ledgers on surrender.
CrewRescueEnabled=true
; Bridge audio distance echo: far ships get a distance-blended echo character
; (dry up close, ringing far away). false = plain volume falloff only.
BridgeEchoEnabled=true
; Bottom-bar Contact Registry button (nested in the Formation Manager cell). false = hide the registry UI entirely.
BottomBarButton=true
; Optional Sea Power AI Advisor bridge: lets the advisor's LLM issue comms orders
; (hail/redirect/stop/...) through Identify Expanded. false = no bridge.
AdvisorBridge=true
; Political tension / DEFCON - mission-wide compliance scaler.
; Levels: CORDIAL (DEFCON5, peacetime +22% compliance) | CALM (DEFCON4 +10%) | TENSE (DEFCON3 default) | CRISIS (DEFCON2 -12%) | WAR (DEFCON1 -28% war, minimal compliance)
; Aliases: DEFCON5..1, numbers 5..1, CORDIAL/CALM/TENSE/CRISIS/WAR, also FLASHPOINT for TENSE
; Mission-editor: put [IdentifyExpanded] Tension=TENSE (or DEFCON=3) in your .mission file, or via passthrough.
; The registry overlay can live-change tension for testing.
Tension=TENSE
