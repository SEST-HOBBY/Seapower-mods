[Transmissions]
Hail=This is {senderAffiliation} {senderName}. Please identify yourself and state intent.
Warning=This is {senderAffiliation} {senderName}. This is a warning: you are intruding in an area currently under jurisdiction of the {senderAffiliation}. {WarningSuffix}
WarningSuffix_Polite=State your intentions.
WarningSuffix_Neutral=State your intentions.
WarningSuffix_Aggressive=Alter course immediately or face consequences.
Redirect={name}, This is {senderAffiliation} {senderName}. This is a warning: you are intruding in an area currently under jurisdiction of {senderAffiliation}. {RedirectSuffix}
RedirectSuffix_Polite=You are ordered to redirect to bearing {awayBearing}.
RedirectSuffix_Neutral=You are ordered to redirect to bearing {awayBearing}.
RedirectSuffix_Aggressive=You are ORDERED to redirect to bearing {awayBearing} IMMEDIATELY.
Destination={name}, This is {senderAffiliation} {senderName}. Please state your port of origin and intended destination. {DestinationSuffix}
DestinationSuffix_Polite=We would appreciate the information.
DestinationSuffix_Neutral=This is according to {senderAffiliation} Policy.
DestinationSuffix_Aggressive=It is important that you answer.
Cargo={name}, This is {senderAffiliation} {senderName}. Please declare your cargo and purpose in this area. {CargoSuffix}
CargoSuffix_Polite=We would appreciate the information.
CargoSuffix_Neutral=This is according to {senderAffiliation} Policy.
CargoSuffix_Aggressive=Full declaration required immediately.
Stop={name}, This is {senderAffiliation} {senderName}. You are ordered to STOP ENGINES and HEAVE TO immediately. {StopSuffix}
StopSuffix_Polite=Await further instructions.
StopSuffix_Neutral=Await further instructions.
StopSuffix_Aggressive=Failure to comply will be considered hostile.
Speed=This is {senderAffiliation} {senderName}. You are closing too fast. Reduce speed {speedOrder} immediately. {SpeedSuffix}
SpeedSuffix_Polite=Please await further instructions.
SpeedSuffix_Neutral=Await further instructions.
SpeedSuffix_Aggressive=Do not force our hand.
SpeedUp=This is {senderAffiliation} {senderName}. You are ordered to increase speed {speedOrder} and proceed on your current course. {SpeedUpSuffix}
SpeedUpSuffix_Polite=Please increase speed to facilitate passage.
SpeedUpSuffix_Neutral=Increase speed now. Do not delay.
SpeedUpSuffix_Aggressive=Increase speed to full IMMEDIATELY.
FinalWarning={senderAffiliation} {senderName} to {name}. THIS IS A FINAL WARNING. You are in violation of {senderAffiliation} security zone. Alter course and identify and state your full intent NOW, or we WILL open fire.
StandDown={senderAffiliation} {senderName} to {name}. Your fire control radar is painting us. STAND DOWN immediately. Safe your weapons. {StandDownSuffix}
StandDownSuffix_Polite=We do not desire escalation.
StandDownSuffix_Neutral=The blame is yours.
StandDownSuffix_Aggressive=Any weapon lock will be treated as hostile.
Acknowledge=This is {senderAffiliation} {senderName}. You are identified and cleared. Proceed on your present course. Over and out.
ExecuteRam={senderAffiliation} {senderName} to {name}. You are violating our territorial waters. We are executing ramming maneuver. Brace for impact! {ExecuteRamSuffix}
ExecuteRamSuffix_Polite=Alter course immediately.
ExecuteRamSuffix_Neutral=You have been warned.
ExecuteRamSuffix_Aggressive=We will bump you out!
PaintFCR={senderAffiliation} {senderName} to {name}. You are now illuminated by fire control radar. You are LOCKED. Withdraw immediately. {PaintFCRSuffix}
PaintFCRSuffix_Polite=Break off and we will unlock.
PaintFCRSuffix_Neutral=You are being painted. Acknowledge.
PaintFCRSuffix_Aggressive=This is your final warning before we fire.
AimGuns={senderAffiliation} {senderName} to {name}. Our gun turrets are trained on you. Alter course immediately. {AimGunsSuffix}
AimGunsSuffix_Polite=Break off and we will stand down.
AimGunsSuffix_Neutral=You are being aimed at. Acknowledge.
AimGunsSuffix_Aggressive=This is your final warning before we fire.
WarningShot={senderAffiliation} {senderName} to {name}. Warning shots across your bow. HEAVE TO immediately. {WarningShotSuffix}
WarningShotSuffix_Polite=Stop engines and await instructions.
WarningShotSuffix_Neutral=Next shots will be aimed at you.
WarningShotSuffix_Aggressive=Next salvo will NOT miss.
AdvisoryNav={kind} {notice}. {senderAffiliation} {senderName}. Navigational warning: uncharted hazard reported in your vicinity. Navigate with caution and report any new dangers. {AdvisorySuffix}
AdvisoryWeather={kind} {notice}. {senderAffiliation} {senderName}. Gale warning: heavy weather expected along your route within 6 hours. Advise altering course or delaying transit. {AdvisorySuffix}
