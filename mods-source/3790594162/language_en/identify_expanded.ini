[Intents]
; Custom intents that supplement the 6 internal ones. They are used alongside, not replaced.
; Format options:
;   Item=intent|log          -> item taken from key, intent and log from value
;   Item=item|intent|log     -> all three from value (key ignored)
; Examples:
;Tanker=tanker|transit to our next port|a tanker in transit
;Trawler=trawler|fishing the grounds here|a fishing vessel
;Yacht=yacht|recreational cruising|a private yacht

