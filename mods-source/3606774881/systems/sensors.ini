[AN/SLQ-32A] #V3/4 ADCAP
#Users: usn_bb_iowa, usn_cgn_virginia, usn_cg_ticonderoga, usn_cg_leahy, usn_cg_belknap, usn_ddg_kidd, usn_dd_spruance, usn_ddg_adams, usn_ffg_oliver_hazard_perry, usn_ff_knox
Kind=ECM
Frequencies=C-Band,X-Band,Ku-Band //radar frequency bands the ECM suite can jam
Type=Universal                         // can be Defensive, Offensive, Universal

PeakPower=1000.0                       // output peak power in kW, more power increase effectivness of offensive ECM jammers
MaxRange=240.0                         // max range in km
Gain=6.0                              // Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=90.0                   // For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChance=0.60                         // For Defensive and Universal jammers. Base chance to jam the attacking weapon
ModuleType=SmallSensor
CoverRange=20                          // in nmi, If within this range from attacked unit and within weapon seeker cone, jammer will add to combined chance to jam weapon.

