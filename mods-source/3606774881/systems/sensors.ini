[ ---------------------------- Radars ----------------------------- ]

[UYK-44B]
#Fire control datalink (technically the computer set but there's no easy designation for the AEGIS datalink/combat weapon system)
#Users:late baseline ESSM + SM-6 with COTS implementation
Kind=Radar
Type=Targeting                         // Classes can be "Search", "Targeting"
HasDataLink=True                      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface                     // Role can be "Surface", "Air", "AirAndSurface"
Mode=RadioCommand                      // Can be "Illuminate", "RadioCommand"
RotationDirection=1                    // -1 means left, 1 means right
TargetChannels=200                     // if applicable number of targets it can track simultaneously
WeaponChannels=36                      // if applicable number of weapons (missiles) it can guide simultaneously
RPM=6600                               // revolutions per minute
MinRange=0.1                            // min range in km
MaxRange=1300.0                         // max range in km
MinAltitude=0                          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=1500000                    // max altitude in meters, relevant for air, unused for surface
RangeResolution=2.0                    // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.0                          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=5000.0                            // gain in dB on the sensor
Frequency=X-Band                       // frequency band
PeakPower=10.0                         // output peak power in kW
ModuleType=SmallSensor

