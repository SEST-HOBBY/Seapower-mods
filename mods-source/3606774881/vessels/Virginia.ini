[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.15

Length=140.0                    // in meters
Beam=10.0                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
HideIn=Encyclopedia,MissionEditor,Signatures

[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=10200              // in tons

MaxForwardVelocity=46.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=15.0
MaxBackwardVelocitySurfaced=15.0
MaxBackwardVelocity=7.0        // sets the max backward velocity
TelegraphVelocities=-7,0,5,10,15,30,46

BowUnderWater=10.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=31.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.7                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=0                 // default trim depth in feet
TrimAngle=0                 // default base trim angle (x-axis, so pitch)
#TrimAngle=-0.1                 // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0        // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=35.0            // in feet
CrushDepth=1600.0              // in feet

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=108                  // base sound level in db at 1m distance
FlowNoise=0.77                    // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=16.38             // additional noise for cavitation in db
TargetReflectionStrength=22    // in dB for broad side
BladesCount=7                  //number of blades on vessel's propulsion systems
ElectricFrequency=60           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_Virginia

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
AAW_Capability=0
ASuW_Capability=7
ASW_Capability=7

#Defence
#Special
Role=SSN

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
Collider=coll_cic
ModuleType=CIC

[MainPowerSystem]
############################################################
# Main Power System (engine room, boiler, reactor)
############################################################
Type=Nuclear
HorsePower=34000
Collider=coll_engineroom

[AuxPowerSystem]
Type=Electric
HorsePower=1700
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
Capacity=20000      //Range 20 miles at top underwater speed (17 knots)
DischargeRate=1.46  //Rate of discharging batteries. Lower values provide more range on low underwater speed on batteries
RechargeRate=1.2    //Capacity per second when charging batteries. When a unit goes at Standard telegraph setting or slower, the charge rate doubles
Collider=coll_battery_1,coll_battery_2

[PropulsionSystems]
############################################################
# Propulsion Systems
############################################################
NumberOfPropulsionSystems=1

[PropulsionSystem1]
Mount=Propeller
RotationDirection=Right
Collider=coll_prop

[RudderSystems]
