[General]
# SM-2MR Block IIIA
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=ShoreTargetsOnly  // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=705                               // in kg. Used for aircraft
AmmoPoints=1400                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

CIWSDefenceBonus=30                     // added chance to evade CIWS compounded by below factors
MissileDefenceBonus=0.15                     // added chance to evade missile compounded by below factors																						 
#supersonic SAM

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = High Explosive
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
#6 = Fragmentation

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=6
Power=35
ImpactSize=Medium                        // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                      // can be minor, moderate, heavy, always

FuzeProximityDistance=15.0             // for proximity fuze: distance to target in yard
KillProbability=3.8                     //Chance to intercept missile
InterceptOutOfAltitudePenalty=0.15                  // yay!
InterceptSpeedPenaltyMultiplier=0.5                  // yay!
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1						// supposed to be SARH + IR mode
MidCourseCorrection=3             // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
Retargetable=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=60.0                      // Climb angle for initial loft
MaxLoftAlt=100000.0                     // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=24              // supposed to be SARH mode
#TerminalDiveDistance=40                 // in N. miles.
LocalTerminalOnly=False                 // if true connection with a guiding radar will be severed upon entering terminal approach stage
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                        // If we should use full kinematics rules. If this is true, we will only use kinematics 
MaxVelocity=2901                          // Maximum speed in knots
MaxTurnRate=30                            // Maximum turnrate in degrees per second
MaxTurnG=25                       // Maximum G-limit of missile turns
AccelerationTime=24.0                        // Burn time for initial booster burn
Acceleration=7.777                           // Gs of acceleration in initial burn
SustainerAccelerationTime=41                // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=0                  // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=0					    // Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0		           		    // Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0		       		      // Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=3                          // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=1                           // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=190                           // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited																																					  
TerminalLoft=False
TimeLimited=True
LiftFactor=0.0025				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
#========================================= Launch stats ============================================================
MinLaunchRange=2                     // Minimum launch range in nautical miles
MaxLaunchRange=90                    // Maximum launch range in nautical miles
MinAttackAltitude=10                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=100000               // Maximum altitude of target, in feet
MaxAttackVelocity=2900				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed  
#LaunchTurnRate=70                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=4.0                // Circular error radius in meters (fuse 30 with CEP 15.77 = 80%)
CircularErrorRadiusLarge=5.0           // Circular error vs 'Large' aircraft (fuse 30 with CEP 12.29 = 90%)
MinAltMalusFactor=0.8                   // Factor that multiplies the CEP value if target below min alt of AAW weapon
#Homing
#SeekerGain=50.0                        // Seeker gain in dB
SeekerFOV=45.0                         // Seeker field-of-view in degrees
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
#SeekerActiveRange=25                  // supposed to be SARH mode
SeekerPassiveRange=25             // supposed to be SARH mode
#Frequency=X-Band       //compensating SARH  // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
#PeakPower=2        //compensating SARH  // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
CounterMeasuresRejection=80           // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=80                     // The lower the value, the greater risk of spoofing by jamming	(0...100)
AntiCountermeasuresBonus=0.80
AntiJammerBonus=0.80
#Search params for torpedoes
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_SM-2M-2
ResourcesMaterialFolder=assets/europack/materials/RIM-66/
ResourcesMaterial=RIM-66M_mat.ini
#ResourcesMeshForLaunch=launch
#ResourcesMeshCanister=launch
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
[---------- Launchers ----------]
# References to the launchers are just used for positioning relative to the launcher of the missile
[Launchers]
NumberOfLaunchers=3
Launcher1=MK13
Launcher2=MK22
Launcher3=MK26

[MK13]
LoadedPosition=0,0,0.009
UnloadedPosition=0,0,-0.086
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[MK22]
LoadedPosition=0,0,0.006
UnloadedPosition=0,0,-0.086
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[MK26]
LoadedPosition=0,0,0.006
UnloadedPosition=0,0,-0.086
LoadedRotation=0,0,0
UnloadedRotation=0,0,0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.035
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.035
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/sam_small_effect //missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.035
SustainerEffectStartTime=24.0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07
