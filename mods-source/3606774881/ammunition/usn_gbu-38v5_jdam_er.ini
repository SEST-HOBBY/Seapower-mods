[General]
#GBU-38(V)5/B JDAM-ER [Mk82]
Type=Missile                             // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
LandAttackCapability=Installation               // can be  All, Installation, Mobile, ShoreTargetsOnly
Mass=253                                // in kg. Used for aircraft
AmmoPoints=125                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
#SupplyCategory=Missile                 // For Supply System. Makes that presence of such category is required for #replenishment of this weapon
AirLaunched=True

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.15
MinCameraDistanceBroadside=0.15
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=0.01  // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=0.00015
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = High Explosive
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
#6 = Fragmentation

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=49
ImpactSize=Medium               // Impact size, can be small, medium, large, verylarge
Penetration=Moderate              // can be minor, moderate, heavy, always

KillProbability=10                  //Base chance to hit
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0                  //INS + GPS
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=4.0
InitialFlightPhaseDuration=3.0        // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
TerminalApproachDist=10              // in N. miles. At this distance seeker will be turned on.
TerminalDiveDistance=40                 // in N. miles.
TerminalVelocity=530
SupportsBanking=True                   // if the missile will bank when turning
Lofted=False                           // If true, the weapon is launched to a high altitude, then dives to reach its target
SeaSkimming=False                      // If true, fly at wavetop altitude during entire flight
FinalFlightPhase=False                  // final flight phase, e.g. terminal pop up
#=========================================  Kinematics  ============================================================
ApplyKinematics=False                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
MaxVelocity=530                       // Maximum speed in knots
MaxTurnRate=35                       // Maximum turnrate in degrees per second
AccelerationTime=10                  // Burn time for initial booster burn
Acceleration=10                      // Gs of acceleration in initial burn
SustainerAccelerationTime=300           // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=0               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=0					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=37000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=300				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=0               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
#VelocityBleed=1
#MaxFlightTime=450               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#======================================== Launch stats ============================================================
MinLaunchRange=1.0                     // Minimum launch range in nautical miles
MaxLaunchRange=42.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=10000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=65000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#VerticalWobblingStrength=4.0           // amplitude of wobbling
#VerticalWobblingSpeed=1.0              // frequency of wobbling
GroupSize=0
#========================================     Seeker     ===========================================================
CircularErrorRadius=10.0               // Circular error radius in meters
#Homing
SeekerGain=0                        // Seeker gain in dB
SeekerFOV=0                         // Seeker field-of-view in degrees																															  
SeekerActiveRange=0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=0                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
NightVisionLevel=1.0
PeakPower=0                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=1          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=1                   // This value substracted from probability of being jammed  (0...1)
CounterMeasuresRejection=100            // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=100                      // The lower the value, the greater risk of spoofing by jamming	(0...100)
#Search params for torpedoes
#ReattackMode=                         // 0 = None, 1 = Circle, 2 = Drive-around
#ReattackCircleDegreesPerSecond=    // degrees per second for circle reattack pattern
#SelfDestruct
SelfDestructAfterTargetGone=False

[---------- Mesh definitions----------]
[Models]
AttachmentPosition=0,0,-0.001
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_gbu-12
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_gbu-12_mat
AssetBundleMeshHullCollider=usn_gbu-12_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/gbu-75/
ResourcesRoot=gbu-75.obj
ResourcesMesh=gbu-75
ResourcesMaterial=usn_gbu-75_mat.ini
ResourcesMeshForLaunch=launch
ResourcesMeshSwitchTime=2.0  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=FALSE
InFlightEffect=FALSE
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
#HitAirExplosionClass=SmallGroundHitExplosions
HitGroundExplosionClass=MediumGroundHitExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

