[General]
#GBU-38(V)2/B JDAM [Mk82]
Type=Bomb                               // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
IsInterceptable=True                   // for bombs only, if False, bomb cannot be fired upon, default is false
LandAttackCapability=Installation      // can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode
Mass=253                                // in kg. Used for aircraft
AmmoPoints=375			   
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=1  // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = High Explosive
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
#6 = Fragmentation

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=32
ImpactSize=Medium               // Impact size, can be small, medium, large, verylarge
Penetration=Heavy               // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=4.0                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
GravityFactor=6
TerminalApproachDist=1000              // in N. miles. At this distance seeker will be turned on.
SupportsBanking=True                   // if the missile will bank when turning
Lofted=False                           // If true, the weapon is launched to a high altitude, then dives to reach its target
SeaSkimming=False                      // If true, fly at wavetop altitude during entire flight
FinalFlightPhase=False                  // final flight phase, e.g. terminal pop up
#========================================= Launch stats ============================================================
MaxTurnRate=5                          // Maximum turnrate in degrees per second
MinLaunchRange=1                     // Minimum launch range in nautical miles
MaxLaunchRange=15.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=2000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=65000                // Maximum launch altitude in feet.
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#VerticalWobblingStrength=4.0           // amplitude of wobbling
#VerticalWobblingSpeed=1.0              // frequency of wobbling
#========================================     Seeker     ===========================================================
CircularErrorRadius=5                // Circular error radius in meters
#Homing
#ECCM
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction
