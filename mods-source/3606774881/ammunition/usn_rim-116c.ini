[General]
# RIM-116C RAM Blk II
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
#LandAttackCapability=ShoreTargetsOnly  // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=88                                // in kg. Used for aircraft
AmmoPoints=150                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

#CIWSDefenceBonus=50                     // added chance to evade CIWS compounded by below factors
#MissileDefenceBonus=0.25                     // added chance to evade missile compounded by below factors																						 

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

FrontalArea=0.023
SideArea=0.45
[SensorData]
#Visual
VisualIdentificationRange=2  // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=0.1
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=10  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = High Explosive
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
#6 = Fragmentation

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=6
Power=12
ImpactSize=Small                       // Impact size, can be small, medium, large, verylarge
Penetration=Minor                     // can be minor, moderate, heavy, always

FuzeProximityDistance=8.0             // for proximity fuze: distance to target in yard
KillProbability=1.4                   //Chance to intercept missile
InterceptOutOfAltitudePenalty=0.15                  // yay!
InterceptSpeedPenaltyMultiplier=0.75                  // yay!
InterceptSizePenaltyMultiplier=0.10					// multiplier to the size penalty, 1.0 is default
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=0                  //should be "1"
InitialFlightPhaseDuration=0.3         // time in seconds where the missile moves straight on without guiding
#PerformsSlightBallisticInitialFlight=False  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
Retargetable=False
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=90                      // Climb angle for initial loft
MaxLoftAlt=Target                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=25              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
#TerminalDiveDistance=40                 // in N. miles.
LocalTerminalOnly=False                 //Need to figure out what sensor/s guiding this.
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
AxialRotation=720                      // In degrees per second. Doesnt work when "SupportsBanking" is true
SupportsBanking=False                  // if the missile will bank when turning
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                        // If we should use full kinematics rules. If this is true, we will only use kinematics 
MaxVelocity=1040.0                          // Maximum speed in knots
MaxTurnRate=35.0                            // Maximum turnrate in degrees per second
MaxTurnG=55                       // Maximum G-limit of missile turns
AccelerationTime=17.0                        // Burn time for initial booster burn
Acceleration=3.28                          // Gs of acceleration in initial burn
SustainerAccelerationTime=0            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=0               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=0					    // Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0		           		    // Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0		       		      // Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=2.55                           // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=1                          // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=65                           // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited																																					 
TerminalLoft=False
TimeLimited=True
LiftFactor=0.001				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
#========================================= Launch stats ============================================================
MinLaunchRange=0.2                     // Minimum launch range in nautical miles
MaxLaunchRange=10                       // Maximum launch range in nautical miles
MinAttackAltitude=10                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=20000                // Maximum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackVelocity=2000				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed  
#LaunchTurnRate=70.0                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=5.0                // Circular error radius in meters (fuse 8 with CEP 6.4 = 60%)
CircularErrorRadiusLarge=7.0         // Circular error vs 'Large' aircraft (fuse 30 with CEP 12.29 = 90%)
MinAltMalusFactor=0.7                  // Factor that multiplies the CEP value if target below min alt of AAW weapon
#Homing
IsRearAspectOnly=False                 //Rear aspect ammunition can lock on targets from their rear cone only
#SeekerGain=65.0                        // Seeker gain in dB
SeekerFOV=45                          // Seeker field-of-view in degrees
SecondaryPassiveRadarGuidanceType=Full  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
#SeekerActiveRange=                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=10                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
#PeakPower=15                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#MISC GUIDANCE PROPERTIES
RangeGate=2							   // 
SizeGate=1.1						   //
#ECCM
CounterMeasuresRejection=70           // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=70                     // The lower the value, the greater risk of spoofing by jamming	(0...100)
AntiCountermeasuresBonus=0.70           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.70                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_RIM-116_Blk2
#ResourcesMeshForLaunch=eu_missile_RIM-116_Blk2
ResourcesMaterialFolder=assets/europack/materials/RIM-116/
ResourcesMaterial=RIM-116E_mat.ini

NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_effect
BoosterEffectPosition=0,0,-0.015  //-0.020306

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.015
InFlightEffectStartTime=0.5  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/aam_effect //missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.015
SustainerEffectStartTime=1

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043
