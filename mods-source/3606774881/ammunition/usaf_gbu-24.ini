[General]
#GBU-24G/B Paveway III GPS/LGB
Type=Bomb                               // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
IsInterceptable=True                   // for bombs only, if False, bomb cannot be fired upon, default is false
Mass=1065                               // in kg. Used for aircraft
AmmoPoints=2425                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=1  // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = High Explosive
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
#6 = Fragmentation

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=1
Power=71
ImpactSize=Large            // Impact size, can be small, medium, large, verylarge
Penetration=Always       		// can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=5
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=2.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
GravityFactor=8
TerminalApproachDist=1000              // in N. miles. At this distance seeker will be turned on.
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxTurnRate=6                          // Maximum turnrate in degrees per second
MinLaunchRange=0.2                       // Minimum launch range in nautical miles
MaxLaunchRange=12                      // Maximum launch range in nautical miles
MinLaunchAltitude=2000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=65000                // Maximum launch altitude in feet.
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
VerticalWobblingStrength=8.0           // amplitude of wobbling
VerticalWobblingSpeed=3.0              // frequency of wobbling
#========================================     Seeker     ===========================================================
#CircularErrorRadius=0.2  //20.0               // Circular error radius in meters
#Homing
SeekerGain=0.0                         // Seeker gain in dB
SeekerFOV=45.0                         // Seeker field-of-view in degrees
SeekerActiveRange=8                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=8                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Zoom=3
TargetMemory=True
#ECCM
#AntiCountermeasuresBonus=0.4           // This value substracted from probability of spoofing by countermeasures (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructAfterTargetGone=False

[---------- Mesh definitions----------]
[Models]
AttachmentPosition=0,0,-0.001
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_gbu-12
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_gbu-12_mat
AssetBundleMeshHullCollider=usn_gbu-12_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/gbu-24/
ResourcesRoot=gbu-24.obj
ResourcesMesh=gbu-24
ResourcesMaterial=gbu24_mat.ini
ResourcesMeshForLaunch=launch
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=1

SubModel1=Glas

[Glas]
Mesh=Glas
ResourcesMaterialFolder=aircraft/materials/
Material=cockpit_glass

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=FALSE
InFlightEffect=FALSE
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
#HitAirExplosionClass=SmallGroundHitExplosions
HitGroundExplosionClass=SMediumGroundHitExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637