#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# AIM-9X Sidewinder
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
Mass=85                                // in kg. Used for aircraft
AmmoPoints=200                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=3  // at what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Tiny
IRSignature=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = High Explosive
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
#6 = Fragmentation

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=6
Power=9
ImpactSize=VerySmall                    // Impact size, can be small, medium, large, verylarge
Penetration=Minor                      // can be minor, moderate, heavy, always

FuzeProximityDistance=5.0               // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.95                    // Base chance to hit
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=0.1                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=30                      // Climb angle for initial loft
MaxLoftAlt=65000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=1000              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
#LocalTerminalOnly=True                 // if true connection with a guiding radar will be severed upon entering terminal approach stage
#IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
MaxVelocity=1475                     // Maximum speed in knots
MaxTurnRate=45                      // Maximum turnrate in degrees per second
AccelerationTime=5                  // Burn time for initial booster burn
Acceleration=14.4                      // Gs of acceleration in initial burn
SustainerAccelerationTime=-1            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=-1               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=36000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=0						// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=36000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=260				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=7.16               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=1                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=70               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TerminalLoft=False
TimeLimited=True
LiftFactor=0.001				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
#========================================= Launch stats ============================================================
MinLaunchRange=0.2                     // Minimum launch range in nautical miles
MaxLaunchRange=19.4                     // Maximum launch range in nautical miles
MinAttackAltitude=20                  // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=65000                // Maximum altitude of target, in feet
MaxAttackVelocity=1500				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
MinLaunchAltitude=200               // Minimum launch altitude in feet.
MaxLaunchAltitude=65000               // Maximum launch altitude in feet.
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
IsRearAspectOnly=False                 // Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=120                     // Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=180                          // Seeker field-of-view in degrees
SeekerPassiveRange=15                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#ECCM
AntiCountermeasuresBonus=0.95          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.6                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_aim-9l
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_aim-9l_mat
AssetBundleMeshHullCollider=usn_aim-9l_coll
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/aim-9/
ResourcesRoot=usn_aim-9x.obj
ResourcesMesh=aim-9
ResourcesMaterial=usn_aim-9x_mat.ini
############################################################
NumberOfSubModels=1

SubModel1=Glas

[Glas]
Mesh=Glas
ResourcesMaterialFolder=aircraft/materials/
Material=cockpit_glass
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_small_effect
BoosterEffectPosition=0,0,-0.015

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.015
InFlightEffectStartTime=0.01  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043