#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Mk54 HAAWC Mod 0
Type=Missile                           // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW

Mass=276                               // in kg. Used for aircraft
AmmoPoints=1217                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

[SensorData]
#Visual
VisualIdentificationRange=4            // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                     // Transient visibility on the radar
TransientVisualIdentificationRange=5   // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
[WarheadData]
#No need to specify anything since its warhead is never used

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0         // time in seconds where the missile moves straight on without guiding
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
#PerformsSlightBallisticInitialFlight=True
#======================================== Flight Profile ===========================================================
TerminalApproachDist=50.35              // in N. miles. At this distance seeker will be turned on.
TerminalDiveDistance=50.35                 // in N. miles.
TerminalVelocity=530
SupportsBanking=True                   // if the missile will bank when turning
Lofted=False                           // If true, the weapon is launched to a high altitude, then dives to reach its target
SeaSkimming=False                      // If true, fly at wavetop altitude during entire flight
FinalFlightPhase=False                  // final flight phase, e.g. terminal pop up
#========================================= Launch stats ============================================================
ApplyKinematics=False                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
MaxVelocity=530                        // Maximum speed in knots
MaxTurnRate=11                          // Maximum turnrate in degrees per second
AccelerationTime=0                  // Burn time for initial booster burn
Acceleration=0                      // Gs of acceleration in initial burn
SustainerAccelerationTime=0           // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=0               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=0					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=35000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=300				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=0               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.75
#======================================== Launch stats ============================================================
MinLaunchRange=1.0                    // Minimum launch range in nautical miles
MaxLaunchRange=40.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=10000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=40000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=0.0                // Circular error radius in meter
#Homing
#ECCM
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=6.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
# TODO
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/haawc/
ResourcesRoot=haawc.obj
ResourcesMesh=flight
ResourcesMaterial=haawc_mat.ini
ResourcesMeshForLaunch=prelaunch
ResourcesMeshCanister=prelaunch
ResourcesMeshSwitchTime=1  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

# optional entry below, allows to switch to a second type of ammunition
# e.g. used for ASROC where a MK46 torpedo is spawned
[Submunition]
Ammunition=usn_mk54_asroc
Offset=0,0,0.0    // offset of submunition to have it perfectly aligned with the "host"
SpawnTime=6

# References to the launchers are just used for positioning relative to the launcher of the missile
[Launchers]
NumberOfLaunchers=3
Launcher1=MK10
Launcher2=MK26
Launcher3=MK13

[MK10]
LoadedPosition=0,0,0.005
UnloadedPosition=0,0,-0.09
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[MK26]
LoadedPosition=0,0,0.02
UnloadedPosition=0,0,-0.07
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[MK13]
LoadedPosition=0,0,0.02
UnloadedPosition=0,0,-0.07
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.022
HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.003
Rotation=0,0,0
Scale=0.005,0.005,0.045