[SystemNames]
#---------------------------------------- radars ----------------------------------------
eu_SPY-1D(V)=SPY-1D (V)|The SPY-1D (V) is a long range 3D passive electronically scanned array and is a key component of the AEGIS combat system. Four distributed, computer-controlled antennae are used to provide a continous 360-degree coverage of the airspace around the ship. The (V) variant of the SPY-1D has a digital MTI mode, allowing for easy tracking of both sea skimming and surface targets with no downsides, alongside further noise rejection features to improve range and performance.
eu_SPY-1B(BMD)=SPY-1D (BMD)|The SPY-1D (BMD) is a long range 3D passive electronically scanned array and is a key component of the AEGIS combat system. Four distributed, computer-controlled antennae are used to provide a continous 360-degree coverage of the airspace around the ship. The BMD upgrade for SPY-1D (V) includes a major update to how the AEGIS weapons system handles the radar for high elevation/altitude tracking and sea skimming target tracking, and increases the maximum effective range and altitude ceiling for the radar to include targets in space at extreme range.
