eu_SQS-53C=SQS-53C|Highly upgraded and digitized version of the SQS-53B with newer physical sonar assembly for greater sensitivity and higher accuracy using bottom-bounce and convergence-zone modes, alongside better capabilities against fast, deep-diving submarines.
