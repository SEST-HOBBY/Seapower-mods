# ------------------ SAM ------------------
usn_rgm-84=RGM-84,Harpoon,ASM,The Harpoon is an American standoff anti-ship weapon used widely throughout NATO. The weapon has an active radar seeker that is activated after following a pre-programmed route. The RGM-84 variant is surface launched. The Block 1B variant has no pop-up maneuver, but does have a new sea-skimming terminal flight profile for added survivability against ships.
usn_rim-116a=RIM-116A RAM,RAM,RIM-116A,Following the sinking of the Israeli destroyer Eilat, the USN put out a requirement to increase ship's point-defense (PD) capabilities. Said requirement ultimately developed into the Phalanx CIWS and RAM. Achieving IOC in 1991, RAM is now commonplace throughout Western Navies, and is deployed on American amphibious ships, carriers, ands a select number of surface combatants. RAM comes preloaded in the 21-cell Mk49 launcher, which is mounted on the Phalanx base. RIM-116 Block 0 is infrared guided, and does not require an external illuminator. 
usn_rim-116c=RIM-116C,RAM Blk II,SAM,
usn_rim-161e=RIM-161E, SM-3 NTW Blk IIA,SAM,Guided Weapon. Targets: Missiles & Guided Bombs.
usn_rim-174=RIM-174A, SM-6 ERAM,SAM,The RIM-174 Standard Extended Range Active Missile (ERAM), or Standard Missile 6 (SM-6), is a missile in current production for the United States Navy (USN). It was designed for extended-range anti-air warfare (ER-AAW) purposes, providing capability against fixed and rotary-wing aircraft, unmanned aerial vehicles, anti-ship cruise missiles in flight, both over sea and land, and terminal ballistic missile defense. It can also be used as a high-speed anti-ship missile.[12] The missile uses the airframe of the earlier SM-2ER Block IV (RIM-156A) missile,[13] adding the active radar homing seeker from the AIM-120C AMRAAM in place of the semi‑active seeker of the previous design.
usn_rim-162e=RIM-162E,ESSM Blk II,SAM,The RIM-162 Evolved Sea Sparrow Missile is a short to medium range air-defence missile fitted to numerous USN and NATO vessels. The system is primarily intended to provide a self defence capability. The ESSM is highly upgraded from older Sparrow missiles, and is posed to be very capable against sea skimming anti ship missiles, alongside fulfilling area defense duties quite well.\n\nThe Block II upgrade of ESSM provides an active radar seeker, higher speed to engage faster targets, and overall performance and reliability upgrades.
# ---------- Anti-radar Missiles ---------
# ---------- Anti-ship Missiles ----------
usn_rgm-109j=RGM-109J Blk Va,Maritime Strike Tomahawk,ASM,The Maritime Strike Tomahawk (MST), a variant of the Block V Tomahawk, including an upgraded seeker for identifying and tracking moving maritime targets, and precision navigation systems. This enables long-range strikes against both land and sea targets.
usn_ugm-109j=UGM-109J Blk Va,Maritime Strike Tomahawk,ASM,The Maritime Strike Tomahawk (MST), a variant of Submarine launched Block V Tomahawk, including an upgraded seeker for identifying and tracking moving maritime targets, and precision navigation systems. This enables long-range strikes against both land and sea targets.
usaf_jsm=JSM NSM,Anti Ship,The Joint Strike Missile (JSM) is a multi-role, air-launched cruise missile under development by the Norwegian company Kongsberg Defence & Aerospace and American company Raytheon Missiles & Defense. 
usn_agm-84n=AGM-84N Blk II+,Enhanced Harpoon,ASM,The AGM-84N Harpoon Block II+ (often associated with enhanced, extended-range, or upgraded Block II variants) features improved guidance and a digital datalink, providing an operational range of approximately 150 nautical miles.
#-----------Land Strike only missiles---------
usaf_jsm_land=JSM LAND,Land Strike,The Joint Strike Missile (JSM) is a multi-role, air-launched cruise missile under development by the Norwegian company Kongsberg Defence & Aerospace and American company Raytheon Missiles & Defense. 

