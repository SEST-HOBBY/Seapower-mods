Type=DDG,Destroyer
Default=Arleigh Burke Flt.3 (2027),Arleigh Burke Flt. 3
DefaultDescription=The Arleigh Burke Flight III destroyers represent the latest evolution in the class, incorporating the Aegis Baseline 10 combat system and the advanced AN/SPY-6(V)1 Air and Missile Defense Radar (AMDR). These enhancements provide significantly improved detection and engagement capabilities against modern air and missile threats. The integration of the RIM-174 Standard Missile 6 (SM-6) further extends the ships' reach and versatility in Anti-Air Warfare (AAW), Ballistic Missile Defense (BMD), and Anti-Surface Warfare (ASuW). The Flight III configuration ensures these destroyers remain at the forefront of naval combat, capable of operating seamlessly within networked battle environments and providing robust defense against a wide array of modern threats. Loadout: 6 RIM-174, 40 RIM-66M-5, 40 RIM-162E, 12 RGM-109J, 8 ASROC
