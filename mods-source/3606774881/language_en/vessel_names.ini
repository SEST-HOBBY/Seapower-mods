[usn_cg_ticonderoga_vls_2027]
Type=CG,Missile Cruiser
Default=Ticonderoga (2027),Ticonderoga (2027)
DefaultDescription=An iconic and instantly recognisable design with their 4 SPY-1 flat panel PESA arrays the Ticonderoga-class cruisers are a development of the Spruance-class destroyer focused on anti-air warfare and fitted with the new AEGIS combat management system. Later versions were equipped with Mk41 VLS launchers, which allowed for greater magazine depth, higher weapon readiness, and more weapon variety. This 2013 outfit includes an early introduction of SM-6, the Navy's first active-homing surface to air missile system in service, replacing the RIM-156 onboard these vessels.
