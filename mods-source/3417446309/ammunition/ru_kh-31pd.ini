#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# KH-31P
# Users: wp_mig-29m
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
Mass=600                               // in kg. Used for aircraft

AmmoPoints=950                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

CIWSDefenceBonus=2                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

SaturationValue=1

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=0.2
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=42
ImpactSize=Medium                      // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=4
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3         // time in seconds where the missile moves straight on without guiding
DropDuration=0.5                      // time in seconds where the missile just falls unpropelled
TargetRequired=False
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=27.0                      // Climb angle for initial loft
MaxLoftAlt=20000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=8.0             // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalDiveDistance=4                 // in N. miles.
#========================================= Launch stats ============================================================
MaxVelocity=1824                      // Maximum speed in knots
Acceleration=9.0                       // Acceleration factor
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
MinLaunchRange=6.5                     // Minimum launch range in nautical miles
MaxLaunchRange=59.45                    // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=8.0                         // Seeker gain in dB
SeekerFOV=60.0                         // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerActiveRange=0                    // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=45                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
PassiveRadarGuidanceFrequencies=L-Band,S-Band,C-Band,X-Band    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#Misc Guidance Properties
#InsDrift=0.5							   // In degrees per minute of unguided flight. Shifts the weapon's nose by this amount per minute whenever the missile is not being actively guided (RC, Wire, tracking a target with its seeker)
# cass: meant for making missiles drift when they lose their target, blocked for now due to unresolved issues
#ECCM
#Search params for torpedoes
#SelfDestruct
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/kh-31/
ResourcesRoot=kh-31.obj
ResourcesMesh=hull
ResourcesMaterialFolder=assets/models/ammunition/KH-31/textures/
ResourcesMaterial=kh-31_mat.ini
ResourcesMeshForLaunch=launch
ResourcesMeshCanister=launch
ResourcesMeshSwitchTime=3  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=1

SubModel1=Afterburner

[Afterburner]
Type=Afterburner                  //Dot: afterburner is invisible by default and will be turned on only after launch
Mesh=afterburner
ResourcesMaterialFolder=aircraft/materials/
Material=afterburner_mat
Position=0,0,0
Rotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.028
InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosionClass=MediumMissileExplosions
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.06606571
