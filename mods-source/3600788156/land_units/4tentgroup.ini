[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=2.5
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=1.5
CameraPivotHeight=0.25

AutoFlatten=True
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=20  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Four Tent Group
Tag=Ground+Vehicle

[AI]
UnitScoreValue=10               // value for calculation of mission score
Role=Target

[ControlSystem]
Collider=coll_Tent1
Integrity=10

[SensorData]
#Visual
VisualIdentificationRange=7.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
#MountPosition=0,0.255,0
MountPosition=0,1,0 //Observer on top of the tower
ModuleType=Bridge
Collider=
Integrity=10


[ ---------- HitZones ---------- ]
[HitZones]
NumberOfHitZones=1
[HitZone1]
SystemName=Tents
Collider=coll_Tent1
Integrity=10 //the number of hit points substracted from the overall damage points count when the system is destroyed

[ ---------- Target Points definitions ---------- ]
[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=-0.05,0.1,0.1
TargetPointAssociatedSystems1=HitZone1
TargetPointPriority1=High


[--------------------------- Mesh definitons ---------------------------]
[Models]
LODLevels=1
LOD1Distance=7.5 // nautical miles

############################################################
ResourcesFolder=Buildings/Tentgroup/
ResourcesRoot=4tents.obj
ResourcesMesh=Tents
ResourcesMaterialFolder=Buildings/Tentgroup/
ResourcesMaterial=4tents_mat.ini


[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=0,0
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=0.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0.084,0,-0.5
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0.084,0,-0.5
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0.084,0,-0.5
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0.084,0,-0.5

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfColliders=0
NumberOfMeshColliders=4

MeshCollider1=coll_Tent1
MeshCollider2=coll_Tent2
MeshCollider3=coll_Tent3
MeshCollider4=coll_Tent4
#Collider1=coll_target


[coll_Tent1]
Collider=Coll_t1
[coll_Tent2]
Collider=Coll_t2
[coll_Tent3]
Collider=Coll_t3
[coll_Tent4]
Collider=Coll_t4

