[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=2.5
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=1.5
CameraPivotHeight=0.25

AutoFlatten=True
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=230  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Power Plant
Tag=Ground+Vehicle

[AI]
UnitScoreValue=25               // value for calculation of mission score
Role=Target

[ControlSystem]
Collider=coll_command
Integrity=10

[SensorData]
#Visual
VisualIdentificationRange=50  // Camouflaged  (x0.5)
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
#MountPosition=0,0.255,0
MountPosition=1,0,1 //Observer on top of the tower
ModuleType=Bridge
Collider=
Integrity=10


