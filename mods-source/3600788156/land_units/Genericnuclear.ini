[General]
UnitType=LandUnit
LandUnitSubType=Installation//Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=2.5
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=1.5
CameraPivotHeight=0.25

AutoFlatten=True
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Heavy
DamagePoints=200  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Power Plant
Tag=Ground+Vehicle

[AI]
UnitScoreValue=10               // value for calculation of mission score
Role=Target

[ControlSystem]
Collider=coll_Main
Integrity=50

[SensorData]
#Visual
VisualIdentificationRange=15  // Camouflaged  (x0.5)
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
#MountPosition=0,0.255,0
MountPosition=0,0,0 //Observer on top of the tower
ModuleType=Bridge
Collider=
Integrity=6


[ ---------- HitZones ---------- ]
[HitZones]
NumberOfHitZones=3
[HitZone1]
SystemName=Main_building
Collider=coll_Main
Integrity=100 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
SystemName=Tower1
Collider=coll_t1
Integrity=50 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone3]
SystemName=Tower2
Collider=coll_t2
Integrity=50 //the number of hit points substracted from the overall damage points count when the system is destroyed
[ ---------- Target Points definitions ---------- ]
[TargetingData]
NumberOfTargetPoints=3
TargetPointPosition1=0.5,0,-.5
TargetPointAssociatedSystems1=HitZone1
TargetPointPriority1=High
TargetPointPosition2=1.8,0,.6
TargetPointAssociatedSystems2=HitZone2
TargetPointPriority2=High
TargetPointPosition3=.2,0,.5
TargetPointAssociatedSystems3=HitZone3
TargetPointPriority3=High

[--------------------------- Mesh definitons ---------------------------]
[Models]
############################################################
ResourcesFolder=Buildings/Nuclearpowerplant/
ResourcesRoot=genericnuke.obj
ResourcesMesh=Plant
#ResourcesDamagedMesh=Drydock_d
ResourcesMaterial=genericnuke_mat.ini
#ResourcesDamagedMaterial=US_AFDB7_d_mat.ini
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=0.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0.084,0,-0.5
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0.084,0,-0.5
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0.084,0,-0.5
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0.084,0,-0.5

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=True
NumberOfColliders=1
NumberOfMeshColliders=3

MeshCollider1=coll_Main
MeshCollider2=coll_t1
MeshCollider3=coll_t2
Collider1=coll_target


[coll_Main]
Collider=coll_Building

[coll_t1]
Collider=coll_tower1

[coll_t2]
Collider=coll_tower2


[coll_target]
Collider=Box
Position=1.8,0,.6
Rotation=0,0,0
Scale=0.5,0.5,0.5

