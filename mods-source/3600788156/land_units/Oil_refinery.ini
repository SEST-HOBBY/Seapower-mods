[--------------------------- Mesh definitons ---------------------------]
[Models]
LODLevels=1
LOD1Distance=15  // nautical miles

############################################################
ResourcesFolder=Buildings/Oil_refinery/
ResourcesRoot=oilrefinery.obj
ResourcesMesh=Buildings
ResourcesMaterialFolder=Buildings/Oil_refinery
ResourcesMaterial=Buildings_mat.ini

[Submodels]
Pipes=Pipeline
#building=buildings
tank=tanks

[Pipeline]
Mesh=Pipes
ResourcesMaterialFolder=Buildings/Oil_refinery/
Material=pipes_mat.ini
Position=0,0,0
Rotation=0,0,0


[tanks]
Mesh=tanks
ResourcesMaterialFolder=Buildings/Oil_refinery/
Material=tanks_mat.ini
Position=0,0,0
Rotation=0,0,0


[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=0.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=1.8,0,1.5
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=-1.5,0,1.8
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=-1.5,0,-1
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=1.8,0,1.5

