Collider=coll_twint
Integrity=40 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone7]
SystemName=Green_tanks
Collider=coll_smallt
Integrity=125 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone8]
SystemName=Office_building_1
