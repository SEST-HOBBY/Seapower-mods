[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=2.5
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=1.5
CameraPivotHeight=0.25

AutoFlatten=True
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Heavy
DamagePoints=300  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Under Ground Complex
Tag=Ground+Vehicle

[AI]
UnitScoreValue=100               // value for calculation of mission score
Role=Target

[ControlSystem]
Collider=coll_control1
Integrity=50

[SensorData]
#Visual
VisualIdentificationRange=10  // Camouflaged  (x0.5)
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
#MountPosition=0,0.255,0
MountPosition=0,1,0 //Observer on top of the tower
ModuleType=Bridge
Collider=
Integrity=10


[ ---------- HitZones ---------- ]
[HitZones]
NumberOfHitZones=5
[HitZone1]
SystemName=Underground_control
Collider=coll_control1
Integrity=50 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
SystemName=Tunnel_entrance_one
Collider=coll_Tunnel1
Integrity=50 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone3]
SystemName=Tunnel_entrance_two
Collider=coll_Tunnel2
Integrity=50 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone4]
SystemName=Air_vent_1
Collider=coll_Vent1
Integrity=30 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone5]
SystemName=Air_vent_2
Collider=coll_Vent2
Integrity=30 //the number of hit points substracted from the overall damage points count when the system is destroyed
[ ---------- Target Points definitions ---------- ]
[TargetingData]
NumberOfTargetPoints=5

TargetPointPosition1=0,0,0
TargetPointAssociatedSystems1=HitZone1
TargetPointPriority1=High

TargetPointPosition2=-3.6,0,0
TargetPointAssociatedSystems2=HitZone2
TargetPointPriority2=High

TargetPointPosition3=3.6,0,0
TargetPointAssociatedSystems3=HitZone3
TargetPointPriority3=High

TargetPointPosition4=3.05,0,0
TargetPointAssociatedSystems4=HitZone4
TargetPointPriority4=High

TargetPointPosition5=-3.05,0,0
TargetPointAssociatedSystems5=HitZone5
TargetPointPriority5=High
[--------------------------- Mesh definitons ---------------------------]
[Models]
LODLevels=1
LOD1Distance=15  // nautical miles

############################################################
ResourcesFolder=Buildings/UGC/
ResourcesRoot=UGC.obj
ResourcesMesh=UGC
ResourcesMaterialFolder=Buildings/UGC
ResourcesMaterial=UGC_mat.ini


[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=0.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0.084,0,-0.5
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0.084,0,-0.5
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0.084,0,-0.5
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0.084,0,-0.5

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfColliders=2
NumberOfMeshColliders=2

MeshCollider1=coll_Tunnel1
MeshCollider2=coll_Tunnel2
MeshCollider3=coll_smallBuilding1
MeshCollider4=coll_smallBuilding2
MeshCollider5=coll_smallBuilding3
MeshCollider6=coll_Largebuilding1
MeshCollider7=coll_Largebuilding2
MeshCollider8=coll_Vent1
MeshCollider9=coll_Vent2

Collider1=coll_control1
Collider2=coll_target

[coll_Tunnel1]
Collider=coll_tun1

[coll_Tunnel2]
Collider=coll_tun2

[coll_smallBuilding1]
Collider=coll_s1

[coll_smallBuilding2]
Collider=coll_s2

[coll_smallBuilding3]
Collider=coll_s3

[coll_Largebuilding1]
Collider=coll_l1

[coll_Largebuilding2]
Collider=coll_l2

[coll_Vent1]
Collider=coll_vent1

[coll_control1]
Collider=Box
Position=0,-.1,0
Rotaion=0,0,0
Scale=.25,.15,.25

[coll_target]
Collider=Box
Position=3.05,0,0
Rotation=0,0,0
Scale=0.05,0.05,0.05

