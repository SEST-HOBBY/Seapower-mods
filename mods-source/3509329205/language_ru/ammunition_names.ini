# ---------- Anti-ship Missiles ----------
3M22=3M22 Циркон,,Циркон,3М22 "Циркон" или SS-N-33 - это мобильная противокорабельная гиперзвуковая крылатая ракета, разработанная Россией. Предполагаемая дальность полета "Циркона" составляет 500 км на малой высоте и до 750 км по полубаллистической траектории, но российские государственные СМИ сообщают о дальности в 1000 км. Это двухступенчатая ракета, первая ступень которой работает на твердом топливе, а вторая - на ГПВРД. Ракета будет установлена на линейном крейсере типа "Киров" "Адмирал Нахимов" в этом году и на "Петре Великом" в 2022 году. Ракета 3M22 "Циркон" впервые была использована в боевых действиях в феврале 2023 года, когда в сообщениях из Украины были обнаружены обломки, указывающие на применение гиперзвукового оружия.
#-----------Land Strike only missiles---------
KH-55=Х-55,,ALCM,Крылатая ракета Х-55 - это дозвуковая ядерная крылатая ракета воздушного базирования большой дальности, разработанная советским конструкторским бюро "Радуга" в 1968 году и официально принятая на вооружение в 1983 году. Ракета использует комбинированную систему наведения, состоящую из инерциального наведения и слежения за рельефом местности, с максимальной дальностью полета 2500 километров. Она может нести ядерные боеголовки и в основном используется стратегическими бомбардировщиками Ту-95МС и Ту-160. Ее внешний вид и характеристики схожи с американской крылатой ракетой "Томагавк", поэтому она называется "Лыжный Томагавк".
KH-55SM=Х-55SM,,ALCM,Крылатая ракета Х-55SM является модернизированной версией крылатой ракеты Х-55, что еще больше расширяет ее дальность и зону поражения.
KH-555=Х-555,,ALCM,Х-555 - крылатая ракета воздушного базирования, разработанная российской компанией "Тактическое ракетное вооружение" на базе ядерной крылатой ракеты Х-55. Ракета имеет максимальную дальность полета 3500 километров, использует инерциальную навигационную систему и комплексную спутниковую систему наведения ГЛОНАСС, а предельная погрешность составляет менее 20 метров. Она может нести 500-килограммовую обычную боеголовку или ядерную боеголовку. Он используется на стратегических бомбардировщиках Ту-160 и Ту-95МС с 2004 года и впервые был применен в реальных боевых действиях в Сирии в 2015 году, став важной частью системы ядерного сдерживания воздушного базирования российских вооруженных сил.
KH-555S=Х-555S,,ALASCM,Крылатая ракета Х-555S представляет собой противокорабельную версию крылатой ракеты Х-555, оснащенную активной радиолокационной головкой самонаведения.

KH-101=X-101,,ALCM,Крылатая ракета Х-101-это крылатая ракета воздушного базирования, которую российское конструкторское бюро "Радуга" начало разрабатывать в 1991 году и официально вступило в строй в 2013 году. Длина ракеты-7,45м, масса пуска-2300 кг,масса обычной боевой части-400 кг, дальность полета - более 4000 км, круговая вероятностная погрешность - 10 - 20м. Производные модели включают ядерный боеголовочный Х-102и ракеты средней дальности Х-50с той же системой наведения. Он использует радиолокационный поглощающий материал и новую конструкцию формы для снижения обнаруживаемости, оснащен цифровой системой коррекции соответствия изображений сцены и спутниковой системой позиционирования.
