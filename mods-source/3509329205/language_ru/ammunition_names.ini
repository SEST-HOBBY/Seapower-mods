su_kab-1500kr=КАБ-1500KР,,AGM,КАБ-1500КР корпорации "Тактическое ракетное вооружение" - это российская бомба с телевизионным наведением, аналогичная американской управляемой бомбе GBU-8/15, но КАБ-1500КР обладает лучшими характеристиками.

