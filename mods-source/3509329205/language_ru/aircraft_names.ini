DefaultDescription=Ту-160, Бомбардировщик Туполева, кодовое название НАТО "Блэкджек", также известный как "Туполев Ту-160", - советский/российский сверхзвуковой стратегический бомбардировщик дальнего действия с изменяемой стреловидностью крыла. Боевой режим бомбардировщика Ту-160 - это в основном дозвуковой полет на большой высоте, дозвуковой полет на малой высоте или высотный сверхзвуковой налет. На большой высоте он может запускать крылатые ракеты большой дальности для атаки за пределами сети ПВО противника; при выполнении задач по подавлению ПВО он может запускать ракеты малой дальности. Кроме того, он также может совершать налеты на малой высоте, используя бомбы с ядерными боеголовками или запуская ракеты для атаки важных целей.
Бомбардировщик Ту-160 был разработан советским конструкторским бюро Туполева (ОКБ Туполева, ныне Российская объединенная авиастроительная корпорация), поступил на вооружение в мае 1987 года и получил первые боевые характеристики в 1988 году. Его элегантный внешний вид и белая окраска российских ВВС дали ему название "Белый лебедь".
