[wp_tu-160]
Type=战略轰炸机
Default=TU-160,TU-160
DefaultDescription=TU-160,图-160轰炸机，北约代号：Blackjack，译文：海盗旗，又称：图波列夫图-160，是苏联/俄罗斯一型超音速变后掠翼远程战略轰炸机。图-160轰炸机作战方式以高空亚音速巡航、低空亚音速或高空超音速突袭为主，在高空时可发射长程巡航导弹在敌人防空网外进行攻击；担任防空压制任务时，可以发射短距离导弹。此外还可以低空突袭，用核弹头的炸弹或是发射导弹攻击重要目标。
图-160轰炸机由苏联图波列夫设计局（Туполев或Tupolev，现俄罗斯联合航空制造集团）研制，1987年5月开始服役，1988年形成初始作战能力，其优雅的外形和俄罗斯空军的白色涂装使其被赋予“白天鹅”的称号。
Squadron1=TU-160
 

