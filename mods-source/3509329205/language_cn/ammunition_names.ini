# ---------- Anti-ship Missiles ----------
3M22=3M22 锆石,,锆石,3M22锆石或SS-N-33是俄罗斯开发的一种机动反舰高超音速巡航导弹。锆石的估计射程在低空为500公里，在半弹道轨道上可达750公里，但俄罗斯国有媒体报道的射程为1000公里。这是一种两级导弹，第一级使用固体然料，第二级使用超燃冲压发动机这种导弹今年将被纳入基洛夫级战列巡洋舰纳希莫夫上将号，2022年将被纳入彼得大帝号。3M22锆石于2023年2月首次用于战斗，因为乌克兰的报告发现了指向使用高超音速武器的碎片。
#-----------Land Strike only missiles---------
KH-55=Kh-55,,空对地,Kh-55巡航导弹是苏联彩虹设计局于1968年研制的远程亚音速空射核巡航导弹，1983年正式服役。该导弹采用惯性制导与地形跟踪复合制导系统，最大射程2500公里，可携带核弹头，主要由图-95MS、图-160战略轰炸机搭载。其外形与性能接近美国“战斧”巡航导弹，故有“战斧斯基”之称。
KH-55SM=KH-55SM,,空对地,KH-55SM巡航导弹是Kh-55巡航导弹的升级版，进一步扩大射程和打击范围。
KH-555=KH-555,,空对地,KH-555是俄罗斯战术导弹武器公司基于Kh-55核巡航导弹改进的空射巡航导弹。该导弹最大射程达3500公里，采用惯性导航与GLONASS卫星复合制导系统，末端精度误差小于20米，可携带500公斤常规战斗部或核弹头。自2004年开始搭载图-160、图-95MS战略轰炸机部署，2015年首次在叙利亚战场投入实战，成为俄军空基核威慑体系的重要组成部分。
KH-555S=KH-555S,,反水面,KH-555S巡航导弹是Kh-555巡航导弹的反舰版本，加装了主动雷达导引头。
KH-101=KH-101,,空对地,Kh-101巡航导弹是俄罗斯“彩虹”设计局于1991年开始研制的空射巡航导弹，2013年正式服役。该导弹弹长7.45米，发射质量2300千克，常规战斗部重400千克，射程超4000千米，圆概率误差10~20米，衍生型号包括核战斗部型Kh-102和采用同款制导系统的Kh-50中程导弹。其采用雷达吸波材料和新型外形设计降低可探测性，搭载数字场景图像匹配修正系统及卫星定位系统。
