DefaultDescription=TU-160, Tupolev bomber, NATO code name: Blackjack, also known as: Tupolev Tu-160, is a Soviet/Russian supersonic variable-sweep wing long-range strategic bomber. The Tu-160 bomber's combat mode is mainly high-altitude subsonic cruise, low-altitude subsonic or high-altitude supersonic raid. At high altitude, it can launch long-range cruise missiles to attack outside the enemy's air defense network; when performing air defense suppression tasks, it can launch short-range missiles. In addition, it can also conduct low-altitude raids, using nuclear warhead bombs or launching missiles to attack important targets.
The Tu-160 bomber was developed by the Soviet Tupolev Design Bureau (Туполев or Tupolev, now the Russian United Aircraft Corporation), entered service in May 1987, and formed initial combat capabilities in 1988. Its elegant appearance and the white paint of the Russian Air Force gave it the title of "White Swan".
