[---Air/Air&Surface---]

[Obzor-K]  #Obzor-k AESA Radar Complex System.
#Users: wp_tu-160m2
Kind=Radar
Type=DirectedSearch         // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True            // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface          // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True   // True means the radar can see ground objects
Mode=Illuminate             // Can be "Illuminate", "RadioCommand"
TargetChannels=48           // if applicable number of targets it can track simultaneously
WeaponChannels=16           // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360|-90,90         // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=1.0      // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0.2                // min range in km
MaxRange=400                // max range in km
MinAltitude=0               // min altitude in meters, relevant for air, unused for surface
MaxAltitude=60960           // max altitude in meters, relevant for air, unused for surface
RangeResolution=10          // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.1               // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=60.0                   // gain in dB on the sensor
Frequency=Ku-Band           // frequency band
PeakPower=600.0             // output peak power in kW
RequiresAlignment=True      // For aircraft. Allows guide weapon without flying towards target

