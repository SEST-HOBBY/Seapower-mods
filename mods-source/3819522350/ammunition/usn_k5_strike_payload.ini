[General]
# One-way attack payload for the K5 KRAKEN. Kraken lists one-way strike among K5 roles and a
# 1,500 kg payload. The charge detonates at the boat when released within range of the target and
# sinks the boat. Yield, blast radius and range are gameplay estimates.
Type=Bomb
TargetType=ASuW
HideIn=Encyclopedia,Signatures
DecalClass=Standard
GroundDecalClass=GroundImpacts
FrontalArea=2.0
SideArea=4.0
BottomArea=8.0
IOCDate=2026

[WarheadData]
WarheadType=0
Power=55
# Blast radius in metres around the boat.
ImpactSize=40
Penetration=Always
Instant=True

[Guidance]
GuidanceType=0
MidCourseCorrection=0
InitialFlightPhaseDuration=0
MaxVelocity=10000.0
Acceleration=100000
MaxTurnRate=90.0
MinLaunchRange=0
# Point-blank task range. The contact fuse releases the loaded charge at the hull.
MaxLaunchRange=0.000001
WarheadReliability=1
SelfDestructDelay=5.0

[Models]
# The charge detonates at release, so it borrows the stock demolition charge model (as suicide_bomb does).
ResourcesFolder=weapons/rn_as_mk4/
ResourcesRoot=rn_as_mk4
ResourcesMesh=rn_as_mk4
ResourcesMaterial=rn_as_mk4_mat

[Particles]
DudExplosionClass=SmallFlakExplosions
InFlightEffect=None
InFlightEffectStartTime=0
HitShipExplosionClass=LargeShipHitExplosion
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=LargeGroundHitExplosions
ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[Colliders]
Collider=coll_main

[coll_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.005
