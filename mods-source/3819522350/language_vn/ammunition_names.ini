[AmmunitionNames]
usn_copperhead_100m=Copperhead-100M,Copperhead-100M,Torpedo,Anduril lightweight autonomous undersea munition. The included torpedo uses active and passive homing and carries an orange-yellow identification band. Fire ahead of a moving target.
usn_copperhead_500m=Copperhead-500M,Copperhead-500M,Torpedo,Anduril heavyweight autonomous undersea munition. The included torpedo uses active and passive homing and carries an orange-yellow identification band. Fire ahead of a moving target.
usn_k5_strike_payload=K5 one-way attack payload,Strike payload,Demolition charge,Explosive payload of the K5 KRAKEN one-way attack variant. Approach alongside the target and release within 35 m. The blast destroys the boat.
