[Language_en]
Name=K5 KRAKEN One-Way Attack
Description=November 2026, Gulf of Oman. Three K5 KRAKEN one-way attack boats strike an anchored arms transport guarded by patrol boats.
Start=FROM: CTF 55|An arms transport lies at anchor 8 miles east of you, guarded by two Boghammar patrol boats.\n\nSink the transport with the three K5 KRAKEN one-way attack boats. Run in at speed and come up alongside the transport. Each boat must be within 35 m to release its strike payload. Boats cannot close on a large ship from dead ahead, so approach from the beam or the quarter.\n\nThe K5 KRAKEN scout radar shares its contacts with every boat.|Acknowledge
Win=TARGET DESTROYED|The arms transport is sinking.|Continue
Loss=ATTACK FAILED|All three strike boats are gone and the transport is still afloat.|Continue
Objective_Transport=Sink the arms transport
Objective_Scout=Keep the K5 KRAKEN scout afloat
Taskforce1_NumberOfIntelItems=1
Taskforce1_IntelligenceTime1=2,0
Taskforce1_IntelligenceItem1=Arms transport at anchor 8 miles east of the start point. Two Boghammar patrol boats circle it about 1 mile out.

