[Language_en]
Name=Anduril Showcase
Description=October 2026, Gulf of Oman test range. Every Dive-LD, Dive-XL, Copperhead and K5 KRAKEN variant in one daylight trial: clear a mine lane, sink a convoy with Copperhead torpedoes, sink an anchored hulk with the one-way attack boat and hunt a Kilo.
Start=FROM: RANGE CONTROL|All ten vehicles are on the range. The intel log lists each test area.\n\nClear the four mines with the Dive-LD MCM, sink both cargo ships in the eastbound convoy with Copperhead torpedoes and sink the anchored hulk with the K5 one-way attack boat. The Kilo to the southeast is an optional target. The convoy escort and the Kilo hold their fire.|Acknowledge
Mines=LANE CLEAR|The Dive-LD MCM has cleared all four mines.|Continue
Convoy=CONVOY SUNK|Both cargo ships are going down.|Continue
Hulk=HULK DESTROYED|The one-way attack charge has sunk the hulk.|Continue
Kilo=KILO SUNK|The Kilo is destroyed.|Continue
Win=TRIALS COMPLETE|Mine clearance, Copperhead strike and one-way attack trials are all complete.|Continue
Objective_Clear=Clear the four mines with the Dive-LD MCM
Objective_Convoy=Sink both cargo ships with Copperhead torpedoes
Objective_Hulk=Sink the anchored hulk with the K5 one-way attack boat
Objective_Kilo=Sink the Kilo (optional)
Taskforce1_NumberOfIntelItems=5
Taskforce1_IntelligenceTime1=10,0
Taskforce1_IntelligenceItem1=Mine lane: four mines 1.5 to 4 miles east of the start point, along the line of the Dive-LD MCM. Run it east at 15 knots or less. The Dive-LD survey and both Copperhead survey vehicles start just south of the lane.
Taskforce1_IntelligenceTime2=10,0
Taskforce1_IntelligenceItem2=Convoy: a Grisha and two cargo ships head east about 8 miles north of the start point at low speed. The Dive-LD Copperhead, both Dive-XLs and the K5 Strike wait south of their track. Fire Copperheads ahead of the ships.
Taskforce1_IntelligenceTime3=10,0
Taskforce1_IntelligenceItem3=Hulk: an anchored freighter 10 miles east and 6 miles north of the start point, lying east to west. The K5 one-way attack boat waits 1 mile south of it. Approach from the beam and come within 35 m to release the charge.
Taskforce1_IntelligenceTime4=10,0
Taskforce1_IntelligenceItem4=Kilo: a submarine patrols a box 8 to 14 miles east and 4 to 8 miles south of the start point at 300 feet.
Taskforce1_IntelligenceTime5=10,0
Taskforce1_IntelligenceItem5=The K5 KRAKEN scout radar shares its contacts with every vehicle.

