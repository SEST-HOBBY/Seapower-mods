[Language_en]
Name=Copperhead Strike
Description=October 2026, central Atlantic. A Dive-XL and two K5 KRAKEN Strike boats intercept a hostile resupply convoy with Copperhead autonomous torpedoes.
Start=FROM: COMSUBLANT|A hostile resupply group of two cargo ships and a Krivak escort is heading west at 12 knots along latitude 34 08N, about 25 miles east of you.\n\nSink both cargo ships before they pass 30 miles west of the start point. The Dive-XL carries four Copperhead-500M. Each K5 KRAKEN Strike carries two Copperhead-100M. Copperheads run at 32 knots, so fire ahead of the targets, not in a stern chase.\n\nThe K5 KRAKEN scout radar shares its contacts with every unit. Keep the Dive-XL afloat.|Acknowledge
Win=CONVOY STOPPED|Both cargo ships are sunk.|Continue
Loss=DIVE-XL LOST|The Dive-XL has been destroyed.|Continue
Escaped=CONVOY ESCAPED|The cargo ships have passed the intercept line.|Continue
Objective_Sink=Sink both cargo ships
Objective_Protect=Keep the Dive-XL afloat
Objective_Escort=Sink the Krivak escort
