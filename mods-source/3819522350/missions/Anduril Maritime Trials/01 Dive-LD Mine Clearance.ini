[Language_en]
Name=Dive-LD Mine Clearance
Description=September 2026, Gulf of Oman. Two Dive-LD mine countermeasures vehicles must open a mined transit lane while a K5 KRAKEN watches for patrol boats.
Start=FROM: CTF 52|Eight moored mines block the transit lane 2 to 6 miles east of your start point. Run both Dive-LD MCM vehicles down the lane at 15 knots or less. They clear every mine within 0.1 miles of their track.\n\nKeep the K5 KRAKEN clear of the hostile patrol boats to the northeast. Clear the lane within 3 hours.|Acknowledge
Win=LANE OPEN|All eight mines are cleared. The transit lane is open.|Continue
Loss=MCM FORCE LOST|Both Dive-LD vehicles are lost. The lane stays closed.|Continue
TimeUp=TIME EXPIRED|The lane is still mined after 3 hours. The transit is cancelled.|Continue
Objective_Clear=Clear all eight mines from the transit lane
Objective_Protect=Keep at least one Dive-LD MCM operational
Taskforce1_NumberOfIntelItems=2
Taskforce1_IntelligenceTime1=4,0
Taskforce1_IntelligenceItem1=Mine line reported along the lane from 2 to 6 miles east of the start point, within 0.3 miles either side of the lane centre.
Taskforce1_IntelligenceTime2=4,0
Taskforce1_IntelligenceItem2=Two hostile Boghammar patrol boats operate about 8 miles northeast of the lane.

