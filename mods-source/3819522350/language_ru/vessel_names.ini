[usn_uuv_dive_ld]
Type=UUV,Autonomous Undersea Vehicle
Default=Dive-LD,Dive-LD
DefaultDescription=The Dive-LD is a large diameter autonomous undersea vehicle that Anduril gained when it bought Dive Technologies in 2022. About 19 ft long and 4 ft across, it is rated to dive to 6,000 m and can stay out for up to ten days at low speed, carrying more than a cubic meter of mission payload for survey, anti-submarine or mine countermeasures work.\nThis survey version carries a high frequency sonar and an acoustic intercept receiver.
Variant1=Dive-LD,Dive-LD

[usn_uuv_dive_ld_mcm]
Type=UUV,Autonomous Undersea Vehicle
Default=Dive-LD MCM,Dive-LD MCM
DefaultDescription=The Dive-LD is a large diameter autonomous undersea vehicle that Anduril gained when it bought Dive Technologies in 2022. About 19 ft long and 4 ft across, it is rated to dive to 6,000 m and can stay out for up to ten days at low speed, carrying more than a cubic meter of mission payload for survey, anti-submarine or mine countermeasures work.\nThis mine countermeasures version clears sea mines along its path.
Variant1=Dive-LD MCM,Dive-LD MCM

