DefaultDescription=Copperhead is a family of autonomous undersea vehicles that Anduril unveiled in April 2025, offered in two sizes and able to exceed 30 knots. Its munition version, Copperhead-M, is a torpedo built to be carried and launched by uncrewed vehicles such as the Dive-XL.\nThe Copperhead-500 is the larger of the two. This unarmed survey version carries survey sonar and an acoustic intercept receiver and shares its contacts with the task force.
Variant1=Copperhead-500,Copperhead-500

[usn_usv_k5_kraken]
Type=USV,Uncrewed Surface Vessel
Default=K5 KRAKEN,K5 KRAKEN
DefaultDescription=The K5 KRAKEN is a fast optionally crewed surface vessel from Britain's Kraken Technology Group, built for littoral strike and security missions. Its builder rates it at up to 65 knots, with up to two tonnes of payload and about 1,000 nm of range at 30 knots. In April 2026 Anduril agreed to build K5 boats in the United States for the US Navy, fitted with its Lattice autonomy software.\nThis reconnaissance version carries a navigation radar and a stabilized day and thermal camera turret and shares its contacts with the task force.
Variant1=K5 KRAKEN,K5 KRAKEN

[usn_usv_k5_kraken_strike]
Type=USV,Uncrewed Surface Vessel
Default=K5 KRAKEN Strike,K5 Strike
DefaultDescription=The K5 KRAKEN is a fast optionally crewed surface vessel from Britain's Kraken Technology Group, built for littoral strike and security missions. Its builder rates it at up to 65 knots, with up to two tonnes of payload and about 1,000 nm of range at 30 knots. In April 2026 Anduril agreed to build K5 boats in the United States for the US Navy, fitted with its Lattice autonomy software.\nThis strike version carries two Copperhead-100M torpedoes on deck release rails.
Variant1=K5 KRAKEN Strike,K5 Strike

[usn_usv_k5_kraken_owa]
Type=USV,Uncrewed Surface Vessel
Default=K5 KRAKEN One-Way Attack,K5 OWA
DefaultDescription=The K5 KRAKEN is a fast optionally crewed surface vessel from Britain's Kraken Technology Group, built for littoral strike and security missions. Its builder rates it at up to 65 knots, with up to two tonnes of payload and about 1,000 nm of range at 30 knots. In April 2026 Anduril agreed to build K5 boats in the United States for the US Navy, fitted with its Lattice autonomy software.\nThis one way attack version carries an explosive payload and detonates alongside its target.
Variant1=K5 KRAKEN One-Way Attack,K5 OWA

[usn_usv_k5_kraken_steelfin]
Type=USV,Unmanned Surface Vessel
Default=K5 KRAKEN Steelfin USV,K5 KRAKEN Steelfin USV
DefaultDescription=The K5 KRAKEN is a fast optionally crewed surface vessel from Britain's Kraken Technology Group, built for littoral strike and security missions. Its builder rates it at up to 65 knots, with up to two tonnes of payload and about 1,000 nm of range at 30 knots. In April 2026 Anduril agreed to build K5 boats in the United States for the US Navy, fitted with its Lattice autonomy software.\nThis imagined air defense version carries two Anduril Steelfin surface to air interceptors on a deck launcher.
Variant1=K5 KRAKEN Steelfin USV,K5 KRAKEN Steelfin USV
