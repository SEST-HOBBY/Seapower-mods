DefaultDescription=The Dive-LD is a large diameter autonomous undersea vehicle that Anduril gained when it bought Dive Technologies in 2022. About 19 ft long and 4 ft across, it is rated to dive to 6,000 m and can stay out for up to ten days at low speed, carrying more than a cubic meter of mission payload for survey, anti-submarine or mine countermeasures work.\nThis version carries two Copperhead-100M torpedoes.
Variant1=Dive-LD Copperhead,Dive-LD CH

[usn_uuv_dive_xl]
Type=XLUUV,Extra-Large Autonomous Undersea Vehicle
Default=Dive-XL,Dive-XL
DefaultDescription=The Dive-XL is Anduril's extra large autonomous undersea vehicle, built around a large modular payload bay. It can travel long distances and launch dozens of Copperhead-100M or several Copperhead-500M torpedoes.\nThis version carries four Copperhead-500M torpedoes.
Variant1=Dive-XL,Dive-XL

[usn_uuv_dive_xl_100m]
