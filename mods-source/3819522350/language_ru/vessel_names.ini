Default=Dive-XL Copperhead-100M,Dive-XL 100M
DefaultDescription=The Dive-XL is Anduril's extra large autonomous undersea vehicle, built around a large modular payload bay. It can travel long distances and launch dozens of Copperhead-100M or several Copperhead-500M torpedoes.\nThis version carries 24 Copperhead-100M torpedoes.
Variant1=Dive-XL Copperhead-100M,Dive-XL 100M

[usn_uuv_copperhead_100]
Type=UUV,Autonomous Undersea Vehicle
Default=Copperhead-100,Copperhead-100
DefaultDescription=Copperhead is a family of autonomous undersea vehicles that Anduril unveiled in April 2025, offered in two sizes and able to exceed 30 knots. Its munition version, Copperhead-M, is a torpedo built to be carried and launched by uncrewed vehicles such as the Dive-XL.\nThe Copperhead-100 is the smaller of the two. This unarmed survey version carries survey sonar and an acoustic intercept receiver and shares its contacts with the task force.
Variant1=Copperhead-100,Copperhead-100

