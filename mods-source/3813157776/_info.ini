[Language_en]
Name=Dynamic Campaign Mod
Description=A Victory at Sea style naval war for Sea Power: a live strategic map where every contact becomes a real battle, with supply over the sea lanes, fog of war, shipyards, landings, a land war on the fronts and an enemy AI. Play as Theatre Commander, in charge of the whole fleet, or in Career, one officer rising through the ranks. Five campaigns in the Campaign menu: start with the tutorial, DCM Black Sea 1985 Tutorial: First Command (as NATO); then DCM Pacific 1985: Island by Island (as Blue) and DCM Pacific 1985: Red Tide (as Red), US / Japan / Australia against the Soviet Union and China; and DCM Atlantic 1972: Hold the Gap (as NATO) and DCM Atlantic 1972: Red Storm Rising (as the Warsaw Pact). Requires BepInEx and AnchorChain.

[Compatibility]
GreaterThanEqualToVersion=0.9.2
LessThanVersion=0.10.0
