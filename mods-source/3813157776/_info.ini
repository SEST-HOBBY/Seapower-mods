[Language_en]
Name=Dynamic Campaign Mod
Description=Alpha. A Victory at Sea style naval war for Sea Power: a live strategic map from Australia to Hawaii and the Sea of Okhotsk where every contact becomes a real battle, with logistics, convoys, fog of war, shipyards, invasions and an enemy AI. Campaigns: Pacific 1985, US / Japan / Australia against the Soviet Union and China, in the Campaign menu as DCM Pacific 1985: Island by Island (as Blue) and DCM Pacific 1985: Red Tide (as Red); and Atlantic 1972, NATO against the Warsaw Pact from Norfolk to the Kola, the Baltic and the Mediterranean, as DCM Atlantic 1972: Hold the Gap (as NATO), with Red Storm Rising coming soon. Requires BepInEx and AnchorChain.

[Compatibility]
GreaterThanEqualToVersion=0.8.3
LessThanVersion=0.9.0
