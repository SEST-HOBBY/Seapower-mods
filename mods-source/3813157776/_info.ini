[Language_en]
Name=Dynamic Campaign Mod
Description=Alpha. A Victory at Sea style naval war for Sea Power: a live strategic map from Australia to Hawaii and the Sea of Okhotsk where every contact becomes a real battle, with logistics, convoys, fog of war, shipyards, invasions and an enemy AI. Campaign: Pacific 1985, US / Japan / Australia against the Soviet Union and China, in the Campaign menu as Bungalow's Dynamic Campaign Pacific 1985. Requires BepInEx and AnchorChain.

