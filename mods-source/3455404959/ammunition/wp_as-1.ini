[General]
#YJ-6 (I) based on P-15 Termit
# Users: 
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation,ShoreTargetsOnly // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=3000                              // in kg. Used for aircraft
AmmoPoints=12000                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

SaturationValue=1

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=120
ImpactSize=VeryLarge                        // Impact size, can be small, medium, large, verylarge
Penetration=Always                      // can be minor, moderate, heavy, always

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=3.0                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=12.0        // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=200                     // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=35.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=1.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=600      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=6.0                // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
TerminalDiveDistance=3.0                 // in N. miles.
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=590                        // Maximum speed in knots
Acceleration=1.5                       // Acceleration factor
MaxTurnRate=6.0                       // Maximum turnrate in degrees per second
MinLaunchRange=5.0                     // Minimum launch range in nautical miles
MaxLaunchRange=54.0                    // Maximum launch range in nautical miles
LaunchReliability=90                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=50     // Circular error vs 'Installation' land units
#Homing
SeekerGain=20                          // Seeker gain in dB
SeekerFOV=30,8                        // Seeker field-of-view in degrees
SeekerActiveRange=6.5                 // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=20                           // Active radar seeker output peak power in kW
#ECCM
AntiCountermeasuresBonus=0.10           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.05                   // This value substracted from probability of being jammed  (0...1)

#SelfDestruct
SelfDestructDelay=10.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/wp_ks1/
ResourcesRoot=KS1_v4.obj
ResourcesMesh=Body
ResourcesMaterial=ks1_mat.ini
// optional below
#ResourcesMeshForLaunch=pla_yj-6
#ResourcesMeshSwitchTime=0.1  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=2

SubModel1=Wings
SubModel2=Parts

[Wings]
Mesh=Wings
Material=ks1_mat.ini

[Parts]
Mesh=Parts
Material=ks1_mat.ini

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
#BoosterEffect=effects/weapons/emitters/sam_small_effect
#BoosterEffectPosition=0,0,-0.045
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,0
InFlightEffectStartTime=12.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions

HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=VeryLargeGroundHitExplosions

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.008,0.008,0.082