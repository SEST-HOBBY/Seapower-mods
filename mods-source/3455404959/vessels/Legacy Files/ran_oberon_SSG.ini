[General]
UnitType=Submarine
DefaultCameraDistance=1.0
MinCameraDistanceForeAft=1
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.0

Length=90                   // in meters
Beam=8.1                      // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=2410              // in tons

MaxForwardVelocity=17.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=12.0
MaxBackwardVelocitySurfaced=4.0
MaxBackwardVelocity=5.0        // sets the max backward velocity
TelegraphVelocities=-5,0,3,5,10,14,17

BowUnderWater=10.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=25.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.6                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=15.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=9.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=-3.0	//5.5                 // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0        // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=40.0            // in feet
CrushDepth=1000              // in feet

CavitationParameters=20,-100


#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
LowMagneticHull=True
# Sonar related
BaseNoise=130                   // base sound level in db at 1m distance
FlowNoise=1.0                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=20              // additional noise for cavitation in db
TargetReflectionStrength=18     // in dB for broad side
BladesCount=7                   //number of blades on vessel's propulsion systems
ElectricFrequency=60            //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_oberon

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=4
ASW_Capability=2

#Defence
#Special
Role=SS

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=7360
AdditionalNoise=18        //Added to current noise level when running on this power
Collider=coll_engineroom

[SnorkelMastSystem]
MaxForwardVelocity=12
Collider=coll_snorkel_mast
Mount=Snorkel
OpenSystemAnimation=RaiseSnorkel
CloseSystemAnimation=LowerSnorkel
ModuleType=Inert

[AuxPowerSystem]
Type=Electric
HorsePower=6000
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
