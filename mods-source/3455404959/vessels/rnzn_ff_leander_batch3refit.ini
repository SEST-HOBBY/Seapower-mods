[General]
UnitType=Vessel
DefaultCameraDistance=1.5
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.05

Length=113.4                     // in meters
Beam=12.5                      // in meters

CompartmentsHeight=0       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[---------- FlightDeck Definitions ----------]
[AirGroup]
rnzn_sh-2gi=Squadron1,1

[FlightDeck]
AircraftCapacity=1
NumberOfElevators=1
NumberOfLaunchPoints=1
NumberOfRecoveryPoints=1
NumberOfTaxiPaths=1
#AircraftSupported=rn_sea_lynx,rn_wasp

# ------------ Preparation/Launch ------------
LaunchDelay=5
GroundCrewCount=1
DeckParkSlots=1

HoldWaypoints=0,300,0.8|0.8,300,0|0,300,-0.8|-0.8,300,0
HoldStackSeparation=200 //In feet
HoldSpeed=200           //In knots. Landing is permitted once speed was lower than this

# ---------- Flight Deck Ammunition ----------
FlightDeck_AmmoCapacity=1300/1300             // Ammo points. Can be numerical value or "Unlimited"

FlightDeck_NumberOfAccountableAmmunitionCategories=1
FlightDeck_AccountableAmmunitionCategory_1=AirTorpedo,12/12

SystemGroup=SG_Hangar
Collider=coll_hangar

[Elevator1]
AssociatedLaunchPoints=1

HangarOpenAnimation=HangarOpenAnim
HangarCloseAnimation=HangarCloseAnim

SpawnPosition=0,0.055,-0.175
RidePosition=0,0.055,-0.25

CloseDoorsAfterTaxi=True
RequiresFreeLaunchpoint=True

[LaunchPoint1]
AllowedType=Helicopter
Position=0,0.055,-0.46

[RecoveryPoint1]
AllowedType=Helicopter
AssociatedElevators=1
Position=0,0.055,-0.46
Rotation=0,4,0                      // in degrees
CircuitWaypoints=0,100,-0.4

[TaxiPath1]
From=Elevator1
To=LaunchPoint1
IsBackwards=True

[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
#all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=3245              // in tons

MaxForwardVelocity=28        // sets the max forward velocity
MaxBackwardVelocity=6        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=1.29
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
RudderForce=0.54                // multiplicator defining how agile the ship can turn

TiltFactor=1.2                 // defines how strong the tilting will be
PitchFactor=0.3                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.0                  // default trim depth in 
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.01,0          // center of mass for physics
CavitationSpeed=4		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=11.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiLarge
# Radar related (RCS => radar cross section)
RCS=SemiLarge
# Sonar related
BaseNoise=145                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
MachineryRaftingGeneration=2

[Animations]
NumberOfAnimationReferences=2
AnimationFile_1=animations_rn_ff_leander_batch2
AnimationFile_2=animations_rails-launcher

