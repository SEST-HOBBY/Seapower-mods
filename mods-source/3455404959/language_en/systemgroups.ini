M134=M134|M134 Minigun|The M134 Minigun is an American 7.62×51mm NATO six-barrel rotary machine gun with a high rate of fire (2,000 to 6,000 rounds per minute). It features a Gatling-style rotating barrel assembly with an external power source, normally an electric motor.
MK15A=Phalanx Blk-1|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1 upgrade expands ammo capacity by 50%, fire rate by 50%, increases the maximum elevation of the gun, improves the radar, and increases system performance against high-speed threats, although it still is deficient against sea-skimming supersonic maneuvering anti ship missiles. From Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.
MK15C=Phalanx Blk-1B|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1B model adds a FLIR and television camera to the side for increased performance against small, maneuvering sea targets, and improves capabilities against very low observable (VLO) targets such as stealthy missiles.\n\nFrom Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.
#---------------------------------------- Aircraft Guns ----------------------------------------
NR-30=30mm Cannon|NR-30 30mm Autocannon|The Nudelman–Richter NR-30 is a 30 mm autocannon fitted to Soviet fighters such as the MiG-19 and MiG-21F-13. Firing high-explosive and armor-piercing shells at high muzzle velocity, the NR-30 delivers excellent short-burst lethality against aircraft and light targets, though with limited ammunition capacity.
Hispano MK.V=Hispano MK.V|MK.V|The Hispano MK.V was a Spanish-Swiss designed 20mm cannon which saw huge export success and was licensed built by countries like Britain and the US.
