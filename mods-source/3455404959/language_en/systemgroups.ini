130mm_B-2LM=130mm B-2LM|130mm B-2LM|The 130mm B-2LM is a Soviet two-gun naval artillery turret, based on the WW2 130mm "B-13" gun. The "B-2LM" was installed on several Soviet Navy ships, including the destroyer leader Tashkent, the Ognevoy-class destroyer, and the Skory-class destroyer.
