Sperry_BQG-4=BQS-4|The Sperry BQG-4 is an American made low frequency passive sonar similar to the AN/BQR-21 sonar.

Krupp_CSU3-41=CSU3-41|The Krupp CSU3-41 is an German made medium frequency active sonar.

MEL_Manta_UAL=MEL Manta UAL|Electronic Support Measure system for the Oberon class submarine, allowing them to snoop on common communication and radar bands.

Type_2007=Type 2007|The Type 2007 is a British long range passive sonar.

Type_187=Type 187|The Type 187 is a British low frequency active/passive attack sonar.

Type_1002=Type 1002|The Type 1002 is a surface search navigation radar used by Royal Navy submarines.

MEL_Manta_UAL=MEL Manta UAL|Electronic Support Measure system for the Oberon class submarine, allowing them to snoop on common communication and radar bands.

MULLOKA=Mulloka|Australian medium-frequency hull-mounted sonar introduced in the late 1970s. Optimized for regional ASW operations, it offered improved target tracking and resolution compared to earlier systems like the SQS-26, though with slightly reduced detection range. Fitted to a wide range of RAN vessels.
TMS4131=Spherion TMS4131|The Thales Spherion TMS4131 is a medium-frequency hull-mounted sonar providing improved active and passive detection for modern surface combatants. Features digital beamforming and advanced signal processing for enhanced target classification and tracking in littoral and open-water environments. Replaced older Mulloka and SQS-56 systems during the Adelaide-class FFG upgrades.

Type_177=Type 177|The Type 177 is a hull-mounted, medium-frequency sonar, which scans a 360-deg area around the ship. It was the first British scanning sonar.
