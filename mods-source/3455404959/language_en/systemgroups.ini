Snoop_Plate=Snoop Plate|"Flag" (NATO Reporting name: Snoop Plate) is a search radar carried by the Foxtrot class submarines.
MG-11=MG-11 "Tamir-11"|The MG-11 "Tamir-11" (NATO Reporting name: Stag Hoof) is a high-frequency active searchlight sonar used for target detection and fire-control on early Soviet submarines before the advent of integrated sonars.
MG-10=MG-10 "Feniks"|The MG-10 "Feniks" (NATO Reporting name: Trout Cheek) is a medium-frequency passive sonar equivalent to the wartime German 'Balkon-gerät' and the first Soviet system to use a cylindrical array. It was used on early Soviet submarines before the advent of integrated sonars.
Stop_Light_A=Nakat ESM|The Nakat suite (NATO Reporting name: Stop Light A) is an early Soviet ESM system found on the first generation of Soviet submarines, and is mostly just a radio intercept system to detect search radar emissions in low light conditions, although it does have some ability to monitor surface groups over the horizon.
Quad_Loop=Quad Loop HF/DF|The Quad Loop HF/DF set is a submarine-mounted radio intercept and direction-finding system to determine bearing and power of emitted HF radio signals at extremely long range.

