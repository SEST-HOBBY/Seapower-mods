#---------------------------------------- Radar ----------------------------------------
#Air/Air&Surface
Type_992Q=Type 992Q|Type 992Q is a high power, operating in S band naval radar providing rapid target indication for weapons.
Type_965=Type 965|The Type 965 was a VHF band long-range early warning suveillance radar, designed primarily to be fitted in destroyers and frigates. Type 965 used the AKE-2 “double-bedstead” antenna.
LW-02=LW-02|LW-02 is a Dutch long range air surveillance radar operating in the L band. The LW-02 was exported to many countries, beginning with Sweden, later including Australia, Colombia and Germany.
LW-03=LW-03|The LW-03 was developed in the late 1950s as a long-range air surveillance radar operating in the L band. It is a modernized version of the LW-02 with improved anti-jamming characteristics and uses the same antenna.
LW08=LW-08|The JUPITER/LW-08 2D-early warning radar performs long-range air surveillance onboard medium and heavy-tonnage ships. JUPITER/LW-08 operates in D band, and is available with a cost-effective fully solid-state transmitter. The antenna is mounted on a lightweight hydraulically stabilised platform (roll and pitch).
DA-05=DA-05|The Indonesian Ahmad Yani-class frigates (formerly the Dutch Van Speijk-class) use the Signaal DA-05 medium-range radar for air and surface surveillance, providing target detection and reporting to both gun and missile fire-control directors.
Type 992=Type 992|The Type 992 is a high power, operating in S band naval radar providing rapid target indication for weapons. It can also be used as medium range air and surface warning radar.
Type 984=Type 984|Type 984 radar was a British radar system introduced in the mid-1950s. It was a rotating mechanically stabilized 3D S band radar, measuring longitudinal position, latitudinal position, as well as target altitude.
SPS-49(V)5=SPS-49(V)5|A late Cold War upgrade of the baseline SPS-49, this version provided enhanced range performance and reliability over earlier models. Used widely by U.S. and allied navies in the 1980s and early 1990s as a key 2D long-range air search radar.
SPS-49A(V)1=SPS-49A(V)1|An enhanced mid-1990s variant of the long-range 2D air search radar. It introduced Doppler-based target velocity tracking and improved clutter rejection, offering better performance against sea-skimming and low-RCS threats. Commonly fitted during NTU upgrades to legacy ships.
#Surface only
Type_978=Type 978|The Type 978 radar is an older Royal Navy navigation radar based on the commercial Decca 45.
Type 1006=Type 1006|The Type 1006 was an operating in X band radar used in HM ships and submarines to providing range and bearing information for navigation, pilotage and surface surveillance purposes.
Type277Q=Type277Q|The Type 277 was a surface search and secondary aircraft early warning radar used by the Royal Navy and allies during World War II and the post-war era.
#Fire Control
Type_901=Type901|The Type 901 is an fire control radar for the beamriding Seaslug missile, operating in the X-Band.
Type_903=Type903|A British version of the American MK-56 gun FCR.
Type_993=Type 993|Type 993 is a short-range, general-purpose radar fitted in several older frigate classes. The Type 993 is used for air and surface search, and for target designation. Its antenna is a "quarter cheese," a shape that resembles a quarter of a cheese wheel; this configuration prevents the feed horn from obstructing the main radar beam. 
SPN-35=SPN-35|AN/SPN-35 is a 3D ATC radar used aboard aircraft carriers and other air-capable ships to provide identification and control of aircraft within a 26 nautical mile range from the ship.
HSA_M44=HSA M44|The Indonesian Ahmad Yani-class frigates (formerly the Dutch Van Speijk-class) utilize the dual HSA M44 director configuration to manage their short-range seacat air defense systems.
HSA_M45=HSA M45|The Indonesian Ahmad Yani-class frigates (formerly the Dutch Van Speijk-class) retain the HSA M45 gun directors to provide radar and optical fire-control for surface and air targets, guiding the ships’ primary gun armament.
WM22_FCS=WM-22 FCS|Part of the WM-20 series of Dutch made track while scan fire-control radar systems developed in the late 1960s to early 1970s, the WM-22 was a simpler version of the original WM-20 for use on larger vessels, with guns only.
R76_C5_GFCS= R76-C5 FCS|The R76-C5 fire-control system is a U.S.-designed and built gunnery system developed by the RCA Corporation. It was designed for naval vessels to manage and control gunnery operations.
#---------------------------------------- ESM ----------------------------------------
C-Pearl_ESM=C-Pearl-DV|The Rafael C-Pearl-DV is a modern digital electronic support measures (ESM) suite providing wideband detection, accurate emitter classification, and high-precision bearing data. Fully integrated into the ship’s combat system and data links, replacing legacy SLQ-32(V) systems during FFG upgrades.
UAA-1_ESM=UAA-1 Abbey Hill|British designed passive shipborne electronic support system that detects, classifies, and provides bearing to hostile radar emitters. Supports threat warning, situational awareness, and automated or manual cueing of jammers, chaff, and decoy systems to enhance ship self-defence against radar-guided weapons.
Argo_Phoenix_ESM=ArgoSystems Phoenix|American-designed passive electronic support measures system fitted to modernized RNZN Leander-class frigates. Detects, classifies, and provides bearing information on hostile radar emitters including air search, surface search, fire-control, and missile guidance radars. Provides threat warning, situational awareness, and cueing support for shipboard ECM and decoy systems.
#---------------------------------------- ECM ----------------------------------------
Blue Eric=GEC-Marconi ARI.23246/1 Sky Shadow|Blue Eric, Blue Eric was an attempt to cram the GEC-Marconi ARI.23246/1 Sky Shadow components into a 30mm gun pod of the Harrier.
C-Pearl_ESM=C-Pearl-DV|The Rafael C-Pearl-DV is a modern digital electronic support measures (ESM) suite providing wideband detection, accurate emitter classification, and high-precision bearing data. Fully integrated into the ship’s combat system and data links, replacing legacy SLQ-32(V) systems during the Adelaide-class FFG upgrades.
EA-2118_ECM=Elbit EA‑2118|The Elbit EA‑2118 ECM suite was adopted by the RAN during the Adelaide-class FFG upgrade program as an alternative to the U.S. SLQ‑32(V)5 sidekick jammer. It provided a credible modern naval electronic attack capability, with a broad RF band footprint, adaptive jamming, and better power amplification than earlier SLQ‑32(EA) sidekick configurations. Fully integrated into the ship’s combat system, EA‑2118 enhanced self‑defense against multi‑band radar threats and complemented the primary C‑Pearl‑DV ESM sensors.
RCM-3_ECM=RCM-3 (Type 670) ECM|A British designed shipborne electronic countermeasures system providing active radar jamming and interference against hostile radar and fire-control emissions. Designed to disrupt or degrade enemy radar tracking and targeting, it works in conjunction with the vessel’s EW receivers and countermeasures to enhance self-defence against radar-guided threats.
Generic_ECM=Defensive ECM Jammer|Defensive ECM (DECM) can intercept enemy radar signals, modulate them, and retransmit them to the reciver in order to confuse the enemy radar as to the real location of the target.
PST1288_HVU_ECM=Telegon PST-1288 HVU|British-designed defensive electronic countermeasures system fitted to modernized RNZN Leander-class frigates. Provides active jamming and deception against hostile fire-control radars, missile guidance systems, and radar seekers to reduce the effectiveness of radar-guided anti-ship weapons and targeting systems.
#---------------------------------------- Aircraft Radar ----------------------------------------
#Air/Air&Surface
AN/APG-66lite=AN/APG-66|AN/APG-66 is a multi-mode X-band pulse-Doppler radar with look-down/shoot-down capability. It supports air-to-air and air-to-ground modes, offering track-while-scan and limited terrain-following for precision targeting.
Ferranti Blue Fox=Ferranti Blue Fox|Blue Fox, designed by Ferranti was a requirement to equip the FRS.1 Harrier with the ability to detect anti shipping bombers and maritime recon aircraft with a secondary role for anti-surface operations, eventually replaced by the Blue Vixen in the Sea Harrier FA.2.
Thorn EMI Searchwater=Thorn EMI Searchwater|Searchwater, The Searchwater surveillance radar developed by Thorn EMI was adapted to be used on Royal Navy Seakings after the withdrawal of the Fairey Gannet AEW for use on the Invincible class carriers due to their shortened flight deck.
MEL-ARI-5995=MEL-ARI-5995|The MEL-ARI-5995 was the original search radar fitted to early Westland Sea King ASW helicopters, including those of the RAN. It provided essential surface and limited air search capability for submarine hunting and maritime patrol, later evolving into the improved Super Searcher system.
MEL Super Searcher=MEL Super Searcher|Surface-search radar developed by MEL (UK) and fitted to RAN S-70B-2 Seahawks from 1988. Optimized for detecting and tracking small surface targets, especially submarine snorkels and the like, in littoral and open-ocean environments. Features X-band operation, moderate power output, and basic maritime situational awareness capabilities.
MEL Super Searcher Mod 1=MEL Super Searcher Mod 1|Upgraded variant of the original MEL Super Searcher radar, incorporating enhanced signal processing, greater detection range, and improved resolution. Introduced around 2000 for RAN Seahawks to support improved surface surveillance and low-RCS target detection in congested littoral zones.
H2S_MkIX=H2S MkIX|H2S was the first airborne, ground scanning radar system. It was developed for the Royal Air Force's Bomber Command during World War II to identify targets on the ground for night and all-weather bombing. Development continued through the late-war Mark IV to the 1950s era Mark IX that equipped the V bomber fleet and the English Electric Canberra. The MkIX was a X-band ground-mapping and surface search radar for navigation, target location, and bombing. It provides clear returns from coastlines, cities, and large vessels at medium range.
AN/APQ-65=AN/APQ-65|The AN/APQ-65 was an US-made airborne interception radar used exclusively in the Sea Venom fighter.
#---------------------------------------- Sonar ----------------------------------------
SSQ-53D_Sonar=DIFAR Sonobuoy|The AN/SSQ-53 DIFAR is a passive directional LOFAR sonobouy used for initial detection of submerged submarines.
SSQ-62C_Sonar=DICASS Sonobouy|The AN/SSQ-62 DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys.
Type_177=Type 177|The Type 177 is a hull-mounted, medium-frequency sonar, which scans a 360-deg area around the ship. It was the first British scanning sonar. 
Type750_MF_Active=Graseby Type 750|British export medium-frequency hull-mounted active sonar developed as an improved successor to the Type 184 series. Provides enhanced active detection and tracking of submerged contacts in littoral and open-ocean conditions through improved signal processing, increased sensitivity, and refined beamforming performance. Intended for modernised frigate installations, offering improved range, target resolution, and contact stability for anti-submarine warfare operations compared to earlier Type 184M systems.
