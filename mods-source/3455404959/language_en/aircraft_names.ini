[raaf_f-4e_79]
Type=Fighter
Default=F-4E RAAF (Fict),F-4E RAAF
DefaultDescription=The F-4 is a US-built long-range supersonic jet interceptor and fighter-bomber originally designed for the United States Navy. Its versatile airframe earned widespread adoption by both the USN and USAF. The F-4E variant solved earlier shortcomings by integrating an internal M61 Vulcan cannon and improved avionics. Under Project Peace Reef, the Royal Australian Air Force operated 24 USAF F-4Es from 1970 to 1973 as an interim measure while awaiting the delayed F-111C. This is a 'what-if' version had the RAAF instead retained the Phantom. By the late 1970s, the fleet has been comprehensively modernized with laser-guided bomb capability, AGM-65 Maverick air-to-ground missiles, AGM-45 Shrike anti-radiation missiles, and upgraded electronic countermeasures, significantly enhancing its strike and SEAD roles. No. 2 Squadron RAAF, a historic bomber and reconnaissance squadron that served through WWII, Korea and Vietnam reformed to fly the Phantom as the frontline squadrons transitioned to the new F-111C. The Phantom thus could have remained a cornerstone of Australian air power as a multirole fighter well into the 1980s.
Squadron1=F-4E 2 Squadron RAAF,2 Sqn
Callsigns=Squadron1,Dingo

