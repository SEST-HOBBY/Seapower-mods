DefaultDescription=The Electric English Canberra was the first jet powered bomber designed for the Royal Air Force. Initially designed as a medium bomber they first entered service in 1951 and were eventually retired in 2007. The ‘B’ bomber versions could carry a variety of bombs, missiles and rockets, including nuclear weapons. The ‘PR’ photo reconnaissance versions were instead fitted with a variety of cameras for intelligence gathering operations. The B.20 was the the licence-built version used by the RAAF, serving from 1953, it was deployed during the Malayan Emergency and served extensively in the Vietnam War - No. 2 Squadron flew about 12,000 sorties and dropped 76,389 bombs during the war. Due to delays in acquiring the F-111C, the Canberra remained in service right up until 1982.
