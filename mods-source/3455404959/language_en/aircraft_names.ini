DefaultDescription=The Fairey Gannet AS.1 is a British twin-engine, turboprop, three-seat, carrier-based aircraft. Designed for anti submarine warfare and strike missions for the Royal Navy's Fleet Air Arm, it served from the late 1940s to the early 1970s. It is capable of carrying a variety of armaments including depth charges, bombs and rockets along with sonobuoys. The Royal Australian Navy operated the AS.1 from 1955-1967 aboard HMAS Melbourne and shore establishments, providing an advanced (for the time) anti-submarine platform until replaced by the much more capable S-2E Tracker in 1967.
