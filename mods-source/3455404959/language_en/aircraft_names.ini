DefaultDescription=The Westland Wessex Helicopter was a medium-lift ASW helicopter used from the 1960s through to the 1980s. In Royal Australian Navy service, the Wessex was the primary ASW helicopter aboard HMAS Melbourne from the mid 1960s until the mid 1970s, later moving into SAR and utility roles before gradually being replaced by the Westland Sea King and phased out by 1989. 
Squadron1=HAS.31B 817 Squadron RAN,817 Sqn
