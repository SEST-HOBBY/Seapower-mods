DefaultDescription=The Dassault Mirage III is a supersonic fighter aircraft designed for the French Air Force. First entering service in 1961 it is still operated by Pakistan. An all weather aircraft, the Mirage was designed as an interceptor against high performance Soviet aircraft. However its value as a strike aircraft resulted in the Mirage IIIE fighter bomber design which was widely exported. The Mirage III was selected over the Lockheed F-104 Starfighter for the RAAF to replace the CAC Avon Sabre, entering service in 1965 as the Mirage IIIO(F) for interception and Mirage III(A) for ground attack, although by the late 1960s all (F) models were modified to ground attack specifications. By the late 1970s the Mirage IIIO was equipped with the more capable Matra Magic R550 and American ground attack ordnance. The aircraft had a long service life beyond its expected timeframe, retiring in 1988 before being sold to Pakistan in 1990, replaced by the more advanced F/A-18 Hornet.
