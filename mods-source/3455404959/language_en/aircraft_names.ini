[rnzaf_a-4k]
Type=Attack
Default=A-4K Kahu,A-4K Kahu
DefaultDescription=The A-4K is a variant of the American A-4E/F developed for use by the RNZAF. Project Kahu was a major upgrade program for the A-4K Skyhawk attack aircraft that began in the mid-1980s. Prior to the implementation of the upgrade, the A-4K Skyhawks, which had served with the RNZAF since 1970, had become dated compared to modern jet fighter aircraft. All surviving A-4K and a number of ex-RAN A-4G that were acquired would go through the program. The upgrade included installing the Westinghouse AN/APG-66 radar, RWR and chaff, a new HUD with a range of new features and through miniaturization, the dorsal hump was not required. New weapons included AIM-9L, Maverick and Paveway II LGB integration although no dedicated laser guidance pod was included. The project was named after the Māori-language name for the New Zealand swamp harrier.
Squadron1=A-4K 75 Squadron RNZAF,75 Sqn
Callsigns=Squadron1,Kiwi

[rnzn_wasp]
Type=ASW Helicopter
Default=Wasp HAS.1 RNZN,Wasp
DefaultDescription=The Westland Wasp is a small 1960s British turbine-powered, shipboard anti-submarine helicopter. Produced by Westland Helicopters, it came from the same Saunders-Roe P.531 programme as the British Army Westland Scout, and is based on the earlier piston-engined Saunders-Roe Skeeter. It fulfilled the requirement of the Royal Navy for a helicopter small enough to land on the deck of a frigate and carry a useful load of two homing torpedoes. The Wasp served the Royal New Zealand Navy (RNZN) from the 1960s to 1998 aboard their Leander-class frigates, RNZN pilots flew them, but the Royal New Zealand Air Force's No. 3 Squadron provided maintenance and support.
Squadron1=HAS.1 3 Squadron RNZAF,3 Sqn
Callsigns=Squadron1,Warrior

[rnzn_sh-2gi]
Type=ASW Helicopter
Default=SH-2G,SH-2G
DefaultDescription=Initially developed as a utility helicopter the SH-2F was converted to provide anti-submarine capability to USN escort vessels while operating in concert with shipboard sonar and sonobouys. Replacing the Westland Wasp, The SH-2F was loaned and operated as an interim from 1997-2001 by New Zealand, then exported Seasprites came into service from 2001 - The SH-2G was the designation given to the Seasprite operated by New Zealand. Operating primarily from HMNZNS Canterbury as she was still active from 1997-2005, HMNZ ships Wellington and Waikato may have had some brief trials in their final years. the Seasprite became the mainstay ASW helicopter for New Zealand. RNZN pilots flew them, but the Royal New Zealand Air Force's No. 6 Squadron provided maintenance and support.
Squadron1=SH-2G 6 Squadron RNZAF,6 Sqn
Callsigns=Squadron1,Seahorse

[raaf_canberra_bomber]
