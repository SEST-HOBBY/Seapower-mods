[ran_sea_harrier84]
Type=Fighter
Default=Sea Harrier FRS.50 (Fict), FRS.50
DefaultDescription=Navalised variant of the Harrier jump jet, the Sea Harrier FRS.1 was acquired by the Royal Australian Navy to coincide with the commissioning of HMAS Australia (R22) and given the export designation FRS.50. Based on the land-based Harrier GR.1 and developed from the earlier Kestrel and Hawker P.1127 programs, the aircraft features short/vertical takeoff and landing (STOVL) capability and a Ferranti Blue Fox multi-mode radar for air-to-air and limited maritime targeting. The RAN made minor modifications to the Sea Harrier to be able to equip Harpoon anti-ship missiles and American munitions. Operated primarily as a fleet air defense fighter, the aircraft was also more than capable of undertaking maritime and land strike missions. 
Squadron1=FRS.50 805 Squadron RAN,VF-805
Squadron2=FRS.50 724 Squadron RAN,724 Sqn
Callsigns=Squadron1,Sabre|Squadron2,Warden

[adf_ah-1g]
Type=Attack Helicopter
Default=AH-1G (Fict),AH-1G
DefaultDescription=The AH-1G was the first purpose-built attack helicopter, developed from the UH-1 Iroquois and introduced into service with the U.S. Army during the Vietnam War in 1967. It featured a slim fuselage, tandem seating, a chin turret that could have either twin miniguns or one in combination with a 40mm grenade launcher, and stub wings for rocket pods, providing a fast, agile escort for troop-carrying helicopters. The RAAF acquired a small number of AH-1Gs in 1971 to support Australian Army operations in Vietnam. Operated by No. 9 Squadron RAAF from Vung Tau, the Cobras flew escort, close air support, and armed reconnaissance missions alongside UH-1H Iroquois helicopters, greatly enhancing the firepower available to Australian forces in theatre.
Squadron1=AH-1G 9 Squadron RAAF,9 Sqn
Callsigns=Squadron1,Redback

[ran_h34]
Type=Helicopter,ASW Helicopter
