DefaultDescription=The Dassault Mirage III is a supersonic fighter aircraft designed for the French Air Force. First entering service in 1961 it is still operated by Pakistan. An all weather aircraft, the Mirage was designed as an interceptor against high performance Soviet aircraft. However its value as a strike aircraft resulted in the Mirage IIIE fighter bomber design which was widely exported. The Mirage III was selected over the Lockheed F-104 Starfighter for the RAAF to replace the CAC Avon Sabre, entering service in 1964 as the Mirage IIIO(F) for interception and Mirage III(A) for ground attack, although by the late 1960s all (F) models were modified to ground attack specifications. The aircraft primarily performed the air defence and interception roles but could also perform strike missions with SNEB rocket pods and unguided bombs.
