Default=F-4E RAAF,F-4E RAAF
DefaultDescription=The F-4 is a US-built long-range supersonic jet interceptor and fighter-bomber originally designed for the United States Navy. The airframe proved highly flexible and was widely adopted by both the USN and USAF. The F-4E variant addressed earlier models' shortcomings by incorporating an internal M61 Vulcan cannon. Under Project Peace Reef, the Royal Australian Air Force operated 24 USAF F-4Es from 1970 to 1973 as an interim measure while awaiting the delayed F-111C. These aircraft served with No. 1 Squadron and provided valuable strike and air defence capabilities during their brief but impactful service.
Squadron1=F-4E 1 Squadron RAAF,1 Sqn
Squadron2=F-4E 6 Squadron RAAF,6 Sqn
