DefaultDescription=The Royal Australian Navy (RAN) operated the de Havilland Sea Venom FAW.53 actively from 1956 to 1967, primarily for all-weather fighter protection. Armed with four 20mm cannon and able to be equipped with rockets, they could perform light strike missions if required. At the time of their arrival, the RAN operated Sea Venoms were the only radar equipped and all-weather combat aircraft in the Southern Hemisphere. Outclassed by the mid-1960s, they were replaced in the fleet defence role by the A-4G Skyhawk although they soldiered on in the shore based 724 Squadron for the training role until at least 1973.
