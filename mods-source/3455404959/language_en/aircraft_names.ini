DefaultDescription=The Grumman S-2 tracker was a dedicated fixed wing ASW aircraft developed for the United States Navy, entering service in 1954. The first U.S. navy aircraft designed to be able to both detect and destroy enemy submarines, they were in service with the USN until 1976. However they were a popular aircraft for export and saw service with many countries. The S-2E began RAN service in 1967 aboard HMAS Melbourne, all but three of the S-2Es were destroyed by a deliberately lit fire in December 1976, and 16 S-2G Trackers were rapidly acquired to replace them.
Squadron1=S-2E 816 Squadron RAN,816 Sqn
