DefaultDescription=A maritime variant of the Black Hawk helicopter, the S-70B-2 was introduced into RAN service in 1988 for anti-submarine and surface warfare roles. This is a semi-fictional 2000's improved variant equipped with a dipping sonar which was historically not included in the RAN variant, plus the American SSQ-53D and SSQ-62C sonobouys, which were considered in a potential update but never pursued in reality due to the MH-60R already planned as a replacement. The MEL Super Searcher has been updated to represent the digital upgrades these helicopters received in a refit. The S-70B-2 continued to operate from Australian frigates and destroyers, until superseded by the much more capable MH-60R 'Romeo' Seahawk by 2017.
Squadron1=S-70B-2 816 Squadron RAN,816 Sqn
Callsigns=Squadron1,Tiger

[ran_as350_recon]
Type=Helicopter,Recon Helicopter
Default=AS.350BA (Recon), AS.350BA
DefaultDescription=Introduced into Royal Australian Navy service in 1984, the Aerospatiale AS.350BA Squirrel was operated by 723 Squadron from HMAS Albatross and regularly embarked aboard RAN frigates and destroyers. Known affectionately as the 'Battle Budgie,' the type was used for pilot training, utility transport, light reconnaissance, and ship-to-shore liaison. Though unarmed in standard service, Squirrels could be fitted with door-mounted machine guns for defensive purposes during deployments such as the 1990–91 Gulf War. As part of the deployment, the Squirrels also received extensive operational modifications including GPS navigation, radar warning equipment, night vision devices and thermal imagers. Compact and versatile, they provided a vital link between fleet units and shore facilities for over three decades before retirement in 2017.
Squadron1=AS350BA 723 Squadron RAN,723 Sqn
Callsigns=Squadron1,Taipan

