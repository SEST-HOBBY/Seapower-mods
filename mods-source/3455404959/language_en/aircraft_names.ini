DefaultDescription=The Fairey Gannet AEW.3 is a british twin-engine turboprop, three-seat, carrier-based aircraft based on the AS.4 design but adapted and fitted to fill the Fleet Air Arm's need for a dedicated Aerial Early Warning Platform, expanding the fleet's sensor coverage. The original fuselage was lengthened to accommodate an APS.20 radar in a radome underneath the main body, while a radar operator cabin was built into the space between the cockpit and tail. After Australia purchased HMS Hermes in the late 1960s, the aircraft were purchased off the shelf from the Royal Navy to equip the carrier air wing, with the Australian Fleet Air Arm already having experience operating the AS.1 variant of the Gannet only a few years prior. This allowed for the formation of the new 849 Squadron RAN to be completed using existing personnel with experience, and Royal Navy advisors able to provide training for the equipment and AEW tactics.
