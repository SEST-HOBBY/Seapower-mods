[ran_h34_sar]
Type=SAR Helicopter
Default=Wessex HAS.31B SAR, Wessex
DefaultDescription=The Westland Wessex served the Royal Australian Navy from the mid 1960s, originally as the primary carrier-based anti-submarine warfare (ASW) helicopter aboard HMAS Melbourne. Robust and reliable, the Wessex proved vital in Cold War patrols and regional operations. In the mid-1970s, it began to be superseded in front-line carrier ASW duties by the more capable Sea King, with the Wessex shifting to secondary roles such as utility transport, training, and search and rescue. By 1980, it remained an important support helicopter, operating alongside newer platforms during its later service years before fully retiring by 1989.
Squadron1=HAS.31B Ship's Flight,SAR 
Callsigns=Squadron1,Angel Scout

