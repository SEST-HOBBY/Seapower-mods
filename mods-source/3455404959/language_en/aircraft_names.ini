DefaultDescription=The Grumman S-2 tracker was a dedicated fixed wing ASW aircraft developed for the United States Navy, entering service in 1954. The first U.S. navy aircraft designed to be able to both detect and destroy enemy submarines, they were in service with the USN until 1976. However they were a popular aircraft for export and saw service with many countries. The later G variant was a significant avionics upgrade of existing S-2Es (and S-2Ds), not a new build, featuring far more advanced acoustic processing systems (like the AN/AQA-7) for sonobuoys, making it the most sophisticated Tracker variant, essentially bringing S-3 Viking-level tech to the older airframe. 16 S-2G Trackers were rapidly acquired in 1977 by the RAN to replace S-2Es lost in a hangar fire.
