DefaultDescription=A maritime variant of the Black Hawk helicopter, the S-70B-2 was introduced into RAN service in 1988 for anti-submarine and surface warfare roles. Equipped with advanced torpedoes, maritime radar and a tail-boom mounted Magnetic Anomaly Detector, the S-70B-2 operated from Australian frigates and destroyers. This powerful new platform delivered vital sub-surface threat detection and engagement capability well into the 2000s and lead to continued use of new variants of the Seahawk. The AN/AAQ-16 were added to Gulf War deployed RAN Seahawks and is represented in this version, alongside the Penguin anti-ship missile which was trialed but in reality not utilised by the RAN.
