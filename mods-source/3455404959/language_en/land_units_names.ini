[adf_mbt_mk5-1]
Type=MBT
Default=Centurion Mk 5/1 RAAC,Centurion
DefaultDescription=A robust and well‑protected British‑designed medium tank, the Centurion Mk 5/1 entered Australian service in 1952 fitted with the 84 mm QF 20‑pounder and improvements for tropical operations. Employed by the Royal Australian Armoured Corps during the Vietnam conflict from 1968-1971, the vehicle balanced good armour and mobility with dependable mechanical systems. Many fielded external fuel tanks, extra stowage, IR night‑sighting equipment for low‑light operations and field modifications such as the removal of the side skirts - as vegetation would often be caught between them and the tracks. The Australian Centurions were not upgunned to the 105mm L7, as the 20-pounder was considered more than adequate for infantry support operations in Vietnam. The Centurion was replaced by the Leopard AS1 in 1977.
Variant1=Centurion Mk 5/1,Centurion

[adf_mbt_leopard1]
Type=MBT
Default=Leopard AS1,Leopard AS1
DefaultDescription=A modern and highly mobile German-designed main battle tank, the Leopard AS1 entered Australian service in 1977 to replace the ageing Centurion. Based on the Leopard 1A3, the AS1 featured the 105 mm L7A3 gun, improved fire-control systems, and a distinctive welded turret for better ballistic protection. Adapted for Australian conditions with tropicalisation measures and updated communications equipment, the Leopard AS1 offered exceptional mobility and reliability rather than heavy armour. Operated by the Royal Australian Armoured Corps until 2007 when it was replaced by the M1A1 Abrams, it proved popular for its accuracy, ease of maintenance, and suitability for training and manoeuvre warfare across Australia’s varied terrain.
Variant1=Leopard AS1,Leopard AS1
Variant2=Leopard AS1,Leopard AS1

[adf_mbt_leopard1_dozer]
Type=MBT
Default=Leopard AS1 (Medium Tank Dozer),Leopard AS1 (MTD)
DefaultDescription=A modern and highly mobile German-designed main battle tank, the Leopard AS1 entered Australian service in 1977 to replace the ageing Centurion. Based on the Leopard 1A3, the AS1 featured the 105 mm L7A3 gun, improved fire-control systems, and a distinctive welded turret for better ballistic protection. Adapted for Australian conditions with tropicalisation measures and updated communications equipment, the Leopard AS1 offered exceptional mobility and reliability rather than heavy armour. Operated by the Royal Australian Armoured Corps until 2007 when it was replaced by the M1A1 Abrams, it proved popular for its accuracy, ease of maintenance, and suitability for training and manoeuvre warfare across Australia’s varied terrain. The purchase of Leopard AS1 included a dozer attachment for the tank. The dozer attachment provided a blade, similar to that fitted to the ARV, to be fitted to an MBT with minimal work. Tanks when fitted with the dozer attachment are known as Medium Tank Dozer (MTD). The dozer is normally used for the construction of scrapes for tanks when in defensive positions, or for the preparation of entry/exit points on rivers, or for assisting the preparation of a suitable location for a bridgelayer tank during gap crossing operations.
Variant1=Leopard AS1 (MTD),Leopard AS1 (MTD)
Variant2=Leopard AS1 (MTD),Leopard AS1 (MTD)

