# ----------- Noisemakers/Chaff -----------
usn_adc_mk2_noisemaker_ran=Noisemaker,LESCUT,Torpedo Decoy, The LESCUT (Lightweight Expendable Sonar Countermeasure – Underwater Target) is an expendable acoustic decoy used to counter homing torpedoes. After launch, LESCUT deploys to a preset depth and emits acoustic signals to imitate a ship’s noise and echo characteristics. It is effective against both active and passive torpedoes, drawing them away from the ship before self-destructing after a short operating period.
# ----------------- Decoys ----------------
ran_an_slq_25_nixie_decoy=TMS4350AN,Albatros,Decoy,A passive towed-array acoustic sensor designed to detect, classify, and track incoming torpedoes at long range. The TMS4350 provides early warning of underwater threats and cueing for evasive manoeuvres and countermeasures, significantly improving ship survivability against modern homing torpedoes.
