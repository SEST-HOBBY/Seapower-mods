[AmmunitionNames]
# ------------------ AAM ------------------
fr_r-530=R.530,,AAM,French medium-range AAM used on Mirage III. Radar-guided with modest range and accuracy, effective in head-on engagements against non-maneuvering targets.
# ------------------ SAM ------------------
ran_rim_66m_rail=RIM-66M,SM-2MR Blk IIIA,SAM,The RIM-66M Standard Missile 2 is the AEGIS VLS version of the Block III series. The Block III SM-2MR is developed to increase low altitude performance considerably, and therefore should be considered an exceptional anti-seaskimming SAM for defending against the latest threats. 
usn_rim-162a=RIM-162A,ESSM,SAM,The RIM-162 Evolved Sea Sparrow Missile is a short to medium range air-defence missile fitted to numerous USN and NATO vessels. The system is primarily intended to provide a self defence capability. The ESSM is highly upgraded from older Sparrow missiles, and is posed to be very capable against sea skimming anti ship missiles, alongside fulfilling area defense duties quite well.
# ---------- Anti-radar Missiles ---------
# ---------- Anti-ship Missiles ----------
rn_as11=AS-11,,AGM,The AS-11 is a french made air to ground missile designed to engage a large variety of surface targets, it is a rather small wire guided missile with only 3 kilometers range.
wp_as-1=AS-1,Kennel,ASM,The AS-1 Kennel (KS-1 Komet) was an early Soviet air-launched anti-ship missile derived from German wartime technology. Using aerodynamics derived from the Mikoyan-Gurevich MiG-15, it resembled a scaled-down MiG-15 with the cockpit and undercarriage removed. Uses inertial guidance with a terminal active-radar seeker and carries a heavy high-explosive warhead. Large, slow, and easy to detect, but capable of delivering a powerful strike against surface ships in the 1950s–60s era.
#-----------Land Strike only missiles---------
# ---------- Anti-sub  Missilies ----------
rn_ikara=GWS-40,Ikara,ASW,The GWS-40 Ikara is an Australian anti-submarine cruise missile, powered by a rocket motor, that deploys a Mk-46 or Mk-44 torpedo to defeat sub-surface threats. While it has twice the range of the American ASROC, Ikara is somewhat slower, and multiple missiles cannot be quickly fired due to the launch configuration.
usn_rur-5a=RUR-5A NEARTIP,ASROC,ASW,The RUR-5 ASROC (for Anti-Submarine Rocket) is a standoff anti-submarine weapon. The ASROC missile is launched from the shooting platform and deploys a Mk 46 Mod 5 NEARTIP (Near Term Improvement Program) ASW torpedo after flying a ballistic trajectory.
# ------------------ RBU ------------------

# --------------- Torpedoes ---------------
rn_mk23=Mk23 Grog,Mk23,Torpedo,The Grog Mk23 is a wire guided version of the Royal Navy's Mk20 heavy weight electric torpedo. These torpedoes are wire guided and capable of being retargeted from the launch platform.
rn_mark8_mod4=Mk VIII,Mod 4,Torpedo,The Mark VIII was originally designed in 1925 and was the main submarine launched torpedo for the Royal Navy during WW2. This is the updated 1965, and final, Mod 4 version, which was in use until the 1990's.
rn_mk24=Tigerfish,Mk 24-Mod-2,Torpedo,The Mark 24 is a British electric heavyweight torpedo. These torpedoes are wire guided and capable of being retargeted from the launch platform.
usn_mk46_5_air=MK-46 Mod 5,NEARTIP,ASW Torpedo,The Mark 46 Mod 5 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. The Mod 5 version allows for the ability to engage surface targets or surfaced submarines with limited effectiveness, improves the fuel and motor system for more efficient cruising and faster terminal phase, and increases the immunity of the seeker against countermeasures. This variant is air dropped.
usn_mk46_5_ship=MK-46 Mod 5,NEARTIP,ASW Torpedo,The Mark 46 Mod 5 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. The Mod 5 version allows for the ability to engage surface targets or surfaced submarines with limited effectiveness, improves the fuel and motor system for more efficient cruising and faster terminal phase, and increases the immunity of the seeker against countermeasures. This variant is ship launched.
rn_mk20s=MK20S Bidder,MK 20S,Torpedo,The Mark 20S torpedo is a passive Short-Length 21-inch Homing Torpedo of the Royal Navy, developed in the 1950s and in service until replaced by Mark 24 Tigerfish in the 1980s.
rn_mk30_air=Mk 30,Mod 1,Torpedo,The Mark 30 is a British electric lightweight air dropped torpedo. These torpedoes are designed to engage submarines with passive sonar detection.
# ------------------ Bombs -----------------
rn_mk_11=Mk 11,250LB,Depth Charge,A British 250lb depth charge designed for use by aircraft.
rn_gp_500=GP-500LB,,Bomb,A 500lb general purpose British made bomb.
rn_gp_1000=GP-1000LB,,Bomb,A 1000lb general purpose British made bomb.
# ---------------- Sonobuoys ---------------
ran_ssq-81b=AN/SSQ-81B Barra,DIFAR,Sonobuoy,The SSQ-81 Barra was an Australian-designed passive sonobuoy developed under a joint program between the RAN, DSTO (now DSTG), and local industry. It was a key indigenous ASW sensor used from the 1970s through the early 2000s, primarily deployed by RAN S-70B-2 Seahawks and RAAF P-3C Orions. This variant is the most up to date with improved signal processing and detection sensitivity. 
usn_ssq-53d=AN/SSQ-53D,DIFAR,Sonobuoy,The SSQ-53D is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1. This version has a more sensitive detector, digital controls, and improved construction for a significant improvement in performance.
usn_ssq-62c=AN/SSQ-62C,DICASS,Active Sonobuoy,The AN/SSQ-62C DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys. This version has a more sensitive detector, digital controls, and improved construction for a significant improvement in performance.
# ------------------ FFAR -----------------
fr_sneb=68mm,SNEB,FFAR,Unguided air-to-ground rocket developed in France. Typically fired in salvo from Matra pods, the SNEB is effective against soft targets and light vehicles.
rn_rp_3_ap=3.5-Inch AP,RP-3,FFAR,The 3-Inch Rocket was a World War 2 rocket capable of being fitted with a variety of warheads.
rn_rp_3_sap=3.5-Inch SAP,RP-3,FFAR,The 3-Inch Rocket was a World War 2 rocket capable of being fitted with a variety of warheads.
