[rnzn_ff_leander_batch1]
Type=FF,Frigate
Default=Leander-class RNZN (Batch-1B),Leander
DefaultDescription=The Type 12I Leander class ASW frigates were designed and built for the Royal Navy, as a follow on to the successful Type 12M Rothesay class. First entering service in 1963, they proved popular on the export market and had a long service life, with the last ship HMS Andromeda/INS Krishna finally being decommissioned in 2012. The Batch 1 Leanders were converted from their original design by removing the 4.5 inch gun and Type 965 radar in favour of a second Sea Cat missile launcher and the Ikara anti submarine missile system. The Batch 1B HMS Dido was transferred to New Zealand - HMNZS Southland was commissioned into RNZN service on 21 December 1983. She along with HMNZS Wellington would replace HMNZS Otago and Taranaki. Southland carried out a range of duties including exercises, ceremonials, and maritime rescues. In 1992 Southland participated in Operation OCTANUS, and was later decomissioned in 1995.
Variant1=Southland F104,Southland

[rnzn_ff_leander_batch2]
Type=FF,Frigate
Default=Leander-class RNZN (Batch-2TA),Leander
DefaultDescription=The Type 12I Leander class ASW frigates were designed and built for the Royal Navy, as a follow on to the successful Type 12M Rothesay class. First entering service in 1963, they proved popular on the export market and had a long service life, with the last ship HMS Andromeda/INS Krishna finally being decommissioned in 2012. HMNZS Waikato (F55) was a Leander Batch 2TA frigate of the Royal New Zealand Navy (RNZN). She was one of two Leanders built for the RNZN, the other being the Batch 3 HMNZS Canterbury. These two New Zealand ships relieved British ships of the Armilla patrol during the Falklands conflict, freeing British ships for deployment. Waikato was decommissioned in 1998.
Variant1=Waikato F55,Waikato

[rnzn_ff_leander_batch3]
Type=FF,Frigate
Default=Leander-class RNZN (Batch-3),Leander
DefaultDescription=HMNZS Canterbury and HMNZS Wellington were Batch 3 broad-beam Leander-class frigates that formed the core of the Royal New Zealand Navy’s surface combat capability from the mid-1970s through the late 1990s. Although outwardly similar, the two ships had different origins and service histories. HMNZS Canterbury was purpose-built for the RNZN and commissioned in 1971. Designed from the outset for South Pacific operations, she incorporated the broad-beam hull form for improved stability and endurance. During her service life she received incremental sensor and combat system upgrades, including improved medium-frequency sonar and updated electronic warfare systems, and operated primarily in the anti-submarine warfare role. Canterbury frequently undertook regional patrols, alliance exercises, and maritime security operations. HMNZS Wellington was originally commissioned into the Royal Navy as HMS Bacchante before being transferred to New Zealand service in 1982. Although of the same Batch 3 broad-beam design, her fit reflected RN rather than RNZN design priorities at build, with subsequent modifications made to align her systems with New Zealand service standards. Like Canterbury, she operated primarily as an ASW escort and was equipped with Sea Cat surface-to-air missiles and a Westland Wasp helicopter. Together, Canterbury and Wellington formed the RNZN’s principal high-end surface combatants prior to the introduction of the ANZAC-class frigates, providing credible anti-submarine and fleet escort capability throughout the late Cold War period. Both were out of service by 2005.
Variant1=Canterbury F421,Canterbury
Variant2=Wellington F69,Wellington

[rnzn_ff_leander_batch3refit]
Type=FF,Frigate
Default=Leander-class RNZN (Batch-3),Leander
DefaultDescription=In their later service life, HMNZS Canterbury and HMNZS Wellington underwent extensive modernisation that significantly enhanced their combat systems and extended their operational relevance into the post–Cold War era. These refits focused on replacing legacy British-era sensors and fire-control systems with more modern digital equivalents, including updated air/surface search radar, improved electronic warfare suites, and a modernised fire-control system capable of supporting both gun and missile engagements. The ships’ original Seacat surface-to-air missile system was progressively superseded in the final refit phase by the addition of Phalanx close-in weapon systems, providing a last-ditch point defence capability against modern anti-ship missiles. Anti-submarine warfare capability was also improved through upgraded medium-frequency hull sonar and integration with embarked SH-2G Seasprite helicopters, which replaced the venerable Westland Wasp in 1997. Electronic warfare capability was significantly enhanced with modern ESM and ECM suites, improving situational awareness and survivability in contested environments. These upgrades collectively shifted the Leanders from traditional 1960s-era ASW frigates into capable late Cold War multi-role escorts, although they remained fundamentally limited by hull design and space constraints compared to newer purpose-built frigates. Canterbury's final deployment was as part of New Zealand's contribution to the Australian-led INTERFRET peacekeeping taskforce, conducting four tense patrols, being approached by Indonesian naval vessels and aircraft. Both ships were withdrawn from service by 2005 as the ANZAC-class frigates fully replaced their operational role within the RNZN surface fleet.
Variant1=Canterbury F421,Canterbury
Variant2=Wellington F69,Wellington

[rnzn_ff_rothesay]
Type=FF,Frigate
Default=Rothesay-class RNZN,Rothesay
DefaultDescription=The Type 12M Rothesay-class frigate was designed and built for the Royal Navy as an improved development of the earlier Whitby-class frigate, entering service from 1960. Optimised for anti-submarine warfare during the Cold War, the class was equipped with advanced sonar systems and the Limbo anti-submarine mortar. Two ships of the class were built for the Royal New Zealand Navy, HMNZS Otago and HMNZS Taranaki, which entered service in 1960 and 1961 respectively. Although broadly similar to Royal Navy ships, the New Zealand Rothesays followed a different modernization path. Unlike many Royal Navy vessels which were later rebuilt with helicopter hangars to embark the Westland Wasp, the RNZN ships retained their original configuration with twin Limbo mortars and an open quarterdeck. Later upgrades included improved radar and communications equipment and the addition of the Seacat surface-to-air missile system for point air defence. Otago and Taranaki served as surface combatants of the RNZN for over two decades, conducting patrols, exercises, and regional deployments throughout the Pacific and Southeast Asia. Otago was also notable for participating in New Zealand’s protest against French nuclear testing in the Pacific during the 1970s. The ships were eventually replaced by transferred Leander-class frigates from the Royal Navy, with Otago decommissioned in 1983 and Taranaki in 1982.
Variant1=Otago F111,Otago
Variant2=Taranaki F148,Taranaki

[idn_kr_sverdlov]
Type=KR,Light Cruiser
Default=Sverdlov-class TNI-AL,Sverdlov
DefaultDescription=KRI Irian was a Soviet-built Sverdlov-class cruiser transferred to Indonesia in 1962, making her the largest and most powerful warship ever operated by the Indonesian Navy. Acquired as Sukarno’s flagship for the campaign to seize West New Guinea, she symbolized Indonesia’s close ties to Moscow during the early 1960s. After the political shift of 1965 and the break with the USSR, spare parts and support dried up, and Irian quickly declined in serviceability. She was relegated to reserve in the early 1970s and officially decommissioned in 1976, remembered more as a symbol of ambition than a lasting fleet asset.
