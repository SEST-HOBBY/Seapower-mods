[ran_majestic_59]
Type=CVL,Light Carrier
Default=Majestic-class,Majestic
DefaultDescription=HMAS Melbourne (R21) was Australia's flagship light aircraft carrier from 1955 to 1982. A Majestic-class carrier modified for jet operations, Melbourne served as the core of the Royal Australian Navy’s carrier task group, embarking fixed-wing aircraft such as the Sea Venom, Gannet, and later the A-4G Skyhawk and S-2 Tracker. At the time of purhcase, Melbourne was the third ship to be constructed with an angled flight deck. Rotary wing assets were embarked starting with the Bristol Sycamore and then later the Westland Wessex which was acquired for ASW work in the 1960s, operating in this role up until the early-mid 1970s. From commissioning in 1955 up until 1967 Melbourne embarked the Sea Venom FAW.53 - at the time of their arrival, the Sea Venoms were the only radar equipped and all-weather combat aircraft in the Southern Hemisphere. Providing ASW and strike capability was the Gannet AS.1, with a significant payload and endurance. Close-in self defense was a considerable 40mm Bofors armament typical of the early cold war. Very advanced for the time, Melbourne provided Australia with power projection not seen before, although by the 1960s plans for significant refits or replacement were already being considered.
Variant1=Melbourne R21,Melbourne

[ran_majestic]
Type=CVL,Light Carrier
Default=Majestic-class,Majestic
DefaultDescription=HMAS Melbourne (R21) was Australia's flagship light aircraft carrier from 1955 to 1982. A Majestic-class carrier modified for jet operations, Melbourne served as the core of the Royal Australian Navy’s carrier task group, embarking fixed-wing aircraft such as the Sea Venom, Gannet, and later the A-4G Skyhawk and S-2 Tracker. Rotary wing assets were embarked starting with the Bristol Sycamore and then later the Westland Wessex which was acquired for ASW work operating in this role up until the early-mid 1970s. With the Sea Venom and Gannet obsolete by the mid 1960s, Melbourne had a major refit from 1967-1969 which prepared her for her new air wing, including new sensors and ECM equipment among many other improvements. Her air wing matured by this point with A-4G Skyhawks, S-2E Trackers and Wessex HAS.31B helicopters. This air wing allowed Melbourne to stay relevant while the long term search for a suitable replacement would be considered for many years. Several Bofors mounts were removed and she was armed with four twin and four single Bofors 40mm AA guns for self defence by this point. She provided key fleet air defence, ASW, and maritime strike capabilities during the height of the Cold War.
Variant1=Melbourne R21,Melbourne

[ran_melbourne]
Type=CVL,Light Carrier
Default=Majestic-class,Majestic
DefaultDescription=HMAS Melbourne (R21) was Australia's flagship light aircraft carrier from 1955 to 1982. A Majestic-class carrier modified for jet operations, Melbourne served as the core of the Royal Australian Navy’s carrier task group, embarking fixed-wing aircraft such as the Sea Venom, Gannet, and later the A-4G Skyhawk and S-2 Tracker. She provided key fleet air defence, ASW, and maritime strike capabilities during the Cold War. By the mid-late 1970s, she was fully operating Westland Sea King helicopters which had replaced the Wessex in the ASW role, and the S-2G Tracker had replaced S-2Es which were lost in a 1976 fire, enhancing her anti-submarine warfare capability significantly. The Skyhawk continued in its role and the Wessex was retained as a very useful plane guard, search and rescue and utility transport helicopter. By 1980 her remaining twin Bofors mounts were removed with only four single mounts remaining. A major refit scheduled to begin in late 1981 was postponed pending the decision on a replacement carrier. HMAS Melbourne was decommissioned in 1982 with no replacement after a deal to acquire HMS Invincible was cancelled, with a change in government and a shift in RAN priorities ending fixed wing naval aviation for Australia.
Variant1=Melbourne R-21,Melbourne

[ran_cv_majestic1968]
