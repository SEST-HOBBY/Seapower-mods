Default=Majestic-class,Majestic
DefaultDescription=HMAS Melbourne (R21) was Australia's flagship light aircraft carrier from 1955 to 1982. A Majestic-class carrier modified for jet operations, Melbourne served as the core of the Royal Australian Navy’s carrier task group, embarking fixed-wing aircraft such as the Sea Venom, Gannet, and later the A-4G Skyhawk and S-2 Tracker. Rotary wing assets were embarked starting with the Bristol Sycamore and then later the Westland Wessex which was acquired for ASW work operating in this role up until the early-mid 1970s. Melbourne had her sensors updated and ECM added after a refit in the late 1960s, and this is also when her then brand new air wing of Skyhawks and Trackers were embarked which would remain the standard fixed-wing air wing for the rest of her career. She provided key fleet air defence, ASW, and maritime strike capabilities during the Cold War.
Variant1=Melbourne R21,Melbourne

[ran_cv_invincible]
Type=CVL,Light Carrier
Default=Invincible-class RAN (Fict), Australia
DefaultDescription=In the early 1980s the Royal Navy decided to retain and modernize HMS Hermes after the Falklands War, offering HMS Invincible for sale to offset costs and reinforce Commonwealth presence in the Pacific. Australia, seeking to replace the ageing HMAS Melbourne, accepted the deal and commissioned the carrier as HMAS Australia (R22) in 1983. Prior to commissioning HMAS Australia underwent a refit, integrating US sensor suites, improved ECM and the removal of the Sea Dart missile system due to logistics concerns and increasing reliance on American systems. This left her with only CIWS and aircraft for protection. Her air wing included Sea Harrier FRS.1 fighters and Sea King helicopters for ASW and AEW roles, with a mission focus on fleet air defense and anti-submarine warfare as part of the RAN’s carrier strategy. The RAN already used the Sea King ASW helicopter with 817 squadron so only the AEW Sea Kings needed to be purchased - with a newly formed 849 squadron RAN to operate them. A full complement of Sea Harrier FRS.1 were purchased off the shelf to equip 805 Squadron, with minor modifications to equip the Harpoon anti-ship missile and American munitions. The brand new carrier likely would have had a service length mirroring the Royal Navy, well into the 21st century.
Variant1=Australia R22,Australia

[ran_cv_centaur_84]
Type=CVL,Light Carrier
Default=Centaur-class RAN (Fict), Australia
DefaultDescription=The Royal Navy offered HMS Hermes to Australia again in 1983 after the collapse of the proposed sale of HMS Invincible. Following Hermes' storied service in the Falklands War, the British government—eager to foster deeper Commonwealth defence ties and manage its shrinking post-war fleet—presented a renewed opportunity for the Royal Australian Navy to acquire a modernized aircraft carrier. 15 years prior she was rejected as a replacement for HMAS Melbourne, this time however, Australia accepted. After a comprehensive refit and adaptation to RAN standards, Hermes was recommissioned as HMAS Australia (R22) in late 1984. Retaining her STOVL configuration, Australia embarked a tailored RAN air wing built around Sea Harrier FRS.1 fighters and Sea King helicopters. Drawing on operational lessons from the UK, the RAN procured a full complement of Sea Harriers to equip 805 squadron, with modest modifications to integrate American Harpoon anti-ship missiles and communications systems. For anti-submarine warfare and airborne early warning (AEW), the ship operated Sea King Mk.50 and AEW.2A variants respectively, with the AEW mission forming the basis for the newly stood-up 849 Squadron RAN. The original Seacat missile launchers were replaced by a Phalanx CIWS suite to keep up with modern threat environments. As the largest and most capable carrier in the RAN, HMAS Australia served as the centerpiece of the fleet through the late Cold War and offered further service into the 21st century. Her arrival helped reinvigorate fixed-wing naval aviation for Australia. Heavy operational tempo would have likely been expected by the RAN, and so her service life would have likely been shorter, ending in the mid-2000s. 
Variant1=Australia R22,Australia

[ran_cv_centaur_catobar]
Type=CVL,Light Carrier
Default=Centaur-class RAN (Fict-CATOBAR), Australia
DefaultDescription=The Royal Australian Navy’s future took a decisive turn in 1968. Following successful trials of A-4G Skyhawk landings aboard HMS Hermes, the long-discussed question of a replacement for HMAS Melbourne finally found its answer. Political will and defence urgency overcame financial and manpower barriers. The result was the purchase of Hermes from the Royal Navy, recommissioned into RAN service as HMAS Australia (R22). HMAS Australia entered Royal Australian Navy service in early 1970, acquired to cement a modern carrier capability for the fleet. As a larger conventionally powered CATOBAR carrier compared to Melbourne, she immediately became the centerpiece of Australian naval aviation, operating the new Skyhawks, Trackers, and still very capable Wessex helicopters. Gannet AEW.3 aircraft were purchased from Royal Navy stocks to provide long range AEW. The powerful Type 984 3D air search system was retained along with the Seacat missile systems. HMAS Australia saw combat service off Vietnam in the early 1970s, providing close air support and fleet air defence, a role that reinforced the importance of carrier aviation to Australian strategy. HMAS Australia as a more capable replacement of Melbourne may very well have had a much longer service life, potentially as late as the early 21st century with continued modernisations and refits. This configuration is as a plausible mid-late Cold War guise.
Variant1=Australia R22,Australia

[ran_lsh_tobruk]
Type=LSH,Landing Ship
Default=Tobruk-class,Tobruk
DefaultDescription=HMAS Tobruk (L 50) was a Landing Ship Heavy (LSH) of the Royal Australian Navy (RAN), based on the design of the Round Table-class of the British Royal Fleet Auxiliary. Planning for the ship began in the 1970s to provide the Australian Army with a permanent sealift capability. She was laid down by Carrington Slipways in 1979, launched in 1980, and commissioned in 1981. She was a multi-purpose, roll-on/roll-off heavy lift ship capable of transporting soldiers, APCs, and tanks, and delivering them to shore via landing craft or directly by beaching. Though lightly armed and reliant on escorts for full protection, Tobruk was a vital workhorse of the fleet— delivering troops, tanks, and humanitarian aid across the vast Indo-Pacific theatre until finally decommissioned in 2015 after 34 years of service.
Variant1=Tobruk L-50,Tobruk

[ran_dd_daring1968]
