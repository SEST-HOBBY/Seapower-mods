[ran_ffg_adelaide]
Type=FFG,Frigate
Default=Adelaide-class (Long-hull),Adelaide
DefaultDescription=The Adelaide-class guided missile frigate is a series of six FFGs in Australian service, and is a variant of the American Oliver Hazard Perry-class FFG, with the first four ships being built in US shipyards. These frigates were in service with the Royal Australian Navy starting in 1980, to make up for the failed light destroyer project of the 1970s, and are built to a very similar standard to their USN counterparts, and as such include a modern suite of anti-aircraft, anti-ship, and anti-submarine warfare systems.\n\nThe first three ships were built to the short-hull configuration, and lack towed arrays alongside being incapable of using LAMPS Mk.III helicopters, being forced to carry the unarmed AS-350 helicopter for non-combat use. HMAS Darwin would be the first vessel to be built to the lengthened 'Flight-III' design. 
Variant1=Darwin FFG-4,Darwin

[ran_ffg_adelaide_93]
Type=FFG,Frigate
Default=Adelaide-class (Seahawk),Adelaide
DefaultDescription=The Adelaide-class guided missile frigate is a series of six FFGs in Australian service, and is a variant of the American Oliver Hazard Perry-class FFG, with the first four ships being built in US shipyards. These frigates were in service with the Royal Australian Navy starting in 1980, to make up for the failed light destroyer project of the 1970s, and are built to a very similar standard to their USN counterparts, and as such include a modern suite of anti-aircraft, anti-ship, and anti-submarine warfare systems. With the S-70B-2 Seahawk being acquired by the RAN starting in 1988, all of the Adelaide-class FFGs prior to HMAS Darwin were lengthened to allow them to be embarked. By the early 1990s the helicopter was beginning to roll out across the Adelaide-class frigates, giving them their full ASW capabilities and first combat debut in the 1991 Gulf War. HMAS Melbourne and HMAS Newcastle were built in Australia in a slightly later batch, increasing the group of frigates to six by 1993. 
Variant1=Adelaide FFG-1,Adelaide
Variant2=Canberra FFG-2,Canberra
Variant3=Sydney FFG-3,Sydney
Variant4=Darwin FFG-4,Darwin
Variant5=Melbourne FFG-5,Melbourne
Variant6=Newcastle FFG-6,Newcastle

[ran_ffg_adelaide_late]
Type=FFG,Frigate
Default=Adelaide-class (FFG Upgrade),Adelaide
DefaultDescription=By the early 2000s, instead of acquiring the expensive, manpower intensive Kidd-class destroyers, the Adelaide class underwent a comprehensive mid-life upgrade program to extend their service life and restore their relevance in a modern, network-centric naval environment. To offset costs the two oldest vessels were decommissioned leaving four in service. Completed by 2008, the FFG Upgrade significantly enhanced the ships’ combat systems, sensors, and survivability. The original SM-1 missile system was replaced with the SM-2 Block IIIA capability, supported by a new combat management system and upgraded fire control radars, significantly enhancing the class’s area air defence role. Most notably, an 8-cell Mk 41 VLS system was installed forward of the Mk 13 launcher, allowing the integration of the Evolved Sea Sparrow missile to better handle sea-skimming anti-ship missiles. The latest Harpoon anti-ship missile was integrated and the Phalanx CIWS was updated to Block 1B. Hull-mounted sonar systems were modernised with the installation of the Thales Spherion sonar, replacing the earlier SQS-56 and Mulloka systems, while electronic warfare capabilities were upgraded with the introduction of the Rafael C-PEARL-DV ESM and the Elbit EA-2118 electronic countermeasures suite. These improvements transformed the Adelaide class into capable multi-mission escorts suited for high-threat coalition operations, allowing them to remain effective frontline combatants well up until 2019 when replaced by the Hobart-class destroyers.
Variant1=Sydney FFG-3,Sydney
Variant2=Darwin FFG-4, Darwin
Variant3=Melbourne FFG-5,Melbourne
Variant4=Newcastle FFG-6,Newcastle

