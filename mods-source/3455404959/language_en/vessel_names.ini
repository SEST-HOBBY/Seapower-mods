DefaultDescription=With over 550 vessels of this type built, the LSM-1 (Landing Ship Medium) was developed during World War II by the US as a landing ship with a size between an LST (Landing Ship Tank) and an LCI (Landing Craft Infantry). Some were converted to specialist roles during construction, such as the LSM(R) used to support troop landings. Most ships were decommissioned during the post war period, but several were sold to the civilian market as well as to foreign navies such as Australia, South Vietnam, the Republic of China, Thailand, and the Philippines. In Australian service, they were operated by the newly formed 32nd Small Ship Squadron, Royal Australian Engineers in 1959, providing valuable support for Army operations until 1971 after the squadron was disbanded following the Vietnam War.
