[ran_ss_oberon1968]
Type=SS,Patrol Submarine
Default=Oberon-class (RAN-early),Oberon
DefaultDescription=The Oberon class was a class of 27 British-designed diesel-electric attack and patrol submarines developed as an improved follow-on to the Porpoise class, using stronger hull materials and upgraded equipment. The Royal Australian Navy ordered six Oberon-class submarines in two batches, with minor modifications from the Royal Navy standard, most notably using US weapons in the form of the Mark 37 torpedo.\n\nIn early Royal Australian Navy service the boats had stern-firing torpedo tubes, armed with the Mk 20S Bidder passive homing lightweight ASW torpedo, before the tubes were later sealed in a later refit and were subsequently used by crews for storing extra supplies, most famously beer. 
Variant1=S57 Oxley,Oxley
Variant2=S59 Otway,Otway

[ran_oberon_class]
Type=SS,Patrol Submarine
Default=Oberon-class RAN,Oberon
DefaultDescription=The Oberon-class were a series of conventionally powered diesel-electric submarines operated by the Royal Australian Navy from 1967 to 2000. Based on a British design but modified for Australian requirements, these six boats—HMAS Oxley, Otway, Ovens, Onslow, Orion, and Otama—formed the backbone of Australia's submarine force during the Cold War. Quiet, reliable, and robust, the Oberons were primarily used for covert surveillance, ASW training, and intelligence-gathering patrols, often in regional waters under strict secrecy. Originally amred with British torpedoes, the boats were later upgraded through the 1980s with US-made weapons. The class played a vital role in preparing the RAN for more modern submarine operations, paving the way for the Collins-class that followed.
Variant1=HMAS Onslow S60, Onslow
