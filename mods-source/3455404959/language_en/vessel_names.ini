DefaultDescription=The Daring-class destroyers were a class of all-gun post-WWII destroyers designed by the Royal Navy, with rapid firepower, modern ASW weaponry, speed and agility. They featured advanced fire control and radar systems for the era, and were built for high-intensity fleet operations. Three units were commissioned into the Royal Australian Navy—HMAS Vampire, Voyager, and Vendetta—serving from the late 1950s through to the late 1970s in escort, naval gunfire support, and fleet air defence roles. Tragically HMAS Voyager was sunk by a collision with HMAS Melbourne in 1964, with HMS Duchess loaned to the RAN as a replacement for four years while replacements (two modified River-class destroyer escorts) were constructed, and then sold to the RAN. HMAS Vampire still stands as a museum ship in Sydney to this day.
