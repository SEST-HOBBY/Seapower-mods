[Animations]
NumberOfAnimations=2

Animation1=door_open
Animation2=door_close

[door_open]
NumberOfSequencesToPlay=2
Sequence1=slide_door
Sequence1_Model=Side_Door
Sequence2=slide_door
Sequence2_Model=Door_Window

[door_close]
NumberOfSequencesToPlay=2
Sequence1=slide_door_back
Sequence1_Model=Side_Door
Sequence2=slide_door_back
Sequence2_Model=Door_Window

[------------------------------ Sequences ------------------------------]
[slide_door]
NumberOfSteps=3
Time1=0                // time in seconds for the start
PositionZ1=0
PositionX1=0
Smoothness2=Linear  // can be: Linear, EaseInOut - transition to the next step
Time2=0.5                // time in seconds for the start
PositionZ2=0
PositionX2=0.0001
Smoothness1=Linear  // can be: Linear, EaseInOut - transition to the next step
Time3=4                // time in seconds - here for the end
PositionZ3=-0.02
PositionX3=0.0003
Smoothness2=Linear  // can be: Linear, EaseInOut - is not used here as it's the last entry

[slide_door_back]
NumberOfSteps=3
Time1=0                // time in seconds for the start
PositionZ1=-0.02
PositionX1=0.0003
Smoothness2=Linear  // can be: Linear, EaseInOut - transition to the next step
Time2=3.5                // time in seconds for the start
PositionZ2=0
PositionX2=0.0001
Smoothness1=Linear  // can be: Linear, EaseInOut - transition to the next step
Time3=4                // time in seconds - here for the end
PositionZ3=0
PositionX3=0
Smoothness2=Linear  // can be: Linear, EaseInOut - is not used here as it's the last entry
