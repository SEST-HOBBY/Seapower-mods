[Language_en]
Name=Australian Force Posture – 1968
Description=In 1968, Australia maintained a modest but regionally significant military posture focused on the defence of its northern approaches, the security of sea lines of communication, and the fulfilment of Commonwealth obligations in Southeast Asia. This mission presents a snapshot of the Royal Australian Navy and Royal Australian Air Force as they existed in 1968, showing the disposition of major fleet units, patrol forces, and air assets across Australia and forward bases. No hostile forces are present. The purpose of this scenario is to provide an historical overview of Australian military power, its geographic constraints, and the way in which forces were distributed rather than concentrated. All units, bases, and aircraft are positioned according to historically accurate locations and operating patterns, using real-world geography translated directly onto the mission map.
