Taskforce1MissionBriefingMessage=It is 1968\n\nAustralia’s defence posture is shaped by distance, limited resources, and the need to respond rapidly across vast maritime and air spaces. The bulk of the fleet remains concentrated on the east coast, while northern Australia relies on rotational forces, patrol craft, and forward-deployed air power.\n\nRoyal Australian Navy surface combatants are primarily based at Fleet Base East in Sydney, supported by major repair facilities in Victoria. Submarine forces operate from a newly established base in Sydney Harbour. Patrol boats are dispersed across northern ports, reflecting both their newness and the lack of permanent infrastructure.\n\nThe Royal Australian Air Force maintains its main strike and transport capability in Queensland and New South Wales, with forward operating bases in northern Australia and a permanent fighter presence in Malaysia. Naval aviation operates from Nowra, supporting fleet operations and carrier deployments.\n\nThis mission allows you to examine these forces in place and understand how Australia’s military power was structured and employed during this period.
Taskforce1FlashMessageMessage=AUSTRALIAN DEFENCE POSTURE — 1968\n\nThis scenario presents a historical overview of Australia’s naval and air forces as they existed in the late 1960s, prior to the major force expansions of the 1970s. It is intended as a force-posture showcase rather than an operational combat mission.\n\nNAVAL FORCES\n\nIn 1968, the Royal Australian Navy maintained a balanced but limited blue-water fleet centred on a single aircraft carrier. Fleet combat strength comprised:\n- 1 aircraft carrier (HMAS Melbourne)\n- 2 Perth-class guided missile destroyers\n- 3 Daring-class destroyers\n- 1 Battle-class destroyer\n- 4 River-class destroyer escorts\n- 2 Oberon-class submarines\n- 6 Ton-class minesweepers\n- 1 fleet oiler and major auxiliary support vessels\n- 1 dedicated ASW training frigate (modified Type 15)\n- Approximately 4 Attack-class patrol boats dispersed across northern and eastern ports\n\nNaval aviation consisted of:\n- Approximately 10 A-4G Skyhawk strike fighters\n- Approximately 12–14 S-2 Tracker maritime patrol and ASW aircraft\n- Rotary-wing ASW helicopters operating from HMAS Melbourne and HMAS Albatross\n\nAIR FORCES\n\nThe Royal Australian Air Force fielded a modest but modern combat air arm focused on air defence and regional presence:\n- Approximately 60–70 Mirage IIIO fighters on charge, with around 50–55 operationally available at any one time\n- 3 operational Mirage squadrons deployed at Williamtown, Townsville, and Butterworth, with small forward detachments\n- Approximately 24 Canberra bomber aircraft based primarily at Amberley\n- 10 Neptune maritime patrol aircraft conducting long-range surveillance and ASW tasks\n\nTransport, liaison, and training aircraft supported national command, logistics, and pilot training. Australia did not possess a large strategic airlift force, relying instead on limited medium transport capability and regional basing.\n\nBASING AND POSTURE\n\nAustralian forces of this period were characterised by careful concentration of combat units, reliance on training and rotational deployments, and limited permanent forward basing. ASW forces were administratively based in Sydney but conducted most practical training in the waters off Jervis Bay. Northern and overseas facilities supported presence and training rather than sustained combat operations.\n\nNo opposing forces are present in this scenario. The objective is to observe, explore, and understand Australia’s defence structure, capabilities, and strategic constraints during the late 1960s.
