[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=6.0
MinCameraDistanceForeAft=2.5
MinCameraDistanceBroadside=0.9
CameraPivotHeight=0.18

Length=244	                // in meters
Beam=35.2                      // in meters

CompartmentsHeight=0.08       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=140000            // in tons

MaxForwardVelocity=16.5        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.98                // this is for velocity damping (linear drag)
#LinearDrag=0.92                // this is for velocity damping (linear drag)

RudderTurnRate=1.5             // turn rate of the rudder in degrees per second
RudderForce=0.15               // multiplicator defining how agile the ship can turn

TiltFactor=1.8                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.03,0          // center of mass for physics

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=15.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=15.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge
# Sonar related
BaseNoise=180                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=4					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=3 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[---------- AI related ----------]
[AI]
UnitCostValue=5000            // value for the unit cost for least valuable target checks
UnitScoreValue=10             // value for calculation of mission score

#Sensors
Radar_Capability=TBD
#Offence
#Defence
MissilesToSaturate=6      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=4     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

#Special
Role=Merchant

