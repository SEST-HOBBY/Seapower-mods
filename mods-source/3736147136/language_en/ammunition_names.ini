fr_milan_er=Milan ER,, Land attack,MILAN (French for Missile d'Infanterie Léger Antichar, "Lightweight Infantry Anti-tank Missile"; German for kite raptor or Milvus) is a Franco-West German anti-tank guided missile system. Design of the MILAN began in 1962; it was ready for trials in 1971, and accepted for service in 1972. It is a wire-guided semi-automatic command to line of sight (SACLOS) missile, which means the sight of the launch unit must be aimed at a target to guide the missile.
fr_aster_30_b1nt=Aster 30 B1NT,,SAM,NT standing for "New Technology", it is a new variant of the Aster 30 designed to counter short and 1,500 km (930 mi)-class medium-range ballistic missiles.
fr_m31=M31 rockets,,Rockets with 200-pound (91 kg) high-explosive unitary warhead. Range: 9–57 miles (15–92 km). Improved M31 with new multi-mode fuze that added airburst to the M31's fuze point detonation and delay
