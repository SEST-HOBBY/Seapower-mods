[fr_vbl_recon]
Type=Scout car
Default=Panhard VBL recon ,VBL recon
DefaultDescription=The Panhard Véhicule Blindé Léger ("Light armoured vehicle"), also known by its initialism Panhard VBL or simply VBL, is a French wheeled 4×4 all-terrain vehicle built by Panhard. The vehicle is offered in various configurations, and was designed to combine the agility of the Peugeot P4 liaison vehicle with adequate protection against small arms fire, artillery fragments, mines and NBC weapons. Produced between 1985 and 2010, the vehicle has been used by the French Army and other European, African and Central American armies in various conflicts since the 1980s.
