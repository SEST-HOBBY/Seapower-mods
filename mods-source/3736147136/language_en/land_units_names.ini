[fr_mbt_leclerc]
Type=MBT
Default=Leclerc XLR,Leclerc XLR
DefaultDescription=The Leclerc tank is a French third-generation main battle tank.[6] It was designed at the AMX-APX state workshops and manufactured at the Roanne arsenal by the GIAT group of state-owned arsenals in the 1980s, which later became GIAT Industries in July 1990 following the group's privatization. GIAT Industries, renamed Nexter in 2005 and then KNDS France, continued production until July 2008. It is named in honor of Marshal Leclerc.
Variant1=Leclerc XLR,Leclerc XLR


[fr_ifv_vbci]
Type=IFV
Default=VBCI,VBCI
DefaultDescription=The Véhicule Blindé de Combat d'Infanterie (English: armoured infantry fighting vehicle) or VBCI is a French Infantry fighting vehicle designed and manufactured by GIAT Industries (now Nexter Systems) and Renault Trucks Defense (now Arquus) to replace the AMX-10P. The first units entered active service with the French Army in 2008
Variant1=VBCI,VBCI


[fr_afv_jaguar]
Type=AFV
Default=EBRC Jaguar,Jaguar
DefaultDescription=The Engin Blindé de Reconnaissance et de Combat Jaguar (English: Armoured Reconnaissance and Combat Vehicle Jaguar) or EBRC Jaguar is a six-wheel armoured fighting vehicle developed and manufactured by KNDS France, Arquus and Thales. It is intended to succeed three reconnaissance and/or fire support vehicles in French service—the AMX-10 RC, ERC 90 Sagaie and VAB HOT—and entered service in 2022 after twelve years of development.
Variant1=EBRC Jaguar,Jaguar

