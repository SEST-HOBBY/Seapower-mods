[fr_apc_griffon]
Type=APC
Default=VBMR Griffon,Griffon
DefaultDescription=The Véhicule Blindé Multi-Rôle Griffon ( English: Multirole Armoured Vehicle Griffon) or VBMR Griffon is a French six-wheel multi-purpose Mine-resistant ambush protected vehicle developed and manufactured by KNDS France (formerly Nexter Systems), Arquus (formerly Renault Trucks Defense) and Thales. The vehicle entered service in 2019 and is, alongside the four-wheel VBMR-L Serval co-developed by KNDS France and Texelis, the successor of the Véhicule de l'Avant Blindé (VAB).
Variant1=VBMR Griffon,Griffon

[fr_apc_serval]
Type=APC
Default=VBMR-L Serval,Serval
DefaultDescription=The Serval Light Multi-Role Armored Vehicle (VBMR-L) is a four-wheel-drive armored vehicle designed by Nexter and Texelis. It is one of the vehicles developed under the SCORPION program (Synergy of Contact Reinforced by Versatility and Information Enhancement), along with the Jaguar Armored Reconnaissance and Combat Vehicle (EBRC) and the Griffon Multi-Role Armored Vehicle (VBMR). Like the latter, the Serval is also intended to replace the VAB (Armored Forward Vehicle). The Serval was designed to operate in areas of contact with the enemy. It will primarily equip infantry units of light brigades as well as units deployed for support and reinforcement.
Variant1=VBMR-L Serval,Serval

[fr_samp-t]
Type=Mobile surface to air/anti ballistic missile system
Default=SAMP/T NG,SAMP/T NG 
DefaultDescription=SAMP/T (Sol-Air Moyenne-Portée/Terrestre, French for "Surface-to-Air Medium-Range/Land-based") is a mobile surface-to-air missile (SAM) system developed as a joint Franco-Italian project. It is capable of defending against aircraft, cruise missiles, and tactical ballistic missiles.SAMP/T NG is the next generation system with greater range and radar coverage purchased by France and Italy. Available since 2025, first deliveries in 2026
Variant1=SAMP/T NG,SAMP/T NG

