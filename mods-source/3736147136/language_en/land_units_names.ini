[fr_apc_vab_recon]
Type=APC
Default=VAB recon ,VAB recon
DefaultDescription=The Véhicule de l'Avant Blindé (VAB; literally meaning "Armoured Forward Vehicle"; but more appropriately translated: "Armoured Vanguard Vehicle") is a French armoured personnel carrier and support vehicle designed and manufactured by Renault Trucks Defense (now known as Arquus). It entered French service in 1979 and around 5,000 were produced for the French Army as well as for export.As of 2019, it still is the standard APC of the French Army but is gradually being replaced by its successors, the six-wheel VBMR Griffon (introduced in 2019) and the four-wheel VBMR-L Serval (introduced in 2022).
Variant1=VAB recon ,VAB recon

