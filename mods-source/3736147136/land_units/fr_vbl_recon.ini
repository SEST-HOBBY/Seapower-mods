[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=3.92                     // in meters
Beam=2.02                       // in meters
Range=370                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=2  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed


[Physics]
HorsePower=130
Mass=5.2                       // in tons

MaxForwardVelocity=51          // in knots
MaxBackwardVelocity=10         // in knots
Braking=20                     // knots/sec
TurnRate=55                    // in degrees per second

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Transport

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=2

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #AANF1
Type=CIWS
SystemName=AANF1_army
#Sensors
#Animations
#Mount
Mount=AANF1_tourelle
IsMountRotatable=True
#Containers
ContainerBase=AANF1_gun
Gun=AANF1_gun
AreContainersRotatable=True
#Angles
ElevationArc=-5,45
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
VIDIncrease=3  // In miles. Flat base VID increace when firing.
EffectPosition=0,0,-0.00375

[---------- WeaponMagazines ----------]

[WeaponMagazineCIWS]
NumberOfAmmunitionTypes=1
Ammunition1_Count=2000
Ammunition1=fr_cal_762x51mm
ModuleType=SmallMagazine

