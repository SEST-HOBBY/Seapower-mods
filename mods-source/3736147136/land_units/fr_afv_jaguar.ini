[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=7.8                     // in meters
Beam=2.99                       // in meters
Range=800                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed


[Physics]
HorsePower=490
Mass=25                      // in tons

MaxForwardVelocity=43.2        // in knots
MaxBackwardVelocity=7          // in knots
Braking=12                     // knots/sec
TurnRate=25                    // in degrees per second


[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_fr_afv_jaguar


[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.04,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.033,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=3

[WeaponSystem1] #40 CTC
Type=Gun
SystemName=40CTC_Gun
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Canon1
NumberOfGuns=1
Gun1=Canon
AreContainersRotatable=True
#Angles
ElevationArc=-10,60
RestAngles=0
EngageOnlyInsideArc=True
#Loading
AssociatedMagazine=WeaponMagazineGun
PreloadAmmunition=True
#Effects
#Other
MaxVelocityToFire=12
VIDIncrease=4  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2

[WeaponSystem2] #Akeron launcher
Type=Missile
SystemName=Akeron
#Sensors
#Animations
OpenSystemAnimation=RaiseNacelle
CloseSystemAnimation=LowerNacelle
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
NumberOfContainers=1
Container1=Nacelle
Container1_Position=0,0,0
#Angles
RestAngles=0,0
LoadAngles=Any
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
MaxVelocityToFire=12
VIDIncrease=8  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1  //List of systems

[WeaponSystem3] #Mag58
Type=CIWS
SystemName=Mag58
#Sensors
#Animations
#Mount
Mount=Mag58_tourelle
IsMountRotatable=True
#Containers
ContainerBase=Mag58_gun
Gun=Mag58_gun
AreContainersRotatable=True
#Angles
ElevationArc=-10,60
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineMag
#Effects
#Other
VIDIncrease=4  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1



[---------- WeaponMagazines ----------]
