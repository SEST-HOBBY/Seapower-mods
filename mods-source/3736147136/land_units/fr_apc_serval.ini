[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.7                     // in meters
Beam=2.5                       // in meters
Range=497                    // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed


[Physics]
HorsePower=375
Mass=16                      // in tons

MaxForwardVelocity=48        // in knots
MaxBackwardVelocity=10         // in knots
Braking=15                     // knots/sec
TurnRate=36                    // in degrees per second

[AI]
UnitScoreValue=0.2             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need Collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #M2
Type=CIWS
SystemName=M2
#Sensors
#Animations
#Mount
Mount=Tourelle
IsMountRotatable=True
#Containers
ContainerBase=12.7_gun
Gun=12.7_gun
AreContainersRotatable=True
#Angles
ElevationArc=-10,80
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
MaxReactiontime=2.5
MaxVelocityToFire=50
WorksStandalone=True
VIDIncrease=2.5  // In miles. Flat base VID increace when firing.
TargetAcquisitionTime=0.7

[---------- WeaponMagazines ----------]
[WeaponMagazineCIWS]
NumberOfAmmunitionTypes=1
Ammunition1_Count=2000
Ammunition1=fr_cal_127x99mm
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=0
LOD1Distance=0.7  // nautical miles
############################################################

ResourcesFolder=assets\models\land_units\serval/
ResourcesRoot=Serval.obj
ResourcesMesh=Hull
ResourcesMaterial=serval_mat.ini
############################################################

[Submodels]
NumberOfSubModels=11

SubModel1=Glass
SubModel2=Interieur
SubModel3=Tourelle
SubModel4=Crew
SubModel5=Seat
SubModel6=Tableau_bord
SubModel7=Piece_ja
SubModel8=Piece_le
SubModel9=Ecran
SubModel10=12.7_gun
Submodel11=Emblem

[Crew]
Mesh=Crew
Material=sof_bme_mat.ini

[Glass]
Mesh=Glass
ResourcesMaterialFolder=aircraft/materials/
Material=cockpit_glass

[Interieur]
Mesh=Interieur
Material=interieur_mat.ini

[Seat]
Mesh=Seat
Material=interieur_mat.ini

[Tourelle]
Mesh=Tourelle
Material=serval_mat.ini
Position=0.000627,0.0402,0.02188

[12.7_gun]
Mesh=12.7_gun
Material=armes_mat.ini
Parent=Tourelle
Position=0.000232,0.0136,-0.00238

[Ecran]
Mesh=Ecran
Material=ecran_mat.ini

[Piece_ja]
Mesh=Piece_ja
ResourcesMaterialFolder=assets\models\land_units\jaguar/
Material=jaguar_mat.ini

[Piece_le]
Mesh=Piece_le
ResourcesMaterialFolder=assets\models\land_units\leclerc/
Material=leclerc_mat.ini


[Tableau_bord]
Mesh=Tableau_bord
Material=interieur_mat.ini

[Emblem]
Mesh=Emblem
ResourcesMaterialFolder=ships/materials/emblem/
Material=emblem

[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0
MinVelocityForDust=5

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.01742,-0.0023
Rotation=0,0,0
Scale=0.04,0.035,0.07
Layer=Default

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default