[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.05                     // in meters
Beam=2.49                       // in meters
Range=497                    // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed


[Physics]
HorsePower=235
Mass=13                      // in tons

MaxForwardVelocity=48        // in knots
MaxBackwardVelocity=10         // in knots
Braking=15                     // knots/sec
TurnRate=36                    // in degrees per second

[AI]
UnitScoreValue=0.2             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need Collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[SensorSystem2] #Saclos
Type=Visual
SystemName=Saclos
Mount=Dummy
MountPosition=0,0,0
ModuleType=Bridge
Integrity=0

[SensorSystem3] #FCR
Type=Radar
SystemName=FCR
Mount=Dummy
MountPosition=0,0,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=3

[WeaponSystem1]  #M2
Type=CIWS
SystemName=M2
#Sensors
#Animations
#Mount
Mount=12.7_tourelle
IsMountRotatable=True
#Containers
ContainerBase=12.7_gun
Gun=12.7_gun
AreContainersRotatable=True
#Angles
ElevationArc=-10,80
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxReactiontime=2.5
MaxVelocityToFire=50
WorksStandalone=True
VIDIncrease=2.5  // In miles. Flat base VID increace when firing.
TargetAcquisitionTime=0.7

[WeaponSystem2] #Milan launcher
Type=Missile
SystemName=Milan
#Sensors
AssociatedSensors=SensorSystem2,SensorSystem3
#Animations
#Mount
Mount=Milan
IsMountRotatable=True
#Containers
NumberOfContainers=1
Container1=Milan
Container1_Position=0,0,0
#Angles
FiringArcs=157.5,202.5
RestAngles=180,0,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
VIDIncrease=8  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2  //List of systems


[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=1
Ammunition1_Count=2000
Ammunition1=fr_cal_127x99mm
ModuleType=SmallMagazine

[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=fr_milan_er
Ammunition1_Count=6
ModuleType=SmallMagazine

