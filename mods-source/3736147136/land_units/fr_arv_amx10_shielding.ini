[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.24                     // in meters
Beam=2.78                       // in meters
Range=500                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=10  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=250
Mass=16.6                        // in tons

MaxForwardVelocity=29.7          // in knots
MaxBackwardVelocity=20.5         // in knots
Braking=6                     // knots/sec
TurnRate=18                    // in degrees per second

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=10

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.042,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.03,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=2

[WeaponSystem1]  #F2
Type=Gun
SystemName=F2
#Sensors
#Animations
#Mount
Mount=Tourelle
IsMountRotatable=True
#Containers
ContainerBase=Canon
NumberOfGuns=1
Gun1=Canon
AreContainersRotatable=True
#Angles
ElevationArc=-10,20
RestAngles=0
EngageOnlyInsideArc=True
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxVelocityToFire=5
VIDIncrease=5  // In miles. Flat base VID increace when firing.


[WeaponSystem2]  #AANF1
Type=CIWS
SystemName=AANF1_coxiale
#Sensors
#Animations
#Mount
Mount=Tourelle
IsMountRotatable=True
#Containers
ContainerBase=Aanf1
Gun=Aanf1
AreContainersRotatable=True
#Angles
ElevationArc=-10,80
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
MaxReactiontime=2.5
MaxVelocityToFire=50
WorksStandalone=True
VIDIncrease=2.5  // In miles. Flat base VID increace when firing.
TargetAcquisitionTime=0.7



[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=3
Ammunition1=fr_cal_ofl_105_f3
Ammunition1_Count=16
Ammunition2=fr_cal_occ_105_f3
Ammunition2_Count=12
Ammunition3=fr_cal_oe_105_f3
Ammunition3_Count=10
ModuleType=MediumMagazine


[WeaponMagazineCIWS]
NumberOfAmmunitionTypes=1
Ammunition1_Count=2500
Ammunition1=fr_cal_762x51mm
ModuleType=SmallMagazine


