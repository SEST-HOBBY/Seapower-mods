[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=7.89                     // in meters
Beam=2.98                       // in meters
Range=750                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=550
Mass=32                      // in tons

MaxForwardVelocity=54        // in knots
MaxBackwardVelocity=7          // in knots
Braking=12                     // knots/sec
TurnRate=25                    // in degrees per second

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.04,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.033,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=2


[WeaponSystem1] #M811
Type=CIWS
SystemName=M811
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Canon
Gun=Canon
AreContainersRotatable=True
#Angles
ElevationArc=-10,60
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
VIDIncrease=4  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1


[WeaponSystem2]  #Mag58
Type=CIWS
SystemName=Mag58
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Mag58
Gun=Mag58
AreContainersRotatable=True
#Angles
ElevationArc=-10,80
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
MaxVelocityToFire=35
VIDIncrease=3  // In miles. Flat base VID increace when firing.


[---------- WeaponMagazines ----------]

[WeaponMagazineGun]
NumberOfAmmunitionTypes=1
Ammunition1=fr_cal_25mm
Ammunition1_Count=900
ModuleType=SmallMagazine

[WeaponMagazineCIWS]
NumberOfAmmunitionTypes=1
Ammunition1_Count=2500
Ammunition1=fr_cal_762x51mm
ModuleType=SmallMagazine


[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=0
LOD1Distance=1.0  // nautical miles

ResourcesFolder=assets\models\land_units\vbci/
ResourcesRoot=Vbci.obj
ResourcesMesh=Hull
ResourcesMaterial=vbci_mat.ini


NumberOfSubModels=4

SubModel1=Turret
SubModel2=Canon
SubModel3=Mag58
Submodel4=Emblem


[Turret]
Mesh=Turret
Material=vbci_mat.ini
Position=0.00251,0.0402,-0.00626

[Canon]
Mesh=Canon
Material=vbci_mat.ini
Parent=Turret
Position=-0.00327,-0.0012,0.0143

[Mag58]
Mesh=Mag58
Material=vbci_mat.ini
Parent=Turret
Position=0.0122,-0.00151,0.0092

[Emblem]
Mesh=Emblem
ResourcesMaterialFolder=ships/materials/emblem/
Material=emblem


[---------- Effects ----------]
[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.0197,0
Rotation=0,0,0
Scale=0.045,0.04,0.1

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default
