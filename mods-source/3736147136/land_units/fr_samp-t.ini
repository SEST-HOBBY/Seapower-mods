[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=False

DefaultCameraDistance=2
MinCameraDistanceForeAft=1
MinCameraDistanceBroadside=1
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=True
MaskVegetation=False //True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=25  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed


[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=10  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small


[ControlSystem]
Integrity=60

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1]  #Optics
# Optics. Does not need collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.036,0.088
ModuleType=Bridge

[SensorSystem2]  #GF300
Type=Radar
SystemName=GF300
Mount=GF300
RadarOffset=14     // in feet. Radar height over mount position
Collider=coll_search_radar_1
Integrity=6

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] 
Type=Missile
SystemName=SAMPT
#Sensors
AssociatedSensors=SensorSystem2
#Animations
#Mount
Mount=Rampe
MountPosition=0,0,0
IsMountRotatable=False
#Containers
NumberOfContainers=8
NumberOfHatchesPerContainer=1

Container1=Dummy
Container1_Position=0,0,0
Container1_Rotation=-90,45,0

Container2=Dummy
Container2_Position=0,0,0
Container2_Rotation=-90,45,0


Container3=Dummy
Container3_Position=0,0,0
Container3_Rotation=-90,45,0


Container4=Dummy
Container4_Position=0,0,0
Container4_Rotation=-90,45,0

Container5=Dummy
Container5_Position=0,0,0
Container5_Rotation=-90,45,0


Container6=Dummy
Container6_Position=0,0,0
Container6_Rotation=-90,45,0

Container7=Dummy
Container7_Position=0,0,0
Container7_Rotation=-90,45,0

Container8=Dummy
Container8_Position=0,0,0
Container8_Rotation=-90,45,0

AreContainersRotatable=False
AreContainersJoinedTogether=False  // if the containers can be move independent from each other up/down if there are more than one
#Angles
FixVerticalLaunchAngle=90
PreferredArcs=1,179
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
#Effects
HatchAudioClip=audio/weapons/missileHatchOpen
#Other
SharedLaunchInterval=1.0
Collider=coll_mk26_1


[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=fr_aster_30_b1nt
Ammunition1_Count=16  //8 on launchers + 8 on loader vehicle (Truck)




[--------------------------- Mesh definitions ---------------------------]
[Models]

ResourcesFolder=assets\models\land_units\samp-t/
ResourcesRoot=samp-t.obj
ResourcesMesh=Hull
ResourcesMaterial=samp-t_mat.ini

############################################################

[Submodels]
NumberOfSubModels=10

SubModel1=Interieur
SubModel2=Rampe
SubModel3=Roues
SubModel4=Seat
SubModel5=Tableau_bord
SubModel6=Echelle
SubModel7=GF300
SubModel8=Glass
SubModel9=Air
Submodel10=Emblem


[Interieur]
Mesh=Interieur
Material=samp-t_mat.ini

[Rampe]
