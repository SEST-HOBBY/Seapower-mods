

[ -------------------- Véhicules -------------------- ]

[fr_mbt_leclerc]
Type=MBT
Default=Leclerc XLR,Leclerc XLR
DefaultDescription=Le char Leclerc est un char de combat principal français de troisième génération. Il a été conçu aux ateliers publics de l'AMX-APX et fabriqué à l'arsenal de Roanne par le groupe d'arsenaux d'État GIAT dans les années 1980, qui est devenu plus tard GIAT Industries en juillet 1990 suite à la privatisation du groupe. GIAT Industries, rebaptisée Nexter en 2005 puis KNDS France, a poursuivi la production jusqu'en juillet 2008. Il est nommé en l'honneur du maréchal Leclerc.
Variant1=Leclerc XLR,Leclerc XLR

[fr_ifv_vbci]
Type=IFV
Default=VBCI,VBCI
DefaultDescription=Le Véhicule Blindé de Combat d'Infanterie ou VBCI est un véhicule de combat d'infanterie français conçu et fabriqué par GIAT Industries (aujourd'hui Nexter Systems) et Renault Trucks Defense (aujourd'hui Arquus) pour remplacer l'AMX-10P. Les premières unités sont entrées en service actif dans l'armée française en 2008.
Variant1=VBCI,VBCI

[fr_afv_jaguar]
Type=AFV
Default=EBRC Jaguar,Jaguar
DefaultDescription=L'Engin Blindé de Reconnaissance et de Combat Jaguar ou EBRC Jaguar est un véhicule de combat blindé à six roues développé et fabriqué par KNDS France, Arquus et Thales. Il est destiné à succéder à trois véhicules de reconnaissance et/ou d'appui-feu en service en France — l'AMX-10 RC, l'ERC 90 Sagaie et le VAB HOT — et est entré en service en 2022 après douze ans de développement.
Variant1=EBRC Jaguar,Jaguar

[fr_arv_amx10_shielding]
Type=ARV
Default=AMX-10 RC surblindé,AMX-10 RC surblindé
DefaultDescription=L'AMX-10 RC est un véhicule de combat blindé français fabriqué par Nexter Systems à des fins de reconnaissance blindée. Équipant les unités de cavalerie françaises depuis 1979, plus de 240 étaient encore en service dans l'armée française en 2021, lorsque le remplacement progressif par l'EBRC Jaguar a commencé. "RC" signifie "Roues-Canon", car il possède 6 roues et est armé d'un canon de calibre 105 mm.
Variant1=AMX-10 RC surblindé,AMX-10 RC surblindé

[fr_arv_amx10]
Type=ARV
Default=AMX-10 RC,AMX-10 RC
DefaultDescription=L'AMX-10 RC is un véhicule de combat blindé français fabriqué par Nexter Systems à des fins de reconnaissance blindée. Équipant les unités de cavalerie françaises depuis 1979, plus de 240 étaient encore en service dans l'armée française en 2021, lorsque le remplacement progressif par l'EBRC Jaguar a commencé. "RC" signifie "Roues-Canon", car il possède 6 roues et est armé d'un canon de calibre 105 mm.
Variant1=AMX-10 RC,AMX-10 RC

