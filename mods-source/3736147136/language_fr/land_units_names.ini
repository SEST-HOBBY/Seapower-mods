Default=VLFS,VLFS
DefaultDescription=Le VLFS est un Véhicule Léger des Forces Spéciales.
Variant1=VLFS,VLFS

[fr_mlrs_m270]
Type=MLRS
Default=M270 LRU,LRU
DefaultDescription=Le Lance-Roquettes Unitaire (LRU) a été développé par les États-Unis sur un châssis chenillé BRADLEY M 270. Équipé d'un groupe motopropulseur de 500 chevaux et construit en Europe par la France, l'Allemagne, le Royaume-Uni et l'Italie, le LRU équipe le 1er Régiment d'Artillerie.
Variant1=M270 LRU,LRU

[fr_apc_griffon]
Type=APC
Default=VBMR Griffon,Griffon
DefaultDescription=Le Véhicule Blindé Multi-Rôle Griffon ou VBMR Griffon est un véhicule polyvalent français à six roues, protégé contre les mines et les embuscades (MRAP), développé et fabriqué par KNDS France (anciennement Nexter Systems), Arquus (anciennement Renault Trucks Defense) et Thales. Le véhicule est entré en service en 2019 et est, aux côtés du VBMR-L Serval à quatre roues co-développé par KNDS France et Texelis, le successeur du Véhicule de l'Avant Blindé (VAB).
Variant1=VBMR Griffon,Griffon

[fr_apc_serval]
Type=APC
Default=VBMR-L Serval,Serval
DefaultDescription=Le Véhicule Blindé Multi-Rôle Léger Serval (VBMR-L) est un véhicule blindé à quatre roues motrices conçu par Nexter et Texelis. C'est l'un des véhicules développés dans le cadre du programme SCORPION (Synergie du Contact Renforcé par la Polyvalence et la Valorisation de l'Information), avec l'Engin Blindé de Reconnaissance et de Combat Jaguar (EBRC) et le Véhicule Blindé Multi-Rôle Griffon (VBMR). Comme ce dernier, le Serval est également destiné à remplacer le VAB (Véhicule de l'Avant Blindé). Le Serval a été conçu pour opérer dans les zones de contact avec l'ennemi. Il équipera principalement les unités d'infanterie des brigades légères ainsi que les unités déployées en appui et en renfort.
Variant1=VBMR-L Serval,Serval

[fr_samp-t]
Type=Mobile surface to air/anti ballistic missile system
Default=SAMP/T NG,SAMP/T NG 
DefaultDescription=Le SAMP/T (Sol-Air Moyenne-Portée/Terrestre) est un système de missile sol-air (SAM) mobile développé dans le cadre d'un projet conjoint franco-italien. Il est capable de se défendre contre les avions, les missiles de croisière et les missiles balistiques tactiques. Le SAMP/T NG est le système de nouvelle génération doté d'une portée et d'une couverture radar accrues, acheté par la France et l'Italie. Disponible depuis 2025, premières livraisons en 2026.
Variant1=SAMP/T NG,SAMP/T NG

[fr_spc_caesar]
Type=SPC
Default=CAESAR MK2 ,CAESAR MK2
DefaultDescription=Le Camion Équipé d'un Système d'Artillerie ou CAESAR est un canon automoteur français de 155 mm, 52 calibres, capable de tirer des obus aux normes OTAN de calibre 39/52. Il est installé sur un châssis de camion 6×6 ou 8×8.
Variant1=CAESAR MK2 ,CAESAR MK2

[fr_vbl_recon]
Type=Scout car
Default=Panhard VBL recon ,VBL recon
DefaultDescription=Le Panhard Véhicule Blindé Léger, également connu sous son sigle Panhard VBL ou simplement VBL, est un véhicule tout-terrain à roues 4×4 français construit par Panhard. Le véhicule est proposé dans diverses configurations et a été conçu pour combiner l'agilité du véhicule de liaison Peugeot P4 avec une protection adéquate contre les tirs d'armes légères, les éclats d'artillerie, les mines et les armes NBC. Produit entre 1985 et 2010, le véhicule a été utilisé par l'armée française et d'autres armées européennes, africaines et d'Amérique centrale dans divers conflits depuis les années 1980.
Variant1=Panhard VBL recon ,VBL recon

