[fr_apc_vab_recon]
Type=APC
Default=VAB recon ,VAB recon
DefaultDescription=Le Véhicule de l'Avant Blindé (VAB) est un véhicule de transport de troupes blindé et de soutien français conçu et fabriqué par Renault Trucks Defense (aujourd'hui connu sous le nom d'Arquus). Entré en service en France en 1979, environ 5 000 unités ont été produites pour l'armée française ainsi que pour l'exportation. En 2019, il restait le véhicule de transport de troupes standard de l'armée française mais est progressivement remplacé par ses successeurs, le VBMR Griffon à six roues (introduit en 2019) et le VBMR-L Serval à quatre roues (introduit en 2022).
Variant1=VAB recon ,VAB recon

