fr_akeron=Akeron MP,,Attaque au sol, L'Akeron est un système de missile guidé antichar portable de cinquième génération français.
fr_cal_155mm=155mm
fr_milan_er=Milan ER,, Attaque au sol, Le MILAN (Missile d'Infanterie Léger Antichar) est un système de missile guidé antichar franco-allemand. La conception du MILAN a commencé en 1962 ; il était prêt pour les essais en 1971 et a été accepté pour le service en 1972. Il s'agit d'un missile guidé par fil à commande semi-automatique sur la ligne de visée (SACLOS), ce qui signifie que le viseur de l'unité de lancement doit être pointé vers une cible pour guider le missile.
fr_aster_30_b1nt=Aster 30 B1NT,,SAM, NT signifiant "Nouvelle Technologie", il s'agit d'une nouvelle variante de l'Aster 30 conçue pour contrer les missiles balistiques de courte portée et de portée moyenne de la classe des 1 500 km (930 mi).
fr_m31=Roquettes M31,,Roquettes dotées d'une ogive unitaire hautement explosive de 200 livres (91 kg). Portée : 9–57 milles (15–92 km). M31 améliorée avec une nouvelle fusée multimode qui ajoute l'explosion aérienne à la détonation ponctuelle et au retard de la fusée de la M31.
