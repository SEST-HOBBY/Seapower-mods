DefaultDescription=VAB（前线装甲车）是由雷诺卡车防务公司（现称为Arquus）设计和制造的法国装甲输送车和支援车。它于1979年开始在法国服役，为法国陆军以及出口生产了约5,000辆。截至2019年，它仍然是法国陆军 micron 的标准装甲输送车，但正逐渐被其继承者六轮VBMR 狮鹫（2019年引入）和四轮VBMR-L 薮猫（2022年引入）所取代。
