DefaultDescription=勒克莱尔坦克是法国第三代主战坦克。它由AMX-APX国家车间设计，并于1980年代由国营GIAT集团的罗阿讷兵工厂制造。该集团在私有化后于1990年7月成为GIAT工业公司。2005年更名为Nexter，后更名为KNDS法国，持续生产至2008年7月。该坦克以勒克莱尔元帅的名字命名。
Variant1=勒克莱尔 XLR,勒克莱尔 XLR

