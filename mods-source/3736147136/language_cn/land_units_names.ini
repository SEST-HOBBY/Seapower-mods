[fr_vbl_recon]
Type=Scout car
Default=潘哈德 VBL 侦察车,VBL 侦察车
DefaultDescription=潘哈德轻型装甲车，亦因其首字母缩写而被称为潘哈德 VBL 或简称 VBL，是法国潘哈德公司制造的一款轮式 4×4 全地形车辆。该车提供多种配置，旨在将标致 P4 联络车的灵活性与针对轻武器火力、炮弹碎片、地雷和三防（NBC）武器的适当保护相结合。该车于1985年至2010年间生产，自1980年代以来一直被法国陆军以及其他欧洲、非洲和中美洲军队用于各种冲突。
Variant1=潘哈德 VBL 侦察车,VBL 侦察车

