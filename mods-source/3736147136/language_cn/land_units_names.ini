DefaultDescription=AMX-10 RC是法国Nexter系统公司制造的一款用于装甲侦察的装甲战车。自1979年起装备法国骑兵部队，2021年时仍有超过240辆在法国陆军服役，随后开始逐步被EBRC美洲豹取代。“RC”代表“Roues-Canon”（轮式火炮），因为它采用6轮底盘，并装备了一门105毫米口径的火炮。
Variant1=AMX-10 RC 重装甲型,AMX-10 RC 重装甲型

