[fr_apc_griffon]
Type=APC
Default=VBMR 狮鹫,狮鹫
DefaultDescription=VBMR 狮鹫（狮鹫多用途装甲车）是法国的一款六轮多用途防地雷反伏击（MRAP）车辆，由KNDS法国（前Nexter系统公司）、Arquus（前雷诺卡车防务）和泰雷兹公司开发和制造。该车于2019年投入服役，与KNDS法国和Texelis联合开发的四轮VBMR-L 薮猫坦克一起，是前线装甲车（VAB）的继承者。
Variant1=VBMR 狮鹫,狮鹫

[fr_apc_serval]
Type=APC
Default=VBMR-L 薮猫,薮猫
DefaultDescription=薮猫轻型多用途装甲车（VBMR-L）是由Nexter和Texelis设计的一款四轮驱动装甲车。它是根据SCORPION计划（通过多功能性和信息增强加强接触协同）开发的车辆之一，与之齐名的还有美洲豹装甲侦察与战斗车（EBRC）和狮鹫多用途装甲车（VBMR）。与后者一样，薮猫也旨在取代VAB（前线装甲车）。薮猫被设计用于与敌人接触的区域作业。它将主要装备轻型旅的步兵部队以及部署用于支援和增援的部队。
Variant1=VBMR-L 薮猫,薮猫

[fr_samp-t]
Type=Mobile surface to air/anti ballistic missile system
Default=SAMP/T NG 区域防空导弹系统,SAMP/T NG 
DefaultDescription=SAMP/T（陆基中程地空导弹系统）是由法国和意大利联合项目开发的一款移动式地空导弹（SAM）系统。它能够防御飞机、巡航导弹和战术弹道导弹。SAMP/T NG是法国和意大利购买的具有更远射程和雷达覆盖范围 sectional 的下一代系统。于2025年上市，2026年开始首批交付。
Variant1=SAMP/T NG,SAMP/T NG

