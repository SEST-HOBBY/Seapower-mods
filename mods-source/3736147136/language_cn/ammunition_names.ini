fr_akeron=Akeron MP,,对地攻击, Akeron（亚克隆）是法国第五代单兵便携式反坦克导弹出击系统。
fr_cal_155mm=155毫米
fr_milan_er=米兰 ER,, 对地攻击, MILAN（法国轻型步兵反坦克导弹，德语意为红鸢）是法国和西德联合研制的反坦克导弹系统。该系统于1962年开始设计，1971年准备接受试验，1972年投入服役。它是一种有线制导的半自动指令至瞄准线（SACLOS）导弹，这意味着发射单元的瞄准镜必须一直对准目标以引导导弹。
fr_aster_30_b1nt=紫菀 30 B1NT,,地空导弹, NT代表“新技术”，是紫菀 30导弹的一种新型号，旨在拦截短程和1500公里（930英里）级的中程弹道导弹。
fr_m31=M31火箭弹,,配备200磅（91公斤）高爆整体战斗部的火箭弹。射程：9-57英里（15-92公里）。改进型M31配备了新型多模式引信，在M31原本的触发和延时引信基础上增加了空爆功能。
