[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW            // can be AAW, ASuW, ASW

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=1510      // meter per second
MaxRange=3300              // in meters
GravityFactor=14
CircularErrorProbable=3.3    // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=1
Power=1.3
ImpactSize=0.1      // Impact size, can be small, medium, large, verylarge
Penetration=Moderate         // can be minor, moderate, heavy, always 
[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitDefaultExplosionClass=SmallFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
