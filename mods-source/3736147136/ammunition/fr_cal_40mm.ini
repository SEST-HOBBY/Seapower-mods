[General]
Type=Projectile                       // can be Projectile, Missile, Torpedo
TargetType=AAW                        // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=4.5                               // in kg. Used for aircraft
AmmoPoints=4.5                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpactsSmall            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=860                    // meter per second
MaxRange=4500                         // in m
GravityFactor=4
CircularErrorProbable=25              // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=0.98
ImpactSize=Tiny                       // Impact size, can be small, medium, large, verylarge
Penetration=Minor                     // can be minor, moderate, heavy, always
FuzeProximityDistance=25              // In meters
KillProbability=0.0002                // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell_small
ResourcesMesh=shell_small
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_small_shell
HitAirExplosionClass=SmallFlakExplosions
HitDefaultExplosion=effects/Particle Emitters/impact_small_shell
HitWaterSplashClass=TinyWaterSplashes
