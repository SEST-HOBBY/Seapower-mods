DefaultDescription=The Ticonderoga class cruisers were the first US Navy warships built around the Aegis combat system and its AN/SPY-1 radar. From USS Bunker Hill onward they carried two 61 cell Mk 41 vertical launchers in place of twin arm launchers.\nThis cruiser imagines Anduril's Steelfin, a two stage surface to air interceptor, loaded into its Mk 41 cells.
