# Mil Mi-6A Hook (sov_mi6). 1 game unit = 68 m. Origin under the main rotor shaft, 3.0 m above the lowest wheel.
# Layout follows the stock wp_mi-14 (rotor, discs, rudder system) and usn_ch-46 (transport).
# Armament: one A-12.7 12.7 mm machine gun in the nose ball mount (systems/sov_mi6_weapons.ini), turret layout as the stock Ka-29 gun.
# Data: empty 27,240 kg; fuel 6,315 kg internal + 3,490 kg in the two external tanks; 300 km/h; ceiling 4,500 m;
# climb 6.5 m/s; range 620 km internal fuel, 1,000 km with external tanks; 65 equipped troops.
[General]
UnitType=Helicopter
# CombatCosts mod (optional): airframe price in USD. Estimate, scaled from Mi-8 (0.84 M, 1967) and SA.321 (1.4 M, 1966)
# in that mod's list for a helicopter about four times the Mi-8's empty weight. Ignored by the game itself.
AircraftCosts=2000000
CurrentYearCost=20000000
CarrierCapable=False

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.0

Length=33.18                        // in meters (fuselage)

GroundedPitchAngle=0  // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.0488,0.01 // nose wheel 3.32 m below the origin (main wheels 0.2 m higher)
GroundTaxiInterval=0.4
ForwardsTaxiVelocity=15
BackwardsTaxiVelocity=0

PilotPositions=-0.02,-0.0118,0.1257|0.02,-0.0118,0.1257

FrontalArea=22
SideArea=110
BottomArea=135
[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[AI]
Role=Transport,SAR

[---------- Physics and Control ----------]
[Physics]
MaxPitchRate=8.0                   // in degrees per second
MaxRollRate=15.0                   // in degrees per second
MaxYawRate=25.0                    // in degrees per second
MaxPitchAngle=20
MaxRollAngleHovering=20
MaxRollAngleForwardFlight=35
TargetPitchForForwardFlight=6.0    // angle in degrees the helicopter stays in when moving forward when releasing controls

// hovering movements
HoverStrength=0.1                  // determines how strong the hover movements are
MinVelocityForNoHoverMovement=40   // in knots, above this value there won't be additional hover movements
MaxHoverRadius=5                   // radius in meter the heli is allowed to do hover movements

MaxSpeedAtSeaLevel=162             // in knots (300 km/h)
MaxBackwardSpeed=15                // in knots
MaxSidewardSpeed=15                // in knots
Ceiling=14750                      // ceiling in feet (4,500 m)
Altitudes=20,200,500,1000,3000,6000,10000  // in feet
ClimbRate=21.3                     // feet per second (6.5 m/s)

EmptyMass=27240                    // in kg
MaxFuel=9805                       // in kg, 6,315 internal + 3,490 in the external tanks
MaxRange=540                       // in n miles (1,000 km with external tanks)

TransportCapacity=65               // In people (equipped troops)

HoveringFuelConsumption=1.0        // Minimum fuel consumption when hovering.

MainThrustAccelerationFactor=3.0   // determines the engine thrust acceleration factor (as multiplicator of v=a*t)
LinearDrag=0.9995                  // this is for velocity damping (linear drag)
CurveDragFactor=2.0                // determines how quickly the helicopter loses velocity (dependend on steepness of curve)
GravityDragFactor=1.0              // determines the gravity factor (1.0 means here standard 9.81m/s²)

MousePitchFactor=0.3
MouseYawFactor=0.3

EngineWarmUpTime=45
RotorsSpinUpTime=60

[SensorData]
VisualIdentificationRange=9        // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
RCS=60

[FlightControls]
RotorConfiguration=SingleMain      // can be singlemain, coaxial, tandem
SwashplateMaxAngle=5.0
NumberOfRotors=2
Rotor1_Model=Rotor_Shaft
Rotor1_DiscModel=Rotor_Disc
Rotor1_SwashplateModel=Swashplate
Rotor1_Direction=-1.0
Rotor1_RotationAxis=Z
Rotor1_RPM=120
Rotor1_Type=Main     // can be main or tail

Rotor2_Model=Tail_Rotor
Rotor2_DiscModel=Tail_Rotor_Disc
Rotor2_Direction=1.0
Rotor2_RotationAxis=Z
Rotor2_RPM=665       // estimated from the same tip speed as the main rotor (6.3 m rotor)
Rotor2_Type=Tail     // can be main or tail

[RudderSystem]
