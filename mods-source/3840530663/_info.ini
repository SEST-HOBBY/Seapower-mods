Name=Mil Mi-6 Hook
Description=Version 1.0. Soviet Mi-6A heavy transport helicopter (1959-2002) in grey Soviet Air Force finish with external fuel tanks and the auxiliary wing. Five-blade 35 m main rotor and four-blade tail rotor on the right side, 65 equipped troops. One A-12.7 12.7 mm machine gun in the nose ball mount (270 rounds) that aims and fires at targets ahead of the nose. Burnt crash wreck and two levels of detail. Model "Mi6" by manilov.ap (Sketchfab, CC BY 4.0), converted for Sea Power by Thomas. No other mods required.
