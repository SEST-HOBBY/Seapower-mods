#!extend systems/weapons.ini
[sov_mi6_a127]
# Afanasev A-12.7 (9-A-016P) 12.7 mm machine gun in the Mi-6's nose ball mount, aimed by the navigator.
# 270 rounds, about 900 rds/min. Hand-aimed, so slow slewing and a low aircraft hit chance (stock DShK 3, NSVT 7).
# No in-flight reload: the 270 loaded rounds are the total (same fix as the J 29F and the Draken).
MissileInterceptChance=0
AircraftInterceptChance=5
HorizontalDegreesPerSecond=45
VerticalDegreesPerSecond=35
FireRate=900
BurstTime=1.0
RoundsLoaded=270
ReloadTime=99999
MoveToRestPositionTime=15
Effect=effects/weapons/emitters/wp_dshk_burst_explosive
# Muzzle: barrel tip 1.22 m (0.018) ahead of the ball-mount pivot, pulled back 0.08 m as the stock tank DShK (-0.0012).
# In fast flight the flash is drawn 1-2 m ahead of the muzzle whatever this value is (tests 15 Nov with 0.018 and -0.003).
EffectPosition=0,0,0.0168
SpawnPosition=0,0,0.018
