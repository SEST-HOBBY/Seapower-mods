DefaultDescription=Mi-6A (NATO: Hook-A) Soviet heavy transport helicopter, for years the largest helicopter in the world. Two D-25V turboshafts drive a five-blade 35 m main rotor; a small wing unloads the rotor in cruise. Carries 65 equipped troops, 41 stretchers or 12,000 kg of cargo through the rear clamshell doors. Defensive armament: one A-12.7 12.7 mm machine gun in the nose, aimed by the navigator.
