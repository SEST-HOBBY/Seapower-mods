usa_apkws_2_m282=M282,APKWS Ⅱ,制导火箭弹,先进精确杀伤武器系统（英语：Advanced Precision Kill Weapon System，缩写：APKWS；又称：地狱火二世、迷你地狱火）是一款由英国宇航系统先后为美国陆军和海军开发的镭射制导配件，装在由武装直升机与攻击机所发射的九头蛇70航空火箭弹以上，将本来无控的传统航空火箭弹转变为可控，并且能够在恶劣气象条件下使用的精确制导弹药（PGM）。

