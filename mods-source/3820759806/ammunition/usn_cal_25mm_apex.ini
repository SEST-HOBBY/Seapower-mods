# PGU-47/U APEX (Armour Piercing Explosive), 25 x 137 mm
# GAU-22/A four-barrel Gatling gun - RAAF F-35A
# Australia contracted for APEX ammunition in 2025, with deliveries planned through 2027.
# Source for projectile: Nammo 25 mm x 137 APEX (222 g, 970 m/s).
# Mass below estimates the COMPLETE CARTRIDGE, not the 222 g projectile.
# MaxRange, CircularErrorProbable and WarheadData values are Sea Power gameplay estimates.

[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=AAW             // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=0.535                             // in kg. Used for aircraft. Approximate complete cartridge mass; projectile is 0.222 kg
AmmoPoints=0.535                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=970          // meter per second; Nammo APEX specification for F-35
MaxRange=3500               // in m; game-range estimate, not a published APEX limit
CircularErrorProbable=5.0   // radius in meters at max range for shells to impact; game estimate

[---------- Warhead Data ----------]
[WarheadData]
Power=0.55                  // increased from base 20 mm 0.35; game balance estimate
ImpactSize=Small            // Impact size, can be small, medium, large, verylarge
Penetration=Moderate        // can be minor, moderate, heavy, always; proxy for light-armour penetration

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitWaterSplashClass=TinyWaterSplashes
