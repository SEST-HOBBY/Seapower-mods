#=========================================================================================================================================================
# RAAF AGM-158A JASSM
# Baseline Joint Air-to-Surface Standoff Missile used by RAAF F/A-18A/B Classic Hornet.
# Service Release: 1 November 2011.
# Uses AGM-158B-2 model/material as the closest available visual stand-in.
#=========================================================================================================================================================

[General]
# AGM-158A JASSM
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=ASuW                        // engine target category used for surface/land attack weapons
LandAttackCapability=Installation      // baseline JASSM is modelled here primarily against pre-planned fixed land targets
CanNotAttackTypes=Vessel,Submarine     // AGM-158A JASSM is not an anti-ship weapon

Mass=1020                              // kg; approximately 2,250 lb launch weight
AmmoPoints=3500                        // older baseline JASSM; lower than later JASSM-ER/LRASM family configs
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard                    // referenced in effects/decals.ini

[SensorData]
# Low-observable airframe
VisualIdentificationRange=2            // nm
IRSignature=VeryTiny
RCS=VeryTiny
TransientRCS=VeryTiny                  // transient visibility on radar
TransientVisualIdentificationRange=2   // nm
TransientBaseNoise=0.5

[---------- Warhead Data ----------]
# Warhead Types:
# 0 = Blast Fragmentation
# 1 = Armor Piercing
# 2 = HEAT
# 3 = Illumination
# 4 = Cluster
# 5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=45                               // 1,000-lb class WDU-42/B penetrator/blast-fragmentation warhead
ImpactSize=VeryLarge
Penetration=Always

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing

[Guidance]
# Real weapon uses autonomous INS/GPS midcourse navigation and terminal imaging-infrared guidance.
GuidanceType=1                         // terminal IIR seeker represented by IR Homing
MidCourseCorrection=0                  // no weapon datalink on baseline AGM-158A
DropDuration=4                         // initial unpowered separation after release
InitialFlightPhaseDuration=5.0
TerrainFollowFlight=True
SupportsBanking=True

#======================================== Flight Profile ===========================================================
MaxLoftAngle=50.0
MaxLoftAlt=6000                        // feet; gameplay representation of post-release cruise profile
TerminalApproachDist=10.0              // nm
TerminalAlt=6000
TerminalDiveDistance=4                 // nm
TerminalPopup=False

MaxVelocity=595                        // knots; subsonic cruise representation
Acceleration=6.0
MaxTurnRate=30.0
MinLaunchRange=10.0                    // nm
MaxLaunchRange=200                     // nm; conservative representation of published >200 nm baseline range
MinLaunchAltitude=5000                 // feet; retained from AGM-158 family reference config
MaxLaunchAltitude=80000                // feet; engine ceiling retained from family reference config
LaunchReliability=97

#======================================== Seeker ===================================================================
# Terminal imaging-infrared seeker
SeekerGain=100.0
SeekerFOV=10                           // degrees
SeekerActiveRange=0                    // passive IIR seeker
SeekerPassiveRange=15.0                // nm; gameplay approximation based on AGM-158 family configs
NightVisionLevel=1.0
Zoom=2
TargetMemory=True                      // remains committed to the preselected aimpoint/target

# ECCM / anti-jam behaviour
AntiCountermeasuresBonus=0.6
AntiJammerBonus=0.5

# Self-destruct
SelfDestructAfterTargetGone=False
SelfDestructDelay=5.0

[---------- Mesh definitions ----------]
[Models]
# AGM-158B-2 mesh is externally suitable as a stand-in for the baseline AGM-158A.
ResourcesFolder=assets/models/ammunition/agm-158/
ResourcesRoot=agm-158b2.obj
ResourcesMesh=AGM
ResourcesMeshForLaunch=launch

ResourcesMaterialFolder=assets/models/ammunition/agm-158/
ResourcesMaterial=usn_agm-158b2_mat.ini
ResourcesMeshSwitchTime=3
Rotation=0,0,0

NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
BoosterEffect=None
BoosterEffectPosition=0,0,-0.022

InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=2.0

HitDefaultExplosionClass=LargeGroundHitExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=LargeGroundHitExplosions

[---------- Colliders ----------]
[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.0099
Rotation=0,0,0
Scale=0.003,0.003,0.042
