#!alias ammunition/usn_aim-9x.ini
# ===============================================================================
# Australian Army NASAMS - ground-launched AIM-9X Block II Sidewinder
# Inherits the US Aviation missile model, IR seeker, warhead, rocket motor,
# and manoeuvring parameters. No additional rocket booster is fitted.
#
# IMPORTANT: 8 nmi is a test ceiling, not a verified guaranteed range.
# Actual lock-on and engagement reach will depend on target IR signature,
# aspect, speed, altitude and Sea Power's missile kinematics.
# ===============================================================================

[General]
AirLaunched=False                        // Surface-launched ammunition designation

[Guidance]
DropDuration=0                           // Motor launches directly from NASAMS canister

# Ground-launch reference; the source aircraft missile has no explicit
# typical launch condition fields and may otherwise use game defaults.
TypicalLaunchVelocity=0                 // knots; stationary ground launcher
TypicalFiringAlt=0                      // feet; sea-level test battery
TypicalTargetSpeed=600                  // knots; representative aircraft target
TypicalTargetAlt=6000                   // feet; representative low/medium-altitude target
MaxLaunchRange=8.0                      // nmi ~= 14.8 km; indicative ground-launch calibration ceiling
DragCoefficient=-1                      // auto-calculated drag from ground-launch calibration

# Retain the original missile's 40-second MaxFlightTime for initial testing.
# If engagements near the test ceiling time out, assess it separately.
