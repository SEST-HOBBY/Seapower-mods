#!alias ammunition/usn_aim-120c7.ini
# ===============================================================================
# Australian Army NASAMS - ground-launched AIM-120C-7 AMRAAM
# Inherits the US Aviation missile model, seeker, warhead, rocket-motor
# acceleration, burn duration, and terminal characteristics.
# This is a ground-launch kinematics calibration profile, NOT a modified
# missile or an additional rocket booster.
#
# IMPORTANT: values below are a proposed Sea Power calibration starting point;
# the real engagement envelope is target/geometry dependent. Test in game.
# ===============================================================================

[General]
AirLaunched=False                        // Surface-launched ammunition designation

[Guidance]
DropDuration=0                           // Motor launches directly from NASAMS canister, no aircraft drop

# Ground-launched reference conditions used for automated kinematics/drag tuning.
# No launch aircraft speed/altitude advantage is available.
TypicalLaunchVelocity=0                 // knots; stationary ground launcher
TypicalFiringAlt=0                      // feet; sea-level test battery (actual launcher height is scenario dependent)
TypicalTargetSpeed=600                  // knots; representative non-manoeuvring aircraft for testing
TypicalTargetAlt=20000                   // feet; representative low/medium-altitude threat for test calibration
MaxLaunchRange=13.5                     // nmi ~= 25 km; conservative published ground-launched NASAMS reference
DragCoefficient=-1                      // let game auto-calculate drag for this ground-launch reference envelope

# Do not change inherited Acceleration, AccelerationTime, SustainerAcceleration
# or MaxVelocity without evidence of a missile/propulsion change.
