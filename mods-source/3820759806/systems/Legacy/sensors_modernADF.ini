[au_STRIX]
# SAGEM/Safran STRIX Roof-Mounted Sight
# Users: ADF Tiger ARH
Kind=Visual
Type=Targeting
TargetChannels=4
WeaponChannels=1
#Infrared
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=2.2           // Target VID range multiplied by this for identification check
MaxRangeMultiplier=2.8           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.85          // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1.0             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day
FCSolutionGainRate=2.0
FCMinSolution=0.7
FCTracksRounds=False

