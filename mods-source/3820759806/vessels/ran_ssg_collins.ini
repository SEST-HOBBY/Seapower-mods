[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.15

Length=77.42                    // in meters
Beam=7.8                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor

[OpticalView]
Views=standard_periscope,bridge_binocular_eoss_stab_thermal
DefaultView=bridge_binocular_eoss_stab_thermal

[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=3400              // in tons

MaxForwardVelocity=20.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=10.0
MaxBackwardVelocitySurfaced=20.0
MaxBackwardVelocity=7.0        // sets the max backward velocity
TelegraphVelocities=-7,0,2,5,10,15,20

BowUnderWater=10.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=25.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.7                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=0                 // default trim depth in feet
TrimAngle=0                 // default base trim angle (x-axis, so pitch)
#TrimAngle=-0.1                 // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0        // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=33.0            // in feet
CrushDepth=1870.0              // in feet

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

CavitationParameters=18		   // defines the speed in knots at 100m depth that the submarine will cavitate at

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
LowMagneticHull=True
# Sonar related
BaseNoise=100                  // base sound level in db at 1m distance
FlowNoise=1.0                    // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5             // additional noise for cavitation in db
TargetReflectionStrength=16    // in dB for broad side
BladesCount=7                  //number of blades on vessel's propulsion systems
ElectricFrequency=60           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

# Acoustic engineering
MachineryRaftingGeneration=3
PropellerType=Skewback

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_Collins

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
AAW_Capability=0
ASuW_Capability=7
ASW_Capability=7

#Defence
#Special
Role=SS

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

############################################################
# Main Power System (engine room, boiler, reactor)
############################################################
[MainPowerSystem]
Type=Diesel
HorsePower=5630
AdditionalNoise=12        //Added to current noise level when running on this power
Collider=coll_engineroom

[SnorkelMastSystem]
MaxForwardVelocity=10
Collider=coll_snorkel_mast
Mount=Snorkel
OpenSystemAnimation=RaiseSnorkel
CloseSystemAnimation=LowerSnorkel
ModuleType=Inert

[AuxPowerSystem]
Type=Electric
HorsePower=7200
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
Capacity=32500      //Range 20 miles at top underwater speed (17 knots)
DischargeRate=1.25  //Rate of discharging batteries. Lower values provide more range on low underwater speed on batteries
RechargeRate=2.0    //Capacity per second when charging batteries. When a unit goes at Standard telegraph setting or slower, the charge rate doubles
Collider=coll_battery_1,coll_battery_2

[PropulsionSystems]
############################################################
# Propulsion Systems
############################################################
