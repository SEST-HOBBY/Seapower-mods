[-------------------- Helicopters --------------------]

[ran_S-70B-2_Seahawk]
Type=Helicopter,ASW Helicopter
Default=S-70B-2 RAN, S-70B-2 RAN
DefaultDescription=A maritime variant of the Black Hawk helicopter, the S-70B-2 was introduced into RAN service in 1988 for anti-submarine and surface warfare roles. Equipped with advanced torpedoes, maritime radar and a tail-boom mounted Magnetic Anomaly Detector, the S-70B-2 operated from Australian frigates and destroyers. This powerful new platform delivered vital sub-surface threat detection and engagement capability well into the 2010s, ultimately leading to replacement by its successor, the MH-60R 'Romeo' variant of the Seahawk in 2017. The AN/AAQ-16 were added to Gulf War deployed RAN Seahawks and is represented in this version, alongside the Penguin anti-ship missile which was trialed but in reality not utilised by the RAN.
Squadron1=S-70B-2 816 Squadron,816 Sqn
Callsigns=Squadron1,Tiger

[ran_seakingmk50ab]
Type=Helicopter,Medium Lift Helicopter
Default=Sea King Mk.50A/B,Sea King
DefaultDescription=The Sea King Mk.50A LOTE and Mk.50B represented the final evolution of the Royal Australian Navy's long-serving Sea King helicopter fleet. Following the introduction of the S-70B-2 Seahawk, the Sea Kings were progressively withdrawn from anti-submarine warfare duties and converted into maritime utility helicopters under the Life of Type Extension (LOTE) programme completed in 1997. The upgrade removed the dipping sonar and associated ASW equipment while introducing improved avionics, communications, an upgraded ARI 5955/2 surface-search radar and modifications to increase troop and cargo capacity. Operated by 817 Squadron, the modernised Sea Kings provided troop transport, maritime surveillance, search and rescue, humanitarian assistance and fleet logistics, frequently embarking aboard the RAN's amphibious and replenishment vessels. The Mk.50A LOTE and Mk.50B remained essential components of the RAN's maritime support capability until their retirement in December 2011, with their duties subsequently assumed by the MRH-90 Taipan.
Squadron1=Mk.50A/B 817 Squadron,817 Sqn
Callsigns=Squadron1,Shark

[ran_sea_lynx_3]
Type=Helicopter,ASW Helicopter
Default=Sea Lynx Mk.20A,Sea Lynx
DefaultDescription=The Westland Sea Lynx Mk.20 was an export derivative of the British HAS.2 acquired by the Royal Australian Navy in the early 1980s for operation aboard the Quickmatch-class destroyers. The Mk.20A represented a later upgrade of the RAN fleet to a standard broadly comparable with the British HAS.3, incorporating improved engines, avionics and mission systems to extend the aircraft’s operational life. Introduced from the late 1980s, the upgrade added improved electro-optical sensors and FLIR, enhanced dipping-sonar capability, and compatibility with the Mk 46 Mod 5 lightweight torpedo. Survivability was also improved through the addition of radar-warning equipment and chaff countermeasures. Following completion of the DDL Upgrade programme in the 2000s, the Sea Lynx continued to provide the class with an embarked anti-submarine and surface-surveillance capability. However, with the RAN subsequently replacing the S-70B-2 Seahawk with the MH-60R, a decision was made to standardise the fleet’s embarked ASW helicopter force on the newer aircraft. The Sea Lynx Mk.20A and S-70B-2 were withdrawn from service in 2017, after which MH-60Rs operated from the upgraded DDLs until the ships themselves were retired.\n\nThe Sea Lynx was evaluated alongside the Seahawk in the 1980s and ultimately not selected. It is included as an interesting 'what-if' for the DDL.
Squadron1=Mk.20A 808 Squadron RAN,808 Sqn
Callsigns=Squadron1,Talon

[ran_mh-60r]
Type=Helicopter,ASW Helicopter
Default=MH-60R RAN,MH-60R RAN
DefaultDescription=The Sikorsky MH-60R Seahawk is a twin-engine, shipborne multi-mission helicopter derived from the UH-60 Black Hawk and a member of the Sikorsky S-70 family. Developed as the US Navy’s common maritime combat helicopter, the MH-60R combines anti-submarine and anti-surface warfare capabilities with an advanced sensor suite including dipping sonar, sonobuoys, maritime-search radar, electro-optical sensors and electronic-support measures. It replaced the earlier SH-60B and SH-60F variants in US Navy service. Australia selected the MH-60R to replace the RAN’s S-70B-2 Seahawks, with the first aircraft entering service in 2014 and operational embarked deployments beginning in 2016. 
Squadron1=MH-60R 816 Squadron,816 Sqn
Squadron2=MH-60R 808 Squadron,808 Sqn
Callsigns=Squadron1,Tiger|Squadron2,Siren

[aus_mrh90_tth]
Type=Utility Helicopter
Default=MRH-90,MRH-90
DefaultDescription=The MRH-90 Taipan was the Australian Defence Force variant of the NHIndustries NH90 TTH, introduced to replace the Army’s S-70A-9 Black Hawks and the Royal Australian Navy’s Sea King helicopters. Designed as a modern multi-role transport helicopter, the Taipan featured fly-by-wire controls, a digital glass cockpit, advanced navigation and self-protection systems, and capacity for troops, cargo, medical evacuation and external loads. The type served with both Army aviation units and the RAN’s 808 Squadron, supporting tactical air mobility, amphibious operations, special operations and maritime logistics. Although capable and technologically advanced, the fleet suffered persistent availability and sustainment problems throughout its service and was retired early in 2023.
Squadron1=MRH-90 5th Aviation Regiment,5th Aviation Regt
Squadron2=MRH-90 808 Squadron,808 Sqn
Callsigns=Squadron1,Brumby|Squadron2,Warhorse

[ran_uh-60m]
Type=Utility Helicopter
Default=UH-60M ADF,UH-60M ADF
DefaultDescription=The UH-60M Black Hawk was selected under LAND 4507 to replace the Australian Army’s retired MRH-90 Taipan fleet with a proven, mature utility helicopter. Entering Australian service from 2023, the Black Hawk provides tactical troop transport, special operations and battlefield support, with shipboard certification allowing Army aircraft to operate from the Canberra-class LHDs in support of the ADF’s amphibious force.\n\nA naval 808 Sqn livery is currently being used as a placeholder pending an available UH-60M model. 
Squadron1=UH-60M 808 Squadron,808 Sqn
Callsigns=Squadron1,Siren

[aus_ec_665_had-e]
Type=Attack Helicopter
Default=Tiger ARH,Tiger ARH
DefaultDescription=The Tiger ARH is an armed reconnaissance and attack helicopter operated by the Australian Army as a replacement for the Kiowa and armed Iroquois fleets. Derived from the Franco-German Tiger design, the Australian variant combines the STRIX electro-optical targeting system with a 30 mm turret cannon, 70 mm rockets and AGM-114 Hellfire guided missiles. Twenty-two aircraft entered service from 2004, equipping the 1st Aviation Regiment and providing reconnaissance, precision strike and close-support capability. Although its introduction was affected by significant technical and readiness problems, the Tiger matured into an effective battlefield platform and later gained improved night-vision, electronic-warfare and tactical data-link capabilities. It remained in Australian service until 2026, when it was replaced by the AH-64E Apache Guardian.
Squadron1=Tiger ARH 161st Reconnaissance Squadron,161st Recon Sqn
Squadron2=Tiger ARH 162nd Reconnaissance Squadron,162nd Recon Sqn
Callsigns=Squadron1,Possum|Squadron2,Marlin

[adf_ah-64e]
Type=Attack Helicopter
Default=AH-64E ADF,AH-64E ADF
DefaultDescription=The AH-64E Apache Guardian is the latest major production variant of the Apache attack helicopter and serves as the Australian Army’s replacement for the Tiger ARH under LAND 4503 Phase 1. Equipped with the Modernised Target Acquisition and Designation Sight, advanced defensive aids, digital datalinks and, on selected aircraft, the AN/APG-78 Longbow fire-control radar, the AH-64E provides a substantial increase in reconnaissance, targeting and strike capability. Australian aircraft are armed with the 30 mm M230 chain gun, AGM-114R2 Hellfire missiles and 70 mm rockets, including APKWS precision-guided rounds. Twenty-nine aircraft are being acquired for service with the 1st Aviation Regiment at Townsville, giving Army a highly survivable and networked armed reconnaissance capability for both land and littoral operations.
Squadron1=AH-64E 161st Reconnaissance Squadron,161st Recon Sqn
Squadron2=AH-64E 162nd Reconnaissance Squadron,162nd Recon Sqn
Callsigns=Squadron1,Redback|Squadron2,Huntsman

[raaf_f-111c_aup]
Type=Attack
Default=F-111C AUP,F-111C
DefaultDescription=From 1996, the RAAF’s F-111C fleet underwent a major Avionics Upgrade Program that transformed the ageing strike aircraft with digital mission computers, GPS-assisted navigation, new AN/APQ-169 attack and AN/APQ-171 terrain-following radars, improved cockpit displays and weapons-management systems. Later upgrades added more powerful TF30-P-109 engines, improved electronic warfare equipment and the EL/L-8222 defensive jammer, while new weapons such as Block 1C Harpoon, the GBU-24 and AGM-142E extended its precision and stand-off strike capability. Finished in low-visibility Gunship Grey, the upgraded F-111C remained Australia’s principal long-range strike aircraft until retirement in 2010.

# No. 82 Wing - RAAF Base Amberley, QLD
Squadron1=F-111C 1 Squadron,1 Sqn
Squadron2=F-111C 6 Squadron,6 Sqn
Callsigns=Squadron1,Carbine,Sonic,Pistol|Squadron2,Oggy,Cutlass,Claw

[raaf_fa-18a]
Type=Fighter
Default=F/A-18A RAAF,F/A-18A
DefaultDescription=The F/A-18A/B Hornet formed the backbone of the Royal Australian Air Force’s fighter force through the early 2000s, with the Hornet Upgrade Program transforming the original 1980s aircraft into a far more capable multi-role platform. HUG I and II introduced the AN/APG-73 radar, AIM-120 AMRAAM and AIM-132 ASRAAM, upgraded mission computers and cockpit displays, improved identification and navigation systems, and later Link 16 and the Joint Helmet Mounted Cueing System. These upgrades greatly improved the Hornet’s beyond-visual-range and close-combat capability while retaining its established strike and maritime-attack roles with laser-guided bombs and AGM-84 Harpoon.

#RAAF Base Williamtown, NSW; first operational RAAF Hornet squadron, Aug 1986
Squadron1=F/A-18A 3 Squadron,3 Sqn
#RAAF Base Williamtown, NSW; converted to F/A-18A from Jun 1987
Squadron2=F/A-18A 77 Squadron,77 Sqn
#RAAF Base Darwin/Tindal, NT; converted May 1988, moved to RAAF Base Tindal Oct 1988
Squadron3=F/A-18A 75 Squadron,75 Sqn
Callsigns=Squadron1,Cobra|Squadron2,Despot|Squadron3,Magpie

[raaf_fa-18a_2011]
Type=Fighter
Default=F/A-18A RAAF,F/A-18A
DefaultDescription=During its final decade of RAAF service, the F/A-18A/B Hornet received further upgrades that significantly improved its precision-strike, targeting and self-protection capabilities. The mature HUG III configuration combined the AN/APG-73 radar, Link 16, JHMCS and improved electronic-warfare systems with the AN/AAQ-28 LITENING targeting pod and a greatly expanded weapons inventory. JDAM, AGM-158A JASSM and later Australian-developed JDAM-ER provided accurate and long-range strike options, while AMRAAM, ASRAAM and Harpoon retained the aircraft’s air-defence and maritime-strike capability. These upgrades allowed the ageing Classic Hornet to remain an effective networked multi-role combat aircraft until its retirement in 2021.

#RAAF Base Williamtown, NSW; first operational RAAF Hornet squadron, Aug 1986
Squadron1=F/A-18A 3 Squadron,3 Sqn
#RAAF Base Williamtown, NSW; converted to F/A-18A from Jun 1987
Squadron2=F/A-18A 77 Squadron,77 Sqn
#RAAF Base Darwin/Tindal, NT; converted May 1988, moved to RAAF Base Tindal Oct 1988
Squadron3=F/A-18A 75 Squadron,75 Sqn
Callsigns=Squadron1,Cobra|Squadron2,Despot|Squadron3,Magpie

[raaf_fa-18f]
Type=Fighter
Default=F/A-18F RAAF,F/A-18F
DefaultDescription=The F/A-18F Super Hornet is a two-seat multirole strike fighter operated by No. 1 Squadron of the Royal Australian Air Force. Twenty-four aircraft were acquired from 2007 to replace the retiring F-111C and provide an advanced air-combat capability during the introduction of the F-35A Lightning II, with the fleet entering service in 2010 and reaching final operational capability in 2012. Equipped with the AN/APG-79 AESA radar, modern electronic warfare systems and a wide range of air-to-air and precision-guided weapons, the Super Hornet is capable of air superiority, maritime strike, interdiction and close air support missions. Originally acquired as an interim capability, continuing hardware, software and weapons upgrades have established the Super Hornet as a long-term component of Australia’s air combat force.
Squadron1=F/A-18F 1 Squadron,1 Sqn
Callsigns=Squadron1,Rhino,Buckshot,Cannon,Carbine,Carnage,Colt,Pistol

[raaf_ea-18g]
Type=EW Aircraft
Default=EA-18G RAAF,EA-18G
DefaultDescription=The Boeing EA-18G Growler is a two-seat airborne electronic attack aircraft operated by the Royal Australian Air Force’s No. 6 Squadron. Derived from the F/A-18F Super Hornet, the Growler combines the AN/APG-79 AESA radar with the AN/ALQ-218 electronic surveillance system, AN/ALQ-227 communications countermeasures equipment and podded AN/ALQ-99 tactical jammers. Australia ordered twelve aircraft in 2013, with deliveries beginning in 2015 and Initial Operational Capability declared in 2019. The Growler provides the RAAF with a specialised capability to detect, identify, locate and disrupt hostile radar and communications systems while also conducting suppression of enemy air defences using AGM-88 anti-radiation missiles and retaining a limited air-to-air capability with AIM-120 AMRAAM.
Squadron1=EA-18G 6 Squadron,6 Sqn
Callsigns=Squadron1,Sabre,Savage,Sword,Sonic,Falcon

[raaf_ea-18g_2026]
Type=EW Aircraft
Default=EA-18G RAAF,EA-18G
DefaultDescription=By 2026, the RAAF’s EA-18G Growler fleet was entering a major capability upgrade under the Advanced Growler program. While retaining the AN/APG-79 AESA radar and AN/ALQ-218 electronic surveillance suite, the aircraft were beginning introduction of the AN/ALQ-249(V)1 Next Generation Jammer Mid-Band, providing substantially improved electronic attack performance over the legacy AN/ALQ-99 system. Updated weapons included AIM-120D-3 AMRAAM and AGM-88E AARGM, with the longer-ranged AGM-88G AARGM-ER planned for integration. These upgrades were intended to keep the Growler effective against increasingly sophisticated integrated air-defence networks while maintaining interoperability with the United States Navy.
Squadron1=EA-18G 6 Squadron,6 Sqn
Callsigns=Squadron1,Sabre,Savage,Sword,Sonic,Falcon

[ran_f-35b]
Type=Fighter
Default=F-35B RAN,F-35B RAN
DefaultDescription=The F-35B Lightning II aircraft is the U.S. Marine Corps’ short takeoff and vertical landing (STOVL) variant of the F-35 Joint Strike Fighter. It provides fifth-generation stealth, advanced sensors, and network-enabled capabilities and is designed to operate from expeditionary airfields, amphibious ships, and other environments with limited runway space. When the Canberra-class LHD's were acquired by the RAN they retained the ski-jump from the original Juan Carlos I design. Initially not intended to embark fixed wing aircraft, over subsequent years the concept of F-35B's for the Canberras has been brought up, however ultimately shut down due to both the amount of modification work and that it would detract from the amphibious warfare role of the vessels.\n\nThe F-35B in this mod is included as an interesting 'what-if', had the Canberra-class been intended from the outset to include a fixed-wing aviation component. It is possible that alongside the RAAF F-35A purchase, the F-35B could be included, potentially entering service in the early 2020s, with 805 Squadron reactivated and returning a capability lost to the RAN back in 1982. 
Squadron1=F-35B 805 Squadron,VF-805
Callsigns=Squadron1,Checkmate

[raaf_ap-3c]
Type=Maritime Patrol,MPA
Default=AP-3C,AP-3C
DefaultDescription=The AP-3C Orion was a heavily upgraded Australian variant of the Lockheed P-3C maritime patrol aircraft, developed under Project AIR 5276 and entering RAAF service from 2002. The upgrade introduced a new EL/M-2022 maritime-surveillance radar, modern digital acoustic processing, improved electronic-support measures, satellite communications and an integrated mission-management system, greatly enhancing the Orion’s anti-submarine, anti-surface and intelligence-surveillance capabilities. Later improvements added advanced electro-optical sensors, tactical data links and improved self-protection equipment. Armed primarily with AGM-84 Harpoon missiles and Mk 46 lightweight torpedoes, the AP-3C remained the RAAF’s principal long-range maritime patrol aircraft until replaced by the P-8A Poseidon.
Squadron1=AP-3C 10 Squadron,10 Sqn
Squadron2=AP-3C 11 Squadron,11 Sqn
Callsigns=Squadron31,Striker|Squadron32,Shepherd

