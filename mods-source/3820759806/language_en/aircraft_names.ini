DefaultDescription=The Boeing P-8 Poseidon is an American maritime patrol and reconnaissance aircraft developed and produced by Boeing Defense, Space & Security. It was developed for the United States Navy as a derivative of the civilian Boeing 737 Next Generation airliner.
