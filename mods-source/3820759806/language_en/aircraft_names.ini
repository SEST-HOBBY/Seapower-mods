[raaf_e-7a]
Type=AEW&C
Default=E-7A,E-7A
DefaultDescription=The E-7A Wedgetail is an airborne early warning and control aircraft developed for the Royal Australian Air Force from the Boeing 737-700 airframe. Its distinctive Northrop Grumman MESA active electronically scanned array radar provides continuous 360-degree surveillance of airborne and maritime targets, while advanced electronic support measures, tactical datalinks and mission systems allow the aircraft to coordinate friendly forces and maintain a detailed battlespace picture. Six aircraft entered RAAF service with No. 2 Squadron, achieving full operational capability in 2015 and subsequently supporting Australian and coalition operations in the Middle East and Europe. The success of the Wedgetail design also led to export variants for South Korea and Turkey, while the United Kingdom selected the aircraft to replace its E-3D Sentry fleet.
Squadron1=E-7A Wedgetail 2 Squadron,2 Sqn
Squadron2=Wedgetail AEW Mk1 8 Squadron,8 Sqn
Squadron3=E-737 Peace Eye 271st Airborne Early Warning & Control Squadron,E-737
Squadron4=E-7T Peace Eagle 131st Squadron,E-7T
Callsigns=Squadron1,Dogtail,Highrise,Mitchell,Preacher,Surfer,Wedgetail|Squadron2,Ronin|Squadron3,Overlord|Squadron4,Darkstar