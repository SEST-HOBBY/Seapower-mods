[SystemNames]

#======================================== Australia ========================================
#---------------------------------------- Visual ----------------------------------------
CK043 Search Periscope=CK043 Search Periscope|The CK043 is the Collins class search periscope, combining magnified optical observation with low-light television and remote video display in the submarine's control room. Designed primarily for surveillance and navigation, it provides enhanced target detection and identification in low-light conditions.
CH093 Attack Periscope=CH093 Attack Periscope|The CH093 is the Collins class attack periscope, providing a low-profile optical and low-light television system for target observation, identification and attack. Its imagery can be remotely displayed within the submarine's control room, allowing observations to be shared without relying solely on the periscope eyepiece.
MX-20HD_RAN=MX-20HD|The Poseidon’s MX-20HD digital electro-optical and infrared (EO/IR) multi-spectral sensor turrets come from L3Harris Wescam in Burlington, Ontario. The MX-20HD is gyro-stabilized and can have as many as seven sensors, including infrared, CCDTV, image intensifier, laser rangefinder, and laser illuminator.
AN/AAQ-16=AN/AAQ-16|The AN/AAQ-16 is a second-generation, long-wavelength infrared (LWIR) forward-looking infrared (FLIR) night vision and targeting system developed by Hughes Aircraft (later Raytheon) primarily for military helicopters and special operations aircraft.
EOTSOptics=Series 2500 EOTS|The Ultra Electronics Series 2500 Electro-Optical Gun Control System (EOGCS) is a highly regarded naval electro-optical tracking system (EOTS) and fire control mount. Introduced originally in 1997, it provides 24-hour passive surveillance, target tracking, and high-precision gunfire control for naval vessels.
au_STRIX=STRIX|The STRIX is a gyro-stabilised roof-mounted electro-optical sight fitted to the Tiger ARH. Its thermal imager and daylight television channels provide passive day/night surveillance, target identification, tracking and weapon cueing.
EOST=Series 2500 EOTS|The Ultra Electronics Series 2500 Electro-Optical Tracking System is a stabilized passive electro-optical director fitted to the Hobart-class destroyers. It provides day/night surveillance, target identification and precision tracking for surface and airborne contacts without requiring the ship to radiate.
AN/AAS-36 IRDS=AN/AAS-36 IRDS|The AN/AAS-36 Infrared Detecting Set is a passive forward-looking infrared sensor used for night and low-visibility surveillance and target identification. Fitted to maritime patrol and anti-submarine aircraft including the P-3 Orion, it provides thermal imaging of surface contacts without emitting detectable energy.
AN/ASQ-170_M-TADS/PNVS=AN/ASQ-170 M-TADS/PNVS|The Modernized Target Acquisition and Designation Sight/Pilot Night Vision Sensor is an advanced electro-optical system fitted to the AH-64E Apache. Combining high-resolution forward-looking infrared imaging, daylight television and direct-view optics, it provides long-range target detection, recognition and tracking in day, night and adverse visibility conditions. The associated PNVS provides thermal imaging for low-altitude navigation and terrain avoidance.

#---------------------------------------- Radar ----------------------------------------
#---------- Surface ships ----------
#---Air/Air&Surface---
SPS-49V8=AN/SPS-49(V)8|The AN/SPS-49(V)8 ANZ is an Australian-adapted variant of the long-range two-dimensional SPS-49 air-search radar. It was modified to interface with the Anzac class 9LV combat system and provides long-range air surveillance and early warning.
SPS-49A(V)1=SPS-49A(V)1|An enhanced mid-1990s variant of the long-range 2D air search radar. It introduced Doppler-based target velocity tracking and improved clutter rejection, offering better performance against sea-skimming and low-RCS threats. Commonly fitted during NTU upgrades to legacy ships.
CEAFAR=CEAFAR-1S|CEAFAR-1S is an Australian-developed S-band active electronically scanned array radar fitted to the Anzac class under the Anti-Ship Missile Defence upgrade. Six fixed AESA faces provide continuous 360-degree surveillance, rapid target detection and precision tracking of aircraft and sea-skimming missiles.
CEAFAR2_L=CEAFAR2-L|CEAFAR2-L is an Australian-developed long-range L-band active electronically scanned array radar fitted to upgraded Anzac-class frigates. It provides long-range air surveillance and early warning, replacing the mechanically scanned AN/SPS-49(V)8 while integrating with the ship's CEAFAR-based combat system.
Sea_Giraffe_AMB=Sea Giraffe AMB|The Saab Sea Giraffe AMB is a C-band, three-dimensional multi-role surveillance radar providing simultaneous air and surface search, automatic tracking and target indication. Fitted to the Canberra class and integrated with the Saab 9LV combat management system, it combines a high update rate with strong littoral clutter rejection and an instrumented range of approximately 180 km.

#---Surface only---
SharpEye_S-Band=SharpEye S-Band|Kelvin Hughes SharpEye is a solid-state pulse-Doppler navigation and surface-surveillance radar. The S-band version provides reliable long-range surface detection and navigation performance in poor weather and heavy sea clutter.
SharpEye_X-Band=SharpEye X-Band|Kelvin Hughes SharpEye is a solid-state pulse-Doppler navigation and surface-search radar. The X-band version provides high-resolution detection of small surface contacts and improved discrimination in littoral and congested environments.
SharpEye_SRHCR=SharpEye SRHCR|The Kelvin Hughes SharpEye Short Range Helicopter Control Radar is a dedicated S-band solid-state pulse-Doppler radar developed for the Canberra-class LHDs. Using a 3.9-metre low-profile antenna, it automatically tracks helicopters and other nearby air and surface contacts and supplies those tracks to the ship's command system for aviation control.
SCANTER_RAN=SCANTER|Terma SCANTER is a modern navigation and surface-surveillance radar used for detection and tracking of ships, small craft and other low-altitude contacts. Its solid-state processing provides high-resolution performance in dense littoral environments and heavy sea clutter.
L3_SAM_XBand=Navigation Radar|The L-3 Communications SAM Electronics X-band navigation radar is one of two navigation and short-range surface-surveillance radars fitted to the Hobart-class destroyers. Integrated with the ship's navigation system, it provides high-resolution detection and tracking of surface contacts for navigation, collision avoidance and general maritime situational awareness.
MSSR_2000_I=MSSR 2000 I|The MSSR 2000 I is a monopulse secondary-surveillance and Identification Friend or Foe interrogator used aboard the Canberra class. Operating with civil Mode S and secure military IFF modes, it identifies cooperating aircraft and contributes identification and air-traffic information to the ship's combat and aviation-control systems.
VisionMaster_FT_X=VisionMaster FT X-Band|A Sperry Marine X-band navigation and surface-surveillance radar forming part of the Canberra class integrated navigation suite. The high-resolution X-band set provides precise short-range navigation, collision avoidance and detection of small surface contacts.
VisionMaster_FT_S=VisionMaster FT S-Band|A Sperry Marine S-band navigation and surface-surveillance radar forming part of the Canberra class integrated navigation suite. Its longer wavelength provides reliable navigation and surface tracking in rain and poor weather, complementing the higher-resolution X-band radar.

#---Fire Control---
#SAM
CEAMOUNT=CEAMOUNT|CEAMOUNT is an Australian-developed fixed-face active electronically scanned array missile-illumination system fitted to the Anzac class. Operating with CEAFAR and the 9LV combat system, it provides multiple simultaneous illumination channels for semi-active radar-homing surface-to-air missiles.
MK92_Mod12_FCS=Mk 92 Mod 12 FCS|The Mk 92 Mod 12 Fire Control System is the upgraded fire-control system fitted to the Adelaide class under the FFG Upgrade Program. It provides tracking and weapon-control functions for the ship's surface-to-air missiles and gun systems, with improved processing and integration compared with the original Mk 92 fit.
Mk92_Mod12_MCG=Mk 92 Mod 12 MCG|Mk 92 Mod 12 SM-2 mid-course guidance system providing RF command uplink to Standard Missile 2 during the missile's mid-course phase. Integrated with the upgraded Mk 92 fire-control system, it allows SM-2 engagements beyond continuous illumination range before terminal homing under CAS or STIR illumination.
#Guns
Ceros 200=CEROS 200|Saab CEROS 200 is a radar and electro-optical fire-control director used aboard the Anzac class. It provides precision tracking and fire-control data for the ship's Mk 45 naval gun and can support engagement of surface, shore and airborne targets.

#---------- Submarines ----------
#---Surface only---
Type 1007=Type 1007|The Type 1007 is a high-definition I-band surface-search and navigation radar fitted to the Collins class. Operated from a retractable mast while surfaced or at periscope depth, it provides short-range detection and tracking of surface contacts and supports safe navigation.

#---------------------------------------- Aircraft radar ----------------------------------------
AN/APY-10_RAN=AN/APY-10|The AN/APY-10 is an American multifunction radar developed for the U.S. Navy's Boeing P-8 Poseidon maritime patrol and surveillance aircraft. AN/APY-10 is the latest descendant of a radar family originally developed by Texas Instruments, and now Raytheon after it acquired the radar business of TI, for Lockheed P-3 Orion, the predecessor of P-8.
MEL Super Searcher=MEL Super Searcher|Surface-search radar developed by MEL (UK) and fitted to RAN S-70B-2 Seahawks from 1988. Optimized for detecting and tracking small surface targets, especially submarine snorkels and the like, in littoral and open-ocean environments. Features X-band operation, moderate power output, and basic maritime situational awareness capabilities.
AN/APQ-169=AN/APQ-169|The AN/APQ-169 is the upgraded attack radar fitted to RAAF F-111C aircraft under the Avionics Upgrade Program. Derived from the AN/APQ-165 and retaining the existing antenna installation, it introduced improved signal processing, pulse compression, electronic counter-countermeasures and reliability.
EL/M-2022A(V)3=EL/M-2022A(V)3|The ELTA EL/M-2022A(V)3 is a multimode X-band maritime surveillance radar used by the RAAF AP-3C Orion. It provides long-range surface surveillance, track-while-scan, moving-target indication, synthetic-aperture and inverse synthetic-aperture radar imaging, and specialised detection of small maritime targets including submarine periscopes.
MESA=MESA|The Northrop Grumman Multi-Role Electronically Scanned Array is the principal surveillance sensor of the E-7A Wedgetail. The fixed L-band active electronically scanned array provides continuous 360-degree coverage and can simultaneously detect and track airborne and maritime targets, with rapid electronic beam steering, sector emphasis, long-range identification friend-or-foe support and advanced electronic-protection features.
Sea_Spray_3000=Sea Spray 3000|The Sea Spray 3000 is a 1990s digital maritime surveillance radar developed for anti-surface and anti-submarine warfare, offering improved detection range, tracking accuracy, and sea-clutter rejection for shipborne helicopters.
ARI_5955_2=ARI 5955/2|The Thorn EMI ARI 5955/2 is an upgraded X-band maritime surface-search radar fitted to Royal Australian Navy Sea King Mk 50A/B helicopters under the Life of Type Extension programme of the mid-1990s. Developed from the original ARI 5955, the upgrade introduced improved signal processing, a colour display and track-while-scan capability, enhancing the detection and tracking of surface vessels in maritime environments. The radar supported the Sea King's transition from anti-submarine warfare to maritime surveillance, transport and fleet-support operations until retirement in 2011.
AN/APG-78=AN/APG-78 Longbow|The AN/APG-78 Longbow is a mast-mounted millimetre-wave fire-control radar fitted to the AH-64D/E Apache. Operating in the Ka-band, it provides rapid detection, classification, tracking and prioritisation of stationary and moving ground targets, helicopters and aircraft, including through battlefield obscurants and adverse weather. The radar can detect and track up to 256 targets and prioritise 16 for immediate evaluation and engagement, supporting radar-guided AGM-114L Longbow Hellfire missiles.

#---------------------------------------- Sonar ----------------------------------------
Thomson Sintra Spherion B=Spherion B|The Thomson Sintra Spherion B is the original medium-frequency active/passive hull-mounted sonar fitted to the Anzac class. It provides submarine search, detection, classification and attack functions in both littoral and open-ocean environments.
Spherion_B_BSAPS=Spherion B (BSAPS)|The Spherion B fitted with the Broadband Sonar Advanced Processing System retains the original hull-mounted sonar array while introducing modern digital broadband processing. The upgrade improves detection, classification and tracking of quiet submarines and difficult acoustic contacts.
TMS4131=Spherion TMS4131|The Thales Spherion TMS4131 is a medium-frequency hull-mounted sonar providing improved active and passive detection for modern surface combatants. Features digital beamforming and advanced signal processing for enhanced target classification and tracking in littoral and open-water environments. Replaced older Mulloka and SQS-56 systems during the Adelaide-class FFG upgrades.
Type_7150=Type 7150|The Ultra Electronics Type 7150 is a modern dual-frequency active/passive hull-mounted sonar fitted to the Hobart-class destroyers. Integrated into the ship's sonar processing system, it provides medium-frequency submarine detection, tracking and classification in both open-ocean and littoral environments.

#Towed
UE-ISS_800_VDS=UE-ISS 800 VDS|The Ultra Electronics UE-ISS 800 is an active/passive variable-depth sonar fitted to the Hobart-class destroyers. Its single-tow system combines a dual-frequency active source with a directional passive receive array, allowing the sonar to be deployed beneath thermal layers for improved submarine detection while also contributing to torpedo warning.

#Dipping
AQS-18V=AN/AQS-18(V)|The AN/AQS-18(V) (manufactured by L3Harris) is a long-range, active, helicopter-borne dipping sonar system designed for anti-submarine warfare (ASW). It is an export version based on the U.S. Navy's AN/AQS-13F system.

#Sonobuoys
SSQ-801_Sonar=Sonobuoy SSQ-801 Barra|The SSQ-801 Barra is an Australian-developed passive directional sonobuoy using a large deployable horizontal planar array of 25 hydrophones. Developed by Australian defence science organisations and industry, Barra provided greatly improved sensitivity and bearing accuracy compared with conventional directional sonobuoys and entered operational service with Australian maritime patrol forces in the early 1980s.
SSQ-801B_Sonar=Sonobuoy SSQ-801B Barra|The SSQ-801B is an improved late-service version of the Australian Barra passive directional sonobuoy. It retains the 25-hydrophone horizontal planar array while incorporating improved electronics, increased sensitivity, expanded radio-channel options and enhanced compatibility with multistatic airborne ASW operations.
SSQ-62D_Sonar=DICASS Sonobouy|The AN/SSQ-62D/B DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys.
#---------- Submarines ----------
Collins Passive Ranging Array=Scylla Passive Ranging Array|The passive ranging array forms part of the Collins class Scylla sonar suite and provides additional bearing and ranging information without transmitting active sonar. Data from the distributed passive sensors assists the combat system in refining target tracks and developing passive firing solutions.
Collins Flank Array=Scylla Flank Array|The Scylla flank array is a hull-mounted passive sonar system distributed along the sides of the Collins class. Its large acoustic aperture supplements the bow sonar with long-range passive detection, bearing measurement and narrowband analysis of surface ships and submarines.
Collins Flank Array TI=Scylla Flank Array (Upgraded)|An upgraded configuration of the Collins class passive flank-array system incorporating improved electronics and acoustic signal processing. The improvements enhance detection, narrowband analysis and track development while retaining the submarine's original flank-array architecture.
Collins Phase 6 Flank Array=Phase 6 Flank Array|The Phase 6 flank array is a latest-generation Thales passive array developed to replace the original Collins class flank sonar. Its large distributed aperture and modern signal processing improve long-range passive detection, classification and tracking of quiet surface and submerged contacts.
Collins SATEPS Intercept=SATEPS Acoustic Intercept System|The Submarine Acoustic Transitory Event Processing System (SATEPS) is an Australian-developed acoustic intercept and passive-ranging system fitted to the Collins class. It detects and processes active sonar transmissions and other transient acoustic events, providing warning and bearing information without requiring the submarine to transmit.
Collins HFIA=High Frequency Intercept Array (HFIA)|The High Frequency Intercept Array is a modern Collins class acoustic-warning sensor designed to detect high-frequency underwater emissions, including active sonar transmissions. It provides rapid warning and bearing information against hostile sonars and other emerging high-frequency acoustic threats.
Thomson Sintra Scylla=Scylla Bow Sonar|The Scylla is the original Collins class cylindrical bow sonar, providing both active and passive search, detection and tracking of surface and submerged contacts. It forms the primary sonar of the original Collins acoustic suite and operates alongside the submarine's passive ranging, flank and acoustic-intercept systems.
Thomson Sintra Scylla TI=Scylla Bow Sonar (Upgraded)|An upgraded configuration of the Collins class Scylla bow sonar incorporating later sonar hardware, electronics and digital signal-processing improvements. The original cylindrical array is retained while improved processing increases the submarine's ability to detect, classify and track difficult acoustic contacts.
Collins MCA=Modular Cylindrical Array (MCA)|The Modular Cylindrical Array is the Collins class Phase 6 replacement for the original Scylla cylindrical bow array. Derived from technology developed for the Sonar 2076 family, the MCA provides a modern active and passive bow-sonar capability with substantially improved acoustic processing, detection and localisation performance.
Kariwara_TA=Kariwara|Australian designed passive thin-line towed array designed to provide long-range submarine detection from submarines and relatively small vessels. Its lightweight, flexible array can be streamed well clear of the submarine or ship, substantially reducing self-noise and improving sensitivity to low-frequency submarine signatures. Its low drag and compact handling equipment permit installation aboard vessels that could not accommodate conventional heavy towed arrays.
Collins SHORTAS=SHORTAS|SHORTAS is a retractable passive towed array fitted to the Collins class, replacing the earlier Kariwara and Namara arrays. Streamed well astern of the submarine to reduce interference from own-ship noise, it provides sensitive long-range passive detection and classification of surface ships and submarines.
Collins SHORTAS CTAP=SHORTAS (CTAP)|SHORTAS fitted with the Collins Towed Array Processor (CTAP) combines the submarine's retractable passive towed array with improved digital acoustic processing. CTAP enhances beamforming, contact detection, classification and tracking, particularly against weak low-frequency targets at long range.

#---------------------------------------- ESM ----------------------------------------
#---------- RWR ----------

#---------- Targeting ----------

#---------- ELINT ----------
Rascal Thorn Sceptre-A=Sceptre-A ESM|The Rascal Thorn modified Sceptre-A ESM is an Anzac Class fitted ESM suite used to detect L,S,C,X and Ku-Band Frequencies in order to identify contacts.
Condor CS-5600 ESM=Condor CS-5600 ESM|The Condor CS-5600 is the original Collins class Electronic Support Measures system, providing passive interception and warning of radar emissions. It allows the submarine to detect, classify and obtain bearing information on nearby radar emitters without revealing its own position by transmitting.
ES-3701U=ES-3701U ESM|The ES-3701U is a high-performance submarine radar Electronic Support Measures system providing rapid passive detection, classification and precision direction finding of radar emissions. Advanced digital processing and high sensitivity improve emitter identification and situational awareness in dense littoral electromagnetic environments.
AN/ALQ-240_RAN=AN/ALQ-240|The AN/ALQ-240(V)1 is a sophisticated Electronic Support Measures (ESM) system by Northrop Grumman for the U.S. Navy's P-8A Poseidon aircraft, providing advanced early warning and situational awareness by detecting, classifying, and geolocating enemy radar and electronic threats, enhancing defense for both the aircraft and nearby ships.
C-Pearl_ESM=C-Pearl-DV|The Rafael C-Pearl-DV is a modern digital electronic support measures (ESM) suite providing wideband detection, accurate emitter classification, and high-precision bearing data. Fully integrated into the ship’s combat system and data links, replacing legacy SLQ-32(V) systems during the Adelaide-class FFG upgrades.
Centaur_ESM=Centaur ESM|Thales Centaur is a modern radar Electronic Support Measures system fitted to the Anzac class as an improvement over the earlier Sceptre-A suite. It provides passive detection, identification and direction finding of radar emitters without revealing the ship's position.
JEDS_3701=JEDS 3701|JEDS 3701 is the Royal Australian Navy configuration of the ES-3701 radar Electronic Support Measures system. It provides high-sensitivity passive surveillance, rapid emitter identification and precision direction finding for radar signals across a broad frequency range.
ES-3701-02S=ES-3701-02S ESM|The ITT/EDO ES-3701-02S is the principal radar Electronic Support Measures system fitted to the Hobart-class destroyers. Integrated with additional Australian low-band direction-finding and digital receiver equipment, it provides long-range passive detection, rapid emitter identification and high-precision bearing measurement of hostile radar emissions.
AN/ALR-2001_Odyssey=AN/ALR-2001 Odyssey ESM|The RAAF E-7A carries an upgraded Australian-developed ALR-2001 family Electronic Support Measures suite supplied and supported by BAE Systems Australia. The passive system detects, locates and classifies radio-frequency emitters without transmitting, allowing radar and communications emissions to contribute to the Wedgetail's fused tactical picture and electronic-order-of-battle awareness.

#---------------------------------------- ECM ----------------------------------------
EA-2118_ECM=EA‑2118|The Elbit EA‑2118 ECM suite was adopted by the RAN during the Adelaide-class FFG upgrade program as an alternative to the U.S. SLQ‑32(V)5 sidekick jammer. It provided a credible modern naval electronic attack capability, with a broad RF band footprint, adaptive jamming, and better power amplification than earlier SLQ‑32(EA) sidekick configurations. Fully integrated into the ship’s combat system, EA‑2118 enhanced self‑defense against multi‑band radar threats and complemented the primary C‑Pearl‑DV ESM sensors.
EL_L-8222=EL/L-8222 DECM|The ELTA EL/L-8222 is a digital radio-frequency memory defensive electronic-countermeasures pod used by RAAF F-111C and RF-111C aircraft. Introduced during the early 2000s, it provides programmable deceptive and noise jamming against radar-guided threats and is managed through the aircraft's AN/ALQ-213 electronic-warfare system.
Hobart_DCE_ECM=DCE Electronic Attack Suite|A modern shipboard electronic-attack capability associated with the Hobart-class capability enhancement program. Intended to supplement passive electronic support and offboard decoys with active radar countermeasures, its exact equipment and performance remain publicly undisclosed.
Canberra_LHD_ECM=LHD ECM|A defensive electronic countermeasures suite fitted to the Royal Australian Navy's Canberra-class amphibious assault ships. Operating alongside the ES-3701 electronic support measures system and Saab 9LV combat management system, it provides radar-guided missile self-protection through electronic countermeasures. The suite complements the ships' Nulka active missile decoys, although the precise equipment designation and capabilities remain undisclosed.

#---------------------------------------- MAD ----------------------------------------
AN/AQS-504=AN/AQS-504 MAD|Tail boom-mounted magnetic anomaly detector designed to locate submerged submarines by sensing disturbances in the Earth's magnetic field. Used by RAN S-70B-2 Seahawks for close-range submarine detection, particularly effective in shallow water or as a final localization tool in conjunction with sonobuoys.

#---------------------------------------- Laser Designator ---------------------------
au_STRIX_Laser=STRIX Laser Designator|The laser rangefinder and designator component of the STRIX targeting sight. It provides precise target ranging and laser designation for compatible guided weapons such as the AGM-114 Hellfire II.
AN/ASQ-170_Laser=AN/ASQ-170 Laser Designator|The AN/ASQ-170 incorporates a laser rangefinder and designator within the Apache's Modernized Target Acquisition and Designation Sight (M-TADS). It provides precision ranging and continuous laser designation of ground and surface targets, supporting the employment of semi-active laser-guided weapons including AGM-114 Hellfire missiles and laser-guided rockets.