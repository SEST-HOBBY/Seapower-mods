[ran_ddg_hobart]
Type=DDG,Destroyer
Default=Hobart-class,Hobart
DefaultDescription=The Hobart class is a class of three guided-missile destroyers built for the Royal Australian Navy under Project SEA 4000 to restore the fleet-area air warfare capability previously provided by the Perth-class destroyers. Based on Navantia’s Spanish Álvaro de Bazán-class design, the ships combine the Aegis combat system and AN/SPY-1D(V) phased-array radar with a 48-cell Mk 41 vertical launch system, providing the RAN with a powerful long-range air-defence capability. Although designed primarily for air warfare and task-group protection, the Hobart class is also capable of anti-surface warfare, anti-submarine warfare, naval gunfire support and, following later upgrades, long-range land attack. The three ships—HMAS Hobart, HMAS Brisbane and HMAS Sydney—entered service between 2017 and 2020 and form the principal air-warfare element of the modern RAN surface fleet.
Variant1=Hobart DDG-39,Hobart
Variant2=Brisbane DDG-41,Brisbane
Variant3=Sydney DDG-42,Sydney

[ran_ddl_quickmatch_late]
Type=DDL,Destroyer
Default=Quickmatch-class,Quickmatch
DefaultDescription=The Quickmatch class represented the Royal Australian Navy’s first purpose-designed light destroyer, with three ships entering service between 1980 and 1984. Originally conceived during the early 1970s as replacements for the ageing Daring and River-class escorts, after preparing its initial sketch design, the Navy contracted Yarrow Admiralty Research Division (Y-ARD) in July 1970 to complete preliminary designs for the DDLs. Finalised in 1972 after a protracted design evolution, the class embodied a compromise between cost, capability, and domestic industrial capacity, resulting in a compact but capable multi-role surface combatant. Although originally conceived as a low-cost patrol and escort vessel, the final design emerged as a 4,200-ton destroyer with balanced surface, air, and subsurface warfare capabilities. During the 1990s their original close-in armament was replaced by Phalanx CIWS and the electronic-warfare suite was modernised around the AN/SLQ-32 system, increasingly aligning the class with contemporary United States Navy equipment and standards. A comprehensive DDL Upgrade programme undertaken during the 2000s extended the class well beyond its original Cold War role. The ships received an upgraded SPS-49A(V)1 air-search radar and Mk 92 Mod 12 fire-control system, together with an eight-cell Mk 41 vertical launcher for quad-packed ESSM and modifications to the existing Mk 13 launcher for SM-2MR Block IIIA. Harpoon Block II, enhanced lightweight torpedoes, improved datalinks, modernised AN/SLQ-32 electronic-warfare equipment, upgraded defensive systems and renewed anti-submarine sensors further enhanced their combat capability. Aviation facilities initially continued to support the upgraded Sea Lynx Mk.20A, before the MH-60R Seahawk was introduced from 2017 to standardise the RAN’s embarked helicopter force. Although increasingly constrained by their 1970s hull design and limited growth margins, the upgraded Quickmatch class remained capable multi-role escorts and effective contributors to coalition task groups into their final years of service.\n\nThe DDL Project was ultimately cancelled historically in favour of acquiring the Oliver Hazard Perry-class frigate, it is included in a modernized guise as an interesting 'what-if'. 
Variant1=Quickmatch (Lynx) D-45,Quickmatch
Variant2=Voyager (Lynx) D-46,Voyager
Variant3=Napier (Lynx) D-47,Napier
Variant4=Quickmatch (MH-60R) D-45,Quickmatch
Variant5=Voyager (MH-60R) D-46,Voyager
Variant6=Napier (MH-60R) D-47,Napier

