[ran_ffg_adelaide_upgrade]
Type=FFG,Frigate
Default=Adelaide-class (FFG Upgrade),Adelaide
DefaultDescription=By the early 2000s, instead of acquiring the expensive, manpower intensive Kidd-class destroyers, the Adelaide class underwent a comprehensive mid-life upgrade program to extend their service life and restore their relevance in a modern, network-centric naval environment. To offset costs the two oldest vessels were decommissioned leaving four in service. Completed by 2009, the FFG Upgrade significantly enhanced the ships’ combat systems, sensors, and survivability. The original SM-1 missile system was phased out and replaced with the SM-2 Block IIIA capability, supported by a new combat management system and upgraded fire control radars, significantly enhancing the class’s area air defence role. Most notably, an 8-cell Mk 41 VLS system was installed forward of the Mk 13 launcher, allowing the integration of the Evolved Sea Sparrow Missile to better handle sea-skimming anti-ship missiles. The Harpoon Block II anti-ship missile was integrated and the Phalanx CIWS was updated to Block 1B. Hull-mounted sonar systems were modernised with the installation of the Thales Spherion sonar, replacing the earlier SQS-56 and Mulloka systems, while electronic warfare capabilities were upgraded with the introduction of the Rafael C-PEARL-DV ESM and the Elbit EA-2118 electronic countermeasures suite. These improvements transformed the Adelaide class into capable multi-mission escorts suited for high-threat coalition operations, allowing them to remain effective frontline combatants well up until 2019 when replaced by the Hobart-class destroyers.\n\nAs the S-70B-2 was retired in 2017, the MH-60R was briefly embarked on Melbourne and Newcastle until 2019.
Variant1=Sydney FFG-3,Sydney
Variant2=Darwin FFG-4, Darwin
Variant3=Melbourne FFG-5,Melbourne
Variant4=Newcastle FFG-6,Newcastle
Variant5=Melbourne (MH-60R) FFG-5,Melbourne
Variant6=Newcastle (MH-60R) FFG-6,Newcastle

[ran_ssg_collins]
Type=SSG,Attack Submarine
Default=Collins-class,Collins
DefaultDescription=The Collins class is a class of six conventionally powered guided-missile submarines built for the Royal Australian Navy to replace the Oberon class. Developed from the Swedish Kockums Type 471 design but extensively enlarged for long-range operations in the Indo-Pacific, the class combines diesel-electric propulsion with six 533 mm torpedo tubes, Mk 48 heavyweight torpedoes and UGM-84C Sub-Harpoon missiles. Early boats suffered significant combat-system, machinery-noise and propeller-cavitation problems, but extensive remediation during the late 1990s and early 2000s greatly improved reliability and acoustic performance. Subsequent upgrades introduced the AN/BYG-1 combat system, Mk 48 Mod 7 CBASS torpedo, improved towed-array processing, modern electronic-support measures and, under SEA 1439 Phase 6, new bow and flank sonar arrays. The six boats entered service between 1996 and 2003 and remain the RAN’s principal conventional submarine force pending their eventual replacement by nuclear submarines.
Variant1=Collins S73,Collins
Variant2=Farncomb S74,Farncomb
Variant3=Waller S75,Waller
Variant4=Dechaineux S76,Dechaineux
Variant5=Sheean S77,Sheean
