[ran_lhd_canberra]
Type=LHD,Landing Ship
Default=Canberra-class,Canberra
DefaultDescription=The Canberra class is a class of two landing helicopter dock (LHD) amphibious assault ships built for the Royal Australian Navy under Project JP 2048. Based on the Spanish Juan Carlos I design, the ships combine extensive aviation facilities, a floodable well dock, vehicle decks and command facilities to support amphibious operations, humanitarian assistance and joint-force deployments. Equipped with the Saab 9LV combat management system, Sea Giraffe AMB radar, Nulka decoys and Typhoon 25 mm guns, the class relies primarily on escorts for fleet air defence and anti-submarine protection. Capable of embarking a range of Army and Navy helicopters, including the MRH-90, CH-47F, Tiger ARH and MH-60R, the ships form the centrepiece of Australia's amphibious capability. Although retaining the ski jump of the parent design as it would have been more costly to omit it, the Canberra-class has always been intended for its original amphibious warfare role. F-35B capability has been explored, however ruled out due to cost, required structural modification and detraction from its role. HMAS Canberra and HMAS Adelaide entered service in 2014 and 2015 respectively.
Variant1=Canberra (Amphibious) L02,Canberra
Variant2=Adelaide (Amphibious) L01,Adelaide
Variant3=Canberra (Air Assault) L02,Canberra
Variant4=Adelaide (Air Assault) L01,Adelaide

[ran_lhd-cv_canberra]
Type=LHD,Landing Ship
Default=Canberra-class (Light Carrier),Canberra
DefaultDescription=The Canberra class is a class of two landing helicopter dock (LHD) amphibious assault ships built for the Royal Australian Navy under Project JP 2048. Based on the Spanish Juan Carlos I design, the ships retain the parent design's fixed-wing aviation capability, incorporating strengthened flight decks, expanded aviation facilities and specialised equipment to support short take-off and vertical landing (STOVL) aircraft using the built-in ski jump once the F-35B became available. Commissioned in 2014 and 2015, HMAS Canberra and HMAS Adelaide provide the RAN with a combined amphibious assault and light aircraft carrier capability. The subsequent acquisition of the F-35B Lightning II in 2020-2023 sees the recommissioning of 805 Squadron, restoring fixed-wing combat aviation to the Fleet Air Arm previously lost in 1982 after the carrier HMAS Melbourne was decommissioned without replacement. Operating alongside embarked Army and Navy helicopters, the F-35Bs provide fleet air defence, maritime strike and close air support, allowing the ships to undertake both amphibious warfare and limited sea-control operations.\n\nThis configuration of the Canberra-class LHD's with embarked F-35B is included as an interesting 'what-if'.
Variant1=Canberra (Amphibious) L02,Canberra
Variant2=Adelaide (Amphibious) L01,Adelaide
Variant3=Canberra (Sea Control) L02,Canberra
Variant4=Adelaide (Sea Control) L01,Adelaide

[ran_lhd_canberra_late]
Type=LHD,Landing Ship
Default=Canberra-class (Late),Canberra
DefaultDescription=The Canberra class is a class of two landing helicopter dock (LHD) amphibious assault ships built for the Royal Australian Navy under Project JP 2048. Based on the Spanish Juan Carlos I design, the ships combine extensive aviation facilities, a floodable well dock, vehicle decks and command facilities to support amphibious operations, humanitarian assistance and joint-force deployments. Equipped with the Saab 9LV combat management system, Sea Giraffe AMB radar, Nulka decoys and Typhoon 25 mm guns, the class relies primarily on escorts for fleet air defence and anti-submarine protection. Later service improvements include upgraded propulsion systems, communications and aviation support facilities. By 2028, the projected embarked aviation component incorporates the UH-60M Black Hawk and AH-64E Apache, replacing the earlier MRH-90 Taipan and Tiger ARH, alongside the MH-60R Seahawk and other Army aviation assets. These aircraft provide enhanced troop transport, air assault, armed reconnaissance, escort and close air support capabilities, further strengthening the class's amphibious warfare role. Although retaining the ski jump of the parent design, the Canberra class remains dedicated to amphibious operations, with proposals for F-35B operations having been ruled out due to cost, required modifications and their impact on the ships' primary mission. HMAS Canberra and HMAS Adelaide entered service in 2014 and 2015 respectively.
Variant1=Canberra (Amphibious) L02,Canberra
Variant2=Adelaide (Amphibious) L01,Adelaide
Variant3=Canberra (Air Assault) L02,Canberra
Variant4=Adelaide (Air Assault) L01,Adelaide

