DefaultDescription=The Anzac-class frigates are Australian derivatives of the German MEKO 200 design, built as versatile general-purpose surface combatants for the Royal Australian Navy. Entering service from the mid-1990s, the class combines a 5-inch gun, Mk 41 vertical launch system, anti-ship missiles, lightweight torpedoes and an embarked helicopter with a comprehensive suite of radar, sonar and electronic warfare systems. Originally conceived as relatively austere patrol frigates, the ships have undergone extensive modernisation throughout their careers, gaining improved missiles, phased-array radars, electronic support measures and advanced defensive systems. Their modular design and repeated upgrades have allowed the class to remain a capable component of the RAN surface fleet well into the twenty-first century.\n\nCurrently the ASMD (Anti-Ship Missile Defence upgrade, first ship reentering service 2011) and AMCAP (Anzac Midlife Capability Assurance Program) configurations are represented. Please note S-70B-2 in use until 2017 and MH-60R post 2017, vessels arranged accordingly.
