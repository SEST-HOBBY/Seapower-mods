# ---------------- Sonobuoys ---------------
ran_ssq-801=SSQ-801 Barra,DIFAR,Sonobuoy,The SSQ-801 Barra is an Australian-developed passive directional sonobuoy using a large deployable horizontal planar array of 25 hydrophones. Developed by Australian defence science organisations and industry, Barra provided greatly improved sensitivity and bearing accuracy compared with conventional directional sonobuoys and entered operational service with Australian maritime patrol forces in the early 1980s.
ran_ssq-801b=SSQ-801B Barra,DIFAR,Sonobuoy,The SSQ-801B is an improved late-service version of the Australian Barra passive directional sonobuoy. It retains the 25-hydrophone horizontal planar array while incorporating improved electronics, increased sensitivity, expanded radio-channel options and enhanced compatibility with multistatic airborne ASW operations. 
usn_ssq-62d=AN/SSQ-62D/B,DICASS,Active Sonobuoy,The AN/SSQ-62D/B DICASS is an active sonobouy manufactured in Australia by ADI/Thomson Marconi Sonar in 1997 used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys. This model has a significantly improved sonar system for greatly increased accuracy and range, alongside increasing the available frequencies the sonobuoy can detect, allowing for greater performance in littoral waters.
# ------------------ FFAR -----------------
adf_fz90=FZ90 70 mm,,FFAR,The FZ90 is a 70 mm folding-fin aircraft rocket used by the Australian Army Tiger ARH. Fired from FZ rocket launchers, it can be fitted with a variety of warheads and is typically carried in 7- or 19-round pods for use against light vehicles, troop concentrations and field positions.
usa_apkws_2_m282=M282,APKWS Ⅱ,GFFAR,The AGR-20 Advanced Precision Kill Weapon System (APKWS) is a design conversion of Hydra 70 unguided rockets with a laser guidance kit to turn them into precision-guided munitions (PGMs).[7] APKWS is approximately one-third the cost and one-third the weight of the current inventory of laser-guided weapons, has a lower yield more suitable for avoiding collateral damage, and takes one quarter of the time for ordnance personnel to load and unload.
