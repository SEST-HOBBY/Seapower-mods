[AmmunitionNames]
# ------------------ AAM ------------------
raf_aim-132=AIM-132,ASRAAM,AAM,A modern short-range infrared-guided air-to-air missile designed for rapid reaction and high-speed interception. Its imaging infrared seeker, high off-boresight capability and powerful rocket motor provide strong resistance to countermeasures and an unusually long engagement envelope for a within-visual-range missile.
usn_aim-120b=AIM-120B,AMRAAM,AAM,The AIM-120B AMRAAM is an American active radar-homing air-to-air missile. This is the most advanced air to air missile in the US arsenal so far, and is a lighter and much more capable successor to the semi-active Sparrow missile. The AMRAAM achieves its high performance in all remarks via a datalink and active radar seeker, high performance rocket motor for very high flight speed, and a lofting trajectory for maximum kinematic performance to engage both maneuvering and fast flying air targets. The 'B' variant has a more modern software interface allowing for updating the logic of the missile without replacing any hardware, allowing the missile to be reprogrammed for evolving threats despite still having older hardware.
usn_aim-120c5=AIM-120C-5,AMRAAM,AAM,The AIM-120C-5 AMRAAM is an American active radar-homing air-to-air missile. This is the most advanced air to air missile in the US arsenal so far, and is a lighter and much more capable successor to the semi-active Sparrow missile. The AMRAAM achieves its high performance in all remarks via a datalink and active radar seeker, high performance rocket motor for very high flight speed, and a lofting trajectory for maximum kinematic performance to engage both maneuvering and fast flying air targets. The 'C-5' variant has a boost-glide motor profile for much higher speed at the cost of sustained speed, but otherwise improves range and agility further.
# ------------------ SAM ------------------
# ---------- Anti-radar Missiles ---------
# ---------- Anti-ship Missiles ----------
rn_sea_skua=Sea Skua,,ASM,The Sea Skua is a British lightweight short range air to surface missile, guided by semi-active homing radar.
#-----------Land Strike only missiles---------
raaf_agm-142e=AGM-142E,Raptor,Land Strike,Long-range precision stand-off missile used by the RAAF F-111C. It combines inertial mid-course guidance with an imaging-infrared seeker and man-in-the-loop control via an AN/ASW-55 datalink pod, allowing the operator to refine the aimpoint during the terminal attack. Capable of striking fixed and hardened targets from beyond 50 nautical miles, it could carry either a blast-fragmentation or penetrating warhead.
raaf_agm-158a=AGM-158A,JASSM,Land Attack,A low-observable, air-launched cruise missile designed for long-range precision strikes against high-value fixed targets. Using INS/GPS navigation and a terminal imaging infrared seeker, JASSM can attack heavily defended targets from well outside the range of most short and medium-range air defences.
raaf_agm-154c=AGM-154C,JSOW Block II,Land Attack,A long-range, unpowered precision glide weapon using GPS/INS navigation and terminal imaging-infrared guidance. The AGM-154C carries a BROACH multi-stage penetrator warhead designed for hardened and high-value fixed targets, providing stand-off attack capability from outside many short-range air-defence envelopes.
raaf_agm-154c-1=AGM-154C-1,JSOW Block III,Land Attack,An upgraded AGM-154C equipped with a network-enabled weapon datalink and enhanced terminal guidance, allowing targeting updates in flight and engagement of moving maritime targets. It retains the C variant’s BROACH penetrator warhead and long-range precision land-attack capability while adding a significant anti-ship role.
usa_agm-114m_bf=AGM-114M,Hellfire II,ASM,The AGM-114M is a semi-active laser-guided Hellfire II variant fitted with a blast-fragmentation warhead in place of the tandem anti-armour warhead. Designed for use against patrol craft, light vehicles, exposed equipment, buildings and other soft or lightly protected targets, it retains the guidance, propulsion and control architecture of the AGM-114K while trading heavy armour penetration for greater blast and fragmentation effects.
usa_agm-114r_mp=AGM-114R,Hellfire II Romeo,ASM,The AGM-114R Romeo is a semi-active laser-guided multipurpose Hellfire II developed to replace several earlier specialist variants with a single missile. Its programmable multipurpose warhead combines shaped-charge and fragmentation effects, allowing engagement of armour, light vehicles, structures, bunkers and small maritime targets. Improved navigation and trajectory shaping also provide greater engagement flexibility than earlier laser-guided Hellfires.
usa_agm-114r2_hob=AGM-114R2,Hellfire II Romeo,ASM,The AGM-114R2 is an improved Romeo-series Hellfire II retaining semi-active laser guidance and the multipurpose warhead while adding a height-of-burst proximity sensor and programmable fuze functions. These features improve effectiveness against exposed personnel and soft targets while preserving the R-model's ability to engage armoured vehicles, structures, bunkers and maritime targets.
# ---------- Anti-sub  Missilies ----------
usn_haawc_p8=HAAWC,ASROC,ASW,HAAWC is an all-weather add-on glide kit that enables the Mk54 torpedo to be launched near or below the cruising altitude of the P-8A Poseidon.
