[ -------------------- Radars -------------------- ]
[adf_ceaops]
Type=Radar
Default=CEA Operational Sensor System,CEAOPS
DefaultDescription=The CEA Operational Sensor System (CEAOPS) is an Australian-developed, truck-mounted active electronically scanned array (AESA) radar designed by CEA Technologies for the Australian Army's enhanced NASAMS air defence system under Project LAND 19 Phase 7B. Mounted on a Rheinmetall MAN HX77 8×8 vehicle, CEAOPS combines a large rotating S-band AESA radar with four smaller fixed arrays, providing long-range air surveillance, continuous 360-degree coverage and advanced target detection, tracking and identification. The system supplies early warning and targeting information to networked NASAMS Fire Distribution Centres, supporting engagements against aircraft, helicopters, cruise missiles and unmanned aerial threats. Operating alongside the smaller Hawkei-mounted CEATAC radar, CEAOPS provides the wider-area surveillance and coordination capability of Australia's ground-based air defence network.
Variant1=CEA Operational Sensor System,CEAOPS

[ -------------------- SAM Sites -------------------- ]
[adf_nasams_launcher]
Type=SAM Site
Default=NASAMS ADF,NASAMS
DefaultDescription=The National Advanced Surface-to-Air Missile System (NASAMS) is a networked, medium-range air defence system jointly developed by Norway's Kongsberg Defence and Aerospace and the American company Raytheon. Selected by Australia under Project LAND 19 Phase 7B in 2017, with the acquisition contract signed in 2019, NASAMS was introduced to replace the ageing RBS 70 system and provide a modern ground-based air defence capability for the Australian Army. The Australian configuration incorporates locally developed CEAOPS and CEATAC active electronically scanned array radars, networked Fire Distribution Centres and both canister-based and Hawkei-mounted missile launchers. Employing AIM-120 AMRAAM and AIM-9X Sidewinder missiles, NASAMS provides defence against hostile aircraft, helicopters, cruise missiles and unmanned aerial vehicles. Operated by the 16th Regiment, Royal Australian Artillery, the system achieved Final Operational Capability in September 2026, forming a key component of Australia's integrated air and missile defence network.\n\nRequires a friendly CEAOPS unit in the same task force within 10 nautical miles of the launcher in order to track and fire AMRAAM missiles. Full IR missile loadout does not require a radar.
Variant1=NASAMS 16th Regt. Royal Australian Artillery,NASAMS
