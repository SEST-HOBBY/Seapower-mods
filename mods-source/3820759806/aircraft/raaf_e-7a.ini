[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=1.9            //Pi* r * r where r is engine radius, in meters

[FlightModel]
PitchGain=0.8                         // Vertical manuverability
VelocityGain=0.5136                   // Acceleration
HeadingGain=2                         // Horizontal manuverability
YawRateLimit=130                      // in degrees per second

BankGain=0.8                          // Roll change speed
MaxRollForHeading=45.0                // bank limit in normal flight
MaxRollRate=60.0                      // in degrees per second

ThrustGain=0.625                      // Thrust change speed
SpeedBrakeFractionGain=10            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

[Performance]
#Dimensions
WingSpan=35.8                           //meters
#Parameters
MaxG=4                                // Mostly for horizontal turns

MaxClimbRate=15.0                     //Meters per second
MaxClimbPitch=15                      // in degrees Default: 20
MaxCombatClimbPitch=20                // in degrees Defaults: 80 for MachLimit 1+ and 45 otherwise
MaxDescentPitch=-15                   // in degrees Default: -20
MaxCombatDescentPitch=-30             // in degrees Defaults: -60 for MachLimit 1+ and -30 otherwise
EmptyMass=46606                       // in kg
MaxFuel=20910                         // in kg

PerEngineMaxThrust=121437              //Newtons
EngineCount=2

Ceiling=41000.0                       // ceiling in feet
CruiseAltitude=35000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.5,0.5,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=340                //in knots, Defines max speed at altitude curve
StallSpeed=128.0                      //in knots
MachLimit=0.82                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Km                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.26,0.4        // Landing
SpeedAndRange_Loiter=0.4,0.6          // Loiter
SpeedAndRange_Cruise=0.72,7040         // Cruise
SpeedAndRange_Max=0.82,0.8            // Attack/Fast/High/Max without AB


Altitudes=1000,5000,10000,15000,20000,25000,30000,35000  // in feet

ClimbRateCurveType=Custom  // this allows us to smooth out the climb rate as we approach the target altitude
ClimbRateCurveKeys=4
ClimbRateCurveKey1=0,0
ClimbRateCurveKey2=10,0.1
ClimbRateCurveKey3=200,0.5
ClimbRateCurveKey4=400,1

