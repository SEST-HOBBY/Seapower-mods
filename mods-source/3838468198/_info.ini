[Language_en]
Name=Sensor View
Description=A button (and a key, ] by default) that switches the 3D view between the normal picture and a War Thunder style sensor view: dark sea grid, glowing unit models, sensor beams and seeker cones, datalinks, wakes and trails, and what the game will make each weapon do next - missile routes with seeker switch-on, terminal, pop-up and dive, torpedo enable zones and search patterns, bomb and rocket impact points, depth charge fuze depths, shell splashes, lasers, jamming - and why each weapon ended (hit, dud, shot down, decoyed, jammed, guidance lost, out of fuel). A side panel filters what is shown. By default you see only what your side tracks; Show all units reveals everything. Settings in BepInEx/config/local.sensorview.cfg and local.sensorview.colors.cfg.

[Compatibility]
ApproximateVersion=0.9.1
