[General]
# AGM-158B JASSM-ER, B-21 Raider package. Structure follows stock usaf_agm-86c (land-attack cruise missile).
# Length 4.27 m (14 ft, AFMC / af.mil), width 0.643 m (25.3 in, af.mil). Range over 500 nmi, Mach 0.85,
# GPS/INS with anti-jam GPS and imaging infrared terminal seeker (LM product card, AFMC).
# The ER mass is not published: the official JASSM figure 1,020 kg (2,250 lb, AFMC) is used.
Type=Missile
TargetType=ASuW
LandAttackCapability=Installation
CanNotAttackTypes=Vessel,Submarine

Mass=1020
AmmoPoints=3060
AirLaunched=True

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard

[SensorData]
VisualIdentificationRange=2
IRSignature=Small
# Low-observable airframe. No public RCS figure, gameplay estimate.
RCS=0.01
TransientRCS=Meager
TransientVisualIdentificationRange=15

[WarheadData]
# 1,000 lb blast-fragmentation penetrator (LM product card). Power on the stock scale
# between AGM-84D (45) and Mk 84 (62), gameplay estimate.
WarheadType=0
Power=60
ImpactSize=Large
Penetration=Always

[Guidance]
GuidanceType=0
MidCourseCorrection=0
InitialFlightPhaseDuration=1.0
DropDuration=2.0
TerrainFollowFlight=True
MaxLoftAngle=50.0
MaxLoftAlt=40
TerminalApproachDist=0.5
SupportsBanking=True
TerminalDiveDistance=0.1
# Mach 0.85 at sea level is about 560 kt.
MaxVelocity=560.0
Acceleration=0.5
MaxTurnRate=30.0
# Minimum range is not published, gameplay setting.
MinLaunchRange=10.0
MaxLaunchRange=500.0
LaunchReliability=0.97
# GPS/INS plus imaging infrared terminal homing. No public CEP, gameplay estimate.
CircularErrorRadiusInstallation=3
SelfDestructDelay=5.0

[Models]
ResourcesFolder=weapons/usaf_b21_agm-158b/
ResourcesRoot=usaf_b21_agm-158b.obj
ResourcesMesh=usaf_b21_agm-158b
ResourcesMaterialFolder=weapons/usaf_b21_agm-158b/
ResourcesMaterial=usaf_b21_agm-158b_mat.ini
# Carried and released with wings and fin stowed, then switches to the deployed mesh.
ResourcesMeshForLaunch=usaf_b21_agm-158b_stowed
ResourcesMeshSwitchTime=1.0

[Particles]
BoosterEffect=None
InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0.000967261,-0.031845207
InFlightEffectStartTime=1.5

HitDefaultExplosionClass=LargeMissileExplosions
HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeShipHitExplosion

HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=VeryLargeGroundHitExplosions

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.009568,0.006696,0.063542
