[General]
# GBU-38/B JDAM (Mk 82 body), B-21 Raider package. Structure follows stock usn_mk-82.
# Mass 253.6 kg (558 lb, af.mil) or 267.6 kg (590 lb, navy.mil), 255 kg used. Length 2.352 m, tail span 0.356 m,
# range up to 13 nmi, CEP 5 m or less with GPS (af.mil).
# GPS/INS guidance: the engine steers every unguided (GuidanceType 0) bomb to a fixed aim point set at release
# (Bomb.cs OnFixedUpdate). That aim point is offset by 3 x gauss x CircularErrorRadius scaled by release height
# above the target (Bomb.cs 275-281, 290-300, 513-514), so the miss grows linearly with altitude and widens in
# poor visibility. CircularErrorRadius=0.5 is a gameplay value, not the published 5 m CEP. Clear weather mean miss
# is about 1 m from 5,000 ft, 5 m from 20,000 ft and 11 m from 45,000 ft (stock Mk 82/84 at 20: about 430 m).
Type=Bomb
TargetType=ASuW
IsInterceptable=True

Mass=255
AmmoPoints=383

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard

[SensorData]
VisualIdentificationRange=1
IRSignature=VerySmall
RCS=VerySmall

[WarheadData]
WarheadType=0
Power=28
ImpactSize=Medium
Penetration=Moderate

[Guidance]
GuidanceType=0
MidCourseCorrection=0
InitialFlightPhaseDuration=1.0
MinLaunchRange=0.01
MaxLaunchRange=13.0
MinLaunchAltitude=200
MaxLaunchAltitude=45000
LaunchReliability=0.97
CircularErrorRadius=0.5
SelfDestructDelay=0.0

