[General]
# AGM-158C LRASM, B-21 Raider package. Structure follows stock usn_agm-84d.
# Lockheed Martin publishes no LRASM mass or dimensions. The JASSM-ER airframe values are used:
# length 4.27 m, width 0.64 m (af.mil JASSM figure). Mass 950 kg is the commonly cited secondary figure (estimate).
# Range over 200 nmi and subsonic speed are official (LM Fast Facts). Mach 0.85 cruise is the JASSM family figure (AFMC).
# Seeker: the real round uses passive RF sensors and a multi-mode seeker. The engine models it as a passive
# imaging-infrared homing seeker (GuidanceType 1, as stock knm_penguin_mk2), so it does not radiate.
Type=Missile
TargetType=ASuW

Mass=950
AmmoPoints=2850
AirLaunched=True

CIWSDefenceBonus=5
MissileDefenceBonus=0.05

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard

SaturationValue=1

[SensorData]
VisualIdentificationRange=2
IRSignature=Small
# Low-observable airframe. No public RCS figure, gameplay estimate.
RCS=0.01

[WarheadData]
# 1,000 lb penetrating blast-fragmentation warhead (LM product card). Power on the stock scale
# between AGM-84D (45) and Mk 84 (62), gameplay estimate.
WarheadType=0
Power=60
ImpactSize=Large
Penetration=Always

[Guidance]
GuidanceType=1
MidCourseCorrection=0
InitialFlightPhaseDuration=1.0
DropDuration=1.0
SeaSkimmingAlt=50
SeaSkimmingMaxDescentAngle=45.0
SeaSkimmingNoseUp=2.0
SeaSkimmingStartDistToTarget=1000
TerminalApproachDist=8.0
TerminalAlt=7
TerminalPopUpDist=1
TerminalPopUpHeight=1000
TerminalPopUpAngle=70
SelectivePopUp=True
TerminalVerticalTurnRate=25
SupportsBanking=False
# Mach 0.85 at sea level is about 560 kt.
MaxVelocity=560.0
Acceleration=0.5
MaxTurnRate=15.0
MinLaunchRange=3.5
MaxLaunchRange=200
LaunchReliability=0.97
SeekerFOV=45,10
SeekerActiveRange=0.0
SeekerPassiveRange=20.0
# Imaging infrared seeker values as stock usaf_gbu-15 / wp_ss-n-2c (IR seekers are not affected by radar jamming).
AntiCountermeasuresBonus=0.4
AntiJammerBonus=1.0
SelfDestructDelay=5.0

[Models]
ResourcesFolder=weapons/usaf_b21_agm-158c/
ResourcesRoot=usaf_b21_agm-158c.obj
ResourcesMesh=usaf_b21_agm-158c
ResourcesMaterialFolder=weapons/usaf_b21_agm-158c/
ResourcesMaterial=usaf_b21_agm-158c_mat.ini
# Carried and released with wings and fin stowed, then switches to the deployed mesh.
ResourcesMeshForLaunch=usaf_b21_agm-158c_stowed
ResourcesMeshSwitchTime=1.0

[Particles]
BoosterEffect=None
InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.032
InFlightEffectStartTime=1.5

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosionClass=LargeMissileExplosions
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=SmallWaterSplashes

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.009524,0.006696,0.063542
