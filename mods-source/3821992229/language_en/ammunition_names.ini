[AmmunitionNames]
usaf_b21_agm-158c=AGM-158C,LRASM,ASM,Long Range Anti-Ship Missile built on the JASSM-ER airframe. Subsonic and semi-autonomous, with passive RF sensors, a multi-mode seeker and a 1,000 lb penetrating blast-fragmentation warhead. Range is over 200 nmi. Lockheed Martin does not publish its mass or dimensions, so JASSM-ER values are used. In game it homes passively with an infrared seeker and does not emit.
usaf_b21_agm-158b=AGM-158B,JASSM-ER,Land Attack,Joint Air-to-Surface Standoff Missile, Extended Range. High-subsonic cruise missile with GPS/INS navigation, an anti-jam GPS receiver and an imaging infrared terminal seeker. Carries a 1,000 lb blast-fragmentation penetrator warhead more than 500 nmi. The ER version's mass is not published, so the 2,250 lb JASSM figure is used.
usaf_b21_gbu-31=GBU-31,JDAM,Guided Bomb,GBU-31(V)1/B Joint Direct Attack Munition. A Mk 84 2,000 lb general-purpose bomb with a GPS-aided inertial tail kit that steers it to coordinates set before release. Accuracy is 5 m or better with GPS, and range is up to 13 nmi from high altitude.
usaf_b21_gbu-38=GBU-38,JDAM,Guided Bomb,GBU-38/B Joint Direct Attack Munition. A Mk 82 500 lb general-purpose bomb with the same GPS-aided inertial tail kit and accuracy as the GBU-31, in a lighter weapon that lets one aircraft carry many more aimpoints.
usn_steelfin_air=Steelfin,Steelfin,AAM,Air-launched Steelfin interceptor.
usaf_b21_mk-82=Mk 82,Mk 82,Unguided Bomb,500 lb general-purpose bomb.
