Name=Sensor View - Euromod support
Description=Addon for Sensor View: Euromod's SATCOM mid-course guidance is named SATCOM (instead of "not recognised"), and guiding systems placed far above the sea (satellite stand-ins) are labelled "satellite link", light no target, and draw their link as a datalink line. Needs Sensor View (API 8); load it after Sensor View.

