[ran_uuv_echidna]
Type=UUV,Unarmed Sensor Drone
Default=RAN Echidna Sensor UUV,Echidna
Variant1=RAN Echidna Sensor UUV,Echidna
DefaultDescription=Australian unarmed underwater sensor vehicle. Passive flank sonar listens for contacts, active bow sonar searches underwater and acoustic intercept listens for active sonar transmissions. Compatible allies can receive sonar contacts according to scenario settings.\nAt periscope depth, the hatch covers retract into the hull. Stabiliser fins deploy on both sides at the bow, midships and aft. The collapsed antenna emerges horizontally, pivots upright and then telescopes three metres. In EMCON, select ECM antenna mast at periscope depth. Wait for deployment, then assign Offensive ECM to a map point or known contact. The jammer covers a four-degree sector with a 16 km game range ceiling. Its battery allows 60 cumulative minutes of assigned jamming. Switch off or dive to reverse the sequence. The mast stows horizontally beneath the closed covers.\nMaximum travel from deployment is 40 km across all modes. With passive sensors or sensors off, maximum speed is 25 knots. Switching on ECM or active bow sonar caps speed at 3 knots until both are off. The range ring shows the distance remaining.\nEchidna SRT-01 v0.2.9
