#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# SSQ-75 ERAPS
Type=Sonobuoy                          // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW
LifeTime=10800                          // For sonobouy it is a time in seconds while its sonar works

Mass=30                               // in kg. Used for aircraft
AmmoPoints=50                      // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini
[SensorData]
IRSignature=VeryTiny
RCS=VeryTiny                   //radar related (RCS => radar cross section) i.e how visible is target

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
ParachuteSlowDown=0.99                   // speed damping
ParachuteEndVelocity=100.0               // slow down end speed in knots of torpedo with parachute
#MaxAngleWithParachute=80.0               // defines how steep the angle can become with the parachute //Dot: Not needed?
TrimDepth=-0.004                         //Depth offset in units. Negative numbers move object deeper, positive - higher

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=-1

[OnBoardSystems]
Sonar=SSQ-75_Sonar
#ActiveTestSonar                   //Sonar used for the detection. Must be in sensors.ini
SonarDepth=100                          //Depth of sonar relative to sonobouy in feet
TransmitterRange=1200                     //Range in nautical miles in which friendly units are able to receive data from buoy

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.5         // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
#========================================= Launch stats ============================================================
EjectVelocity=40                       // Initial forward speed in knots

MinLaunchRange=0                       // Minimum launch range in nautical miles
MaxLaunchRange=100.0                   // Maximum launch range in nautical miles
MinLaunchAltitude=200                  // Minimum launch altitude in feet.
MaxLaunchAltitude=1000                 // Maximum launch altitude in feet.

MaxTurnRate=1.0                        // Maximum turnrate in degrees per second
LaunchReliability=99                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=20.0                // Circular error radius in meters
#Homing
#ECCM
#SelfDestruct
#SelfDestructDelay=12                    // For sonobouy it is a time in seconds while its sonar works <- not used here atm TODO: Decide merge or no
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
#AttachmentPosition=0,0,-0.001
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_mk-82
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_mk-82_mat
AssetBundleMeshHullCollider=usn_mk-82_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/usn_ssq-53/
ResourcesRoot=usn_ssq-53
ResourcesMesh=usn_ssq-53_dummy
ResourcesMaterial=usn_ssq-53_mat
ResourcesMeshForLaunch=usn_ssq-53_dummy
#deploy = sonobouy_deep
#sonobouy_shallow
############################################################
NumberOfSubModels=1

SubModel1=AntennaShallow //100ft (30m) deep model
#SubModel1=AntennaDeep     //400ft (120m) deep model

[AntennaShallow]
Type=Antenna
Mesh=usn_ssq-53

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

ParachuteEffect=effects/weapons/emitters/parachute_square
ParachuteEffectPosition=0,0,-0.005
InFlightEffect=None
#effects/aircraft/emitters/helicopterfireeffect
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0
HitShipExplosion=effects/Particle Emitters/impact_medium_shell
HitAirExplosion=effects/Particle Emitters/impact_medium_shell
HitDefaultExplosion=effects/Particle Emitters/impact_medium_shell
HitWaterSplashClass=SmallWaterSplashes
ExplosionOverwaterSplashClass=SmallWaterSplashes

############################################################
# Sounds
############################################################

[Sounds]
SoundMode=1
BoosterAudioClip=
BoosterAudioRollOff=Logarithmic
BoosterAudioDistance=1,20
BoosterAudioPitchRange=0.4,1
SustainerAudioClip=
SustainerAudioRollOff=Logarithmic
SustainerAudioDistance=1,20
SustainerAudioPitchRange=0.1,0.6
InflightAudioClip=audio/weapons/TorpedoEngine
InflightAudioRollOff=Logarithmic
InflightAudioDistance=1,20
InflightAudioPitchRange=0.1,0.6

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637
