# ---------- Anti-radar Missiles ---------
usn_agm-114k_LQS=AGM-114K,Hellfire,Land Attack,The AGM-114 is an American Semi Laser-guided air-to-ground standoff weapon.
# ---------- Anti-ship Missiles ----------
#-----------Land Strike only missiles---------
usn_mk50_air_LQS=MK-50,ALWT,ASW Torpedo,The MK-50 anti-submarine torpedo is a new generation of anti-submarine torpedo equipped by the US Navy. It is mainly equipped on surface ships and anti-submarine aircraft to attack various submarines. This type is airborne.

usn_ssq-77c_LQS=AN/SSQ-77C,VLAD,Sonobuoy,The SSQ-77C is a vertical line array DIFAR passive sonobuoy designed to provide a generational improvement over the original DIFAR type. The structure of the buoy is similar to the DIFAR buoy, but utilizes an extremely sensitive sonar array, enabling the sonobuoy to achieve extremely long passive range, high capability against quiet, deep-diving targets, and perform well in cluttered, noisy waters.

usn_ssq-75_LQS=AN/SSQ-75A,ERAPS,Active Sonobuoy,The AN/SSQ-75 ERAPS (Expendable Reliable Acoustic Path Sonobuoy) is a long-range, directional command-activated active sonobuoy. Known for its high performance against quiet submarines in the open ocean, this sonobuoy offers exceptional performance, but unfortunately, its procurement is extremely limited, so few have survived.
