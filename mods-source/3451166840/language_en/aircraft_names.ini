[wp_su-25]
Type=Attack
Default=Su-25,Su-25
DefaultDescription=The Sukhoi Su-25 Grach (Russian: Грач (rook); NATO reporting name: Frogfoot) is a subsonic, single-seat, twin-engine jet aircraft developed in the Soviet Union by Sukhoi. It was designed to provide close air support for Soviet Ground Forces. The first prototype made its maiden flight on 22 February 1975. After testing, the aircraft went into series production in 1978 in Tbilisi in the Georgian Soviet Socialist Republic.
