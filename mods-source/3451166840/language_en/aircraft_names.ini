[wp_su-25sm3]
Type=Attack
Default=Su-25SM3,Su-25SM3
DefaultDescription=Unlike the baseline Su-25 and its incrementally upgraded variant, the Su-25SM, both of which have a rather outdated Klen-PS laser target designator in the nose, the Su-25SM3 has been upgraded with the new SOLT-25 electro-optics nose module. The SOLT-25 provides 16× zoom and features a laser range finder and target designator, thermal imager, TV channels, and the ability to track moving targets in all weather up to 8 km away. In addition, the Su-25SM3 comes with the Vitebsk-25 protection suite, which integrates a set of Zakhvat forward and rearward facing missile approach warning ultraviolet sensors, the L-150-16M Pastel radar homing and warning system, two UV-26M 50 mm chaff dispensers, and a pair of wing-mounted L-370-3S radar jamming pods. Furthermore, the Su-25SM3 has been upgraded with the new PrNK-25SM-1 Bars targeting-and-navigation system and the KSS-25 communication system with Banker-8-TM-1 antenna.
Squadron1=Su-25SM3,Su-25SM3
Callsigns=Squadron1,Frogfoot

