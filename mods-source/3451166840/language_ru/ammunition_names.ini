ru_kh-38mt=Х-38MT,IR,Land Attack,Х-38/Х-38М (по-русски Х-38) - это семейство ракет класса "воздух-поверхность", которые должны прийти на смену семействам ракет Х-25 и Х-29. Kh-38 также служит основой для планерных бомб Kh36 без двигателя и с приводом от двигателя.Руководство по MTisIR

wp_as-14a=Х-29Л,Laser,Land Attack,Х-29 (русское обозначение Х-29; НАТО: AS-14 "Кедж"; ГРАУ: 9М721) - советская ракета класса "воздух-поверхность" с дальностью действия 10-30 км. Он имеет большую боеголовку весом 320 кг, имеет на выбор лазерное, инфракрасное, активное радарное или телевизионное наведение и обычно используется тактическими самолетами, такими как Су-24, Су-30, МиГ-29К, а также Су-25, что расширяет возможности этих самолетов по противодействию.

wp_as-14=Х-29Т,TV,Land Attack,Х-29 (русское обозначение Х-29; НАТО: AS-14 "Кедж"; ГРАУ: 9М721) - советская ракета класса "воздух-поверхность" с дальностью действия 10-30 км. Он имеет большую боеголовку весом 320 кг, имеет на выбор лазерное, инфракрасное, активное радарное или телевизионное наведение и обычно используется тактическими самолетами, такими как Су-24, Су-30, МиГ-29К, а также Су-25, что расширяет возможности этих самолетов по противодействию.

