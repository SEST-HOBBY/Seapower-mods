wp_aa-11_mi=Р-73,Archer,AAM,Ракета класса "воздух-воздух" Р-73 - это советский/российский тип боевой ракеты класса "воздух-воздух" ближнего радиуса действия, которая в 1990-х годах была одной из самых эффективных в мире боевых ракет класса "воздух-воздух" с инфракрасным наведением.

