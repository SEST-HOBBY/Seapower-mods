DefaultDescription=Су-25 Грач (изделие «Т-8», по классификации НАТО: Frogfoot — «Лягушачья лапа») — советский штурмовик, бронированный дозвуковой военный самолёт.Штурмовик предназначен для непосредственной поддержки сухопутных войск при прямой видимости цели, а также уничтожения объектов с заданными координатами круглосуточно в любых метеоусловиях. Су-25 впервые поднялся в воздух 22 февраля 1975 года. Самолёты этого типа эксплуатируются с 1981 года; принимали участие во множестве военных конфликтов.
Squadron1=Су-25,Су-25
Callsigns=Squadron1,Frogfoot

[wp_su-25sm3]
Type=Штурмовик
Default=Су-25SM3,Су-25SM3
DefaultDescription=Обновлённый одноместный штурмовик. Добавлена система спутниковой навигации ГЛОНАСС с возможностью программирования конечной точки с точностью до десяти метров, позволяет автономно действовать лётчику при «нулевой» видимости. Оснащается ПНК СВП-24-25 (вариант СВП-24 «Гефест» для Су-25), позволяющим повысить точность неуправляемых авиационных средств поражения до уровня управляемого оружия.
Squadron1=Су-25SM3,Су-25SM3
Callsigns=Squadron1,Frogfoot

