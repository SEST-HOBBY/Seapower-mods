[wp_su-25]
Type=攻击机
Default=苏-25,苏-25
DefaultDescription=苏-25“乌鸦”（俄语：Су-25 «Грач»，北约代号蛙足（Frogfoot）[2]）是一款前苏联苏霍伊设计局研制的亚音速空中密接支援攻击机。除了是前苏联主力的攻击机种之一外，也在苏联解体后的独联体国家持续服役，并有若干外销版本。Su-25构型简单且非常实用，战场生存性佳。
Squadron1=苏-25,苏-25
Callsigns=Squadron1,蛙足

[wp_su-25sm3]
Type=攻击机
Default=苏-25SM3,苏-25SM3
DefaultDescription=SM3由库宾卡的俄罗斯空军第121飞机维修厂进行升级工程。发动机更换为R-195，并撤除SU-25机鼻配备的Klen-PS激光测距与标定仪，更换成SOLT-25多功能观测瞄准装置，新的装置整合了激光目标指引、测距、热成像、电视制导以及跟踪移动目标的功能等，可以进行16倍放大，全天候有效观测距离8公里。航电装置加装了SVP-24-25投弹瞄准系统，该系统起初是Su-24战斗轰炸机配备的装备，在历次战争中证明了攻击精度良好，在系统成本降低后增装在SM3计划中。飞机防御装置则升级为维捷布斯克-25（Vitebsk-25）整合电子战防御套件，该套件包括了一组前向和后向的紫外线导弹迫近探测仪、L-150-16M Pastel 雷达告警器、两组UV-26M 50mm干扰弹施放器、装置在左右翼端的2台L-370-3S电子干扰吊舱。最新批次的SM3内部则升级了新型PrNK-25SM-1 Bars 目标指引和导航系统、配合Banker-8-TM-1通信天线的KSS-25通讯系统、以及SVP-24投弹导航辅助瞄准系统，可以将非制导炸弹投掷平均误差缩小到30-40m。
Squadron1=苏-25SM3,苏-25SM3
Callsigns=Squadron1,蛙足

