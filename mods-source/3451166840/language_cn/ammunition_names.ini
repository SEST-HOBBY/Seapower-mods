ru_kh-38mt=KH-38MT,红外,对地攻击,Kh-38是 Kh-25 和 Kh-29 导弹系列的后续改型。Kh-38也是Kh-36 无动力和动力滑翔炸弹的基础。MT是增程红外制导

wp_as-14a=KH-29L,激光,对地攻击,Kh-29是一种射程为 10-30 公里的苏联空对地导弹。它有一个 320 公斤的大弹头，可选择激光、红外、主动雷达或电视制导，通常由 Su-24、Su-30、MiG-29K 和 Su-25 等战术飞机携带，使这些飞机具有更大的对抗能力。

wp_as-14=KH-29T,电视,对地攻击,Kh-29是一种射程为 10-30 公里的苏联空对地导弹。它有一个 320 公斤的大弹头，可选择激光、红外、主动雷达或电视制导，通常由 Su-24、Su-30、MiG-29K 和 Su-25 等战术飞机携带，使这些飞机具有更大的对抗能力。

