[AmmunitionNames]
# ---------- Anti-ship Missiles ----------
pla_yj-18=YJ-18,,ПКР,YJ-18 — противокорабельная ракета большой дальности, созданная на основе российской 3М-54 (SS-N-27). Маршевый участок проходит на дозвуковой скорости, на конечном участке ракета разгоняется до М=3. Предназначена для поражения надводных кораблей и может запускаться с самолётов, кораблей и подводных лодок.

pla_yj-83=YJ-83,,ПКР,YJ-83 — противокорабельная крылатая ракета средней дальности, состоящая на вооружении множества кораблей, подводных лодок и самолётов НОАК. Маршевый участок проходит на малой высоте с дозвуковой скоростью, на конечном участке ракета атакует со скоростью М=1,4.

#-----------Land Strike only missiles---------
pla_jl-3=JL-3,,БРПЛ,JL-3 — китайская баллистическая ракета подводных лодок третьего поколения межконтинентальной дальности. Вооружает лодки типа 094 и, как ожидается, будет установлена на перспективные лодки типа 096.

pla_cj-10=CJ-10,,Крылатая ракета,CJ-10 — крылатая ракета большой дальности для ударов по наземным целям, созданная на основе российской Х-55. Может нести обычную или ядерную боевую часть и запускаться с самолётов, кораблей и подводных лодок.

# --------------- Torpedoes ---------------
pla_yu-6=Ю-6,,Универсальная торпеда,Ю-6 — китайская универсальная тяжёлая торпеда калибра 533 мм с телеуправлением по проводу, позволяющим перенацеливать её с носителя после пуска.
