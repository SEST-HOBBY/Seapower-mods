[AmmunitionNames]
# ---------- Anti-ship Missiles ----------
pla_yj-18_mw=YJ-18,,ПКР,YJ-18 — противокорабельная ракета большой дальности того же класса, что и российская 3М-54 «Калибр» (SS-N-27); запускается из торпедных аппаратов и УВП подводных лодок, а также с надводных кораблей. Маршевый участок проходит на малой высоте с дозвуковой скоростью (около М=0,8), а на последних ~40 км ракетная боевая ступень разгоняется до М=3, сокращая время реакции ПВО.

pla_yj-19_mw=YJ-19,,ПКР,YJ-19 — первая китайская гиперзвуковая противокорабельная крылатая ракета, показанная на параде в Пекине 3 сентября 2025 года. Подфюзеляжный воздухозаборник указывает на ГПВРД; скорость — М=5 и выше. В начале 2026 года государственные СМИ КНР сообщили о принятии её на подводные лодки проекта 039B с пуском из горизонтальных торпедных аппаратов. При подводном пуске ракетный ускоритель выводит её из воды и разгоняет до рабочей скорости ГПВРД, затем отделяется. Данные оценочные.

pla_yj-83_mw=YJ-83,,ПКР,YJ-83 — противокорабельная крылатая ракета средней дальности, состоящая на вооружении множества кораблей, подводных лодок и самолётов НОАК. Маршевый участок проходит на малой высоте с дозвуковой скоростью, на конечном участке ракета атакует со скоростью М=1,4.

#-----------Land Strike only missiles---------
pla_jl-3_mw=JL-3,,БРПЛ,JL-3 — китайская баллистическая ракета подводных лодок третьего поколения межконтинентальной дальности. Вооружает лодки типа 094 и, как ожидается, будет установлена на перспективные лодки типа 096.

pla_jl-2_mw=JL-2,,БРПЛ,JL-2 — китайская твердотопливная баллистическая ракета подводных лодок межконтинентальной дальности (около 7200 км), вооружение подводных лодок типа 094, по двенадцать на лодку.

pla_cj-10_mw=CJ-10,,Крылатая ракета,CJ-10 — крылатая ракета большой дальности для ударов по наземным целям, созданная на основе российской Х-55. Может нести обычную или ядерную боевую часть и запускаться с самолётов, кораблей и подводных лодок.

# --------------- Torpedoes ---------------
pla_yu-6_mw=Ю-6,,Универсальная торпеда,Ю-6 — основная китайская тяжёлая торпеда калибра 533 мм, на вооружении с 2005 года, в целом по образцу американской Mk 48. Тепловой двигатель на топливе Otto II даёт высокую скорость (более 65 узлов) и дальность около 45 км, но торпеда шумная. Телеуправление по проводу, активно-пассивное акустическое и кильватерное самонаведение позволяют носителю наводить её после пуска по кораблям и подводным лодкам.

pla_yu-9_mw=Yu-9,,Торпеда,Yu-9 — электрический вариант Ю-6: большинство узлов общие, но вместо двигателя на топливе Otto стоят аккумуляторная батарея и электромотор с двумя соосными винтами противоположного вращения. Торпеда гораздо тише и не оставляет пузырькового следа выхлопа ценой части скорости и дальности. По китайским данным, полностью боеготова с 2012 года. Телеуправляемая, по кораблям и подводным лодкам; данные оценочные.

pla_yu-10_mw=Yu-10,,Торпеда,Yu-10 — новейшая китайская тяжёлая торпеда, по сообщениям на вооружении примерно с 2015 года. Китайские источники приписывают ей кильватерное самонаведение по надводным кораблям, помехозащищённость и дальность не менее 50 км, сопоставимую с Mk 48 Mod 7; на опубликованном видео стрельб подводная лодка проекта 039B топит ею списанный десантный корабль. Открытых данных мало; данные оценочные.
