[AmmunitionNames]
# ---------- Anti-ship Missiles ----------
pla_yj-18_mw=鹰击-18,,反水面,鹰击-18是与俄罗斯3M-54“口径”（SS-N-27）同类的远程反舰导弹，可由潜艇鱼雷管、垂直发射单元及水面舰艇发射。巡航段以约0.8马赫低空亚音速飞行；最后约40公里由火箭推进的末级以最高3马赫冲刺，压缩敌方防御的反应时间。

pla_yj-19_mw=鹰击-19,,反舰导弹,鹰击-19是中国首型高超音速反舰巡航导弹，于2025年9月3日北京阅兵亮相。腹部进气道表明其采用超燃冲压发动机，速度达5马赫以上。2026年初官方媒体称其已装备039B型潜艇，由水平鱼雷管发射。从水下潜艇发射时，火箭助推器将其推出水面并加速至超燃冲压工作速度后分离。此处数据为估计值。

pla_yj-83_mw=鹰击-83,,反水面,鹰击-83是中程反舰巡航导弹，大量装备于中国人民解放军的舰艇、潜艇和飞机。它以亚音速低空巡航，末段以1.4马赫的超音速攻击。

#-----------Land Strike only missiles---------
pla_jl-3_mw=巨浪-3,,潜射弹道导弹,巨浪-3是中国第三代洲际射程潜射弹道导弹，装备094型潜艇，并预计将装备未来的096型潜艇。

pla_jl-2_mw=巨浪-2,,潜射弹道导弹,巨浪-2是中国第二代固体燃料洲际射程潜射弹道导弹，射程约7200公里，装备094型潜艇，每艇十二枚。

pla_cj-10_mw=长剑-10,,对地攻击,长剑-10是以俄罗斯Kh-55为基础研制的远程对地攻击导弹，可携带常规或核弹头，可由飞机、水面舰艇和潜艇发射。

# --------------- Torpedoes ---------------
pla_yu-6_mw=鱼-6,,鱼雷,鱼-6是中国标准的533毫米重型鱼雷，2005年服役，总体参照美国Mk 48。采用奥托II燃料热动力，航速快（65节以上），射程约45公里，但噪声较大。线导加主/被动声自导和尾流自导，发射平台可在发射后继续引导，可攻击水面舰艇和潜艇。

pla_yu-9_mw=鱼-9,,鱼雷,鱼-9是鱼-6的电动型，大部分部件与鱼-6通用，但以电池和电动机取代奥托燃料发动机，驱动双反转螺旋桨。噪声低得多，也没有排气气泡，代价是航速和射程有所降低。据国内资料，2012年已全面形成战斗力。线导，可攻击水面舰艇和潜艇；此处数据为估计值。

pla_yu-10_mw=鱼-10,,鱼雷,鱼-10是中国最新型重型鱼雷，据报道约2015年服役。国内报道称其具备尾流自导和抗干扰能力，射程不少于50公里，与美国Mk 48 Mod 7相当；公开的实弹视频中，一艘039B型潜艇用其击沉了一艘退役登陆舰。公开资料很少，此处数据为估计值。
