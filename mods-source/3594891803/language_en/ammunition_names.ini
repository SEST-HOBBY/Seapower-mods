# ---------- Anti-ship Missiles ----------
pla_yj-18_mw=YJ-18,Eagle Strike,ASM,The YJ-18 is a long-range anti-ship missile in the class of the Russian 3M-54 Klub (SS-N-27), fired from submarine torpedo tubes and VLS cells and from surface ships. It cruises low at subsonic speed (about Mach 0.8); for the last 40 km or so a rocket-powered terminal stage sprints at up to Mach 3, cutting the defenders' reaction time.

pla_yj-19_mw=YJ-19,,ASM,The YJ-19 is China's first hypersonic anti-ship cruise missile, shown at the Beijing parade of 3 September 2025. Its belly air inlet points to a scramjet, and it flies at Mach 5 or more. In early 2026 Chinese state media said it had entered service on Type 039B submarines, fired from horizontal torpedo tubes. From a submerged boat a rocket booster drives it out of the water and up to scramjet speed, then falls away. Figures here are estimates.

pla_yj-83_mw=YJ-83,Eagle Strike,ASM,The YJ-83 is a medium-range anti-ship cruise missile, equipping large numbers of vessels, submarines, and aircraft of the PLA. It features a low subsonic cruise altitude with Mach 1.4 supersonic terminal attack velocity.

#-----------Land Strike only missiles---------
pla_jl-3_mw=JL-3,,SLBM,The JL-3 is a Chinese third-generation intercontinental-range submarine-launched ballistic missile (SLBM). It arms the Type 094 submarine,[3] and is expected to arm the future Type 096.

pla_jl-2_mw=JL-2,,SLBM,The JL-2 (Julang-2) is a Chinese solid-fuel, intercontinental-range submarine-launched ballistic missile (SLBM) with a range of about 7,200 km. It entered service in the early 2010s and arms the Type 094 class, twelve per boat.

pla_cj-10_mw=CJ-10,Long Sword,Land Attack,The CJ-10 is a long-range land-attack missile based on the Russian KH-55. Designed to carry conventional or nuclear payloads, it can be launched by air, from ships, and submarines.

# --------------- Torpedoes ---------------
pla_yu-6_mw=Yu-6,,Torpedo,The Yu-6 is China's standard 533 mm heavyweight torpedo, in service since 2005 and broadly modelled on the US Mk 48. A thermal engine burning Otto fuel II makes it fast (over 65 kn) with about 45 km of range, but loud. Wire guidance plus active/passive acoustic and wake homing let the launching boat steer it after launch, against ships or submarines.

pla_yu-9_mw=Yu-9,,Torpedo,The Yu-9 is the electric twin of the Yu-6: it shares most of its parts but swaps the Otto-fuel engine for a battery and an electric motor driving two counter-rotating propellers. It is much quieter and leaves no exhaust bubbles, at the cost of some speed and range. Chinese sources say it was fully operational by 2012. Wire-guided, for ships or submarines; figures here are estimates.

pla_yu-10_mw=Yu-10,,Torpedo,The Yu-10 is China's newest heavyweight torpedo, reportedly in service from about 2015. Chinese reports credit it with wake homing against surface ships, jam-resistant guidance and at least 50 km of range, comparable to the Mk 48 Mod 7; a released live-fire video shows a Type 039B sinking a retired landing ship with one. Little is public; figures here are estimates.
# ---- Submarine decoys (custom) ----
sub_decoy_advanced_mw=Submarine Decoy (Advanced),2010s+,Noisemaker,Current-generation expendable acoustic torpedo decoy with a wideband projector covering the low, mid and high bands, a long-life lithium battery and an adaptive signature. Nine minutes of life and a high chance of spoofing even advanced multi-band torpedo seekers.
sub_decoy_legacy_mw=Submarine Decoy (Legacy),Cold War,Noisemaker,Expendable acoustic torpedo decoy for Cold War and early post-Cold War submarines: a battery-powered projector that hovers and radiates broadband noise to pull a homing torpedo off the boat. Roughly six minutes of life, and only a fair chance of spoofing a modern seeker.
sub_decoy_modern_mw=Submarine Decoy (Modern),1990s-2010s,Noisemaker,Improved expendable acoustic torpedo decoy for submarines of the 1990s to 2010s: a louder projector, a longer-lived battery and a signature shaped to resemble the launching boat. Eight minutes of life with a good chance of spoofing a modern torpedo seeker.
