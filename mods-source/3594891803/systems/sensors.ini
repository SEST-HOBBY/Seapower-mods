[ ========================================= General ========================================== ]
[General]
DataLinkUpdateRate=1             // every x seconds there will be an update for the overall sensor image for the minimap
PassiveSensorUpdateRate=1.0        // every x seconds the passive contacts will be re-evaluated
LostPassiveContactTimeToDisable=5  // time in seconds after which a lost passive contact bearing line will be greyed out
LostContactTimeToRemove=30         // time in seconds after which a lost contact will be removed from the map

[ ------------------------ Visual/Infared ------------------------- ]
[Optitronics_FLIR_Mast]
#00s/10s FLIR mast for submarines
Kind=Visual
#Infrared
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=5.0           // Target VID range multiplied by this for identification check
MaxRangeMultiplier=8.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.9          // Final VID/Detection range is multiplied by this in case when target observed on surface background

[ ---------------------------- Sonars ----------------------------- ]
[DUUX-5] Hull-mounted passive sonar
#Users: fr_ssbn_triomphant
Kind=Sonar
HasDataLink=False       // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=4.0   // TODO in degrees
RangeResolution=600.0   // TODO defines the minimum range where two targets behind can be recognized as two; in meters
PassiveRange=120         // in km
PseudorangeResolution=15.0 // relative, default is 1.0, smaller is better
Gain=56                 // in db, gain of the sensor
OutputPower=235         // Active sensor output power in dB, unused for passive ones
Type=Hull				//Hull: hull mounted sonar, Towed: towed passive sonar, VDS: variable depth active sonar, Dipping: dipping sonar
SonarFrequency=LF
IsTowedSonar=False
ModuleType=SonarSensor

