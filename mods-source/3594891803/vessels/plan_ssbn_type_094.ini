[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.1
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.12

Length=135                     // in meters
Beam=13                        // in meters

ArmorType=None

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=11000              // in tons

MaxForwardVelocity=30          // sets the max forward velocity
MaxForwardVelocitySurfaced=20
MaxBackwardVelocity=5          // sets the max backward velocity
MaxBackwardVelocitySurfaced=3
TelegraphVelocities=-5,0,5,10,15,20,31

CavitationParameters=20,-100
BowUnderWater=16.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=41.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
CavitationParameters=20,-100
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.9               // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=1                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.068         // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=52.0            // in feet
CrushDepth=1400.0              // in feet

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
LowMagneticHull=false
# Sonar related
BaseNoise=135                  // base sound level in db at 1m distance
FlowNoise=1.1                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=30             // additional noise for cavitation in db
TargetReflectionStrength=22    // in dB for broad side
BladesCount=7                  //number of blades on vessel's propulsion systems
ElectricFrequency=60           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_plan_ssbn_type_094


