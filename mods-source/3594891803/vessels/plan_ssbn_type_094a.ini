[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.1
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.12

Length=137                     // in meters
Beam=13                        // in meters
FrontalArea=142
SideArea=1519
BottomArea=1370

ArmorType=None

[OpticalView]
