WeaponChannels=24      // if applicable number of weapons (missiles) it can guide simultaneously
RPM=0                  // revolutions per minute
MinRange=0.5           // min range in km
MaxRange=280.0         // max range in km
MinAltitude=10         // min altitude in meters, relevant for air, unused for surface
