# ------------------ SAM ------------------
pla_hq-9b=HQ-9B,,SAM,The HHQ-9 is the VLS navalized version of the HQ-9 missile. The B-variant features dual guidance and a new rocket motor that improves speed and range.

pla_hq-10=HQ-10,,SAM,The HQ-10 is a Chinese short-range SAM based on the US RIM-116 RAM. The improved rocket motor improves all aspects of the missile, but primarily increases speed and over doubles the maximum effective range of the weapon, while increasing its high and low altitude performance.

pla_hq-16=HQ-16,,SAM,The HQ-16 is a Chinese all-weather, medium-range surface-to-air missile system derived from imported Russian Buk missile systems. It features various improvements such as an AESA radar for better performance against jamming and the ability to datalink with other Chinese systems.
# ---------- Anti-radar Missiles ---------


# ---------- Anti-ship Missiles ----------
pla_yj-18=YJ-18,Eagle Strike,ASM,The YJ-18 is a long-range anti-ship missile based on the Russian 3M-54 SS-N-27 with a subsonic cruise speed and terminal supersonic attack speed up to Mach 3. Designed to target ships at sea, it can be launched by air, from ships, and submarines.

pla_yj-62=YJ-62,Eagle Strike,ASM,The YJ-62 is a long-range subsonic land-attack and anti-ship cruise missile. The missile has an inertial guidance system using GPS and BeiDou data, and an active terminal sensor.

pla_yj-83=YJ-83,Eagle Strike,ASM,The YJ-83 is a medium-range anti-ship cruise missile, equipping large numbers of vessels, submarines, and aircraft of the PLA. It features a low subsonic cruise altitude with Mach 1.4 supersonic terminal attack velocity.

#-----------Land Strike only missiles---------
pla_cj-10=CJ-10,Long Sword,ASM,The CJ-10 is a long-range land-attack missile based on the Russian KH-55. Designed to carry conventional or nuclear payloads, it can be launched by air, from ships, and submarines.
