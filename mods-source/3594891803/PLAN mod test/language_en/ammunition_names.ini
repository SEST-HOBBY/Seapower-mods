# --------------- Torpedoes ---------------
pla_yu-7_ship=Yu-7,,ASW Torpedo,The Yu-7 is a lightweight torpedo derived from the Whitehead Alenia Sistemi Subacquei (WASS) A244/S torpedo. It entered service in the 1990s as the principal anti-submarine weapon of major People's Liberation Army Navy (PLAN) warships.

pla_yu-11_air=Yu-11,,ASW Torpedo,The Yu-11 is a Chinese lightweight torpedo that entered service in the 2010s as the principal anti-submarine weapon of major People's Liberation Army Navy (PLAN) warships. Compared to its predecessor Yu-7, the Yu-11 has a pump-jet propulsor, is quieter and may potentially operate at depths greater than 600m.

pla_yu-11_ship=Yu-11,,ASW Torpedo,The Yu-11 is a Chinese lightweight torpedo that entered service in the 2010s as the principal anti-submarine weapon of major People's Liberation Army Navy (PLAN) warships. Compared to its predecessor Yu-7, the Yu-11 has a pump-jet propulsor, is quieter and may potentially operate at depths greater than 600m.
