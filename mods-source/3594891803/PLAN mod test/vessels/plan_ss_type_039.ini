[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.12

Length=77.6                      // in meters
Beam=8.4                      // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=2250              // in tons

MaxForwardVelocity=22.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=16.0
MaxBackwardVelocity=5.0        // sets the max backward velocity
MaxBackwardVelocitySurfaced=3
TelegraphVelocities=-5,0,3,5,10,15,20

BowUnderWater=19.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=32.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.95               // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=2.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=45.0            // in feet
CrushDepth=1800.0              // in feet

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=125                  // base sound level in db at 1m distance
FlowNoise=1                    // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=30             // additional noise for cavitation in db
TargetReflectionStrength=15    // in dB for broad side
BladesCount=7                  //number of blades on vessel's propulsion systems
ElectricFrequency=50           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_plan_ss_type_039g

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
AAW_Capability=0
ASuW_Capability=4
ASW_Capability=3

#Defence
#Special
Role=SS

############################################################
# Control System (CIC)
############################################################
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=2200
AdditionalNoise=15        //Added to current noise level when running on this power
Collider=coll_engineroom

[SnorkelMastSystem]
MaxForwardVelocity=9
Collider=coll_snorkel_mast
Mount=Snorkel
OpenSystemAnimation=RaiseSnorkel
CloseSystemAnimation=LowerSnorkel
ModuleType=Inert

[AuxPowerSystem]
Type=Electric
HorsePower=5500
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
Capacity=80000      //Range 20.5 miles at top underwater speed (20 knots)
DischargeRate=1.75  //Rate of discharging batteries. Lower values provide more range on low underwater speed on batteries
RechargeRate=1.2    //Capacity per second when charging batteries. When a unit goes at Standard telegraph setting or slower, the charge rate doubles
Collider=coll_battery_1,coll_battery_2

#Rudder Systems
[RudderSystems]
NumberOfRudderSystems=1

[RudderSystem1]
Mount=Rudder
Collider=coll_rudder

[DepthRudderSystems]
NumberOfDepthRudderSystems=2

[DepthRudderSystem1]
NumberOfPlanes=1
Plane1=Sailplanes
MaxAngle=30.0
Direction=1.0
Collider=coll_rudder

[DepthRudderSystem2]
NumberOfPlanes=1
Plane1=Sternplanes
MaxAngle=30.0
Direction=-1.0
Collider=coll_rudder

[PropulsionSystems]
NumberOfPropulsionSystems=1

[PropulsionSystem1]
