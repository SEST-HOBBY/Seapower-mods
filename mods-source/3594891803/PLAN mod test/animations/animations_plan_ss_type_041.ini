[TubeOpenSequence]
NumberOfSteps=2
Time1=0 
RotationX1=0.0
Smoothness1=EaseInOut
Time2=3                
RotationX2=-60.0
Smoothness2=EaseInOut

[TubeCloseSequence]
NumberOfSteps=2
Time1=0 
RotationX1=-60.0
Smoothness1=EaseInOut
Time2=3                
RotationX2=0.0
Smoothness2=EaseInOut

[RaiseMastSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionY1=0
RotationY1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
PositionY2=0.08
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[LowerMastSequence]
