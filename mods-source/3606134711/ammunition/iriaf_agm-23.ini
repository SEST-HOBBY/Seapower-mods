#!alias ammunition/usa_mim-23.ini

[General]
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW

Mass=760                               // in kg. Used for aircraft
AmmoPoints=1140                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

[WarheadData]
WarheadType=0
Power=41
ImpactSize=Medium               // Impact size, can be small, medium, large, verylarge
Penetration=Moderate              // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                 // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=0.5                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0.5         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
MaxLoftAngle=20.0                      // Climb angle for initial loft
MaxLoftAlt=Launcher                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
TerminalApproachDist=0              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough

Acceleration=11.4                      // Gs of acceleration in initial burn
SustainerAcceleration=1.44               // Acceleration of sustainer burn. -1 if there is no sustainer

TargetRequired=False
SeekerFOV=0.0
SeekerActiveRange=0.0
SeekerPassiveRange=0.0
SecondaryPassiveRadarGuidanceType=
PassiveRadarGuidanceFrequencies=
CircularErrorRadius=235.0              // Circular error radius in meter

MaxLaunchRange=15.0                    // Maximum launch range in nautical miles
DragCoefficient=3.65               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
TypicalTargetAlt=0					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetVelocity=0					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=10000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=600				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000

[Models]
ResourcesRoot=iriaf_agm-23.obj
ResourcesMesh=iriaf_agm-23
ResourcesMaterial=iriaf_agm-23_mat.ini