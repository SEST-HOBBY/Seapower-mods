#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# AIM-120A AMRAAM
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW

Mass=148                               // in kg. Used for aircraft
AmmoPoints=592                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
SupplyCategory=Phoenix
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=2  // 0.5x low vis
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Transient (medium low smoke motor)
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=4  // Transient can be visually detected at this distance in nmi

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=19
ImpactSize=Small                       // Impact size, can be small, medium, large, verylarge
Penetration=Minor                     // can be minor, moderate, heavy, always

FuzeProximityDistance=8             // for proximity fuze: distance to target in yard
KillProbability=0.85                   // Chance to intercept missile
; InterceptOutOfAltitudePenalty=0.25                  // yay!
; InterceptSpeedPenaltyMultiplier=0.7                  // yay!
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
DropDuration=0.2                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0.7         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=15                      // Climb angle for initial loft
MaxLoftAlt=70000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=6                // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=True                 // if true connection with a guiding radar will be severed upon entering terminal approach stage
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#========================================= Launch stats ============================================================
ApplyKinematics=True
MaxVelocity=2200                       // Maximum speed in knots
MaxTurnRate=25                       // Maximum turnrate in degrees per second
AccelerationTime=1.5                   // Time until start of the velocity bleed, in seconds
Acceleration=15.75                      // Acceleration factor
SustainerAccelerationTime=5.5
SustainerAcceleration=8.75
DragCoefficient=3.41
MaxFlightTime=80
TimeLimited=True
#LaunchTurnRate=10                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MinLaunchRange=0.1                     // Minimum launch range in nautical miles
MaxLaunchRange=60                      // Maximum launch range in nautical miles
MinAttackAltitude=50                  // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=70000                // Maximum altitude of target, in feet
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)

; MaxLaunchRange=43                      // Maximum launch range in nautical miles
; TypicalTargetAlt=30000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
; TypicalTargetSpeed=825						// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
; TypicalFiringAlt=25000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
; TypicalLaunchVelocity=480				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
#25000ft at M0.8 against 30000ft at M1.4

#========================================     Seeker     ===========================================================
CircularErrorRadius=1.25              // Circular error radius in meters (fuse 20 with CEP 9.36 = 85%)
CircularErrorRadiusLarge=2.5          // Circular error vs 'Large' aircraft (fuse 20 with CEP 6.87 = 95%)
#Homing
SeekerGain=50                        // Seeker gain in dB
SeekerFOV=50.0                          // Seeker field-of-view in degrees
; SeekerGimbalFOV=50                     // Seeker gimbal FOV in degrees
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
SeekerPassiveRange=8                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=8                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=6                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.35           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.15                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=4                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/usn_aim-120/
ResourcesRoot=usn_aim-120.obj
ResourcesMesh=usn_aim-120a
ResourcesMaterial=usn_aim-120a_mat.ini
############################################################
Rotation=0,0,45
NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_effect
BoosterEffectPosition=0,0,-0.022

SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.02 
SustainerEffectStartTime=1.5

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=7.0  // in seconds, after that the Inflight Effect will be played if available


HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.05
