#!alias ammunition/usa_mim-23.ini
[General]
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

[Guidance]
DropDuration=0.5                       // time in seconds where the missile just falls unpropelled

MaxAttackAltitude=70000                // Maximum altitude of target, in feet

MaxLaunchRange=50.0                    // Maximum launch range in nautical miles
# 2.3884
TypicalTargetAlt=20000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=655						// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0				
TypicalFiringAlt=20000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=800				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000

[Models]
ResourcesMaterial=iriaf_aim-23c_mat.ini
