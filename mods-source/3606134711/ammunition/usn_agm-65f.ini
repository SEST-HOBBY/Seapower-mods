#!alias ammunition/usn_agm-65b.ini

[General]
# AGM-65F Maverick
Mass=305                               // in kg. Used for aircraft
AmmoPoints=610                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

[WarheadData]
WarheadType=0
Power=28
ImpactSize=Medium               // Impact size, can be small, medium, large, verylarge
Penetration=Moderate               // can be minor, moderate, heavy, always

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
SeekerGain=0.0                         // Seeker gain in dB
SeekerFOV=90.0                         // Seeker field-of-view in degrees
SeekerActiveRange=0.0
SeekerPassiveRange=20.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Zoom=3
TargetMemory=True
#ECCM
AntiCountermeasuresBonus=0.4           // This value substracted from probability of spoofing by countermeasures (0...1)

[Models]
ResourcesMaterialFolder=weapons/usn_agm-65/
ResourcesMaterial=usn_agm-65f_mat.ini
