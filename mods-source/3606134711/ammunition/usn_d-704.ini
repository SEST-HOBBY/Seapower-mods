[General]
#300 gallon / 1135 liters fuel tank
Type=Container		                       // can be Projectile, Missile, RBU, ASROC, Torpedo,AerialRocket,MLRS
Mass=318                                   // in kg. Used for aircraft. Container mass. Weapon mass is read from weapon ini. Better not use it for fueltanks
Fuel=908

[SupplySystem]
SystemName=RefuelSystem
FuelLoadSpeed=15				// Kg per second //Should be only 10 kg/s, but thats so damn slow
SupplyRange=2 					// In miles
; MaxTargets=1					// Number of targets that can be simultaniously replenished (same speed per target)
MaxOwnVelocity=670				// In knots. Above this velocity replenishment is impossible
MaxTargetVelocity=670			// In knots. Above this velocity replenishment is impossible
TargetTypes=Aircraft			// What unit types can be replenished by this system
UpdateDelay=1					// Delay between replenishment calculations. (Really should leave it as it is)

Mount=Drogue
CableLength=30 //length of cable in meters
CablePart=effects/ships/emitters/Towed_Array_Line_Thin //prefab object to be used as part of cable
AttachmentPointPosition=0,0,-0.0355 //position of a local point where the cable is attached to host vessel
#CableAttachmentOffset=0.006 // offset to the cable end for the sensor
CableRetractRate=4.0 //retract rate for the towed array cable
; TowedFlowOriented=true
TowedBodyDrag=4
OrientLowPass=0.2

