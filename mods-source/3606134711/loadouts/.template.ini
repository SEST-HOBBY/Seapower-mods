
#All values shown here are the default values that are used when the parameter is not used

[General]
NumberOfStations=0

# {n} is each of the stations defined in NumberOfStations
#WeaponSystem{} defines which weapon system the weapons are added to, Station{} the default position
Station{n}=WeaponSystem1Station{n}
#Name of Station displayed in the Loadout UI
Station{n}DisplayName={n}
#Position and Rotation are used to overwrite the default position, they are skipped when 0,0,0
Station{n}Position=0,0,0
Station{n}Rotation=0,0,0

#DropOrder defaults to dropping stores by numbering, starting from Station 1
DropOrder=
#Can be manually set
DropOrder=1,5,3,4,2
#or through the keywords 
DropOrder=AlternatingOutToIn // Station1, Station{n}, Station2, Station{n-2}
DropOrder=AlternatingInToOut // reverse of AlternatingOutToIn
DropOrder=Reverse // reverse of default

#Define Submodels that are normally hidden, functions identical to the SubModelsToHide used by normal loadouts
SubModelsToHide=

#If true, hides warning about laser guided bombs
HasLaser=False

#Maximum allowed Asymmetric Moment in Newton meters. Requires AsymmetricMomentFactor set for stations. Disabled when -1
MaxAsymmetricMoment=-1
#Maximum takeoff weight in kg. Disabled when 0
MaxTakeoffWeight=0
#Maximum takeoff weight in kg, used when the home base is not a land unit. Disabled when 0
MaxTakeoffWeightCarrier=0

#Minimum ready up time in minutes, weapon based times get applied ontop of this
BaseReadyUpTime=10
#Maximum ready up time in minutes, for when
MaxReadyUpTime=45
#Cooldown time in minutes
CoolDownTime=60

#Manually define override textures for fuel tanks, uses the same syntax as FueltankTextures in _squadron.ini
FueltankTextures=


#Define which other mods are used for optional weapons and have to be watched for the active state
[ExternalMods]
#{Name} is name used for the mod in this ini, doesnt have to be the mods true Name
#{ID} is modID, check the steam workshop link. Note that might not work correctly for local mods
{Name}={ID}
#Example with defining New Threat Upgrade (https://steamcommunity.com/sharedfiles/filedetails/?id=3364894660) for optional weapons
NTU=3364894660


#For internal sonobuoy launchers
[SonoBuoySystem]
#Hardpoint system used by the sonobuoys
WeaponSystem=WeaponSystem1
#Station position from which to take positions. Set to Station0 to force it being 0,0,0
Station=Station1

#List of manually defined positions and rotations. Defaults to empty list
Positions=
Rotations=

#Used to pull Positions and Rotations lists from the original aircraft file
Definitions=
#Example: Will attempt to pull SonobuoysPositions, SonobuoysRotations, SonobuoysActivePositions and SonobuoysActiveRotations from aircraft file
Definitions=Sonobuoys,SonobuoysActive

#If both Positions/Rotations and Station+Definitions are defined, both will be used, with the manual positions being used first
#If number of rotations is not equal to number of positions, the first rotation value will be used for all positions

#Number of buoys being set up
NumberOfBuoys=0

# {n} is each of the stations defined in NumberOfBuoys, defaults to empty, use either ammunitionFileName or ammunitionFileName,maximumAmount
Buoy{n}=
#Example 1: adds buoy AN/SSQ-53, since maximumAmount is not defined it defaults to the total number of positions
Buoy1=usn_ssq-53
#Example 2: adds buoy AN/SSQ-62, with a maximum of 12 buoys being able to be carried
Buoy2=usn_ssq-62,12
#Buoys that dont have valid INI files (for example being added by mods that are not active) will be skipped, allowing to add modded sonobuoys without having to define their origin in ExternalMods 



#Defines the launchers and adapters used by all weapons
[Launchers]
{LauncherName}File={launcherFileName}
#Example:
MERFile=usn_mer
#Launchers can also have their icon overridden
{LauncherName}IconOverride={imageFileName}
#Example:
TERmodFile=usn_ter
TERmodIconOverride=launcher_ter_3_adapter



#Definition for each Station, with {n} being the station number
[Station{n}]
#Number of options available for this station
NumberOfOptions=0
#{ammunitionName} is Key as defined in this INI, not nessessarily filename 
Option{n}={ammunitionName}

#Defines the amount of asymmetric moment caused by this station. Final moment is (launcher weight + (weapon weight * weapon amount)) * asymmetricMomentFactor
#Usually AsymmetricMomentFactor is the distance from the aircrafts center line to the station in meters
AsymmetricMomentFactor=0
#Can also be set to auto, in which case the AsymmetricMomentFactor is set to the stations X position multiplied by 69. If the station has multiple positions defined, the first is used
AsymmetricMomentFactor=auto

#Mirrors launcher X positions
IsMirrored=False
#When symmetry is enabled, tries to apply the same weapon on the station defined
#Will do nothing if the same weapon setup is not available
SymmetryPartner=

#Blocks certain launcher positions for this station
{launcher}BlockedPositions=
{weapon}{launcher}BlockedPositions=
#Example 1: Blocks the 6th position for the MER launcher
MERBlockedPositions=6
#Example 2: Blocks the 3rd position for the TER launcher when MK-83 weapons are loaded
MK-83TERBlockedPositions=3
#Example 3: Blocks the TER launcher from being used
TERBlockedPositions=all

[Station{n}Blockers]
BlockedStations=
BlockedLaunchersStation{n}=
BlockedWeaponsStation{n}=
BlockedWeaponLaunchersStation{n}=

Weapon{Weapon}BlockedStations=
Weapon{Weapon}BlockedLaunchersStation{n}=
Weapon{Weapon}BlockedWeaponsStation{n}=
Weapon{Weapon}BlockedWeaponLaunchersStation{n}=

Weapon{Weapon}Launcher{Launcher}
WeaponHydra19LauncherTER(3)

BlockedStations=Station1,Station5
BlockedLaunchersStation2=LAU7,MER(1|5|6)
BlockedWeaponLaunchersStation4=AIM-9L:LAU7


