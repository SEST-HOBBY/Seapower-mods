usn_pod_aas-38=AN/AAS-38,NITE Hawk,Special,The AN/AAS-38 NITE Hawk is an American targeting pod developed in the 1980s. It was adapted for the F/A-18 Hornet to provide night and adverse-weather capabilities. This early version does not include an integrated laser designator
usn_pod_aas-38a=AN/AAS-38A,NITE Hawk,Special,The AN/AAS-38 NITE Hawk is an American targeting pod developed in the 1980s. It was adapted for the F/A-18 Hornet to provide night and adverse-weather capabilities. This version incorporates a laser target designator/ranger (LTD/R) subsystem, providing the capability for autonomous delivery of laser- guided munitions against surface targets

