[AmmunitionNames]
iriaf_aim-23b=AIM-23B,Sedjil,AAM,The Sedjil is an Iranian modification of the American MIM-23 HAWK, created due to a lack of spare parts for the AIM-54 during the Iran-Iraq war. It uses the same semi-active radar homing seeker, but with a new hardware interface to communicate with the F-14s AWG-9
iriaf_agm-23=AGM-23,Yasser,Land Attack,The Yasser is an Iranian weapon adding a M117 bomb to the motor section of a MIM-23 HAWK. Both the HAWK's guidance section and control surfaces were removed, making this a relatively inaccurate weapon

usn_walleye2=AGM-62B,Walleye II ER/DL,Guided Bomb,The AGM-62B Walleye II is a television-guided glide bomb which was used by the United States Armed Forces from the 1960s-1990s. Also known as Fat Albert, this weapon had a 2000 lb (900 kg) warhead to take out bridges and similar hard targets
usn_walleye1=AGM-62A,Walleye I ER,Guided Bomb,The AGM-62A Walleye I is a television-guided glide bomb which was used by the United States Armed Forces from the 1960s-1990s. Compared to first models of the Walleye, the ER had extended wings.

usaf_gbu-15=GBU-15(V)2,,Guided Bomb,The GBU-15(V)2 is an infrared-guided glide bomb which was used by the USAF on certain supersonic tactical aircraft, such as the F-111 and F-4E, and was exported to multiple nations. This weapon has an imaging infrared (IIR) seeker, which is highly reliable and can be used in all weather conditions, and also features a datalink capability for retargeting and relaying seeker data to the launch platform.
usaf_gbu-15v1=GBU-15(V)1,,Guided Bomb,The GBU-15(V)1 is a television-guided glide bomb which was used by the USAF on certain supersonic tactical aircraft, such as the F-111 and F-4E, and was exported to multiple nations. Unlike the (V)2, this versions TV seeker is still affected by weather conditions, though it still features a datalink capability for retargeting and relaying seeker data to the launch platform.

usn_agm-65e=AGM-65E,Maverick,Land Attack,The AGM-65E is an American laser-guided air-to-ground standoff weapon. Designed for the USMC, its the only variant of the Maverick with a semi-active laser seeker. To increase effectiveness against fortified installations, the usual 57kg HEAT warhead was replaced with a 140 kg semi armor-piercing one.
usn_agm-65f=AGM-65F,Maverick,Land Attack,The AGM-65F is an American infrared-guided air-to-ground standoff weapon. This variant combines 140kg SAP warhead of the AGM-65E with an imaging infrared seeker optimized against naval targets

usn_agr-20a=AGR-20A,APKWS II,FFAR,The Advanced Precision Kill Weapon System (APKWS) is a kit that equips Hydra 70 unguided rockets with laser guidance. The AGR-20A uses the standard M151 HEDP warhead with a nose fuze.
usn_agr-20f=AGR-20F,APKWS II,FFAR,The Advanced Precision Kill Weapon System (APKWS) is a kit that equips Hydra 70 unguided rockets with laser guidance. The AGR-20F is designed as low-cost defense against UAVs, using a newly designed proximity fuze and modified guidance logic

usn_agm-45=AGM-45B-10,Shrike,ARM,The AGM-45 Shrike is an American anti-radiation missile developed from the fuselage of the AIM-7 Sparrow and a new seeker. It has short range, unimpressive speed, a small warhead, and can only guide on a limited number of radar bands (S, C, X bands), but low cost and light weight means ubiquitous use.
usn_agm-45-9=AGM-45B-9,Shrike,ARM,The AGM-45 Shrike is an American anti-radiation missile developed from the fuselage of the AIM-7 Sparrow and a new seeker. The B-9 variant uses the Mk 49 guidance section targeting only X-Band radars.
usn_agm-45-8=AGM-45B-8,Shrike,ARM,The AGM-45 Shrike is an American anti-radiation missile developed from the fuselage of the AIM-7 Sparrow and a new seeker. The B-8 variant is an experimental development designed to target radars operating in VHF Band
usn_agm-45-7=AGM-45B-7,Shrike,ARM,The AGM-45 Shrike is an American anti-radiation missile developed from the fuselage of the AIM-7 Sparrow and a new seeker. The B-7 variant uses the Mk 37 guidance section targeting only S-Band radars.
usn_agm-45-4=AGM-45B-4,Shrike,ARM,The AGM-45 Shrike is an American anti-radiation missile developed from the fuselage of the AIM-7 Sparrow and a new seeker. The B-4 variant uses the Mk 25 guidance section targeting only C-Band radars.

usn_ssq-53_reverse=AN/SSQ-53,DIFAR,Passive Sonobuoy,The SSQ-53 is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1. Equipped with a drogue tray, this buoy can be deployed from SUU-40/44 Flare Dispenser.

usn_aim-120a=AIM-120A,AMRAAM,AAM,The AIM-120A AMRAAM is an American active radar-homing air-to-air missile. This is the most advanced air to air missile in the US arsenal so far, and is a lighter and much more capable successor to the semi-active Sparrow missile. The AMRAAM achieves its high performance in all remarks via a datalink and active radar seeker, high performance rocket motor for very high flight speed, and a lofting trajectory for maximum kinematic performance to engage both maneuvering and fast flying air targets.
usn_aim-120b=AIM-120B,AMRAAM,AAM,The AIM-120B AMRAAM is an American active radar-homing air-to-air missile. This is the most advanced air to air missile in the US arsenal so far, and is a lighter and much more capable successor to the semi-active Sparrow missile. The AMRAAM achieves its high performance in all remarks via a datalink and active radar seeker, high performance rocket motor for very high flight speed, and a lofting trajectory for maximum kinematic performance to engage both maneuvering and fast flying air targets. The 'B' variant has a more modern software interface allowing for updating the logic of the missile without replacing any hardware, allowing the missile to be reprogrammed for evolving threats despite still having older hardware.

usaf_aim-4d=AIM-4D,Falcon,AAM,The AIM-4D Falcon is an American infrared homing air-to-air missile developed in the 1960s. It was adapted from earlier Falcon variants for use against fighter aircraft, but had a small warhead and required a direct hit due to the lack of a proximity fuse. The long wavelength IR seeker gave it limited all-aspect capability

; usa_bgm-71a=BGM-71A,TOW,Land Attack,The BGM-71 TOW is an American wire-guided anti-tank missile. The weapon is used both from helicopters and from armoured vehicles.
; usa_bgm-71b=BGM-71B,TOW,Land Attack,The BGM-71 TOW is an American wire-guided anti-tank missile. The B model extended the guidance wire length to 3750m and was mainly deployed from helicopters
; usa_bgm-71c=BGM-71C,I-TOW,Land Attack,The BGM-71 I-TOW is an American wire-guided anti-tank missile. The C model, also called Improved TOW, adds a standoff probe improving penetration
usa_bgm-71a=BGM-71B,TOW,Land Attack,The BGM-71 TOW is an American wire-guided anti-tank missile. The weapon is used both from helicopters and from armoured vehicles. It has a relatively short range and a small warhead, which limits its ability against modern armor as it may require multiple shots to kill a single tank.

wp_aa-2-2=AA-2-2,Advanced Atoll 2,IR AAM,The AA-2-2 Advanced Atoll (Vympel K-13M1) is a Soviet infrared homing air-to-air missile. It is derived from the AA-2A Atoll (itself reverse engineered from the AIM-9) but features a new motor and seeker, vastly improving performance.
