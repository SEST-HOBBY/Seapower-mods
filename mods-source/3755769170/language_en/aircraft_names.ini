[---------------------- Aircraft ---------------------]
[usaf_f-2a]
Type=Fighter
Default=F-2A (USAF),F-2A
DefaultDescription=The Mitsubishi F-2 is a multirole fighter that was derived from the General Dynamics F-16 Fighting Falcon, and manufactured by Mitsubishi Heavy Industries and Lockheed Martin for the Japan Air Self-Defense Force with an additional order for the USAF. In order to alleviate the high per-unit cost of the F-2A, the United States Air Force opted to purchase 500 aircraft, with many replacing existing F-16 orders, as a sign of good faith to the Japanese government. Many of these aircraft were sent out to the Pacific to serve alongside their Japanese counterparts, while some ended up in Europe. During the Second Pacific War, the F-2A's of the USAF boasted much greater combat performance than many of the other multiroles in service at the time.
Squadron1=F-2A 108th TFS 'Warwolves',F-2A 
Squadron2=F-2A 13th FS 'Panther Pack',F-2A
Squadron3=F-2A 14th FS 'Samurai',F-2A
Squadron4=F-2A 35th FS 'Pantons',F-2A
Squadron5=F-2A 80th FS 'Headhunters',F-2A
Squadron6=F-2A 36th FS 'The Flying Fiends',F-2A
Squadron7=F-2A 18th FIS 'Blue Foxes',F-2A
Squadron8=F-2A -Patriot-,F-2A

