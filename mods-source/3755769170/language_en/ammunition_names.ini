
[AmmunitionNames]
usaf_agm-158_f-2a=AGM-158B,JASSM,Land Attack,The AGM-158B JASSM is a low observable standoff air-launched cruise missile used by the USAF and various other nations.
usaf_agm-158c_f-2a=AGM-158C,LRASM,ASM,The AGM-158C LRASM is a low observable standoff anti-ship missile made for the US and various other nations.
jp_asm-3=ASM-3,,ASM,The ASM-3 is an advanced standoff anti-ship missile developed by the Japanese for the F-2A.
jp_asm-2=ASM-2,,ASM,The ASM-2 is a Japanese standoff anti-ship missile designed to be launched from the F-2A and F-4EJ.
jp_tank_610_f-2a=2310 l. Droptank
aces_aim-9m_stdm=AIM-9M,Standard Sidewinder,STDM,This AIM-9M has been modded to be able to lock onto surface and air targets.
aces_aim-7m_hvaa=AIM-7M,HV Sparrow,HVAA,This AIM-7M has been modded to be much faster at the cost of its ability to maneuver to hit targets.
aces_agm-88a_lagm=AGM-88A,AG HARM,LAGM,This AGM-88A has been modded to use an active radar seeker to acquire targets.
jp_asm-2_lasm=ASM-2,,LASM,This ASM-2 has been upgraded to have a better minimum and maximum range.
jp_aam-3=AAM-3,,AAM,The Mitsubishi AAM-3 or Type 90 air-to-air missile is a short-range all-aspect air-to-air missile developed by Japan and designed to replace the AIM-9L in Japanese service. 
jp_aam-4=AAM-4,,AAM,The Mitsubishi AAM-4 is a medium range active radar homing air-to-air missile akin to the AIM-120 AMRAAM and replaced the AIM-7 in Japanese service.
usaf_aim-120a_f-2a=AIM-120A,AMRAAM,AAM,The AIM-120A is a medium range active radar homing air-to-air missile and replaced the AIM-7 in American service.
usaf_aim-120b_f-2a=AIM-120B,AMRAAM,AAM,The AIM-120B is an AIM-120A upgraded with new electronics for the radar seeker.