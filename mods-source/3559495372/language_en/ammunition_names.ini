# ---------- Anti-sub  Missilies ----------
usa_agm-114l=AGM-114L,Hellfire,Land Attack,The AGM-114 Hellfire missile is a multi-platform, multi-target American-made missile. Primarily used for anti-tank operations, later versions have also been used for drone strikes and precision strikes on high-value targets.

usa_agm-114k=AGM-114K,Hellfire,Land Attack,The AGM-114 Hellfire missile is a multi-platform, multi-target American-made missile. Primarily used for anti-tank operations, later versions have also been used for drone strikes and precision strikes on high-value targets.

usn_agm-176=AGM-176,Griffin,Land Attack,The AGM-176 is a lightweight, precision-guided munition developed by Raytheon. It can be launched from the ground or air as a rocket-powered missile, or dropped from the air as a guided bomb. It carries a relatively small warhead and is intended to be a precision, low-lethal weapon for use in unconventional warfare.

