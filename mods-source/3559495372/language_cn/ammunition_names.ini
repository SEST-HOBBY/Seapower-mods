# ---------- Anti-sub  Missilies ----------
usa_agm-114l=AGM-114L,地狱火,空对地,AGM-114地狱火导弹是一种多平台、多目标的美国制导弹。主要用于反战车，但后期型号也被用于无人机攻击，精确打击高价值目标等。

usa_agm-114k=AGM-114K,地狱火,空对地,AGM-114地狱火导弹是一种多平台、多目标的美国制导弹。主要用于反战车，但后期型号也被用于无人机攻击，精确打击高价值目标等。

usn_agm-176=AGM-176,格里芬,空对地,AGM -176是由雷神公司研发的轻型精确制导弹药。它可以作为火箭动力导弹从地面或空中发射，也可以作为制导炸弹从空中投下。它携带的弹头相对较小，旨在成为一种用于非常规战争的精确低杀伤武器。

