[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW            // can be AAW, ASuW, ASW

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=850         // meter per second
MaxRange=3000              // in m
GravityFactor=10
CircularErrorProbable=5    // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=2
Power=0.75
ImpactSize=Tiny           // Impact size, can be small, medium, large, verylarge
Penetration=Minor         // can be minor, moderate, heavy, always

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_small
HitWaterSplashClass=TinyWaterSplashes
HitGroundExplosionClass=SmallGroundHitExplosions
