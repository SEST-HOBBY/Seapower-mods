[ ---------------------------- Radars ----------------------------- ]
[GPS_Receiver] #subject to change, hopefully we can mod our own targeting satellites like GPS, GLONASS and Legenda
#GPS receiver to allow for target updating for GPS weapons
#Users:...everyone?
Kind=Radar
Type=Targeting                         // Classes can be "Search", "Targeting"
HasDataLink=True                      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface                     // Role can be "Surface", "Air", "AirAndSurface"
Mode=RadioCommand                      // Can be "Illuminate", "RadioCommand"
RotationDirection=1                    // -1 means left, 1 means right
TargetChannels=5000                      // if applicable number of targets it can track simultaneously
WeaponChannels=5000                       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=60                               // revolutions per minute
MinRange=0                           // min range in km
MaxRange=45000.0                         // max range in km
MinAltitude=0                          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=3000000                      // max altitude in meters, relevant for air, unused for surface
RangeResolution=300000                // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=90                          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=1.0                            // gain in dB on the sensor
Frequency=L-Band                       // frequency band
PeakPower=0.00001                         // output peak power in kW
ModuleType=SmallSensor

[GPS_Link]
Kind=Radar
Type=Targeting    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface              // Role can be "Surface", "Air", "AirAndSurface"
Mode=RadioCommand       // Can be "Illuminate", "RadioCommand"
#CanDetectLandTargets=True  // True means the radar can see ground objects
RotationDirection=1                    // -1 means left, 1 means right
TargetChannels=5000       // if applicable number of targets it can track simultaneously
WeaponChannels=5000       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=60                               // revolutions per minute
#ViewArcs=-180,180|-180,180     // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
#LookDownMultiplier=0.9     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
RPM=60                               // revolutions per minute
MinRange=0.003           // min range in km
MaxRange=45000.0            // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=3000000     // max altitude in meters, relevant for air, unused for surface
RangeResolution=300000   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=90         // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=1.0              // gain in dB on the sensor
Frequency=UHF       // frequency band
PeakPower=0.00001                         // output peak power in kW
ModuleType=SmallSensor

[ ------------------------------ ESM ------------------------------ ]

[AN/ASQ-239Brcd ESM]
Kind=ESM
Gain=10                              // gain of sensor in dB
HasDataLink=True                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=3.0              // in degrees
Frequencies=All                     // Frequencies that current ESM system can detect

[AN/ASQ-239Brcd RWR]
Kind=ESM
Type=RWR
Gain=10                              // gain of sensor in dB
HasDataLink=True                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=3.0              // in degrees
Frequencies=All                     // Frequencies that current ESM system can detect

[ ------------------------------ ECM ------------------------------ ]
[AN/APG-81 OECM]
Kind=ECM
Frequencies=S-Band,C-Band,X-Band,Ku-Band //radar frequency bands the ECM suite can jam
Type=Offensive      // Can be Defensive, Offensive, Universal
MaxRange=90  // max range in km
PeakPower=12.0   //output peak power in kW, more power increase effectivness of offensive ECM jammers
Gain=8        //Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=135.0 //For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChance=0.75       // For Defensive and Universal jammers. Base chance to jam the attacking weapon