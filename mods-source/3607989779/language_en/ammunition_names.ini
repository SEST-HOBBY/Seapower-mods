# ------------------ Bombs -----------------
usn_gbu-31v4= GBU-31(V)4/B,JDAM,Land Strike,The GBU-31(V)4/B Joint Direct Attack Munition (JDAM) is an inertial guided, GPS-aided, glide bomb using a bolt-on guidance and aerodynamic package mated to a BLU-109A/B penetrating bomb with a 240 kg Tritonal warhead.
usn_gbu-53=GBU-53,StormBreaker,Land Strike,The GBU-53 is an air-launched precision-guided glide bomb. The bomb was developed by Raytheon. In the initial bidding, the team of Boeing and Lockheed Martin won the contract for the bomb, but it was shelved for several years due to the Darlene Drewyn corruption case and was not re-bid until September 2005.
usn_gbu-31_qcsk=GBU-31(V)1/B,JDAM Quicksink,Anti-Ship,QUICKSINK is a U.S. Air Force Research Laboratory (AFRL) program that upgrades standard 2,000lb or 500lb Joint Direct Attack Munitions (JDAM) with a specialized seeker, allowing low-cost precision strikes against moving maritime targets. It provides torpedo-like ship-killing capability, typically aiming below the waterline to break a ship's keel.
usn_gbu-38_qcsk=GBU-38(V)1/B,JDAM Quicksink,Anti-Ship,QUICKSINK is a U.S. Air Force Research Laboratory (AFRL) program that upgrades standard 2,000lb or 500lb Joint Direct Attack Munitions (JDAM) with a specialized seeker, allowing low-cost precision strikes against moving maritime targets. It provides torpedo-like ship-killing capability, typically aiming below the waterline to break a ship's keel.
