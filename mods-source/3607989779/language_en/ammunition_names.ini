[AmmunitionNames]
# ------------------ AAM ------------------
usn_aim-120d-3=AIM-120D-3,AMRAAM F3R,AAM,The AIM-120 Advanced Medium-Range Air-to-Air Missile (AMRAAM) (/æmræm/ AM-ram) is an American beyond-visual-range air-to-air missile capable of all-weather day-and-night operations. It uses active transmit-receive radar guidance instead of semi-active receive-only radar guidance. When an AMRAAM missile is launched, NATO pilots use the brevity code "Fox Three".
usn_aim-9xb2+=AIM-9X-3,Sidewinder Blk II+,AAM,The AIM-9X-3 Sidewinder Blk II+ is an American stealth fighters infrared-guided air-to-air missile.
