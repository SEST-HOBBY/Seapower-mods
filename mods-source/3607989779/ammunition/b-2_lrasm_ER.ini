#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# LRASM
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=1020                              // in kg. Used for aircraft
AmmoPoints=4350                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
#SupplyCategory=LRASM                 // For Supply System. Makes that presence of such category is required for replenishment of this weapon
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes
CIWSDefenceBonus=5                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.05                     // Less chance to be intercepted by SAM because of anti-interception maneuvers

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=3  // at what range in nm this unit can be visually identified
IRSignature=0.00001
# Radar related (RCS => radar cross section)
RCS=0.00001
# Sonar related
# Transient
TransientRCS=0.00001                    // Transient visibility on the radar
TransientVisualIdentificationRange=3  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=10                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = High Explosive
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
#6 = Fragmentation

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=77
ImpactSize=Large                      // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

[OnBoardSystems]
ECM=LRASM_ECM

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3.5         // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=False  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
DropDuration=2 
TerrainFollowFlight=True
RequiresTargetToProceed=False           //Will not change its flight phase unles have a target selected by operator
LocalTerminalOnly=False                 // if true connection with a guiding radar will be severed upon entering terminal approach stage
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=50.0                      // Climb angle for initial loft
MaxLoftAlt=3000.0                      // in feet. Maximum altitude for lofting
MaxLoftVelocity=600
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=20.0                    // height in feet for sea skimming TODO:make terrain following
SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=150      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=20             // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=40.0
FinalFlightPhaseDistToTarget=19.0       // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=19.0               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
SupportsBanking=True                   // if the missile will bank when turning
TerminalAlt=20                         // in feet. Weapon will try to get to this altitude at the start of terminal approach
#========================================= Launch stats ============================================================
MaxVelocity=600.0                      // Maximum speed in knots
Acceleration=7.0                       // Acceleration factor
MaxTurnRate=25.0                       // Maximum turnrate in degrees per second
MinLaunchRange=10.0                    // Minimum launch range in nautical miles
MaxLaunchRange=550.0                   // Maximum launch range in nautical miles
MinLaunchAltitude=200               // Minimum launch altitude in feet.
MaxLaunchAltitude=65000               // Maximum launch altitude in feet.
LaunchReliability=99                   // The lower the value, the greater risk of misfire or accident (0...100)
#============================================= Misc ================================================================
#GroupSize=2                            // Indicates that missiles can join into groups
#GroupJoinRange=0.15                      // in miles
#GroupSpacing=0.3                       // in miles. interval between misseles in line
#GroupLeaderAlt=20                    // in feet. altitude of leading missile. Only for FinalFlightPhase
#GroupWingmanAlt=20                  // in feet. altitude of non-leading missile. FinalFlightPhase
#========================================     Seeker     ===========================================================
#Homing
#SeekerGain=130                         // Seeker gain in dB
SeekerFOV=90                       // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=25                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#SecondaryPassiveRadarGuidanceType=Full // Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
#PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
#Frequency=Ku-Band                      // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.90           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.90                    // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SearchMode=1                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
#SearchVelocity=550.0                   // velocity in search mode in knots
#SnakeSearchAngle=15.0                  // going left/right using that angle
#SnakeSearchTurnCycleTime=10.0          // time in seconds it takes for one complete snake cycle (left/right)
ReattackMode=1                         // 0 = None, 1 = Circle, 2 = Drive-around
ReattackCircleDegreesPerSecond=10.0    // degrees per second for circle reattack pattern
LadderParams=0.0,0.0                   // First leg, second leg in yard
SpiralSearchParams=0.0,0.0             // Ceiling, floor in yard
#SelfDestruct
SelfDestructAfterTargetGone=True      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=5.0                  // delay in seconds for self destruction
