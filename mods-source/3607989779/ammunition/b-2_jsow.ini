#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# AGM-154A-1 JSOW Blk II [BLU-111/B 500lb]
Type=Missile                              // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly
Mass=468                               // in kg. Used for aircraft
AmmoPoints=925                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
#SupplyCategory=JSOW                // For Supply System. Makes that presence of such category is required for replenishment of this weapon
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=0.75        // Biggest range in nm at which this unit can be visually identified
IRSignature=0.00000000000001
# Radar related (RCS => radar cross section)
RCS=0.000008
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = High Explosive
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
#6 = Fragmentation

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=25
ImpactSize=Medium               // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

KillProbability=10                  //Base chance to hit
[OnBoardSystems]
ECM=LRASM_ECM

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=4.0                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
TerminalApproachDist=50.35              // in N. miles. At this distance seeker will be turned on.
TerminalDiveDistance=50.35                 // in N. miles.
TerminalVelocity=530
SupportsBanking=True                   // if the missile will bank when turning
Lofted=False                           // If true, the weapon is launched to a high altitude, then dives to reach its target
SeaSkimming=False                      // If true, fly at wavetop altitude during entire flight
FinalFlightPhase=False                  // final flight phase, e.g. terminal pop up
#=========================================  Kinematics  ============================================================
ApplyKinematics=False                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
MaxVelocity=530                        // Maximum speed in knots
MaxTurnRate=35                          // Maximum turnrate in degrees per second
AccelerationTime=0                  // Burn time for initial booster burn
Acceleration=0                      // Gs of acceleration in initial burn
SustainerAccelerationTime=0           // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=0               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=0					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=37000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=300				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=0               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.5
#MaxFlightTime=342               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#======================================== Launch stats ============================================================
MinLaunchRange=2                     // Minimum launch range in nautical miles
MaxLaunchRange=70.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=10000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=55000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#VerticalWobblingStrength=4.0           // amplitude of wobbling
#VerticalWobblingSpeed=1.0              // frequency of wobbling
GroupSize=0
#========================================     Seeker     ===========================================================
CircularErrorRadius=4.0                // Circular error radius in meters
#Homing
#ECCM
CounterMeasuresRejection=100            // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=90                      // The lower the value, the greater risk of spoofing by jamming	(0...100)
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
[Models]
AttachmentPosition=0,0,-0.001
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_mk-84
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_mk-82_mat
AssetBundleMeshHullCollider=usn_mk-82_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/b-2_jsow/
ResourcesRoot=b-2_jsow.obj
ResourcesMesh=b-2_jsow
ResourcesMaterial=b-2_jsow_mat.ini
ResourcesMeshForLaunch=b-2_jsow_dummy
ResourcesMeshCanister=b-2_jsow_dummy
ResourcesMeshSwitchTime=3  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

InFlightEffect=None
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0

HitShipExplosion=effects/explosions/emitters/missile_hit_ship_large
HitAirExplosion=effects/explosions/emitters/bomb_hit_ground_large
HitGroundExplosion=effects/explosions/emitters/bomb_hit_ground_large
HitDefaultExplosion=effects/explosions/emitters/bomb_hit_ground_large
HitWaterSplashClass=SmallWaterSplashes

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

############################################################
