#!alias ammunition/b-2_jsow.ini
[General]
# Does "AGM-154A-2 JSOW" with Anti-Radiation seeker actually exist? Idk..
Type=Missile                              // can be Projectile, Missile, RBU, ASROC, Torpedo
Mass=468                               // in kg. Used for aircraft

[---------- Guidance ----------]
[Guidance]
GuidanceType=4
#========================================     Seeker     ===========================================================
CircularErrorRadius=2.0                // Circular error radius in meters
#Homing
SeekerGain=10                        // Seeker gain in dB
SeekerFOV=45                         // Seeker field-of-view in degrees
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
SeekerPassiveRange=10.0                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
NightVisionLevel=1.0
Zoom=3
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
