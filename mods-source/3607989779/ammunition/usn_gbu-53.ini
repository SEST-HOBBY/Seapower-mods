#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
#GBU-53/B StormBreaker
Type=Missile                              // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly
Mass=93                                // in kg. Used for aircraft
AmmoPoints=150
#SupplyCategory=SDB                // For Supply System. Makes that presence of such category is required for replenishment of this weapon
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.15
MinCameraDistanceBroadside=0.15
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=1  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = High Explosive
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
#6 = Fragmentation

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=13
ImpactSize=Small               // Impact size, can be small, medium, large, verylarge
Penetration=Moderate              // can be minor, moderate, heavy, always

KillProbability=10                  //Base chance to hit
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=4 
InitialFlightPhaseDuration=3.0        // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================				  
TerminalApproachDist=10              // in N. miles. At this distance seeker will be turned on.
TerminalDiveDistance=40                 // in N. miles.
TerminalVelocity=530
SupportsBanking=True                   // if the missile will bank when turning
Lofted=False                           // If true, the weapon is launched to a high altitude, then dives to reach its target
SeaSkimming=False                      // If true, fly at wavetop altitude during entire flight
FinalFlightPhase=False                  // final flight phase, e.g. terminal pop up
#=========================================  Kinematics  ============================================================
ApplyKinematics=False                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
MaxVelocity=530                       // Maximum speed in knots
MaxTurnRate=35                       // Maximum turnrate in degrees per second
AccelerationTime=10                  // Burn time for initial booster burn
Acceleration=10                      // Gs of acceleration in initial burn
SustainerAccelerationTime=440           // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=0               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=0					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=10000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=300				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=0               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
#VelocityBleed=1
#MaxFlightTime=450               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#======================================== Launch stats ============================================================
MinLaunchRange=1.5                     // Minimum launch range in nautical miles
MaxLaunchRange=47.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=9900                  // Minimum launch altitude in feet.
MaxLaunchAltitude=10100                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#VerticalWobblingStrength=4.0           // amplitude of wobbling
#VerticalWobblingSpeed=1.0              // frequency of wobbling
GroupSize=0
#========================================     Seeker     ===========================================================
CircularErrorRadius=1.5  //20.0               // Circular error radius in meters
#Homing
SeekerGain=20                        // Seeker gain in dB
SeekerFOV=135                         // Seeker field-of-view in degrees																															  
SeekerActiveRange=7                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=10.0                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.95          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.9                   // This value substracted from probability of being jammed  (0...1)
CounterMeasuresRejection=95            // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=90                      // The lower the value, the greater risk of spoofing by jamming	(0...100)
#Search params for torpedoes
ReattackMode=1                         // 0 = None, 1 = Circle, 2 = Drive-around
ReattackCircleDegreesPerSecond=10.0    // degrees per second for circle reattack pattern
#SelfDestruct
SelfDestructAfterTargetGone=False

[---------- Mesh definitions----------]
[Models]
AttachmentPosition=0,0,-0.001
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_gbu-12
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_gbu-12_mat
AssetBundleMeshHullCollider=usn_gbu-12_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/gbu-53/
ResourcesRoot=gbu-53.obj
ResourcesMesh=gbu-53
ResourcesMaterial=gbu-53_mat.ini
ResourcesMeshForLaunch=launch
ResourcesMeshSwitchTime=4  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=1

SubModel1=Glas

[Glas]
Mesh=Glas
ResourcesMaterialFolder=aircraft/materials/
Material=cockpit_glass

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=FALSE
InFlightEffect=FALSE
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
#HitAirExplosionClass=SmallGroundHitExplosions
HitGroundExplosionClass=SmallGroundHitExplosions
HitDefaultExplosionClass=SmallGroundHitExplosions
HitWaterSplashClass=SmallWaterSplashes

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637