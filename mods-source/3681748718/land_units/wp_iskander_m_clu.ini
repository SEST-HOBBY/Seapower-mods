[General]
UnitType=LandUnit
LandUnitSubType=SAM

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=10.4                     // in meters
Beam=2.4                       // in meters
Range=300                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Truck
Tag=Ground+Vehicle



[AI]
UnitScoreValue=2               // value for calculation of mission score
Role=Transport

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=3

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #MLRS
Type=Missile
SystemName=SA-N-9
#Sensors
#Animations
#Mount
Mount=Dummy
#Containers
#Containers
NumberOfContainers=2
Container1=Dummy
Container1_Position=-0.0075,0.085,-0.051
Container1_Rotation=-90,0,0
Container2=Dummy
Container2_Position=0.0075,0.085,-0.051
Container2_Rotation=-90,0,0
#Angles
FixVerticalLaunchAngle=90
RestAngles=0
FiringArcs=0,-0
#Loading
Ammunition=wp_9k720_clu
DisplayWeaponsOnSystem=True 
PreloadAmmunition=True
#Effects
#Other
MaxVelocityToFire=0
VIDIncrease=20

