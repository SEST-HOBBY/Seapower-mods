DefaultDescription=Ghost Shark is an Australian extra-large autonomous undersea vehicle developed for the Royal Australian Navy. It carries no crew. In Sea Power its role is to patrol submerged, listen for contacts and share tracks with its task force.\n\nThe bow sonar can listen passively or transmit. A towed array provides a second listening position astern, and an acoustic intercept receiver listens for active sonar. The mast carries optics and electronic support measures (ESM) for detecting radar emissions. Each loadout carries 12 acoustic noisemakers.\n\nThe in-game vehicle is 12 m long, has a submerged top speed of 12 knots and a crush depth of 800 ft (243.84 m). With the Ghost Shark plugin enabled, its battery is rated for 1,000 km submerged at 6 knots from full charge to the 25% reserve. Use the Snorkel command to charge. At periscope depth the mast raises the folded solar panel above the water, then its two leaves open. With the Ghost Shark plugin active, charging requires daylight and both leaves clear of the surface. Stowing folds both leaves before lowering the mast.\n\nChoose one fit in Mission Editor. Default carries two Mk48 ADCAP torpedoes. Sprint4 carries four short-range wire-guided torpedoes. TorpedoEchidna pairs one Mk48 with one Echidna sensor vehicle. Echidna2 carries two Echidnas. Sprint2Echidna carries two Sprint torpedoes and one Echidna. Player-controlled Ghost Shark can launch at its ordered depth at 500 ft or shallower.\n\nMod version 0.6.13
