[General]
# Bofors 40 mm 3P (Pre-fragmented, Programmable, Proximity-fused) for the Bofors 40 Mk4 on the Tridon Mk2.
# Own full definition (no alias), replacing the old WWII-type usn_cal_40mm values (860 m/s, time fuze).
# BAE data sheets: complete round 2.5 kg, pre-fragmented shell 0.975 kg, PBX, 1,012 m/s, gun range 12,500 m,
# 6 fuze modes incl. proximity and gated proximity (air defence) and armour piercing.
Type=Projectile                        // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
Mass=2.5                               // in kg, complete round (BAE)
AmmoPoints=2.5                         // For Supply System
DecalClass=GunImpactsSmall             // referenced in effects/decals.ini
FrontalArea=0.0024
SideArea=1.62
BottomArea=1.62

[Physics]
MuzzleVelocity=1012                    // BAE: 1,012 m/s (3P)
MaxRange=12500                         // BAE: Bofors 40 Mk4 max range 12,500 m
MaxAARange=4000                        // v3: was 8000. Navy Lookout: only accurate enough vs missiles at ~2.5 km; saves the 100 ready rounds
GravityFactor=5
CircularErrorProbable=7                // v2: was 12. PASEO (CEROS 200 function) radar/EO tracking + muzzle velocity measured each shot (estimate, not in the BAE sheets)

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=0                          // blast fragmentation
Power=2.4                              // v5: was 1.6. Test 1: bursts 7-13 m from a helicopter did 0.01-0.07 damage each, 51 bursts to down it
ImpactSize=VerySmall                   // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                   // armour piercing mode exists in the 3P fuze
FuzeProximityDistance=9                // v5: was 12. Bursts closer to the target; real lethal radius ~6.7 m (Navy Lookout). Test 2: HKP-4B downed twice, 6-8 s after the first burst
KillProbability=0.45                   // v2: was 0.3. BAE: 3P optimised against anti-ship missiles; Euromod 57 mm 3P uses 0.55
SmartFuse=True                         // v5: burst at the closest point to the target (when it starts to move away), not at the edge of the fuze distance

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_tiny
ResourcesMaterial=shell_mat_dark_red

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_small_shell
HitAirExplosionClass=SmallFlakExplosions
HitDefaultExplosion=effects/Particle Emitters/impact_small_shell
HitWaterSplashClass=TinyWaterSplashes
