[General]
UnitType=LandUnit
LandUnitSubType=MissileSite
#IsMobile=True                  // left off: outrigger jacks are modelled lowered (firing position)

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=8.2                      // in meters (Scania P310 crew cab chassis)
Beam=2.55                       // in meters
Range=300                       // in miles

ArmorType=None
DamagePoints=3

FrontalArea=8
SideArea=22
BottomArea=20

[Tacview]
Name=Tridon Mk2
Tag=Ground+AntiAircraft

[Physics]
HorsePower=310                 // Scania P310
Mass=17                        // in tons: 4x2 chassis + Bofors 40 Mk4 mount, equipment box and ammunition (estimate)
MaxForwardVelocity=40          // in knots
MaxBackwardVelocity=5.5
Braking=10
TurnRate=10

[AI]
UnitScoreValue=0.25
Role=AAW

[ControlSystem]
Collider=coll_hitbox
Integrity=4

[SensorData]
VisualIdentificationRange=2.5
IRSignature=Small
RCS=Small

[Animations]
NumberOfAnimationReferences=0

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3
# Own sensors: optical sight + PASEO sight on the gun housing, with the CEROS 200 radar/EO director function kept. Search data can also come by datalink from a search radar in the group (e.g. the Giraffe 1X in the swe_mshorad mod).
[SensorSystem1] #EO sight
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.05735,-0.03676
ModuleType=Bridge
Integrity=0

[SensorSystem2] #PASEO - fire-control radar function of the CEROS 200 kept (same sensor system)
Type=Radar
SystemName=swe_ceros200_land     // defined in this mod: systems/sensors.ini
Mount=tr_paseo_yoke
Radar=tr_paseo_head
RestAngles=180,0                 // head level, looking the same way as the stowed barrel
Collider=coll_paseo
[SensorSystem3] #PASEO TV/IR camera and laser rangefinder (CEROS 200 EO function kept)
Type=Visual
SystemName=swe_ceros200_eo       // defined in this mod: systems/sensors.ini (based on Euromod eu_Mirador_Mk1)
Mount=Dummy
MountPosition=0,0.05807,-0.03676   // PASEO head on the turret axis, 3.95 m up
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #Bofors 40 Mk4
Type=Gun
SystemName=swe_bofors40mk4      // defined in this mod: systems/weapons.ini
#Sensors
AssociatedSensors=SensorSystem2,SensorSystem3   // PASEO (CEROS 200 radar + TV/IR function) directs the gun
#Mount
Mount=tr_mount
IsMountRotatable=True
#Containers
ContainerBase=tr_gun
NumberOfGuns=1
Gun1=tr_barrel
AreContainersRotatable=True
#Angles
FiringArcs=-180,180
ElevationArc=-20,80
RestAngles=180                  // travels with the barrel pointing aft
#Loading
AssociatedMagazine=WeaponMagazine_Bofors
#Other
WorksStandalone=True
Collider=coll_turret
ModuleType=CIWS

[WeaponMagazine_Bofors]
NumberOfAmmunitionTypes=1
Ammunition1=swe_cal_40mm_3p_mk4 // Bofors 40 mm 3P, defined in this mod: ammunition/swe_cal_40mm_3p_mk4.ini
Ammunition1_Count=300           // 100 in the mount + 200 stowed (assumption)
SystemGroup=SG_Gun
Collider=coll_hitbox
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
# Truck: "Scania P310 Crew Cab Chassis Truck 2011" by niev (Sketchfab, CC BY 4.0), reduced to 54,000 triangles, own baked texture in M90 splinter camouflage (#404538/#525739/#5D4F44/#383539).
# Added: flatbed, equipment box behind the cab and four lowered outrigger jacks. Crew operates from the crew cab (no command cabin).
# Turret: Euromod Bofors 40 Mk4 model (eu_bofors40mm_turret/gun/barrel). Turret in solid matte #404538, Haze Grey barrel. CEROS 200 removed, PASEO sight on the gun housing. Euromod required.
[Models]
ResourcesFolder=assets/swe_tridon/models/
ResourcesRoot=swe_tridon.obj
ResourcesMesh=tr_body
ResourcesMaterialFolder=assets/swe_tridon/materials/
ResourcesMaterial=tr_body_mat.ini

[Submodels]
Weapons_1=tr_mount
Weapons_2=tr_gun
Weapons_3=tr_barrel
Sensors_1=tr_paseo_base
Sensors_2=tr_paseo_yoke
Sensors_3=tr_paseo_head

[tr_mount]
ResourcesMeshFolder=assets/swe_tridon/models/
RootMesh=swe_tridon.obj
ResourcesMaterialFolder=assets/swe_tridon/materials/
Mesh=tr_mount
Material=tr_turret_mat.ini
Position=0,0.01838,-0.03676      // on the flatbed over the rear axle, 1.25 m up, 2.5 m behind the model centre
Rotation=0,0,0
Scale=1,1,1

[tr_gun]
ResourcesMeshFolder=assets/swe_tridon/models/
RootMesh=swe_tridon.obj
ResourcesMaterialFolder=assets/swe_tridon/materials/
Mesh=tr_gun
Material=tr_turret_mat.ini
Parent=tr_mount
Position=0,0.02088,0            // trunnions 1.42 m above the mount base

[tr_barrel]
ResourcesMeshFolder=assets/swe_tridon/models/
RootMesh=swe_tridon.obj
ResourcesMaterialFolder=assets/swe_tridon/materials/
Mesh=tr_barrel
Material=tr_barrel_mat.ini       // Haze Grey barrel (M90 scheme)
Parent=tr_gun
Position=0,0,0.00588            // 0.4 m forward of the trunnions

[tr_paseo_base]
# Safran PASEO sight (Meshy AI model, reduced to 9,000 triangles, own texture) - replaces the CEROS 200 director.
# Sits on the gun-housing roof behind the gun slot and turns with the turret. Same fire-control function as the CEROS 200 (radar + TV/IR + laser).
# Fixed base ring, 0.65 m across. Whole sight 0.80 m wide, 0.68 m deep, 0.70 m high.
ResourcesMeshFolder=assets/swe_tridon/models/
RootMesh=swe_tridon.obj
Mesh=tr_paseo_base
ResourcesMaterialFolder=assets/swe_tridon/materials/
Material=tr_paseo_mat.ini
Parent=tr_mount
Position=0,0.0333,-0.010      // turret roof 0.0333 above the mount pivot (3.51 m above ground), 0.68 m behind the turret axis
Rotation=0,0,0

[tr_paseo_yoke]
# yoke with the side covers, turns in azimuth (Mount)
ResourcesMeshFolder=assets/swe_tridon/models/
RootMesh=swe_tridon.obj
Mesh=tr_paseo_yoke
ResourcesMaterialFolder=assets/swe_tridon/materials/
Material=tr_paseo_mat.ini
Parent=tr_paseo_base
Position=0,0.00166,0               // top of the base ring, 0.11 m up
Rotation=0,0,0

[tr_paseo_head]
# sensor head with the TV/IR/laser windows, elevates (Radar)
ResourcesMeshFolder=assets/swe_tridon/models/
RootMesh=swe_tridon.obj
Mesh=tr_paseo_head
ResourcesMaterialFolder=assets/swe_tridon/materials/
Material=tr_paseo_mat.ini
Parent=tr_paseo_yoke
Position=0,0.00473,0.000614        // elevation axis 0.32 m above the yoke pivot, 0.04 m forward
Rotation=0,0,0

[---------- Effects ----------]
[Sounds]
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=4

Collider1=coll_hitbox
Collider2=coll_collider
Collider3=coll_turret
Collider4=coll_paseo

[coll_hitbox]
Collider=Box
Position=0,0.0265,0
Rotation=0,0,0
Scale=0.0375,0.053,0.1203        // 2.55 x 3.6 x 8.2 m

[coll_collider]
Collider=Box
Position=0,0.0028,0
Rotation=0,0,0
Scale=0.03,0.005,0.05

[coll_turret]
Collider=Box
Position=0,0.03585,-0.03676
Rotation=0,0,0
Scale=0.036,0.034,0.04

[coll_paseo]
Collider=Box
Position=0,0.05683,-0.03676         // PASEO on the turret roof; centred on the turret axis because it turns with the turret
Rotation=0,0,0
Scale=0.024,0.0103,0.024          // covers the PASEO (0.8 x 0.7 m) wherever the turret points
