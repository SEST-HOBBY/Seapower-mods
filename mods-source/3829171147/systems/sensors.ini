[ ========================================= Sweden - army air defence sensors ========================================== ]

[swe_ceros200_land] # Fire-control director on the Tridon Mk2 - model is now the Safran PASEO on the gun housing, CEROS 200 values kept
#Radar/EO tracker for the Bofors 40 Mk4. Copy of Euromod eu_CEROS-200 (gun guidance, F123B),
#with the range cut to suit a 40 mm gun on land.
Kind=Radar
Type=Targeting                    // Classes can be "Search", "Targeting"
HasDataLink=False                 // local use, feeds the gun on this truck
Role=AirAndSurface
Mode=Illuminate
steerable=True
TargetChannels=1                  // tracks one target at a time
WeaponChannels=0                  // guns need no weapon channels (same as Euromod)
RPM=60
ViewArcs=-181,181|-25.0,85.0
MinRange=0.0
MaxRange=40.0                     // in km
MinAltitude=0
MaxAltitude=30000                 // same as Euromod eu_CEROS-200
RangeResolution=0.8
BeamWidth=1.5                     // Saab data sheet: 1 m Cassegrain dish, 1.5 deg beam
SubClutterVisibility=50           // Saab CHASE processing vs sea-skimmers (multipath), Euromod maximum tier
Gain=41.0
Frequency=Ku-Band
PeakPower=1.5
ModuleType=MediumSensor
FCSolutionGainRate=3.0
FCMinSolution=0.9
FCTracksRounds=False

[swe_ceros200_eo] # TV/IR camera and laser rangefinder (in the PASEO head, CEROS 200 values kept)
#Copy of Euromod eu_Mirador_Mk1 (Saab/Thales electro-optical director). Lets the gun track and fire
#without radar emissions and against targets the radar loses in clutter.
Kind=Visual
Type=Targeting
TargetChannels=1
WeaponChannels=1
UseIRValues=True
VIDRangeMultiplier=2.6
MaxRangeMultiplier=3.6
LookDownMultiplier=0.85
NightVisionLevel=0.70
FCSolutionGainRate=2
FCMinSolution=0.75
FCTracksRounds=False
