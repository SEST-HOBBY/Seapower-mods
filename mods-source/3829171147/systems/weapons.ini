[ ========================================= Sweden - land guns ========================================== ]

[swe_bofors40mk4]
# Bofors 40 Mk4 (40 mm L/70) on the Tridon Mk2. Based on Euromod eu_Bofors_L/70_MkIII.
# Real data (BAE): 300 rds/min, 100+ rounds ready, -20..+80 deg elevation, ~12.5 km range.
MissileInterceptChance=50        // for CIWS: chance to intercept a missile with 0 defence rating
AircraftInterceptChance=70       // for CIWS: chance to hit an aircraft with 0 defence rating
HorizontalDegreesPerSecond=92    // rotation speed horizontally
VerticalDegreesPerSecond=57      // rotation speed vertically
FireRate=300                     // rounds per minute
BurstCount=10                    // v2: 2 s bursts instead of emptying the 100 ready rounds in one go (test 1: the whole mount was fired in ~20 s, then a 4 min reload)
RoundsLoaded=100                 // ready rounds in the mount
ReloadTime=90                    // v3: was 240. Shortened for gameplay - the crew reloads the mount from the truck stowage
RecoilTime=0.18
RecoilStrength=0.00025
MoveToRestPositionTime=10
Effect=effects/weapons/emitters/AK725_fire_emitter
EffectPosition=0,0,0.0393        // muzzle, 2.67 m barrel
SpawnPosition=0,0,0.0393
ModuleType=CIWS
