[plaaf_j-11b]
Type=Истребитель
Default=J-11B,J-11B
DefaultDescription=Начиная с 2000 года, Китай использовал отечественные технологии для модернизации планера Су-27, добившись полной локализации планера, двигателей, авионики и вооружения. В J-11B используются новые композитные материалы для улучшения конструкции планера, снижения веса конструкции и увеличения срока службы. Он оснащен турбовентиляторным двигателем WS-10B "Taihang" отечественного производства. Бортовое оборудование и датчики были модернизированы с помощью отечественной цифровой интегрированной системы бортового радиоэлектронного оборудования, включающей стеклянную кабину пилота, квадруплексную цифровую систему управления полетом по проводам и радар управления огнем с плоской антенной решеткой Type 1493. Основным оружием класса "воздух-воздух" для J-11B являются ракеты с активным радиолокационным самонаведением PL-12 и инфракрасные ракеты с самонаведением PL-8B, а также высокоточные боеприпасы для наземного нападения.
Squadron1=J-11B(16th AB, PLAAF, 'Lions of Helan'),J-11B 
Callsigns=Squadron1,Lion

[plaaf_j-11bg]
Type=Истребитель
Default=J-11BG,J-11BG
DefaultDescription=Начиная с 2017 года, J-11B прошел модернизацию среднего срока службы (MLU) и частичный перезапуск серийного производства. Самолет был оснащен интегрированной авионикой нового поколения и системой управления огнем, включая радар с активной антенной решеткой электронного сканирования (AESA), и может нести ракету с активным радиолокационным самонаведением PL-15 и ракету с ИК-самонаведением PL-10.
Squadron1=J-11BG(16th AB, PLAAF, 'Lions of Helan'),J-11BG 
Callsigns=Squadron1,Lion

