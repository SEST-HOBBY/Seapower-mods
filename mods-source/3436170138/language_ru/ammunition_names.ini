#WIKI
# ------------------ AAM ------------------

plaaf_pl-8b=PL-8B,,AAM,PL-8 - это китайская ракета класса "воздух-воздух" (AAM), созданная на базе израильской AAM Python-3.

plaaf_pl-10=PL-10,,AAM,PL-10 - это ракета класса "воздух-воздух" с инфракрасным наведением малой дальности, разработанная Китаем для истребителей четвертого и пятого поколений. В головке самонаведения ракеты используется передовая технология многоэлементного инфракрасного наведения (IIR), обеспечивающая высокую устойчивость к контрмерам и совместимость с нашлемными системами отображения. Она обеспечивает высокую дальность пуска и высокую перегрузку, а также обладает относительно большой дальностью полета среди инфракрасных ракет малой дальности.

plaaf_pl-12=PL-12,,AAM,PL-12 (китайское: 霹雳-12; пиньинь: Pī Lì-12; букв. "Тандерболт-12", официальное название НАТО: CH-AA-7 Adze) - ракета класса "воздух-воздух" с активным радиолокационным наведением за пределами видимости, разработанная Китайской Народной Республикой. Он считается сопоставимым с американским AIM-120 AMRAAM и российским R-77.

plaaf_pl-15=PL-15,,AAM,PL-15 - это ракета класса "воздух-воздух" с активным радиолокационным наведением средней и большой дальности, разработанная Китаем для истребителей четвертого и пятого поколений. Ракета оснащена двухимпульсным твердотопливным ракетным двигателем и радарной головкой самонаведения с активной антенной решеткой электронного сканирования (AESA), что обеспечивает высокую конечную скорость и отличную устойчивость к средствам радиоэлектронного противодействия.

wp_aa-10c_mi=AA-10C,,AAM,

wp_aa-10d_mi=AA-10D,,AAM,

wp_aa-12_mi=AA-12,,AAM,

wp_aa-11_mi=AA-11,Archer,AAM,Ракета класса "воздух-воздух" Р-73 - это советский/российский тип боевой ракеты класса "воздух-воздух" ближнего радиуса действия, которая в 1990-х годах была одной из самых эффективных в мире боевых ракет класса "воздух-воздух" с инфракрасным наведением.

