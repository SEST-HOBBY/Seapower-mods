#WIKI
# ------------------ AAM ------------------
plaaf_pl-8b=PL-8B,,空对空,霹雳-8近距空空导弹是中国研制的红外格斗空空导弹，由西安东方机械厂大批生产，仿制自以色列怪蛇3导弹。

plaaf_pl-10=PL-10,,空对空,霹雳-10是中国为第四代和第五代战斗机研制的近距红外制导空空导弹。导弹导引头采用多重红外成像制导技术，具有很强的抗干扰能力，支持头盔显示器随动。导弹支持大离轴，大过载发射条件，拥有近距红外格斗弹中较远的射程。

plaaf_pl-12=PL-12,,空对空,霹雳-12是中国人民解放军空军与巴基斯坦空军使用的中程超视距空对空导弹，也是目前解放军服役中仅次于霹雳-15的最新型空战用导弹。已装备在歼-8II，歼-10，枭龙战机和歼-11上。外销版本称“闪电-10”。

plaaf_pl-12a=PL-12A,,空对空,霹雳-12是中国空军装备的中程主动雷达制导空空导弹，装备国产第三代和第四代战斗机。霹雳-12A是其改进型，总体性能约相当于AIM-120C-5空空导弹。

plaaf_pl-15=PL-15,,空对空,霹雳-15是中国为第四代和第五代战斗机研制的中远程主动雷达制导空空导弹。导弹采用双脉冲固体火箭发动机，有源相控阵主动雷达导引头，具备高末端速度和优异的抗电子干扰能力。

wp_aa-11_mi=R-73,,空对空,R-73空空导弹是苏联/俄罗斯一型近距空中格斗导弹，是20世纪90年代世界上性能最好格斗型红外制导空对空导弹之一。

wp_aa-10c_mi=R-27ER,,空对空,该弹是前苏联，俄罗斯自行研制并装备前线战术空军歼击机的新型中远距空空导弹，属于第三、四代空空导弹。E为增程型

wp_aa-10d_mi=R-27ET,,空对空,该弹是前苏联，俄罗斯自行研制并装备前线战术空军歼击机的新型中远距空空导弹，属于第三、四代空空导弹。E为增程型

wp_aa-12_mi=R-77,,空对空,R-77空空导弹是苏联/俄罗斯一型主动雷达制导全向全天候中距空空导弹（MRAAM)



