Variant2=HTMS Taksin 422,Taksin


[tha_cvl_chakri_naruebet]
Type=CVL,Light Carrier
Default=Chakri Naruebet-class,Chakri Naruebet
DefaultDescription=HTMS Chakri Naruebet (911) is the flagship of the Royal Thai Navy, and Thailand's first and only aircraft carrier, although the RTN refers to her as an "Offshore Patrol Helicopter Carrier". Based on the Spanish Navy's Príncipe de Asturias design and constructed by Spanish shipbuilder Bazán, Chakri Naruebet was ordered in 1992, laid down in 1994, launched in 1996, and commissioned into the RTN in 1997. The ship is the smallest functioning aircraft carrier in the world (currently only operates helicopters and drones).
Variant1=HTMS Chakri Naruebet 911,Chakri Naruebet

[tha_aor_chula]
Type=AKL,Fleet Auxiliary
Default=Chula-class,Chula
DefaultDescription=The Chula class (often referred to as the Jula class or Jula II-class) consists of small auxiliary tankers designed for coastal oiler duties within the Royal Thai Navy. The lead ship, HTMS Chula (831), has been a long-serving asset but is currently approaching the end of its operational life.
Variant1=HTMS Chula 831,Chula
Variant2=HMTS Matra 836,Matra

[tha_lst_sichang]
