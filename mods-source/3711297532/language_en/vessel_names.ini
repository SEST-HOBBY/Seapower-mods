Default=Sichang class,Sichang
DefaultDescription=The Sichang class (Type PS700) is a group of two medium tank landing ships (LST) operated by the Royal Thai Navy. Based on a French design, these vessels transport marines, vehicles, and heavy equipment directly onto shores during beach landings or humanitarian missions.
