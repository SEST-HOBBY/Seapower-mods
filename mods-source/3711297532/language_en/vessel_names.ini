[tha_pt_sattahip]
Type=PB,Patrol Boat
Default=Sattahip-class,Sattahip
DefaultDescription=The Sattahip-class entered Thai service in the early 1980s to strengthen coastal security. Modestly armed with a medium gun and light weapons, these vessels were designed for endurance and reliability rather than speed, making them well-suited for routine patrol, surveillance, and maritime security duties in the Gulf of Thailand.
Variant1=HTMS Sattahip 521,Sattahip 
Variant2=HTMS Klongyai 522,Klongyai 
Variant3=HTMS Takbai 523,Takbai 
Variant4=HTMS Katang 524,Katang 
Variant5=HTMS Thepa 525,Thepa
Variant6=HTMS Thai Muang 526,Thai Muang 


[tha_pt_hua_hin]
Type=PB,Patrol Boat
Default=Hua Hin-class,Hua Hin
DefaultDescription=The Hua Hin class is a series of three patrol gunboats operated by the Royal Thai Navy (RTN). Designed for surveillance of Thailand's Exclusive Economic Zone (EEZ) and maritime law enforcement, these vessels were commissioned between 2002 and 2004. They are considered large patrol boats or offshore patrol vessels (OPV) based on a modified Khamronsin-class design.
Variant1=HTMS Hua Hin 541,Hua Hin
Variant2=HTMS Klaeng 542,Klaeng
Variant3=HTMS Si Racha 543,Si Racha


[tha_pt_chonburi]
Type=PB,Patrol Boat
Default=Chonburi-class,Chonburi
DefaultDescription=The Chonburi class patrol craft were built by the Italian shipyard, Cantiere Navale Breda, and were designed to be fast and maneuverable, these ships were armed with a variety of weapons, including two 76 mm guns, one 40 mm/70 caliber gun, and two 12.7 mm machine guns.
Variant1=HTMS Chonburi 331,Chonburi 
Variant2=HTMS Songkla 332,Songkla


[tha_ptg_prabrarapak]
Type=PTG,Missile Boat
Default=Prabrarapak-class,Prabrarapak
DefaultDescription=The Prabparapak-class is a group of three missile-armed fast attack craft (FAC) operated by the Royal Thai Navy. Built in the 1970s by Singapore Shipbuilding & Engineering, they are based on the Sea Wolf class design from Singapore.
Variant1=HTMS Prabrarapak 311,Prabrarapak
Variant2=HTMS Hanhak Sattru 312,Hanhak Sattru
Variant3=HTMS Suphairin 313,Suphairin


[tha_ptg_ratcharit]
Type=PTG,Missile Boat
Default=Ratcharit-class,Ratcharit
DefaultDescription=The Ratcharit class consists of three fast attack missile craft (FAC-M) that served in the Royal Thai Navy (RTN) for over 40 years. Built in Italy by Cantiere Navale Breda, these 270-ton vessels were designed to provide potent anti-surface strike capabilities in coastal waters using MM38 Exocet missiles.
Variant1=HTMS Ratcharit 321,Ratcharit
Variant2=HTMS Witthayakom 322,Witthayakom
Variant3=HTMS Udomet 323,Udomet


[tha_fs_tapi]
Type=FS,Corvette
Default=Tapi-class,Tapi
DefaultDescription=The Tapi-class corvettes marked a major step forward in the Royal Thai Navy’s evolution from coastal defence to a more capable, multi-role maritime force.
Built in the United States in the early 1970s, these ships were based on a patrol frigate design and tailored for Thailand’s growing need to secure its Exclusive Economic Zone and maintain a sustained presence in the Gulf of Thailand.
Variant1=HTMS Tapi 431,Tapi
Variant2=HTMS Khirirat 432,Khirirat


[tha_fs_khamronsin]
Type=FS,Corvette
Default=Khamronsin-class,Khamronsin
DefaultDescription=The Khamronsin-class corvettes are three corvettes constructed for the Royal Thai Navy in the late 1980s. Based on a British design, all three ships were built in Thailand. A fourth vessel, constructed to a modified design, was built for the Thai Police and was the first to enter service in 1992. The three Khamrosin-class corvettes commissioned in 1992 and remain in service.
Variant1=HTMS Kamronsin 531,Kamronsin
Variant2=HTMS Thayanchon 532,Thayanchon
Variant3=HTMS Longlom 533,Longlom

[tha_fs_ratanakosin]
Type=FS,Corvette
Default=Ratanakosin-class,Ratanakosin
DefaultDescription=The Ratanakosin-class corvettes are a class of two corvettes based on the Saudi Arabian Badr-class design that were built for the Royal Thai Navy in the 1980s. Constructed by Tacoma Boatbuilding Company in the United States, a third was planned to be built in Thailand but was canceled before construction could begin. The Ratanakosin class is used as flagships for squadrons of fast attack craft.
Variant1=HTMS Ratanakosin 441,Ratanakosin
Variant2=HTMS Sukhothai 442,Sukhothai


[tha_ff_cannon]
Type=FF,Frigate
Default=Cannon-class,Cannon
DefaultDescription=Forming the backbone of the Royal Thai Navy in the 1960s, these ex-American escorts—drawn from the Cannon-class destroyer escort and Tacoma-class patrol frigate—provided Thailand with its first true multi-role surface combatants.
Variant1=HTMS Pin Klao,Pin Klao
Variant2=HTMS Prasae,Prasae
Variant3=HTMS Tachin,Tachin


