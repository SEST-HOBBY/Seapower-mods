DefaultDescription=HTMS Makut Rajakumarn is a frigate operated by the Royal Thai Navy. The ship was built by Yarrow Shipbuilders in Glasgow, Scotland 1971. The ship re-entered service in 1988 after being modernised and is currently in service as a training ship.
Variant1=HTMS Makut Rajakumarn 433,Makut Rajakumarn


[tha_ff_knox_84]
Type=FF,Frigate
Default=Phutthayotfa Chulalok-class,Phutthayotfa Chulalok
DefaultDescription=In the Royal Thai Navy (RTN), the Knox-class frigates—locally designated as the Phutthayotfa Chulalok-class—served as the fleet's primary anti-submarine warfare (ASW) backbone for over two decades. It carried the AB-212 helicopter, which required the hangar to be enlarged.
Variant1=HTMS Phutthaloetla Naphalai FFG 461,Phutthaloetla Naphalai
Variant2=HTMS Phutthayotfa Chulalok FFG 462,Phutthayotfa Chulalok


