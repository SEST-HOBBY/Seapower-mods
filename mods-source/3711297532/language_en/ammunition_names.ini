# ------------------ RBU ------------------
mm_bas_sb=BAS SB,,Depth Charge Mortar

rn_hedgehog_178mm=Hedgehog 178mm,,ASW Mortar,The 178 mm Hedgehog spigot bomb was a compact, contact-fuzed anti-submarine projectile designed to destroy submarines through direct hull impact rather than pressure effects. Each bomb contained a relatively small high-explosive charge compared to depth charges, but its contact-only fuze ensured that any detonation indicated a confirmed hit.

# --------------- Torpedoes ---------------

usn_mk15=MK15,,ASuW Torpedo,US 533mm steam-driven straight-running torpedo designed for destroyer surface combat, offering high speed or long-range settings but no guidance.

wp_45-36an=45-36AN,,ASuW Torpedo,The 45-36AN is a Soviet aviation torpedo for early jet bombers like the IL-28T—short-ranged, unguided, and obsolete by the Cold War, but still deadly when delivered correctly.

wp_45-54vt=45-54VT,,ASuW Torpedo,The 45-54VT is a parachute-retarded Soviet aviation torpedo for early jet bombers like the IL-28T—short-ranged, unguided, and obsolete by the Cold War, but still deadly when delivered correctly.It could be dropped from as high as 33,000 feet (10,000 m)

wp_rat-52=RAT-52,,ASuW Torpedo,The RAT-52 is a rocket-assisted air-dropped torpedo that uses a brief booster phase to enable medium- and high-altitude release before entering the water and running straight at preset speed and depth against surface targets.

ger_sut=SUT,,Torpedo,German-designed 533mm dual-purpose heavyweight torpedo. Developed as an advanced combination of the SST4 and DM2 designs, the SUT features a highly silent electric propulsion system, wire-guidance, and combined active/passive acoustic homing. Capable of hunting both deep-diving submarines and surface vessels, it was licensed and manufactured domestically by Indonesia to serve as the primary armament for its Cakra-class submarine fleet.

ita_blk_shark=Black Shark,Black Shark,Torpedo,The Black Shark Torpedo is a state-of-the-art, 533 mm heavyweight weapon developed by Leonardo's underwater systems division for cutting-edge submarine warfare. Operating as a wire-guided, dual-purpose weapon, it is engineered to destroy both surface vessels and submerged targets at extreme ranges up to 50 kilometres.

