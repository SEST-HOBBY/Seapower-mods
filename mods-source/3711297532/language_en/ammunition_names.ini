# ------------------ SAM ------------------

fr_mistral=Mistral,Simbad,SAM,The Mistral is a high-performance infrared homing surface-to-air missile designed for short-range air defence. On the Ahmad Yani-class, it is deployed from the Simbad twin-launcher to provide a potent "fire-and-forget" shield against agile aircraft, helicopters, and incoming cruise missiles.

# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------

wp_as-1=AS-1,Kennel,ASM,The AS-1 Kennel (KS-1 Komet) was an early Soviet air-launched anti-ship missile derived from German wartime technology. Using aerodynamics derived from the Mikoyan-Gurevich MiG-15, it resembled a scaled-down MiG-15 with the cockpit and undercarriage removed. Uses inertial guidance with a terminal active-radar seeker and carries a heavy high-explosive warhead. Large, slow, and easy to detect, but capable of delivering a powerful strike against surface ships in the 1950s–60s era.

plan_yj-82=YJ-82,C-802,ASM,The YJ-82 (C-802) is a sub launched SSM, featuring a turbojet engine that significantly extends its range. Roughly comparable to later Exocet variants and early Harpoon models, the missile cruises at medium altitude before descending to a low sea-skimming attack profile of approximately 5–7 meters, using active radar homing in the terminal phase.

plan_yj-83=YJ-83,C-802,ASM,The YJ-83 (C-802) is an improved development of the earlier YJ-8, featuring a turbojet engine that significantly extends its range. Roughly comparable to later Exocet variants and early Harpoon models, the missile cruises at medium altitude before descending to a low sea-skimming attack profile of approximately 5–7 meters, using active radar homing in the terminal phase.

fr_ss12=SS.12,,SSM,The SS.12 is a command-guided, short-range SSM of French origin. This is an upgraded SS.11 ATGM, with a longer motor and significantly larger warhead, and can pose a serious threat to boats as well as small ships.


