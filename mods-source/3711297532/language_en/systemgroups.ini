QCU-2=QCU-2 Sonar|QCU-2 Sonar An Italian 1950s hull-mounted medium-frequency active sonar used on Albatros/Pattimura-class corvettes, providing short-range submarine detection with limited bearing accuracy and weak passive performance, intended to cue Hedgehog and depth-charge attacks rather than precise target tracking.

Nav_Radar=Navigation radar|Common surface search radar usually found on civilian vessels. Some military ships are also equipped with it.
GMSR=Surface search radar

RPB-4=RPB-4|RPB-4 (NATO: Rim Sight) is an improved Soviet ground-mapping radar used for radar-guided bombing and navigation cueing against large surface targets. Provides moderate-range target recognition in poor visibility.

Rubidy‑MM=Rubidy‑MM|Rubidy‑MM (NATO: Bee Hind) is a Soviet X‑band missile guidance radar fitted to Tu‑16KS Badger aircraft for anti‑ship strike operations. It provides radio‑command mid‑course guidance for KS‑1 Kometa missiles, cueing them toward large surface targets prior to autonomous terminal homing.

Rubidy‑MM_FCR=Rubidy‑MM_FCR|Fire control mode of "Rubidy‑MM" (NATO Reporting name: Bee Hind) radar that tracks radio-command missiles.

SPS-1_Jammer=SPS-1_Jammer|Early Soviet self-protection noise jammer providing limited jamming against fire-control radars. Narrow-band and low effectiveness, intended to complicate radar tracking rather than defeat guided weapons.

Snoop_Plate=Snoop Plate|"Flag" (NATO Reporting name: Snoop Plate) is a search radar carried by the Foxtrot class submarines.

MG-11=MG-11 "Tamir-11"|The MG-11 "Tamir-11" (NATO Reporting name: Stag Hoof) is a high-frequency active searchlight sonar used for target detection and fire-control on early Soviet submarines before the advent of integrated sonars.

MG-10=MG-10 "Feniks"|The MG-10 "Feniks" (NATO Reporting name: Trout Cheek) is a medium-frequency passive sonar equivalent to the wartime German 'Balkon-gerät' and the first Soviet system to use a cylindrical array. It was used on early Soviet submarines before the advent of integrated sonars.

Stop_Light_A=Nakat ESM|The Nakat suite (NATO Reporting name: Stop Light A) is an early Soviet ESM system found on the first generation of Soviet submarines, and is mostly just a radio intercept system to detect search radar emissions in low light conditions, although it does have some ability to monitor surface groups over the horizon.

Quad_Loop=Quad Loop HF/DF|The Quad Loop HF/DF set is a submarine-mounted radio intercept and direction-finding system to determine bearing and power of emitted HF radio signals at extremely long range.

CWS-1=CWS-1|The CWS-1 is a basic S-band naval air and surface warning radar providing coarse detection without tracking or weapon guidance.

NWS‑1=NWS‑1|The NWS‑1 is an early naval navigation and surface search radar used on light escorts and corvettes. It provides short‑range surface detection in azimuth and range for navigation and general surface awareness.

RDR-1E=RDR-1E|The RDR-1E is an X band airborne weather radar, which was widely used on commercial jet aircrafts from this era. It was developed in 1964.

LW-02=LW-02|LW-02 is a Dutch long range air surveillance radar operating in the L band. The LW-02 was exported to many countries, beginning with Sweden, later including Australia, Netherlands and Germany.

LW-03=LW-03|The LW-03 was developed in the late 1950s as a long-range air surveillance radar operating in the L band. It is a modernized version of the LW-02 with improved anti-jamming characteristics and uses the same antenna.

LW-08=LW-08|The LW-08 is a Dutch long-range air surveillance radar operating in the L band. Introduced during the 1970s, it offers significantly improved detection range and electronic counter-countermeasures over the earlier LW-02 and LW-03, and was widely fitted to Dutch and export warships.

DA-05=DA-05|The Indonesian Ahmad Yani-class frigates (formerly the Dutch Van Speijk-class) use the Signaal DA-05 medium-range radar for air and surface surveillance, providing target detection and reporting to both gun and missile fire-control directors.

HSA_M44=HSA M44|The Indonesian Ahmad Yani-class frigates (formerly the Dutch Van Speijk-class) utilize the dual HSA M44 director configuration to manage their short-range seacat air defense systems.

HSA_M45=HSA M45|The Indonesian Ahmad Yani-class frigates (formerly the Dutch Van Speijk-class) retain the HSA M45 gun directors to provide radar and optical fire-control for surface and air targets, guiding the ships’ primary gun armament.

DSQS-21C=DSQS-21C Sonar|DSQS-21C Sonar A German-designed hull-mounted medium-frequency active and passive sonar, optimized for corvettes and light frigates. It provides reliable panoramic search and attack capabilities in littoral environments, offering better resolution and signal processing than older Cold War systems to support modern anti-submarine warfare and torpedo warning.

AWS-4=AWS-4 Radar|AWS-4 Radar A British late-1970s naval S-band 2D search radar designed for lightweight installation on patrol craft and corvettes. It provides dual-role surface and low-level air surveillance with an instrumented range of 60 nautical miles, offering reliable target designation for weapon systems while remaining compact enough for small hulls with limited mast capacity.

AN/APG-68=AN/APG-68 Radar|The AN/APG-68 is an airborne pulse-Doppler fire control radar designed by Westinghouse (now Northrop Grumman) primarily for the General Dynamics/Lockheed Martin F-16 Fighting Falcon (specifically Block 30, 40, and 50/52 variants). Introduced in 1981 to replace the older AN/APG-66, this X-band mechanically scanned system drastically improved the aircraft's multi-role capabilities by introducing greater detection ranges, sharper resolution, and more diverse tracking modes.

EL/M-2032=EL/M-2032 Radar|A highly cost-effective, battle-proven mechanical pulse-Doppler radar optimised for lightweight fighters to deliver balanced look-down tracking and mid-range engagement capabilities.

SO-8=SO-8|The SO-8 radar is a World War 2 surface search VHF radar designed for use on small ships.

SA Radar=SA-Radar|The SA radar is a World War 2 early VHF radar used for basic surface and air detection by destroyer escorts and larger ships.

SCANTER-6002=SCANTER-6002|Terma SCANTER 6002 advanced solid-state 2D radar used on Philippine Tarlac-class LPDs

MW-08=MW-08|Thales MW08 3D multi-beam target acquisition radar used on Indonesian Makassar-class LPDs and Diponegoro-class corvettes

