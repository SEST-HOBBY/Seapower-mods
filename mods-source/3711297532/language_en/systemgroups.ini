130mm_B-2LM=130mm B-2LM|130mm B-2LM|The 130mm B-2LM is a Soviet two-gun naval artillery turret, based on the WW2 130mm "B-13" gun. The "B-2LM" was installed on several Soviet Navy ships, including the destroyer leader Tashkent, the Ognevoy-class destroyer, and the Skory-class destroyer.

QF47_Dual=Twin QF 4.7"|The QF 4.7" was the standard Royal Navy dual-purpose gun during much of the Cold War. This mounting houses twin guns.

76mm_SMP-3=76mm SMP-3|76mm SMP-3|The 76mm/L62 SMP-3 is a single barrel, medium caliber, dual purpose automatic naval cannon designed and produced in the 1950s by the Italian company Stabilimenti Meccanici di Pozzuoli, of Naples, offering better performance than the existing 3”/50 Mk.27 or Mk.33 of the United States.

NR-30=30mm Cannon|NR-30 30mm Autocannon|The Nudelman–Richter NR-30 is a 30 mm autocannon fitted to Soviet fighters such as the MiG-19 and MiG-21F-13. Firing high-explosive and armor-piercing shells at high muzzle velocity, the NR-30 delivers excellent short-burst lethality against aircraft and light targets, though with limited ammunition capacity.

HEDGEHOG-mk10=HEDGEHOG Mk10

Sinbad=Sinbad launcher

Bofors57mm=Bofors 57mm Gun|Bofors 57mm Gun|Single-barrel 57 mm L/70 automatic naval gun used for dual-purpose surface and air-defence roles.

37mm_Type76A_Dual=37mm Type76A Dual
37mm_Type76A=37mm Type76A
30mm_Emerlec=30mm Emerlec
Breda_30mm=Breda 30mm
Bushmaster_Mk38Mod0=Bushmaster Mk38 Mod0 Autocannon
DS30B=MSI 30 mm Autocannon
DS30M=MSI 30 mm Automated Cannon

Type_730=Type 730 CIWS|H/PJ-12|The H/PJ-12 is a seven-barrel 30mm Close-In Weapon System (CIWS) deployed across the PLAN's major surface combatants. This fully autonomous system features a Gatling-style rotary cannon firing APFSDS rounds at 5,800 rpm, with an 80-degree/second traverse capability. Equipped with integrated electro-optical sensors, laser rangefinder, and dedicated H/LJP-349 fire control radar, it provides terminal defense against supersonic anti-ship missiles while maintaining secondary capability against aircraft and small surface targets.

Hedgehog=Hedgehog Launcher|Hedgehog Launcher|The Hedgehog Launcher is a world war 2 era allied depth charge mortar for anti submarine use.
K-Gun_Left=K-Gun|K-Gun|The K-Gun is a ww2 era mortar designed to launch depth charges at a safe distance and a large spread around a ship.
K-Gun_Right=K-Gun|K-Gun|The K-Gun is a ww2 era mortar designed to launch depth charges at a safe distance and a large spread around a ship.

