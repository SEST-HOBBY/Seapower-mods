Description=[Thailand: The Siam Shield]

Thailand: The Siam Shield stands at the crossroads of Southeast Asia—where regional conflict, global power, and national sovereignty intersect.

From the early Cold War through to the modern era, the Royal Thai Navy and Royal Thai Air Force maintained a constant presence over the Gulf of Thailand, safeguarding vital sea lanes and coastal approaches. While wars raged in neighbouring states, Thailand remained a frontline ally and strategic anchor—balancing influence, stability, and defence.

The Siam Shield represents this enduring role.

This collection brings together decades of Thai naval and air power, from post-war rebuilding in the 1950s, through the heightened tensions of the Vietnam War, and into the modernisation efforts of the late 20th century.

Across multiple eras, players will command a force built not for domination—but for control. Patrol the coastline, intercept emerging threats, and project air power over contested waters.

This is not a war of expansion.

This is the defence of the Gulf.




