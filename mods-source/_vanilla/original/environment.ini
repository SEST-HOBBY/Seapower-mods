############################################################
# General settings valid for all day/night conditions
############################################################

[General]
SkyBlendingUpdateTimer=60.0  // means every x seconds the sky blending will be updated
CelestialUpdateTimer=2.0    // means every x seconds the celestial positions will be updated
// Fog
SubmergedFogColor=10,46,60,255
SubmergedFogDensity=0.2
FogFallOffSubmerged=-3.0
FogFarClipSubmerged=10.0
SkyAtlasTexture=environment/sky/Sky_Atlas_Rework
SkyAtlasOvercastTexture=environment/sky/Sky_Atlas_Overcast

# Post Processing Color Filter
PostProcessingSurface=environment/lut/Vintage 12
PostProcessingUnderwater=environment/lut/Blockbuster 6
# Post Processing Color Correction
ACMinBlendSunAngle=-12
ACMaxBlendSunAngle=-2
ACBlendAmountNight=1
ACBlendAmountDay=0.5
ACExposureNight=0.6
ACExposureNightLight=0.8             // for "Brighter night" mode
ACExposureDay=0.75
ACExposureUnderwaterFadeEnabled=True
ACExposureUnderwaterFadeOutStart=20  // where the underwater exposure fade out starts in meters
ACExposureUnderwaterFadeOutEnd=400   // where the underwater exposure fade out ends in meters
ACExposureUnderwaterMinValue=0.2     // min exposure value

############################################################
# Ocean
############################################################
[Ocean]
OverlayHeightMaskTexture=environment/ocean/OceanOverlayHeightMask
OverlayNormalMaskTexture=environment/ocean/OceanOverlayNormalMask
OverlayFoamMaskTexture=environment/ocean/OceanOverlayFoamMask

############################################################
# Environmental sounds
############################################################

[Sounds]
LowPassCutOffFrequency=1000.0  // frequency for low pass filter when going under water
# low pass resonance quality (1...10): Determines how much the filter’s self-resonance is dampened.
# Higher lowpass resonance quality indicates a lower rate of energy loss,
# that is the oscillations die out more slowly.
LowPassResonanceQuality=1.0

OceanWavesAudioClip=audio/environment/Sea_Waves_Big_10sec_loop_stereo
OceanWavesAudioRollOff=Logarithmic
OceanWavesAudioDistance=1,100
OceanWavesAudioVolume=0.2
UnderWaterAudioClip=audio/environment/Underwater
UnderWaterAudioRollOff=Logarithmic
UnderWaterAudioDistance=1,100
UnderWaterAudioVolume=0.5

############################################################
# Sonar environment related
############################################################
[Sonar]
AbsorptionFactor=0.5       // in dB/nm
MinDepthForConvergenceZones=3000.0 // min depth in feet for a convergence zone to appear
ConvergenceZoneDist1=30.0  // in nm
ConvergenceZoneGain1=35.0  // in dB
ConvergenceZoneDist2=60.0  // in nm
ConvergenceZoneGain2=35.0  // in dB
ConvergenceZoneWidth=10.0  // in nm
SofarAxisDepthM=800.0      // depth of SOFAR channel axis in metres (800m = typical North Atlantic temperate)
CZDepthPenaltyMaxDB=7.5    // max dB penalty per participant (source or receiver) when at the surface; 0 at SOFAR axis
CZPassiveGainReduction=8.0  // dB off the peak CZ gain for passive listening (active uses CZActiveGainReduction)
#MinXLayerAttenuation=10.0  // minimum cross layer attenuation in dB
#MaxXLayerAttenuation=20.0  // maximum cross layer attenuation in dB
MinXLayerAttenuation=6.0    // minimum cross layer attenuation in dB
MaxXLayerAttenuation=12.0   // maximum cross layer attenuation in dB
MachineryLineRatioDB=6.0         // machinery tonal above the machinery broadband spectrum level (dB/Hz), unrafted
MachineryLineRatioPerGenDB=2.2   // line-to-continuum ratio lost per rafting generation
MachineryLineRatioMinDB=-5.0     // floor on that ratio
BBReflectionLoss=3.0             // seafloor reflection loss (dB at MF) on the bottom-bounce path below the critical angle
BBCriticalAngleDeg=15.0          // grazing angle above which BB reflection loss grows
BBReflectionLossSlopeDBPerDeg=0.15 // extra BB reflection loss per degree above the critical angle
BBMinDepthM=152.0                // min water depth (m) for a bottom-bounce path (layer-forming depth)
BBMaxGrazingDeg=45.0             // steepest bottom-bounce grazing angle (D/E steering limit)
BBReverbRejection=10.0           // active BB: Doppler rejection of competing bottom reverb (dB)
ShadowRayRadiusKm=30.0           // ray curvature radius c/|g| (km) below the layer; sets the direct-path horizon (main-thermocline gradient ~0.05/s)
ShadowRampDBPerNM=8.0            // direct-path loss per NM past the refraction horizon (MF; LF x0.6, HF x1.5), capped at ShadowMaxPenaltyDB
XLayerSteepAngleDeg=10.0    // direct-path grazing angle (deg) where layer crossing falls to the bounce-path fraction
MinDepthForLayerAppearance=500.0  // min depth in feet for a layer to appear
# modifiers
BaseAmbientOceanNoise=60         // in dB
CavitationNoise=30.0             // in dB when cavitating
PerSeaStateNoise=5.0             // in dB per sea state (0...8)
RainNoise=15.0                   // in dB additional rain noise
SurfaceInterference=100.0        // in dB surface level interferece between two surface contacts
SurfaceInterferenceDepth=40.0    // in feet, max depth for calculating surface interference
NbBaseGainDB=10.0                // narrowband bin-vs-band processing gain off the tonal noise floor
NbPerTierGainDB=1.0              // extra narrowband gain per SignalProcessing tier
TowedFlowNoiseReductionDB=6.0    // own-ship flow noise cut for towed arrays
TonalHarmonicRolloffDB=3.0       // level drop per harmonic step of the propeller blade-rate family
MachineryHarmonicRolloffDB=1.5   // level drop per harmonic step of the machinery comb (out to ~500 Hz)
MachinerySecondHarmonicDB=2.0    // extra level on the machinery 2nd harmonic (2x supply frequency)
ElectricDriveGridLineDeficitDB=10.0 // grid-line drop on battery/AIP (DC propulsion motor)
DieselFiringFreqHz=100.0         // diesel firing-rate line replacing the grid line while diesels run
GearMeshTeeth=150.0              // bull-gear teeth: gear-mesh line = shaft rate (speed/6 Hz) x teeth
GearToneOffsetDB=20.0            // gear-mesh line level below broadband base noise at 10 kts
GearToneSpeedSlopeDB=40.0        // gear-mesh level slope per decade of speed
MachineryKneeHz=300.0            // machinery broadband: flat to this knee, -6 dB/octave above (unrafted)
RaftingKneeFactor=0.8            // machinery knee x this per rafting generation (rafting strips higher frequencies first)
FlowKneeHz=200.0                 // flow-noise broadband knee (flat below, -6 dB/octave above)
CavitationPeakOnsetKHz=5.0       // cavitation hump peak at inception
CavitationPeakHeavyKHz=1.0       // cavitation hump peak when heavy
TonalCutoffEdgeDBPerOctave=12.0  // roll-off below a sonar's lowest tonal frequency (its SonarFrequency)
VlfNoiseSlopeDBPerDecade=25.0    // ambient rise below the VLF knee (turbulence/microseisms)
VlfNoiseKneeHz=20.0              // frequency below which that rise starts
TonalCombineFactor=5.0           // tonal lines combine as factor*log10(sum 10^(SE/factor)); 5 = incoherent, 10 = power sum, 0 = strongest
ShallowBounceCapRefDepthM=550.0  // bounce-loss cap grows as sqrt(ref/depth) in shallower water (0 = flat cap)
ModeCutoffLossPerKmDB=3.0        // max extra dB/km below the shallow-water low-frequency cutoff (0 = off)
BottomSoundSpeed=1700.0          // seabed sound speed (m/s) setting that cutoff

# The following are variable:
# Floe Ice
# Xlayer Attenuation
# Surface Duct

# HEAT MAP:
# AmbientBaseNoise=75.0      // in dB

############################################################
# Day/Night Lighting Conditions
############################################################

############################################################
# Night < -12 Degrees Elevation
############################################################

[Night]
MinSunAngle=-60
MaxSunAngle=-12

// Ocean
ReflectionTint=255,255,255,255
ReflectionIntensity=0.75
FoamColor=148,159,195,255

// Fog
SurfaceFogColor=40,46,54,255
FogFallOffSurfaced=1.0
FogFarClipSurfaced=1250.0

// Sunlight
SunLightIntensity=0
SunFlareIntensity=0

// Moonlight
MoonLightIntensity=0.15
MoonFlareIntensity=1.0

############################################################
# Twilight -12 ... -6 Degrees Elevation
############################################################

[Twilight]
MinSunAngle=-12
MaxSunAngle=-6

// Ocean
ReflectionTint=255,255,255,255
ReflectionIntensity=0.75
FoamColor=255,255,255,255

// Fog
SurfaceFogColor=56,64,74,255
FogFallOffSurfaced=1.0
FogFarClipSurfaced=1150.0

// Sunlight
SunLightIntensity=0.001
SunFlareIntensity=0

// Moonlight
MoonLightIntensity=0.0
MoonFlareIntensity=0.0

############################################################
# Dawn -6 ... 2 Degree Elevation
############################################################

[Dawn]
MinSunAngle=-6
MaxSunAngle=2

// Ocean
ReflectionTint=255,255,255,255
ReflectionIntensity=0.75
FoamColor=255,255,255,255

// Fog
SurfaceFogColor=83,87,93,255
FogFallOffSurfaced=1.0
FogFarClipSurfaced=950.0

// Sunlight
SunLightIntensity=0.25
SunFlareIntensity=0.5

// Moonlight
MoonLightIntensity=0.0
MoonFlareIntensity=0.15

############################################################
# Sunrise 2 ... 5 Degrees Elevation
############################################################
//85,95,105 //55,75,85
[Sunrise]
MinSunAngle=2
MaxSunAngle=5

// Ocean
ReflectionTint=255,255,255,255
ReflectionIntensity=0.75
FoamColor=255,255,255,255

// Fog
SurfaceFogColor=106,107,112,255
FogFallOffSurfaced=1.0
FogFarClipSurfaced=1050.0

// Sunlight
SunLightIntensity=0.5
SunFlareIntensity=0.25

// Moonlight
MoonLightIntensity=0.0
MoonFlareIntensity=0.15

############################################################
# Morning 5 ... 15 Degrees Elevation
############################################################

[Morning]
MinSunAngle=5
MaxSunAngle=15

// Ocean
ReflectionTint=255,255,255,255
ReflectionIntensity=0.75
FoamColor=255,255,255,255

// Fog
SurfaceFogColor=126,125,130,255
FogFallOffSurfaced=1.0
FogFarClipSurfaced=1050.0

// Sunlight
SunLightIntensity=1.1
SunFlareIntensity=0.0

// Moonlight
MoonLightIntensity=0.0
MoonFlareIntensity=0.1

############################################################
# Day 15 ... 35 Degrees Elevation
############################################################

[Day]
MinSunAngle=15
MaxSunAngle=35

// Ocean
ReflectionTint=255,255,255,255
ReflectionIntensity=0.75
FoamColor=255,255,255,255

// Fog
SurfaceFogColor=152,174,183,255
FogFallOffSurfaced=1.0
FogFarClipSurfaced=1050.0

// Sunlight
SunLightIntensity=1.1
SunFlareIntensity=0.0

// Moonlight
MoonLightIntensity=0.0
MoonFlareIntensity=0.1

############################################################
# Zenith 35 ... 90 Degrees Elevation And Beyond
############################################################

[Zenith]
MinSunAngle=35
MaxSunAngle=90

// Ocean 
ReflectionTint=255,255,255,255
ReflectionIntensity=0.75
FoamColor=255,255,255,255

// Fog
SurfaceFogColor=152,174,183,255
FogFallOffSurfaced=1.0
FogFarClipSurfaced=1050.0

// Sunlight
SunLightIntensity=1.1
SunFlareIntensity=0.0

// Moonlight
MoonLightIntensity=0.0
MoonFlareIntensity=0.1

[WeatherEffects]
RainEffect=environment/sky/Rain
SnowEffect=environment/sky/Snow
LightningEffectClass=Lightnings
LightningFlashMinTime=10.0
LightningFlashMaxTime=60.0
FogDensity=0.01 // this value will be added to the standard CloudParameter fog value, when there is a dense fog in the mission area
