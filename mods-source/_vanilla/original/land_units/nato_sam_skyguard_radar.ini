#HPIR: High Power Illuminator doppler Radar—target tracking, illumination and missile guidance
[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=1.5
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=2  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Skyguard radar
Tag=Ground+AntiAircraft

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=Radar,ESM

[ControlSystem]
Collider=coll_hitbox  // makes unit destro
Integrity=3

[SensorData]
#Visual
VisualIdentificationRange=4  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0

[SensorSystem2]  #Search Radar
Type=Radar
SystemName=AN/MPQ-48
Mount=SearchRadar

[SensorSystem3]  #FCR
Type=Radar
SystemName=Pop_Group
Mount=Mount

[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=0,0.04,0
TargetPointAssociatedSystems1=ControlSystem
TargetPointPriority1=High

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=ground objects/nato_skyguard_radar/
ResourcesRoot=nato_skyguard_radar
ResourcesMesh=nato_skyguard_fcr
ResourcesMaterial=nato_skyguard_radar_mat
############################################################

[Submodels]
Mount=Mount
Radar=Radar
SearchRadar=SearchRadar

[Mount]
Mesh=nato_skyguard_fcr_turret
Material=nato_skyguard_radar_mat
Position=0,0.0484,-0.0148
HideWithActiveDamageModel=True

[Radar]
Mesh=nato_skyguard_fcr_radar_1
Material=nato_skyguard_radar_mat
Parent=Mount
Position=0,0.0149,0.0046
HideWithActiveDamageModel=True

[SearchRadar]
Mesh=nato_skyguard_fcr_radar_2
Material=nato_skyguard_radar_mat
Parent=Mount
Position=0,0.0217,-0.0081
HideWithActiveDamageModel=True

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
NumberOfColliders=1
NumberOfMeshColliders=0
UseKinematicCollision=False

Collider1=coll_hitbox

[coll_hitbox]
Collider=Box
Position=0,0.04,0
Rotation=0,0,0
Scale=0.06,0.08,0.11

[Measured]
BakeVersion=8
InputHash=65922c514a03d782
FrontalArea=13.3
SideArea=17.8
BottomArea=17.6
Volume=40.1
