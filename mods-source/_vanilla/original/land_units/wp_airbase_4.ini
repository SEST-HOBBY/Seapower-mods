#WP airbase 4 layout medium generic airbase
[General]
UnitType=LandUnit

LandUnitSubType=Airbase //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port

DefaultCameraDistance=22.0
MinCameraDistanceForeAft=22
MinCameraDistanceBroadside=22
CameraPivotHeight=0.15

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=350  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=10              // value for calculation of mission score
Role=Airfield

[SensorData]
#Visual
VisualIdentificationRange=20.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge

[ControlSystem]
Collider=coll_selection,coll_control_tower,coll_area_1,coll_area_2,coll_area_3,coll_area_4,coll_area_5,coll_fueltanks
Integrity=1000

