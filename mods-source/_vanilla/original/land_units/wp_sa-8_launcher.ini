[General]
UnitType=LandUnit
LandUnitSubType=SAM
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.14                     // in meters
Beam=2.75                       // in meters
Range=270                       // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SA-8
Tag=Ground+Vehicle+SAM

[Physics]
HorsePower=300
Mass=18                        // in tons

MaxForwardVelocity=37.8        // in knots
MaxBackwardVelocity=5.4        // in knots
Braking=15                     // knots/sec
TurnRate=36                    // in degrees per second

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need Collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.024,0.05
ModuleType=Bridge
Integrity=0

[SensorSystem2]  #Pop_Group_Search
Type=Radar
SystemName=Pop_Group_Search
Mount=Radar
ModuleType=Sensor

[SensorSystem3]  #Pop_Group
Type=Radar
SystemName=Pop_Group
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Sensor

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #SA-8
Type=Missile
SystemName=SA-8
#Sensors
AssociatedSensors=SensorSystem3
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
NumberOfContainers=1
Container1=Dummy
Container1_Position=0,0.0164,-0.019
Container1_Rotation=-25,0,0
#Angles
ElevationArc=0,85
RestAngles=0,0
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
ForceMoveToLoadPosition=True
#Effects
#Other
#DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
Integrity=5
VIDIncrease=10  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=wp_sa-8
Ammunition1_Count=18 //6 - Geccko launcher + 12 - loading vehicle
ModuleType=WeaponMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
############################################################
ResourcesFolder=ground objects/wp_sa-8_gecko/
ResourcesRoot=wp_sa-8_gecko
ResourcesMesh=wp_sa-8_gecko
ResourcesMaterial=wp_sa-8_gecko_mat

[Submodels]
Turret=Turret
Radar=Radar

[Turret]
Mesh=wp_sa-8_gecko_turret
Material=wp_sa-8_gecko_mat
Position=0,0.0309,0

[Radar]
Mesh=wp_sa-8_gecko_radar
Material=wp_sa-8_gecko_mat
Parent=Turret
Position=0,0.0283,-0.0132

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=3

Collider1=coll_hitbox
Collider2=coll_radar
Collider3=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.026,0
Rotation=0,0,0
Scale=0.04,0.05,0.1

[coll_radar]
Collider=Sphere
Position=0,0.055,-0.0125
Rotation=0,0,0
Scale=0.04,0.04,0.04

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default
