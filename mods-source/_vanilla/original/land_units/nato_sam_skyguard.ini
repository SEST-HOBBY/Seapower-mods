[General]
UnitType=LandUnit
LandUnitSubType=AAA //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True

Length=3.15                    // in meters
Beam=1.2                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=4  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SAM Skyguard RIM-7
Tag=Ground+AntiAircraft

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0

[SensorSystem2] #FCR
Type=Radar
SystemName=MK-95
Mount=FCR
Radar=FCR

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #Skyguard SAM
Type=Missile
SystemName=Skyguard_Sparrow
#Sensors
AssociatedSensors=SensorSystem2
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
NumberOfContainers=1
ContainerBase=Rails
NumberOfContainers=1
Container1=Rails
AreContainersRotatable=True
#Angles
FixVerticalLaunchAngle=False
AdditionalFixVerticalLaunchAngle=10
ElevationArc=0,55
RestAngles=0,0
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazine
PreloadAmmunition=True
ForceMoveToLoadPosition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
Integrity=3
VIDIncrease=10  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazine]
NumberOfAmmunitionTypes=1
Ammunition1=it_aspide_1
Ammunition1_Count=8					// reloads on separate vehicle
SystemGroup=Magazine
ModuleType=WeaponMagazine

#Enemy units will use this local coordinates to aim their attacks to
[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=0.0021,0.0226,-0.0059
TargetPointAssociatedSystems1=WeaponSystem1
TargetPointPriority1=High

[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=0
LOD1Distance=0.4  // nautical miles

ResourcesFolder=ground objects/nato_sam_skyguard/
ResourcesRoot=nato_sam_skyguard
ResourcesMesh=nato_sam_skyguard_trailer
ResourcesMaterialFolder=ground objects/wp_radars/
ResourcesMaterial=wp_radars_trailers_mat

[Submodels]
Mount=Turret
Rails=Rails
FCR=FCR

