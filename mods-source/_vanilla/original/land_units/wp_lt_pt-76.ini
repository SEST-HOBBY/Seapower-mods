[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.91                    // in meters
Beam=3.14                      // in meters
Range=140                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=PT-76
Tag=Ground+Vehicle+Armor+Tank

[Physics]
HorsePower=240
Mass=14.5                      // in tons

MaxForwardVelocity=23.8        // in knots
MaxBackwardVelocity=5          // in knots
Braking=11                     // knots/sec
TurnRate=22                    // in degrees per second

TurretBlowOffChance=0.45       // Chance to blow off "Turret" submodel.

[AI]
UnitScoreValue=0.4             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5
ArmorType=Minor
IsCoveredByMainArmor=True

[SensorData]
#Visual
VisualIdentificationRange=2.3  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1

#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.035,0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #76mm_D-56
Type=Gun
SystemName=76mm_D-56
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
ElevationArc=-4,30
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxVelocityToFire=5
VIDIncrease=5  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=1
Ammunition1=wp_cal_76mm_d56
Ammunition1_Count=40

[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=2
LOD1Distance=1  // nautical miles
LOD2Distance=2  // nautical miles

ResourcesFolder=ground objects/wp_pt-76/
ResourcesRoot=wp_pt-76
ResourcesMesh=wp_pt-76_hull
ResourcesMaterial=wp_pt-76_mat
############################################################

[Submodels]
Turret=Turret
Gun=Gun
Barrel=Barrel

[Turret]
Mesh=wp_pt-76_turret
Material=wp_pt-76_mat
Position=0,0.0232,0.0104

[Gun]
Mesh=wp_pt-76_gun
Material=wp_pt-76_mat
Parent=Turret
Position=0,0.004,0.0133

[Barrel]
Mesh=wp_pt-76_barrel
Material=wp_pt-76_mat
Parent=Gun
Position=0,0,0

[---------- Effects ----------]
[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

SecondaryPopPrefab=effects/land units/emitters/secondary_pop
TurretCookOffEffect=effects/land units/emitters/turret_cook-off
TurretFireEffect=effects/land units/emitters/turret_fire
TurretFireEffectPosition=0,0.005,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.0152,-0.01
Rotation=0,0,0
Scale=0.045,0.03,0.09

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default
