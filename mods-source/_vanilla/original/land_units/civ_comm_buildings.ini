[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=2.5
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=1.5
CameraPivotHeight=0.25

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=100  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Comms building
Tag=Ground+Vehicle

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Radar,ESM

[SensorData]
#Visual
VisualIdentificationRange=4  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=-0.182,0.152,0.413
ModuleType=Bridge
Collider=coll_main
Integrity=6

[SensorSystem2] #ESM
#UPX-29 IFF Interrogator
Type=ESM
SystemName=VesselESM
Mount=Dummy
MountPosition=0,0.21,0
Collider=coll_mast_shed

[ ---------- HitZones ---------- ]
[HitZones]
NumberOfHitZones=5
[HitZone1]
SystemName=MainBuilding
Collider=coll_comm_main,coll_comm_main_top
Integrity=60 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
SystemName=AuxBuilding
Collider=coll_comm_2
Integrity=40 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone3]
SystemName=Shed_1
Collider=coll_comm_3
Integrity=20 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone4]
SystemName=Shed_2
Collider=coll_comm_4
Integrity=20 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone5]
SystemName=Comm dish
Collider=coll_comm_dish
Integrity=10 //the number of hit points substracted from the overall damage points count when the system is destroyed

