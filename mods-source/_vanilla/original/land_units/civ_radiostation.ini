[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=2.5
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=1.5
CameraPivotHeight=0.25

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=40  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Radio Station
Tag=Ground+Vehicle

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Radar,ESM

[ControlSystem]
Collider=coll_radiostation,coll_radiostation_2,coll_radiostation_3,coll_sys_mast_shed,coll_sys_mast
Integrity=100

[SensorData]
#Visual
VisualIdentificationRange=6  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
#MountPosition=0,0.255,0
MountPosition=0,2.2,0 //Observer on top of the tower
ModuleType=Bridge
Collider=coll_main
Integrity=6

[SensorSystem2] #ESM
#UPX-29 IFF Interrogator
Type=ESM
SystemName=VesselESM
Mount=Dummy
MountPosition=0,0.21,0
Collider=coll_mast_shed

[ ---------- HitZones ---------- ]
[HitZones]
NumberOfHitZones=3
[HitZone1]
SystemName=MainBuilding
Collider=coll_radiostation,coll_radiostation_2
Integrity=30 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
SystemName=AuxBuilding
Collider=coll_radiostation_3
Integrity=10 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone3]
SystemName=MastShed
Collider=coll_sys_mast_shed
Integrity=10 //the number of hit points substracted from the overall damage points count when the system is destroyed

[ ---------- Target Points definitions ---------- ]
[TargetingData]
NumberOfTargetPoints=3
TargetPointPosition1=-0.067,0.033,0.136
TargetPointAssociatedSystems1=HitZone1
TargetPointPriority1=High

TargetPointPosition2=-0.971,0.033,0.05
TargetPointAssociatedSystems2=HitZone2
TargetPointPriority2=Low

TargetPointPosition3=0.055,0.033,-0.33
TargetPointAssociatedSystems3=HitZone3
TargetPointPriority3=Low

[--------------------------- Mesh definitons ---------------------------]
[Models]
LODLevels=1
LOD1Distance=5  // nautical miles

############################################################
ResourcesFolder=ground objects/civ_radiostation/
ResourcesRoot=civ_radiostation
ResourcesMesh=civ_radiostation
ResourcesDamagedMesh=civ_radiostation_d
ResourcesMaterialFolder=scenery/materials/
ResourcesMaterial=industrial_buildings_ne_us_1

[Submodels]
SubModel1=Mast
SubModel2=Trans

[Mast]
Mesh=civ_radiostation_mast
ResourcesMaterialFolder=scenery/materials/
Material=industrial_buildings_ne_us_1
HideWithActiveDamageModel=False

[Trans]
Mesh=civ_radiostation_trans
ResourcesMaterialFolder=scenery/materials/
Material=trans
HideWithActiveDamageModel=False

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=0.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
