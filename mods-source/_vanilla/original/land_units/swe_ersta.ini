[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=20  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=3               // value for calculation of mission score
Role=ASuW,Gun

[SensorData]
#Visual
VisualIdentificationRange=6  // Camouflaged  (x0.5)
VisibilityFromFront=1 //Round shape = equal visibility
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.032,0
ModuleType=Bridge
DamageContribution=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=Gun
SystemName=ERSTA
#Sensors
AssociatedSensors=SensorSystem1
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
FiringArcs=-180,180
ElevationArc=-4,45
#Loading
AssociatedMagazine=WeaponMagazine
#Effects
#Other
Collider=coll_turret
ModuleType=Weapon
ArmorType=Minor
Integrity=20 //the number of hit points substracted from the overall damage points count when the system is destroyed
VIDIncrease=20  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
############################################################
# Weapon Magazine Systems
############################################################
[WeaponMagazine]
NumberOfAmmunitionTypes=1
Ammunition1=usn_cal_127mm
Ammunition1_Count=800
SystemGroup=Magazine
ModuleType=WeaponMagazine

#Enemy units will use this local coordinates to aim their attacks to
#[TargetingData]
#NumberOfTargetPoints=1
#TargetPointPosition1=0.0021,0.0226,-0.0059
#TargetPointAssociatedSystems1=WeaponSystem1
#TargetPointPriority1=High

[Models]
LODLevels=1
LOD1Distance=0.8  // nautical miles
LOD2Distance=3.5  // nautical miles
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/swe_ersta/
ResourcesRoot=swe_ersta
ResourcesMesh=swe_ERSTA_base
ResourcesMaterialFolder=ground objects/swe_ersta/
ResourcesMaterial=swe_ersta_base_mat
############################################################

[Submodels]
Submodel1=Turret
Submodel2=Gun
Submodel3=Barrel

[Turret]
Mesh=swe_ERSTA_turret
ResourcesMaterialFolder=ground objects/swe_ersta/
Material=swe_ersta_mat
Position=0,0.0219,0

[Gun]
Mesh=swe_ERSTA_gun
ResourcesMaterialFolder=ground objects/swe_ersta/
Material=swe_ersta_mat
Parent=Turret
Position=0,0.0163,0.0252

[Barrel]
Mesh=swe_ERSTA_barrel
ResourcesMaterialFolder=ground objects/swe_ersta/
Material=swe_ersta_mat
Parent=Gun
Position=0,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,5
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/bomb_hit_ground_large
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
Collider1=coll_turret

[coll_turret]
Collider=Sphere
Position=0,0.025,0
Rotation=0,0,0
Scale=0.08,0.08,0.08