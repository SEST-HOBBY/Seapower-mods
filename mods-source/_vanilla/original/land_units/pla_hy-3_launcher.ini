[General]
UnitType=LandUnit
LandUnitSubType=MissileSite //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.35
MinCameraDistanceBroadside=0.35
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=4  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=TEL
Tag=Ground+Vehicle

[AI]
UnitScoreValue=3              // value for calculation of mission score
Role=ASuW,ASM

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=0
AnimationFile_1=animations_rails-launcher

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.032,0
Integrity=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #CSS-C-6 Sawhorse Site HY-3
Type=Missile
SystemName=HY-3
#Sensors
#Animations
#Mount
Mount=Rail
IsMountRotatable=True
#Containers
NumberOfContainers=1
Container1=Dummy
Container1_Position=0,0.0467,0.0242
Container1_Rotation=-10,0,0
AreContainersRotatable=True
#Angles
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
ForceMoveToLoadPosition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
Integrity=4
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=pla_hy-3	
#wp_ss-n-2
Ammunition1_Count=2
ModuleType=WeaponMagazine

[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/pla_hy-3_launcher/
ResourcesRoot=pla_hy-3_launcher
ResourcesMesh=pla_hy-3_launcher_base
ResourcesMaterial=pla_hy-3_launcher_mat
############################################################

[Submodels]
Rail=Rail

[Rail]
Mesh=pla_hy-3_launcher_rail
Material=pla_hy-3_launcher_mat

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
NumberOfMeshColliders=0
UseKinematicCollision=False

Collider1=coll_hitbox

[coll_hitbox]
Collider=Box
Position=0,0.026,0
Rotation=0,0,0
Scale=0.04,0.05,0.1
