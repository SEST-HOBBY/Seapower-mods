[General]
UnitType=LandUnit
LandUnitSubType=SAM
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.5                     // in meters
Beam=2.85                      // in meters
Range=270                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SA-13
Tag=Ground+Vehicle+SAM

[Physics]
HorsePower=240
Mass=12.3                      // in tons

MaxForwardVelocity=32.9        // in knots
MaxBackwardVelocity=5          // in knots
Braking=14                     // knots/sec
TurnRate=30                    // in degrees per second

[AI]
UnitScoreValue=1             // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.022,0.02
ModuleType=Bridge
Integrity=0

[SensorSystem2]  #Snap_Shot
Type=Radar
SystemName=Snap_Shot
Mount=Launcher
ModuleType=Sensor

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #SA-13 Gopher
Type=Missile
SystemName=SA-13
#Sensors
AssociatedSensors=SensorSystem2
#Animations
#Mount
Mount=Launcher
IsMountRotatable=True
#Containers
NumberOfContainers=1
ContainerBase=Rails
NumberOfContainers=1
Container1=Rails
AreContainersRotatable=True
