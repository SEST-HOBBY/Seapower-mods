[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=7.94                    // in meters
Beam=3.27                      // in meters
Range=260                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=7  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=AAV7 APC
Tag=Ground+Vehicle

[Physics]
HorsePower=400
Mass=29.1                      // in tons

MaxForwardVelocity=38.9        // in knots
MaxBackwardVelocity=3          // in knots
Braking=13                     // knots/sec
TurnRate=28                    // in degrees per second

[AI]
UnitScoreValue=0.2             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=7
ArmorType=Minor
IsCoveredByMainArmor=True

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #M2HB
Type=CIWS
SystemName=M2HB
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun2
Gun=Gun2
AreContainersRotatable=True
#Angles
ElevationArc=-5,45
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
EffectPosition=0.0009,-0.0014,-0.0058     // Overrides weapons.ini value
#Other
VIDIncrease=3  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineCIWS]
NumberOfAmmunitionTypes=1
Ammunition1_Count=1100
Ammunition1=usn_cal_05in
ModuleType=SmallMagazine

