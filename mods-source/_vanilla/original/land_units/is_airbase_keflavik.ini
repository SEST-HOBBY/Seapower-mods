[General]
UnitType=LandUnit

#Blocked until set up
HideIn=Encyclopedia,MissionEditor,Signatures


LandUnitSubType=Airbase //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port

DefaultCameraDistance=35
MinCameraDistanceForeAft=35
MinCameraDistanceBroadside=35
CameraPivotHeight=0.15

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=600  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=10              // value for calculation of mission score
Role=Airfield

[SensorData]
#Visual
VisualIdentificationRange=30.0  // Biggest range in nm at which this unit can be visually identified
