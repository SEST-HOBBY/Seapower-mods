[General]
UnitType=LandUnit
LandUnitSubType=Radar

DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=False

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=6  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SA-11 Radar
Tag=Ground+Vehicle+Radar

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=7  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=6

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
