[General]
UnitType=LandUnit
LandUnitSubType=Radar

DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=False

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SA-6
Tag=Ground+Vehicle+Radar

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=7  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #Optics
#Does not need collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.036,0.088
ModuleType=Bridge
Integrity=0

#---------- Air search radar ----------
[SensorSystem2] #Air Search
Type=Radar
SystemName=Straight_Flush_Search
Mount=SearchRadar_Radar
ModuleType=Sensor

#---------- FC radar ----------
#SAM
[SensorSystem3] #FCR
Type=Radar
SystemName=Straight_Flush_Illuminate
Mount=FCRadar_Mount
Radar=FCRadar_Radar

