[General]
UnitType=LandUnit
LandUnitSubType=AAA //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=AAA
Tag=Ground+Vehicle

[AI]
UnitScoreValue=3               // value for calculation of mission score
Role=ASuW,Gun

[SensorData]
#Visual
VisualIdentificationRange=6  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.03,0
ModuleType=Bridge
Integrity=3

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=Gun
SystemName=KS-19_100mm
#Sensors
NumberOfAssociatedSensors=1
AssociatedSensor1=SensorSystem1
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
FiringArcs=-180,180
ElevationArc=-5,85
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazine
#Effects
#Other
WorksStandalone=True
MaxReactiontime=3.5
Collider=coll_ks-19
ModuleType=Weapon
ArmorType=None
Integrity=3 //the number of hit points substracted from the overall damage points count when the system is destroyed
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
############################################################
# Weapon Magazine Systems
############################################################
[WeaponMagazine]
NumberOfAmmunitionTypes=1
Ammunition1=nv_cal_100mm
Ammunition1_Count=300
SystemGroup=Magazine
ModuleType=WeaponMagazine

#Enemy units will use this local coordinates to aim their attacks to
[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=0.0021,0.0226,-0.0059
TargetPointAssociatedSystems1=WeaponSystem1
TargetPointPriority1=High

[Models]
LODLevels=2
LOD1Distance=0.3  // nautical miles
LOD2Distance=0.6  // nautical miles
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/nv_ks-19/
ResourcesRoot=nv_ks-19
ResourcesMesh=nv_ks-19_chassis
ResourcesMaterialFolder=ground objects/wp_radars/
ResourcesMaterial=wp_radars_trailers_mat
############################################################

[Submodels]
Mount=Mount
Gun=Gun
Barrel=Barrel
Gunners=Gun_crew
Crew=Crew
#Revetment=Revetment

[Mount]
Mesh=nv_ks-19_mount
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Position=0,0,0

[Gun]
Mesh=nv_ks-19_gun
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Parent=Mount
Position=0,0.02533,-0.006

[Barrel]
Mesh=nv_ks-19_barrel
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Parent=Gun
Position=0,0,0

[Gun_crew]
Mesh=nv_ks-19_gunners
ResourcesMaterialFolder=ships/materials/
Material=nv_crew
Parent=Mount
Position=0,0,0

[Crew]
Mesh=nv_ks-19_crew
ResourcesMaterialFolder=ships/materials/
Material=nv_crew
Position=0,0,0

#[Revetment]
#Mesh=nv_ks-19_revetment
#ResourcesMaterialFolder=scenery/materials/
#Material=pier_tx
#Position=0,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1


[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
Collider1=coll_ks-19

[coll_ks-19]
Collider=Sphere
Position=-0.0005,0.0132,0.0035
Rotation=0,0,0
Scale=0.08,0.08,0.08