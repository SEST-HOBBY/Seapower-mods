#P-14 radar
[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=2.5
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=1.5
CameraPivotHeight=0.2

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=1L13
Tag=Ground+AntiAircraft

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=Radar,ESM

[ControlSystem]
Collider=coll_hitbox  // makes unit destructable
Integrity=3

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Medium

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need Collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge

[SensorSystem2] #Radar
Type=Radar
SystemName=Tall_King
Mount=Radar

[SensorSystem3] #ESM
#IFF Interrogator
Type=ESM
SystemName=VesselESM
Mount=Dummy
MountPosition=0,0.08,0

[--------------------------- Mesh definitions ---------------------------]
[Models]
ResourcesFolder=ground objects/wp_radars/
ResourcesRoot=wp_radars_trailers
ResourcesMesh=wp_p-14
ResourcesDamagedMesh=wp_p-14_d
ResourcesMaterialFolder=ground objects/wp_radars/
ResourcesMaterial=wp_radars_trailers_mat
############################################################

[Submodels]
SubModel1=Radar

[Radar]
Mesh=wp_p-14_radar
Material=wp_radars_trans_mat
Position=0,0,0
HideWithActiveDamageModel=True

[---------- Effects ----------]
[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[---------- Colliders ----------]
[Colliders]
NumberOfColliders=1
NumberOfMeshColliders=0

Collider1=coll_hitbox

[coll_hitbox]
Collider=Box
Position=0,0.1242,0
Rotation=0,0,0
Scale=0.5,0.24,0.5