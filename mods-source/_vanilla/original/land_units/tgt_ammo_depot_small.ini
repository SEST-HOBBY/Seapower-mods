[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DisplayClassName=Industrial_buildings_1
DefaultCameraDistance=2.0
MinCameraDistanceForeAft=1
MinCameraDistanceBroadside=1
CameraPivotHeight=0.15

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=50  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=5               // value for calculation of mission score
Role=Target

[SensorData]
#Visual
VisualIdentificationRange=15.0
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium

[ControlSystem]
Integrity=300   //the number of hit points substracted from the overall damage points count when the system is destroyed
ArmorType=Minor
ModuleType=CIC
Collider=coll_building,coll_wh_open_small_1,coll_wh_open_big,coll_selection

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Visual
# Bridge. Does not need Collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Eyes
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge

[---------- Supply Systems ----------]
[SupplySystem1]
SystemName=TruckSupplySystem
#MaxAmmoPoints=200             // Ammunition with ammo points cost over this values will not be replenished
AmmoLoadSpeed=80              // Ammo points per second
AmmoCapacity=200000           // Ammo points. Can be numerical value or "Unlimited"
SupplyRange=1.5               // In miles
MaxTargets=15                 // Number of targets that can be simultaniously replenished (same speed per target)#
#MaxTargets=Unlimited          // Number of targets that can be simultaniously replenished (same speed per target)
MaxOwnVelocity=5              // In knots. Above this velocity replenishment is impossible
MaxTargetVelocity=10          // In knots. Above this velocity replenishment is impossible
TargetTypes=LandUnit          // What unit types can be replenished by this system
UpdateDelay=1                 // Delay between replenishment calculations. (Really should leave it as it is)

[---------- HitZones ----------]
[HitZones]
NumberOfHitZones=4

[HitZone1]
Collider=coll_building
ModuleType=HitZone
Integrity=20 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
Collider=coll_wh_open_small_1
ModuleType=HitZone
Integrity=20 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone3]
Collider=coll_wh_open_small_2
ModuleType=HitZone
Integrity=20 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone4]
Collider=coll_wh_open_big
ModuleType=HitZone
Integrity=20 //the number of hit points substracted from the overall damage points count when the system is destroyed

#Attacking units will use this local coordinates to aim their attacks to
[TargetingData]
NumberOfTargetPoints=4
TargetPointPosition1=0.791,0.068,-0.853
TargetPointAssociatedSystems1=HitZone1
TargetPointPriority1=High
TargetPointPosition2=-0.4793,0.0381,0.4551
TargetPointAssociatedSystems2=HitZone2
TargetPointPriority2=Low
TargetPointPosition3=-0.8762,0.0095,1.12
TargetPointAssociatedSystems3=HitZone3
TargetPointPriority3=High
TargetPointPosition4=-0.5527,0.0231,-1.0542
TargetPointAssociatedSystems4=HitZone4
TargetPointPriority4=Medium

