[SensorData]
#Visual
VisualIdentificationRange=8  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need Collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.02,0.027
ModuleType=Bridge

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #S-200 Vega
Type=Missile
SystemName=SA-5
#Sensors
ExternalGuidingSystems=Square_Pair
ExternalGuidingSystemSearchRadius=0.5     // in nmi
#Animations
LoadAmmunitionAnimation=SA-5_Reload
#Mount
Mount=SA-5_Main
IsMountRotatable=True
#Containers
ContainerBase=SA-5_Launcher
NumberOfContainers=1
Container1=Dummy
Container1_Position=0,0,0
AreContainersRotatable=True
#Angles
FixVerticalLaunchAngle=35
FiringArcs=-180,180
ElevationArc=10,45
RestAngles=0,0
LoadAngles=0,0
#Loading
Ammunition=wp_sa-5
ReloadableWithoutMagazine=True
ForceMoveToLoadPosition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
Integrity=5
VIDIncrease=15  // In miles. Flat base VID increace when firing.

