[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=3              // value for calculation of mission score
Role=ASuW,Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=6  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.032,0
ModuleType=Bridge
DamageContribution=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=Gun
SystemName=QF45
#Sensors
AssociatedSensors=SensorSystem1
#Animations
#Mount
Mount=QF45_Shield
IsMountRotatable=True
#Containers
ContainerBase=QF45_Gun
NumberOfGuns=1
Gun1=QF45_Barrel
AreContainersRotatable=True
#Angles
FiringArcs=-180,180
ElevationArc=-10,75
#Loading
AssociatedMagazine=WeaponMagazine
#Effects
#Other
ModuleType=Weapon
ArmorType=Minor
VIDIncrease=20  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
############################################################
# Weapon Magazine Systems
############################################################
[WeaponMagazine]
NumberOfAmmunitionTypes=1
Ammunition1=rn_cal_114mm
Ammunition1_Count=200
SystemGroup=Magazine
ModuleType=WeaponMagazine

#Enemy units will use this local coordinates to aim their attacks to
#[TargetingData]
#NumberOfTargetPoints=1
#TargetPointPosition1=0.0021,0.0226,-0.0059
#TargetPointAssociatedSystems1=WeaponSystem1
#TargetPointPriority1=High

[Models]
LODLevels=2
LOD1Distance=0.5  // nautical miles
LOD2Distance=2.0  // nautical miles
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/nv_coastal_artillery/
ResourcesRoot=nv_coastal_artillery
ResourcesMesh=nv_coastal_artillery
ResourcesMaterialFolder=ships/materials/
ResourcesMaterial=modular_parts
############################################################

[Submodels]
QF45_Rivetment=QF45_Rivetment
QF45_Shield=QF45_Shield
QF45_Gun=QF45_Gun
QF45_Barrel=QF45_Barrel

[QF45_Rivetment]
Mesh=nv_coastal_artillery_revetment
ResourcesMaterialFolder=scenery/materials/
Material=pier_tx
Position=0,0,0

[QF45_Shield]
Mesh=nv_coastal_artillery_turret
ResourcesMaterialFolder=ships/materials/
Material=modular_parts
Position=0,0,0

[QF45_Gun]
Mesh=nv_coastal_artillery_gun
ResourcesMaterialFolder=ships/materials/
Material=modular_parts
Parent=QF45_Shield
Position=0,0.03099999,0.0078125

[QF45_Barrel]
Mesh=nv_coastal_artillery_barrel
ResourcesMaterialFolder=ships/materials/
Material=modular_parts
Parent=QF45_Gun
Position=0,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
Collider1=coll_hitbox

[coll_hitbox]
Collider=Sphere
Position=0.0021,0.0226,-0.0059
Rotation=0,0,0
Scale=0.08,0.08,0.08