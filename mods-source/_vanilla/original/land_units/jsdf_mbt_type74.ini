[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.4                     // in meters
Beam=3.2                       // in meters
Range=162                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=10  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Type 74 MBT
Tag=Ground+Vehicle+Armor+Tank

[Physics]
HorsePower=750
Mass=38                        // in tons

MaxForwardVelocity=28.6        // in knots
MaxBackwardVelocity=6          // in knots
Braking=11                     // knots/sec
TurnRate=20                    // in degrees per second

TurretBlowOffChance=0.25       // Chance to blow off "Turret" submodel.

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=10

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.042,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.03,0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #L7
Type=Gun
SystemName=L7
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-4,15
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxVelocityToFire=5
VIDIncrease=5  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=1
Ammunition1=usn_cal_105mm
Ammunition1_Count=54
ModuleType=MediumMagazine

