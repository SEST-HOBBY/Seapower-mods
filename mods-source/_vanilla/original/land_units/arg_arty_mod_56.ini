[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.25
MinCameraDistanceForeAft=0.2
MinCameraDistanceBroadside=0.2
CameraPivotHeight=0.015

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=2  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=3               // value for calculation of mission score
Role=ASuW,Gun

[SensorData]
#Visual
VisualIdentificationRange=6  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.03,0
ModuleType=Bridge
Integrity=2

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=Gun
SystemName=105mm_mod_56
#Sensors
NumberOfAssociatedSensors=1
AssociatedSensor1=SensorSystem1
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
FiringArcs=-180,180
ElevationArc=-5,65
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazine
#Effects
#Other
WorksStandalone=True
MaxReactiontime=3.5
Collider=coll_gun
ModuleType=Weapon
ArmorType=None
Integrity=2 //the number of hit points substracted from the overall damage points count when the system is destroyed
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
############################################################
# Weapon Magazine Systems
############################################################
[WeaponMagazine]
NumberOfAmmunitionTypes=1
Ammunition1=usn_cal_105mm_howitzer
Ammunition1_Count=100
SystemGroup=Magazine
ModuleType=WeaponMagazine

#Enemy units will use this local coordinates to aim their attacks to
[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=0,0.015,0
TargetPointAssociatedSystems1=WeaponSystem1
TargetPointPriority1=High

[Models]
LODLevels=2
LOD1Distance=0.3  // nautical miles
LOD2Distance=0.6  // nautical miles
