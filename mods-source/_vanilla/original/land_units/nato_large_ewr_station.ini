[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DisplayClassName=EWR Site (Large)
DefaultCameraDistance=10.0
MinCameraDistanceForeAft=3
MinCameraDistanceBroadside=3
CameraPivotHeight=0.15

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=180  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=500               // value for calculation of mission score
Role=Target

[SensorData]
#Visual
VisualIdentificationRange=15.0
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Large

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=0
AnimationFile_1=none

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
SystemGroup=SG_CIC
Collider=coll_control_building
ModuleType=CIC
Integrity=5 //the number of hit points substracted from the overall damage points count when the system is destroyed
ArmorType=Minor
ResilenceModifier=3.0 //the multiplier that affects the required accumulated damage level for the system to achieve new damage tier. E.g. if this parameter is equal to 2.0 and Severe damage tier value is 15, the actual Severe damage value will be no less than 2 * 15 = 30

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Eyes
Mount=Dummy
MountPosition=0,0.026,0 #Crew on ground level
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=0

[---------- HitZones ----------]
