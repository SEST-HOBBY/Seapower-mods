[General]
UnitType=LandUnit
LandUnitSubType=AAA
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.2                     // in meters
Beam=3.3                       // in meters
Range=227                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=ZSU-57-2
Tag=Ground+Vehicle+AntiAircraft

[Physics]
HorsePower=520
Mass=28                        // in tons

MaxForwardVelocity=27          // in knots
MaxBackwardVelocity=5          // in knots
Braking=12                     // knots/sec
TurnRate=27                    // in degrees per second

[AI]
UnitScoreValue=0.2             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
