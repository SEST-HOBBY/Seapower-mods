[General]
UnitType=LandUnit
LandUnitSubType=AAA //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=37mm AAA Type 55
Tag=Ground+Vehicle

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=AAW,Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=3

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge
Integrity=3

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #37mm_Type61
#Port gun
Type=Gun
SystemName=37mm_Type61
#Sensors
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=2
Gun1=Barrel_l
Gun2=Barrel_r
AreContainersRotatable=True
#Angles
ElevationArc=-4,80
#Loading
AssociatedMagazine=WeaponMagazine_37mm
#Effects
#Other
TargetAcquisitionTime=1
EffectPosition=0,0,0.073
SpawnPosition=0,0,0.073

[---------- WeaponMagazines ----------]
[WeaponMagazine_37mm]
NumberOfAmmunitionTypes=1
Ammunition1=wp_cal_37mm
Ammunition1_Count=1200

#Enemy units will use this local coordinates to aim their attacks to
[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=0.0021,0.0226,-0.0059
TargetPointAssociatedSystems1=WeaponSystem1
TargetPointPriority1=High

[Models]
LODLevels=2
LOD1Distance=0.2  // nautical miles
LOD2Distance=0.4  // nautical miles
