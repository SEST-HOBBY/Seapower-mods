#Dome generic NATO radar
[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port

DefaultCameraDistance=1.5
MinCameraDistanceForeAft=0.8
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.1

AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=1L13
Tag=Ground+AntiAircraft

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Radar

[SensorData]
#Visual
VisualIdentificationRange=8  // Camouflaged  (x0.5)
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need сollider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.03,0.025
ModuleType=Bridge

[SensorSystem2] #TPS-43
Type=Radar
SystemName=AN/TPS-43
Mount=Radar
Integrity=3
Collider=coll_radar,coll_radar_base

[Models]
LODLevels=0
LOD1Distance=2  // nautical miles
LOD2Distance=4  // nautical miles
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/usa_an-tps-43/
ResourcesRoot=usa_an-tps-43
ResourcesMesh=usa_an-tps_43_base
#ResourcesMaterialFolder=scenery/materials/
ResourcesMaterial=usa_an-tps-43_mat
############################################################

[Submodels]
Trailer=Trailer
Radar=Radar
Dish=Trans

[Trailer]
Mesh=usa_an-tps_43_trailer
Material=usa_an-tps-43_mat

[Radar]
Mesh=nato_tps_43_radar
Material=usa_an-tps-43_mat

[Trans]
Mesh=usa_an-tps_43_radar_trans
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trans_mat
Parent=Radar

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfMeshColliders=0
NumberOfColliders=2
UseKinematicCollision=False

Collider1=coll_radar_base
Collider2=coll_radar

[coll_radar_base]
Collider=Box
Position=0,0.0198,-0.033
Rotation=0,0,0
Scale=0.07,0.04,0.14

[coll_radar]
Collider=Sphere
Position=0,0.0598,-0.0013
Rotation=0,0,0
Scale=0.07,0.07,0.07
