[General]
UnitType=LandUnit
LandUnitSubType=SAM
#IsMobile=True //Dot: Until deploy/undeply mechanics is a thing

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=6  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SA-11 Launcher
Tag=Ground+Vehicle+SAM

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=7  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.023,0.034
ModuleType=Bridge
Integrity=0

[SensorSystem2]  #FCR Launcher 1
Type=Radar
SystemName=Front_Dome
Mount=Launcher

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #SA-11
Type=Missile
SystemName=SA-11
#Sensors
AssociatedSensors=SensorSystem2
#Animations
#Mount
Mount=Launcher
IsMountRotatable=True
#Containers
ContainerBase=Rails
NumberOfContainers=1
Container1=Rails
AreContainersRotatable=True
#Angles
ElevationArc=10,85
RestAngles=0,-35
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
ForceMoveToLoadPosition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
Collider=coll_hitbox
AutoEnableSensor=True
WaitWhileSensorIsGuiding=True
VIDIncrease=15  // In miles. Flat base VID increace when firing.
Integrity=6

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=wp_sa-11
Ammunition1_Count=4
ModuleType=WeaponMagazine

[Models]
ResourcesFolder=ground objects/wp_sa-11/
ResourcesRoot=wp_sa-11
ResourcesMesh=wp_sa-11_tel
ResourcesMaterial=wp_sa-11_mat
############################################################

[Submodels]
Launcher=Launcher
Rails=Rails

[Launcher]
ResourcesMeshFolder=ground objects/wp_sa-11/
RootMesh=wp_sa-11
Mesh=wp_sa-11_tel_launcher
ResourcesMaterialFolder=ground objects/wp_sa-11/
Material=wp_sa-11_mat
Position=0,0,0.0121

[Rails]
ResourcesMeshFolder=ground objects/wp_sa-11/
RootMesh=wp_sa-11
Mesh=wp_sa-11_tel_launcher_rails
ResourcesMaterialFolder=ground objects/wp_sa-11/
Material=wp_sa-11_mat
Parent=Launcher
Position=0,0.045,-0.0733
Rotation=-35,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=ModerateShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.026,0
Rotation=0,0,0
Scale=0.04,0.05,0.1

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default
