[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.08

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Radar

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=Radar

[SensorData]
#Visual
VisualIdentificationRange=3  // Camouflaged  (x0.5)
IRSignature=Tiny
# Radar related (RCS => radar cross section)
RCS=VerySmall

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.03,0
ModuleType=Bridge
Collider=coll_trailer
Integrity=3

[SensorSystem2] #Radar
Type=Radar
SystemName=Fire_Can
Mount=Radar
Collider=coll_radar

[Models]
LODLevels=2
LOD1Distance=0.2  // nautical miles
LOD2Distance=0.4  // nautical miles
