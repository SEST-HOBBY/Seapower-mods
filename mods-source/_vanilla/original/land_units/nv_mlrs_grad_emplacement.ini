[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.2
MinCameraDistanceBroadside=0.2
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=BM-21
Tag=Ground+Vehicle

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Gun

[SensorData]
#Visual
VisualIdentificationRange=10  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #GRAD-40
Type=Missile
SystemName=GRAD-40
#Sensors
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
ContainerBase=Launcher
NumberOfContainers=1
Container1=Launcher
AreContainersRotatable=True
#Angles
ElevationArc=-1,45
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazineLauncher
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
Integrity=10
Collider=coll_hitbox

[---------- WeaponMagazines ----------]
[WeaponMagazineLauncher] #Purely fictional to mitigate lack of reloading
NumberOfAmmunitionTypes=1
Ammunition1=wp_grad
Ammunition1_Count=120 //40 on vehicle + 80 in reloading vehicle
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
ResourcesFolder=ground objects/nv_bm-21/
ResourcesRoot=nv_bm-21
ResourcesMesh=nv_grad_chassis
ResourcesMaterialFolder=ground objects/wp_radars/
ResourcesMaterial=wp_radars_trailers_mat
############################################################

[Submodels]
Mount=Mount
Launcher=Launcher
Revetment=Revetment

[Mount]
Mesh=nv_grad_mount
ResourcesMaterialFolder=ships/materials/
Material=modular_parts
Position=0,0,0

[Launcher]
Mesh=nv_grad_launcher
ResourcesMaterialFolder=ships/materials/
Material=modular_parts
Parent=Mount
Position=0,0.018,-0.0202

[Revetment]
Mesh=nv_grad_revetment
ResourcesMaterialFolder=scenery/materials/
Material=pier_tx
Position=0,0,0

[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1


[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
Collider1=coll_hitbox

[coll_hitbox]
Collider=Sphere
Position=-0.0005,0.0132,0.0035
Rotation=0,0,0
Scale=0.08,0.08,0.08