#WP airbase 5 layout medium-large generic airbase based on Amari airbase
[General]
UnitType=LandUnit

#Blocked until set up
#HideIn=Encyclopedia,MissionEditor,Signatures


LandUnitSubType=Airbase //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port

DefaultCameraDistance=22.0
MinCameraDistanceForeAft=22
MinCameraDistanceBroadside=22
CameraPivotHeight=0.15

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=800  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=10              // value for calculation of mission score
Role=Airfield

[SensorData]
#Visual
VisualIdentificationRange=20.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=150                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db

[ControlSystem]
Collider=coll_selection,coll_selection_2,coll_control_tower,coll_area_1,coll_area_2,coll_area_3,coll_runway,coll_road,coll_parking,coll_parking_heli,coll_hangars_1,coll_hangars_2,coll_hangar_big
Integrity=3000

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_wp_large_pvo_airbase

