[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.5                     // in meters
Beam=3.2                       // in meters
Range=243                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=8  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Bradley IFV
Tag=Ground+Vehicle

[Physics]
HorsePower=500
Mass=22.8                      // in tons

MaxForwardVelocity=35.6        // in knots
MaxBackwardVelocity=7          // in knots
Braking=12                     // knots/sec
TurnRate=25                    // in degrees per second

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=8
ArmorType=Minor
IsCoveredByMainArmor=True

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.04,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.033,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=2

[WeaponSystem1] #Tow launcher
Type=Missile
SystemName=TOW_M2
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
NumberOfContainers=1
Container1=Dummy
Container1_Position=-0.0168,0.0056,0.0022
#Angles
RestAngles=0,0
LoadAngles=Any
#Loading
AssociatedMagazine=WeaponMagazineTOW
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
VIDIncrease=8  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2  //List of systems

[WeaponSystem2] #M242
Type=CIWS
SystemName=M242
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-10,60
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
VIDIncrease=4  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1

[---------- WeaponMagazines ----------]
[WeaponMagazineTOW]
NumberOfAmmunitionTypes=1
Ammunition1=usa_bgm-71c
Ammunition1_Count=7
ModuleType=SmallMagazine

[WeaponMagazineGun]
NumberOfAmmunitionTypes=1
Ammunition1=wp_cal_25mm
Ammunition1_Count=900
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=0
LOD1Distance=1.0  // nautical miles

ResourcesFolder=ground objects/usa_m2_bradley/
ResourcesRoot=usa_m2_bradley
ResourcesMesh=usa_m2_bradley_hull
ResourcesMaterial=usa_m2_bradley_mat

[Submodels]
Turret=Turret
Gun=Gun

[Turret]
Mesh=usa_m2_bradley_turret
Material=usa_m2_bradley_mat
Position=0.0033,0.0288,-0.0062

[Gun]
Mesh=usa_m2_bradley_barrel
Material=usa_m2_bradley_mat
Parent=Turret
Position=-0.0008,0.005,0.0127

[---------- Effects ----------]
[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
