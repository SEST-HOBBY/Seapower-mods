[General]
UnitType=LandUnit
LandUnitSubType=MissileSite
#IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=11.6                     // in meters
Beam=3.5                        // in meters
Range=270                       // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=ASC Rubezh
Tag=Ground+AntiShip

[Physics]
HorsePower=525
Mass=12                        // in tons

MaxForwardVelocity=32.4        // in knots
MaxBackwardVelocity=5.5        // in knots
Braking=10                     // knots/sec
TurnRate=10                    // in degrees per second

[AI]
UnitScoreValue=0.3             // value for calculation of mission score
Role=ASuW,ASM

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=4

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_rubezh_launcher


[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.024,0.05
ModuleType=Bridge
Integrity=0

[SensorSystem2] #Plank_Shave
#«Rangout» Search radar. Mounted on top of mast.
Type=Radar
SystemName=Plank_Shave
Mount=Radar

#---------- ESM ----------
[SensorSystem3] #Band Stand ESM mode
Type=ESM
SystemName=Plank_Shave_ESM
Mount=Dummy
MountPosition=0,0.24,0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #SS-N-12 Front Stbd
#Launchers 1 and 3
Type=Missile
SystemName=SS-N-2
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Launcher
AreContainersRotatable=True
NumberOfContainers=2
NumberOfHatchesPerContainer=2  // optional
Container1=Dummy               // when there is no real container, use this as a placeholder
Container1_Position=-0.0113,0.0142,0.0173     // must be given when there is no real container for the missile
Container1_Rotation=0,0,0      // must be given when there is no real container for the missile
Container1_Hatch1=Hatch_Left_F
Container1_Hatch2=Hatch_Left_R
Container1_OpenHatchAnimation=HatchOpenAnim_1
Container1_CloseHatchAnimation=HatchCloseAnim_1
Container2=Dummy
Container2_Position=0.0113,0.0142,0.0173
Container2_Rotation=0,0,0
Container2_Hatch1=Hatch_Right_F
Container2_Hatch2=Hatch_Right_R
Container2_OpenHatchAnimation=HatchOpenAnim_2
Container2_CloseHatchAnimation=HatchCloseAnim_2
#Angles
FixVerticalLaunchAngle=25
PreferredArcs=-105,-75|75,105
ElevationArc=-1,25
RestAngles=180,0
LoadAngles=180,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
ForceMoveToLoadPosition=True
#Effects
HatchAudioClip=audio/weapons/missileHatchOpen
#Other

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=wp_ss-n-2c
Ammunition1_Count=4 //2 - launcher + 2 - loading vehicle
ModuleType=WeaponMagazine

