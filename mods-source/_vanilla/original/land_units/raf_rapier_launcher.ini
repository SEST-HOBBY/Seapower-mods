[General]
UnitType=LandUnit
LandUnitSubType=SAM
IsMobile=False

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.02

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Rapier LN
Tag=Ground+Vehicle

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=1.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.024,0.05
ModuleType=Bridge
Integrity=0

#Blindfire
[SensorSystem2]  #Blindfire
Type=Radar
SystemName=Blindfire
Mount=Dummy	//Radar
MountPosition=0,0.17,0
ModuleType=Sensor

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #SA-8
Type=Missile
SystemName=Rapier
#Sensors
AssociatedSensors=SensorSystem2
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
NumberOfContainers=1
ContainerBase=Rails
NumberOfContainers=1
Container1=Rails
AreContainersRotatable=True
Container1_Position=0,0.01991,-0.0022
Container1_Rotation=0,0,0
#Angles
ElevationArc=0,50
RestAngles=0,0
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
ForceMoveToLoadPosition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
Integrity=5
VIDIncrease=10  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=raf_rapier
Ammunition1_Count=16 //8 Rapier launcher + 8 on fastloading tractor
ModuleType=WeaponMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/nato_rapier/
ResourcesRoot=nato_rapier
ResourcesMesh=nato_rapier_launcher_trailer
ResourcesMaterial=nato_rapier_mat
############################################################

[Submodels]
Turret=Turret
Rails=Rails

[Turret]
Mesh=nato_rapier_launcher_mount
Material=nato_rapier_mat
Position=0,0,0
Rotation=0,0,0

[Rails]
Mesh=nato_rapier_launcher_rail
Material=nato_rapier_mat
Parent=Turret
Position=0,0.0199,-0.0022
Rotation=0,0,0

[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.017,0
Rotation=0,0,0
Scale=0.025,0.034,0.03

[coll_collider]
Collider=Box
Position=0,0.017,0
Rotation=0,0,0
Scale=0.025,0.034,0.03
Layer=Default
