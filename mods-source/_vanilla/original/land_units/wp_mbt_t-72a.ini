[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.5                     // in meters
Beam=3.6                       // in meters
Range=243                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=10  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=T-72
Tag=Ground+Vehicle+Armor+Tank

[Physics]
HorsePower=780
Mass=41.5                      // in tons

MaxForwardVelocity=45.4        // in knots
MaxBackwardVelocity=2.7        // in knots
Braking=11                     // knots/sec
TurnRate=21                    // in degrees per second

TurretBlowOffChance=0.85       // Chance to blow off "Turret" submodel.

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=10
ArmorType=Moderate
IsCoveredByMainArmor=True

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.035,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=AdvancedOptics
MountPosition=0,0.023,0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=2

[WeaponSystem1]  #2A46
Type=Gun
SystemName=2A46
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-4,15
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxVelocityToFire=10
VIDIncrease=5  // In miles. Flat base VID increace when firing.

[WeaponSystem2]  #NSVT
Type=CIWS
SystemName=12.7mm_NSVT
#Sensors
#Animations
#Mount
Mount=MachinegunMount
IsMountRotatable=True
#Containers
ContainerBase=Machinegun
Gun=Machinegun
AreContainersRotatable=True
#Angles
ElevationArc=-5,45
RestAngles=180
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
MaxVelocityToFire=10
VIDIncrease=3  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=1
Ammunition1=wp_cal_125mm
Ammunition1_Count=43

[WeaponMagazineCIWS]
NumberOfAmmunitionTypes=1
Ammunition1_Count=2000
Ammunition1=wp_cal_05in
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=1
LOD1Distance=0.2 // nautical miles

ResourcesFolder=ground objects/wp_t72/
ResourcesRoot=wp_t72
ResourcesMesh=wp_t72_hull
ResourcesMaterial=wp_t72_mat

[Submodels]
Skirts=Skirts
Turret=Turret
Gun=Gun
MachinegunMount=MachinegunMount
Machinegun=Machinegun

[Skirts]
Mesh=wp_t72_tracks_skirts
Material=wp_t72_mat

[Turret]
Mesh=wp_t72_turret
Material=wp_t72_mat
Position=0,0,-0.0086

[Gun]
Mesh=wp_t72_barrel
Material=wp_t72_mat
Parent=Turret
Position=0,0.0231,0.013

[MachinegunMount]
Mesh=wp_t72_nsvt_gun_mount
Material=wp_t72_mat
Parent=Turret
Position=0.0083,0.029,-0.0046
Rotation=0,180,0

[Machinegun]
Mesh=wp_t72_nsvt_gun
ResourcesMaterialFolder=ships/materials/
Material=modular_parts
Parent=MachinegunMount
Position=-0.0001,0.003,0.0051

[---------- Effects ----------]
[Particles]
SmallFireEffectClass=VehicleSmokes
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=VehicleSmokes
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=VehicleSmokes
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

SecondaryPopPrefab=effects/land units/emitters/secondary_pop
TurretCookOffEffect=effects/land units/emitters/turret_cook-off
TurretFireEffect=effects/land units/emitters/turret_fire
TurretFireEffectPosition=0,0.025,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.0152,-0.01
Rotation=0,0,0
Scale=0.045,0.03,0.09

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default
