[General]
UnitType=LandUnit
LandUnitSubType=AAA //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.2
MinCameraDistanceBroadside=0.2
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=ZSU-23-4
Tag=Ground+Vehicle

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=AAW,Gun

[SensorData]
#Visual
VisualIdentificationRange=10  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge
Integrity=3

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=CIWS
SystemName=23mm_ZU-23
#Sensors
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Barrels
AreContainersRotatable=True
#Angles
FiringArcs=-180,180
ElevationArc=-15,85
RestAngles=20
#Loading
AssociatedMagazine=WeaponMagazine
#Effects
#Other
WorksStandalone=True
Collider=coll_zu-23
ModuleType=Weapon
ArmorType=None
Integrity=3 //the number of hit points substracted from the overall damage points count when the system is destroyed
VIDIncrease=4  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
############################################################
# Weapon Magazine Systems
############################################################
[WeaponMagazine]
NumberOfAmmunitionTypes=1
Ammunition1=wp_cal_23mm
Ammunition1_Count=2000
SystemGroup=Magazine
ModuleType=WeaponMagazine

#Enemy units will use this local coordinates to aim their attacks to
[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=0.0021,0.0226,-0.0059
TargetPointAssociatedSystems1=WeaponSystem1
TargetPointPriority1=High

