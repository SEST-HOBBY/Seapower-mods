[General]
UnitType=LandUnit
LandUnitSubType=Radar
IsMobile=False

DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=False

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SA-10
Tag=Ground+Vehicle+Radar

[Physics]
HorsePower=400
Mass=28.5                      // in tons

MaxForwardVelocity=65          // in knots
MaxBackwardVelocity=2.7        // in knots
Braking=10                     // knots/sec
TurnRate=20                    // in degrees per second


[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM,Radar

[SensorData]
#Visual
VisualIdentificationRange=7  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.03,0

#---------- FCR ----------
[SensorSystem2] #FCR
Type=Radar
SystemName=Pat_Hand
Mount=Mount
ModuleType=Sensor


[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=0

[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/wp_p-40/
ResourcesRoot=wp_p-40
ResourcesMesh=wp_p-40_trailer
ResourcesMaterial=wp_p-40_mat
############################################################

[Submodels]
Submodel1=Mount
Submodel2=Radar

[Mount]
