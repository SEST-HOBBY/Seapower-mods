TargetPoint_4_AssociatedSystems=HitZone4
TargetPoint_4_Priority=Medium
TargetPoint_5_Position=-2.828,0.051,-1.417
TargetPoint_5_AssociatedSystems=HitZone5
TargetPoint_5_Priority=Medium

[Models]
LODLevels=0
LOD1Distance=5.0  // nautical miles
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=scenery/nato_ewr_station/
ResourcesRoot=nato_ewr_station
ResourcesMesh=uk_ewr_complex_2_radars
ResourcesDamagedMesh=uk_ewr_complex_2_radars
ResourcesMaterialFolder=scenery/materials/
ResourcesMaterial=industrial_buildings_ne_us_1
############################################################
NumberOfSubModels=2

SubModel1=Buildings
SubModel2=Decal

############################################################
# Scenery model parts
############################################################
[Buildings]
Mesh=uk_ewr_complex_2_buildings
DamagedMesh=uk_ewr_complex_2_buildings
ResourcesMaterialFolder=scenery/materials/
Material=industrial_buildings_ne_us_1

[Decal]
Mesh=uk_ewr_complex_2_decal
DamagedMesh=uk_ewr_complex_2_decal
ResourcesMaterialFolder=scenery/nato_large_ewr_station/
Material=nato_large_ewr_station_decal

############################################################
############################################################
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=0.5
AmbientAudioAudibility=AboveAndBelow  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=ModerateShipFire	//SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SevereShipFire	//ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

