#HPIR: High Power Illuminator doppler Radar—target tracking, illumination and missile guidance
[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=1.5
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Hawk tr
Tag=Ground+AntiAircraft

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=Radar,ESM

[ControlSystem]
Collider=coll_hitbox  // makes unit destro
Integrity=3

[SensorData]
#Visual
VisualIdentificationRange=4  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0

[SensorSystem2] #Radar
Type=Radar
SystemName=AN/MPQ-48
Mount=Mount

[Models]
ResourcesFolder=ground objects/nato_mim-23_hawk/
ResourcesRoot=nato_mim-23_launcher
ResourcesMesh=nato_mim-23_CWAR_trailer
ResourcesMaterialFolder=ground objects/wp_radars/
ResourcesMaterial=wp_radars_trailers_mat
############################################################

[Submodels]
SubModel1=Mount
SubModel2=Radar

[Mount]
Mesh=nato_mim-23_CWAR_mount
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Position=0,0,0
HideWithActiveDamageModel=True

[Radar]
Mesh=nato_mim-23_CWAR_dish
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Parent=Mount
Position=0,0.0244,0
HideWithActiveDamageModel=True

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
NumberOfColliders=1
NumberOfMeshColliders=0
UseKinematicCollision=False

Collider1=coll_hitbox

[coll_hitbox]
Collider=Box
Position=0,0.0198,0
Rotation=0,0,0
Scale=0.03,0.04,0.05