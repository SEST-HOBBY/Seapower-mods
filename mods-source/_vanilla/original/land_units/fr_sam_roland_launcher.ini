[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #SAM
Type=Missile
SystemName=Roland
#Sensors
AssociatedSensors=SensorSystem3
#Animations
OpenSystemAnimation=Hide_Caps
CloseSystemAnimation=LoadAmmunition
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Rails_Launch
NumberOfContainers=2
AreContainersRotatable=True
Container1=Tube_Left
Container2=Tube_Right
#Angles
FixVerticalLaunchAngle=False
AdditionalFixVerticalLaunchAngle=25
ElevationArc=0,85
RestAngles=0,0
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
ForceMoveToLoadPosition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
ReloadsLowerDeck=True
ModuleType=Weapon
Collider=coll_hitbox,coll_turret
Integrity=2
VIDIncrease=10  // In miles. Flat base VID increace when firing.

