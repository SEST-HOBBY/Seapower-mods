[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=4.9                     // in meters
Beam=2.7                       // in meters
Range=172                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=M113 APC
Tag=Ground+Vehicle

[Physics]
HorsePower=215
Mass=10.4                      // in tons

MaxForwardVelocity=34.5        // in knots
MaxBackwardVelocity=10         // in knots
Braking=15                     // knots/sec
TurnRate=36                    // in degrees per second

[AI]
UnitScoreValue=0.2             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need Collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #M2HB
Type=CIWS
SystemName=M2HB
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-15,45
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
VIDIncrease=3  // In miles. Flat base VID increace when firing.
EffectPosition=0,0,-0.00375

[---------- WeaponMagazines ----------]
[WeaponMagazineCIWS]
NumberOfAmmunitionTypes=1
Ammunition1_Count=2000
Ammunition1=usn_cal_05in
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=1
LOD1Distance=0.7  // nautical miles
############################################################

ResourcesFolder=ground objects/usa_m113/
ResourcesRoot=usa_m113
ResourcesMesh=usa_m113_chassis
ResourcesMaterial=usa_m113_mat

[Submodels]
Turret=Turret
GunStand=GunStand
Gun=Gun

[Turret]
Mesh=usa_m113_turret
Material=usa_m113_mat
Parent=VisibleParent
Position=0,0.0265,-0.0023

[GunStand]
ResourcesMeshFolder=ground objects/usa_hmmwv/
RootMesh=usa_hmmwv_hd
Mesh=usa_hmmwv_m2hb_turret
ResourcesMaterialFolder=ships/materials/
Material=usn_parts
Parent=Turret
Position=0,-0.0005,0

[Gun]
ResourcesMeshFolder=ground objects/usa_hmmwv/
RootMesh=usa_hmmwv_hd
Mesh=usa_hmmwv_m2hb_gun
ResourcesMaterialFolder=ships/materials/
Material=usn_parts
Parent=GunStand
Position=0,0.0067,0.0076

[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0
MinVelocityForDust=5

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.01742,-0.0023
Rotation=0,0,0
Scale=0.04,0.035,0.07
Layer=Default

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default