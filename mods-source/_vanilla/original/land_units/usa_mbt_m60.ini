[General]
# M60A3 TTS (1982)
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.3                     // in meters
Beam=3.6                       // in meters
Range=100                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=8  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=M60
Tag=Ground+Vehicle+Armor+Tank

[Physics]
HorsePower=750
Mass=51                        // in tons

MaxForwardVelocity=30          // in knots
MaxBackwardVelocity=5          // in knots
Braking=10                     // knots/sec
TurnRate=20                    // in degrees per second

TurretBlowOffChance=0.2        // Chance to blow off "Turret" submodel.

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=8
ArmorType=Moderate
IsCoveredByMainArmor=True

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.042,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.03,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #M68A1
Type=Gun
SystemName=M68A1
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-4,15
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxVelocityToFire=5
VIDIncrease=5  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=1
Ammunition1=usn_cal_105mm
Ammunition1_Count=54
ModuleType=MediumMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
############################################################
# Internal Resources folder related
############################################################
LODLevels=1
LOD1Distance=1.0  // nautical miles

ResourcesFolder=ground objects/usa_m60/
ResourcesRoot=usa_m60
ResourcesMesh=usa_m60_hull
ResourcesMaterial=usa_m60_mat
############################################################

[Submodels]
Turret=Turret
Gun=Gun

[Turret]
Mesh=usa_m60_turret
Material=usa_m60_mat
Position=0,0.0252,0.009

[Gun]
Mesh=usa_m60_barrel
Material=usa_m60_mat
Parent=Turret
Position=0,0.0055,0.0185
[---------- Effects ----------]
[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

SecondaryPopPrefab=effects/land units/emitters/secondary_pop
TurretCookOffEffect=effects/land units/emitters/turret_cook-off
TurretFireEffect=effects/land units/emitters/turret_fire
TurretFireEffectPosition=0,0.012,-0.01

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.0174,0
Rotation=0,0,0
Scale=0.055,0.035,0.1

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
