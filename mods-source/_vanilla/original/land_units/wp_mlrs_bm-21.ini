[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=7.4                     // in meters
Beam=2.4                       // in meters
Range=405                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=BM-21 MLRS
Tag=Ground+Vehicle+Artillery

[Physics]
HorsePower=180
Mass=13.7                      // in tons

MaxForwardVelocity=40.5        // in knots
MaxBackwardVelocity=5          // in knots
Braking=16                     // knots/sec
TurnRate=40                    // in degrees per second

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=3

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.04,0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #GRAD-40
Type=Missile
SystemName=GRAD-40_BM21
#Sensors
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
ContainerBase=Launcher
NumberOfContainers=1
Container1=Launcher
AreContainersRotatable=True
#Angles
ElevationArc=-1,45
LoadAngles=0,0
FiringArcs=-90,90
#Loading
AssociatedMagazine=WeaponMagazineLauncher
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
Integrity=3
Collider=coll_hitbox

[---------- WeaponMagazines ----------]
[WeaponMagazineLauncher] #Purely fictional to mitigate lack of reloading
NumberOfAmmunitionTypes=1
Ammunition1=wp_grad
Ammunition1_Count=120 //40 on vehicle + 80 in reloading vehicle
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
############################################################
ResourcesFolder=ground objects/wp_bm-21/
ResourcesRoot=wp_bm-21
ResourcesMesh=wp_bm-21_chassis
ResourcesMaterialFolder=ground objects/wp_radars/
ResourcesMaterial=wp_urals_mat

[Submodels]
Mount=Mount
Launcher=Launcher

[Mount]
Mesh=wp_bm-21_mount
ResourcesMaterialFolder=ships/materials/
Material=modular_parts
Position=0,0.015,-0.0317

[Launcher]
Mesh=wp_bm-21_launcher
ResourcesMaterialFolder=ships/materials/
Material=modular_parts
Parent=Mount
Position=0,0.0144,-0.0161

[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.0197,0
Rotation=0,0,0
Scale=0.045,0.04,0.1

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default
