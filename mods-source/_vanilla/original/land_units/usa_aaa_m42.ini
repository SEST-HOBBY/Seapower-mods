[General]
UnitType=LandUnit
LandUnitSubType=AAA
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=5.82                     // in meters
Beam=3.23                       // in meters
Range=86.4                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=4  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=AAA
Tag=Ground+Vehicle

[Physics]
HorsePower=500
Mass=24.8                      // in tons

MaxForwardVelocity=38.8        // in knots
MaxBackwardVelocity=5          // in knots
Braking=13                     // knots/sec
TurnRate=28                    // in degrees per second

[AI]
UnitScoreValue=0.2             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=4

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] # M2A1 twin 40mm AA mount
#Port gun
Type=Gun
SystemName=M2A1
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=2
Gun1=Barrel_l
Gun2=Barrel_r
AreContainersRotatable=True
#Angles
ElevationArc=-10,65
#Loading
AssociatedMagazine=WeaponMagazine_40mm
#Effects
#Other
TargetAcquisitionTime=1
VIDIncrease=12  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazine_40mm]
NumberOfAmmunitionTypes=1
Ammunition1=usn_cal_40mm
Ammunition1_Count=336

[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/usa_m42/
ResourcesRoot=usa_m42
ResourcesMesh=usa_m42
ResourcesMaterial=usa_m42_mat
############################################################

[Submodels]
Turret=Turret
Gun=Gun
Barrel_l=Barrel_l
Barrel_r=Barrel_r
Crew=Crew

[Turret]
Mesh=usa_m42_turret
Material=usa_m42_mat
Position=0,0.0244,0.008

[Gun]
Mesh=usa_m42_gun
Material=usa_m42_mat
Parent=Turret
Position=0,0.0042,0

[Barrel_l]
Mesh=usa_m42_barrel_l
Material=usa_m42_mat
Parent=Gun
Position=0,0,0

[Barrel_r]
Mesh=usa_m42_barrel_r
Material=usa_m42_mat
Parent=Gun
Position=0,0,0

[Crew]
Mesh=usa_m42_crew
ResourcesMaterialFolder=ships/materials/
Material=usn_crew
Parent=Turret
Position=0,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.01742,-0.0023
Rotation=0,0,0
Scale=0.04,0.035,0.07
Layer=Default

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default