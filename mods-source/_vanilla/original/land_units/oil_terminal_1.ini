[General]
MaskVegetation=False
UnitType=LandUnit
HideIn=Encyclopedia,MissionEditor,Signatures
LandUnitSubType=Port //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DisplayClassName=Oil Terminal large
DefaultCameraDistance=20.0
MinCameraDistanceForeAft=13
MinCameraDistanceBroadside=13
CameraPivotHeight=0.15

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=150	//systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=5               // value for calculation of mission score
Role=Target

[SensorData]
#Visual
VisualIdentificationRange=15.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=0
AnimationFile_1=animations_wp_sam_site_sa-5

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
SystemGroup=SG_CIC
Collider=coll_platform_central_command,coll_platform_central_command_2
ModuleType=CIC
Integrity=50 //the number of hit points substracted from the overall damage points count when the system is destroyed
ArmorType=Minor
ResilenceModifier=3.0 //the multiplier that affects the required accumulated damage level for the system to achieve new damage tier. E.g. if this parameter is equal to 2.0 and Severe damage tier value is 15, the actual Severe damage value will be no less than 2 * 15 = 30

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Eyes
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=0

[---------- HitZones ----------]
[HitZones]
NumberOfHitZones=5

[HitZone1]
Collider=coll_platform_central_command
Integrity=35 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
Collider=coll_platform_1_buildings
Integrity=50 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone3]
Collider=coll_platform_2_buildings
Integrity=35 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone4]
Collider=coll_platform_3_buildings
Integrity=25 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone5]
Collider=coll_platform_4_fueltanks
Integrity=15 //the number of hit points substracted from the overall damage points count when the system is destroyed

