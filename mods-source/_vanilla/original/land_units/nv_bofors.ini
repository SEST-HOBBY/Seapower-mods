[General]
UnitType=LandUnit
LandUnitSubType=AAA //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Bofors 40
Tag=Ground+Vehicle

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=AAW,Gun

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge
Integrity=3

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=Gun
SystemName=Bofors_L60
#Sensors
NumberOfAssociatedSensors=1
AssociatedSensor1=SensorSystem1
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
FiringArcs=-180,180
ElevationArc=-5,85
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazine
#Effects
#Other
WorksStandalone=True
MaxReactiontime=5
Collider=coll_nv_bofors
ModuleType=Weapon
ArmorType=None
Integrity=3 //the number of hit points substracted from the overall damage points count when the system is destroyed
VIDIncrease=12  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
############################################################
# Weapon Magazine Systems
############################################################
[WeaponMagazine]
NumberOfAmmunitionTypes=1
Ammunition1=nv_cal_40mm
Ammunition1_Count=600
SystemGroup=Magazine
ModuleType=WeaponMagazine

#Enemy units will use this local coordinates to aim their attacks to
[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=0.0021,0.0226,-0.0059
TargetPointAssociatedSystems1=WeaponSystem1
TargetPointPriority1=High

[Models]
LODLevels=2
LOD1Distance=0.2  // nautical miles
LOD2Distance=0.4  // nautical miles
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/nv_bofors_1939/
ResourcesRoot=nv_bofors_1939
ResourcesMesh=nv_bofors_base
############################################################

[Submodels]
Chassis=Chassis
Mount=Mount
Gun=Gun
Barrel=Barrel
Gunners=Crew

[Chassis]
Mesh=nv_bofors_chassis
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Position=0,0,0

[Mount]
Mesh=nv_bofors_mount
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Position=0,0,0

[Gun]
Mesh=nv_bofors_gun
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Parent=Mount
Position=0,0.0224,0.0011

[Barrel]
Mesh=nv_bofors_barrel
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Parent=Gun
Position=0,0,0

[Crew]
Mesh=nv_bofors_gunners
ResourcesMaterialFolder=ships/materials/
Material=nv_crew
Parent=Mount
Position=0,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
Collider1=coll_nv_bofors

[coll_nv_bofors]
Collider=Sphere
Position=0.0,0.02,0
Rotation=0,0,0
Scale=0.08,0.08,0.08