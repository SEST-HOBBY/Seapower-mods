[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=7.4                     // in meters
Beam=2.5                       // in meters
Range=500                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=37mm AAA 61-K Ural
Tag=Ground+Vehicle

[Physics]
HorsePower=240
Mass=7.9                       // in tons

MaxForwardVelocity=43.2        // in knots
MaxBackwardVelocity=5.4        // in knots
Braking=16                     // knots/sec
TurnRate=42                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=AAW,Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destructable
Integrity=3

[SensorData]
#Visual
VisualIdentificationRange=4  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.03,0.025
ModuleType=Bridge

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=Gun
SystemName=37mm_61K
#Sensors
NumberOfAssociatedSensors=1
AssociatedSensor1=SensorSystem1
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
FiringArcs=30,-30
ElevationArc=-5,85
RestAngles=180
#Loading
AssociatedMagazine=WeaponMagazine
#Effects
#Other
WorksStandalone=True
MaxReactiontime=2
ModuleType=Weapon
ArmorType=None
VIDIncrease=8  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazine]
NumberOfAmmunitionTypes=1
Ammunition1=wp_cal_37mm
Ammunition1_Count=600
ModuleType=WeaponMagazine

#Enemy units will use this local coordinates to aim their attacks to
[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=0.0021,0.0226,-0.0059
TargetPointAssociatedSystems1=WeaponSystem1
TargetPointPriority1=High

[Models]
LODLevels=0
LOD1Distance=0.2  // nautical miles
LOD2Distance=0.4  // nautical miles
############################################################

ResourcesFolder=ground objects/wp_urals/
ResourcesRoot=wp_urals
ResourcesMesh=wp_ural_61k
ResourcesMaterialFolder=ground objects/wp_radars/
ResourcesMaterial=wp_urals_mat
############################################################

[Submodels]
Mount=Mount
Gun=Gun
Barrel=Barrel
Details=Details
Crew=Crew

[Mount]
Mesh=wp_ural_61k_turret
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Position=0,0.02133,-0.0212
Rotation=0,180,0

[Gun]
Mesh=wp_ural_61k_gun
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Parent=Mount
Position=0,0.011177,0.00168

[Barrel]
Mesh=wp_ural_61k_barrel
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Parent=Gun
Position=0,0,0

[Details]
Mesh=wp_ural_61k_details
ResourcesMaterialFolder=ships/materials/
Material=usn_parts

[Crew]
Mesh=wp_ural_61k_crew
ResourcesMaterialFolder=ships/materials/
Material=nv_crew
Parent=Mount
Position=0,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.027,0
Rotation=0,0,0
Scale=0.04,0.055,0.115

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default