[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DisplayClassName=Refinery_Small
DefaultCameraDistance=2.0
MinCameraDistanceForeAft=1
MinCameraDistanceBroadside=1
CameraPivotHeight=0.15

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=50  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=5               // value for calculation of mission score
Role=Target

[SensorData]
#Visual
VisualIdentificationRange=15.0
IRSignature=Large
# Radar related (RCS => radar cross section)
RCS=Medium

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=0
AnimationFile_1=none

[ControlSystem]
#Connected to all colliders to ensure destruction even if hitting only 1 collider all the time
Collider=coll_refinery_main,coll_refinery_building_1,coll_refinery_building_2,coll_refinery_storage,coll_refinery_building_small
ModuleType=CIC
Integrity=200 //the number of hit points substracted from the overall damage points count when the system is destroyed
ArmorType=None

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Eyes
Mount=Dummy
MountPosition=0,0.026,0 #Crew on ground level
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=0

[---------- HitZones ----------]
[HitZones]
NumberOfHitZones=5

[HitZone1]
MountPosition=-0.614,0.114,1.015
Collider=coll_refinery_main
ModuleType=HitZone
Integrity=40 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
