[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=3               // value for calculation of mission score
Role=ASuW,Gun

[SensorData]
#Visual
VisualIdentificationRange=6  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.032,0
ModuleType=Bridge
DamageContribution=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=Gun
SystemName=130mm_B-13
#Sensors
AssociatedSensors=SensorSystem1
#Animations
#Mount
Mount=B-13-3c_Shield
IsMountRotatable=True
#Containers
ContainerBase=B-13_Gun
NumberOfGuns=1
Gun1=B-13_Barrel
AreContainersRotatable=True
#Angles
FiringArcs=-180,180
ElevationArc=-4,45
#Loading
AssociatedMagazine=WeaponMagazine
#Effects
#Other
Collider=coll_B-13
ModuleType=Weapon
ArmorType=Minor
VIDIncrease=20  // In miles. Flat base VID increace when firing.
Integrity=5 //the number of hit points substracted from the overall damage points count when the system is destroyed

[---------- WeaponMagazines ----------]
############################################################
# Weapon Magazine Systems
############################################################
[WeaponMagazine]
NumberOfAmmunitionTypes=1
Ammunition1=wp_cal_130mm
Ammunition1_Count=200
SystemGroup=Magazine
ModuleType=WeaponMagazine

#Enemy units will use this local coordinates to aim their attacks to
#[TargetingData]
#NumberOfTargetPoints=1
#TargetPointPosition1=0.0021,0.0226,-0.0059
#TargetPointAssociatedSystems1=WeaponSystem1
#TargetPointPriority1=High

[Models]
LODLevels=2
LOD1Distance=0.25  // nautical miles
LOD2Distance=0.6  // nautical miles
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/wp_b-13_shore_gun/
ResourcesRoot=wp_b-13_shore_gun
ResourcesMesh=wp_b-13_base
ResourcesMaterialFolder=ships/materials/
ResourcesMaterial=modular_parts
############################################################

