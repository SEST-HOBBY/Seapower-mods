[General]
UnitType=LandUnit
LandUnitSubType=AAA //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True

Length=7.6                     // in meters
Beam=2.5                        // in meters
Range=0                         // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=AAA
Tag=Ground+Vehicle

[Physics]
HorsePower=0
Mass=3.97                     // in tons

MaxForwardVelocity=0          // in knots
MaxBackwardVelocity=0         // in knots
Braking=0                     // knots/sec
TurnRate=0                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=AAW,Gun

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge
Integrity=3

[SensorSystem2] #Local_GFCR_V
Type=Radar
SystemName=Local_GFCR_V
Mount=Dummy
MountPosition=0,0.026,0
Radar=Radar

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=Gun
SystemName=M35
#Sensors
AssociatedSensors=SensorSystem2
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
FiringArcs=-180,180
ElevationArc=-5,85
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazine
#Effects
#Other
WorksStandalone=True
MaxReactiontime=1.5
Collider=coll_hitbox
ModuleType=Weapon
ArmorType=None
Integrity=3 //the number of hit points substracted from the overall damage points count when the system is destroyed
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazine]
NumberOfAmmunitionTypes=1
Ammunition1=usn_cal_75mm
Ammunition1_Count=640
SystemGroup=Magazine
ModuleType=WeaponMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=2
LOD1Distance=0.4  // nautical miles
LOD2Distance=0.6  // nautical miles
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/usa_m51/
ResourcesRoot=usa_m51
ResourcesMesh=usa_m51_base
ResourcesMaterialFolder=ground objects/usa_m51/
ResourcesMaterial=usa_m51_mat
############################################################

[Submodels]
#---------- General ----------
Mount=Mount
Crew=Crew
#---------- Sensors ----------
Radar=Radar
#---------- Weapons ----------
Gun=Gun
Barrel=Barrel

############################################################
#---------- General ----------
############################################################
[Chassis]
Mesh=usa_m51_base
Material=usa_m51_mat

[Crew]
Mesh=usa_m51_crew
ResourcesMaterialFolder=ships/materials/
Material=usn_crew
Parent=Mount
Position=

############################################################
#---------- Sensors ----------
############################################################
[Radar]
Mesh=us_m51_dish
Material=usa_m51_mat
Parent=Mount
Position=-0.0133,0.0259,0.025

############################################################
#---------- Weapons ----------
############################################################
[Mount]
Mesh=usa_m51_turret
Material=usa_m51_mat
Position=0,0,0

[Gun]
Mesh=usa_m51_gun
Material=usa_m51_mat
Parent=Mount
Position=0,0.0154,-0.0023

[Barrel]
Mesh=usa_m51_barrel
Material=usa_m51_mat
Parent=Gun
Position=0,0,0

[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
NumberOfColliders=1
Collider1=coll_hitbox

[coll_hitbox]
Collider=Sphere
Position=-0.0005,0.0132,0.0035
Rotation=0,0,0
Scale=0.08,0.08,0.08