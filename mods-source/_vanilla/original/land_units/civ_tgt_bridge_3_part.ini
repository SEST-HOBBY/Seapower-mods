[General]
UnitType=LandUnit
LandUnitSubType=Bridge //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DisplayClassName=Bridge (3 girders)
DefaultCameraDistance=4.5
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=1.5
CameraPivotHeight=0.25

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=100  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Bridge_3_part
Tag=Ground+Vehicle

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Target

[ControlSystem]
Collider=coll_deck,coll_deck_end_1,coll_deck_end_2,coll_pillar_1,coll_pillar_2,coll_pillar_3,coll_pillar_4
Integrity=100
FiresPositions=0,0.29,-3|0,0.29,-1.25|0,0.29,3|0,0.29,1.25 //Overrides automatic fire positions from colliders. Works only for land units
MinMaxRandomFires=2|3 //Allows to spawn a random number of fires at the random positions from above list. Can not exceed number of FiresPositions

[SensorData]
#Visual
VisualIdentificationRange=15.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=-0.182,0.152,0.413
Integrity=0

