MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=False

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=1  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Square_Pair
Tag=Ground+Vehicle+Radar

[Physics]
HorsePower=400
Mass=28.5                      // in tons

MaxForwardVelocity=65          // in knots
MaxBackwardVelocity=2.7        // in knots
Braking=10                     // knots/sec
TurnRate=20                    // in degrees per second


[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM,Radar

[SensorData]
#Visual
VisualIdentificationRange=7  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[ControlSystem]
