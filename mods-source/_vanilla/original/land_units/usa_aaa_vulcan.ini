[General]
UnitType=LandUnit
LandUnitSubType=AAA
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=4.9                     // in meters
Beam=2.9                       // in meters
Range=259                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=AAA Vulcan
Tag=Ground+Vehicle

[Physics]
HorsePower=215
Mass=12.3                      // in tons

MaxForwardVelocity=36.7        // in knots
MaxBackwardVelocity=5          // in knots
Braking=14                     // knots/sec
TurnRate=30                    // in degrees per second

[AI]
UnitScoreValue=0.2             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #M168
Type=CIWS
SystemName=M168
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-5,60
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
VIDIncrease=4  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineCIWS]
NumberOfAmmunitionTypes=1
Ammunition1_Count=1030
Ammunition1=usn_cal_20mm
ModuleType=SmallMagazine

[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/usa_m163/
ResourcesRoot=usa_m163
ResourcesMesh=us_m163_chassis
ResourcesMaterial=usa_m163_mat
############################################################

[Submodels]
Turret=Turret
Gun=Gun
Crew=Crew

[Turret]
Mesh=us_m163_turret
Material=usa_m163_mat
#Parent=VisibleParent
Position=0,0.0265,-0.0023

[Gun]
Mesh=us_m163_gun
Material=usa_m163_mat
Parent=Turret
Position=0,0.0056,0.0029

[Crew]
Mesh=us_m163_crew
ResourcesMaterialFolder=ships/materials/
Material=usn_crew
Parent=Turret
Position=0,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

