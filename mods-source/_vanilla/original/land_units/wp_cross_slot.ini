[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.06

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Radar
Tag=Ground

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=Radar,ESM

[SensorData]
#Visual
VisualIdentificationRange=3  // Camouflaged  (x0.5)
IRSignature=Tiny
# Radar related (RCS => radar cross section)
RCS=VerySmall

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge
Collider=coll_tower
Integrity=3

[SensorSystem2] #ESM
#UPX-29 IFF Interrogator
Type=ESM
SystemName=VesselESM
Mount=Dummy
MountPosition=0,0.08,0
Collider=coll_ecm

[SensorSystem3] #NavRadar
Type=Radar
SystemName=Cross_Slot
Mount=Radar
Collider=coll_radar

[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/wp_cross_slot/
ResourcesRoot=wp_cross_slot
ResourcesMesh=wp_cross_slot
ResourcesDamagedMesh=wp_cross_slot_d
ResourcesMaterialFolder=ground objects/wp_cross_slot/
ResourcesMaterial=wp_cross_slot_mat
############################################################

[Submodels]

SubModel1=Radar
SubModel2=Radar_trans
SubModel3=Trans
SubModel4=Trailer

[Radar]
Mesh=wp_cross_slot_radar
Material=wp_cross_slot_mat
Position=0,0.0695,0
HideWithActiveDamageModel=False

[Radar_trans]
Mesh=wp_cross_slot_radar_trans
Material=wp_cross_slot_trans_mat
Parent=Radar
Position=0,0,0
HideWithActiveDamageModel=False

[Trans]
Mesh=wp_cross_slot_trans
Material=wp_cross_slot_trans_mat
HideWithActiveDamageModel=False

[Trailer]
Mesh=wp_cross_slot_trailer
Material=wp_cross_slot_mat
HideWithActiveDamageModel=False

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=0.2,2
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=0.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=3
Collider1=coll_tower
Collider2=coll_radar
Collider3=coll_ecm

NumberOfMeshColliders=2
MeshCollider1=coll_1
MeshCollider2=coll_2

[coll_tower]
Collider=Hitbox
Position=0,0.05,0
Rotation=0,0,0
Scale=0.05,0.1,0.05

[coll_radar]
Collider=Hitbox
Position=0,0.085,0
Rotation=0,0,0
Scale=0.025,0.025,0.025

[coll_ecm]
Collider=Hitbox
Position=0,0.065,0
Rotation=0,0,0
Scale=0.01,0.01,0.01

[coll_1]
Collider=wp_cross_slot_coll

[coll_2]
Collider=wp_cross_slot_trailer_coll
