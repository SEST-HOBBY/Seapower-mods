[General]
UnitType=LandUnit
LandUnitSubType=Port //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=12.0
MinCameraDistanceForeAft=0.8
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.2
Length=352.1

EncyclopediaGeoPos=31.5166,26.4395,15
EncyclopediaHeading=6

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=350  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=10              // value for calculation of mission score
Role=Target

[SensorData]
#Visual
VisualIdentificationRange=10  // Camouflaged  (x0.5)
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.375,0
ModuleType=Bridge
Collider=coll_cic
Integrity=20
[---------- HitZones ----------]
[HitZones]
NumberOfHitZones=5
[HitZone1]
SystemName=Warehouse
Collider=coll_warehouse
Integrity=100 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
SystemName=Building
Collider=coll_building
Integrity=80 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone3]
SystemName=Dock1
Collider=coll_dock
Integrity=100 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone4]
