[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=4.6                     // in meters
Beam=2.2                       // in meters
Range=350                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=2  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=HMMWV
Tag=Ground+Vehicle

[Physics]
HorsePower=170
Mass=2.7                       // in tons

MaxForwardVelocity=55          // in knots
MaxBackwardVelocity=10         // in knots
Braking=20                     // knots/sec
TurnRate=55                    // in degrees per second

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Transport

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=2

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.04,0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #TOW
Type=Missile
SystemName=TOW
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfContainers=1
Container1=Dummy
Container1_Position=0,0,0.005
#Angles
RestAngles=0,0
LoadAngles=Any
#Loading
AssociatedMagazine=WeaponMagazineTOW
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
VIDIncrease=8  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineTOW]
NumberOfAmmunitionTypes=1
Ammunition1=usa_bgm-71c
Ammunition1_Count=7
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]

############################################################

ResourcesFolder=ground objects/usa_hmmwv/
ResourcesRoot=usa_hmmwv_hd
ResourcesMesh=usa_hmmwv
ResourcesMaterial=usa_hmmwv_hd_mat
############################################################

[Submodels]
TurretBase=TurretBase
Turret=Turret
Gun=Gun

[TurretBase]
Mesh=usa_hmmwv_tow_turret_base
ResourcesMaterialFolder=ships/materials/
Material=usn_parts

[Turret]
Mesh=usa_hmmwv_tow_turret
ResourcesMaterialFolder=ships/materials/
Material=usn_parts
Parent=TurretBase
Position=0.0045,0.0264,-0.0007

[Gun]
Mesh=usa_hmmwv_tow_launcher
ResourcesMaterialFolder=ships/materials/
Material=usn_parts
Parent=Turret
Position=0,0.0068,0

[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.01742,-0.0023
Rotation=0,0,0
Scale=0.04,0.035,0.07
Layer=Default

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default