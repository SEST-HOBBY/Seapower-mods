[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.2                     // in meters
Beam=3.27                       // in meters
Range=202                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=8  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=T-55M
Tag=Ground+Vehicle+Armor+Tank

[Physics]
HorsePower=620
Mass=36                        // in tons

MaxForwardVelocity=27          // in knots
MaxBackwardVelocity=5          // in knots
Braking=10                     // knots/sec
TurnRate=20                    // in degrees per second

TurretBlowOffChance=0.6        // Chance to blow off "Turret" submodel.

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=8
ArmorType=Moderate
IsCoveredByMainArmor=True

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3

#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.035,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.023,0

[SensorSystem3] #Laser Designator
Type=LaserDesignator
SystemName=Volna
MountPosition=0,0.027,0.0264

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=3

[WeaponSystem1] #Missile
Type=Missile
SystemName=Bastion
#Sensors
AssociatedSensors=SensorSystem3
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfContainers=1
Container1=Dummy
Container1_Position=0,0,0.064
#Angles
RestAngles=0,0
LoadAngles=Any
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
VIDIncrease=8  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2  //List of systems
SharesReloadWith=WeaponSystem2  //List of systems

[WeaponSystem2] #100mm_D-10
Type=Gun
SystemName=100mm_D-10
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
ElevationArc=-4,18
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxVelocityToFire=5
VIDIncrease=5  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1  //List of systems
SharesReloadWith=WeaponSystem1  //List of systems

[WeaponSystem3] #DSHK
Type=CIWS
SystemName=12.7mm_DSHK
#Sensors
#Animations
#Mount
Mount=MachinegunMount
IsMountRotatable=True
#Containers
ContainerBase=Machinegun
Gun=Machinegun
AreContainersRotatable=True
#Angles
ElevationArc=-5,45
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
MaxVelocityToFire=10
VIDIncrease=3  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=wp_at-10
Ammunition1_Count=8
ModuleType=SmallMagazine

[WeaponMagazineGun]
NumberOfAmmunitionTypes=1
Ammunition1=wp_cal_100mm_d10
Ammunition1_Count=35

[WeaponMagazineCIWS]
NumberOfAmmunitionTypes=1
Ammunition1_Count=2000
Ammunition1=wp_cal_05in
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
