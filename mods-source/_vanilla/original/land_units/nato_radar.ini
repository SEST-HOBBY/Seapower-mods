#Dome generic NATO radar
[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=3.5
MinCameraDistanceForeAft=2.5
MinCameraDistanceBroadside=2.5
CameraPivotHeight=0.1

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=10  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=55G6
Tag=Ground+AntiAircraft

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Radar

[SensorData]
#Visual
VisualIdentificationRange=8  // Camouflaged  (x0.5)
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need сollider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.21,0
ModuleType=Bridge

[SensorSystem2] #NavRadar
Type=Radar
SystemName=AN/FPS-117
Mount=Dummy
MountPosition=0,0.38,0	//adjusted mount height
Collider=coll_radar_base
Integrity=10

[Models]
LODLevels=2
LOD1Distance=2  // nautical miles
LOD2Distance=4  // nautical miles
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/nato_radar/
ResourcesRoot=nato_radar
ResourcesMesh=nato_radar
ResourcesDamagedMesh=nato_radar
ResourcesMaterialFolder=scenery/materials/
ResourcesMaterial=industrial_buildings_ne_us_1
############################################################

[Submodels]
SubModel1=Trans

[Trans]
Mesh=nato_radar_trans
ResourcesMaterialFolder=scenery/materials/
Material=trans
HideWithActiveDamageModel=False

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[Particles]
SmallFireEffectClass=NatoRadarFire	//SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=NatoRadarFire	//SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=NatoRadarFire	//SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
Collider1=coll_radar_base

NumberOfMeshColliders=0
#MeshCollider1=coll_1

[coll_radar_base]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.3,0.6,0.3