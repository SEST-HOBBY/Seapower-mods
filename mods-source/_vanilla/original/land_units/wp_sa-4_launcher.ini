[General]
UnitType=LandUnit
LandUnitSubType=SAM

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SA-4
Tag=Ground+Vehicle+SAM

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=8  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need Collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.02,0.027
ModuleType=Bridge

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #SA-4 Ganef
Type=Missile
SystemName=SA-4
#Sensors
ExternalGuidingSystems=Pat_Hand
ExternalGuidingSystemSearchRadius=0.5     // in nmi
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
NumberOfContainers=1
ContainerBase=Rail
NumberOfContainers=1
Container1=Rail
AreContainersRotatable=True
Container1_Position=0,0,0
#0,0.0129,0.0605
Container1_Rotation=0,0,0
#Angles
ElevationArc=30,45
RestAngles=0,0
LoadAngles=0,0
#Loading
Ammunition=wp_sa-4
ReloadableWithoutMagazine=True
ForceMoveToLoadPosition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
Integrity=5
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[--------------------------- Mesh definitions ---------------------------]
[Models]
ResourcesFolder=ground objects/wp_sa-4_ganef/
ResourcesRoot=wp_sa-4_ganef
ResourcesMesh=wp_sa-4_hull
ResourcesMaterial=wp_sa-4_ganef_mat
############################################################

[Submodels]
#Base=Base
Mount=Mount
Rail=Rail

[Mount]
Mesh=wp_sa-4_mount
Material=wp_sa-4_ganef_mat
Position=0,0.02496,-0.004

[Rail]
Mesh=wp_sa-4_rail
Material=wp_sa-4_ganef_mat
Parent=Mount
Position=0,0.0145,-0.0446

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
NumberOfColliders=1
NumberOfMeshColliders=0
UseKinematicCollision=False

Collider1=coll_hitbox

[coll_hitbox]
Collider=Box
Position=0,0.026,0
Rotation=0,0,0
Scale=0.04,0.05,0.1
