[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DisplayClassName=Fueltanks
DefaultCameraDistance=10.0
MinCameraDistanceForeAft=3
MinCameraDistanceBroadside=3
CameraPivotHeight=0.15

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=80  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=5               // value for calculation of mission score
Role=Target

[SensorData]
#Visual
VisualIdentificationRange=20.0
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=0
AnimationFile_1=none

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
SystemGroup=SG_CIC
Collider=coll_fueltanks_1
ModuleType=CIC
Integrity=5 //the number of hit points substracted from the overall damage points count when the system is destroyed
ArmorType=Minor
ResilenceModifier=3.0 //the multiplier that affects the required accumulated damage level for the system to achieve new damage tier. E.g. if this parameter is equal to 2.0 and Severe damage tier value is 15, the actual Severe damage value will be no less than 2 * 15 = 30

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Eyes
Mount=Dummy
MountPosition=0,0.026,0 #Crew on ground level
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=0

[---------- HitZones ----------]
[HitZones]
NumberOfHitZones=5

[HitZone1]
Collider=coll_fueltanks_1
Integrity=15 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
Collider=coll_fueltanks_6
Integrity=15 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone3]
Collider=coll_fueltanks_7
Integrity=15 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone4]
Collider=coll_fueltanks_4
Integrity=15 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone5]
Collider=coll_fueltanks_9
Integrity=15 //the number of hit points substracted from the overall damage points count when the system is destroyed

