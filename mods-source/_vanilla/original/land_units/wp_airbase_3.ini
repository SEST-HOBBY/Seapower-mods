#WP airbase 3 layout based on Solovetsky
[General]
UnitType=LandUnit
LandUnitSubType=Airbase //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port

DefaultCameraDistance=22.0
MinCameraDistanceForeAft=2
MinCameraDistanceBroadside=2

MinCameraDistanceForeAft=22
MinCameraDistanceBroadside=22
CameraPivotHeight=0.15

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=300  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=10              // value for calculation of mission score
Role=Airfield

[SensorData]
#Visual
VisualIdentificationRange=20.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge

[ControlSystem]
Collider=coll_selection,coll_control_tower,coll_area_1,coll_area_2,coll_area_3,coll_runway,coll_road,coll_fueltanks
Integrity=1000

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_wp_large_pvo_airbase

