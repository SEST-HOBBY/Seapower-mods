[LoadoutNames]
#------------------------------------------ New system ------------------------------------------
# - LongRange means operating range of aircraft, not the weapons range
# ---------- Mandatory loadouts ----------
Default=Normal                           // Generalmente, la configuración más común para este avión
Ferry=Ferry                                // Máximos tanques de combustible, sin armas, excepto cañones y Chaff
Empty=Vacío                               // Sin tanques de combustible, sin armas, excepto cañones y Chaff

# ---------- Anti Air loadouts ----------
AirToAir=Dogfight                       // Configuración estándar de Aire a Aire para el tipo
AirToAirLongRange= Patrulla Aérea De Combate   // Aire a Aire con menos armas y más combustible
AirToAirIntercept=Interceptor    // Configuraciones de Aire a Aire con énfasis en MRAAM/SRAAM

# ---------- Anti Surface loadouts ----------
Strike=Strike                              // Bombas no guiadas en 1 salva
StrikeLongRange=Ataque de Largo Alcance         // Igual que Ataque pero con menos armas y más combustible
StrikePrecision=Ataque de Precisón// Bombas guiadas o misiles de Ataque (como AS-7)
StrikeHeavy=Ataque Pesado                 // Configuración de Ataque para bombarderos pesados. (Para marcarlo para el uso de la IA)

CAS=Apoyo Aéreo Cercano                     // Cohetes, bombas de racimo, bombas. Por lo general, en pequeñas salvas para aumentar el número de ataques
AntiArmor=AntiTanque                       // Misiles de Ataque mayormente útiles solo para vehículos terrestres (como AS-7)

# ---------- Anti Ship loadouts ----------
AntiShip=Anti Buque                      // Configuración más vaga. Puede incluir cualquier cosa, desde bombas no guiadas hasta misiles de medio alcance
AntiShipLongRange=Anti Buque de Largo Alcance       // Igual que AntiShip, pero con tanques de combustible
AntiShipPrecision=Anti Buque de Precisión     // Otra configuración vaga. Puede incluir bombas guiadas y misiles
AntiShipHeavy=Anti Buque Pesado            // Designed para mark heavy anti-buque bombers like Tu-22 and Tu-16 and small planes con most weapons

# ---------- Anti Sub loadouts ----------
ASW=ASW                                    // Multirole ASW: Torpedoes, profundidad Charges, Sonobuoys
ASWHunter=Patrulla ASW     // Sonobuoys only, no weapons
ASWKiller=Cazador ASW                      // ASW weapons only

# ---------- Special loadouts ----------
SEAD=SEAD                                  // Anti-radiation missilies, Cluster bombs
SEADLongRange=SEAD de Largo Alcance              // Same as SEAD, but menos weaons and más fueltanks

AEW=Alerta Temprana                        // Just a flavor naming para indicate plane purpose. This loadout supposed para be equal para "Empty"
Recon=Reconocimiento                               // Also indicates plane purpose. en some cases used para carrying recon pods.
EW=Guerra Electrónica                    // Also indicates plane purpose. en some cases used para carrying EW pods.
Transport=Transporte                      // Also indicates purpose.
Gun=cañón Only                               // Solo munición de cañón cargada
# ---------- Cargo loadouts ----------
Containers=Contenedores
Munitions=Municiones
MilitaryVehicles=Vehículos Militares
DryCargo=Carga Seca
Vehicles=Vehículos
Fertilizer=Fertilizante
Lighters=Gabarras
Oil=Petróleo
Ore=Mineral
Passengers=Pasajeros
Troops=Tropas

# ---------- Generic Unit Loadout Options ----------
Early=Temprano
Late=Tardío