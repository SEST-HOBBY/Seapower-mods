[swe_ersta]
Type=Artillería Costera
Default=Batería ERSTA, Artillería Costera
DefaultDescription=El tornautomatpjäs m/70 de 12 cm (también conocido como ERSTA) es una pieza de artillería costera sueca diseñada para reemplazar a los cañones más antiguos de la era de la Segunda Guerra Mundial. Está diseñado para defender áreas vitales como los puertos de las fuerzas de desembarco soviéticas, así como para realizar la denegación de área. Estos cañones estaban conectados a instalaciones de apoyo que permitían a las tripulaciones mantenerse durante un máximo de 60 días, lo que sería importante en un posible campo de batalla nuclear. Ocho de estos cañones también se exportaron a Noruega a fines de la década de 1980.
Variant1=Batería ERSTA, Artillería Costera
