DefaultDescription=En servicio desde 1975, estos portaaviones V/STOL son el diseño de seguimiento de los cruceros portahelicópteros Moskva. Destinados a la misión antisubmarina, estos barcos portan una impresionante variedad de misiles antibuque y antiaéreos, además de amplias capacidades ASW. A diferencia de los portaaviones de la Armada de los Estados Unidos, su principal fuerza ofensiva reside en su batería de misiles de crucero, y los aviones a bordo se utilizan principalmente para la cobertura aérea. Estos barcos a menudo operan como buques insignia en grupos de ataque o de búsqueda y destrucción.
