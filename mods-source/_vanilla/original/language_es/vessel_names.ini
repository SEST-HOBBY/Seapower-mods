DefaultDescription=La Marina de los EE. UU. designó oficialmente a estos arrastreros como "Auxiliar, Inteligencia General" o AGI, y eran conocidos informalmente como "Chismosos". Un AGI podría ser asignado a una sola estación de patrulla durante hasta seis meses. Estos barcos no eran lo suficientemente rápidos para seguir el ritmo de la mayoría de los buques de guerra, pero a veces se congregaban alrededor de portaaviones que realizaban operaciones aéreas de la Sexta Flota de EE. UU. en el Mediterráneo o la Séptima Flota en el Océano Pacífico occidental, o en áreas de patrulla sospechosas de submarinos de misiles balísticos. La mayoría de estos buques comenzaron su carrera como arrastreros regulares.
