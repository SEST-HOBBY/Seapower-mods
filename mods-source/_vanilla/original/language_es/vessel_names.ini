[****************************** Japón ******************************]
[jmsdf_ddh_haruna]
Type=DDH,Destructor
Default=Clase Haruna,Haruna
DefaultDescription=Demostrando el enfoque casi exclusivo de la JMSDF en la guerra antisubmarina, dos de los destructores de la clase Haruna fueron construidos a principios de la década de 1970. El armamento principal de estas naves es el trío de helicópteros ASW HSS-2 (un SH-3 construido bajo licencia) en su hangar. Sus otros sistemas son similares a la clase Takatsuki, ligeramente anterior.
Variant1=Haruna DDH-141,Haruna
Variant2=Hiei DDH-142,Hiei

[jmsdf_ddg_tachikaze]
Type=DDG,Destructor
Default=Clase Tachikaze,Tachikaze
DefaultDescription=Construidos tras la experiencia de la JMSDF con el Amatsukaze, tres de estos pequeños DDG sirvieron desde mediados hasta finales de la década de 1970 hasta principios de la década de 2010. Como la mayoría de los buques navales japoneses de la década de 1970, su función principal es la guerra antisubmarina, pero están equipados con el mismo lanzador Mk 13 "One Armed Bandit" que la clase Oliver-Hazard Perry, lo que les proporciona una capacidad antiaérea relativamente potente.
Variant1=Tachikaze DDG-168,Tachikaze
Variant2=Asakaze DDG-169,Asakaze
Variant3=Sawakaze DDG-170,Sawakaze

[jmsdf_dd_minegumo]
Type=DD,Destructor
Default=Clase Minegumo,Minegumo
DefaultDescription=Tres de estos destructores de guerra antisubmarina fueron construidos para la JMSDF a finales de la década de 1960, un desarrollo de la clase Yamagumo; estas naves fueron equipadas para manejar el helicóptero dron antisubmarino QH-50D DASH a expensas del lanzador de caja ASROC. El QH-50 no tuvo un gran éxito y las instalaciones para él fueron finalmente eliminadas, y estas naves recuperaron un lanzador ASROC en la década de 1980. El resto de la batería consistía en torpedos y un lanzador de cohetes ASW de fabricación sueca.
Variant1=Minegumo DD-116,Minegumo
Variant2=Natsugumo DD-117,Natsugumo
Variant3=Murakumo DD-118,Murakumo

[jmsdf_dd_takatsuki]
Type=DD,Destructor
Default=Clase Takatsuki,Takatsuki
DefaultDescription=Estas son naves de guerra japonesas típicas con una pesada batería ASW que consiste en ASROC y un lanzador de cohetes ASW de fabricación sueca. Tienen un pesado armamento de artillería, pero carecen de capacidades ASuW y AAW, en línea con el énfasis casi total de la Fuerza de Autodefensa Marítima de Japón en la guerra antisubmarina. Cuatro de la clase Takatsuki sirvieron desde mediados de la década de 1960 hasta principios de la década de 2000.
Variant1=Takatsuki DD-164,Takatsuki
Variant2=Kikuzuki DD-165,Kikuzuki
Variant3=Mochizuki DD-166,Mochizuki
Variant4=Nagatsuki DD-167,Nagatsuki

[jmsdf_dd_yamagumo]
