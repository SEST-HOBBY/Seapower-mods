DefaultDescription=Seis de estos destructores ligeros fueron construidos en dos lotes para la JMSDF. Son típicos de las primeras naves de guerra japonesas con una pesada batería ASW que consiste en ASROC y un lanzador de cohetes ASW de fabricación sueca. A diferencia de algunas de las naves posteriores más grandes, estas naves solo llevan el calibre 3"/50 de EE. UU. como arma antisuperficie.
