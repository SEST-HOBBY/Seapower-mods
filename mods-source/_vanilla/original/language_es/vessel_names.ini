DefaultDescription=Los 12 buques de la clase Austin son muelles de plataforma de desembarco (LPD) diseñados a medida que combinan grandes cubiertas de pozo inundables con una importante cubierta de vuelo e instalaciones de mando y control. Estos buques utilizan LCUs embarcados para trasladar vehículos a tierra. Transportan más vehículos que un LHA típico, pero significativamente menos activos aéreos.
