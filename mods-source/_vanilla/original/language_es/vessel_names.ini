[****************************** Reino Unido ******************************]
[rn_dd_battle]
Type=DD,Destructor
Default=Clase Battle,Battle
DefaultDescription=Construidos a mediados de la década de 1940 para la Royal Navy y la Royal Australian Navy, se construyeron 26 destructores de la clase Battle con muchos más planeados. A medida que los diseños envejecieron a finales de la década de 1950 y principios de la década de 1960, se vendieron principalmente como chatarra, con dos plataformas llegando a Pakistán y una a Irán.
Variant1=PNS Khaibar,Khaibar
Variant2=PNS Badr,Badr
Variant3=Barrosa,Barrosa
Variant4=Matapan,Matapan
Variant5=Corunna,Corunna

[rn_dd_c-class]
Type=DD,Destructor
Default=Clase C,Clase C
DefaultDescription=Diseñados a principios de la Segunda Guerra Mundial, se lanzaron 32 destructores de la clase C de 1943 a 1945. El diseño se basó principalmente en el diseño de la clase J de antes de la guerra para permitir una construcción rápida. Cuatro de esta clase llegaron a Pakistán, donde sirvieron en las guerras indo-pakistaníes.
Variant1=PNS Alamgir,Alamgir
Variant2=PNS Shah Jahan,Shah
Variant3=PNS Taimur,Taimur
Variant4=PNS Jahangir,Jahangir
Variant5=Crescent,Crescent

[rn_dd_z-class]
Type=DD,Destructor
Default=Clase Z,Clase Z
DefaultDescription=Aproximadamente contemporáneo con la clase Battle, y muy similar a la clase C, la clase Z fue una clase de 8 destructores lanzados de 1943 a 1945. El diseño se basó principalmente en los diseños anteriores de las clases U y V para permitir una construcción rápida. Después de la Segunda Guerra Mundial, 4 de ellos fueron vendidos a Israel y Egipto y otros fueron desguazados.
Variant1=INS Eilat,Eilat
Variant2=INS Yaffo,Yaffo
Variant3=ENS El Qaher,Qaher
Variant4=ENS El Fateh,Fateh
Variant5=Zest,Zest

[****************************** EE. UU. ******************************]
[usn_ae_kilauea]
Type=AE,Auxiliar de flota
Default=Clase Kilauea,Kilauea
DefaultDescription=Se construyeron ocho buques de municiones de la clase Kilauea entre 1968 y 1972 para la USN para realizar reabastecimiento en marcha. Inicialmente fueron comisionados como buques de guerra, pero hicieron la transición a la operación civil más tradicional para auxiliares a finales de la década de 1980.
Variant1=Kilauea AE-26,Kilauea
Variant2=Butte AE-27,Butte
Variant3=Santa Barbara AE-28,Santa Barbara
Variant4=Mount Hood AE-29,Hood
Variant5=Flint AE-32,Flint
Variant6=Shasta AE-33,Shasta
Variant7=Mount Baker AE-34,Baker
Variant8=Kiska AE-35,Kiska

[usn_aoe_sacramento]
Type=AOE,Auxiliar de flota
Default=Clase Sacramento,Sacramento
DefaultDescription=Se construyeron cuatro buques de apoyo de combate rápido de la clase Sacramento entre 1961 y 1969 para la USN para realizar el reabastecimiento en marcha de combustible y provisiones. Una combinación de buque petrolero auxiliar, buque de almacenamiento refrigerado y buque de municiones, la clase Sacramento son buques rápidos diseñados para mantenerse al día con los grupos de batalla.
Variant1=Sacramento AOE-1,Sacramento
Variant2=Camden AOE-2,Camden
Variant3=Seattle AOE-3,Seattle
Variant4=Detroit AOE-4,Detroit

[usn_avp_barnegat]
Type=FF,Fragata
Default=Barnegat-class,Barnegat
DefaultDescription=Desarrollado durante la Segunda Guerra Mundial como un pequeño buque de apoyo para hidroaviones para la Armada de los EE. UU., la clase Barnegat quedó rápidamente obsoleta gracias a la decadencia del hidroavión después de la guerra. Como resultado, muchos fueron dados de baja. Sin embargo, aquellos que permanecieron en servicio se convirtieron en buques de reconocimiento o buques de patrulla y/o entrenamiento en armadas extranjeras como Etiopía, Italia, Noruega, Vietnam del Sur y Filipinas. Dieciocho también fueron transferidos a la Guardia Costera de los EE. UU., donde se convirtieron en el cúter de la clase Casco.
Variant1=Trần Quang Khải HQ-02,HQ-02
Variant2=Trần Nhật Duật HQ-03,HQ-03
Variant3=Trần Bình Trọng HQ-05,HQ-05
Variant4=Trần Quốc paraản HQ-06,HQ-06
Variant5=Phạm Ngũ Lão HQ-15,HQ-15
Variant6=Lý Thường Kiệt HQ-16,HQ-16
Variant7=Ngô Quyền HQ-17,HQ-17
[usn_bb_iowa]
Type=BB,Acorazado
Default=Clase Iowa,Iowa
DefaultDescription=El Iowa es una clase de acorazados de los Estados Unidos. Fueron diseñados como acorazados "rápidos", capaces de confiar en una mezcla uniforme de velocidad y potencia de fuego, y capaces de navegar a la misma velocidad que la fuerza de portaaviones. Durante su modernización en la década de 1980, los Iowa fueron equipados con cuatro montajes CIWS Phalanx, así como lanzadores de misiles Harpoon y Tomahawk.
Variant1=Iowa BB-61,Iowa
Variant2=nuevo Jersey BB-62,nuevo Jersey
Variant3=Missouri BB-63,Missouri
Variant4=Wisconsin BB-64,Wisconsin

[usn_cg_belknap]
Type=CG,Crucero de misiles guiados
Default=Clase Belknap,Belknap
DefaultDescription=Dentro de una década de entrar en servicio, la clase Belknap se sometió a una modernización importante que reemplazó una gran cantidad de sus sistemas y rediseñó el armamento. El radar se actualizó al mucho más capaz AN/SPS-48, y el barco recibió el sistema de guerra electrónica AN/SLQ-32. El lanzador Mk 10 se actualizó nuevamente, lo que le permitió lanzar el misil Standard SM-2, y el barco recibió un CIWS y ocho tubos de lanzamiento Harpoon hacia la popa de la nave, que reemplazaron el montaje del cañón de 3". Al proporcionar un golpe efectivo en todas partes, permitió que los Belknap sirvieran hasta las décadas de 1970 y 1980 como un complemento efectivo para las naves de guerra más nuevas como el crucero de la clase Ticonderoga.
Variant1=Josephus Daniels CG-27,Daniels
Variant2=Wainwright CG-28,Wainwright
Variant3=Jouett CG-29,Jouett
Variant4=Horne CG-30,Horne
Variant5=Sterett CG-31,Sterett
Variant6=William H. Standley CG-32,Standley
Variant7=Fox CG-33,Fox
Variant8=Biddle CG-34,Biddle

[usn_cg_belknap_72]
Type=DLG,Crucero de misiles guiados
Default=Clase Belknap (1972),Belknap
DefaultDescription=El líder de destructores de la clase Belknap, estaba destinado como una modificación relativamente limitada de la clase Charles Adams para tareas de escolta rápida. La diferencia más importante se obtuvo mejorando el lanzador Mk.10 del Terrier para que también disparara el ASROC, eliminando así la necesidad de un lanzador de caja separado, además de alargar el casco en 14 pies. Gran parte del espacio se dedicó entonces a crear una plataforma de aterrizaje que pudiera operar el helicóptero ASW DASH no tripulado. Además, los barcos recibieron sensores mejorados, como el radar SPG-55B y el sonar AN/SQS-26. Si bien son combatientes efectivos en todos los ámbitos, generalmente deben centrarse en amenazas submarinas, dadas sus impresionantes capacidades de sonar y ASW.
Variant1=Belknap DLG-26, Belknap
Variant2=Josephus Daniels DLG-27,Daniels
Variant3=Wainwright DLG-28,Wainwright
Variant4=Jouett DLG-29,Jouett
Variant5=Horne DLG-30,Horne
Variant6=Sterett DLG-31,Sterett
Variant7=William H. Standley DLG-32,Standley
Variant8=Fox DLG-33,Fox
Variant9=Biddle DLG-34,Biddle

[usn_cg_leahy]
Type=CG,Crucero de misiles guiados
Default=Clase Leahy,Leahy
DefaultDescription=La clase Leahy se construyó a principios de la década de 1960 como una clase de 9 líderes de destructores (DLG), pero se reclasificaron como cruceros en 1975. Estas naves son de doble extremo con lanzadores de misiles en proa y popa. La clase fue equipada por primera vez para misiles Terrier, pero luego se convirtió a misiles Standard. Estas plataformas son inusuales ya que no tienen un cañón de calibre medio, solo dos montajes gemelos de 3"/50. Las modificaciones posteriores reemplazaron estos cañones con lanzadores Harpoon, dejando a las naves sin armamento de artillería.
Variant1=Leahy CG-16,Leahy
Variant2=Harry E. Yarnell CG-17,Yarnell
Variant3=Worden CG-18,Worden
Variant4=Dale CG-19,Dale
Variant5=Richmond K. Turner CG-20,Turner
Variant6=Gridley CG-21,Gridley
Variant7=England CG-22,England
Variant8=Halsey CG-23,Halsey
Variant9=Reeves CG-24,Reeves

[usn_cg_leahy_68]
Type=DLG,Crucero de misiles guiados
Default=Clase Leahy (1968),Leahy
DefaultDescription=La clase Leahy se construyó a principios de la década de 1960 como una clase de 9 líderes de destructores (DLG), pero se reclasificaron como cruceros en 1975. Estas naves son de doble extremo con lanzadores de misiles en proa y popa. La clase fue equipada por primera vez para misiles Terrier, pero luego se convirtió a misiles Standard. Estas plataformas son inusuales ya que no tienen un cañón de calibre medio, solo dos montajes gemelos de 3"/50. Las modificaciones posteriores reemplazaron estos cañones con lanzadores Harpoon, dejando a las naves sin armamento de artillería.
Variant1=Leahy DLG-16,Leahy
Variant2=Harry E. Yarnell DLG-17,Yarnell
Variant3=Worden DLG-18,Worden
Variant4=Dale DLG-19,Dale
Variant5=Richmond K. Turner DLG-20,Turner
Variant6=Gridley DLG-21,Gridley
Variant7=England DLG-22,England
Variant8=Halsey DLG-23,Halsey
Variant9=Reeves DLG-24,Reeves

[usn_cg_ticonderoga]
Type=CG,Crucero de misiles guiados
Default=Clase Ticonderoga,Ticonderoga
DefaultDescription=Un diseño icónico e instantáneamente reconocible con sus 4 matrices PESA de panel plano SPY-1, los cruceros de la clase Ticonderoga son un desarrollo del destructor de la clase Spruance centrado en la guerra antiaérea y equipado con el nuevo sistema de gestión de combate AEGIS. Estas naves fueron pioneras en la técnica de construcción modular en los EE. UU.
Variant1=Ticonderoga CG-47,Ticonderoga
Variant2=Yorktown CG-48,Yorktown
Variant3=Vincennes CG-49,Vincennes
Variant4=Valley Forge CG-50,Valley F
[usn_cgn_california]
Type=CGN,Crucero de Misiles
Default=Clase California,California
DefaultDescription=Los dos cruceros de la clase California fueron comisionados en la USN entre 1974 y 1975, sirviendo como escoltas ideales de grupos de ataque de portaaviones rápidos con su alcance efectivamente ilimitado. Diseñados desde cero en torno a la energía nuclear, estos barcos fueron descritos como las primeras unidades de superficie de propulsión nuclear destinadas a la producción en serie (frente a los Long Beach, Bainbridge y Truxtun anteriores, todos barcos singulares). La construcción resultó muy costosa y las unidades de seguimiento se cancelaron en favor de los cruceros de la clase Virginia posteriores. En servicio, estos fueron barcos capaces que montaron lanzadores de misiles Mark 13 de proa y popa y cañones de 5", con un lanzador ASROC y recargas hacia adelante. Las modificaciones a principios de la década de 1980 agregaron Phalanx CIWS y actualizaron el conjunto de guerra electrónica al AN/SLQ-32(V)3. Ambos barcos fueron retirados a finales de la década de 1990, a pesar de las costosas modificaciones de reabastecimiento de combustible realizadas solo unos años antes.
Variant1=California CGN-36,California
Variant2=South Carolina CGN-37,South Carolina
[usn_cgn_virginia]
Type=CGN,Crucero de misiles guiados
Default=Clase Virginia,Virginia
DefaultDescription=Se comisionaron cuatro clase Virginia para la USN entre 1976 y 1980; estas naves de más de 10000 toneladas eran de doble extremo para misiles y cañones de calibre medio. Son extremadamente caras de operar, pero muy potentes.
Variant1=Virginia CGN-38,Virginia
Variant2=Texas CGN-39,Texas
Variant3=Mississippi CGN-40,Mississippi
Variant4=Arkansas CGN-41,Arkansas

[usn_cgn_long_beach_73]
Type=CGN,Crucero de misiles guiados
Default=Clase Long Beach (1973),Long Beach
DefaultDescription=El Long Beach fue concebido como una escolta para el portaaviones de propulsión nuclear Enterprise. Tiene un equipo de sensores muy similar que lleva a la apariencia de "cubo", y una potente batería antiaérea que consta de lanzadores gemelos Terrier y un lanzador Talos.
Variant1=Long Beach CGN-9,Long Beach

[usn_cgn_long_beach_83]
Type=CGN,Crucero de misiles guiados
Default=Clase Long Beach (1983),Long Beach
DefaultDescription=El Long Beach fue concebido como una escolta para el portaaviones de propulsión nuclear Enterprise. En la década de 1980, el radar SCANFAR y el sistema SAM Talos fueron retirados y reemplazados por radares convencionales y misiles Phalanx CIWS, Harpoon y Tomahawk, dando una capacidad de ataque terrestre.
Variant1=Long Beach CGN-9,Long Beach

[usn_clg_oklahoma_city]
Type=CLG,Crucero de misiles guiados
Default=Clase Galveston,Galveston
DefaultDescription=Tres cruceros ligeros de la clase Cleveland se convirtieron en cruceros de misiles de la clase Galveston a finales de la década de 1950. Se sometieron a una modificación significativa de la estructura posterior para eliminar las torretas y colocar un lanzador para el misil Talos.
Variant1=Galveston CLG-3,Galveston
Variant2=Little Rock CLG-4,Little Rock
Variant3=Oklahoma ciudad CLG-5,aceptar ciudad

[usn_cv_forrestal_75]
Type=CV,Portaaviones
Default=Clase Forrestal,Forrestal
DefaultDescription=Considerada la primera clase de superportaaviones, cuatro de los portaaviones de propulsión convencional de la clase Forrestal fueron construidos a finales de la década de 1950. Estas naves eran extremadamente grandes en su época y llevaban alas aéreas masivas.
Variant1=Forrestal CV-59,Forrestal
Variant2=Saratoga CV-60,Saratoga
Variant3=Ranger CV-61,Ranger
Variant4=Independence CV-62,Independence

[usn_cv_america_79]
Type=CV,Portaaviones
Default=Clase América,América
DefaultDescription=Se construyeron tres portaaviones de la clase Kitty Hawk (más uno de desarrollo) para la USN a principios de la década de 1960. Estas naves son, hasta cierto punto, un desarrollo de los superportaaviones de la clase Forrestal. Estas naves fueron equipadas originalmente con sistemas para operar el SAM Terrier, pero luego fueron retirados. El USS América es una ligera modificación de las dos plataformas originales y generalmente se considera uno de los tres Kitty Hawks.
Variant1=America CV-66,America

[usn_cv_kitty_hawk]
Type=CV,Portaaviones
Default=Clase Kitty Hawk,Kitty Hawk
DefaultDescription=Se construyeron tres portaaviones de la clase Kitty Hawk (más uno de desarrollo) para la USN a principios de la década de 1960. Estas naves son, hasta cierto punto, un desarrollo de los superportaaviones de la clase Forrestal. Estas naves fueron equipadas originalmente con sistemas para operar el SAM Terrier, pero luego fueron retirados.
Variant1=Kitty Hawk CV-63,Kitty Hawk
Variant2=Constellation CV-64,Constellation

[usn_cvn_enterprise]
Type=CVN,Portaaviones
Default=Clase Enterprise,Enterprise
DefaultDescription=El primer portaaviones de propulsión nuclear de la Armada de los EE. UU., el USS Enterprise, fue planeado originalmente como el primero de seis barcos, pero sus barcos hermanos fueron cancelados debido al costo. En consecuencia, tenía varias características únicas entre todos los portaaviones de la Guerra Fría. Esto incluía el radar de matriz de fase SCANFAR, temperamental pero extremadamente capaz, que podría mejorar en gran medida la cobertura de exploración de un grupo de batalla. Al mismo tiempo, recibió un modesto conjunto de misiles defensivos al final del día, que consta de dos lanzadores Mk.26 que transportan misiles Sparrow III. En la mayoría de los demás aspectos, como la capacidad y las operaciones del ala aérea, es esencialmente el mismo que otros superportaaviones como la clase Nimitz posterior.
Variant1=Enterprise CVN-65,Enterprise

