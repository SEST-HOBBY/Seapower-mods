DefaultDescription=El Proyecto 1134 Águila Dorada, o clase Kresta I, fue diseñado como un sucesor más grande y capaz de los cruceros de misiles clase Kynda, que resultaron ser demasiado pesados en la parte superior y demasiado estrechos. El Kresta I está destinado al papel antibuque, pero tiene capacidades mucho mejores para la guerra antiaérea y antisubmarina. Si se permite que estos barcos entren en las rutas de convoyes del Atlántico Norte, podrían representar una amenaza real para la OTAN como asaltantes.
