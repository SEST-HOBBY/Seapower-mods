[wp_rkr_kirov]
Type=TARKR,Crucero de misiles guiados
Default=Clase Kirov,Kirov
DefaultDescription=Conocidos por los soviéticos como Águila Marina (Proyecto 1144), los clase Kirov son cruceros masivos de misiles guiados de propulsión nuclear. Con dimensiones muy parecidas a las de un acorazado de la Segunda Guerra Mundial, estos se encuentran entre los combatientes de superficie más poderosos jamás construidos, con dos de estos barcos construidos desde 1980 y otros dos en construcción. Su gran tamaño es necesario para albergar una gran batería de misiles antibuque, así como un sistema de misiles tierra-aire de defensa de área con varias defensas cercanas como respaldo. Aunque equipados con sonar avanzado y armas ASW de enfrentamiento, estos barcos generalmente operan como buques insignia de grupos de guerra de superficie protegidos por barcos ASW dedicados.
Variant1=Kirov RKR-181,Kirov

