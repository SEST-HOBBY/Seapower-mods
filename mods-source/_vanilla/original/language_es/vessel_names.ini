DefaultDescription=Unos 50 de estos barcos fueron construidos como petroleros comerciales durante la década de 1950, algunos fueron asignados a la Armada desde 1960. La clase tiene un gran parecido con los petroleros estadounidenses T-2 de la época de guerra, pero reacondicionados para el reabastecimiento en marcha con un gran mástil de dos patas y grúas más pequeñas para el reabastecimiento de provisiones secas, mientras que el reabastecimiento de combustible se limita a un solo barco que utiliza el ineficiente método de reabastecimiento de popa.
