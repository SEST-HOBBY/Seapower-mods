DefaultDescription=El Skipjack fue el primer diseño de submarino estadounidense que aprovechó al máximo el potencial de rendimiento inherente a la forma aerodinámica del casco del Albacore. En comparación con los submarinos anteriores, podían viajar a más de 30 nudos, lo que los hacía inmunes a las armas antisubmarinas de la época. Más tarde fueron actualizados con matrices remolcadas y hélices skewback más silenciosas, y equipo para disparar el torpedo Mark 48, aunque nunca recibieron Sub-Harpoon.
