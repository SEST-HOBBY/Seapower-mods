DefaultDescription=Desarrollada a partir de las escoltas de destructores de la clase Dealey, la fragata clase Oslo es un diseño específico de la Armada Real Noruega. El casco delantero tiene mayor francobordo para hacer frente al clima ártico y varios sistemas son diferentes de la nave original.
