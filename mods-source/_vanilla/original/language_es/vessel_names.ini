DefaultDescription=Los buques de guerra más grandes en servicio de la USN durante la Guerra Fría, la clase Nimitz es un superportaaviones de propulsión nuclear que desplaza más de 100000 toneladas. Estas naves son una de las formas más amenazantes que tiene la USN para proyectar poder lejos de la costa de EE. UU.
Variant1=Nimitz CVN-68,Nimitz
Variant2=Dwight D. Eisenhower CVN-69,Eisenhower
