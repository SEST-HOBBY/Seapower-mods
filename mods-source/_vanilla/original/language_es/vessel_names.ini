[jmsdf_ss_yushio]
Type=SS,SS
Default=Clase Yushio,Yushio
DefaultDescription=Aumentando y luego reemplazando a la clase Uzushio, la clase Yushio es la tercera serie de barcos de flota posteriores a la Segunda Guerra Mundial para la JMSDF. Actualizaron el casco de lágrima o Albacore de la clase anterior y tuvieron un rendimiento mejorado, lo que los convirtió en naves potentes, modernas y casi silenciosas. Se construyeron diez de la clase en dos lotes y sirvieron desde principios de la década de 1980 hasta finales de la década de 2000.
Variant1=SS-573 Yūshio,Yūshio
Variant2=SS-574 Mochishio,Mochishio
