DefaultDescription=La clase Asashio se considera generalmente la primera clase de submarinos de flota construidos para la JMSDF en el período posterior a la Segunda Guerra Mundial, entrando en servicio a finales de la década de 1960. Estas naves extendieron el alcance de las fuerzas submarinas de la JMSDF de vuelta al océano abierto, y fueron diseñadas específicamente para tener buenas cualidades de navegación con un gran almacenamiento de torpedos. Su maquinaria fue construida en Japón y permanecieron en servicio hasta mediados de la década de 1980.
Variant1=SS-562	Asashio,Asashio
Variant2=SS-563	Harushio,Harushio
Variant3=SS-564 Michishio,Michishio
Variant4=SS-565 Arashio,Arashio

[jmsdf_ss_uzushio]
Type=SS,SS
Default=Clase Uzushio,Uzushio
DefaultDescription=La clase Uzushio fue la segunda generación de barcos de flota de la JMSDF posteriores a la Segunda Guerra Mundial, introduciendo el casco de lágrima estilo Albacore a la JMSDF. Siete de estos barcos en tres lotes fueron introducidos en la JMSDF a principios de la década de 1970 y sirvieron hasta mediados de la década de 1990.
Variant1=SS-566	Uzushio,Uzushio
