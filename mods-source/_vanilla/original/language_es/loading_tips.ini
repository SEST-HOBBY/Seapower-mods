[LoadingTips]
Count=8
Header=CONSEJO
Tip001=Los misiles Harpoon y Tomahawk antibuque no evitan el terreno. Confirma una ruta despejada antes de disparar.
Tip002=Las formaciones dispersas son más difíciles de interpretar para el enemigo mediante radar.
Tip003=Los misiles Standard pueden usarse en enfrentamientos antibuque dentro de la línea de visión y son más fiables que los Harpoon en esta función.
Tip004=Los helicópteros SH-2F proporcionan radar aerotransportado de búsqueda de superficie a los buques de escolta de la Armada de EE. UU. Pueden detectar contactos de superficie más allá del alcance de los radares del buque, pero no pueden buscar aeronaves.
Tip005=Los destructores de la clase Sovremenny llevan el SS-N-22 Sunburn. Es el misil antibuque más capaz de su época, pero su alcance de 48 nm limita su empleo.
Tip006=Las fragatas de la clase Udaloy llevan el sistema SAM SA-N-9, especialmente eficaz contra misiles rasantes como Harpoon y Exocet.
Tip007=La interferencia desde aeronaves reducirá considerablemente la eficacia de las defensas aéreas enemigas.
Tip008=El arma antisubmarina SS-N-14A (Metel) la llevan los buques antisubmarinos de las clases Krivak y Kresta II. El SS-N-14B (Rastrub) añade una capacidad antibuque secundaria y equipa a las clases Krivak II, Kara y Udaloy, con un alcance de 27 nm.
