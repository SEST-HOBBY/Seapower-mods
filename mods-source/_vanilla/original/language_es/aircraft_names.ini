DefaultDescription=El F/A-18 es el caza de ataque polivalente más nuevo de la Armada de los EE. UU. y generalmente es considerado como uno de los cazas navales más exitosos de todos los tiempos. Debido a sus excelentes características de vuelo, aviónica moderna y una amplia gama de armamento guiado y no guiado disponible, el F/A-18 es verdaderamente una aeronave capaz de todo que compromete muy poco para lograr su rendimiento.\n\nEste es el modelo más antiguo de F/A-18 puesto en servicio en el mar, y no cuenta con la capacidad de emplear armas guiadas por láser, a diferencia de los modelos posteriores.

