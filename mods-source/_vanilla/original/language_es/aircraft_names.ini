[jmsdf_ps-1]
Type=Patrulla Marítima,MPA
Default=PS-1,PS-1
DefaultDescription=El PS-1 es un hidroavión japonés diseñado para la guerra antisubmarina y patrulla marítima. Entrando en servicio en 1971 con la JMSDF, llevaba torpedos teledirigidos, cargas de profundidad y cohetes Zuni de 5", así como sonoboyas. Incorporando muchas innovaciones nuevas en ese momento, el PS-1 era capaz de aterrizar en mares de hasta 3 metros (9.8 pies) de altura. Modificaciones posteriores del tipo incluyeron el avión de búsqueda y rescate US-1A, y un solo avión fue modificado experimentalmente como cisterna aérea para la extinción de incendios aéreos. El PS-1 fue retirado en la década de 1980 en favor del P-3 Orion para la misión de patrulla marítima.
Squadron1=PS-1 31.ª Ala Aérea de la Flota,PS-1
Squadron2=PS-1,PS-1
Callsigns=Escuadrón1,Stingray|Escuadrón2,Starfish

[jmsdf_us-1]
