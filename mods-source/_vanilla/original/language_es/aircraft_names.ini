Default=US-1A,US-1A
DefaultDescription=El US-1A es un avión anfibio japonés diseñado para búsqueda y rescate. El tipo entró en servicio con la JMSDF en la década de 1970 junto al PS-1 orientado a la lucha antisubmarina. El US-1A sirvió con distinción hasta 2017 antes de su retiro y reemplazo por el moderno US-2. Los aviones US-1A fueron responsables del rescate de más de 550 vidas en el mar entre el periodo de 1976 y 1999.
Squadron1=US-1A 31.ª Ala Aérea de la Flota,US-1A
Squadron2=US-1A,US-1A
Callsigns=Escuadrón1,Seagull|Escuadrón2,Marlin

