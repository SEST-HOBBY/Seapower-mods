[civ_707]
Type=Avión de pasajeros
Default=707 Airliner,Airliner
DefaultDescription=Un antiguo avión de pasajeros estadounidense, el 707 fue uno de los aviones más populares de la década de 1960. Si bien el Comet fue el primer avión de pasajeros a reacción construido expresamente para volar, el éxito comercial del 707 introdujo los aviones a reacción a las masas y muchos lo consideran el verdadero comienzo de la era del jet. El 707 comenzó a quedar obsoleto en los años 70, pero siguió siendo un pilar para muchas aerolíneas y ejércitos hasta bien entrados los años 80.
Squadron1=Atlantic Airlines,Atlantic
Squadron1Description=Atlantic Airlines realizó su primer vuelo transcontinental 707 en servicio de pasajeros el 25 de enero de 1959, inaugurando oficialmente la “Era del Jet” al cruzar de Los Ángeles a Nueva York en 4 horas y 3 minutos.
