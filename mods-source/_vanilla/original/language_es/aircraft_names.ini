[usn_qh-50c]
Type=Helicóptero dron
Default=QH-50C,QH-50
DefaultDescription=El QH-50 DASH (Helicóptero Dron Antisubmarino) está destinado a actuar como arma antisubmarina de largo alcance para buques demasiado pequeños para acomodar un hangar y un helicóptero. Como componente principal del programa FRAM, el QH-50 fue asignado a buques antiguos, como los destructores de la clase Gearing, y también equipó a las escoltas oceánicas de posguerra. El helicóptero sufría de una alta tasa de fallos, ya que resultó poco fiable en el servicio naval, y fue retirado del servicio en 1973. La JMSDF fue el único operador extranjero del QH-50, que tuvo mayor éxito en sus operaciones gracias a un mantenimiento regular, retirándolos más tarde en 1977. El QH-50C fue la primera variante de producción, propulsada por un motor turboeje de 300 shp, con 373 aeronaves fabricadas.
Squadron1=QH-50,QH-50
Callsigns=Squadron1,Dash

[usn_qh-50d]
Type=Helicóptero dron
Default=QH-50D,QH-50
DefaultDescription=El QH-50 DASH (Helicóptero Dron Antisubmarino) está destinado a actuar como arma antisubmarina de largo alcance para buques demasiado pequeños para acomodar un hangar y un helicóptero. Como componente principal del programa FRAM, el QH-50 fue asignado a buques antiguos, como los destructores de la clase Gearing, y también equipó a las escoltas oceánicas de posguerra. El helicóptero sufría de una alta tasa de fallos, ya que resultó poco fiable en el servicio naval, y fue retirado del servicio en 1973. La JMSDF fue el único operador extranjero del QH-50, que tuvo mayor éxito en sus operaciones gracias a un mantenimiento regular, retirándolos más tarde en 1977. El QH-50D fue una mejora sobre el QH-50C, incorporando un motor más grande de 365 shp, palas de rotor de fibra de vidrio y sin conjunto de cola.
Squadron1=QH-50,QH-50
Squadron2=QH-50,QH-50
Callsigns=Squadron1,Dash|Squadron2,Dash

