Top_Dome=Top Dome|3R41 "Volna" (nombre en clave de la OTAN: Top Dome) es un Radar de control de tiro para el sistema SAM SA-N-6. Puede seguir hasta 3 objetivos simultáneamente y atacarlos con hasta 2 misiles cada uno.
Pop_Group=Pop Group|4R-33A "Osa" (nombre en clave de la OTAN: Pop Group) es un Radar de control de tiro para el sistema SAM de defensa puntual SA-N-4. Puede atacar un solo objetivo con una salva de dos misiles por Radar. Además del iluminador CW, el complejo lleva su propio Radar de búsqueda dedicado, lo que lo hace comparable a la combinación de iluminador Mk-23 TAS/Mk-95 utilizada por el sistema NATO Sea Sparrow.
Pop_Group_Search=Pop Group|4R-33A "Osa" (nombre en clave de la OTAN: Pop Group) es un Radar de control de tiro para el sistema SAM de defensa puntual SA-N-4. Puede atacar un solo objetivo con una salva de dos misiles por Radar. Además del iluminador CW, el complejo lleva su propio Radar de búsqueda dedicado, lo que lo hace comparable a la combinación de iluminador Mk-23 TAS/Mk-95 utilizada por el sistema NATO Sea Sparrow.
Cross_Sword=Cross Sword|3R95 "Tor" (nombre en clave de la OTAN: Cross Sword) es un Radar de control de tiro para el sistema SAM de defensa puntual SA-N-9. Al igual que el Pop Group anterior, es un sistema autónomo con su propio Radar de búsqueda dedicado, pero un nuevo sistema de control de tiro digital permite el seguimiento de hasta 10 objetivos a la vez, haciéndolo mucho más capaz de lidiar con ataques de saturación.
Cross_Sword_Search=Cross Sword|3R95 "Tor" (nombre en clave de la OTAN: Cross Sword) es un Radar de control de tiro para el sistema SAM de defensa puntual SA-N-9. Al igual que el Pop Group anterior, es un sistema autónomo con su propio Radar de búsqueda dedicado, pero un nuevo sistema de control de tiro digital permite el seguimiento de hasta 10 objetivos a la vez, haciéndolo mucho más capaz de manejar ataques de saturación.
Front_Dome=Front Dome|3R90 "Uragan" (Nombre en clave de la OTAN: Front Dome) es un Radar de Control de Tiro para el sistema SAM de defensa de área SA-N-7. Depende del MR-750 Top Steer para la adquisición de objetivos, mientras que el Front Dome se encarga del seguimiento y el enfrentamiento. Cada director puede atacar un solo objetivo con hasta dos misiles.

