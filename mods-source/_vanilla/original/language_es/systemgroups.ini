LN-66=LN-66|El LN-66 es un radar de búsqueda de superficie civil de corto alcance que equipa a muchos buques comerciales y militares por igual, pero también se utiliza en el helicóptero SH-2F LAMPS.
AN/APS-20=AN/APS-20|El AN/APS-20 es un radar de búsqueda aérea de largo alcance de banda S utilizado por el P-2H Neptune.
AN/APS-80=AN/APS-80|El AN/APS-80 es un radar de vigilancia aérea y búsqueda de superficie marítima de banda X y largo alcance. Este conjunto de radar utiliza antenas de escaneo mecánico para proporcionar una cobertura de 360 grados. Se instaló en los primeros aviones P-3 Orion y en el US-1 japonés.
AN/APS-115=AN/APS-115|El AN/APS-115 es un radar de búsqueda de superficie de banda X utilizado por el P-3 Orion. El radar se desarrolló a partir del AN/APS-80A.
AN/APS-116=AN/APS-116|El AN/APS-116 es un radar de búsqueda de superficie diseñado específicamente para detectar periscopios y mástiles de submarinos, que pueden ser visibles solo por breves períodos de tiempo.
AN/APS-125=AN/APS-125|El AN/APS-125 es un radar de búsqueda aérea de largo alcance de banda UHF utilizado para la alerta temprana aerotransportada por la USN.
AN/APQ-126=AN/APQ-126|El AN/APQ-126 es un radar de ataque y navegación aerotransportado utilizado en los aviones de ataque A-7D y A-7E, que proporciona una capacidad de ataque para todo clima.
AN/APQ-148=AN/APQ-148|El AN/APQ-148 es un radar aerotransportado multimodo utilizado en las últimas variantes del A-6, donde proporciona una capacidad avanzada de ataque de bajo nivel para todo clima.
AN/APD-7=AN/APD-7
AN/AWG-9=AN/AWG-9|El radar AN/AWG-9 es un radar de exploración durante el seguimiento de largo alcance diseñado específicamente para su uso con el sistema de misiles AIM-54 Phoenix, donde permite el enfrentamiento simultáneo de hasta seis objetivos. Como tal, solo equipa al F-14.
AN/AWG-9_Phoenix=AN/AWG-9 (Guía AIM-54)|Modo de guía especial para el sistema de misiles AIM-54 Phoenix que permite el enfrentamiento simultáneo de hasta seis objetivos. Este modo se aplica solo al AIM-54 y es posible guiar solo un AIM-7 a la vez.
AN/APG-63=AN/APG-63|El AN/APG-63 es un radar de exploración durante el seguimiento de largo alcance que equipa al F-15.
