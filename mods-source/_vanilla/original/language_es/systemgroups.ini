MK33_Oslo=MK 33 Gun|Cañón Mk 33 de 3"/calibre 50|El cañón Mk 33 consiste en un par de cañones de tiro rápido Mk 22 de 3"/calibre 50 en una montura doble abierta o cerrada. Estos cañones ofrecen un poder de fuego mucho mayor que las monturas cuádruples de 40mm a las que reemplazaron.
MK34=MK 34 Gun|Cañón Mk 34 de 3"/calibre 50|El cañón Mk 34 consiste en un cañón de tiro rápido Mk 22 de 3"/calibre 50 en una montura abierta. Este cañón ofrece un poder de fuego mucho mayor que las monturas cuádruples de 40mm a las que reemplazó.
MK42=MK 42 Gun|Cañón Mk 42 de 5"/calibre 54|En la década de 1950 se necesitaba un cañón con mayor alcance y una cadencia de disparo más rápida que la del cañón de 5"/calibre 38 utilizado en la Segunda Guerra Mundial; por ello, el cañón se creó simultáneamente con el cañón Mk 26 de 3"/70 para diferentes usos. El 5"/54 Mk 42 es una montura de cañón automático de doble propósito (aire/superficie). Normalmente se controla de forma remota desde el Sistema de Control de Tiro de Cañón Mk 68.
MK45=MK 45 Gun|Cañón Mk 45 de 5"/calibre 54|El cañón Mk 45 de 5"/calibre 54 es una montura de artillería naval estadounidense que consiste en un cañón Mk 19 de 5"/54 en la montura Mk 45. Es más ligero y fácil de mantener en comparación con la anterior montura Mk 42. Se controla de forma remota desde el Sistema de Control de Tiro de Cañón Mk 86.
MK75=MK 75 Gun|Cañón Mk 75 de 76mm|El cañón Mk 75 es un cañón automático naval diseñado y construido en Italia. Al ser compacto, tener una alta cadencia de disparo y una amplia gama de municiones, este cañón es capaz de realizar tareas antiaéreas, antisuperficie, defensa de punto y apoyo de fuego costero. El Mk 75 ha sido ampliamente exportado y está en uso en sesenta armadas.
