Pot_Head=Pot Head|"Reya" (nombre en clave de la OTAN: Pot Head) es un pequeño Radar de búsqueda de superficie en banda X para lanchas torpederas y pequeños buques ASW desarrollado a principios de la década de 1960.
Pot_Drum=Pot Drum|El MR-102 "Baklan" (nombre en clave de la OTAN: Pot Drum) es un Radar en banda X de búsqueda de superficie y puntería de torpedos desarrollado para grandes lanchas torpederas, como las clases Shershen y Stenka.
Peel_Pair=Peel Pair|"Dubrava" (nombre en clave de la OTAN: Peel Pair) es un Radar de búsqueda de superficie en banda X instalado en las pequeñas fragatas de misiles soviéticas, como las clases Nanuchka y Tarantul, como parte del conjunto de Radar "Titanit".

