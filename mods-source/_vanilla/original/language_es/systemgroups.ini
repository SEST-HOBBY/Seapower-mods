#---Air/Air&Surface---
CXAM=CXAM|El CXAM fue el prototipo de los Radares de exploración aérea a largo alcance de la US Navy. Este equipo dotó a los buques de combate más grandes justo antes del comienzo de la Segunda Guerra Mundial. Era una gran antena tipo «colchón» de 18 x 16 pies con capacidad de elevación, aunque su haz era demasiado ancho para permitir el cálculo de altitud. El CXAM derivó directamente en los Radares de exploración aérea del periodo de guerra, los cuales casi en su totalidad fueron mejoras graduales sobre este diseño base.
CXAM-1=CXAM-1|El CXAM-1 fue una mejora gradual sobre el CXAM, entregándose e instalándose un total de catorce equipos en acorazados, cruceros y portaaviones. La antena conservó el aspecto de colchón, pero se eliminó la capacidad de elevación. La precisión se mejoró a 200 yardas, y este equipo permaneció en servicio a bordo de algunos buques hasta 1943. Fue reemplazado en los grandes buques de combate por el equipo SK o SK-2.
SA=SA|La serie de equipos SA tenía como objetivo replicar la funcionalidad y el rendimiento del CXAM con una antena más pequeña para su uso a bordo de buques de escolta y auxiliares. Con un éxito relativo, la serie SA se convirtió en el equipo de exploración aérea estándar para destructores de escolta y fragatas, y algunos también se montaron en destructores y cruceros ligeros. Este tipo también equipó a buques de las Fuerzas Francesas Libres que fueron modernizados en astilleros estadounidenses a finales de la guerra.
SC-1=SC-1|Al igual que el SA, el SC fue un intento de llevar el rendimiento del CXAM a buques más pequeños utilizando una antena menor. Desafortunadamente, la antena más pequeña provocó un menor alcance efectivo y las fuerzas operativas rechazaron el SC base. El SC-1 se introdujo en enero de 1942 con el doble de potencia y el doble de alcance, y pronto todos los SC fueron convertidos. Este equipo dotó a destructores y auxiliares a principios de la guerra antes de ser reemplazado por el SC-2 a medida que ese equipo estuvo disponible.
SC-2=SC-2|El SC-2 mejoró con respecto al SC-1 al agrandar enormemente la antena. Este equipo incorporó provisiones para los sistemas IFF BG y BL, y se convirtió en el Radar principal para destructores hasta el final de la guerra. Variantes ligeramente mejoradas del SC-2 (SC-3, SC-4 y SC-5) permanecieron en servicio en destructores hasta 1963.
SK=SK|El SK fue el equipo estándar de exploración aérea durante la guerra para buques grandes. Esencialmente un equipo SC-2 con una antena del tamaño del CXAM, era un sistema de Radar bidimensional que solo proporcionaba datos de azimut y distancia inclinada. Se requerían sensores adicionales para el cálculo de altitud.
SK-2=SK-2|Este equipo fue una mejora gradual con respecto al SK, con una antena parabólica de 17 pies destinada a reducir los lóbulos secundarios. A finales de la guerra, tanto el SK y el SK-2 fueron criticados por su incapacidad para detectar aeronaves a gran altitud debido a la baja elevación del haz. Se produjeron 75 equipos, dotando a los buques de combate más grandes a medida que entraban en servicio o pasaban por astilleros para su modernización.
SM=SM|El SM fue el primer Radar estadounidense diseñado para el guiado de cazas, incorporando un haz estrecho («pencil beam») de escaneo cónico para determinar la altitud de un objetivo aéreo, una capacidad no disponible en Radares de exploración aérea anteriores. El SM era muy pesado, de 18 000 libras (4 000 libras solo la antena), y solo podía montarse en grandes portaaviones. Más tarde, el SM-1 y el SP se construyeron para buques más pequeños.
SP=SP|El SP fue el sucesor ligero del Radar telemétrico de altitud SM. Este equipo podía incorporar dos antenas diferentes según el buque receptor, con una antena más pequeña disponible para destructores y portaaviones ligeros. Este equipo dotó a los destructores de piquete de Radar de la clase Gearing (DDR) que operaron en Okinawa. Se construyeron 300 equipos y, al final de la guerra, era común ver buques capitales montando un SP en el palo mayor complementando a un SK o SK-2 en el palo de trinquete.
SR=SR|El SR fue el primer equipo de exploración aérea totalmente nuevo desde el CXAM, e incorporaba muchas características nuevas en las que habían sido pioneros los equipos de Radar anteriores. La antena era aproximadamente del mismo tamaño que la del SC-2, pero con más del doble de potencia, y equipó a destructores hacia el final de la guerra. También equipó a buques de combate más grandes como Radar de exploración aérea de reserva, y permaneció en servicio hasta 1961.
SR-2=SR-2|El SR-2 era un equipo de exploración aérea 2D de 50 cm destinado originalmente a destructores de escolta, pero tras comenzar la producción resultó ser demasiado grande. Los modelos piloto equiparon a los grandes portaaviones de la clase Midway, así como a varios cruceros ligeros y a los primeros cuatro submarinos piquetes de Radar (SSR). Este equipo fue reemplazado por el AN/SPS-6 debido a su rendimiento inferior.
SR-3=SR-3|El SR-3 y el SR-6 fueron diseñados como reemplazos para el SK y el SC en toda la flota, utilizando banda L para un mejor rendimiento con menor desvanecimiento. En realidad, ambos equipos tuvieron un rendimiento deficiente debido a las antenas elegidas, descritas como «antena insuficiente» en un informe de posguerra. El SR-6 era una versión más ligera del SR-3, con una antena más pequeña.
SR-6=SR-6|El SR-3 y el SR-6 fueron diseñados como reemplazos para el SK y el SC en toda la flota, utilizando banda L para un mejor rendimiento con menor desvanecimiento. En realidad, ambos equipos tuvieron un rendimiento deficiente debido a las antenas elegidas, descritas como «antena insuficiente» en un informe de posguerra. El SR-6 era una versión más ligera del SR-3, con una antena más pequeña.
SPS-6=SPS-6|El AN/SPS-6 es un Radar bidimensional utilizado por la US Navy como Radar de exploración aérea de primera generación después de la Segunda Guerra Mundial, y fue ampliamente exportado a aliados. Como el AN/SPS-6 es un Radar 2D, solo proporciona datos de azimut y distancia inclinada. Se deben utilizar sensores adicionales para determinar la altitud.
SPS-12=SPS-12|En servicio desde la década de 1950 hasta la de 1980, el AN/SPS-12 es un Radar de vigilancia aérea y de superficie bidimensional de medio alcance.
SPS-29=SPS-29|El AN/SPS-29 es un Radar bidimensional utilizado por la US Navy como Radar de alerta temprana después de la Segunda Guerra Mundial, y equipó buques navales durante la Guerra Fría. Como Radar 2D, solo proporciona datos de azimut y distancia inclinada. Se deben utilizar sensores adicionales para determinar la altitud.
SPS-30=SPS-30|Una versión modernizada del AN/SPS-8 combinada con un transmisor más potente, el AN/SPS-30 es un sistema de Radar embarcado integrado de exploración y telemetría de altitud en banda S utilizado para la detección y vigilancia de aeronaves.
UPA-43=UPA-43|El AN/UPA-43 es un interrogador de identificación amigo-enemigo (IFF) utilizado por la US Navy. Los Radares posteriores como el AN/SPS-48 cuentan con un interrogador IFF integrado que elimina la necesidad de una antena independiente.
SPS-32=SPS-32|Parte del famoso sistema SCANFAR utilizado por el USS Enterprise y el USS Long Beach, el AN/SPS-32 es la parte orientada horizontalmente del sistema de antena y se utiliza principalmente para la vigilancia aérea.
SPS-33=SPS-33|Parte del famoso sistema SCANFAR utilizado por el USS Enterprise y el USS Long Beach, el AN/SPS-33 es la parte orientada verticalmente del sistema de antena y se utiliza principalmente para el seguimiento de objetivos.
SPS-37=SPS-37|El AN/SPS-37 es un Radar bidimensional utilizado por la US Navy como Radar de alerta temprana a principios de la Guerra Fría, y es un desarrollo mejorado del AN/SPS-29. Como Radar 2D, solo proporciona datos de azimut y distancia inclinada. Se deben utilizar sensores adicionales para determinar la altitud.
SPS-39=SPS-39|El AN/SPS-39 es un Radar de exploración aérea tridimensional de largo alcance utilizado para proporcionar marcación, distancia y altitud. Al igual que el SPS-48, más grande, gira mecánicamente en azimut pero se explora electrónicamente en elevación. El Radar 3D actúa como intermediario entre el Radar de alerta temprana 2D y los Radares de dirección de tiro utilizados para atacar objetivos.
SPS-40=SPS-40|El AN/SPS-40 es un Radar 2D de exploración aérea a largo alcance habitual en muchos buques estadounidenses. Como Radar 2D, solo proporciona datos de azimut y distancia inclinada. Se deben utilizar sensores adicionales para determinar la altitud.
SPS-43=SPS-43|El AN/SPS-43 es un sistema de Radar de exploración aérea de muy largo alcance utilizado principalmente en portaaviones y cruceros de misiles guiados estadounidenses. Operando en la banda VHF, el AN/SPS-43 también emplea salto de frecuencia para contrarrestar los intentos de interferencia. Como Radar 2D, solo proporciona datos de azimut y distancia inclinada.
SPS-48=SPS-48|El AN/SPS-48 es un Radar 3D de exploración aérea a largo alcance. El azimut del objetivo se detecta mediante escaneo mecánico al girar toda la antena sobre su base, mientras que la elevación se determina mediante escaneo electrónico. El Radar 3D actúa como intermediario entre el Radar de alerta temprana 2D y los Radares de dirección de tiro utilizados para atacar objetivos.
SPS-48E=SPS-48E|El AN/SPS-48E es un Radar 3D de exploración aérea a largo alcance. El azimut del objetivo se detecta mediante escaneo mecánico al girar toda la antena sobre su base, mientras que la elevación se determina mediante escaneo electrónico. El Radar 3D actúa como intermediario entre el Radar de alerta temprana 2D y los Radares de dirección de tiro utilizados para atacar objetivos.\nEste es el SPS-48 actualizado específicamente para el programa NTU con una nueva antena y capacidades de baja altitud y ECCM significativamente mejoradas, y cuenta con un alcance efectivo aún mayor.
SPS-49=SPS-49|El AN/SPS-49 es un Radar 2D de exploración aérea a largo alcance y el sucesor del SPS-40. Es un Radar principal de exploración aérea para muchos buques estadounidenses y aliados. En buques más antiguos reemplazó al SPS-40 durante el programa de actualización NTU.
SPS-49V5=SPS-49(V)5|El AN/SPS-49(V)5 es un Radar 2D de exploración aérea a largo alcance y el sucesor del SPS-40. Es un Radar principal de exploración aérea para muchos buques estadounidenses y aliados. En buques más antiguos reemplazó al SPS-40 durante el programa de actualización NTU.\nEste es un modelo actualizado de mayor potencia derivado del programa NTU e instalado a posteriori en otros buques, y posee una altitud mínima más baja y un mejor rendimiento ECCM.
SPS-52=SPS-52|El AN/SPS-52 es un Radar de exploración aérea 3D de largo alcance utilizado para proporcionar marcación, distancia y altitud. Al igual que el SPS-48, más grande, gira mecánicamente en azimut pero se explora electrónicamente en elevación. El Radar 3D actúa como intermediario entre el Radar de alerta temprana 2D y los Radares de dirección de tiro utilizados para atacar objetivos.
SPN-43=SPN-43|El AN/SPN-43 es un Radar ATC 2D utilizado a bordo de portaaviones y otros buques con capacidad aérea para proporcionar identificación y control de aeronaves dentro de un alcance de 50 millas desde el buque.
SPY-1A=SPY-1A|El AN/SPY-1 es una matriz de escaneo electrónico pasivo 3D de largo alcance y un componente clave del sistema de combate AEGIS. Se utilizan cuatro antenas distribuidas y controladas por ordenador para proporcionar una cobertura continua de 360 grados del espacio aéreo alrededor del buque.
MK-23_TAS=MK-23 TAS|El Mk. 23 TAS (Sistema de Adquisición de Objetivos) es un Radar 2D de medio alcance, pequeño y de rápida rotación, para detectar ataques con misiles rozadores de la superficie o de gran ángulo, utilizado en combinación con el sistema de defensa de punto NATO Sea Sparrow.

#---Surface only---
SPS-10=SPS-10|El AN/SPS-10 es un Radar bidimensional de exploración de superficie que equipó a muchos buques estadounidenses y aliados durante la posguerra y la Guerra Fría.
SPS-55=SPS-55|El AN/SPS-55 es un Radar de navegación y exploración de superficie de estado sólido que equipa a la clase Spruance y sus derivados, así como a las fragatas de la clase Oliver Hazard Perry y dragaminas de la clase Avenger.
SPS-67=SPS-67|El AN/SPS-67 es un Radar de exploración de superficie de corto alcance comúnmente utilizado a bordo de buques estadounidenses para la detección y seguimiento de contactos de superficie y a muy baja altitud.

#---Fire Control---
#SAM
MK-115=MK-115|El Mk-115 es un director tripulado que proporciona iluminación de objetivos para el sistema básico de misiles de defensa de punto Sea Sparrow (BPDMS).
MK-95=MK-95|El Radar de dirección de tiro Mk-95 forma parte del sistema de misiles de defensa de punto modernizado NATO Sea Sparrow, proporcionando iluminación de objetivos para el sistema de misiles con autodirección por Radar semiactivo.
SPW-2=SPW-2|El AN/SPW-2 es un Radar de guiado para su uso con el misil RIM-8 Talos durante la fase de guiado sobre haz del perfil de vuelo del misil.
SPG-49=SPG-49|El AN/SPG-49 es un Radar de dirección de tiro para el misil RIM-8 Talos. Se utiliza para el seguimiento de objetivos y la iluminación terminal para la fase de autodirección por Radar semiactivo del perfil de vuelo del misil.
SPG-51=SPG-51|El AN/SPG-51 es un Radar de dirección de tiro para cañón y misiles en bandas C y X, utilizado con los sistemas de misiles Tartar y Standard MR.
SPG-55=SPG-55|El AN/SPG-55 es un Radar de dirección de tiro que proporciona seguimiento e iluminación para los sistemas de misiles Terrier y Standard ER. Un modo especial de seguimiento de superficie permite que los misiles se utilicen en un rol antibuque.
SPG-60=SPG-60|El Radar de iluminación de objetivos independiente (STIR) AN/SPG-60 es un Radar de seguimiento monopulso e iluminación de objetivos en banda X para los sistemas de misiles Tartar y Standard MR en buques equipados con el sistema de dirección de tiro de cañón Mk-86.
SPG-62=SPG-62|El AN/SPG-62 es un Radar de dirección de tiro de onda continua en banda X utilizado para la iluminación terminal de misiles Standard SM-2 en buques equipados con el sistema de combate AEGIS.
SYR-1=SYR-1|El SYR-1 es un conjunto de antenas de enlace de datos estadounidense utilizado para recibir órdenes de descendente de misiles SM-2, y se usa principalmente en buques SM-2ER bajo el programa CG/SM-2. Tiene un rendimiento limitado en comparación con el sistema AEGIS, pero permite muchos más misiles en vuelo en comparación con un buque de combate equipado con SM-1.
SYR-1_NTU=SYR-1 (NTU)|El SYR-1 es un conjunto de antenas de enlace de datos estadounidense utilizado para recibir órdenes de descendente de misiles SM-2, y se utilizó en buques del programa New Threat Upgrade a finales de la década de 1980 y principios de la de 1990. Los buques NTU están aproximadamente a la par con los primeros buques AEGIS en términos de capacidad de dirección de tiro,
SYS-1=SYS-1
#Guns
MK37_GFCS_MK4=Mark 37 GFCS (Radar Mark 4 "FD")|El sistema de dirección de tiro de cañón (GFCS) Mark 37 controla el cañón de doble propósito de 5"/calibre 38. El director está equipado con el Radar telemétrico Mark 4 "FD", una combinación muy exitosa que permite atacar objetivos tanto aéreos como de superficie.
MK37_GFCS_MK12=Mark 37 GFCS (Radar Mark 12/22)|El sistema de dirección de tiro de cañón (GFCS) Mark 37 controla el cañón de doble propósito de 5"/calibre 38. El director está equipado con el Radar telemétrico Mark 12, así como con el altímetro Mark 22. Esta combinación de director y equipos de Radar equipó a casi todos los buques de guerra de nueva construcción y modernizados a mediados de 1944.
MK37_GFCS_MK28=Mark 37 GFCS (Radar Mark 28)|El sistema de dirección de tiro de cañón (GFCS) Mark 37 controla el cañón de doble propósito de 5"/calibre 38. El director está equipado con la pequeña antena parabólica del Radar telemétrico Mark 28, una innovación de ahorro de peso para buques de guerra más antiguos modernizados en los que los problemas de peso en la parte superior no permitían las instalaciones estándar de Mark 12 y Mark 22 habitualmente montadas en el director Mark 37.
MK37_GFCS=MK37 GFCS|El sistema de dirección de tiro de cañón (GFCS) Mark 37 controla el cañón de doble propósito de 5"/calibre 38. El director está equipado con el Radar telemétrico Mark 25, una combinación estándar para todas las instalaciones Mark 37 de posguerra. Con este aspecto, el GFCS Mark 37 permaneció en servicio hasta principios de la década de 1990.
MK38_GFCS_MK3=Mark 38 GFCS (Radar Mark 3 "FC")|El sistema de dirección de tiro de cañón (GFCS) Mark 38 dirige los cañones de la batería principal de calibre de acorazado, proporcionando una dirección de tiro de gran precisión contra objetivos marítimos y terrestres. Este sistema incorporaba un director blindado situado en la cima de las grandes superestructuras de torre de los acorazados de las clases North Carolina, South Dakota e Iowa. También equipó a los cruceros pesados de la clase Alaska. Este director está equipado con el Radar telemétrico Mark 3 "FC", uno de los primeros equipos de dirección de tiro estadounidenses. Esta combinación de director y Radar tuvo un servicio destacado en 1942 y 1943, antes de su reemplazo por los equipos Mark 8 y posteriormente Mark 13.
MK38_GFCS=Mark 38 GFCS (Radar Mark 13)|El sistema de dirección de tiro de cañón (GFCS) Mark 38 dirige los cañones de la batería principal de calibre de acorazado, proporcionando una dirección de tiro de gran precisión contra objetivos marítimos y terrestres. Este sistema incorporaba un director blindado situado en la cima de las grandes superestructuras de torre de los acorazados de las clases North Carolina, South Dakota e Iowa. También equipó a los cruceros pesados de la clase Alaska. Este director está equipado con el Radar telemétrico Mark 13, y permaneció en servicio hasta principios de la década de 1990 con el retiro de la clase Iowa.
MK56_GFCS=MK56_GFCS|El sistema de dirección de tiro Mk-56 se utiliza en buques equipados con cañones de 3" y 5". Un rastreador por Radar en banda X permite a los buques atacar tanto a objetivos de superficie como a objetivos aéreos rápidos.
MK63_GFCS=MK63_GFCS|El sistema de dirección de tiro Mk-63 se utiliza en buques equipados con cañones de 3" y 5". Un rastreador por Radar en banda X permite a los buques atacar tanto a objetivos de superficie como a objetivos aéreos rápidos.
MK68_GFCS=MK68 GFCS|El sistema de dirección de tiro Mk-68 se utiliza en buques equipados con los montajes de cañón Mk-42 de 5"/54. Un rastreador por Radar en banda X permite a los buques atacar tanto a objetivos de superficie como a objetivos aéreos rápidos.
MK86_GFCS=MK86 GFCS|El sistema de dirección de tiro Mk-86 se utiliza en buques equipados con los montajes de cañón Mk-45 de 5"/54. Un rastreador por Radar en banda X permite a los buques atacar tanto a objetivos de superficie como a objetivos aéreos rápidos. A diferencia de los directores anteriores, no está tripulado y utiliza cámaras de TV remotas como respaldo óptico.
MK92_FCS=MK92 FCS|El Mk-92 es una versión bajo licencia del Radar de dirección de tiro holandés WM-25 utilizado por la USN en las fragatas de la clase Oliver Hazard Perry y los hidroalas de la clase Pegasus, donde controla los misiles Standard MR del buque y el cañón de 76 mm.
MK92_SearchRadar=MK92 Radar|El Mk-92 incluye dos Radares, un equipo de exploración y seguimiento, y un Radar de dirección de tiro de onda continua. Este es el equipo de Radar de exploración, y puede seguir 2 objetivos de superficie a la vez y dirigir el fuego de artillería hacia ellos.
SPQ-9=SPQ-9|El AN/SPQ-9 es el Radar de seguimiento y exploración de superficie en banda X asociado al sistema de dirección de tiro Mk-86. Cabe destacar que este Radar puede seguir objetivos aéreos a baja altitud, como misiles de crucero rozadores de la superficie, a corto alcance, aunque con una capacidad de altitud muy limitada.

#---------- Submarines ----------
BPS-14_15=BPS-14|El AN/BPS-14 es un Radar de exploración de superficie utilizado por submarinos estadounidenses para la navegación.

#---------------------------------------- Aircraft radar ----------------------------------------
AN/APY-1=AN/APY-1|El AN/APY-1 es un Radar de exploración aérea y de superficie de muy largo alcance utilizado en el E-3 AWACS para proporcionar alerta temprana y funcionalidad de mando y control de batalla.
LN-66=LN-66|El LN-66 es un Radar civil de exploración de superficie de corto alcance que equipa por igual a muchos buques comerciales y militares, pero que también se utiliza en el helicóptero SH-2F LAMPS.
AN/ASB-1B=AN/ASB-1B
AN/APS-20=AN/APS-20|El AN/APS-20 es un Radar de exploración aérea de largo alcance en banda S utilizado por el P-2H Neptune.
AN/APS-80=AN/APS-80|El AN/APS-80 es un Radar aerotransportado de vigilancia marítima y exploración de superficie de largo alcance en banda X. Este equipo de Radar utiliza antenas de escaneo mecánico para proporcionar una cobertura de 360 grados. Fue instalado en las primeras aeronaves P-3 Orion y en el US-1 japonés.
AN/APS-96=AN/APS-96
AN/APS-115=AN/APS-115|El AN/APS-115 es un Radar de exploración de superficie en banda X utilizado por el P-3 Orion. El Radar se desarrolló a partir del AN/APS-80A.
AN/APS-116=AN/APS-116|El AN/APS-116 es un Radar de exploración de superficie diseñado específicamente para detectar periscopios y mástiles de submarinos, que solo pueden ser visibles durante breves periodos de tiempo.
AN/APS-125=AN/APS-125|El AN/APS-125 es un Radar de exploración aérea de largo alcance en banda UHF utilizado para la alerta temprana aerotransportada por la USN.
AN/APQ-110=AN/APQ-110
AN/APQ-113=AN/APQ-113
AN/APQ-126=AN/APQ-126|El AN/APQ-126 es un Radar aerotransportado de navegación y ataque utilizado en los aviones de ataque A-7D y A-7E, proporcionando capacidad de ataque en cualquier condición meteorológica.
AN/APS-138=AN/APS-138|El AN/APS-138 es un Radar de exploración aérea de largo alcance en banda UHF utilizado para la alerta temprana aerotransportada por la USN.
AN/APQ-144=AN/APQ-144
AN/APQ-148=AN/APQ-148|El AN/APQ-148 es un Radar aerotransportado de modo múltiple utilizado en las variantes posteriores del A-6, donde proporciona una capacidad avanzada de ataque a baja altitud y en cualquier condición meteorológica.
AN/APQ-156=AN/APQ-156|El AN/APQ-156 es un Radar aerotransportado de modo múltiple utilizado en el A-6E TRAM, donde proporciona una capacidad avanzada de ataque a baja altitud y en cualquier condición meteorológica.
AN/APQ-161=AN/APQ-161
AN/APD-7=AN/APD-7
AN/AWG-9=AN/AWG-9|El Radar AN/AWG-9 es un Radar de exploración con seguimiento síncrono («track-while-scan») de largo alcance concebido específicamente para su uso con el sistema de misiles AIM-54 Phoenix, donde permite el ataque simultáneo de hasta seis objetivos. Como tal, solo equipa al F-14.
AN/AWG-9_Phoenix=AN/AWG-9 (Guía AIM-54)|Modo de guía especial para el sistema de misiles AIM-54 Phoenix que permite el ataque simultáneo de hasta seis objetivos. Este modo solo se aplica al AIM-54 y es posible guiar solo un AIM-7 a la vez.
AN/APG-53=AN/APG-53A|El APG-53A es un Radar de corto alcance para mapeo terrestre y bombardeo utilizado por el A-4 Skyhawk.
AN/APG-63=AN/APG-63|El AN/APG-63 es un Radar de largo alcance con capacidad de seguimiento mientras escanea (track-while-scan) que equipa al F-15.
AN/APQ-109=AN/APQ-109|El AN/APQ-109 es un Radar de alcance medio y multimodo utilizado en el F-4D. No tiene capacidad de búsqueda/ataque hacia abajo (look-down/shoot-down), por lo que el alcance de detección y tiro es extremadamente limitado contra aeronaves que vuelan bajo.
AN/APQ-120=AN/APQ-120|El AN/APQ-120 es un Radar de alcance medio y multimodo utilizado en el F-4E. No tiene capacidad de búsqueda/ataque hacia abajo (look-down/shoot-down), por lo que el alcance de detección y tiro es extremadamente limitado contra aeronaves que vuelan bajo.
AN/AWG-10A=AN/AWG-10A|El AN/AWG-10A es un Radar integrado de largo alcance y multimodo utilizado en el F-4J. Presenta capacidades de pulso-doppler y es el primer Radar de caza estadounidense capaz de búsqueda/ataque hacia abajo (look-down/shoot-down).
AN/AWG-10B=AN/AWG-10B|El AN/AWG-10B es un Radar integrado de largo alcance y multimodo utilizado en el F-4S. Presenta capacidades de pulso-doppler y es el primer Radar de caza estadounidense capaz de búsqueda/ataque hacia abajo (look-down/shoot-down). Actualizado desde el AWG-10A con electrónica de estado sólido y rendimiento mejorado a baja altitud.
AN/AWG-11=AN/AWG-11|El AN/AWG-11 es un Radar integrado de largo alcance y multimodo. Presenta capacidades de pulso-doppler y es el primer Radar de caza estadounidense capaz de búsqueda/ataque hacia abajo (look-down/shoot-down). Este es el modelo de exportación del AWG-10A del F-4J, y se utiliza en los F-4 Phantom británicos y en el T-2 de la JASDF.
AN/AWG-12=AN/AWG-12|El AN/AWG-12 es un Radar integrado de largo alcance y multimodo. Presenta capacidades de pulso-doppler y es el primer Radar de caza estadounidense capaz de búsqueda/ataque hacia abajo (look-down/shoot-down). Este es el modelo de exportación del AWG-10B del F-4S, y se utiliza en los F-4 Phantom británicos y en el F-1 de la JASDF.
