MK16_Gun=MK 16 Gun|Cañón Mk 16 de 6"/calibre 47|El cañón Mk 16 de 6"/calibre 47 se utilizó en las baterías principales de varios cruceros ligeros de la Marina de EE. UU. antes y durante la Segunda Guerra Mundial. Se montaban principalmente en torretas triples y se utilizaban contra objetivos de superficie. El cañón Mk 16DP era una configuración de doble propósito del Mk 16 para su uso tanto contra aeronaves como contra buques de superficie. Se instaló en los cruceros ligeros clase Worcester de la posguerra y en el buque de entrenamiento de artillería antiaérea Mississippi.
