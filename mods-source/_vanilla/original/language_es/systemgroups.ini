B-52G_OECM=Perturbador Ofensivo|El conjunto ECM Fase VI del B-52G presenta una capacidad de perturbación ofensiva integral, montando un sistema de interferencia de barrera AN/ALT-28 además de conjuntos de interferencia de banda alta y baja AN/ALT-32H y AN/ALT-32L.
B-52G_DECM=Perturbador ECM|El B-52D cuenta con un sistema de contramedidas activas AN/ALQ-117 y un generador de objetivos falsos AN/ALQ-122, para derrotar los radares de control de tiro enemigos.
