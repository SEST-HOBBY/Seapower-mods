Kerch-670=MGK-100 "Kerch-670"|El MGK-100 "Kerch-670" (nombre en reporte OTAN: Shark Teeth/Shark Fin) es un sistema de sonar integrado de frecuencia media soviético que utiliza una matriz cilíndrica pasiva y una matriz plana activa giratoria. La versión Kerch-670 añade un conjunto de matrices pasivas laterales. Incluye sonares para detección de minas e interceptación HF activa.
MGK-300=MGK-300 "Rubin"|El MGK-300 "Rubin" (nombre en reporte OTAN: Shark Teeth/Shark Fin) es un gran sonar submarino de frecuencia media soviético, destinado a aprovechar la propagación por la zona de convergencia y el rebote en el fondo para la detección a largo alcance.
MGK-1000=MGK-1000 "Okean"|El MGK-1000 "Okean" (nombre en reporte OTAN: Squid Arm) fue el primer sistema de sonar integrado de frecuencia media soviético. Combina una matriz cilíndrica pasiva con una matriz plana activa de entrenamiento/elevación dirigida hidráulicamente, capaz de operar en modo de rebote en el fondo.
MGK-400=MGK-400 "Rubikon"|El MGK-400 "Rubikon" (nombre en reporte OTAN: Shark Gill) es un sistema de sonar integrado de frecuencia media soviético que utiliza una matriz cilíndrica pasiva/activa. Incluye sonares para detección de minas e interceptación HF activa.
MGK-500=MGK-500 "Skat"|El MGK-500 "Skat" (nombre en reporte OTAN: Shark Gill/Shark Tail) es un sistema de sonar integrado de baja frecuencia soviético que utiliza una matriz cilíndrica pasiva/activa y una matriz remolcada. Incluye sonares para detección de minas e interceptación HF activa.
MGK-540=MGK-540 "Skat-3"|El MGK-540 "Skat-3" (nombre en reporte OTAN: Shark Gill/Shark Tail) es un sistema de sonar integrado de baja frecuencia soviético que utiliza una matriz cilíndrica pasiva/activa y una matriz remolcada. Incluye sonares para detección de minas e interceptación HF activa y es una versión mejorada del MGK-500.
