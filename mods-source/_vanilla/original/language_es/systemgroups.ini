#---------------------------------------- Naval Guns ----------------------------------------
V-11=Cañón V-11|V-11 de 37 mm|El V-11 es un cañón antiaéreo soviético de 37 mm de doble cañón utilizado en dragaminas y patrulleras.
ZIF-31=Cañón ZIF-31|ZIF-31 de 57 mm/78,7|El ZIF-31 es una montura de doble cañón de 57 mm que equipa a varios buques de guerra soviéticos construidos durante la Guerra Fría temprana. Al cargarse desde clips de 3 rondas y solo poder disparar 50 rondas antes de tener que enfriarse haciendo correr agua de mar a través de los cañones, estos cañones son de utilidad cuestionable contra aviones modernos.
ZIF-75=Cañón ZIF-75|ZIF-75 de 57 mm/81|El ZIF-75 es una montura de cuatro cañones de 57 mm que equipa a varios buques de guerra soviéticos construidos durante la Guerra Fría temprana. Al cargarse desde clips de 3 rondas y solo poder disparar 50 rondas antes de tener que enfriarse haciendo correr agua de mar a través de los cañones, estos cañones son de utilidad cuestionable contra aviones modernos.
AK725=Cañón AK-725|AK-725 de 57 mm/75|El AK-725 es una montura de doble cañón que consta de un autocañón de 57 mm de disparo rápido que equipa a muchos buques de guerra soviéticos construidos durante las décadas de 1960 y 1970. Es más eficaz contra pequeños buques de combate de superficie y aviones subsónicos. Es menos eficaz contra misiles.
AK176=Cañón AK-176|AK-176 de 76 mm/60|El AK-176 es un autocañón de 76 mm de disparo rápido de un solo cañón que equipa a muchos buques de guerra soviéticos construidos durante las décadas de 1960 y 1970. Es más eficaz contra pequeños buques de combate de superficie y aviones subsónicos. Es menos eficaz contra misiles.
AK726=Cañón AK-726|AK-726 de 76 mm/59|El AK-726 es una montura de doble cañón que consta de un autocañón de 76 mm de disparo rápido que equipa a muchos buques de guerra soviéticos construidos durante las décadas de 1960 y 1970. Es más eficaz contra pequeños buques de combate de superficie y aviones subsónicos. Es menos eficaz contra misiles.
100mm_CM5=Cañón CM-5|CM-5 de 100 mm/70|El CM-5 es una montura de cañón de 100 mm de doble cañón y estabilización triaxial que equipa a los cruceros ligeros de la clase Sverdlov.
152mm_B-38=Cañón B-38|B-38 de 152 mm/57|El B-38 es una montura de cañón de 152 mm de triple cañón que equipa a los cruceros ligeros de la clase Sverdlov.
100mm_AK-100=Cañón AK-100|AK-100 de 100 mm/70|El AK-100 es un cañón de 100 mm de disparo rápido de un solo cañón que equipa a varios buques de guerra soviéticos construidos a finales de la Guerra Fría. Es más eficaz contra pequeños buques de combate de superficie y aviones subsónicos. Es menos eficaz contra misiles.
130mm_AK-130=Cañón AK-130|AK-130 de 130 mm/30|El AK-130 es un cañón de 130 mm de disparo rápido de doble cañón que equipa a varios buques de guerra soviéticos construidos a finales de la Guerra Fría. Es más eficaz contra pequeños buques de combate de superficie y aviones subsónicos. Es menos eficaz contra misiles. En comparación con sus hermanos de 76 mm y 100 mm, es más eficaz en la función de apoyo de fuego de cañón en tierra.
#---------------------------------------- CIWS ----------------------------------------
AK230=CIWS AK-230|CIWS AK-230 de 30 mm/63|El AK-230 es un sistema de armas de proximidad (CIWS) soviético que consta de cañones de revólver de 30 mm de doble disparo rápido en una montura guiada por radar. El radar de control de fuego es Drum Tilt, y cada radar puede controlar dos monturas.
AK630=CIWS AK-630|CIWS AK-630 de 30 mm/54|El AK-630 es un sistema de armas de proximidad (CIWS) soviético que consta de un cañón Gatling de 30 mm de disparo rápido en una montura guiada por radar. El radar de control de fuego es Bass Tilt, y cada radar puede controlar dos monturas. En comparación con el AK-230 anterior, la velocidad de disparo es mucho mayor.

23mm_ZU-23=Cañón ZU-23|ZU-23 de 23 mm/87|El ZU-23 es un autocañón antiaéreo soviético de doble cañón. Es capaz de mantener el fuego hasta 100 disparos antes de que sea necesario cambiar los cañones.
25mm_2M-3=2M-3 de 25 mm|2M-3 de 25 mm/79|El 2M-3 es un autocañón antiaéreo soviético de doble cañón. Los cañones disparan desde clips de 65 rondas y se enfrían con agua durante la recarga.
14.5mm_2M-7=2M-7 de 25 mm|2M-7 de 14,5 mm/93|El 2M-7 es una ametralladora pesada antiaérea soviética de doble cañón utilizada en dragaminas y patrulleras.
14.5mm_2M-5=2M-5 de 14,5 mm|2M-5 de 14,5 mm/93|El 2M-5 es una ametralladora pesada antiaérea soviética de doble cañón utilizada en lanchas torpederas.

12.7mm_DSHK=DSHK de 12,7 mm|
12.7mm_DSHK_Dual=DSHK de 12,7 mm|
#---------------------------------------- Aircraft Guns ----------------------------------------
GSh-23L=Cañón de 23 mm|Autocañón GSH-32L de 23 mm|El GSH-23L es un autocañón soviético de doble cañón de 23 mm accionado por Gast, donde el mecanismo de cada cañón es operado por la acción de disparo del otro, lo que permite velocidades de disparo muy altas en comparación con los cañones ordinarios de tipo revólver.
GSh-6-23=Cañón de 23 mm|Cañón rotatorio GSH-6-23 de 23 mm|El GSH-6-23 es un cañón soviético de seis cañones tipo Gatling montado en el Su-24 y destinado a la función de ataque a tierra.
GSh-6-30=Cañón de 30 mm|Cañón rotatorio GSH-6-30 de 30 mm|El GSH-6-30 es un cañón soviético de seis cañones tipo Gatling montado en el MiG-27 y destinado a la función de ataque a tierra. En los barcos se utiliza en la montura CIWS AK-630.
NR-23=Cañón de 23 mm|Autocañón NR-23 de 23 mm|El NR-23 es un autocañón soviético de un solo cañón, operado por retroceso. Se utilizó en muchos de los primeros cazas soviéticos, y como armamento defensivo en bombarderos.
AM-23=Cañón de 23 mm|Autocañón AM-23 de 23 mm|El AM-23 es un autocañón soviético de un solo cañón, operado por gas y alimentado por cinturón, utilizado principalmente en bombarderos y transportes donde reemplazó al autocañón NR-23 anterior, de disparo más lento.
N-37=Cañón de 37 mm|Autocañón N-37 de 37 mm|El N-37 es un autocañón pesado soviético de un solo cañón utilizado principalmente en cazas, donde un solo impacto sería suficiente para derribar un bombardero.
NN-37=Cañón de 37 mm|Autocañón NN-37 de 37 mm|El NN-37 es una versión mejorada del autocañón pesado soviético N-37 de un solo cañón, con una velocidad de disparo aumentada en un 50%.
