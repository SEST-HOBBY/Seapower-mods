Top_Through=Top Trough|El MR-510 "Kil'-U" (nombre en clave de la OTAN: Top Trough) es un Radar de búsqueda aérea de largo alcance de alta definición. El alcance máximo supera los 300 km.
Head_Net_A=Head Net A|El MR-300 "Angara" (nombre en clave de la OTAN: Head Net A) es un Radar de adquisición y vigilancia aérea y de superficie 2D en banda L. Utiliza una única antena y tiene un alcance significativo, aunque tiene un rendimiento pobre contra objetivos que vuelan bajo.
Head_Net_C=Head Net C|El MR-310U "Angara-M" (nombre en clave de la OTAN: Head Net C) es un Radar de búsqueda aérea y de superficie 3D en banda L derivado del Head Net A, que utiliza dos antenas espalda con espalda con una de ellas inclinada para proporcionar una capacidad básica de medición de altura y una mayor velocidad de actualización de datos. El procesamiento digital permite una mayor capacidad para seguir objetivos que vuelan bajo.
Strut_Curve=Strut Curve|El MR-302 "Rubka" (nombre en clave de la OTAN: Strut Curve) es un Radar de banda S de búsqueda aérea y de superficie de principios de los 60. Se montó principalmente en pequeñas fragatas, buques de desembarco medianos, etc.
Strut_Pair=Strut Pair|El MR-320 "Topaz-2" (nombre en clave de la OTAN: Strut Pair) es un Radar de adquisición y búsqueda aérea en banda S introducido en el inventario soviético en 1976. El principal buque que utilizó este sistema de Radar fue el destructor de la clase Udaloy.
Big_Net=Big Net|MR-500 "Kliver" (nombre en clave de la OTAN: Big Net). Radar de búsqueda aérea y de superficie 2D en banda UHF introducido en 1965. Se instaló en cruceros de misiles de la clase Kresta I y destructores de misiles de la clase Kashin.
Top_Sail=Top Sail|El MR-600 "Voskhod" (nombre en clave de la OTAN: Top Sail) es un Radar de búsqueda aérea 3D de largo alcance que opera en banda L. Puede acoplarse con el MR-500 (Big Net) y en este caso el sistema resultante completo se denomina MR-800 "Flag".
Top_Steer=Top Steer|El MR-710 "Fregat" (nombre en clave de la OTAN: Top Steer) es un Radar de búsqueda aérea y de superficie 3D que opera en banda S. Consta de dos conjuntos de antenas de Radar con procesamiento de señal analógico común. Utilizado en muchos buques de guerra soviéticos construidos a finales de los 70 y 80, como las clases Kiev, Kirov, Slava y Sovremenny.
Top_Pair=Top Pair|El MR-800 "Flag" (nombre en clave de la OTAN: Top Pair) son conjuntos de Radar combinados MR-600 "Voskhod" y MR-500 "Kliver" que se instalaron en los principales buques de guerra soviéticos de finales de los 70 y 80, como los cruceros de las clases Kiev, Kirov y Slava.

