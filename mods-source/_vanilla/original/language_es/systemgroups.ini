Eye_Bowl=Eye Bowl|"Musson" (Nombre en clave de la OTAN: Eye Bowl) es un Radar de Control de Tiro para el sistema de misiles SS-N-14 Silex utilizado en los Krivak I y II, que son demasiado pequeños para llevar el Radar de Control de Tiro Head Lights.
