SQS-26=SQS-26|El AN/SQS-26 es un Sonar activo/pasivo de baja frecuencia montado en proa, utilizado ampliamente por la Marina de los Estados Unidos desde su introducción en 1961. Este Sonar fue el primero de EE. UU. en explotar los modos de Zona de Convergencia y rebote en el fondo para la detección de submarinos a larga distancia.
SQS-53=SQS-53|El AN/SQS-53 es una versión digital mejorada del AN/SQS-26CX, que se conecta con un sistema de control de tiro digital Mk 116 mejorado.
SQS-53B=SQS-53B|El control y la pantalla analógicos originales del AN-SQS-53A fueron reemplazados por controles y pantallas digitales de estado sólido que incorporan un sistema de prueba integrado y el procesador de señales acústicas AN/UYS-1 para la integración con el sistema digital AN/SQQ-89. Instalado en cruceros de la clase Ticonderoga posteriores (CG-56 en adelante) como parte del AN/SQQ-89.
SQS-56=SQS-56|El AN/SQS-56 es un Sonar de detección de submarinos activo/pasivo con capacidades severamente limitadas. Es un sistema montado en casco diseñado para buques del tamaño de una fragata o corbeta. Se espera que los buques de la clase Oliver Hazard Perry equipados con este Sonar lo utilicen principalmente para detectar submarinos con su Sonar Remolcado (AN/SQR-18 y AN/SQR-19).

