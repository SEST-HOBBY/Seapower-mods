#---------------------------------------- Sonar ----------------------------------------
SQS-23=SQS-23|El AN/SQS-23 fue un sonar de búsqueda y ataque de largo alcance, con escaneo de azimut, destinado a ser el sonar estándar para el sistema ASROC. Instalado en una amplia variedad de clases, fue posteriormente reemplazado por el SQS-26, mucho más capaz (y mucho más grande).
SQS-26=SQS-26|El AN/SQS-26 es un sonar activo/pasivo de baja frecuencia, montado en la proa, empleado ampliamente por la US Navy desde su introducción en 1961. Este sonar fue el primer sonar estadounidense en aprovechar la zona de convergencia y los modos de rebote en el fondo para la detección a largo alcance de submarinos.
SQS-53=SQS-53|El AN/SQS-53 es una versión digital mejorada del AN/SQS-26CX, que se integra con un sistema digital de control de tiro Mk 116 mejorado.
SQS-53B=SQS-53B|El control y la visualización analógicos originales del AN-SQS-53A fueron reemplazados por controles y pantallas digitales de estado sólido que incorporan un sistema de pruebas integrado y un procesador de señales acústicas AN/UYS-1 para la integración con el sistema digital AN/SQQ-89. Instalado en cruceros de la clase Ticonderoga posteriores (desde el CG-56 en adelante) como parte del AN/SQQ-89.
SQS-56=SQS-56|El AN/SQS-56 es un sonar de detección de submarinos activo/pasivo con capacidades muy limitadas. Es un sistema montado en el casco, diseñado para buques de tamaño de fragata o corbeta. Se espera que los buques de la clase Oliver Hazard Perry equipados con este sonar lo utilicen principalmente para detectar submarinos mediante su sonda remolcada (AN/SQR-18 y AN/SQR-19).

#---------- Submarines ----------
WLR-9=WLR-9|El AN/WLR-9 es un receptor de intercepción acústica para submarinos, que utiliza una cúpula en el casco y una cúpula en la vela, y proporciona una detección fiable de sonares activos enemigos, así como advertencia de torpedos activos enemigos.

BQS-4=BQS-4|El AN/BQS-4 es el componente activo de alta frecuencia del sonar pasivo BQR-21.
BQR-21=BQR-21|El AN/BQR-21 es un sonar pasivo de arreglo cilíndrico de frecuencia media.
BQQ-5=BQQ-5|El AN/BQQ-5 es un sonar de arreglo esférico, pasivo y activo, de baja frecuencia, montado en la proa, que reemplazó al BQQ-2 originalmente instalado en las clases Permit y Sturgeon, y que equipó, desde el inicio, a los submarinos de ataque clase Los Ángeles.

#Towed
SQS-35=SQS-35|El AN/SQS-35 es un sonar activo de profundidad variable que puede ser remolcado por debajo de la capa térmica, mejorando la capacidad de detección contra submarinos que, de otro modo, se ocultarían en la zona de 'sombra'.
AN/SQR-18A=AN/SQR-18A|El AN/SQR-18 es una matriz remolcada pasiva utilizada en las fragatas de la clase Knox, remolcada desde el 'pez' del VDS SQS-35.
AN/SQR-19=AN/SQR-19|El AN/SQR-19 Tactical Towed Array sonar (TACTAS) es una matriz remolcada pasiva utilizada para la detección a muy largo alcance de submarinos enemigos. Al ser remolcada lejos del buque, se minimiza la interferencia del ruido propio.
BQR-15=BQR-15|El AN/BQR-15 es una matriz remolcada pasiva de línea delgada utilizada en los submarinos de misiles balísticos de flota de las clases Lafayette, James Madison y Benjamin Franklin para la detección temprana de submarinos y torpedos enemigos.
BQR-25=BQR-25|El AN/BQR-25 es una matriz remolcada pasiva adaptada a los submarinos de ataque de la clase Skipjack, que les proporciona una capacidad de detección pasiva de largo alcance contra buques de superficie y submarinos.
TB-16=TB-16|El TB-16 es una matriz remolcada pasiva utilizada en los submarinos de ataque de EE.UU. para la detección a muy largo alcance de buques y submarinos, reemplazando la matriz remolcada clip-en STASS anterior.

#Dipping
AQS-13E=AQS-13E|La serie AN/AQS-13 es un sonar de inmersión para helicópteros a bordo de aeronaves embarcadas en portaaviones, y es el sonar de inmersión más utilizado en Occidente.

#Sonobuoys
SSQ-53_Sonar=DIFAR Sonobuoy|El AN/SSQ-53 DIFAR es una sonoboya LOFAR direccional pasiva utilizada para la detección inicial de submarinos sumergidos.
SSQ-62_Sonar=DICASS Sonobuoy|El AN/SSQ-62 DICASS es una sonoboya activa utilizada para fijar la posición de un submarino sumergido que previamente ha sido localizado con las sonoboyas pasivas SSQ-53.

#---------------------------------------- ESM ----------------------------------------
US_Aircraft_ESM=ESM|Los sistemas de Medidas de Apoyo Electrónico interceptan señales de radar para proporcionar una capacidad de detección pasiva sin necesidad de revelar la ubicación al emitir radiación de radar.
WLR-1=ESM|El conjunto de guerra electrónica AN/WLR-1 detecta buscadores de misiles y radares de puntería enemigos, proporcionando una capacidad de advertencia de misiles.
AN/SLQ-32_RWR=ESM|El conjunto de guerra electrónica AN/SLQ-32(v)1 detecta buscadores de misiles y radares de puntería enemigos, proporcionando una capacidad de advertencia de misiles.
AN/SLQ-32_ESM=ESM|Los conjuntos de guerra electrónica AN/SLQ-32(v)2 y (v)3 conservan la capacidad de advertencia de misiles del (v)1, pero añaden la capacidad de detectar radares de búsqueda de superficie y de alerta temprana.

#---------------------------------------- ECM ----------------------------------------
AN/ULQ-6=ECM Jammer|El transmisor de engaño AN/ULQ-6 es un ECM embarcado temprano. Este sistema se utiliza para interferir con los radares enemigos y reducir su rendimiento de seguimiento.
AN/SLQ-17=ECM Jammer|El AN/SLQ-17 es un ECM embarcado en uso por los portaaviones de la US Navy. Este sistema se utiliza para confundir los radares enemigos generando objetivos falsos.
