#---------------------------------------- CIWS ----------------------------------------
AK230=CIWS AK-230|AK-230 de 30mm/63 CIWS|El AK-230 es un sistema de armas de cierre (CIWS) soviético que consiste en cañones revólver gemelos de disparo rápido de 30mm en una montura guiada por Radar. El radar de control de tiro es Drum Tilt, y cada radar puede controlar dos monturas.
AK630=CIWS AK-630|AK-630 de 30mm/54 CIWS|El AK-630 es un sistema de armas de cierre (CIWS) soviético que consiste en un cañón gatling de disparo rápido de 30mm en una montura guiada por Radar. El radar de control de tiro es Bass Tilt, y cada radar puede controlar dos monturas. En comparación con el AK-230 anterior, la cadencia de tiro es mucho mayor.

23mm_ZU-23=Cañón ZU-23|ZU-23 de 23mm/87|El ZU-23 es un cañón automático antiaéreo soviético de doble cañón. Es capaz de realizar fuego sostenido hasta 100 proyectiles antes de que los cañones deban ser reemplazados.
25mm_2M-3=2M-3 de 25mm|2M-3 de 25mm/79|El 2M-3 es un cañón automático antiaéreo soviético de doble cañón. Los cañones disparan desde peines de 65 proyectiles y se refrigeran con agua durante la recarga.
14.5mm_2M-7=2M-7 de 25mm|2M-7 de 14.5mm/93|El 2M-7 es una ametralladora pesada antiaérea soviética de doble cañón utilizada en dragaminas y patrulleras.
14.5mm_2M-5=2M-5 de 14.5mm|2M-5 de 14.5mm/93|El 2M-5 es una ametralladora pesada antiaérea soviética de doble cañón utilizada en lanchas torpederas a motor.

12.7mm_DSHK=DSHK de 12.7mm|
12.7mm_DSHK_Dual=DSHK de 12.7mm|
12.7mm_NSVT=NSVT de 12.7mm|
#---------------------------------------- Aircraft Guns ----------------------------------------
GShG-762=Minigun de 7.62mm|Ametralladora rotativa GShG-7.62 de 7.62mm|La GShG-7.62 (9-A-622) es una ametralladora rotativa soviética de cuatro cañones desarrollada originalmente para el helicóptero Mi-24.
GSh-23L=Cañón de 23mm|Cañón automático GSH-23L de 23mm|El GSH-23L es un cañón automático soviético de 23mm de doble cañón con acción Gast, donde el mecanismo de cada cañón es operado por la acción de disparo del otro, lo que permite tasas de fuego muy altas en comparación con los cañones ordinarios de tipo revólver.
GSh-6-23=Cañón de 23mm|Cañón rotativo GSH-6-23 de 23mm|El GSH-6-23 es un cañón soviético de tipo Gatling de seis cañones montado en el Su-24 y destinado al papel de ataque a tierra.
GSh-6-30=Cañón de 30mm|Cañón rotativo GSH-6-30 de 30mm|El GSH-6-30 es un cañón soviético de tipo Gatling de seis cañones montado en el MiG-27 y destinado al papel de ataque a tierra. En los barcos se utiliza en la montura CIWS AK-630.
NR-23=Cañón de 23mm|Cañón automático NR-23 de 23mm|El NR-23 es un cañón automático soviético de un solo cañón operado por retroceso. Fue utilizado en muchos de los primeros cazas soviéticos y como armamento defensivo en bombarderos.
AM-23=Cañón de 23mm|Cañón automático AM-23 de 23mm|El AM-23 es un cañón automático soviético de un solo cañón, operado por gas y alimentado por cinta, utilizado principalmente en bombarderos y transportes donde reemplazó al anterior cañón automático NR-23 de disparo más lento.
N-37=Cañón de 37mm|Cañón automático N-37 de 37mm|El N-37 es un cañón automático pesado soviético de un solo cañón utilizado principalmente en cazas, donde un solo impacto sería suficiente para derribar un bombardero.
NN-37=Cañón de 37mm|Cañón automático NN-37 de 37mm|El NN-37 es una versión mejorada del cañón automático pesado soviético N-37 de un solo cañón, con la cadencia de tiro aumentada en un 50%.
