AN/ULQ-6=DECM AN/ULQ-6|El transmisor de engaño AN/ULQ-6 es un ECM naval temprano. Este sistema se utiliza para interferir radares enemigos con el fin de reducir su rendimiento de seguimiento.
AN/SLQ-17=DECM AN/SLQ-17|El AN/SLQ-17 es un ECM naval en uso en portaaviones de la Marina de los EE. UU. Este sistema se utiliza para confundir a los radares enemigos produciendo objetivos falsos.
