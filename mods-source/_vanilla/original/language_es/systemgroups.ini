#---------------------------------------- ESM ----------------------------------------
US_Aircraft_ESM=ESM|Los sistemas de Medidas de Apoyo Electrónico (ESM) interceptan señales de Radar para proporcionar una capacidad de detección pasiva sin necesidad de revelar la ubicación propia mediante la radiación de Radar.

WLR-1=ESM AN/WLR-1C|El conjunto de guerra electrónica AN/WLR-1C es un sistema combinado de interceptación de radio y alerta utilizado en algunos buques de EE. UU. y submarinos anteriores. Presenta una alta sensibilidad, pero una tasa de identificación relativamente lenta.
AN/WLR-6=ESM AN/WLR-6|El sistema ESM AN/WLR-6 es un sistema mejorado de alerta e interceptación de radio para los primeros submarinos de la clase Sturgeon, que utiliza la gran vela y la electrónica digital para aumentar el alcance y la precisión de este sistema sobre el sistema de alerta de radio WLR-1 anterior.
AN/WLQ-4=ELINT AN/WLQ-4|El AN/WLQ-4 "Sea Nymph" es un conjunto de sensores ELINT y SIGINT avanzado para submarinos de la clase Sturgeon modernizados, con una precisión muy alta y capacidades significativas más allá del horizonte.
AN/WLR-8=ELINT AN/WLR-8|El AN/WLR-8 es un sistema ELINT compacto utilizado en SSN de la clase Los Angeles, y fue el sucesor directo del sistema ESM AN/WLR-1. Principalmente, este conjunto ESM fue diseñado para ser más compacto que el WLQ-4, para que pudiera caber dentro del pequeño mástil de los submarinos de la clase Los Angeles.

AN/SLQ-32_RWR=RWR AN/SLQ-32(V)1|El conjunto de guerra electrónica AN/SLQ-32(V)1 detecta buscadores de misiles enemigos y radares de seguimiento, proporcionando una capacidad de alerta de misiles.
AN/SLQ-32_ESM=ESM AN/SLQ-32(V)2|Los conjuntos de guerra electrónica AN/SLQ-32(v)2 y (V)3 conservan la capacidad de alerta de misiles del (V)1 pero añaden la capacidad de detectar radares de búsqueda de superficie y de alerta temprana.

