AN/SQR-18A=AN/SQR-18A(V)2|El AN/SQR-18A(V)2 es un sistema de Sonar Remolcado estadounidense utilizado en fragatas antisubmarinas, como las Knox FF o Perry FFG. La versión (V)2 se despliega desde una guía en la popa, utilizando el equipo de remolque del TACTAS SQR-19.
AN/SQR-18A(V)1=AN/SQR-18A(V)1|El AN/SQR-18A(V)1 es un sistema de Sonar Remolcado estadounidense utilizado en fragatas antisubmarinas, como las Knox FF o Perry FFG. La versión (V)1 se despliega desde el "Pez" VDS SQS-35 para fragatas de la clase Knox.
AN/SQR-19=AN/SQR-19|El Sonar Remolcado Táctico (TACTAS) AN/SQR-19 es un arreglo remolcado pasivo utilizado para la detección a muy largo alcance de submarinos enemigos. Al ser remolcado lejos detrás del buque, se minimiza la interferencia del ruido del propio buque.
BQR-15=BQR-15|El AN/BQR-15 es un arreglo remolcado pasivo de línea delgada utilizado en los submarinos de misiles balísticos de la flota de las clases Lafayette, James Madison y Benjamin Franklin para la detección temprana de submarinos y torpedos enemigos.
BQR-25=BQR-25|El AN/BQR-25 es un arreglo remolcado pasivo adaptado a los submarinos de ataque de la clase Skipjack para darles una capacidad de detección pasiva de largo alcance contra buques de superficie y submarinos.
TB-16=TB-16|El TB-16 es un arreglo remolcado pasivo utilizado en submarinos de ataque de EE. UU. para la detección a muy largo alcance de buques y submarinos, reemplazando el anterior arreglo remolcado acoplable STASS.

