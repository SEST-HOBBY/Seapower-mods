MK16_Gun=Cañón MK 16|Cañón Mk 16 de 6"/47|El cañón Mk 16 de 6"/47 se utilizó en las baterías principales de varios cruceros ligeros de la US Navy anteriores a la guerra y de la Segunda Guerra Mundial. Se montaron principalmente en torretas triples y se utilizaron contra objetivos de superficie. El cañón Mk 16DP era un montaje de doble propósito del Mk 16 para usar contra aviones y barcos de superficie. Se instaló en los cruceros ligeros de la clase Worcester de la posguerra y en el buque escuela de artillería antiaérea Mississippi.
MK28=Cañón MK 28|Cañón Mk 28 de 5"/38|El cañón Mk 28 consta de un par de cañones Mk 12 de 5"/38 en una torreta doble. El cañón de calibre 38 era un compromiso de longitud media entre el anterior cañón estadounidense estándar de bajo ángulo de 5"/51 y el cañón antiaéreo de 5"/25.
MK33=Cañón MK 33|Cañón Mk 33 de 3"/50|El cañón Mk 33 consta de un par de cañones Mk 22 de 3"/50 de disparo rápido en un montaje doble abierto o cerrado. Estos cañones tienen mucha más potencia que los montajes cuádruples de 40 mm cuyo papel reemplazaron.
MK33_Oslo=Cañón MK 33|Cañón Mk 33 de 3"/50|El cañón Mk 33 consta de un par de cañones Mk 22 de 3"/50 de disparo rápido en un montaje doble abierto o cerrado. Estos cañones tienen mucha más potencia que los montajes cuádruples de 40 mm cuyo papel reemplazaron.
MK34=Cañón MK 34|Cañón Mk 34 de 3"/50|El cañón Mk 34 consta de un cañón Mk 22 de 3"/50 de disparo rápido en un montaje abierto. Este cañón tiene mucha más potencia que los montajes cuádruples de 40 mm cuyo papel reemplazó.
MK42=Cañón MK 42|Cañón Mk 42 de 5"/54|En la década de 1950 se necesitaba un cañón con más alcance y una cadencia de fuego más rápida que el cañón de 5"/38 utilizado en la Segunda Guerra Mundial, por lo tanto, el cañón se creó al mismo tiempo que el cañón Mk 26 de 3"/70 para diferentes usos. El Mk 42 de 5"/54 es un montaje de cañón automático de doble propósito (objetivo aire/superficie). Por lo general, se controla de forma remota desde el sistema de control de fuego de cañón Mk 68.
MK45=Cañón MK 45|Cañón Mk 45 de 5"/54|El cañón Mk 45 de 5"/54 es un montaje de cañón de artillería naval estadounidense que consta de un cañón Mk 19 de 5"/54 en el montaje Mk 45. Es más ligero y fácil de mantener en comparación con el montaje Mk 42 anterior. Se controla de forma remota desde el sistema de control de fuego de cañón Mk 86.
MK75=Cañón MK 75|Cañón Mk 75 de 76 mm|El cañón Mk 75 es un cañón automático naval construido y diseñado en Italia. Al ser compacto y contar con una alta cadencia de fuego y una amplia gama de municiones, este cañón es capaz de defensa antiaérea, antisubmarina, puntual y apoyo de fuego naval. El Mk 75 se ha exportado ampliamente y lo utilizan sesenta armadas.

