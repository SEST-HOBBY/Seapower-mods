#---------------------------------------- Radar ----------------------------------------
#---------- Surface ships ----------
#---Air/Air&Surface---
CXAM=CXAM|CXAM fue el prototipo de los radares de búsqueda aérea de largo alcance de la Marina de los EE. UU. Este conjunto equipó a los combatientes más grandes justo antes del comienzo de la Segunda Guerra Mundial. Era un gran colchón de 18 x 16 pies con la capacidad de elevarse, aunque su haz era demasiado ancho para permitir la localización de altura. El CXAM condujo directamente a los radares de búsqueda aérea de la guerra, casi todos los cuales fueron mejoras incrementales sobre este diseño de referencia.
CXAM-1=CXAM-1|CXAM-1 fue una mejora incremental sobre el CXAM, con un total de catorce conjuntos entregados e instalados en acorazados, cruceros y portaaviones. La antena conservó la apariencia de colchón, pero se eliminó la capacidad de elevación. La precisión se mejoró a 200 yardas, y este conjunto permaneció en servicio a bordo de algunos barcos hasta 1943. Fue reemplazado en los grandes combatientes por el conjunto SK o SK-2.
SA=SA|La serie SA de conjuntos estaba destinada a replicar la funcionalidad y el rendimiento del CXAM con una antena más pequeña para su uso a bordo de buques de escolta y auxiliares. Relativamente exitosa, la serie SA se convirtió en el conjunto de búsqueda aérea estándar para escoltas de destructores y fragatas, y algunos también se instalaron en destructores y cruceros ligeros. Este tipo también equipó a los barcos de las fuerzas francesas libres que fueron reacondicionados en los astilleros estadounidenses al final de la guerra.
SC-1=SC-1|Al igual que SA, el SC fue un intento de llevar el rendimiento del CXAM a barcos más pequeños mediante el uso de una antena más pequeña. Desafortunadamente, la antena más pequeña condujo a un rango efectivo más bajo, y a las fuerzas operativas no les gustó la línea de base SC. Luego, SC-1 se introdujo en enero de 1942 con el doble de potencia y el doble de alcance, y pronto todos los SC se convirtieron. Este conjunto equipó destructores y auxiliares al principio de la guerra antes de ser reemplazado por SC-2 a medida que ese conjunto estuvo disponible.
SC-2=SC-2|SC-2 mejoró el SC-1 al agrandar enormemente la antena. Este conjunto incorporó disposiciones para los sistemas IFF BG y BL, y se convirtió en el radar principal para los destructores hasta el final de la guerra. Las variantes ligeramente mejoradas de SC-2 (SC-3, SC-4 y SC-5) permanecieron en servicio en los destructores hasta 1963.
SK=SK|SK fue el conjunto de búsqueda aérea estándar en tiempos de guerra para barcos grandes. Esencialmente un conjunto SC-2 con una antena del tamaño de CXAM, era un sistema de radar bidimensional que proporcionaba solo datos de azimut y rango de inclinación. Se requirieron sensores adicionales para la localización de altura.
SK-2=SK-2|Este conjunto fue una mejora incremental con respecto a SK, con una antena parabólica de 17 pies destinada a reducir los lóbulos laterales. Al final de la guerra, tanto SK como SK-2 fueron criticados por su incapacidad para detectar aviones de gran altura debido a la baja elevación del haz. Se produjeron 75 juegos, que equiparon a los combatientes más grandes cuando entraron en servicio o llegaron a los astilleros para su reacondicionamiento.
SM=SM|SM fue el primer radar estadounidense diseñado para la dirección de cazas, que incorporó un "haz de lápiz" escaneado cónicamente para determinar la altura de un objetivo aéreo, una capacidad no disponible para los radares de búsqueda aérea anteriores. SM era muy pesado con 18,000 libras (4,000 libras solo para la antena) y solo podía montarse en portaaviones grandes. Más tarde, SM-1 y SP se construyeron para barcos más pequeños.
SP=SP|SP fue el sucesor ligero del radar de localización de altura SM. Este conjunto podría incorporar dos antenas diferentes según el barco que lo recibiera, con una antena más pequeña disponible para destructores y portaaviones ligeros. Este conjunto equipó a los piquetes de radar de la clase Gearing (DDR) que operaban frente a Okinawa. Se construyeron 300 juegos, y al final de la guerra era común ver barcos capitales que montaban un SP en el mástil principal que complementaba un SK o SK-2 en el mástil de proa.
SR=SR|SR fue el primer conjunto de búsqueda aérea completamente nuevo desde CXAM, que incorporó muchas características nuevas que habían sido iniciadas por conjuntos de radar anteriores. La antena era aproximadamente del mismo tamaño que la SC-2 con más del doble de potencia, y equipó a los destructores hacia el final de la guerra. También equipó a los combatientes más grandes como un radar de búsqueda aérea de respaldo, y permaneció en servicio hasta 1961.
SR-2=SR-2|SR-2 era un conjunto de búsqueda aérea 2D de 50 cm originalmente destinado a escoltas de destructores, pero después de que comenzó la producción resultó ser demasiado grande. Los modelos piloto equiparon a los grandes portaaviones de la clase Midway, así como a varios cruceros ligeros y los cuatro primeros de los piquetes de radar de submarinos (SSR). Este conjunto fue reemplazado por el AN/SPS-6 debido a su rendimiento inferior.
SR-3=SR-3|SR-3 y SR-6 fueron diseñados como reemplazos para SK y SC en toda la flota, utilizando la banda L para un mejor rendimiento con menos desvanecimiento. Ambos conjuntos tuvieron un mal desempeño en la realidad debido a las antenas elegidas, que se describieron como "no suficiente antena" en un informe de la posguerra. SR-6 era una versión más ligera de SR-3, con una antena más pequeña.
SR-6=SR-6|SR-3 y SR-6 fueron diseñados como reemplazos para SK y SC en toda la flota, utilizando la banda L para un mejor rendimiento con menos desvanecimiento. Ambos conjuntos tuvieron un mal desempeño en la realidad debido a las antenas elegidas, que se describieron como "no suficiente antena" en un informe de la posguerra. SR-6 era una versión más ligera de SR-3, con una antena más pequeña.
SPS-6=SPS-6|El AN/SPS-6 es un radar bidimensional utilizado por la Marina de los EE. UU. como un radar de búsqueda aérea de primera generación después de la Segunda Guerra Mundial, y fue ampliamente exportado a los aliados. Como el AN/SPS-6 es un radar 2D, proporciona solo datos de azimut y rango de inclinación. Se deben utilizar sensores adicionales para determinar la altura.
SPS-12=SPS-12|En servicio desde la década de 1950 hasta la de 1980, el AN/SPS-12 es un radar de vigilancia aérea y de superficie bidimensional de alcance medio.
SPS-29=SPS-29|El AN/SPS-29 es un radar bidimensional utilizado por la Marina de los EE. UU. como un radar de alerta temprana después de la Segunda Guerra Mundial, y fue equipado a bordo de barcos navales durante la Guerra Fría. Como radar 2D, proporciona solo datos de azimut y rango de inclinación. Se deben utilizar sensores adicionales para determinar la altura.
SPS-30=SPS-30|Una versión modernizada del AN/SPS-8 combinada con un transmisor más potente, el AN/SPS-30 es un sistema de radar de búsqueda y localización de altura de banda S integrado a bordo de un barco que se utiliza para la detección y vigilancia de aeronaves.
UPA-43=UPA-43|El AN/UPA-43 es un interrogador de identificación amigo-enemigo (IFF) utilizado por la Marina de los EE. UU. Los radares posteriores como el AN/SPS-48 cuentan con un interrogador IFF integrado que elimina la necesidad de una antena separada.
SPS-32=SPS-32|Como parte del famoso sistema SCANFAR utilizado por el USS Enterprise y el USS Long Beach, el AN/SPS-32 es la parte orientada horizontalmente del sistema de antena y se utiliza principalmente para la vigilancia aérea.
SPS-33=SPS-33|Como parte del famoso sistema SCANFAR utilizado por el USS Enterprise y el USS Long Beach, el AN/SPS-33 es la parte orientada verticalmente del sistema de antena y se utiliza principalmente para el seguimiento de objetivos.
SPS-37=SPS-37|El AN/SPS-37 es un radar bidimensional utilizado por la Marina de los EE. UU. como un radar de alerta temprana durante la guerra fría temprana, y es un desarrollo mejorado del AN/SPS-29. Como radar 2D, proporciona solo datos de azimut y rango de inclinación. Se deben utilizar sensores adicionales para determinar la altura.
SPS-39=SPS-39|El AN/SPS-39 es un radar de búsqueda aérea 3D de largo alcance que se utiliza para proporcionar rumbo, alcance y altitud. Al igual que el SPS-48 más grande, se gira mecánicamente para el azimut, pero se escanea electrónicamente para la elevación. El radar 3D actúa como intermediario entre el radar de alerta temprana 2D y los radares de control de fuego utilizados para atacar objetivos.
SPS-40=SPS-40|El AN/SPS-40 es un radar de búsqueda aérea 2D de largo alcance común en muchos barcos estadounidenses. Como radar 2D, proporciona solo datos de azimut y rango de inclinación. Se deben utilizar sensores adicionales para determinar la altura.
SPS-43=SPS-43|El AN/SPS-43 es un sistema de radar de búsqueda aérea de muy largo alcance utilizado principalmente en portaaviones estadounidenses y cruceros de misiles guiados. Operando en la banda VHF, el AN/SPS-43 también emplea el salto de frecuencia para contrarrestar los intentos de interferencia. Como radar 2D, proporciona solo datos de azimut y rango de inclinación.
SPS-48=SPS-48|El AN/SPS-48 es un radar de búsqueda aérea 3D de largo alcance. El azimut del objetivo se detecta mediante el escaneo mecánico girando toda la antena sobre su base, mientras que la elevación se determina mediante el escaneo eléctrico. El radar 3D actúa como intermediario entre el radar de alerta temprana 2D y los radares de control de fuego utilizados para atacar objetivos.
SPS-49=SPS-49|El AN/SPS-49 es un radar de búsqueda aérea 2D de largo alcance y el sucesor del SPS-40. Es un radar de búsqueda aérea primario para muchos barcos estadounidenses y aliados. En los barcos más antiguos, reemplazó al SPS-40 durante el programa de actualización NTU.
SPS-52=SPS-52|El AN/SPS-52 es un radar de búsqueda aérea 3D de largo alcance que se utiliza para proporcionar rumbo, alcance y altitud. Al igual que el SPS-48 más grande, se gira mecánicamente para el azimut, pero se escanea electrónicamente para la elevación. El radar 3D actúa como intermediario entre el radar de alerta temprana 2D y los radares de control de fuego utilizados para atacar objetivos.
SPN-43=SPN-43|AN/SPN-43 es un radar ATC 2D utilizado a bordo de portaaviones y otros barcos con capacidad aérea para proporcionar identificación y control de aeronaves dentro de un rango de 50 millas desde el barco.
SPY-1A=SPY-1A|El AN/SPY-1 es una matriz escaneada electrónicamente pasiva 3D de largo alcance y es un componente clave del sistema de combate AEGIS. Se utilizan cuatro antenas distribuidas controladas por computadora para proporcionar una cobertura continua de 360 grados del espacio aéreo alrededor del barco.
MK-23_TAS=MK-23 TAS|El Mk. 23 TAS (Sistema de Adquisición de Objetivos) es un radar 2D de alcance medio, pequeño y de rotación rápida para detectar ataques de misiles de roce marítimo o de ángulo alto, utilizado junto con el sistema de defensa puntual Sea Sparrow de la OTAN.
#---Solo Superficie---
SPS-10=SPS-10|AN/SPS-10 es un radar bidimensional de búsqueda de superficie que equipa a numerosos buques de EE.UU. y aliados durante la posguerra y la era de la Guerra Fría.
SPS-55=SPS-55|El AN/SPS-55 es un radar de búsqueda de superficie y navegación de estado sólido que equipa a la clase Spruance y sus derivados, así como a las fragatas Oliver Hazard Perry y a los buscaminas de la clase Avenger.
SPS-67=SPS-67|El AN/SPS-67 es un radar de búsqueda de superficie de corto alcance, comúnmente utilizado a bordo de buques de EE.UU. para la detección y seguimiento de contactos en superficie y de muy baja altitud.

#---Control de Tiro---
#SAM
MK-115=MK-115|El Mk-115 es un director tripulado que proporciona iluminación del objetivo para el Sistema Básico de Defensa de Puntos Sea Sparrow (BPDMS).
MK-95=MK-95|El radar de control de tiro Mk-95 forma parte del sistema de misiles de defensa de puntos Sea Sparrow mejorado de la OTAN, proporcionando iluminación del objetivo para el sistema de misiles de guiado por radar semiactivo.
SPW-2=SPW-2|El AN/SPW-2 es un radar de guía utilizado con el misil RIM-8 Talos para la parte de guiado por haz del perfil de vuelo del misil.
SPG-49=SPG-49|El AN/SPG-49 es un radar de control de tiro para el misil RIM-8 Talos. Se utiliza para el seguimiento del objetivo y la iluminación terminal en la fase de guiado semiactivo por radar del misil.
SPG-51=SPG-51|El AN/SPG-51 es un radar de control de tiro en bandas C y X para cañones y misiles, empleado con los sistemas de misiles Tartar y Standard MR.
SPG-55=SPG-55|El AN/SPG-55 es un radar de control de tiro que proporciona seguimiento e iluminación para los sistemas de misiles Terrier y Standard ER. Un modo especial de seguimiento de superficie permite que los misiles se utilicen en función antisuperficie.
SPG-60=SPG-60|El AN/SPG-60, radar de iluminación de objetivo separado (STIR), es un radar de seguimiento monopulso en banda X y de iluminación de objetivo para los sistemas de misiles Tartar y Standard MR en buques equipados con el sistema de control de tiro de cañón Mk-86.
SPG-62=SPG-62|El AN/SPG-62 es un radar de control de tiro de onda continua en banda X, utilizado para la iluminación terminal de misiles Standard SM-2 en buques equipados con el sistema de combate AEGIS.
#Guns
MK37_GFCS_MK4=Mark 37 GFCS (radar Mark 4 "FD")|El sistema de control de fuego de cañón Mark 37 (GFCS) controla el cañón de doble propósito de 5"/38. El director está equipado con el radar de alcance Mark 4 "FD", una combinación muy exitosa que permite atacar objetivos tanto aéreos como de superficie.
MK37_GFCS_MK12=Mark 37 GFCS (radar Mark 12/22)|El sistema de control de fuego de cañón Mark 37 (GFCS) controla el cañón de doble propósito de 5"/38. El director está equipado con el radar de alcance Mark 12, así como con el telémetro de altura Mark 22. Esta combinación de director y conjuntos de radar equipó casi todas las construcciones nuevas y los buques de guerra reacondicionados a mediados de 1944.
MK37_GFCS_MK28=Mark 37 GFCS (radar Mark 28)|El sistema de control de fuego de cañón Mark 37 (GFCS) controla el cañón de doble propósito de 5"/38. El director está equipado con el pequeño plato del radar de alcance Mark 28, una innovación para ahorrar peso en los buques de guerra reacondicionados más antiguos donde las preocupaciones por el peso superior no permitían las instalaciones estándar Mark 12 y Mark 22 que generalmente se instalaban en el director Mark 37.
MK37_GFCS=MK37 GFCS|El sistema de control de fuego de cañón Mark 37 (GFCS) controla el cañón de doble propósito de 5"/38. El director está equipado con el radar de alcance Mark 25, una combinación estándar para todas las instalaciones Mark 37 de la posguerra. Con esta forma, el Mark 37 GFCS permaneció en servicio hasta principios de la década de 1990.
MK38_GFCS_MK3=Mark 38 GFCS (radar Mark 3 "FC")|El sistema de control de fuego de cañón Mark 38 (GFCS) dirige los cañones de la batería principal de calibre de acorazado, proporcionando un control de fuego de alta precisión contra objetivos marítimos y terrestres. Este sistema incorporó un director blindado colocado sobre las grandes superestructuras de la torre de los acorazados de la clase North Carolina, South Dakota e Iowa. También equipó a los grandes cruceros de la clase Alaska. Este director está equipado con el radar de alcance Mark 3 "FC", uno de los primeros conjuntos de control de fuego estadounidenses. Esta combinación de director y radar tuvo un servicio importante en 1942 y 1943, antes de su reemplazo por los conjuntos Mark 8 y luego Mark 13.
MK38_GFCS=Mark 38 GFCS (radar Mark 13)|El sistema de control de fuego de cañón Mark 38 (GFCS) dirige los cañones de la batería principal de calibre de acorazado, proporcionando un control de fuego de alta precisión contra objetivos marítimos y terrestres. Este sistema incorporó un director blindado colocado sobre las grandes superestructuras de la torre de los acorazados de la clase North Carolina, South Dakota e Iowa. También equipó a los grandes cruceros de la clase Alaska. Este director está equipado con el radar de alcance Mark 13, y permaneció en servicio hasta principios de la década de 1990 con la retirada de la clase Iowa.
MK56_GFCS=MK56_GFCS|El sistema de control de fuego Mk-56 se utiliza en barcos equipados con cañones de 3" y 5". Un rastreador de radar de banda X permite a los barcos atacar tanto objetivos de superficie como objetivos aéreos rápidos por igual.
MK63_GFCS=MK63_GFCS|El sistema de control de fuego Mk-63 se utiliza en barcos equipados con cañones de 3" y 5". Un rastreador de radar de banda X permite a los barcos atacar tanto objetivos de superficie como objetivos aéreos rápidos por igual.
MK68_GFCS=MK68 GFCS|El sistema de control de fuego Mk-68 se utiliza en barcos equipados con los montajes de cañón Mk-42 de 5"/54. Un rastreador de radar de banda X permite a los barcos atacar tanto objetivos de superficie como objetivos aéreos rápidos por igual.
MK86_GFCS=MK86 GFCS|El sistema de control de fuego Mk-86 se utiliza en barcos equipados con los montajes de cañón Mk-45 de 5"/54. Un rastreador de radar de banda X permite a los barcos atacar tanto objetivos de superficie como objetivos aéreos rápidos por igual. A diferencia de los directores anteriores, no tiene tripulación y utiliza cámaras de televisión remotas como respaldo óptico.
MK92_FCS=MK92 FCS|El Mk-92 es una versión con licencia del radar de control de fuego holandés WM-25 utilizado por la USN en las fragatas de la clase Oliver Hazard Perry y los hidroalas Pegasus, donde controla los misiles Standard MR y el cañón de 76 mm de los barcos.
SPQ-9=SPQ-9|El AN/SPQ-9 es el radar de banda X asociado con el sistema de control de fuego Mk-86.

