MG-10M=MG-10M "Feniks-M"|El MG-10M "Feniks-M" (nombre en reporte OTAN: Trout Cheek) es un sonar pasivo de frecuencia media, equivalente al 'Balkon-gerät' alemán de la época de guerra y el primer sistema soviético en utilizar una matriz cilíndrica. Se utilizó en los primeros submarinos soviéticos antes de la aparición de sonares integrados.
