ActiveIntercept_Early=Receptor de Intercepción Activa|Un sistema de intercepción acústica (Intercepción Activa) es efectivamente un RWR para sonares activos; una matriz de sonares detecta y determina el rumbo y la identidad de las señales de sonar activo emitidas, ya sea desde sonares a bordo de barcos o submarinos, o desde buscadores de torpedos de guiado activo. Estos equipos cubren un ángulo de 360 grados alrededor del submarino y pueden detectar emisiones activas en los 'puntos ciegos' donde el sonar pasivo no puede escuchar.
ActiveIntercept_Late=Receptor de Intercepción Activa|Un sistema de intercepción acústica (Intercepción Activa) es efectivamente un RWR para sonares activos; una matriz de sonares detecta y determina el rumbo y la identidad de las señales de sonar activo emitidas, ya sea desde sonares a bordo de barcos o submarinos, o desde buscadores de torpedos de guiado activo. Estos equipos cubren un ángulo de 360 grados alrededor del submarino y pueden detectar emisiones activas en los 'puntos ciegos' donde el sonar pasivo no puede escuchar.
