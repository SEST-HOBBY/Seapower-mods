B-52D_OECM=Perturbador Ofensivo|El conjunto ECM Fase V del B-52D presenta una capacidad de perturbación ofensiva integral, montando dos sistemas de interferencia de barrera AN/ALT-16, dos conjuntos de interferencia de banda alta AN/ALT-32H y un conjunto de interferencia de banda baja AN/ALT-32L.
