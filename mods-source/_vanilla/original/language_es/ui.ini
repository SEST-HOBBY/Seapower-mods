[LoadScreen]
WarningPSE=Un pequeño porcentaje de personas pueden experimentar convulsiones epilépticas cuando se exponen a ciertos patrones de luz o luces intermitentes. La exposición a ciertos patrones o fondos en una pantalla de computadora, o al jugar videojuegos, puede inducir una convulsión epiléptica en estas personas. Ciertas condiciones pueden inducir síntomas epilépticos previamente no detectados incluso en personas sin antecedentes de convulsiones o epilepsia.\r\n\r\nSi tú, o alguien en tu familia, tienes una condición epiléptica, consulta a tu médico antes de jugar. Si experimentas alguno de los siguientes síntomas mientras juegas un videojuego o computadora -- mareos, visión alterada, tics en los ojos o músculos, pérdida de conciencia, desorientación, movimientos involuntarios o convulsiones -- DEJA DE USARLO INMEDIATAMENTE y consulta a tu médico antes de reanudar el juego.
WarningValidity=The contents of the juego files did not match the expected hash, please cerrar the juego, eliminar the contents of /StreamingAssets/original and Validate Integrity a través Steam.\r\n\r\nPressing eliminar Folder will automatically eliminar the folder para you, forcing Steam para redownload it en siguiente launch.
