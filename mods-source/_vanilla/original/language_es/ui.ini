[LoadScreen]
WarningPSE=Un porcentaje muy pequeño de personas puede experimentar convulsiones epilépticas al exponerse a ciertos patrones de luz o luces parpadeantes. La exposición a ciertos patrones o fondos en una pantalla de computadora, o mientras se juegan videojuegos, puede inducir una convulsión epiléptica en estas personas. Ciertas condiciones pueden inducir síntomas epilépticos no detectados previamente incluso en personas que no tienen antecedentes de convulsiones o epilepsia previas.\r\n\r\nSi usted, o alguien de su familia, tiene una condición epiléptica, consulte a su médico antes de jugar. Si experimenta cualquiera de los siguientes síntomas mientras juega un videojuego o juego de computadora -- mareos, visión alterada, espasmos oculares o musculares, pérdida de conciencia, desorientación, cualquier movimiento involuntario o convulsiones -- DEJE INMEDIATAMENTE de usarlo y consulte a su médico antes de reanudar el juego.
WarningValidity=El contenido de los archivos del juego no coincide con el hash esperado, por favor cierre el juego, elimine el contenido de /StreamingAssets/original y valide la integridad a través de Steam.\r\n\r\nAl presionar Eliminar carpeta se borrará automáticamente la carpeta, forzando a Steam a descargarla de nuevo en el próximo inicio.
