Doctrine=Alternar órdenes permanentes
DoctrineInterceptorAllAamRtb=Cuando está activado, los cazas permanecen en estación hasta agotar todos los misiles aire-aire, incluidos los de corto alcance.
DoctrineFighterAllAamAndGunRtb=Cuando está activado, los cazas permanecen en estación hasta agotar todos los misiles aire-aire y la munición de cañón.
DoctrineSonobuoyDepth=Define la profundidad de búsqueda predeterminada de las sonoboyas para helicópteros del jugador. Intermitente alterna lanzamientos por encima y por debajo de la capa.
DoctrineAawSalvoSize=Controla cuántos interceptores disparan los buques del jugador contra cada amenaza aérea entrante en enfrentamientos antiaéreos automáticos.
DoctrineShipsWeaponsTightEngageHostileAircraft=Cuando está activado, los buques del jugador en Weapons Tight pueden atacar automáticamente aeronaves hostiles detectadas.
DoctrineGlobalDisablePopUpAttacks=Cuando está activado, las aeronaves del jugador tratan todas las cargas de ataque como aptas para ataque nivelado y evitan perfiles de ataque pop-up.
DoctrineUnitDisablePopUpAttacks=Cuando está activado, la aeronave seleccionada trata todas las cargas de ataque como aptas para ataque nivelado y evita perfiles de ataque pop-up.
DoctrineGlobalAircraftBombAttackProfile=Selecciona cómo realizan ataques con bombas las aeronaves del jugador. Automático conserva el comportamiento de carga y altitud; pop-up asciende antes del ataque, nivelado mantiene una entrega horizontal, y picado usa un ataque en picado directo.
DoctrineFormationAircraftBombAttackProfile=Aplica el perfil de ataque con bombas seleccionado a las aeronaves de la formación seleccionada. Automático permite usar la configuración global.
DoctrineUnitAircraftBombAttackProfile=Establece el perfil de ataque con bombas de la aeronave seleccionada. Heredar usa el perfil global de ataque con bombas.
DoctrineGlobalFightersDoNotEngageAntiShipMissiles=Cuando está activado, los cazas del jugador no atacarán automáticamente misiles antibuque detectados.
DoctrineFormationFightersDoNotEngageAntiShipMissiles=Cuando está activado, los cazas de la formación seleccionada no atacarán automáticamente misiles antibuque detectados.
DoctrineUnitFightersDoNotEngageAntiShipMissiles=Cuando está activado, el caza seleccionado no atacará automáticamente misiles antibuque detectados.
Map=Alternar mapa
CameraControls=Alternar controles de cámara
FlightDeck=Alternar control de cubierta de vuelo
EventLog=Alternar registro de eventos
DoctrineTransitTelegraph=Establece el valor de telégrafo usado por defecto para que este tipo de plataforma transite.
DoctrineLoiterTelegraph=Establece el valor de telégrafo usado por defecto para que este tipo de plataforma permanezca en espera.
DoctrineAllowAlignment=Cuando está activado, las unidades podrán cambiar el rumbo para presentar sus armas al blanco.
DoctrineAircraftWinchesterRtb=Cuando está activado, las aeronaves del jugador regresan a la base cuando se consideran Winchester.
DoctrineFighterRtbCondition=Selecciona si las aeronaves se consideran Winchester cuando se agotan todos los misiles aire-aire, o solo cuando también se agota la munición de cañón.
DoctrineHelicopterSonobuoyDeployState=Establece la profundidad de búsqueda por defecto de sonoboyas para helicópteros del jugador. Intermitente alterna lanzamientos por encima y por debajo de la capa.
DoctrineAASalvoSize=Controla cuántos interceptores disparan los buques del jugador contra cada amenaza aérea entrante durante enfrentamientos antiaéreos automáticos.
DoctrineShipsOnWeaponsTightEngageHostileAircraft=Cuando está activado, los buques del jugador en Armas Restringidas pueden atacar automáticamente aeronaves hostiles detectadas. Advertencia: al atacar aeronaves, el buque puede activar sus radares.
DoctrineShipsAutoUseSAMsAgainstSurfaceTargets=Cuando está activado, los buques del jugador pueden usar automáticamente misiles superficie-aire con modo antisuperficie contra blancos de superficie.
DoctrineShipsAutoUseAntiShipMissilesAgainstSurfaceTargets=Cuando está desactivado, los buques del jugador en Armas Libres no iniciarán nuevos ataques automáticos con misiles antibuque contra blancos de superficie. Los cañones, torpedos, ASROC y SAM autorizados contra blancos de superficie seguirán disponibles. Las órdenes manuales y las salvas ya ordenadas no se ven afectadas.
DoctrineBombAttackProfile=Selecciona cómo realizan ataques con bombas las aeronaves del jugador. Automático conserva el comportamiento de carga y altitud; ascenso emergente sube antes del ataque, nivelado mantiene una entrega horizontal y picado usa un ataque en picado directo.
DoctrineFightersDoNotEngageAntiShipMissiles=Cuando está activado, los cazas del jugador no atacarán automáticamente misiles antibuque detectados.
DoctrineAutoAttackSurface=Cuando está activado, las unidades del jugador en Armas Libres pueden atacar automáticamente contactos de superficie hostiles válidos.
DoctrineCollisionAvoidance=Cuando está activado, buques y submarinos usan maniobras automáticas de evasión de colisiones para evitar tráfico cercano.
DoctrineDropTanks=Cuando está activado, las aeronaves del jugador desprenden automáticamente los depósitos externos de combustible al entrar en combate.
DoctrineFormationSprintAndDrift=Aplica movimiento de sprint y deriva a todos los buques y submarinos aptos de la formación seleccionada.
DoctrineUnitSprintAndDrift=Hace que el buque o submarino seleccionado alterne entre tramos rápidos de sprint y tramos lentos de deriva mientras sigue sus puntos de ruta normales.
DoctrineFormationBafflesClearing=Permite que los submarinos de la formación seleccionada giren y escuchen periódicamente para despejar sus baffles de sonar mientras siguen órdenes de puntos de ruta.
DoctrineUnitBafflesClearing=Permite que el submarino seleccionado gire y escuche periódicamente para despejar sus baffles de sonar mientras sigue órdenes de puntos de ruta.
DoctrineRemoveEngageTaskAfter=Elimina de la lista de tareas pendientes una tarea de ataque que no haya sido aceptada tras este número de segundos.
DoctrineBombersStaysWithAAM=Cuando está activado, los bombarderos con misiles aire-aire permanecen en estación hasta agotar esos misiles.
DoctrineASWBombersStaysWithSonobuoys=Cuando está activado, las aeronaves ASW con sonoboyas permanecen en estación hasta agotar esas sonoboyas.
DoctrineFighterBombersStaysWithAAM=Cuando está activado, los cazabombarderos con misiles aire-aire permanecen en estación hasta agotar esos misiles.
DoctrineSRFightersStaysWithGuns=Cuando está activado, los cazas de corto alcance y cazabombarderos permanecen en estación mientras quede munición de cañón.
DoctrineOverride=Cuando esto está establecido, el valor heredado se anulará en este nivel.
