[AmmunitionNames]
# ------------------ AAM ------------------
fr_super-530f=Super-530F,,AAM,El Super-530F es un misil aire-aire francés de corto a medio alcance semi-activo. Aproximadamente análogo al AIM-7, es una mejora con respecto al misil R530 anterior.
fr_r550=R550,magia 1,AAM,El R550 magia 1 es un misil aire-aire francés de corto alcance con guía infrarroja comparable al AIM-9 estadounidense. Es solo de aspecto trasero.

usaf_aim-9e=AIM-9E,Sidewinder,AAM,El AIM-9E Sidewinder es un misil aire-aire estadounidense con guía infrarroja. El Echo tiene un rendimiento significativamente mejorado en todas las áreas que las versiones anteriores, con una envolvente de adquisición mejorada y un alcance aumentado. Solo de aspecto trasero.
usaf_aim-9j=AIM-9J,Sidewinder,AAM,El AIM-9J Sidewinder es un misil aire-aire estadounidense con guía infrarroja. El Juliet tiene cambios significativos con respecto al Echo, particularmente en los sistemas de control, con electrónica de estado sólido que reemplaza la electrónica anterior de tubos de vacío. La probabilidad de muerte se mejora con respecto a las versiones anteriores, pero sigue siendo solo de aspecto trasero.

usn_aim-7d=AIM-7D,Sparrow,AAM,El AIM-7D Sparrow es un misil aire-aire estadounidense con guía de radar semi-activa. El Delta se optimizó para aumentar las velocidades de cierre en comparación con el Charlie anterior.
usn_aim-7e=AIM-7E,Sparrow,AAM,El AIM-7E Sparrow es un misil aire-aire estadounidense con guía de radar semi-activa. El Echo ha aumentado el alcance y el rendimiento en comparación con las variantes anteriores.
usn_aim-7m=AIM-7M,Sparrow,AAM,El AIM-7M Sparrow es un misil aire-aire estadounidense con guía de radar semi-activa. El Mike es muy superior a su generación anterior de misiles (AIM-7E-2, AIM-7E, AIM-7D, etc.) principalmente debido a su alcance. A diferencia de la generación anterior de Sparrows, el AIM-7M es adecuado tanto para baja como para gran altitud, pero sobresale en objetivos de gran altitud.
usn_aim-9b=AIM-9B,Sidewinder,AAM,El AIM-9B Sidewinder es un misil aire-aire estadounidense con guía infrarroja. El Bravo fue la primera variante operativa de la serie AIM-9. En comparación con las versiones posteriores, tiene una envolvente de lanzamiento estrecha y una tendencia a ser fácilmente engañado por otra fuente de calor, como el sol. no hace falta decir que es solo de aspecto trasero.
usn_aim-9d=AIM-9D,Sidewinder,AAM,El AIM-9D Sidewinder es un misil aire-aire estadounidense con guía infrarroja. El Delta es una variante mejorada con respecto al Bravo, con un buscador mejorado, una ojiva mejorada y un alcance aumentado. Solo de aspecto trasero.
usn_aim-9l=AIM-9L,Sidewinder,AAM,El AIM-9L Sidewinder es un misil aire-aire estadounidense con guía infrarroja. La variante Lima fue el primer Sidewinder con la capacidad de atacar desde todas las direcciones. En comparación con todas las versiones anteriores, la envolvente de adquisición está enormemente mejorada, con la capacidad de enfrentarse a objetivos de frente en la fusión. Sin embargo, un disparo de aspecto trasero aún permite un mayor alcance de adquisición.
usn_aim-54a=AIM-54A,Phoenix,AAM,El AIM-54A Phoenix es un misil aire-aire estadounidense con guía de radar activa. Este es el misil aire-aire de mayor alcance en el inventario de los EE. UU. Y es exclusivo del F-14. Integrado con el avanzado radar AWG-9, proporciona al F-14 la capacidad de atacar 6 objetivos con 1 misil cada uno simultáneamente. Para lograr esto, los misiles vuelan en piloto automático mientras las computadoras a bordo del avión muestrean los datos del radar de seguimiento mientras escanean en archivos de seguimiento, que luego se utilizan para transmitir actualizaciones de guía a los misiles mientras están en la fase intermedia, guiándolos hacia una 'canasta' donde el propio radar activo del misil adquiere el objetivo para la fase terminal.

wp_aa-2a=AA-2B,Atoll B,IR AAM,El AA-2A Atoll (Vympel R-3S) es un misil aire-aire soviético con guía infrarroja de aspecto trasero. Es una copia de ingeniería inversa del AIM-9B estadounidense, con pequeños ajustes en la construcción y el rendimiento, y por lo demás funciona de manera idéntica. Solo de aspecto trasero.
wp_aa-2c=AA-2C,Atoll C,SARH AAM,El AA-2C Atoll (Vympel K-13/R-3R) es un misil aire-aire soviético con guía de radar semi-activa. Se basa en un AIM-9B de ingeniería inversa, pero tiene un buscador completamente diferente, pero por lo demás comparte las mismas envolventes de lanzamiento y adquisición deficientes del progenitor estadounidense.
wp_aa-2d=AA-2D,Advanced Atoll D,IR AAM,El AA-2D Advanced Atoll (Vympel K-13M) es un misil aire-aire soviético con guía infrarroja. Se deriva del AA-2A Atoll (que a su vez es de ingeniería inversa del AIM-9) pero cuenta con un nuevo motor y buscador, lo que mejora enormemente el rendimiento.
wp_aa-2-2=AA-2D,Advanced Atoll 2,IR AAM,El AA-2-2 Advanced Atoll (Vympel K-13M1) es un misil aire-aire soviético con guía infrarroja. Se deriva del AA-2A Atoll (que a su vez es de ingeniería inversa del AIM-9) pero cuenta con un nuevo motor y buscador, lo que mejora enormemente el rendimiento.

wp_aa-3e=AA-3E,Advanced Anab,SARH AAM,El AA-3E Advanced Anab E (Kaliningrad R-98MR) es un misil aire-aire soviético con guía de radar semi-activa. Uno de un par de diseños Advanced Anab diseñados para el Su-15 y el Yak-28P. Al igual que el AIM-4 Falcon utilizado en los interceptores US F-102 y F-106, la doctrina era disparar un misil guiado por radar y un misil infrarrojo al objetivo, mejorando la probabilidad de muerte.
wp_aa-3f=AA-3F,Advanced Anab,IR AAM,El AA-3 Advanced Anab F (Kaliningrad R-98MT) es un misil aire-aire soviético construido con guía infrarroja. Uno de un par de diseños Advanced Anab diseñados para el Su-15 y el Yak-28P. Al igual que el AIM-4 Falcon utilizado en los interceptores US F-102 y F-106, la doctrina era disparar un misil guiado por radar y un misil infrarrojo al objetivo, mejorando la probabilidad de muerte.
wp_aa-6a=AA-6A,Acrid,AAM,El AA-6A Acrid (Vympel R-40R) es un misil aire-aire soviético de largo alcance con guía de radar semi-activa. Fue desarrollado específicamente para el interceptor MiG-25P para contrarrestar el XB-70 Valkyrie. Al igual que el AIM-4 Falcon utilizado en los interceptores US F-102 y F-106, la doctrina era disparar un misil guiado por radar y un misil infrarrojo al objetivo, mejorando la probabilidad de muerte.
wp_aa-6b=AA-6B,Acrid,IR AAM,El AA-6B Acrid (Vympel R-40T) es un misil aire-aire soviético de largo alcance con guía infrarroja. Fue desarrollado específicamente para el interceptor MiG-25P para contrarrestar el XB-70 Valkyrie. Al igual que el AIM-4 Falcon utilizado en los interceptores US F-102 y F-106, la doctrina era disparar un misil guiado por radar y un misil infrarrojo al objetivo, mejorando la probabilidad de muerte.
wp_aa-6c=AA-6C,Acrid,AAM,El AA-6C Acrid mejorado (Vympel R-40RD) es un misil aire-aire soviético de largo alcance con guía de radar semi-activa. Fue desarrollado específicamente para el nuevo interceptor MiG-25PD. El alcance máximo del misil se incrementó hasta 60 km. Al igual que el AIM-4 Falcon utilizado en los interceptores US F-102 y F-106, la doctrina era disparar un misil guiado por radar y un misil infrarrojo al objetivo, mejorando la probabilidad de muerte.
wp_aa-6d=AA-6D,Acrid,AAM,El AA-6D Acrid mejorado (Vympel R-40TD) es un misil aire-aire soviético de largo alcance con guía infrarroja. Fue desarrollado específicamente para el nuevo interceptor MiG-25PD. El alcance máximo del misil se incrementó hasta 60 km. Al igual que el AIM-4 Falcon utilizado en los interceptores US F-102 y F-106, la doctrina era disparar un misil guiado por radar y un misil infrarrojo al objetivo, mejorando la probabilidad de muerte.
wp_aa-7c=AA-7C,Apex,SARH AAM,El AA-7C Apex (Vympel R-24R) es un misil aire-aire soviético de alcance medio con guía de radar semi-activa. Las variantes actualizadas Charlie y Delta se desarrollaron para equipar el MiG-23 a mediados de la década de 1970. Aproximadamente análogo al AIM-7E estadounidense, el AA-7C cuenta con un buscador monopulso con mayor resistencia a ECM y capacidad de bloqueo después del lanzamiento.
wp_aa-7d=AA-7D,Apex,IR AAM,El AA-7D Apex (Vympel R-24T) es un misil aire-aire soviético de alcance medio con guía infrarroja. Las variantes actualizadas Charlie y Delta se desarrollaron para equipar el MiG-23 a mediados de la década de 1970. Al igual que el AIM-4 Falcon utilizado en los interceptores US F-102 y F-106, la doctrina era disparar un misil guiado por radar y un misil infrarrojo al objetivo, mejorando la probabilidad de muerte.
wp_aa-8=AA-8,Aphid,AAM,El AA-8 Aphid (Vympel R-60) es un misil aire-aire soviético de corto alcance con guía infrarroja. El arma se ha exportado de manera muy amplia y es probable que se encuentre comúnmente en los estados alineados con los soviéticos. Es más maniobrable en comparación con el AIM-9L, pero sigue siendo solo de aspecto trasero, lo que requiere que el avión de lanzamiento se coloque en los 'seis' de los objetivos.

# ------------------ SAM ------------------
jsdf_sam1=Tan-SAM 1,,SAM,Un misil tierra-aire japonés de corto alcance con guía IR de todos los aspectos. Parte del sistema SAM Tipo 82.

plan_hq-61=HQ-61,,SAM,El HQ-61 es un misil tierra-aire chino similar y aproximadamente equivalente al RIM-7F Sea Sparrow.
raf_rapier=FSB Rapier,Rapier,SAM,Un sistema de misiles británico de defensa puntual de corto alcance y baja altitud guiado ópticamente. Utilizando el sistema de guía de comando a la línea de visión (CLOS), tiene una eficacia variable contra aviones y misiles rápidos.
rn_seacat=GWS-20,Seacat,SAM,El GWS-20 Seacat es el ejemplo más antiguo de un sistema de misiles de defensa puntual a bordo. Entró en servicio en la Royal Navy en 1962 y también se ha exportado ampliamente como reemplazo del Bofors de 40 mm. Utilizando el sistema de guía de comando a la línea de visión (CLOS), tiene una efectividad cuestionable contra jets y misiles rápidos.
usa_mim-14=MIM-14,Nike Hercules,SAM,MIM-14 Nike Hercules es un sistema de misiles tierra-aire utilizado por los Estados Unidos y las fuerzas de la OTAN para la defensa aérea de media y gran altitud.
usa_mim-23=MIM-23,Hawk,SAM,Desarrollado en los EE. UU. en la década de 1960, el HAWK es un sistema de misiles tierra-aire de alcance medio relativamente móvil. El misil en sí utiliza guía semiactiva del HPIR (radar iluminador de alta potencia) que es parte de la batería HAWK más amplia, con objetivos detectados por PAR (radar de adquisición de pulsos) para objetivos de gran altitud y CWAR (radar de adquisición de onda continua) para objetivos de baja altitud en entornos terrestres.

usn_rim-2f=RIM-2F,Terrier,SAM/ASuW,El RIM-2F Terrier es uno de los primeros sistemas de misiles tierra-aire introducidos por la USN. Fue concebido para proporcionar una capa defensiva de alcance medio a los grupos de ataque de portaaviones que se encontraban entre los cazas y los cañones. El Terrier original era un arma de seguimiento de haz. El RIM-2F es un arma de guía de radar semiactiva mejorada con mayor maniobrabilidad y probabilidad de destrucción. Al igual que otros misiles tierra-aire, se puede utilizar en una función antisubmarina secundaria. El intervalo de salva se ve afectado negativamente por la necesidad de ensamblar manualmente las aletas de refuerzo, con un lanzador capaz de disparar 2 misiles cada 30 segundos.
usn_rim-24b=RIM-24B,Tartar,SAM/ASuW,necesita descripción
usn_rim-8=RIM-8,Talos,SAM/ASuW,El RIM-8 Talos es un sistema de misiles tierra-aire de largo alcance masivo utilizado principalmente por los cruceros de la USN. Vuela una fase de mitad de curso de seguimiento de haz con una fase terminal de guía de radar semiactiva. El misil requiere cierto ensamblaje antes del lanzamiento, por lo que la velocidad de disparo es menor que la de los sistemas más modernos, como lo indica el gran tamaño físico del cargador utilizado por el sistema.
usn_rim-7=RIM-7F,Sea Sparrow,SAM/ASuW,El RIM-7 Sea Sparrow es un sistema de defensa aérea de corto alcance instalado en numerosos buques de la USN y la OTAN. El sistema está diseñado principalmente para proporcionar una capacidad de autodefensa.
usn_rim-7m=RIM-7M,Sea Sparrow,SAM/ASuW,El RIM-7 Sea Sparrow es un sistema de defensa aérea de corto alcance instalado en numerosos buques de la USN y la OTAN. El sistema está diseñado principalmente para proporcionar una capacidad de autodefensa.
usn_rim-66a=SM-1MR,Standard,SAM/ASuW,El RIM-66A Standard misil 1 MR se desarrolló como un nuevo efector para ser emparejado con plataformas que anteriormente usaban el RIM-24C Tartar. El Standard misil comparte un fuselaje con el Tartar para facilitar la integración física. La variante A fue la más temprana y entró en servicio en 1967.
usn_rim-66b=SM-1MR,Standard,SAM/ASuW,El RIM-66B Standard misil 1 MR se desarrolló como un nuevo efector para ser emparejado con plataformas que anteriormente usaban el RIM-24C Tartar. El Standard misil comparte un fuselaje con el Tartar para facilitar la integración física. La variante B fue una mejora significativa con respecto a la variante A con nuevos componentes. La mayoría de los modelos A se actualizaron a Bs.
usn_rim-66c=SM-2MR,Standard,SAM/ASuW,El RIM-66C Standard misil 2 MR es una parte clave del nuevo sistema de gestión de combate AEGIS instalado en los buques de combate de superficie más nuevos de la USN y la nueva actualización de amenazas instalada en plataformas más antiguas. Proporciona un arma más capaz que el Standard misil 1 más antiguo con un uso reducido del iluminador, lo que permite tener más misiles concurrentes en vuelo.
usn_rim-67a=SM-1ER,Standard,SAM/ASuW,El RIM-67A Standard misil 1 ER se desarrolló como un nuevo efector para reemplazar el RIM-8 Talos. El misil es idéntico al RIM-66A pero está equipado con un propulsor adicional para aumentar su alcance.
usn_rim-67b=SM-2ER,Standard,SAM/ASuW,El RIM-67B Standard misil 2 ER es una parte clave de la nueva actualización de amenazas instalada en plataformas que anteriormente portaban el RIM-2 Terrier. El misil es prácticamente idéntico al RIM-66C, pero está equipado con un propulsor adicional para aumentar su alcance.

wp_sa-n-1=SA-N-1,Goa,SAM/ASuW,El SA-N-1 Goa (M-1 Volna) es el sistema de misiles tierra-aire naval soviético más antiguo. Está destinado a proporcionar defensa aérea de área y un grado de protección contra los misiles antibuque entrantes. Originalmente solo efectivo contra objetivos aéreos de alto vuelo, las variantes posteriores introdujeron una capacidad antisubmarina y una mejor capacidad para atacar objetivos de bajo vuelo, así como un mayor alcance.
wp_sa-n-1c=SA-N-1C,Goa,SAM/ASuW,El SA-N-1C Goa (M-1 Volna-P) es una modificación del sistema de misiles tierra-aire naval soviético más antiguo. Tiene una mejor resistencia a las interferencias y al Chaff y es capaz de atacar objetivos de bajo vuelo.
wp_sa-n-3=SA-N-3,Goblet,SAM/ASuW,El SA-N-3 Goblet (M-11 Shtorm) es un sistema de misiles tierra-aire naval soviético. El sistema se instaló en varias clases de cruceros de misiles y en los portahelicópteros y STOVL de la Unión Soviética. Tiene una capacidad antisubmarina secundaria, y las versiones posteriores mejoraron el rendimiento contra objetivos de bajo vuelo.
wp_sa-n-4=SA-N-4,Gecko,SAM/ASuW,El SA-N-4 Gekko (9K33M Osa) es la versión naval del SA-8 Gecko (observe la ortografía diferente) con dos misiles en un lanzador giratorio retráctil. Se ha instalado en una cantidad significativa de plataformas soviéticas para cumplir la función de defensa aérea de corto alcance.
wp_sa-n-5=SA-N-5,Grail,SAM,El SA-N-5 Grail (9K32 Strela-2) es un misil tierra-aire portátil también conocido como SA-7 cuando se usa desde lanzadores terrestres. En los barcos se utiliza como sistema de defensa puntual.
wp_sa-n-6=SA-N-6,Grumble,SAM/ASuW,El SA-N-6 Grumble (S-300F) es la versión naval del sistema de misiles tierra-aire terrestre SA-10 (S-300P). Este poderoso sistema de largo alcance está instalado en las clases de cruceros de misiles soviéticos y ofrece un rendimiento comparable al del SM-2.
wp_sa-n-7=SA-N-7,Gadfly,SAM/ASuW,El SA-N-7 Gadfly (3S90 Uragan) es la versión naval del sistema de misiles tierra-aire terrestre SA-11 Gadfly (9K37 Buk). El sistema SA-N-7 es un sistema de armas sofisticado y capaz e hizo su entrada en servicio en los destructores de la clase Sovremenny.
wp_sa-n-9=SA-N-9,Gauntlet,SAM/ASuW,El SA-N-9 Gauntlet (3K95 Kinzhal) es la versión naval del sistema de misiles SA-15 Gauntlet (9K330 Tor). Utiliza el mismo misil que el SA-15 y está instalado en una cantidad significativa de los principales buques de combate de superficie soviéticos.

wp_sa-2=SA-2,Guideline,SAM,El SA-2 Guideline (S-75 Dvina) es un sistema de misiles tierra-aire de largo alcance soviético. El sistema está diseñado para contrarrestar a los bombarderos sobre grandes áreas y se ha exportado ampliamente, habiéndose utilizado en muchos conflictos, pero más famoso durante la guerra de Vietnam.
wp_sa-3=SA-3,Goa,SAM,El SA-3 Goa (S-125 Neva/Pechora) es un sistema de misiles tierra-aire de alcance medio soviético. El sistema está diseñado para contrarrestar objetivos más maniobrables y de menor altitud.
wp_sa-4=SA-4,Ganef,SAM,El SA-4 Ganef (2K11 Krug) es un sistema de misiles tierra-aire móvil de alcance medio soviético. El sistema está diseñado para contrarrestar a los bombarderos sobre grandes áreas.
wp_sa-5=SA-5,Gammon,SAM,El SA-5 Gammon (S-200) es un sistema de misiles tierra-aire de largo alcance soviético. El sistema está diseñado para contrarrestar a los bombarderos de gran altitud sobre grandes áreas. Los misiles incorporan una capacidad de localización de interferencias.
wp_sa-6=SA-6,Gainful,SAM,El SA-6 Gainful (2K12 Kub) es un sistema de misiles tierra-aire móvil soviético. El sistema está diseñado para contrarrestar las amenazas de corto alcance hasta aproximadamente 15 millas.
wp_sa-8=SA-8,Gecko,SAM,El SA-8 Gecko (9K33M3 Osa) es un sistema de misiles tierra-aire móvil soviético. El sistema está diseñado para proporcionar defensa aérea de corto alcance para divisiones de tanques y motorizadas.
wp_sa-11=SA-11,Gadfly,SAM,El SA-11 Gadfly (9K37 Buk) es un sistema de misiles tierra-aire móvil soviético. El sistema está diseñado para contrarrestar amenazas de corto alcance hasta aproximadamente 18 millas.
wp_sa-13=SA-13,Gopher,SAM,El SA-13 Gopher (9K35 Strela-10) es un sistema de misiles tierra-aire de corto alcance altamente móvil soviético. El sistema está diseñado para contrarrestar amenazas emergentes de baja altitud, como helicópteros.

# ---------- Misiles antirradar --------- 
usn_agm-45=AGM-45,Shrike,ARM,El AGM-45 Shrike es un misil antirradiación estadounidense desarrollado a partir del fuselaje del AIM-7 Sparrow y un nuevo buscador.
usn_agm-78=AGM-78,Standard ARM,ARM,necesita descripción

wp_as-11=AS-11,Kilter,ARM,El AS-11 Kilter (Kh-58) es un misil antirradiación soviético desarrollado para equipar el avión de ataque Su-24M.

wp_as-2b=AS-2B,Kipper,ASM,K-10SP es una variante del misil K-10S que intercambia la ojiva por el sistema de interferencia Azaliya

# ---------- Misiles antibuque ----------
is_gabriel_2=Gabriel 2,,ASM,Gabriel es un misil antibuque israelí que se considera uno de los primeros misiles rozaolas. La variante Gabriel 2 es una versión mejorada pero muy similar al Gabriel 1. 

it_seakiller_2=Sea Killer 2,,ASM,Sea Killer 2 es un misil antibuque de corto alcance desarrollado en Italia. Irán compró el Sea Killer Mark 2 para armar sus fragatas de la clase Alvand, cada una de las cuales estaba equipada con un único lanzador de cinco rondas.
it_otomat_mk1=Otomat MK1,,ASM,OtomatMK1 es un misil antibuque de alcance medio desarrollado en cooperación entre Italia y Francia.

fr_am-39=AM39,Exocet,ASM,El AM39 Exocet es un misil antibuque francés de lanzamiento a distancia. Es una alternativa popular al Harpoon en toda la OTAN y en varios otros países. El AM39 es la variante lanzada desde el aire.
fr_mm-38=MM38,Exocet,ASM,El MM38 Exocet es un misil antibuque francés de lanzamiento a distancia. Es una alternativa popular al Harpoon en toda la OTAN y en varios otros países. El MM38 es la variante lanzada desde la superficie.

knm_penguin_mk2=AGM-119,Penguin Mk2,ASM,El AGM-119 Penguin es un pequeño misil antibuque lanzado desde el aire y desde la superficie desarrollado en colaboración entre EE. UU. y Noruega.

plan_sy-1=SY-1,Scrubbrush,ASM,El SY-1 es una versión china del misil soviético Styx fabricada bajo licencia.
plan_sy-1a=SY-1A,,ASM,El SY-1A es un desarrollo chino del misil Styx soviético.
plan_hy-1=HY-1,Safflower,ASM,El HY-1 es un desarrollo chino del misil soviético Styx.
plan_hy-1j=HY-1J,Safflower,ASM,El HY-1J es un desarrollo chino del misil soviético Styx.
plan_hy-1a=HY-1A,Safflower,ASM,El HY-1A es un desarrollo chino del misil soviético Styx. El HY-1A es una versión mejorada del HY-1J con un buscador mejorado y un perfil de vuelo más bajo, lo que dificulta su interceptación.
plan_hy-2=HY-2,Seersucker,ASM,El HY-2 es un desarrollo chino adicional del misil soviético Styx, con mayor alcance y ampliamente equivalente al P-20.
pla_yj-6=YJ-6,,ASM,
plan_yj-8=YJ-8,Sardine,ASM,El YJ-8 es un misil antibuque chino similar y aproximadamente equivalente al misil francés Exocet. Después del lanzamiento, el misil asciende a 20-30 metros y desciende para atacar a 5-7 metros en un perfil de vuelo rasante.

usn_agm-123=AGM-123,Skipper,ASM,El Skipper es un misil guiado antibuque estadounidense de corto a medio alcance, producido combinando una bomba guiada por láser Paveway II con un propulsor de cohete sólido. Esto se hizo para proporcionar a las tripulaciones aéreas una alternativa al Harpoon, que demostró ser problemático de usar en aguas muy congestionadas como el Golfo Pérsico, donde el riesgo de golpear a civiles es demasiado alto.
usn_agm-84a=AGM-84A,Harpoon,ASM,El Harpoon es un arma antibuque americana de lanzamiento desde distancia, ampliamente utilizada por la OTAN. El arma tiene un buscador de radar activo que se activa después de seguir una ruta preprogramada. La variante AGM-84 se lanza desde el aire.
usn_agm-84c=AGM-84C,Harpoon,ASM,El Harpoon es un arma antibuque americana de lanzamiento desde distancia, ampliamente utilizada por la OTAN. El arma tiene un buscador de radar activo que se activa después de seguir una ruta preprogramada. La variante AGM-84C se lanza desde el aire y no realiza una maniobra terminal pop-arriba.
usn_agm-84d=AGM-84D,Harpoon,ASM,El Harpoon es un arma antibuque americana de lanzamiento desde distancia, ampliamente utilizada por la OTAN. El arma tiene un buscador de radar activo que se activa después de seguir una ruta preprogramada. La variante AGM-84 se lanza desde el aire. El AGM-84D es una modificación más reciente, aparecida en 1985. Tiene capacidades ECCM mejoradas y mayor alcance debido a la mejora del combustible.
usn_rgm-84a=RGM-84A,Harpoon,ASM,El Harpoon es un arma antibuque americana de lanzamiento desde distancia, ampliamente utilizada por la OTAN. El arma tiene un buscador de radar activo que se activa después de seguir una ruta preprogramada. La variante RGM-84A se lanza desde superficie, con una maniobra terminal pop-arriba para evadir los sistemas de armas de corto alcance.
usn_rgm-84c=RGM-84C,Harpoon,ASM,El Harpoon es un arma antibuque americana de lanzamiento desde distancia, ampliamente utilizada por la OTAN. El arma tiene un buscador de radar activo que se activa después de seguir una ruta preprogramada. La variante RGM-84C se lanza desde superficie y no realiza una maniobra terminal pop-arriba.
usn_rgm-109b=RGM-109B,Tomahawk,ASM,El RGM-109B Tomahawk Anti-buque misil (TASM) es un arma antibuque americana de lanzamiento desde distancia. El arma tiene un buscador de radar activo que se activa después de seguir una ruta preprogramada, y es capaz de volar un patrón de búsqueda con maniobras engañosas.
usn_ugm-84a=UGM-84A,Harpoon,ASM,El Harpoon es un arma antibuque americana de lanzamiento desde distancia, ampliamente utilizada por la OTAN. El arma tiene un buscador de radar activo que se activa después de seguir una ruta preprogramada. La variante UGM-84A se lanza desde submarino, utilizando un contenedor desechable, y realiza una maniobra terminal pop-arriba.
usn_ugm-84b=UGM-84B,Harpoon,ASM,El Harpoon es un arma antibuque americana de lanzamiento desde distancia, ampliamente utilizada por la OTAN. El arma tiene un buscador de radar activo que se activa después de seguir una ruta preprogramada. La variante UGM-84B se lanza desde submarino, utilizando un contenedor desechable. A diferencia del UGM-84B anterior, no realiza una maniobra terminal pop-arriba.

wp_as-2=AS-2,Kipper,ASM,El AS-2 Kipper (K-10S) es un arma supersónica antibuque soviética lanzada desde el aire, diseñada para ser transportada por el Tu-16. Aproximadamente análogo a un SS-N-3 lanzado desde el aire, sufre muchos de los mismos inconvenientes contra incluso defensas aéreas moderadamente modernas.
wp_as-4=AS-4,Kitchen,ASM,El AS-4 Kitchen (Kh-22) es un arma supersónica antibuque soviética lanzada desde el aire, transportada por el Tu-22M o el Tu-95. Vuela a gran altitud y alta velocidad con una picada terminal supersónica, lo que dificulta mucho contrarrestarla.
wp_as-6=AS-6,Kingfish,ASM,El AS-6 Kingfish (Kh-26) es un arma supersónica de ataque y antibuque soviética lanzada desde el aire, diseñada para ser transportada por el Tu-16. Un primo más pequeño del AS-4, vuela a gran altitud y alta velocidad con una picada terminal supersónica, lo que dificulta mucho contrarrestarla.
wp_as-7=AS-7,Kerry,ASM,El AS-7 Kerry (Kh-23 Grom) es un arma supersónica de ataque soviética lanzada desde el aire. Se basa en un operador que guía manualmente el misil, similar al AGM-12 Bullpup estadounidense, y presenta muchos de los mismos inconvenientes.
wp_as-10=AS-10,Karen,ASM,El AS-10 Karen (Kh-25/Kh-25M) es un arma supersónica de ataque soviética lanzada desde el aire. Utiliza un buscador láser para la capacidad de dispara y olvida.
wp_as-13=AS-13,Kingbolt,ASM,El AS-13 Kingbolt (Kh-59 Ovod) es un arma subsónica de ataque soviética lanzada desde el aire. Vuela en la mitad del recorrido bajo guía inercial, utilizando coordenadas de objetivo preprogramadas, con una fase terminal de búsqueda de TV.
wp_as-14a=AS-14A,Kedge,ASM,El AS-14A Kedge (Kh-29L) es un misil aire-superficie supersónico soviético lanzado desde el aire, con una ojiva pesada y guía láser.
wp_as-14b=AS-14B,Kedge,ASM,El AS-14B Kedge (Kh-29T) es un misil aire-superficie supersónico soviético lanzado desde el aire, con una ojiva pesada y guía de TV para un mayor alcance, pero tiene un rendimiento degradado por la noche.

wp_ss-n-2=SS-N-2,Styx,ASM,El SS-N-2 Styx (P-15 Termit) es un arma antibuque soviética subsónica de lanzamiento desde superficie y largo alcance. El arma fue producida bajo licencia por China como el conocido CSS-C-2 Silkworm. También se puede utilizar para atacar instalaciones terrestres en la costa.
wp_ss-n-2c=SS-N-2C,Styx,ASM,El SS-N-2C Styx (P-15 Termit-M) es un arma antibuque soviética subsónica de lanzamiento desde superficie y largo alcance. Es una versión mejorada del P-15 original con mayor alcance y mejor ECCM. También se puede utilizar para atacar instalaciones terrestres en la costa.
wp_ss-n-3=SS-N-3,Shaddock,ASM,El SS-N-3 Shaddock (P-35) es un arma antibuque soviética subsónica de lanzamiento desde superficie y largo alcance. Si bien era temible en el momento de su introducción, el perfil de vuelo subsónico a gran altitud lo hace muy vulnerable a los misiles tierra-aire. Otro inconveniente es la necesidad de que la plataforma de lanzamiento se mantenga en contacto con el misil durante todo el vuelo, lo que significa que las plataformas sumergidas deben permanecer expuestas en la superficie durante un ataque, dejándolas vulnerables a contraataques.
wp_ss-n-3b=SS-N-3B,Sepal,ASM,El SS-N-3B Sepal (Progress) es un arma antibuque soviética subsónica de lanzamiento desde superficie y largo alcance. Es una versión mejorada del misil P-35 original con menor altitud de vuelo y mejor resistencia a las interferencias y al Chaff.
wp_ss-n-7=SS-N-7,Starbright,ASM,El SS-N-7 Starbright (P-70 Ametist) es un arma antibuque soviética transónica de lanzamiento desde submarino y largo alcance. Fue el primer sistema de misiles del mundo que se lanzó desde un submarino sumergido. Es un arma de alcance relativamente corto y fue reemplazada por el SS-N-9 Siren.
wp_ss-n-9=SS-N-9,Siren,ASM,El SS-N-9 Siren (P-120 Malakhit) es un arma antibuque soviética subsónica de lanzamiento desde superficie y largo alcance. Es más rápido y de mayor alcance que el Styx, y puede realizar maniobras evasivas en la fase terminal.
wp_ss-n-12=SS-N-12,Sandbox,ASM,El SS-N-12 Sandbox (P-500 Bazalt) es un arma antibuque supersónica soviética de lanzamiento desde superficie y largo alcance, diseñada para reemplazar al SS-N-3 Shaddock. En comparación con el Shaddock, es mucho más rápido e incorpora un enlace de datos entre misiles que permite que la mayoría de la salva permanezca a baja altura mientras que un solo misil vuela alto actuando como observador de objetivos. También lleva ECM defensivo para aumentar la capacidad de supervivencia contra las defensas antiaéreas.
wp_ss-n-19=SS-N-19,Shipwreck,ASM,El SS-N-19 Shipwreck (P-700 Granit) es un arma antibuque supersónica soviética de lanzamiento desde superficie y largo alcance. Vuela con un perfil HI-LO e incluye un enlace de datos avanzado entre misiles que permite que varios misiles en una salva distribuyan los objetivos entre ellos utilizando un solo misil como observador de gran altura. Es capaz de realizar maniobras evasivas en la fase terminal, lleva un inhibidor ECM y señuelos a bordo, y está blindado contra el fuego de CIWS y los fragmentos de misiles. Esta es un arma temible desde cualquier punto de vista.
wp_ss-n-22=SS-N-22,Sunburn,ASM,El SS-N-22 Sunburn (P-270 Moskit) es un arma antibuque supersónica soviética de lanzamiento desde superficie y largo alcance. Vuela con un perfil LO-LO con una fase terminal supersónica de vuelo rasante, durante la cual el misil realiza maniobras evasivas serpenteantes para aumentar la capacidad de supervivencia contra las defensas aéreas.

#-----------Misiles solo de ataque terrestre---------
wp_as-4b=AS-4B,Kitchen-B,Ataque Terrestre,El AS-4B Kitchen (Kh-22MP Storm) es un misil supersónico de ataque terrestre de largo alcance de fabricación soviética.

usn_rgm-109c=RGM-109C,Tomahawk,Ataque Terrestre,El Misil de Ataque Terrestre Tomahawk (TLAM) es un misil de ataque terrestre de largo alcance estadounidense. Estas armas vuelan una ruta preprogramada hacia un objetivo sin ninguna entrada de la plataforma de lanzamiento después del lanzamiento, utilizando la coincidencia de contorno del terreno mediante un radar de mapeo del terreno y mapas digitales a bordo.

usaf_agm-86c=AGM-86C,CALCM,Ataque Terrestre,El Misil de Crucero Convencional Lanzado desde el Aire (CALCM) es un misil de ataque terrestre de largo alcance lanzado desde el aire estadounidense y el arma principal de largo alcance del B-52. Estas armas vuelan una ruta preprogramada hacia un objetivo sin ninguna entrada de la plataforma de lanzamiento después del lanzamiento, utilizando la coincidencia de contorno del terreno mediante un radar de mapeo del terreno y mapas digitales a bordo.

usa_bgm-71a=BGM-71A,BGM-71A TOW,Ataque Terrestre,El BGM-71 TOW es un misil antitanque guiado por cable estadounidense. El arma se utiliza tanto desde helicópteros como desde vehículos blindados.

usn_agm-65b=AGM-65B,Maverick,Ataque Terrestre,El AGM-65B es un arma estadounidense de ataque de largo alcance aire-tierra guiada por TV. Un operador en el avión de lanzamiento mantiene el punto de mira en el objetivo deseado, el arma se fija en el objetivo y luego se guía de forma autónoma hacia él después del lanzamiento, de forma similar al AGM-62 Walleye.

wp_at-10=AT-10,Sabber,Ataque Terrestre,El AT-10 Sabber es un misil guiado antitanque soviético utilizado por el tanque T-55M. Aumenta la capacidad de supervivencia contra las defensas aéreas.

# ---------- Anti-sub  Missilies ----------
usn_rur-5=RUR-5,ASROC,ASW,El RUR-5 ASROC (por Anti-submarino Rocket) es un arma antisubmarina de lanzamiento. El misil ASROC se lanza desde la plataforma de disparo y despliega un torpedo ASW Mk 46 después de volar en una trayectoria balística.

wp_apr-2=APR-2,,ASW,El APR-2 es un torpedo antisubmarino soviético lanzado desde el aire, con un alcance de búsqueda de 0.75 millas náuticas y puede usarse a una profundidad de 600m.
wp_ss-n-14a=SS-N-14A,Silex,ASW,El SS-N-14 Silex (Metel) es un arma antisubmarina soviética de lanzamiento. Similar al Ikara australiano, estas armas llevan un torpedo debajo de una pequeña estructura de misil de crucero.
wp_ss-n-14b=SS-N-14B,Silex-B,ASW/ASuW,El SS-N-14 Silex-B (Rastrub) es un arma soviética de doble propósito, antisubmarina y antisuperficie. Similar al Ikara australiano, estas armas llevan un torpedo debajo de una pequeña estructura de misil de crucero.
wp_ss-n-16=SS-N-16,Stallion,ASW,El SS-N-16 Stallion (Vodopad) es un arma antisubmarina soviética de lanzamiento para submarinos. Vuela en una trayectoria balística para dejar caer un torpedo cerca del objetivo.

# ------------------ RBU ------------------
knm_terne_shell=Terne III Mortar,,Mortero ASW,Terne es un sistema de armas antisubmarinas noruego propulsado por cohetes desarrollado en la década de 1960.

plan_type62dc=FQF-1200,,Mortero ASW,El FQF-1200 es un lanzacohetes antisubmarino chino de 5 cañones.
plan_type75dc=FQF-2500,,Mortero ASW,El FQF-2500 es un lanzacohetes antisubmarino chino de 12 cañones.

rn_limbo_shell=LIMBO Mortar,,Mortero ASW,Limbo (o Anti submarino Mortar Mark 10) es un mortero antisubmarino británico de la década de 1950. Apuntado usando el sonar de a bordo, apunta a dejar caer tres bombas de profundidad en un triángulo alrededor del objetivo.
rn_squid_shell=SQUID Mortar,,Mortero ASW,Squid es un mortero antisubmarino británico de la Segunda Guerra Mundial. Apuntado usando el sonar de a bordo, apunta a dejar caer tres bombas de profundidad en un triángulo alrededor del objetivo.

swe_375mm_rocket=Bofors M/50,,Mortero ASW,Bofors M/50 es un lanzacohetes antisubmarino sueco de 375 mm.

wp_rgb-10=RBU-1000,,Mortero ASW,El RBU-1000 (o Smerch-3) es un lanzacohetes antisubmarino soviético de 300 mm. El RBU-1000 tiene un alcance de aproximadamente 1000 yardas.
wp_rgb-12=RBU-1200,,Mortero ASW,El RBU-1200 (o Smerch-3) es un lanzacohetes antisubmarino soviético de 251 mm. El RBU-1200 tiene un alcance de aproximadamente 1200 yardas.
wp_rgb-25=RBU-2500,,Mortero ASW,El RBU-2500 (o Smerch-1) es un lanzacohetes antisubmarino soviético de 213 mm. El RBU-2500 tiene un alcance de aproximadamente 2500 yardas.
wp_rgb-60=RBU-6000,,Mortero ASW,El RBU-6000 (o Smerch-2) es un lanzacohetes antisubmarino soviético de 213 mm. El RBU-6000 tiene un alcance de aproximadamente 6000 yardas.

# --------------- Torpedos ---------------
fr_e15=E15,,torpedo ASuW,El torpedo francés E15 es un inusual torpedo pesado antisubmarino de 55 cm con guía de sonar pasivo.
fr_l3=L3,,torpedo ASW,El torpedo francés L3 es un inusual torpedo antisubmarino de peso medio de 55 cm.

ger_dm1=DM1,,torpedo ASW,El primer torpedo guiado por cable de Alemania dedicado contra submarinos.
ger_dm2=DM2,,torpedo ASuW,torpedo guiado por cable de Alemania dedicado a objetivos de superficie.
ger_sst4=SST4,,torpedo ASuW,torpedo pesado ASuW guiado por cable de fabricación alemana. Producido para la exportación a otras armadas.

it_a-244s_air=A-244,,Torpedo ASW,Torpedo antisubmarino ligero italiano lanzado desde el aire. Cuenta con guía de sonar activo y pasivo.
jmsdf_type80=Type 80,,torpedo,torpedo Tipo 80. Fruto de los programas de investigación GRX-1 y GRX-2 de la década de 1970, e influenciado por el diseño Mark 37 de la USN, este torpedo ASW/ASuW guiado por cable mejora las características de propulsión, rendimiento y alcance con respecto al Mark 37.
jmsdf_type54=Type 54,,torpedo,torpedo Tipo 54 Modelo 3 Mod 1. Primer torpedo japonés diseñado después de la Segunda Guerra Mundial. Inicialmente, bastante infructuoso y propenso a fallos posteriores al lanzamiento, pasó por varios rediseños que terminaron en la variante Modelo 3 Mod 1 producida en masa.

knm_tp612=TP612,,torpedo ASuW,El TP612 sueco es un torpedo pesado guiado por cable sin buscador. El TP612 es un desarrollo del TP611 con ruido reducido y capacidad de lanzamiento swim-fuera.
knm_tp613=TP613,,torpedo ASuW,El TP613 sueco es un torpedo pesado guiado por cable con un buscador de sonar pasivo. El TP613 es un desarrollo del TP612 con la adición de un buscador de sonar pasivo.

plan_yu-1=Yu-1,,Torpedo ASuW,El Yu-1 (Pez Tipo-1) es el primer torpedo pesado chino producido en el país. Estos torpedos de recorrido recto son relativamente simples y, por lo tanto, fiables y eficaces.
plan_yu-3=Yu-3,,Torpedo ASW,El Yu-3 (Pez Tipo-3) es un torpedo pesado antisubmarino pasivo chino. Un torpedo lento, es el más adecuado para atacar submarinos diesel-eléctricos, ya que los objetivos más rápidos pueden superar al torpedo. El buscador tiene un alcance máximo de unos 1600 metros.
plan_yu-4=Yu-4A,,Torpedo ASuW,El Yu-4A (Pez Tipo-4) es un torpedo pesado antisubmarino pasivo chino. Un torpedo lento, probablemente sólo sea eficaz a distancias muy cortas.

rn_mark9_mod2=MkIX,,torpedo ASuW,El torpedo británico Mark IX** es un torpedo antisubmarino introducido durante la Segunda Guerra Mundial. Con un tiempo de funcionamiento más largo y una ojiva más potente, es la mejora final del diseño original Mark IX de la década de 1930.

usn_mk37=Mk-37 Mod 0,,torpedo ASW,El torpedo Mark 37 es el torpedo ligero ASW estándar de la USN utilizado en múltiples naciones. Introducido en 1959, se volvió demasiado lento y de bajo rendimiento para enfrentarse a los modernos submarinos soviéticos de alto rendimiento.
usn_mk37_mod1=Mk-37 Mod 1,,torpedo ASW,El torpedo Mark 37 es el torpedo ligero ASW estándar de la USN utilizado en múltiples naciones. Introducido en 1959, se volvió demasiado lento y de bajo rendimiento para enfrentarse a los modernos submarinos soviéticos de alto rendimiento. El Mod 1 añade guía por cable a costa de algo de velocidad.
usn_mk46_air=Mk-46,,torpedo ASW,El torpedo Mark 46 es el estándar de la OTAN para torpedos ligeros utilizados en múltiples naciones. Diseñado para atacar a los modernos submarinos soviéticos de alto rendimiento, esta variante se lanza desde el aire.
usn_mk46_ship=Mk-46,,torpedo ASW,El torpedo Mark 46 es el estándar de la OTAN para torpedos ligeros utilizados en múltiples naciones. Diseñado para atacar a los modernos submarinos soviéticos de alto rendimiento, esta variante se lanza desde buques.
usn_mk48=Mk-48,,torpedo,El Mark 48 es un torpedo pesado estadounidense. Estos torpedos son guiados por cable y capaces de ser reorientados desde la plataforma de lanzamiento.

wp_45-36nu=45-36NU,,torpedo ASuW,El 45-36NU es un torpedo obsoleto de 450 mm de diseño anterior a la Segunda Guerra Mundial y de recorrido recto, fuertemente influenciado por los diseños italianos 45-F y 53-F de principios de la década de 1930. Ligero y con un golpe más pequeño que sus contrapartes de 530 mm, se ha convertido en un arma bastante ineficaz en la década de 1950. Pero a veces tienes que conformarte con lo que tienes.
wp_53-38=53-38,,torpedo ASuW,El 53-38 es un torpedo pesado soviético de recorrido recto de la época de la Segunda Guerra Mundial. Estos torpedos son relativamente simples y, por lo tanto, fiables y eficaces. Los dos hundimientos más mortíferos de la historia (el transporte alemán Wilhelm Gustloff y el transporte de tropas Goya) fueron realizados por dos submarinos soviéticos que utilizaban 53-38.
wp_53-39=53-39,,torpedo ASuW,El 53-39 es un torpedo pesado soviético de recorrido recto de la época de la Segunda Guerra Mundial. Estos torpedos son relativamente simples y, por lo tanto, fiables y eficaces.
wp_53-56v=53-56,,torpedo ASuW,El 53-56V es un torpedo pesado soviético de recorrido recto. Estos torpedos son variantes actualizadas del 53-38.
wp_53-65K=53-65K,,torpedo WH,El 53-65 es un torpedo pesado soviético buscador de estela diseñado para destruir buques de superficie.
wp_65-76=65-76,,torpedo WH,El 65-76 es un torpedo soviético de 650 mm buscador de estela conocido como asesino de portaaviones. Fue desarrollado específicamente para su uso contra objetivos extremadamente grandes, como los superportaaviones. Su mayor diámetro de 650 mm significa que sólo algunos submarinos pueden transportarlo.
wp_at-1=AT-1,,torpedo ASW,El AT-1 es un torpedo antisubmarino eléctrico soviético lanzado desde el aire con guía acústica activa/pasiva transportado únicamente por helicópteros.
wp_at-2=AT-2,,torpedo ASW,El AT-2 es un torpedo antisubmarino pesado eléctrico soviético lanzado desde el aire con guía acústica activa/pasiva. El AT-2 es uno de los pocos torpedos pesados lanzados desde el aire, ya que la mayoría de los torpedos lanzados desde el aire son mucho más pequeños y sólo pesan una cuarta parte.
wp_set-40=SET-40,,torpedo ASW,El SET-40 es un torpedo antisubmarino eléctrico ligero soviético con guía de sonar activa/pasiva.
wp_set-65=SET-65,,torpedo ASW,El SET-65 es un torpedo antisubmarino eléctrico pesado soviético con guía de sonar activa.
wp_test-71=TEST-71,,torpedo ASW,El TEST-71 es un torpedo antisubmarino pesado soviético guiado por cable. Mejora el SET-65 con capacidades de búsqueda activa/pasiva más avanzadas.
wp_umgt-1=UMGT-1,,torpedo ASW,El UMGT-1 es un torpedo antisubmarino soviético lanzado desde el aire que también sirve como carga útil para los misiles ASW SS-N-14 y SS-N-16. Estos torpedos ligeros tienen menos pegada que los torpedos pesados soviéticos, pero siguen siendo extremadamente peligrosos.
wp_uset-80=USET-80,,torpedo,El USET-80 es un moderno torpedo soviético de doble propósito. Tiene un sistema de búsqueda activa/pasiva que lo convierte en un arma extremadamente peligrosa tanto para los submarinos como para los buques de superficie.

# ------------------ Bombas -----------------
fr_samp_t25=SAMP-25,,Bomba,La SAMP Tipo 25 es una bomba tonta francesa de 230 kg (500 lb). Es comparable a la Mk-82 estadounidense.
fr_samp_t21=SAMP-21,,Bomba,La SAMP Tipo 21 es una bomba tonta francesa de 400 kg (880 lb). Es comparable a la Mk-83 estadounidense.

pla_type-2=Tipo-100-2,,Bomba,La Tipo-100-2 es una bomba china de propósito general de 100 kg lanzada desde el aire. Comparable a la FAB-100 soviética.
pla_type-3-250=Type-250-3,,Bomba,La Type-250-3 es una bomba de propósito general de 250 kg lanzada desde el aire, de origen chino. Comparable a la FAB-250 soviética.
pla_type-3-500=Type-500-3,,Bomba,La Type-500-3 es una bomba de propósito general de 500 kg lanzada desde el aire, de origen chino. Comparable a la FAB-500 soviética.

raf_bl755=BL755,,Bomba de racimo,La BL755 contiene 147 submuniciones HEAT perforantes dispersadas sobre una amplia área. Fue ampliamente utilizada durante la guerra Irán-Irak por la IRIAF y en las Malvinas por la RAF.

usaf_gbu-2=GBU-2,Paveway I,Bomba guiada,La GBU-2 Paveway I es una bomba guiada por láser estadounidense de 2000 lb (907 kg). El arma se basa en la Mk 84 pero con la adición de un buscador láser montado en la nariz y aletas para la guía.
usaf_m117=M117,,Bomba,La M117 es una bomba de 750 lb (340 kg) de la época de la guerra de Corea utilizada extensivamente por la USAF durante la campaña de Vietnam. Fue reemplazada por los diversos modelos de la serie Mk 80.
usaf_cbu-24=CBU-24,,Bomba de racimo,La CBU-24 contiene 665 submuniciones de fragmentación dispersadas sobre una amplia área. Fue ampliamente utilizada como arma antipersonal por las unidades Wild Weasel que atacaban sitios SAM.

usn_gbu-10=GBU-10,Paveway II,Bomba guiada,La GBU-10 Paveway II es una bomba guiada por láser estadounidense de 2000 lb (907 kg). El arma se basa en la Mk 84 pero con la adición de un buscador láser montado en la nariz y aletas para la guía. El kit de guía de la GBU-10 es una mejora del antiguo Paveway I.
usn_gbu-12=GBU-12,Paveway II,Bomba guiada,La GBU-12 Paveway II es una bomba guiada por láser estadounidense de 500 lb (227 kg). El arma se basa en la Mk 82 pero con la adición de un buscador láser montado en la nariz y aletas para la guía.
usn_mk-82=Mk-82,,Bomba,La Mark 82 es una bomba tonta de propósito general de baja resistencia de 500 lb (227 kg).
usn_mk-83=Mk-83,,Bomba,La Mark 83 es una bomba tonta de propósito general de baja resistencia de 1000 lb (454 kg).
usn_mk-84=Mk-84,,Bomba,La Mark 84 es una bomba tonta de propósito general de baja resistencia de 2000 lb (900 kg).
usn_rockeye=CBU-100,Rockeye,Bomba de racimo,La CBU-100 Rockeye II es una bomba de racimo estadounidense de 500 lb (227 kg) que dispensa 247 submuniciones.
usn_walleye2=AGM-62,Walleye II,Bomba guiada,La AGM-62 Walleye es una bomba deslizante guiada por televisión que fue utilizada por las Fuerzas Armadas de los Estados Unidos desde la década de 1960 hasta la de 1990. La mayoría tenía una ojiva de alto explosivo de 250 lb (113 kg); algunas tenían una ojiva nuclear W72.

wp_fab-100=OFAB-100,,Bomba,La OFAB-100-120, de diseño soviético, es una bomba de propósito general lanzada desde el aire de 100 kg (220 lb) con una ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados.
wp_fab-250=FAB-250,,Bomba,La FAB-250, de diseño soviético, es una bomba de propósito general lanzada desde el aire de 250 kg (550 lb) con una ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados.
wp_fab-500=FAB-500,,Bomba,La FAB-500, de diseño soviético, es una bomba de propósito general lanzada desde el aire de 500 kg (1100 lb) con una ojiva de alto explosivo utilizada principalmente por la Unión Soviética y sus aliados.

wp_rbk-250=RBK-250,,Bomba de racimo,La RBK-250 es una bomba de racimo soviética de 250 kg (550 lb).
wp_rbk-500=RBK-500,,Bomba de racimo,La RBK-500 es una bomba de racimo soviética de 500 kg (1100 lb).

# ---------------- Sonoboyas ---------------
usn_ssq-53=AN/SSQ-53,DIFAR,Sonoboya pasiva,La SSQ-53 es una sonoboya de tipo Análisis y Registro de Frecuencia Direccional (DIFAR). Esto le da al operador de la sonoboya información de rumbo magnético, lo cual es una gran mejora con respecto a la CRT-1 omnidireccional anterior.
usn_ssq-62=AN/SSQ-62,DICASS,Sonoboya activa,La AN/SSQ-62 DICASS es una sonoboya activa utilizada para fijar un submarino sumergido que ha sido previamente localizado con las sonoboyas pasivas SSQ-53.
usn_ssq-101=AN/SSQ-101,,Sonoboya activa,El receptor activo desplegado por aire AN/SSQ-101 (ADAR) es una sonoboya diseñada como receptor para sistemas multiestáticos de aguas poco profundas. Cuando se despliega, utiliza una gran matriz de hidrófonos para determinar rumbos precisos.

wp_rgb-1=RGB-1,,Sonoboya pasiva,La RGB-1 es una sonoboya omnidireccional solo pasiva utilizada por la Unión Soviética.
wp_rgb-nm1=RGB-NM-1,,Sonoboya pasiva,La RGB-NM-1 es una sonoboya omnidireccional solo pasiva utilizada como parte del conjunto Baku por la Unión Soviética.
wp_rgb-3=RGB-3,,Sonoboya activa,La RGB-3 es una sonoboya solo activa utilizada por la Unión Soviética.

# ------------------ FFAR -----------------
usn_zuni=Zuni,,FFAR,El Zuni es un cohete de aeronave de aletas plegables (FFAR) de 5.0 pulgadas que es portado principalmente por aviones de ataque a tierra y helicópteros de ataque. El Zuni se puede utilizar para transportar varios tipos de ojivas similares a otros sistemas FFAR. Por lo general, se dispara desde la vaina de cohetes LAU-10 que contiene cuatro cohetes.
usn_hydra=Hydra 70,,FFAR,El Hydra 70 es un cohete de aeronave de aletas plegables (FFAR) de 2.75 pulgadas utilizado tanto por cazas como por helicópteros. El Hydra es capaz de equiparse con una variedad de ojivas y normalmente se transporta en vainas de hasta 19.

wp_s-5=S-5,,FFAR,El S-5 es un cohete de aeronave de aletas plegables (FFAR) soviético de 55 mm utilizado por cazabombarderos y helicópteros. El S-5 puede rastrear su herencia hasta el R4M alemán de finales de la era de la Segunda Guerra Mundial. El cohete normalmente se transporta en vainas de hasta 32.
wp_s-8=S-8,,FFAR,El S-8 es un cohete de aeronave de aletas plegables (FFAR) soviético de 80 mm utilizado por cazabombarderos y helicópteros. El S-8 tiene varias variantes diferentes, incluidas variantes especializadas de denegación de pistas. El cohete normalmente se transporta en vainas de hasta 20.
wp_s-24=S-25,,FFAR,El S-24 es un cohete de aeronave de aletas plegables (FFAR) soviético de 240 mm utilizado por cazabombarderos y helicópteros. A diferencia de la mayoría de los FFAR, se transporta individualmente.
wp_s-25=S-25,,FFAR,El S-25 es un cohete aéreo soviético de 266 mm con aletas plegables (FFAR) utilizado por cazabombarderos y helicópteros. El S-25, el mayor de los cohetes no guiados de la Unión Soviética, tiene una ojiva que contiene casi 60 kg de explosivos y se transporta individualmente.

# ------------------ MLRS -----------------
ir_107mm_rocket=Haseb-1,,MLRS,El cohete Haseb-1 es una versión iraní del cohete chino de 107 mm disparado por el Lanzacohetes Múltiple Tipo 63. En el servicio iraní, tanto el lanzador como el cohete se denominan Haseb.

usa_m26=M26,,MLRS,El M26 es un cohete no guiado de 227 mm utilizado por el Sistema de Lanzamiento Múltiple de Cohetes (MLRS) M270 del ejército estadounidense. La carga útil del cohete consta de hasta 800 submuniciones capaces de cubrir hasta 2000 metros cuadrados.

wp_grad=Grad,,MLRS,El cohete M-21OF es un arma soviética disparada desde el vehículo de lanzamiento BM-21. El sistema completo (el M-21) es más comúnmente conocido como el Sistema de Lanzamiento Múltiple de Cohetes "Grad".

