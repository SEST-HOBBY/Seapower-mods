# ----------------- Decoys ----------------
usn_an_slq_25_nixie_decoy=AN/SLQ-25,Nixie,Señuelo,El Nixie (formalmente el AN/SLQ-25) es un sistema de señuelo remolcado utilizado principalmente por los buques de superficie de la USN. El sistema genera señales diseñadas para atraer torpedos que se acercan y alejarlos de la plataforma anfitriona.

usn_moss=MOSS,MK-70,Señuelo,El Mk 70 MOSS (Simulador Móvil de Submarinos) es un señuelo de 10 pulgadas de diámetro utilizado para desviar el sonar enemigo del submarino lanzador. El MOSS es capaz de simular el ruido propio de un submarino, así como su sonar activo.

wp_mg-44=MG-44,Korund,Señuelo,El MG-44 Korund es un simulador hidroacústico autopropulsado de segunda generación para submarinos. Está diseñado para ser lanzado desde tubos especiales de 400 mm en submarinos soviéticos.

