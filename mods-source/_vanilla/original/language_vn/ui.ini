[LoadScreen]
WarningPSE=Một tỷ lệ rất nhỏ cá nhân có thể bị động kinh khi tiếp xúc với một số kiểu ánh sáng hoặc đèn nhấp nháy nhất định. Việc tiếp xúc với một số họa tiết hoặc hình nền nhất định trên màn hình máy tính hoặc khi chơi trò chơi điện tử có thể gây ra cơn động kinh ở những người này. Một số tình trạng nhất định có thể gây ra các triệu chứng động kinh chưa được phát hiện trước đó, ngay cả ở những người không có tiền sử động kinh hoặc động kinh trước đó.\r\n\r\nNếu bạn hoặc bất kỳ ai trong gia đình bạn mắc bệnh động kinh, hãy tham khảo ý kiến ​​bác sĩ trước khi chơi. Nếu bạn gặp bất kỳ triệu chứng nào sau đây khi chơi trò chơi điện tử hoặc máy tính -- chóng mặt, thay đổi thị lực, co giật mắt hoặc cơ, mất nhận thức, mất phương hướng, bất kỳ cử động không chủ ý hoặc co giật -- NGAY LẬP TỨC ngừng sử dụng và tham khảo ý kiến ​​bác sĩ trước khi tiếp tục chơi.
