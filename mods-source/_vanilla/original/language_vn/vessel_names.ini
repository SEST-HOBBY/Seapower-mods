DefaultDescription=Tàu Iowa là một lớp thiết giáp hạm của Hoa Kỳ. Chúng được thiết kế như những thiết giáp hạm "tốc độ cao", có khả năng dựa vào sự kết hợp cân bằng giữa tốc độ và hỏa lực, và có thể di chuyển với tốc độ tương đương với lực lượng tàu sân bay. Trong quá trình hiện đại hóa vào những năm 1980, các tàu Iowa được trang bị bốn hệ thống phòng thủ tầm gần Phalanx CIWS, cũng như các bệ phóng tên lửa Harpoon và Tomahawk.
