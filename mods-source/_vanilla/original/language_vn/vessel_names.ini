Default=Lớp California,California
DefaultDescription=Hai tàu tuần dương lớp California được đưa vào biên chế Hải quân Hoa Kỳ từ năm 1974 đến năm 1975, đóng vai trò là tàu hộ tống lý tưởng cho các lực lượng đặc nhiệm tàu ​​sân bay tốc độ cao với tầm hoạt động gần như không giới hạn. Được thiết kế từ đầu dựa trên năng lượng hạt nhân, những con tàu này được mô tả là những đơn vị tàu mặt nước chạy bằng năng lượng hạt nhân đầu tiên được dự định sản xuất hàng loạt (khác với các tàu Long Beach, Bainbridge và Truxtun trước đó, đều là những tàu riêng lẻ). Việc chế tạo tỏ ra rất tốn kém, và các đơn vị tiếp theo đã bị hủy bỏ để ưu tiên cho các tàu tuần dương lớp Virginia sau này. Trong biên chế, đây là những con tàu có khả năng trang bị bệ phóng tên lửa Mark 13 ở phía trước và phía sau cùng với pháo 5 inch, với bệ phóng ASROC và kho chứa đạn ở phía trước. Các đợt nâng cấp vào đầu những năm 1980 đã bổ sung hệ thống phòng thủ tầm gần Phalanx CIWS và cập nhật bộ thiết bị tác chiến điện tử lên AN/SLQ-32(V)3. Cả hai tàu đều được cho nghỉ hưu vào cuối những năm 1990, bất chấp các đợt nâng cấp tiếp nhiên liệu tốn kém được thực hiện chỉ vài năm trước đó.
Variant1=California CGN-36,California
Variant2=South Carolina CGN-37,South Carolina

