[usn_cvn_enterprise]
Type=CVN,Tàu sân bay
Default=Lớp Enterprise,Enterprise
DefaultDescription=Là tàu sân bay chạy bằng năng lượng hạt nhân đầu tiên trong Hải quân Hoa Kỳ, USS Enterprise ban đầu được lên kế hoạch là chiếc đầu tiên trong số sáu tàu, nhưng các tàu chị em của nó đã bị hủy bỏ do chi phí. Do đó, nó có một số tính năng độc đáo so với tất cả các tàu sân bay thời Chiến tranh Lạnh. Điều này bao gồm radar mảng pha SCANFAR, vốn hoạt động thất thường nhưng cực kỳ hiệu quả, có thể tăng cường đáng kể phạm vi quét của một nhóm tác chiến. Đồng thời, nó được trang bị một hệ thống tên lửa phòng thủ khiêm tốn vào cuối thời kỳ, bao gồm hai bệ phóng Mk.26 mang tên lửa Sparrow III. Về hầu hết các khía cạnh khác, chẳng hạn như khả năng và hoạt động của phi đội máy bay, nó về cơ bản giống với các siêu tàu sân bay khác như lớp Nimitz sau này.
