DefaultDescription=Năm 1971, Hoa Kỳ chuyển giao hai tàu hộ tống radar lớp Edsall cho Hải quân Nam Việt Nam (RVNN). Đây là những tàu chiến mặt nước lớn nhất do RVNN vận hành, phục vụ đến năm 1975 khi Nam Việt Nam sụp đổ. Trong số hai tàu đang hoạt động, Trần Khánh Dư (HQ-4) bị quân đội Bắc Việt bắt giữ tại Xưởng đóng tàu hải quân Sài Gòn, trong khi Trần Hưng Đạo (HQ-1) trốn thoát sang Philippines và được đưa vào phục vụ với tên gọi BRP Rajah Lakandula (PF-4). Lưu ý: những tàu này được thể hiện bằng phiên bản sửa đổi của tàu khu trục lớp Gearing trong Sea Power, với vũ khí tương đương với các tàu hộ vệ của Việt Nam thời bấy giờ.
