DefaultDescription=Tàu khu trục lớp Belknap, được thiết kế như một phiên bản cải tiến tương đối hạn chế của lớp Charles Adams để thực hiện nhiệm vụ hộ tống tốc độ cao. Sự khác biệt quan trọng nhất đến từ việc cải tiến bệ phóng Mk.10 của tàu Terrier để có thể bắn cả tên lửa ASROC, do đó loại bỏ nhu cầu về một bệ phóng riêng biệt, cũng như kéo dài thân tàu thêm 4,3 mét. Phần lớn không gian sau đó được dành để tạo ra một bãi đáp có thể vận hành trực thăng chống tàu ngầm không người lái DASH. Ngoài ra, các tàu còn được trang bị các cảm biến nâng cấp, chẳng hạn như radar SPG-55B và sonar AN/SQS-26. Mặc dù là những chiến hạm đa năng hiệu quả, chúng thường nên tập trung vào các mối đe dọa dưới mặt nước, nhờ khả năng sonar và chống tàu ngầm ấn tượng của mình.
