[usn_cg_belknap]
Type=CG,Tuần dương hạm tên lửa
Default=Lớp Belknap,Belknap
DefaultDescription=Trong vòng một thập kỷ sau khi đi vào hoạt động, lớp tàu Belknap đã trải qua một đợt hiện đại hóa lớn, thay thế một số lượng lớn hệ thống và cải tiến trang bị vũ khí. Hệ thống radar được nâng cấp lên AN/SPS-48 mạnh mẽ hơn nhiều, và tàu được trang bị hệ thống tác chiến điện tử AN/SLQ-32. Hệ thống phóng Mk 10 cũng được nâng cấp, cho phép phóng tên lửa Standard SM-2, và tàu được trang bị hệ thống phòng thủ tầm gần (CIWS) và tám ống phóng tên lửa Harpoon ở phía đuôi tàu, thay thế cho bệ súng 3 inch. Nhờ đó, tàu có khả năng tấn công toàn diện hiệu quả, cho phép các tàu lớp Belknap tiếp tục phục vụ đến những năm 1970 và 1980 như một sự bổ sung hiệu quả cho các tàu chiến mới hơn như tàu tuần dương lớp Ticonderoga.
