[wp_rkr_kirov]
Type=TARKR,Tuần dương hạm tên lửa
Default=Lớp Kirov,Kirov
DefaultDescription=Được Liên Xô gọi là Đại Bàng Biển (Đề án 1144), lớp tàu Kirov là những tàu tuần dương tên lửa dẫn đường chạy bằng năng lượng hạt nhân khổng lồ. Với kích thước tương tự như thiết giáp hạm thời Thế chiến II, chúng nằm trong số những tàu chiến mặt nước mạnh nhất từng được chế tạo, với hai chiếc được đóng từ năm 1980 và hai chiếc nữa đang được xây dựng. Kích thước lớn của chúng là cần thiết để chứa một lượng lớn tên lửa chống hạm cũng như hệ thống tên lửa phòng không khu vực với một số hệ thống phòng thủ tầm gần dự phòng.\n\nMặc dù được trang bị sonar tiên tiến và vũ khí chống tàu ngầm tầm xa, những tàu này thường hoạt động như soái hạm của các nhóm tác chiến mặt nước được bảo vệ bởi các tàu chống tàu ngầm chuyên dụng.
Variant1=Kirov RKR-181,Kirov

