DefaultDescription=QH-50 DASH (Trực thăng chống ngầm không người lái) được thiết kế để hoạt động như một vũ khí chống ngầm tầm xa cho các tàu quá nhỏ để chứa nhà chứa máy bay và trực thăng. Là một thành phần chính của chương trình FRAM, QH-50 được biên chế cho các tàu cũ hơn, như tàu khu trục lớp Gearing, và cũng được trang bị cho các tàu hộ tống đại dương sau chiến tranh. Trực thăng này có tỷ lệ hỏng hóc cao vì nó không đáng tin cậy trong phục vụ trên tàu, và đã bị loại biên vào năm 1973. JMSDF là nhà khai thác nước ngoài duy nhất của QH-50, họ đã thành công hơn trong các hoạt động nhờ bảo dưỡng thường xuyên, sau đó nghỉ hưu chúng vào năm 1977. QH-50C là biến thể sản xuất đầu tiên, được trang bị động cơ turboshaft 300 mã lực, với 373 chiếc được chế tạo.
