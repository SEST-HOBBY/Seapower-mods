LJP-341A=LJP-341A|H/LJP-341A(Tên báo cáo NATO: Round Ball) là radar điều khiển hỏa lực dành cho hệ thống pháo 37mm của Trung Quốc được sử dụng trên các tàu tên lửa lớp Hoàng Phong.
