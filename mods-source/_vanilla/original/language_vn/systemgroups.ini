AN/SLQ-17=Thiết bị Gây nhiễu Điện tử|AN/SLQ-17 là một Thiết bị Đối phó Điện tử được các tàu sân bay của Hải quân Hoa Kỳ sử dụng. Hệ thống này được sử dụng để gây nhầm lẫn cho radar của đối phương bằng cách tạo ra các mục tiêu sai.
