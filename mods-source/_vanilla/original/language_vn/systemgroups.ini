MK37_GFCS_MK28=Mark 37 GFCS (Radar Mark 28)|Hệ thống Kiểm soát Hỏa lực Pháo Mark 37 (GFCS) điều khiển pháo mục đích kép cỡ nòng 5"/38. Hệ thống điều khiển được trang bị đĩa nhỏ của radar đo cự ly Mark 28, một cải tiến tiết kiệm trọng lượng cho các tàu chiến cũ được tân trang lại, nơi những lo ngại về trọng lượng hàng đầu không cho phép lắp đặt Mark 12 và Mark 22 tiêu chuẩn thường được trang bị cho bộ điều khiển Mark 37.
MK37_GFCS=MK37 GFCS|Hệ thống Kiểm soát Hỏa lực Pháo Mark 37 (GFCS) điều khiển pháo mục đích kép cỡ nòng 5"/38. Hệ thống điều khiển được trang bị radar đo cự ly Mark 25, một sự kết hợp tiêu chuẩn cho tất cả các hệ thống Mark 37 được lắp đặt sau chiến tranh. Trong vỏ bọc này, Mark 37 GFCS vẫn được sử dụng cho đến đầu những năm 1990.
MK38_GFCS_MK3=Mark 38 GFCS (Radar Mark 3 "FC")|Hệ thống Kiểm soát Hỏa lực Pháo Mark 38 (GFCS) điều khiển các khẩu đội pháo chính cỡ nòng thiết giáp hạm, cung cấp khả năng kiểm soát hỏa lực có độ chính xác cao chống lại các mục tiêu trên biển và trên đát liền. Hệ thống này kết hợp một hệ thống điều khiển bọc thép đặt trên đỉnh cấu trúc thượng tầng tháp lớn của các thiết giáp hạm lớp North Carolina, South Dakota và Iowa. Nó cũng trang bị cho các tàu tuần dương lớn lớp Alaska. Hệ thống điều khiển này được trang bị radar đo cự ly Mark 3 "FC", một trong những bộ điều khiển hỏa lực đầu tiên của Mỹ. Tổ hợp điều khiển và radar này đã được sử dụng đáng kể vào năm 1942 và 1943, trước khi được thay thế bằng bộ Mark 8 và sau đó là Mark 13.
