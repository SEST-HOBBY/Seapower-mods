#---------------------------------------- Radar ----------------------------------------
#---------- Surface ships ----------
#---Air/Air&Surface---
LJQ-354=LJQ-354|H/LJQ-354 (Tên báo cáo NATO "Eye Shield") là radar tìm kiếm trên không hai chiều thế hệ đầu tiên được Hải quân Quân đội Giải phóng Nhân dân Trung Hoa sử dụng trên nhiều tàu chiến cỡ lớn. Vì H/LJQ-354 là radar 2D nên nó chỉ cung cấp dữ liệu về góc phương vị và phạm vi nghiêng. Cảm biến bổ sung phải được sử dụng để xác định chiều cao.
LJQ-517=LJQ-517|H/LJQ-517 (Tên báo cáo NATO: "Pea Sticks") là radar cảnh báo sớm tầm xa 2D băng tần VHF đời đầu.
LJQ-381=LJQ-381|H/LJQ-381 (Tên báo cáo NATO: "Rice Field") là radar điều hướng chiến đấu cơ và tìm kiếm trên không ba chiều được Hải quân Quân đội Giải phóng Nhân dân Trung Hoa sử dụng trên các tàu khu trục lớp Luda. Nó cung cấp phạm vi về góc phương vị và chiều cao, đồng thời có thể theo dõi bán tự động tới mười mục tiêu cùng lúc.
#---Surface only---
LJQ-752A=LJQ-752A|H/LJQ-752A là radar dẫn đường và tìm kiếm mặt nước đầu tiên của Trung Quốc.
LJP-352=Square Tie|H/LJP-352 (Tên báo cáo NATO: Square Tie) là radar tìm kiếm và nhắm mục tiêu mặt nước băng tần X tầm ngắn được lắp đặt trên các tàu chiến của Hải quân Quân đội Giải phóng Nhân dân Trung Hoa được trang bị tên lửa chống hạm dòng HY-1 và YJ-8.

