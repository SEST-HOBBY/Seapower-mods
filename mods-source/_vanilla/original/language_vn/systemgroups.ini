Top_Sail=Top Sail|MR-600 "Voskhod" (Tên báo cáo NATO: Top Sail) là radar tìm kiếm trên không tầm xa 3D hoạt động ở băng tần L. Có thể kết hợp với MR-500 (Big Net) và trong trường hợp này toàn bộ hệ thống được gọi là MR-800 "Flag".
Top_Steer=Top Steer|MR-710 "Fregat" (Tên báo cáo NATO: Top Steer) là radar tìm kiếm trên không và trên mặt đất 3D hoạt động ở băng tần S. Bao gồm hai bộ ăng-ten radar có khả năng xử lý tín hiệu tương tự chung. Được sử dụng trên nhiều tàu chiến Liên Xô được chế tạo vào cuối những năm 70 và 80 như các lớp Kiev, Kirov, Slava và Sovremenny.
Top_Pair=Top Pair|MR-800 "Flag" (Tên báo cáo NATO: Top Pair) là bộ radar kết hợp MR-600 "Voskhod" và MR-500 "Kliver" được lắp đặt trên các tàu chiến chủ lực của Liên Xô vào cuối những năm 70 và 80, như các tàu tuần dương lớp Kiev, Kirov và Slava.

