Pot_Head=Pot Head|"Reya" (Tên báo cáo NATO: Pot Head) là một radar nhỏ tìm kiếm mặt nước băng tần X dành cho tàu phóng lôi và tàu chống hạm nhỏ được phát triển vào đầu những năm 1960.
