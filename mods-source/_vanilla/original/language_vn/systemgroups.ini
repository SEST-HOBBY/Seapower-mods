GSh-6-30=Pháo 30mm|Pháo xoay GSH-6-30 30mm|GSH-6-30 là loại pháo ổ quay sáu nòng của Liên Xô gắn trên MiG-27 và được thiết kế cho vai trò tấn công mặt đất. Trên tàu, nó được sử dụng trên giá đỡ AK-630 CIWS.
NR-23=Pháo 23mm|Pháo tự động NR-23 23mm|NR-23 là loại pháo tự động một nòng, vận hành bằng độ giật của Liên Xô. Nó được sử dụng trên nhiều máy bay chiến đấu thời kỳ đầu của Liên Xô và làm vũ khí phòng thủ trên máy bay ném bom.
AM-23=Pháo 23mm|Pháo tự động AM-23 23mm|AM-23 là loại pháo tự động một nòng, vận hành bằng khí, sử dụng dây đạn của Liên Xô, chủ yếu được sử dụng trên máy bay ném bom và vận tải, nơi nó thay thế cho pháo tự động NR-23 bắn chậm hơn trước đó.
N-37=Pháo 37mm|Pháo tự động N-37 37mm|N-37 là loại pháo tự động hạng nặng một nòng của Liên Xô được sử dụng chủ yếu trên máy bay chiến đấu, trong đó một phát bắn duy nhất là đủ để bắn hạ máy bay ném bom.
NN-37=Pháo 37mm|Pháo tự động NN-37 37mm|NN-37 là phiên bản cải tiến của pháo tự động hạng nặng một nòng N-37 của Liên Xô, với tốc độ bắn tăng 50%.
