SJD-4=SJD-4|Đây là sonar nhắm mục tiêu tần số cao dành cho hệ thống pháo cối chống ngầm FQF-1200 của Trung Quốc, được nâng cấp với công nghệ từ DE-1164 của Ý.
SJD-5=SJD-5|Đây là sự phát triển tiếp theo của Trung Quốc cho sonar đèn rọi chỉ chỉ chủ động Tamir-11 của Liên Xô, thay thế công nghệ ống chân không bằng bóng bán dẫn để tăng thêm phạm vi hoạt động.
