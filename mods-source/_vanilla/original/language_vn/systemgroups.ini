SQS-56=SQS-56|AN/SQS-56 là sonar phát hiện tàu ngầm chủ động/thụ động với khả năng bị hạn chế nghiêm trọng. Nó là một hệ thống gắn trên thân tàu được thiết kế cho các tàu cỡ nhỏ/tàu hộ tống. Các tàu lớp Oliver Hazard Perry được trang bị sonar này dự kiến ​​sẽ sử dụng nó chủ yếu để phát hiện các tàu ngầm có mảng kéo (AN/SQR-18 và AN/SQR-19).

