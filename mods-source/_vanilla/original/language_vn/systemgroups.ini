#---Air/Air&Surface---
Slim_Net=Slim Net|"Fut-N" (Tên báo cáo NATO: Slim Net) là radar tìm kiếm trên không và trên mặt nước băng tần E có độ phân giải cao của hải quân, thay thế radar Hair Net trên các tàu tuần dương và tàu khu trục. Nó được đưa vào sử dụng năm 1957.
Top_Through=Top Trough|MR-510 "Kil'-U"(Tên báo cáo NATO: Top Trough) là radar tìm kiếm trên không tầm xa có độ phân giải cao. Phạm vi tối đa là hơn 300 km.
Head_Net_A=Head Net A|MR-310 "Angara" (Tên báo cáo NATO: Head Net A) là radar thu thập và giám sát trên không và trên mặt nước 2D băng tần L. Nó sử dụng hai ăng-ten gắn nối tiếp nhau để cải thiện tốc độ dữ liệu.
Head_Net_C=Head Net C|MR-310U "Angara-A" (Tên báo cáo NATO: Head Net C) là một biến thể quét bề mặt và không khí 3D băng tần L của Head Net A, có được bằng cách nghiêng một trong các ăng-ten để cung cấp khả năng tìm kiếm độ cao thô sơ.
Strut_Curve=Strut Curve|MR-302 "Rubka" (Tên báo cáo NATO: Strut Curve) là radar tìm kiếm trên không và mặt nước 2D băng tần S đầu thập niên 60. Được gắn chủ yếu trên các tàu khu trục nhỏ, tàu đổ bộ hạng trung, v.v.
Strut_Pair=Strut Pair|MR-320 "Topaz-2" (Tên báo cáo NATO: Strut Pair) là radar thu thập và tìm kiếm trên không băng tần S được đưa vào sử dụng của Liên Xô vào năm 1976. Tàu chính sử dụng hệ thống radar này là lớp Udaloy DDG.
