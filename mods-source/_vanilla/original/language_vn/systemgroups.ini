DSUV-2=DSUV-2|Đây là sonar quét thụ động tần số thấp được sử dụng trên các tàu ngầm lớp Daphné và Agosta.
DUUX-2A=DUUX-2A|Đây là mảng tam giác thụ động tần số trung bình đến cao được sử dụng để điều khiển hỏa lực thụ động trên các tàu ngầm lớp Type 209, Daphné và Agosta. Về cơ bản nó tương đương với PUFFS.
