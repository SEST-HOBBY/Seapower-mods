B-52D_OECM=Thiết bị Gây nhiễu Tấn công|Thiết bị Đối phó Điện tử B-52D Phase V có khả năng gây nhiễu tấn công toàn diện, với hai hệ thống gây nhiễu rào AN/ALT-16, hai bộ gây nhiễu băng tần cao AN/ALT-32H và một bộ gây nhiễu băng tần thấp AN/ALT-32L.
