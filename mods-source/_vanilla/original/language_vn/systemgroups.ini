SQS-35=SQS-35|AN/SQS-35 là sonar chủ động có độ sâu thay đổi, có thể được kéo bên dưới lớp nhiệt, cải thiện khả năng phát hiện các tàu ngầm lẽ ra đang ẩn náu trong vùng 'bóng tối'.
AN/SQR-18A=AN/SQR-18A|AN/SQR-18 là mảng kéo thụ động được sử dụng trên các khinh hạm lớp Knox, được kéo từ 'cá' SQS-35 VDS.
