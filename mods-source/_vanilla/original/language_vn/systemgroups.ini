#---Air/Air&Surface---
CXAM=CXAM|CXAM là nguyên mẫu của radar tìm kiếm tầm xa trên không của Hải quân Hoa Kỳ. Bộ này trang bị cho các tàu chiến lớn hơn ngay trước khi Thế chiến thứ hai bắt đầu. Đó là một tấm lớn có kích thước 18 x 16 feet với khả năng hướng lên, mặc dù tia của nó quá rộng nên không thể đo được độ cao. CXAM trực tiếp dẫn đến các radar tìm kiếm trên không thời chiến, hầu hết đều là những cải tiến tăng dần so với thiết kế cơ bản này.
CXAM-1=CXAM-1|CXAM-1 là một cải tiến so với CXAM, với tổng cộng 14 bộ được giao và lắp đặt trên các thiết giáp hạm, tàu tuần dương và tàu sân bay. Ăng-ten vẫn giữ nguyên hình dáng tấm nệm nhưng khả năng hướng lên đã bị loại bỏ. Độ chính xác đã được cải thiện lên 200 thước Anh và bộ này vẫn được sử dụng trên một số tàu cho đến năm 1943. Nó được thay thế trên các tàu chiến lớn bằng bộ SK hoặc SK-2.
SA=SA|Dòng SA nhằm mục đích tái tạo chức năng và hiệu suất của CXAM bằng ăng-ten nhỏ hơn để sử dụng trên tàu hộ tống và tàu hỗ trợ. Tương đối thành công, dòng SA đã trở thành bộ tìm kiếm trên không tiêu chuẩn cho các tàu khu trục hộ tống và tàu khu trục nhỏ, và một số cũng được trang bị cho các khu trục hạm và tàu tuần dương hạng nhẹ. Loại này cũng trang bị cho các tàu của lực lượng Pháp Tự do vốn được tái trang bị tại các xưởng đóng tàu của Mỹ vào cuối chiến tranh.
SC-1=SC-1|Giống như SA, SC là một nỗ lực nhằm mang lại hiệu suất của CXAM cho các tàu nhỏ hơn bằng cách sử dụng ăng-ten nhỏ hơn. Thật không may, ăng-ten nhỏ hơn dẫn đến phạm vi hiệu quả thấp hơn và lực lượng sử dụng không thích SC gốc. SC-1 sau đó được giới thiệu vào tháng 1 năm 1942 với công suất gấp đôi và tầm gấp đôi, và ngay sau đó tất cả các SC đều được chuyển đổi. Bộ này trang bị cho các tàu khu trục và tàu hỗ trợ ngay từ đầu cuộc chiến trước khi được thay thế bằng SC-2 khi bộ đó có sẵn.
SC-2=SC-2|SC-2 được cải tiến trên SC-1 bằng cách lắp ăng-ten to hơn rất nhiều. Bộ này kết hợp các thiết bị dự phòng cho hệ thống Nhận dạng Bạn-Thù BG và BL, đồng thời trở thành radar chính cho các tàu khu trục cho đến khi chiến tranh kết thúc. Các biến thể cải tiến đôi chút của SC-2 (SC-3, SC-4 và SC-5) vẫn được phục vụ trên các tàu khu trục cho đến năm 1963.
SK=SK|SK là bộ radar tìm kiếm trên không thời chiến tiêu chuẩn dành cho các tàu lớn. Về cơ bản là một bộ SC-2 có ăng-ten cỡ CXAM, nó là một hệ thống radar hai chiều chỉ cung cấp dữ liệu về góc phương vị và phạm vi nghiêng. Cần có thêm cảm biến để xác định độ cao.
SK-2=SK-2|Bộ radar này là một cải tiến so với SK, với ăng-ten đĩa dài 17 feet nhằm giảm búp sóng bên. Vào cuối cuộc chiến, cả SK và SK-2 đều bị chỉ trích vì không có khả năng phát hiện máy bay bay cao do độ nâng chùm tia thấp. 75 bộ đã được sản xuất, trang bị cho các tàu chiến lớn hơn khi chúng được đưa vào sử dụng hoặc đưa vào bãi để tái trang bị.
SM=SM|SM là radar đầu tiên của Hoa Kỳ được thiết kế để định hướng máy bay chiến đấu, kết hợp "chùm tia bút chì" quét hình nón để xác định độ cao của mục tiêu trên không, một khả năng không có ở các radar tìm kiếm trên không trước đó. SM rất nặng ở mức 18.000 lbs (4.000 lbs cho riêng mỗi ăng-ten) và chỉ có thể được gắn trên các tàu sân bay lớn. Sau này, SM-1 và SP được chế tạo cho các tàu nhỏ hơn.
SP=SP|SP là phiên bản kế thừa hạng nhẹ của radar dò độ cao SM. Bộ này có thể kết hợp hai ăng-ten khác nhau tùy thuộc vào con tàu gắn nó, với một ăng-ten nhỏ hơn dành cho tàu khu trục và tàu sân bay hạng nhẹ. Bộ này trang bị cho các tàu khu trục radar (DDR) lớp Gearing hoạt động ngoài khơi Okinawa. 300 bộ đã được chế tạo và vào cuối chiến tranh, người ta thường thấy các tàu chiến chủ lực lắp SP trên cột ăng-ten chính bổ sung cho SK hoặc SK-2 trên cột ăng-ten trước.
SR=SR|SR là bộ radar tìm kiếm trên không hoàn toàn mới đầu tiên kể từ CXAM, kết hợp nhiều tính năng mới đã được các bộ radar trước đây tiên phong. Ăng-ten có kích thước gần bằng SC-2 với công suất cao hơn gấp đôi và được trang bị cho các tàu khu trục cho đến cuối chiến tranh. Nó cũng trang bị cho các máy bay chiến đấu lớn hơn như một radar tìm kiếm trên không dự phòng và tiếp tục phục vụ cho đến năm 1961.
SR-2=SR-2|SR-2 là một radar tìm kiếm trên không 2D dài 50 cm ban đầu được thiết kế dành cho các tàu khu trục hộ tống, nhưng sau khi bắt đầu sản xuất, nó thành ra quá lớn. Các mẫu thí điểm đã được trang bị cho các tàu sân bay lớn thuộc lớp Midway cũng như một số tàu tuần dương hạng nhẹ và bốn tàu ngầm radar (SSR) đầu tiên. Bộ này đã được thay thế bằng AN/SPS-6 do hiệu suất kém.
SR-3=SR-3|SR-3 và SR-6 được thiết kế để thay thế cho SK và SC trong toàn bộ đội tàu, sử dụng băng tần L để có hiệu suất tốt hơn với độ mờ ít hơn. Cả hai bộ đều hoạt động kém trên thực tế do ăng-ten được chọn, được mô tả là "không đủ ăng-ten" trong một báo cáo thời hậu chiến. SR-6 là phiên bản nhẹ hơn của SR-3, có ăng-ten nhỏ hơn.
SR-6=SR-6|SR-3 và SR-6 được thiết kế để thay thế cho SK và SC trong toàn bộ đội tàu, sử dụng băng tần L để có hiệu suất tốt hơn với độ mờ ít hơn. Cả hai bộ đều hoạt động kém trên thực tế do ăng-ten được chọn, được mô tả là "không đủ ăng-ten" trong một báo cáo thời hậu chiến. SR-6 là phiên bản nhẹ hơn của SR-3, có ăng-ten nhỏ hơn.
SPS-6=SPS-6|AN/SPS-6 là radar hai chiều được Hải quân Hoa Kỳ sử dụng làm radar tìm kiếm trên không thế hệ đầu tiên sau Thế chiến thứ hai và được xuất khẩu rộng rãi cho các nước đồng minh. Vì AN/SPS-6 là radar 2D nên nó chỉ cung cấp dữ liệu về góc phương vị và phạm vi nghiêng. Cảm biến bổ sung phải được sử dụng để xác định chiều cao.
SPS-12=SPS-12|Được đưa vào sử dụng từ những năm 1950 đến những năm 1980, AN/SPS-12 là radar giám sát mặt nước và trên không hai chiều tầm trung.
SPS-29=SPS-29|AN/SPS-29 là radar hai chiều được Hải quân Hoa Kỳ sử dụng làm radar cảnh báo sớm sau Thế chiến thứ hai và được trang bị trên các tàu hải quân trong Chiến tranh Lạnh. Là một radar 2D, nó chỉ cung cấp dữ liệu về góc phương vị và phạm vi nghiêng. Cảm biến bổ sung phải được sử dụng để xác định chiều cao.
SPS-30=SPS-30|Phiên bản hiện đại hóa của AN/SPS-8 kết hợp với bộ phát sóng mạnh hơn AN/SPS-30 là hệ thống radar tìm kiếm độ cao và tìm kiếm băng tần S tích hợp trên tàu được sử dụng để phát hiện và giám sát máy bay.
UPA-43=UPA-43|AN/UPA-43 là thiết bị thẩm vấn Nhận dạng Bạn-Thù (IFF) được Hải quân Hoa Kỳ sử dụng. Các radar sau này như AN/SPS-48 có bộ dò tìm IFF tích hợp giúp loại bỏ nhu cầu về ăng-ten riêng.
SPS-32=SPS-32|Một phần của hệ thống SCANFAR nổi tiếng được sử dụng bởi USS Enterprise và USS Long Beach, AN/SPS-32 là bộ phận định hướng ngang của hệ thống ăng-ten và được sử dụng chủ yếu để giám sát trên không.
SPS-33=SPS-33|Là một phần của hệ thống SCANFAR nổi tiếng được USS Enterprise và USS Long Beach sử dụng, AN/SPS-33 là bộ phận định hướng thẳng của hệ thống ăng-ten và được sử dụng chủ yếu để theo dõi mục tiêu.
SPS-37=SPS-37|AN/SPS-37 là radar hai chiều được Hải quân Hoa Kỳ sử dụng làm radar cảnh báo sớm trong thời kỳ đầu Chiến tranh Lạnh và là bản phát triển cải tiến từ AN/SPS-29. Là một radar 2D, nó chỉ cung cấp dữ liệu về góc phương vị và phạm vi nghiêng. Cảm biến bổ sung phải được sử dụng để xác định chiều cao.
SPS-39=SPS-39|AN/SPS-39 là radar tìm kiếm trên không tầm xa 3D được sử dụng để cung cấp hướng, khoảng cách và độ cao. Giống như SPS-48 lớn hơn, nó được quay cơ học theo góc phương vị nhưng được quét điện tử về góc nâng. Radar 3D đóng vai trò trung gian giữa radar cảnh báo sớm 2D và radar điều khiển hỏa lực được sử dụng để tấn công mục tiêu.
SPS-40=SPS-40|AN/SPS-40 là radar tìm kiếm trên không 2D tầm xa phổ biến trên nhiều tàu của Hoa Kỳ. Là một radar 2D, nó chỉ cung cấp dữ liệu về góc phương vị và phạm vi nghiêng. Cảm biến bổ sung phải được sử dụng để xác định chiều cao.
SPS-43=SPS-43|AN/SPS-43 là hệ thống radar tìm kiếm trên không tầm rất xa được sử dụng chủ yếu trên các tàu sân bay và tàu tuần dương mang tên lửa dẫn đường của Mỹ. Hoạt động ở băng tần VHF, AN/SPS-43 cũng sử dụng tính năng nhảy tần để chống lại các nỗ lực gây nhiễu. Là một radar 2D, nó chỉ cung cấp dữ liệu về góc phương vị và phạm vi nghiêng.
SPS-48=SPS-48|AN/SPS-48 là radar tìm kiếm trên không, 3D, tầm xa. Phương vị mục tiêu được phát hiện thông qua quét cơ học bằng cách xoay toàn bộ ăng-ten trên đế của nó, trong khi Độ cao được xác định thông qua quét điện tử. Radar 3D đóng vai trò trung gian giữa radar cảnh báo sớm 2D và radar điều khiển hỏa lực được sử dụng để tấn công mục tiêu.
SPS-49=SPS-49|AN/SPS-49 là radar tìm kiếm trên không 2D tầm xa và là phiên bản kế thừa của SPS-40. Nó là radar tìm kiếm trên không chính cho nhiều tàu của Mỹ và đồng minh. Trên các tàu cũ hơn, nó thay thế SPS-40 trong chương trình nâng cấp NTU.
SPS-52=SPS-52|AN/SPS-52 là radar tìm kiếm trên không tầm xa 3D được sử dụng để cung cấp hướng, khoảng cách và độ cao. Giống như SPS-48 lớn hơn, nó được quay cơ học theo góc phương vị nhưng được quét điện tử ở góc nâng. Radar 3D đóng vai trò trung gian giữa radar cảnh báo sớm 2D và radar điều khiển hỏa lực được sử dụng để tấn công mục tiêu.
SPN-43=SPN-43|AN/SPN-43 là radar 2D Kiểm soát Không lưu được sử dụng trên tàu sân bay và các tàu có khả năng phóng máy bay khác để cung cấp nhận dạng và điều phối máy bay trong phạm vi 50 dặm tính từ tàu.
SPY-1A=SPY-1A|AN/SPY-1 là radar quét mảng pha thụ động 3D tầm xa và là thành phần chính của hệ thống chiến đấu AEGIS. Bốn ăng-ten được phân tán, điều khiển bằng máy tính được sử dụng để cung cấp phạm vi phủ sóng liên tục 360 độ cho vùng trời xung quanh tàu. 
