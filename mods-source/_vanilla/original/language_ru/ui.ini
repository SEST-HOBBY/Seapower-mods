[Privacy]
Header=Защита личных данных
Notice=Sea Power – игра, находящаяся в процессе разработки и в ней могут встречаться ошибки и недоработки.\r\n\r\nМы будем очень благодарны Вам, если Вы дадите разрешение на отправку нам аналитических данных, относящихся к сбоям или ошибкам в игре с помощью встроенной в игру системы автоматической отправки отчетов об ошибках, чтобы помочь нам улучшить нашу игру. Вы можете отказаться от отправки этих данных и мы больше не будем показывать Вам данный запрос.\r\n\r\nЧтобы ознакомиться с полной версией наших политик по отношению к личным данным, перейдите по ссылке ниже.
AllowAnalytics=Разрешить отправлять аналитику
RefuseAnalytics=Запретить отправку аналитики

[LoadScreen]
WarningPSE=У очень маленького процента людей во время просмотра определенных изображений, в частности, мигающего света или узоров, которые могут присутствовать в видеоиграх, могут возникать приступы. Даже люди, ранее не испытывавшие припадков или приступов эпилепсии, могут иметь еще не выявленную болезнь. У них могут возникать эпилептические припадки, вызываемые световыми эффектами во время сеанса видеоигры.\r\n\r\nЕсли у вас или у кого-либо из членов вашей семьи есть эпилептическое заболевание, проконсультируйтесь с врачом перед игрой.\r\n\r\nНЕМЕДЛЕННО ПРЕКРАТИТЕ ИСПОЛЬЗОВАНИЕ и обратитесь к врачу, если вы испытываете любые следующие проблемы со здоровьем или симптомы под воздействием вспышек или мерцания света, а также другой световой стимуляции при игре в видеоигры или просмотре видео: боль в глазах,ухудшение зрения,мигрень,мышечные судороги,конвульсии или другие непроизвольные движения,потемнение в глазах,потеря сознания,спутанность или потеря ориентации в пространстве,головная боль,головокружение,тошнота,усталость,симптомы как при укачивании,дискомфорт или боль в любых частях тела — глазах, ушах, руках, ногах и т. д. во время игры.
WarningValidity=Содержимое файлов игры не соответствует ожидаемому хешу. Закройте игру, удалите содержимое /StreamingAssets/original и проверьте целостность через Steam.\r\n\r\nНажатие кнопки «Удалить папку» автоматически удалит папку, заставив Steam повторно загрузить ее при следующем запуске.
CloseGame=Закрыть игру
DeleteOriginal=Удалить папку
WarningMods=Следующие включенные моды не заявлены их авторами как совместимые с этой версией Sea Power. Хотите ли вы отключить их?\n\n(Примечание: Это не означает что данные моды не совместимы, но их работоспособность не гарантируется.)
DisableMods=Отключить несовместимые моды.
WarningSkippedUpdates=Обновления для следующих модов не были скачаны потому, что их новая версия в Workshop помечена как несовместимая с текущей версией Sea Power. Эти моды оставлены без изменений.
