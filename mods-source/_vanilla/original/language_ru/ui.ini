Doctrine=Поменять стандартные процедуры
DoctrineTransitTelegraph=Устанавливает значение скорости, используемое по умолчанию для данного типа платформы, в режим «транзит».
DoctrineLoiterTelegraph=Устанавливает значение скорости, используемое по умолчанию для данного типа платформы, в режим «ожидание/барражирование».
DoctrineAllowAlignment=При активации этой функции юнитам будет разрешено менять курс, чтобы навести оружие на цель.
DoctrineAircraftWinchesterRtb=При включении этой функции самолеты игрока возвращаются на базу, как только у них заканчивается боезапас.
DoctrineInterceptorAllAamRtb=При активации этой функции истребители остаются на позиции до полного расхода всех ракет класса «воздух-воздух», включая ракеты ближнего радиуса действия.
DoctrineFighterAllAamAndGunRtb=При активации этой функции истребители остаются на позиции до полного расхода ракет класса «воздух-воздух» и боекомплекта пушки.
DoctrineFighterRtbCondition=Выберите, когда самолеты будут считать, что у них закончился боезапас: после израсходования всех ракет «воздух-воздух» или только после того, как закончатся и ракеты, и боеприпасы для пушки.
DoctrineHelicopterSonobuoyDeployState=Устанавливает глубину поиска по умолчанию для гидроакустических буев, сбрасываемых с вертолетов игрока. В режиме чередования сброс производится поочередно выше и ниже границы слоя.
DoctrineAASalvoSize=Определяет, сколько ракет «земля-воздух» корабли игрока выпускают по каждой приближающейся воздушной цели во время автоматического ведения зенитного огня.
DoctrineShipsOnWeaponsTightEngageHostileAircraft=При активации этого режима корабли игрока, находящиеся в состоянии «Самооборона» (огонь только по подтвержденной цели), могут автоматически атаковать обнаруженную вражескую авиацию. Внимание: атака может привести к включению корабельных радаров.
DoctrineShipsAutoUseSAMsAgainstSurfaceTargets=При включении этой функции корабли игрока могут автоматически использовать зенитные ракеты с режимом «поверхность — поверхность» против надводных целей.
DoctrineShipsAutoUseAntiShipMissilesAgainstSurfaceTargets=При отключении этой функции корабли игроков в режиме «Огонь по готовности» не будут стрелять противокорабельными ракетами по надводным целям. Орудия, торпеды, ПЛУР и ЗРК, способные стрелять по надводными целями, могут вести огонь свободно. Ручные приказы на атаку и уже произведенные залпы не затрагиваются данной настройкой.
DoctrineBombAttackProfile=Выберите способ, которым самолёты игрока производят бомбовые атаки. В автоматическом режиме тип атаки определяется на основе имеющейся загрузки и высоты. В режиме «Горка» самолёты набирают высоту перед сбросом, в режиме «Горизонтальный» самолёт сбрасывает бомбы с горизонтального полёта, в режиме «С пикирования» самолёт производит сброс, пикируя на цель.
DoctrineFightersDoNotEngageAntiShipMissiles=При включении этой функции истребители игрока не будут автоматически атаковать обнаруженные противокорабельные ракеты.
DoctrineAutoAttackSurface=При включении этой функции юниты игрока, находящиеся в режиме «Огонь по готовности», могут автоматически атаковать обнаруженные вражеские надводные цели.
DoctrineCollisionAvoidance=При включении этой функции корабли и подводные лодки выполняют автоматические маневры для предотвращения столкновений с другими кораблями, находящимися поблизости.
DoctrineDropTanks=При включении этой функции самолеты игрока автоматически сбрасывают подвесные топливные баки при вступлении в бой.
DoctrineFormationSprintAndDrift=Применяет режим движения «рывок и дрейф» ко всем кораблям и подводным лодкам в выбранной группе, которые могут использовать эту тактику.
DoctrineUnitSprintAndDrift=Заставляет выбранный корабль или подводную лодку чередовать участки быстрого хода и медленного дрейфа при следовании по заданным маршрутным точкам.
DoctrineFormationBafflesClearing=Позволяет подводным лодкам в выбранной группе периодически разворачиваться и прослушивать обстановку для устранения «мертвых зон» гидролокатора во время движения к назначенным маршрутным точкам.
DoctrineUnitBafflesClearing=Позволяет выбранной подводной лодке периодически разворачиваться и прослушивать обстановку для устранения «мертвых зон» гидролокатора во время движения к назначенным маршрутным точкам.
DoctrineRemoveEngageTaskAfter=Удаляет из списка приказов не принятый юнитом к исполнению приказ на атаку через заданное число секунд.
DoctrineBombersStaysWithAAM=При включении этой функции бомбардировщики, оснащенные ракетами «воздух-воздух», остаются на позиции до тех пор, пока не израсходуют эти ракеты.
DoctrineASWBombersStaysWithSonobuoys=Если включено, то противолодочные самолеты и вертолёты, несущие гидроакустические буи, остаются в районе патрулирования до тех пор, пока эти буи не будут израсходованы.
DoctrineFighterBombersStaysWithAAM=Если включено, то истребители-бомбардировщики, оснащенные ракетами «воздух-воздух», остаются на позиции до тех пор, пока не израсходуют эти ракеты.
DoctrineSRFightersStaysWithGuns=Если включено, то истребители малого радиуса действия и истребители-бомбардировщики остаются на позиции до тех пор, пока не израсходуют боезапас к пушкам.
DoctrineOverride=Если включено, то унаследованное значение процедур на данном уровне будет переопределено.
