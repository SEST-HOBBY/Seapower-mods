ConditionDateTooltip=Укажите дату для условия типа «Время»
ConditionTimeTooltip=Укажите время для условия типа «Время». Внимание! В данном случае всегда указывается стандартное гринвическое время (UTC) и изменение времени старта миссии на вкладке «Сценарий» не приведёт к автоматическому обновлению этого поля!
ConditionSecondsTooltip=Укажите время в секундах со старта миссии для срабатывания условия типа «Время». Обратите внимание - это поле автоматически заполняется при выборе даты/времени выше
