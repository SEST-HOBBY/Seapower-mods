ConditionTypeTooltipNoIncomingWeapons=Условие срабатывает, если для выбранной в данном условии Стороны не замечено приближающегося к юнитам этой стороны оружия. Экспериментальная функция!
ConditionTypeTooltipUnitDestroyed=Условие срабатывает, когда указанные для данного условия юниты в списке уничтожены
ConditionTypeTooltipUnitsInTheArea=Условие срабатывает, когда указанные для данного условия юниты в списке вошли в область условия, заданную на карте
ConditionTypeTooltipHasNoUnitsOfType=Условие срабатывает, когда выбранная для данного условия Сторона больше не имеет юнитов указанного типа
ConditionTypeTooltipUnitDetected=Условие срабатывает, когда указанные для данного условия юниты в списке обнаружены Стороной, указанной в условии. Учитывается обнаружение с помощью радара, сонара, средствами РТР, или визуальное
ConditionTypeTooltipUnitClassified=Условие срабатывает, когда указанные для данного условия юниты в списке классифицированы Стороной, указанной в условии. Под «классификацией» имеется в виду, что юнит обнаружен и его принадлежность той или иной стороне известна, но конкретный тип юнита при этом еще не определён
ConditionTypeTooltipUnitsAreOutOfAmmo=Условие срабатывает, когда указанные для данного условия юниты в списке израсходовали весь боезапас. Экспериментальная функция! Чтобы условие сработало, необходимо, чтобы юнит полностью исчерпал боеприпасы всех типов, имеющихся на борту. Для указания конкретных типов боеприпасов требуется редактирование INI-файла миссии вручную
ConditionTypeTooltipUnitHasNoGuidanceSystems=Условие срабатывает, когда у всех указанных для данного условия юнитов в списке уничтожены все радары управления огнём. Предназначено для использования с позициями ЗРК
