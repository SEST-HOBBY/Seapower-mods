[LoadoutNames]
#------------------------------------------ New system ------------------------------------------
# - LongRange means operating range of aircraft, not the weapons range
# ---------- Mandatory loadouts ----------
Default=По умолчанию                       // Usually most common loadout for this plane
Ferry=Перегон                              // Maximum fueltanks, no weapons, except guns and chaff
Empty=Пустой                               // No fueltanks, no weapons, except guns and chaff

# ---------- Anti Air loadouts ----------
AirToAir=ПВО                               // Standard Air to Air loadout for the type
AirToAirLongRange=Дальнее ПВО              // Air to Air with less weapons and more fuel
AirToAirIntercept=Перехват                 // Air to Air loadouts with emphasis on MRAAM/SRAAM

# ---------- Anti Surface loadouts ----------
Strike=Бомбы                               // Dumb bombs in 1 salvo
StrikeLongRange=Бомбы больш. дальность     // Same as Strike but less weapons, more fuel
StrikePrecision=Управляемые бомбы/ракеты   // Guided bombs or Strike missiles (like AS-7)
StrikeHeavy=Бомбы тяж.                     // Strike loadout for heavy bombers. (To mark it for AI usage)
StrikeDemo=Бомбы сверх тяж.                // Specialized loadout for super-heavy bombs (>1300kg) meant to obliterate point targets such as bunkers, bridges, and other hard targets
StrikeLowAlt=Бомбы низковысотн.            // Low-level strike meant for retarded bombs, such as Snakeye or parachute bombs

CAS=Штурмовка                              // Rockets, Cluster bombs, Bombs. Usually in small salvos to increace number of attacks
CASLight=Штурмовка больш. дальность        // Like CAS, but focusing on endurance over payload
AntiArmor=Противотанковое вооружение       // Strike missiles mostly useful only land vehicles(like AS-7)

LandAttack=Крылатые ракеты                 // Long-range air to surface (land attack) cruise missile loadout, e.g. AGM-86C or RGM-109C land attack missiles

# ---------- Anti Ship loadouts ----------
AntiShip=Противокорабельное                // Most vague loadout. Can include anything from dumb bombs to medium-range missilies
AntiShipLongRange=Противокораб. дальняя    // Same as AntiShip, but with fueltanks
AntiShipPrecision=Противокораб. упр. вооруж.      // Another vague loadout. Can include guided bombs and missilies
AntiShipHeavy=Противокораб. тяж. вооружение // Designed to mark heavy anti-ship bombers like Tu-22 and Tu-16 and small planes with most weapons

# ---------- Anti Sub loadouts ----------
ASW=ПЛО                                    // Multirole ASW: Torpedoes, Depth Charges, Sonobuoys
ASWHunter=ПЛО поисковое                    // Sonobuoys only, no weapons
ASWHunterLight=ПЛО поисковое (малое)       // Sonobuoys only, no weapons
ASWKiller=ПЛО атака                        // ASW weapons only
ASWBomb=ПЛО бомбы                          // ASW depth charges
ASWLongRange=Дальнее ПЛО                   // Torpedo + fuel tank

# ---------- Special loadouts ----------
SEAD=Подавление ПВО                        // Anti-radiation missilies, Cluster bombs
SEADLongRange=Подавление ПВО дальнее       // Same as SEAD, but less weaons and more fueltanks
SEADAdvanced=Подавление ПВО, продвинутые ПРР  // SEAD, but using accountable, limited-supply or time-restricted ammo like HARM, STARM or AS-11

AEW=ДРЛО                                   // Just a flavor naming to indicate plane purpose. This loadout supposed to be equal to "Empty"
Recon=Разведка                             // Also indicates plane purpose. In some cases used for carrying recon pods.
EW=РЭБ                                     // Also indicates plane purpose. In some cases used for carrying EW pods.
Transport=Транспорт                        // Also indicates purpose.

Tanker=Tanker                              // Tanker loadout. allows refueling

Gun=Только пушка                           // Only Gun ammo loaded

# ---------- Cargo loadouts ----------
Containers=Контейнеры
Munitions=Боеприпасы
MilitaryVehicles=Военная техника
DryCargo=Сухие грузы
Vehicles=Машины
Fertilizer=Удобрения
Lighters=Баржи
Oil=Нефть
Ore=Руда
Passengers=Пассажиры
Troops=Войска

