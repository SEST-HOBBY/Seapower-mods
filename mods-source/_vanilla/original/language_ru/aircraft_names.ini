[raf_sc-7]
Type=Транспорт
Default=SC.7 Скайвэн,Скайвэн
DefaultDescription=SC.7 Скайвэн — британский двухдвигательный турбовинтовой цельнометаллический легкий транспортный самолет, разработанный компанией Шортс в 1960-х годах. Благодаря своей характерной коробчатой форме фюзеляжа с большой задней рампой он идеально подходит для перевозки негабаритных грузов, десантирования и выполнения поисково-спасательных операций, обладая при этом возможностью взлета и посадки с коротких импровизированных полос.
Squadron1=SC.7 Скайвэн PNA,SC.7 Скайвэн PNA
Squadron1Description=Пять самолетов Шорт SC.7 Скайвэн поступили на службу в аргентинскую PNA (Prefectura Naval Argentina — Морская префектура Аргентины / Береговая охрана) в 1971 году для транспортных нужд, морского патрулирования, а также поисково-спасательных задач. Его авиационный департамент (Departamento de Aviación) развернул эти самолеты на островах и в южной части материка во время Южноатлантического конфликта 1982 года для поддержки прибрежной разведки и логистики.
Squadron2=SC.7 Скайвэн PNA,SC.7 Скайвэн PNA
