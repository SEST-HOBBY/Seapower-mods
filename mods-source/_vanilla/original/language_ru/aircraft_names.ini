[ara_dagger]
Type=Истребитель
Default=Даггер,Даггер
DefaultDescription=Даггер — аргентинский вариант израильского ударного истребителя Нешер, который, в свою очередь, является развитием французского Мираж 5. Даггер A представляет собой одноместную версию, способную применять управляемые ракеты «воздух-воздух» малой дальности наряду с неуправляемыми бомбами и ракетами, хотя на службе эти самолеты чаще всего использовались в роли морских штурмовиков.
Squadron1=Dagger A G6C,Даггер A G6C
Squadron1Description=Поставки Даггеров израильской постройки в Аргентину начались в конце 1978 года, и эти самолеты поступили на вооружение группы G6C (Grupo 6 de Caza — 6-я истребительная авиагруппа) на авиабазе Тандиль. Во время Южноатлантического конфликта 1982 года отряды группы были развернуты в Рио-Гранде и Сан-Хулиане. Они обеспечивали истребительное прикрытие и совершали атаки на предельно малых высотах по британским кораблям, неся тяжелые потери от Си Харриеров и средств противовоздушной обороны.
Squadron2=Dagger A G6C,Даггер A G6C
Squadron2Description=Поставки Даггеров израильской постройки в Аргентину начались в конце 1978 года, и эти самолеты поступили на вооружение группы G6C (Grupo 6 de Caza — 6-я истребительная авиагруппа) на авиабазе Тандиль. Во время Южноатлантического конфликта 1982 года отряды группы были развернуты в Рио-Гранде и Сан-Хулиане. Они обеспечивали истребительное прикрытие и совершали атаки на предельно малых высотах по британским кораблям, неся тяжелые потери от Си Харриеров и средств противовоздушной обороны.
