[usaf_c-130]
Type=Транспорт
Default=C-130,C-130
DefaultDescription=C-130 Геркулес — американский турбовинтовой военно-транспортный самолет средней и большой дальности, разработанный компанией Локхид в 1950-х годах. Являясь основным тактическим транспортным самолетом многих стран мира, он отличается исключительной надежностью, возможностью взлета и посадки с грунтовых аэродромов, а также высокой многофункциональностью, позволяющей использовать его для переброски войск, доставки грузов, эвакуации раненых и поисково-спасательных операций.
Squadron1=C-130,C-130
Squadron3=C-130 Escuadrón I,C-130 Escuadrón I
Squadron3Description=Аргентина получила свои первые транспортные самолеты C-130 Геркулес в декабре 1968 года. К 1982 году они несли службу в составе Escuadrón I (1-й эскадрильи) из Grupo 1 de Transporte Aéreo (1-й военно-транспортной авиагруппы). Во время Южноатлантического конфликта 1982 года их экипажи доставляли на острова войска и припасы, эвакуировали раненых и выполняли задачи по морской разведке.
Callsigns=Squadron3,Песка,Болон,Локо,Тигре

[usn_s-2e]
Type=Противолодочный самолёт
Default=S-2E,S-2E
DefaultDescription=S-2 — двухмоторный противолодочный самолет, впервые принятый на вооружение ВМС США в 1954 году. Эта модель активно поставлялась на экспорт; в США она эксплуатировалась до середины 1970-х годов, а в Аргентине оставалась в строю до 2025 года. Модификации S-2D и S-2E отличались увеличенными по сравнению с предыдущими версиями размерами, причем на варианте S-2E было дополнительно установлено гидроакустическое оборудование систем Julie и Jezebel.
Squadron1=S-2E EA2S,S-2E EA2S
Squadron1Description=Аргентинская эскадрилья EA2S (Escuadrilla Aeronaval Antisubmarina — Морская противолодочная эскадрилья) получила шесть самолетов S-2E Трекер в 1978 году. Вылетая с авианосца ARA Вейнтисинко де Майо, они сочетали морскую разведку с противолодочным патрулированием. Их операции в Южной Атлантике в 1982 году включали поиск британских надводных сил и подводных лодок, который продолжался с береговых баз после ухода с авианосца.
Squadron2=S-2E EA2S,S-2E EA2S
Squadron2Description=Аргентинская эскадрилья EA2S (Escuadrilla Aeronaval Antisubmarina — Морская противолодочная эскадрилья) получила шесть самолетов S-2E Трекер в 1978 году. Вылетая с авианосца ARA Вейнтисинко де Майо, они сочетали морскую разведку с противолодочным патрулированием. Их операции в Южной Атлантике в 1982 году включали поиск британских надводных сил и подводных лодок, который продолжался с береговых баз после ухода с авианосца.
Callsigns=Squadron1,Ситрико,Бонито|Squadron2,Ситрико,Бонито

