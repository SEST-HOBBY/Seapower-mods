Default=EMB-111A,EMB-111A
DefaultDescription=EMB-111A Бандейрулья (обозначенный как P-95 в Военно-воздушных силах Бразилии) — это бразильский малый морской патрульный самолет, разработанный в 1970-х годах. Два таких самолёта были временно взяты в лизинг Военно-морскими силами Аргентины в 1982 году для усиления возможностей по поиску морских целей.
Squadron1=EMB-111A EA2S,EMB-111A EA2S
Squadron1Description=Взятые в лизинг у Бразилии, два самолета EMB-111 прибыли в Аргентину в мае 1982 года и были приписаны к эскадрилье EA2S (Escuadrilla Aeronaval Antisubmarina — Морская противолодочная эскадрилья). Действуя из Рио-Гальегос во время Южноатлантического конфликта 1982 года, они выполняли разведывательные морские патрули после того, как устаревшие Нептуны вышли из строя.
Callsigns=Default,Лобо|Squadron1,Лобо

[ara_pucara]
Type=Штурмовик
Default=IA-58A Пукара,Пукара
DefaultDescription=IA-58A Пукара — аргентинский турбовинтовой штурмовик, разработанный для борьбы с партизанами и нанесения ударов на малых высотах. Он способен действовать с импровизированных взлетно-посадочных полос, обладает хорошими летными характеристиками и бронированной кабиной, однако практически бессилен перед лицом сколько-нибудь современных средств противовоздушной обороны, особенно против корабельных ЗРК.\nВ 1982 году существовала экстренная военная программа по вооружению самолетов Пукара авиационными торпедами Марк 13, что должно было обеспечить им возможность атаковать корабли.
Squadron1=IA-58A Пукара G3A,Пукара G3A
Squadron1Description=Штурмовики IA-58A Пукара аргентинской постройки поступили на вооружение военно-воздушных сил в 1975 году в Реконкисте, которая позже стала базой для группы G3A (Grupo 3 de Ataque — 3-я штурмовая авиагруппа). Во время Южноатлантического конфликта 1982 года группа действовала с островных взлетно-посадочных полос, выполняя разведывательные задачи и задачи авиаподдержки под огнём противника.
