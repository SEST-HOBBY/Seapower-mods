[rn_canberra]
Type=Бомбардировщик
Default=Канберра,Канберра
DefaultDescription=Канберра — британский двухдвигательный реактивный бомбардировщик первого поколения, разработанный в конце 1940-х годов. Обладая выдающейся для своего времени высотностью, скоростью и дальностью полета, этот самолет успешно эксплуатировался во многих странах мира в качестве тактического бомбардировщика, высотного разведчика и самолета радиоэлектронной борьбы.
Squadron1=Канберра,Канберра
Squadron2=Канберра B.62 G2B,Канберра B.62 G2B
Squadron2Description=Бомбардировщики Канберра B.62 начали прибывать в Аргентину в ноябре 1970 года для укомплектования группы G2B (Grupo 2 de Bombardeo — 2-я бомбардировочная авиагруппа). Будучи единственными специализированными дальними бомбардировщиками военно-воздушных сил и обладая бóльшим радиусом действия, чем самолеты A-4 и Даггер, они вызывали серьезную озабоченность у британского командования, которое во время Южноатлантического конфликта 1982 года направляло суда снабжения в обход зоны их досягаемости. Группа предприняла попытку нанести дальний удар по кораблям у Южной Георгии, но повернула назад из-за плохой погоды, а позже выполняла ночные атаки по британским наземным позициям.
