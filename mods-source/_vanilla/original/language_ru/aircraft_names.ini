[ara_a-4p]
Type=Штурмовик
Default=A-4P,A-4P
DefaultDescription=A-4 — американский однодвигательный палубный штурмовик, разработанный для ВМС и Корпуса морской пехоты США в 1950-х годах. Благодаря высокой надежности и отличным летным характеристикам он активно эксплуатировался на службе во многих других странах.\n\nA-4P — аргентинский вариант модели A-4B для Военно-воздушных сил, который практически не отличается от оригинального A-4B, за исключением модифицированного бортового радиоэлектронного оборудования.
Squadron1=A-4P G5C,A-4P G5C
Squadron1Description=Группа G5C (Grupo 5 de Caza — 5-я истребительная авиагруппа) начала получать переоборудованные штурмовики A-4B Скайхок в 1966 году. Для экспорта они получили обозначение A-4P, но в самой Аргентине их обычно называли A-4B. В мирное время группа базировалась в Вилья-Рейнольдс, а в 1982 году была переброшена на юг. Во время Южноатлантического конфликта пилоты группы совершали бомбовые удары на предельно малых высотах по британским кораблям, включая атаку, в результате которой был потоплен эсминец HMS Ковентри.
Squadron2=A-4C G4C,A-4C G4C
Squadron2Description=Двадцать пять штурмовиков A-4C Скайхок прибыли в Аргентину в 1976 году для укомплектования группы G4C (Grupo 4 de Caza — 4-я истребительная авиагруппа) на авиабазе Эль-Плумерильо. Во время Южноатлантического конфликта 1982 года группа действовала с аэродрома Сан-Хулиан, выполняя длительные вылеты над морем для атак на британские корабли на малых высотах.
Squadron3=A-4C G4C,A-4C G4C
Squadron3Description=Двадцать пять штурмовиков A-4C Скайхок прибыли в Аргентину в 1976 году для укомплектования группы G4C (Grupo 4 de Caza — 4-я истребительная авиагруппа) на авиабазе Эль-Плумерильо. Во время Южноатлантического конфликта 1982 года группа действовала с аэродрома Сан-Хулиан, выполняя длительные вылеты над морем для атак на британские корабли на малых высотах.
Callsigns=Squadron1,Мула,Лео,Вулкано,Зеус|Squadron2,Пато,Алькон,Хагуар,Торо|Squadron3,Пато,Алькон,Хагуар,Торо

[ara_a-4q]
Type=Штурмовик
Default=A-4Q,A-4Q
DefaultDescription=A-4 — американский однодвигательный палубный штурмовик, разработанный для ВМС и Корпуса морской пехоты США в 1950-х годах. Благодаря высокой надежности и отличным летным характеристикам он активно эксплуатировался на службе во многих других странах.\n\nA-4Q — аргентинский вариант модели A-4B для Военно-морских сил, который получил возможность применения ракет AIM-9B, а также модифицированное бортовое радиоэлектронное оборудование.
Squadron1=A-4Q EA33,A-4Q EA33
Squadron1Description=Аргентинский авианосец ARA Вейнтисинко де Майо нес на борту штурмовики A-4Q Скайхок из состава эскадрильи EA33 (Tercera Escuadrilla Aeronaval de Caza y Ataque — 3-я морская истребительно-штурмовая эскадрилья). Аргентина получила шестнадцать таких самолетов в 1972 году для укомплектования авиагруппы авианосца. Во время Южноатлантического конфликта 1982 года эскадрилья перебазировалась на сушу в Рио-Гранде, откуда совершала атаки на британские корабли, включая фрегат HMS Ардент.
Callsigns=Squadron1,Кола,Табано,Асекия

[ara_b-707]
Type=Патрульный самолёт
Default=707 Патрульный,707 Патруль
DefaultDescription=Во время Фолклендской войны самолеты Боинг 707 аргентинских ВВС выполняли задачи по морской разведке в дальней зоне, используя импровизированные методы. Эти невооруженные самолеты могли обнаруживать крупные корабли, однако были вынуждены идентифицировать цели визуально и не имели специализированных систем для поиска морских целей или средств самообороны.
Squadron1=B-707 Escuadrón V,B-707 Escuadrón V
Squadron1Description=Самолеты Боинг 707 поступили на службу в Военно-воздушные силы Аргентины в 1975 году. К 1982 году они летали в составе Escuadrón V (5-й эскадрильи) из Grupo 1 de Transporte Aéreo (1-й военно-транспортной авиагруппы), ведянаблюдение за приближающимся британским флотом, а также перевозя личный состав и припасы во время Южноатлантического конфликта.
