DefaultDescription=Виктор стал последним из трех проектов бомбардировщиков «V-серии». Он был выведен из эксплуатации как бомбардировщик в 1968 году, но оставался на службе до 1990-х годов в различных вспомогательных ролях благодаря модификации существующих планеров. Эти роли включали фоторазведку, радиоэлектронную борьбу и дозаправку в воздухе.\n\nB.2 был последней бомбардировочной модификацией и был выведен из эксплуатации менее чем через 10 лет службы из-за серьезных структурных повреждений, вызванных полетами на предельно малых высотах. Большинство из них были переоборудованы в заправщики или разведывательные самолеты.
