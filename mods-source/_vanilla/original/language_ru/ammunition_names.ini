usn_an_slq_25_nixie_decoy=AN/SLQ-25,Никси,Ложная акустическая цель,«Никси» (официально AN/SLQ-25) - это буксируемая акустическая система-приманка, используемая в основном надводными кораблями ВМФ США. Система генерирует сигналы, предназначенные для того, чтобы отвлечь приближающиеся торпеды от корабля.

usn_moss=MOSS,MK-70,Ложная акустическая цель,Mk-70 MOSS (мобильный симулятор подводной лодки) - это приманка диаметром 10 дюймов, используемая для того, чтобы отвлечь вражеский гидролокатор или торпеду от подводной лодки. MOSS способен имитировать собственный шум подводной лодки, а также ее активный гидролокатор.

wp_mg-44=МГ-44,Корунд,Ложная акустическая цель,МГ-44 «Корунд» - это самоходный гидроакустический имитатор подводных лодок второго поколения. Он предназначен для запуска из специальных 400-миллиметровых аппаратов на советских подводных лодках.
wp_mg-74=МГ-74,Корунд-2,Ложная акустическая цель,МГ-74 «Корунд-2» — это самоходный гидроакустический имитатор подводных лодок третьего поколения. В отличие от более ранней модели МГ-44, он может запускаться из стандартных 533-мм торпедных аппаратов, а также может быть сброшен с самолетов.

