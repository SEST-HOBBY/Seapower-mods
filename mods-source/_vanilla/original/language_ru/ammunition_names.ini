[AmmunitionNames]
# ------------------ РВВ ------------------
it_aspide_1a=Аспиде Mk.1A,,РВВ,Аспиде — итальянская ракета класса «воздух-воздух» средней дальности, созданная на основе американской ракеты Спэрроу. Созданная на базе AIM-7E, эта ракета имеет улучшенный двигатель, увеличивающий дальность и скорость, а также значительно улучшенную моноимпульсную головку самонаведения, позволяющую вести огонь на малых высотах и ​​улучшающую характеристики противодействия радиоэлектронной борьбе.

fr_r530em=R530FE,,РВВ,R530FE — это французская полуактивная ракета класса «воздух-воздух» малой дальности. Будучи одной из первых самонаводящихся ракет класса «воздух-воздух» французского производства, R530 не является особенно надежным или мощным оружием, но она имеет относительно долго работающий двигатель и неплохую дальность действия по сравнению со своими современниками той эпохи.
fr_super-530f=Super-530F,,РВВ,Super-530F - французская ракета с полуактивным наведением типа «воздух-воздух» малой и средней дальности. Примерно аналогична американской AIM-7 и представляет собой усовершенствованную версию предыдущей ракеты R530.
fr_r550=R550,Magic 1,РВВ,R550 Magic 1 - это французская ракета типа «воздух-воздух» с тепловым наведением малой дальности, сравнимая с американской AIM-9. Данная ракета может наводится только в заднюю полусферу цели.

pla_pl-2=PL-2А,PL-2А,ИК РВВ,PL-2 - китайская ракета «воздух-воздух» с инфракрасным самонаведением. Является копией советской РВВ К-13 и имеет схожие с ней характеристики. \n\nПуск только в заднюю полусферу.
pla_pl-2b=PL-2B,,ИК РВВ,PL-2 - китайская ракета «воздух-воздух» с инфракрасным самонаведением. Является копией советской РВВ К-13 и имеет схожие с ней характеристики. PL-2B имеет более длинный носовой обтекатель для размещения немного улучшенной системы наведения, но в остальном не отличается от PL-2A. \n\nПуск только в заднюю полусферу.
pla_pl-5b=PL-5B,,ИК РВВ,PL-5В - китайская ракета «воздух-воздух» с инфракрасным самонаведением. Разработанная параллельно с PL-2B, ракета PL-5B появилась на основе неудачной радиолокационной самонаводящейся ракеты PL-5A. Она использует инфракрасную головку самонаведения, заимствованную у PL-2B, но с более совершенным планером с точки зрения дальности и маневренности. \n\nПуск только в заднюю полусферу.
pla_pl-5c=PL-5C,,ИК РВВ,PL-5С - китайская ракета «воздух-воздух» с инфракрасным самонаведением. Значительное усовершенствование по сравнению с сериями PL-2 и PL-5B, модель PL-5C включает в себя передовую систему наведения с перекрестной антенной решеткой, которая обеспечивает пуск с любого ракурса и значительную устойчивость к средствам противодействия. Также она оснащена новым двигателем с увеличенным временем работы и улучшенными характеристиками манёвренности.

usaf_aim-9e=AIM-9E,Сайдуайндер,ИК РВВ,AIM-9E Сайдуайндер - американская ракета типа «воздух-воздух» с инфракрасной головкой самонаведения. По сравнению с предыдущими версиями этой ракеты, модификация «Эхо» обладает значительно улучшенными характеристиками во всех областях применения, благодаря увеличеной зоне обнаружения целей и увеличенной дальности полета. Пригодна только для пуска в заднюю полусферу цели.
usaf_aim-9j=AIM-9J,Сайдуайндер,ИК РВВ,AIM-9J Сайдуайндер - американская ракета типа «воздух-воздух» с инфракрасной головкой самонаведения. В модификации «Джульетт» произошли значительные изменения по сравнению с «Эхо», в частности, в системах управления: твердотельная электроника заменила более раннюю вакуумную электронику. Вероятность поражения цели увеличилась по сравнению с предыдущими версиями, но ракета по-прежнему оставалась не всеракурсной, будучи способной наводиться только в заднюю полусферу цели.
usaf_aim-9p=AIM-9P,Сайдуайндер,ИК РВВ,AIM-9Р Сайдуайндер - американская ракета типа «воздух-воздух» с инфракрасной головкой самонаведения. «Папа» — экспортная версия модификации «Джульетт». Она оснащена новым взрывателем, новым двигателем, улучшенной головкой самонаведения, позволяет производить пуски с боковых ракурсов, а также отличается повышенной надежностью.

usn_aim-7d=AIM-7D,Спэрроу,ПАРЛГСН РВВ,AIM-7D Спэрроу — американская полуактивная радиолокационная управляемая ракета класса «воздух-воздух». Модификация «Дельта» была оптимизирована для атак на более высоких скоростях сближения по сравнению с более ранней версией «Чарли».
usn_aim-7e=AIM-7E,Спэрроу,ПАРЛГСН РВВ,AIM-7E Спэрроу — американская полуактивная радиолокационная управляемая ракета класса «воздух-воздух». Модификация «Эхо» имеет увеличенную дальность полёта и её эффективность повышена по сравнению с предыдущими вариантами ракеты.
usn_aim-7e2=AIM-7E-2,Спэрроу,ПАРЛГСН РВВ,AIM-7E Спэрроу — американская полуактивная радиолокационная управляемая ракета класса «воздух-воздух». «Эхо-2» — это модификация оригинальной модели «Эхо», разработанная после выявления недостатков в её характеристиках против истребителей во Вьетнаме. Она отличается меньшей минимальной дальностью, немного лучшими характеристиками на малых высотах и ​​немного большей маневренностью на этапе разгона.
usn_aim-7e4=AIM-7E-4,Спэрроу,ПАРЛГСН РВВ,AIM-7E Спэрроу — американская полуактивная радиолокационная управляемая ракета класса «воздух-воздух». «Эхо-4» — это вариант для новых истребителей, созданный для использования их более мощных радаров, а также обладающий несколько улучшенными характеристиками системы наведения, позволяющими противостоять помехам и средствам противодействия.
usn_aim-7f=AIM-7F,Спэрроу,ПАРЛГСН РВВ,AIM-7F Спэрроу — американская полуактивная радиолокационная управляемая ракета класса «воздух-воздух». «Фокстрот» — это переработанная версия оригинальной ракеты Спэрроу III, в которой используется современный двигатель с функцией поддержания тяги для увеличения дальности полета, а также улучшенный взрыватель и более совершенная головка самонаведения, что обеспечивает повышение всех характеристик. \nНесмотря на это, её характеристики на малых высотах и ​​в рамках системы противодействия радиоэлектронной борьбе по-прежнему не являются исключительными, а головка самонаведения не может в полной мере использовать большую дальность действия этой ракеты.
usn_aim-7m=AIM-7M,Спэрроу,ПАРЛГСН РВВ,AIM-7M Спэрроу - американская ракета класса «воздух-воздух» с полуактивной радиолокационной головкой самонаведения. Модификация «Майк» намного превосходит ракеты предыдущего поколения (AIM-7E-2, AIM-7E, AIM-7D и т.д.) в основном из-за существенно увеличенной дальности полета. В отличие от предыдущего поколения ракет семейства «Спэрроу», AIM-7M подходит как для работы на малых, так и на больших высотах. Впрочем, её эффективность при применении по высотным целям всё же выше.
usn_aim-9b=AIM-9B,Сайдуайндер,ИК РВВ,AIM-9B Сайдуайндер — американская инфракрасная самонаводящаяся ракета класса «воздух-воздух». Модификация «Браво» была первым эксплуатационным вариантом серии AIM-9. По сравнению с более поздними версиями, она имеет узкую зону запуска и склонна легко обманываться другим источником тепла, например, солнцем. Излишне говорить, что эта ракета поддерживает пуск только в заднюю полусферу цели.
usn_aim-9c=AIM-9C,Сайдуайндер,ПАРЛГСН РВВ,AIM-9С Сайдуайндер — американская полуактивная радиолокационная управляемая ракета класса «воздух-воздух». «Чарли» — единственная ракета Сайдуайндер с радиолокационным наведением, поступившая на вооружение, и она идентична модели «Дельта», за исключением полуактивной радиолокационной головки самонаведения, которая позволяет вести огонь со всех ракурсов на больших дистанциях. Будучи эксклюзивной ракетой для истребителя F-8 и в целом непопулярной среди экипажей, AIM-9C была снята с вооружения всего через несколько лет после поступления на вооружение.
usn_aim-9d=AIM-9D,Сайдуайндер,ИК РВВ,AIM-9D Сайдуайндер - американская ракета класса «воздух-воздух» с инфракрасной головкой самонаведения. Модификация «Дельта» - усовершенствованный вариант «Браво», оснащенная улучшенной головкой самонаведения, более мощной боеголовкой и имеющая увеличенную дальность полёта. Атака возможна только с задней полусферы.
usn_aim-9g=AIM-9G,Сайдуайндер,ИК РВВ,The AIM-9G Сайдуайндер - американская ракета класса «воздух-воздух» с инфракрасной головкой самонаведения. Модификация «Гольф» — это улучшенная версия «Дельты» с большим углом обстрела, которая также экспортировалась в другие страны. \n\nПуск только с задних и боковых ракурсов.
usn_aim-9h=AIM-9H,Сайдуайндер,ИК РВВ,The AIM-9H Сайдуайндер - американская ракета класса «воздух-воздух» с инфракрасной головкой самонаведения. Модификация «Хотел» представляет собой твердотопливную версию модификации «Гольф» и оснащена более чувствительной ГСН, позволяющим делать пуски с боковых ракурсов, а также улучшенной маневренностью и надежностью. \n\nПуск только с задних и боковых ракурсов.
usn_aim-9l=AIM-9L,Сайдуайндер,ИК РВВ,AIM-9L Сайдуайндер - американская ракета класса «воздух-воздух» с инфракрасным самонаведением. Вариант «Лима» стал первым «Сайдвиндером», способным атаковать цель не только сзади. По сравнению со всеми предыдущими версиями, диапазон захвата значительно улучшен, что позволяет поражать цели в лоб при сближении. Однако пуск в заднюю полусферу цели сзади по-прежнему обеспечивает большую дальность захвата.
usn_aim-9m=AIM-9M,Сайдуайндер,ИК РВВ,AIM-9М Сайдуайндер - американская ракета класса «воздух-воздух» с инфракрасным самонаведением. Модификация «Майк» — самая современная версия, находящаяся на вооружении, это модель «Лима» с улучшенными возможностями подавления ложных целей и большей дальностью действия головки самонаведения.
usn_aim-54a=AIM-54A,Phoenix,РВВ,AIM-54A Phoenix — американская ракета класса «воздух-воздух» с активным радиолокационным самонаведением. Это ракета «воздух-воздух» с наибольшей дальностью полёта в арсенале США и используется только с F-14. Интегрированная с передовым для своего времени радаром AWG-9, она обеспечивает F-14 возможность поражать 6 целей одновременно, по одной ракете на каждую цель. Для этого сразу после пуска ракеты летят на автопилоте, в то время как бортовой компьютер самолёта собирает данные с радара, работающего в режиме «сканирование на проходе» в файлы слежения, которые затем используются для передачи обновленных данных наведения ракетам на среднем этапе полета, направляя их в «окно» перехвата, где уже собственная активная головка самонаведения ракеты самостоятельно захватывает цель на последнем этапе перехвата.

wp_aa-2a=Р-3C,,ИК РВВ,Серийная версия ракеты «воздух-воздух» с инфракрасным самонаведением К-13. Принята на вооружение 1962 году. Являлась почти копией американского «Сайдвиндера» модификации AIM-9B и даже была совместима с ним по ряду деталей. \n\nПуск только в заднюю полусферу.
wp_aa-2c=Р-3Р,,ПАРЛГСН РВВ,Р-3Р – ранняя советская ракета «воздух-воздух» с полуактивной радиолокационной системой наведения. Данная модификация ракеты была создана на основе ракеты Р-3С с тепловым самонаведением, которая, в свою очередь являлась копией американского «Сайдвиндера» модификации AIM-9B.
wp_aa-2d=Р-13М,,ИК РВВ,Дальнейшее развитие ракеты «воздух-воздух» Р-3С с инфракрасным самонаведением. Принята на вооружение в середине 70-х годов. Новый двигатель и головка самонаведения существенно увеличили эффективность ракеты. \n\nПуск только в заднюю полусферу.
wp_aa-2-2=Р-13М1,,ИК РВВ,Дальнейшее развитие ракеты «воздух-воздух» Р-3С с инфракрасным самонаведением. Принята на вооружение через 2 года после модификации Р-13М. Дальнейшие улучшения двигателя и ГСН немного повысили эффективность ракеты по сравнению с Р-13М. \n\nПуск только в заднюю полусферу.

wp_aa-3e=Р-98МР,,ПАРЛГСН РВВ,Ракета Р-98М – глубокая модернизация ракеты Р-8, созданной еще в 1950-е годы для вооружения перехватчиков ПВО. Р-98 была создана в середине 1970-х годов и поступала на вооружение перехватчиков Су-15 и Як-28. Ракеты данного семейства предназначались для перехвата маломаневренных высотных целей. Перехватчики обычно несли одну ракету в варианте Р-98МР с полуактивной радиолокационной системой наведения и одну ракету в варианте Р-98МТ с инфракрасной головкой самонаведения. Предполагалось пускать сначала радиолокационную, потом тепловую ракету по одной и той же цели, чтобы увеличить вероятность поражения.
wp_aa-3f=Р-98МТ,,ИК РВВ,Ракета Р-98М – глубокая модернизация ракеты Р-8, созданной еще в 1950-е годы для вооружения перехватчиков ПВО. Р-98 была создана в середине 1970-х годов и поступала на вооружение перехватчиков Су-15 и Як-28. Ракеты данного семейства предназначались для перехвата маломаневренных высотных целей. Перехватчики обычно несли одну ракету в варианте Р-98МР с полуактивной радиолокационной системой наведения и одну ракету в варианте Р-98МТ с инфракрасной головкой самонаведения. Предполагалось пускать сначала радиолокационную, потом тепловую ракету по одной и той же цели, чтобы увеличить вероятность поражения. Данная ракета поддерживает пуск только в заднюю полусферу цели.
wp_aa-6a=Р-40Р,,ПАРЛГСН РВВ,Р-40 – Советская ракета «воздух-воздух» средней дальности, разработанная в начале 60-х годов для вооружения перехватчика МиГ-25П. Модификация Р имеет полуактивную систему наведения.
wp_aa-6b=Р-40Т,,ИК РВВ,Р-40 – Советская ракета «воздух-воздух» средней дальности, разработанная в начале 60-х годов для вооружения перехватчика МиГ-25П. Модификация Т имеет тепловую систему самонаведения. Способна наводиться на цели только с задней полусферы.
wp_aa-6c=Р-40РД,,ПАРЛГСН РВВ,Р-40РД – улучшенная версия ракеты Р-40, созданная в конце 70-х годов для новой модификации перехватчика МиГ-25ПД. Новая версия ракеты имеет более совершенную систему наведения.
wp_aa-6d=Р-40ТД,,ИК РВВ,Р-40ТД – улучшенная версия ракеты Р-40Т, созданная в конце 70-х годов для новой модификации перехватчика МиГ-25ПД. Новая версия ракеты имеет более совершенную головку инфракрасного самонаведения.
wp_aa-7c=Р-24Р,,ПАРЛГСН РВВ,Р-24Р – советская ракета «воздух-воздух» средней дальности с полуактивным радиолокационным наведением, созданная на базе более ранней ракеты Р-23 в середине 1970-х годов. Новая ракета предназначалась для вооружения истребителей МиГ-23 новых модификаций МЛ и МЛД. Головка наведения ракеты может работать в моноимпульсном режиме, обладает повышенной стойкостью к помехам и может захватывать цель уже после пуска, а не на подвеске, как более ранние образцы.
wp_aa-7d=Р-24Т,,ИК РВВ,Р-24Т – советская ракета «воздух-воздух» средней дальности с тепловым самонаведением, созданная на базе более ранней ракеты Р-23 в середине 1970-х годов. Новая ракета предназначалась для вооружения истребителей МиГ-23 новых модификаций МЛ и МЛД. Головка самонаведения имела повышенную помехозащищенность и стала всеракурсной, обеспечивая возможность атаки цели не только с задней полусферы, но и с других ракурсов.
wp_aa-8=Р-60М,,ИК РВВ,Р-60М – советская ракета «воздух-воздух» малой дальности, рассматриваемая как оружие ближнего боя для истребителей и как средство самообороны для самолётов других типов. Улучшенный вариант ракеты под индексом Р-60М оснащался новой всеракурсной головкой самонаведения. Ракета нашла широкое применение в ВВС и ПВО СССР, а также активно поставлялась на экспорт.
wp_aa-11=Р-73А,,ИК РВВ,Р-73А — советская ракета класса «воздух-воздух» малой дальности с инфракрасным наведением. Это самая эффективная ракета малой дальности в советском арсенале, не уступающая зарубежным аналогам и представляющая собой крайне смертоносное оружие на малых дистанциях со всех ракурсов.

# ------------------ SAM ------------------
it_aspide_1=Аспиде Mk.1A,,ЗУР/ПКР,«Аспиде» — итальянская зенитная ракета средней дальности, созданная на основе американской ракеты «Спэрроу». Созданная на базе AIM-7E, эта ракета имеет улучшенный двигатель, увеличивающий дальность и скорость, а также значительно улучшенную моноимпульсную головку самонаведения, позволяющую вести огонь на малых высотах и ​​улучшающую характеристики противодействия радиоэлектронной борьбе (ПЭТС). Модель для запуска с поверхности имеет меньшую дальность и скорость по сравнению с авиационной версией, хотя всё же значительно превосходит RIM-7E.

jsdf_sam1=Тансам 1,,ЗУР,Японская всеракурсная зенитная ракета малой дальности с тепловой ГСН. Входит в состав зенитно-ракетного комплекса Тип 81.

plan_hq-61=HQ-61,,ЗУР,HQ-61 — китайская зенитная ракета, похожая внешне и по характеристикам на американскую ЗУР RIM-7F Sea Спэрроу.

raf_rapier=Рапира,,ЗУР,Британская зенитная ракета малой дальности с радиокомандным наведением по визуально видимым целям.

rn_seacat=GWS-21,Сикэт,ЗУР,GWS-21 Сикэт – первая в мире зенитная ракетная система самообороны малой дальности. Она была принята на вооружение Королевского флота Великобритании в 1962 году и предназначалась для замены установок малокалиберной зенитной артиллерии типа «Бофорс». Комлекс «Сикэт» использовал очень простую систему наведения, в которой оператор визуально постоянно отсеживал цель, направляя ракету по радиокомандной линии. Такая система могла работать только в условиях хорошей видимости и её эффеективность против современных реактивных самолётов и противокорабельных ракет сомнительна.
rn_seacat_mk2=GWS-24,Sea Cat Mk.2,ЗУР,GWS-24 Seacat — это модернизированная модель Sea Cat Mk.1 (GWS-20) с улучшенными характеристиками на малых высотах, большей дальностью полета, повышенной надежностью и более совершенной системой управления огнем. К сожалению, это по-прежнему очень слабая ракета с сомнительной эффективностью.

usa_mim-14=MIM-14,Найк-Геркулес,ЗУР,Американская зенитная ракета большой дальности.
usa_mim-23=MIM-23,Хок,ЗУР,Американская зенитная ракета средней дальности.

usn_rim-8=RIM-8,Талос,ЗУР/ПКР,RIM-8 Talos - это мощная ракетная система типа «земля-воздух» большой дальности, используемая в основном на крейсерах ВМФ США. Ракета требует некоторой сборки перед запуском, поэтому ее скорострельность ниже, чем у более современных систем.

usn_rim-7=RIM-7E,Си Спэрроу,ЗУР/ПКР,RIM-7 Sea Спэрроу — это система ПВО малой дальности, установленная на множестве разных кораблей ВМФ США и НАТО. Система в первую очередь предназначена для самообороны.
usn_rim-7h=RIM-7H,Си Спэрроу,ЗУР/ПКР,Ракета RIM-7H Sea Спэрроу — это зенитная ракета малой дальности, являющаяся основной корабельной ракетой противоракетной обороны НАТО. Модель Sea Спэрроу «Хотел» в целом очень похожа на модель «Эхо», за исключением того, что RIM-7H имеет складные стабилизаторы для установки в более новые пусковые установки и немного улучшенную надежность.
usn_rim-7m=RIM-7M,Си Спэрроу,ЗУР/ПКР,RIM-7 Sea Спэрроу — это система ПВО малой дальности, установленная на множестве разных кораблей ВМФ США и НАТО. Система в первую очередь предназначена для самообороны.

# RIM-2 Terrier
usn_rim-2f=RIM-2F,Терьер,ЗУР/ПКР,RIM-2F Terrier – один из первых в мире корабельных ЗРК. Он был спроектирован, чтобы обсепечить противовоздушную оборону американских корабельных соединений на средней дальности, далее зоны действия зенитных орудий, но ближе, чем зона истребительных патрулей ПВО. Ранний «Терьер» наводился, следуя вдоль радиолуча. Модификация RIM-2F использует более совершенный метод полуактивного наведения, а ракета обладает повышенной манёвренностью. Как и другие морские зенитно-ракетные комплексы, «Терьер» может использоваться в качестве противокорабельного средства в пределах радиогоризонта. Огневая производительность комплекса снижена из-за необходимости вручную устанавливать стабилизаторы на ускорителе ракеты, поэтому одна пусковая установка способна запускать не более двух ракет каждые 30 секунд.
usn_rim-24b=RIM-24B,Тартар,ЗУР/ПКР,RIM-24 «Тартар» — это зенитная управляемая ракета малой дальности с радиолокационным наведением, способная также поражать надводные цели. ЗРК «Тартар» изначально представлял собой уменьшенную версию ЗРК «Терьер», предназначенную для установки на малые корабли флота США и являлся компонентом малой дальности семейства ракет «3T» (Талос, Терьер, Тартар).\n\nМодификация RIM-24B имеет общие узлы с ракетой RIM-2E «Терьер» и превосходит по своим характеристикам базовую версию RIM-24A.

# RIM-66 SM-1MR
usn_rim-66a=RIM-66A,Стандарт SM-1MR,ЗУР/ПКР,Ракета RIM-66A Standard 1 MR была разработана как новое оружие для кораблей ранее использовавших RIM-24C Tartar. Ракета «Стандарт» имеет общий фюзеляж с «Тартаром» для облегчения интеграции новой ракеты в старый комплекс.\n\n Модификация «А» была самым ранним вариантом ракеты и поступила на вооружение в 1967 году.
usn_rim-66b=RIM-66B,Стандарт SM-1MR,ЗУР/ПКР,Ракета RIM-66B Standard 1 MR была разработана как новое оружие для кораблей ранее использовавших RIM-24C Tartar. Ракета «Стандарт» имеет общий фюзеляж с «Тартаром» для облегчения интеграции новой ракеты в старый комплекс.\n\n Модификация «Б» была существенно улучшена по сравнению с «А». Большая часть ракет модификации «А» была модернизирована до уровня модификации «Б».
usn_rim-66e=RIM-66E,Стандарт SM-1MR,ЗУР/ПКР,Ракета RIM-66E Standard 1 MR была разработана как новое оружие для кораблей ранее использовавших RIM-24C Tartar. Ракета «Стандарт» имеет общий фюзеляж с «Тартаром» для облегчения интеграции новой ракеты в старый комплекс.\n\n Модификация «Е» представляет собой модификацию «Б» с электроникой от SM-2MR что дает ей некоторую возможность перехвата низколетящих целей.
usn_rim-66c=RIM-66C,Стандарт SM-2MR,ЗУР/ПКР,Ракета RIM-66C Standard 2 MR является ключевой частью новой системы боевого управления AEGIS, устанавливаемой на новейшие надводные боевые корабли ВМФ США, и системы NTU (New Threat Upgrade), устанавливаемой на более старые корабли. Это более мощное оружие, чем старые варианты ракеты «Стандарт», с уменьшенным периодом использования подсветки радара управления огнём, что позволяет одновременно запускать и наводить больше ракет.
usn_rim-66d=RIM-66D,Стандарт SM-2MR,ЗУР/ПКР,Ракета RIM-66D Standard 2 MR является ключевой частью новой системы боевого управления AEGIS, устанавливаемой на новейшие надводные боевые корабли ВМФ США, и системы NTU (New Threat Upgrade), устанавливаемой на более старые корабли. Это более мощное оружие, чем старые варианты ракеты «Стандарт», с уменьшенным периодом использования подсветки радара управления огнём, что позволяет одновременно запускать и наводить больше ракет.
usn_rim-66g=RIM-66G,Стандарт SM-2MR,ЗУР/ПКР,Ракета RIM-66G Standard 2 MR Block II является ключевой частью новой системы боевого управления AEGIS, устанавливаемой на новейшие надводные боевые корабли ВМФ США, и системы NTU (New Threat Upgrade), устанавливаемой на более старые корабли. Это более мощное оружие, чем старые варианты ракеты «Стандарт», с уменьшенным периодом использования подсветки радара управления огнём, что позволяет одновременно запускать и наводить больше ракет.\nSM-2MR Block II более чем в 2 раза превосходит по дальности предыдущую SM-2MR Block I, имеет большую максимальную скорость цели и меньшую минимальную высоту.\n\nРакетой RIM-66G вооружались корабли использовавшие пусковую установку Мк 26, например первые версии крейсеров «Тикондерога».

# RIM-67 SM-1ER/SM-2ER
usn_rim-67a=RIM-67A,Стандарт SM-1ER,ЗУР/ПКР,Ракета RIM-67A Standard 1 ER была разработана в качестве замены ЗУР RIM-8 Talos. Ракета идентична RIM-66A, но оснащена дополнительным ускорителем для увеличения дальности полета.
usn_rim-67b=RIM-67B,Стандарт SM-2ER,ЗУР/ПКР,Ракета RIM-67B Standard 2 ER является ключевой частью модернизации NTU (New Threat Upgrade), которая устанавливается на корабли, ранее оснащенные RIM-2 Terrier. Ракета практически идентична RIM-66C, но оснащена дополнительным ускорителем для увеличения дальности полета.
usn_rim-67c=RIM-67C,Стандарт SM-2ER,ЗУР/ПКР,Ракета RIM-67B Standard 2 ER является ключевой частью модернизации NTU (New Threat Upgrade), которая устанавливается на корабли, ранее оснащенные RIM-2 Terrier. Ракета внешне идентична RIM-66C, но оснащена дополнительным ускорителем для увеличения дальности полета.\n\n Модификация «Ц» была существенно улучшена по сравнению с «Б».


wp_sa-n-1=М-1,Волна-М,ЗУР/ПКР,М-1 «Волна» – первый серийный советский корабельный зенитно-ракетный комплекс средней и ближней дальности, унифицированный с сухопутным ЗРК С-125. Предназначен для ПВО корабельных соединений, также может использоваться как противокорабельное средство в пределах радиогоризонта. Система наведения - радиокомандная. 
wp_sa-n-1c=М-1 (П),Волна-П,ЗУР/ПКР,М-1 «Волна» – первый серийный советский корабельный зенитно-ракетный комплекс средней и ближней дальности, унифицированный с сухопутным ЗРК С-125. Предназначен для ПВО корабельных соединений, также может использоваться как противокорабельное средство в пределах радиогоризонта. Система наведения - радиокомандная. \n\nВолна-П - модификация обладающая улучшеной помехозащищённостью и способная атаковать низколетящие цели. С середины 70-х годов, в ходе модернизации кораблей, ЗРК «Волна-П» устанавливалась вместо предыдущих версий.
wp_sa-n-3=М-11,Шторм,ЗУР/ПКР,М-11 «Шторм» – советский корабельный зенитно-ракетный комплекс коллективной обороны средней дальности, первый специально спроектированный для ВМФ СССР и не имеющий сухопутного прототипа или аналога. Для ЗРК была спроектирована ракета В-611, разработанная как «универсальная» ракета двойного назначения, используемая и как ЗУР и как легкая ПКР (с целью использования в качестве последней ракета имеет сравнительно тяжелую боевую часть). Данный комплекс устанавливался только на крупных кораблях, начиная с противолодочных крейсеров проекта 1123. Система наведения - радиокомандная. Один антенный пост может наводить 2 ракеты по одной цели.
wp_sa-n-4=М-4,Оса-М,ЗУР/ПКР,М-4 «Оса-М» – советский корабельный зенитно-ракетный комплекс самообороны малой дальности, разработанный на основе войскового ЗРК «Оса». Морской вариант, впрочем имеет балочную пусковую установку вместо пакетной, перезаряжаемую автоматически из подпалубного погреба. «Оса-М» получила очень широкое распространение в ВМФ СССР, устанавливаясь как на крупных кораблях в качестве средства самообороны, так и на малых кораблях в качестве основного зенитного средства. Система наведения – радиокомандная. Может применяться по надводным целям.
wp_sa-n-5=Стрела-2,,ЗУР,Переносной зенитно-ракетный комплекс, широко используемый в Советской Армии с конца 1960-х годов. Также использовался на флоте, как в переносном варианте, так и в варианте стационарной установки с четырьмя пусковыми направляющими.
wp_sa-n-6=С-300Ф,Форт,ЗУР/ПКР,С-300Ф – морская версия сухопутного зенитно-ракетного комплекса С-300П большой и средней дальности, разработанная к началу 1980-х гг. для вооружения крупных надводных кораблей, таких как ракетные крейсера проектов 1144 «Орлан» и 1164 «Атлант». По сравнению с корабельными ЗРК предыдущих образцов, «Форт» отличается не только увеличенной зоной поражения как по дальности, так и по высотам, но и существенно увеличенным количеством каналов наведения. В комлпексе реализован метод наведения «через ракету» (в игре имитируется как полуактивное наведение). Вертикальные пусковые установки обеспечивают высокий темп пуска ракет. ЗРК также может использоваться для атаки надводных целей.
wp_sa-n-7=М-22,Ураган,ЗУР/ПКР,М-22 «Ураган» – советский корабельный ЗРК средней дальности, разработанный в 1970-е гг. на основе войскового ЗРК «Бук». В отличие от более габаритного и тяжелого С-300Ф «Форт», М-22 мог устанавливаться на корабли меньшего водоизмещения, класса БПК/эсминец. Данный ЗРК стал основой ПВО эсминцев типа «Современный» проекта 956. Однобалочные пусковые установки обеспечивают больший темп стрельбы, чем пусковые установки ЗРК предыдущих типов. Система наведения – полуактивная. Подсвет целей обеспечивается сравнительно компактными радиолокационными установками МР-90 «Орех», установленными на корабле таким образом, чтобы обеспечить максимальное количество целевых каналов наведения в любом направлении. Может применяться по надводным целям.
wp_sa-n-9=3К95,Кинжал,ЗУР/ПКР,«Кинжал» – советский зенитный ракетный комплекс самообороны малой дальности, разработанный в первой половине 80-х годов. Этот ЗРК использует ту же ракету, что и войсковой ЗРК малой дальности «Тор М-1». «Кинжал» имеет значительно улучшенные характеристики при стрельбе по низколетящим малоразмерным целям вроде ПКР «Гарпун», или «Экзосет». Доработка комплекса продолжалась до 1989 года.

wp_sa-2=С-75,Двина,ЗУР,С-75 – широко распространённый советский зенитно-ракетный комплекс, предназначенный для обороны важных объектов от воздушных ударов, в первую очередь – высоколетящих тяжелых бомбардировщиков. Разработан в 1950-е годы. Широко поставлялся на экспорт (более чем в 40 стран) и активно использовался в боевых действиях.
wp_sa-3=С-125,Нева,ЗУР,C-125 – советский зенитно-ракетный комплекс ближней дальности, закрывающий «мёртвые зоны» комплекса С-75 по минимальной дальности и высоте. По сравнению со «старшим братом» этот ЗРК отличался большей мобильностью и лучше подходил для использования в качестве средства войсковой ПВО в случае необходимости. Активно поставлялся на экспорт под названием «Печора» и использовался во множестве конфликтов.
wp_sa-4=2К11,Круг,ЗУР,Советский мобильный ЗРК средней дальности, разработанный в 60-е гг для нужд войсковой ПВО. Пригоден в основном для поражения высоколетящих целей.
wp_sa-5=С-200В,Вега,ЗУР,С-200 – советский зенитно-ракетный комплекс дальнего действия, разработанная в 1960-х годах с целью обеспечения ПВО больших площадей от налётов стратегических бомбардировщиков. Модификация В, она же «Вега» начала поступать на вооружение советских войск ПВО после 1970 года и имела увеличенную область поражения как по дальности, так и по высотам.
wp_sa-6=2К12,Куб,ЗУР,ЗРК «Куб» – советский мобильный комплекс войсковой ПВО ближнего действия, разработанный в 60-е годы для прикрытия танковых и мотострелковых соединений. Поставлялся на экспорт в страны Варшавского договора и другие, дружественные СССР. Применялся в нескольких вооруженных конфликтах.
wp_sa-8=9К33М3,Оса-АКМ,ЗУР,9К33М3 «Оса-АКМ» – советский мобильный войсковой зенитно-ракетный комплекс ближнего действия. Система наведения – радиокомандная.
wp_sa-11=9К37,Бук,ЗУР,ЗРК «Бук» – советский мобильный комплекс войсковой ПВО ближнего действия, разработанный в 70-е годы.
wp_sa-13=9К35,Стрела-10,ЗУР,Советский мобильный войсковой ЗРК малой дальности на шасси гусеничной машины МТЛБ, оснащенный ракетами с инфракрасным наведением. Предназначен для борьбы с низколетящими самолётами и вертолётами.

# ---------- Anti-radar Missiles ---------
usn_agm-45=AGM-45,Шрайк,ПРР,AGM-45 Shrike – американская противорадиолокационная ракета, созданная на основе корпуса ракеты AIM-7 Спэрроу типа «земля-воздух» и оснащенная головкой пассивного радиолокационного наведения. Может поражать береговые и корабельные радиолокационные станции.
usn_agm-78=AGM-78,Стандарт АРМ,ПРР,AGM-78 Стандарт АРМ – американская противорадиолокационная ракета, созданная для замены ракеты AGM-45 Шрайк.
usn_agm-88a=AGM-88A,ХАРМ,ПРР,AGM-88A HARM – американская противорадиолокационная ракета большой дальности. HARM is the most modern anti-radiation missile in the NATO arsenal by 1985, and outperforms its predecessors in nearly every category, especially reliability and maximum speed. Due to this missile being very new in service, only a limited number (or none at all) can be used at any given time.
usn_agm-122a=AGM-122A,Сайдарм,ПРР,AGM-122A – американская противорадиолокационная ракета малой дальности, разработанная на основе неудачной AIM-9C. В основном предназначена для использования с вертолётов и штурмовиков против ПВО малого радиуса действия.

usn_rgm-8h=RIM-8H,Талос ПРР,ПРР,RIM-8H Talos — это противорадиолокационная версия зенитного ракетного комплекса RIM-8 Talos. RGM-8H утратил способность атаковать воздушные цели, однако обладает наибольшей дальностью среди противорадиолокационных комплексов корабельного базирования.

wp_as-11=Х-58,,ПРР,Х-58 – советская авиационная противорадиолокационная ракета, разработанная в 1970-х годах для замены более ранней ракеты Х-28 аналогичного назначения. Может поражать береговые и корабельные радиолокационные станции.
wp_as-12=Х-25МП,,ПРР,Х-58 – советская авиационная противорадиолокационная ракета средней дальности, принятая на вооружение в 1981 году. Создана на основе ракеты Х-25 с лазерной ГСН. Самая распространённая ПРР в арсенале советских ВВС и сопоставима с американской AGM-45 «Шрайк». \nМожет поражать береговые и корабельные радиолокационные станции.

wp_as-2b=К-10СП,Комета-10П,РЭБ,Модификация ракеты К-10С в которой боевая часть заменена на станцию активных помех «Азалия». Основное предназначение - прикрытие боевых ракет.

# ---------- Anti-ship Missiles ----------
is_gabriel_2=Габриэль,,ПКР,«Габриэль» – компактная противокорабельная ракета израильской разработки, одна из первых в мире ПКР с маловысотным (несколько метров) профилем полёта. «Габриэль-2» – несколько улучшенный вариант ракеты, принятый на вооружение в середине 70-х годов.
is_gabriel_3=Габриэль 3,,ПКР,«Габриэль 3» — израильская противокорабельная ракета малой дальности с маловысотным (несколько метров) профилем полёта, оснащенная активной радиолокационной головкой самонаведения. Это модернизированная версия ракеты «Габриэль 2» с измененной носовой частью для размещения усовершенствованной активной РЛГСН, позволяющая использовать принцип «выстрелил и забыл».
is_gabriel_3as=Габриэль 3AS,,«Габриэль 3AS» — израильская противокорабельная ракета малой дальности с маловысотным (несколько метров) профилем полёта, оснащенная активной радиолокационной головкой самонаведения. Это авиационная версия ракеты «Габриэль 3» с увеличенной дальностью и модифицированным фюзеляжем.

it_seakiller_2=Си Киллер,,ПКР,«Си Киллер 2» – противокорабельная ракета малой дальности, разработанная в Италии в 1960-е годы. Эти ракеты были закуплены Ираном для вооружения фрегатов типа «Алванд» и использовались во время ирано-иракской войны 1980-1988 гг.
it_otomat_mk1=Отомат,,ПКР,Отомат MK1 – противокорабельная ракета средней дальности, разработанная совместно Италией и Францией в 1970-х годах. Устанавливается на кораблях итальянского ВМФ, а также поставляется на экспорт.

jasdf_asm-1=ASM-1,,ПКР,ASM-1 – противокорабельная ракета средней дальности, разработанная в Японии в 70х годах. Большое влияние на её конструкцию оказали ракеты «Экзосет» и «Гарпун».

fr_as12=AS.12,,ПКР,AS.12 — это управляемая противокорабельная ракета малой дальности, французского производства, применяемая с вертолетов. Представляет собой увеличенную версию ПТУР АS.11 с увеличенным двигателем и значительно большей боевой частью. Способна представлять серьезную угрозу для катеров и небольших кораблей.
fr_am-39=AM39,Экзосет,ПКР,«Экзосет» – широко известная противокорабельная ракета французской разработки, состоящая на вооружениии флотов и ВВС многих стран с середины 1970-х гг. AM39 является авиационным вариантом ракеты, запускаемым с самолётов, или тяжелых вертолётов.
fr_mm-38=MM38,Экзосет,ПКР,«Экзосет» – широко известная противокорабельная ракета французской разработки, состоящая на вооружениии флотов и ВВС многих стран с середины 1970-х гг. MM38 является корабельным вариантом ракеты.
fr_sm-39=SM39,Экзосет,ПКР,ПКР,«Экзосет» – широко известная противокорабельная ракета французской разработки, состоящая на вооружениии флотов и ВВС многих стран с середины 1970-х гг. SM39 является вариантом для пуска с подводных лодок; благодаря созданию на базе модернизированной AM39 Mod 2 она имеет лучшую помехозащищённость и большую дальность, чем корабельный «Экзосет».

knm_penguin_mk2=AGM-119,Пингвин Mk2,ПКР,AGM-119 «Пингвин» – малоразмерная противокорабельная ракета авиационного и корабельного базирования, созданная совместно Норвегией и США.

plan_sy-1=SY-1,,ПКР,SY-1 - китайская противокорабельная ракета, являющаяся лицензионной копией советской П-15 «Термит».
plan_sy-1a=SY-1A,,ПКР,SY-1A - китайская противокорабельная ракета, разработанная на основе советской П-15 «Термит».
plan_hy-1=HY-1,,ПКР,HY-1 - китайская противокорабельная ракета, разработанная на основе советской П-15 «Термит».
plan_hy-1j=HY-1J,,ПКР,HY-1J - китайская противокорабельная ракета, разработанная на основе советской П-15 «Термит». Является дальнейшим развитием оригинальной ракеты.
plan_hy-1a=HY-1A,,ПКР,HY-1A - китайская противокорабельная ракета, разработанная на основе советской П-15 «Термит». По сравнению с HY-1J обладает улучшеной ГСН и имеет более низкую высоту полёта, что осложняет её перехват.
plan_hy-2=HY-2,,ПКР,HY-2 - китайская противокорабельная ракета, являющаяся дальнейшим развитием П-15. По характеристикам примерно соответствует П-20.
pla_hy-3=HY-3,,ПКР,HY-3 - китайская противокорабельная ракета берегового базирования. Разработка завершилась в начале 90х годов, на вооружение не принята.
plan_hy-4=HY-4,,ПКР,Ракета HY-4 — китайская противокорабельная ракета берегового базирования, модификация ракеты HY-2, в которой турбореактивный двигатель заменил первоначальную жидкостную ракетную двигательную установку. Это позволяет значительно увеличить дальность полета, хотя громоздкий фюзеляж HY-4 означает, что большую часть полета она летит на относительно большой высоте и с низкой скоростью.
pla_yj-1=YJ-1,,ПКР,YJ-1 - китайская противокорабельная ракета воздушного базировния разработанная в конце 70-х годов. В целом признана неудачной.
pla_yj-6=YJ-6,,ПКР,YJ-6 - китайская противокорабельная ракета воздушного базировния разработанная на основе ракеты HY-2. Является отдалённым потомком советской ракеты П-15 "Термит".
plan_yj-8=YJ-8,,ПКР,YJ-8 - китайская противокорабельная ракета, похожая внешне и по характеристикам на французскую ПКР Экзосет.

usn_agm-12b=AGM-12B,Булпап Б,ПКР,«Булпап» — американская  управляемая ракета малой  дальности, которая может применяться как по наземным целям, так и по кораблям и судам.
usn_agm-123=AGM-123,Шкипер,ПКР,«Шкипер» — американская противокорабельная управляемая ракета малой и средней дальности, созданная путем объединения бомбы с лазерным наведением Paveway II и твердотопливного ракетного ускорителя. Была создана как альтернатива ПКР «Гарпун», использование которой в водах с оживленным гражданским судоходством, таких как Персидский залив, оказалось слишком рискованным, так как  ракета с автономным радиолокационным наведением с высокой долей вероятности могла поразить нейтральные коммерческие суда.
usn_agm-84a=AGM-84A,Гарпун,ПКР,«Гарпун» — американская противокорабельная ракета, широко используемая в НАТО. Ракета имеет активную радиолокационную ГСН, которая активируется после следования по заранее запрограммированному маршруту.\n\nВариант AGM-84A предназначен для авиационного базирования и создавался в основном для поражения всплывших субмарин. Для повышения вероятности попадания он выполняет манёвр "горка" позволяющий атаковать цель сверху.
usn_agm-84c=AGM-84C,Гарпун,ПКР,«Гарпун» — американская противокорабельная ракета, широко используемая в НАТО. Ракета имеет активную радиолокационную ГСН, которая активируется после следования по заранее запрограммированному маршруту.\n\nМодификация AGM-84C является ракетой авиационного базирования и отличается от версии "А" отсутствием "горки" - вместо этого ракета снижается до 6 метров над поверхностью моря, что сводит на нет эффективность ЗРК пытающихся её перехватить.
usn_agm-84d=AGM-84D,Гарпун,ПКР,«Гарпун» — американская противокорабельная ракета, широко используемая в НАТО. Ракета имеет активную радиолокационную ГСН, которая активируется после следования по заранее запрограммированному маршруту.\n\nМодификация AGM-84D предназначена для авиационного базирования и отличается улучшенной помехозащищенностью. Применение нового топлива позволило увеличить дальность почти вдвое. Выполняет атаку на конечном участке в зависимости от типа цели: "горка" выполняется при атаке всплывших субмарин и малых кораблей, при атаке крупных целей ракета, наоборот, снижается до 6м над поверхностью моря. Принята на вооружение и начала поступать в войска в 1985г.

usn_rgm-84a=RGM-84A,Гарпун,ПКР,«Гарпун» — американская противокорабельная ракета, широко используемая в НАТО. Ракета имеет активную радиолокационную ГСН, которая активируется после следования по заранее запрограммированному маршруту.\n\nВариант RGM-84A является ракетой корабельного базирования и создавался в основном для поражения всплывших субмарин. Для повышения вероятности попадания он выполняет манёвр "горка" позволяющий атаковать цель сверху.
usn_rgm-84c=RGM-84C,Гарпун,ПКР,«Гарпун» — американская противокорабельная ракета, широко используемая в НАТО. Ракета имеет активную радиолокационную ГСН, которая активируется после следования по заранее запрограммированному маршруту.\n\nМодификация RGM-84C является ракетой корабельного базирования и отличается от версии "А" отсутствием "горки" - вместо этого ракета снижается до 6 метров над поверхностью моря, что сводит на нет эффективность ЗРК пытающихся её перехватить.
usn_rgm-84d=RGM-84C,Гарпун,ПКР,«Гарпун» — американская противокорабельная ракета, широко используемая в НАТО. Ракета имеет активную радиолокационную ГСН, которая активируется после следования по заранее запрограммированному маршруту.\n\nМодификация RGM-84D является ракетой корабельного базирования и представляет собой адаптацию авиационной модификации "Д", отличаеющейся улучшенной помехозащищенностью. Применение нового топлива позволило увеличить дальность почти вдвое. Выполняет атаку на конечном участке в зависимости от типа цели: "горка" выполняется при атаке всплывших субмарин и малых кораблей, при атаке крупных целей ракета, наоборот, снижается до 6м над поверхностью моря. Принята на вооружение и начала поступать в войска в 1985г.
usn_rgm-109b=RGM-109B,Томагавк,ПКР,RGM-109B «Томагавк», также известная под аббревиатурой TASM – противокорабельная модификация знаменитой американской крылатой ракеты. TASM – это ПКР большой дальности, с активной головкой самонаведения и дополнительным пассивным каналом поиска целей, излучающих радиоволны. Ракета подходит к цели на предельно малой высоте и может совершать противозенитные маневры. Главный недостаток противокорабельного «Томагавка» – это слишком маленькая скорость для её дальности полета при применении по движущимся группам кораблей.

usn_ugm-84a=UGM-84A,Гарпун,ПКР,«Гарпун» — американская противокорабельная ракета, широко используемая в НАТО. Ракета имеет активную радиолокационную ГСН, которая активируется после следования по заранее запрограммированному маршруту.\n\nМодификация UGM-84A  предназначена для использования с подводных лодок и может запускаться из 533мм торпедных аппаратов в подводном положении. Единственным отличием от RGM-84A является наличие капсулы для перемещения под водой и выхода на поверхность.
usn_ugm-84b=UGM-84B,Гарпун,ПКР,«Гарпун» — американская противокорабельная ракета, широко используемая в НАТО. Ракета имеет активную радиолокационную ГСН, которая активируется после следования по заранее запрограммированному маршруту.\n\nМодификация UGM-84B предназначена для использования с подводных лодок и может запускаться из 533мм торпедных аппаратов в подводном положении. Отличается от версии "А" отсутствием "горки" - вместо этого ракета снижается до 6 метров над поверхностью моря, что сводит на нет эффективность ЗРК пытающихся её перехватить. Эта версия ракеты создавалась специально для ВМФ Великобритании.
usn_ugm-84c=UGM-84C,Гарпун,ПКР,«Гарпун» — американская противокорабельная ракета, широко используемая в НАТО. Ракета имеет активную радиолокационную ГСН, которая активируется после следования по заранее запрограммированному маршруту.\n\nМодификация UGM-84B предназначена для использования с подводных лодок и может запускаться из 533мм торпедных аппаратов в подводном положении. Отличается от версии "А" отсутствием "горки" - вместо этого ракета снижается до 6 метров над поверхностью моря, что сводит на нет эффективность ЗРК пытающихся её перехватить. Эта версия ракеты создавалась специально для ВМФ Великобритании.
usn_ugm-109b=UGM-109B,Томагавк,ПКР,UGM-109B «Томагавк», также известная под аббревиатурой TASM – противокорабельная модификация знаменитой американской крылатой ракеты. TASM – это ПКР большой дальности, с активной головкой самонаведения и дополнительным пассивным каналом поиска целей, излучающих радиоволны. Ракета подходит к цели на предельно малой высоте и может совершать противозенитные маневры. Главный недостаток противокорабельного «Томагавка» – это слишком маленькая скорость для её дальности полета при применении по движущимся группам кораблей.\n\nМодификация UGM-109B предназначена для использования с подводных лодок и может запускаться из 533мм торпедных аппаратов в подводном положении.

wp_as-2=К-10С,Комета-10,ПКР,Противокорабельная ракета авиационного базирования, разработанная во второй половине 1950-х гг. на замену ранней ПКР КС-1. В отличие от предшественницы, новая ракета имела сверхзвуковую скорость полёта при вдвое большей дальности. С начала 60-х годов этими ПКР оснащались модифицированные бомбардировщики Ту-16, перепрофилированные в морские ракетоносцы. К началу 1980-х годов данная ракета уже могла считаться устаревшей из-за большой высоты полёта, заметности и малой помехозащищенности.
wp_as-4=Х-22,Буря,ПКР,Х-22 «Буря» – советская сверхзвуковая противокорабельная ракета большой дальности авиационного базирования. Высокая скорость полёта обеспечивается жидкостным реактивным двигателем. Основным носителем данной ПКР являются самолёты семейства Ту-22.
wp_as-6=КСР-5,,ПКР,КСР-5 – советская свурхзвуковая противокорабельная ракета большой дальности с жидкостным реактивным двигателем. В целом аналогична ракете Х-22, но может применяться с Ту-16 модификации Ту-16К-26.
wp_as-7=Х-23,,ПКР,Х-23 – советская сверхзвуковая ракета авиационного базирования малой дальности, которая может применяться как по наземным целям, так и по кораблям и судам.
wp_as-10=Х-25,,ПКР,Х-25 – советская сверхзвуковая ракета авиационного базирования малой дальности, которая может применяться как по наземным целям, так и по кораблям и судам. В отличие от предшественницы Х-23 имеет не радиокомандное, а лазерное наведение.
wp_as-13=Х-59,Овод,ПКР,Х-59 «Овод» – советская дозвуковая авиационная ракета типа «воздух-поверхность», способная поражать как наземные, так и надводные цели. Принята на вооружение в начале 80-х годов и использовалась в основном с бомбардировщиков Су-24М. Система наведения инерционная + телекомандная на финальном этапе полёта.
wp_as-14a=Х-29Л,,ASM,Х-29Л – советская сверхзвуковая ракета авиационного базирования малой дальности с лазерным наведением, которая может применяться как по наземным целям, так и по кораблям и судам. Отличается мощной боеголовкой и предназначена для применения по крупным и хорошо защищённым целям.
wp_as-14b=Х-29Т,,ASM,Х-29Т – советская сверхзвуковая ракета авиационного базирования малой дальности с телевизионным наведением, которая может применяться как по наземным целям, так и по кораблям и судам. Имеет несколько большую дальность чем Х-29Л и не требует подсветки лазером, однако в условиях плохой видимости или ночью дальность применения существенно снижается.

wp_ss-n-2=П-15У,Термит,ПКР,П-15 «Термит» – советская дозвуковая ПКР относительно небольших размеров, разработанная в середине 1950-х годов. Производилась в Китае по лицензии как HY-2. Может применяться с небольших надводных кораблей и катеров и береговых пусковых установок.\nП-15У  — модификация ракеты со складным крылом, принятая на вооружение в 1965 году. Именно эта версия применялась в конфликтах 60-х годов.
wp_ss-n-2c=П-15М,Термит,ПКР,П-15 «Термит» – советская дозвуковая ПКР относительно небольших размеров, разработанная в середине 1950-х годов. Модификация П-15М была принята на вооружение в 1972 году и получила вдвое большую дальность, также была улучшена помехозащищенность ракеты. Может использоваться для атаки береговых целей.
wp_ss-n-3=П-35,,ПКР,П-35 - советская противокорабельная ракета большой дальности. Наличие радиокомандного управления на маршевом участке устраняет главный недостаток ракет с АРГСН - невозможность выбора цели, а так же позволяет получать информацию об обнаруженных ракетой контактах. Мощная боеголовка гарантирует потопление или серьёзные повреждения целей любого класса. Тем не менее, ракета уверенно поражается современными ЗРК, что существенно ограничивает область её применения. Успешное применение возможно либо при отсутствии или подавлении ПРО противника, либо при скрытной атаке противника, соблюдающего радиомолчание. В последнем случае необходим переход на ручное управление для правильной координации атаки.
wp_ss-n-3b=Прогресс,,ПКР,3M44 Прогресс - советская противокорабельная ракета большой дальности. Является модернизацией ПКР П-35. Имеет повышенную помехозащищённость и сниженную высоту полёта на конечном участке траектории.\n\nНаличие радиокомандного управления на маршевом участке устраняет главный недостаток ракет с АРГСН - невозможность выбора цели, а так же позволяет получать информацию об обнаруженных ракетой контактах. Мощная боеголовка гарантирует потопление или серьёзные повреждения целей любого класса. Тем не менее, ракета уверенно поражается современными ЗРК, что существенно ограничивает область её применения. Успешное применение возможно либо при отсутствии или подавлении ПРО противника, либо при скрытной атаке противника, соблюдающего радиомолчание. В последнем случае необходим переход на ручное управление для правильной координации атаки.
wp_ss-n-7=П-70,Аметист,ПКР,П-70 «Аметист» – советская противокорабельная ракета средней дальности с твердотопливным двигателем и первая в мире ПКР, способная стартовать из-под воды. Поступила на вооружение атомных подводных лодок проекта 670 «Скат» и самой скоростной в мире подводной лодки проекта 661 «Анчар».
wp_ss-n-9=П-120,Малахит,ПКР,П-120 «Малахит» является дальнейшим развитием противокорабельной ракеты подводного старта П-70 «Аметист». Помимо увеличенной дальности пуска и улучшенной системы самонаведения конструкция этой ракеты позволяла, в отличие от П-70 применят её не только с подводных лодок, но и с надводных кораблей. П-120 стала основным оружием атомных подводных лодок проекта 670М «Чайка» и малых ракетных кораблей проекта 1234 «Овод».
wp_ss-n-12=П-500,Базальт,ПКР,П-500 «Базальт» – советская противокорабельная ракета большой дальности, развивающая концепцию П-35 и предназначенная для её замены на вновь строящихся и модернизируемых кораблях. Данными ракетами вооружались тяжелые авианесущие крейсера проекта 1143 «Кречет» и ракетные крейсера проекта 1164 «Атлант».
wp_ss-n-19=П-700,Гранит,ПКР,П-700 Гранит - советская сверхзвуковая противокорабельная ракета большой дальности. Предназначена для борьбы с авианосными группировками. При атаке надводной цели, ракеты самостоятельно организуются в группу для одновременного подхода к зоне атаки. Ракеты распределяют цели и одна группа можеет поразить до пяти разных целей. Для преодоления ПРО ракеты выполняют манёвры и применяют средства радиоэлектронного противодействия. Также возможно применение «Гранита» по неподвижным наземным целям на побережье. Ввиду невысокой точности в этом режиме, рекомендуется использование только против крупных целей: портов, аэродромов и т.п.
wp_ss-n-22=П-270,Москит,ПКР,П-270 «Москит» - маловысотная сверхзвуковая противокорабельная ракета советского производства. Неплохая дальность, высокая помехозащищённость, сверхзвуковая скорость и низкая высота полёта на конечном участке траектории делают эту ракету одной из опаснейших в мире. К слабым сторонам стоит отнести присущий всем АРГСН недостаток: ракета наводится на самую крупную цель, что делает невозможной избирательную атаку нескольких целей и осложняет ведение боя в присутствии крупных гражданских судов.

#----------- Land Strike only missiles---------
wp_as-4b=Х-22МП,Буря,Ракета воздух-поверхность,Х-22МП – модификация советской сверхзвуковой противокорабельной ракеты авиационного базирования Х-22, предназначенная для нанесения ударов по наземным целям. Система наведения – инерциальная с коррекцией по источникам радиоизлучения (в игре - чисто инерциальная). Точчность ракеты оставляет желать лучшего, поэтому она пригодна лишь для атаки площадных наземных целей, таких как аэродромы, порты и т.п.

fr_as11=AS.11,,ПТУР,AS.11 - управляемая противотанковая ракета малой дальности французского производства. Данная модель оснащена полубронебойной боеголовкой для поражения небольших судов.

usn_agm-65b=AGM-65B,Maverick,Ракета воздух-поверхность,AGM-65B «Мэверик» – американская ракета авиационного базирования с телекомандным наведением. Предназначена для атаки в первую очередь наземных целей, но может исспользоваться и по кораблям.
usaf_agm-86c=AGM-86C,Крылатая ракета,ASM,«Конвенциональная крылатая ракета воздушного пуска» (CALCM) — американская крылатая ракета класса "воздух-земля", являющаяся основным оружием бомбардировщика B-52. После запуска эти ракеты летят по заранее запрограммированному маршруту к цели без участия пусковой платформы, используя сопоставление контуров рельефа местности с помощью радара картографирования рельефа местности и бортовых цифровых карт.

usn_rgm-109c=RGM-109C,Tomahawk,Крылатая ракета,Модификация крылатой ракеты «Томагавк», также известная под аббревиатурой TLAM и предназначенная для нанесения высокоточных ударов по наземным целям с обычной (неядерной) боеголовкой. Ракета следует к цели по программируемому маршруту на сверхмалой высоте с обходом рельефа местности по цифровым картам, заложенным в память системы наведения ракеты перед запуском.

usn_ugm-109c=UGM-109C,Tomahawk,Крылатая ракета,Модификация крылатой ракеты «Томагавк», также известная под аббревиатурой TLAM и предназначенная для нанесения высокоточных ударов по наземным целям с обычной (неядерной) боеголовкой. Ракета следует к цели по программируемому маршруту на сверхмалой высоте с обходом рельефа местности по цифровым картам, заложенным в память системы наведения ракеты перед запуском.\n\nМодификация UGM-109C предназначена для использования с подводных лодок и может запускаться из 533мм торпедных аппаратов в подводном положении. Для обеспечения подводного запуска, ракета не может быть полностью заправлена, поэтому она обладает меньшей дальностью чем корабельный вариант.

usa_bgm-71a=BGM-71A,BGM-71A TOW,ПТУР,BGM-71 «Тоу» – американская противотанковая ракета с проводным управлением. Данная ракета может устанавливаться как на вертолёты, так и на наземную боевую технику.
usa_bgm-71c=BGM-71C,I-TOW,ПТУР,BGM-71 «Ай-Тоу» — американская противотанковая ракета с проводным управлением. Применяется как с вертолётов, так и с бронетехники. Это модернизированная версия I-TOW с увеличенной дальностью, как у BGM-71B, и выносным зондом для преодоления современной танковой брони, хотя против новейших советских танков её возможностей может быть недостаточно.
usa_bgm-71d=BGM-71D,TOW 2,ПТУР,BGM-71D «Тоу» 2 — американская противотанковая ракета с проводным управлением. Применяется как с вертолётов, так и с бронетехники. Это переработанная версия исходной BGM-71 TOW с гораздо более мощной боевой частью и улучшенным двигателем, что позволяет ей уверенно поражать современные бронированные цели.

wp_at-6=9М114,Кокон,ПТУР,9M114 «Кокон» - советская сверхзвуковая противотанковая управляемая ракета, входящая в состав комплекса «Штурм». Отличается сравнительно большой дальностью полёта, высокой скоростью и мощной боеголовкой.\n\n Комплексом «Штурм-В» оснащались боевые вертолёты Ка-29 и Ми-24 разных модификаций.
wp_at-10=9М117,Бастион,ПТУР,9М117 - советская противотанковая управляемая ракета, входящая в состав комплекса «Бастион». Запускается через 100мм пушку танка Т-55М и не требует отдельной пусковой установки.

# ---------- Anti-sub  Missilies ----------
ran_ikara=GWS-40,Икара,ПЛУР,GWS-40 Икара — австралийская противолодочная управляемая ракета, несущая торпеду Mk-46 (или Mk-44). Хотя дальность её действия вдвое превышает дальность американской RUR-5 АСРОК, Икара несколько медленнее. Также, конструкция пусковой установки не обеспечивает высокую скорострельность.

usn_rur-5=RUR-5,ASROC,ПЛУР,RUR-5 ASROC (от Anti-Submarine Rocket, то есть «противолодочная ракета») является средством дистанционного поражения подводных лодок, разработанным как альтернатива традиционным противолодочным бомбомётам в 1950-е годы в США. Состоит из твердотопливной баллистичесской ракеты и противолодочной торпеды Mk-46, отделяемой над точкой прицеливания и спускающейся в воду на парашюте. 

wp_apr-2=АПР-2,,Торпеда,АПР-2 – советская авиационная противолодочная торпеда с реактивным двигателем. После сброса торпеда ищет цель, двигаясь по спирали на малой скорости, после захвата цели системой наведения включается двигатель и торпеда осуществляет перехват цели в неуправляемом режиме на высокой скорости.
wp_ss-n-14a=УРПК-3,Метель,ПЛУР,УРПК-3 «Метель» – советский противолодочный ракетный комплекс, состоящий из крылатой ракеты 85Р и подвешенной к ней противолодочной торпеды АТ-2. Управление ракетой радиокомандное. Дальность полета достигает 50км, но реальная дальность применения зависит от средств обнаружения подводных целей.
wp_ss-n-14b=УРК-5,«Раструб-Б»,ПЛУР/ПКР,УРК-5 «Раструб-Б» – советский ракетный комплекс универсального назначения (противолодочный и противокорабельный), состоящий из ракеты 85РУ и подвешенной к ней противолодочной торпеды УМГТ-1. Радиокомандная система управления дополнена инфракрасной системой самонаведения на самой ракете. Может применяться по надводным целям, хотя в качестве ПКР эта ракета представляет собой сравнительно крупную высоколетящую и медленную цель, уступая по многим параметрам обычным ПКР.
wp_ss-n-16=РПК-6М,«Водопад»,ПЛУР,Советский противолодочный ракетный комплекс, оснащенный малогабаритной противолодочной торпедой УМГТ-1. Принят на вооружение в 1981 году. Может запускаться из 533мм торпедных аппаратов подводных лодок из подводного положения, либо из специально разработанных неподвижных пусковых установок надводных кораблей.

# ------------------ RBU ------------------
knm_terne_shell=Terne III Mortar,,Противолодочный бомбомёт,«Терне» – норвежский реактивный противолодочный бомбомёт, разработанный в 1960-е гг.

plan_type62dc=FQF-1200,,Противолодочный бомбомёт,FQF-1200 - китайский 5-ствольный реактивный противолодочный бомбомёт.
plan_type75dc=FQF-2500,,Противолодочный бомбомёт,FQF-2500 - китайский 12-ствольный реактивный противолодочный бомбомёт.

rn_limbo_shell=LIMBO Mortar,,Противолодочный бомбомёт,«Лимбо» (или противолодочный бомбомёт Mark 10) - противолодочный бомбомёт британского производства 1950-х годов. При наведении с помощью корабельного гидролокатора он выстреливает три глубинные бомбы треугольником вокруг цели.
rn_squid_shell=SQUID Mortar,,Противолодочный бомбомёт,«Сквид» - это старый противолодочный бомбомёт британского производства времен Второй мировой войны. При наведении с помощью корабельного гидролокатора он выстреливает три глубинные бомбы треугольником вокруг цели.

swe_375mm_rocket=Bofors M/50,,Противолодочный бомбомёт,Bofors M/50 это 375мм реактивный бомбомёт производимый шведской компание Бофорс. Состоял на вооружении Морских сил самообороны Японии под наименованием Тип 71.

wp_rgb-10=РБУ-1000,Смерч-3,Противолодочный бомбомёт,РБУ-1000 «Смерч-3» – это советский 300мм реактивный бомбомёт. Имеет дальность стрельбы около 1000 метров, предназначен для уничтожения подводных лодок и атакующих торпед.
wp_rgb-12=РБУ-1200,Ураган,Противолодочный бомбомёт,РБУ-1200 «Ураган» – это советский 252мм реактивный бомбомёт. Имеет дальность стрельбы около 1200 метров, предназначен для уничтожения подводных лодок и атакующих торпед.
wp_rgb-25=РБУ-2500,,Противолодочный бомбомёт, РБУ-2500 «Смерч» – это 213мм советский реактивный бомбомёт. Имеет дальность стрельбы около 2500 метров, предназначен для уничтожения подводных лодок и атакующих торпед.
wp_rgb-60=РБУ-6000,,Противолодочный бомбомёт,РБУ-6000 «Смерч-2» – это 213мм советский реактивный бомбомёт. Имеет дальность стрельбы около 5000 метров, предназначен для уничтожения подводных лодок и атакующих торпед.

# --------------- Torpedoes ---------------
fr_e15=E15,,Противокорабельная торпеда,E15 – экспортная версия французской 55см торпеды E12, предназначенная для использования против кораблей и судов. Система самонаведения – пассивная акустическая.
fr_l3=L3,,Противолодочная торпеда,L3 – 55см противолодочная акустическая торпеда французской разработки 1960-х годов.
fr_l5_mod3=L5 Mod 3,,Противолодочная торпеда,L5 — Французская 55-сантиметровая противолодочная торпеда средней грузоподъемности. Это более быстрая и дальноходная версия торпеды L3, предназначенная для атаки скоростных подводных лодок.
fr_f17_mod1=F17 Mod 1,,Противокорабельная торпеда,F17 Mod 1 — французская тяжёлая 553-мм противокорабельная торпеда с проводным управлением. Это более быстрая и дальноходная версия противокорабельной торпеды E15 с проводным управлением для маневрирования или хода под слоем скачка, а также двумя скоростными режимами.
fr_f17_mod2=F17 Mod 2,,Универсальная торпеда,F17 Mod 2 — французская тяжёлая 553-мм универсальная торпеда с проводным управлением. Это модернизированная версия исходной F17 с возможностью поражения подводных лодок благодаря активно-пассивной ГСН, более высокой скоростью, большей глубиной хода и увеличенной дальностью.
fr_f17p=F17P,,Универсальная торпеда,F17P («Polyvalent») — французская тяжёлая 553-мм универсальная торпеда с проводным управлением. Это экспортная модернизация исходной F17 с возможностью поражения подводных лодок благодаря активно-пассивной ГСН; торпеда двойного назначения может применяться как с кораблей, так и с подводных лодок.

ger_dm1=DM1,Seeschlange,Противолодочная торпеда,DM1 «Зеешланге» (морской змей) – противолодочная торпеда западногерманской разработки, принятая на вооружение в середине 1970-х гг. Помимо акустического самонаведения может управляться по проводам. Специально адаптирована для использования в водах Балтики.
ger_dm2=DM2,Seeaal,Противокорабельная торпеда,DM2A1 «Зееаль» (морской угорь) – западногерманская противокорабельная торпеда с пассивным акустическим самонаведением и управлением по проводам. Принята на вооружение в конце 60-х годов. Может применятся с подводных лодок и торпедных катеров (без телеуправления).
ger_sst4=SST4,,Противокорабельная торпеда,Западногерманская противокорабельная торпеда с пассивным акустическим самонаведением и управлением по проводам. Разработана в начале 70-х годов для поставок на экспорт. Эти торпеды применялись аргентинским флотом в войне 1982 года.

it_a-244s_air=A-244,,Противолодочная торпеда,А-244 - лёгкая самонаводящаяся противолодочная торпеда итальянского производства.

jmsdf_type80=Тип 80,,Универсальная торпеда,тип 80 - телеуправляемая универсальная торпеда калибра 483мм, разработана в рамках исследовательских программ GRX-1 и GRX-2 1970-х годов и на основе американской Mark 37. Находится на вооружении Морских сил самообороны Японии с 1980г.
jmsdf_type54=Тип 54,,Универсальная торпеда,Первая торпеда, разработанная японцами после Второй мировой войны. Изначально довольно неудачная и склонная к отказам после запуска, она прошла через несколько модификаций, в конечном итоге превратившись в серийно выпускаемый вариант Model 3 Mod 1.

knm_tp612=TP612,,Противокорабельная торпеда,TP612 – 533мм шведская противокорабельная торпеда без самонаведения управляемая по проводам. Является дальнейшим развитием торпеды TP611, но имеет пониженную шумность и может запускаться из торпедных аппаратов самовыходом.
knm_tp613=TP613,,Противокорабельная торпеда,TP613 – 533мм шведская противокорабельная торпеда с пассивным акустическим самонаведением и управлением по проводам. Дальнейшее развитие торпеды TP612.

plan_yu-1=Ю-1,,Противокорабельная торпеда,Ю-1 — первая китайская тяжёлая торпеда отечественного производства. Эти прямоходные торпеды относительно просты, а потому надёжны и эффективны.
plan_yu-1g=Ю-1G,,Противокорабельная торпеда,Ю-1G - модификация торпеды Ю-1, оснащённая пассивной системой самонаведения.
plan_yu-3=Ю-3,,Противокорабельная торпеда,«Ю-3» — китайская тяжёлая противолодочная торпеда с пассивной ССН. Эта торпеда, обладает низкой скоростью и лучше всего подходит для атаки дизель-электрических подводных лодок, так как более быстрые цели могут легко от неё уйти.
plan_yu-4=Ю-4A,,Противокорабельная торпеда,Ю-4A - китайская тяжёлая противокорабельная торпеда c пассивным наведением. Она обладает низкой скоростью и поэтому эффективна только на очень близких дистанциях.

rn_mark9_mod2=Mk 9,,Противокорабельная торпеда,Mark IX** – британская противокорабельная торпеда, разработанная во время Второй мировой войны. Создана на базе прямоидущей торпеды Mark IX разработки 1930-х годов. Помимо увеличения дальности хода, торпеда получила пассивную акустическую головкуу самонаведения.
rn_mark8_mod4=Mk 8,,Противокорабельная торпеда,Британская торпеда Mark VIII Mod 4 — это прямоходная противокорабельная торпеда, появившаяся во время Второй мировой войны. Это последняя версия серии Mark 8, запускавшихся с подводных лодок в 1920-х годах, и она использовалась Королевским флотом вплоть до 1980-х годов, поскольку не существовало достаточно адекватной замены.
rn_mark20s=Mk 20S,Биддер,Противолодочная торпеда,Mark 20S «Биддер» — британская противолодочная торпеда, с дополнительной возможностью поражения кораблей, разработанная в 1950-х годах. Она считалась устаревшей ещё до поступления на вооружение. Mark 20S является вариантом для пуска с подводных лодок. \nБудучи первой самонаводящейся торпедой Королевского флота такого типа, она отличалась крайне низкой надёжностью, малой дальностью, низкой скоростью и слабой ГСН, что делало её непригодной против современных целей. Это оружие оставалось на вооружении до 1970-х годов благодаря возможности запуска из кормовых торпедных аппаратов подводных лодкам классов «Оберон» и «Порпойз».
rn_mark23=Mk 23,Грог,Противолодочная торпеда,Торпеда Mark 23 «Грог» — британская противолодочная торпеда среднего веса 1950-х годов с возможностью поражения кораблей, считавшаяся устаревшей ещё до поступления на вооружение. Mark 23 представляет собой значительное усовершенствование оригинальной торпеды Mark 20, с удлинённым батарейным отсеком и возможностью проводного наведения, хотя она по-прежнему унаследовала от «Биддер» крайне слабую систему наведения и низкую скорость. Из-за низкой надёжности и характеристик этого оружия его возможности против современных подводных лодок и надводных кораблей, в лучшем случае, сомнительны.

usn_mk16=Mk-16,,Противокорабельная торпеда,Торпеда Mark 16 — это прямоходная торпеда времён Второй мировой войны, использовавшаяся в 1950-х и 1960-х годах в качестве быстроходной, очень мощной противокорабельной торпеды на американских подводных лодках. \nВариант Mod 8 сочетает в себе мощную боеголовку от Mod 0 и большую дальность действия торпеды Mod 1.
usn_mk37=Mk-37 Mod 0,,Универсальная торпеда,Торпеда Mark 37 — это стандартная легкая противолодочная торпеда ВМС США, используемая во многих странах. Производимая с 1959 года она неэффективна против атомных субмарин, так как не обладает достаточной скоростью чтобы догнать их.
usn_mk37_mod1=Mk-37 Mod 1,,Универсальная торпеда,Торпеда Mark 37 — это стандартная легкая противолодочная торпеда ВМС США, используемая во многих странах. Производимая с 1959 года она неэффективна против атомных субмарин, так как не обладает достаточной скоростью чтобы догнать их.\n\nВ версии Mod 1 добавлено наведение по проводам, но зато несколько снижена скорость.
usn_mk37_mod3=Mk-37 Mod 3,,Универсальная торпеда,Торпеда Mark 37 — это стандартная легкая противолодочная торпеда ВМС США, используемая во многих странах. Производимая с 1959 года она неэффективна против атомных субмарин, так как не обладает достаточной скоростью чтобы догнать их.\n\nMod 3 включает в себя новую систему наведения для повышения надёжности и дальности обнаружения, хотя остальная часть торпеды осталась неизменной по сравнению с оригинальной Mod 0.
usn_mk37_mod2=Mk-37 Mod 2,,Универсальная торпеда,Торпеда Mark 37 — это стандартная легкая противолодочная торпеда ВМС США, используемая во многих странах. Производимая с 1959 года она неэффективна против атомных субмарин, так как не обладает достаточной скоростью чтобы догнать их.\n\nПротиволодочная торпеда,Mod 2 представляет собой проводную Mod 1с улучшенной ССН (такой же как и на Mod 3).
usn_mk37c=Mk-37C,,Универсальная торпеда,Торпеда Mark 37C — это модернизированная версия американской торпеды Mk-37, использующая топливо Отто и управляемая по проводам, и знасительно превосходит оригинальную Мк-37. Используемая исключительно экспортными партнерами начиная с середины 1970-х годов, торпеда Mk-37C (NT-37C) имеет улучшенную двигательную установку, обеспечивающую на 150% большую скорость и почти вдвое большую дальность хода, но при этом она немного шумнее.
usn_mk37e=Mk-37E,,Универсальная торпеда, торпеда Mark 37E — это модернизированная версия торпеды Mk-37C с возможностью самонаведения по кильватерному следу. Используемая исключительно экспортными партнерами, торпеда Mk-37E (NT-37E) имеет улучшенные противокорабельные возможности и незначительные усовершенствования двигательной установки, что делает её очень эффективной противолодочной и противокорабельной торпедой для середины 1980-х годов.
usn_mk44_air=Mk-44,,Противолодочная торпеда,Торпеда Mark 44 — это устаревшая противолодочная торпеда НАТО, широко применявшаяся на протяжении всей холодной войны. Несмотря на хорошую надежность, Mark 44 имеет малую дальность и низкую скорость, и плохо справляется с быстроходными глубоководными подводными лодками.\n\nДанная модель запускается с противолодочных вертолётов и самолётов.
usn_mk44_ship=Mk-44,,Противолодочная торпеда,Торпеда Mark 44 — это устаревшая противолодочная торпеда НАТО, широко применявшаяся на протяжении всей холодной войны. Несмотря на хорошую надежность, Mark 44 имеет малую дальность и низкую скорость, и плохо справляется с быстроходными глубоководными подводными лодками.\n\nДанная модель запускается из корабельных торпедных аппаратов.
usn_mk46_air=Mk-46,,Противолодочная торпеда,Mark-46 – малогабаритная 324мм противолодочная торпеда, ставшая фактически стандартным противолодочным средством стран НАТО.\n\nДанная модификация предназначена для использования авиацией, а также в качестве головной части ПЛУР ASROCK и оснащена парашютом.
usn_mk46_ship=Mk-46,,Противолодочная торпеда,Mark-46 – малогабаритная 324мм противолодочная торпеда, ставшая фактически стандартным противолодочным средством стран НАТО.\n\nДанная модификация предназначена для использования с надводных кораблей и запускается из торпедных аппаратов.
usn_mk46_mod5_air=Mk-46,Mod 5,Универсальная торпеда,Mark 46 Mod 5 NEARTIP малогабаритная 324мм противолодочная торпеда, ставшая фактически стандартным противолодочным средством стран НАТО.\n\nMk-46 Mod 5 NEARTIP (NEAR Term Improvement Program) — это полная модернизация торпеды Mk46; она обеспечивает большую дальность за счет более медленной и бесшумной фазы движения в район цели, улучшенные средства противодействия и модернизирована для наведения на надводные цели, хотя и с ограниченной эффективностью.\n\n Данная модификация предназначена для использования авиацией, а также в качестве головной части ПЛУР ASROCK и оснащена парашютом.
usn_mk46_mod5_ship=Mk-46,Mod 5,Универсальная торпеда,Mark 46 Mod 5 NEARTIP малогабаритная 324мм противолодочная торпеда, ставшая фактически стандартным противолодочным средством стран НАТО.\n\nMk-46 Mod 5 NEARTIP (NEAR Term Improvement Program) — это полная модернизация торпеды Mk46; она обеспечивает большую дальность за счет более медленной и бесшумной фазы движения в район цели, улучшенные средства противодействия и модернизирована для наведения на надводные цели, хотя и с ограниченной эффективностью.\n\nДанная модификация предназначена для использования с надводных кораблей и запускается из торпедных аппаратов.
usn_mk48=Mk-48,,Универсальная торпеда,Mark-48 – американская 533мм торпеда, предназначенная для вооружения подводных лодок. Была разработана в 1960-е годы для поражения новейших на тот момент и перспективных советских атомных подводных лодок и поступила на вооружение ВМФ США в 1972 году. Торпеда сочетает активно/пассивную акустическую систему самонаведения с управлением по проводам. Оснащена водометным движителем вместо винтов, двигатель торпеды работает на унитарном топливе.
usn_mk48_mod4=Mk-48 Mod 4,,Универсальная торпеда,Mark 48 Mod 4 — американская 533мм универсальная торпеда. Это очень быстрая и дальнобойная торпеда с проводным управлением и весьма совершенной ГСН. Версия Mod 4 является модернизацией 1980-х годов: она получила улучшенную ГСН для сопровождения самых современных целей, таких как АПЛ типа «Альфа», и двустороннее проводное управление, повышающее устойчивость к средствам противодействия.
usn_mk48_mod4_adcap=Mk-48 ADCAP,,Универсальная торпеда,Mark 48 Mod 4 ADCAP — американская 533мм универсальная торпеда. Это очень быстрая и дальнобойная торпеда с проводным управлением и весьма совершенной ГСН. Версия Mod 4 ADCAP, отдельная от программы новых торпед Mk-48 Mod 5 ADCAP, является модернизацией 1985 года для существующих торпед Mod 4 с новой качающейся шайбой и топливным насосом; она ещё больше расширила возможности базовой торпеды, обеспечив терминальную скорость 65 узлов и улучшенную ГСН для повышения устойчивости к средствам противодействия.

wp_45-36nu=45-36НУ,,Противокорабельная торпеда,45-36НУ – советская прямоидущая противокорабельная торпеда разработанная до Второй мировой войны. Уступает по мощности 533мм торпедам, однако недооценивать её тоже не стоит.
wp_53-38=53-38,,Противокорабельная торпеда,53-38 – советская прямоидущая противокорабельная торпеда времен Второй мировой войны. Сравнительно простое и надёжное оружие.
wp_53-39=53-39,,Противокорабельная торпеда,53-39 – советская прямоидущая противокорабельная торпеда времен Второй мировой войны. Сравнительно простое и надёжное оружие.
wp_53-56v=53-56,,Противокорабельная торпеда,53-56В – советская прямоидущая противокорабельная торпеда, созданная с учетом опыта Второй мировой войны.
wp_53-65K=53-65К,,Торпеда с кильватерным наведением,53-65К – советская 533мм противокорабельная торпеда с системой самонаведения по кильватерному следу цели. Пуск торпеды следует осуществлять, целясь за корму корабля противника. Торпеда захватывает кильватерный след и идет по нему «змейкой», догоняя цель. Чем быстрее идет цель и чем она больше, тем длиннее кильватерный след.
wp_65-76=65-76,,Торпеда с кильватерным наведением,65-75 – советская 650мм противокорабельная торпеда с системой самонаведения по кильватерному следу цели. Пуск торпеды следует осуществлять, целясь за корму корабля противника. Торпеда захватывает кильватерный след и идет по нему «змейкой», догоняя цель. Чем быстрее идет цель и чем она больше, тем длиннее кильватерный след. 650мм торпеда имеет дальность хода около 50 км и несёт мощный боезаряд. Предназначена для использования против крупных кораблей, например авианосцев.
wp_at-1=АТ-1,,Противолодочная торпеда,АТ-1 – советская электрическая противолодочная торпеда с акустическим самонаведением. Предназначена для использования с противолодочных вертолётов.
wp_at-2=AT-2,,Противолодочная торпеда,АТ-2 – советская 533мм авиационная противолодочная торпеда с акустическим самонаведением. Может применяться только противолодочными самолётами, а также является частью ПЛУР «Метель».
wp_set-40=СЭТ-40,,Противолодочная торпеда,СЭТ-40 – советская 400мм электрическая противолодочная торпеда с акустическим саамонаведением. Применяется в первую очередь подводными лодками как оружие самообороны.
wp_set-65=СЭТ-65,,Противолодочная торпеда,СЭТ-65 – советская 533мм электрическая противолодочная торпеда с активным акустическим самонаведением. В течение долгого времени различные модификации этой торпеды входили в состав вооружения всех типов советских подводных лодок с 533мм торпедными аппаратами и многих надводных кораблей.
wp_test-71=ТЭСТ-71,,Противолодочная торпеда,ТЭСТ-71 – советская 533мм электрическая противолодочная торпеда с управлением по проводам и активным акустическим самонаведением. Была разработана на основе СЭТ-65. Торпеды с проводным управлением не получили в советском ВМФ столь активного распространения, как в западных флотах.
wp_test-71m=ТЭСТ-71М,,Противолодочная торпеда,ТЭСТ-71М — советская 533мм электрическая противолодочная торпеда с проводным управлением. ТЭСТ-71М получила улучшенный цифровой блок наведения и модернизированный узел проводного управления, снявший прежние ограничения по управлению, что сделало стрельбу более гибкой.
wp_umgt-1=УМГТ-1,,Противолодочная торпеда,УМГТ-1 – советская 400мм авиационная противолодочная торпеда. Может использоваться самолётами, вертолётами, а также входит в состав противолодочных комплексов «Раструб-Б» и «Водопад». Большой шаг вперёд, по сравнению с АТ-1 и АТ-2. Поступила на вооружение в 1981 году.
wp_uset-80=УСЭТ-80,,Универсальная торпеда,УСЭТ-80 – советская универсальная 533мм электрическая торпеда, которая может применяться как против подводных лодок, так и против надводных кораблей. Дополнительно оснащена системой наведения по кильватерному следу, но не имеет управления по проводам. Входит в состав вооружения новейших советских подводных лодок.

# ------------------ Bombs -----------------
fr_samp_t25=SAMP-25,Бомба,SAMP тип 25 – это французская 230кг свободнопадающая бомба. Схожа с американской Mk-82.
fr_samp_t21=SAMP-21,Бомба,SAMP тип 21 – это французская 400кг свободнопадающая бомба. Аналог американской Mk-83.

pla_type-2=Тип 100-2,,Бомба,Тип 100-2 это китайская 100кг осколочно-фугасная свободнопадающая бомба, разработанная на основе советской ФАБ-100.
pla_type-3-250=Тип 250-3,,Бомба,Тип 250-3 это китайская 250кг осколочно-фугасная свободнопадающая бомба, разработанная на основе советской ФАБ-250.
pla_type-3-500=Тип 500-3,,Бомба,Тип 500-3 это китайская 500кг осколочно-фугасная свободнопадающая бомба, разработанная на основе советской ФАБ-500.

raf_bl755=BL755,,Кассетная бомба,Кассетная бомба BL755 содержит 147 малокалиберных бронебойно-кумулятивных бомб, разбрасываемых по большой площади. Она широко использовалась во время ирано-иракской войны ВВС Ирана и британскими Королевскими ВВС на Фолклендских островах.

usaf_gbu-2=GBU-2,Paveway I,Управляемая бомба,GBU-2 Paveway I - это американская бомба с лазерным наведением весом 2000 фунтов (907 кг). Она разработана на основе свободнопадающей бомбы Mk 84, но с добавлением установленной в носовой части лазерной головки самонаведения и управляемых стабилизаторов.
usaf_gbu-15=GBU-15,Paveway I,Управляемая бомба,GBU-15 это планирующая бомба с инфракрасным наведением, водившая в состав вооружения некоторых сверхзвуковых тактических самолетов ВВС США, таких как F-111 и F-4E. Это оружие имеет инфракрасную (ИК) систему наведения, которая отличается высокой надежностью и может использоваться в любых погодных условиях, а также оснащено каналом передачи данных для перенацеливания и ретрансляции данных системы наведения на пусковую платформу.
usaf_bolt-117=BOLT-117,,Управляемая бомба,BOLT-117 — американская 750-фунтовая (340 кг) бомба с лазерным наведением. Представляет собой бомбу M-117, с лазерной ГСН в носовой части, и стабилизаторами для управления полётом.
usaf_gbu-11=GBU-11,Paveway I,Управляемая бомба,GBU-11 — американская 1400-килограммовая (3000 фунтов) бомба с лазерным наведением. Это сверхтяжелая управляемая бомба, предназначена для поражения сложных целей, таких как мосты, бункеры, укрепления, железные дороги и другие прочные сооружения.
usaf_m117=M117,,Бомба,M117 - это 750-фунтовая (340 кг) бомба времен Корейской войны, которая широко использовалась ВВС США и во время Вьетнамской войны. Она была заменена различными моделями серии Mk 80.
usaf_m118=M118,,Управляемая бомба,M118 — это американская сверхтяжелая бомба весом 3000 фунтов (1400 кг), предназначенная для поражения сложных целей, таких как мосты, бункеры, укрепления, железные дороги и другие прочные сооружения.
usaf_cbu-24=CBU-24,,Кассетная бомба,CBU-24 – это американскаяя кассетная бомба, которая содержит 665 осколочных суббоеприпасов, разбрасываемых по большой площади. Эти бомбы входят в состав вооружения самолётов прорыва ПВО, известных как Wild Weasel и предназначены для вывода из строя оборудования зенитно-ракетных комплексов и их личного состава.

usn_gbu-10=GBU-10,Paveway II,Управляемая бомба,GBU-10 Paveway II — американская бомба с лазерным наведением массой 2000 фунтов (907 кг). Создана на основе свободнопадающей Mk 84, с добавлением носовой лазерной ГСН и управляемых стабилизаторов. Комплект GBU-10 представляет собой модернизацию более старого Paveway I.
usn_gbu-12=GBU-12,Paveway II,Управляемая бомба,GBU-12 Paveway II — американская бомба с лазерным наведением массой 500 фунтов (227 кг). Создана на основе свободнопадающей бомбы Mk 82, с добавлением носовой лазерной ГСН и управляемых стабилизаторов.
usn_gbu-16=GBU-16,Paveway II,Управляемая бомба,GBU-16 Paveway II — американская бомба с лазерным наведением массой 1000 фунтов (460 кг). Создана на основе свободнопадающей бомбы Mk 83, с добавлением носовой лазерной ГСН и управляемых стабилизаторов.
usn_gbu-24=GBU-24,Paveway III,Управляемая бомба,GBU-24 Paveway III — американская бомба с лазерным наведением массой 2000 фунтов (907 кг). Это усовершенствованная версия Paveway II с улучшенной системой наведения и большей дальностью планирования, а также повышенной надежностью и более эффективным профилем полета на малых высотах.
usn_mk-82=Mk-82,,Бомба,Mark 82 - это свободнопадающая бомба общего назначения с малым лобовым сопротивлением весом 500 фунтов (227 кг).
usn_mk-82_snakeye=Mk-82 Snakeye,,Бомба,Mark 82 "Snake-eye" — это 227-килограммовая (500 фунтов) неуправляемая бомба общего назначения с высоким аэродинамическим сопротивлением и выдвижными стабилизаторами. Она создавалась для ситуаций когда самолет сбрасывает бомбы на высокой скорости и малой высоте, без "подскока" и пикирования.
usn_mk-83=Mk-83,,Бомба,Mark 83 - это свободнопадающая бомба общего назначения с малым лобовым сопротивлением весом 1000 фунтов (454 кг).
usn_mk-84=Mk-84,,Бомба,Mark 84 - это свободнопадающая бомба общего назначения с малым лобовым сопротивлением весом 2000 фунтов (925 кг).
usn_rockeye=CBU-100,Rockeye,Кассетная бомба,CBU-100 Rockeye II - это американская кассетная бомба весом 500 фунтов (227 кг), которая содержит 247 поражающих элементов.
usn_walleye2=AGM-62,Walleye II,Управляемая бомба,AGM-62 Walleye II - это планирующая бомба с телевизионным наведением, которая использовалась США в 1960-1990-х годах. Большинство из них имели осколочно-фугасную боеголовку весом 2000 фунтов (907 кг); некоторые оснащались ядерной боеголовкой W72.

usn_mk54_dc=Mk-54,,ПЛ Бомба,Mark 54 - американская противолодочная глубинная бомба, разработанная во время Второй Мировой Войны и состоявшая на вооружении в период Холодной Войны.

wp_fab-100=ОФАБ-100,,Бомба,ОФАБ-100 – это советская 100кг осколочно-фугасная свободнопадающая бомба общего назначения.
wp_fab-250=ФАБ-250,,Бомба,ФАБ-250 – это советская 250кг фугасная свободнопадающая бомба общего назначения.
wp_fab-500=ФАБ-500 М-62,,Бомба,ФАБ-500 - это советская 500кг фугасная свободнопадающая бомба общего назначения.\n\nМ-62 - модификация 1962 года с низким лобовым сопротивлением. Предназначена для внешних подвесок истребителей-бомбардировщиков.
wp_fab-500_m54=ФАБ-500 М-54,,Бомба,ФАБ-500 - это советская 500кг фугасная свободнопадающая бомба общего назначения.\n\nМ-54 - оригинальный вариант 1954 года, упрощённой формы с высоки лобовым сопротивлением. Предназначен для отсеков тяжёлых бомбардировщиков и обладает большим рассеиванием по сравнению с более поздней модификацией.
wp_fab-1500_m54=ФАБ-1500 М-54,,Бомба,ФАБ-500 - это советская 1500кг фугасная свободнопадающая бомба общего назначения.
wp_fab-3000_m54=ФАБ-3000 М-54,,Бомба,ФАБ-500 - это советская 3000кг фугасная свободнопадающая бомба общего назначения.
wp_fab-9000_m54=ФАБ-9000 М-54,,Бомба,ФАБ-500 - это советская 900кг фугасная свободнопадающая бомба общего назначения.

wp_kab-500l=КАБ-500Л,,Управляемая бомба,КАБ-500Л — это советская 500кг фугасная бомба с лазерным наведением. Создана на основе свободнопадающей ФАБ-500, с добавлением носовой лазерной ГСН и управляемых стабилизаторов.

wp_rbk-250=РБК-250,,Кассетная бомба,Советская разовая бомбовая кассета калибра 250 кг. Может снаряжаться как осколочными так и противотанковыми боеприпасами.
wp_rbk-500=РБК-500,,Кассетная бомба,Советская разовая бомбовая кассета калибра 500 кг. Может снаряжаться как осколочными так и противотанковыми боеприпасами.

wp_plab-100=ПЛАБ-100,,ПЛ Бомба,ПЛАБ-100 – это советская 100кг противолодочная бомба предназначенная для поражения подводных лодок.

# ---------------- Sonobuoys ---------------
plan_skf-1=SKF-1,,Пассивный буй,SKF-1 - китайский пассивный всенаправленный акустический буй разработанный в 60-х годах.
plan_skf-2=SKF-2,,Пассивный буй,SKF-2 - китайский пассивный направленный акустический буй разработанный в 70-х годах. Превосходит SKF-1 по всем показателям.

usn_ssq-41=AN/SSQ-41,LOFAR,Пассивный буй,SSQ-41A "Jezebel" — это гидроакустический буй типа LOFAR (низкочастотный анализ и запись). Это наиболее распространенный пассивный гидроакустический буй НАТО, и, в отличие от более позднего гидроакустического буя DIFAR, он не способен определять пеленг, но обладает достаточно высокой чувствительностью и в большом количестве присутствует на вооружении любого западного военно-морского флота.
usn_ssq-47=AN/SSQ-47,Julie,Активный буй,SSQ-47A «Джули» — это постоянно активный гидроакустический буй, предназначенный только для измерения дальности. Это наиболее распространенный активный гидроакустический буй НАТО, и, в отличие от более позднего гидроакустического буя DICASS, он не способен определять пеленг, но все же полезен для «фиксации» ранее обнаруженной цели с помощью нескольких буев. Из-за непрерывной работы эхолокатора этот гидроакустический буй имеет срок службы всего 30 минут.
usn_ssq-53=AN/SSQ-53,DIFAR,Пассивный буй,SSQ-53 - это радиогидроакустический буй направленного частотного анализа и регистрации (DIFAR). Он предоставляет оператору гидроакустического буя информацию о магнитном курсе на контакт, что является значительным улучшением по сравнению с более ранним всенаправленным CRT-1.
usn_ssq-62=AN/SSQ-62,DICASS,Активный буй,SSQ-62 DICASS – это радиогидроакустический буй активного обнаружения, предназначенный для уточнения местоположения подводной лодки, обнаруженной с помощью пассивных буев SSQ-53.
usn_ssq-77=AN/SSQ-77,VLAD,Sonobuoy,SSQ-77A — это пассивный гидроакустический буй типа VLAD (Vertical Line Array DIFAR), разработанный как усовершенствованная версия буя SSQ-53 типа DIFAR. Имеет схожую конструкцию с SSQ-53, но включает в себя чрезвычайно чувствительный гидроакустический массив, который обеспечивает очень большую дальность действия и высокую эффективность для гидроакустического буя. Следствием этих улучшенных характеристик является вес и стоимость этого буя, что означает, что они встречаются реже, а их точность на больших расстояниях низкая, поэтому они в основном полезны для локализации подводных целей.
usn_ssq-101=AN/SSQ-101,,Активный буй,Активный радиогидроакустический буй AN/SSQ-101 Air Deployed Active Receiver (ADAR) - это гидроакустический буй, предназначенный для использования в мелководных мультистатических системах обнаружения. При развертывании он использует большое количество гидрофонов для точного определения направления на контакт.

wp_rgb-1=РГБ-1,,Пассивный буй,РГБ-1 - это советский пассивный всенаправленный акустический буй.
wp_rgb-3=РГБ-3,,Активный буй,РГБ-3 - это советский активный акустический буй, предназначен для уточнения положения обнаруженной подводной лодки.
wp_rgb-nm1=РГБ-НМ-1,,Пассивный буй,РГБ-НМ-1 – советский всенаправленный пассивный акустический буй, входящий в состав авиационной системы обнаружения подводных лодок «Баку».

# ------------------ FFAR -----------------
usn_zuni=Zuni,,НАР,Zuni представляет собой неуправляемую авиационную ракету со складывающимся оперением диаметром 5,0 дюйма, которую в основном используют штурмовики и ударные вертолеты. В ракете Zuni могут использоваться разные типы боеголовок. Обычно она запускается из подвесного блока LAU-10, содержащего четыре ракеты.
usn_hydra=Hydra 70,,НАР,Hydra 70 - это 2,75-дюймовая неуправляемая авиационная ракета, используемая как штурмовиками, так и вертолетами. «Гидра» может оснащаться различными боеголовками и обычно заряжается в подвесные пусковые блоки по 19 штук.

wp_s-5=С-5,,НАР,С-5 – советская неуправляемая 55мм ракета, используемая истребителями-бомбардировщиками, штурмовиками и вертолётами. Данный НАР обычно заряжается в пусковые блоки по 32 единицы.
wp_s-8=С-8,,НАР,С-8 – советская неуправляемая 80мм ракета, используемая истребителями-бомбардировщиками, штурмовиками и вертолётами. Различные подварианты С-8 оснащаются разными типами боеголовок, включая специализированный вариант для разрушения взлётно-посадочных полос. Обычно заряжается в пусковые блоки по 20 единиц.
wp_s-24=С-24,,НАР,С-24 – советская неуправляемая 240мм ракета, используемая истребителями-бомбардировщиками, штурмовиками и вертолётами. В отличие от прочих НАР, применяется не в блоках, а подвешивается поштучно.
wp_s-25=С-25,,НАР,С-25 – советская неуправляемая 266мм ракета, используемая истребителями-бомбардировщиками, штурмовиками и вертолётами. Это самая крупная НАР в арсенале советских ВВС и её боеголовка содержит почти 60кг взрывчатого вещества. В отличие от прочих НАР, применяется не в блоках, а подвешивается поштучно.

# ------------------ MLRS -----------------
ir_107mm_rocket=Haseb-1,,РСЗО,Ракета Haseb-1 представляет собой иранскую версию китайской 107-мм ракеты, выпускаемой из реактивной системы залпового огня Type 63. На иранской службе и пусковая установка, и ракета называются Haseb.

usa_m26=М26,,РСЗО,НУРС М26 - это американский неуправляемый реактивный снаряд с кассетной боевой частью,запускаемый с мобильной установки М270 МЛРС

wp_grad=Град,,РСЗО,Ракета М-21ОФ - это советский неуправляемый реактивный снаряд, запускаемый с мобильной установки БМ-21. В целом вся система (М-21) более известна как реактивная система залпового огня «Град».

