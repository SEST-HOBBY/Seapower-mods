DefaultDescription=Атомные подлодки типа «Скипджек» стали первыми американскими атомными лодками, на которых была в полной мере применена обтекаемая форма корпуса, опробованная ранее на экспериментальной подводной лодке «Альбакор». Улучшенная по сравнению с лодками предыдущих типов гидродинамика позволила «Скипджекам» развивать скорость более 30 узлов в подводном положении, что сильно затрудняло их поражение средствами ПЛО рубежа 1950-1960-х годов. Позднее лодки этого типа были модернизированы с установкой буксируемых гидроакустических станций и перевооружением на торпеды Mk-48, хотя ПКР «Гарпун» они не получили.
