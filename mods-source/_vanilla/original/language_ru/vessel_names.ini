DefaultDescription=Тяжелые авианесущие крейсера проекта 1143 (НАТО: тип Kiev) – это уникальные боевые корабли, сочетающие черты тяжелого ракетного крейсера, противолодочного вертолётоносца и легкого авианосца с самолётами вертикального взлёта и посадки. Проект был разработан на основе опыта, полученного при постройке и эксплуатации противолодочных крейсеров проекта 1123. Желание получить более мореходный корабль океанской зоны, не уступающий 1123 по противолодочному потенциалу и средствам ПВО, но имеющий мощное ударное противокорабельное вооружение, привело к значительному росту водоизмещения. Введение в состав авиационного вооружения легких штурмовиков вертикального взлёта и посадки Як-36М (позднее Як-38) предопределило архитектуру корабля близкую к классической «авианосной» со сплошной полётной палубой. Эти корабли часто являются лидерами корабельных ударных групп или противолодочных поисковых групп ВМФ СССР, действующих в дальней океанской зоне. На корабельные самолёты также планировалось возложить задачи по обеспечению ПВО после разработки более совершенного истребителя-бомбардировщика вертикального взлёта и посадки, создание которого, впрочем затянулось вплоть до распада СССР.
