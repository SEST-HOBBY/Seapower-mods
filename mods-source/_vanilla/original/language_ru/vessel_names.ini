DefaultDescription=В 1971 году Соединенные Штаты передали ВМС Южного Вьетнама (RVNN) два океанских радиолокационных пикета класса Edsall. Эти корабли были крупнейшими надводными военными кораблями RVNN, находившимися на вооружении до 1975 года, когда пал Южный Вьетнам. Из двух находящихся в строю кораблей Trần Khánh Dư (HQ-4) был захвачен северными вьетнамцами на верфи Сайгонского военно-морского флота, а Trần Hưng Đạo (HQ-1) сбежал на Филиппины, где поступил на вооружение как BRP Rajah Lakandula (PF-4). Примечание: эти корабли представлены модифицированной версией эсминца класса Гиринг в Sea Power, с вооружением, эквивалентным вооружению вьетнамских фрегатов того времени.
Южновьетнамские эсминцы класса Гиринг, захваченные Северным Вьетнамом. Реклассифицированы как фрегаты.
