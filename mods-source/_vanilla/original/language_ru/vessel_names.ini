[usn_ddg_kidd]
Type=ЭМ УРО,Эсминец
Default=Кидд,Кидд
DefaultDescription=Первоначально эти корабли строились для флота шахского Ирана, но вошли в состав ВМФ США после Исламской революции. Четыре корабля типа «Кидд» представляют собой специализированные эсминцы противовоздушной обороны, созданные на основе корпусов эсминцев типа «Спрюэнс». Эти корабли часто использовались американским флотом для службы в Персидском заливе, так как по требованию изначального заказчика на них были установлены усовершенствованные системы кондиционирования и охлаждения.
