DefaultDescription=Подводные лодки класса «Оберон» представляли собой серию из 27 британских дизель-электрических подводных лодок, разработанных как улучшенная версия класса «Порпойз» с использованием более прочных материалов корпуса и модернизированного оборудования. Этот класс заслужил репутацию малошумных лодок и использовался во время холодной войны для наблюдения за вражескими кораблями и подводными лодами, высадки и эвакуации спецназа, а также подготовки к противолодочной борьбе.\n\nКоролевский военно-морской флот Канады заказал три подводные лодки класса «Оберон» двумя партиями, с незначительными модификациями по сравнению со стандартом Королевского флота, в первую очередь, с использованием американского вооружения в виде торпед Mark 37.В конце 1970-х годов Королевский военно-морской флот Канады начал программу модернизации (SOUP) для продления срока службы кораблей до 1980-х и 1990-х годов, при этом модернизация первой лодки началась в 1980 году. Модернизированные лодки могли применять торпеды Mk-48, однако поскольку они были поставлены только в 1990-х годах, на протяжении всей холодной войны использовались временные торпеды Mk-37C/E.
