DefaultDescription=Проект 1123 «Кондор» (НАТО: типа Moskva) – первые в советском ВМФ корабли с групповым базированием авиации (в данном случае – вертолётов). Эти вертолётоносцы являлись в целом кораблями, неплохо оптимизированными для противолодлочной борьбы, имея помимо авиагруппы из 14 противолодочных вертолётов новейший на начало 1960-х годов гидроакустический комплекс «Орион» с мощной подкильной антенной и буксируемой антенной «Вега». Для поражения подводных лодок мог использоваться первый в советском флоте противолодочный ракетный комплекс «Вихрь», правда только с ракетами с ядерными боеприпасами (в игре не моделируется). Корабли оснащались также двумя пусковыми установками ЗРК «Шторм». Недостатком «Кондоров» стала относительно плохая для кораблей их размеров мореходность и чрезмерная валкость. После постройки двух единиц СССР перешел к стрительству более крупных и мощных авианесущих крейсеров.
Variant1=Москва,Москва
Variant2=Ленинград,Ленинград

