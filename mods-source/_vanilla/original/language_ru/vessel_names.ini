[usn_cgn_alaska]
Type=АРКР,Ракетный крейсер
Default=Аляска,Аляска
DefaultDescription=Проект атомного ударного крейсера. Эти корабли были разработаны к 80-м годам, но так и не были построены. По составу вооружения они напомиают ракетные крейсера класса «Тикондерога», но превосходят их в боезапасе и калибре орудия. Ещё одной особеностью «Алясок» стало использование СВВП вместо противолодочных вертолётов.\nЭтот крейсер включен в Sea Power как интересный вариант на тему «а что, если?».
