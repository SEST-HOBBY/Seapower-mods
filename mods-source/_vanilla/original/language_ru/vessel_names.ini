DefaultDescription=Фрегаты типа «Брук» были созданы на основе противолодочного фрегата типа «Гарсия» и в основном имеют схожие ТТХ. Однако, их возможности ПВО значительно улучшены. Кормовая 5-дюймовая башня была заменена пусковой установкой ЗРК «Тартар» с боекомплектом в 16 ракет. Как и фрегаты типа «Гарсия», они изначально были оснащены небольшим ангаром для беспилотника DASH, который позже был расширен для размещения вертолета LAMPS.
