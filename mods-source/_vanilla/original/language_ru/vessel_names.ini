DefaultDescription=Четыре атомных крейсера типа «Вирджиния» были введены в состав ВМФ США в период с 1976 по 1980 год. Эти корабли водоизмещением более 10 000 тонн оснащались двумя спаренными ракетными пусковыми установками балочного типа и орудиями среднего калибра. Они чрезвычайно дороги в эксплуатации, но очень мощны.
