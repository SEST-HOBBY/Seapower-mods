[wp_rkr_kirov]
Type=ТАРКР,Ракетный крейсер
Default=Пр.1144 «Орлан»,Орлан
DefaultDescription=Тяжелый атомный ракетный крейсер проекта 1144 «Орлан» (НАТО: тип Kirov) - это внушительных размеров атомный крейсер УРО. По размерам он напоминает линкор времен Второй мировой войны и является одним из самых мощных надводных боевых кораблей из когда-либо построенных. Головной крейсер проекта получил имя «Киров» в честь одноименного крейсера времён Великой Отечественной войны и всю серию кораблей проекта 1144 и его производных часто называют просто как тип «Киров» по имени головной единицы. Все 4 построенных крейсера имеют (и подчас серьезные) отличия друг от друга в составе вооружения. Их большой размер обусловлен необходимостью разместить большую батарею противокорабельных ракет П-700 «Гранит», а также зенитно-ракетный комплекс зональной ПВО С-300Ф с несколькими ближними ЗРК самообороны в качестве резервных. Корабли также оснащены мощным гидроакустическим комплексом «Полином» и могут нести до трёх противолодочных вертолётов. Для поражения подводных лодок на головном корабле использовался противолодочный ракетный комплекс «Метель», на последуюших – «Водопад». «Кировы» часто выступают в качестве лидеров групп надводных боевых кораблей советского ВМФ, наряду с авианесущими крейсерами.
Variant1=Киров РКР-181,Киров

[wp_rkr_kresta1]
Type=РКР,Ракетный крейсер
Default=Пр.1134 «Беркут»,Беркут
DefaultDescription=Ракетные крейсера проекта 1134 «Беркут» задумывались как более крупные и в то же время более гибкие боевые корабли, чем первые советские ракетные крейсера проекта 58 «Грозный», которые оказались слишком перегружены системами, в особенности тяжелыми поворотными пусковыми установкам противокорабельных ракет. Уменьшив количество противокорабельных ракет на борту до четырех в неподвижных пусковых установках, а также увеличив размеры корабля в целом, проектантам удалось существенно усилить возможности новых крейсеров в области ПВО и ПЛО, а также улучшить их мореходность.
Variant1=Адмирал Зозуля РКР-060,Зозуля
Variant2=Владивосток РКР-097,Владивосток
Variant3=Вице-адмирал Дрозд РКР-072,Дрозд
Variant4=Севастополь РКР-048,Севастополь

[wp_rkr_kynda]
Type=РКР,Ракетный крейсер
Default=Пр.58 «Грозный»,Грозный
DefaultDescription=Корабли проекта 58 (НАТО: тип Kynda), иногда называемые тип «Грозный» по названию первого корабля серии – это первые советские ракетные крейсера. Их водоизмещение оказалось слишком небольшим для размещенного на них вооружения и систем и в последующих крейсерах проекта 1134 весь облик ракетного крейсера был существенно переработан. «Грозные» несут батарею из 8 ПКР П-35 в больших палубных поворотных пусковых установках, придающих кораблям этого типа уникальный внешний вид. Также в надстройке было предусмотрено место для хранения еще 8 ракет. Возможности крейсера в области ПВО и ПЛО ограничены, это чисто ударный корабль, созданный в 1950-е гг. в качестве «ассиметричного ответа» на многочисленные надводные флоты стран НАТО.
