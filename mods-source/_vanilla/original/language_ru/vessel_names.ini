Type=ФР УРО,Фрегат
Default=Оливер Хазард Перри (длинный корпус),Перри
DefaultDescription=Фрегаты типа «Оливер Хазард Перри», представляют собой многочисленный тип недорогих многоцелевых кораблей. Для ВМС США и союзных США флотов было построено более 70 таких кораблей. Тип проектировался для действий в условиях умеренной угрозы, поэтому имел менее мощный комплекс вооружения и меньшую живучесть, чем современные ему эсминцы типа «Спрюэнс». Выпускались два варианта «Оливер Хазард Перри»; это версия с «длинным корпусом», приспособленая для базирования вертолёта SH-60 LAMPS Mk.III и оборудованная буксируемой ГАС SQR-18 или SQR-19 TACTAS, что значительно повышало противолодочный потенциал корабля.
