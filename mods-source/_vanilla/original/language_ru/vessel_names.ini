DefaultDescription=Подводные лодки проекта 877 «Палтус» (НАТО: тип Kilo) стали первыми в СССР дизельными подводными лодками, для которых была выбрана «альбакоровская» форма корпуса, оптимизирования для подводного хода и впервые за долгое время - одновальная конструкция ГЭУ. Лодки этого типа стали вступать в строй с начала 80-х годов. В их конструкции большое внимание было уделено снижению шумности и повышению противолодочных характеристик. Лодки, в частности получили новый гидроакустический комплекс МГК-400 «Рубикон» с большой антенной, занимавшей всю носовую часть корпуса, что ранее было не характерно для советских дизельных лодок. Эти лодки могут быть опаснейшими противниками как для надводных кораблей, так и для подводных лодок вероятных противников, особенно в прибрежных водах. Активно строились на экспорт.
