[usn_cgn_california]
Type=АРКР,Ракетный крейсер
Default=Калифорния,Калифорния
DefaultDescription=Два крейсера типа «Калифорния» были введены в эксплуатацию в ВМС США в 1974–1975 годах, став идеальными кораблями эскорта для авианосных ударных групп с практически неограниченной дальностью плавания. Спроектированные с нуля вокруг ядерной энергоустановки, они стали первыми атомные надводные кораблями, предназначенными для серийного производства (в отличие от последующих «Лонг-Бич», «Бейнбриджа» и «Тракстана», все из которых были единичными кораблями). Строительство оказалось очень дорогим, и последующие корабли были отменены в пользу крейсеров типа «Вирджиния». Вооружение крейсеров «Калифорния» состояло из двух  пусковых установок зенитных ракет Mark 13, двух 5-дюймовымх орудий, а также пусковой установки ПЛУР АСРОК. В ходе модернизаций в начале 1980-х годов на них были установлены ЗАК «Фалланкс» и новый комплекс радиоэлектронной борьбы AN/SLQ-32(V)3. Оба корабля были выведены из эксплуатации в конце 1990-х годов, несмотря на дорогостоящую дозаправку атомной ЭУ, проведённую всего за несколько лет до этого.
Variant1=Калифорния CGN-36,Калифорния
Variant2=Южная Каролина CGN-37,Южная Каролина

[usn_cgn_virginia]
