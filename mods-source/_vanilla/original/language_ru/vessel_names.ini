[usn_ddg_mahan]
Type=ЭМ УРО,Эсминец
Default=Мэхэн,Мэхэн
DefaultDescription=Официально тип «Фаррагут» по названию головного корабля, но часто известный и как тип «Кунц» в честь первого корабля, заложенного как ракетный эсминец (первые три были позже переоборудованы в ракетные). 10 кораблей этого типа изначально были оснащены ЗРК «Терьер». Однако позже они были модернизированы под ЗРК «Стандарт».\n\nОдин корабль из класса, «Махан» (DDG-42) был модернизирован в 1980 году для использования в качестве испытательного корабля NTU и включал в себя ракеты SM-2ER Block II и другие передовые системы, которые сделали «Махан» самым боеспособным кораблем противовоздушной обороны из существовавших на тот момент.
Variant1=Мэхэн DDG-42,Мэхэн

[usn_ff_garcia]
Type=ФР,Фрегат
Default=Гарсиа,Гарсиа
DefaultDescription=Введенные в строй в середине-конце 1960-х годов фрегаты типа «Гарсиа» предназначены в первую очередь для обеспечения противолодочной обороны конвоев и десантных групп. Основным вооружением этих кораблей является противолодочный ракетный комплекс ASROC, сопряженный с гидроакустической станцией AN/SQS-26. Первоначально в состав вооружения кораблей входили также беспилотные противолодочные вертолёты DASH. Однако после того, как DASH были сняты с вооружения, ангары фрегатов были расширены и переоснащены под базирование вертолётов SH-2F «Сиспрайт».
