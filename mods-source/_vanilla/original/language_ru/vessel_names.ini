DefaultDescription=В конце 1960-х - середине 1970-х годов было построено около 50 фрегатов типа «Нокс», предназначенных для замены фрегатов типа «Гарсиа». Также как и «Гарсиа», эти корабли были построены «вокруг» противолодочного ракетного комплекса ASROC, гидроакустической станции AN/SQS-26 и беспилотного вертолёта DASH. «Ноксы» изначально не имели средств ПВО, но позже были оснащены ЗРК самообороны «Си-Спэрроу», а беспилотные дроны были заменены на обычные противолодочные вертолёты SH-2F «Сиспрайт». \n В ходе модернизации в 80-х годах, они получили возможность применять ПКР «Гарпун»: 2 ячейки пусковой установки ASROC заряжались Гарпунами вместо противолодочных ракет RUR-5 ASROC.
