DefaultDescription=В конце 1960-х - середине 1970-х годов было построено около 50 фрегатов типа «Нокс», предназначенных для замены фрегатов типа «Гарсиа». Также как и «Гарсиа», эти корабли были построены «вокруг» противолодочного ракетного комплекса ASROC, гидроакустической станции AN/SQS-26 и беспилотного вертолёта DASH. «Ноксы» изначально не имели средств ПВО, но позже были оснащены ЗРК самообороны «Си-Спэрроу», а беспилотные дроны были заменены на обычные противолодочные вертолёты SH-2F «Сиспрайт». \nВ середине 1980-х годов многие корабли были модернизированы: система VDS была заменена на систему SQR-18 TACTAS, пусковая установка «Си Спэрроу» — на ЗАК «Фэленкс», а оборудование РЭБ было модернизировано, что позволило фрегатам класса Нокс оставаться эффективными вплоть до 1990-х годов.
