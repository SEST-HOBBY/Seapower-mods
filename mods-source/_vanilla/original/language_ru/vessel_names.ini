DefaultDescription=Подводные лодки типа «Пермит» первоначально именовались тип «Трешер», но после трагической гибели головного корабля, это наименование типа более не употреблялось. Данные лодки стали шагом вперед по сравнению с предыдущим типом «Скипджек» в плане снижения щумности и усиления поисковых возможностей, правда за счет снижения максимальной скорости подводного хода. На «Пермитах» впервые использовалась сферическая антенна ГАК с большим количеством гидрофонов и виброизолированные платформы для установки механизмов. Позже все лодки этого типа получили новый цифровой ГАК BQQ-5 и буксируемую гидроакустическую антенну TB-16. Также в состав их вооружения были введены противокорабельные ракеты «Гарпун». Тем не менее, их возможности остались на более скромном уровне, чем у лодок типов «Стёрджен» и «Лос-Анджелес».
