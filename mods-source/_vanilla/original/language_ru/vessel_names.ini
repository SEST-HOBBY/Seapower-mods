[usn_ffg_oliver_hazard_perry]
Type=ФР УРО,Фрегат
Default=О. Х. Перри,Перри
DefaultDescription=Фрегаты типа «Оливер Хазард Перри» строились в вариантах длиной 445 футов (136 м) с «коротким корпусом» (подсерия I) и «длинным корпусом» длиной 453 фута (138 м) (подсерия III). Оба варианта были спроектированы в первую очередь как зенитные и противолодочные боевые ракетные корабли, предназначенные для сопровождения в открытом океане десантных кораблей и конвоев в условиях умеренной подводной и воздушной угрозы в потенциальной войне с Советским Союзом и странами Варшавского договора. Модификация с длинным корпусом оснащалась более крупными и мощными вертолетами SH-60 «Сихок» LAMPS III. Фрегаты типа «Перри» оснащались однобалочной пусковой установкой, способной запускать как зенитные, так и противокорабельные ракеты.
