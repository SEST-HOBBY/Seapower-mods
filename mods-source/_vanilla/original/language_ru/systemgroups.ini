#SAM
MK-115=MK-115|Mk-115 - это управляемый оператором пост целеуказания, обеспечивающий подсветку целей для ЗРК самообороны Sea Sparrow (BPDMS).
MK-95=MK-95|Радар управления огнем Mk-95 является частью модернизированного ЗРК самообороны Sea Sparrow и обеспечивает автоматическую подсветку цели для полуактивной радиолокационной системы самонаведения ракет.
SPW-2=SPW-2|AN/SPW-2 - это радар управления огнём, предназначенный для наведения зенитных ракет RIM-8 Talos на участке траектории полета ракеты по лучу.
SPG-49=SPG-49|AN/SPG-49 - это радар управления огнем, предназначенный для наведения зенитных ракет RIM-8 Talos. Он используется для сопровождения цели и подсветки цели на конечном участке траектории полета ракеты, когда включается её полуактивная головка самонаведения.
SPG-51=SPG-51|AN/SPG-51 — это радар управления артиллерийским и ракетным огнем C- и X-диапазона, используемый в ракетных комплексах «Тартар» и «Стандарт MR».
SPG-55=SPG-55|AN/SPG-55 — это радар управления огнем, обеспечивающий сопровождение и подсветку для ракетных комплексов Terrier и Standard ER. Специальный режим слежения за поверхностью позволяет использовать ракеты против надводных целей.
SPG-60=SPG-60|РЛС раздельного подсвета целей AN/SPG-60 — моноимпульсная РЛС сопровождения и подсвета целей Х-диапазона для ракетных комплексов «Тартар» и «Стандарт MR» на кораблях, оснащенных системой управления артиллерийским огнём Мк-86.
SPG-62=SPG-62|AN/SPG-62 — это радар управления огнем непрерывного действия Х-диапазона, используемый для подсветки целей для ракет Standard SM-2 на кораблях, оснащенных боевой системой AEGIS. Подсветка целей осуществляется на конечном участке полёта ракет.
SYR-1=SYR-1|The SYR-1 is an American datalink antenna set used for receiving down-link commands from SM-2 missiles, and is primarily used on SM-2ER ships, and later NTU upgraded SM-2MR and SM-2ER vessels. Has limited performance compared to the AEGIS system, but provides many more missiles in-flight compared to an SM-1 warship.
SYR-1_NTU=SYR-1 (NTU)|
