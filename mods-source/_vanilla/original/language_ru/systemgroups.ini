CXAM=CXAM|CXAM was the prototype of US Navy long-range air search radars. This set equipped larger combatants just prior to the start of World War II. It was a large 18 x 16 foot mattress with the ability to elevate, though its beam was too broad to allow for heightfinding. The CXAM led directly to the wartime air search radars, almost all of which were incremental improvements over this baseline design.
CXAM-1=CXAM-1|CXAM-1 was an incremental improvement over CXAM, with fourteen total sets delivered and installed on battleships, cruisers, and aircraft carriers. The antenna retained the mattress appearance but the elevating capability was removed. Accuracy was improved to 200 yards, and this set remained in service aboard some ships into 1943. It was replaced on large combatants by the SK or SK-2 set.
SA=SA|The SA series of sets was intended to replicate the functionality and performance of CXAM with a smaller antenna for use aboard escort ships and auxiliaries. Relatively successful, the SA series became the standard air search set for destroyer escorts and frigates, and some were also fitted to destroyers and light cruisers. This type also equipped ships of the Free French forces which were refitted in US yards late in the war.
SC-1=SC-1|Like SA, the SC was an attempt to bring the performance of the CXAM to smaller ships by using a smaller antenna. Unfortunately the smaller antenna led to lower effective range, and the operating forces disliked the baseline SC. SC-1 was then introduced in January 1942 with double the power and twice the range, and soon all SCs were converted. This set equipped destroyers and auxiliaries early in the war before being replaced by SC-2 as that set became available.
SC-2=SC-2|SC-2 improved on the SC-1 by greatly enlarging the antenna. This set incorporated provisions for the BG and BL IFF systems, and became the primary radar for destroyers through the end of the war. Slightly improved variants of SC-2 (SC-3, SC-4, and SC-5) remained in service on destroyers until 1963.
SK=SK|SK was the standard wartime air search set for large ships. Essentially an SC-2 set with a CXAM-sized antenna, it was a two-dimensional radar system providing only azimuth and slant range data. Additional sensors were required for heightfinding.
SK-2=SK-2|This set was an incremental improvement over SK, with a 17 foot dish antenna intended to reduce side lobes. Late in the war, both SK and SK-2 were criticized for their inability to detect high-flying aircraft due to low beam elevation. 75 sets were produced, equipping larger combatants as they entered service or came into yards for refit. 
SM=SM|SM was the first US radar designed for fighter direction, incorporating a conically scanned "pencil beam" to determine height of an air target, a capability not available to earlier air search radars. SM was very heavy at 18,000lbs (4,000lbs for the antenna alone), and could only be mounted on large aircraft carriers. Later, SM-1 and SP were built for smaller ships.
SP=SP|SP was the lightweight successor to the SM heightfinding radar. This set could incorporate two different antennas depending on the ship receiving it, with a smaller antenna made available for destroyers and light carriers. This set equipped the Gearing class radar picket destroyers (DDRs) that operated off Okinawa. 300 sets were built, and by the end of the war it was common to see capital ships mounting an SP on the mainmast complementing an SK or SK-2 on the foremast.
SR=SR|SR was the first entirely new air search set since CXAM, incorporating many new features which had been pioneered by previous radar sets. The antenna was roughly the same size as the SC-2 with more than double the power, and equipped destroyers towards the end of the war. It also equipped larger combatants as a backup air search radar, and remained in service until 1961.
SR-2=SR-2|SR-2 was a 50cm 2D air search set originally intended for destroyer escorts, but after production began it proved far too large. The pilot models equipped the large carriers of the Midway-class as well as several light cruisers and the first four of the submarine radar pickets (SSRs). This set was replaced by the AN/SPS-6 due to its inferior performance.
SR-3=SR-3|SR-3 and SR-6 were designed as replacements for SK and SC across the fleet, using L-band for better performance with less fading. Both sets performed poorly in reality due to the antennas chosen, which were described as "not enough antenna" in a postwar report. SR-6 was a lighter weight version of SR-3, with a smaller antenna.
SR-6=SR-6|SR-3 and SR-6 were designed as replacements for SK and SC across the fleet, using L-band for better performance with less fading. Both sets performed poorly in reality due to the antennas chosen, which were described as "not enough antenna" in a postwar report. SR-6 was a lighter weight version of SR-3, with a smaller antenna.
SPS-6=SPS-6|AN/SPS-6 - это 2D-радар воздушного поиска первого поколения, который использовался ВМФ США и их союзниками в послевоенное время. Будучи 2D-радаром, он выдает только данные об азимуте и наклонной дальности. Для определения высоты необходимо использовать дополнительные средства обнаружения.
SPS-12=SPS-12
SPS-29=SPS-29|AN/SPS-29 - это 2D-радар, который использовался ВМФ США в качестве радара раннего предупреждения. Им были оснащены многие корабли в начале холодной войны. Будучи двухмерным радаром, он выдает только данные об азимуте и наклонной дальности до цели. Для определения высоты необходимо использовать дополнительные средства обнаружения.
SPS-30=SPS-30|AN/SPS-30 – модернизированная версия радара воздушного обнаружения AN/SPS-8 с более мощным передатчиком  S-диапазона и возможностью определения высоты цели.
UPA-43=UPA-43|AN/UPA-43 — это запросчик для идентификации «свой-чужой» (IFF), используемый ВМФ США. Более поздние радары, такие как AN/SPS-48, оснащены встроенным запросчиком IFF, который устраняет необходимость в отдельной антенне.
SPS-32=SPS-32
SPS-33=SPS-33
SPS-37=SPS-37|AN/SPS-37 — это 2D радар, использовавшийся ВМФ США в качестве радара раннего обнаружения в начале Холодной войны и являющийся усовершенствованной версией радара AN/SPS-29. Как 2D-радар он предоставляет только данные об азимуте и наклонной дальности. Для определения высоты необходимо использовать дополнительные средства обнаружения.
SPS-39=SPS-39|AN/SPS-39 - это 3D-радиолокатор дальнего действия воздушного поиска, используемый для определения пеленга, дальности и высоты. Как и более крупный SPS-48, он механически вращается по азимуту, но сканируется электроникой по углу места. 3D-радар выступает промежуточным звеном между 2D-радаром дальнего обнаружения и радарами управления огнем, используемыми для поражения целей.
SPS-40=SPS-40|AN/SPS-40 - это 2-D радиолокатор дальнего действия, используемый на многих кораблях ВМФ США. Как двухмерный радар он выдает только данные об азимуте и наклонной дальности до цели. Для определения высоты необходимо использовать дополнительные средства обнаружения.
SPS-43=SPS-43|AN/SPS-43 - это радиолокационная система воздушного поиска большой дальности, используемая в основном на авианосцах США и крейсерах с управляемыми ракетами. Работая в УКВ-диапазоне, AN/SPS-43 также использует перестройку частоты для противодействия попыткам постановки помех. Как 2D-радар, он предоставляет только данные об азимуте и наклонной дальности.
SPS-48=SPS-48|AN/SPS-48 - это 3D-радиолокатор дальнего действия воздушного поиска. Азимут цели определяется с помощью механического сканирования путем поворота всей антенны, а угол места цели определяется с помощью электронного сканирования. Радар передает информацию о дальности контакта, пеленге и высоте в боевую информационную систему корабля, на котором он установлен.
SPS-48E=SPS-48E|AN/SPS-48E - это 3D-радиолокатор дальнего действия воздушного поиска. Азимут цели определяется с помощью механического сканирования путем поворота всей антенны, а угол места цели определяется с помощью электронного сканирования. Радар передает информацию о дальности контакта, пеленге и высоте в боевую информационную систему корабля, на котором он установлен.\n\nЭто модернизированная версия радара SPS-48, разработанная в рамках программы NTU, с новой антенной, значительно улучшенными возможностями обнаружения целей на малых высотах, помехозащищённостью, а также с еще большей эффективной дальностью.
SPS-49=SPS-49|AN/SPS-49 - это двухмерный радиолокатор воздушного поиска большой дальности, который является преемником SPS-40. Это основной радиолокатор воздушного поиска для многих кораблей США и союзников. На старых кораблях он заменил SPS-40 в ходе программы модернизации NTU.
SPS-49V5=SPS-49(V)5|AN/SPS-49(V)5 - это двухмерный радиолокатор воздушного поиска большой дальности, который является преемником SPS-40. Это основной радиолокатор воздушного поиска для многих кораблей США и союзников.\n\nЭто модернизированная, более мощная модель, разработанная в рамках программы NTU, обладающая меньшей минимальной высотой обнаружения цели и улучшеной помехозащищённостью.
SPS-52=SPS-52|AN/SPS-52 - это трехмерный радар дальнего воздушного поиска, который используется для определения азимута, дальности и высоты полета цели. Как и более крупный SPS-48, он механически поворачивается для определения азимута, но определяет высоту электронным сканированием.
SPN-43=SPN-43|AN/SPN-43 - это двухмерный радар УВД, используемый на борту авианосцев и других воздушных судов для обеспечения идентификации и управления воздушными судами в радиусе 50 миль от корабля.
SPY-1A=SPY-1A|AN/SPY-1 - это радар воздушного обнаружения большой дальности с пассивной фазированной антенной решеткой и электронным сканированием. Он является ключевым компонентом боевой системы AEGIS. Четыре плоские антенны, управляемые компьютером, используются для обеспечения непрерывного обзора воздушного пространства вокруг корабля на 360 градусов.
MK-23_TAS=MK-23 TAS|Система обнаружения целей Mk. 23 TAS (Target Acquisition System) - это небольшой, быстро вращающийся 2D-радар средней дальности для обнаружения низколетящих, или пикирующих ракет, используемый совместно ЗРК самообороны Sea Sparrow.

#---Surface only---
SPS-10=SPS-10|AN/SPS-10 - это 2-D радар надводного обнаружения, которым были оснащены многие корабли США и союзников в послевоенную эпоху и в эпоху холодной войны.
SPS-55=SPS-55|AN/SPS-55 - это поисково-навигационный радар надводного обнаружения на полупроводниковой элементной базе, которым оснащены эсминцы типа «Спрюэнс», а также фрегаты типа «Оливер Хазард Перри» и тральщики типа «Эвенджер».
SPS-67=SPS-67|AN/SPS-67 - это радар надводного обнаружения малой дальности, обычно используемый на борту американских кораблей для обнаружения и слежения за надводными объектами и воздушными объектами, летящими на предельно малых высотах.

