#---------------------------------------- MAD ----------------------------------------
AN/ASQ-81V2=AN/ASQ-81V2|AN/ASQ-81 — это детектор магнитных аномалий (магнитометр) для поиска подводных целей. Использовался на самолётах и вертолётах противолодочной обороны (ПЛО). Может располагаться как на выпускном тросе, так и в хвостовой части фюзеляжа. Магнитометр имеет дальность обнаружения до 1 км, поэтому может использоваться лишь для уточнения координат цели.

#---------------------------------------- Laser Designator ---------------------------
AN/AVQ-23=AN/AVQ-23 Pave Spike|AN/AVQ-23 Pave Spike — это двухканальный лазерный дальномер-целеуказатель, совмещённый с тепловизором, располагался в подвесном авиационном контейнере. Устанавливался на самолётах США с 1976 года. Применялся штурмовой авиацией для подсветки наземных и морских целей при использовании бомб с лазерным наведением.
AN/AVQ-26=AN/AVQ-26 Pave Tack|AN/AVQ-26 Pave Tack — это двухканальный лазерный дальномер-целеуказатель, совмещённый с тепловизором, располагался в подвесном авиационном контейнере. Применялся штурмовой авиацией для подсветки наземных и морских целей при использовании бомб с лазерным наведением.

