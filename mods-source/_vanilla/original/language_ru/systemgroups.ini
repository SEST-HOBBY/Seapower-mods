Bald_Head=МРП-23|МРП-23 — советская система радиоэлектронной разведки, использовавшаяся на атомных подводных лодках классов «Лира» и «Гранит». Это уникальная комбинированная (радар+РТР) система, обладающая высокой точностью и очень хорошей чувствительностью, позволяющая атаковать ракетами загоризонтные цели.
Squid_Head=МРП-25|МРП-25 — советская система радиоэлектронной разведки, используемая на подводных лодках классов «Палтус» и «Сом». Она оптимизирована для обнаружения угроз и является упрощённой модификацией системы радиоэлектронной разведки МРП-23.
