ActiveIntercept_Early=Ранняя ОГС|Cтанция обнаружения гидроакустических сигналов (ОГС) — это пассивный гидроакустический комплекс, предназначенный для своевременного обнаружения, пеленгования и анализа сигналов, излучаемых активными гидролокаторами кораблей, подводных лодок, или самонаводящихся торпед. Эти системы имеют обзор 360-градусов и могут обнаруживать активное излучение в «слепых зонах», основного пассивного гидролокатора.
ActiveIntercept_Late=Поздняя ОГС|Cтанция обнаружения гидроакустических сигналов (ОГС) — это пассивный гидроакустический комплекс, предназначенный для своевременного обнаружения, пеленгования и анализа сигналов, излучаемых активными гидролокаторами кораблей, подводных лодок, или самонаводящихся торпед. Эти системы имеют обзор 360-градусов и могут обнаруживать активное излучение в «слепых зонах», основного пассивного гидролокатора.
#---------------------------------------- ESM ----------------------------------------
#---------- RWR ----------
VesselRWR=СПО|Система предупреждения об облучении перехватывает радиолокакионные сигналы как в режиме поиска, так и в режиме сопровождения. В последнем случае система выдает предупреждающий ссигнал о возможном пуске ракеты по самолёту.
AircraftRWR=СПО|Система предупреждения об облучении перехватывает радиолокакионные сигналы как в режиме поиска, так и в режиме сопровождения. В последнем случае система выдает предупреждающий ссигнал о возможном пуске ракеты по самолёту.

#---------- Targeting ----------
ARM_Targeting=Прицел ПРР|Система целеуказания для противорадиолокационных ракет. Не позволяет идентифицировать цель или локализовать её местоположение, но создаёт отметку по которой может быть выпущена ракета.

#---------- ELINT ----------
VesselESM=РТР|Системы радиоэлектронной разведки перехватывают радиолокационные сигналы, обеспечивая возможность пассивного обнаружения без необходимости раскрывать свое местоположение с помощью излучения радара.
Submarine_ESM=Мачта РТР|Системы радиоэлектронной разведки перехватывают радиолокационные сигналы, обеспечивая возможность пассивного обнаружения без необходимости раскрывать свое местоположение с помощью излучения радара.
AircraftELINT=РТР|Системы радиоэлектронной разведки перехватывают радиолокационные сигналы, обеспечивая возможность пассивного обнаружения без необходимости раскрывать свое местоположение с помощью излучения радара.

#---------------------------------------- ECM ----------------------------------------
GenericECM=Станция РЭБ|Средства активной радиоэлектронной борьбы (РЭБ) могут обеспечить заградительное (шумовое) подавление радаров противника, значительно уменьшая дальность их обнаружения до тех пор, пока у радара не будет достаточно энергии, чтобы «прожечь» фоновый шум. Они также могут перехватывать сигналы радаров противника, модулировать их и ретранслировать на приемник, чтобы сбить с толку радар противника относительно реального местоположения цели.
AircraftDECM_Early=Защитная РЭБ|Оборонительная система РЭБ может перехватывать сигналы радаров противника, модулировать их и ретранслировать на приемник, чтобы сбить с толку радар противника или головку самонаведения ракеты относительно реального местоположения цели.
AircraftDECM_Med=Защитная РЭБ|Оборонительная система РЭБ может перехватывать сигналы радаров противника, модулировать их и ретранслировать на приемник, чтобы сбить с толку радар противника или головку самонаведения ракеты относительно реального местоположения цели.
AircraftDECM_Late=Защитная РЭБ|Оборонительная система РЭБ может перехватывать сигналы радаров противника, модулировать их и ретранслировать на приемник, чтобы сбить с толку радар противника или головку самонаведения ракеты относительно реального местоположения цели.

