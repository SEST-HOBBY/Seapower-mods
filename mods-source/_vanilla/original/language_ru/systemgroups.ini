Zaliv=«Залив»|MРП-10/11/12/13/14 «Залив» — советская система радиоэлектронной разведки и предупреждения об угрозах 1960-х годов, использовавшаяся на многих надводных кораблях и входящая в семейство систем РЭБ и РЭП в различных конфигурациях. Она, отличается хорошей чувствительностью, хотя и низкой скоростью идентификации целей. Данный вариант пердназначен для надводных кораблей.
