[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=15.9

[FlightModel]
PitchGain=0.8                         // Vertical manuverability
VelocityGain=0.1036                   // Acceleration
HeadingGain=2                         // Horizontal manuverability
YawRateLimit=130                      // in degrees per second

BankGain=0.8                          // Roll change speed
MaxRollForHeading=35.0                // bank limit in normal flight
MaxRollRate=80.0                      // in degrees per second

ThrustGain=0.5                        // Thrust change speed
SpeedBrakeFractionGain=0.2            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

[Performance]
#Dimensions
WingSpan=37.4                         //meters
#Parameters
MaxG=2.5                              // Mostly for horizontal turns

MaxClimbRate=9.9                      //Meters per second
EmptyMass=34700.0                     // in kg
MaxFuel=26650.0                       // in kg

PerEngineMaxPower=3126000             // Power in Watts, if this is set the engine type will default to Turboprop
EngineCount=4

Ceiling=32000.0                       // ceiling in feet
CruiseAltitude=30000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.5,0.5,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=250                //in knots, Defines max speed at altitude curve
StallSpeed=95.0                       //in knots
MachLimit=0.612                       //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.209,0.4        // Landing
SpeedAndRange_Loiter=0.32,0.6          // Loiter
SpeedAndRange_Cruise=0.43,5130         // Cruise
SpeedAndRange_Max=0.612,0.8            // Attack/Fast/High/Max without AB

Altitudes=50,500,1000,3000,6000,10000,20000  // in feet

MaxClimbPitch=15
MaxCombatClimbPitch=20
MaxDescentPitch=-15
MaxCombatDescentPitch=-20
