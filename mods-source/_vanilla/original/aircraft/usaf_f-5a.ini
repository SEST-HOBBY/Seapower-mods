[---------- General Data ----------]
[General]
UnitType=Aircraft

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.33
MinCameraDistanceBroadside=0.33
CameraPivotHeight=0.0

#Taxi values
GroundedPitchAngle=0  // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.0227,-0.0182     // defines the distance between center coordinates and the wheels on ground

[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[AI]
Role=Fighter,Bomber

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_f-5

[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=0.16                 //Pi* r * r where r is engine radius, in meters

[FlightModel]
VelocityGain=0.1136                   // Acceleration

ThrustGain=0.325                      // Thrust change speed
SpeedBrakeFractionGain=10             // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

# ---------- Vertical manuvering ----------
PitchGain=1                           // Vertical manuverability (Also affects horizontal manuverability by defining how fast we can change our speed)

# ---------- Horizontal manuvering ----------
#Defines bank angle we want
BankAngleCurve_AnimationCurveType=Custom
BankAngleCurve_Keys=3
BankAngleCurve_Key1_Time=0			// Heading Error | Do not change
BankAngleCurve_Key1_Value=0			// Bank Demand   | Do not change

BankAngleCurve_Key2_Time=2.5		// Heading Error | Do not change
BankAngleCurve_Key2_Value=7.5		// Bank Demand   | Do not change

BankAngleCurve_Key3_Time=15			// Heading Error | Change
BankAngleCurve_Key3_Value=90		// Bank Demand   | Change

#Defines how fast we can get that bank
BankGain=1                          // Roll change speed
MaxRollRate=130.0                     // in degrees per second
MaxPitchRate=19
MaxRollForHeading=90.0              // bank limit in normal flight (to be deprecated)

HeadingGain=4                       // Horizontal manuverability (???)
YawRateLimit=160                    // in degrees per second  (to be deprecated ?)

#MaxG from Performance defines can pitch while banking, effectivly defining horizontal turn speed

#R(meters)=V*V/(gLimit*9.81)
#Turn rate (rad/sec) = V / R(meters)

[Performance]
#Dimensions
WingSpan=8.13                         //meters
#Parameters
MaxG=7.33                              // Mostly for horizontal turns (For Fighters is the main parameter defining how fast they can turn)

MaxClimbPitch=70.0                      // in degrees Default: 20
MaxCombatClimbPitch=80                // in degrees Defaults: 80 for MachLimit 1+ and 45 otherwise
MaxDescentPitch=-70.0                   // in degrees Default: -20
MaxCombatDescentPitch=-65             // in degrees Defaults: -60 for MachLimit 1+ and -30 otherwise

MaxClimbRate=178                      //Meters per second
EmptyMass=4392.0                      // in kg
MaxFuel=2146.0                        // in kg

PerEngineMaxThrust=16004               //Newtons
PerEngineMaxAfterburnerThrust=22261    //Newtons
EngineCount=2
EngineWarmUp=15

Ceiling=54000.0                       // ceiling in feet
CruiseAltitude=35000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.5,0.5,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=674                //in knots, Defines max speed at altitude curve
StallSpeed=124.0                      //in knots
MachLimit=1.63                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.27,0.3        // Landing
SpeedAndRange_Loiter=0.45,0.7         // Loiter
SpeedAndRange_Cruise=0.86,481         // Cruise
SpeedAndRange_Max=1.2,0.3             // Attack/Fast/High/Max without AB
SpeedAndRange_Afterburner=1.63,0.2    // AB max

Altitudes=100,1000,3000,6000,10000,20000  // in feet

