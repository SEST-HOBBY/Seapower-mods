DefaultDescription=Renforçant puis remplaçant la classe Uzushio, la classe Yushio constitue la troisième série d'unités navales de la JMSDF après la Seconde Guerre mondiale. Elle adopte la coque en forme de goutte d'eau ou Albacore de la classe précédente et améliore ses performances, ce qui en fait des unités puissantes, modernes et quasi silencieuses. Dix unités de cette classe ont été construites en deux vagues et ont servi du début des années 1980 à la fin des années 2000.
Variant1=SS-573	Yūshio, Yūshio 
