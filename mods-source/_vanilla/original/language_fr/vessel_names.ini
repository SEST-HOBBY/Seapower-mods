[usn_cgn_california]
Type=CGN,Croiseur lance-missiles
Default=Classe California,California
DefaultDescription=Les deux croiseurs de classe California ont été mis en service dans la marine américaine entre 1974 et 1975, servant d'escorte idéale pour les groupes aéronavals rapides grâce à leur autonomie pratiquement illimitée. Conçus dès le départ autour de l'énergie nucléaire, ces navires ont été décrits comme les premières unités de surface à propulsion nucléaire destinées à la production en série (contrairement aux Long Beach, Bainbridge et Truxtun, qui étaient tous des exemplaires uniques). Leur construction s'est avérée très coûteuse et les unités suivantes ont été annulées au profit des croiseurs de classe Virginia. En service, ces navires étaient performants, équipés de lance-missiles Mark 13 à l'avant et à l'arrière, de canons de 5 pouces, d'un lanceur ASROC et de recharges à l'avant. Au début des années 1980, des travaux de rénovation ont permis d'ajouter le système Phalanx CIWS et de mettre à jour la suite de guerre électronique vers l'AN/SLQ-32(V)3. Les deux navires ont été retirés du service à la fin des années 1990, malgré les coûteux travaux de rénovation entrepris quelques années auparavant pour leur permettre de refaire le plein de carburant.
Variant1=California CGN-36,California
Variant2=South Carolina CGN-37,South Carolina

[usn_cgn_virginia]
Type=CGN,Croiseur lance-missiles
Default=Classe Virginia,Virginia
DefaultDescription=Quatre navires de la classe Virginia ont été mis en service pour l'US Navy entre 1976 et 1980. Ces navires de plus de 10 000 tonnes étaient des navires à double usage pour les missiles et les canons de moyen calibre. Ils sont extrêmement coûteux à exploiter mais très puissants.
Variant1=Virginia CGN-38,Virginia
Variant2=Texas CGN-39,Texas
Variant3=Mississippi CGN-40,Mississippi
Variant4=Arkansas CGN-41,Arkansas

[usn_cgn_long_beach_73]
Type=CGN,Croiseur lance-missiles
Default=Classe Long Beach(1973),Long Beach
DefaultDescription=Le Long Beach a été conçu comme escorte du porte-avions à propulsion nucléaire Enterprise. Il est doté d'un équipement de capteurs similaire, qui lui donne son apparence de "cube", et d'une puissante batterie anti-aérienne composée de deux lanceurs Terrier et d'un lanceur Talos.
Variant1=Long Beach CGN-9,Long Beach

[usn_cgn_long_beach_83]
Type=CGN,Croiseur lance-missiles
Default=Classe Long Beach(1983),Long Beach
DefaultDescription=Le Long Beach a été conçu comme escorte du porte-avions à propulsion nucléaire Enterprise. Dans les années 80, le radar SCANFAR et le système SAM Talos ont été retirés et remplacés par des radars conventionnels et des missiles. Harpoon, Tomahawk, Phalanx CIWS, offrant ainsi une capacité de frappe terrestre.
Variant1=Long Beach CGN-9,Long Beach

[usn_clg_oklahoma_city]
Type=CLG,Croiseur lance-missiles
Default=Classe Galveston,Galveston
DefaultDescription=Trois croiseurs légers de la classe Cleveland ont été convertis en croiseurs lance-missiles de la classe Galveston à la fin des années 1950. Ils ont subi d'importantes modifications de la structure arrière pour retirer les tourelles et installer un lanceur pour le missile Talos.
Variant1=Galveston CLG-3,Galveston
Variant2=Little Rock CLG-4,Little Rock
Variant3=Oklahoma City CLG-5,OK City

[usn_cv_forrestal_75]
