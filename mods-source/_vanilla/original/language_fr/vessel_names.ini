[wp_takr_kiev]
Type=TAVKR,Porte-avions
Default=Classe Kiev,Kiev
DefaultDescription=En service depuis 1975, ces porte-avions V/STOL sont la suite logique des porte-hélicoptères Moskva. Destinés aux missions anti-sous-marines, ces navires transportent une impressionnante panoplie de missiles anti-navires et anti-aériens en plus de capacités ASM étendues. Contrairement aux porte-avions de l'US Navy, leur principale force offensive réside dans leur batterie de missiles de croisière, les avions embarqués étant principalement utilisés pour la couverture aérienne. Ces navires opèrent souvent comme navires amiraux dans des groupes d'attaque ou de chasseurs-tueurs.
