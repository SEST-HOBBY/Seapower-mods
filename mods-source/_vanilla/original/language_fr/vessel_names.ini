DefaultDescription=La classe Heku (type 024) est un sous-marin lance-missiles très répandu de la PLAN. Il s'agit d'une version améliorée, à coque d'acier, du sous-marin lance-missiles soviétique de classe Komar. Ces navires sont dangereux en nombre, notamment dans les régions côtières, en raison de leur vitesse élevée.
