Default=Classe C,Classe C
DefaultDescription=Conçus au début de la Seconde Guerre mondiale, 32 destroyers de classe C ont été lancés entre 1943 et 1945. La conception était principalement basée sur la conception de la classe J d'avant-guerre pour permettre une construction rapide. Quatre navires de cette classe ont été envoyés au Pakistan où ils ont servi dans les guerres indo-pakistanaises.
Variant1=PNS Alamgir,Alamgir
Variant2=PNS Shah Jahan,Shah
Variant3=PNS Taimur,Taimur
Variant4=PNS Jahangir,Jahangir
Variant5=HMS Crescent,Crescent

[rn_dd_z-class]
Type=DD,Destroyer
Default=Classe Z,Classe Z
DefaultDescription=Contemporaine de la classe Battle et très similaire à la classe C, la classe Z était une classe de 8 destroyers lancés entre 1943 et 1945. La conception était principalement basée sur les conceptions précédentes des classes U et V pour permettre une construction rapide. Après la Seconde Guerre mondiale, 4 d'entre eux ont été vendus à Israël et à l'Égypte et d'autres ont été démantelés.
Variant1=INS Eilat,Eilat
Variant2=INS Yaffo,Yaffo
Variant3=ENS El Qaher,Qaher
Variant4=ENS El Fateh,Fateh
Variant5=HMS Zest,Zest

[****************************** USA ******************************]
[usn_ae_kilauea]
Type=AE,Auxiliaire de flotte
Default=Classe Kilauea,Kilauea
DefaultDescription=Huit navires de ravitaillement de la classe Kilauea ont été construits entre 1968 et 1972 pour l'US Navy afin d'effectuer des ravitaillements en mer. Au départ, il s'agissait de navires de guerre commissionnés, mais ils ont été transformés en navires auxiliaires civils plus traditionnels à la fin des années 1980.
