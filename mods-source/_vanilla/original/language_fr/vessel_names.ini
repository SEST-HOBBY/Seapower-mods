[****************************** Australia ******************************]
[ran_ddg_perth]
Type=DDG,Destroyer
Default=Classe Perth,Perth
DefaultDescription=Près de 30 destroyers de la classe Charles F. Adams ont été construits entre la fin des années 1950 et le début ou le milieu des années 1960 pour la Marine des États-Unis (USN), la Marine royale australienne (RAN, sous le nom de classe Perth) et la Marine ouest-allemande (sous le nom de classe Lütjens). Les destroyers de la classe Adams comptent parmi les premiers navires de la Marine américaine équipés de missiles guidés ; ils étaient initialement armés du missile Tartar. Au milieu des années 1970, les navires de la classe Adams ont été modernisés avec de nouveaux systèmes d'armes et de radars afin de pouvoir utiliser le missile Standard. 
Variant1=Perth D-38,Perth
Variant2=Hobart D-39,Hobart
Variant3=Brisbane D-41,Brisbane

[ran_ffg_adelaide_shorthull]
Type=FFG,Frégate
Default=Classe Adelaide(coque courte),Adelaide
DefaultDescription=La frégate lance-missiles de classe Adelaide est une série de six FFG en service dans la marine australienne. Il s'agit d'une variante de la FFG américaine de classe Oliver Hazard Perry, les quatre premiers navires ayant été construits dans des chantiers navals américains. Ces frégates ont été mises en service par la Marine royale australienne à partir de 1980, afin de pallier l'échec du projet de destroyer léger des années 1970. Elles sont construites selon des normes très similaires à celles de leurs homologues de l'US Navy et sont donc équipées d'une suite moderne de systèmes de défense antiaérienne, antinavire et de lutte anti-sous-marine. n\nLes trois premiers navires ont été construits selon une configuration à coque courte et ne disposent pas de réseaux remorqués. Ils sont également incapables d'utiliser les hélicoptères LAMPS Mk.III, ce qui les oblige à embarquer l'hélicoptère AS-350 non armé pour des missions non combattantes.
Variant1=Adelaide FFG-1,Adelaide
Variant2=Canberra FFG-2,Canberra
Variant3=Sydney FFG-3,Sydney

[ran_ss_oberon]
Type=SS,Sous-marin de patrouille
Default=Classe Oberon(RAN),Oberon
DefaultDescription=La classe Oberon était une série de 27 sous-marins d'attaque et de patrouille diesel-électriques de conception britannique, développés pour succéder à la classe Porpoise avec des améliorations, notamment des matériaux de coque plus résistants et des équipements modernisés. La Marine royale australienne a commandé six sous-marins de classe Oberon en deux lots, avec des modifications mineures par rapport à la norme de la Royal Navy, notamment l'utilisation d'armes américaines sous la forme de la torpille Mark 37. \n\nLa Marine royale australienne a lancé un programme de modernisation à la fin des années 1970 (SWUP) afin de mettre à niveau les capteurs et l'armement des sous-marins pour faire face aux menaces attendues dans les années 1980 et au-delà. Cela comprenait des torpilles Mark 48 de l'US Navy, un sonar passif à réseau latéral MicroPUFFS et, à terme, le missile Harpoon UGM-84 pour sous-marins. Les six navires furent tous modernisés avec ces équipements d'ici 1985.
Variant1=S57 Oxley,Oxley
Variant2=S59 Otway,Otway
Variant3=S60 Onslow,Onslow
Variant4=S61 Orion,Orion
Variant5=S62 Otama,Otama
Variant6=S70 Owens,Owens

[****************************** UK ******************************]
[rn_dd_battle]
