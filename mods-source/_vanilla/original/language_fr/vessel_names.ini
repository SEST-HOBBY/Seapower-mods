[****************************** Japan ******************************]
[jmsdf_ddh_haruna]
Type=DDH,Destroyer
Default=Classe Haruna,Haruna
DefaultDescription=Illustrant l'orientation quasi exclusive de la JMSDF vers la lutte anti-sous-marine, deux destroyers de classe Haruna ont été construits au début des années 1970. Leur armement principal est constitué du trio d'hélicoptères ASM HSS-2 (un SH-3 construit sous licence) dans leur hangar. Leurs autres systèmes sont similaires à ceux de la classe Takatsuki, un peu plus ancienne.
Variant1=Haruna DDH-141,Haruna
Variant2=Hiei DDH-142,Hiei

[jmsdf_ddg_tachikaze]
Type=DD,Destroyer
Default=Classe Tachikaze,Tachikaze
DefaultDescription=Construits suite à l'expérience de la JMSDF avec l'Amatsukaze, trois de ces petits DDG ont servi du milieu à la fin des années 1970 jusqu'au début des années 2010. Comme la plupart des navires de guerre japonais des années 1970, leur rôle principal est la guerre anti-sous-marine, mais ils sont équipés du même lanceur Mk 13 "One Armed Bandit" que la classe Oliver-Hazard Perry, ce qui leur confère une capacité anti-aérienne relativement puissante.
Variant1=Tachikaze DD-168,Tachikaze
Variant2=Asakaze DD-169,Asakaze
Variant3=Sawakaze DD-170,Sawakaze

[jmsdf_dd_minegumo]
Type=DD,Destroyer
Default=Classe Minegumo,Minegumo
DefaultDescription=Trois de ces destroyers de lutte anti-sous-marine (LAS) furent construits pour la JMSDF à la fin des années 1960. Il s'agissait d'un développement de la classe Yamagumo. Ces navires furent équipés pour accueillir l'hélicoptère anti-sous-marin QH-50D DASH, au détriment du lanceur ASROC. Le QH-50 ne connut pas un grand succès et ses installations furent finalement retirées, ces navires récupérant un lanceur ASROC dans les années 1980. Le reste de la batterie était composé de torpilles et d'un lance-roquettes ASM de fabrication suédoise.
Variant1=Minegumo DD-116,Minegumo
Variant2=Natsugumo DD-117,Natsugumo
Variant3=Murakumo DD-118,Murakumo

[jmsdf_dd_takatsuki]
Type=DD,Destroyer
Default=Classe Takatsuki,Takatsuki
DefaultDescription=Navires de guerre japonais typiques dotés d'une batterie ASM lourde composée d'un ASROC et d'un lance-roquettes ASM de fabrication suédoise. Ils sont dotés d'un armement lourd, mais ne disposent pas de capacités de lutte anti-sous-marine et de lutte anti-aérienne, conformément à l'orientation de la Force d'autodéfense maritime japonaise vers la lutte anti-sous-marine.
Variant1=Takatsuki DD-164,Takatsuki
Variant2=Kikuzuki DD-165,Kikuzuki
Variant3=Mochizuki DD-166,Mochizuki
Variant4=Nagatsuki DD-167,Nagatsuki

[jmsdf_dd_yamagumo]
Type=DD,Destroyer
Default=Classe Yamagumo,Yamagumo
DefaultDescription=Six de ces destroyers légers ont été construits en deux lots pour la JMSDF. Ils sont représentatifs des premiers navires de guerre japonais, dotés d'une batterie anti-sous-marine lourde composée d'ASROC et d'un lance-roquettes anti-sous-marine de fabrication suédoise. Contrairement à certains navires plus grands plus récents, ces navires n'emportent que le calibre américain 3"/50 comme armement anti-surface.
Variant1=Yamagumo DD-113,Yamagumo
Variant2=Makigumo DD-114,Makigumo
Variant3=Asagumo DD-115,Asagumo
Variant4=Aokumo DD-119,Aokumo
Variant5=Akigumo DD-120,Akigumo
Variant6=Yugumo DD-121,Yugumo

[jmsdf_ss_asashio]
Type=SS,Sous-marin de patrouille
Default=Classe Asashio,Asashio
DefaultDescription=La classe Asashio est généralement considérée comme la première classe de sous-marins de la flotte construite pour la JMSDF après la Seconde Guerre mondiale, entrée en service à la fin des années 1960. Ces navires ont étendu le rayon d'action des forces sous-marines de la JMSDF en haute mer et ont été spécialement conçus pour offrir une bonne tenue en mer et un important espace de chargement de torpilles. Leurs machines étaient entièrement de construction japonaise et ils sont restés en service jusqu'au milieu des années 1980.
Variant1=SS-562	Asashio,Asashio
Variant2=SS-563	Harushio,Harushio
Variant3=SS-564 Michishio,Michishio
Variant4=SS-565 Arashio,Arashio

[jmsdf_ss_uzushio]
Type=SS,Sous-marin de patrouille
Default=Classe Uzushio,Uzushio
DefaultDescription=La classe Uzushio constituait la deuxième génération de vedettes navales de la JMSDF après la Seconde Guerre mondiale, introduisant la coque en forme de goutte d'eau de type Albacore. Sept de ces vedettes, réparties en trois lots, ont été intégrées à la JMSDF au début des années 1970 et ont servi jusqu'au milieu des années 1990.
Variant1=SS-566	Uzushio, Uzushio
Variant2=SS-567	Makishio, Makishio
Variant3=SS-568 Isoshio, Isoshio
Variant4=SS-569 Narushio, Narushio
Variant5=SS-570 Kuroshio, Kuroshio
Variant6=SS-571 Takashio, Takashio
