DefaultDescription=Officiellement désignée "classe Farragut" d'après son navire de tête, mais souvent appelée "classe Coontz" d'après le premier navire mis en chantier en tant que destroyer lance-missiles (les trois premiers ayant été convertis par la suite), les dix navires de cette classe étaient initialement équipés du missile antiaérien Terrier. Cependant, plus tard au cours de leur carrière, ils ont été modernisés pour embarquer le missile Standard.\n\nLe navire de classe Coontz Mahan (DDG-42) a été modernisé en 1980 pour servir de navire d'essai NTU, et comprenait le SM-2ER Block II ainsi que d'autres systèmes avancés qui faisaient du Mahan le navire de guerre aérienne le plus performant existant à l'époque.
