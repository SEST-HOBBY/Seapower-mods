[plan_ff_jianghu3]
Type=FF,Frégate
Default=Classe Jianghu III,Jianghu III
DefaultDescription=Ces navires sont les premiers navires de guerre modernes construits par la Chine. Ils sont dotés d'une superstructure fermée et climatisée, protégée contre les agents NBC, et d'un armement de missiles anti-surface beaucoup plus puissant. La capacité ASM reste très faible et ne comprend que deux mortiers ASM RBU-1200.
Variant1=Huangshi FF-535,Huangshi
Variant2=Wuhu FF-536,Wuhu
Variant3=Cangzhou FF-547,Cangzhou

[plan_ffg_jiangdong]
Type=FF,Frégate
Default=Classe Jiangdong,Jiangdong
DefaultDescription=Ces navires sont les successeurs de la classe Chengdu et ont été conçus comme des escorteurs de défense aérienne, équipés du missile sol-air à courte portée HQ-61 et de quatre affûts jumelés de 37 mm, contre seulement deux sur le Chengdu. Leur capacité ASM reste très faible, puisqu'ils ne disposent que de deux mortiers ASM FQF-1200 et de lance-grenades sous-marines.
Variant1=Yingtan FFG-531,Yingtan
Variant2=Zhongdong FFG-532,Zhongdong

[plan_k_type_037]
Type=FS,Corvette
Default=Type 037 (Hainan),Hainan
DefaultDescription=Classe prolifique de chasseurs de sous-marins utilisés par la PLAN et de nombreuses autres marines, la classe Hainan (Type 037) est une petite corvette rapide et très endurante qui a démontré sa capacité à opérer dans les eaux du Pacifique Sud. Ces navires remplissent une multitude de rôles, notamment celui de canonnières rapides dotées de capacités ASM, et sont dotés d'un armement respectable pour leur taille. Ceci, combiné à leurs sonars et mortiers ASM, confère à la classe Hainan de vastes capacités multirôles, malgré des performances ASM peu impressionnantes.
Variant1=Zhaoyuan 605,Zhaoyuan

[plan_lst_yukan]
Type=LST,Navire de débarquement
Default=Classe Yukan,Yukan
DefaultDescription=Les LST de classe Yukan (Type 072) constituent la première génération de nouveaux navires de débarquement de chars pour la PLAN et ont remplacé les anciens navires de débarquement américains de la Seconde Guerre mondiale dans le rôle de soutien aux assauts amphibies. Comme beaucoup d'autres navires de débarquement, ces navires sont équipés de canons de moyen calibre pour assurer leur défense et soutenir un débarquement amphibie, car ils doivent s'échouer pour déployer des véhicules depuis la rampe avant. Ils peuvent également déployer des barges de débarquement et transporter une importante charge utile sur le pont.
Variant1=Yuntaishan LST-927,Yuntaishan
Variant2=Wufengshan LST-928,Wufengshan
Variant3=Zijinshan LST-929,Zijinshan

[plan_msc_type_010]
Type=MSO,Dragueur de mines
Default=Type 010,Type 010
DefaultDescription=Le dragueur de mines de classe 010 est un dérivé chinois du dragueur de mines soviétique de classe T-43K, doté d'une puissance de feu de mitrailleuse accrue. Ces navires sont nombreux, peu coûteux et, surtout, efficaces pour la PLAN grâce à leur endurance et au confort accrus de l'équipage par rapport au modèle soviétique d'origine, ainsi qu'à leur armement plus lourd.
Variant1=364,364

[plan_pt_shanghai2]
Type=PT,Patrouilleur
Default=Classe Shanghai II,Shanghai II
DefaultDescription=Le patrouilleur Shanghai II (type 062) est une petite canonnière de courte portée de la PLAN, lourdement armée. Malgré sa petite taille, elle est adaptée aux opérations côtières et permet de rivaliser avec des navires de guerre plus lourds. Il s'agit d'un des premiers navires canonniers de classe Shanghai II, équipé d'un mortier anti-sous-marin et d'une petite superstructure.
Variant1=Shanghai II,Shanghai II

[plan_pt_shanghai2b]
Type=PT,Patrouilleur
Default=Classe Shanghai IIB,Shanghai IIB
DefaultDescription=Le patrouilleur Shanghai IIB (type 062) est une petite canonnière de courte portée de la PLAN, lourdement armée. Malgré sa petite taille, elle est adaptée aux opérations côtières et permet de rivaliser avec des navires de guerre plus lourds. Il s'agit d'une génération ultérieure de canonnières de classe Shanghai II, dotée d'une superstructure élargie, remplaçant le mortier anti-sous-marin.
Variant1=Shanghai IIB,Shanghai IIB

