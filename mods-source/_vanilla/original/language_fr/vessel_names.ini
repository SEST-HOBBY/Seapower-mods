DefaultDescription=Ces navires succèdent à la classe Chengdu et améliorent principalement la capacité de guerre de surface en doublant le nombre de missiles pour atteindre quatre SSM CSS-N-2 Safflower. L'armement de lutte antiaérienne est légèrement amélioré par le montage de 6 affûts de 37 mm, contre seulement 2 sur le Chengdu. La capacité ASM reste très faible et ne comprend que deux mortiers ASM RBU-1200.
