[usn_cg_ticonderoga]
Type=CG,Croiseur lance-missiles
Default=Classe Ticonderoga,Ticonderoga
DefaultDescription=D'un design emblématique et immédiatement reconnaissable avec leurs 4 panneaux plats PESA SPY-1, les croiseurs de classe Ticonderoga sont une évolution du destroyer de classe Spruance axé sur la lutte anti-aérienne et équipé du nouveau système de gestion de combat AEGIS. Ces navires ont été les pionniers de la technique de construction modulaire aux États-Unis.
