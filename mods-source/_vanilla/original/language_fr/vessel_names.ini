DefaultDescription=Trois porte-avions de classe Kitty Hawk (plus un développement de ceux-ci) ont été construits pour l'US Navy au début des années 1960. Ces navires sont dans une certaine mesure une évolution des superporte-avions de classe Forrestal. Ces navires étaient à l'origine équipés de systèmes permettant de faire fonctionner le missile SAM Terrier, mais ceux-ci ont été retirés par la suite.
Variant1=Kitty Hawk CV-63,Kitty Hawk
