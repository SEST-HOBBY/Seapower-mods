[wp_rkr_kirov]
Type=TARKR,Croiseur lance-missiles
Default=Classe Kirov,Kirov
DefaultDescription=Connus par les Soviétiques sous le nom de Sea Eagle (Projet 1144), les croiseurs de classe Kirov sont des croiseurs lourds à missiles guidés à propulsion nucléaire. Avec des dimensions proches de celles d'un cuirassé de la Seconde Guerre mondiale, ils comptent parmi les navires de combat de surface les plus puissants jamais construits, deux de ces navires ayant été construits depuis 1980, et deux autres étant restés en construction. Leur grande taille est rendue nécessaire par le besoin d'accueillir une grande batterie de missiles anti-navires ainsi qu'un système de missiles sol-air de défense de zone avec plusieurs défenses rapprochées en guise de renfort. Bien qu'équipés de sonars avancés et d'armes anti-sous-marines à distance de sécurité, ces unités font généralement office de navires amiraux de groupes de bataille de surface protégés par des navires anti-sous-marins dédiés.
Variant1=Kirov RKR-181,Kirov

[wp_rkr_kresta1]
Type=RKR,Croiseur lance-missiles
Default=Classe Kresta,Kresta
DefaultDescription=Le projet 1134 Golden Eagle, ou classe Kresta I, a été conçu comme un successeur plus grand et plus performant des croiseurs lance-missiles de classe Kynda, qui se sont avérés trop lourds et trop exigus. Le Kresta I est destiné au rôle anti-navire, mais possède des capacités bien améliorées en matière de guerre anti-aérienne et anti-sous-marine. Si ces navires sont autorisés à emprunter les routes des convois de l'Atlantique Nord, ils pourraient s'avérer une véritable menace pour l'OTAN en tant que navires de raid.
Variant1=Amiral Zozulya RKR-060,Zozulya
Variant2=Vladivostok RKR-097,Vladivostok
Variant3=Vice-Amiral Drozd RKR-072,Drozd
Variant4=Sevastopol RKR-048,Sevastopol

