Default=Classe Enterprise,Enterprise
DefaultDescription=Les plus gros navires de guerre en service dans la marine américaine pendant la guerre froide sont des super-porte-avions à propulsion nucléaire de classe Nimitz déplaçant plus de 100 000 tonnes. Ces navires sont l'un des moyens les plus menaçants dont dispose la marine américaine pour projeter sa puissance loin des côtes américaines.
