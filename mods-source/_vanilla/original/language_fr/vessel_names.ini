[usn_bb_iowa]
Type=BB,Cuirassé
Default=Classe Iowa,Iowa
DefaultDescription=La classe Iowa est le dernier représentant de la famille des cuirassés américains. Ces navires ont été conçus comme des cuirassés "rapides", capables de compter sur un mélange équilibré de vitesse et de puissance de feu, et capables de naviguer à la même vitesse qu'un groupe aéronaval. Lors de leur modernisation dans les années 1980, les Iowa ont été équipés de quatre supports Phalanx CIWS, ainsi que de lance-missiles Harpoon et Tomahawk.
Variant1=Iowa BB-61,Iowa
Variant2=New Jersey BB-62,New Jersey
Variant3=Missouri BB-63,Missouri
Variant4=Wisconsin BB-64,Wisconsin

[usn_cg_belknap]
Type=CG,Croiseur lance-missiles
Default=Classe Belknap,Belknap
DefaultDescription=Dix ans après son entrée en service, la classe Belknap a fait l'objet d'une modernisation majeure qui a permis de remplacer un grand nombre de ses systèmes et de remanier son armement. Le radar a été remplacé par l'AN/SPS-48, beaucoup plus performant, et le navire a reçu le système de guerre électronique AN/SLQ-32. Le lanceur Mk 10 a de nouveau été amélioré, ce qui lui a permis de lancer le missile SM-2 standard, et le navire a reçu un CIWS et huit tubes de lancement Harpoon à l'arrière du navire, qui ont remplacé l'affût de canon de 3 pouces. Le Belknaps a ainsi pu servir dans les années 1970 et 1980 en tant que complément efficace de navires de guerre plus récents tels que les croiseurs de la classe Ticonderoga, ce qui lui a permis d'être efficace sur tous les fronts.
Variant1=Josephus Daniels CG-27,Daniels
Variant2=Wainwright CG-28,Wainwright
Variant3=Jouett CG-29,Jouett
Variant4=Horne CG-30,Horne
Variant5=Sterett CG-31,Sterett
Variant6=William H. Standley CG-32,Standley
Variant7=Fox CG-33,Fox
Variant8=Biddle CG-34,Biddle

[usn_cg_belknap_72]
Type=DLG,Croiseur lance-missiles
Default=Classe Belknap(72),Belknap
DefaultDescription=Le "Leader Destroyer" de la classe Belknap a été conçu comme une modification relativement limitée de la classe Charles Adams pour des missions d'escorte rapide. La différence la plus importante a été obtenue en améliorant le lanceur Mk.10 du Terrier pour qu'il puisse également tirer l'ASROC, éliminant ainsi le besoin d'un lanceur de poivrière séparé, ainsi qu'en allongeant la coque de 14 pieds. Une grande partie de l'espace a ensuite été consacrée à la création d'une aire d'atterrissage permettant d'utiliser l'hélicoptère ASM DASH sans équipage. En outre, les navires ont reçu des capteurs améliorés, tels que le radar SPG-55B et le sonar AN/SQS-26. Bien qu'ils soient des combattants polyvalents efficaces, ils devraient généralement se concentrer sur les menaces sous-marines, compte tenu de leurs impressionnantes capacités de sonar et de lutte anti-sous-marine.
Variant1=Belknap DLG-26, Belknap
Variant2=Josephus Daniels DLG-27,Daniels
Variant3=Wainwright DLG-28,Wainwright
Variant4=Jouett DLG-29,Jouett
Variant5=Horne DLG-30,Horne
Variant6=Sterett DLG-31,Sterett
Variant7=William H. Standley DLG-32,Standley
Variant8=Fox DLG-33,Fox
Variant9=Biddle DLG-34,Biddle

[usn_cg_leahy]
Type=CG,Croiseur lance-missiles
Default=Classe Leahy,Leahy
DefaultDescription=La classe Leahy a été construite au début des années 1960 comme une classe de 9 "Destroyer Leaders" (DLG) mais a été reclassée comme croiseur en 1975. Il s'agit de navires à deux extrémités avec des lance-missiles à l'avant et à l'arrière. La classe a d'abord été équipée de missiles Terrier, mais a ensuite été convertie aux missiles Standard. Ces plates-formes sont inhabituelles car elles ne possèdent pas de canon de moyen calibre, mais seulement deux affûts jumelés de 3"/50. Des refontes ultérieures ont remplacé ces canons par des lanceurs Harpoon, ce qui a rendu ces navires dépourvus de tout canon.
