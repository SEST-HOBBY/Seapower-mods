[usn_ffg_oliver_hazard_perry]
Type=FFG,Frégate
Default=Classe O. H. Perry,Perry
DefaultDescription=Les frégates de la classe Oliver Hazard Perry ont été produites en versions à coque courte de 445 pieds (136 m) de long (modèle I) et à coque de 453 pieds (138 m) de long (modèle III). Toutes deux ont été conçues principalement comme des navires de guerre antiaériens et anti-sous-marins à missiles guidés destinés à escorter en haute mer des navires de guerre amphibies et des convois de navires marchands dans des environnements à menace modérée dans une guerre potentielle avec l'Union soviétique et les pays du Pacte de Varsovie, avec des navires de guerre à longue coque transportant les hélicoptères SH-60 Seahawk LAMPS III plus gros et plus performants. Ils pouvaient également assurer la défense aérienne contre les missiles anti-navires. Ces navires de guerre sont équipés pour escorter et protéger les groupes de combat de porte-avions, les groupes de débarquement amphibies, les groupes de ravitaillement et les convois de navires marchands.
