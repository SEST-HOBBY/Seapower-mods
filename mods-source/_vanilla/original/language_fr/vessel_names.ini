Default=Classe Battle,Battle
DefaultDescription=Construits au milieu des années 1940 pour la Royal Navy et la Royal Australian Navy, 26 destroyers de classe Battle ont été construits et beaucoup plus étaient prévus. À mesure que les modèles vieillissaient à la fin des années 1950 et au début des années 1960, ils ont été principalement vendus à la ferraille, deux plates-formes étant envoyées au Pakistan et une en Iran.
