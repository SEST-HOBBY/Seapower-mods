DefaultDescription=Développée à partir de la frégate ASM soviétique de classe Riga fournie à la République populaire de Chine avant la rupture sino-soviétique. La classe Chengdu améliore les capacités de combat en surface en remplaçant les tubes lance-torpilles triples d'origine par un lanceur double pour le missile Safflower dérivé du Styx. Les capacités anti-sous-marines sont très faibles, se limitant à deux mortiers anti-sous-marins RBU-1200. Cette classe constitue la base à partir de laquelle toutes les frégates ultérieures de la marine chinoise ont évolué.
