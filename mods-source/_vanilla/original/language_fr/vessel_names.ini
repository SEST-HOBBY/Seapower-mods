[plan_ff_jianghu2]
Type=FF,Frégate
Default=Classe Jianghu II,Jianghu II
DefaultDescription=Ces navires succèdent à la classe Chengdu et améliorent principalement la capacité de guerre de surface en doublant le nombre de missiles pour atteindre quatre SSM CSS-N-2 Safflower. Le Jianghu II remplace également les canons simples de 100 mm du Jianghu I par des canons jumeaux de 100 mm, au prix d'une capacité antiaérienne réduite, puisque deux canons de 37 mm ont été perdus pour compenser les canons plus lourds. La capacité ASM reste très faible, avec seulement deux mortiers ASM RBU-1200.
