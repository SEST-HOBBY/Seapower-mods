[plan_ff_chengdu]
Type=FF,Frégate
Default=Classe Chengdu,Chengdu
DefaultDescription=Développée à partir de la frégate ASM soviétique de classe Riga fournie à la RPC avant la scission sino-soviétique. La classe Chengdu améliore la capacité de guerre de surface en remplaçant les tubes lance-torpilles triples d'origine par un lanceur double pour le missile Safflower dérivé du Styx. La capacité ASM est très faible et ne comprend que deux mortiers ASM RBU-1200. Cette classe constitue la base sur laquelle toutes les frégates ultérieures de la marine chinoise se sont appuyées.
