[usn_aoe_sacramento]
Type=AOE,Auxiliaire de flotte
Default=Classe Sacramento,Sacramento
DefaultDescription=Quatre navires de soutien de combat rapides de classe Sacramento ont été construits entre 1961 et 1969 pour l'US Navy afin d'effectuer le ravitaillement en carburant et en provisions en cours de route. Une combinaison du pétrolier auxiliaire, du navire de stockage réfrigéré et du navire de munitions de la classe Sacramento sont des navires rapides conçus pour suivre les groupes de combat.
