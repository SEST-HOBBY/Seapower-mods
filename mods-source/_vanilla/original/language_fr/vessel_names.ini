[usn_cv_america_79]
Type=CV,Porte-avions
Default=Classe America,America
DefaultDescription=Trois porte-avions de classe Kitty Hawk (plus un développement de ceux-ci) ont été construits pour l'US Navy au début des années 1960. Ces navires sont dans une certaine mesure un développement des super-porte-avions de classe Forrestal. Ces navires étaient à l'origine équipés de systèmes permettant de faire fonctionner le missile SAM Terrier, mais ceux-ci ont été retirés par la suite. L'USS America est une légère modification des deux plates-formes d'origine et est généralement considéré comme l'un des trois Kitty Hawks.
Variant1=America CV-66,America

