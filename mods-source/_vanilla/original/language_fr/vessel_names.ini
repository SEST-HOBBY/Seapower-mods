[usn_ffg_oliver_hazard_perry_longhull]
Type=FFG,Frégate
Default=Classe Oliver Hazard Perry(Coque longue),Perry
DefaultDescription=Les frégates de la classe Oliver Hazard Perry, parfois appelées FFG-7 ou "Fig 7", constituent une classe nombreuse de navires polyvalents à faible coût. Plus de 70 de ces navires ont été construits pour la Marine américaine (USN) et d’autres marines alliées aux États-Unis. Cette classe a été conçue pour opérer dans des environnements présentant un niveau de menace modéré, avec un système d’armement moins performant et une redondance moindre que celle de la classe Spruance contemporaine. Deux variantes de l'Oliver Hazard Perry sont en production ; il s'agit ici de la version à « coque longue », équipée pour embarquer l'hélicoptère SH-60 LAMPS Mk.III et dotée du réseau remorqué SQR-18 ou SQR-19 TACTAS, ce qui se traduit par une forte augmentation de son potentiel de combat anti-sous-marin.
