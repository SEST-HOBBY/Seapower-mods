Default=Classe Forrestal,Forrestal
DefaultDescription=Considérés comme la première classe de superporte-avions, quatre des porte-avions à propulsion conventionnelle de la classe Forrestal ont été construits à la fin des années 1950. Ces navires étaient extrêmement grands à leur époque et pouvaient embarquer des aéronefs de grandes dimensions. 
