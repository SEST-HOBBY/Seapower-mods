[usn_avp_barnegat_mod]
Type=FF,Frégate
Default=Classe Barnegat(Modifiée),Barnegat
DefaultDescription=Conçue pendant la Seconde Guerre mondiale comme petit navire de ravitaillement pour hydravions de la marine américaine, la classe Barnegat est rapidement devenue obsolète en raison du déclin des hydravions après la guerre. De nombreux navires ont donc été désarmés. Ceux qui sont restés en service ont toutefois été reconvertis en navires de reconnaissance, de patrouille et/ou de formation au sein de marines étrangères, notamment en Éthiopie, en Italie, en Norvège, au Sud-Vietnam et aux Philippines. Dix-huit d'entre eux ont également été transférés à la Garde côtière américaine, où ils sont devenus des vedettes de la classe Casco.
