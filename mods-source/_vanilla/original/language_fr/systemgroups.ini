GSh-6-30=Canon de 30 mm|GSH-6-30 Canon rotatif de 30 mm|Le GSH-6-30 est un canon soviétique à six canons de type Gatling monté sur le MiG-27 et destiné au rôle d'attaque au sol. Sur les navires, il est utilisé sur le support AK-630 CIWS.
NR-23=.Canon de 23 mm|Canon automatique NR-23 de 23 mm|Le NR-23 est un canon automatique soviétique à canon unique et à recul. Il a été utilisé sur de nombreux premiers chasseurs soviétiques et comme armement défensif sur les bombardiers.
AM-23=Canon de 23 mm|AM-23 Canon automatique de 23 mm|L'AM-23 est un canon automatique soviétique à un seul canon, alimenté par gaz et alimenté par bande, utilisé principalement sur les bombardiers et les transports où il a remplacé le canon automatique NR-23 antérieur, à tir plus lent..
N-37=Canon de 37 mm|Canon automatique N-37 de 37 mm|Le N-37 est un canon automatique lourd soviétique à canon unique utilisé principalement sur les chasseurs, où un seul coup suffirait à abattre un bombardier.
NN-37=Canon de 37 mm|Canon automatique NN-37 de 37 mm|Le NN-37 est une version améliorée du canon automatique lourd à canon unique soviétique N-37, avec une cadence de tir augmentée de 50 %.
