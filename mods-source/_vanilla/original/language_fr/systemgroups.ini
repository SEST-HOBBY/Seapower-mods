#---------------------------------------- Radar ----------------------------------------
#---------- Surface ships ----------
#---Air/Air&Surface---
CXAM=CXAM|Le CXAM était le prototype des radars de recherche aérienne à longue portée de la marine américaine. Cet appareil équipait les grands navires de combat juste avant le début de la Seconde Guerre mondiale. Il s'agissait d'un grand matelas de 18 x 16 pieds pouvant s'élever, mais dont le faisceau était trop large pour permettre la détection en hauteur. Le CXAM a directement donné naissance aux radars de recherche aérienne utilisés pendant la guerre, qui étaient presque tous des améliorations progressives par rapport à ce modèle de base.
CXAM-1=CXAM-1|Le CXAM-1 était une amélioration progressive par rapport au CXAM, avec quatorze ensembles au total livrés et installés sur des cuirassés, des croiseurs et des porte-avions. L'antenne conservait son aspect de matelas, mais la capacité d'élévation avait été supprimée. La précision avait été améliorée à 200 mètres, et cet ensemble est resté en service à bord de certains navires jusqu'en 1943. Il a été remplacé sur les grands navires de combat par l'ensemble SK ou SK-2.
SA=SA|La série SA était destinée à reproduire les fonctionnalités et les performances du CXAM avec une antenne plus petite pour une utilisation à bord des navires d'escorte et des navires auxiliaires. Relativement couronnée de succès, la série SA est devenue l'équipement de recherche aérienne standard des destroyers d'escorte et des frégates, et certains ont également été installés sur des destroyers et des croiseurs légers. Ce type d'équipement a également été installé sur les navires des Forces françaises libres qui ont été réaménagés dans les chantiers navals américains à la fin de la guerre.
SC-1=SC-1|Tout comme le SA, le SC était une tentative visant à offrir les performances du CXAM à des navires plus petits grâce à une antenne plus petite. Malheureusement, cette antenne plus petite réduisait la portée effective, et les forces opérationnelles n'appréciaient pas le SC de base. Le SC-1 fut alors introduit en janvier 1942 avec une puissance et une portée doublées, et tous les SC furent rapidement convertis. Cet équipement fut installé sur les destroyers et les navires auxiliaires au début de la guerre avant d'être remplacé par le SC-2 lorsque celui-ci fut disponible.
SC-2=SC-2|Le SC-2 améliorait le SC-1 en agrandissant considérablement l'antenne. Cet appareil intégrait des dispositions pour les systèmes IFF BG et BL, et devint le radar principal des destroyers jusqu'à la fin de la guerre. Des variantes légèrement améliorées du SC-2 (SC-3, SC-4 et SC-5) restèrent en service sur les destroyers jusqu'en 1963.
SK=SK|Le SK était l'équipement standard de recherche aérienne utilisé pendant la guerre sur les grands navires. Il s'agissait essentiellement d'un équipement SC-2 équipé d'une antenne de la taille d'un CXAM. Ce système radar bidimensionnel ne fournissait que des données d'azimut et de distance oblique. Des capteurs supplémentaires étaient nécessaires pour déterminer la hauteur.
SK-2=SK-2|Cet ensemble constituait une amélioration progressive par rapport au SK, avec une antenne parabolique de 17 pieds destinée à réduire les lobes latéraux. À la fin de la guerre, le SK et le SK-2 ont tous deux été critiqués pour leur incapacité à détecter les avions volant à haute altitude en raison de la faible élévation du faisceau. 75 ensembles ont été produits, équipant les plus grands navires de combat lorsqu'ils entraient en service ou arrivaient dans les chantiers navals pour être réaménagés. 
SM=SM|Le SM a été le premier radar américain conçu pour le guidage des chasseurs. Il intégrait un faisceau conique « crayon » permettant de déterminer la hauteur d'une cible aérienne, une fonctionnalité dont ne disposaient pas les radars de recherche aérienne précédents. Le SM était très lourd (18 000 livres, dont 4 000 livres pour l'antenne seule) et ne pouvait être installé que sur de grands porte-avions. Plus tard, les modèles SM-1 et SP ont été construits pour les navires plus petits.
SP=SP|Le SP était le successeur léger du radar de détection d'altitude SM. Cet appareil pouvait être équipé de deux antennes différentes selon le navire qui le recevait, une antenne plus petite étant disponible pour les destroyers et les porte-avions légers. Cet appareil équipait les destroyers radar de la classe Gearing (DDR) qui opéraient au large d'Okinawa. 300 appareils ont été construits et, à la fin de la guerre, il était courant de voir des navires capitaux équipés d'un SP sur le grand mât, complétant un SK ou un SK-2 sur le mât de misaine.
SR=SR|Le SR était le premier radar de recherche aérienne entièrement nouveau depuis le CXAM, intégrant de nombreuses nouvelles fonctionnalités qui avaient été mises au point par les radars précédents. L'antenne était à peu près de la même taille que celle du SC-2, avec une puissance plus que doublée, et équipait les destroyers vers la fin de la guerre. Il équipait également les navires de combat plus grands en tant que radar de recherche aérienne de secours, et est resté en service jusqu'en 1961.
SR-2=SR-2|Le SR-2 était un radar de recherche aérienne 2D de 50 cm initialement destiné aux destroyers d'escorte, mais qui s'est avéré beaucoup trop volumineux après le début de sa production. Les modèles pilotes ont équipé les grands porte-avions de la classe Midway ainsi que plusieurs croiseurs légers et les quatre premiers radars de surveillance sous-marine (SSR). Cet appareil a été remplacé par l'AN/SPS-6 en raison de ses performances inférieures.
SR-3=SR-3|Les SR-3 et SR-6 ont été conçus pour remplacer les SK et SC dans toute la flotte, utilisant la bande L pour de meilleures performances avec moins d'atténuation. Les deux appareils ont donné de mauvais résultats dans la réalité en raison des antennes choisies, qui ont été décrites comme « insuffisantes » dans un rapport d'après-guerre. Le SR-6 était une version plus légère du SR-3, avec une antenne plus petite.
SR-6=SR-6|Les SR-3 et SR-6 ont été conçus pour remplacer les SK et SC dans toute la flotte, utilisant la bande L pour de meilleures performances avec moins d'atténuation. Les deux appareils ont donné de mauvais résultats dans la réalité en raison des antennes choisies, qui ont été décrites comme « insuffisantes » dans un rapport d'après-guerre. Le SR-6 était une version plus légère du SR-3, avec une antenne plus petite.
SPS-6=SPS-6|L'AN/SPS-6 est un radar bidimensionnel utilisé par la marine américaine comme radar de recherche aérienne de première génération après la Seconde Guerre mondiale et a été largement exporté vers les alliés. Comme l'AN/SPS-6 est un radar 2D, il ne fournit que des données d'azimut et de portée oblique. Des capteurs supplémentaires doivent être utilisés pour déterminer la hauteur.
SPS-12=SPS-12|En service des années 1950 aux années 1980, l'AN/SPS-12 est un radar de surveillance aérienne et de surface bidimensionnelle à moyenne portée.
SPS-29=SPS-29|L'AN/SPS-29 est un radar bidimensionnel utilisé par la marine américaine comme radar d'alerte avancée après la Seconde Guerre mondiale et qui était installé à bord des navires de guerre pendant la guerre froide. En tant que radar 2D, il fournit uniquement des données d'azimut et de portée oblique. Des capteurs supplémentaires doivent être utilisés pour déterminer la hauteur.
SPS-30=SPS-30|Une version modernisée de l'AN/SPS-8 combinée à un émetteur plus puissant, l'AN/SPS-30 est un système radar de recherche et de mesure de hauteur en bande S intégré à bord, utilisé pour la détection et la surveillance des aéronefs..
UPA-43=UPA-43|L'AN/UPA-43 est un interrogateur d'identification ami-ennemi (IFF) utilisé par la marine américaine. Les radars ultérieurs comme l'AN/SPS-48 disposent d'un interrogateur IFF intégré qui élimine le besoin d'une antenne séparée.
SPS-32=SPS-32|Faisant partie du célèbre système SCANFAR utilisé par l'USS Enterprise et l'USS Long Beach, l'AN/SPS-32 est la partie du système d'antenne orientée horizontalement et est utilisée principalement pour la surveillance aérienne.
SPS-33=SPS-33|Faisant partie du célèbre système SCANFAR utilisé par l'USS Enterprise et l'USS Long Beach, l'AN/SPS-33 est la partie du système d'antenne orientée verticalement et est utilisée principalement pour le suivi des cibles.
SPS-37=SPS-37|L'AN/SPS-37 est un radar bidimensionnel utilisé par la marine américaine comme radar d'alerte avancée au début de la guerre froide. Il s'agit d'une amélioration de l'AN/SPS-29. En tant que radar 2D, il fournit uniquement des données d'azimut et de portée oblique. Des capteurs supplémentaires doivent être utilisés pour déterminer la hauteur.
SPS-39=SPS-39|L'AN/SPS-39 est un radar 3D de recherche aérienne à longue portée qui fournit le relèvement, la portée et l'altitude. Comme le SPS-48, plus grand, il est tourné mécaniquement pour l'azimut mais balayé électroniquement pour l'élévation. Le radar 3D sert d'intermédiaire entre le radar d'alerte avancée 2D et les radars de conduite de tir utilisés pour l'engagement des cibles.
SPS-40=SPS-40|L'AN/SPS-40 est un radar de recherche aérienne 2D longue portée, commun à de nombreux navires américains. En tant que radar 2D, il ne fournit que des données d'azimut et de portée oblique. Des capteurs supplémentaires doivent être utilisés pour déterminer la hauteur.
SPS-43=SPS-43|L'AN/SPS-43 est un système radar de recherche aérienne à très longue portée utilisé principalement sur les porte-avions et les croiseurs lance-missiles américains. Fonctionnant dans la bande VHF, l'AN/SPS-43 utilise également le saut de fréquence pour contrer les tentatives de brouillage. En tant que radar 2D, il ne fournit que des données d'azimut et de portée oblique.
SPS-48=SPS-48|L'AN/SPS-48 est un radar de recherche aérienne 3D à longue portée. L'azimut de la cible est détecté par balayage mécanique en faisant tourner l'antenne entière sur sa base, tandis que l'élévation est déterminée par balayage électrique. Le radar 3D agit comme un intermédiaire entre le radar d'alerte avancée 2D et les radars de contrôle de tir utilisés pour engager les cibles.
SPS-48E=SPS-48E|L'AN/SPS-48E est un radar de surveillance aérienne 3D à longue portée. L'azimut de la cible est détecté par balayage mécanique, grâce à la rotation de l'ensemble de l'antenne sur sa base, tandis que l'élévation est déterminée par balayage électrique. Le radar 3D sert d'intermédiaire entre le radar d'alerte précoce 2D et les radars de conduite de tir utilisés pour engager les cibles.\nIl s'agit de la version améliorée du SPS-48 spécifique à la NTU, dotée d'une nouvelle antenne et de capacités nettement améliorées en matière de détection à basse altitude et de contre-mesures électroniques (ECCM), et dont la portée effective est encore plus longue.
SPS-49=SPS-49|L'AN/SPS-49 est un radar de recherche aérienne 2D longue portée qui succède au SPS-40. Il s'agit du radar de recherche aérienne principal de nombreux navires américains et alliés. Sur les navires plus anciens, il a remplacé le SPS-40 lors du programme de mise à niveau de la NTU.
SPS-49V5=SPS-49(V)5|L'AN/SPS-49(V)5 est un radar de recherche aérienne 2D à longue portée qui succède au SPS-40. Il s'agit du radar de recherche aérienne principal de nombreux navires américains et alliés. Sur les navires plus anciens, il a remplacé le SPS-40 dans le cadre du programme de modernisation NTU. Il s'agit d'un modèle amélioré et plus puissant, issu du programme NTU et installé a posteriori sur d'autres navires, qui offre une altitude minimale plus basse et de meilleures performances en matière de contre-mesures électroniques (ECCM).
SPS-52=SPS-52|L'AN/SPS-52 est un radar de recherche aérienne 3D à longue portée utilisé pour fournir le relèvement, la distance et l'altitude. Comme le SPS-48, plus grand, il est pivoté mécaniquement pour l'azimut mais balayé électroniquement pour l'élévation. Le radar 3D agit comme un intermédiaire entre le radar d'alerte avancée 2D et les radars de contrôle de tir utilisés pour engager les cibles.
SPN-43=SPN-43|Le SPN-43|AN/SPN-43 est un radar ATC 2D utilisé à bord des porte-avions et autres navires capables de voler pour permettre l'identification et le contrôle des aéronefs dans un rayon de 50 milles du navire..
SPY-1A=SPY-1A|L'AN/SPY-1 est un réseau passif à balayage électronique 3D à longue portée et constitue un élément clé du système de combat AEGIS. Quatre antennes distribuées et contrôlées par ordinateur sont utilisées pour fournir une couverture continue à 360 degrés de l'espace aérien autour du navire. 
MK-23_TAS=MK-23 TAS|Le Mk. 23 TAS (Target Acquisition System) est un petit radar 2D à moyenne portée à rotation rapide pour détecter les attaques de missiles rasants ou à grand angle, utilisé en conjonction avec le système de défense ponctuelle Sea Sparrow de l'OTAN.

#---Surface only---
SPS-10=SPS-10|L'AN/SPS-10 est un radar de recherche de surface bidimensionnel équipant de nombreux navires américains et alliés pendant l'après-guerre et la guerre froide.. 
SPS-55=SPS-55|L'AN/SPS-55 est un radar de recherche et de navigation de surface à semi-conducteurs qui équipe la classe Spruance et ses dérivés, ainsi que les frégates Oliver Hazard Perry et les dragueurs de mines de classe Avenger.
SPS-67=SPS-67|L'AN/SPS-67 est un radar de recherche de surface à courte portée couramment utilisé à bord des navires américains pour la détection et le suivi des contacts en surface et à très basse altitude.

#---Fire Control---
#SAM
MK-115=MK-115|Le Mk-115 est un directeur habité fournissant l'éclairage de la cible pour le système de missiles de défense ponctuelle de base Sea Sparrow (BPDMS).
MK-95=MK-95|Le radar de contrôle de tir Mk-95 fait partie du système de missiles de défense ponctuelle Sea Sparrow de l'OTAN, qui fournit un éclairage de cible pour le système de missiles à tête chercheuse radar semi-actif.
SPW-2=SPW-2|L'AN/SPW-2 est un radar de guidage à utiliser avec le missile RIM-8 Talos pour la partie de vol du missile.
SPG-49=SPG-49|L'AN/SPG-49 est un radar de contrôle de tir pour le missile RIM-8 Talos. Il est utilisé pour le suivi de cible et l'éclairage terminal pour la partie semi-active de guidage radar du profil de vol du missile.
SPG-51=SPG-51|L'AN/SPG-51 est un radar de contrôle de tir de missiles et de canons en bande C et X, utilisé avec les systèmes de missiles Tartar et Standard MR.
SPG-55=SPG-55|L'AN/SPG-55 est un radar de contrôle de tir qui assure le suivi et l'éclairage des systèmes de missiles Terrier et Standard ER. Un mode de suivi de surface spécial permet d'utiliser les missiles dans un rôle anti-surface.
SPG-60=SPG-60|Le radar d'éclairage de cible séparé (STIR) AN/SPG-60 est un radar de suivi et d'éclairage de cible monopulse en bande X pour les systèmes de missiles Tartar et Standard MR sur les navires équipés du système de contrôle de tir du canon Mk-86.
SPG-62=SPG-62|L'AN/SPG-62 est un radar de contrôle de tir à ondes continues en bande X utilisé pour l'éclairage terminal des missiles SM-2 standard sur les navires équipés du système de combat AEGIS.
SYR-1=SYR-1|Le SYR-1 est un ensemble d'antennes de liaison de données américain utilisé pour recevoir les commandes descendantes des missiles SM-2. Il est principalement utilisé sur les navires SM-2ER, puis sur les navires SM-2MR et SM-2ER modernisés par NTU. Ses performances sont limitées par rapport au système AEGIS, mais il permet de disposer d'un nombre beaucoup plus important de missiles en vol par rapport à un navire de guerre SM-1.
SYR-1_NTU=SYR-1 (NTU)|
SYS-1=SYS-1
#Guns
MK37_GFCS_MK4=Mark 37 GFCS (Radar Mark 4 "FD")|Le MK.37 est un directeur de contrôle de tir pour les systèmes de canons à double usage de calibre 5"/38, capable d'engager des cibles aériennes et de surface.
MK37_GFCS_MK12=Mark 37 GFCS (Radar Mark 12/22)|Le système de conduite de tir Mark 37 (GFCS) contrôle le canon double usage de 5 pouces/calibre 38. Le directeur est équipé du radar de télémétrie Mark 12 ainsi que du télémètre Mark 22. Cette combinaison de directeur et de radar équipait presque tous les navires de guerre nouvellement construits ou rénovés à la mi-1944.
MK37_GFCS_MK28=Mark 37 GFCS (Radar Mark 28)|Le système de conduite de tir Mark 37 (GFCS) contrôle le canon double usage de 5 pouces/calibre 38. Le directeur est équipé d'une petite antenne parabolique du radar de télémétrie Mark 28, une innovation permettant de réduire le poids pour les anciens navires de guerre réaménagés où les contraintes de poids ne permettaient pas d'installer les systèmes Mark 12 et Mark 22 habituellement montés sur le directeur Mark 37.
MK37_GFCS=MK37 GFCS|Le système de conduite de tir Mark 37 (GFCS) contrôle le canon double usage de 5 pouces/calibre 38. Le directeur est équipé du radar de télémétrie Mark 25, une combinaison standard pour toutes les installations Mark 37 d'après-guerre. Sous cette forme, le Mark 37 GFCS est resté en service jusqu'au début des années 1990.
MK38_GFCS_MK3=Mark 38 GFCS (Radar Mark 3 "FC")|Le système de conduite de tir Mark 38 (GFCS) dirige les canons de calibre principal des cuirassés, assurant une conduite de tir très précise contre des cibles maritimes et terrestres. Ce système comprenait un poste de commandement blindé situé au sommet des grandes superstructures des cuirassés des classes North Carolina, South Dakota et Iowa. Il équipait également les grands croiseurs de la classe Alaska. Ce poste de commandement est équipé du radar de télémétrie Mark 3 « FC », l'un des premiers systèmes de contrôle de tir américains. Cette combinaison poste de commandement/radar a été largement utilisée en 1942 et 1943, avant d'être remplacée par les systèmes Mark 8 puis Mark 13.
MK38_GFCS=MK38 GFCS|Le système de contrôle de tir des canons MK38 (GFCS) contrôle les gros canons de la batterie principale des cuirassés de classe Iowa. Il est capable de diriger des tirs extrêmement précis contre des cibles maritimes et terrestres.
MK56_GFCS=MK56_GFCS|Le système de contrôle de tir Mk-56 est utilisé sur les navires équipés de canons de 3" et 5". Un radar de suivi en bande X permet aux navires d'engager à la fois des cibles de surface et des cibles aériennes rapides.
MK63_GFCS=MK63_GFCS|Le système de contrôle de tir Mk-63 est utilisé sur les navires équipés de canons de 3" et 5". Un radar de suivi en bande X permet aux navires d'engager à la fois des cibles de surface et des cibles aériennes rapides.
MK68_GFCS=MK68 GFCS|Le système de contrôle de tir Mk-68 est utilisé sur les navires équipés de supports de canon Mk-42 5"/54. Un tracker radar à bande X permet aux navires d'engager à la fois des cibles de surface et des cibles aériennes rapides.
MK86_GFCS=MK86 GFCS|Le système de contrôle de tir Mk-86 est utilisé sur les navires équipés de supports de canon Mk-45 5"/54. Un tracker radar à bande X permet aux navires d'engager à la fois des cibles de surface et des cibles aériennes rapides. Contrairement aux directeurs précédents, il est sans pilote et utilise des caméras de télévision distantes pour la sauvegarde optique.
MK92_FCS=MK92 FCS|Le Mk-92 est une version sous licence du radar de contrôle de tir néerlandais WM-25 utilisé par l'USN sur les frégates de classe Oliver Hazard Perry et les hydroptères Pegasus, où il contrôle les missiles MR standard et le canon de 76 mm des navires.
MK92_SearchRadar=Radar MK92|Le Mk-92 comprend deux radars : un radar de recherche et de poursuite et un radar de conduite de tir à onde continue. Il s'agit ici du radar de recherche, qui peut suivre simultanément deux cibles de surface et guider les tirs vers celles-ci.
SPQ-9=SPQ-9|L'AN/SPQ-9 est le radar à bande X associé au système de contrôle de tir Mk-86.

#---------- Submarines ----------
BPS-14_15=BPS-14|L'AN/BPS-14 est un radar de recherche de surface utilisé par les sous-marins américains pour la navigation.

