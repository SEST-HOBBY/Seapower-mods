GenericECM=Generic ECM|Les brouilleurs ECM (Electronic Counter Measures) peuvent fournir un barrage (bruit) de brouillage des radars ennemis, réduisant considérablement leur portée de détection jusqu'à ce que le radar ait suffisamment d'énergie pour "brûler" le bruit de fond. Ils peuvent également intercepter les signaux radar ennemis, les moduler et les retransmettre au récepteur afin de confondre le radar ennemi quant à l'emplacement réel de la cible.
AircraftDECM_Early=Brouilleur ECM défensif|L'ECM défensif (DECM) peut intercepter les signaux radar ennemis, les moduler et les retransmettre au récepteur afin de confondre le radar ennemi quant à l'emplacement réel de la cible.
