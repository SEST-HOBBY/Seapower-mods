AN/APY-1=AN/APY-1|L'AN/APY-1 est un radar de recherche aérienne et de surface à très longue portée utilisé sur l'E-3 AWACS pour fournir une alerte avancée et des fonctionnalités de commandement et de contrôle de bataille.
LN-66=LN-66|Le LN-66 est un système de recherche de surface à courte portée civil qui équipe de nombreux navires commerciaux et militaires, mais est également utilisé sur l'hélicoptère SH-2F LAMPS.
AN/ASB-1B=AN/ASB-1B
AN/APS-20=AN/APS-20|L'AN/APS-20 est un radar de recherche aérienne à longue portée en bande S utilisé par le P-2H Neptune.
AN/APS-80=AN/APS-80|L'AN/APS-80 est un radar maritime à longue portée de surveillance aérienne et de recherche de surface fonctionnant en bande X. Cet ensemble radar utilise des antennes à balayage mécanique pour offrir une couverture à 360 degrés. Il a été installé sur les premiers avions P-3 Orion et sur les US-1 japonais.
AN/APS-96=AN/APS-96
AN/APS-115=AN/APS-115|L'AN/APS-115 est un radar de recherche de surface en bande X utilisé par le P-3 Orion. Le radar a été développé à partir de l'AN/APS-80A.
AN/APS-116=AN/APS-116|L'AN/APS-116 est un radar de recherche de surface spécialement conçu pour détecter les périscopes et les mâts sous-marins, qui peuvent n'être visibles que pendant de brèves périodes..
AN/APS-125=AN/APS-125|L'AN/APS-125 est un radar de recherche aérienne longue portée à bande UHF utilisé pour l'alerte avancée aéroportée par l'USN.
AN/APQ-110=AN/APQ-110
AN/APQ-113=AN/APQ-113
AN/APQ-126=AN/APQ-126|L'AN/APQ-126 est un radar de navigation et d'attaque embarqué utilisé sur les avions d'attaque A-7D et A-7E, offrant une capacité d'attaque par tous les temps.
AN/APS-138=AN/APS-138|L'AN/APS-138 est un radar de surveillance aérienne à longue portée fonctionnant dans la bande UHF, utilisé par la Marine américaine pour la détection précoce aérienne.
AN/APQ-144=AN/APQ-144
AN/APQ-148=AN/APQ-148|L'AN/APQ-148 est un radar aéroporté multimode utilisé sur les variantes ultérieures de l'A-6 où il offre une capacité d'attaque avancée à basse altitude par tous les temps.
AN/APQ-156=AN/APQ-156|L'AN/APQ-156 est un radar aéroporté multimode utilisé sur l'A-6E TRAM, où il offre une capacité avancée d'attaque à basse altitude par tous les temps. 
AN/APQ-161=AN/APQ-161
AN/APD-7=AN/APD-7
AN/AWG-9=AN/AWG-9|Le radar AN/AWG-9 est un radar longue portée de suivi et de balayage spécialement conçu pour être utilisé avec le système de missiles AIM-54 Phoenix, où il permet l'engagement simultané de six cibles maximum. Il n'équipe donc que le F-14.
AN/AWG-9_Phoenix=AN/AWG-9 (Guidage AIM-54)|Mode de guidage spécial pour le système de missiles AIM-54 Phoenix qui permet d'engager simultanément jusqu'à six cibles. Ce mode ne s'applique qu'à l'AIM-54 et il n'est possible de guider qu'un seul AIM-7 à la fois.
AN/APG-53=AN/APG-53A|L'APG-53A est un radar de cartographie au sol et de bombardement à courte portée utilisé par l'A-4 Skyhawk.
AN/APG-63=AN/APG-63|L'AN/APG-63 est un radar de suivi et de balayage longue portée qui équipe le F-15.
AN/APQ-109=AN/APQ-109|L'AN/APQ-109 est un radar multimode longue portée utilisé sur le F-4D.
AN/APQ-120=AN/APQ-120|L'AN/APQ-120 est un radar multimode longue portée utilisé sur le F-4E.
AN/AWG-10A=AN/AWG-10|L'AN/AWG-10 est un radar intégré multimode longue portée utilisé sur le F-4J.
AN/AWG-10B=AN/AWG-10B|L'AN/AWG-10B est un radar intégré multimode à longue portée utilisé sur le F-4S. Il dispose de capacités Doppler à impulsions et est le premier radar de chasse américain capable d'effectuer des missions de surveillance et d'interception vers le bas. Il s'agit d'une version améliorée de l'AWG-10A, dotée d'une électronique à semi-conducteurs et offrant de meilleures performances à basse altitude.
AN/AWG-11=AN/AWG-11|L'AN/AWG-11 est un radar intégré multimode à longue portée. Il dispose de capacités Doppler à impulsions et est le premier radar de chasse américain capable d'effectuer des missions de surveillance et d'interception.\nIl s'agit du modèle d'exportation de l'AWG-10A du F-4J, utilisé sur les F-4 Phantom britanniques et les T-2 de la JASDF.
AN/AWG-12=AN/AWG-12|L'AN/AWG-12 est un radar intégré multimode à longue portée. Il dispose de capacités Doppler à impulsions et est le premier radar de chasse américain capable d'effectuer des missions de surveillance et d'interception.\nIl s'agit du modèle d'exportation de l'AWG-10B du F-4S, utilisé sur les F-4 Phantom britanniques et les F-1 de la JASDF.
