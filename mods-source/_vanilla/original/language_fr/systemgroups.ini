MK16_Gun=Canon MK 16|Canon Mk 16 de calibre 6"/47|Le canon Mk 16 de calibre 6"/47 était utilisé dans les batteries principales de plusieurs croiseurs légers de l'US Navy d'avant-guerre et de la Seconde Guerre mondiale. Ils étaient principalement montés dans des tourelles triples et utilisés contre des cibles de surface. Le canon Mk 16DP était un équipement à double usage du Mk 16 pour une utilisation contre les avions ainsi que contre les navires de surface. Il a été installé dans les croiseurs légers de classe Worcester d'après-guerre et dans le navire d'entraînement au tir antiaérien Mississippi.
