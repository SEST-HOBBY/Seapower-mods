ActiveIntercept_Early=Intercepteur acoustique|Un système d'interception acoustique (Active Intercept) est un système d'alerte de détection de sonars actifs ; un réseau de sonars détecte et détermine le relèvement et l'identité des signaux émis par les sonars actifs, qu'ils proviennent de sonars embarqués sur des navires ou des sous-marins, ou encore de têtes chercheuses actives de torpilles. Ces équipements couvrent un angle de 360 degrés autour du sous-marin et peuvent détecter des émissions actives dans le "cône de silence" (ou baffle) où les sonars passifs ne peuvent pas capter de signaux.
ActiveIntercept_Late=Intercepteur acoustique|Un système d'interception acoustique (Active Intercept) est un système d'alerte de détection de sonars actifs ; un réseau de sonars détecte et détermine le relèvement et l'identité des signaux émis par les sonars actifs, qu'ils proviennent de sonars embarqués sur des navires ou des sous-marins, ou encore de têtes chercheuses actives de torpilles. Ces équipements couvrent un angle de 360 degrés autour du sous-marin et peuvent détecter des émissions actives dans le "cône de silence" (ou baffle) où les sonars passifs ne peuvent pas capter de signaux.
