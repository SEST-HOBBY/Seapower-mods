Top_Dome=Top Dome|Le 3R41 "Volna" (désignation OTAN : Top Dome) est un radar de contrôle de tir pour le système SAM SA-N-6. Il peut suivre jusqu'à 3 cibles simultanément et les engager avec jusqu'à 2 missiles chacune.
Pop_Group=Pop Group|Le 4R-33A "Osa" (désignation OTAN : Pop Group) est un radar de contrôle de tir pour le système de défense antiaérienne ponctuelle SA-N-4. Il peut engager une seule cible avec une salve de deux missiles par radar. En plus de l'illuminateur CW, le complexe est équipé de son propre radar de recherche dédié, ce qui le rend comparable à la combinaison d'illuminateur Mk-23 TAS/Mk-95 utilisée par le Sea Sparrow de l'OTAN.
Pop_Group_Search=Pop Group|Le 4R-33A "Osa" (désignation OTAN : Pop Group) est un radar de contrôle de tir pour le système de défense antiaérienne ponctuelle SA-N-4. Il peut engager une seule cible avec une salve de deux missiles par radar. En plus de l'illuminateur CW, le complexe est équipé de son propre radar de recherche dédié, ce qui le rend comparable à la combinaison d'illuminateur Mk-23 TAS/Mk-95 utilisée par le Sea Sparrow de l'OTAN.
Cross_Sword=Cross Sword|Le 3R95 "Tor" (désignation OTAN : Cross Sword) est un radar de contrôle de tir pour le système de défense antiaérienne ponctuelle SA-N-9. Comme le précédent Pop Group, il s'agit d'un système autonome doté de son propre radar de recherche dédié, mais un nouveau système de contrôle de tir numérique permet de suivre jusqu'à 10 cibles à la fois, ce qui le rend beaucoup plus apte à faire face aux attaques de saturation.
Cross_Sword_Search=Cross Sword|Le 3R95 "Tor" (désignation OTAN : Cross Sword) est un radar de contrôle de tir pour le système de défense antiaérienne ponctuelle SA-N-9. Comme le précédent Pop Group, il s'agit d'un système autonome doté de son propre radar de recherche dédié, mais un nouveau système de contrôle de tir numérique permet de suivre jusqu'à 10 cibles à la fois, ce qui le rend beaucoup plus apte à gérer les attaques de saturation.
Front_Dome=Front Dome|Le 3R90 "Uragan" (désignation OTAN : Front Dome) est un radar de contrôle de tir pour le système de défense antiaérienne de zone SA-N-7. Il s'appuie sur le MR-750 Top Steer pour l'acquisition de la cible, et Front Dome gère le suivi et l'engagement. Chaque directeur peut engager une seule cible avec jusqu'à deux missiles.

