ConditionTypeTooltipUnitDetected=La condition se déclenche lorsque la ou les unités de condition spécifiées sont détectées par le camp de condition spécifié. La détection peut se faire par radar, sonar, visuellement ou par ESM.
ConditionTypeTooltipUnitClassified=La condition se déclenche lorsque les unités de condition spécifiées sont classifiées par le camp de condition spécifié. La classification signifie que l'unité est détectée et que son camp est connu, mais qu'elle n'est pas nécessairement totalement identifiée.
ConditionTypeTooltipUnitsAreOutOfAmmo=La condition se déclenche lorsque les unités spécifiées sont à court de munitions. À titre expérimental, cette condition exige que l'unité soit complètement à court de tous les types de munitions. Modifiez le fichier INI de la mission pour définir les exigences spécifiques en matière de munitions !
ConditionTypeTooltipUnitHasNoGuidanceSystems=La condition se déclenche si tous les radars de contrôle de tir de l'unité sont détruits - destiné à être utilisé avec des sites SAM.
ConditionTypeTooltipUnitDamageState=La condition se déclenche lorsque les unités de condition spécifiées atteignent un seuil d'intégrité ou ont des capteurs, armes ou systèmes de propulsion inopérants
DamageConditionModeTooltip=Sélectionnez l'état de dégâts que les unités de condition doivent atteindre
DamageThresholdPercentTooltip=Pour les contrôles d'intégrité, la condition se déclenche lorsque l'intégrité de l'unité est égale ou inférieure à ce pourcentage
ConditionTypeTooltipTriggerCompleted=La condition se déclenche si le déclencheur spécifié est lui-même activé.
ConditionTypeTooltipTriggerFailed=La condition se déclenche si le déclencheur spécifié échoue.
TriggerCompletedFailedTooltip=Définir le déclencheur qui doit être terminé ou échoué (à utiliser avec les types Condition Remplie et Condition Echouée).
