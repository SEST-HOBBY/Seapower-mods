ConditionTypeTooltipGeneric=Les conditions génériques sont toujours VRAIES au début de la mission.
ConditionTypeTooltipTime=Les conditions temporelles se déclencheront lorsque l'heure spécifiée pour la mission sera atteinte. Assurez-vous que la date et l'heure de configuration sont cochées.
ConditionTypeTooltipNoIncomingWeapons=La condition se déclenche si aucune arme n'est détectée à l'approche du côté spécifié dans la condition - expérimental !
ConditionTypeTooltipUnitDestroyed=La condition se déclenche lorsque les unités de condition spécifiées sont détruites.
