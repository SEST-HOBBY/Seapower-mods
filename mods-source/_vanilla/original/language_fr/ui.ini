[LoadScreen]
WarningPSE=Un très faible pourcentage de personnes peut subir des crises d'épilepsie lorsqu'elles sont exposées à certains motifs lumineux ou à des lumières clignotantes. L'exposition à certains motifs ou arrière-plans sur un écran d'ordinateur ou pendant la lecture de jeux vidéo peut provoquer une crise d'épilepsie chez ces personnes. Certaines conditions peuvent provoquer des symptômes épileptiques non détectés auparavant, même chez des personnes n'ayant jamais eu de crises ou d'épilepsie.\r\n\r\nSi vous ou un membre de votre famille souffrez d'épilepsie, consultez votre médecin avant de jouer. Si vous ressentez l'un des symptômes suivants en jouant à un jeu vidéo ou informatique -- étourdissements, altération de la vision, contractions oculaires ou musculaires, perte de conscience, désorientation, mouvements involontaires ou convulsions -- cessez IMMÉDIATEMENT l'utilisation et consultez votre médecin avant de reprendre le jeu.
WarningValidity=Le contenu des fichiers du jeu ne correspond pas à la somme de contrôle attendue. Veuillez fermer le jeu, supprimer le contenu du dossier /StreamingAssets/original et vérifier l'intégrité via Steam. \r\n\r\nEn appuyant sur Supprimer le dossier, celui-ci sera automatiquement supprimé, ce qui obligera Steam à le télécharger à nouveau lors du prochain lancement.
CloseGame=Sortir du jeu
DeleteOriginal=Supprimer le dossier
WarningMods=Les mods activés suivants ne sont pas déclarés compatibles avec cette version de Sea Power par leur auteur. Souhaitez-vous les désactiver ?
DisableMods=Désactiver les mods incompatibles
KeybindingsUpdatedHeader=Contrôles mise à jour
