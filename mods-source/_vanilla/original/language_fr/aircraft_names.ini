DefaultDescription=Le 707, l'un des premiers avions de ligne américains, fut l'un des appareils les plus populaires des années 1960. Bien qu'il ne soit pas le premier avion de ligne commercial en service, le 707 fut le premier à se généraliser et on lui attribue souvent le mérite d'avoir inauguré l'ère du jet. Il a dominé le transport aérien de passagers dans les années 1960 et est resté courant dans les années 1970, sur les vols intérieurs, transcontinentaux et transatlantiques, ainsi que pour les applications cargo et militaires. 
