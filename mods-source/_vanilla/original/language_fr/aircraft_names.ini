[jmsdf_ps-1]
Type=Patrouilleur maritime,MPA
Default=PS-1,PS-1
DefaultDescription=Le PS-1 est un hydravion japonais conçu pour la lutte anti-sous-marine et la patrouille maritime. Entré en service en 1971 au sein de la JMSDF, il emportait des torpilles à tête chercheuse, des grenades sous-marines, des roquettes Zuni de 5 pouces, ainsi que des bouées acoustiques. Intégrant de nombreuses innovations pour l'époque, le PS-1 était capable d'amerrir dans des eaux atteignant 3 mètres de haut. Parmi les modifications ultérieures, on compte l'avion de recherche et de sauvetage US-1A, et un appareil a été transformé expérimentalement en avion ravitailleur pour la lutte aérienne contre les incendies. Le PS-1 a été progressivement abandonné dans les années 1980 au profit du P-3 Orion pour les missions de patrouille maritime.
Squadron1=PS-1,PS-1
Squadron2=PS-1,PS-1
Callsigns=Squadron1,Stingray|Squadron2,Starfish

[jmsdf_us-1]
Type=Patrouilleur maritime,MPA
Default=US-1A,US-1A
DefaultDescription=L'US-1A est un avion amphibie japonais conçu pour la recherche et le sauvetage. Il est entré en service au sein de la JMSDF dans les années 1970, aux côtés du PS-1, destiné à la lutte anti-sous-marine. L'US-1A a servi avec distinction jusqu'en 2017, avant d'être retiré du service et remplacé par l'US-2, un appareil moderne. Entre 1976 et 1999, les US-1A ont permis le sauvetage de plus de 550 vies humaines en mer.
Squadron1=US-1A 31st Fleet Air Wing,US-1A
Squadron2=US-1A,US-1A
Callsigns=Squadron1,Seagull|Squadron2,Marlin

