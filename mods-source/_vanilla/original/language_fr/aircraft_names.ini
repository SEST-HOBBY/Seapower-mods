[usn_qh-50c]
Type=Hélicoptère Drone
Default=QH-50C,QH-50
DefaultDescription=Le QH-50 DASH (Hélicoptère Drone Anti-Sous-marins) est destiné à servir d'arme anti-sous-marine à longue portée pour les navires trop petits pour accueillir un hangar et un hélicoptère. Élément majeur du programme FRAM, le QH-50 a été affecté à des navires plus anciens, tels que les destroyers de classe Gearing, et a également équipé les escorteurs d'océan d'après-guerre. L'hélicoptère a souffert d'un taux de défaillance élevé, car il s'est avéré peu fiable en service à bord des navires, et a été retiré du service en 1973. La JMSDF était la seule marine étrangère à utiliser le QH-50, qui a connu un plus grand succès dans ses opérations grâce à un service régulier, avant d'être retiré du service en 1977. Le QH-50C a été la première variante de production, propulsée par un turbomoteur de 300 ch, avec 373 appareils construits.
Squadron1=QH-50,QH-50
Callsigns=Squadron1,Dash

