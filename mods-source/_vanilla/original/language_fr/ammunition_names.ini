# ----------------- Leurre ----------------
usn_an_slq_25_nixie_decoy=AN/SLQ-25,Nixie,Le Nixie (anciennement AN/SLQ-25) est un système de leurre remorqué utilisé principalement par les navires de surface de l'US Navy. Le système génère des signaux conçus pour attirer les torpilles qui s'approchent loin de la plate-forme hôte.

usn_moss=MOSS,MK-70,Leurre,Le MOSS (Mobile Submarine Simulator) Mk 70 est un leurre de 10 pouces de diamètre utilisé pour éloigner le sonar ennemi du sous-marin qui le lance. Le MOSS est capable de simuler le bruit propre d'un sous-marin ainsi que son sonar actif.

wp_mg-44=MG-44,Korund,Leurre,Le MG-44 Korund est un simulateur de sous-marin hydroacoustique autopropulsé de deuxième génération. Il est conçu pour être lancé à partir de tubes spéciaux de 400 mm sur des sous-marins soviétiques.
wp_mg-74=MG-74,Korund-2,Leurre,Le MG-74 Korund-2 est un simulateur sous-marin hydroacoustique automoteur de troisième génération. Contrairement à son prédécesseur, le MG-44, il peut être lancé à partir de tubes standard de 533 mm et dispose de capacités très sophistiquées de génération de bruit, d'émission de signaux trompeurs ou de brouillage acoustique ; il peut également être déployé à partir d'un avion.

