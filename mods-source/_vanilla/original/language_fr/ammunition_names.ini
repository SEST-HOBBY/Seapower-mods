[AmmunitionNames]
# ------------------ AAM ------------------ CHERCHER "sans description"
it_aspide_1a=Aspide Mk.1A,,AAM,Le missile Aspide est un missile air-air italien à moyenne portée, dérivé du missile américain Sparrow. Issu de l'AIM-7E, ce missile est équipé d'un moteur amélioré, qui augmente sa portée et sa vitesse, ainsi que d'un autodirecteur monopulse considérablement perfectionné, qui permet des tirs à basse altitude et offre des performances accrues en matière de contre-mesures électroniques.

fr_r530em=R530FE (SARH),,SARH AAM,Le R530FE est un missile air-air français semi-actif à courte portée. Comptant parmi les tout premiers missiles air-air à tête chercheuse d'origine française, le R530 n'est pas une arme particulièrement fiable ni puissante, mais il dispose d'un moteur à combustion relativement longue et d'une portée respectable par rapport à ses contemporains de l'époque.
fr_super-530f=Super-530F,,AAM,Le Super-530F est un missile air-air semi-actif français de courte et moyenne portée. A peu près analogue à l'AIM-7, il s'agit d'une mise à niveau du missile R530 précédent.
fr_r550=R550,Magic 1,AAM,Le R550 Magic 1 est un missile air-air à courte portée à guidage infrarouge français comparable au missile américain AIM-9. Il est à orientation arrière uniquement.

pla_pl-2=PL-2,PL-2,IR AAM,Le PL-2 est un missile air-air infrarouge chinois à guidage arrière. Il s'agit d'une copie du Vympel K-13 soviétique, aux performances très similaires. Il est limité au guidage (aspect) arrière.
pla_pl-2b=PL-2B,,IR AAM,Le PL-2B est un missile air-air chinois à guidage infrarouge arrière. Le PL-2B utilise un cône avant plus long pour loger un autodirecteur légèrement amélioré, mais il s'agit sinon d'une mise à niveau mineure en termes de fiabilité par rapport au PL-2A.
pla_pl-5b=PL-5B,,IR AAM,Le PL-5B est un missile air-air chinois à guidage infrarouge arrière. Développé parallèlement au PL-2B, le PL-5B est né de l'échec du missile à guidage radar PL-5A. Il utilise un chercheur infrarouge dérivé du PL-2B, mais avec une cellule plus performante en termes de portée et de performances de virage. Guidage arrière uniquement.
pla_pl-5c=PL-5C,,IR AAM,Le PL-5C est un missile air-air chinois à guidage infrarouge omnidirectionnel. Amélioration majeure par rapport aux séries PL-2 et PL-5B, le PL-5C intègre un autodirecteur à réseau croisé de pointe, qui permet un tir omnidirectionnel et une résistance significative aux contre-mesures. Il dispose également d'un moteur à combustion plus longue et de performances de virage améliorées.

usaf_aim-9e=AIM-9E,Sidewinder,AAM,L'AIM-9E Sidewinder est un missile air-air américain à tête chercheuse infrarouge. L'Echo a considérablement amélioré ses performances dans tous les domaines par rapport aux versions précédentes, avec une enveloppe d'acquisition améliorée et une portée accrue. Aspect arrière uniquement.
usaf_aim-9j=AIM-9J,Sidewinder,AAM,L'AIM-9J Sidewinder est un missile air-air américain à tête chercheuse infrarouge. Le Juliet présente des changements importants par rapport à l'Echo, notamment au niveau des systèmes de contrôle, avec une électronique à semi-conducteurs remplaçant l'électronique à tube à vide antérieure. La probabilité de destruction est améliorée par rapport aux versions précédentes, mais il n'est toujours utilisé que par l'arrière.
usaf_aim-9p=AIM-9P,Sidewinder,AAM,L'AIM-9P Sidewinder est un missile air-air américain à guidage infrarouge. Le modèle Papa est la version export du modèle Juliet. Il est équipé d'une nouvelle fusée, d'un nouveau moteur et d'un autodirecteur amélioré, et permet des tirs latéraux, tout en offrant une plus grande fiabilité.

usn_aim-7d=AIM-7D,Sparrow,AAM,L'AIM-7D Sparrow est un missile air-air semi-actif américain à guidage radar. Le Delta a été optimisé pour des taux de rapprochement accrus par rapport au précédent Charlie.
usn_aim-7e=AIM-7E,Sparrow,AAM,L'AIM-7E Sparrow est un missile air-air semi-actif américain à guidage radar. L'Echo a une portée et des performances accrues par rapport aux variantes précédentes.
usn_aim-7e2=AIM-7E-2,Sparrow,AAM,L'AIM-7E-2 "Dogfight" Sparrow est un missile air-air américain à guidage radar semi-actif. L'Echo-2 est une sous-variante du modèle Echo original, après que des lacunes aient été constatées dans ses performances contre les chasseurs au Vietnam. Il présente une portée minimale plus courte, des performances légèrement meilleures à basse altitude et une maniabilité légèrement supérieure dans la phase de propulsion du vol.
usn_aim-7e4=AIM-7E-4,Sparrow,AAM,L'AIM-7E-4 Sparrow est un missile air-air américain à guidage radar semi-actif. L'Echo-4 est une variante dédiée au F-14 Tomcat, afin de tirer parti de son radar nettement plus puissant que celui des chasseurs précédents, et présente des caractéristiques de recherche légèrement améliorées contre le brouillage et les contre-mesures.
usn_aim-7f=AIM-7F,Sparrow,AAM,L'AIM-7F Sparrow est un missile air-air américain à guidage radar semi-actif. Le Foxtrot est une version redessinée de la cellule originale du Sparrow III. Il intègre un moteur moderne à poussée prolongée pour une plus longue portée, ainsi qu'un détonateur amélioré et une tête chercheuse plus performante, avec des améliorations de performances dans tous les domaines. Malgré cela, ses performances à basse altitude et en ECCM ne sont toujours pas exceptionnelles, et son chercheur ne peut pas exploiter pleinement la longue portée de ce missile.
usn_aim-7m=AIM-7M,Sparrow,AAM,L'AIM-7M Sparrow est un missile air-air semi-actif américain à guidage radar. Le Mike est de loin supérieur à la génération précédente de missiles (AIM-7E-2, AIM-7E, AIM-7D, etc.), principalement en raison de sa portée. Contrairement à la génération précédente de Sparrows, l'AIM-7M est adapté à la fois aux basses et hautes altitudes, mais excelle sur les cibles à haute altitude.
usn_aim-9b=AIM-9B,Sidewinder,AAM,L'AIM-9B Sidewinder est un missile air-air américain à guidage infrarouge. Le Bravo fut la première variante opérationnelle de la série AIM-9. Comparé aux versions ultérieures, il a une enveloppe de lancement étroite et a tendance à être facilement leurré par une autre source de chaleur comme le soleil. Il va sans dire qu'il n'est visible que par l'arrière.
usn_aim-9c=AIM-9C,Sidewinder,AAM,L'AIM-9C Sidewinder est un missile air-air américain à guidage radar semi-actif. Le Charlie est le seul modèle Sidewinder à guidage radar à avoir été mis en service. Il est identique au modèle Delta, à l'exception du chercheur radar semi-actif, qui permet des tirs à longue portée sous tous les angles. Étant exclusif au F-8 Crusader et généralement mal apprécié par les équipages, l'AIM-9C a été retiré du service quelques années seulement après sa mise en service.
usn_aim-9d=AIM-9D,Sidewinder,AAM,L'AIM-9D Sidewinder est un missile air-air américain à tête chercheuse infrarouge. Le Delta est une variante améliorée du Bravo, doté d'un chercheur amélioré, d'une ogive améliorée et d'une portée accrue. Aspect arrière uniquement.
usn_aim-9g=AIM-9G,Sidewinder,AAM,L'AIM-9G Sidewinder est un missile air-air américain à guidage infrarouge. Le Golf est une variante améliorée du Delta, avec un angle de tir plus important, qui a également été exporté vers d'autres pays. Vue arrière uniquement.
usn_aim-9h=AIM-9H,Sidewinder,AAM,L'AIM-9H Sidewinder est un missile air-air américain à guidage infrarouge. Le modèle Hotel est une version à semi-conducteurs du modèle Golf. Il est équipé d'un autodirecteur plus sensible qui permet également des tirs latéraux, tout en offrant une maniabilité et une fiabilité améliorées.
usn_aim-9l=AIM-9L,Sidewinder,AAM,L'AIM-9L Sidewinder est un missile air-air américain à tête chercheuse infrarouge. La variante Lima a été le premier Sidewinder capable d'attaquer dans toutes les directions. Par rapport à toutes les versions précédentes, l'enveloppe d'acquisition est considérablement améliorée, avec la possibilité d'engager des cibles de front lors de la fusion. Un tir à l'arrière permet toujours une portée d'acquisition plus longue, cependant.
usn_aim-9m=AIM-9M,Sidewinder,AAM,L'AIM-9M Sidewinder est un missile air-air américain à guidage infrarouge. La variante Mike est la version la plus moderne en service. Il s'agit d'un modèle Lima doté de capacités améliorées de rejet des leurres et d'une portée de recherche plus longue.
usn_aim-54a=AIM-54A,Phoenix,AAM,L'AIM-54A Phoenix est un missile air-air américain à guidage radar actif. Il s'agit du missile air-air à plus longue portée de l'inventaire américain et il est unique au F-14. Intégré au radar avancé AWG-9, il offre au F-14 la capacité d'engager 6 cibles avec 1 missile chacune simultanément. Pour y parvenir, les missiles volent en pilote automatique tandis que les ordinateurs à bord de l'avion échantillonnent les données radar de suivi pendant le balayage dans des fichiers de suivi, qui sont ensuite utilisés pour transmettre des mises à jour de guidage aux missiles pendant la phase de mi-course, les guidant dans un "panier" où le guidage radar actif du missile acquiert la cible pour la phase terminale.

wp_aa-2a=AA-2B,Atoll B,IR AAM,L'AA-2A Atoll (Vympel R-3S) est un missile air-air soviétique à autodirecteur infrarouge en perspective arrière. Il s'agit d'une copie inversée de l'AIM-9B américain, avec des modifications mineures au niveau de la construction et des performances, et ses performances sont identiques. Perspective arrière seulement.
wp_aa-2c=AA-2C,Atoll C,SARH AAM,L'AA-2C Atoll (Vympel R-3R) est un missile air-air soviétique semi-actif à guidage radar. Il est basé sur un AIM-9B rétroconçu mais possède un autodirecteur entièrement différent, mais partage par ailleurs les mêmes enveloppes d'acquisition et de lancement médiocres que son ancêtre américain.
wp_aa-2d=AA-2D,Advanced Atoll D,IR AAM,L'AA-2D Advanced Atoll (Vympel K-13M) est un missile air-air soviétique à tête chercheuse infrarouge. Il est dérivé du AA-2A Atoll (lui-même rétroconçu à partir de l'AIM-9) mais dispose d'un nouveau moteur et d'un nouveau chercheur, améliorant considérablement les performances.
wp_aa-2-2=AA-2D,Advanced Atoll D,IR AAM,L'AA-2D Advanced Atoll (Vympel K-13M1) est un missile air-air soviétique à tête chercheuse infrarouge. Il est dérivé du AA-2A Atoll (lui-même rétroconçu à partir de l'AIM-9) mais dispose d'un nouveau moteur et d'un nouveau chercheur, améliorant considérablement les performances.

wp_aa-3e=AA-3E,Advanced Anab,SARH AAM,L'AA-3E Advanced Anab E (Kaliningrad R-98MR) est un missile air-air soviétique semi-actif à guidage radar. L'un des deux modèles Advanced Anab conçus pour le Su-15 et le Yak-28P. Comme le Falcon AIM-4 utilisé sur les intercepteurs américains F-102 et F-106, la doctrine consistait à tirer un missile guidé par radar et un missile infrarouge sur la cible, améliorant ainsi la probabilité de destruction.
wp_aa-3f=AA-3F,Advanced Anab,IR AAM,L'AA-3 Advanced Anab F (Kaliningrad R-98MT) est un missile air-air à guidage infrarouge de fabrication soviétique. L'un des deux modèles Advanced Anab conçus pour le Su-15 et le Yak-28P. Comme le Falcon AIM-4 utilisé sur les intercepteurs américains F-102 et F-106, la doctrine consistait à tirer un missile guidé par radar et un missile infrarouge sur la cible, améliorant ainsi la probabilité de destruction.
wp_aa-6a=AA-6A,Acrid,AAM,L'AA-6A Acrid (Vympel R-40R) est un missile air-air semi-actif à guidage radar longue portée soviétique. Il a été développé spécifiquement pour l'intercepteur MiG-25P afin de contrer le XB-70 Valkyrie. Comme le Falcon AIM-4 utilisé sur les intercepteurs américains F-102 et F-106, la doctrine consistait à tirer un missile guidé par radar et un missile infrarouge sur la cible, améliorant ainsi la probabilité de destruction..
wp_aa-6b=AA-6B,Acrid,IR AAM,L'AA-6B Acrid (Vympel R-40T) est un missile air-air soviétique à guidage infrarouge à longue portée. Il a été développé spécifiquement pour l'intercepteur MiG-25P afin de contrer le XB-70 Valkyrie. Comme le Falcon AIM-4 utilisé sur les intercepteurs américains F-102 et F-106, la doctrine consistait à tirer un missile guidé par radar et un missile infrarouge sur la cible, améliorant ainsi la probabilité de destruction..
wp_aa-6c=AA-6C,Acrid,AAM,L'AA-6C Acrid amélioré (Vympel R-40RD) est un missile air-air semi-actif à guidage radar longue portée soviétique. Il a été développé spécifiquement pour le nouvel intercepteur MiG-25PD. La portée maximale du missile a été augmentée jusqu'à 60 km. Comme le Falcon AIM-4 utilisé sur les intercepteurs américains F-102 et F-106, la doctrine consistait à tirer un missile guidé par radar et un missile infrarouge sur la cible, améliorant ainsi la probabilité de destruction.
wp_aa-6d=AA-6D,Acrid,AAM,L'AA-6D Acrid amélioré (Vympel R-40TD) est un missile air-air soviétique à guidage infrarouge à longue portée. Il a été développé spécifiquement pour le nouvel intercepteur MiG-25PD. La portée maximale du missile a été augmentée jusqu'à 60 km. Comme le Falcon AIM-4 utilisé sur les intercepteurs américains F-102 et F-106, la doctrine consistait à tirer un missile guidé par radar et un missile infrarouge sur la cible, améliorant ainsi la probabilité de destruction.
wp_aa-7c=AA-7C,Apex,SARH AAM,L'AA-7C ​​Apex (Vympel R-24R) est un missile air-air semi-actif soviétique à guidage radar de moyenne portée. Les variantes Charlie et Delta mises à jour ont été développées pour équiper le MiG-23 au milieu des années 1970. À peu près analogue à l'AIM-7E américain, l'AA-7C ​​dispose d'un autodirecteur monopulse avec une résistance accrue aux ECM et une capacité de verrouillage après le lancement.
wp_aa-7d=AA-7D,Apex,IR AAM,L'AA-7D Apex (Vympel R-24T) est un missile air-air soviétique à guidage infrarouge de moyenne portée. Les variantes Charlie et Delta mises à jour ont été développées pour équiper le MiG-23 au milieu des années 1970. Comme le Falcon AIM-4 utilisé sur les intercepteurs américains F-102 et F-106, la doctrine consistait à tirer un missile guidé par radar et un missile infrarouge sur la cible, améliorant ainsi la probabilité de destruction.
wp_aa-8=AA-8,Aphid,AAM,L'AA-8 Aphid (Vympel R-60) est un missile air-air soviétique à courte portée à guidage infrarouge. L'arme a été exportée extrêmement largement et est susceptible d'être couramment rencontrée dans les États alignés sur l'Union soviétique. Il est plus maniable que l'AIM-9L, mais n'a toujours qu'un aspect arrière, ce qui oblige l'avion lanceur à atteindre les cibles "six".
wp_aa-11=AA-11,Archer,AAM,L'AA-11 Archer (Vympel R-73A) est un missile air-air à guidage infrarouge à courte portée de conception soviétique. Il s'agit du missile à courte portée le plus performant de l'arsenal soviétique ; il reste extrêmement compétitif face à la concurrence étrangère et constitue à tous égards une arme extrêmement meurtrière à courte portée.

# ------------------ SAM ------------------
it_aspide_1=Aspide Mk.1A,,SAM/ASu,Le missile Aspide est un missile sol-air italien à moyenne portée, dérivé du missile américain Sparrow. Dérivé de l'AIM-7E, ce missile est équipé d'un moteur amélioré, qui augmente sa portée et sa vitesse, ainsi que d'une tête chercheuse monopulse considérablement améliorée, qui permet un tir à basse altitude et offre des performances ECCM avancées.\nLe modèle à lancement terrestre a une portée et une vitesse inférieures à celles du modèle à lancement aérien, bien qu'il reste nettement supérieur au RIM-7E.

jsdf_sam1=Tan-SAM 1,SAM,Missile surface-air japonais de courte portée à autodirecteur IR tous azimuts. Fait partie du système SAM de type 82.

plan_hq-61=HQ-61,,SAM,Le HQ-61 est un missile sol-air chinois qui ressemble au RIM-7F Sea Sparrow et qui lui est à peu près équivalent.

raf_rapier=FSB Rapier,Rapier,SAM,Système de missile de défense ponctuelle à guidage optique britannique à courte portée et à basse altitude. Utilisant le système de guidage par ligne de visée (CLOS), il présente une efficacité variable contre les avions rapides et les missiles.

rn_seacat=GWS-21,Seacat,SAM,Le GWS-21 Seacat est le premier exemple de système de missile de défense ponctuelle embarqué. Il est entré en service dans la Royal Navy en 1962 et a également été largement exporté en remplacement du Bofors 40 mm. Utilisant le système de guidage CLOS (command-to-line-of-sight), son efficacité contre les jets rapides et les missiles est discutable.
rn_seacat_mk2=GWS-24,Sea Cat Mk.2,SAM,Le GWS-24 Seacat est un modèle amélioré du Sea Cat Mk.1 (GWS-20) avec des performances améliorées à basse altitude, une plus grande portée, une fiabilité accrue et un système de contrôle de tir plus avancé. Malheureusement, ce missile reste très médiocre et son efficacité est discutable.

usa_mim-14=MIM-14,Nike Hercules,SAM,Le MIM-14 Nike Hercules est un système de missiles sol-air utilisé par les forces armées américaines et celles de l'OTAN pour la défense aérienne à moyenne et haute altitude.
usa_mim-23=MIM-23,Hawk,SAM,Développé aux États-Unis dans les années 1960, le HAWK est un système de missiles surface-air de moyenne portée relativement mobile. Le missile lui-même utilise un autodirecteur semi-actif HPIR (High Power Illuminator Radar) qui fait partie de la batterie HAWK, les cibles étant détectées par le PAR (Pulse Acquisition Radar) pour les cibles à haute altitude et par le CWAR (Continuous Wave Acquisition Radar) pour les cibles à basse altitude disséminées au sol. 

usn_rim-8=RIM-8,Talos,SAM/ASu,Le RIM-8 Talos est un système de missile sol-air massif à longue portée utilisé principalement par les croiseurs de l'US Navy. Il effectue une phase de mi-course à faisceau avec une phase terminale de guidage radar semi-actif. Le missile nécessite un certain assemblage avant le lancement, de sorte que la cadence de tir est inférieure à celle des systèmes plus modernes, comme l'indique la très grande taille physique du chargeur utilisé par le système.

usn_rim-7=RIM-7F,Sea Sparrow,SAM/ASu,Le RIM-7 Sea Sparrow est un système de défense aérienne à courte portée installé sur de nombreux navires de l'US Navy et de l'OTAN. Le système est principalement destiné à fournir une capacité d'autodéfense.
usn_rim-7h=RIM-7H,Sea Sparrow,SAM/ASu,Le RIM-7H Sea Sparrow est un missile sol-air à courte portée, qui constitue le principal missile de défense ponctuelle embarqué de l'OTAN. Le modèle "Hotel" du Sea Sparrow est globalement très similaire au modèle "Echo", à l'exception du fait que le RIM-7H est équipé d'ailettes repliables afin de s'adapter aux nouveaux lanceurs, et que sa fiabilité a été légèrement améliorée.
usn_rim-7m=RIM-7M,Sea Sparrow,SAM/ASu,Le RIM-7 Sea Sparrow est un système de défense aérienne à courte portée installé sur de nombreux navires de l'US Navy et de l'OTAN. Le système est principalement destiné à fournir une capacité d'autodéfense.

# RIM-2 Terrier
usn_rim-2f=RIM-2F,Terrier,SAM/ASu,Le RIM-2F Terrier est l'un des premiers systèmes de missiles sol-air introduits par l'US Navy. Il a été conçu pour fournir une couche défensive à moyenne portée aux groupes d'attaque de porte-avions qui se trouvaient entre les chasseurs et les canons. Le Terrier d'origine était une arme à guidage par faisceau. Le RIM-2F est une arme à guidage radar semi-actif améliorée avec une maniabilité et une probabilité de destruction accrues. Comme d'autres missiles sol-air, il peut être utilisé dans un rôle anti-surface secondaire. L'intervalle de salve est affecté négativement par la nécessité d'assembler manuellement les ailerons de rappel, avec un lanceur capable de tirer 2 missiles toutes les 30 secondes.
usn_rim-24b=RIM-24B,Tartar,SAM/ASu,sans description

# RIM-66 SM-1MR
usn_rim-66a=SM-1MR,Standard,SAM/ASu,Le missile Standard RIM-66A 1 MR a été développé comme un nouvel effecteur à associer aux plates-formes qui utilisaient auparavant le RIM-24C Tartar. Le missile Standard utilise le même fuselage que le Tartar pour faciliter l'intégration physique. La variante A était la plus ancienne et est entrée en service en 1967.
usn_rim-66b=SM-1MR,Standard,SAM/ASu,Le missile Standard RIM-66B 1 MR a été développé comme un nouvel effecteur à associer aux plates-formes qui utilisaient auparavant le RIM-24C Tartar. Le missile Standard utilise le même fuselage que le Tartar pour faciliter l'intégration physique. La variante B était une mise à niveau significative par rapport à la variante A avec de nouveaux composants. La plupart des modèles A ont été mis à niveau vers les Bs.
usn_rim-66e=RIM-66E,SM-1MR,SAM/ASu,Le missile Standard RIM-66B 1 MR a été développé comme un nouvel effecteur destiné à être associé aux plates-formes qui utilisaient auparavant le RIM-24C Tartar. Le missile Standard partage le même fuselage que le Tartar afin de faciliter son intégration physique. La variante E est une version redessinée du modèle B sur le plan électronique, utilisant des composants SM-2MR, et dispose d'une capacité limitée à engager des missiles de croisière rasants.
usn_rim-66c=SM-2MR,Standard,SAM/ASu,Le missile Standard SM-2MR RIM-66C 2 MR est un élément clé du nouveau système de gestion de combat AEGIS installé sur les nouveaux navires de combat de surface de l'US Navy et de la mise à niveau New Threat installée sur les plates-formes plus anciennes. Il fournit une arme plus performante que l'ancien missile standard 1 avec une utilisation réduite de l'illuminateur permettant d'utiliser plus de missiles simultanément en vol. 
usn_rim-66d=RIM-66D,SM-2MR,SAM/ASuW,Le missile RIM-66D Standard Missile 2 MR constitue un élément clé du nouveau système de gestion de combat AEGIS dont sont équipés les tout derniers navires de combat de surface de la marine américaine, ainsi que de la mise à niveau « New Threat Upgrade » installée sur les plates-formes plus anciennes. Il offre des performances supérieures à celles de l'ancien Standard Missile 1, tout en réduisant l'utilisation de l'illuminateur, ce qui permet de lancer simultanément un plus grand nombre de missiles. 
usn_rim-66g=RIM-66G,SM-2MR,SAM/ASu,Le missile Standard RIM-66G 2 MR Block II est un élément clé du nouveau système de gestion de combat AEGIS équipant les nouveaux navires de combat de surface de l'US Navy et de la mise à niveau "New Threat Upgrade" équipant les anciennes plateformes. Il offre des performances supérieures à celles de l'ancien missile Standard 1, avec une utilisation réduite de l'illuminateur, ce qui permet de lancer simultanément un plus grand nombre de missiles. Le Block II SM-2MR double largement la portée des missiles Block I précédents, améliore la capacité contre les cibles plus rapides et a une altitude minimale plus basse que les missiles Standard précédents, même s'il n'est pas encore parfait contre les missiles à vol rasant. Le RIM-66G est la variante SM-2MR Block II utilisée par les navires de guerre Mark 26 AEGIS, comme les CG de classe Ticonderoga à lanceurs verticaux.

# RIM-67 SM-1ER/SM-2ER
usn_rim-67a=SM-1ER,Standard,SAM/ASu,Le missile Standard SM-1ER RIM-67A a été développé comme un nouvel effecteur pour remplacer le RIM-8 Talos. Le missile est identique au RIM-66A mais équipé d'un booster supplémentaire pour augmenter sa portée.
usn_rim-67b=SM-2ER,Standard,SAM/ASu,Le missile Standard SM-2ER RIM-67B 2 ER est un élément clé de la mise à niveau New Threat qui équipe les plates-formes qui transportaient auparavant le RIM-2 Terrier. Le missile est pratiquement identique au RIM-66C mais équipé d'un booster supplémentaire pour augmenter sa portée.
usn_rim-67c=RIM-67C,SM-2ER,SAM/ASu,Le missile Standard RIM-67C 2 ER est un élément clé de la mise à niveau "New Threat Upgrade" équipant les plateformes qui embarquaient auparavant le RIM-2 Terrier. Ce missile est pratiquement identique au RIM-66C, mais il est équipé d'un propulseur supplémentaire qui augmente sa portée. Le Block II SM-2ER améliore la vitesse et la portée des missiles Block I précédents, offre une meilleure capacité contre les cibles plus rapides et a une altitude minimale plus basse que les missiles Standard précédents, même s'il n'est pas encore parfait contre les missiles à vol rasant.



wp_sa-n-1=SA-N-1,Goa,SAM/ASu,Le SA-N-1 Goa (M-1 Volna) est le premier système de missile sol-air naval soviétique. Il est destiné à assurer la défense aérienne de zone et un certain degré de protection contre les missiles anti-navires entrants. À l'origine, il n'était efficace que contre les cibles aériennes volant à haute altitude, mais des variantes ultérieures ont introduit une capacité anti-surface et une meilleure capacité à engager des cibles volant à basse altitude, ainsi qu'une portée accrue.
wp_sa-n-1c=SA-N-1C,Goa,SAM/ASu,Le SA-N-1C Goa (M-1 Volna-P) est une modification du premier système de missile surface-air naval soviétique. Il résiste mieux au brouillage et aux paillettes et est capable d'attaquer des cibles volant à basse altitude.
wp_sa-n-3=SA-N-3,Goblet,SAM/ASu,Le SA-N-3 Goblet (M-11 Shtorm) est un système de missile sol-air naval soviétique. Le système a été installé sur un certain nombre de classes de croiseurs lance-missiles et sur les porte-hélicoptères et les porte-avions STOVL de l'Union soviétique. Il dispose d'une capacité anti-surface secondaire, et les versions ultérieures ont amélioré les performances contre les cibles volant à basse altitude.
wp_sa-n-4=SA-N-4,Gecko,SAM/ASu,Le SA-N-4 Gekko (9K33M Osa) est la version navale du SA-8 Gecko (notez l'orthographe différente) avec deux missiles sur un lanceur rotatif rétractable. Il a été installé sur un nombre important de plates-formes soviétiques pour remplir le rôle de défense aérienne à courte portée.
wp_sa-n-5=SA-N-5,Grail,SAM,Le SA-N-5 Grail (9K32 Strela-2) est un missile sol-air portable également connu sous le nom de SA-7 lorsqu'il est utilisé à partir de lanceurs terrestres. Sur les navires, il est utilisé comme système de défense ponctuelle.
wp_sa-n-6=SA-N-6,Grumble,SAM/ASu, Le SA-N-6 Grumble (S-300F) est la version navale du système de missile sol-air terrestre SA-10 (S-300P). Ce puissant système à longue portée est installé dans les classes de croiseurs lance-missiles soviétiques et offre des performances comparables à celles du SM-2. 
wp_sa-n-7=SA-N-7,Gadfly,SAM/ASu,Le SA-N-7 Gadfly (3S90 Uragan) est la version navale du système de missile sol-air terrestre SA-11 Gadfly (9K37 Buk). Le système SA-N-7 est un système d'arme sophistiqué et performant qui a fait son entrée en service sur les destroyers de la classe Sovremenny.
wp_sa-n-9=SA-N-9,Gauntlet,SAM/ASu,Le SA-N-9 Gauntlet (3K95 Kinzhal) est la version navale du système de missile SA-15 Gauntlet (9K330 Tor). Il utilise le même missile que le SA-15 et est installé sur un nombre important de grands navires de combat de surface soviétiques.

wp_sa-2=SA-2,Guideline,SAM,Le SA-2 Guideline (S-75 Dvina) est un système de missile sol-air soviétique à longue portée. Le système est destiné à contrer les bombardiers sur de vastes zones et a été largement exporté, ayant été utilisé dans de nombreux conflits, mais surtout pendant la guerre du Vietnam.
wp_sa-3=SA-3,Goa,SAM,Le SA-3 Goa (S-125 Neva/Pechora) est un système de missile sol-air soviétique de moyenne portée. Le système est destiné à contrer des cibles plus manœuvrables et à plus basse altitude.
wp_sa-4=SA-4,Ganef,SAM,Le SA-4 Ganef (2K11 Krug) est un système de missile sol-air mobile soviétique de moyenne portée. Le système est destiné à contrer les bombardiers sur de vastes zones.
wp_sa-5=SA-5,Gammon,SAM,Le SA-5 Gammon (S-200) est un système de missile sol-air soviétique à longue portée. Le système est destiné à contrer les bombardiers à haute altitude sur de vastes zones. Les missiles intègrent une capacité de réattaque en cas de brouillage.
wp_sa-6=SA-6,Gainful,SAM,Le SA-6 Gainful (2K12 Kub) est un système de missile sol-air mobile soviétique. Le système est destiné à contrer les menaces à courte portée jusqu'à environ 15 miles.
wp_sa-8=SA-8,Gecko,SAM,Le SA-8 Gecko (9K33M3 Osa) est un système mobile de missiles sol-air soviétique. Ce système est destiné à assurer la défense aérienne à courte portée des divisions blindées et motorisées.
wp_sa-11=SA-11,Gadfly,SAM,Le SA-11 Gadfly (9K37 Buk) est un système mobile soviétique de missiles sol-air. Ce système est destiné à contrer les menaces à courte portée jusqu'à environ 18 miles.
wp_sa-13=SA-13,Gopher,SAM,Le SA-13 Gopher (9K35 Strela-10) est un système de missile sol-air soviétique à courte portée, très mobile. Le système est destiné à contrer les menaces apparaissant à basse altitude telles que les hélicoptères.

# ---------- Missiles Anti-Radar ---------
usn_agm-45=AGM-45,Shrike,ARM,L'AGM-45 Shrike est un missile anti-radar américain développé à partir du fuselage de l'AIM-7 Sparrow et muni d'un nouveau chercheur.
usn_agm-78=AGM-78,Standard ARM,ARM,L'AGM-78 Standard ARM (STARM) est un missile antiaérien américain à longue portée destiné à engager des sites SAM de haut niveau à distance. Le STARM est dérivé du SM-1MR SAM. Il est équipé d'un propulseur à longue durée de combustion et d'un profil de vol ascendant pour atteindre une longue portée, ainsi que d'une ogive puissante garantissant la destruction de tout système radar qu'il touche. Malheureusement, il s'agit d'une arme coûteuse et rare, de sorte que peu d'entre elles, voire aucune, peuvent être utilisées à un moment donné.
usn_agm-88a=AGM-88A,HARM,ARM,L'AGM-88A HARM (High-speed Anti-Radiation Missile) est un missile antiradiations américain à longue portée, doté de performances exceptionnelles dans toutes les catégories. Le HARM est le missile antiradiations le plus moderne de l'arsenal de l'OTAN en 1985, et surpasse ses prédécesseurs dans presque toutes les catégories, en particulier en termes de fiabilité et de vitesse maximale. Ce missile étant très récent, seul un nombre limité (voire aucun) peut être utilisé à un moment donné.
usn_agm-122a=AGM-122A,Sidearm,ARM,L'AGM-122A est un missile anti-radar tactique à courte portée principalement conçu pour être utilisé à partir d'hélicoptères et d'avions à voilure fixe. Modifié à partir de l'AIM-9C, qui a eu une durée de vie très courte, le Sidearm est un missile anti-radar à courte portée efficace pour faire face aux menaces SHORAD soudaines, mais il est peu adapté pour affronter des défenses aériennes importantes.

usn_rgm-8h=RIM-8H,Talos ARM,ARM,Le RIM-8H Talos est la version anti-radar du missile sol-air RIM-8 Talos. Il utilise sa grande structure pour atteindre une très longue portée et une vitesse élevée pour un missile air-air lancé depuis un navire. Bien que le RIM-8H soit basé sur un missile sol-air, il n'a aucune capacité anti-aérienne et ne peut engager que des cibles de surface émettant activement des signaux radar.

wp_as-11=AS-11,Kilter,ARM,L'AS-11 Kilter (Kh-58) est un missile anti-radar soviétique développé pour équiper l'avion d'attaque Su-24M.
wp_as-12=AS-12,Kegler,ARM,L'AS-12 Kegler (Kh-25MP) est un missile antirradar supersonique à moyenne portée lancé depuis les airs, développé par l'Union soviétique. Il s'agit du missile antirradar le plus répandu dans l'arsenal soviétique, et il est à peu près équivalent à l'AGM-45 Shrike américain.

wp_as-2b=AS-2B,Kipper,ASM,Le K-10SP est une variante du missile K-10S dont on a remplacé l'ogive par un système de brouillage Azaliya.

# ---------- Missile Anti-Navire ----------
is_gabriel_2=Gabriel 2,ASu,Gabriel est un missile anti-navire israélien qui prétend être l'un des premiers missiles rasants en mer. La variante Gabriel 2 est une variante améliorée mais très similaire au Gabriel 1.
is_gabriel_3=Gabriel 3,,ASu,Le Gabriel 3 est un missile antinavire israélien à courte portée, capable de voler à ras de la surface de l'eau et équipé d'un autodirecteur radar actif. Il s'agit d'une version améliorée du missile Gabriel 2, dotée d'un nez redessiné pour accueillir un autodirecteur radar actif de pointe, et permettant un fonctionnement en mode « tiré-oublié ».
is_gabriel_3as=Gabriel 3AS,,ASu,Le Gabriel 3AS est un missile antinavire israélien à courte portée, capable de voler à ras de la surface de l'eau et équipé d'un autodirecteur radar actif. Il s'agit de la version à lancement aérien du Gabriel 3, qui bénéficie d'une portée accrue et d'un fuselage redessiné.

it_seakiller_2=Sea Killer 2,ASu,Sea Killer 2 est un missile antinavire à courte portée développé en Italie. Le Sea Killer Mark 2 a été acheté par l'Iran pour armer ses frégates de classe Alvand, chacune étant équipée d'un seul lanceur de cinq obus..
it_otomat_mk1=Otomat MK1,,ASu,OtomatMK1 est un missile anti-navire de moyenne portée développé en coopération entre l'Italie et la France.

jasdf_asm-1=ASM-1,,ASu,L'ASM-1 est un missile antinavire japonais à longue portée. L'ASM-1 est la variante lancée depuis les airs.

fr_as12=AS.12,,ASu,L'AS.12 est un missile antinavire télécommandé, à courte portée, lancé depuis un hélicoptère, d'origine française. Il s'agit d'une version améliorée du SS.11 ATGM, dotée d'un moteur plus long et d'une ogive nettement plus grande, qui peut constituer une menace sérieuse pour les bateaux et les petits navires.
fr_am-39=AM39,Exocet,ASu,L'AM39 Exocet est un missile antinavire français à distance de sécurité. Il constitue une alternative populaire au Harpoon dans l'ensemble de l'OTAN et dans un certain nombre d'autres pays. L'AM39 est la variante lancée par voie aérienne.
fr_mm-38=MM38,Exocet,ASu,Le MM38 Exocet est un missile antinavire français à distance de sécurité. Il constitue une alternative populaire au Harpoon dans l'ensemble de l'OTAN et dans un certain nombre d'autres pays. Le MM38 est la variante lancée depuis la surface.
fr_sm-39=SM39,Exocet,ASu,L'Exocet SM39 est un missile antinavire français à longue portée. Il constitue une alternative très prisée au Harpoon au sein de l'OTAN et dans plusieurs autres pays. Le MM38 est la variante lancée depuis un sous-marin ; il dispose de meilleures capacités de contre-mesures électroniques (ECCM) et d'une portée supérieure à celle de l'Exocet original lancé depuis un navire, car il est dérivé d'une version améliorée de l'AM-39 Mod 2.

knm_penguin_mk2=AGM-119,Penguin Mk2,ASu,L'AGM-119 Penguin est un petit missile anti-navire lancé depuis l'air et la surface développé en collaboration entre les États-Unis et la Norvège. 

plan_sy-1=SY-1,Scrubbrush,ASu,Le SY-1 est une version chinoise construite sous licence du missile soviétique Styx.
plan_sy-1a=SY-1A,,ASu,Le SY-1A est la version chinoise du missile soviétique Styx.
plan_hy-1=HY-1,Safflower,ASu,Le HY-1 est un développement chinois du missile soviétique Styx.
plan_hy-1j=HY-1J,Safflower,ASu,Le HY-1J est un développement chinois du missile soviétique Styx.
plan_hy-1a=HY-1A,Safflower,ASu,Le HY-1A est une version chinoise du missile soviétique Styx. Le HY-1A est une version améliorée du HY-1J, dotée d'un autodirecteur perfectionné et d'un profil de vol plus bas, ce qui le rend plus difficile à intercepter.
plan_hy-2=HY-2,Seersucker,ASu,Le HY-2 est une version chinoise améliorée du missile soviétique Styx, avec une portée plus longue, et largement équivalent au P-20.
pla_hy-3=HY-3,Sawhorse,ASu,Le HY-3 est un missile antinavire supersonique à réaction à ramjet basé à terre, pouvant atteindre une vitesse de Mach 2,5 et une portée de 130 à 180 kilomètres. Son développement a été achevé au début des années 1990, mais le missile n'a jamais été mis en service.
plan_hy-4=HY-4,Sadsack,ASu,Le HY-4 est une variante chinoise du missile HY-2, dont le système de propulsion à propergol liquide d'origine a été remplacé par un turboréacteur. Cela permet d'améliorer considérablement sa portée, même si la configuration peu aérodynamique du HY-4 l'oblige à voler à une altitude relativement élevée et à une vitesse réduite pendant la majeure partie de son trajet.
pla_yj-1=YJ-6,Saples,ASu,Le YJ-1 est un missile antinavire supersonique à courte portée lancé depuis les airs, dont la vitesse dépasse Mach 2 et qui effectue une phase terminale en rasant la surface de la mer. Bien que ce missile n'ait pas été accepté en service, un nombre limité de missiles de préproduction était disponible à la fin des années 1980, et il était principalement destiné à être utilisé sur l'hydravion SH-5.
pla_yj-6=YJ-6,Kraken,ASu,Le YJ-6 est un missile antinavire chinois lancé depuis les airs, développé à partir du SY-1/HY-1 basé à terre/à bord d'un navire. Il dispose d'une plus longue portée de tir grâce à son profil de lancement aérien, bien qu'il utilise un autodirecteur ancien et soit sensible aux contre-mesures, comme les premiers modèles Styx ou Silkworm.
plan_yj-8=YJ-8,Sardine,ASu,Le YJ-8 est un missile antinavire chinois qui ressemble au missile français Exocet et qui lui est à peu près équivalent. Après son lancement, le missile monte à une altitude de 20 à 30 mètres, puis redescend pour attaquer à une altitude de 5 à 7 mètres en rasant la surface de la mer.

usn_agm-12b=AGM-12B,Bullpup,ASu,L'AGM-12 Bullpup est une arme de frappe supersonique américaine aéroportée. Elle repose sur un opérateur qui guide manuellement le missile, à l'instar du missile soviétique AS-7, et présente en grande partie les mêmes inconvénients, dont le principal est la nécessité de maintenir l'avion en vol en ligne droite vers la cible.
usn_agm-123=AGM-123,Skipper,ASu,L'AGM-123 est un missile anti-navire américain à courte et moyenne portée, produit en combinant une bombe guidée par laser Paveway II avec un propulseur à poudre. Cette solution a été mise au point pour fournir aux équipages une alternative au Harpoon, qui s'est avéré difficile à utiliser dans des eaux très encombrées comme le golfe Persique, où le risque de toucher des civils est tout simplement trop élevé.
usn_agm-84a=AGM-84A,Harpoon,ASu,Le Harpoon est une arme anti-navire américaine à longue portée largement utilisée dans toute l'OTAN. L'arme est dotée d'un autodirecteur radar actif qui s'active après avoir suivi un itinéraire préprogrammé. La variante AGM-84 est lancée par voie aérienne.
usn_agm-84c=AGM-84C,Harpoon,ASM,Le Harpoon est une arme anti-navire américaine à longue portée largement utilisée au sein de l'OTAN. Ce missile est équipé d'un autodirecteur radar actif qui se déclenche après avoir suivi une trajectoire préprogrammée. La version AGM-84C est lancée depuis les airs et n'effectue pas de manœuvre de remontée en fin de course ; elle effectue plutôt une phase de vol rasant pour attaquer les navires avec plus d'efficacité.
usn_agm-84d=AGM-84D,Harpoon,ASu,Le Harpoon est une arme anti-navire américaine à longue portée largement utilisée dans toute l'OTAN. L'arme est dotée d'un autodirecteur radar actif qui s'active après avoir suivi un itinéraire préprogrammé. La variante AGM-84 est lancée par voie aérienne. L'AGM-84D est une modification plus récente, apparue en 1985. Il dispose de capacités ECCM améliorées et d'une plus grande portée grâce à l'amélioration du carburant.

usn_rgm-84a=RGM-84A,Harpoon,ASu,Le Harpoon est une arme anti-navire américaine à longue portée largement utilisée dans toute l'OTAN. L'arme est dotée d'un autodirecteur radar actif qui s'active après avoir suivi un itinéraire préprogrammé. La variante RGM-84 est lancée en surface.
usn_rgm-84c=RGM-84C,Harpoon,ASu,Le Harpoon est une arme anti-navire américaine à longue portée largement utilisée dans toute l'OTAN. L'arme est dotée d'un autodirecteur radar actif qui s'active après avoir suivi un itinéraire préprogrammé. La variante RGM-84 est lancée en surface.
usn_rgm-84d=RGM-84D,Harpoon,ASu,Le Harpoon est une arme antinavire américaine largement utilisée par l'OTAN. Cette arme est équipée d'un autodirecteur radar actif qui s'active après avoir suivi une trajectoire préprogrammée. La variante RGM-84D est lancée depuis la surface. L'AGM-84D est une version plus récente, apparue en 1985. Elle dispose de capacités ECCM améliorées et d'une plus grande portée grâce à un carburant amélioré.
usn_rgm-109b=RGM-109B,Tomahawk,ASu,Le missile antinavire RGM-109B Tomahawk (TASM) est une arme antinavire américaine à distance. L'arme est dotée d'un chercheur radar actif qui s'active après avoir suivi un itinéraire préprogrammé et est capable de suivre un modèle de recherche avec des manœuvres trompeuses.

usn_ugm-84a=UGM-84A,Harpoon,ASu,Le Harpoon est une arme anti-navire américaine à longue portée largement utilisée dans toute l'OTAN. L'arme est dotée d'un autodirecteur radar actif qui s'active après avoir suivi un itinéraire préprogrammé. La variante UGM-84 est lancée depuis un sous-marin, à l'aide d'un container étanche.
usn_ugm-84b=UGM-84B,Harpoon,ASu,Le Harpoon est une arme anti-navire américaine à longue portée largement utilisée dans toute l'OTAN. L'arme est dotée d'un autodirecteur radar actif qui s'active après avoir suivi un itinéraire préprogrammé. La variante UGM-84 est lancée depuis un sous-marin, à l'aide d'un container étanche.
usn_ugm-84c=UGM-84C,Harpoon,ASu,Le Harpoon est une arme antinavire américaine largement utilisée au sein de l'OTAN. Elle est équipée d'un autodirecteur radar actif qui s'active après avoir suivi une trajectoire préprogrammée. La variante UGM-84B est lancée à partir d'un sous-marin à l'aide d'un conteneur jetable. Contrairement à l'ancienne version UGM-84A, elle n'effectue pas de manœuvre terminale en surface, mais dispose d'une phase de vol rasant la surface de la mer afin d'attaquer les navires plus efficacement.
usn_ugm-109b=UGM-109B,Tomahawk,ASu,Le missile antinavire RGM-109B Tomahawk (TASM) est une arme antinavire américaine à longue portée. Il est équipé d'un autodirecteur radar actif qui s'active après avoir suivi une trajectoire préprogrammée et est capable d'effectuer des manœuvres de recherche avec des manœuvres trompeuses. Il s'agit du modèle lancé depuis un sous-marin et déployé exclusivement à partir de tubes lance-torpilles.

wp_as-2=AS-2,Kipper,ASu,L'AS-2 Kipper (K-10S) est une arme anti-navire supersonique lancée par avion soviétique conçue pour être transportée par le Tu-16. À peu près analogue à un SS-N-3 lancé par avion, il souffre des mêmes inconvénients contre les défenses aériennes même modérément modernes.
wp_as-4=AS-4,Kitchen,ASu,L'AS-4 Kitchen (Kh-22) est une arme anti-navire soviétique à tir supersonique lancée par avion et portée par le Tu-22M ou le Tu-95. Il vole à haute altitude et à grande vitesse avec un piqué terminal supersonique, ce qui le rend très difficile à contrer.
wp_as-6=AS-6,Kingfish,ASu,L'AS-6 Kingfish (Kh-26) est un missile anti-navire soviétique à tir supersonique lancé par avion, conçu pour être transporté par le Tu-16. Cousin plus petit de l'AS-4, il vole à haute altitude et à grande vitesse avec un piqué terminal supersonique, ce qui le rend très difficile à contrer.
wp_as-7=AS-7,Kerry,ASu,L'AS-7 Kerry (Kh-23 Grom) est une arme de frappe supersonique soviétique lancée par avion. Il repose sur un opérateur guidant manuellement le missile, similaire au AGM-12 Bullpup américain, et présente la plupart des mêmes inconvénients.
wp_as-10=AS-10,Karen,ASu,L'AS-10 Karen (Kh-25/Kh-25M) est une arme de frappe supersonique soviétique à distance de tir. Il utilise un chercheur laser pour une capacité de tir et d'oubli.
wp_as-13=AS-13,Kingbolt,ASu,L'AS-13 Kingbolt (Kh-59 Ovod) est une arme de frappe subsonique soviétique lancée par avion. Il vole à mi-course sous guidage inertiel, en utilisant des coordonnées cibles préprogrammées, avec une phase de guidage TV terminale.
wp_as-14a=AS-14A,Kedge,ASu,L'AS-14A Kedge (Kh-29L) est un missile supersonique air-sol soviétique lancé par voie aérienne, doté d'une ogive lourde et d'un guidage laser.
wp_as-14b=AS-14B,Kedge,ASu,L'AS-14B Kedge (Kh-29T) est un missile soviétique supersonique air-sol doté d'une ogive lourde et d'un guidage télévisuel pour une plus grande portée, mais dont les performances nocturnes sont dégradées.

wp_ss-n-2=SS-N-2,Styx,ASu,Le SS-N-2 Styx (P-15 Termit) est une arme anti-navire subsonique soviétique lancée en surface. L'arme a été produite sous licence par la Chine sous le nom bien connu de CSS-C-2 Silkworm. Elle peut également être utilisée pour attaquer des installations terrestres sur le rivage.
wp_ss-n-2c=SS-N-2C,Styx,ASu,Le SS-N-2C Styx (P-15 TermitM) est une arme anti-navire subsonique soviétique lancée en surface. Il s'agit d'une version améliorée du P-15 original avec une portée étendue et un meilleur ECCM. Il peut également être utilisé pour attaquer des installations terrestres sur le rivage.
wp_ss-n-3=SS-N-3,Shaddock,ASu,Le SS-N-3 Shaddock (P-35 Progress) est une arme anti-navire subsonique soviétique lancée en surface. Bien qu'elle ait été redoutable au moment de son introduction, le profil de vol subsonique à haute altitude la rend très vulnérable aux missiles sol-air. Un autre inconvénient est la nécessité pour la plate-forme de lancement de rester en contact avec le missile pendant tout le vol, ce qui signifie que les plates-formes immergées doivent rester exposées à la surface pendant une frappe, les laissant vulnérables aux contre-attaques.
wp_ss-n-3b=SS-N-3B,Sepal,ASu,Le SS-N-3B Sepal (Progress) est un missile antinavire subsonique à lancement terrestre soviétique. Il s'agit d'une version améliorée du missile P-35 original, avec une altitude de vol plus basse et une meilleure résistance au brouillage et aux leurres.
wp_ss-n-7=SS-N-7,Starbright,ASu,Le SS-N-7 Starbright (P-70 Ametist) est une arme anti-navire transsonique lancée par sous-marin soviétique. Il s'agit du premier système de missile au monde à être lancé depuis un sous-marin immergé. Il s'agit d'une arme à portée relativement courte, qui a été remplacée par le SS-N-9 Siren.
wp_ss-n-9=SS-N-9,Siren,ASu,Le SS-N-9 Siren (P-120 Malakhit) est une arme anti-navire subsonique soviétique lancée en surface. Il est plus rapide et a une plus longue portée que le Styx, et peut effectuer des manœuvres d'évitement en phase terminale.
wp_ss-n-12=SS-N-12,Sandbox,ASu,Le SS-N-12 Sandbox (P-500 Bazalt) est une arme anti-navire supersonique lancée en surface conçue pour remplacer le SS-N-3 Shaddock. Par rapport au Shaddock, il est beaucoup plus rapide et intègre une liaison de données inter-missiles qui permet à la majorité de la salve de rester à basse altitude tandis qu'un seul missile vole haut en agissant comme un observateur de cible. Il est également équipé d'un ECM défensif pour augmenter la capacité de survie contre les défenses anti-aériennes.
wp_ss-n-19=SS-N-19,Shipwreck,ASu,Le SS-N-19 Shipwreck (P-700 Granit) est une arme anti-navire supersonique lancée en surface par l'Union soviétique. Il vole selon un profil HI-LO et comprend une liaison de données inter-missiles avancée qui permet à plusieurs missiles d'une salve de répartir les cibles entre eux en utilisant un seul missile comme observateur à haute altitude. Il est capable d'effectuer des manœuvres d'évitement en phase terminale, emporte un brouilleur ECM et des leurres à bord, et est blindé contre les tirs CIWS et les fragments de missiles. C'est une arme redoutable à tous égards.
wp_ss-n-22=SS-N-22,Sunburn,ASu,Le SS-N-22 Sunburn (P-270 Moskit) est un missile anti-navire soviétique lancé en surface à distance supersonique. Il vole selon un profil LO-LO avec une phase terminale de vol supersonique en rase-mer, au cours de laquelle le missile effectue des manœuvres d'évitement en serpentin pour augmenter sa capacité de survie contre les défenses aériennes.

#-----------Land Strike only missiles---------
wp_as-4b=AS-4B,Kitchen-B,Attaque sol,L'AS-4B Kitchen (Kh-22MP Storm) est un missile d'Attaque au sol supersonique de fabrication soviétique. 

fr_as11=AS.11,,Attaque sol,Le SS.11/AS.11 est un missile antichar à courte portée télécommandé d'origine française. Ce modèle est équipé d'une ogive semi-perforante pour attaquer les petits bateaux, à la place d'une charge creuse pour attaquer les chars.

usn_agm-65b=AGM-65B,Maverick,Attaque sol,L'AGM-65B est une arme air-sol à guidage TV américaine. Un opérateur dans l'avion lanceur maintient le réticule sur la cible souhaitée, l'arme se verrouille sur la cible puis se guide de manière autonome vers celle-ci après le lancement, de manière similaire à l'AGM-62 Walleye.
usaf_agm-86c=AGM-86C,CALCM,Attaque sol,Le missile de croisière aéroporté (CALCM) est un missile américain lancé depuis les airs destiné à attaquer des cibles terrestres à distance. Il s'agit de l'arme principale du B-52. Ces armes suivent une trajectoire préprogrammée vers leur cible sans intervention de la plate-forme de lancement après leur décollage, en utilisant la correspondance des contours du terrain à l'aide d'un radar de cartographie du terrain et de cartes numériques embarquées.

usn_rgm-109c=RGM-109C,Tomahawk,Attaque sol,Le missile d'Attaque au sol Tomahawk (TLAM) est un missile d'Attaque au sol américain à distance de sécurité. Ces armes suivent un itinéraire préprogrammé vers une cible sans intervention de la plateforme de lancement après le lancement, en utilisant la correspondance des contours du terrain à l'aide d'un radar de cartographie du terrain et de cartes numériques embarquées.

usn_ugm-109c=UGM-109C,Tomahawk,Attaque sol,Le missile d'attaque terrestre Tomahawk (TLAM) est un missile américain à longue portée destiné à l'attaque terrestre. Ces armes suivent une trajectoire préprogrammée vers leur cible sans intervention de la plate-forme de lancement après leur mise à feu, en utilisant la correspondance des contours du terrain à l'aide d'un radar de cartographie du terrain et de cartes numériques embarquées. Il s'agit du modèle lancé à partir d'un sous-marin, déployé exclusivement à partir de tubes lance-torpilles. L'UGM-109C ne peut pas être entièrement ravitaillé en carburant pour un lancement à partir d'un sous-marin, ce qui réduit quelque peu sa portée par rapport au modèle lancé à partir d'un navire.

usa_bgm-71a=BGM-71A,BGM-71A TOW,Attaque sol,Le BGM-71 TOW est un missile antichar américain filoguidé. L'arme est utilisée à la fois depuis des hélicoptères et des véhicules blindés.
usa_bgm-71c=BGM-71C,I-TOW,Attaque sol,Le BGM-71 I-TOW est un missile antichar américain à guidage par câble. Cette arme est utilisée aussi bien depuis des hélicoptères que depuis des véhicules blindés. Il s'agit d'une version améliorée de l'I-TOW, dotée d'une portée accrue (comme le BGM-71B) et d'une sonde à distance permettant de percer le blindage des chars modernes, même si elle peut encore rencontrer des difficultés face aux derniers chars de combat soviétiques.
usa_bgm-71d=BGM-71D,TOW 2,Attaque sol,Le BGM-71D TOW 2 est un missile antichar américain à guidage par câble. Cette arme est utilisée aussi bien depuis des hélicoptères que depuis des véhicules blindés. Il s'agit d'une version améliorée du BGM-71 TOW d'origine, dotée d'une ogive nettement plus puissante et d'un moteur perfectionné, ce qui lui permet de neutraliser facilement les menaces blindées les plus récentes.

wp_at-6=AT-6,Spiral,Attaque sol,L'AT-6 Spiral (9M114 Kokon) est un missile antichar guidé supersonique soviétique utilisé par certains hélicoptères d'attaque, notamment le Ka-29 et le Mi-24. Il se caractérise notamment par sa longue portée, sa vitesse élevée et sa tête militaire puissante.
wp_at-10=AT-10,Sabber,Attaque sol,L'AT-10 Sabber est un missile antichar guidé soviétique utilisé par le char T-55M.

# ---------- Anti-sub  Missiles ----------
ran_ikara=GWS-40,Ikara,ASM,Le GWS-40 Ikara est un missile de croisière anti-sous-marin australien, propulsé par un moteur-fusée, qui déploie une torpille Mk-46 ou Mk-44 pour neutraliser les menaces sous-marines. Bien qu'il ait une portée deux fois supérieure à celle de l'ASROC américain, l'Ikara est un peu plus lent et, en raison de sa configuration de lancement, il n'est pas possible de tirer rapidement plusieurs missiles.

usn_rur-5=RUR-5,ASROC,ASM,Le RUR-5 ASROC (pour Anti-Submarine Rocket) est une arme anti-sous-marine à distance. Le missile ASROC est lancé depuis la plate-forme de tir et déploie une torpille Mk 46 ASM après avoir parcouru une trajectoire balistique.

wp_apr-2=APR-2,,ASM,L'APR-2 est une torpille anti-sous-marine soviétique larguée par avion, avec une portée de recherche de 0,75 mille nautique et peut être utilisée jusqu'à une profondeur de 600 m.
wp_ss-n-14a=SS-N-14A,Silex,ASM,Le SS-N-14 Silex (Metel) est une arme anti-sous-marine soviétique. Similaires à l'Ikara australien, ces armes transportent une torpille sous une petite cellule de missile de croisière.
wp_ss-n-14b=SS-N-14B,Silex-B,ASM/ASu,Le SS-N-14 Silex-B (Rastrub) est une arme soviétique à double usage anti-sous-marine et anti-surface. Similaires à l'Ikara australien, ces armes transportent une torpille sous une petite cellule de missile de croisière.
wp_ss-n-16=SS-N-16,Stallion,ASM/ASu,Le SS-N-16 Stallion (Vodopad) est une arme anti-sous-marine soviétique à distance. Il vole sur une trajectoire balistique pour larguer une torpille à proximité de la cible.

# ------------------ RBU ------------------
knm_terne_shell=Mortier Terne III,Mortier ASM,Le Terne est un système d'arme anti-sous-marin propulsé par fusée norvégien développé dans les années 1960.

plan_type62dc=FQF-1200,,Mortier ASM,Le FQF-1200 est un lance-roquettes anti-sous-marin chinois à 5 tubes.
plan_type75dc=FQF-2500,,Mortier ASM,Le FQF-2500 est un lance-roquettes anti-sous-marin chinois à 12 tubes.

rn_limbo_shell=Mortier Terne III,Mortier ASM,Le Terne est un système d'arme anti-sous-marin propulsé par fusée norvégien développé dans les années 1960.
rn_squid_shell=Mortier SQUID,Mortier ASM, Squid est un mortier anti-sous-marin de fabrication britannique datant de la Seconde Guerre mondiale. Guidé à l'aide du sonar du navire, il peut larguer trois grenades sous-marines dans un triangle autour de la cible.

swe_375mm_rocket=Bofors M/50,,Mortier ASM,Le Bofors M/50 est un lance-roquettes anti-sous-marin suédois de 375 mm.

wp_rgb-10=RBU-1000,,Mortier ASM,Le RBU-1000 (ou Smerch-3) est un lance-roquettes anti-sous-marin soviétique de 300 mm. Le RBU-1000 a une portée d'environ 1000 mètres.
wp_rgb-12=RBU-1200,,Mortier ASM,Le RBU-1200 (ou Smerch-3) est un lance-roquettes anti-sous-marin soviétique de 251 mm. Le RBU-1200 a une portée d'environ 1200 mètres.
wp_rgb-25=RBU-2500,,Mortier ASM,Le RBU-2500 (ou Smerch-1) est un lance-roquettes anti-sous-marin soviétique de 213 mm. Le RBU-2500 a une portée d'environ 2500 mètres.
wp_rgb-60=RBU-6000,,Mortier ASM,Le RBU-6000 (ou Smerch-2) est un lance-roquettes anti-sous-marin soviétique de 213 mm. Le RBU-6000 a une portée d'environ 5500 mètres.

# --------------- Torpille ---------------
fr_e15=E15,,Torpille ASu,La torpille française E15 est une torpille anti-surface lourde inhabituelle de 55 cm avec guidage par sonar passif.
fr_l3=L3,,Torpille ASM,La torpille française L3 est une torpille anti-sous-marine de poids moyen d'un diamètre inhabituel de 55 cm.
fr_l5_mod3=L5,Mod 3,Torpille ASM,La torpille française L5 est une torpille anti-sous-marine de poids moyen de 55 cm. Il s'agit d'une version plus rapide et à plus longue portée de la torpille anti-sous-marine L3, conçue pour s'adapter à l'allongement des portées de détection des sonars et à l'augmentation de la vitesse des sous-marins.
fr_f17_mod1=F17,Mod 1,Torpille ASu,La torpille française F17 est une torpille antinavire lourde de 533 mm à guidage par câble. Il s'agit d'une version plus rapide et à plus longue portée de la torpille antinavire E15, dotée d'un guidage par câble permettant de manœuvrer ou de passer sous la couche thermique, et disposant de deux modes de vitesse.
fr_f17_mod2=F17,Mod 2,Torpille,La torpille française F17-2 est une torpille lourde de 533 mm à double usage, guidée par câble. Il s'agit d'une version améliorée de la torpille F17 d'origine, dotée d'une capacité anti-sous-marine grâce à un autodirecteur actif-passif, d'une vitesse plus élevée, d'une plus grande profondeur de plongée et d'une portée accrue.
fr_f17p=F17P,,Torpille,La torpille française F17P (P pour "Polyvalent") est une torpille lourde de 533 mm à guidage par câble et à double usage. Il s'agit d'une version améliorée de la torpille F17 d'origine, destinée exclusivement à l'exportation, dotée d'une capacité anti-sous-marine grâce à un autodirecteur actif-passif, ce qui en fait une torpille à double usage pouvant être utilisée aussi bien à partir de navires que de sous-marins.

ger_dm1=DM1,,Torpille ASM,La première torpille filoguidée d'Allemagne dédiée à la lutte contre les sous-marins.
ger_dm2=DM2,,Torpille ASu,Torpille filoguidée allemande dédiée aux cibles de surface.
ger_sst4=SST4,,Torpille ASu,Torpille lourde filoguidée ASu de fabrication allemande. Produite pour l'exportation vers d'autres marines.

it_a-244s_air=A-244,,Torpille ASW,Torpille anti-sous-marine italienne légère larguée par voie aérienne. Guidage sonar actif et passif.

jmsdf_type80=Type 80,,Torpille,Torpille Type 80. Fruit des programmes de recherche GRX-1 et GRX-2 des années 1970, et influencée par la conception de la Mark 37 de l'USN, cette torpille filoguidée ASu/ASM présente de meilleures caractéristiques en termes de propulsion, de performances et de portée que la Mark 37.
jmsdf_type54=Type 54,,Torpille,Torpille Type 54 Modèle 3 Mod 1. Première torpille conçue par le Japon après la Seconde Guerre mondiale. Initialement peu aboutie et sujette à défaillances après son lancement, elle a fait l'objet de plusieurs modifications pour aboutir à la Modèle 3 Mod 1 produite en série.

knm_tp612=TP612,,Torpille ASu,La torpille suédoise TP612 est une torpille filoguidée lourde avec un chercheur sonar passif. La TP612 est une évolution de la TP611 avec un bruit réduit et une capacité de lancement en surface.
knm_tp613=TP613,,Torpille ASu,La torpille suédoise TP613 est une torpille filoguidée lourde avec un chercheur sonar passif. La TP613 est une évolution de la TP612.

plan_yu-1=Yu-1,,Torpille ASu,Le Yu-1 (Fish Type-1) est la première torpille lourde de fabrication chinoise. Ces torpilles à trajectoire rectiligne sont relativement simples et donc fiables et efficaces.
plan_yu-1g=Yu-1G,,Torpille ASu,La Yu-1G (Fish Type-1A) est la première torpille lourde de fabrication chinoise. Il s'agit d'une version améliorée de la torpille Yu-1, dotée d'une capacité de guidage passif afin de pouvoir engager plus efficacement des navires en manœuvre.
plan_yu-3=Yu-3,,Torpille ASM,La Yu-3 (Fish Type-3) est une torpille lourde anti-sous-marine passive chinoise. De faible vitesse, elle est particulièrement adaptée à l'attaque de sous-marins diesel-électriques, car les cibles plus rapides pourraient la distancer. La tête sonar a une portée maximale d'environ 1 600 mètres.
plan_yu-4=Yu-4A,,Torpille ASu,La Yu-4A (Fish Type-4) est une torpille lourde anti-surface passive chinoise. De faible vitesse, elle n'est de plus efficace qu'à très courte distance.

rn_mark9_mod2=MkIX,,Torpille ASu,La torpille britannique Mark IX** est une torpille anti-surface introduite pendant la Seconde Guerre mondiale. Avec une durée de fonctionnement plus longue et une ogive plus puissante, c'est la dernière mise à niveau de la conception originale Mark IX des années 1930.
rn_mark8_mod4=Mark VIII,,Torpille ASu,La torpille britannique Mark VIII Mod 4 est une torpille anti-surface à trajectoire rectiligne mise en service pendant la Seconde Guerre mondiale. Il s'agit de la version finale de la série Mark 8, lancée depuis des sous-marins dans les années 1920, et elle a été utilisée par la Royal Navy jusque dans les années 1980, faute d'un remplaçant adéquat dans le domaine anti-navire avant la fin de la Guerre froide.
rn_mark20s=Mark 20S,Bidder,Torpille ASM,La Mark 20S "Bidder" est une torpille anti-sous-marine britannique de poids moyen datant des années 1950, qui était déjà considérée comme obsolète avant même d'entrer en service. La Mark 20S est la version lancée depuis un sous-marin de cette torpille. Bien qu'il s'agisse de la première torpille à tête chercheuse de ce type de la Royal Navy, elle présente une fiabilité extrêmement faible, une portée réduite, une vitesse lente et des performances de guidage médiocres, ce qui la rend inadaptée face aux cibles modernes. Cette arme est restée en service jusque dans les années 1970 en raison de sa capacité à être tirée depuis les tubes lance-torpilles de « contre-mesures » situés à l'arrière des sous-marins des classes Oberon et Porpoise.
rn_mark23=Mark 23,Grog,Torpille ASM,La Mark 23 "Grog" est une torpille anti-sous-marine britannique de poids moyen datant des années 1950, dotée d’une capacité secondaire de combat anti-navire, qui était déjà considérée comme obsolète avant même d’entrer en service. La Mark 23 constitue une amélioration majeure par rapport à la torpille Mark 20 d'origine, avec un segment de batterie allongé et une capacité de guidage par câble, bien qu'elle hérite toujours du chercheur extrêmement médiocre et de la faible vitesse de la Bidder. En raison de la fiabilité et des performances médiocres de cette arme, son efficacité contre les sous-marins et les navires de surface modernes est pour le moins discutable.

usn_mk16=Mk-16,,Torpille ASu,La torpille Mark 16 est une torpille à trajectoire rectiligne datant de la Seconde Guerre mondiale, utilisée dans les années 1950 et 1960 comme torpille anti-navire rapide et très puissante par les sous-marins d'attaque américains. Malgré l'absence de guidage, les tirs à courte portée qui atteignent leur cible coulent presque à coup sûr n'importe quelle cible, quelle que soit sa taille. La variante Mod 8 intègre l'ogive à haute puissance du Mod 0, avec la portée plus longue de la torpille Mod 1.
usn_mk37=Mk-37,,Torpille ASM,La torpille Mark 37 est la torpille légère ASM standard de l'US Navy, utilisée par de nombreux pays. Introduite en 1959, elle est devenue trop lente et trop peu performante pour résister aux meilleurs sous-marins soviétiques modernes.
usn_mk37_mod1=Mk-37 Mod 1,,Torpille ASM,La torpille Mark 37 est la torpille légère ASW standard de l'USN utilisée dans plusieurs pays. Introduite en 1959, elle est devenue trop lente et trop peu performante pour faire face aux sous-marins soviétiques modernes à haute performance. La Mod 1 ajoute le filoguidage au détriment d'une partie de sa vitesse.
usn_mk37_mod3=Mk-37 Mod 3,,Torpille ASM,La torpille Mark 37 est la torpille légère anti-sous-marine standard de la marine américaine, utilisée par de nombreux pays. Lancée en 1959, elle s'est avérée trop lente et trop peu performante pour faire face aux sous-marins soviétiques modernes de haute performance. La torpille Mk-37 Mod 3 est équipée d'un nouveau système de guidage destiné à améliorer sa fiabilité et sa portée de détection, bien que le reste de la torpille reste inchangé par rapport à la version originale Mod 0.
usn_mk37_mod2=Mk-37 Mod 2,,Torpille ASM,La torpille Mark 37 est la torpille légère anti-sous-marine standard de la marine américaine, utilisée par de nombreux pays. Lancée en 1959, elle s'est avérée trop lente et trop peu performante pour faire face aux sous-marins soviétiques modernes de haute performance. La torpille Mk-37 Mod 2 intègre un nouveau système de guidage destiné à améliorer la fiabilité et la portée de détection, bien que le reste de la torpille reste inchangé par rapport à la version Mod 1 à guidage par câble.
usn_mk37c=Mk-37C,,ASW Torpedo,The Mark 37C torpedo is an upgraded version of the USN Mk-37 torpedo, with Otto fuel and wire guidance, and is a significant improvement on the original torpedo. Exclusively used by export partners starting in the mid 1970s, the Mk-37C (NT-37C) includes improved propulsion for 150% higher speed, and nearly twice as much range, at the cost of being a slightly noisier torpedo.
usn_mk37e=Mk-37E,,ASW Torpedo,The Mark 37E torpedo is an upgraded version of the Mk-37C torpedo with wake-homing capability and a redesigned seeker. Exclusively used by export partners, the Mk-37E (NT-37E) has upgraded anti-ship capabilities and minor refinements to propulsion allowing for a very competent anti-submarine and anti-ship torpedo for the mid 1980s.
usn_mk44_air=Mk-44,,Torpille ASM,La torpille Mark 44 est la torpille anti-sous-marine traditionnelle de l'OTAN, largement utilisée tout au long de la guerre froide. Bien qu'elle soit très fiable, la Mark 44 a une portée courte et une vitesse réduite, ce qui la rend peu efficace contre les sous-marins rapides et capables de plonger à grande profondeur.\nCe modèle est lancé depuis les airs.
usn_mk44_ship=Mk-44,,Torpille ASM,La torpille Mark 44 est la torpille anti-sous-marine traditionnelle de l'OTAN, largement utilisée tout au long de la guerre froide. Bien qu'elle soit très fiable, la Mark 44 a une portée courte et une vitesse réduite, et peine à lutter contre les sous-marins rapides et capables de plonger à grande profondeur.\nCe modèle est lancé depuis la surface.
usn_mk46_air=MK-46,,Torpille ASM,La torpille Mark 46 est la norme OTAN pour les torpilles légères utilisées dans plusieurs pays. Conçue pour attaquer les sous-marins soviétiques modernes à hautes performances, cette variante est larguée par voie aérienne.
usn_mk46_ship=MK-46,,Torpille ASM,La torpille Mark 46 est la norme OTAN pour les torpilles légères utilisées dans plusieurs pays. Conçue pour attaquer les sous-marins soviétiques modernes à hautes performances, cette variante est lancée à partir d'un navire.
usn_mk46_mod5_air=Mk-46 Mod 5,NEARTIP,Torpille,La torpille Mark 46 Mod 5 NEARTIP est la norme OTAN en matière de torpilles légères, utilisée par de nombreux pays. Conçue pour attaquer les sous-marins soviétiques modernes à hautes performances, cette variante est larguée depuis les airs.\ n\nLa Mk-46 Mod 5 NEARTIP (NEAR Term Improvement Program) est une refonte complète de la torpille Mk-46, qui offre une plus grande portée grâce à une phase de transit plus lente et plus silencieuse, des contre-contre-mesures améliorées, ainsi qu'une mise à niveau permettant à la torpille de suivre des sous-marins en eaux peu profondes et en surface, bien que son efficacité reste limitée.
usn_mk46_mod5_ship=Mk-46 Mod 5,NEARTIP,Torpille,La torpille Mark 46 Mod 5 NEARTIP est la norme OTAN en matière de torpilles légères, utilisée par de nombreux pays. Conçue pour attaquer les sous-marins soviétiques modernes à hautes performances, cette variante est lancée depuis un navire.\ n\nLa Mk-46 Mod 5 NEARTIP (NEAR Term Improvement Program) est une refonte complète de la torpille Mk-46, qui offre une plus grande portée grâce à une phase de transit plus lente et plus silencieuse, des contre-contre-mesures améliorées, ainsi qu'une mise à niveau permettant à la torpille de suivre des sous-marins en eaux peu profondes et en surface, bien qu'avec une efficacité limitée.
usn_mk48=Mk-48,,Torpille,La Mark 48 Mod 1 est une torpille lourde américaine. Ces torpilles sont guidées par fil et peuvent être redirigées depuis la plate-forme de lancement.
usn_mk48_mod4=Mk-48 Mod 4,,Torpille,La Mark 48 Mod 4 est une torpille américaine lourde à double usage. Il s'agit d'une torpille très rapide, à longue portée, dotée d'un système de guidage par câble et d'un autodirecteur très sophistiqué. La version Mod 4 correspond à la mise à niveau effectuée dans les années 1980, qui a apporté des améliorations à l'autodirecteur afin de permettre le suivi des cibles les plus modernes, telles que les sous-marins nucléaires d'attaque (SSN) de classe Alfa, et intègre un système de guidage bidirectionnel par câble qui renforce la capacité de rejet des contre-mesures. 
usn_mk48_mod4_adcap=Mk-48 ADCAP,,Torpille,La Mark 48 Mod 4 (ADCAP) est une torpille américaine lourde à double usage. Il s'agit d'une torpille très rapide, à longue portée, dotée d'un système de guidage par câble et d'un autodirecteur très sophistiqué. La version ADCAP Mod 4 (distincte du programme de construction neuve du Mk-48 Mod 5 ADCAP) est une mise à niveau de 1985 destinée aux torpilles Mod 4 existantes, dotée d'un nouveau plateau oscillant et d'une nouvelle pompe à carburant, qui repousse encore plus loin les limites de la torpille existante avec une vitesse terminale plus élevée de 65 nœuds, ainsi que des améliorations apportées au système de guidage pour renforcer la capacité de rejet des contre-mesures.

wp_45-36nu=45-36NU,,Torpille ASu,La 45-36NU est une torpille obsolète de 450 mm conçue avant la Seconde Guerre mondiale, fortement influencée par les modèles italiens 45-F et 53-F du début des années 1930. Légère et moins puissante que ses homologues de 530 mm, elle est devenue une arme inefficace dans les années 1950. Mais il faut parfois faire avec ce que l'on a.
wp_53-38=53-38,,Torpille ASu,La 53-38 est une torpille lourde soviétique à mouvement droit datant de la Seconde Guerre mondiale. Ces torpilles sont relativement simples et donc fiables et efficaces. Les deux naufrages les plus meurtriers de l'histoire (le transport allemand Wilhelm Gustloff et le transport de troupes Goya) ont été réalisés par deux sous-marins soviétiques utilisant des 53-38.
wp_53-39=53-39,,Torpille ASu,La 53-39 est une torpille soviétique lourde à parcours rectiligne datant de la Seconde Guerre mondiale. Ces torpilles sont relativement simples et donc fiables et efficaces.
wp_53-56v=53-56,,Torpille ASu,La 53-56V est une torpille lourde soviétique à parcours rectiligne. Ces torpilles sont des variantes mises à jour de la 53-38.
wp_53-65K=53-65K,,Torpille WH,La 53-65 est une torpille lourde soviétique à guidage de sillage conçue pour détruire les navires de surface.
wp_65-76=65-76,,Torpille WH,La 65-76 est une torpille à tête chercheuse soviétique de 650 mm connue sous le nom de "torpille tueuse de porte-avions". Elle a été développée spécifiquement pour être utilisée contre des cibles extrêmement grandes telles que les super-porte-avions. Son diamètre plus grand de 650 mm signifie que seuls certains sous-marins peuvent la transporter.
wp_at-1=AT-1,,Torpille ASM,L'AT-1 est une torpille anti-sous-marine électrique soviétique larguée par voie aérienne avec guidage acoustique actif/passif transportée uniquement par des hélicoptères.
wp_at-2=AT-2,,Torpille ASM,L'AT-2 est une torpille anti-sous-marine soviétique à guidage acoustique actif/passif. L'AT-2 est l'une des rares torpilles lourdes lancées par voie aérienne, car la majorité des torpilles lancées par voie aérienne sont beaucoup plus petites et ne pèsent qu'un quart du poids.
wp_set-40=SET-40,,Torpille ASM,La SET-40 est une torpille anti-sous-marine électrique légère soviétique avec guidage par sonar actif/passif.
wp_set-65=SET-65,,Torpille ASM,La SET-65 est une torpille anti-sous-marine électrique soviétique lourde avec guidage par sonar actif.
wp_test-71=TEST-71,,Torpille ASM,La TEST-71 est une torpille anti-sous-marine soviétique à guidage filoguidé de poids lourd. Elle améliore la SET-65 avec des capacités de guidage actif/passif plus avancées.
wp_test-71m=TEST-71M,,Torpille ASM,La TEST-71M est une torpille anti-sous-marine soviétique de gros calibre à guidage par câble. Elle est équipée d'un système de guidage numérique amélioré et d'une unité de guidage par câble modernisée, ce qui permet de lever les restrictions antérieures liées à ce mode de guidage et d'assurer ainsi une plus grande souplesse de tir.
wp_umgt-1=UMGT-1,,Torpille ASM,L'UMGT-1 est une torpille anti-sous-marine soviétique larguée par voie aérienne qui sert également de charge utile pour les missiles anti-sous-marins SS-N-14 et SS-N-16. Ces torpilles légères ont moins de puissance que les torpilles lourdes soviétiques, mais restent extrêmement dangereuses.
wp_uset-80=USET-80,,Torpille,L'USET-80 est une torpille soviétique moderne à double usage. Elle dispose d'un système de guidage actif/passif, ce qui en fait une arme extrêmement dangereuse pour les sous-marins et les navires de surface.

# ------------------ Bombs -----------------
fr_samp_t25=SAMP-25,,Bombe,La SAMP Type 25 est une bombe non explosive française de 230 kg (500 lb). Elle est comparable à la Mk-82 américaine.
fr_samp_t21=SAMP-21,,Bombe,La SAMP Type 21 est une bombe non explosive française de 400 kg (880 lb). Elle est comparable à la Mk-83 américaine.

pla_type-2=Type-100-2,,Bombe,La Type-100-2 est une bombe chinoise de 100 kg à usage général, larguée par avion. Elle est comparable à la FAB-100 soviétique.
pla_type-3-250=Type-250-3,,Bombe,La Type-250-3 est une bombe chinoise de 250 kg à usage général, larguée par avion. Elle est comparable à la FAB-250 soviétique.
pla_type-3-500=Type-500-3,,Bombe,La Type-500-3 est une bombe chinoise de 500 kg à usage général, larguée par avion. Elle est comparable à la FAB-500 soviétique.

raf_bl755=BL755,,Bombe à fragmentation,La BL755 contient 147 bombes HEAT perforantes dispersées sur une vaste zone. Elle a été largement utilisée pendant la guerre Iran-Irak par l'IRIAF et aux Malouines par la RAF

usaf_gbu-2=GBU-2,Paveway I,Bombe guidée, la GBU-2 Paveway I est une bombe guidée par laser américaine de 907 kg (2000 lb). L'arme est basée sur la Mk 84 mais avec l'ajout d'un chercheur laser monté sur le nez et d'ailettes pour le guidage.
usaf_gbu-15=GBU-15,,Bombe guidée,La GBU-15(V)2 est une bombe planante à guidage infrarouge qui a été utilisée par l'USAF sur certains avions tactiques supersoniques, tels que le F-111 et le F-4E, et qui a été exportée vers de nombreux pays. Cette arme est équipée d'un autodirecteur infrarouge à imagerie (IIR), très fiable et utilisable par tous les temps, et dispose également d'une liaison de données permettant de recalibrer la cible et de transmettre les données de l'autodirecteur à la plate-forme de lancement.
usaf_bolt-117=BOLT-117,,Bombe guidée,La BOLT-117 est une bombe américaine de 340 kg (750 lb) à guidage laser. Il s'agit d'une bombe à tête métallique M-117 modifiée, à laquelle ont été ajoutés un autodirecteur laser monté à l'avant et des ailettes pour le guidage.
usaf_gbu-11=GBU-11,Paveway I,Bombe guidée,La GBU-11 est une bombe américaine de 1 400 kg guidée par laser. Il s'agit d'une bombe guidée très lourde destinée à être utilisée contre des cibles difficiles, telles que des ponts ou des bunkers, en raison de son rendement explosif élevé.
usaf_m117=M117,,Bombe,La M117 est une bombe de 340 kg (750 lb) datant de la guerre de Corée et largement utilisée par l'USAF pendant la campagne du Vietnam. Elle a été remplacée par les différents modèles de la série Mk 80.
usaf_m118=M118,,Bombe de démolition,La M118 est une bombe de démolition américaine ultra-lourde de 1400 kg (3 000 lb), conçue pour être utilisée contre des cibles résistantes telles que des ponts, des bunkers, des fortifications, des voies ferrées et d'autres structures solides.
usaf_cbu-24=CBU-24,,Bombe à fragmentation,La CBU-24 contient 665 bombes à fragmentation dispersées sur une vaste zone. Elle était largement utilisée comme arme antipersonnel par les unités Wild Weasel attaquant les sites SAM.

usn_gbu-10=GBU-10, Paveway II,Bombe guidée,La GBU-10 Paveway II est une bombe guidée par laser américaine de 907 kg (2000 lb). L'arme est basée sur la Mk 84 mais avec l'ajout d'un chercheur laser monté sur le nez et d'ailettes pour le guidage. Le kit de guidage du GBU-10 est une mise à niveau de l'ancien Paveway I.
usn_gbu-12=GBU-12, Paveway II,Bombe guidée,la GBU-12 Paveway II est une bombe guidée par laser américaine de 227 kg (500 lb). L'arme est basée sur la Mk 82 mais avec l'ajout d'un chercheur laser monté sur le nez et d'ailettes pour le guidage.
usn_gbu-16=GBU-16,Paveway II,Bombe guidée,La GBU-16 Paveway II est une bombe américaine de 460 kg guidée par laser. Cette arme est basée sur la Mk 82, mais est équipée en plus d'un autodirecteur laser monté à l'avant et d'ailettes pour le guidage.
usn_gbu-24=GBU-24,Paveway III,Bombe guidée,La GBU-24 Paveway III est une bombe américaine à guidage laser d'une portée étendue de 907 kg (2 000 lb). Il s'agit d'une version améliorée de la Paveway II, dotée d'un système de guidage perfectionné et d'une plus grande portée de vol plané, ainsi que d'une fiabilité accrue et d'un profil de vol à basse altitude plus efficace.
usn_mk-82=Mk-82,,Bombe,La Mark 82 est une bombe muette polyvalente à faible traînée de 500 lb (227 kg).
usn_mk-82_snakeye=Mk-82 Snakeye,,Bomb,La Mark 82 "Snake-eye" est une bombe non guidée polyvalente de 500 lb (227 kg) à forte traînée, équipée d'ailettes déployables. Elle est utile pour les largages "à plat", où l'avion largue les bombes à grande vitesse et à basse altitude, sans approche en piqué ni remontée, mais au prix d'un temps de vol plus long.
usn_mk-83=Mk-83,,Bombe,La Mark 83 est une bombe à usage général à faible traînée de 1 000 lb (454 kg).
usn_mk-84=Mk-84,,Bombe,La Mark 84 est une bombe à usage général à faible traînée de 2000 lb (454 kg).
usn_rockeye=CBU-100,Rockeye,Bombe à fragmentation, la CBU-100 Rockeye II est une bombe à fragmentation américaine de 500 lb (227 kg) qui distribue 247 sous-munitions.
usn_walleye2=AGM-62,Walleye II,Bombe guidée,L'AGM-62 Walleye est une bombe planante guidée par télévision qui a été utilisée par les forces armées des États-Unis des années 1960 aux années 1990. La plupart avaient une ogive hautement explosive de 250 lb (113 kg) ; certaines avaient une ogive nucléaire W72.

usn_mk54_dc=Mk-54,,Grenade ASM,La charge de profondeur Mark 54 est une grenade anti-sous-marin aéroportée américaine conçue pendant la Seconde Guerre mondiale et restée en service pendant toute la guerre froide. 

wp_fab-100=OFAB-100,,Bombe,La bombe aérienne polyvalente OFAB-100-120 de conception soviétique de 100 kg (220 lb) avec une ogive hautement explosive principalement utilisée par l'Union soviétique et ses alliés. 
wp_fab-250=FAB-250,,Bombe,La FAB-250 est une bombe aérienne polyvalente de 250 kg (550 lb) de conception soviétique avec une ogive hautement explosive principalement utilisée par l'Union soviétique et ses alliés.
wp_fab-500=FAB-500,,Bombe,La FAB-500 est une bombe aérienne polyvalente de conception soviétique de 500 kg (1100 lb) avec une ogive hautement explosive principalement utilisée par l'Union soviétique et ses alliés. 
wp_fab-500_m54=FAB-500,,Bombe,La FAB-500 est une bombe aérienne polyvalente de 500 kg de conception soviétique, dotée d'une ogive hautement explosive, principalement utilisée par l'Union soviétique et ses alliés. Il s'agit d'une bombe plus courte, à traînée moyenne, destinée à être transportée en plus grande quantité, généralement à l'intérieur, mais dont la précision est moins bonne que celle du modèle à faible traînée.
wp_fab-1500_m54=FAB-1500 M-54,,Bombe,La FAB-1500 est une bombe à largage aérien polyvalente de 1 500 kg (3 300 lb) de conception soviétique, dotée d'une ogive à haut pouvoir explosif, principalement utilisée par l'Union soviétique et ses alliés. Il s'agit du modèle de 1 500 kg d'une famille de bombes à haut pouvoir explosif de grande taille, principalement destinée à frapper des cibles durcies telles que les grands navires de guerre, les bunkers ou les bases aériennes.
wp_fab-3000_m54=FAB-3000 M-54,,Bombe,La FAB-3000 est une bombe « polyvalente » de 3 000 kg (6 600 lb) de conception soviétique, à tête explosive, principalement utilisée par l'Union soviétique et ses alliés. Il s'agit du modèle de 3 000 kg d'une famille de grosses bombes explosives, principalement destinée à frapper des cibles durcies telles que les grands navires de guerre, les bunkers ou les bases aériennes.
wp_fab-9000_m54=FAB-9000 M-54,,Bombe,La FAB-9000 est une bombe aérienne « polyvalente » de 9 000 kg (20 000 lb) de conception soviétique, dotée d'une ogive à haut pouvoir explosif, principalement utilisée par l'Union soviétique et ses alliés. Il s'agit du modèle de 9 000 kg d'une famille de grosses bombes à haut pouvoir explosif, et c'est l'une des plus grosses bombes conventionnelles jamais utilisées au combat, destinée principalement à détruire des cibles fortifiées.

wp_kab-500l=KAB-500L,,Bombe guidée,La KAB-500L est une bombe aérienne à guidage laser de 500 kg de conception soviétique, dotée d'une ogive hautement explosive, principalement utilisée par l'Union soviétique et ses alliés. Elle est basée sur la FAB-500, mais est équipée d'un autodirecteur laser et d'ailettes de guidage.

wp_rbk-250=RBK-250,,Bombe à fragmentation,La RBK-250 est une bombe à fragmentation soviétique de 250 kg (550 lb).
wp_rbk-500=RBK-500,,Bombe à fragmentation,La RBK-500 est une bombe à fragmentation soviétique de 500 kg (1100 lb).

wp_plab-100=PLAB-100,,Grenade ASM,La PLAB-100 est une grenade anti-sous-marine de 100 kg (220 lb) de conception soviétique, larguée depuis les airs, principalement utilisée par l'Union soviétique et ses alliés. 

# ---------------- Bouée Acoustique ---------------
plan_skf-1=SKF-1,,Bouée Sonar,La SKF-1 est une bouée sonar omnidirectionnelle passive utilisée par la marine de l'Armée populaire de libération depuis les années 1960.
plan_skf-2=SKF-2,,Bouée Sonar,La SKF-2 est une bouée sonar passive directionnelle utilisée par la marine de l'Armée populaire de libération depuis le milieu des années 1970.

usn_ssq-41=AN/SSQ-41,LOFAR,Bouée Sonar,The SSQ-41A "Jezebel" is a Low Frequency Analysis and Recording (LOFAR) type sonobouy. This is the most common NATO passive sonobuoy, and has no ability to determine bearing like the later DIFAR sonobuoy, but still has decent sensitivity, and can be found in large numbers in any Western navy's stockpile.
usn_ssq-47=AN/SSQ-47,Julie,Bouée Sonar active,La SSQ-47A "Julie" est une bouée sonar active à portée continue. Il s'agit de la bouée sonar active la plus courante de l'OTAN. Elle ne permet pas de déterminer le relèvement comme la bouée acoustique DICASS plus récente, mais reste utile pour "fixer" une cible précédemment détectée à l'aide de plusieurs bouées. En raison de ses émissions acoustiques actives continues, cette bouée acoustique a une durée de vie de seulement 30 minutes.
usn_ssq-53=AN/SSQ-53,DIFAR,Bouée Sonar, Le SSQ-53 est un bouée sonar de type DIFAR (Directional Frequency Analysis and Recording). Il fournit à l'opérateur de la bouée acoustique des informations sur le cap magnétique, ce qui constitue une amélioration considérable par rapport au CRT-1 omnidirectionnel précédent.
usn_ssq-62=AN/SSQ-62,DICASS,Bouée Sonar,L'AN/SSQ-62 DICASS est une bouée sonar active utilisée pour repérer un sous-marin en plongée qui a été localisé précédemment avec les bouées sonars passives SSQ-53.
usn_ssq-77=AN/SSQ-77,VLAD,Bouée Sonar,La SSQ-77A est une bouée sonar passive de type VLAD (Vertical Line Array DIFAR), conçue pour améliorer la génération précédente de bouées acoustiques passives de type DIFAR. Cette bouée a une architecture similaire à celle de la bouée DIFAR, mais intègre un réseau de sonars extrêmement sensible qui lui confère une portée passive extrêmement longue pour une bouée acoustique, une grande capacité à détecter des cibles silencieuses et plongeant à grande profondeur, et de bonnes performances dans des eaux encombrées et bruyantes.n\nCette performance accrue a toutefois un coût en termes de poids et de prix, ce qui explique que ces bouées soient moins courantes et que leur précision à longue distance soit médiocre. Elles sont donc principalement utiles pour la localisation de cibles immergées.
usn_ssq-101=AN/SSQ-101,Bouée Sonar,Le récepteur actif déployé dans l'air AN/SSQ-101 (ADAR) est une bouée acoustique conçue comme récepteur pour les systèmes multistatiques en eau peu profonde. Une fois déployée, elle utilise un large éventail d'hydrophones pour déterminer des relèvements précis.

wp_rgb-1=RGB-1,,Bouée Sonar,La RGB-1 est une bouée sonar omnidirectionnelle passive uniquement utilisée par l'Union soviétique.
wp_rgb-nm1=RGB-NM-1,,Bouée Sonar,La RGB-NM-1 est une bouée sonar omnidirectionnelle passive uniquement utilisée dans le cadre de la suite Bakou par l'Union soviétique.
wp_rgb-3=RGB-3,,Bouée Sonar,La RGB-3 est une bouée sonar active utilisée par l'Union soviétique.

# ------------------ FFAR -----------------
usn_zuni=Zuni,,FFAR,Le Zuni est un missile aérospatial à ailerons repliables (FFAR) de 5,0 pouces principalement transporté par des avions d'attaque au sol et des hélicoptères d'attaque. Le Zuni peut être utilisé pour transporter divers types d'ogives similaires aux autres systèmes FFAR. Il est généralement tiré à partir de la nacelle de roquettes LAU-10 contenant quatre roquettes.
usn_hydra=Hydra 70,,FFAR,L'Hydra 70 est une fusée d'avion à ailerons repliables (FFAR) de 2,75 pouces utilisée à la fois par les chasseurs et les hélicoptères. L'Hydra peut être équipée d'une gamme d'ogives et est normalement transportée dans des nacelles pouvant contenir jusqu'à 19.

wp_s-5=S-5,,FFAR,La S-5 est une roquette soviétique à ailerons repliables de 55 mm (FFAR) utilisée par les chasseurs-bombardiers et les hélicoptères. Le S-5 peut retracer son héritage jusqu'au R4M allemand de la fin de la Seconde Guerre mondiale. La fusée est normalement transportée dans des nacelles pouvant contenir jusqu'à 32.
wp_s-8=S-8,,FFAR,La S-8 est une roquette soviétique à ailerons repliables de 80 mm (FFAR) utilisée par les chasseurs-bombardiers et les hélicoptères. Le S-8 a un certain nombre de variantes différentes, y compris des variantes spécialisées pour le refus de piste. La fusée est normalement transportée dans des nacelles pouvant contenir jusqu'à 20.
wp_s-24=S-25,,FFAR,La S-25 est une roquette soviétique à ailerons repliables (FFAR) de 240 mm utilisée par les chasseurs-bombardiers et les hélicoptères. Contrairement à la plupart des FFAR, elle est emporté individuellement.
wp_s-25=S-25,FFAR,La S-25 est une roquette soviétique à ailerons repliables (FFAR) de 266 mm utilisée par les chasseurs-bombardiers et les hélicoptères. La plus grande des roquettes non guidées de l'Union soviétique, le S-25 possède une ogive contenant près de 60 kg d'explosifs et est transporté individuellement.

# ------------------ MLRS -----------------
ir_107mm_rocket=Haseb-1,MLRS,La roquette Haseb-1 est une version iranienne de la fusée chinoise de 107 mm tirée par le lance-roquettes multiple de type 63. Dans le service iranien, le lanceur et la fusée sont tous deux appelés Haseb.

usa_m26=M26,,MLRS,La M26 est une roquette non guidée de 227 mm utilisée par le système de roquettes à lancement multiple (MLRS) M270 de l'armée américaine. La charge utile de la roquette comprend jusqu'à 800 sous-munitions capables de couvrir jusqu'à 2000 mètres carrés.

wp_grad=Grad,MLRS,La roquette M-21OF est une arme soviétique tirée depuis le lanceur BM-21. Le système complet (le M-21) est plus communément connu sous le nom de système de roquettes à lancement multiple "Grad". 

