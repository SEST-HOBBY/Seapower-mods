### Values by damage state

Killed																	100%
Damage Major 															75%
Damage Moderate															50%
Damage Minor															25%


### Scoring calculations:

We start from 0, enemy kills and damages are ADDED while friendly kills and damages are SUBTRACTED. Civilian kills by player weapons are SUBTRACTED

The ratio of friendly losses to enemy losses determines the result:

Friendly losses as a % of enemy losses:

175 : Decisive Defeat
150 : Defeat
125 : Minor Defeat
100 : Pyrrhic Victory
75% : Minor Victory
50% : Victory
25% : Decisive Victory







