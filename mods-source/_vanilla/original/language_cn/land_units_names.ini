[pla_apc_type63]
Type=装甲运兵车
Default=63式装甲输送车,63式装甲输送车
DefaultDescription=63式是中国失去苏联援助后最早生产的装甲运兵，相当于美国的M113。其适应性与M113一样强大，被中国和越南、朝鲜、孟加拉国、伊拉克等盟国采用。在越南战争期间，中国将它们提供给了北越，它们也在两伊战争中登场。中国军队的63式从1990年代开始被ZSD-89取代。
Variant1=63式装甲输送车,63式装甲输送车

[pla_lt_type_63]
Type=轻型坦克
Default=63式水陆坦克,63式水陆坦克
DefaultDescription=中国的63式衍生自苏联的PT-76两栖轻型坦克，最早服役于1960年代中期。和PT-76的不同之处在于它进行了大量微调，如四人车组、靠左的驾驶员位置、安装在中央的炮塔，以及在水中同时使用履带与喷水推进的能力。63式被出口至中国的数个盟国，并在越南战争的最后阶段首次投入使用。在中国军队中，它被后续改装的63A式取代。
Variant1=63式水陆坦克,63式水陆坦克
Variant2=63式水陆坦克,63式水陆坦克
Variant3=63式水陆坦克,63式水陆坦克
Variant4=63式水陆坦克,63式水陆坦克
Variant5=63式水陆坦克,63式水陆坦克
Variant6=63式水陆坦克,63式水陆坦克
Variant7=63式水陆坦克,63式水陆坦克

[pla_spaag_type63]
Type=自行防空炮
Default=63式自行高射炮,63式自行高射炮
DefaultDescription=63式由T-34底盘和装有双联装61式37毫米炮的炮塔组成。在越南战争期间，中国将它们提供给了北越。越南战争后，63式仍在越南和中国军队中服役，直至1990年代退役。
