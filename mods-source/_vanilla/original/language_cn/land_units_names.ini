[swe_ersta]
Type=海岸炮
Default=m/70海岸炮,海岸炮
DefaultDescription=12厘米口径m/70炮塔式自动炮（也称重炮替代计划）是瑞典的海岸炮，设计目标是替换二战时期的老式火炮，保护港口等重要地区免受苏联登陆部队的进攻，并执行区域拒止任务。这些火炮与配套设施相连，操作员可在其中生活60天，这对于潜在的核战场非常重要。这款火炮有8门在1980年代末出口至挪威。
Variant1=m/70海岸炮,海岸炮

