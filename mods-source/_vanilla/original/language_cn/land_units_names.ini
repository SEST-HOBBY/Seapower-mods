[usa_aaa_m51]
Type=防空炮
Default=M51天空清扫者,M51
DefaultDescription=M51天空清扫者是美国的防空炮，配有火炮瞄准雷达、自动装弹机和模拟计算机火控仪，用途是攻击近程目标，因为当时的面对空导弹平台无法应对如此接近的目标。1950年代末，M51被美国淘汰，而日本和土耳其等外国使用者持续使用M51至1960/1970年代。
