[LoadingTips]
Count=19
Header=提示
Tip001=鱼叉和战斧反舰导弹不会规避地形，发射前请确认航线无遮挡。
Tip002=分散的阵型更难被敌方雷达识别。
Tip003=标准导弹可用于视距内反舰作战，并且比鱼叉导弹更擅长执行此任务。
Tip004=SH-2F直升机为美国海军护航舰艇提供机载对面搜索雷达，可探测舰载雷达探测范围外的水面目标，但无法搜索飞机。
Tip005=956型驱逐舰携带P-270蚊子导弹，其性能为同时代最强，但射程仅有50海里，因此作用有限。
Tip006=1155型驱逐舰携带3K95匕首面对空导弹，非常擅长对抗鱼叉和飞鱼等掠海导弹。
Tip007=飞机干扰将显著降低敌方防空系统的效率。
Tip008=URPK-3反潜武器装备于1135型和1134A型反潜舰。URK-5增加了辅助反舰能力，装备于1135M型、1134B型和1155型，射程为27海里。
Tip009=按Tab键可快速最大化战术显示（地图）。
Tip010=按Z键可使用单位的望远镜、光电设备或潜望镜。
Tip011=使用地图工具画出已识别敌方单位的防空和反舰导弹最大射程。
Tip012=按住Alt键，再将鼠标悬停在底部栏中的武器上，即可在战术地图和三维视图中显示其射界。
Tip013=除了早期的TEST-71等鱼雷只能在发射后调节速度和航向外，线导鱼雷的速度、深度和瞄准位置均可手动控制。
Tip014=底部栏的弹出状态面板会根据背景显示相关详细信息，如选中单位发出的噪声水平、直升机的幸存者运输能力、救生筏信标的距离和飞行甲板上可用的弹药类型（如AIM-54或AGM-84）。
Tip015=所有类型的声呐都可以探测产生噪声的目标。这在使用舰载拖曳阵列声呐（SQR-18、SQR-19）探测远超雷达视距的敌舰时非常关键。
Tip016=大多数直升机都具备某种形式的运输能力，可以运载幸存者，但一些较小的直升机无法运载太多（或任何）幸存者，除非选择“运输”配置移除其反潜装备。
Tip017=苏联的部分高级水面作战舰艇具备使用电子支援措施进行超视距探测的能力，特别是1134B型、1164型、956型和1144型。只要目标发出辐射，它们就能使用相关传感器从远超正常雷达视距的位置发射反舰导弹。
Tip018=AGM-84D、RGM-84D和UGM-84D的攻击模式会根据目标大小进行变化，攻击小型舰艇和浮航潜艇时采用跃起弹道，攻击水面舰艇时则采用掠海弹道。
Tip019=大多数军舰上的低功率对面搜索雷达与民用航行雷达信号差异较小，难以被电子支援措施区分。而高功率对面搜索雷达（或具备对空搜索能力的雷达）则特征明显，会立即暴露身份。