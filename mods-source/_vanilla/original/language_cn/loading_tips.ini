[LoadingTips]
Count=11
Header=提示
Tip001=鱼叉和战斧反舰导弹不会规避地形，发射前请确认航线无遮挡。
Tip002=分散的阵型更难被敌方雷达识别。
Tip003=标准导弹可用于视距内反舰作战，并且比鱼叉导弹更擅长执行此任务。
Tip004=SH-2F直升机为美国海军护航舰艇提供机载对面搜索雷达，可探测舰载雷达探测范围外的水面目标，但无法搜索飞机。
Tip005=956型驱逐舰携带P-270蚊子导弹，其性能为同时代最强，但射程仅有48海里，因此作用有限。
Tip006=1155型驱逐舰携带3K95匕首面对空导弹，非常擅长对抗鱼叉和飞鱼等掠海导弹。
Tip007=飞机干扰将显著降低敌方防空系统的效率。
Tip008=URPK-3反潜武器装备了1135型和1134A型反潜舰。URK-5增加了辅助反舰能力，装备了1135M型、1134B型和1155型，射程为27海里。
Tip009=按Tab键可快速最大化战术显示（地图）。
Tip010=按Z键可使用单位的望远镜、光电设备或潜望镜。
Tip011=使用地图工具画出已识别敌方单位的防空和反舰导弹最大射程。