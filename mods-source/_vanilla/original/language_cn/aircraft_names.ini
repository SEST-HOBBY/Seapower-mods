DefaultDescription=QH-50无人反潜直升机的设计目标是作为小型船只的远程反潜武器，它们的体型不足以安装机库并容纳直升机。作为舰队恢复和现代化项目的主要部分，QH-50被分配给了老旧船只，如基林级驱逐舰，也装备了战后的远洋护航舰。在实际使用中，这种直升机故障率很高，因此被认为可靠性过低，在1973年遭到淘汰。日本海上自卫队是QH-50的唯一外国用户，由于更标准化的使用流程，QH-50在日本取得了更大的成功，持续服役至1977年。QH-50D是C型的改进版，使用更大的365匹马力发动机、玻璃纤维桨叶和无尾构造。
Squadron1=QH-50,QH-50
Squadron2=QH-50,QH-50
Callsigns=Squadron1,无人反潜直升机|Squadron2,无人反潜直升机

