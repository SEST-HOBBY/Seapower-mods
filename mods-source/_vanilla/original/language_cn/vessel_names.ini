[usn_cgn_alaska]
Type=CGN,导弹巡洋舰
Default=阿拉斯加级,阿拉斯加
DefaultDescription=阿拉斯加级核动力巡洋舰是美国海军至今为止最大的核动力巡洋舰，源自1970年代末的CSGN计划，具备最新的宙斯盾武器系统，搭配了标准2导弹中程型、战斧巡航导弹、用于海军炮火支援的8英寸Mk71火炮和非常宽敞的机库，可起降大型直升机或特种垂直起降飞机。与提康德罗加级相比，阿拉斯加级拥有更好的装甲防护，并且其所有武器系统的弹药库明显更大。\n此单位是《海权》中一种有趣的虚构单位。
Variant1=阿拉斯加（CGN-42）,阿拉斯加
Variant2=夏威夷（CGN-43）,夏威夷
Variant3=波多黎各（CGN-44）,波多黎各
Variant4=萨摩亚（CGN-45）,萨摩亚

[usn_cgn_california]
Type=CGN,导弹巡洋舰
Default=加利福尼亚级,加利福尼亚
DefaultDescription=两艘加利福尼亚级巡洋舰于1974年和1975年进入美国海军服役，它们具有无限的航程，是理想的快速航母特遣舰队护航舰。它们是以核动力为重点从头开始设计的，也是最早的量产型核动力水面舰艇（此前的长滩号、班布里奇号和特拉克斯顿号都是本级舰的唯一一艘）。事实证明，它们的建造成本极高，因此后续单位被取消建造，取而代之的是后来的弗吉尼亚级巡洋舰。它们在自身服役的时代非常强大，前后都安装了Mk13导弹发射器和5英寸舰炮，还有一座可从前方装填的反潜火箭发射器。它们在1980年代初的改装中获得了密集阵近防系统，电子战套件也升级至AN/SLQ-32（V）3。它们虽然都在1990年代初经历了价格不菲的延寿升级，但还是在1990年代末迅速退役。
Variant1=加利福尼亚（CGN-36）,加利福尼亚
Variant2=南卡罗莱纳（CGN-37）,南卡罗莱纳

[usn_cgn_virginia]
Type=CGN,导弹巡洋舰
Default=弗吉尼亚级,弗吉尼亚
DefaultDescription=美国海军的4艘弗吉尼亚级导弹巡洋舰服役于1976年至1980年间。这些万吨大舰前后双向都装有导弹发射器和中口径火炮，使用成本极高，但战斗力同样强大。1980年代中期，它们都进行了升级改造，携带战斧导弹装甲箱发射器（取代了原有的直升机机库），还在CG/SM-2计划中加装了密集阵近防系统和标准2导弹中程型，成为了新威胁升级前唯一一种使用标准2导弹的鞑靼人舰艇。
Variant1=弗吉尼亚（CGN-38）,弗吉尼亚
Variant2=德克萨斯（CGN-39）,德克萨斯
Variant3=密西西比（CGN-40）,密西西比
