DefaultDescription==根据首舰命名法，它们的正式名称是法拉格特级，但通常也因其中作为导弹驱逐舰建造的首艘被称为孔茨级（前三艘后续被改装为导弹驱逐舰）。它们最初使用鞑靼人面对空导弹，但在服役末期接受升级，换装了标准导弹。\n\n1980 年，孔茨级驱逐舰马汉号（DDG-42）进行了升级，作为新威胁升级试验舰，配备了标准2导弹增程型（第2批）和其他先进系统，也因此成为了当时最强大的防空舰。
