DefaultDescription=阿德莱德级是澳大利亚皇家海军的6艘导弹护卫舰，也是美国奥利弗·哈泽德·佩里级护卫舰的改型，前四艘由美国造船厂建造。这些护卫舰从1980年代开始在澳大利亚皇家海军服役，弥补1970年代澳大利亚轻型驱逐舰项目失败的空缺。其建造标准与美国海军的同类舰艇非常相似，因此配备了一套现代化的防空、反舰和反潜作战系统。\n\n前三艘是短船体型，没有拖曳阵列声呐，也无法使用轻型机载多用途系统（LAMPS）Mk.III直升机，只能搭载无武装的AS-350直升机用于非战斗用途。
Variant1=阿德莱德（FFG-01）,阿德莱德
