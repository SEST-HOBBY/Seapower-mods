[ran_ddg_perth]
Type=DDG,驱逐舰
Default=珀斯级,珀斯
DefaultDescription=查尔斯·F·亚当斯级驱逐舰建成于1950年代末至1960年代中期，为美国海军、澳大利亚皇家海军（珀斯级）和西德海军（吕特晏斯级）服役。它们是美国海军最早安装导弹的舰艇之一，最初使用鞑靼人导弹。1970年代，亚当斯级获得了武器系统和雷达系统升级，可使用标准导弹。
