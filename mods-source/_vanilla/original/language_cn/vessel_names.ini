DefaultDescription=贝尔纳普级驱逐领舰是对查尔斯·亚当斯级驱逐舰的有限改装，目标为执行快速护航任务。其最大区别在于改进了小猎犬的Mk10发射器，使其也可发射反潜导弹，因此不再需要单独的胡椒盒式发射器；同时其船体延长了14英尺，增加的大部分空间都被用作无人反潜直升机的降落平台。此外，本级舰的传感器也得到了升级，如SPG-55B雷达和AN/SQS-26声呐。它们虽然是高效的全能战斗舰艇，但鉴于其强悍的声呐和反潜能力，通常被用于对抗水下威胁。
