[rcn_ss_oberon]
Type=SS,巡逻潜艇
Default=奥伯龙级加拿大型,奥伯龙
DefaultDescription=奥伯龙级潜艇是英国设计的柴电攻击型和巡逻潜艇，共27艘，也是鼠海豚级潜艇的后续改进型，采用了更坚固的艇体材料和升级的设备。加拿大皇家海军分两批订购了3艘本级潜艇，其设计与英国皇家海军的标准略有不同，最显著的改动是采用了美国的Mk37鱼雷。\n\n1970年代末，澳大利亚皇家海军启动了一项计划，将这些潜艇的服役期延长1990年代，其中首艘于1980年开始升级。升级后的潜艇可发射Mk48鱼雷，但这些鱼雷直到1990年代才交付，因此在冷战期间，这些潜艇使用Mk37C/E鱼雷过渡。
Variant1=奥吉布瓦（S72）,奥吉布瓦
Variant2=奥农达加（S73）,奥农达加
Variant3=奥勤拿根（S74）,奥勤拿根

