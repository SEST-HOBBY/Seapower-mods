[LoadScreen]
WarningPSE=极少数人在接触特定光图案或闪光时可能会癫痫发作。电脑屏幕或电子游戏的特定图案和背景可能会诱发癫痫。特定情况可能会诱发以往未被发现的癫痫，即使对于没有癫痫病史的人也是如此。\r\n\r\n如果你或你的家人患有癫痫，请在游戏前咨询医生。如果在游戏中出现以下任何症状——晕眩、视力变化、眼部或肌肉抽搐、意识丧失、定向障碍、任何不自主的运动或抽搐，请立即停止游戏，并在继续游戏前咨询医生。
WarningValidity=游戏文件的内容与预期的哈希值不匹配，请关闭游戏，删除/StreamingAssets/original的内容，并通过Steam验证完整性。\r\n\r\n按“删除文件夹”将自动为你删除此文件夹并使Steam在下次启动时重新下载。
