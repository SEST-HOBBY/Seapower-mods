#---------- Surface ships ----------
#---Air/Air&Surface---
CXAM=CXAM|CXAM是美国海军远程对空搜索雷达的原型。这种雷达套件在二战前夕装备了大型战斗舰艇。它像一张18英尺×16英尺的大型床垫，可以调节仰角，但波束过宽，无法测高。CXAM直接影响了战时的对空搜索雷达，几乎所有的后续型号都是以它为基础进行改进。
CXAM-1=CXAM-1|CXAM-1是在CXAM基础的上改进而来，共交付14套，装备了战列舰、巡洋舰和航空母舰。其天线外观仍呈床垫状，但取消了仰角调节功能。此型号精度提高到200码，在一些舰艇上一直服役到1943年。在大型战斗舰艇上，它被SK或SK-2套件取代。
SA=SA|SA系列套件的设计目标是在护航和辅助舰艇上以更小的天线实现CXAM的功能和性能。SA系列相对成功，成为了护航驱逐舰和护卫舰的标准对空搜索套件，也被部分驱逐舰和轻巡洋舰采用。二战后期，一些自由法国的舰艇在美国船厂进行了改装，获得了此套件。
SC-1=SC-1|与SA类似，SC也是尝试在小型舰艇上以更小的天线实现CXAM性能的产物。然而，更小的天线导致有效探测范围更近，这引起了操作者对基础型SC的不满。后续的SC-1于1942年1月服役，功率和范围都提高了一倍，很快所有的SC都进行了升级。战争初期，这款雷达装备了驱逐舰和辅助舰艇，后续又被SC-2取代。
SC-2=SC-2|SC-2在SC-1的基础上进行了大幅改进，增大了天线体积。此雷达集成了BG和BL敌我识别系统，并成为了驱逐舰在战争结束前的主要雷达。SC-2的轻度改进型（SC-3、SC-4和SC-5）持续在驱逐舰上服役，直至1963年。
SK=SK|SK是二战时期大型舰艇的标准对空搜索套件。它本质上是配备CXAM尺寸天线的SC-2，是一种二维雷达系统，仅提供方位角和斜距数据，所以需要配合其他传感器以确定高度。
SK-2=SK-2|此套件是SK的改进型，配备了一个17英尺的碟形天线，目的是减少旁瓣。战争后期，低仰角的SK和SK-2都因无法探测高空飞行的飞机而受到批评。此雷达共生产了75套，在服役之初或船厂改装阶段装备了大型战斗舰艇。
SM=SM|SM是美国第一款专为战斗机引导而生的雷达，它采用锥形扫描的铅笔波束来确定空中目标的高度，这是早期对空搜索雷达没有的能力。SM重达18000磅（仅天线就重达4000磅），只能安装在大型航空母舰上。后续生产的SM-1和SP可装备更小的舰艇。
SP=SP|SP是SM测高雷达的轻型后续产品。根据装备舰艇的不同，此套件可适配两种不同的天线，驱逐舰和轻型航母则使用较小的天线。此套件装备了在冲绳附近海域行动的基林级雷达警戒驱逐舰。SP共生产了300套，到战争结束时，主桅上安装SP、前桅上安装SK或SK-2已成为主力舰的常见配置。
SR=SR|SR是自CXAM以来第一款全新设计的对空搜索雷达，它整合了之前雷达开创的大量新技术。其天线大小大致相当于SC-2，但功率是SC-2两倍以上，并且在战争末期装备了驱逐舰。它也作为备用对空搜索雷达装备了大型战斗舰艇并持续服役至1961年。
SR-2=SR-2|SR-2是50厘米二维对空搜索套件，最初设计时用于护航驱逐舰，但生产开始后发现其体积过大。试验型雷达装备了中途岛级大型航母、数艘轻巡洋舰和最初的四艘雷达警戒潜艇。由于性能较差，此套件后续被AN/SPS-6取代。
SR-3=SR-3|SR-3和SR-6的设计目标是取代舰队中的SK和SK。它们采用L波段以获得更好的性能和更小的衰减，但由于所选的天线（战后报告评价“天线性能不足”），这两种套件的实际性能都很差。SR-6是SR-3的轻量化版本，配备了更小的天线。
SR-6=SR-6|SR-3和SR-6的设计目标是取代舰队中的SK和SK。它们采用L波段以获得更好的性能和更小的衰减，但由于所选的天线（战后报告评价“天线性能不足”），这两种套件的实际性能都很差。SR-6是SR-3的轻量化版本，配备了更小的天线。
SPS-6=SPS-6|AN/SPS-6是美国海军及其盟友在二战后不久使用的第一代二维对空搜索雷达。但二维雷达仅提供方位角和斜距数据，所以需要配合其他传感器以确定高度。
SPS-12=SPS-12|AN/SPS-12是中程二维对空和对面监视雷达，从1950年代服役至1980年代。
SPS-29=SPS-29|AN/SPS-29是美国海军使用的二维预警雷达，在冷战初期装备了大量船只。但二维雷达仅提供方位角和斜距数据，所以需要配合其他传感器以确定高度。
SPS-30=SPS-30|AN/SPS-30舰载S波段搜索和测高雷达是集成了更强发射器的现代化版AN/SPS-8，可探测和监视飞机。
UPA-43=UPA-43|AN/UPA-43是美国海军使用的敌我识别询问器，后续的AN/SPS-48等雷达都集成了敌我识别询问器，无需单独的天线。
SPS-32=SPS-32|AN/SPS-32，即著名的SCANFAR系统的一部分，装备企业号和长滩号，是其天线系统的水平部分，主要功能为对空监视。
SPS-33=SPS-33|AN/SPS-33，即著名的SCANFAR系统的一部分，装备企业号和长滩号，是其天线系统的垂直部分，主要功能为目标追踪。
SPS-37=SPS-37|AN/SPS-37是美国海军在冷战初期使用的二维预警雷达，也是AN/SPS-29的改进型。但二维雷达仅提供方位角和斜距数据，所以需要配合其他传感器以确定高度。
SPS-39=SPS-39|AN/SPS-39是远程三维对空搜索雷达，可提供方位角、距离和高度数据。类似于更大的SPS-48，SPS-39也通过旋转机械扫描获取目标方位角，通过电子扫描获取目标高度。这种三维雷达的定位是二维预警雷达和用于打击目标的火控雷达之间的中介。
SPS-40=SPS-40|AN/SPS-40是美国船只常用的远程二维对空搜索雷达。但二维雷达仅提供方位角和斜距数据，所以需要配合其他传感器以确定高度。
SPS-43=SPS-43|AN/SPS-43是超远程对空搜索雷达，主要装备美国的航母和导弹巡洋舰。其运行波段为甚高频，也可进行跳频抗干扰。但二维雷达仅提供方位角和斜距数据，所以需要配合其他传感器以确定高度。
SPS-48=SPS-48|AN/SPS-48是远程三维对空搜索雷达，可旋转基座上的整个天线进行机械扫描，从而获取目标方位角，同时通过电子扫描获取目标高度。这种三维雷达的定位是二维预警雷达和用于打击目标的火控雷达之间的中介。
SPS-48E=SPS-48E|AN/SPS-48E是远程三维对空搜索雷达，可旋转基座上的整个天线进行机械扫描，从而获取目标方位角，同时通过电子扫描获取目标高度。这种三维雷达的定位是二维预警雷达和用于打击目标的火控雷达之间的中介。\n这款雷达是新威胁升级专用的升级版SPS-48
，配备了新型天线，低空探测和电子反对抗性能得到了显著提升。
SPS-49=SPS-49|AN/SPS-49是远程二维对空搜索雷达，也是AN/SPS-40的后续型号，被美国及其盟友的大量船只用作主要对空搜索雷达，并且在新威胁升级项目中替换了老旧船只的SPS-40。
SPS-49V5=SPS-49（V）5|AN/SPS-49（V）5是远程二维对空搜索雷达，也是AN/SPS-40的后续型号，被美国及其盟友的大量船只用作主要对空搜索雷达，并且在新威胁升级项目中替换了老旧船只的SPS-40。\n这款雷达是源自新威胁升级项目的高功率升级型号，被安装在其他船只上，具有更低的最低探测高度和更强的电子反对抗性能。
SPS-52=SPS-52|AN/SPS-52是远程三维对空搜索雷达，可提供方位角、距离和高度数据。类似于更大的SPS-48，SPS-52也通过旋转机械扫描获取目标方位角，通过电子扫描获取目标高度。这种三维雷达的定位是二维预警雷达和用于打击目标的火控雷达之间的中介。
SPN-43=SPN-43|AN/SPN-43是二维空中交通管制雷达，装备航母和其他具有载机能力的船只，可识别和控制据船只50英里范围内的飞机。
SPY-1A=SPY-1A|AN/SPY-1是远程三维无源电子扫描阵列，也是宙斯盾战斗系统的关键组成部分，计算机控制的四面天线阵列可对船只周围的空域提供持续的360度覆盖。
MK-23_TAS=Mk23目标捕获系统|Mk23目标捕获系统（TAS）是快速旋转的小型中程二维雷达，可探测掠海或大角度来袭的导弹，一般与北约的海麻雀点防空系统搭配使用。

#---Surface only---
SPS-10=SPS-10|AN/SPS-10是二维对面搜索雷达，在二战后和冷战时期装备了美国及其盟友的大量船只。
SPS-55=SPS-55|AN/SPS-55是固态对面搜索和航行雷达，装备了斯普鲁恩斯级驱逐舰（及其衍生型号）、奥利弗·哈泽德·佩里级护卫舰和复仇者级扫雷艇。
SPS-67=SPS-67|AN/SPS-67是近程对面搜索雷达，主要装备美国船只，可探测和追踪水面和超低空高度的接触。

#---Fire Control---
#SAM
MK-115=Mk115|Mk115是有人操作指挥仪，可为海麻雀点防空导弹系统提供目标照明。
MK-95=Mk95|Mk95是升级后的北约海麻雀点防空导弹系统的一部分，可为半主动雷达制导系统提供目标照明。
SPW-2=SPW-2|AN/SPW-2是RIM-8黄铜骑士导弹使用的火控雷达，可控制导弹在驾束制导阶段的飞行。
SPG-49=SPG-49|AN/SPG-49是RIM-8黄铜骑士导弹使用的火控雷达，可为导弹的半主动雷达制导阶段提供目标追踪和照明。
SPG-51=SPG-51|AN/SPG-51是C和X波段火炮和导弹火控雷达，可搭配鞑靼人导弹和标准导弹中程型使用。
SPG-55=SPG-55|AN/SPG-55是小猎犬导弹和标准导弹增程型使用的火控雷达，可提供目标追踪和照明。特殊的对面追踪模式使导弹可执行反水面任务。
SPG-60=SPG-60|AN/SPG-60独立目标照明雷达（STIR）是X波段单脉冲追踪和目标照明雷达，可搭配鞑靼人导弹和标准导弹中程型使用，也是Mk86火炮火控系统的一部分。
SPG-62=SPG-62|AN/SPG-62是X波段连续波火控雷达，可为装有宙斯盾战斗系统的军舰提供标准2导弹的末段照明。
SYR-1=SYR-1|SYR-1是美国的数据链天线套件，用于接收标准-2导弹的下行指令，主要装备CG/SM-2计划中升级的标准-2增程型平台。与宙斯盾系统相比，它性能有限，但与标准-1平台相比，可支持齐射更多导弹。
SYR-1_NTU=SYR-1（新威胁升级）|SYR-1是美国的数据链天线套件，用于接收标准-2导弹的下行指令，装备1980年代末和1990年代初接受新威胁升级的船只。新威胁升级舰艇的火控能力大致相当于前期的宙斯盾舰艇。
SYS-1=SYS-1
#Guns
MK37_GFCS_MK4=Mk37火炮火控系统（Mk4“FD”雷达）|Mk37是5英寸38倍径两用炮系统使用的火控指挥仪。这款指挥仪装有Mk4“FD”雷达，二者的组合非常成功，可对抗水面和空中的目标。
MK37_GFCS_MK12=Mk37火炮火控系统（Mk12/22雷达）|Mk37是5英寸38倍径两用炮系统使用的火控指挥仪。这款指挥仪装有Mk12测距雷达和Mk22测高雷达，到了1944年中期，这种组合几乎装备了所有新建和改装的军舰。
MK37_GFCS_MK28=Mk37火炮火控系统（Mk28雷达）|Mk37是5英寸38倍径两用炮系统使用的火控指挥仪。这款指挥仪装有Mk28测距雷达的小型碟形天线，这是一种为老旧改装战舰节省重量的创新，因为考虑到重量限制，这些军舰的Mk37指挥仪通常无法安装标准的Mk12和Mk22。
MK37_GFCS=Mk37火炮火控系统|Mk37是5英寸38倍径两用炮系统使用的火控指挥仪。此指挥仪装有Mk25测距雷达，这是战后所有Mk37的标准配置，Mk37也以这种状态服役至1990年代初。
MK38_GFCS_MK3=Mk38火炮火控系统（Mk3“FC”雷达）|Mk38火炮火控系统指挥着战列舰级别的主炮，可在对抗海上和地面目标时提供高精度火控。此系统包含一个装甲指挥仪，安装在北卡罗来纳级、南达科他级和艾奥瓦级战列舰上层建筑的顶部。它也装备了阿拉斯加级大型巡洋舰。这款指挥仪装有Mk3“FC”测距雷达，即美国最早的火控套件之一。这种雷达和指挥仪的组合服役于1942年和1943年，后续被Mk8和Mk13套件取代。
MK38_GFCS=Mk38火炮火控系统（Mk13雷达）|Mk38火炮火控系统指挥着战列舰级别的主炮，可在对抗海上和地面目标时提供高精度火控。此系统包含一个装甲指挥仪，安装在北卡罗来纳级、南达科他级和艾奥瓦级战列舰上层建筑的顶部。它也装备了阿拉斯加级大型巡洋舰。这款指挥仪装有Mk13测距雷达，持续服役至1990年代初艾奥瓦级战列舰退役。
MK56_GFCS=Mk56火炮火控系统|Mk56是装有3英寸和5英寸舰炮的船只使用的火控指挥仪，X波段雷达追踪器使其可对抗水面和空中的快速目标。
MK63_GFCS=Mk63火炮火控系统|Mk63是装有3英寸和5英寸舰炮的船只使用的火控指挥仪，X波段雷达追踪器使其可对抗水面和空中的快速目标。
MK68_GFCS=Mk68火炮火控系统|Mk68是5英寸54倍径Mk42舰炮使用的火控指挥仪，X波段雷达追踪器使其可对抗水面和空中的快速目标。
MK86_GFCS=Mk86火炮火控系统|Mk86是5英寸54倍径Mk45舰炮使用的火控指挥仪，X波段雷达追踪器使其可对抗水面和空中的快速目标。与之前的指挥仪不同，Mk86无人操作，并且使用遥控电视摄像头作为光学元件的备份。
MK92_FCS=Mk92火炮火控系统|Mk92是美国获得授权生产的荷兰WM-25火控雷达，装备美国海军的奥利弗·哈泽德·佩里级护卫舰和飞马座级水翼艇，可控制标准导弹中程型和76毫米炮。
MK92_SearchRadar=Mk92雷达|Mk92系统包含两部雷达：一部搜索追踪雷达和一部连续波火控雷达。这是搜索雷达套件，可同时追踪两个水面目标并引导炮火向其射击。
SPQ-9=SPQ-9|AN/SPQ-9是与Mk86火炮火控系统配套的X波段对面搜索追踪雷达。值得注意的是，这款雷达可追踪近距离的低空飞行目标，如掠海巡航导弹，但其高度探测能力非常有限。

#---------- Submarines ----------
BPS-14_15=BPS-14|AN/BPS-14是美国海军潜艇用于航行的对面搜索雷达。

#---------------------------------------- Aircraft radar ----------------------------------------
AN/APY-1=APY-1|AN/APY-1是E-3预警机使用的超远程对空和对面搜索雷达，具有预警和战斗指挥控制功能。
LN-66=LN-66|LN-66是民用近程对面搜索雷达，装备了大量商用和军用船只，也装备SH-2F轻型多用途直升机。
AN/ASB-1B=ASB-1B
AN/APS-20=APS-20|AN/APS-20是P-2H巡逻机使用的S波段远程对空搜索雷达。
AN/APS-80=APS-80|AN/APS-80是前期型P-3和日本US-1巡逻机使用的X波段远程监视和对面搜索雷达，它通过机械扫描天线提供360度覆盖。
