ActiveIntercept_Early=主动拦截接收器|声学拦截系统（主动拦截）本质上是一种用于探测主动声呐信号的雷达告警接收器。它由一系列声呐组成，可探测并确定主动声呐信号的方位和型号，对舰艇/潜艇搭载的声呐和主动声自导鱼雷的导引头都有效。这些装置覆盖潜艇周围360度的范围，可探测被动声呐盲区内的主动声呐信号。
ActiveIntercept_Late=主动拦截接收器|声学拦截系统（主动拦截）本质上是一种用于探测主动声呐信号的雷达告警接收器。它由一系列声呐组成，可探测并确定主动声呐信号的方位和型号，对舰艇/潜艇搭载的声呐和主动声自导鱼雷的导引头都有效。这些装置覆盖潜艇周围360度的范围，可探测被动声呐盲区内的主动声呐信号。
