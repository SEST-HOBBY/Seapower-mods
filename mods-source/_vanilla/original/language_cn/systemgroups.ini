AN/ASX-1_TISEO=ASX-1光电目标识别系统|AN/ASX-1电视系统可对空中目标进行远程探测和识别。
KA-51A=KA-51A摄像头|KA-51A是RA-5C侦察机使用的前视倾斜摄像头。
AN/AVQ-22=AVQ-22微光电视|AN/AVQ-22是经过增强视野改装的B-52G使用的前视微光电视摄像头。
AN/AAS-21=AAS-21前视红外|AN/AAS-21是RA-5C侦察机使用的前视红外摄像头。
AN/AAQ-6=AAQ-6前视红外|AN/AAQ-6是经过增强视野改装的B-52G使用的前视红外摄像头。
AN/AAS-33=AAS-33前视红外|AN/AAS-33是经过目标识别攻击多传感器（TRAM）改装的A-6E使用的红外摄像头。
