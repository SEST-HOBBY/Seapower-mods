[AmmunitionNames]
# ------------------ AAM ------------------
it_aspide_1a=蝮蛇Mk.1A,,空对空,蝮蛇是意大利的中程空对空导弹，源自美国的麻雀导弹。这款导弹以AIM-7E为基础，改进了发动机，提高了射程和速度，配备了大幅改进的单脉冲导引头，可低空发射，还提升了电子反对抗性能。

fr_r530em=R530K,,空对空,R530K是法国的半主动雷达制导近程空对空导弹。作为法国最早研制的空对空导弹之一，R530的可靠性和威力都不突出，但其发动机燃烧时间相对较长，射程在同时代同类产品中也相对优秀。

fr_super-530f=超级530F,,空对空,超级530F是法国的半主动雷达制导中近程空对空导弹，也是R530导弹的升级型号，大致相当于美国的AIM-7。

fr_r550=R550,魔术1,空对空,R550魔术1是法国的红外制导近程空对空导弹，类似美国的AIM-9，但只能从后方攻击。

pla_pl-2=霹雳-2A,,空对空,霹雳-2A是中国的后方攻击红外制导空对空导弹。它仿制的是苏联R-13M红外制导空对空导弹，二者性能非常相近。

pla_pl-2b=霹雳-2B,,空对空,霹雳-2B是中国的后方攻击红外制导空对空导弹。B型的弹头更长，容纳了略微改进的导引头，但除此之外，仅可靠性方面略强于A型。

pla_pl-5b=霹雳-5B,,空对空,霹雳-5B是中国的后方攻击红外制导空对空导弹。它与霹雳-2B同时研制，是在失败的雷达制导型霹雳-5A的基础上改装而来。霹雳-5B采用来自霹雳-2B的红外导引头，但弹体性能更好，因此射程和转向性能更强。

pla_pl-5c=霹雳-5C,,空对空,霹雳-5C是中国的全向攻击红外制导空对空导弹。作为霹雳-2和霹雳-5B系列的重大改进型，霹雳-5C采用了先进的交叉阵列导引头，因此可以进行全向攻击且抗干扰能力显著提高。此外，霹雳-5C配备了燃烧时间更长的发动机，还提高了转向性能。

usaf_aim-9e=AIM-9E,响尾蛇,空对空,AIM-9E响尾蛇是美国的红外制导空对空导弹，E型的各方面性能对比早期型号都有明显提高，捕获包线范围更大，射程更远，但只能从后方攻击。

usaf_aim-9j=AIM-9J,响尾蛇,空对空,AIM-9J响尾蛇是美国的红外制导空对空导弹，J型在E型的基础上进行了重大升级，特别是控制系统方面，固态电子器件取代了早期的真空管电子器件，杀伤概率有所提高，但只能从后方攻击。

usaf_aim-9p=AIM-9P,响尾蛇,空对空,AIM-9P响尾蛇是美国的红外制导空对空导弹，P型是J型的出口版本，它采用了新型引信、新型发动机、改进型导引头，具备侧向射击能力，同时可靠性也更高。

usn_aim-7d=AIM-7D,麻雀,空对空,AIM-7D麻雀是美国的半主动雷达制导空对空导弹，对比更早的C型，D型在接近速度方面有所优化。\n对抗低空目标时明显低效，且最小射程过远。

usn_aim-7e=AIM-7E,麻雀,空对空,AIM-7E麻雀是美国的半主动雷达制导空对空导弹，对比更早的型号，E型的射程和性能方面都有所提升。\n对抗低空目标时明显低效，且最小射程过远。

usn_aim-7e2=AIM-7E-2,麻雀,空对空,AIM-7E-2狗斗型麻雀是美国的半主动雷达制导空对空导弹，E-2型是原版E型的改进型，改进原因是E型在越南战争中对抗战斗机的表现恶劣。E-2型最小射程更近，低空性能略有提升，助推段的机动性也略有提高。

usn_aim-7e4=AIM-7E-4,麻雀,空对空,AIM-7E-4麻雀是美国的半主动雷达制导空对空导弹，E-4型是升级的海军型号，可充分利用其显著的雷达优势，其对抗干扰和对抗措施性能也略微提升。

usn_aim-7f=AIM-7F,麻雀,空对空,AIM-7F麻雀是美国的半主动雷达制导空对空导弹，F型是对原版麻雀III弹体的重新设计，采用了现代化的助推-续航发动机以提升射程，同时配备了改进型引信和性能更强的导引头，各方面性能均有所提升。\n尽管如此，其低空性能和电子反对抗性能仍然不够优秀，导引头也无法充分发挥导弹的远射程优势。

usn_aim-7m=AIM-7M,麻雀,空对空,AIM-7M麻雀是美国的半主动雷达制导空对空导弹，M型是F型的改进型，配备了改进型的单脉冲导引头，可有效打击掠海目标，电子反对抗性能也得到了显著提升。此外，由于新型导引头的改进，有效射程也随之提升。

usn_aim-9b=AIM-9B,响尾蛇,空对空,AIM-9B响尾蛇是美国的红外制导空对空导弹，B型是响尾蛇系列中最早具有作战能力的一款。对比后续型号，B型的发射包线范围小，易被太阳等其他热源诱骗，且只能从后方攻击。

usn_aim-9c=AIM-9C,响尾蛇,空对空,AIM-9C是美国的半主动雷达制导空对空导弹，C型是唯一投入使用的雷达制导型响尾蛇导弹，与D型在导引头以外的方面完全相同。半主动雷达导引头使其能在更远的距离上进行全向射击。由于仅装备海军的F-8战斗机且普遍不受飞行员欢迎，C型服役数年后即退役。

usn_aim-9d=AIM-9D,响尾蛇,空对空,AIM-9D响尾蛇是美国的红外制导空对空导弹，D型是B型的改进型，导引头、弹头和射程都有所提升，但只能从后方攻击。

usn_aim-9g=AIM-9G,响尾蛇,空对空,AIM-9G响尾蛇是美国的红外制导空对空导弹，G型是D型的改进型，具有更大的发射角度，也被出口到其他国家，但只能从后方攻击。

usn_aim-9h=AIM-9H,响尾蛇,空对空,AIM-9H响尾蛇是美国的红外制导空对空导弹，H型是G型的固态电子器件改进型，配备了更灵敏的导引头，可以进行侧向射击，同时机动性和可靠性也得到了提升。

usn_aim-9l=AIM-9L,响尾蛇,空对空,AIM-9L响尾蛇是美国的红外制导空对空导弹，L型是第一款具有全向攻击能力的响尾蛇导弹。与之前的所有型号相比，其捕获包线范围提升巨大，且具有从敌机前方攻击的能力，但从后方攻击时捕获范围更大。

usn_aim-9m=AIM-9M,响尾蛇,空对空,AIM-9M是美国的红外制导空对空导弹，M型是已服役的最新型号，也是L型的改进型，具有更强的抗干扰能力和更大的导引头捕获范围。

usn_aim-54a=AIM-54A,不死鸟,空对空,AIM-54A不死鸟是美国的主动雷达制导空对空导弹，也是美国武器库中射程最远的空对空导弹，专门与F-14配套使用。配合先进的AWG-9雷达，F-14可使用这款导弹同时攻击6个目标。进行多目标攻击时，导弹依靠自动驾驶仪飞行，而机载计算机对雷达的扫描追踪数据进行采样存档，再将其传输至飞行途中的导弹，更新制导信息，使导弹在末段足够接近并使用自身的主动雷达锁定目标。

wp_aa-2a=R-3S,,空对空,信号旗R-3S（AA-2A环礁）是苏联的红外制导空对空导弹，其来源为对AIM-9B的逆向工程，结构和性能略有调整，其他方面大致相同，只能从后方攻击。


wp_aa-2c=R-3R,,空对空,信号旗R-3R（AA-2C环礁）是苏联的半主动雷达制导空对空导弹，其来源为对AIM-9B的逆向工程，安装了完全不同的导引头，捕获和发射包线范围却和美国的原型一样狭小。

wp_aa-2d=R-13M,,空对空,信号旗R-13M（AA-2D先进环礁）是苏联的红外制导空对空导弹，衍生自R-3S（本身来源为对AIM-9B的逆向工程），但安装了新的发动机和导引头，性能显著提升。

wp_aa-2-2=R-13M1,,空对空,信号旗R-13M1（AA-2-2先进环礁）是苏联的红外制导空对空导弹，衍生自R-3S（本身来源为对AIM-9B的逆向工程），但安装了新的发动机和导引头，性能显著提升。

wp_aa-3e=R-98MR,,空对空,加里宁格勒R-98MR（AA-3E先进亚拿伯）是苏联的半主动雷达制导空对空导弹，也是为苏-15和雅克-28P设计的两款R-98M之一。与美国F-102和F-106拦截机使用的AIM-4隼类似，其使用条令为同时对目标发射一枚雷达制导和一枚红外制导导弹，提高杀伤概率。

wp_aa-3f=R-98MT,,空对空,加里宁格勒R-98MT（AA-3F先进亚拿伯）是苏联的红外制导空对空导弹，也是为苏-15和雅克-28P设计的两款R-98M之一。与美国F-102和F-106拦截机使用的AIM-4隼类似，其使用条令为同时对目标发射一枚雷达制导和一枚红外制导导弹，提高杀伤概率。

wp_aa-6a=R-40R,,空对空,信号旗R-40R（AA-6A毒辣）是苏联的半主动雷达制导远程空对空导弹，也是专为米格-25P拦截机研制，用于对抗XB-70女武神的武器。与美国F-102和F-106拦截机使用的AIM-4隼类似，其使用条令为同时对目标发射一枚雷达制导和一枚红外制导导弹，提高杀伤概率。

wp_aa-6b=R-40T,,空对空,信号旗R-40T（AA-6B毒辣）是苏联的红外制导远程空对空导弹，也是专为米格-25P拦截机研制，用于对抗XB-70女武神的武器。与美国F-102和F-106拦截机使用的AIM-4隼类似，其使用条令为同时对目标发射一枚雷达制导和一枚红外制导导弹，提高杀伤概率。

wp_aa-6c=R-40RD,,空对空,改进型的信号旗R-40RD（AA-6C 毒辣）是苏联的半主动雷达制导远程空对空导弹，也是专为米格-25PD拦截机研制的武器，最大射程增至60千米。与美国F-102和F-106拦截机使用的AIM-4隼类似，其使用条令为同时对目标发射一枚雷达制导和一枚红外制导导弹，提高杀伤概率。

wp_aa-6d=R-40TD,,空对空,改进型的信号旗R-40TD（AA-6D毒辣）是苏联的红外制导远程空对空导弹，也是专为米格-25PD拦截机研制的武器，最大射程增至60千米。与美国F-102和F-106拦截机使用的AIM-4隼类似，其使用条令为同时对目标发射一枚雷达制导和一枚红外制导导弹，提高杀伤概率。

wp_aa-7c=R-24R,,空对空,信号旗R-24R（AA-7C顶点）是苏联的半主动雷达制导中程空对空导弹，即1970年代中期对R-23进行改进的产品，装备米格-23。这款武器装有单脉冲导引头，更不易受电子对抗措施影响，具有射后锁定能力，大致相当于美国的AIM-7E。

wp_aa-7d=R-24T,,空对空,信号旗R-24T（AA-7D顶点）是苏联的红外制导中程空对空导弹，即1970年代中期对R-23进行改进的产品，装备米格-23。与美国F-102和F-106拦截机使用的AIM-4隼类似，其使用条令为同时对目标发射一枚雷达制导和一枚红外制导导弹，提高杀伤概率。

wp_aa-8=R-60M,,空对空,信号旗R-60M（AA-8B蚜虫）是苏联的红外制导近程空对空导弹，这款武器的出口范围极广，因此苏联的盟友很可能会使用。

wp_aa-11=R-73A,,空对空,R-73A（AA-11弓箭手）是苏联的红外制导近程空对空导弹，也是苏联武器库中性能最佳的近程导弹，在海外市场竞争力极强，具有极为致命的近程全向攻击能力。

# ------------------ SAM ------------------
it_aspide_1=蝮蛇Mk.1A,,面对空/反水面,蝮蛇是意大利的中程面对空导弹，源自美国的麻雀导弹。这款导弹以AIM-7E为基础，改进了发动机，提高了射程和速度，配备了大幅改进的单脉冲导引头，可低空发射，还提升了电子反对抗性能。\n地面发射型的射程和速度不如空中发射型，但仍远胜于RIM-7E。

jsdf_sam1=81式,,面对空,81式防空导弹是日本的全向红外制导近程面对空导弹。

plan_hq-61=红旗-61,,面对空,红旗-61是中国的面对空导弹，也是中国为本国海军研制的第一款舰载面对空导弹。它服役于1980年代，但性能远不如同时代的其他产品，大致相当于RIM-7E海麻雀导弹。

raf_rapier=轻剑,,面对空,轻剑是英国的光学制导近程点防空导弹系统，瞄准线指令制导的特性导致其对抗快速飞机和导弹时有效性不高。

rn_seacat=GWS-21,海猫Mk.1,面对空,GWS-21海猫是最早的舰载点防空导弹系统之一，即博福斯40毫米炮的替代品，于1962年装备英国皇家海军，也被广泛用于出口。其制导方式为瞄准线指令制导，对抗快速的喷气式飞机和导弹时有效性不高。

rn_seacat_mk2=GWS-24,海猫Mk.2,面对空,GWS-24海猫Mk2是GWS-21海猫Mk.1的升级版，低空性能更强，射程更远，可靠性更高，并配备了更先进的火控系统。但它仍然是一款难堪一用的导弹，效率令人怀疑。

usa_mim-14=MIM-14,尼刻-赫拉克勒斯,面对空,MIM-14尼刻-赫拉克勒斯是美国和北约部队用于中高空防御的面对空导弹系统。

usa_mim-23=MIM-23,鹰,面对空,美国于1960年代研制了鹰式导弹，它是相对机动的中程面对空导弹系统。导弹本身使用发射连的高功率照明雷达（HPIR）进行半主动制导，脉冲捕获雷达（PAR）负责探测高空目标，连续波捕获雷达（CWAR）负责探测地面杂波中的低空目标。

usn_rim-8=RIM-8J,黄铜骑士,面对空/反水面,RIM-8J黄铜骑士是大型远程面对空导弹系统，主要装备美国海军的巡洋舰，导弹在飞行中段使用驾束制导，末段使用半主动雷达制导。整个系统需要极大的弹药库，导弹发射前需要进行组装，因此射速低于更现代化的系统。

usn_rim-7=RIM-7E,海麻雀,面对空/反水面,RIM-7E海麻雀是近程面对空导弹，也是北约的主要舰载近程防御导弹。\nE型是最早的海麻雀型号，其性能与空射的AIM-7E相同，只是射程和速度大幅降低，仅能进行近程防御。\n它继承了AIM-7E在导引头性能和低空射击能力方面尤为突出的缺陷。

usn_rim-7h=RIM-7H,海麻雀,面对空/反水面,RIM-7H海麻雀是近程面对空导弹，也是北约的主要舰载近程防御导弹。\nH型和E型总体上非常相似，只是RIM-7H具有可折叠的弹翼，可适配新型发射器，并且可靠性略有提高。

usn_rim-7m=RIM-7M,海麻雀,面对空/反水面,RIM-7M海麻雀是近程面对空导弹，也是北约的主要舰载近程防御导弹。\nM型与空射的AIM-7M基本相同，只是射程和速度大幅降低。\n与系列中更早的型号相比，M型是首款具备拦截掠海导弹和飞机能力的导弹，尽管射程近且速度慢，但仍是一款可靠的近程防御导弹。

# RIM-2 Terrier

usn_rim-2f=RIM-2F,小猎犬,面对空/反水面,RIM-2F小猎犬美国海军最早的面对空导弹系统之一，被用于为航母打击群提供介于战斗机和火炮之间的中程防空。小猎犬最初是驾束制导武器，而F型是改进型半主动雷达制导武器，机动性和杀伤概率更高。和其他面对空导弹类似，RIM-2F也可执行反水面任务。由于需要手动组装助推器弹翼，其发射间隔较长，一座发射器每30秒可发射2枚。

usn_rim-24b=RIM-24B,鞑靼人,面对空/反水面,RIM-24鞑靼人是近程雷达制导面对空导弹，也具备反舰能力。作为“3T”导弹家族（黄铜骑士、小猎犬、鞑靼人）的近程型号，RIM-24B与RIM-2E小猎犬共享部分部件，且性能强于最初的RIM-24A。

# RIM-66 SM-1MR/SM-2MR

usn_rim-66a=RIM-66A,标准1中程型,面对空/反水面,标准1导弹是一系列雷达制导区域防御面对空导弹，也具备近程反舰能力，其特点是拥有长时间燃烧的续航发动机，且性能全面，可对抗大部分威胁。标准1导弹的设计定位是可靠性更高的升级版RIM-2小猎犬和RIM-24鞑靼人导弹，但其火控能力和对低空目标的打击能力仍存在与后两者相同的局限性。\n\nSM-1MR第4批（RIM-66A-4）是标准1系列的中程型，采用固态电子器件取代了鞑靼人导弹的模拟器件，极大提高了可靠性，也增强了电子反对抗性能。

usn_rim-66b=RIM-66B,标准1中程型,面对空/反水面,标准1导弹是一系列雷达制导区域防御面对空导弹，也具备近程反舰能力，其特点是拥有长时间燃烧的续航发动机，且性能全面，可对抗大部分威胁。标准1导弹的设计定位是可靠性更高的升级版RIM-2小猎犬和RIM-24鞑靼人导弹，但其火控能力和对低空目标的打击能力仍存在与后两者相同的局限性。\n\nSM-1MR第5批（RIM-66B-2）是标准1系列的改进版中程型，在此前RIM-66A的基础上进行了升级，配备了更强大的火箭发动机以增加射程，新的引信和导引头组件也增强了电子反对抗性能。

usn_rim-66e=RIM-66E,标准1中程型,面对空/反水面,标准1导弹是一系列雷达制导区域防御面对空导弹，也具备近程反舰能力，其特点是拥有长时间燃烧的续航发动机，且性能全面，可对抗大部分威胁。标准1导弹的设计定位是可靠性更高的升级版RIM-2小猎犬和RIM-24鞑靼人导弹，但其火控能力仍存在与后两者相同的局限性。\n\nSM-1MR第6批（RIM-66E）是标准1系列的中程型，采用了标准2中程型第1批（RIM-66C/D）的电子器件（如改进的单脉冲导引头和新型弹头），还配备了改进的引信，更擅长追踪掠海目标。

usn_rim-66c=RIM-66C,标准2中程型,面对空/反水面,标准2导弹是一系列雷达制导区域防御面对空导弹，也具备近程反舰能力，其特点是拥有长时间燃烧的续航发动机，且性能全面，可对抗大部分威胁。标准2导弹用先进的数据链中段制导取代了标准1导弹的半主动雷达导引头，并在飞行的最后几秒进行末段雷达制导。同时飞行的标准2导弹数量可远超舰艇的照明器，因此与标准1导弹相比优势明显。\n\nSM-2MR第1批（RIM-66C）是标准2中程型系列的宙斯盾版本，其结构基本与RIM-66B相同，但采用了数据链、改进的单脉冲导引头和改进的弹头。

usn_rim-66d=RIM-66D,标准2中程型,面对空/反水面,标准2导弹是一系列雷达制导区域防御面对空导弹，也具备近程反舰能力，其特点是拥有长时间燃烧的续航发动机，且性能全面，可对抗大部分威胁。标准2导弹用先进的数据链中段制导取代了标准1导弹的半主动雷达导引头，并在飞行的最后几秒进行末段雷达制导。同时飞行的标准2导弹数量可远超舰艇的照明器，因此与标准1导弹相比优势明显。\n\nSM-2MR第1批（RIM-66D）是标准2中程型系列的核动力巡洋舰版本，专门用于改装后的弗吉尼亚级巡洋舰，除了火控通道数量较少以及需要更长的末段照明时间，与RIM-66C（宙斯盾版本）完全相同。

usn_rim-66g=RIM-66G,标准2中程型,面对空/反水面,标准2导弹是一系列雷达制导区域防御面对空导弹，也具备近程反舰能力，其特点是拥有长时间燃烧的续航发动机，且性能全面，可对抗大部分威胁。标准2导弹用先进的数据链中段制导取代了标准1导弹的半主动雷达导引头，并在飞行的最后几秒进行末段雷达制导。同时飞行的标准2导弹数量可远超舰艇的照明器，因此与标准1导弹相比优势明显。\n\nSM-2MR第2批（RIM-67G）是标准2系列的宙斯盾（Mk26）版本，具备新的助推器，可大幅提高射程，新的引信也提高了对抗低空飞行和高速目标的性能。

# RIM-67 SM-1ER/SM-2ER

usn_rim-67a=RIM-67A,标准1增程型,面对空/反水面,标准1导弹是一系列雷达制导区域防御面对空导弹，也具备近程反舰能力，其特点是拥有长时间燃烧的续航发动机，且性能全面，可对抗大部分威胁。标准1导弹的设计定位是可靠性更高的升级版RIM-2小猎犬和RIM-24鞑靼人导弹，但其火控能力和对低空目标的打击能力仍存在与后两者相同的局限性。\n\nSM-1ER（RIM-67A-2）是标准1系列的增程型，采用固态电子器件取代了鞑靼人导弹的模拟器件，极大提高了可靠性，还配备了新的引信和导引头组件，增强了电子反对抗性能。

usn_rim-67b=RIM-67B,标准2增程型,面对空/反水面,标准2导弹是一系列雷达制导区域防御面对空导弹，也具备近程反舰能力，其特点是拥有长时间燃烧的续航发动机，且性能全面，可对抗大部分威胁。标准2导弹用先进的数据链中段制导取代了标准1导弹的半主动雷达导引头，并在飞行的最后几秒进行末段雷达制导。同时飞行的标准2导弹数量可远超舰艇的照明器，因此与标准1导弹相比优势明显。\n\nSM-2ER第1批（RIM-67B）是标准2系列的增程型，于1970年代末至1980年代中期替换了小猎犬导弹，为服役中的驱逐舰和巡洋舰提供了火力升级。

usn_rim-67c=RIM-67C,标准2增程型,面对空/反水面,标准2导弹是一系列雷达制导区域防御面对空导弹，也具备近程反舰能力，其特点是拥有长时间燃烧的续航发动机，且性能全面，可对抗大部分威胁。标准2导弹用先进的数据链中段制导取代了标准1导弹的半主动雷达导引头，并在飞行的最后几秒进行末段雷达制导。同时飞行的标准2导弹数量可远超舰艇的照明器，因此与标准1导弹相比优势明显。\n\nSM-2ER第2批（RIM-67C）是标准2系列的增程型，具备新的助推器，可大幅提高射程，新的引信也提高了对抗低空飞行和高速目标的性能。

wp_sa-n-1=M-1,波浪,面对空/反水面,M-1波浪（SA-N-1藏原羚）是苏联海军最早的面对空导弹系统，被用于区域防空，并在一定程度上防御靠近的反舰导弹。这款武器最初仅对高空飞行的空中目标有效，后期型号具有反水面能力，对抗低空飞行的目标能力更强，射程更远。

wp_sa-n-1c=M-1P,波浪P,面对空/反水面,M-1P波浪P（SA-N-1C藏原羚）是苏联海军最早面对空导弹系统的改进型，其对抗干扰和箔条的性能有所提高，可以攻击低空飞行的目标。

wp_sa-n-3=M-11,风暴,面对空/反水面,M-11风暴（SA-N-3高脚杯）是苏联海军的面对空导弹系统，装备了多型导弹巡洋舰，以及苏联的直升机航母和短距起飞垂直降落航母。这款导弹具有反水面能力，后期型号对抗低空飞行目标的能力更强。

wp_sa-n-4=M-4,黄蜂-M,面对空/反水面,M-4黄蜂-M（SA-N-4壁虎）是9K33黄蜂（SA-8壁虎）的海军版，其可伸缩旋转发射架悬挂两枚导弹。这款武器大量装备了苏联的海上平台，承担近程防空任务。

wp_sa-n-5=9K32,箭-2,面对空,9K32箭-2（SA-N-5圣杯）是便携式面对空导弹，其陆基型北约代号为SA-7，海基型被用作点防空系统。

wp_sa-n-6=S-300F,堡垒,面对空/反水面,S-300F堡垒（SA-N-6轰鸣）是S-300P（SA-10轰鸣）陆基面对空导弹系统的海军版，装备苏联的导弹巡洋舰，是强大的远程防空系统，性能与SM-2相近。

wp_sa-n-7=M-22,飓风,面对空/反水面,M-22飓风（SA-N-7牛虻）是9K37山毛榉（SA-11牛虻）陆基面对空导弹系统的海军版，最早装备956型驱逐舰，是先进强大的武器系统。

wp_sa-n-9=3K95,匕首,面对空/反水面,3K95匕首（SA-N-9臂铠）是9K330环面（SA-15臂铠）导弹系统的海军版，海基型与陆基型使用相同的导弹，大量装备了苏联的大型水面战舰。

wp_sa-2=S-75,德维纳河,面对空,S-75德维纳河（SA-2准则）是苏联的远程面对空导弹系统，被用于对抗大面积区域内的轰炸机，也被广泛用于出口，并且参与了多场地区冲突，但在越南战争中最出名。

wp_sa-3=S-125,涅瓦河,面对空,S-125涅瓦河（SA-3藏原羚）是苏联的中程面对空导弹系统，被用于对抗机动性更强、高度更低的目标。

wp_sa-4=2K11,圆形,面对空,2K11圆形（SA-4小偷）是苏联的机动中程面对空导弹系统，被用于对抗大面积区域内的轰炸机。

wp_sa-5=S-200V,织女星,面对空,S-200V织女星（SA-5腌猪腿）是苏联的远程面对空导弹系统，具有干扰源追踪能力，被用于对抗大面积区域内的高空轰炸机。

wp_sa-6=2K12,立方体,面对空,2K12立方体（SA-6有利）是苏联的机动面对空导弹系统，被用于对抗约15英里外的近程威胁。

wp_sa-8=9K33M3,黄蜂,面对空,9K33M3黄蜂（SA-8壁虎）是苏联的机动面对空导弹系统，被用于为坦克和摩托化师提供近程防空。

wp_sa-11=9K37,山毛榉,9K37山毛榉（SA-11牛虻）是苏联的机动面对空导弹系统，被用于对抗约18英里外的近程威胁。

wp_sa-13=9K35,箭-10,面对空,9K35箭-10（SA-13囊鼠）是苏联的高机动近程面对空导弹系统，被用于对抗直升机等低空突现威胁。

# ---------- Anti-radar Missiles ---------
usn_agm-45=AGM-45B,百舌鸟,反辐射,AGM-45百舌鸟是美国的反辐射导弹，即AIM-7麻雀弹体与新导引头的结合。它射程短、速度不快、弹头小，而且只能在有限的雷达波段（S、C、X波段）上制导，但成本低、重量轻,因此得到了广泛应用。

usn_agm-78=AGM-78D,标准反辐射,反辐射,AGM-78标准反辐射导弹（STARM）是美国的远程反辐射导弹，用途是远距离打击顶级面对空导弹阵地。其设计方案衍生自SM-1MR面对空导弹，采用长时间燃烧的续航发动机和高抛弹道以实现远程射击，还配备了威力强大的弹头，用于确保摧毁任何被击中的雷达系统。但这种武器造价高昂且产量极低，所以任何时候都很少使用。

usn_agm-88a=AGM-88A,高速反辐射,反辐射,AGM-88A高速反辐射导弹（HARM）是美国的远程反辐射导弹，其各项性能优异。到了1985年，它成为了北约武库中最先进的反辐射导弹，几乎在所有方面都优于前代产品，尤其是在可靠性和最大速度方面。由于刚服役不久，这款导弹在任何时候都很稀缺（甚至完全没有）。

usn_agm-122a=AGM-122A,佩枪,反辐射,AGM-122A是近程战术反辐射导弹，可由直升机和固定翼飞机发射。它由短命的AIM-9C改装而来，是一种有效的近程反辐射导弹，可应对突然出现的近程防空威胁，但难以对抗强大的防空系统。

usn_rgm-8h=RGM-8H,黄铜骑士反辐射,反辐射,RGM-8H黄铜骑士是RIM-8面对空的反辐射改型，它利用大型弹体实现了舰载反辐射导弹的超远射程和高速飞行。虽然RGM-8H的基础是面对空导弹，但它本身并不具备防空能力，只能攻击正在使用雷达探测的水面目标。

wp_as-11=Kh-58,,反辐射,Kh-58（AS-11顺利）是苏联为苏-24M研制的反辐射导弹，也是苏联空军最先进的反坦克导弹之一，以超音速发射时射程极远。

wp_as-12=Kh-25MP,,反辐射,Kh-25MP（AS-12击球手）是苏联的空射超音速中程反辐射导弹。它是苏联军队中最常见的反辐射导弹，大致相当于美国的AGM-45。

wp_as-2b=K-10SP,彗星-10P,电子战,K-10SP是K-10S的改型，其弹头被替换为了杜鹃花干扰系统。 

# ---------- Anti-ship Missiles ----------
is_gabriel_2=加百列2,,反水面,加百列2是以色列的反舰导弹，采用半主动雷达制导，其射程相对较近，可低空飞行以规避敌方火力。2型是1型的升级版，电子反对抗性能和整体可靠性得到了提升。

is_gabriel_3=加百列3,,反水面,加百列3是以色列的近程反舰导弹，具有掠海飞行能力和主动雷达导引头。3型是2型的升级版，重新设计的弹头可容纳更先进的主动雷达导引头，可实现射后不管。

is_gabriel_3as=加百列3AS,,反水面,加百列3AS是以色列的近程反舰导弹，具有掠海飞行能力和主动雷达导引头。AS型是空射版本，射程更远，弹体也得到了重新设计。

it_seakiller_2=海杀手2,,反水面,海杀手2是意大利研制的反舰导弹，伊朗采购了这款武器，用于装备阿尔万德级护卫舰，每艘舰上装有一座五联装发射器。

it_otomat_mk1=奥托马特Mk1,,反水面,奥托马特Mk1是法国和意大利合作研制的中程反舰导弹。

jasdf_asm-1=ASM-1,,反水面,ASM-1是日本的空中发射防区外反舰导弹。

fr_as12=AS.12,ASM,反水面,AS.12是法国研制的直升机发射指令制导近程反舰导弹，它是SS.11反坦克导弹的升级版，具有更长的发动机和更大的弹头，可对小型船只构成严重威胁。

fr_am-39=AM39,飞鱼,反水面,AM39飞鱼是法国的防区外反舰导弹，作为鱼叉的替代品，这款武器深受整个北约和大量其他国家的欢迎。AM39是空中发射型。

fr_mm-38=MM38,飞鱼,反水面,MM38飞鱼是法国的防区外反舰导弹，作为鱼叉的替代品，这款武器深受整个北约和大量其他国家的欢迎。MM38是水面发射型。

fr_sm-39=SM39,飞鱼,反水面,SM39飞鱼是法国的防区外反舰导弹，作为鱼叉的替代品，这款武器深受整个北约和大量其他国家的欢迎。SM39是水下发射型，作为Mod2型的升级版，其电子反对抗性能更强，射程更远。

knm_penguin_mk2=AGM-119,企鹅Mk2,反水面,AGM-119企鹅是美国与挪威合作研制的空中和水面发射反舰导弹。

plan_sy-1=上游-1,,反水面,上游-1是苏联授权中国生产的P-15导弹。

plan_sy-1a=上游-1A,,反水面,上游-1A是中国以苏联的P-15导弹为基础开发的产品，具有改进型导引头和末段掠海飞行能力，既可在舰艇上使用，也可在陆基发射器上使用。

plan_hy-1=海鹰-1,,反水面,海鹰-1是中国以苏联的P-15导弹为基础开发的产品，由于加长了燃料箱，射程更远。

plan_hy-1j=海鹰-1J,,反水面,海鹰-1J是中国海鹰-1导弹的舰载版本，各项性能参数完全相同。

plan_hy-1a=海鹰-1A,,反水面,海鹰-1A是中国海鹰-1J导弹的升级版，具有改进的导引头和雷达高度计，可进行末段掠海飞行。

plan_hy-2=海鹰-2,,反水面,海鹰-2是中国以海鹰-1导弹为基础开发的产品，其燃料箱容量更大，射程更远，这也导致它无法进入舰载发射器，只能作为陆基导弹系统使用。

pla_hy-3=海鹰-3,,反水面,海鹰-3是采用冲压发动机的岸基超音速反舰导弹，飞行速度可达2.5马赫，射程130-180公里。其研制工作于1990年代完成，但并未投入使用。

plan_hy-4=海鹰-4,,反水面,海鹰-4是中国以海鹰-2导弹为基础开发的产品，涡轮喷气发动机取代了原有的液体燃料火箭发动机，这显著提升了射程，但由于海鹰-4的弹体比较笨重，其大部分飞行时间都只能以相对较高的高度和较低的速度飞行。

pla_yj-1=鹰击-1,,反水面,鹰击-1是中国的空射近程超音速反舰导弹，速度超过2马赫，并具有末段掠海飞行能力。虽然未曾服役，但少量预生产型于1980年代末问世，其主要设计目标是装备水轰-5。

pla_yj-6=鹰击-6,,反水面,鹰击-6是中国的空射反舰导弹，由陆基/海基型的上游-1/海鹰-1发展而来，作为空射导弹射程更远，但它使用早期导引头，所以和P-15、海鹰-1等导弹一样容易受到对抗措施的影响。

plan_yj-8=鹰击-8,,反水面,鹰击-8是中国的反舰导弹，其外形和性能都与法国的飞鱼导弹相似。在发射之后，导弹先爬升至20-30米高度，再下降至5-7米高度，以掠海剖面进行攻击。

usn_agm-12b=AGM-12B,小斗犬,反水面,AGM-12B小斗犬是美国的空中发射超音速防区外打击武器。这款武器需要操作员手动引导，类似于苏联的Kh-23，并具有相同的缺点，其中最主要的是需要飞机持续向目标直线飞行。

usn_agm-123=AGM-123,船长,反水面,AGM-123是美国的中近程反舰导弹，由铺路II激光制导炸弹和固体火箭助推器组合而成。这款武器是空射型鱼叉导弹的替代品，事实证明，因为误击民用船只的风险过高，鱼叉在波斯湾等航线密集的水域难以使用。

usn_agm-84a=AGM-84A,鱼叉,反水面,鱼叉是美国的防区外反舰导弹，也被北约国家广泛使用。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。AGM-84是空中发射型。

usn_agm-84c=AGM-84C,鱼叉,反水面,鱼叉是美国的防区外反舰导弹，也被北约国家广泛使用。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。AGM-84是空中发射型，C型末段不会进行跃起机动，而是掠海飞行以更有效地攻击船只。

usn_agm-84d=AGM-84D,鱼叉,反水面,鱼叉是美国的防区外反舰导弹，也被北约国家广泛使用。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。AGM-84是空中发射型，D型是较新的改装，出现于1985年。它具有更好的电子反对抗措施，由于燃料的改进，射程也得到了提升。

usn_rgm-84a=RGM-84A,鱼叉,反水面,鱼叉是美国的防区外反舰导弹，也被北约国家广泛使用。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。RGM-84是水面发射型，A型末段会进行跃起机动以规避近防武器系统。

usn_rgm-84c=RGM-84C,鱼叉,反水面,鱼叉是美国的防区外反舰导弹，也被北约国家广泛使用。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。RGM-84是水面发射型，C型末段不会进行跃起机动，而是掠海飞行以更有效地攻击船只。

usn_rgm-84d=RGM-84D,鱼叉,反水面,鱼叉是美国的防区外反舰导弹，也被北约国家广泛使用。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。RGM-84是水面发射型，D型是较新的改装，出现于1985年。它具有更好的电子反对抗措施，由于燃料的改进，射程也得到了提升。

usn_rgm-109b=RGM-109B,战斧,反水面,战斧反舰导弹（TASM）是美国的防区外反舰导弹，可设置搜索轨迹并进行欺骗性机动。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。

usn_ugm-84a=UGM-84A,鱼叉,反水面,鱼叉是美国的防区外反舰导弹，也被北约国家广泛使用。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。UGM-84是水下发射型，使用一次性发射筒，A型末段会进行跃起机动以规避近防武器系统。

usn_ugm-84b=UGM-84B,鱼叉,反水面,鱼叉是美国的防区外反舰导弹，也被北约国家广泛使用。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。UGM-84是水下发射型，而B型是专为英国皇家海军生产的型号，不同于更早的A型，末段不会进行跃起机动，而是掠海飞行以更有效地攻击船只。

usn_ugm-84c=UGM-84C,鱼叉,反水面,鱼叉是美国的防区外反舰导弹，也被北约国家广泛使用。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。UGM-84是水下发射型，使用一次性发射筒，C型不同于更早的A型，末段不会进行跃起机动，而是掠海飞行以更有效地攻击船只。

usn_ugm-109b=UGM-109B,战斧,反水面,战斧反舰导弹（TASM）是美国的防区外反舰导弹，可设置搜索轨迹并进行欺骗性机动。这款武器装有主动雷达制导系统，导引头会在完成预先设定的路线后启动。\nUGM-109B是只能从鱼雷发射管发射的潜射型。

wp_as-2=K-10S,彗星-10,反水面,K-10S彗星-10（AS-2腌鱼）是苏联的空中发射超音速防区外反舰武器，设计目标为搭配图-16使用。这款武器大致相当于P-35，即使面对现代化水平不高的防空系统，突防效率也不高。

wp_as-4=Kh-22,暴风,反水面,Kh-22暴风（AS-4厨房）是苏联的空中发射超音速防区外反舰武器，可由图-22M和图-95发射。这款武器发射后先在高空以高速飞行，末段进行超音速俯冲，因此难以拦截。

wp_as-6=Kh-26,,反水面,Kh-26（AS-6大耳马鲛）是苏联的空中发射超音速防区外打击和反舰武器，可由图-16发射。作为小号的Kh-22，这款武器发射后先在高空以高速飞行，末段进行超音速俯冲，因此难以拦截。

wp_as-7=Kh-23,雷霆,反水面,Kh-23雷霆（AS-7克里）是苏联的空中发射超音速防区外打击武器。这款武器需要操作员手动引导，类似于美国的AGM-12小斗犬，并具有相同的缺点。

wp_as-10=Kh-25,,反水面,Kh-25（AS-10克伦人）是苏联的空中发射超音速防区外打击武器。这款武器使用激光导引头，具有射后不管能力。

wp_as-13=Kh-59,牛虻,反水面,Kh-59牛虻（AS-13主销）是苏联的空中发射亚音速防区外打击武器。这款武器发射后先使用惯性制导，按照预先设置的坐标飞行，末段使用电视制导。

wp_as-14a=Kh-29L,,反水面,Kh-29L（AS-14A小锚）是苏联的空中发射超音速空对面导弹，具有重型弹头和激光制导功能。

wp_as-14b=Kh-29T,,反水面,Kh-29T（AS-14B小锚）是苏联的空中发射超音速空对面导弹，具有重型弹头和电视制导功能，射程更远，但夜间性能较低。

wp_ss-n-2=P-15,白蚁,反水面,P-15白蚁（SS-N-2冥河）是苏联的水面发射亚音速防区外反舰武器，中国获得授权生产的版本是著名的海鹰导弹（CSS-C-2蚕）。这款武器也可攻击位于海岸的地面设施。

wp_ss-n-2c=P-15M,白蚁-M,反水面,P-15M白蚁（SS-N-2C冥河）是苏联的水面发射亚音速防区外反舰武器，M型是原版的改进型，具有更远的射程和更好的电子反对抗措施。这款武器也可攻击位于海岸的地面设施。

wp_ss-n-3=P-35,,反水面,P-35（SS-N-3柚子）是苏联的水面发射亚音速防区外反舰武器。这款武器虽然在服役之初威慑力极强，但亚音速、高空飞行的剖面使其极易被面对空导弹拦截。另一个缺点是导弹必须全程与发射平台保持连接，这意味着潜艇在打击过程中必须暴露在水面上，因此极易遭到反击。

wp_ss-n-3b=3M44,进步,反水面,3M44进步（SS-N-3B萼片）是苏联的水面发射亚音速防区外反舰武器。这款武器是原版P-35的改进型，飞行高度更低，对抗干扰和箔条的性能更强。

wp_ss-n-7=P-70,紫水晶,反水面,P-70紫水晶（SS-N-7星光）是苏联的水下发射跨音速防区外反舰武器，也是世界上最早可由水下潜艇发射的导弹系统，其射程相对较短，后续被P-120孔雀石取代。

wp_ss-n-9=P-120,孔雀石,反水面,P-120孔雀石（SS-N-9塞壬）是苏联的水面发射亚音速防区外反舰武器，其速度、射程均优于冥河，且末段可进行规避机动。

wp_ss-n-12=P-500,玄武岩,反水面,P-500玄武岩（SS-N-12沙盒）是苏联的水面发射超音速防区外反舰武器，设计目标为取代P-35。与P-35相比，这款武器速度快得多，并且导弹间可建立数据链，使齐射的导弹大部分在低空隐蔽，同时一枚导弹在高空侦察目标。此外，弹载防御电子对抗措施也可提高对抗防空系统时的生存性。

wp_ss-n-19=P-700,花岗岩,反水面,P-700花岗岩（SS-N-19海难）是苏联的水面发射超音速防区外反舰武器。这款武器采用高-低飞行剖面，具有先进的导弹间数据链，齐射的导弹大部分在低空隐蔽，同时一枚导弹在高空侦察目标。导弹在飞行末段可进行规避机动，还装有电子对抗措施、诱饵、对抗近防系统火力和导弹破片的装甲。无论按何种标准评价，都是威慑力极强的武器。

wp_ss-n-22=P-270,白蛉,反水面,P-270白蛉（SS-N-22日炙）是苏联的水面发射超音速防区外反舰武器。这款武器采用低-低飞行剖面，飞行末段进行超音速掠海攻击，并且进行蛇形机动，提高对抗防空系统时的生存性。

#----------- Land Strike only missiles ---------
wp_as-4b=Kh-22MP,暴风,对地攻击,Kh-22MP暴风是苏联的超音速防区外对地攻击导弹。

fr_as11=AS.11,,对地攻击,SS.11/AS.11是法国研制的指令制导近程反坦克导弹。此型号装有用于攻击小艇的半穿甲弹头，而非用于攻击坦克的聚能装药弹头。

usn_agm-65b=AGM-65B,小牛,对地攻击,AGM-65B是美国的电视制导防区外空对地武器。其使用方式类似于AGM-62，由发射平台的操作员将十字准线对准所需目标进行引导。

usaf_agm-86c=AGM-86C,CALCM,对地攻击,常规空射巡航导弹（CALCM）是美国的防区外空射对地攻击导弹，也是B-52的主要防区外武器。这款武器在发射后使用地形测绘雷达和弹载数字地图进行地形匹配，按预先设定的路线飞向目标，无需发射平台输入信息。

usn_rgm-109c=RGM-109C,战斧,对地攻击,战斧对地攻击导弹（TLAM）是美国的防区外对地攻击导弹。这款武器在发射后使用地形测绘雷达和弹载数字地图进行地形匹配，按预先设定的路线飞向目标，无需发射平台输入信息。

usn_ugm-109c=UGM-109C,战斧,对地攻击,战斧对地攻击导弹（TLAM）是美国的防区外对地攻击导弹。这款武器在发射后使用地形测绘雷达和弹载数字地图进行地形匹配，按预先设定的路线飞向目标，无需发射平台输入信息。\nUGM-109C是只能从鱼雷发射管发射的潜射型，无法满载燃料，因此射程略逊于舰载型。

usa_bgm-71a=BGM-71A,TOW,对地攻击,BGM-71管射光学追踪线控导弹（TOW）是美国的线导反坦克导弹，可由直升机和装甲载具发射。其射程较近，弹头较小，可能需要多次射击才能摧毁一辆坦克，因此对抗现代装甲的能力不强。

usa_bgm-71c=BGM-71C,I-TOW,对地攻击,BGM-71管射光学追踪线控导弹（TOW）是美国的线导反坦克导弹，可由直升机和装甲载具发射。升级后的C型射程有所提升（与BGM-71B相同），还配备了防区外探测器，可有效打击现代坦克，但对抗最新的苏联主战坦克时可能仍然低效。

usa_bgm-71d=BGM-71D,TOW-2,对地攻击,BGM-71管射光学追踪线控导弹（TOW）是美国的线导反坦克导弹，可由直升机和装甲载具发射。作为原版BGM-71的重新设计型，D型配备了更大的弹头和改进型发动机，可轻松击穿最新的装甲目标。

wp_at-6=9M114,茧,对地攻击,9M114风暴是苏联的超音速反坦克导弹，可由部分攻击直升机携带，如卡-29和米-24。它具有射程远、速度快、弹头威力大等显著特点。

wp_at-10=9M117,堡垒,对地攻击,9M117堡垒是苏联T-55M坦克使用的反坦克导弹。

# ---------- Anti-sub  Missilies ----------
ran_ikara=GWS-40,投掷棒,反潜,GWS-40投掷棒是澳大利亚的反潜巡航导弹，采用火箭发动机动力，可部署Mk46或Mk44鱼雷以打击水下目标。其射程虽然可达美国RUR-5反潜火箭的两倍，但速度稍慢，且由于发射方式的限制，无法快速发射多枚。

usn_rur-5=RUR-5,ASROC,反潜,RUR-5反潜火箭（ASROC）是防区外反潜武器，这款武器从发射平台上起飞，完成弹道飞行后投下一枚Mk46反潜鱼雷。

wp_apr-2=APR-2,,反潜,APR-2是苏联的空投反潜主动/被动声学自导鱼雷，导引头搜索范围是0.75海里，使用深度可达600米。

wp_ss-n-14a=URPK-3,暴风雪,反潜,URPK-3暴风雪（SS-N-14石英A）是苏联的防区外反潜武器，其发射方式为小型巡航导弹下方携带鱼雷，类似于澳大利亚的投掷棒反潜导弹。

wp_ss-n-14b=URK-5,喇叭口-B,反潜/反水面,URK-5喇叭口-B（SS-N-14石英B）是苏联的防区外两用（反潜/反水面）武器，其发射方式为小型巡航导弹下方携带鱼雷，类似于澳大利亚的投掷棒反潜导弹。

wp_ss-n-16=RPK-6M,瀑布,反潜,RPK-6M瀑布（SS-N-16种马）是苏联的水下发射防区外反潜武器。这款武器从发射平台上起飞，完成弹道飞行后在目标附近投下一枚鱼雷。


# ------------------ RBU ------------------
knm_terne_shell=燕鸥III,,深水炸弹,燕鸥是挪威的火箭推进反潜武器系统，研制于1960年代。

plan_type62dc=FQF-1200,,深水炸弹,FQF-1200是中国的五管反潜深水炸弹发射器。

plan_type75dc=FQF-2500,,深水炸弹,FQF-2500是中国的十二管反潜深水炸弹发射器。

rn_limbo_shell=地狱边境,,深水炸弹,地狱边境（Mk10反潜迫击炮）是英国研制于1950年代的反潜迫击炮。这款武器使用舰载声呐瞄准，发射时以三角布局在目标周围投放三枚深水炸弹。

rn_squid_shell=鱿鱼,,深水炸弹,鱿鱼是英国研制于二战时期的反潜迫击炮。这款武器使用舰载声呐瞄准，发射时以三角布局在目标周围投放三枚深水炸弹。

swe_375mm_rocket=博福斯M/50,,深水炸弹,博福斯M/50是瑞典的375毫米反潜火箭发射器。

wp_rgb-10=RBU-1000,龙卷风-3,深水炸弹,RBU-1000龙卷风-3是苏联的300毫米反潜火箭发射器，射程约为1000码。

wp_rgb-12=RBU-1200,飓风,深水炸弹,RBU-1200（飓风） 是苏联的213毫米反潜火箭发射器，射程约为1200码。

wp_rgb-25=RBU-2500,龙卷风-1,深水炸弹,RBU-2500龙卷风-1是苏联的213毫米反潜火箭发射器，射程约为2500码。

wp_rgb-60=RBU-6000,龙卷风-2,深水炸弹,RBU-6000龙卷风-2是苏联的213毫米反潜火箭发射器，射程约为6000码。

# --------------- Torpedoes ---------------
fr_e15=E15,,反水面鱼雷,E15是法国的550毫米重型反水面鱼雷，具有被动声呐自导能力。

fr_l3=L3,,反潜鱼雷,L3是法国的550毫米中型反潜鱼雷。

fr_l5_mod3=L5 Mod3,,反潜鱼雷,L5是法国的550毫米中型反潜鱼雷。作为L3反潜鱼雷的改进型，其射程更远，速度更快，可应对声呐探测范围更大、速度更快的敌方潜艇。

fr_f17_mod1=F17 Mod1,,反水面鱼雷,F17 Mod1是法国的530毫米重型线导反舰鱼雷。作为E15反舰鱼雷的改进型，其速度更快，射程更远，还具备两种速度模式和线导功能，可进行机动或在温跃层下方航行。

fr_f17_mod2=F17 Mod2,,鱼雷,F17 Mod2是法国的530毫米重型线导两用鱼雷。作为原版F17鱼雷的升级版，Mod2型具备主动/被动导引头，可执行反潜任务，其速度更快，潜深更大，射程更远。

fr_f17p=F17P,,鱼雷,F17P是法国的530毫米重型线导两用鱼雷。作为原版F17鱼雷的升级版，P型专为出口而生，具备主动/被动导引头，可执行反潜任务，潜艇和水面舰艇皆可使用。

ger_dm1=DM1,,反潜鱼雷,DM1是德国最早的专业反潜线导鱼雷。

ger_dm2=DM2,,反水面鱼雷,DM2是德国的专业反水面线导鱼雷。

ger_sst4=SST4,,反水面鱼雷,SST4是德国制造的反水面重型线导鱼雷，被出口给其他海军使用。

it_a-244s_air=A-244,,反潜鱼雷,A-244是意大利的轻型空投反潜鱼雷，装有主动和被动声呐导引头。

jmsdf_type80=80式,,鱼雷,这款反潜/反水面线导鱼雷是1970年代起GRX-1和GRX-2研究项目的成果，并且受到了美国海军Mk37设计方案的影响，但在推进力、性能和射程方面都优于Mk37。

jmsdf_type54=54式,,鱼雷,54式鱼雷是日本在二战后设计的第一款鱼雷，其最初型号相当不成功，并且容易在发射后出现故障，在经历了多次重新设计后，最终衍生为大规模生产的54式3型改1鱼雷。

knm_tp612=TP612,,反水面鱼雷,TP612是瑞典的重型线导鱼雷，没有导引头，由TP611发展而来，但噪声更小且具有游出发射能力。

knm_tp613=TP613,,反水面鱼雷,TP613是瑞典的重型线导鱼雷，装有被动声呐导引头，由TP612发展而来。

plan_yu-1=鱼-1,,反水面鱼雷,鱼-1是中国自产的第一款重型鱼雷，这种直航鱼雷结构相对简单，因此可靠有效。

plan_yu-1g=鱼-1A,,反水面鱼雷,鱼-1是中国自产的第一款重型鱼雷，A型是增加了被动自导能力的升级版，可更有效地攻击机动性强的船只。

plan_yu-3=鱼-3,,反潜鱼雷,鱼-3是中国的被动重型反潜鱼雷。它速度慢，最适合攻击柴电潜艇，因为更快的目标可能会甩开鱼雷。其导引头最大搜索距离为1600码。

plan_yu-4=鱼-4A,,反水面鱼雷,鱼-4A是中国的被动重型反水面鱼雷。它速度慢，可能仅在极近距离有效。

rn_mark9_mod2=Mk.IX,,反水面鱼雷,Mk.IX**是英国在二战期间使用的直航反水面鱼雷，也是1930年代Mk.IX的最终升级型号，航行时间更长，弹头威力更大。

rn_mark8_mod4=Mk.VIII,,反水面鱼雷,Mk.VIII Mod4是是英国在二战期间使用的直航反水面鱼雷，也是1920年代潜射Mk.VII系列的最终版本。英国皇家海军一直使用这款武器至1980年代，直到冷战结束后才获得堪用的反舰鱼雷替代品。

rn_mark20s=Mk20S,投标人,反潜鱼雷,Mk20投标人是英国于1950年代研制的一种中型反潜鱼雷，但还未服役就被认为过时。S型是潜射版，作为英国皇家海军首款此类自导鱼雷，其可靠性极差、射程不足、速度缓慢、导引头性能不佳，难以对抗现代目标。由于可以从奥伯龙级和鼠海豚级的尾部发射管发射，这款武器持续服役至1970年代。

#rn_mark20c

rn_mark23=Mk23,格罗格酒,鱼雷,Mk23格罗格酒是英国于1950年代研制的一种中型反潜鱼雷，也具备反舰能力，但还未服役就被认为过时。Mk23是原版Mk20的重大升级型，增强了电池组并增加了线导能力，但仍保留了Mk20极差的导引头和缓慢的速度。由于可靠性和性能低下，这款武器在对抗现代潜艇和水面舰艇时都难堪一用。

usn_mk16=Mk16,,反水面鱼雷,Mk16是研制于二战时期的直航反舰鱼雷，它速度快、威力大，在1950和1960年代被美国攻击型潜艇广泛采用。虽然无法制导，但它几乎可以靠近距离射击击沉任何大小的目标。Mod8型结合了Mod0型的大威力弹头和Mod1型的远射程。

usn_mk37=Mk37 Mod0,,鱼雷,Mk37是美国海军的标准轻型反潜鱼雷，装备了多个国家。这款武器服役于1959年，速度过慢，性能不佳，无法对抗现代化的苏联高性能潜艇。

usn_mk37_mod1=Mk37 Mod1,,鱼雷,Mk37是美国海军的标准轻型反潜鱼雷，装备了多个国家。这款武器服役于1959年，速度过慢，性能不佳，无法对抗现代化的苏联高性能潜艇。Mod1型以速度为代价增加了线导能力。

usn_mk37_mod3=Mk37 Mod3,,鱼雷,Mk37是美国海军的标准轻型反潜鱼雷，装备了多个国家。这款武器服役于1959年，速度过慢，性能不佳，无法对抗现代化的苏联高性能潜艇。Mod3型具有新的导引头，提高了可靠性和捕获范围，其余部分与Mod0型相同。

usn_mk37_mod2=Mk37 Mod2,,鱼雷,Mk37是美国海军的标准轻型反潜鱼雷，装备了多个国家。这款武器服役于1959年，速度过慢，性能不佳，无法对抗现代化的苏联高性能潜艇。Mod2型具有新的导引头，提高了可靠性和捕获范围，其余部分与线导的Mod1型相同。

usn_mk37c=Mk37C,,鱼雷,Mk37C是Mk37鱼雷的升级版，采用奥托燃料和线导，与原版相比进步巨大。自1970年代中期开始，Mk37C（NT37C）专供出口伙伴使用，改进的推进系统使其速度提高了50%，射程几乎翻倍，但代价是噪声略大。

usn_mk37e=Mk37E,,鱼雷,Mk37E是Mk37鱼雷的升级版，具有尾流自导能力和重新设计的导引头。Mk37E（NT37E）专供出口伙伴使用，其反舰能力得到了提升，推进系统也有所进步，是1980年代中期性能优异的反潜和反舰鱼雷。

usn_mk44_air=Mk44,,反潜鱼雷,Mk44鱼雷是北约传统的反潜鱼雷，常见于整个冷战时期。虽然可靠性良好，但它射程近、速度慢，难以对抗高速深潜潜艇。\n这款鱼雷是空中发射型。

usn_mk44_ship=Mk44,,反潜鱼雷,Mk44鱼雷是北约传统的反潜鱼雷，常见于整个冷战时期。虽然可靠性良好，但它射程近、速度慢，难以对抗高速深潜潜艇。\n这款鱼雷是水面发射型。

usn_mk46_air=Mk46 Mod2,,反潜鱼雷,Mk46 Mod2是北约的标准轻型鱼雷，装备了多个国家，其设计目标为攻击苏联的现代化高性能潜艇。这款鱼雷是空中发射型。

usn_mk46_ship=Mk46 Mod2,,反潜鱼雷,Mk46 Mod2是北约的标准轻型鱼雷，装备了多个国家，其设计目标为攻击苏联的现代化高性能潜艇。这款鱼雷是水面发射型。

usn_mk46_mod5_air=Mk46 Mod5,近期改进计划,反潜鱼雷,Mk46 Mod5近期改进计划（NEARTIP）鱼雷是北约的标准轻型鱼雷，装备了多个国家，其设计目标为攻击苏联的现代化高性能潜艇。这款鱼雷是空中发射型。\n\n近期改进计划是对Mk46鱼雷的全面改造，通过更慢、更安静的搜索阶段航行实现了更远的射程，反对抗措施得到了改进，追踪浅水和浮航潜艇的能力也有所提升（尽管效果有限）。

usn_mk46_mod5_ship=Mk46 Mod5,近期改进计划,反潜鱼雷,Mk46 Mod5近期改进计划（NEARTIP）鱼雷是北约的标准轻型鱼雷，装备了多个国家，其设计目标为攻击苏联的现代化高性能潜艇。这款鱼雷是水面发射型。\n\n近期改进计划是对Mk46鱼雷的全面改造，通过更慢、更安静的搜索阶段航行实现了更远的射程，反对抗措施得到了改进，追踪浅水和浮航潜艇的能力也有所提升（尽管效果有限）。

usn_mk48=Mk48 Mod1,,鱼雷,Mk48是美国的重型两用鱼雷，其速度极快，射程远，具备线导能力和相当先进的导引头。高性能的Mod1型服役于1972年，以一己之力取代了老旧的Mk37和Mk14/16等多款鱼雷，但仅支持单向线导。

usn_mk48_mod4=Mk48 Mod4,,鱼雷,Mk48是美国的重型两用鱼雷，其速度极快，射程远，具备线导能力和相当先进的导引头。Mod4型是1980年代的升级版，改进了导引头，可追踪705型核潜艇等最新目标，还支持双向线导，反对抗措施性能更强。

usn_mk48_mod4_adcap=Mk48 先进能力,,鱼雷,Mk48是美国的重型两用鱼雷，其速度极快，射程远，具备线导能力和相当先进的导引头。Mod4先进能力型（有别于Mk48 Mod5先进能力新造计划）是1985年对已有Mod4型鱼雷的升级，采用了新的斜盘和燃料泵，进一步提高了已有鱼雷的性能极限，使其末段攻击速度达到65节，还改进了导引头，提升了反对抗措施性能。

wp_45-36nu=45-36NU,,反水面鱼雷,45-36NU是设计于二战前的450毫米直航鱼雷，深受1930年代初意大利45-F和53-F的影响，技术落后。与530毫米鱼雷相比，其重量轻，威力小，在1950年代已不堪使用，但有时你只能使用手头的武器。

wp_53-38=53-38,,反水面鱼雷,53-38是苏联研制于二战时期的重型直航鱼雷，其结构相对简单，因此可靠有效。史上死亡人数最多的两起沉船事件（德国的威廉·古斯特洛夫号邮轮和戈雅号运兵船）都是苏联潜艇使用53-38鱼雷造成的。

wp_53-39=53-39,,反水面鱼雷,53-39是苏联研制于二战时期的重型直航鱼雷，其结构相对简单，因此可靠有效。

wp_53-56v=53-56,,反水面鱼雷,53-56V是苏联的重型直航鱼雷，也是53-38的升级型号。

wp_53-65K=53-65K,,尾流自导鱼雷,53-65是苏联的重型尾流自导鱼雷，设计目标为攻击水面舰艇。

wp_65-76=65-76,,尾流自导鱼雷,65-76是苏联的尾流自导鱼雷，被称为航母杀手。这款武器是专为攻击超级航母等超大型目标而研制的，650毫米的口径意味着只有部分潜艇可使用此鱼雷。

wp_at-1=AT-1,,反潜鱼雷,AT-1是苏联的空投电动反潜鱼雷，具有主动/被动声学自导能力，仅装备直升机。

wp_at-2=AT-2,,反潜鱼雷,AT-2是苏联的空投重型电动反潜鱼雷，具有主动/被动声学自导能力。作为为数不多的空投重型鱼雷之一，其体型巨大，大多数空投鱼雷大小仅有AT-2的四分之一。

wp_set-40=SET-40,,反潜鱼雷,SET-40是苏联的轻型电动反潜鱼雷，具有主动/被动声学自导能力。

wp_set-65=SET-65,,反潜鱼雷,SET-65是苏联的重型电动反潜鱼雷，具有主动/被动声学自导能力。

wp_test-71=TEST-71,,反潜鱼雷,TEST-71是苏联的重型线导反潜鱼雷，由SET-65改进而来，具有更强的主动/被动声学自导能力。\n由于导线和数据的限制，TEST-71只能通过导线进行水平引导，发射后无法调节深度。

wp_test-71m=TEST-71M,,反潜鱼雷,TEST-71M是苏联的重型线导反潜鱼雷，具备改进的数字制导组件，还升级了线导装置，从而从而克服了旧型号的线导限制，发射时更灵活。

wp_umgt-1=UMGT-1,,反潜鱼雷,UMGT-1是苏联的空投反潜鱼雷，也是苏联反潜结合体导弹挂载的武器，其威力不如苏联的重型鱼雷，但也非常危险。

wp_uset-80=USET-80,,鱼雷,USET-80是苏联的现代化两用鱼雷，具有主动/被动声学自导能力，对于潜艇和水面舰艇都极度危险。

# ------------------ Bombs -----------------
fr_samp_t25=SAMP-25,,炸弹,25型SAMP是法国的230千克（500磅）无制导炸弹，类似于美国的Mk82。

fr_samp_t21=SAMP-21,,炸弹,21型SAMP是法国的400千克（880磅）无制导炸弹，类似于美国的Mk83。

pla_type-2=100-2型,,炸弹,100-2型是中国的100千克通用航空炸弹，类似于苏联的FAB-100。

pla_type-3-250=250-3型,,炸弹,250-3型是中国的250千克通用航空炸弹，类似于苏联的FAB-250。

pla_type-3-500=500-3型,,炸弹,500-3型是中国的500千克通用航空炸弹，类似于苏联的FAB-500。

raf_bl755=BL755,,集束炸弹,BL755携带147枚高爆反坦克子炸弹，可投放至大面积区域内，两伊战争中的伊朗伊斯兰共和国空军和福克兰群岛战争中的英国皇家空军都广泛使用了这款武器。

usaf_gbu-2=GBU-2,铺路I,制导炸弹,GBU-2铺路I是美国的2000磅（907千克）激光制导炸弹，其基础为Mk84，但加装了用于制导的激光导引头和弹翼。

usaf_gbu-15=GBU-15,,制导炸弹,GBU-15（V）2是美国空军某些超音速战术飞机（如F-111和F-4E）使用的红外制导滑翔炸弹，也出口至多个国家。这款武器配备了红外成像导引头，可靠性高，可在各种天气条件下使用，还具有数据链功能，可改变瞄准目标并将导引头数据传输至发射平台。

usaf_bolt-117=BOLT-117,,制导炸弹,BOLT-117是美国的750磅（340千克）激光制导炸弹，其基础为M117铁炸弹，但加装了用于制导的激光导引头和弹翼。

usaf_gbu-11=GBU-11,铺路I,制导炸弹,GBU-11是美国的3000磅（1400千克）激光制导炸弹，作为一款超重型大当量制导炸弹，其打击目标为桥梁、堡垒等坚固设施。

usaf_m117=M117,,炸弹,M117是研制于朝鲜战争时期的750磅（340千克）炸弹，美国空军在越南战争中也广泛使用了这款武器，后续的Mk80系列炸弹取代了M117。

usaf_m118=M118,,爆破炸弹,M118是美国的3000磅（1400千克）超重型爆破炸弹，其打击目标为桥梁、堡垒等坚固设施。

usaf_cbu-24=CBU-24,,集束炸弹,CBU-24携带665枚破片子炸弹，可投放至大面积区域内，攻击面对空导弹阵地的野鼬单位将其广泛用作反人员武器。

usn_gbu-10=GBU-10,铺路II,制导炸弹,GBU-10铺路II是美国的2000磅（907千克）激光制导炸弹，其基础为Mk84，但加装了用于制导的激光导引头和弹翼，制导套件是早期的铺路I型升级版。

usn_gbu-12=GBU-12,铺路II,制导炸弹,GBU-12铺路II是美国的500磅（227千克）激光制导炸弹，其基础为Mk82，但加装了用于制导的激光导引头和弹翼。

usn_gbu-16=GBU-16,铺路II,制导炸弹,GBU-16铺路II是美国的1000磅（460千克）激光制导炸弹，其基础为Mk83，但加装了用于制导的激光导引头和弹翼。

usn_gbu-24=GBU-24,铺路III,制导炸弹,GBU-24铺路III是美国的2000磅（907千克）激光制导炸弹。作为铺路II的升级版，其制导性能更优，滑翔距离更远，可靠性更高，低空飞行性能也更出色。

usn_mk-82=Mk82,,炸弹,Mk82是500磅（227千克）低阻力通用无制导炸弹。

usn_mk-82_snakeye=Mk82,蛇眼,炸弹,Mk82蛇眼是500磅（227千克）高通用无制导炸弹，具有可展开弹翼。它适合平抛投掷，即飞机以高速低空投放炸弹，无需拉高并俯冲，但代价是炸弹飞行时间延长。

usn_mk-83=Mk83,,炸弹,Mk83是1000磅（454千克）低阻力通用无制导炸弹。

usn_mk-84=Mk84,,炸弹,Mk84是2000磅（900千克）低阻力通用无制导炸弹。

usn_rockeye=CBU-100,石眼,集束炸弹,CBU-100石眼II是美国的500磅（227千克）集束炸弹，可投放247枚子炸弹。

usn_walleye2=AGM-62,鼓眼鱼II,制导炸弹,AGM-62鼓眼鱼是美国武装部队于1960年代至1990年代使用的电视制导滑翔炸弹，大多数装有250磅（113千克）高爆弹头，部分装有W72核弹头。

usn_mk54_dc=Mk54,,深水炸弹,Mk54是美国于二战期间设计的航空深水炸弹，冷战时期它仍在服役。

wp_fab-100=OFAB-100,,炸弹,OFAB-100-120是苏联设计的100千克（220磅）通用航空炸弹，携带高爆弹头，主要用户为苏联及其盟友。

wp_fab-250=FAB-250,,炸弹,FAB-250是苏联设计的250千克（550 磅）通用航空炸弹，携带高爆弹头，主要用户为苏联及其盟友。

wp_fab-500=FAB-500M-62,,炸弹,FAB-500M-62是苏联设计的500千克（1100 磅）通用航空炸弹，携带高爆弹头，主要用户为苏联及其盟友。

wp_fab-500_m54=FAB-500M-54,,炸弹,FAB-500M-54是苏联设计的500千克（1100 磅）通用航空炸弹，携带高爆弹头，主要用户为苏联及其盟友。此型号体型较短，阻力适中，便于飞机大量携带（一般内置），但精度不如低阻力型号。

wp_fab-1500_m54=FAB-1500M-54,,炸弹,FAB-1500M-54是苏联设计的1500千克（3300 磅）通用航空炸弹，携带高爆弹头，主要用户为苏联及其盟友。这款炸弹是大型高爆炸弹家族中的1500千克型号，主要用于攻击大型军舰、碉堡或航空基地等坚固目标。

wp_fab-3000_m54=FAB-3000M-54,,炸弹,FAB-3000M-54是苏联设计的3000千克（6600 磅）通用航空炸弹，携带高爆弹头，主要用户为苏联及其盟友。这款炸弹是大型高爆炸弹家族中的3000千克型号，主要用于攻击大型军舰、碉堡或航空基地等坚固目标。

wp_fab-9000_m54=FAB-9000M-54,,炸弹,FAB-9000M-54是苏联设计的9000千克（20000 磅）通用航空炸弹，携带高爆弹头，主要用户为苏联及其盟友。这款炸弹是大型高爆炸弹家族中的9000千克型号，也是实战中使用过的最大常规炸弹之一，主要用于摧毁加固目标。

wp_kab-500l=KAB-500L,,制导炸弹,KAB-500L是苏联设计的500千克（1100 磅）激光制导航空炸弹，携带高爆弹头，主要用户为苏联及其盟友。其基础为FAB-500，但加装了用于制导的激光导引头和弹翼。

wp_rbk-250=RBK-250,,集束炸弹,RBK-250是苏联的250千克（550磅）集束炸弹。

wp_rbk-500=RBK-500,,集束炸弹,RBK-500是苏联的500千克（1100磅）集束炸弹。

wp_plab-100=PLAB-100,,深水炸弹,PLAB-100是苏联设计的100千克（220磅）反潜航空炸弹，主要用户为苏联及其盟友。 

# ---------------- Sonobuoys ---------------
plan_skf-1=SKF-1,,被动声呐浮标,SKF-1是中国海军从1960年代开始使用的全向声呐浮标，仅有被动模式。

plan_skf-2=SKF-2,,被动声呐浮标,SKF-2是中国海军从1970年代中期开始使用的被动定向声呐浮标。

usn_ssq-41=AN/SSQ-41,LOFAR,声呐浮标,SSQ-41A耶洗别是低频分析与记录（LOFAR）型声呐浮标。它是最常见的北约被动声呐浮标，虽然不像后续的定向频率分析和记录型声呐浮标那样可以确定方位，但仍然具有不错的灵敏度，所有西方国家的海军都大量使用这款声呐浮标。

usn_ssq-47=AN/SSQ-47,朱丽,主动声呐浮标,SSQ-47A朱丽是持续主动测距声呐浮标。它是最常见的北约主动声呐浮标，虽然不像后续的定向指令主动声呐浮标系统那样可以确定方位，但仍然可以靠多个浮标来固定之前探测到的目标。由于需要持续主动发射声呐信号，其寿命只有30分钟。

usn_ssq-53=AN/SSQ-53,DIFAR,被动声呐浮标,AN/SSQ-53是定向频率分析和记录（DIFAR）型声呐浮标，可为操作员提供磁航向信息，与早期的全向CRT-1相比进步巨大。

usn_ssq-77=AN/SSQ-77,VLAD,声呐浮标,SSQ-77A是垂直线形阵列定向频率分析和记录型声呐浮标（VLAD），设计定位是对原有同类产品的升级改进。此浮标结构与定向频率分析和记录型声呐浮标类似，但集成了极为灵敏的声呐阵列，因此被动探测距离远超同类产品，对抗安静深潜目标的能力强，并且在嘈杂水域中也能保持良好的性能。\n\n性能的提升也导致了重量和成本的增加，这意味着此浮标的推广程度较低，且其远距离精度较差，因此主要用于水下目标的定位。

usn_ssq-62=AN/SSQ-62,DICASS,主动声呐浮标,AN/SSQ-62定向指令主动声呐浮标系统（DICASS）是主动声呐浮标，可进一步定位之前被SSQ-53被动声呐浮标发现的水下潜艇。

usn_ssq-101=AN/SSQ-101,ADAR,主动声呐浮标,AN/SSQ-101空中部署主动接收器（ADAR）是浅水多基阵系统声呐浮标，部署时可使用大量水听器确定精确方位。

wp_rgb-1=RGB-1,,被动声呐浮标,RGB-1是苏联使用的全向声呐浮标，仅有被动模式。

wp_rgb-nm1=RGB-NM-1,,被动声呐浮标,RGB-NM-1是苏联使用的全向声呐浮标，仅有被动模式。

wp_rgb-3=RGB-3,,主动声呐浮标,RGB-3是苏联使用的声呐浮标，仅有主动模式。

# ------------------ FFAR -----------------
usn_zuni=祖尼人,,折叠翼航空火箭,祖尼人是5.0英寸折叠翼航空火箭，主要装备对地攻击机和攻击直升机。和其他折叠翼航空火箭类似，祖尼人可携带多种弹头，通常使用LAU-10火箭吊舱以四联装形式搭载。

usn_hydra=九头蛇70,,折叠翼航空火箭,九头蛇70是2.75英寸折叠翼航空火箭，可装备战斗机和直升机。九头蛇可携带多种弹头，通常使用最多容纳19枚的吊舱搭载。

wp_s-5=S-5,,折叠翼航空火箭,S-5是苏联的55毫米折叠翼航空火箭，可装备战斗轰炸机和直升机，通常使用最多容纳32枚的吊舱搭载，其来源可追溯至二战末期的德国R4M。

wp_s-8=S-8,,折叠翼航空火箭,S-8是苏联的80毫米折叠翼航空火箭，可装备战斗轰炸机和直升机，通常使用最多容纳20枚的吊舱搭载，各子型号弹头多样，包括特殊的反跑道型号。

wp_s-24=S-24,,折叠翼航空火箭,S-24是苏联的240毫米折叠翼航空火箭，可装备战斗轰炸机和直升机，每个挂点只能携带一枚.

wp_s-25=S-25,,折叠翼航空火箭,S-25是苏联的266毫米折叠翼航空火箭，可装备战斗轰炸机和直升机，每个挂点只能携带一枚，是苏联最大的无制导火箭，弹头装药约60千克。

# ------------------ MLRS -----------------
ir_107mm_rocket=清算者-1,,多管火箭,清算者-1是中国63式多管火箭发射器所用107毫米火箭的伊朗版本，伊朗使用的发射器和火箭都被称为清算者。

usa_m26=M26,,多管火箭,M26是美国陆军M270多管火箭系统使用的227毫米无制导火箭，其弹头包含多达800枚子弹药，杀伤面积可达2000平方米。

wp_grad=冰雹,,多管火箭,M-21OF火箭是苏联BM-21发射车使用的武器，其完整系统（M-21）通常被称为冰雹多管火箭发射系统。


