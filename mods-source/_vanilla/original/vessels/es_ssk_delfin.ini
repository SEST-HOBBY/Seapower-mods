EngineAudioClip=audio/submarine/Diesel_Sub_v1
EngineAudioPosition=0,0,0
EngineAudioRollOff=Logarithmic
EngineAudioDistance=1.0,20
EngineAudioPitchRange=1.0,1.8
EngineAudioVolume=1.0
EngineAudioAudibility=AboveAndBelow  // layer of sound audibility: Above, Below, AboveAndBelow
AuxEngineAudioClip=audio/submarine/Electric_Sub_v1
AuxEngineAudioPosition=0,0,0
AuxEngineAudioRollOff=Logarithmic
AuxEngineAudioDistance=1.0,20
AuxEngineAudioPitchRange=1.0,1.8
AuxEngineAudioVolume=0.5
AuxEngineAudioAudibility=AboveAndBelow  // layer of sound audibility: Above, Below, AboveAndBelow
