[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.12

Length=115.4                   // in meters
Beam=9.3                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

MaxGuidanceWires=2

[OpticalView]
Views=standard_periscope_soviet
DefaultView=standard_periscope_soviet

[---------- Physics and Control ----------]
[Physics]
############################################################
# Physics definition
############################################################
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=5760              // in tons

MaxForwardVelocity=22.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=14.0
MaxBackwardVelocity=5.0        // sets the max backward velocity
MaxBackwardVelocitySurfaced=3.0
TelegraphVelocities=-5,0,5,10,15,18,22

BowUnderWater=17.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=28.0            // depth in feet, from where the sail is under water
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.73
MinAccelerationFactor=0.1

#Cavitation table
#T:Telegraph V: Speed at that telegraph D: Minimum depth to not cavitate at tat speed

#T:0 V:0kn D:-100ft
#T:1 V:4kn D:-12ft
#T:2 V:9kn D:76ft
#T:3 V:13kn D:164ft
#T:4 V:18kn D:252ft
#T:5 V:22kn D:340ft

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.5                // multiplicator defining how agile the ship can turn

TiltFactor=0.8                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=20.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=-2.7                   // default trim depth in meter
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=35.0            // in feet
CrushDepth=1230                // in feet
CavitationParameters=14		   // defines the speed in knots at 100m depth that the submarine will cavitate at

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=7.5  // Biggest range in nm at which this unit can be visually identified
IRSignature=Meager
# Radar related (RCS => radar cross section)
RCS=Meager
# Sonar related
BaseNoise=142                  // base sound level in db at 1m distance
FlowNoise=1.6                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10             // additional noise for cavitation in db
TargetReflectionStrength=18    // in dB for broad side
BladesCount=6                  //number of blades on vessel's propulsion systems
ElectricFrequency=50           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

MachineryRaftingGeneration=1
PropellerType=Conventional
[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_wp_ssgn_echo2

[---------- AI related ----------]
[AI]
UnitCostValue=10000           // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=5
ASW_Capability=1

#Defence
#Special
Role=SSGN,ASuW_VLR

