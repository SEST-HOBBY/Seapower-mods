[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=0.9
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.12

Length=81.4                    // in meters
Beam=10                        // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

MaxGuidanceWires=2

[OpticalView]
Views=standard_periscope_soviet
DefaultView=standard_periscope_soviet

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=3180              // in tons

MaxForwardVelocity=41.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=14.0
MaxBackwardVelocity=7.0        // sets the max backward velocity
MaxBackwardVelocitySurfaced=3.0
TelegraphVelocities=-7,0,5,10,15,20,41

BowUnderWater=19.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=30.0            // depth in feet, from where the sail is under water
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=1.88
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=1.2                // multiplicator defining how agile the ship can turn

MaxPitchAngle=30.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=1.8                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=36.0            // in feet
CrushDepth=1640                // in feet
CavitationParameters=18		   // defines the speed in knots at 100m depth that the submarine will cavitate at

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
LowMagneticHull=True
# Sonar related
BaseNoise=135                  // base sound level in db at 1m distance
FlowNoise=1.3                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10             // additional noise for cavitation in db
TargetReflectionStrength=16    // in dB for broad side
BladesCount=5                  //number of blades on vessel's propulsion systems
ElectricFrequency=400          //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
DistinctiveNoise=False         //If True, this vessel can be identified easier than usually by passive sonars

MachineryRaftingGeneration=2
PropellerType=Conventional
[Animations]
