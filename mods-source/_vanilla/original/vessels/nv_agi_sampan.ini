[General]
UnitType=Vessel
DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.03

Length=9                    // in meters
Beam=3                       // in meters

CompartmentsHeight=0.03       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[Physics]
#all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=140              // in tons
IntegrityOverride=1

MaxForwardVelocity=11        // sets the max forward velocity
MaxBackwardVelocity=3        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.24
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
RudderForce=0.59                // multiplicator defining how agile the ship can turn

TiltFactor=0.25                 // defines how strong the tilting will be
PitchFactor=0.3                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-0.25                  // default trim depth in
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=4		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=75                    // base sound level in db at 1m distance
FlowNoise=1                      // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=2                // additional noise for cavitation in db
BladesCount=3					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=3 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

############################################################
# Rudder Systems
############################################################


[---------- AI related ----------]
[AI]
UnitCostValue=10            // value for the unit cost for least valuable target checks
UnitScoreValue=1              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
#Offence
#Defence
MissilesToSaturate=1      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

#Special
Role=Spy
DisguisedAs=civ_fv_sampan

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_bridge

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=100
Collider=coll_engineroom

[PropulsionSystems]
NumberOfPropulsionSystems=1

[PropulsionSystem1]
Mount=Propeller
RotationDirection=Right
Collider=coll_steering

[RudderSystems]
NumberOfRudderSystems=1

[RudderSystem1]
Mount=Rudder

############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1

[SensorSystem1] #Bridge
# Bridge
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.027,-0.07

