[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[---------- FlightDeck Definitions ----------]
[AirGroup]
usn_sh-2f=Default,2

[FlightDeck]
AircraftCapacity=2
AircraftSupported=Helicopters
UnsupportedAircraft=usn_ch-46,usaf_hh-3,usn_qh-50c,usn_qh-50d

# ------------ Taxi ------------
NumberOfElevators=1
NumberOfLaunchPoints=1
NumberOfRecoveryPoints=1
NumberOfTaxiPaths=2

# ------------ Preparation/Launch ------------
LaunchDelay=5
GroundCrewCount=1
DeckParkSlots=2

# ------------ Landing ------------
HoldWaypoints=0,300,0.8|0.8,300,0|0,300,-0.8|-0.8,300,0
HoldStackSeparation=200 //In feet
HoldSpeed=200           //In knots. Landing is permitted once speed was lower than this

# ---------- Flight Deck Ammunition ----------
FlightDeck_AmmoCapacity=2500/2500             // Ammo points. Can be numerical value or "Unlimited"

FlightDeck_NumberOfAccountableAmmunitionCategories=1
FlightDeck_AccountableAmmunitionCategory_1=AirTorpedo,24/24

# ------------ System ------------
Collider=coll_flightdeck,coll_hangar

[Elevator1]
AssociatedLaunchPoints=1

HangarOpenAnimation=HangarOpenAnim
HangarCloseAnimation=HangarCloseAnim

SpawnPosition=-0.0311,0.145,-0.2891
RidePosition=-0.0311,0.145,-0.2891

CloseDoorsAfterTaxi=True
RequiresFreeLaunchpoint=True

[LaunchPoint1]
AllowedType=Helicopter
Position=0.0,0.145,-0.6314

[RecoveryPoint1]
AllowedType=Helicopter
AssociatedElevators=1
Position=0.0,0.145,-0.6314
Rotation=0                       // in degrees
CircuitWaypoints=0,100,-0.4

[TaxiPath1]
From=Elevator1
To=LaunchPoint1
IsBackwards=True

[TaxiPath2]
From=RecoveryPoint1
To=Elevator1

[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
// all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=9600              // in tons

MaxForwardVelocity=32.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.97
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
RudderForce=0.5                // multiplicator defining how agile the ship can turn

TiltFactor=2.4               // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=3.0                  // default trim depth in feets
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=5		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=13.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Large
# Radar related (RCS => radar cross section)
RCS=Large
# Sonar related
BaseNoise=145                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=5                   //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
Prairie=True					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset
MachineryRaftingGeneration=2
PropellerType=Skewback

