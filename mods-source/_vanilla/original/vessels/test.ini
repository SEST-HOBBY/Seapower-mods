[General]
UnitType=Vessel
DisplayClassName=Fishing_boat
ClassType=SternTrawler
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=0.2
MinCameraDistanceBroadside=0.2
CameraPivotHeight=0
FireCheckProbabilitiesTime=30 // every x seconds new dice rolls for the probabilities below are done, 0 means off
FireSuppressionProbability=20  // in percent, every x seconds
FireProgressionProbability=30  // in percent to any neighbor compartment, every x seconds

SinkCheckProbabilitiesTime=20 // every x seconds new dice rolls for the probabilities below are done, 0 means off
BulkheadBreakProbability=40   // when compartment is flooded severe: in percent, every x seconds
NumberOfSevereFloodedCompartmentsToSink=1
SinkProbability=60            // when x compartments are flooded severe: in percent, every x seconds

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

############################################################
# Physics definition
############################################################

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[Physics]
// all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=200              // in tons

MaxForwardVelocity=11        // sets the max forward velocity
MaxBackwardVelocity=3        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
RudderForce=0.5                // multiplicator defining how agile the ship can turn

TiltFactor=0.8                 // defines how strong the tilting will be
PitchFactor=0.3                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-100.0                  // default trim depth in meter
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usaf_f-15c

