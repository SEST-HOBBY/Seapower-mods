[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=1.25
MinCameraDistanceForeAft=0.45
MinCameraDistanceBroadside=0.45
CameraPivotHeight=0.05

Length=38.6                    // in meters
Beam=7.6                       // in meters

CompartmentsHeight=0.04        //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_8x50,binocular_12x50,bridge_binocular_20x120_stab_soviet
DefaultView=binocular_8x50

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=209               // in tons

MaxForwardVelocity=38.5        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=1.63
MinAccelerationFactor=0.1

RudderTurnRate=10.0            // turn rate of the rudder in degrees per second
RudderForce=0.9                // multiplicator defining how agile the ship can turn

#TiltFactor=-2.0                // defines how strong the tilting will be, negative means it turns into the direction of turning
TiltFactor=-0.8
PitchFactor=-4.0                // defines how strong the pitch will be based on speed and acceleration
LiftFactor=0.15
LiftVelocityInKnots=10,20

MaxSeaStateForPitchAndLift=4

TrimDepth=0.7                  // default trim depth in feet
TrimAngle=0                    // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,-0.01,0         // center of mass for physics
CavitationSpeed=4		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=7.5  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Meager
# Sonar related
BaseNoise=145                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (
CavitationNoise=10               // additional noise for cavitation in db
BladesCount=4					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_ss-n-2

[---------- AI related ----------]
[AI]
