[---------- General Data ----------]
[General]
UnitType=Vessel
RequiredTroopType=SpecialForces
TroopCapacity=100
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.8
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.25

Length=186                    // in meters
Beam=20                       // in meters

CompartmentsHeight=0.12       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=Moderate

[OpticalView]
Views=binocular_7x50,gfcs_med_optical
DefaultView=gfcs_med_optical

[---------- FlightDeck Definitions ----------]
[AirGroup]
fr_alouette_III=Squadron2,1

[FlightDeck]
AircraftCapacity=1
AircraftSupported=fr_alouette_III
NumberOfElevators=1
NumberOfLaunchPoints=1
NumberOfRecoveryPoints=1
NumberOfTaxiPaths=2
LaunchDelay=5
GroundCrewCount=1
DeckParkSlots=1
HoldWaypoints=0,300,0.8|0.8,300,0|0,300,-0.8|-0.8,300,0
HoldStackSeparation=200
HoldSpeed=200
# Single-helicopter gameplay stores, with four air-dropped torpedoes.
FlightDeck_AmmoCapacity=2500/2500
FlightDeck_NumberOfAccountableAmmunitionCategories=1
FlightDeck_AccountableAmmunitionCategory_1=AirTorpedo,4/4
ForwardsTaxiVelocity=10
BackwardsTaxiVelocity=-5
SlowTaxiVelocity=5

[Elevator1]
AssociatedLaunchPoints=1
Mesh=Dummy
# Abstract the former seaplane hangar/crane: appear and disappear on the quarterdeck.
# No crane, elevator or hangar-door animation is required.
SpawnPosition=-0.0003,0.0979,-1.2208
RidePosition=-0.0012,0.0979,-1.1971
SpawnRotation=0

[LaunchPoint1]
AllowedType=Helicopter
Position=-0.0016,0.0979,-1.0064
Rotation=90

[RecoveryPoint1]
AllowedType=Helicopter
AssociatedElevators=1
Position=-0.0019,0.0979,-1.0064
CircuitWaypoints=0,100,-0.4
Rotation=90

[TaxiPath1]
From=Elevator1
To=LaunchPoint1

[TaxiPath2]
From=RecoveryPoint1
To=Elevator1

[Physics]
Displacement=15200             // in tons

MaxForwardVelocity=32.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.53
MinAccelerationFactor=0.1

RudderTurnRate=1.0             // turn rate of the rudder in degrees per second
RudderForce=0.5                // multiplicator defining how agile the ship can turn

TiltFactor=2.5                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.5                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=3		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=15.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge
# Sonar related
BaseNoise=170                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10               // additional noise for cavitation in db
BladesCount=3					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_rails-launcher

