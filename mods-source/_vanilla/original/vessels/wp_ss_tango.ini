[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.1

Length=90.2                    // in meters
Beam=8.6                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

MaxGuidanceWires=4

[OpticalView]
Views=standard_periscope_soviet
DefaultView=standard_periscope_soviet

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=3600              // in tons

HorsePower=6000

MaxForwardVelocity=16.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=15.0
MaxBackwardVelocity=5.0        // sets the max backward velocity
MaxBackwardVelocitySurfaced=3.0
TelegraphVelocities=-5,0,3,5,10,13,16  // Overrides default telegraph values

BowUnderWater=12.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=22.0            // depth in feet, from where the sail is under water

LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.36
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.55               // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=10.0
RollChangeRate=2.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=-8                   // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=36.0            // in feet
CrushDepth=1230                // in feet
CavitationParameters=10		   // defines the speed in knots at 100m depth that the submarine will cavitate at

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=126                  // base sound level in db at 1m distance
FlowNoise=1.6                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10             // additional noise for cavitation in db
TargetReflectionStrength=14    // in dB for broad side
BladesCount=5                  //number of blades on vessel's propulsion systems
ElectricFrequency=50           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

MachineryRaftingGeneration=3
PropellerType=Conventional
[Animations]
NumberOfAnimationReferences=2
AnimationFile_1=animations_submarine
AnimationFile_2=animations_wp_ss_tango

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=5
ASW_Capability=6

