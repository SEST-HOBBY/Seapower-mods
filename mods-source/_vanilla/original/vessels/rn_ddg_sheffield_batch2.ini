# ------------ Taxi ------------
NumberOfElevators=1
NumberOfLaunchPoints=1
NumberOfRecoveryPoints=1
NumberOfTaxiPaths=2

# ------------ Preparation/Launch ------------
LaunchDelay=5
GroundCrewCount=1
DeckParkSlots=1

# ---------- Flight Deck Ammunition ----------
FlightDeck_AmmoCapacity=5800/5800             // Ammo points. Can be numerical value or "Unlimited"

