[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.12

Length=72                      // in meters
Beam=9.9                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[OpticalView]
Views=standard_periscope
DefaultView=standard_periscope

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1850              // in tons

MaxForwardVelocity=20.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=12.0
MaxBackwardVelocitySurfaced=3.0
MaxBackwardVelocity=6.0        // sets the max backward velocity
TelegraphVelocities=-6,0,3,5,8,15,20 // Overrides default telegraph values

BowUnderWater=15.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=30.0            // depth in feet, from where the sail is under water
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.90
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=1.4                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=0                    // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=-0.068        // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=45.0            // in feet
CrushDepth=820                 // in feet
CavitationParameters=12		   // defines the speed in knots at 100m depth that the submarine will cavitate at


#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=136                   // base sound level in db at 1m distance
FlowNoise=1.4                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10              // additional noise for cavitation in db
TargetReflectionStrength=18     // in dB for broad side
BladesCount=5                   //number of blades on vessel's propulsion systems
ElectricFrequency=60            //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
TonalRPMModifier=90

MachineryRaftingGeneration=1
PropellerType=Conventional
[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_jmsdf_ss_uzushio

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
AAW_Capability=0
ASuW_Capability=6
ASW_Capability=6

#Defence
#Special
Role=SS

