[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=0.8
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.09

Length=50.8                    // in meters
Beam=8.8                       // in meters

CompartmentsHeight=0.05        //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[Physics]
// all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=700               // in tons

MaxForwardVelocity=11          // sets the max forward velocity
MaxBackwardVelocity=3          // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.25
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
RudderForce=0.46                // multiplicator defining how agile the ship can turn

TiltFactor=1.8                 // defines how strong the tilting will be
PitchFactor=0.3                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-0.5                   // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=2		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=160                   // base sound level in db at 1m distance
FlowNoise=1.6                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=3					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=3 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[---------- AI related ----------]
[AI]
UnitCostValue=50            // value for the unit cost for least valuable target checks
UnitScoreValue=2              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
#Offence
#Defence
MissilesToSaturate=1      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

#Special
Role=Merchant

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_bridge

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=700
Collider=coll_engineroom

############################################################
# Rudder Systems
############################################################
[RudderSystems]
NumberOfRudderSystems=1

[RudderSystem1]
Mount=Rudder
Collider=coll_steering

############################################################
# Propulsion Systems
############################################################
[PropulsionSystems]
NumberOfPropulsionSystems=1

[PropulsionSystem1]
Mount=Propeller
RotationDirection=Left
Collider=coll_engineroom

[---------- System Groups  ----------]
[SensorSystems]
NumberOfSensorSystems=2

[SensorSystem1]
# Bridge
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.112,-0.019

[SensorSystem2]
Type=Radar
SystemName=Nav_Radar
Mount=Nav_Radar
Collider=coll_navradar

[Compartments]
Compartment1FirePosition=0,0,0.15
Compartment2FirePosition=0,0,-0.21
[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=1
LOD1Distance=0.5  // nautical miles
LOD2Distance=1.5  // nautical miles

############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/ships
AssetBundleMaterials=/AssetBundles/StandaloneWindows/ships
AssetBundleMesh=civ_fv_okean
AssetBundleDamagedMesh=civ_fv_okean_d
AssetBundleMaterial=civ_fv_okean_mat
AssetBundleMeshHullCollider=civ_fv_okean_coll_hull
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=ships/civ_fv_okean/
ResourcesRoot=civ_fv_okean
ResourcesMesh=civ_fv_okean
ResourcesDamagedMesh=civ_fv_okean_d
ResourcesMaterial=civ_fv_okean_mat
