[General]
UnitType=Vessel
#HideIn=MissionEditor,Signatures
DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.35
MinCameraDistanceBroadside=0.35
CameraPivotHeight=0.02

Length=18                    // in meters
Beam=4                       // in meters

CompartmentsHeight=0.01       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=Medium

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[Physics]
#all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1              // in tons

MaxForwardVelocity=20        // sets the max forward velocity
MaxBackwardVelocity=5        // sets the max backward velocity
TelegraphVelocities=-5,0,4,6,8,10,20
LinearDrag=0.95                // this is for velocity damping (linear drag)
MaxAccelerationFactor=4.63
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
RudderForce=0.5                // multiplicator defining how agile the ship can turn

TiltFactor=-0.01                 // defines how strong the tilting will be
PitchFactor=0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-0.3                  // default trim depth in
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=2		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=140                    // base sound level in db at 1m distance
CavitationNoise=5               // additional noise for cavitation in db
FlowNoise=1                      // additional flow noise per knot in db (20kn would be +20db)
BladesCount=2					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[---------- AI related ----------]
[AI]
Role=FAC
#Role=Deco

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_bridge

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=3800
Collider=coll_engineroom

[PropulsionSystems]
NumberOfPropulsionSystems=2

[PropulsionSystem1]
Mount=Propeller_Left
RotationDirection=Left
Collider=coll_prop_l
[PropulsionSystem2]
Mount=Propeller_Right
RotationDirection=Right
Collider=coll_prop_r

#Rudder Systems
[RudderSystems]
NumberOfRudderSystems=2

[RudderSystem1]
Mount=Rudder_Left
Collider=coll_rudder_l

[RudderSystem2]
Mount=Rudder_Right
Collider=coll_rudder_r

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2

[SensorSystem1]
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.076,0

[SensorSystem2] #dummy radar mount
Type=Radar
SystemName=Nav_Radar
Mount=Dummy
MountPosition=0,0.16,0.03
Collider=coll_mast

[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=1
LOD1Distance=1.0  // nautical miles
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/ships
AssetBundleMaterials=/AssetBundles/StandaloneWindows/ships
AssetBundleMesh=usn_septar_qst-35
