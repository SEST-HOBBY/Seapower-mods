[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.1

Length=87                   // in meters
Beam=10.13                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor

[OpticalView]
Views=standard_periscope
DefaultView=standard_periscope

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=4500               // in tons
HorsePower=20000

MaxForwardVelocity=28          // Max submerged forward velocity in knots
MaxForwardVelocitySurfaced=25.0
MaxBackwardVelocity=7.0        // Max submerged backward velocity in knots
MaxBackwardVelocitySurfaced=5

TelegraphVelocities=-5,0,5,10,15,20,28 // Overrides default telegraph values

BowUnderWater=28.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=45.0            // depth in feet, from where the sail is under water

LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.31
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.6                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=10.0
RollChangeRate=2.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=0                // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=-0.072           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=47.0            // in feet
CrushDepth=937.0              // in feet
CavitationParameters=25		   // defines the speed in knots at 100m depth that the submarine will cavitate at

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=128                  // base sound level in db at 1m distance
FlowNoise=0.75                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5             // additional noise for cavitation in db
TargetReflectionStrength=15    // in dB for broad side
BladesCount=18                  //number of blades on vessel's propulsion systems
ElectricFrequency=60           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
DistinctiveNoise=False         //If True, this vessel can be identified easier than usually by passive sonars

MachineryRaftingGeneration=3
PropellerType=PumpJet

[Animations]
