[General]
UnitType=Vessel
HideIn=MissionEditor,Signatures
DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.15
MinCameraDistanceBroadside=0.15
CameraPivotHeight=0.02

Length=5                    // in meters
Beam=2                       // in meters

CompartmentsHeight=0.01       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[Physics]
#all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1              // in tons

MaxForwardVelocity=20        // sets the max forward velocity
MaxBackwardVelocity=5        // sets the max backward velocity
TelegraphVelocities=-5,0,4,6,8,10,20
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
RudderForce=0.5                // multiplicator defining how agile the ship can turn

TiltFactor=-0.01                 // defines how strong the tilting will be
PitchFactor=0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-0.3                  // default trim depth in
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=3		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=1.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=65                    // base sound level in db at 1m distance
FlowNoise=1.6                      // additional flow noise per knot in db (20kn would be +20db)


[---------- AI related ----------]
[AI]
#Role=Merchant
Role=Deco

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_hull

#Movement Systems
[MainPowerSystem]
Type=None
HorsePower=1

[PropulsionSystems]
NumberOfPropulsionSystems=1

[PropulsionSystem1]
Mount=Dummy

[RudderSystems]
NumberOfRudderSystems=1

[RudderSystem1]
Mount=Dummy

[SensorSystems]
#Presence of this section allows object to be detectable

[---------- Cargoholds ----------]
[Cargo]
AvailableLoadouts=Commandos
#---------------------------------------
NumberOfCargoSlots=2

#Name=position|rotation|HideWithActiveDamageModel = false
Slot1=0,0,0
Slot2=0,0,0

[Cargo_Default]
Slot1=cargo_usn_seals
Slot2=cargo_usn_car-15

[Cargo_Default_Soviet]
Slot1=cargo_wp_spetsnaz
Slot2=cargo_wp_aks-74

[Cargo_Commandos]
Slot1=cargo_usn_seals
Slot2=cargo_usn_car-15

[Cargo_Commandos_UK]
Slot1=cargo_rn_sbs
Slot2=cargo_rn_slr

[Cargo_Commandos_Soviet]
Slot1=cargo_wp_spetsnaz
Slot2=cargo_wp_aks-74

[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=1
LOD1Distance=2.5  // nautical miles
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/ships
AssetBundleMaterials=/AssetBundles/StandaloneWindows/ships
AssetBundleMesh=assault_raft
AssetBundleDamagedMesh=assault_raft_d
AssetBundleMaterial=assault_raft_mat
AssetBundleMeshHullCollider=assault_raft_coll_hull
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=ships/assault_raft/
ResourcesRoot=assault_raft
ResourcesMesh=assault_raft
ResourcesMaterial=assault_raft_mat
############################################################

[---------- Effects ----------]
[Particles]
SmallFireEffectClass=SmallShipFire_Small
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire_Small
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire_Small
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffectClass=SecondaryExplosions #
SecondaryExplosionEffectPosition=0,0,0
#kill explosion will be played to switch over to the damage model
KillExplosionEffect=effects/explosions/emitters/missile_hit_ship_3
KillExplosionEffectPosition=0,0.2,-0.05
OilSlickEffect=effects/damage/emitters/OilSlick_Medium
OilSlickEffectPosition=0,0,0
SinkingBubblesEffect=effects/ships/emitters/sinkingbubbles_ship
SinkingBubblesEffectPosition=0,0,0
BowWave=False
PropWash=False
Cavitation=False
BowWavePosition=0,0,0.176
PropWashPosition=0,-0.025,-0.171

[Foam]


SternFoamTexture=ships/particles/wake/Ceto_Propwash
SternFoamPosition=0,0,-0.05
SternFoamDuration=15
SternFoamSize=0.1
SternFoamSpacing=0.05
SternFoamExpansion=0.025
SternFoamMomentum=0.01
SternFoamSpin=0
SternFoamAlpha=2
SternFoamJitter=0.25

OverlayHeightTexture=ships/particles/wake/bowwave_hm
OverlayHeightMaskTexture=ships/particles/wake/bowwave_hm
OverlayHeightMaxAlpha=0.0
OverlayNormalTexture=ships/particles/wake/bowwave_normal
OverlayNormalMaskTexture=ships/particles/wake/bowwave_normal
OverlayNormalMaxAlpha=10.0
OverlayFoamTexture=ships/particles/wake/bowwave_tx2
OverlayFoamMaskTexture=ships/particles/wake/bowwave_mask
OverlayFoamMaxAlpha=1.0
OverlayOffset=-0.06
KelvinWaves=0.5,0.34
VelocityForMinParticles=11  // velocity in knots from where on the particles shall show maximum effect
VelocityForMaxParticles=12  // velocity in knots from where on the particles shall show maximum effect


[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=True

NumberOfMeshColliders=2
NumberOfColliders=0

MeshCollider1=coll_hull
MeshCollider2=coll_collider


[coll_hull]
Collider=assault_raft_collider

[coll_collider]
Collider=assault_raft_collider
Kinematic=true


