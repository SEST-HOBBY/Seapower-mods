[General]
UnitType=Vessel
RequiredTroopType=SpecialForces
TroopCapacity=100
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.09

Length=119                      // in meters
Beam=12.5                       // in meters

CompartmentsHeight=0.05         // Governs bouyancy compartment height and also missile aimpoint
ArmorType=Minor

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[---------- FlightDeck Definitions ----------]
[AirGroup]
# Landing/rebasing capability only. No default embarked air group.

[FlightDeck]
AircraftCapacity=1
AircraftSupported=rn_lynx_has2,fr_alouette_III

# ------------ Taxi ------------
NumberOfElevators=1
NumberOfLaunchPoints=1
NumberOfRecoveryPoints=1
NumberOfTaxiPaths=2

# ------------ Preparation/Launch ------------
LaunchDelay=5
GroundCrewCount=1
DeckParkSlots=1

# ------------ Landing ------------
HoldWaypoints=0,300,0.8|0.8,300,0|0,300,-0.8|-0.8,300,0
HoldStackSeparation=200 //In feet
HoldSpeed=200           //In knots. Landing is permitted once speed was lower than this

# ---------- Flight Deck Ammunition ----------
# Gameplay allowance for a single helicopter, including two paired torpedo sorties.
FlightDeck_AmmoCapacity=2500/2500             // Ammo points. Can be numerical value or "Unlimited"

FlightDeck_NumberOfAccountableAmmunitionCategories=1
FlightDeck_AccountableAmmunitionCategory_1=AirTorpedo,4/4

[Elevator1]
AssociatedLaunchPoints=1
Mesh=Dummy
HangarOpenAnimation=HangarOpenAnim
HangarCloseAnimation=HangarCloseAnim

SpawnPosition=-0.02,0.0783,-0.27
RidePosition=-0.02,0.0783,-0.415

[LaunchPoint1]
AllowedType=Helicopter
Position=-0.02,0.0783,-0.51

[RecoveryPoint1]
AllowedType=Helicopter
AssociatedElevators=1
Position=-0.02,0.0783,-0.505
CircuitWaypoints=0,100,-0.4

[TaxiPath1]
From=Elevator1
To=LaunchPoint1
IsBackwards=True

[TaxiPath2]
From=RecoveryPoint1
To=Elevator1

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=3550              // in tons

MaxForwardVelocity=33.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.78
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder itself in degrees per second
RudderForce=0.45                // multiplicator defining how agile the ship can turn

TiltFactor=2.0                 // defines how strong the tilting will be
PitchFactor=1.2                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-1.5                  // default trim depth in feets
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.03,0          // center of mass for physics
CavitationSpeed=3		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=9.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium
# Sonar related
BaseNoise=150                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10               // additional noise for cavitation in db
BladesCount=4					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=3
AnimationFile_1=animations_usn_dd_gearing
AnimationFile_2=animations_mm-38
AnimationFile_3=animations_hedgehog

[---------- AI related ----------]
[AI]
UnitCostValue=2000            // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=1
ASuW_Capability=2
ASW_Capability=4

#Defence
MissilesToSaturate=2      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD    //Anti-Missile Defence
ATD_Capability=TBD      //Anti-Torpedo Defence

#Special
Role=ASW,ASuW_Gun

[ControlSystem]
ModuleType=CIC

[MainPowerSystem]
############################################################
