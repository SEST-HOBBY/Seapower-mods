NumberOfLaunchPoints=1
NumberOfRecoveryPoints=1
NumberOfTaxiPaths=2

# ------------ Preparation/Launch ------------
LaunchDelay=5
GroundCrewCount=1
DeckParkSlots=1

# ---------- Flight Deck Ammunition ----------
FlightDeck_AmmoCapacity=1300/1300             // Ammo points. Can be numerical value or "Unlimited"

FlightDeck_NumberOfAccountableAmmunitionCategories=1
