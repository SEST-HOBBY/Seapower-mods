[General]
UnitType=Vessel
HideIn=MissionEditor,Signatures
DefaultCameraDistance=1.5
MinCameraDistanceForeAft=0.15
MinCameraDistanceBroadside=0.15
CameraPivotHeight=0.03

Length=3                     // in meters
Beam=3                       // in meters

CompartmentsHeight=0.01       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[Physics]
#all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=0.3               // in tons

MaxForwardVelocity=0           // sets the max forward velocity
MaxBackwardVelocity=0          // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0
MinAccelerationFactor=0

TiltFactor=0.8                 // defines how strong the tilting will be

TransportCapacity=1            // In people

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
Undetectable=True

[AI]
UnitScoreValue=5              // value for calculation of mission score
CollectScoreValue=0.4         // value for calculation of mission score when unit is collected by another unit
Role=Deco,LifeRaft

[SensorSystems]
#Presence of this section allows object to be detectable

[---------- Cargoholds ----------]
[Cargo]
AvailableLoadouts=ArmyPilot
#---------------------------------------
NumberOfCargoSlots=1
Slot1=0,0,0

[Cargo_Default]
#1 = 2 by 3 wide
Slot1=cargo_single_raft_crew_us

[Cargo_Default_Soviet]
Slot1=cargo_single_raft_crew_wp

[Cargo_ArmyPilot]
#1 = 2 by 3 wide
Slot1=cargo_single_raft_crew_us

[Cargo_ArmyPilot_Soviet]
Slot1=cargo_single_raft_crew_wp_olive

[--------------------------- Mesh definitions ---------------------------]
[Models]
LODLevels=1
LOD1Distance=2.5  // nautical miles

ResourcesFolder=ships/one_man_raft/
ResourcesRoot=one_man_raft
ResourcesMesh=one_man_raft
ResourcesMaterial=one_man_raft_mat
############################################################

[---------- Effects ----------]
[Particles]
SmallFireEffectClass=SmallShipFire_Small
ModerateFireEffectClass=ModerateShipFire_Small
SevereFireEffectClass=SevereShipFire_Small
SecondaryExplosionEffect=False
KillExplosionEffect=False
OilSlickEffect=False
SinkingBubblesEffect=False
DistressFlareEffect=effects/ships/emitters/distress_flare
DistressFlareEffectPosition=0,0.007,0
BowWave=False
PropWash=False
Cavitation=False

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=True

NumberOfMeshColliders=2
NumberOfColliders=0

MeshCollider1=coll_hull
MeshCollider2=coll_collider


[coll_hull]
Collider=one_man_raft_collider

[coll_collider]
Collider=one_man_raft_collider
Kinematic=true
