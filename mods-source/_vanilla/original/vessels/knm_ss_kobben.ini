[General]
UnitType=Submarine
DefaultCameraDistance=1.0
MinCameraDistanceForeAft=1
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.0

Length=47.2                      // in meters
Beam=4.7                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor

[OpticalView]
Views=standard_periscope
DefaultView=standard_periscope

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=485               // in tons

MaxForwardVelocity=17.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=10.0
MaxBackwardVelocitySurfaced=3.0
MaxBackwardVelocity=5.0        // sets the max backward velocity
TelegraphVelocities=-5,0,2,4,8,12,17

BowUnderWater=4.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=15.0            // depth in feet, from where the sail is under water
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.65
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.6                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=15.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=-5.0                 // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=-0.055        // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=25.0            // in feet
CrushDepth=737              // in feet
CavitationParameters=10		   // defines the speed in knots at 100m depth that the submarine will cavitate at


#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=128                   // base sound level in db at 1m distance
FlowNoise=1.6                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10              // additional noise for cavitation in db
TargetReflectionStrength=18     // in dB for broad side
BladesCount=5                   //number of blades on vessel's propulsion systems
ElectricFrequency=60            //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
TonalRPMModifier=90				// multiplies the narrowband radiated screw tonal by this % value, default is 100 (percent)

MachineryRaftingGeneration=3
PropellerType=Conventional
[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_knm_ss_kobben

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=6
ASW_Capability=6

#Defence
#Special
Role=SS

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=2200
AdditionalNoise=12        //Added to current noise level when running on this power
Collider=coll_engineroom

[SnorkelMastSystem]
MaxForwardVelocity=8
Collider=coll_snorkel_mast
Mount=Snorkel
OpenSystemAnimation=RaiseSnorkel
CloseSystemAnimation=LowerSnorkel
ModuleType=Inert

[AuxPowerSystem]
Type=Electric
HorsePower=1700
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
Capacity=20000      //Range 20 miles at top underwater speed (17 knots)
DischargeRate=1.46  //Rate of discharging batteries. Lower values provide more range on low underwater speed on batteries
RechargeRate=1.2    //Capacity per second when charging batteries. When a unit goes at Standard telegraph setting or slower, the charge rate doubles
Collider=coll_battery_1,coll_battery_2

