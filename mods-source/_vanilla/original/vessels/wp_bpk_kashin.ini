[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.4
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.2

Length=144                     // in meters
Beam=15.8                      // in meters

CompartmentsHeight=0.06        // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_8x50,binocular_12x50,bridge_binocular_20x120_stab_soviet
DefaultView=binocular_8x50

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=4300              // in tons

MaxForwardVelocity=34.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=1.29
MinAccelerationFactor=0.1

#Kashin: Turning circle 7.5 shiplengths (1185 yards) with max roll of 13°
RudderTurnRate=2.5             // turn rate of the rudder in degrees per second
RudderForce=0.3                // multiplicator defining how agile the ship can turn

TiltFactor=4.5                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-2.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=4		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=11.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiLarge
# Radar related (RCS => radar cross section)
RCS=SemiLarge
# Sonar related
BaseNoise=150                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10               // additional noise for cavitation in db
BladesCount=4					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=3
AnimationFile_1=animations_rails-launcher
AnimationFile_2=animations_rbu-6000
AnimationFile_3=animations_rbu-1000

[---------- AI related ----------]
[AI]
UnitCostValue=3000            // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=4
ASuW_Capability=4
ASW_Capability=2

#Defence
MissilesToSaturate=6      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD    //Anti-Missile Defence
ATD_Capability=TBD      //Anti-Torpedo Defence

#Special
Role=AAW,ASW

