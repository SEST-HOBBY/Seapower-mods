Sequence1=HatchCloseExtend_Front
Sequence1_Model=Hatch_Front
Sequence2=HatchClose_Front
Sequence2_Model=Hatch_Hinges_Front
Sequence3=HatchCloseExtend_Rear
Sequence3_Model=Hatch_Rear
Sequence4=HatchClose_Rear
Sequence4_Model=Hatch_Hinges_Rear

[------------------------------ Sequences ------------------------------]

#Launcher + launcher hinges animations:

[Launcher_Elevate]
NumberOfSteps=2
Time1=0
RotationX1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut
Time2=8
RotationX2=-15
Smoothness2=EaseInOut

[Hinges_rotate]
NumberOfSteps=2
Time1=0
RotationX1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut
Time2=8
RotationX2=-10
Smoothness2=EaseInOut

[Launcher_Lower]
NumberOfSteps=2
Time1=0
RotationX1=-15
Smoothness1=EaseInOut  // can be: Linear, EaseInOut
Time2=8
RotationX2=0
Smoothness2=EaseInOut

[Hinges_rotate_back]
NumberOfSteps=2
Time1=0
RotationX1=-10
Smoothness1=EaseInOut  // can be: Linear, EaseInOut
Time2=8
RotationX2=0
Smoothness2=EaseInOut

