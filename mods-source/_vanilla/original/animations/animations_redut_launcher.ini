[Animations]
NumberOfAnimations=4
Animation1=HatchOpenAnim
Animation2=HatchCloseAnim
Animation3=LauncherElevate
Animation4=LauncherLower

[LauncherElevate]
NumberOfSequencesToPlay=2
Sequence1=Launcher_Elevate
Sequence1_Model=Launcher
Sequence2=Hinges_rotate
Sequence2_Model=Launcher_Hinges

[LauncherLower]
NumberOfSequencesToPlay=2
Sequence1=Launcher_Lower
Sequence1_Model=Launcher
Sequence2=Hinges_rotate_back
Sequence2_Model=Launcher_Hinges

[HatchOpenAnim]
NumberOfSequencesToPlay=4
Sequence1=HatchExtend_Front
Sequence1_Model=Hatch_Front	#Hatch_Hinges_Front
Sequence2=HatchOpen_Front
Sequence2_Model=Hatch_Hinges_Front
Sequence3=HatchExtend_Rear
Sequence3_Model=Hatch_Rear
Sequence4=HatchOpen_Rear
Sequence4_Model=Hatch_Hinges_Rear

[HatchCloseAnim]
