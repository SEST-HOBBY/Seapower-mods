[Animations]
NumberOfAnimations=4

Animation1=TorpedoMountExtend_1
Animation2=TorpedoMountExtend_2
Animation3=TorpedoMountRetract_1
Animation4=TorpedoMountRetract_2

##SS-N-3 Launcher Animations

[TorpedoMountExtend_1]
NumberOfSequencesToPlay=1
Sequence1=LauncherExtendPortSequence
Sequence1_Model=TorpedoMount1

[TorpedoMountExtend_2]
NumberOfSequencesToPlay=1
Sequence1=LauncherExtendStbdSequence
Sequence1_Model=TorpedoMount2

[TorpedoMountRetract_1]
NumberOfSequencesToPlay=1
Sequence1=LauncherRetractPortSequence
Sequence1_Model=TorpedoMount1

[TorpedoMountRetract_2]
NumberOfSequencesToPlay=1
Sequence1=LauncherRetractStbdSequence
Sequence1_Model=TorpedoMount2


// possible values for rotations are either a complete vector (x,y,z)
// or single axis like RotationX1, RotationY1, RotationZ1
// same is true for positions
// both rotation and position values are optional, so if you leave the position away,
// only the rotation will be applied

[LauncherExtendPortSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationY1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
RotationY2=-45
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[LauncherRetractPortSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationY1=-45
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
RotationX2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[LauncherExtendStbdSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationY1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
RotationY2=45
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[LauncherRetractStbdSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationY1=45
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
RotationX2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry