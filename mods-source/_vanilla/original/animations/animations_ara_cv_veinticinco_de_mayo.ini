[Animations]
Animation1=MoveDownElevator1
Animation2=MoveDownElevator2
Animation3=MoveUpElevator1
Animation4=MoveUpElevator2
Animation5=MoveUpDeflector
Animation6=MoveDownDeflector

[MoveDownElevator1]
NumberOfSequencesToPlay=1
Sequence1=ElevatorMoveDownSequence
Sequence1_Model=Elevator_1

[MoveDownElevator2]
NumberOfSequencesToPlay=1
Sequence1=ElevatorMoveDownSequence
Sequence1_Model=Elevator_2

[MoveUpElevator1]
NumberOfSequencesToPlay=1
Sequence1=ElevatorMoveUpSequence
Sequence1_Model=Elevator_1

[MoveUpElevator2]
NumberOfSequencesToPlay=1
Sequence1=ElevatorMoveUpSequence
Sequence1_Model=Elevator_2

[MoveUpDeflector]
NumberOfSequencesToPlay=1
Sequence1=Deflector1MoveUpSequence
Sequence1_Model=Blast_Deflector

[MoveDownDeflector]
NumberOfSequencesToPlay=1
Sequence1=Deflector1MoveDownSequence
Sequence1_Model=Blast_Deflector

[------------------------------ Sequences ------------------------------]

[ElevatorMoveDownSequence]
NumberOfSteps=2
#Step<i>=Time|Position|Rotation|SmoothnessType
#Step<i>=0|None|0,0,0|Linear
Step1=0|x,0.162,z|x,y,z|EaseInOut
Step2=5|x,0.0288,z|x,y,z|EaseInOut

[ElevatorMoveUpSequence]
NumberOfSteps=2
Step1=0|x,0.0288,z|x,y,z|EaseInOut
Step2=5|x,0.162,z|x,y,z|EaseInOut


[Deflector1MoveUpSequence]
NumberOfSteps=2
Step1=0|x,y,z|0,y,z|EaseInOut
Step2=3|x,y,z|60,y,z|EaseInOut

[Deflector1MoveDownSequence]
NumberOfSteps=2
Step1=0|x,y,z|60,y,z|EaseInOut
Step2=3|x,y,z|0,y,z|EaseInOut