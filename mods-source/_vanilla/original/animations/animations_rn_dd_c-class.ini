[Animations]
NumberOfAnimations=2

Animation1=SQUID_R_Reload
Animation2=SQUID_L_Reload


[SQUID_R_Reload]
NumberOfSequencesToPlay=3
Sequence1=SquidReloadSequence_R
Sequence1_Model=Squid_launcher_r
Sequence2=SpawnCharges
Sequence2_Model=Dummy  // doesn't matter here, spawned object (RBU) is used, keep the entry so the logfile doesn't contain a warning
Sequence3=SquidHomePosition_R
Sequence3_Model=Squid_launcher_r

[SQUID_L_Reload]
NumberOfSequencesToPlay=3
Sequence1=SquidReloadSequence_L
Sequence1_Model=Squid_launcher_l
Sequence2=SpawnCharges
Sequence2_Model=Dummy  // doesn't matter here, spawned object (RBU) is used, keep the entry so the logfile doesn't contain a warning
Sequence3=SquidHomePosition_L
Sequence3_Model=Squid_launcher_l

[SquidReloadSequence_R]
NumberOfSteps=2
Time1=0
RotationZ1=0
Smoothness1=EaseInOut

Time2=3
RotationZ2=90
Smoothness2=EaseInOut

[SquidReloadSequence_L]
NumberOfSteps=2
Time1=0
RotationZ1=0
Smoothness1=EaseInOut

Time2=3
RotationZ2=-90
Smoothness2=EaseInOut

[SpawnCharges]
UseLauncherPositionOffsets=False  // optional, if true means that it uses the launcher position offsets from the ammunition file in section [Launchers]
Spawn=True
NumberOfSteps=1
Time1=20
PositionZ1=0           // can be 0 here as we use the missile specific positions from the ammunition file from section [Launchers]

[SquidHomePosition_R]
NumberOfSteps=2
Time1=30
RotationZ1=90
Smoothness1=EaseInOut

Time2=33
RotationZ2=0
Smoothness2=EaseInOut

[SquidHomePosition_L]
NumberOfSteps=2
Time1=30
RotationZ1=-90
Smoothness1=EaseInOut

Time2=33
RotationZ2=0
Smoothness2=EaseInOut