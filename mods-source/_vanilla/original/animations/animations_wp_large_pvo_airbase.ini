[Animations]
NumberOfAnimations=4

Animation1	=	LowerElevator1
Animation2	=	RaiseElevator1
Animation3	=	LowerElevator2
Animation4	=	RaiseElevator2

[------------------------------ FlightDeck & Taxi ------------------------------]
[LowerElevator1]
NumberOfSequencesToPlay=1
Sequence1=LowerElevatorSequence
Sequence1_Model=Elevator_1

[RaiseElevator1]
NumberOfSequencesToPlay=1
Sequence1=RaiseElevatorSequence
Sequence1_Model=Elevator_1

[LowerElevator2]
NumberOfSequencesToPlay=1
Sequence1=LowerElevatorSequence
Sequence1_Model=Elevator_2

[RaiseElevator2]
NumberOfSequencesToPlay=1
Sequence1=RaiseElevatorSequence
Sequence1_Model=Elevator_2

[------------------------------ Sequences ------------------------------]

[------------------------------ FlightDeck & Taxi Sequences ------------------------------]
[LowerElevatorSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionY1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=6                // time in seconds - here for the end
PositionY2=-0.1565
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[RaiseElevatorSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionY1=-0.1565
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=6                // time in seconds - here for the end
PositionY2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry