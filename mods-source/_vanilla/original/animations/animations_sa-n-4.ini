// possible values for rotations are either a complete vector (x,y,z)
// or single axis like RotationX1, RotationY1, RotationZ1
// same is true for positions
// both rotation and position values are optional, so if you leave the position away,
// only the rotation will be applied

# open sequences

[SA-N-4_OpenHatchASequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionZ1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=2                // time in seconds - here for the end
PositionZ2=-0.0065
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[SA-N-4_OpenHatchFSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionZ1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=2                // time in seconds - here for the end
PositionZ2=0.0065
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[SA-N-4_MoveRailsUpSequence]
NumberOfSteps=4
Time1=2
PositionY1=-0.014
RotationX1=90
Smoothness1=EaseInOut
Time2=3
PositionY2=0.0
RotationX2=90
Smoothness2=EaseInOut
Time3=4
PositionY3=0.0
RotationX3=90
Smoothness3=EaseInOut
Time4=5
PositionY4=0.0
RotationX4=-15
Smoothness4=EaseInOut

[SA-N-4_MoveLauncherUpSequence]
