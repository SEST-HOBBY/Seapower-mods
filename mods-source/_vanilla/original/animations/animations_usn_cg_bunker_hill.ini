[Animations]
// All VLS cell-hatch and module-vent animations are generated by the AnimationTemplate
// sections below (IniHandler AnimationTemplate expansion) and registered here automatically.

[AnimationTemplate1]  // forward Mk41 cell hatches
NamePattern=VLS_Fwd_{a}_{b}
CounterA=1-8
CounterB=1-8
Skip=VLS_Fwd_6_5,VLS_Fwd_6_6,VLS_Fwd_6_7
OpenSequence=VLSOpenAnimSequence
CloseSequence=VLSCloseAnimSequence

[AnimationTemplate2]  // aft Mk41 cell hatches
NamePattern=VLS_Aft_{a}_{b}
CounterA=1-8
CounterB=1-8
Skip=VLS_Aft_6_5,VLS_Aft_6_6,VLS_Aft_6_7
OpenSequence=VLSOpenAnimSequence
CloseSequence=VLSCloseAnimSequence

[AnimationTemplate3]  // forward Mk41 module vents
NamePattern=VLS_Fwd_{a}_Vent
CounterA=1-8
OpenSequence=VLSOpenAnimSequence
CloseSequence=VLSCloseAnimSequence

[AnimationTemplate4]  // aft Mk41 module vents
NamePattern=VLS_Aft_{a}_Vent
CounterA=1-8
OpenSequence=VLSOpenAnimSequence
CloseSequence=VLSCloseAnimSequence

[------------------------------ Sequences ------------------------------]
// possible values for rotations are either a complete vector (x,y,z)
// or single axis like RotationX1, RotationY1, RotationZ1
// same is true for positions
// both rotation and position values are optional, so if you leave the position away,
// only the rotation will be applied
[VLSOpenAnimSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1.2                // time in seconds - here for the end
RotationX2=-90
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[VLSCloseAnimSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=-90
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1                // time in seconds - here for the end
RotationX2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[------------------------------ Hangar ------------------------------]
