#Open Hangar Doors
[HangarOpenDoorLAnimSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationY1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=6            // time in seconds - here for the end
RotationY2=90
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[HangarOpenDoorRAnimSequence]
NumberOfSteps=2
Time1=3                // time in seconds for the start
RotationY1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=9            // time in seconds - here for the end
RotationY2=-90
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry


