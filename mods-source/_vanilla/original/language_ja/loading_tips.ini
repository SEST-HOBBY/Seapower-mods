[LoadingTips]
Count=8
Header=ヒント
Tip001=ハープーンおよび対艦トマホークは地形を回避しません。発射前に進路が空いていることを確認してください。
Tip002=分散した編隊は、敵にレーダーで判読されにくくなります。
Tip003=スタンダード・ミサイルは視界内の対水上戦闘に使用でき、この役割ではハープーンより信頼性が高くなります。
Tip004=SH-2Fヘリコプターは、米海軍護衛艦に航空機搭載の水上捜索レーダーを提供します。艦載レーダーの射程外にいる水上コンタクトを探知できますが、航空機の捜索はできません。
Tip005=ソヴレメンヌイ級駆逐艦はSS-N-22「サンバーン」を搭載しています。これは当時最も高性能な対艦ミサイルですが、射程は48 nmに限られます。
Tip006=ウダロイ級フリゲートはSA-N-9地対空ミサイル・システムを搭載しており、ハープーンやエグゾセなどのシースキミング・ミサイルの迎撃に特に効果的です。
Tip007=航空機によるジャミングは、敵防空網の有効性を大きく低下させます。
Tip008=SS-N-14A（Metel）対潜兵器は、Krivak級とKresta II級の対潜艦に搭載されています。SS-N-14B（Rastrub）は副次的な対艦能力を追加した型で、射程27 nm、Krivak II級、Kara級、Udaloy級に搭載されています。
