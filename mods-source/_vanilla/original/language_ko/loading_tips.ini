[LoadingTips]
Count=8
Header=팁
Tip001=하푼과 대함 토마호크 미사일은 지형을 회피하지 않습니다. 발사 전에 비행 경로가 깨끗한지 확인하십시오.
Tip002=분산된 대형은 적이 레이더로 식별하기 어렵습니다.
Tip003=스탠더드 미사일은 가시선 내 대수상 교전에 사용할 수 있으며, 이 역할에서는 하푼보다 더 신뢰할 수 있습니다.
Tip004=SH-2F 헬리콥터는 미 해군 호위함에 공중 수상 탐색 레이더를 제공합니다. 함정 레이더보다 먼 거리의 수상 접촉물을 탐지할 수 있지만, 항공기를 탐색할 수는 없습니다.
Tip005=소브레멘니급 구축함은 SS-N-22 선번을 탑재합니다. 이는 당대 가장 뛰어난 대함 미사일이지만, 사거리는 48 nm로 제한됩니다.
Tip006=우달로이급 호위함은 하푼이나 엑조세 같은 시스키밍 미사일을 격추하는 데 특히 뛰어난 SA-N-9 지대공 미사일 체계를 갖추고 있습니다.
Tip007=항공기의 재밍은 적 방공망의 효율을 크게 낮춥니다.
Tip008=SS-N-14A(Metel) 대잠 무기는 Krivak급과 Kresta II급 대잠함이 탑재합니다. SS-N-14B(Rastrub)는 부차적인 대함 능력을 추가한 모델로, 사거리 27 nm이며 Krivak II급, Kara급, Udaloy급에 탑재됩니다.
