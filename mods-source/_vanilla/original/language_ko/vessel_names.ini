DefaultDescription="선도함의 이름을 따서 공식적으로는 패러것급이지만, 미사일 구축함으로 최초로 기공된 함정의 이름을 따서 쿤츠급으로도 알려져 있습니다. 패러것급은 10척이 건조되었으며 처음에는 RIM-2 '테리어'를 장착했지만, 차후에는 RIM-67 '스탠다드 ER'을 탑재하도록 개량되었습니다.\n\n쿤츠급 구축함중 하나인 머핸(DDG-42)는 1980년에 개량되어 NTU 개량의 초도함이 되었으며 SM-2ER 블록 II를 비롯한 최첨단 장비류를 탑재하여 그 당시로썬 가장 강력한 방공함이 되었습니다."
