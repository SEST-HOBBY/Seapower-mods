DefaultDescription=스터전급은 냉전 대부분의 기간 동안 미국 잠수함 전력의 중추를 이루었습니다. 퍼밋급 설계에서 발전된 것으로, 개선된 정숙성과 거주성에 중점을 두었습니다. 스터전급은 생산 과정에서 많은 업그레이드를 거쳤으며, 이전의 "짧은 선체" 모델들은 이전의 9정의 "긴 선체" 모델들에 비해 다소 덜 조용하고 ESM 장비가 덜 정교했습니다. 1960년대 후반과 1970년대 초반에는 여전히 많은 스터전급이 마크 37과 마크 16 어뢰를 조합하여 사용하고 있었지만, 1970년대에는 대부분의 함선이 Mk.48, BQR-25 SASS, BQQ-5 소나로 업그레이드되거나 건조되었습니다.
