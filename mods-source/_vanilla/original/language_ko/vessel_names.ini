DefaultDescription=오베론급은 포어포이즈급의 개량형 후계함으로 더 강화된 선체와 개선된 장비를 탑재했으며 디젤-전기 추진식 공격 및 초계잠수함으로, 총 27척이 건조되었습니다. 호주 해군은 두 차례에 걸쳐 오베론급 잠수함 6척을 주문했으며, 영국 해군 표준에서 약간의 수정이 있었습니다. 특히 마크 37 어뢰 형태의 미국 무기를 사용하는 것이 가장 두드러졌습니다.\n\n호주 해군은 1970년대 후반부터 잠수함의 센서와 무장을 업그레이드하여 1980년대 이후의 예상 위협에 대응하기 위해 업그레이드 프로그램(SWUP)을 시작했습니다. 여기에는 미해군의 마크 48 어뢰, MicroPUFS 측면 배열 수동 소나, 그리고 궁극적으로 UGM-84 잠수함 하푼 미사일이 포함되며, 1985년까지 여섯 척의 함선 모두가 이와 함께 업그레이드되었습니다.
