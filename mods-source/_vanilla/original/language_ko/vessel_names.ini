[wp_rkr_kirov]
Type=TARKR,미사일 순양함
Default=프로옉트 1144 키로프급,키로프
DefaultDescription=소련에서 "씨 이글"(프로젝트 1144)로 알려진 키로프급은 거대한 핵추진 미사일 순양함입니다. 제2차 세계대전 전함과 비슷한 크기를 가진 키로프급은 역대 건조된 수상 전투함 중 가장 강력한 함정에 속합니다. 1980년 이후 2척이 건조되었고 추가로 2척이 건조 중입니다. 키로프급이 이토록 거대한 크기를 가진 건 다수의 대함미사일 발사관과 함께 근접방어 시스템을 백업으로 갖춘 지역방어용 함대공 미사일 체계를 탑재해야 할 필요성이 있었기 때문입니다.\n\n비록 최첨단 소나와 장거리 대잠전 무기들을 장착했을지라도, 이 함정들은 일반적으로 전담 대잠함들의 보호를 받는 수상전투단의 기함으로 운용됩니다.
