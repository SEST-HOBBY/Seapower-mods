[usn_phm_pegasus]
Type=PTG,미사일 고속정
Default=페가수스급,페가수스
DefaultDescription=페가수스급은 소련 고속정(주로 오사급 같은)에 대응하기 위한 대규모 다국적 NATO 프로젝트에서 계획됐습니다. 페가수스급 수중익선은 최대 50노트(92.6km)로 항행할 수 있으며 선수에는 76mm 함포를 그리고 RGM-84 하푼 8발을 탑재했습니다. 주요 개발 문제 및 비용 문제로, 이 독특한 선박은 오직 6척만 건조됐습니다. 현역으로 활동할 때는 플로리다에 위치한 키 웨스트 해군 비행장에서 마약 단속 업무를 수행했으며, NATO 소속 국가 연안에서 바르샤바 조약기구의 미사일 고속정에 대응하기 위한 용도로는 결코 사용되지 않았습니다.
