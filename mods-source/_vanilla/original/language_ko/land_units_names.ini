DefaultDescription=12cm 투르나우토마트피에스 m/70 (ERSTA라고도 함)은 제2차 세계 대전 당시 오래된 화포들을 대체하기 위해 설계된 스웨덴의 해안포입니다. 소련의 상륙부대으로부터 항구와 같은 중요 지역을 방어하고 지역 거부를 수행하도록 설계되었습니다. ERSTA 운용 요원들이 잠재적인 핵 전장에서도 중요한 역할을 수행할 수 있도록, ERSTA는 최대 60일 동안 생존 가능한 지원 시설에 연결되어 있었습니다. 1980년대 후반 노르웨이로 ERSTA 8문이 수출되었습니다.

