DefaultDescription=소형 피스톤 엔진을 장착한 가압식 객실을 갖춘 일반 항공기입니다. 이 항공기는 매우 인기가 있으며 전 세계적으로 사업가와 범죄자들 모두에게 사용되고 있습니다. 작은 활주로를 이용할 수 있는 능력 덕분에 비밀 작전에 적합합니다.

