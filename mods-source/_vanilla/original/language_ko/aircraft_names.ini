DefaultDescription=초기형 미국산 여객기입니다, 보잉 707은 1960년대에 가장 인기있던 여객기로 비록 코멧이 최초의 제트 여객기였지만 보잉 707의 대성공으로 인해 거의 모든 사람들에게 제트 여객기 시대의 시작점으로 인식됩니다. 70년대에 조금씩 노후화 되었지만 대부분의 항공사와 군대에서는 80년대까지 쓰였습니다.
