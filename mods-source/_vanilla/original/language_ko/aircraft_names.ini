Default=QH-50C 대쉬,QH-50C
DefaultDescription=QH-50 대시(드론 대잠 헬리콥터)는 격납고와 헬리콥터를 탑재하기에는 힘든 소형 함선을 위한 장거리 대잠무기로 설계됐습니다. QH-50은 FRAM 계획의 주요 구성요소이며 기어링급 구축함과 같은 구형 함선뿐만 아니라 전후 대양 호위함들도 탑재했습니다. 그러나 QH-50은 높은 고장률로 함정에서 운용하기에는 부적합하다고 판정받아 1973년을 마지막으로 일선에서 물러났습니다. 해상자위대는 QH-50의 유일한 해외 운용국으로 자위대의 주기적인 점검 덕분에 QH-50은 작전에서 더 좋은 성과를 보여주었으며 기체들은 1977년 최종 퇴역했습니다. QH-50C는 373기가 생산된 최초 양산형으로 300마력 터보샤프트 엔진을 장착했습니다.
Squadron1=QH-50C,QH-50C
Callsigns=Squadron1,대시

[usn_qh-50d]
Type=드론 헬리콥터
