MGK-540=MGK-540 스카트-3|MGK-540 "스카트"(NATO 코드 : 샤크 길/샤크 테일)는 원통형 능동/수동 소나와 예인 소나를 사용하는 소련의 통합 저주파 소나 체계입니다. 여기에는 기뢰 탐지용 소나와 능동 고주파 감청 소나가 포함되어 있으며, MGK-500의 개량형입니다.
MGK-500_TA=MGK-500 스카트 예인소나|MGK-500 "스카트"(NATO 코드 : 샤크 길/샤크 테일)는 원통형 능동/수동 소나와 예인 소나를 사용하는 소련의 통합 저주파 소나 체계입니다. 여기에는 기뢰 탐지용 소나와 능동 고주파 감청 소나가 포함됩니다.
