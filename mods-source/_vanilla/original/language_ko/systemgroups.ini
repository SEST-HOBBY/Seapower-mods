Band_Stand_ESM=모놀리트 ESM|"모놀리트" (NATO 코드 : 밴드 스탠드)는 P-120 "말라히트" (NATO 코드 : SS-N-9 '사이렌')과 P-270 "모스키트" (NATO 코드 : SS-N-22 '선번') 미사일의 초수평선 사격 관제 레이더입니다. 소브레멘니급과 나누추카급에 탑재되었습니다.
