Eyes=Mk 1 아이볼|20/20 시야의 당신의 눈입니다.
Optics=광학장비|쌍안경이나 확대 가능한 TV 카메라 시스템. 육안(Mk 1 아이볼)보다 더 긴 시각 탐지 거리를 제공합니다.
AdvancedOptics=첨단 광학장비|기본 광학장비와 다르게 저조도 TV 카메라는 전천후 및 야간 식별 능력을 제공합니다.
Periscope=잠망경|확대 및 거리 측정 기능이 있는 광학 마스트입니다. 육안(Mk 1 아이볼)보다 더 긴 시각 탐지 거리를 제공하며 수중에서도 볼 수 있습니다.
Recon_Camera=정찰 카메라
TailCamera=후방 카메라
SurfaceSearchRadar=수상 탐색 레이더
Nav_Radar=항해 레이더|일반적으로 민간 선박에서 발견되는 수상 탐색 레이더입니다. 일부 군함에도 장착되어 있습니다.
GMSR=수상 탐색 레이더
Local_GFCR=화기 레이더
GuidancePod=유도 포드
GuidancePodNoAlignment=유도 포드
VesselESM=ESM|전자전지원장비(ESM) 체계는 레이더 신호를 방사하는 게 아닌 레이더 신호 감청을 통해 수동적인 탐지 능력을 제공합니다.
Submarine_ESM=ESM 마스트|전자전 지원책(ESM)은 레이더 신호를 방사하는 게 아닌 레이더 신호 감청을 통한 수동적인 탐지 능력을 제공합니다.
AircraftRWR=RWR|레이더 경보 수신기는 탐색 및 연속파 레이더 신호를 감지해 적의 사격이 임박했음을 경고하는 장치입니다.
GenericECM=ECM 재머|전자 방해책은(ECM)은 적의 레이더를 향해 잡음을 방사해 배경 노이즈를 상쇄시킬 만큼 출력을 높일 때까지 탐지 범위를 크게 축소시킵니다. 또한 적의 레이더 전파를 납치해 변조 후 재송신해 표적의 실제 위치를 알 수 없도록 만들기도 합니다.
DRUA-33=DRUA-33|DRUA-33은 잠수함에서 사용되는 X밴드 소형 수상 탐색 레이더입니다.
Aida-2=아이다-2|아이다-2는 1950년대부터 몇몇 프랑스 전투기에 사용된 X밴드 거리 측정용 레이더로써, 시라노 시리즈보다 먼저 나왔습니다.
Cyrano_IV-2=시라노 IV-2|시라노 IV-2는 X밴드 다중 모드 레이더로써, 대공 탐색이나 단일 표적 추적, 지형 조사, 지면 윤곽 탐색 모드가 있습니다.
Cyrano_IV-M=시라노 IV-M|시라노 IV-M은 X밴드 다중 모드 레이더로써, 대공 탐색이나 단일 표적 추적, 지형 조사, 지면 윤곽 탐색 모드가 있습니다. 또한 6해리 내의 공중 표적을 신속하게 락 온 하는 자동 '근접교전' 모드도 있습니다.
DUUA-2A=DUUA-2A|DUUA-2A는 다프네급과 아고스타급 잠수함에서 사용하는 중주파 능동 서치라이트 소나입니다.
DSUV-2=DSUV-2|DSUV-2는 다프네와 아고스타급 잠수함에서 사용하는 저주파 수동 탐색 소나입니다.
DUUX-2A=DUUX-2A|DUUX-2는 수동 사격 통제에 사용되는 중/고주파 삼각측량 어레이입니다. 209급 잠수함이나 다프네급, 아고스타급에서 사용됩니다. 전 세대의 AN/BQG-4 수동형 수중사격통제 타당성 시스템(PUFFS)와 유사합니다.
Neptune=넵튠|넵튠은 사르 4.5급 알리야 미사일정에서 사용되는 수상, 대공 탐색 레이더입니다.
Elta2207=엘타-2207|엘타-2207은 사르 4급 고속정에서 사용되는 수상, 대공 탐색 레이더입니다.
RTN-10X=RTN-10X|RTN-10X는 사르급 고속정에서 사용되는 탐색 및 사격 관제 레이더입니다.
TCS=TCS     //Television Camera System   ОЛС - оптическая локационная станция
AN/ASX-1_TISEO=AN/ASX-1 광학 조준경|AN/ASX-1은 장거리의 공중 표적을 육안으로 식별할 수 있는 TV 시스템입니다.
KA-51A=KA-51A 카메라|KA-51A는 RA-5C의 기수에 사선으로 탑재되어 정면을 관측할 수 있는 카메라입니다.
AN/AVQ-22=LLTV 카메라|LLVT는 EVS(전자 광학 관찰 시스템) 개수를 받은 B-52G에 탑재된 정면주시형 저조도 TV 카메라입니다.
AN/AAS-21=FLIR 탐지기|FLIR 탐지기는 RA-5C에 탑재된 정면주시형 적외선 카메라입니다.
AN/AAQ-6=FLIR 탐지기|FLIR 탐지기는 EVS(전자 광학 관찰 시스템) 개수를 받은 B-52G에 탑재된 정면주시형 적외선 카메라입니다.
AN/AAS-33=TRAM IR 탐지기|TRAM 적외선 탐지기는 TRAM 개수를 받은 A-6E들에 탑재된 적외선 카메라입니다.
SPS-6=SPS-6|AN/SPS-6은 제2차 세계대전 이후로 미 해군이 처음 사용한 2차원 대공 탐색 레이더입니다. 해당 레이더는 2차원이기에, 방위각과 상대거리만을 제공해줍니다. 고도 측정을 위해서는 추가 레이더가 필요합니다.
SPS-29=SPS-29|AN/SPS-29는 제2차 세계대전 이후로 미 해군이 사용한 2차원 조기 경보 레이더입니다. 냉전 기간 동안 많은 해군 함선에 장비되었으며 해당 레이더는 2차원이기에, 방위각과 상대거리만을 제공해줍니다. 고도 측정을 위해서는 추가 레이더가 필요합니다.
SPS-30=SPS-30|AN/SPS-30은 AN/SPS-8에 더 강력한 송신기를 단 개수형입니다. 함선에 탑재되어 항공기 탐지 및 감시에 사용되며, 통합형 탐색, 고도 추적용 S밴드 레이더입니다.
UPA-43=UPA-43|AN/UPA-43은 미 해군에서 사용된 피아식별장치 심문기입니다. AN/SPS-48과 같은 후기형 레이더들은 별도 안테나가 필요 없는 통합형 피아식별장치 심문기를 가지고 있습니다.
SPS-37=SPS-37|AN/SPS-37은 냉전 초기 미 해군이 조기 경보용으로 사용한 2차원 레이더이며, AN/SPS-29의 개량형입니다. 해당 레이더는 2차원이기에, 방위각과 상대거리만을 제공해줍니다. 고도 측정을 위해서는 추가 레이더가 필요합니다.
SPS-40=SPS-40|AN/SPS-40은 많은 미 해군의 함선에서 일반적으로 사용된 장거리 2차원 대공 탐색 레이더입니다. 해당 레이더는 2차원이기에, 방위각과 상대거리만을 제공해줍니다. 고도 측정을 위해서는 추가 레이더가 필요합니다.
SPS-43=SPS-43|AN/SPS-43은 미 해군 항모와 미사일 순양함에 주로 사용되는 초장거리 대공 탐색 레이더입니다 VHF 대역을 사용하는 AN/SPS-43은 주파수 도약 기능으로 레이더 재밍에 대응합니다. 해당 레이더는 2차원이기에, 방위각과 상대거리만을 제공해줍니다.
SPS-48=SPS-48|AN/SPS-48은 3차원 대공 탐색 레이더입니다. 방위각은 안테나 바닥이 기계적으로 회전해 측정하며, 고도는 전자 탐색으로 측정합니다. 3차원 레이더는 교전 중인 표적의 정보를 2차원 조기경보 레이더에서 화기 관제 레이더로 인계할 때 중간 단계 역할을 합니다.
SPS-49=SPS-49|SPS-49는 SPS-40을 대체한 장거리 2차원 대공 탐색 레이더입니다. 다수의 미 해군 함선과 동맹국의 함선에서 널리 사용된 대공 탐색 레이더이며, NTU 개수 당시 구식 함선의 SPS-40을 대체하였습니다.
SPS-52=SPS-52|AN/SPS-52는 방위, 범위 및 고도를 제공하는 데 사용되는 3차원 장거리 대공 탐색 레이더입니다. 더 커다란 SPS-48과 마찬가지로 방위각은 안테나 바닥이 기계적으로 회전해 측정하며, 고도는 전자 탐색으로 측정합니다. 3차원 레이더는 교전 중인 표적의 정보를 2차원 조기경보 레이더에서 화기 관제 레이더로 인계할 때 중간 단계 역할을 합니다.
SPN-43=SPN-43|AN/SPN-43는 항공모함과 항공기 운용 능력이 있는 함에서 사용된 2차원 항공 통제 레이더로써, 80.5km(50 mi) 내의 항공기를 식별 및 관제하는 데 사용합니다.
SPY-1A=SPY-1A|AN/SPY-1는 이지스 전투 체계의 핵심 레이더로써, 장거리 탐색이 가능한 비능동형 전자주사식 3차원 위상배열 레이더입니다. 4개로 분산된 컴퓨터 제어형 안테나를 이용해 함선 주변의 공역을 360도 연속으로 감시합니다.
MK-23_TAS=Mk.23 TAS|Mk.23 TAS는 씨스키밍이나 고각 미사일 공격에 대응하기 위한 소형 고속회전형 2차원 탐색 레이더입니다. NATO의 RIM-7 씨 스패로우 방공 시스템과 연동되어 사용되었습니다.
SPS-10=SPS-10|AN/SPS-10는 냉전 초기에 다수의 미 해군 및 동맹국 함선에서 사용된 2차원 수상 탐색 레이더입니다.
SPS-55=SPS-55|AN/SPS-55는 항법 및 고체 수색용 수상 탐색 레이더입니다. 스프루언스급과 그 파생형 함선 및, 올리버 해저드 페리급 호위함과 어벤저급 소해정에 탑재되었습니다.
SPS-67=SPS-67|AN/SPS-67은 초저공 비행중인 표적을 탐색하기 위해 미 해군 함선에서 일반적으로 사용되는 레이더입니다.
MK-115=Mk.115|Mk.115는 씨 스패로우 r기본 개함방공 체계(BPDMS)의 표적 조사용 유인 관제장치입니다.
MK-95=Mk.95|Mk.95는 개량된 씨 스패로우 개함방공 체계의 사격 관제 레이더로써, 표적을 조사해 반능동 레이더 추적(SARH) 미사일을 유도하는 역할을 합니다.
SPW-2=SPW-2|AN/SPW-2는 RIM-8 탈로스 미사일의 빔 라이딩 유도 시 사용되는 유도 레이더입니다.
SPG-49=SPG-49|AN/SPG-49는 RIM-8 탈로스 미사일의 화기 관제 레이더입니다. 미사일이 비행할 때 목표 추적과 유도 부문을 담당합니다.
SPG-51=SPG-51|AN/SPG-51는 함포 및 미사일 사격 관제용 레이더입니다. C와 X밴드로 구동되며, RIM-24 타터와 SM-1MR을 유도할 때 사용됩니다.
SPG-55=SPG-55|AN/SPG-55는 RIM-2 테리어와 RIM-67(SM-1ER, SM-2ER)의 사격 통제용 레이더입니다. 수면 추적 모드를 사용할 경우, 대수상 표적에 대한 미사일 유도 또한 가능합니다.
SPG-60=SPG-60|AN/SPG-60은 모노펄스 추적과 표적 조사용 X밴드 레이더입니다. RIM-24 타터와 SM-1MR의 유도용으로 사용되며, Mk.86 함포의 화기 관제 시스템(GFCS)으로도 활용됩니다.
SPG-62=SPG-62|AN/SPG-62는 이지스 시스템과 함께 설치된 X밴드 연속파 조사 및 표적 추적용 조사 레이더입니다. SM-2 미사일의 종말유도단계에서 표적유도 목적으로 활용됩니다.
MK37_GFCS=Mk.37 GFCS|Mk.37 GFCS(사격 통제 장치)는 5"/38 Mk.12 양용포의 사격 통제 장치입니다. 전후 모든 Mk.37 GFCS는 Mk.25 측거 레이더를 장비했으며, 이것이 표준 조합이 됩니다. 이로 인해 Mk.37 GFCS는 1990년대 초반까지 운용되었습니다.
MK38_GFCS=Mk.38 GFCS (레이더 마크 13)|Mk.38 GFCS(사격 통제 장치)는 전함의 주포에서 대지상/해상 표적 목표를 정확하게 타격하기 위해 사용된 장비입니다. Mk.38 GFCS는 노스 캐롤라이나급 전함, 사우스 다코다급 전함, 아이오와급 전함 및 알래스카급 대형순양함의 함교 구조물 상부에 장갑화되어 탑재되었습니다. Mk.38 GFCS는 Mk.13 측거 레이더를 함께 장비하였으며 아이오과급 전함이 퇴역한 1990년대 초반까지 사용되었습니다.
MK56_GFCS=Mk.56 GFCS|Mk.56 GFCS(화기 관제 시스템)은 3"와 5" 함포가 탑재된 함선에 장착되었습니다. X밴드 레이더를 사용하며 수상 표적과 고속 공중 표적에 대응할 수 있습니다.
MK68_GFCS=Mk.68 GFCS|Mk.68 GFCS(화기 관제 시스템)은 5"/54 Mk.42 함포를 사용한 함선에 탑재되었습니다. X밴드 레이더를 사용하며 수상 표적과 고속 공중 표적에 대응할 수 있습니다.
MK86_GFCS=Mk.86 GFCS|Mk.86 GFCS(화기 관제 시스템)은 Mk.45 5"/54구경 함포를 사용한 함선에 탑재되었습니다. X밴드 레이더를 사용하며 수상 표적과 고속 공중 표적에 대응할 수 있습니다. 구형 GFCS들과는 달리 무인이며 광학 관측 백업을 위해 무선 TV 카메라가 장비되어있습니다.
MK92_FCS=Mk.92 FCS|Mk.92는 네덜란드제 WM-25 사격 통제 레이더의 미 해군 면허생산형입니다. 올리버 해저드 페리급과 페가수스급 수중익선에서 사용되며, SM-1MR과 76mm 함포를 통제하는데 사용합니다.
SPQ-9=SPQ-9|AN/SPQ-9는 Mk.86 GFCS(화기 관제 시스템)과 연관된 X밴드 추적 레이더입니다. 특히, 이 레이더는 고도 능력이 매우 제한적이지만 단거리에서 씨스키밍 순항 미사일과 같은 저공비행 표적을 추적할 수 있습니다.
BPS-14_15=BPS-14|AN/BPS-14는 미국 잠수함이 항해에 사용하는 해수면 탐색 레이더입니다.
AN/APY-1=AN/APY-1|AN/APY-1은 E-3 공중조기경보통제기에 탑재된 초장거리 수상, 대공 탐색 레이더입니다. 조기 경보와 전투 지휘 및 관제 기능을 가지고 있습니다.
LN-66=LN-66|LN-66은 많은 수의 상업, 군용 선박에 탑재된 민간용 단거리 수상 탐색 레이더입니다. 하지만 SH-2F LAMPS(경량 항공 다목적 시스템) 헬리콥터에서도 사용됩니다.
AN/APS-115=AN/APS-115|AN/APS-115는 P-3 오라이온에서 사용되는 X밴드 수상 탐색 레이더입니다. 이 레이더는 AN-APS-80A을 기반으로 개발되었습니다.
AN/APS-116=AN/APS-116|AN/APS-116은 단시간만 노출되는 잠수함의 잠망경과 마스트를 탐지하기 위해 특별히 개발된 수상 탐색 레이더입니다.
AN/APS-125=AN/APS-125|AN/APS-125는 미 해군에서 조기 경보 목적으로 사용되는 UHF 대역의 장거리 대공 탐색 레이더입니다.
AN/APQ-126=AN/APQ-126|AN/APQ-126는 A-7D와 A-7E에 사용되는 항법 및 공격용 레이더입니다. 전천후 공격 성능을 보유하고 있습니다.
AN/APQ-148=AN/APQ-148|AN/APQ-148는 후기형 A-6들에 탑재된 다중 목적 레이더입니다. 전천후 공격 능력과 저공 공격 능력을 보유하고 있습니다.
AN/APD-7=AN/APD-7
AN/AWG-9=AN/AWG-9|AN/AWG-9는 AIM-54 피닉스의 사용을 위해 특별히 고안된 TWS(추적 중 탐색) 기능의 장거리 레이더입니다. 최대 6개의 표적과 동시 교전할 수 있으며, F-14에만 탑재됩니다.
AN/APG-63=AN/APG-63|AN/APG-63는 F-15에 탑재된 장거리 TWS(추적 중 탐색) 레이더입니다.
AN/APQ-109=AN/APQ-109|AN/APQ-109는 F-4D에 탑재된 중거리 다목적 레이더입니다. 룩다운/슛다운 기능이 없기 때문에 저공비행 항공기에 대한 탐지 및 사격 범위가 매우 제한적입니다.
AN/APQ-120=AN/APQ-120|AN/APQ-120는 F-4E에 탑재된 중거리 다목적 레이더입니다. 룩다운/슛다운 기능이 없기 때문에 저공비행 항공기에 대한 탐지 및 사격 범위가 매우 제한적입니다.
AN/AWG-10A=AN/AWG-10A|AN/AWG-10A는 F-4J에 탑재된 다목적 통합형 레이더입니다. 펄스 도플러 기능을 갖추고 있으며, 룩다운/슛다운이 가능한 최초의 미국 전투기 레이더입니다.
MD-9=MD-9|MD-9는 초기형 B-52의 후방 기총 사격 관제용 레이더입니다.
AN/ALQ-153=AN/ALQ-153|AN/ALQ-153는 후기형 B-52의 후방 기총 사격 관제용 레이더입니다.
AN/APQ-153=AN/APQ-153|AN/APQ-153은 F-5E에 탑재된 단거리 대공 탐색 레이더입니다.
AN/APQ-166=AN/APQ-166|AN-APQ-166은 B-52G에 탑재된 지면 파악 및 폭격용 레이더입니다.
AN/MPQ-48=AN/MPQ-48|AN/MPQ-48는 MIM-23 I-호크 지대공 미사일에 사용되는 탐색 레이더입니다.
AN/MPQ-46=AN/MPQ-46|AN/MPQ-46는 MIM-23 I-호크 지대공 미사일에 사용되는 사격 관제 레이더입니다.
SQS-23=SQS-23|AN/SQS-23은 장거리 방위 탐색용 탐색 및 공격용 음파탐지기입니다. ASROC 체계와 같이 사용되며 다수의 함정에 범용적으로 탑재되었지만 후일 더 고성능(이며 더 큰) AN/SQS-26으로 대체되었습니다.
SQS-26=SQS-26|AN/SQS-26은 함수 장착형 저주파 능동/수동 음파탐지기입니다. 1961년부터 미 해군에서 널리 사용되었으며, 먼 거리의 잠수함을 탐지할 목적으로 수렴대와 해저층 반사 기능을 활용한 첫번째 미 해군 음파탐지기였습니다.
SQS-53=SQS-53|AN/SQS-53은 AN/SQS-26CX 소나의 전자식 개량형 소나입니다. 전자식으로 개량된 Mk.116 대잠무기통제시스템에 현시됩니다.
SQS-53B=SQS-53B|AN/SQS-53B는 기계식으로 통제 및 현시하던 AN/SQS-53A를 전자식으로 개량한 버전입니다. 내장 테스트 시스템과 더불어 AN/UYS-1 음향 신호 프로세서가 통합되었으며 AN/SQQ-89 대잠전 통제 시스템과 함께 작동합니다. AN/SQS-53B는 타이콘데로가급 순양함(CG-56 이후 버전)에 AN/SQQ-89의 부속으로 탑재되었습니다.
SQS-56=SQS-56|AN/SQS-56는 극도로 제한된 공간에 탑재하기 위해 개발된 능동/수동 소나입니다. 호위함이나 초계함 크기의 함선에 함체 장착형으로 탑재될 것을 상정하고 설계되었습니다. AN/SQS-56을 탑재한 올리버 해저드 페리급에서는 보통 AN/SQR-18,19 소나전술견인배열체계와 함께 잠수함을 탐지하는 데 사용합니다.
WLR-9=WLR-9|AN/WLR-9는 잠수함에 탑재된 소나 경보 장치입니다. 선체의 돔이나 예인용 돔에 탑재되며, 음파를 수신해 적의 능동 소나 및 능동 소나를 사용하는 어뢰를 탐지하는 데 사용합니다.
BQS-4=BQS-4|AN/BQS-4는 AN/BQR-21 수동 소나에 부속으로 탑재된 고주파 능동탐지장치입니다. 수직으로 쌓인 7개의 원통형 변환기로 구성되어있으며, 활성 핑을 발신하는 방식으로 작동합니다.//AN/BQR-2 수동 소나에 부착하는 부착물로 나온 물건. 음파수신기능이나 구역탐색기능이 있으며, 활성 핑을 발산해 표적을 추적하는 방식도 있음.
BQR-21=BQR-21|AN/BQR-21는 중주파 대역의 예인식 원통형 수동 소나입니다.
BQQ-5=BQQ-5|AN/BQQ-5는 함수 장착형 구형 배열 능동/수동 소나입니다. 퍼밋급과 스터전급 공격 잠수함에 탑재된 AN/BQQ-2를 대체했으며, 로스앤젤레스급 공격 잠수함에는 처음부터 탑재되었습니다.
SQS-35=SQS-35|AN/SQS-53은 가변심도 능동소나입니다. 수온약층 아래로 내려갈 수 있으며, 이를 통해 음영지대에 숨은 잠수함을 탐지하는 능력이 향상되었습니다.
AN/SQR-18A=AN/SQR-18A(V)2|The AN/SQR-18A(V)2 is an American towed array system used on antisubmarine frigates, such as the Knox FF or Perry FFG. The (V)2 version is streamed from a fairlead on the stern, using towing gear from the SQR-19 TACTAS.
AN/SQR-19=AN/SQR-19|AN/SQR-19 전술선배열예인소나(TACTAS)는 적 잠수함을 초장거리에서 탐지하기 위한 수동형 선배열예인소나입니다. 모함에서 매우 멀리 떨어진 곳에서 예인되어 모함의 소음을 최소화합니다.
BQR-15=BQR-15|AN/BQR-15는 적 잠수함과 어뢰를 조기에 탐지하기 위한 수동형 탐지 시스템입니다. AN/BQR-23 신호 프로세서와 얇은 선인 9080 라인으로 구성되어있으며 라파예트급, 제임스 메디슨급, 벤저민 프랭클린급 탄도 미사일 잠수함에 탑재되었습니다.
BQR-25=BQR-25|AN/BQR-25 잠수함 선배열 예인 소나/감시 시스템(STASS)는 장거리에서 적 함선과 잠수함을 탐지하기 위한 수동형 예인 소나입니다. 스킵잭급 공격 잠수함에 개조되어 탑재되었습니다.
TB-16=TB-16|TB-16은 초장거리에서 함선과 잠수함 탐지용 수동형 선배열 예인 소나입니다. 미 해군 공격 잠수함들에 탑재되었으며, 기존의 부착형 잠수함 선배열 예인 소나/감시 시스템(STASS)을 대체했습니다.
AQS-13E=AQS-13E|AN/AQS-13 시리즈는 함재 헬리콥터에 탑재된 디핑 소나입니다. 서방에서 폭 넓게 사용됩니다.
SSQ-53_Sonar=DIFAR 소노부이|AN/SSQ-53 방향성 주파수 분석 및 기록(DIFAR)는 잠수 중인 잠수함을 초기에 감지하는 용도의 수동형 방향성 저주파 소노부이입니다.
SSQ-62_Sonar=DICASS 소노부이|AN/SSQ-62 DICASS는 SSQ-53 수동형 소노부이로 파악한 잠수함의 위치를 재확인하는 데 사용되는 능동형 소노부이입니다.
US_Aircraft_ESM=ESM|전자전 지원책(ESM)은 레이더 신호를 방사하는 게 아닌 레이더 신호 감청을 통한 수동적인 탐지 능력을 제공합니다.
AN/ULQ-6=AN/ULQ-6|AN/ULQ-6 기만 송신기는 초기형 함상형 ECM입니다. 이 체계는 적의 레이더를 방해해 추적 성능을 낮춥니다.
AN/SLQ-32=AN/SLQ-32(v)3|AN/SLQ-32(v)3는 미 해군에서 널리 사용되는 함상형 ECM입니다. 이 체계는 적의 레이더를 교란해 추적 능력을 낮추며, 채프도 제어합니다.
B-52D_OECM=공격형 재머|B-52D에 탑재된 5단계의 ECM 재머는 포괄적인 재밍 기능을 가지고 있습니다. 집중 재밍을 담당하는 2개의 AN/ALT-16 재머와 고주파 재밍을 담당하는 2개의 AN/ALT-32H, 그리고 저주파 재밍을 담당하는 AN/ALT-32L로 구성되어있습니다.
B-52D_DECM=ECM 재머|B-52D에 탑재된 5단계의 ECM 장비들은 적의 사격 관제용 레이더를 교란하기 위한 AN/ALT-6B나 AN/ALT-22 연속파 재밍장치를 최소 4개 이상 탑재했습니다.
B-52G_OECM=공격형 재머|B-52G에 탑재된 6단계의 ECM 재머들은 포괄적 공격형 재밍 기능을 가지고 있습니다. AN/ALT-32H 고주파 재머와 AN/ALT-32L 저주파 재머 외에도 AN/ALT-28 집중형 재머가 장비되었습니다.
B-52G_DECM=ECM 재머|B-52D는 적의 사격 관제 레이더를 무력화하기 위해 AN/ALQ-117 능동 대응 체계와 AN/ALQ-122 거짓 표적 생성기를 탑재하고 있습니다.
AN/ALQ-99=공격형 재머|AN/ALQ-99는 적의 레이더나 방공 체계 및 통신 시스템을 재밍하기 위해 사용되는 재머입니다. 공중 호위나 포드 형태로 탑재해 사용됩니다.
AN/ALQ-119=AN/ALQ-119
AN/ASQ-81V2=AN/ASQ-81V2|AN/ASQ-81는 잠수함을 탐지하기 위해 사용되는 항공기 탑재형 자기 이상 탐지기입니다. 회전익과 고정익 양 쪽에서 다 사용되며, 회전익에서는 로터의 말단부에서 형성된 자기장을 이용하고 고정익에서는 테일 스팅거에 탑재되어 운용됩니다.
AN/AVQ-23=AN/AVQ-23|AN/AVQ-23 페이브 스파이크는 공격기에 탑재되어 레이저 유도폭탄에게 TV 카메라와 레이저로 표적을 지시하는 주간 표적 지시용 포드입니다.
AN/AVQ-26=페이브 택|AN/AVQ-26 페이브 택은 공격기에게 전천후 목표 추적 능력을 주는 타게팅 포드입니다. FLIR와 레이저 표적 지시를 통해 레이저 유도 폭탄을 유도합니다.
Slim_Net=풋-N|"풋-N"(NATO 코드 : 슬림 넷)은 순양함과 구축함의 "헤어 넷" 레이더를 대체한 해군용 고해상도 대공/수상 탐색용 E-밴드 레이더입니다. 1957년부터 사용됐습니다.
Top_Through=MR-510|MR-510 "킬-U"(NATO 코드 : 톱 트로프)는 고해상도 장거리 대공 탐색 레이더입니다. 최대 탐지 거리는 300km가 넘습니다.
Head_Net_A=MR-310|MR-300 "안가라"(NATO 코드 : 헤드 넷A)는 L-밴드 2차원 대공/수상 감시 및 표적 포착 레이더입니다. 단일 안테나를 사용했으며, 저공비행 표적에 대한 성능은 떨어지지만 사거리가 상당합니다.
Head_Net_C=MR-310U|MR-310U "안가라-M"(NATO 코드: 헤드 넷 C)는 헤드 넷 A의 L-밴드 3D 항공 및 수상 탐색 파생 모델로, 두 개의 백투백 안테나를 사용하며 그 중 하나는 기울어져 있어 조잡한 높이 감지 기능과 더 빠른 데이터 속도를 제공합니다. 디지털 처리를 통해 저공비행 표적을 추적하는 능력이 향상됩니다.
Strut_Curve=MR-302|MR-302 "룹카"(NATO 코드 : 스트럿 커브)는 1960년대 초반의 2차원 대공/수상 탐색용 S-밴드 레이더입니다. 주로 소형 호위함 그리고 중형 상륙함 등에 장착되었습니다.
Strut_Pair=MR-320|MR-320 "토파즈-2V"(NATO 코드 : 스트럿 페어)는 1976년에 도입한 S-밴드 대공 탐색 및 표적 포착 레이더입니다. 이 레이더 체계를 주로 사용한 함정은 우달로이급 유도미사일 구축함이었습니다.
Big_Net=MR-500|MR-500 "클리베르"(NATO 코드 : 빅 넷). 1965년에 도입된 UHF 대역의 2차원 대공/수상 탐색 레이더입니다. 이 레이더는 크레스타 I급 미사일 순양함과 카신급 미사일 구축함에 장착되었습니다.
Top_Sail=MR-600|MR-600 "보스호드"(NATO 코드 : 톱 세일)는 L-밴드 3차원 장거리 대공 탐색 레이더입니다. MR-500 "클리베르"(NATO 코드 : 빅 넷)와 결합할 수 있으며, 두 레이더를 통합한 체계는 MR-800 "플라그"(NATO 코드 : 톱 페어)라고 불립니다.
Top_Steer=MR-710|MR-710 "프레가트"(NATO 코드 : 톱 스티어)는 S-밴드 3차원 대공/수상 탐색 레이더입니다. 동일한 아날로그 신호처리 시스템을 가진 두 개의 레이더 안테나 세트로 구성되어 있습니다. 이 레이더는 키예프급, 키로프급, 슬라바급 그리고 소브레멘니급과 같은 1970년대 후반에서 1980년대에 건조된 많은 소련 군함들에 장착되었습니다.
Top_Pair=MR-800|MR-800 "플라그"(NATO 코드 : 톱 페어)는 MR-600 "보스호드"(NATO 코드 : 톱 세일)와 MR-500 "클리베르"(NATO 코드 : 빅 넷) 레이더를 결합한 것으로, 1970년대 후반에서 1980년대 소련의 주력 전투함인 키예프급, 키로프급 그리고 슬라바급 순양함에 장착됐습니다.
Palm_Frond=MR-212|MR-212 "바이가치-U"(NATO 코드 : 팜 프론드)는 소련 대다수의 대형 및 중형 군함들에 장착된 단거리 X-밴드 수상 탐색 레이더입니다.
Square_Tie=MR-331|MR-331 "란고우트"(NATO 코드 : 스퀘어 타이)는 오사급 미사일 고속정에 탑재된 단거리 X-밴드 수상 탐색 및 표적 지정 레이더입니다.
Skin_Head=자르니차|"자르니차"(NATO 코드 : 스킨 헤드)는 제2차 세계대전 이후 소련 어뢰정을 위해 1948년에 개발된 소형 수상 탐색 X-밴드 레이더입니다.
Pot_Head=레야|"레야"(NATO 코드 : 팟 헤드)는 1960년대 초에 어뢰정과 구잠함을 위해 개발된 소형 수상 탐색 X-밴드 레이더입니다.
Pot_Drum=MR-102|MR-102 "바클란"(NATO 코드 : 팟 드럼)은 셰르셴급과 스텐카급과 같은 대형 어뢰정들을 위해 개발된 수상 탐색 및 어뢰 조준용 X-밴드 레이더입니다.
Peel_Pair=두브라바|"두브라바"(NATO 코드 : 필 페어)는 나누추카급과 타란툴급과 같은 소련의 소형 미사일 고속정들에 장착된 "티타니트" 레이더 체계의 일부로 설치된 X-밴드 수상 탐색 레이더입니다.
Peel_Group=4R90|4R90 "야타간"(NATO 코드 : 필 그룹)은 M-1 '볼나' (NATO 코드 : SA-N-1 '고아') 함대공 미사일을 위한 사격 관제용 레이더입니다.
Head_Lights=4R60M|4R60M "그롬-M"(NATO 코드: 헤드 라이츠)는 M-11 '시토름-M'(NATO 코드 : SA-N-3 '고블릿') 중거리 함대공 미사일을 위한 사격 관제용 레이더입니다. 크레스타 II급과 카라급에서는 URPK-3 '메텔'(SS-N-14 사일렉스) 대잠 미사일도 유도합니다.
Top_Dome=3R41|3R41 "볼나"(NATO 코드 : 톱 돔)는 S-300F '포르트'(NATO 코드 : SA-N-6 '그럼블') 함대공 미사일을 위한 사격 관제 용 레이더입니다. 최대 3개의 표적을 동시에 추적할 수 있으며 표적당 최대 2발의 미사일로 교전할 수 있습니다.
Pop_Group=4R-33A|4R-33A "오사"(NATO 코드 : 팝 그룹)는 4K-33 '오사-M'(NATO 코드 : SA-N-4 '게코') 근접방어용 함대공 미사일을 위한 사격 관제용 레이더입니다. 레이더당 미사일 2발을 할당해 단일 표적과 교전할 수 있습니다. CW 일루미네이터 외에도 자체 전용 탐색 레이더를 갖추고 있어, NATO의 '씨 스패로우'에 사용하는 Mk-23 TAS/Mk-95 일루미네이터 조합에 맞먹습니다.
Pop_Group_Search=4R-33A|4R-33A "오사"(NATO 코드 : 팝 그룹)는 4K-33 '오사-M'(NATO 코드 : SA-N-4 '게코') 근접방어용 함대공 미사일을 위한 사격 관제용 레이더입니다. 레이더당 미사일 2발을 할당해 단일 표적과 교전할 수 있습니다. CW 일루미네이터 외에도 자체 전용 탐색 레이더를 갖추고 있어, NATO의 '씨 스패로우'에 사용하는 Mk-23 TAS/Mk-95 일루미네이터 조합에 맞먹습니다.
Cross_Sword=3R95|3R95 "토르"(NATO 코드 : 크로스 소드)는 3K-95 '킨잘'(NATO 코드 : SA-N-9 '건틀렛') 근접방어용 함대공 미사일을 위한 사격 관제용 레이더입니다. 이전의 4R-33(NATO 코드 : 팝 그룹) 레이더처럼 자체 전용 탐색 레이더를 갖춘 독립적인 체계이지만, 새로운 디지털 사격 관제 체계를 통해 최대 10개의 표적을 동시에 추적할 수 있어 포화 공격에 대처하는 능력이 이전보다 훨씬 더 뛰어납니다.
Cross_Sword_Search=3R95|3R95 "토르"(NATO 코드 : 크로스 소드)는 3K-95 '킨잘'(NATO 코드 : SA-N-9 '건틀렛') 근접방어용 함대공 미사일을 위한 사격 관제용 레이더입니다. 이전의 4R-33(NATO 코드 : 팝 그룹) 레이더처럼 자체 전용 탐색 레이더를 갖춘 독립적인 체계이지만, 새로운 디지털 사격 관제 체계를 통해 최대 10개의 표적을 동시에 추적할 수 있어 포화 공격에 대처하는 능력이 이전보다 훨씬 더 뛰어납니다.
Front_Dome=MR-90|MR-90 "오레흐"(NATO 코드 : 프런트 돔)는 M-22 "우라간"(NATO 코드 : SA-N-7 '가드플라이') 함대공 미사일을 위한 사격 관제용 레이더입니다. 표적 포착을 위해 MR-750 '프레가트 M-2'(NATO 코드 : 톱 플레이트) 레이더에 의존하며, MR-90 '오레흐' (NATO 코드 : 프런트 돔)이 추적과 교전을 담당합니다. 각 조준기는 최대 2발의 미사일로 단일 표적과 교전할 수 있습니다.
Scoop_Pair=4R-44|4R-44 "비놈"(NATO 코드 : 스쿱 페어)는 P-5 '파툐르카' (SS-N-3 섀독) 미사일을 위한 사격 통제용 레이더입니다.
Plinth_Net=우스페흐-U|"우스페흐-U"(NATO 코드 : 플린스 넷)는 P-6/P-35 대함미사일 (NATO 코드 : SS-N-3 '섀독') 체계를 위한 미사일 추적 및 통제 레이더입니다. 중간 유도 단계에서 새로운 정보를 제공하며, 미사일 탐색기에서 제공받은 영상 정보를 기반으로 일제사격 시 오퍼레이터가 표적을 선택할 수 있게 합니다.
Front_Door=아르구멘트|"아르구멘트"(NATO 코드 : 프런트 도어)는 에코급과 줄리엣급 잠수함에서 사용하는 P-5D/P-6 대함미사일(SS-N-3 '섀독' 미사일) 체계를 위한 미사일 추적 및 통제 레이더입니다. 중간 유도 단계에서 새로운 정보를 제공하며, 미사일 탐색기에서 제공받은 영상 정보를 기반으로 일제사격 시 오퍼레이터가 표적을 선택할 수 있게 합니다.
Eye_Bowl=무손|"무손"(NATO 코드 : 아이 보울)은 크리박 I급과 II급에서 사용되는 RPK-3A "메텔"(SS-N-14 '사일렉스') 미사일을 위한 사격 관제용 레이더입니다. "그롬-M" 사격 관제용 레이더를 함정에 탑재하기에는 함정이 너무 작았습니다.
Band_Stand=모놀리트|"모놀리트"(NATO 코드 : 밴드 스탠드)는 소브레멘니급과 나누추카급에서 사용되는 P-120 "말라히트" (NATO 코드 : SS-N-9 '사이렌')과 P-270 "모스키트" (NATO 코드 : SS-N-22 '선번') 미사일을 위한 초수평선 사격 관제용 레이더입니다.
Muff_Cob=MR-103|MR-103 "바르스"(NATO 코드 : 머프 코브)는 57mm AK725 함포의 사격 관제용 레이더입니다.
Hawk_Screech=MR-105|MR-105 "투렐" 또는 "풋-B"(NATO 코드 : 호크 스크리치)는 소련의 76mm와 57mm 함포를 위한 사격 관제용 레이더입니다.
Owl_Screech=MR-105 투렐|MR-105 "투렐"(NATO 코드: 아울 스크리치)은 76mm 함포의 개량형 사격 관제용 레이더입니다.
Kite_Screech=MR-145|MR-145 "레프" (NATO 코드: 키트 스크래치)는 100mm, 130mm 함포의 사격 관제용 레이더입니다.
Top_Bow=잘프|"잘프" NATO 코드: 톱 보우)는 스베르들로프급 경순양함에 사용되는 152mm 함포 사격 관제용 레이더입니다.
Four_Eyes=포 아이즈|포 아이즈는 스베르들로프급 경순양함에 사용되는 152mm 함포의 광학식 사격 통제 장치입니다.
Round_Top=라운드 탑|라운드 탑은 스베르들로프급 경순양함에 사용되는 100mm 함포의 광학식 사격 통제 장치입니다.
Bass_Tilt=MR-104|MR-104 "리시" (NATO 코드: 바스 틸트)는 AK-230 점표적 방어 화기의 사격 관제용 레이더로써, 구식 소련 함선에 탑재되었습니다.
Drum_Tilt=MR-123|MR-123 "빔펠" (NATO 코드: 바스 틸트)는 AK-630 점표적 방어 화기의 사격 관제용 레이더로써, 다수의 소련 함선에 탑재되었습니다.
Snoop_Plate=플라그|"플라그"(NATO 코드 : 스눕 플레이트)는 폭스트롯급 잠수함이 사용하는 탐색 레이더입니다.
Snoop_Tray=MRK-50|MRK-50 "카스카드"((NATO 코드 : 스눕 트레이)는 소련의 다양한 잠수함들이 사용하는 매우 일반적인 탐색 레이더입니다.
Snoop_Head=부흐타-치비스|"부흐타-치비스"(NATO 코드 : 스눕 헤드)는 오스카급 잠수함이 사용하는 탐색 레이더입니다.
Snoop_Pair=MRKP-58|MRKP-58 "라디안"(NATO 코드 : 스눕 페어)는 소련의 최신식 잠수함들이 사용하는 개량형 탐색 레이더입니다.
Flat_Face_A=P-15|P-15(NATO 코드 : 플랫 페이스 A)는 감시 및 표적 획득에 사용되는 UHF 대역 2차원 조기경보 레이더입니다. 트럭에 탑재되어 높은 기동성을 추구했습니다.
Flat_Face_B=P-19|P-19(NATO 코드 : 플랫 페이스 B)는 감시 및 표적 획득에 사용되는 UHF 대역의 2차원 장거리 조기 경보 레이더입니다. 트럭에 장착되어 높은 이동성을 제공하도록 설계되었습니다. 향상된 전자 장치는 P-15에 비해 탐지 거리를 거의 두 배로 늘렸습니다.
Knife_Rest=P-10|P-10(NATO 코드 : 나이프 레스트)는 VHF 대역의 초기형 2차원 장거리 조기경보 레이더입니다.
Spoon_Rest=P-18|P-18(NATO 코드 : 스푼 레스트)는 VHF 대역의 2차원 장거리 조기경보 레이더입니다.
Bar_Lock=P-35|P-35(NATO 코드 : 바 락)는 조기 경보 및 요격 관제에 사용되는 E/F 대역 2차원 장거리 대공 탐색 레이더입니다. 소폭의 기동성을 가지고 있으며 트럭으로 견인이 가능합니다.
Tall_King=P-14|P-14(NATO 코드 : 톨 킹)는 VHF 대역의 2차원 장거리 대공 탐색 레이더입니다. 레이더 재밍 대책으로 주파수 도약 기능이 있습니다.
Big_Bird=5N64S|5N64S(NATO 코드 : 빅 버드)는 S-300PS 지대공 미사일의 감시 및 표적 추적에 사용되는 연대급 S-밴드 대공 탐색 레이더입니다.
Tin_Shield=36D6|36D6(NATO 코드 : 틴 실드)는 S-300PS 지대공 미사일의 포대급 3차원 중거리 대공 탐색 레이더로, 표적 포착 및 추적에 사용됩니다.
Square_Pair=5N62|5N62(NATO 코드 : 스퀘어 페어)는 S-200 (NATO 코드 : SA-5 가몬) 장거리 지대공 미사일의 사격 관제용 레이더로써, X밴드 연속파를 발산합니다.
Fan_Song_E=SNR-75|SNR-75는 S-75 '드비나' 지대공 미사일의 C밴드 사격 관제 레이더입니다.
Snap_Shot=9S86|9S86은 자주식 지대공 미사일인 9K35 '스트렐라-10'의 거리 측정용 레이더입니다.
Fan_Tail=PRS-4KM|PRS-4KM "크립톤-B"는 Tu-22M2 백파이어에 탑재된 후방 경고 및 후방 기총용 화기 관제 레이더입니다.
RP-15M=RP-15M|RP-15M (NATO 코드: 트윈 스캔)는 Su-15에 탑재된 다중 목적 레이더입니다.
