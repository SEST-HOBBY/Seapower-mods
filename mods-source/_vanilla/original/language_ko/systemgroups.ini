MG-329=MG-329 셱스나|투랴급 수중익 어뢰정에 사용되는 개조된 디핑 소나입니다.
MGK-335_VDS=MG-335 플라티나 VDS|MG-335 "플라티나"(NATO 코드 : 메어 테일)는 키예프급과 슬라바급에 사용되는 가변심도 소나입니다.
MGK-355_VDS=MGK-355 폴리놈 VDS|MGK-355 "폴리놈"(NATO 코드 : 호스 테일)은 키로프급과 우달로이급에 장착된 개량형 가변심도 소나로, "호스 조" 저주파 소나와 함께 사용됩니다.
MG-200=MG-200 아르크티카-M|MG-200 "아르크티카-M"(NATO 코드 : 파이크 조)는 통합 소나가 도입되기 전 초기 소련 잠수함들의 표적 탐지와 사격통제에 사용된 고주파 능동 서치라이트 소나입니다.
MG-10M=MG-10M 페닉스-M|MG-10M "페닉스-M"(NATO 코드 : 트라우트 칙)은 제2차 세계대전 당시 독일의 '발콘-게레트'(Balkon-gerät)와 동등한 중주파 수동 소나이며 원통형 배열을 사용한 소련 최초의 소나 체계입니다. 통합 소나가 도입되기 전 초기 소련 잠수함들에서 사용되었습니다.
MGK-100=MGK-100 케르치|MGK-100 "케르치"(NATO 코드 : 샤크 티스/샤크 핀)는 원통형 수동 소나와 회전식 평면 소나를 활용하는 소련의 통합 중주파 소나 체계입니다. 여기에는 기뢰 탐색용 소나와 능동 고주파 감청 소나가 포함됩니다.
Kerch-670=MGK-100 케르치-670|MGK-100 "케르치-670"(NATO 코드 : 샤크 티스/샤크 핀)는 원통형 수동 소나와 회전식 능동 소나를 사용하는 소련의 통합 중주파 소나 체계입니다. 케르치-670은 측면 수동 소나가 추가되었습니다. 여기에는 기뢰 탐색용 소나와 능동 고주파 감청 소나가 포함됩니다.
