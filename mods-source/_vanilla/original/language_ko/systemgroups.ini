ActiveIntercept_Early=능동 방수소나|음향 요격 시스템(능동 요격)은 효과적으로 능동 소나를 위한 레이더 경보 수신기로, 여러 소나 배열이 선박이나 잠수함에 탑재된 소나 또는 능동 호밍 어뢰 탐색기에서 방출된 능동 소나 신호의 방위와 정체를 감지하고 결정합니다. 이러한 세트는 잠수함 주변의 360도 각도를 커버하며, 수동 소나가 들을 수 없는 '베플'에서 능동 방출을 감지할 수 있습니다.
ActiveIntercept_Late=능동 방수소나|음향 요격 시스템(능동 요격)은 효과적으로 능동 소나를 위한 레이더 경보 수신기로, 여러 소나 배열이 선박이나 잠수함에 탑재된 소나 또는 능동 호밍 어뢰 탐색기에서 방출된 능동 소나 신호의 방위와 정체를 감지하고 결정합니다. 이러한 세트는 잠수함 주변의 360도 각도를 커버하며, 수동 소나가 들을 수 없는 '베플'에서 능동 방출을 감지할 수 있습니다.
SPS-48E=SPS-48E|AN/SPS-48E는 장거리 3D 항공 탐색 레이더입니다. 목표 방위각은 안테나 전체를 회전시켜 기계적 스캐닝을 통해 감지되며, 고도는 전기적 스캐닝을 통해 탐색됩니다. 3D 레이더는 2D 조기 경보 레이더와 교전 대상에 사용되는 사격 통제 레이더 사이의 중개 역할을 합니다.\n이것은 새로운 안테나와 크게 향상된 저고도 및 ECCM 기능을 갖춘 NTU 전용 업그레이드 SPS-48이며, 더욱 긴 유효 사거리를 가지고 있습니다.
SPS-49V5=SPS-49(V)5|AN/SPS-49(V)5는 SPS-40의 후속 기종이자 장거리 2D 항공 탐색 레이더입니다. 그것은 많은 미국 및 동맹국 함선의 주요 항공 탐색 레이더입니다. 구형 함선에서는 NTU 업그레이드 프로그램으로 SPS-40을 대체했습니다.\nNTU 프로그램에서 파생되어 다른 선박에 다시 장착된 업그레이드된 고출력 모델로, 최소 고도가 낮고 ECCM 성능이 뛰어납니다.
MK92_SearchRadar=Mk.92 레이더|Mk.92는 두 개의 레이더, 탐색 및 추적 세트, 그리고 연속파 사격 통제 레이더를 포함하고 있습니다. 이것은 탐색 레이더 세트로, 두 개의 지상 표적을 한 번에 추적하고 그들을 향해 총격 신호를 보낼 수 있습니다.
AN/APQ-156=AN/APQ-156|AN/APQ-156은 A-6E TRAM에 사용되는 다중 모드 공중 레이더로, 향상된 전천후 성능과 낮은 수준의 공격 능력을 제공합니다.
AN/WLR-6=AN/WLR-6 ESM|AN/WLR-6 전자전 지원책은 초기 스터전급 잠수함을 위한 업그레이드된 무선 경보 및 요격 시스템으로, 대형 돛과 디지털 전자 장치를 활용하여 이전의 WLR-1 무선 경보 시스템보다 이 시스템의 범위와 정확도를 높였습니다.
AN/WLQ-4=AN/WLQ-4 ELINT|AN/WLQ-4 "Sea Nymph"는 업그레이드된 스터전급 잠수함을 위한 고급 ELINT 및 SIGINT 센서 제품군으로, 매우 높은 정확도와 상당한 해상 능력을 갖추고 있습니다.
AN/WLR-8=AN/WLR-8 ELINT|AN/WLR-8은 로스앤젤레스급 SSN에 사용되는 컴팩트 ELINT로, AN/WLR-1 전자전 지원책의 직접적인 후속 모델이었습니다. 주로 이 ESM 스위트는 더 큰 WLQ-4보다 더 컴팩트하게 설계되어 로스앤젤레스급 잠수함의 작은 마스트 안에 들어갈 수 있었습니다.
Splash_Drop=오스미노그|오스미노그(NATO명: 스플래시 드롭)는 Ka-27PL이 사용하는 첨단 표면 탐색 레이더입니다. 소노보이 추적도 수행합니다.
Stop_Light=나카트 ESM|나카트 (NATO명: 스톱 라이트)는 1세대 소련 잠수함에서 사용된 초창기 전자전 지원책입니다. 정확도가 낮고 감도가 낮지만 비교적 넓은 범위의 레이더 대역을 포착할 수 있습니다.
Brick_Pulp=MRP-21 잘리프-P ESM|MRP-21 잘리프-P(NATO명: 브릭 펄프)는 2세대 잠수함에 사용되는 소련의 전자 정보 시스템으로, 이전 ESM 세트에 비해 더 빠른 식별과 함께 더 긴 거리와 더 정확한 방향 탐지를 위한 신호 처리의 발전을 특징으로 합니다.
Bald_Head=MRP-23 ELINT|MRP-23(NATO명: 발드 헤드)은 알파급 및 오스카급 핵잠수함에 사용되는 소련의 ELINT 시스템으로, 정확도가 높고 감도가 매우 우수하여 장거리 미사일 발사가 가능한 독특한 레이더와 전자전 지원책 복합 시스템입니다.
Squid_Head=MRP-25 ELINT|MRP-25(NATO명: 스퀴드 헤드)는 킬로급 잠수함과 탱고급 잠수함에 사용되는 소련의 ELINT 시스템으로, 위협 경고 기능에 최적화되어 있으며, MRP-23 ELINT 시스템의 경량 파생형입니다.
