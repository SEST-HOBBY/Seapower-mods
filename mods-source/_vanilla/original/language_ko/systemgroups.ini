CXAM=CXAM|CXAM은 미 해군이 2차대전 발발 직전 개발한 프로토타입 장거리 대공탐지 레이더로 18x16 sq ft(제곱피트)의 면적을 지닌 탐지 레이더로 목표물을 위아래로 탐지할수 있지만 고도를 특정하지는 못했습니다. CXAM은 이후 다양한 대공탐지 레이더의 기술적 근원이 되었으며 CXAM을 바탕으로 개발된 레이더들은 모두 이보다 좋은 성능을 지녔습니다.
CXAM-1=CXAM-1|CXAM-1은 CXAM에 비해 점진적으로 개선되었으며, 전함, 순양함, 항공모함에 총 14세트가 인도되고 설치되었습니다. 정확도가 182.88m(200yd)로 향상되었고, 이 세트는 1943년까지 일부 선박에서 계속 운항되었습니다. 대형함에서는 SK 또는 SK-2 세트로 대체되었습니다.
SA=SA|SA 시리즈 세트는 호위함과 보조함에서 사용할 수 있도록 설계된 더 작은 안테나로 CXAM의 기능과 성능을 재현하기 위한 것이었습니다. 비교적 성공적인 SA 시리즈는 구축함 호위함과 호위함의 표준 공중 탐색 세트가 되었으며, 일부는 구축함과 경순양함에도 장착되었습니다. 이 유형은 또한 전쟁 후반에 미군 조선소에서 개조된 자유 프랑스군의 함정에도 장착했습니다.
SC-1=SC-1|SA와 마찬가지로 SC도 더 작은 안테나를 사용하여 CXAM의 성능을 더 작은 선박에 적용하려는 시도였습니다. 안타깝게도 더 작은 안테나는 더 낮은 유효 범위로 이어졌고, 운용자들은 기본형 SC를 싫어했습니다. SC-1은 1942년 1월에 두 배의 출력과 두 배의 사거리로 도입되었고, 곧 모든 SC가 개조되었습니다. 이 세트는 전쟁 초기에 구축함과 보조함들이 갖추고 있었으나, SC-2 세트가 배치되면서 SC-2로 대체되었습니다.
SC-2=SC-2|SC-2는 SC-1의 안테나를 크게 확장하여 개선했습니다. 이 세트는 BG 및 BL IFF 시스템에 대한 규정을 통합했으며, 전쟁이 끝날 때까지 구축함의 주요 레이더가 되었습니다. SC-2(SC-3, SC-4, SC-5)의 약간 개선된 버전은 1963년까지 구축함에 탑재되었습니다.
SK=SK 레이더는 WW2 당시 대형 전투함의 표준형 대공탐색레이더였습니다. SC-2는 기본적으로 CXAM 레이더 크기 수준의 안테나를 장비하고 있었으며, 방위각 정보와 경사각상 거리만 제공하는 2차원 레이더입니다. 그렇기에 고도 측정을 위해서는 별도의 탐지 수단이 필요했습니다.
SK-2=SK-2|이 세트는 부엽을 줄이기 위해 17피트 접시 안테나를 장착하여 SK보다 점진적으로 개선되었습니다. 전쟁 후반에 SK와 SK-2는 낮은 빔 고도로 인해 고고도 항공기를 탐지할 수 없다는 비판을 받았습니다. 75세트가 생산되어 대형함이 배치되거나 수리를 목적으로 조선소에 들어올 때 장착되었습니다.
SM=SM|SM은 대형함을 위해 설계된 최초의 미국산 레이더로, 이전의 공중 탐색 레이더에서는 사용할 수 없었던 공중 표적의 높이를 측정하기 위한 원뿔형으로 조사되는 "펜슬 빔"을 통합했습니다. SM은 약 8165kg(안테나만 약 1814kg)으로 매우 무거웠으며, 대형 항공모함에만 장착할 수 있었습니다. 나중에 보다 작은 함선들을 위한 SM-1과 SP가 제작되었습니다.
SP=SP|SP는 SM 고도 탐지 레이더의 경량 후속 기종이었습니다. 이 세트는 선박이 수신하는 방식에 따라 두 개의 다른 안테나를 포함할 수 있으며, 구축함과 경항모에 사용할 수 있는 더 작은 안테나가 있습니다. 이 세트는 오키나와 인근에서 작전을 수행하는 기어링급 레이더 피켓 구축함(DDR)에 장착되었습니다. 300세트가 제작되었고, 전쟁이 끝날 무렵에는 주마스트에 SP를 장착한 주력함이 전방 마스트에 SK 또는 SK-2를 장착하는 것이 흔했습니다.
SR=SR|SR은 CXAM 이후 처음으로 완전히 새로 제작된 공중 탐색 세트로, 이전 레이더 세트에서 개척된 많은 새로운 기능을 통합했습니다. 안테나는 SC-2와 거의 같은 크기로 두 배 이상의 출력을 발휘했으며, 전쟁이 끝날 무렵 구축함에 장착되었습니다. 또한 대형함에 예비 공중 탐색 레이더로 장착하여 1961년까지 운용했습니다.
SR-2=SR-2|SR-2는 원래 구축함 호위함용으로 설계된 50cm의 2차원 공중 탐색 세트였지만, 생산이 시작된 후에는 너무 큰 것으로 판명되었습니다. 선행 모델은 미드웨이급 대형 항공모함과 여러 경순양함, 그리고 첫 네척의 잠수함 레이다 피켓함(SSR)에 장착되었습니다. 이 세트는 성능이 좋지 않아 AN/SPS-6으로 대체되었습니다.
SR-3=SR-3|SR-3와 SR-6는 SK와 SC를 대체하기 위해 설계되었으며, L-밴드를 사용하여 성능을 향상시키고 전파 간섭을 줄였습니다. 두 세트 모두 사용된 안테나 때문에 실제로는 성능이 좋지 않았습니다. 전후 보고서에서는 이 안테나가 "성능이 충분하지 않다"고 보고되었습니다.
SR-6=SR-6|SR-3와 SR-6는 SK와 SC를 대체하기 위해 설계되었으며, L-밴드를 사용하여 성능을 향상시키고 전파 간섭을 줄였습니다. 두 세트 모두 사용된 안테나 때문에 실제로는 성능이 좋지 않았습니다. 전후 보고서에서는 이 안테나가 "성능이 충분하지 않다"고 보고되었습니다. SR-6은 더 작은 안테나를 가진 경량 버전의 SR-3였습니다.
AN/APS-80=AN/APS-80|AN/APS-80은 X-밴드 해상 장거리 공중 탐색 및 지상 탐색 레이더입니다. 이 레이더 세트는 물리적 탐색 안테나를 사용하여 360도의 탐색각도를 제공합니다. 초기형 P-3 오라이언 항공기와 일본의 US-1에 설치되었습니다.
MK32_Mod9_C=324mm 발사관
MK37_GFCS_MK4=Mk.37 GFCS(레이더 Mk.4 "FD")|Mk.37 GFCS(사격 통제 장치)는 5"/38 Mk.12 양용포의 사격 통제 장치입니다. Mk.37 GFCS는 Mk.4 FD 측거 레이더를 장비하고 있으며, 해상 및 공중 표적과 교전이 가능한 성공적 조합을 이룩해냈습니다.
MK37_GFCS_MK12=Mk.37 GFCS(레이더 Mk.12/22)|Mk.37 GFCS(사격 통제 장치)는 5"/38 Mk.12 양용포의 사격 통제 장치입니다. Mk.37 GFCS에는 Mk.12 측거 레이더와 Mk.22 고도측정레이더를 장착했습니다. 이 조합은 1944년 중반까지 대부분의 개장된 함선과 신규함에 장비되었습니다.
MK37_GFCS_MK28=Mk.37 GFCS(레이더 Mk.28)|Mk.37 GFCS(사격 통제 장치)는 5"/38 Mk.12 양용포의 사격 통제 장치입니다. Mk.37 GFCS에는 Mk.28 측거 레이더에 사용되는 작은 접시형 안테나가 장착되어있는데, 이는 상부 중량 문제로 인해 Mk.37 GFCS에 표준 조합인 Mk.12/Mk.22 레이더를 장비할 수 없던 구형 개장 함선들의 중량 절감을 위한 혁신입니다.
MK38_GFCS_MK3=Mk.38 GFCS (레이더 마크 3 "FC")|Mk.38 GFCS(사격 통제 장치)는 전함의 주포에서 대지상/해상 표적 목표를 정확하게 타격하기 위해 사용된 장비입니다. Mk.38 GFCS는 노스 캐롤라이나급 전함, 사우스 다코다급 전함, 아이오와급 전함 및 알래스카급 대형순양함의 함교 구조물 상부에 장갑화되어 탑재되었습니다. Mk.38 GFCS는 Mk.3 'FC' 측거 레이더를 함께 장비했으며, 이 조합은 42년과 43년에 중요한 역할을 한 뒤 Mk.8과 후대의 Mk.13 레이더 조합으로 대체되었습니다.
JL-7=JL-7|JL-7은 개량된 J-7III에 장착된 소련제 사피르-21 레이더의 업그레이드 모델입니다.
AN/ARW-77=AN/ARW-77|AGM-12 불펍을 유도하기 위해 사용되는 송신기입니다.
HY-3=HY-3|HY-3 하이잉 발사대
Plank_Shave=3Ts-25 가르푼|3Ts-25 "가르푼" (NATO 보고명: 플랭크 쉐이브)은 P-15M "테르밋"(SS-N-2 스틱스) 미사일을 탑재한 이동식 대함 발사기 "루베즈"의 탐색 및 사격 통제 레이더입니다.
Plank_Shave_ESM=3Ts-25 가르푼 ESM|3Ts-25 "가르푼" (NATO 보고명: 플랭크 쉐이브)은 P-15M "테르밋"(SS-N-2 스틱스) 미사일을 탑재한 "루베즈" 이동식 지상 발사형 대함 발사대의 지상 레이더입니다.
MK12=Mk.12 기관포|20mm 콜트 Mk.12 기관포|Mk.12는 미국의 20mm 기관포입니다. 분당 1500발의 인상적인 화력 투사가 가능합니다. 1950년대 초부터 1970년대 초까지 미국 해군 전투기와 공격기를 위한 표준 기관포 무장이었습니다.
ZL-1=ZL-1|ZL-1(NATO 보고명:포그 램프)은 중국제 HQ-61 자함방어 대공 미사일의 화력 제어 레이더입니다.
Type_773=773식|773식은 중국의 SH-5 해상 초계기에 사용되는 장거리 지상 탐색 레이더입니다.
SYR-1=SYR-1|SYR-1은 SM-2 미사일로부터 다운링크 명령을 수신하는데 사용되는 미국의 데이터링크 안테나 세트로, 주로 SM-2ER 함정에 사용되며, 이후 NTU는 SM-2MR 및 SM-2ER 함정을 업그레이드했습니다. 이지스 시스템에 비해 성능은 제한적이지만, SM-1 군함에 비해 운용중에 더 많은 미사일을 제공합니다.
AN/APG-53=AN/APG-53A|APG-53A는 A-4 스카이호크가 사용하는 단거리 지상 지도 및 폭격 레이더입니다.
AN/AWG-10B=AN/AWG-10B|AN/AWG-10B는 F-4S에 사용되는 장거리 다중 모드 통합 레이더입니다. 펄스 도플러 기능을 갖추고 있으며, 룩다운/슈턴다운이 가능한 최초의 미국 전투기 레이더입니다.\nAWG-10A에서 고체 전자 장치와 향상된 저고도 성능으로 업그레이드되었습니다.
AN/AWG-11=AN/AWG-11|AN/AWG-11은 장거리 다중 모드 통합 레이더입니다. 펄스 도플러 기능을 갖추고 있으며, 룩다운/슈턴다운이 가능한 최초의 미국 전투기 레이더입니다.\n이것은 F-4J의 AWG-10A 수출 모델로, 영국의 F-4 팬텀과 JASDF T-2에 사용됩니다.
AN/AWG-12=AN/AWG-12|AN/AWG-12는 장거리 다중 모드 통합 레이더입니다. 펄스 도플러 기능을 갖추고 있으며, 룩다운/슈턴다운이 가능한 최초의 미국 전투기 레이더입니다.\n이것은 F-4S의 AWG-10B 수출 모델로, 영국의 F-4 팬텀과 일본 자위대의 F-1에 사용됩니다.
GShG-762=GShG-7.62|GShG-7.62 7.62mm 미니건|GShG-7.62 (9-а-622)는 원래 Mi-24 헬리콥터용으로 개발된 소련의 4총열 회전 기관총입니다.
