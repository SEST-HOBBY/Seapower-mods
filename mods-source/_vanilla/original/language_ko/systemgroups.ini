MGK-335_Hull=MG-335 플라티나|MG-335 "플라티나" (NATO 코드 : 불 혼)는 1970년대 후반의 슬라바급과 소브레멘니급에 사용된 중주파 능동/수동 선체 소나입니다.
MG-342=MG-342 오리온|MG-342 "오리온" (NATO 코드 : 홀스 조)는 1960년대 후반부터 건조된 대형 대잠 순양함들에 탑재된 함체 장착형 대형 저주파 능동/수동 소나입니다. 수심 100m까지 수직으로 전개해 수온약층하에서 음파를 탐지할 수 있는 기능이 있습니다.
MGK-345_Hull=MGK-345 브론자|MGK-345 "브론자"는 스텐카급 어뢰정에 장착된 중주파 능동/수동 소나입니다.
MGK-355_Hull=MGK-355 폴리놈|MGK-355 "폴리놈" (NATO 코드 : 호스 조)은 "무스 조"의 개량형 선체 소나이며, 키로프급과 우달로이급에 장착되어 "호스 테일" 가변심도 소나와 함께 사용됩니다.
