Saphir-23MLA-2=사피르-23MLA-2|사피르-23MLA-2는 MiG-23과 MiG-28에 탑재된 다중 모드 레이더입니다.
Saphir-25=사피르-25|사피르-25는 MiG-25PD에 탑재된 진화된 다목적 레이더입니다.
Smerch-A3=스메르치-A3|스메르치-A3 (NATO 코드: 폭스파이어)는 MiG-25P에 탑재된 다중 모드 레이더입니다.
E-700=E-700|E-700은 단종된 베리예프 P-42 RLDN과 Yak-144 함재조기경보기에 조기 경보 및 전투 통제와 관제 기능을 제공하는 초장거리 대공/대수상 탐색 레이더입니다.
Big_Bulge_A=우스페흐-1A|"우스페흐-1A" (NATO 코드 : 빅 벌지-A)는 Tu-95RT 해상 초계기에 장착된 장거리 수상 탐색 레이더로, 장거리에서 표적을 탐지하여 잠수함이나 수상 전투단에 정보를 전달하는 데 사용됩니다.
Big_Bulge_B=우스페흐-2A|"우스페흐-2A" (NATO 코드 : 빅 벌지-B)는 Ka-25TS 초수평선 표적 지정 헬리콥터에 장착된 장거리 수상 탐색 레이더로, 장거리에서 표적을 탐지하여 잠수함이나 수상 전투단에 정보를 전달하는 데 사용됩니다.
Rubin-1A=루빈-1A|"루빈-1A" (NATO 코드: 숏 혼)은 Tu-16K와 Tu-22에 탑재된 장거리 표면 탐색 및 사격 관제용 레이더입니다.
PNA-B_Rubin=PNA-B 루빈|"PNA-B 루빈" (NATO 코드: 다운 비트)는 Tu-22M2 백파이어에 탑재된 장거리 표면 탐색 및 사격 관제용 레이더입니다.
Wet_Eye=코르슌-K|"코르슌-K" (NATO 코드 : 웻 아이)는 IL-38과 Tu-142M 해상 초계기에 사용되는 수상 탐색 레이더입니다. 이 J-밴드 레이더는 RGB-1 계열 소노부이로부터 정보를 획득합니다.
Orion-A=오리온-A|오리온-A (NATO 코드 : 드롭 킥)는 전천후 공격기 Su-24용 다중 목적 레이더입니다.
Mushroom=이니치야티바|"이니치야티바" (NATO 코드 : 머시룸)는 헬리콥터에 탑재하는 수상 탐색 레이더입니다. Ka-25는 "이니치야티바-2M"을, Mi-14는 "이니치야티바-2K"를 사용합니다. 이 J-밴드 레이더는 RGB-1 계열 소노부이로부터 정보를 획득합니다.
Sablya=사블랴|사블랴 측방 탐색 항공 탑재 레이더(SLAR)는 MiG-25RB에서 사용됩니다.
