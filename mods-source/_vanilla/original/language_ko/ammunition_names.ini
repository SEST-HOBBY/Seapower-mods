usn_an_slq_25_nixie_decoy=AN/SLQ-25,닉시,디코이,닉시(정식명칭은 AN/SLQ-25)는 예인형 기만체 시스템으로 미 해군의 수상함들에서 찾아볼수 있습니다. 닉시 예인형 기만체 시스템은 어뢰에 목표물이 된 함선에서 떨어저 유도 신호를 발산하여 어뢰의 추적을 목표물 함선에서 떨어트리는데에 중점을 두고 있습니다.
usn_moss=MOSS,MK-70,디코이,Mk 70 MOSS(기동형 잠수함 시뮬레이터)는 25.4cm 기만체로 적군의 소나를 유인하기 위해 설계되었습니다. MOSS는 잠수함 본연의 소음뿐만 아니라 능동 소나까지 발현할수 있습니다.
wp_mg-44=MG-44,코룬드,디코이,MG-44 코룬드는 2세대 자가추진식 수중청음식 잠수함 기만체입니다. 소련 잠수함들에 설치된 400mm 발사관에서 발사되도록 설계되었습니다.
