usn_mk46_air=Mk.46 모드 2,,대잠 어뢰,Mk.46 모드 2 어뢰는 여러 국가에서 사용하는 NATO의 표준 경어뢰입니다. 소련의 최신예 잠수함을 공격하기 위해 설계되었으며 해당 파생형은 공중 투하형입니다.
wp_45-36nu=45-36NU,,대함 어뢰,45-36NU는 제2차 세계대전 이전에 설계된 구식 450mm 무유도 어뢰로, 1930년대 초 설계된 이탈리아산 45-F 및 53-F 어뢰에 크게 영향을 받았습니다. 530mm보다는 경량에 상대적으로 약한 화력으로 1950년대에는 꽤 비효율적인 무기가 되었습니다. 하지만 때로는 가진 것으로 해결해야 할 때가 있습니다.
wp_53-39=53-39,,대함 어뢰,53-39는 제2차 세계대전 시기의 구식 무유도 중어뢰입니다. 53-39 어뢰는 비교적 단순하여 신뢰성이 높고 효과적입니다.
usn_ssq-62=AN/SSQ-62,DICASS,능동 소노부이,AN/SSQ-62 DICASS는 SSQ-53 수동형 소노부이로 위치가 파악된 잠수함의 정확한 위치를 확인하는 데 사용되는 능동형 소노부이입니다.
wp_rgb-3=RGB-3,,능동 소노부이, RGB-3는 소련에서 사용하는 능동형 소노부이입니다.
swe_375mm_rocket=보포스 M/50,,대잠 박격포,보포스 M/50는 스웨덴제 375 mm 대잠로켓 발사대입니다.
jmsdf_type80=80식,,어뢰,80식 어뢰. 1970년대 GRX-1 및 GRX-2 연구 프로그램의 결실로, 미 해군의 Mk.37 설계에 영향을 받았습니다. 이 대함/대잠용 유선 유도 어뢰는 Mk.37보다 추진력, 성능 및 사거리 측면에서 앞섭니다.
wp_as-2b=K-10SP,,ASM,K-10SP는 탄두를 아잘리야 재머 시스템으로 교환한 K-10S 미사일의 개량 버전입니다
jmsdf_type54=54식,,어뢰,54식 3형 개(改)1 어뢰. 제2차 세계대전 이후 일본이 처음으로 설계한 어뢰입니다. 초기형은 발사 후 고장이 잦은 등 성공적이지 못했으나, 여러 차례 재설계를 거쳐 대량 생산된 3형 개(改)1에서 완성되었습니다.
usn_mk37=Mk.37 모드 0,,어뢰,Mk.37 모드 0 어뢰는 여러 국가에서 사용하는 미국 해군의 표준 대잠 경어뢰입니다. 1959년에 도입되었으며 소련의 현대식 고성능 잠수함을 상대하기에는 너무 느리고 성능은 뒤떨어졌습니다.
wp_sa-4=2K11,크루그,SAM,2K11 크루그(SA-4 가네프)는 소련의 이동식 중거리 지대공 미사일 체계입니다. 넓은 범위에서 접근하는 폭격기에 대응하기 위해 개발되었습니다.
usn_cal_75mm=75mm
wp_sa-6=2K12,쿠브,SAM,2K12 쿠브(SA-6 게인풀)는 소련의 이동식 지대공 미사일 체계입니다. 주로 24km 이내의 단거리 대공 목표물에 대응하기 위해 설계되었습니다.
wp_sa-13=9K35,스트렐라-10,SAM,9K35 스트렐라-10(SA-13 고퍼)은 소련의 고기동 단거리 지대공 미사일 체계입니다. 주로 저고도에서 활동하는 적군의 헬리콥터와 같은 갑작스러운 위협에 대응하기 위해 설계되었습니다.
jsdf_sam1=81식,,지대공 미사일,일본의 적외선유도 단거리 지대공 미사일입니다. 82식 지대공 미사일 체계의 일부입니다. 탄-샘으로도 불립니다.
usn_cal_203mm=203mm
usa_m26=M26,,MLRS,M26은 미 육군의 M270 다연장로켓 시스템(MLRS)에서 사용하는 227mm 무유도 로켓입니다. M26 로켓 1기에는 최대 2000㎡를 커버할수 있는 800개의 자탄을 탑재하고 있습니다.
usn_agm-84a=AGM-84A,하푼,대함 미사일,하푼은 NATO 소속 국가들에서 널리 사용되는 미국의 대함미사일입니다. 하푼에는 사전 프로그래밍된 경로를 따른 후 활성화되는 능동레이더 탐색기가 장착되어 있습니다. AGM-84 계열은 항공기 탑재용입니다.
usn_agm-84d=AGM-84D,하푼,대함 미사일,하푼은 NATO 소속 국가들에서 널리 사용되는 미국의 대함미사일입니다. 하푼에는 사전 프로그래밍된 경로를 따른 후 활성화되는 능동레이더 탐색기가 장착되어 있습니다. AGM-84 계열은 항공기 탑재용입니다. AGM-84는 1985년에 나온 새로운 개량형입니다. AGM-84D에는 개선된 전자 방해 대응책을 가지고 있으며 또한 개선된 연료로 더 긴 사거리를 지녔습니다.
usn_rgm-84a=RGM-84A,하푼,대함 미사일,하푼은 NATO 소속 국가들에서 널리 사용되는 미국의 대함미사일입니다. 하푼에는 사전 프로그래밍된 경로를 따른 후 활성화되는 능동레이더 탐색기가 장착되어 있습니다. RGM-84A 계열은 수상함 탑재용입니다. 또한 종말기동시 팝업 기동을 수행합니다.
usn_rgm-84c=RGM-84C,하푼,대함 미사일,하푼은 NATO 소속 국가들에서 널리 사용되는 미국의 대함미사일입니다. 하푼에는 사전 프로그래밍된 경로를 따른 후 활성화되는 능동레이더 탐색기가 장착되어 있습니다. RGM-84C 버전은 수상함 발사형으로 종말 유도시 팝업 기동을 하지 않는 대신 시 스키밍 기동으로 적 함선들을 더욱 효율적으로 공격합니다.
usn_ugm-84b=UGM-84B,하푼,,하푼은 NATO 소속 국가들에서 널리 사용되는 미국의 대함미사일입니다. 하푼에는 사전 프로그래밍된 경로를 따른 후 활성화되는 능동레이더 탐색기가 장착되어 있습니다. UGM-84B 버전은 영국 왕립 해군을 위해 개발된 버전으로 잠수함에 탑재되어 운용되는것을 상정하였습니다, 이전의 UGM-84A와는 다르게 종말 유도시 팝업 기동을 하지 않으며 대신 시 스키밍 기동으로 적 함선들을 더욱 효율적으로 공격합니다.
usn_rim-24b=RIM-24B,Tartar,SAM/ASuW,The RIM-24 Tartar is a short-range radar guided SAM with secondary anti-ship capability. Being the short range component of the "3T" (Talos, Terrier, Tartar) missile family, RIM-24B shares components with the RIM-2E Terrier missile, and has improved performance over the original RIM-24A.
usn_agm-78=AGM-78,,대레이더 미사일,AGM-78 표준 대레이더 미사일(STARM)은 스탠드오프 거리에서 고등급의 SAM 사이트와 교전하기 위한 미국의 장거리 대레이더 미사일입니다. STARM은 SM-1MR SAM에서 파생된 것으로, 장거리를 달성하기 위해 장기간 연소되는 추진체와 매끄러운 형상을 가지고 있으며, 강력한 탄두를 가지고 있어 어떤 레이더 시스템을 타격하더라도 파괴할 수 있습니다. 안타깝게도 이 무기는 비싸고 희귀한 무기이기 때문에 언제든지 사용할 수는 없습니다.
usn_cal_35mm=35mm
usn_ugm-84a=UGM-84A,하푼,대함 미사일,하푼은 NATO 소속 국가들에서 널리 사용되는 미국의 대함미사일입니다. 하푼에는 사전 프로그래밍된 경로를 따른 후 활성화되는 능동레이더 탐색기가 장착되어 있습니다. UGM-84A 계열은 잠수함 탑재용으로 일회용 캐니스터를 사용합니다. 또한 종말기동시 팝업 기동을 수행합니다.
wp_sa-n-1c=M-1,볼나-P,SAM/ASuW,SA-N-1C 고아(M-1 볼나-P)는 기존 초창기 소련 함대공 미사일 시스템의 개량형으로 재밍과 채프 기만채에 대한 대응능력이 강화되었으며 저공비행하는 목표물에도 효과적입니다.
wp_fueltank3000_w=3000 L. 드롭탱크
wp_aa-2a=R-3S,빔펠,적외선 유도 공대공 미사일,빔펠 R-3S(AA-2A 아톨)은 소련제 후방 추적 전용 적외선 유도 공대공미사일로 미국산 AIM-9B을 역설계하여 약간의 성능의 개선이 이루어진 물건입니다. 목표 항공기의 후방만 추적 가능합니다.
wp_aa-2c=R-3R,빔펠,SARH AAM,빔펠 K-13/R-3R(AA-2C 아톨)은 소련제 반능동 레이더 추적 공대공미사일로 미국산 AIM-9B를 역설계하여 기반으로 삼았지만 기존의 적외선 시커 대신 반능동 레이더 추적 시커를 장착했습니다. 이러한 점들을 제외하면 미국산 원본과 동일한 단점들을 보유했습니다.
wp_aa-2-2=K-13M1,빔펠,적외선 유도 공대공 미사일,빔펠 K-13M1(AA-2-2 어드밴스드 아톨)은 소련제 R-3S 미사일(소련이 AIM-9B를 역설계한 미사일)에 기반들 둔 개량형으로 새로운 추진 모터와 시커를 장착하여 성능이 개선되었습니다.
wp_as-14a=Kh-29L,,대함 미사일,Kh-29L(AS-14A 케지)는 소련제 초음속 대함 미사일로 강력한 위력과 레이저로 유도가 가능합니다.
wp_as-14b=Kh-29T,,대함 미사일,Kh-29T(AS-14B 케지)는 소련제 초음속 대함 미사일로 강력한 탄두와 더욱 늘어난 사거리를 위해 광학추적식 시커를 장착했습니다. 하지만 그 결과로 야간에서의 성능은 저하되었습니다.
wp_rgb-12=RBU-1200,,대잠 박격포,RBU-1200 (혹은 스메르치-3)은 251mm 구경의 소련제 대잠 로켓 발사기로 RBU-1200은 대략 1,097.2m(1200yd)의 사거리를 지녔습니다.
wp_ss-n-3b=P-35,레투스,대함 미사일,P-35(SS-N-3B 셰팔)는 잠수함에서 발사 가능한 대함미사일로 기존의 P-35 대함미사일과 비교하여 저고도에서 비행하며 재밍과 기만체에 대한 더 나은 저항력을 지녔습니다.
usn_pilot_president_pod=미합중국 대통령 전용 탈출 포드
wp_sa-8=9K33M3,오사,SAM,9K33M3 오사(SA-8 겍코)는 소련제 지대공 미사일 체계로 기갑사단과 차량화보병 사단들에게 근거리 대공능력을 제공하기 위해 설계되었습니다.
wp_s-24=S-24,,FFAR,S-24 240mm 날개 접이식 항공 로켓(FFAR)은 소련에서 개발된 물건으로 주로 전폭기들과 헬기등에서 사용됩니다. 다른 로켓 종류들과는 다르게 그 크기로 인하여 1발씩만 장착하여 사용됩니다.
wp_cal_76mm_d56=76mm
wp_rbk-500=RBK-500,,집속탄,RBK-500은 소련의 500kg(1100 lb) 집속탄입니다.
usn_cal_5in38=127mm
wp_at-10=9M117,바스티온,지상 공격,9M117 바스티온(AT-10 새버)은 T-55M이 사용하는 소련의 포발사 미사일입니다.
usa_mim-14=MIM-14,나이키 허큘리스,대공 미사일,MIM-14 나이키 허큘리스는 미국과 NATO군이 중-고고도 방공을 위해 사용하는 지대공 미사일 체계입니다.
usn_mk37_mod1=Mk.37 모드 1,,어뢰,Mk.37 모드 1 어뢰는 여러 국가에서 사용하는 미국 해군의 표준 대잠 경어뢰입니다. 1959년에 도입되었으며 소련의 현대식 고성능 잠수함을 상대하기에는 너무 느리고 성능은 뒤떨어졌습니다. 모드 1은 속도를 일부 희생하는 대신 유선 유도 방식이 추가됐습니다.
wp_sa-11=9K37,부크,대공 미사일,9K37 부크(SA-11 가드플라이)는 소련의 이동식 지대공 미사일 체계입니다. 9K37 부크는 약 29km(18mi)까 단거리 위협에 대응하기 위해 설계되었습니다.
plan_hq-61=HQ-61,,함대공 미사일,HQ-61은 중국의 함대공 미사일로 중국 인민해방군 해군을 위해 개발된 최초의 함대공 미사일입니다. HQ-61은 1980년대에 실전 배치되었지만, 동시대 미사일과 비교해서 성능이 현저히 떨어지며, 성능 면에서는 미국의 RIM-7E "씨 스패로우" 미사일과 대강 비슷한 정도입니다.
plan_sy-1=SY-1,상유,대함 미사일,SY-1는 중국이 면허생산한 P-15입니다.
plan_sy-1a=SY-1A,,대함 미사일,SY-1A는 소련의 스틱스 미사일의 중국 개발품으로, 개선된 시커와 씨스키밍 터미널 비행 단계를 갖추고 있으며, 함선뿐만 아니라 육상 발사대에서도 사용할 수 있습니다.
plan_hy-1=HY-1,,대함 미사일,HY-1는 중국이 소련의 P-15(스틱스) 대함 미사일을 기반으로 개발한 파생형으로, 연료 탱크가 증설되어 사거리가 길어졌습니다.
plan_hy-1j=HY-1J,섀플라워,대함 미사일,HY-1J는 HY-1 미사일의 해상 버전으로, 다른 모든 특성에서 동일한 성능을 발휘합니다.
plan_hy-1a=HY-1A,,대함 미사일,HY-1A(CSS-N-2 섀플라워)는 개선된 시커와 레이더 고도계를 갖춘 중국의 HY-1J 개량형으로, 씨스키밍 터미널 비행 단계를 가능하게 합니다.
plan_hy-2=HY-2,,대함 미사일,HY-2(CSS-N-3 시어서커)는 HY-1 미사일의 파생형으로, 사거리를 늘리기 위해 연료 탱크를 더욱 확장했습니다. 이것은 HY-2를 전적으로 육상 운용형으로 만듭니다. 왜냐하면 어떤 함재기 발사체도 이를 수용할 만큼 충분히 길지 않기 때문입니다.
pla_yj-6=YJ-6,크라켄,공대함 미사일,YJ-6(CH-AS-1 크라켄)는 지상/수상함 발사형인 SY-1/HY-1을 기반으로 개발된 중국의 공대함 미사일입니다. 공중 발사 방식으로 사거리가 더 길지만, 초기형 탐색기를 장착하고 있어 다른 초기형 대함 미사일인 스틱스 혹은 실크웜 계열 미사일처럼 전자 대응책에 취약합니다.
plan_yj-8=YJ-8,사딘,대함 미사일,YJ-8(NATO명: CSS-N-4 사딘)은 프랑스의 엑조세 미사일과 유사하며 대강 비슷한 성능을 갖춘 중국의 대함 미사일입니다. 발사 이후 YJ-8은 20~30m까지 상승한 후 씨스키밍 비행 방식으로 공격하기 위해 5~7m까지 하강합니다.
plan_type62dc=FQF-1200,,대잠박격포,FQF-1200은 중국의 5연장 대잠 박격포입니다.
plan_type75dc=FQF-2500,,대잠박격포,FQF-2500은 중국의 12연장 대잠 박격포입니다.
it_a-244s_air=A-244,,대잠 어뢰,이탈리아제 공중 투하용 대잠 경어뢰입니다. 능동/수동형 추적 방식을 갖추었습니다.
plan_yu-1=Yu-1,,대함어뢰,Yu-1(어(魚)-1형)은 중국의 첫 국산 중어뢰입니다. 무유도 어뢰이지만 비교적 단순한하여 신뢰성이 높고 효과적입니다.
plan_yu-3=Yu-3,,대잠 어뢰,Yu-3(어(魚)-3형)은 중국의 대잠 중어뢰로 수동형 추적 방식을 사용합니다. Yu-3은 속도가 느리기에 고속 표적은 어뢰를 따돌릴 수도 있으며, 따라서 디젤-전기 추진식 잠수함을 공격하기에 적합합니다. 탐색기의 최대 탐지거리는 약 1600야드입니다.
plan_yu-4=Yu-4A,,대함 어뢰,Yu-4A(어(魚)-3형)은 중국의 수동형 추적 방식을 가진 대함 중어뢰입니다. 속도가 느리기에, 매우 근거리에서만 효과적일 것으로 유추됩니다.
pla_type-2=2식-100,,폭탄, 2식-100kg 폭탄은 중국의 자유 낙하형 항공 폭탄으로 소련의 FAB-100과 유사합니다.
pla_type-3-250=3식-250,,폭탄,3식-250kg은 중국의 자유 낙하형 항공 폭탄으로 소련의 FAB-250과 유사합니다.
pla_type-3-500=3식-500,,폭탄,3식-500kg은 중국의 자유 낙하형 항공 폭탄으로 소련의 FAB-500과 유사합니다.
plan_cal_85mm_lt=85mm
plan_cal_130mm=130mm
pla_pl-2=PL-2A,,적외선 유도 공대공 미사일,PL-2(霹雳-2/벽력-2)는 중국 후방 추적 적외선 공대공 미사일입니다. PL-2는 소련의 빔펠 K-13 미사일의 복제품으로, 매우 유사한 성능을 가지고 있습니다. 후방 추적만 가능합니다.
jasdf_asm-1=ASM-1,,대함 미사일,ASM-1은 일본의 대함 미사일로 공중 발사식 파생형입니다.
pla_depth_charge=폭뢰,DC,DC,중량 150kg짜리 항공기 투하 폭뢰로 대잠전에 쓰입니다.
plan_skf-1=SKF-1,,수동 소노부이, SKF-1은 1960년대부터 중국 인민해방군 해군에서 사용한 수동형 전방향 소노부이입니다.
plan_skf-2=SKF-2,,수동 소노부이, SKF-2은 1970년대 중반부터 중국 인민해방군 해군에서 사용한 수동형 전방향 소노부이입니다.
usn_agm-12b=AGM-12B,불펍,대함 미사일,AGM-12 불펍은 미국의 공중 발사 초음속 장거리 미사일입니다. 소련의 Kh-23 "그롬"과 유사하게 조종사가 미사일을 수동으로 직접 조작해야 하며, 또한 목표까지 항공기를 일직선으로 계속 비행시켜야 하는 동일한 문제점을 가지고 있습니다.
pla_yj-1="YJ-1,사플스,대함 미사일,YJ-1(CSS-X-5 사플스)은 공중 발사 단거리 초음속 공대함 미사일로 속도는 마하 2를 넘으며 종말 단계에서는 씨 스키밍으로 기동합니다. YJ-1은 정식으로 채용되지 않았지만 1980년대 후반에 소수의 미사일이 생산되었으며, 주로 SH-5 비행정에서 사용될 예정이었습니다. "
pla_hy-3=HY-3,소호스,대함 미사일,HY-3(CSS-C-6 소호스)은 램제트 추진 초음속 지대함 미사일로 속도는 마하 2.5에 달하며 사거리는 130~180km입니다. 1990년대 초반에 개발이 완료되었지만 실전 배치되지는 않았습니다.
wp_plab-100=PLAB-100,,폭뢰,PLAB-100은 소련과 그 동맹국들이 주로 사용하는 100kg (220lb) 대잠수함 항공폭탄입니다.
usn_mk54_dc=Mk.54,,폭뢰,마크 54 대잠 폭탄은 제2차 세계 대전 동안 설계된 미국의 항공 대잠 폭탄으로, 냉전기에도 운용되었습니다.
usn_ssq-41=AN/SSQ-41,LOFAR,소노부이,SSQ-41A "지제벨"은 저주파 분석 및 기록(LOFAR) 유형의 소노부이입니다. 이것은 가장 흔한 NATO 패시브 소노부이로, 이후의 DIFAR 소노부이처럼 방위각을 특정할 수 있는 능력은 없지만 여전히 상당한 민감도를 가지고 있으며, 어떤 서방 해군이든 비축분을 대량으로 찾을 수 있습니다.
usn_ssq-47=AN/SSQ-47,줄리,능동 소노부이,SSQ-47A "줄리"는 연속적 능동 대역 전용 소노부이입니다. 이것은 가장 일반적인 NATO 활동 소노부이로, 이후 DICASS 소노부이처럼 방위각을 특정할 수 있는 능력은 없지만, 여러 개의 부이로 이전에 탐지된 표적을 '정정'하는데 여전히 유용합니다. 지속적이고 활발한 핑의 결과로, 이 소노보이의 수명은 단 30분에 불과합니다.
usn_ssq-77=AN/SSQ-77,VLAD,소노부이,SSQ-77A는 VLAD 유형(직선 배열 DIFAR) 패시브 소노부이로, 원래의 DIFAR 타입 패시브 소노부이를 세대별로 개선하도록 설계되었습니다. 이 부이는 DIFAR 부이와 유사한 구조를 가지고 있지만, 매우 민감한 소나 배열을 포함하고 있어 소노보이에게 매우 긴 비능동 대역대를 제공하고, 저소음에 깊게 잠항한 목표물에 대해 높은 성능을 보이며, 탁하고 소음이 발생하는 물에서 작동하는 우수한 성능을 보입니다.\n\n이 더 나은 성능의 결과는 이 부표의 무게와 비용입니다. 이는 이 부표들이 덜 흔하며, 거리면에서의 정확도가 낮기 때문에 주로 수중 표적의 위치를 파악하는 데 유용합니다.
usn_mk16=Mk.16,,대함 어뢰,마크 16 어뢰는 1950년대와 1960년대에 미국 공격 잠수함의 빠르고 매우 강력한 대함 어뢰로 사용된 제2차 세계대전 당시의 고전적인 직선형 어뢰입니다. 부족한 유도 성능에도 불구하고, 단거리 사격은 크기에 상관없이 거의 확실히 어떠한 목표물도 침몰시킬 것입니다. 모드 8 파생형은 모드 0의 고화력 탄두와 모드 1 어뢰의 더 긴 사거리를 갖고 있습니다.
usn_d-704=D-704 급유 포드
pla_pl-2b=PL-2B,,적외선 유도 공대공 미사일,PL-2(霹雳-2/벽력-2)는 중국제 후방추적용 적외선 탐지 공대공 미사일입니다. L-2B는 약간 개선된 시커를 수용하기 위해 더 긴 노즈콘을 사용하고, PL-2A에 비해 신뢰성이 약간 향상되었습니다.
pla_pl-5b=PL-5B,,적외선 유도 공대공 미사일,PL-5B(霹雳-5/벽력-5)는 중국제 후방추적용 적외선 탐지 공대공 미사일입니다. PL-2B와 함께 개발된 PL-5B는 실패한 레이더 유도 방식의 PL-5A 미사일에서 탄생했습니다. PL-2B에서 파생된 적외선 시커를 사용하지만, 사거리와 선회력 면에서 더 뛰어난 성능을 갖추고 있습니다. 후방 추적만이 가능합니다.
pla_pl-5c=PL-5C,,적외선 유도 공대공 미사일,PL-5C(霹雳-5/벽력-5)는 중국제 후방추적용 적외선 탐지 공대공 미사일입니다. PL-2 및 PL-5B의 주요 개선 사항을 적용한 PL-5C는 최첨단 교차배열 시커를 포함하고 있어 전방위 사격과 상당한 수준의 기만체 저항을 가능하게 합니다. 또한 더 긴 연소 모터와 향상된 선회력을 자랑합니다.
usaf_aim-9p=AIM-9P,사이드와인더,공대공 미사일,AIM-9P 사이드와인더는 미국의 적외선 유도 공대공 미사일입니다. P형은 J형의 수출형으로, 새로운 신관, 새로운 모터, 개선된 시커가 특징이며 측면 락온이 가능하고 더 높은 신뢰성을 제공합니다.
usn_aim-7e2=AIM-7E-2,스패로우,공대공 미사일,AIM-7E-2 "도그파이트" 스패로우는 미국의 반능동 레이더 유도 공대공 미사일입니다. E-2형은 베트남군 전투기와의 성능에서 결함이 발견된 E형의 하위 파생형입니다. 최소교전거리가 짧고, 저고도 성능이 약간 향상되었으며, 비행 중 추진 단계에서 기동성이 약간 향상된 것이 특징입니다.
usn_aim-7e4=AIM-7E-4,스패로우,공대공 미사일,AIM-7E-4 스패로우는 미국의 반능동 레이더 유도 공대공 미사일입니다. E-4는 이전 전투기보다 훨씬 강력한 레이더를 활용하기 위한 업그레이드된 미 해군 모델로, 재밍과 기만체에 대한 시커 능력이 약간 개선되었습니다.
usn_aim-7f=AIM-7F,스패로우,공대공 미사일,AIM-7F 스패로우는 미국의 반능동 레이더 유도 공대공 미사일입니다. F형의 원본은 스패로우 III을 재설계한 것으로, 더 긴 비행 거리를 위한 현대적인 연소 지속 모터와 향상된 신관 작동 및 더 유능한 전방 시커를 포함하고 있으며, 모든 면에서 성능이 향상되었습니다.\n그럼에도 불구하고, 저고도 ECCM 성능이 여전히 뛰어나지 않으며, 시커는 이 미사일의 긴 사거리를 충분히 활용할 수 없게 만듭니다.
usn_aim-9g=AIM-9G,사이드와인더,공대공 미사일,AIM-9G 사이드와인더는 미국의 적외선 유도 공대공 미사일입니다. G형은 D형에 비해 개선된 파생형으로, 더 큰 발사각을 가지고 있으며 다른 국가로도 수출되었습니다. 후방 추적만 가능합니다.
usn_aim-9h=AIM-9H,사이드와인더,공대공 미사일,AIM-9H 사이드와인더는 미국의 적외선 유도 공대공 미사일입니다. H형은 G형에 반도체를 사용한 버전으로, 측면 락온도 가능한 더 민감한 시커와 향상된 기동성 및 신뢰성을 자랑합니다.
usn_aim-9m=AIM-9M,사이드와인더,공대공 미사일,AIM-9M 사이드와인더는 미국의 적외선 유도 공대공 미사일입니다. M형은 가장 최신 모델로, L형에서 플레어 미추적 기능이 향상되고 시커 사거리가 더 깁니다.
usn_rim-7h=RIM-7H,씨 스패로우,함대공 미사일,RIM-7H 씨 스패로우는 단거리 함대공 미사일로, NATO의 주요 개함방공 미사일입니다.\nH형은 전반적으로 E형과 매우 유사하지만, RIM-7H는 신형 발사기에 탑재할 수 있는 접이식 핀을 갖추고 있으며 신뢰성이 약간 향상되었습니다.
usn_agm-88a=AGM-88A,HARM,대레이더 미사일,AGM-88A HARM(고속 대레이더 미사일)은 모든 부문에서 뛰어난 성능을 자랑하는 미국의 장거리 대레이더 미사일입니다. HARM은 1985년까지 NATO 무기중에서 가장 최신의 대레이더 미사일로, 특히 신뢰성과 최대 속도를 포함한 거의 모든 범주에서 이전 미사일들을 능가합니다. 이 미사일은 매우 최신 보급품이기 때문에, 한 번에 제한된 숫자(또는 전혀 사용하지 않거나)만 사용할 수 있습니다.
usn_aim-9c=AIM-9C,사이드와인더,공대공 미사일,AIM-9C 사이드와인더는 미국의 적외선 유도 공대공 미사일입니다. C형은 유일하게 운용되는 레이더 유도식 사이드와인더로, 반능동 레이더 시커를 제외하면 D형과 동일하여 더 먼 거리에서 전방위 락온이 가능합니다. F-8 크루세이더에게만 운용되고었고 승무원들이 일반적으로 선호하지 않았기에 AIM-9C는 취역 후 몇 년 만에 퇴역했습니다.
rn_seacat_mk2=GWS-24,씨캣 Mk.2,대공 미사일,GWS-24 씨캣은 개선된 저고도 성능, 더 긴 사거리, 더 높은 신뢰성을 갖춘 씨캣 Mk.1 (GWS-20)의 업그레이드된 모델로, 더욱 발전된 발사 제어 시스템과 결합되어 있습니다. 안타깝게도 이것은 여전히 매우 낮은 성능의 미사일이며, 효율성이 의심됩니다.
usn_agm-122a=AGM-122A,사이드암,대레이더 미사일,AGM-122A는 헬리콥터와 고정익 항공기에서 사용할 수 있도록 설계된 단거리 전술 대레이더 미사일입니다. 짧게 운용된 AIM-9C를 개조한 사이드암은 돌발성 단거리 방공 위협에 대응하기 위한 효과적인 단거리 대레이더 미사일이지만, 단단한 방공망에 사용하기에는 적합하지 않습니다.
usn_mk-82_snakeye=Mk.82,스네이크아이,폭탄,마크 82 "스네이크아이"는 227kg(500lb)의 저항력 범용 무유도 폭탄으로, 전개 핀이 장착되어 있습니다. 항공기가 고속 및 저고도에서 폭탄을 투하하는 '레이다운'에 유용하며, 항공기가 상승기동이나 급강하 없이 고속 저고도로 폭탄을 투하하기 때문에 비행시간이 늘어나는 단점이 있습니다.
usn_tank_60gal_sh-2=227 L. 드롭탱크
usaf_bolt-117=BOLT-117,,유도 폭탄,BOLT-117은 미국의 340kg(750 lb) 레이저 유도 폭탄입니다. BOLT-117은 M117을 개조한 무기이며, 기수 부분에 레이저 탐색기와 유도용 날개 추가되었습니다.
usaf_gbu-11=GBU-11,페이브웨이 I,유도 폭탄,GBU-11은 미국의 1400 kg(3000 lb) 레이저 유도 폭탄입니다. GBU-11은 높은 폭발력으로 교량 혹은 벙커와 같은 하드 타겟을 공격하기 위해 설계된 초중량 유도 폭탄입니다.
usaf_m118=M118,,파괴 폭탄,M118은 교량, 벙커, 요새, 철도 및 기타 복원력 있는 구조물과 같은 강점 표적에 사용하기 위해 설계된 미국의 1400kg (3000lb) 초중량 파괴 폭탄입니다.
wp_as-12=Kh-25MP,,대레이더 미사일,Kh-25MP(AS-12 케글러)는 소련제 공중 발사 초음속 중거리 대레이더 미사일입니다. Kh-25MP는 소련에서 운용한 가장 일반적인 대레이더 미사일로 미국의 AGM-45 "슈라이크"와 비슷합니다.
ran_ikara=GWS-40,이카라,대잠미사일,GWS-40 이카라는 로켓 모터로 구동되는 호주의 대잠 순항미사일로 수중 위협을 격퇴하기 위해 Mk-46 혹은 Mk-44 어뢰를 전개합니다. 미국의 ASROC보다 사거리가 2배 길지만, 이카라는 느리고 발사 방식 때문에 여러발을 빠르게 전개할 수 없습니다.
usn_rim-66e=RIM-66E,SM-1MR,SAM/ASuW,The Standard Missile 1 is a family of radar-homing area-defense surface to air missiles (with a secondary short-range anti-ship capability) characterized by their long-burning sustainers and well-rounded performance against most threats. Standard Missile 1 was designed as a more reliable upgrade to the earlier RIM-2 Terrier and RIM-24 Tartar missiles, but still shares their limitations in fire control capacity.\n\nSM-1MR Block VI (RIM-66E) is the Medium Range version of the SM-1 series, the Block VI upgrade includes electronics from Block I SM-2MR (RIM-66C/D) such as an improved monopulse seeker and new warhead, and also includes an improved fuze to better track sea-skimming targets.
usn_mk44_air=Mk.44,,대잠 어뢰, 나토의 이전 세대 대잠 어뢰인 Mk.44어뢰는 냉전 기간 내내 사용된 무기이기도 합니다. Mk.44는 우수한 신뢰도가 특징이지만 짧은 사거리와 느린 속도로 인해 빠르고, 깊게 잠수하는 잠수함을 상대하기에는 버겁습니다.\n이 모델은 공중 투하형입니다.
usn_mk44_ship=Mk.44,,대잠 어뢰, 나토의 이전 세대 대잠 어뢰인 Mk.44어뢰는 냉전 기간 내내 사용된 무기이기도 합니다. Mk.44는 우수한 신뢰도가 특징이지만 짧은 사거리와 느린 속도로 인해 빠르고, 깊게 잠수하는 잠수함을 상대하기에는 버겁습니다.\n이 모델은 수상함 발사형입니다.
usn_gbu-16=GBU-16,페이브웨이 II,유도 폭탄,GBU-16 페이브웨이 II는 미국의 460kg(1000 lb) 레이저 유도 폭탄입니다. GBU-16는 Mk.83이 모체이며 전면부에 레이저 시커와 후면부에는 유도용 꼬리날개를 달았습니다.
wp_fab-500_m54="FAB-500,M-54,폭탄,FAB-500은 소련이 설계한 500kg(1100lb) 범용 공중 투하 폭탄입니다. 고폭 탄두를 장착하고 있으며 소련과 소련의 동맹국에서 운용했습니다. FAB-500은 더 짧고, 중간 항력을 가진 폭탄으로 내부 무장창에 대량으로 탑재하기 위해 설계되었지만, 저항력 폭탄 대비 정확도가 떨어지는 단점이 있습니다. "
wp_kab-500l=KAB-500L,,유도 폭탄,KAB-500L은 소련이 설계한 500kg(1100lb) 레이저 유도 공중 투하 폭탄입니다. 고폭 탄두를 장착하고 있으며 소련과 소련의 동맹국에서 운용했습니다. KAB-500L은 FAB-500에 기반했으며, 레이저 유도를 위한 레이저 탐색기과 날개가 추가된 형식입니다.
fr_as11=AS.11,,지상 공격,SS.11/AS.11은 프랑스가 개발한 지령 유도식 단거리 대전차 미사일입니다. AS.11은 대전차용 성형작약 탄두 대신에 소형 보트를 공격하기 위한 반철갑 탄두를 장착하고 있습니다.
fr_as12=AS.12,,대함 미사일,AS.12는 프랑스가 개발한 지령 유도식 헬리콥터 탐재 단거리 대함 미사일입니다. SS.11 대전차 미사일에서 개량된 형식으로 더 오래가는 모터와 더 큰 탄두를 탑재했습니다. 소형 보트뿐만 아니라 소형 선박에게도 심각한 위협이 될 수 있습니다.
wp_at-6=9M114,코콘,지상 공격,9M114 코콘(AT-6 스파이럴)은 일부 공격 헬리콥터, 특히 Ka-29와 Mi-24에 사용하는 소련의 초음속 대전차 미사일입니다. 긴 사거리, 빠른 속도 그리고 강력한 탄두가 9M114의 특징입니다.
usn_rim-66g=RIM-66G,SM-2MR,SAM/ASuW,The Standard Missile 2 is a family of radar-guided area-defense surface to air missiles (with a secondary short-range anti-ship capability) characterized by their long-burning sustainers and well-rounded performance against most threats. Standard Missile 2 replaces the semiactive radar-homing SM-1 seeker with an advanced datalink midcourse guidance, with terminal radar homing at the last few seconds of flight. SM-2 allows for many more missiles to be kept in the air at once than there are illuminators, providing a massive advantage over SM-1 armed ships.\n\nSM-2MR Block II (RIM-67G) is the AEGIS (Mark 26) version of the SM-2 Block II family, with a new booster to dramatically increase range, and includes a new fuze to improve performance against low-flying and high speed targets.
usn_rim-67c=RIM-67C,SM-2ER,SAM/ASuW,The Standard Missile 2 is a family of radar-guided area-defense surface to air missiles (with a secondary short-range anti-ship capability) characterized by their long-burning sustainers and well-rounded performance against most threats. Standard Missile 2 replaces the semiactive radar-homing SM-1 seeker with an advanced datalink midcourse guidance, with terminal radar homing at the last few seconds of flight. SM-2 allows for many more missiles to be kept in the air at once than there are illuminators, providing a massive advantage over SM-1 armed ships.\n\nSM-2ER Block II (RIM-67C) is the Extended Range version of the SM-2 Block II family, with a new booster to dramatically increase range, and includes a new fuze to improve performance against low-flying and high speed targets.
usn_rgm-84d=RGM-84D,하푼,대함 미사일,하푼은 NATO 소속 국가들에서 널리 사용되는 미국의 대함미사일입니다. 하푼에는 사전 프로그래밍된 경로를 따른 후 활성화되는 능동레이더 탐색기가 장착되어 있습니다. RGM-84D은 수상함 탑재용입니다. RGM-84D는 1985년에 새로이 등장한 파생형으로 향상된 전자 방해 대응책(ECCM) 능력과 개선된 연료로 더 긴 사거리를 가지고 있습니다.
usn_ugm-84c=UGM-84C,하푼,대함 미사일,하푼은 NATO 소속 국가들에서 널리 사용되는 미국의 대함미사일입니다. 하푼에는 사전 프로그래밍된 경로를 따른 후 활성화되는 능동레이더 탐색기가 장착되어 있습니다. UGM-84C는 일회용 캐니스터를 사용한 잠수함 탑재용입니다. 구형 UGM-84A와 달리, 팝업 기동을 수행하지 않고 씨스키밍 기동만을 수행해 함선을 보다 효과적으로 공격합니다.
usn_ugm-109b=UGM-109B,토마호크,대함 미사일,UGM-109B 토마호크 대함 미사일(TASM)은 미국의 대함 미사일입니다. 사전에 지정된 경로를 따라 기동한 뒤, 종말 유도시에는 능동 레이더 탐색기를 켜서 표적을 추적합니다. 기만 기동을 포함해 탐색 패턴 기동이 가능합니다.\nUGM-109B는 어뢰 발사관에서만 발사되는 잠수함 탑재용입니다.
usn_ugm-109c=UGM-109C,토마호크,지상 공격,토마호크 지상 타격 미사일(TLAM)은 미합중국의 지상 타격 미사일입니다. UGM-109C는 발사 후 발사 플랫폼에서의 정보입력 없이 사전에 프로그래밍된 경로대로 목표를 향해 비행하며, 지형 탐색 레이더와 탑재된 디지털 지도를 통한 지형대조항법을 사용합니다.\nUGM-109C는 어뢰 발사관에서만 발사되는 잠수함 탑재용입니다. UGM-109C는 잠수함 발사식이라 연료를 완전히 채울 수 없기에 수상함 발사식에 비해 사거리가 다소 짧습니다.
usn_agm-84c=AGM-84C,하푼,대함 미사일,하푼은 NATO 소속 국가들에서 널리 사용되는 미국의 대함미사일입니다. 하푼에는 사전 프로그래밍된 경로를 따른 후 활성화되는 능동레이더 탐색기가 장착되어 있습니다. AGM-84C는 공중 발사형으로 종말 기동에서 팝업 기동을 하지 않는 대신에 함선을 보다 효율적으로 공격하기 위한 씨스키밍 단계를 가지고 있습니
usaf_gbu-15=GBU-15,,유도 폭탄,GBU-15(V)2는 미 공군이 F-111 및 F-4E와 같은 특정 초음속 전술 항공기에 사용한 적외선 유도 활공 폭탄으로, 여러 국가에 수출되었습니다. 이 무기에는 이미징 적외선(IIR) 시커가 탑재되어 있어 신뢰성이 뛰어나고 모든 기상 조건에서 사용할 수 있으며, 시커 데이터를 재타겟팅하고 발사 플랫폼에 전달할 수 있는 데이터 링크 기능도 갖추고 있습니다.
wp_aa-11=R-73A,빔펠,공대공 미사일,빔펠 R-73A(AA-11 아처)는 소련의 단거리 적외선 유도 공대공 미사일입니다. 이 단거리 미사일은 소련 무기고에서 최고 성능을 발휘하며, 해외 경쟁에 비해 여전히 매우 경쟁력이 있으며, 단거리에서 모든 면에서 매우 치명적인 무기입니다.
wp_fab-1500_m54=FAB-1500,M-54,폭탄,FAB-1500은 소련이 설계한 1500kg(3300lb) 범용 공중 투하 폭탄입니다. 이것은 대형 고폭탄 계열의 1500kg 모델로, 주로 대형 군함, 벙커 또는 공군 기지와 같은 단단한 표적에 사용됩니다.
wp_fab-3000_m54=FAB-3000,M-54,폭탄FAB-3000은 소련이 설계한 3000kg(6600lb) 범용 공중 투하 폭탄입니다. 이것은 대형 고폭탄 계열의 3000kg 모델로, 주로 대형 군함, 벙커 또는 공군 기지와 같은 단단한 표적에 사용됩니다.
wp_fab-9000_m54=FAB-9000,M-54,폭탄,FAB-9000은 소련이 설계한 9000kg(20,000lb) 범용 공중 투하 폭탄입니다. 이것은 대형 고폭탄 계열의 9000kg 모델로, 전투에서 사용된 가장 큰 재래식 폭탄 중 하나로, 경화된 표적을 제거하는 데 중점을 두고 있습니다.
usn_rgm-8h=RGM-8H,탈로스 대레이더 미사일,대레이더 미사일,RGM-8H 탈로스는 RIM-8 탈로스 SAM의 대레이더 버전으로, 대형 기체를 활용하여 매우 긴 항속거리와 고속을 달성하여 함상용 대레이더 미사일에 적합합니다. RGM-8H는 SAM을 기반으로 하고 있지만, 이 미사일은 대공 능력이 없으며 레이더로 포착되는 지상 표적만 공격할 수 있습니다.
is_gabriel_3=가브리엘 3,,대함 미사일,가브리엘 3는 씨스키밍 능력과 능동 레이더 탐색기를 갖춘 이스라엘의 단거리 대함 미사일입니다. 이 미사일은 업그레이드된 가브리엘 2 미사일로, 첨단 능동 레이더 탐색기를 수용할 수 있도록 새롭게 설계된 노즈를 갖추고 있으며, "발사후 망각" 이 가능합니다.
is_gabriel_3as=가브리엘 3AS,,대함 미사일,가브리엘 3AS는 씨스키밍 능력과 능동 레이더 탐색기를 갖춘 이스라엘의 단거리 대함 미사일입니다. 가브리엘 3의 공중 발사 버전으로, 사거리가 개선되고 동체가 새롭게 디자인되었습니다.
plan_yu-1g=Yu-1G,,대함어뢰,Yu-1G(어(魚)-1A형)는 중국의 첫 국산 중어뢰입니다. Yu-1G는 기동 중인 함선과 더 효과적으로 교전할 수 있도록 수동 추적 능력이 추가된 Yu-1의 업그레이드 버전입니다.
fr_r530em=R530FE (SARH),,반능동 레이더 추적 공대공 미사일,R530FE는 프랑스의 반능동 단거리 공대공 미사일입니다. 프랑스에서 유래한 최초의 유도 공대공 미사일 중 하나인 R530은 특별히 신뢰할 수 있거나 강력한 무기는 아니지만, 비교적 오래 연소하는 모터와 그 시대의 동시대 미사일들에 비해 괜찮은 사거리를 가지고 있습니다.
plan_hy-4=HY-4,,대함 미사일,HY-4는 HY-2 미사일의 파생형으로, 원래의 액체 연료 로켓 추진을 대체하는 터보제트 엔진이 장착되어 있습니다. 이를 통해 항속거리가 크게 향상될 수 있지만, HY-4의 화려한 기체는 비행 대부분 동안 상대적으로 높은 고도와 느린 속도로 비행한다는 것을 의미합니다.
it_aspide_1a=아스피데 Mk.1A,,공대공 미사일,아스피데 미사일은 미국의 스패로우 미사일에서 파생된 이탈리아의 중거리 공대공 미사일입니다. AIM-7E에서 파생된 이 미사일은 사거리와 속도를 증가시키는 향상된 모터와 크게 향상된 모노펄스 시커 헤드를 특징으로 하여 저고도 발사가 가능하고 ECCM 성능이 향상됩니다.
it_aspide_1=아스피데 Mk.1A,,함대공 미사일,공대공 미사일,아스피데 미사일은 미국의 스패로우 미사일에서 파생된 이탈리아의 중거리 공대공 미사일입니다. AIM-7E에서 파생된 이 미사일은 사거리와 속도를 증가시키는 향상된 모터와 크게 향상된 모노펄스 시커 헤드를 특징으로 하여 저고도 발사가 가능하고 ECCM 성능이 향상됩니다.\n해상 발사 모델은 공중 발사 모델에 비해 사거리와 속도가 짧지만 여전히 RIM-7E보다 훨씬 뛰어납니다.
rn_mark8_mod4=마크 VIII,,대함 어뢰,영국의 마크 VIII 모드 4 어뢰는 제2차 세계 대전 중에 도입된 직선형 대잠수함 어뢰입니다. 이것은 1920년대 잠수함 발사 모델중 마크 8 시리즈의 최종 버전으로, 1980년대 초반까지 영국 해군에서 사용되었는데, 냉전 이후까지 충분한 대함 대체품이 없었습니다.
usn_mk37_mod3=Mk.37 모드 3,,어뢰,마크 37 어뢰는 여러 국가에서 사용되는 미국 해군의 표준 대잠수함 경량 어뢰입니다. 1959년에 도입된 이 잠수함은 현대 소련의 고성능 잠수함에 맞서기에는 너무 느리고 성능이 저조했습니다. Mk.37 Mod 3 어뢰에는 신뢰성과 획득 범위를 개선하기 위한 새로운 탐색기가 포함되어 있지만, 나머지 어뢰는 원래의 Mod 0에서 수정되지 않았습니다.
usn_mk37_mod2=Mk.37 모드 2,,어뢰,마크 37 어뢰는 여러 국가에서 사용되는 미국 해군의 표준 대잠수함 경량 어뢰입니다. 1959년에 도입된 이 잠수함은 현대 소련의 고성능 잠수함에 맞서기에는 너무 느리고 성능이 저조했습니다. Mk.37 모드 2 어뢰에는 신뢰성과 표적 획득 범위를 개선하기 위한 새로운 탐색기가 포함되어 있지만, 나머지 어뢰는 와이어 유도 모드 1에서 수정되지 않았습니다.
usn_mk37c=Mk.37C,,어뢰,마크 37C 어뢰는 자동 연료와 전선 유도 기능을 갖춘 USN Mk.37 어뢰의 업그레이드 버전으로, 원래 어뢰보다 크게 개선된 것입니다. 1970년대 중반부터 수출 파트너들이 독점적으로 사용한 Mk.37C(NT-37C)는 약간 더 시끄러운 어뢰라는 대가로 150% 더 높은 속도와 거의 두 배에 달하는 사거리를 위해 향상된 추진력을 포함하고 있습니다.
usn_mk37e=Mk.37E,,어뢰,마크 37E 어뢰는 웨이크 호밍 기능과 새롭게 디자인된 탐색기를 갖춘 Mk.37C 어뢰의 업그레이드 버전입니다. 수출 파트너들이 독점적으로 사용하는 Mk.37E(NT-37E)는 1980년대 중반에 매우 유능한 대잠수함 및 대함 어뢰를 장착할 수 있도록 대함 능력과 약간의 개량을 추진력으로 업그레이드했습니다.
usn_rim-66d=RIM-66D,SM-2MR,함대공 미사일,스탠다드 미사일 2는 레이더 유도 지대공 미사일(보조 단거리 대함정 능력을 갖춘)의 한 계열로, 장시간 연소되는 지속기와 대부분의 위협에 대한 균형 잡힌 성능을 특징으로 합니다. 스탠다드 미사일 2는 세미액티브 레이더 호밍 SM-1 탐색기를 고급 데이터링크 중간 경로 안내로 대체하고, 비행 마지막 몇 초 동안 단말 레이더 호밍을 수행합니다. SM-2는 조명기보다 더 많은 미사일을 한 번에 공중에 배치할 수 있게 하여 SM-1 무장 함정에 비해 큰 이점을 제공합니다.\n\nSM-2MR 블록 I (RIM-66D)은 개조된 버지니아급에서만 사용되는 SM-2MR 시리즈의 CG(N)/SM-2(MR) 버전으로, 화재 제어 채널 측면에서 성능이 떨어지고 터미널 조명 기간이 길어지는 것 외에는 모든 면에서 RIM-66C (AEGIS)와 동일합니다.
rn_mark20s=마크 20S,비더,대잠 어뢰,마크 20S "ql더"는 1950년대 영국의 중형 대잠 어뢰로, 사용되기 전에는 구식으로 여겨졌습니다. 마크 20S는 잠수함 발사 버전으로, 영국 해군의 첫 번째 유도 어뢰이지만 낮은 신뢰성, 단거리, 느린 속도, 탐색 성능이 매우 떨어져 현대적인 표적에는 부적합합니다. 이 무기는 오베론과 포어포이즈급 잠수함의 선미 "대처" 어뢰관에서 발사될 수 있는 능력 덕분에 1970년대까지 사용되었습니다.
rn_mark23=마크 23,그로그,어뢰,마크 23 "그로그"는 1950년대 영국의 중형 대잠 어뢰로, 2차 대함 능력을 갖추고 있으며 구식으로 여겨졌습니다. 마크 23은 원래 마크 20 어뢰의 주요 업그레이드로, 확장된 배터리 세그먼트와 와이어 유도 기능을 갖추고 있습니다. 그러나 여전히 비더의 극도로 낮은 탐색 속도와 느린 속도를 계승하고 있습니다. 이 무기의 신뢰성과 성능이 좋지 않기 때문에 현대 잠수함과 수상 함정에 대한 능력은 의문입니다.
usn_gbu-24=GBU-24,페이브웨이 III,유도 폭탄,GBU-24 페이브웨이 III는 미국의 907kg(2000 lb) 확장 사거리 레이저 유도 폭탄입니다. 이것은 향상된 유도 성능과 긴 활공 거리, 그리고 더 높은 신뢰성과 더 효율적인 저고도 비행 프로필을 갖춘 페이브웨이 II를 업그레이드한 것입니다.
usn_mk46_mod5_air=Mk.46 모드 5,NEARTIP,어뢰,마크 46 모드 5 NEARTIP 어뢰는 여러 국가에서 사용되는 경량 어뢰에 대한 NATO 표준입니다. 현대 소련의 고성능 잠수함을 공격하기 위해 설계된 이 변형은 공중 투하입니다.\n\nMk.46 모드 5 NEARTIP (NEAR Term Improvement Program)은 Mk.46 어뢰를 완전히 재구축한 것으로, 더 느리고 조용한 통과 단계를 통해 더 긴 항속 거리를 유지할 수 있게 하고, 대응 조치를 개선하며, 어뢰를 업그레이드하여 얕은 물과 수면 잠수함을 추적할 수 있게 하여 제한된 효과를 제공합니다.
usn_mk46_mod5_ship=Mk-46 Mod 5,NEARTIP,Torpedo,The Mark 46 Mod 5 NEARTIP torpedo is the NATO standard for lightweight torpedoes used across multiple nations. Designed to attack modern Soviet high-performance submarines this variant is ship launched.\n\nThe Mk-46 Mod 5 NEARTIP (NEAR Term Improvement Program) is a full rebuild of the Mk46 torpedo, allowing for longer range via a slower, quieter transit phase, improved counter-countermeasures, and upgrading the torpedo to be able to track shallow-water and surfaced submarines, albeing with limited effectiveness.
wp_mg-74=MG-74,Korund-2,Decoy,The MG-74 Korund-2 is a third generation self-propelled hydro-acoustic submarine simulator. Unlike the earlier MG-44, it can be launched from standard 533mm tubes, and includes highly sophisticated noise making, deceptive emitting, or acoustic jamming capabilities, and can also be deployed from aircraft.
fr_sm-39=SM39,Exocet,ASM,The SM39 Exocet is a French standoff anti-ship missile. It is a popular alternative to the Harpoon throughout NATO and in a number of other nations. The MM38 is the submarine-launched variant, and features better ECCM and a longer range than the original ship-launch Exocet, due to it being based off an upgraded AM-39 Mod 2 version.
usa_bgm-71c=BGM-71C,I-TOW,Land Attack,The BGM-71 I-TOW is an American wire-guided anti-tank missile. The weapon is used both from helicopters and from armoured vehicles. This is the upgraded I-TOW model, with improved range (as in BGM-71B) and a stand-off probe to defeat modern tank armor, although it may still struggle against the latest Soviet battle tanks.
usa_bgm-71d=BGM-71D,TOW 2,Land Attack,The BGM-71D TOW 2 is an American wire-guided anti-tank missile. The weapon is used both from helicopters and from armoured vehicles. This is a redesign of the original BGM-71 TOW with a much larger warhead and improved motor, which allows it to easily defeat the latest armored threats.
fr_l5_mod3=L5,Mod 3,ASW Torpedo,The French L5 Torpedo is a 55cm mediumweight anti-submarine torpedo. This is a faster, longer range version of the L3 anti-submarine torpedo, meant to keep up with longer sonar detection ranges and faster submarine speeds.
fr_f17_mod1=F17,Mod 1,ASuW Torpedo,The French F17 Torpedo is a 53cm heavyweight wire-guided anti-ship torpedo. This is a faster, longer range version of the E15 anti-ship torpedo, with wire guidance for maneuvering or running underneath the layer, and two speed modes.
fr_f17_mod2=F17,Mod 2,Torpedo,The French F17 Torpedo is a 53cm heavyweight wire-guided dual-purpose torpedo. This is an upgraded version of the original F17 torpedo, with antisubmarine capability via an active-passive seeker, faster speed, greater diving depth, and longer range.
fr_f17p=F17P,,Torpedo,The French F17P ("Polyvalent") Torpedo is a 53cm heavyweight wire-guided dual-purpose torpedo. This is an upgraded version of the original F17 torpedo, meant for export exclusively, with antisubmarine capability via an active-passive seeker, making it a dual-purpose torpedo able to be used from ships and submarines.
usn_mk48_mod4=Mk.48 모드 4,,어뢰,마크 48 모드 4는 미국의 헤비급 다목적 어뢰입니다. 이것은 매우 빠르고 장거리 어뢰로, 전선 유도 능력과 매우 정교한 탐색기를 갖추고 있습니다. 모드 4 버전은 1980년대 업그레이드로, 알파급 SSN과 같은 최신 표적을 추적하기 위해 탐색기 개선 사항을 추가했으며, 대응 거부 기능을 향상시키는 양방향 유선 안내 기능을 포함하고 있습니다.
usn_mk48_mod4_adcap=Mk-48 ADCAP,,Torpedo,The Mark 48 Mod 4 (ADCAP) is an American heavyweight dual-purpose torpedo. This is a very fast, long-range torpedo with wire guidance capability and a very sophisticated seeker. The Mod 4 ADCAP version (separate from the Mk-48 Mod 5 ADCAP new-build program) is a 1985 upgrade for existing Mod 4 torpedoes with a new swashplate and fuel pump, pushing the limits of the existing torpedo even further with a faster 65 knot terminal speed, alongside seeker improvements to improve countermeasure rejection capability.
wp_test-71m=TEST-71M,,ASW Torpedo,The TEST-71M is a Soviet heavyweight anti-submarine wire-guided torpedo. TEST-71M has an improved digital guidance section, and upgraded wire guidance unit to remove the prior restrictions on wire guidance, allowing for more flexible firing.
