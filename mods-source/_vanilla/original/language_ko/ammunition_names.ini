[AmmunitionNames]
fr_super-530f=슈퍼 530F,,반능동 레이더 유도 공대공 미사일,슈퍼 530F는 프랑스의 반능동 유도식 단/중거리 공대공 미사일입니다. AIM-7과 매우 유사하며, 이전의 R530 미사일보다 업그레이드 되었습니다.
fr_r550=R550,매직 1,공대공 미사일,R550 매직 1은 미합중국의 AIM-9에 대응되는 프랑스의 적외선 유도식 단거리 공대공 미사일입니다. 후방 추적만 가능합니다.
usaf_aim-9e=AIM-9E,사이드와인더,공대공 미사일,AIM-9E 사이드와인더는 미국의 적외선 유도 공대공 미사일입니다. E형은 향상된 획득 범위와 증가된 사거리로 이전 버전에 비해 모든 면에서 성능이 크게 향상되었습니다. 후방 추적만 가능합니다.
usaf_aim-9j=AIM-9J,사이드와인더,공대공 미사일,AIM-9J 사이드와인더는 미국의 적외선 유도 공대공 미사일입니다. J형은 특히 E형에 비해 제어 시스템 면에서 상당한 변화를 이루었으며, 기존의 진공관 부품을 대체하는 반도체 부품이 탑재되어 있습니다. 이전 형식보다 명중률은 향상되었지만, 여전히 후방 추적만 가능합니다.
usn_aim-7d=AIM-7D,스패로우,공대공 미사일,AIM-7D 스패로우는 미합중국의 반능동 레이더 유도식 공대공 미사일입니다. D형은 기존의 C형과 비교해 접근속도가 향상되었다고 여겨집니다.\n저공비행 표적에는 고공에 비해 성능이 현저히 부족하며, 최소교전거리가 깁니다.
usn_aim-7e=AIM-7E,스패로우,공대공 미사일,AIM-7E 스패로우는 미국의 반능동 레이더 유도 공대공 미사일입니다. E형은 이전 파생형들과 비교하여 사거리와 성능이 향상되었습니다.\n저공비행 표적에는 고공에 비해 성능이 현저히 부족하며, 최소교전거리가 깁니다.
usn_aim-7m=AIM-7M,스패로우,공대공 미사일,AIM-7M 스패로우는 미국의 반능동 레이더 유도 공대공 미사일입니다. M형은 F형 모델을 업그레이드한 버전으로, 모노펄스 시커 헤드가 훨씬 개선되어 시스키밍 표적에 효과적으로 사격할 수 있으며, 새로운 시커로 인해 유효 사거리가 증가함과 동시에 ECCM 능력도 크게 향상되었습니다.
usn_aim-9b=AIM-9B,사이드와인더,공대공 미사일,AIM-9B 사이드와인더는 미국의 적외선 유도 공대공 미사일입니다. B형은 AIM-9 시리즈 중 최초로 배치된 형식입니다. 후기형들과 비교하여, 좁은 발사 범위를 가지고 있고, 태양과 같은 다른 열원에 의하여 쉽게 기만되는 경향이 있습니다. 두말할 필요 없이, 후방 추적만 가능합니다.
usn_aim-9d=AIM-9D,사이드와인더,공대공 미사일,AIM-9D 사이드와인더는 미국의 적외선 유도 공대공 미사일입니다. D형은 B형과 비교하여 개선된 탐색기, 탄두와 증가한 사거리로 특정되는 향상된 파생형입니다. 후방 추적만 가능합니다.
usn_aim-9l=AIM-9L,사이드와인더,공대공 미사일,AIM-9L 사이드와인더는 미국의 적외선 유도 공대공 미사일입니다. L형은 전방위 공격 능력을 갖춘 최초의 사인드와인더 파생형입니다. 이전의 모든 파생형들과 비교하여, 헤드온 상황에서의 교전 능력을 갖춘 것을 포함하여 표적 획득 범위가 매우 증가하였습니다. 후방에서의 사격이 더 긴 추적 사거리를 제공합니다.
usn_aim-54a=AIM-54A,피닉스,공대공 미사일,AIM-54A 피닉스는 미국의 능동 레이더 유도 공대공 미사일입니다. 미국의 무기체계 중 가장 긴 사거리의 F-14 전용 공대공 미사일입니다. 진보된 AWG-9 레이더의 통합으로 F-14에게 각각 1발의 미사일로 최대 6개의 표적과 동시 교전할 수 있는 능력을 부여하였습니다. 이를 위해 항공기에 탑재된 컴퓨터가 추적 중인 레이더 데이터를 트랙 파일로 샘플링한 다음 중간 유도 단계에서 미사일에 대한 추적 업데이트를 전송하여 미사일의 자체 능동 레이더 유도가 종말 유도 단계에서 목표물을 획득하는 '바구니'로 유도하는 동안 미사일은 자동으로 비행합니다.
wp_aa-2d=K-13M,빔펠,적외선 유도 공대공 미사일,빔펠 K-13M(AA-2D 어드밴스드 아톨)은 소련의 적외선 유도식 공대공 미사일입니다. (AIM-9을 역설계하여 만들어진)R-3S(AA-2A 아톨)에서 파생되었지만 새로운 모터와 탐색기가 특징으로, 매우 향상된 성능을 보여줍니다.
wp_aa-3e=R-98MR,칼리닌그라드,반능동 레이더 유도 공대공 미사일,칼리닌그라드 R-98MR(AA-3E 어드밴스드 아납 E)은 소련의 반능동 레이더 유도 공대공 미사일입니다. Su-15와 Yak-28P를 위해 설계된 한쌍의 어드밴스드 아납의 설계 중 하나입니다. 미합중국의 F-102와 F-106 요격기에서 운용되었던 AIM-4 팔콘처럼, 교리상으론 표적에 레이더 유도 미사일과 적외선 유도 미사일을 한 발 씩 발사하여, 격추 확률을 높이도록 했습니다.
wp_aa-3f=R-98MT,칼리닌그라드,적외선 유도 공대공 미사일,칼리닌그라드 R-98MT(AA-3 어드밴스드 아납 F)는 소련의 적외선 유도 공대공 미사일입니다. Su-15와 Yak-28P를 위해 설계된 한쌍의 어드밴스드 아납의 설계 중 하나입니다. 미합중국의 F-102와 F-106 요격기에서 운용되었던 AIM-4 팔콘처럼, 교리상으론 표적에 레이더 유도 미사일과 적외선 유도 미사일을 한 발 씩 발사하여, 격추 확률을 높이도록 했습니다.
wp_aa-6a=R-40R,빔펠,공대공 미사일,빔펠 R-40R(AA-6A 아크리드)은 소련의 장거리 반능동 레이더 유도 공대공 미사일입니다. XB-70 발키리를 상대하기 위해 MiG-25P 요격기를 특정하여 설계되었습니다. 미합중국의 F-102와 F-106 요격기에서 운용되었던 AIM-4 팔콘처럼, 교리상으론 표적에 레이더 유도 미사일과 적외선 유도 미사일을 한 발씩 발사하여, 격추 확률을 높이도록 했습니다.
wp_aa-6b=R-40T,빔펠,적외선 유도 공대공 미사일,AA-6B 아크리드(빔펠 R-40T)는 소련의 장거리 적외선 유도식 공대공 미사일입니다. XB-70 발키리를 상대하기 위해 MiG-25P 요격기를 특정하여 설계되었습니다. 미합중국의 F-102와 F-106 요격기에서 운용되었던 AIM-4 팔콘처럼, 교리상으론 표적에 레이더 유도 미사일과 적외선 유도 미사일을 한발씩 발사하여, 격추 확률을 높이도록 했습니다.
wp_aa-6c=R-40RD,빔펠,공대공 미사일,빔펠 R-40RD(개선된 AA-6C 아크리드)는 소련의 장거리 반능동 레이더 유도식 공대공 미사일입니다. 새로운 MiG-25PD 요격기를 위해 이를 특정하여 설계되었습니다. 미사일의 최대 사거리 또한 60km로 증가되었습니다. 미합중국의 F-102와 F-106 요격기에서 운용되었던 AIM-4 팔콘처럼, 교리상으론 표적에 레이더 유도 미사일과 적외선 유도 미사일을 한발씩 발사하여, 격추 확률을 높이도록 했습니다.
wp_aa-6d=R-40TD,빔펠,공대공 미사일,빔펠 R-40TD(개선된 AA-6D 아크리드)는 소련의 장거리 적외선 유도식 공대공 미사일입니다. 새로운 MiG-25PD 요격기를 위해 이를 특정하여 설계되었습니다. 미사일의 최대 사거리 또한 60km로 증가되었습니다. 미합중국의 F-102와 F-106 요격기에서 운용되었던 AIM-4 팔콘처럼, 교리상으론 표적에 레이더 유도 미사일과 적외선 유도 미사일을 한발씩 발사하여, 격추 확률을 높이도록 했습니다.
wp_aa-7c=R-24R,빔펠,반능동 레이더 유도 공대공 미사일,빔펠 R-24R(AA-7C 에이펙스)은 소련의 중거리 반능동 레이더 유도식 공대공 미사일입니다. 개량된 Charlie 및 Delta 파생형들은 1970년 중반에 MiG-23에 장착하기 위해 개발되었습니다. 대략적으로 미합중국의 AIM-7E와 유사하며, R-24R은 향상된 ECM 저항력과 발사 후 락온 기능을 갖춘 모노펄스 탐색기를 장비하고 있습니다.
wp_aa-7d=R-24T,빔펠,적외선 유도 공대공 미사일,빔펠 R-24T(AA-7D 에이펙스)는 소련의 중거리 반능동 레이더 유도식 공대공 미사일입니다. 개량된 찰리 및 델타 파생형들은 1970년 중반에 MiG-23에 장착하기 위해 개발되었습니다. 미합중국의 F-102와 F-106 요격기에서 운용되었던 AIM-4 팔콘처럼, 교리상으론 표적에 레이더 유도 미사일과 적외선 유도 미사일을 한발씩 발사하여, 격추 확률을 높이도록 했습니다.
wp_aa-8=R-60M,빔펠,공대공 미사일,빔펠 R-60M(AA-8 애피드)은 소련의 단거리 적외선 유도식 공대공 미사일입니다. 이 무기는 매우 폭넓게 수출되었고 소련의 동맹 관계인 국가들에게서 많이 볼 수 있습니다.
raf_rapier=FSB 레이피어,레이피어,지대공 미사일,영국의 광학 유도식 단거리, 저고도 국지방공 미사일 체계입니다. 조준선 지령(CLOS) 유도 시스템을 사용하여, 고속기와 미사일에 대하여 가변적인 효과를 보입니다.
rn_seacat=GWS-21,씨캣 Mk.1,대공 미사일,GWS-21 씨캣은 함선 개함방공 체계의 극초반의 예입니다. 왕립 해군에서 1962년부터 제식으로 배치되었으며 보포스 40mm의 대체품으로서 폭넓게 수출되었습니다. 조준선 지령(CLOS) 유도 시스템을 사용하여, 고속 제트기와 미사일에 대한 효과는 의심스럽습니다.
usa_mim-23=MIM-23,호크,지대공 미사일,1960년대 미국에서 개발된 호크 지대공 미사일은 비교적 기동성이 좋은 중거리 지대공 미사일 시스템으로 미사일 자체는 호크 대공미사일 포대를 구성하는 부품중 하나인 HPIR(고출력 목표 추적 레이더)에서 보내오는 유도 신호를 따라 유도되며 PAR(펄스파 목표 탐지 레이더)이 고고도 목표물을 탐지하고 CWAR(연속파 목표 탐지 레이더)가 저고도를 따라 침투하는 목표물을 탐지합니다.
usn_rim-2f=RIM-2F,테리어,함대공 미사일,RIM-2F 테리어는 미 해군이 양산한 극 초기형 개함방공 미사일 중 하나입니다. 항공모함의 고정익 항공기들이 제공하는 방공망과 함포 방공망의 간극을 벌충하기 위한 용도로 개발되었으며, 초기형 RIM-2 테리어는 빔 라이딩 유도를 사용했습니다. RIM-2F 테리어는 요격 확률과 기동성이 개선되었으며, 빔 라이딩 대신 반능동 레이더 유도를 사용하도록 개량되었습니다. 다른 대공 미사일들과 같이 대수상 표적에도 사용이 가능합니다. 미사일 발사 전, 본체와 부스터를 핀으로 결합하는 과정이 선행되므로 발사 간격은 30초로 제한됩니다.
usn_rim-8=RIM-8J,탈로스,함대공 미사일,RIM-8J 탈로스는 미 해군의 순양함에서 주력으로 운용된 대형 장거리 함대공 미사일 체계입니다. 중간유도 단계에서는 빔라이딩 유도를 이용해 비행하며, 종말유도 단계에서 반능동 레이더 유도 방식을 이용합니다. RIM-8 탈로스는 발사 전에 본체와 부스터를 조립하는 과정이 선행되므로, 신형 미사일들에 비해 발사 속도가 느립니다. 이는 탈로스의 거대한 탄약고로 유추 가능합니다.
usn_rim-7=RIM-7E,씨 스패로우,함대공 미사일,RIM-7E 씨 스패로우는 단거리 함대공 미사일로, NATO의 주요 선상 개함방공 미사일입니다.\n이것은 가장 초기의 씨 스패로우 모델로, 공중 발사형인 AIM-7E와 성능 면에서 동일하지만, 사거리와 속도가 크게 감소하여 유효 발사 거리가 단거리로 제한된다는 점이 다릅니다.\nAIM-7E의 시커 성능 및 저고도 발사 능력의 부족함을 계승합니다.
usn_rim-7m=RIM-7M,씨 스패로우,함대공 미사일,RIM-7M 씨 스패로우는 단거리 함대공 미사일로, NATO의 주요 선상 개함방공 미사일입니다.\nM형은 항속거리와 속도가 현저히 낮다는 점을 제외하고는 공중 발사형인 AIM-7M과 동일합니다.\n이전 모델들과 비교했을 때, M형은 씨스키밍 미사일과 항공기를 탑재한 최초의 시리즈이며, 짧은 사거리와 속도에도 불구하고 신뢰할 수 있는 개함방공 미사일입니다.
usn_rim-66a=RIM-66A,SM-1MR,함대공 미사일,스탠다드 미사일 1은 레이더 유도 구역 방어 지대공 미사일(보조 단거리 대함정 능력을 갖춘)의 한 계열로, 오래 연소하는 지속기와 대부분의 위협에 대해 잘 배치된 성능을 특징으로 합니다. 스탠다드 미사일 1은 이전의 RIM-2 테리어 및 RIM-24 타르타르 미사일을 보다 신뢰할 수 있게 업그레이드하기 위해 설계되었지만, 여전히 사격 통제 능력과 저공비행 표적에 대한 능력의 한계를 공유하고 있습니다.\n\nSM-1MR 블록 IV(RIM-66A-4)는 SM-1 시리즈의 중거리 버전으로, 타르타르의 아날로그 구성 요소를 솔리드 스테이트 일렉트로닉스로 대체하여 신뢰성을 크게 향상시키고 ECCM 기능을 향상시켰습니다.
usn_rim-66b=RIM-66B,SM-1MR,SAM/ASuW,The Standard Missile 1 is a family of radar-homing area-defense surface to air missiles (with a secondary short-range anti-ship capability) characterized by their long-burning sustainers and well-rounded performance against most threats. Standard Missile 1 was designed as a more reliable upgrade to the earlier RIM-2 Terrier and RIM-24 Tartar missiles, but still shares their limitations in fire control capacity and ability against low-flying targets.\n\nSM-1MR Block V (RIM-66B-2) is the improved Medium Range version of the SM-1 series, which upgraded on the earlier RIM-66A with a more powerful rocket motor for greater range, and a new fuze and seeker assembly to improve its ECCM performance.
usn_rim-66c=RIM-66C,SM-2MR,SAM/ASuW,The Standard Missile 2 is a family of radar-guided area-defense surface to air missiles (with a secondary short-range anti-ship capability) characterized by their long-burning sustainers and well-rounded performance against most threats. Standard Missile 2 replaces the semiactive radar-homing SM-1 seeker with an advanced datalink midcourse guidance, with terminal radar homing at the last few seconds of flight. SM-2 allows for many more missiles to be kept in the air at once than there are illuminators, providing a massive advantage over SM-1 armed ships.\n\nSM-2MR Block I (RIM-66C) is the AEGIS version of the SM-2MR series, and is generally identical to RIM-66B except with the inclusion of a datalink, improved monopulse seeker, and an improved warhead.
usn_rim-67a=RIM-67A,SM-1ER,SAM/ASuW,The Standard Missile 1 is a family of radar-homing area-defense surface to air missiles (with a secondary short-range anti-ship capability) characterized by their long-burning sustainers and well-rounded performance against most threats. Standard Missile 1 was designed as a more reliable upgrade to the earlier RIM-2 Terrier and RIM-24 Tartar missiles, but still shares their limitations in fire control capacity and ability against low-flying targets.\n\nSM-1ER (RIM-67A-2) is the Extended Range version of the SM-1 series, which replaced the analog components of Terrier with solid state electronics, greatly improving reliability, alongside a new fuze and seeker assembly to improve its ECCM performance.
usn_rim-67b=RIM-67B,SM-2ER,SAM/ASuW,The Standard Missile 2 is a family of radar-guided area-defense surface to air missiles (with a secondary short-range anti-ship capability) characterized by their long-burning sustainers and well-rounded performance against most threats. Standard Missile 2 replaces the semiactive radar-homing SM-1 seeker with an advanced datalink midcourse guidance, with terminal radar homing at the last few seconds of flight. SM-2 allows for many more missiles to be kept in the air at once than there are illuminators, providing a massive advantage over SM-1 armed ships.\n\nSM-2ER Block I (RIM-67B) is the Extended Range version of the SM-2 Block I family, used on upgraded CG/SM-2 ships in the late 1970s through the mid 1980s to upgrade the firepower of existing Terrier-armed destroyers and cruisers.
wp_sa-n-1=M-1,볼나,함대공 미사일,M-1 볼나(SA-N-1 고아)는 소련 해군이 양산한 극 초기형 개함방공 미사일입니다. 개함방공 능력을 제공하며 접근하는 대함 미사일에 부분적으로 대응 가능합니다. 원래는 고고도 표적에만 효과적이었지만, 후기형에서는 사거리를 증강시킨 뒤 대수상 능력과 저고도 표적에게 효과적이도록 개량되었습니다.
wp_sa-n-3=M-11,시토름,함대공 미사일,M-11 시토름(SA-N-3 고블렛)은 소련의 개함방공 체계입니다. 본 체계는 다수의 미사일 순양함들과 소련의 헬리콥터 항모 및 STOVL 항공모함에 설치되었습니다. 부가적으로 대함 능력을 갖추고 있으며, 후기형은 저고도 항공 표적에 대한 대응능력이 향상되었습니다.
wp_sa-n-4=M-4,오사-M,함대공 미사일,M-4오사-M(SA-N-4 게코)는 2발의 미사일과 접이식 발사대를 갖춘 SA-8 게코(SA-N-4와 스펠링이 다릅니다)의 함선용 버전입니다. 단거리 방공 역할을 수행하기 위하여 상당수의 소련 무기체계에 통합되었습니다.
wp_sa-n-5=9K32,스트렐라-2,대공 미사일,9K32 스트렐라-2(SA-N-5 그레일)은 SA-7이라는 이름으로 널리 알려진 보병 휴대형 지대공미사일(MANPADS)입니다. 함정에서는 개함방공 용도로 사용합니다.
wp_sa-n-6=S-300F,포르트,함대공 미사일,S-300F 포르트(SA-N-6 그럼블)은 S-300P(SA-10) 지상 기반 지대공미사일 체계의 함선 운용 버전입니다. 이 강력한 장거리 방공 체계는 소련의 미사일 순양함에 통합되어 운용되며, SM-2와 대적 가능한 성능을 제공합니다.
wp_sa-n-7=M-22,우라간,함대공 미사일,M-22 우라간(SA-N-7 가드플라이)는 9K37 부크(SA-11 가드플라이) 지상 기반 지대공미사일 체계의 함선 운용 버전입니다. 우라간 무기체계는 정교하고 유능한 화기 시스템을 갖추어 소브레멘니급 구축함에 통합되었습니다.
wp_sa-n-9=3K95,킨잘,함대공 미사일,3K95 킨잘(SA-N-9 건틀렛)은 9K330 토르(SA-15 건틀렛) 미사일의 함상형입니다. 9K330 토르와 동일한 미사일을 운용하며 상당수의 소련 주요 수상 전투함들에 탑재되었습니다.
wp_sa-2=S-75,드비나,지대공 미사일,S-75 드비나(SA-2 가이드라인)은 소련의 장거리 지대공 미사일 체계입니다. 본 무기체계는 넓은 지역에서 폭격기에 대응하기 위한 것으로 폭넓게 수출되었으며, 많은 분쟁에서 사용되었지만 가장 유명한 것은 베트남 전쟁 중에서의 사용입니다.
wp_sa-3=S-125,네바,지대공 미사일,S-125 네바(SA-3 고아)는 소련의 중거리 지대공 미사일 체계입니다. 저고도의 표적과 기동성이 높은 표적을 요격하기 위해 개발되었습니다. 수출명은 페초라입니다.
wp_sa-5=S-200,,지대공 미사일,S-200(SA-5 감몬)은 소련의 장거리 지대공 미사일 체계입니다. 넓은 범위에서 고고도의 폭격기를 요격하기 위해 개발되었으며 재밍 발신지 추적(HOJ, home-on-jam) 기능을 갖추고 있습니다.
usn_agm-45=AGM-45B,슈라이크,대레이더 미사일,AGM-45 슈라이크는 AIM-7 스패로우를 기반으로 개발된 미국의 대레이더 미사일로, 신형 시커를 장착하고 있습니다. 짧은 사거리, 인상적이지 않은 속도, 작은 탄두를 가지고 있으며 제한된 수의 레이더 대역(S, C, X 대역)만 추적할 수 있지만, 저비용과 경량화는 어디서나 사용할 수 있음을 의미합니다.
wp_as-11=Kh-58,,대레이더 미사일,Kh-58(AS-11 킬터)는 Su-24M 공격기에 탑재하기 위해 개발된 소련의 대레이더 미사일입니다. Kh-58은 소련 공군에서 운용하는 대레이더 미사일 중 가장 발전된 미사일로, 초음속으로 발사될 때 가장 긴 사정거리를 가집니다.
is_gabriel_2=가브리엘 2,,대함 미사일,가브리엘은 이스라일제 대함미사일로 반능동 레이더 유도 시스템(SARH)과 비교적 짧은 유효 사거리를 가지고 있습니다, 또한 적군의 대공화망을 피하기 위해 저공비행이 가능하며 이전의 가브리엘 1 대함미사일의 개량형입니다, 가브리엘 1과 비교하여 ECCM 능력과 전반적인 신뢰도를 개선하였습니다.
it_seakiller_2=씨 킬러 Mk.2,,대함 미사일,씨 킬러 Mk.2는 이탈리아에서 개발된 단거리 대함 미사일입니다. 씨 킬러 Mk.2는 이란이 구매하여 알반드급 호위함에 장착했으며, 각 함정에는 5연장 발사대 1기가 장착되었습니다.
it_otomat_mk1=오토마트 MK1,,대함 미사일,오토마트 MK1은 이탈리아와 프랑스가 공동 개발한 중거리 대함 미사일입니다.
fr_am-39=AM39,엑조세,대함 미사일,AM39 엑조세는 프랑스의 대함 미사일이며 NATO 및 다른 국가들에서 하푼의 대체제로 각광받았습니다. AM39는 액조세의 공중 발사형 명칭입니다.
fr_mm-38=MM38,엑조세,대함 미사일,MM38 엑조세는 프랑스의 대함 미사일이며 NATO 및 다른 국가들에서 하푼의 대체제로 각광받았습니다. MM38은 함재형 액조세의 명칭입니다.
knm_penguin_mk2=AGM-119,펭귄 Mk.2,대함 미사일,AGM-119 펭귄은 미국과 노르웨이가 공동 개발한 소형 공대함 및 함대함 미사일입니다.
usn_agm-123=AGM-123,스키퍼,대함 미사일,스키퍼는 페이브웨이2 레이저 유도 폭탄에 고체 로켓 부스터를 결합하여 제작된 미국의 단거리-중거리 대함 유도 미사일입니다. 페르시아만과 같이 민간 선박이 밀집한 해역에서 사용하기 어려운 하푼 미사일의 대안으로 개발되었습니다.
usn_rgm-109b=RGM-109B,토마호크,대함 미사일,RGM-109B 토마호크 대함 미사일(TASM)은 미국의 대함 미사일입니다. 사전에 지정된 경로를 따라 기동한 뒤, 종말 유도시에는 능동 레이더 탐색기를 켜서 표적을 추적합니다. 기만 기동을 포함해 탐색 패턴 기동이 가능합니다.
wp_as-2=K-10S,,대함 미사일,K-10S(AS-2 키퍼)는 Tu-16에 탑재하는 소련의 항공기용 초음속 대함 미사일입니다. 항공기용 P-35 프로그레스(SS-N-3a 섀독)과 유사하며, 현대화된 방공망에 대해서는 비슷한 한계를 보여줍니다.
wp_as-4=Kh-22,,대함 미사일,Kh-22(AS-4 키친)은 Tu-22M이나 Tu-95에 탑재되는 소련의 항공기용 초음속 대함 미사일입니다. 순항 시에는 고고도, 고속 비행을 하며 종말기동시 초음속 강하를 하기 때문에 대응하기 매우 어렵습니다.
wp_as-6=Kh-26,,대함 미사일,Kh-26(AS-6 킹피쉬)는 Tu-16에 탑재되도록 설계된 소련의 초음속 공대지&공대함 미사일입니다. Kh-22(AS-4 키친)와 비슷한 면모를 보여, 고고도에서 고속으로 비행하여 종말유도단계에서는 초음속으로 강하하므로 요격이 매우 힘듭니다.
wp_as-7=Kh-23,그롬,대함 미사일,Kh-23 그롬(AS-7 케리)은 소련의 초음속 공대지 미사일입니다. 미국의 AGM-12 불펍처럼 미사일의 유도를 운용자가 수동으로 조작하기에 동일한 단점이 많습니다.
wp_as-10=Kh-25,,대함 미사일,Kh-25/Kh-25M(AS-10 카렌)은 소련의 초음속 공대지 미사일입니다. 발사 후 망각 기능(Fire & Forget. FnF)을 위해 레이저 탐색기가 장착되었습니다.
wp_as-13=Kh-59,오보드,대함 미사일,Kh-59 오보드(AS-13 킹볼트)는 소련의 아음속 공대지 미사일입니다. 사전에 지정된 표적 좌표를 기억한 뒤, 중간유도단계에서는 관성항법유도(INS)를 이용해 비행하고 종말유도단계에서는 TV 카메라 유도를 통해 표적에 돌입합니다.
wp_ss-n-2=P-15,테르밋,대함 미사일,P-15 테르밋(SS-N-2 스틱스)은 소련의 수상함 탑재용 아음속 대함 미사일입니다. 중국이 면허생산한 SY-1/2 상유(실크웜)라는 이름으로 더욱 유명합니다. 해안가에 있는 지상 표적 타격에도 사용될 수 있습니다.
wp_ss-n-2c="P-15М,테르밋,대함 미사일,P-15M 테르밋(SS-N-2C 스틱스)는 소련의 수상함 탑재용 아음속 대함 미사일입니다. 사정거리를 늘린 뒤 ECM 공격에 대처하도록 전자 방해 방어책(ECCM)을 향상시긴 개량형입니다. 해안가에 있는 지상 표적 타격에도 사용될 수 있습니다. "
wp_ss-n-3=P-35,,대함 미사일,P-35 프로그레스(SS-N-3a 셰독)는 소련의 아음속 대함 미사일입니다. 여러 플랫폼에서 사용되도록 고안되었습니다. 도입되었던 당시에는 매우 위협적이었지만 고고도에서 아음속으로 비행한다는 특징으로 인해 함대공미사일에게 매우 취약합니다. 또 다른 단점으로는 미사일이 비행을 지속하는 동안 모함과 통신을 유지해야 한다는 것으로, 모함이 미사일 유도 시 해수면에 지속적으로 노출되어야 해 적의 반격에 매우 취약해집니다.
wp_ss-n-7=P-70,아메티스트,대함 미사일,P-70 아메티스트(SS-N-7 스타브라이트)는 소련의 잠수함 발사식 천음속 대함 미사일입니다. 잠수함이 잠수 상태에서 발사 가능한 첫번째 미사일이었습니다. 상대적으로 짧은 사거리를 가졌으며, P-120으로 대체되었습니다.
wp_ss-n-9=P-120,말라히트,대함 미사일,P-120 말라히트(SS-N-9 사이렌)는 소련의 수상함 탑재용 아음속 대함 미사일입니다. P-15(SS-N-2 스틱스)보다 빠르고 긴 사거리를 가지고 있으며, 종말유도단계에서 회피기동을 수행할 수 있습니다.
wp_ss-n-12=P-500,바잘트,대함 미사일,P-500 바잘트(SS-N-12 샌드박스)는 P-35을 대체하기 위해 설계된 소련의 수상함 탑재용 초음속 대함 미사일입니다. 셰독과 비교하여, 더 빠른 속도를 가졌고, 동시 사격 시 미사일 한발이 고고도에서 비행하며 목표 추적 역할을 수행하는 동안 나머지 미사일은 저고도로 비행할 수 있게 하는 미사일 내부 데이터링크 체계가 통합되어 있습니다. 또한 대공체계로부터 생존성을 증대시키기 위한 방어용 ECM을 탑재하고 있습니다.
wp_ss-n-19=P-700,그라니트,대함 미사일,P-700 그라니트(SS-N-19 쉽렉)은 소련의 수상함 탑재용 초음속 대함 미사일입니다. 고고도-저고도 혼합비행 및 미사일 동시사격 시 그 중 한발을 고고도 정찰 역할로 이용하여 여러발의 미사일이 목표를 분배할 수 있는 고급 미사일 간 데이터링크가 통합되어 있습니다. 종말유도단계에서 회피기동을 할 수 있으며, 온보드 ECM 재머와 디코이를 갖췄고, CIWS 사격과 미사일 파편에 대비하여 장갑화 되어있습니다. 어떤 관점에서 접근하여도 위협적인 무기체계입니다.
wp_ss-n-22=P-270,모스키트,대함 미사일,P-270 모스키트(SS-N-22 썬번)은 소련의 수상함 탑재용 초음속 대함 무기체계입니다. 초음속 시스키밍 종말유도단계로 저고도-저고도 비행을 사용하며, 그 동안 미사일은 방공망으로부터 생존률을 높이기 위해 뱀과 같은 회피기동을 구사합니다.
wp_as-4b=Kh-22MP,스톰,대지 미사일,Kh-22MP 스톰(AS-4B 키친)은 소련에서 제작된 초음속 지상 공격 미사일입니다.
usn_rgm-109c=RGM-109C,토마호크,LAM,토마호크 지상 타격 미사일(TLAM)은 미합중국의 지상 타격 미사일입니다. RGM-109C는 발사 후 발사 플랫폼에서의 정보입력 없이 사전에 프로그래밍된 경로대로 목표를 향해 비행하며, 지형 탐색 레이더와 탑재된 디지털 지도를 통한 지형대조항법을 사용합니다.
usaf_agm-86c=AGM-86C,CALCM,대지 미사일,재래식 공중 발사식 순항 미사일(CALCM)은 미합중국의 공중 발사형 지상 타격 미사일이며 B-52의 주력 미사일입니다. AGM-86C는 발사 후 발사 플랫폼에서의 정보입력 없이 사전에 프로그래밍된 경로대로 목표를 향해 비행하며, 지형 탐색 레이더와 온보드 디지털 지도를 통한 지형대조항법을 사용합니다.
usa_bgm-71a=BGM-71A,TOW,Land Attack,The BGM-71 TOW is an American wire-guided anti-tank missile. The weapon is used both from helicopters and from armoured vehicles. It has a relatively short range and a small warhead, which limits its ability against modern armor as it may require multiple shots to kill a single tank.
usn_agm-65b=AGM-65B,매버릭,대지 미사일,AGM-65B는 미국의 TV 유도식 공대지 미사일입니다. AGM-62 월아이처럼, 발사한 항공기의 운용자가 목표로 하는 표적에 십자선을 지속적으로 위치시키면, 스스로 목표에 락온하여 발사 후 자동으로 유도됩니다.
usn_rur-5=RUR-5,대잠로켓,대잠,RUR-5 ASROC(대잠로켓을 의미)은 대잠 미사일입니다. ASROC 미사일은 발사 플랫폼에서 발사되어 포물선 모양으로 비행 후 Mk 46 대잠 어뢰를 투하합니다.
wp_apr-2=APR-2,,대잠,APR-2는 1.389km(0.75해리)의 탐색기 범위와 수심 600m까지 사용 가능한, 소련의 공중 투하형 대잠 어뢰입니다.
wp_ss-n-14a=URPK-3,메텔,대잠,URPK-3 메텔(SS-N-14A 사일렉스)은 소련의 원거리 대잠 미사일로 호주의 이카라 대잠 미사일과 유사하게 순항 미사일 몸체 아래에 어뢰를 탑재합니다.
wp_ss-n-14b=URK-5,라스투르프,SW/ASuW,URK-5 라스투르프(SS-N-14B 사일렉스)는 소련의 대잠/대함 범용 미사일로 호주의 이카라 대잠 미사일과 유사하게 순항 미사일 몸체 아래에 어뢰를 탑재합니다.
wp_ss-n-16=RPK-7,베테르,대잠,RPK-7 베테르(SS-N-16 스탤리온)는 소련 해군의 대잠 미사일로 목표물을 향해 탄도를 그리며 날아가 어뢰를 투하합니다.
knm_terne_shell=테른 III 박격포,,대잠 박격포,테른은 노르웨이산 로켓추진 대잠 무기로 1960년대에 개발되었습니다.
rn_limbo_shell=림보 박격포,,대잠 박격포,림보 (혹은 대잠박격포 마크 10)은 영국제 대잠 박격포로 1950년대에 개발되었습니다. 함선에 장착된 소나를 통해 조준하며 삼각형 패턴을 따라 3발의 폭뢰를 투하합니다.
rn_squid_shell=스퀴드 박격포,,대잠 박격포,스퀴드는 2차대전때 개발된 영국제 구식 대잠박격포로 함선에 장착된 소나를 통해 조준하며 삼각형 패턴을 따라 3발의 폭뢰를 투하합니다.
wp_rgb-10=RBU-1000,,대잠 박격포,RBU-1000 (혹은 스메르치-3)은 300mm 구경의 소련제 대잠 로켓 발사기로 RBU-1000은 대략 914m(1000yd)의 사거리를 지녔습니다.
wp_rgb-25=RBU-2500,,대잠 박격포,RBU-2500 (혹은 스메르치-1)은 213mm 구경의 소련제 대잠로켓 발사기로 RBU-2500은 대략적으로 2,286m(2500yd)의 사거리를 지녔습니다.
wp_rgb-60=RBU-6000,,대잠 박격포,RBU-6000 (혹은 스메르치-2)는 213mm 구경의 소련제 대잠로켓 발사기로 RBU-6000은 대략적으로 5,486.4m(6000yd)의 사거리를 지녔습니다.
fr_e15=E15,,대함 어뢰,프랑스제 E15 어뢰는 전례를 찾아보기 힘든 55cm 구경의 대수상 중어뢰로 수동 소나 유도를 사용합니다.
fr_l3=L3,,대잠 어뢰,프랑스제 L3 어뢰는 전례를 찾아보기 힘든 55cm 구경의 중형 대잠 어뢰입니다. 개량됨.
ger_dm1=DM1,,대잠 어뢰,독일의 첫 번째 유선유도 어뢰이자 대잠 어뢰입니다.
ger_dm2=DM2,,대함 어뢰,독일의 대함 유도 어뢰입니다.
ger_sst4=SST4,,대함 어뢰,독일산 유선유도 대함 중어뢰로 해외 수출을 위해 생산되었습니다.
knm_tp612=TP612,,대함 어뢰,스웨덴제 TP612 중어뢰는 유선을 통해 유도됩니다. TP612 어뢰는 TP611 어뢰로부터 소음을 줄이고 스윔아웃을 도입한 신형 어뢰입니다.
knm_tp613=TP613,,대함 어뢰,스웨덴제 TP613 중어뢰는 수동형 소나와 유선을 통해 유도됩니다. TP612 어뢰에 수동형 소나 시커를 넣어서 개발되었습니다.
rn_mark9_mod2=마크 IX,,대함 어뢰,영국제 마크 IX** 어뢰는 직선형 대함어뢰로 2차 세계대전때 첫 모습을 보였습니다. 1930년대의 마크 IX 디자인과 비교하여 더 긴 사정거리와 강력한 탄두를 탑재하여 마지막 개량형의 종지부를 찍었습니다.
usn_mk46_ship=Mk.46 모드 2,,대함 어뢰,Mk.46 모드 2 어뢰는 여러 국가에서 사용하는 NATO의 표준 경어뢰입니다. 소련의 최신예 잠수함을 공격하기 위해 설계되었으며 해당 파생형은 함정에서 사용됩니다.
usn_mk48=Mk-48 Mod 1,,Torpedo,The Mark 48 Mod 1 is an American heavyweight dual-purpose torpedo. This is a very fast, long-range torpedo with wire guidance capability and a very sophisticated seeker. The Mod 1 version is the first to enter service in 1972, replacing the older Mk-37 and Mk-14/16 warloads with a single high-performance torpedo, although it has only one-way wire guidance.
wp_53-38=53-38,,대함 어뢰,53-38은 제2차 세계대전 시기의 구식 무유도 중어뢰입니다. 53-38어뢰는 비교적 단순하여 신뢰성이 높고 효과적입니다. 역사상 심각한 인명피해로 손꼽는 두 건의 침몰 사건(독일 수송선 빌헬름 구스트로프와 병력 수송선 고야)은 53-38을 사용한 두 척의 소련 잠수함에 의해 이루어졌습니다.
wp_53-56v=53-56,,대함 어뢰,53-56V는 소련제 무유도 중어뢰입니다. 53-38 어뢰의 개량형입니다.
wp_53-65K=53-65K,,항적추적 어뢰,53-65는 소련제 항적추적 중어뢰로 수상함들을 상대하도록 설계되었습니다.
wp_65-76=65-76,,항적추적 어뢰,65-76는 소련제 650mm 항적추적 중어뢰로 항공모함 킬러로 알려저있습니다. 이는 항공모함과 같은 거대 함선들을 상대하도록 개발되었기 때문인데 650mm라는 대구경은 소수의 소련 잠수함에서만 발사될 수 있다는 것을 의미합니다.
wp_at-1=AT-1,,대잠 어뢰,소련의 AT-1은 전기추진식 공중투하 대잠어뢰로 능동/수동형 음향 추적이 가능하며 오직 헬기만 투하가 가능합니다.
wp_at-2=AT-2,,대잠 어뢰,소련의 AT-2는 전기추진식 공중발사 중어뢰로 능동/수동형 음향 추적이 가능합니다. AT-2는 몇 안되는 공중발사형 중어뢰로 대부분의 공중발사형 어뢰는 이보다 더욱 작으며 무게는 1/4이 안되는 경우가 많습니다.
wp_set-40=SET-40,,대잠 어뢰,소련의 SET-40은 능동/수동형 추적 방식을 가진 전기추진식 대잠 경어뢰입니다.
wp_set-65=SET-65,,대잠 어뢰,SET-65는 소련의 전기추진식 대잠 중어뢰로 능동형 추적을 사용합니다.
wp_test-71=TEST-71,,대잠 어뢰,TEST-71은 소련의 유선유도 대잠 중어뢰입니다 SET-65에 비해 더욱 강력한 능동/수동 추적능력을 지녔습니다.\n와이어와 데이터의 제한으로 인해 TEST-71은 와이어로만 수평으로 유도할 수 있으며, 발사 후 심도를 변경할 수 없습니다.
wp_umgt-1=UMGT-1,,대잠 어뢰,UMGT-1은 소련의 공중투하형 대잠 어뢰로 URPK-3 메텔(SS-N-14 사일렉스)과 RPK-7 베테르(SS-N-16 스탤리온) 대잠미사일에 장착되는 어뢰이기도 합니다. UMGT-1는 다른 대잠 중어뢰들과 비교해서 위력이 약하긴 하지만 잠수함 상대로는 심각한 피해를 입힐수 있습니다.
wp_uset-80=USET-80,,어뢰,USET-80 어뢰는 소련의 최신식 대잠/대함 범용 중어뢰로 능동/수동 추적시스템을 보유하여 수상함이든 잠수함이든 둘다 위협할수 있습니다.
fr_samp_t25=SAMP-25,,폭탄,25형 SAMP는 프랑스제 230kg(500lb) 무유도 폭탄으로 미국의 Mk-82 폭탄과 유사합니다.
fr_samp_t21=SAMP-21,,폭탄,21형 SAMP는 프랑스제 400kg(880lb) 무유도 폭탄으로 미국의 Mk-83 폭탄과 유사합니다.
raf_bl755=BL755,,집속탄,BL755는 147개의 대전차 자탄을 탑재한 폭탄으로 이란-이라크 전쟁시기 이란 이슬람 공화국 공군과 포클랜드 전쟁시기 영국 왕립공군이 사용했습니다.
usaf_gbu-2=GBU-2,페이브웨이 I,유도 폭탄,GBU-2 페이브웨이 I은 미국산 907 kg(2000 lb) 레이저 유도 폭탄입니다. GBU-2는 Mk.84가 모체이며 전면부에 레이저 시커와 후면부에는 유도용 꼬리날개를 달았습니다.
usaf_m117=M117,,폭탄,M117은 340kg(750lb) 무유도 폭탄으로 한국전쟁 시기에 도입되었습니다. 베트남전 당시 미 공군이 사용하였으며 Mk 80 계열 폭탄들이 M117을 대체했습니다.
usaf_cbu-24=CBU-24,,집속탄,CBU-24는 넓은 지역으로 뿌려지는 665개의 파편형 자탄을 탑재한 무유도 집속탄으로 와일드 위즐 전투기들이 대공미사일 포대 운용 요원을 상대로 사용했습니다.
usn_gbu-10=GBU-10,페이브웨이 II,유도 폭탄,GBU-10 페이브웨이 II은 미국의 907kg(2000lb) 레이저 유도 폭탄입니다. GBU-10은 Mk.84가 모체이며 전면부에 레이저 시커와 후면부에는 유도용 꼬리날개를 달았습니다. GBU-10에 달린 유도장치는 구형 페이브웨이 I에서 업그레이드된 버전입니다.
usn_gbu-12=GBU-12,페이브웨이 II,유도 폭탄,GBU-12 페이브웨이 II는 미국의 227kg(500lb) 레이저 유도 폭탄입니다. GBU-12는 Mk.82가 모체이며 전면부에 레이저 시커와 후면부에는 유도용 꼬리날개를 달았습니다.
usn_mk-82=Mk.82,,폭탄,Mk.82는 227kg(500lb) 저저항 범용 무유도 폭탄입니다.
usn_mk-83=Mk.83,,폭탄,Mk.83은 454kg(1000lb) 저저항 범용 무유도 폭탄입니다.
usn_mk-84=Mk.84,,폭탄,Mk.84는 907kg(2000lb) 저저항 범용 무유도 폭탄입니다.
usn_rockeye=CBU-100,록아이,집속탄,CBU-100 록아이 II는 247개의 자탄을 퍼뜨리는 미국의 227kg(500lb) 집속탄입니다.
usn_walleye2=AGM-62,월아이 II,유도 폭탄,AGM-62 월아이는 1960년대부터 1990년대까지 미군이 사용한 TV 유도 활강폭탄입니다. 대부분은 113kg(250lb) 고폭 탄두를 장착하고 있었습니다.
wp_fab-100=OFAB-100,,폭탄,OFAB-100-120은 소련이 설계한 100kg(220lb) 범용 공중 투하 폭탄입니다. 고폭 탄두이며 주로 소련과 그 동맹국들이 사용했습니다.
wp_fab-250=FAB-250,,폭탄,FAB-250은 소련이 설계한 250kg(550lb) 범용 공중 투하 폭탄입니다. 고폭 탄두이며 주로 소련과 그 동맹국들이 사용했습니다.
wp_fab-500=FAB-500,M-62,폭탄,FAB-500은 소련이 설계한 500kg(1100lb) 범용 공중 투하 폭탄입니다. 고폭 탄두이며 주로 소련과 그 동맹국들이 사용했습니다.
wp_rbk-250=RBK-250,,집속탄,RBK-250은 소련의 250kg(550lb) 집속탄입니다.
usn_ssq-53=AN/SSQ-53,DIFAR,수동 소노부이,SSQ-53 방향성 주파수 분석 및 기록(DIFAR)형 소노부이입니다. 이를 통해 소노부이 감청사는 잠수함이 있는 방향을 알수 있으며 전에 사용되던 무방향 CRT-1 소노부이와 비교하여 큰 개선입니다.
usn_ssq-101=AN/SSQ-101,,능동 소노부이,AN/SSQ-101 공중투하형 능동탐지(ADAR) 소노부이는 심도가 낮은곳에서 여러개의 수중청음기를 사용하여 잠수함의 정확한 방향을 추적합니다.
wp_rgb-1=RGB-1,,수동 소노부이,RGB-1은 소련에서 사용하는 수동형 전방향 소노부이입니다.
wp_rgb-nm1=RGB-NM-1,,수동 소노부이,RGB-NM-1은 수동형 전방향 소노부이로 소련의 바쿠 시스템에서 사용됩니다.
usn_zuni=주니,,FFAR,주니는 지상 공격기와 공격 헬리콥터가 주로 사용하는 5인치 핀 접이식 항공 로켓(FFAR)입니다. 주니는 다른 FFAR과 유사하게 다양한 유형의 탄두를 사용할 수 있습니다. 보통 LAU-10 4연장 로켓 포드에서 사용됩니다.
usn_hydra=히드라 70,,FFAR,히드라 70은 전투기와 헬리콥터에서 사용되는 2.75인치 날개 접이식 항공 로켓(FFAR)입니다. 히드라 로켓은 다양한 유형의 탄두를 사용할 수 있으며 보통 19연장 로켓포드에서 사용됩니다.
wp_s-5=S-5,,FFAR,S-5는 전폭기와 헬리콥터가 사용하는 소련제 55mm 날개 접이식 항공 로켓(FFAR)입니다. S-5는 2차대전 시기 독일제 R4M 로켓에서 기원을 찾을 수 있습니다. S-5 로켓은 발사관에 장착되는데 최대 32연장까지 있습니다.
wp_s-8=S-8,,FFAR,S-8은 전폭기와 헬리콥터가 사용하는 소련제 80mm 날개 접이식 항공 로켓(FFAR)입니다. S-8은 다양한 종류가 있으며 그 중에는 활주로 무력화용도 존재합니다. S-8 로켓은 발사관에 장착되는데 최대 20연장까지 있습니다.
wp_s-25=S-25,,FFAR,S-25는 전폭기와 헬리콥터가 사용하는 소련제 266mm 날개 접이식 항공 로켓(FFAR)입니다.  S-25 로켓은 소련제 무유도 로켓 중에서 가장 크고 강력하며 탄두 중량은 60kg에 달합니다. 이러한 크기로 인해 한 발 씩만 장착 후 사용됩니다.
ir_107mm_rocket=하세브-1,,MLRS,하세브-1 로켓은 63식 다연장로켓에서 발사되는 중국산 107mm 로켓의 이란 버전입니다. 이란에서 사용하는 발사대와 로켓의 이름은 모두 하세브입니다.
wp_grad=그라드,,MLRS,M-21OF 로켓은 BM-21에서 발사되는 소련제 무기입니다. 완전한 시스템(M-21)은 "그라드" 다연장 로켓 시스템으로 알려져 있습니다.
