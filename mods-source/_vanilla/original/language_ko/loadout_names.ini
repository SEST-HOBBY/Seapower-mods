[LoadoutNames]
Default=기본                           // Usually most common loadout for this plane
Ferry=최장시간비행                                // Maximum fueltanks, no weapons, except guns and chaff
Empty=없음                                // No fueltanks, no weapons, except guns and chaff
AirToAir=공대공                        // Standard Air to Air loadout for the type
AirToAirLongRange=장거리 공대공   // Air to Air with less weapons and more fuel
AirToAirIntercept=공대공 요격     // Air to Air loadouts with emphasis on MRAAM/SRAAM
Strike=타격                              // Dumb bombs in 1 salvo
StrikeLongRange=장거리 타격          // Same as Strike but less weapons, more fuel
StrikePrecision=정밀 타격          // Guided bombs or Strike missiles (like AS-7)
StrikeHeavy=중무장 타격                  // Strike loadout for heavy bombers. (To mark it for AI usage)
CAS=근접항공지원                      // Rockets, Cluster bombs, Bombs. Usually in small salvos to increace number of attacks
AntiArmor=대전차                         // Strike missiles mostly useful only land vehicles(like AS-7)
AntiShip=대함                         // Most vague loadout. Can include anything from dumb bombs to medium-range missilies
AntiShipLongRange=장거리 대함     // Same as AntiShip, but with fueltanks
AntiShipPrecision=대함 정밀타격      // Another vague loadout. Can include guided bombs and missilies
AntiShipHeavy=중무장 대함             // Designed to mark heavy anti-ship bombers like Tu-22 and Tu-16 and small planes with most weapons
ASW=다목적 대잠                                   // Multirole ASW: Torpedoes, Depth Charges, Sonobuoys
ASWHunter=대잠 색적                       // Sonobuoys only, no weapons
ASWKiller=대잠 타격                       // ASW weapons only
SEAD=방공제압                                  // Anti-radiation missilies, Cluster bombs
SEADLongRange=장거리 방공제압              // Same as SEAD, but less weaons and more fueltanks
AEW=조기경보                          // Just a flavor naming to indicate plane purpose. This loadout supposed to be equal to "Empty"
Recon=정찰                                // Also indicates plane purpose. In some cases used for carrying recon pods.
EW=전자전                      // Also indicates plane purpose. In some cases used for carrying EW pods.
Transport=수송                        // Also indicates purpose.
Containers=컨테이너
Munitions=탄약
MilitaryVehicles=군용 차량
DryCargo=건화물
Vehicles=차량
Fertilizer=비료
Lighters=라쉬
Oil=유류
Ore=광석
Passengers=승객
Troops=병력
Gun=고정화기만                               // Only Gun ammo loaded
Early=초기
Late=후기
StrikeDemo=폭파 타격               // Specialized loadout for super-heavy bombs (>1300kg) meant to obliterate point targets such as bunkers, bridges, and other hard targets
StrikeLowAlt=저고도 타격           // Low-level strike meant for retarded bombs, such as Snakeye or parachute bombs
CASLight=경량 근접항공지원           // Like CAS, but focusing on endurance over payload
LandAttack=지상 공격                     // Long-range air to surface (land attack) cruise missile loadout, e.g. AGM-86C or RGM-109C land attack missiles
ASWHunterLight=소노부이 단독          // Sonobuoys only, no weapons
ASWBomb=대잠전 (대잠 폭탄)                  // ASW depth charges
ASWLongRange=장거리 대잠전                // Torpedo + fuel tank
SEADAdvanced=진보된 적 방공망 제압            	   // SEAD, but using accountable, limited-supply or time-restricted ammo like HARM, STARM or AS-11
Tanker=급유                              // Tanker loadout. Allows refueling
