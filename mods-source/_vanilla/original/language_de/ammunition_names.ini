[AmmunitionNames]
# ------------------ AAM ------------------
it_aspide_1a=Aspide Mk.1A,,SARH AAM,Die Aspide ist eine italienische Luft-Luft-Rakete mittlerer Reichweite, die auf Basis der amerikanischen Sparrow-Rakete entwickelt wurde. Basierend auf der AIM-7E verfügt diese Variante über einen verbesserten Antrieb, der Reichweite und Geschwindigkeit erhöht, sowie über einen deutlich modernisierten Monopuls-Suchkopf, der Einsätze gegen niedrig fliegende Ziele und verbesserte ECCM-Fähigkeiten ermöglicht.

fr_r530em=R-530K,,SARH AAM,Die R530K ist eine französische halbaktiv gelenkte Luft-Luft-Rakete kurzer Reichweite. Als eine der ersten zielsuchenden Luft-Luft-Raketen französischer Herkunft ist die R530 keine besonders zuverlässige oder durchschlagskräftige Waffe, verfügt jedoch über einen vergleichsweise lang brennenden Antrieb und eine für ihre Zeit angemessene Reichweite.
fr_super-530f=Super-530F,,SARH AAM,Die Super-530F ist eine französische, halbaktive Luft-Luft-Rakete mit kurzer bis mittlerer Reichweite. Sie ist eine Weiterentwicklung der ursprünglichen R530-Rakete.
fr_r550=R550,Magic 1,IR AAM,Die R550 Magic 1 ist eine französische Luft-Luft-Rakete mit Infrarotlenkung für den Nahbereich, vergleichbar mit der US-amerikanischen AIM-9. Sie kann nur Ziele aus dem Heckwinkel anvisieren.

pla_pl-2=PL-2A,,IR AAM,Die PL-2A (霹雳-2) ist ein chinesischer infrarotgelenkter Luft-Luft-Lenkflugkörper für den Hecksektor. Es handelt sich um eine Kopie der sowjetischen Vympel K-13 mit sehr ähnlicher Leistungscharakteristik.
pla_pl-2b=PL-2B,,IR AAM,Die PL-2B (霹雳-2) ist ein chinesischer infrarotgelenkter Luft-Luft-Lenkflugkörper für den Hecksektor. Die PL-2B verwendet eine verlängerte Bugsektion zur Aufnahme eines leicht verbesserten Suchkopfes, ist ansonsten jedoch lediglich geringfügig zuverlässiger als die PL-2A.
pla_pl-5b=PL-5B,,IR AAM,Die PL-5B (霹雳-5) ist ein chinesischer infrarotgelenkter Luft-Luft-Lenkflugkörper für den Hecksektor. Die PL-5B wurde parallel zur PL-2B entwickelt und ging aus dem gescheiterten radargelenkten Lenkflugkörper PL-5A hervor. Sie nutzt einen von der PL-2B abgeleiteten Infrarotsuchkopf, verfügt jedoch über eine leistungsfähigere Zelle mit größerer Reichweite und verbesserter Agilität.
pla_pl-5c=PL-5C,,IR AAM,Die PL-5C (霹雳-5) ist ein chinesischer infrarotgelenkter "All-Aspect" Luft-Luft-Lenkflugkörper. Als wesentliche Weiterentwicklung der Serien PL-2 und PL-5B verfügt die PL-5C über einen hochmodernen Kreuzfeld-Suchkopf, der den Einsatz aus allen Anflugrichtungen ermöglicht, sowie deutlich widerstandsfähiger gegen Gegenmaßnahmen ist. Zudem verfügt er über eine höhere Reichweite und ist außerdem deutlich agiler als seine Vorgänger.

usaf_aim-9e=AIM-9E,Sidewinder,IR AAM,Die AIM-9E Sidewinder ist eine amerikanische infrarotgelenkte Kurzstrecken-Luft-Luft-Rakete. Die AIM-9E wird als Upgrade für die vorherigen AIM-9B/F Sidewindern angeboten und weist eine bessere Wendigkeit, Lenkbarkeit, Reichweite und Gesamtwirksamkeit auf.
usaf_aim-9j=AIM-9J,Sidewinder,IR AAM,Die AIM-9J Sidewinder ist eine amerikanische infrarotgelenkte Luft-Luft-Rakete. Die AIM-9J der USAF war eine verbesserte Version der AIM-9E. Sie verfügte über teilweise Festkörperelektronik, einen länger brennenden Gasgenerator (was die Flugzeit erhöhte) und leistungsstärkere Aktuatoren, die neue, eckige Doppeldelta-Canards steuerten. 
usaf_aim-9p=AIM-9P,Sidewinder,IR AAM,Die AIM-9P Sidewinder ist ein amerikanischer infrarotgelenkter Luft-Luft-Lenkflugkörper. Die Variante Papa ist die Exportausführung der Version Juliet und verfügt über einen neuen Zünder, ein neues Triebwerk sowie einen verbesserten Suchkopf. Sie ermöglicht Abschüsse aus der Seitenansicht und ist zudem zuverlässiger.

usn_aim-7d=AIM-7D,Sparrow,SARH AAM,Die AIM-7D Sparrow ist eine amerikanische halbaktive Radarlenkrakete aus der AIM-7-Raketenserie. Die Rakete wurde ab 1959 Produziert und diente zunächst in der US-Luftwaffe.
usn_aim-7e=AIM-7E,Sparrow,SARH AAM,Die AIM-7E Sparrow ist eine amerikanische halbaktive, radargelenkte Luft-Luft-Rakete. Die AIM-7E verfügt über ein neues Antriebssystem auf Basis einer Feststoffrakete, das im Vergleich zu früheren Varianten die Reichweite und Leistung verbesserte.
usn_aim-7e2=AIM-7E-2,Sparrow,SARH AAM,Die AIM-7E-2 „Dogfight“ Sparrow ist ein amerikanischer, halbaktiver, radargelenkter Luft-Luft-Lenkflugkörper. Die Variante Echo-2 ist eine Unterversion des ursprünglichen Echo-Modells, die nach festgestellten Leistungsdefiziten im Einsatz gegen Jagdflugzeuge in Vietnam eingeführt wurde. Sie verfügt über eine verkürzte Mindestreichweite, eine leicht verbesserte Leistungsfähigkeit in niedrigen Höhen sowie eine geringfügig erhöhte Wendigkeit in der Boostphase des Fluges.
usn_aim-7e4=AIM-7E-4,Sparrow,SARH AAM,Die AIM-7E-4 Sparrow ist ein amerikanischer, halbaktiver, radargelenkter Luft-Luft-Lenkflugkörper. Die Variante Echo-4 ist eine speziell für die F-14 Tomcat entwickelte Version, die das deutlich leistungsfähigere Radar dieses Flugzeugs gegenüber früheren Mustern besser nutzt und über leicht verbesserte Suchkopfeigenschaften gegenüber Störmaßnahmen und Gegenmaßnahmen verfügt.
usn_aim-7f=AIM-7F,Sparrow,SARH AAM,Die AIM-7F Sparrow ist ein amerikanischer, halbaktiver, radargelenkter Luft-Luft-Lenkflugkörper. Die Variante Foxtrot ist eine Neukonstruktion der ursprünglichen Sparrow-III und verfügt über ein modernes Boost-Sustain-Triebwerk für eine größere Reichweite sowie über verbesserte Zünder und einen leistungsfähigeren Suchkopf. Trotzdem bleiben die Leistungsfähigkeit in geringer Höhe und die ECCM-Eigenschaften weiterhin begrenzt und der Suchkopf kann die große Reichweite dieses Lenkflugkörpers nicht vollständig ausnutzen.
usn_aim-7m=AIM-7M,Sparrow,SARH AAM,Die AIM-7M Sparrow ist eine amerikanische halbaktive, radargelenkte Luft-Luft-Rakete. Die AIM-7M ist ihren Vorgängervarianten (AIM-7E-2, AIM-7E, AIM-7D usw.) weit überlegen, hauptsächlich aufgrund ihrer Reichweite. Im Gegensatz zu den früheren Generationen von Sparrows eignet sich die AIM-7M sowohl für niedrige als auch für hohe Flughöhen, ist jedoch besonders für Ziele in großer Höhe geeignet.
usn_aim-9b=AIM-9B,Sidewinder,IR AAM,Die AIM-9B Sidewinder ist eine Luft-Luft-Rakete aus der Frühzeit des Kalten Krieges und stammt aus den USA. Die AIM-9B war die erste einsatzbereite Rakete in einer Familie von vielen Generationen von infrarotgesteuerten Raketen. Ursprünglich war sie in der US Navy als AAM-N-7 Sidewinder IA und in der US Air Force als GAR-8 bekannt, bis sie 1963 in AIM-9B umbenannt wurde.
usn_aim-9c=AIM-9C,Sidewinder,SARH AAM,Die AIM-9C Sidewinder ist ein amerikanischer, halbaktiver, radargelenkter Luft-Luft-Lenkflugkörper. Die Variante Charlie ist das einzige radargelenkte Sidewinder-Modell, das in Dienst gestellt wurde und entspricht mit Ausnahme des halbaktiven Radarsuchkopfes, der Abschüsse aus allen Anflugrichtungen auf größere Entfernungen ermöglicht, im Grunde der Delta-Version. Die ausschließliche Nutzung auf der F-8 Crusader sowie die generelle Ablehnung durch die Besatzungen führten dazu, dass die AIM-9C bereits wenige Jahre nach ihrer Einführung wieder außer Dienst gestellt wurde.
usn_aim-9d=AIM-9D,Sidewinder,IR AAM,Die AIM-9D Sidewinder ist eine amerikanische infrarotgelenkte Kurzstrecken-Luft-Luft-Rakete. Die AIM-9D ist Mitglied der Sidewinder-Raketenfamilie. Sie enthält eine Reihe von Verbesserungen gegenüber der AIM-9B, auf deren Grundlage sie entwickelt wurde.
usn_aim-9g=AIM-9G,Sidewinder,IR AAM,Die AIM-9G Sidewinder ist ein amerikanischer infrarotgelenkter Luft-Luft-Lenkflugkörper. Die Variante Golf stellt gegenüber der Delta-Version eine verbesserte Ausführung mit größerem Abschusswinkel dar und wurde zudem an andere Nationen exportiert.
usn_aim-9h=AIM-9H,Sidewinder,IR AAM,Die AIM-9H Sidewinder ist ein amerikanischer infrarotgelenkter Luft-Luft-Lenkflugkörper. Die Variante Hotel ist eine Festkörperausführung des Golf-Modells und verfügt über einen empfindlicheren Suchkopf, der auch Abschüsse aus dem Seitensektor ermöglicht, sowie über verbesserte Agilität und Zuverlässigkeit.
usn_aim-9l=AIM-9L,Sidewinder,IR AAM,Die AIM-9L war die erste "all-aspect" Sidewinder mit der Fähigkeit, aus allen Richtungen anzugreifen, einschließlich frontal, was einen dramatischen Einfluss auf die Nahkampftaktik hatte. Ihr erster Einsatz im Kampf erfolgte durch ein Paar US Navy F-14 im Golf von Sidra im Jahr 1981 während eines Luftkampfes gegen zwei libysche Su-22. Beide Flugzeuge wurden durch die AIM-9L zerstört.
usn_aim-9m=AIM-9M,Sidewinder,IR AAM,Die AIM-9M Sidewinder ist ein amerikanischer infrarotgelenkter Luft-Luft-Lenkflugkörper. Die Variante Mike ist die modernste im Dienst befindliche Ausführung und stellt eine Weiterentwicklung der Lima-Version dar, mit verbesserter Täuschkörperunterdrückung und erhöhter Reichweite des Suchkopfes.
usn_aim-54a=AIM-54A,Phoenix,AR AAM,Die AIM-54A Phoenix ist eine amerikanische Luft-Luft-Rakete mit aktivem Radarsuchkopf. Sie ist die Luft-Luft-Rakete mit der größten Reichweite im US-Arsenal und ausschließlich für die F-14 vorgesehen. In Kombination mit dem fortschrittlichen AWG-9-Radar kann die F-14 sechs Ziele gleichzeitig mit jeweils einer Rakete bekämpfen. Dabei fliegen die Raketen im Autopilotmodus, während die Bordcomputer die "Track-While-Scan"-Radardaten verarbeiten und in Zielverfolgungsdateien übertragen. Diese ermöglichen während der Mittelphase des Fluges Lenkungsanpassungen, die die Raketen in einen „Einschlagbereich“ führen, wo die Rakete in die finale Phase mit ihrem eigenen Radar-Zielsuchsystem übergeht und das Ziel eigenständig erfasst.

wp_aa-2a=R-3S,,IR AAM,Die R-3S (NATO-Codename: AA-2A Atoll) ist eine sowjetische infrarotgelenkte Luft-Luft-Rakete zur Bekämpfung von Zielen im Heckbereich. Sie ist eine rückentwickelte Kopie der amerikanischen AIM-9B, mit geringfügigen Änderungen in Konstruktion und Leistung, und weist ansonsten identische Eigenschaften auf. Nur Heckbereich-Zielerfassung.
wp_aa-2c=R-3R,,SARH AAM,Die R-3R (NATO-Codename: AA-2C Atoll) ist eine sowjetische Luft-Luft-Rakete mit halbaktiver Radarlenkung. Sie basiert auf einer rückentwickelten AIM-9B, verfügt jedoch über einen vollständig anderen Suchkopf. Abgesehen davon teilt sie die gleichen eingeschränkten Erfassungs- und Einsatzbereiche wie das amerikanische Original.
wp_aa-2d=R-13M,,IR AAM,Die R-13M (NATO-Codename: AA-2D Advanced Atoll) ist eine sowjetische Luft-Luft-Rakete mit Infrarot-Zielsuchkopf. Sie wurde von der AA-2A Atoll abgeleitet (die wiederum auf der rückentwickelten AIM-9 basiert), jedoch mit einem neuen Antrieb und Suchkopf ausgestattet, was die Leistung erheblich verbessert.
wp_aa-2-2=R-13M1,,IR AAM,Die R-13M1 (NATO-Codename: AA-2-2 Advanced Atoll) ist eine sowjetische Luft-Luft-Rakete mit Infrarot-Zielsuchkopf. Sie wurde von der AA-2A Atoll abgeleitet (die wiederum auf der rückentwickelten AIM-9 basiert), jedoch mit einem neuen Antrieb und Suchkopf ausgestattet, was die Leistung erheblich verbessert.

wp_aa-3e=R-98MR,,SARH AAM,Die R-98MR (NATO-Codename:AA-3E Advanced Anab E) ist eine von der Sowjetunion hergestellte radargelenkte Rakete, die für den Einsatz durch Abfangjäger konzipiert wurde. Der Advanced Anab weist eine bessere Gegenmaßnahmenbeständigkeit und eine höhere Reichweite auf. Zudem ist er auf das Taifun-M-Radar der Su-15TM- und Yak-28PM-Abfangjäger abgestimmt.
wp_aa-3f=R-98MT,,IR AAM,Die R-98MT (NATO-Codename: AA-3 Advanced Anab F) ist eine von der Sowjetunion hergestellte infrarotgelenkte Rakete, die für den Einsatz durch Abfangjäger konzipiert wurde. Der Advanced Anab weist eine bessere Gegenmaßnahmenbeständigkeit und eine höhere Reichweite auf
wp_aa-6a=R-40R,,SARH AAM,Die R-40R (NATO-Codename: AA-6A Acrid) ist eine Langstrecken-Luft-Luft-Rakete, die in den 1960er Jahren von der Sowjetunion speziell für den MiG-25P Abfangjäger entwickelt wurde, aber auch von der späteren MiG-31 getragen werden kann. Sie ist die größte Luft-Luft-Rakete der Welt, die jemals in Produktion gegangen ist.
wp_aa-6b=R-40T,,IR AAM,Die R-40T (NATO-Codename: AA-6B Acrid) ist eine Langstrecken-Luft-Luft-Rakete, die in den 1960er Jahren von der Sowjetunion speziell für den MiG-25P-Abfangjäger entwickelt wurde, aber auch von der späteren MiG-31 aufgenommen werden kann. Sie ist die größte Luft-Luft-Rakete der Welt, die jemals in Serie produziert wurde.
wp_aa-6c=R-40RD,,IR AAM,Die verbesserte AA-6C Acrid (R-40RD) mit halbaktiver Radarlenkung (SARH) wurde in den späten 1970er Jahren für den aufgerüsteten MiG-25PD Abfangjäger und dessen neues Saphir-25 Radar entwickelt. Die maximale Reichweite der Rakete wurde auf bis zu 60 km erhöht.
wp_aa-6d=R-40TD,,SARH AAM,Die verbesserte AA-6D Acrid (R-40TD) mit Infrarotlenkung (IR) wurde in den späten 1970er Jahren für den aufgerüsteten MiG-25PD Abfangjäger entwickelt. Die maximale Reichweite der Rakete wurde auf bis zu 60 km erhöht.
wp_aa-7c=R-24R,,SARH AAM,Die R-24R (AA-7C Apex) ist eine Mittelstrecken-Luft-Luft-Rakete, die in der Sowjetunion für Kampfflugzeuge entwickelt wurde. Sie ist sowohl in Bezug auf die Gesamtleistung als auch die Funktion mit der amerikanischen AIM-7 Sparrow vergleichbar.
wp_aa-7d=R-24T,,IR AAM,Die AA-7D Apex (R-24T) ist eine mittelstrecken-Luft-Luft-Rakete, die in der Sowjetunion für Jagdflugzeuge entwickelt wurde. Sie ist vergleichbar mit der amerikanischen AIM-7 Sparrow, sowohl in Bezug auf die Gesamtleistung als auch auf die Anforderungen.
wp_aa-8=R-60MK,,IR AAM,Die AA-8 Aphid (R-60M)ist eine leichte, infrarotgelenkte Kurzstrecken-Luft-Luft-Rakete, die für den Einsatz in sowjetischen Jagdflugzeugen entwickelt wurde. Sie wurde weit verbreitet exportiert und bleibt im Dienst der GUS und vieler anderer Nationen.
wp_aa-10a=R-27R,,SARH AAM,Die AA-10A Alamo (Wympel R-27R) ist ein sowjetischer Luft-Luft-Flugkörper mittlerer Reichweite mit halbaktiver Radarlenkung. Die AA-10 wurde als Ersatz für die ältere Flugkörperfamilie AA-7 entwickelt und ist der modernste verfügbare sowjetische BVRAAM. Sie zeichnet sich durch hohe Geschwindigkeit, gute Manövrierfähigkeit und einen gegenüber Gegenmaßnahmen widerstandsfähigen Suchkopf aus.
wp_aa-10b=R-27T,,IR AAM,Die AA-10B Alamo (Wympel R-27T) ist ein sowjetischer Luft-Luft-Flugkörper mittlerer Reichweite mit Infrarotlenkung. Die AA-10 wurde als Ersatz für die ältere Flugkörperfamilie AA-7 entwickelt und ist der modernste verfügbare sowjetische BVRAAM. Sie zeichnet sich durch hohe Geschwindigkeit, gute Manövrierfähigkeit und einen gegenüber Gegenmaßnahmen widerstandsfähigen Suchkopf aus.
wp_aa-10c=R-27ER,,SARH AAM,Die AA-10C Alamo (Wympel R-27ER) ist ein sowjetischer Luft-Luft-Flugkörper großer Reichweite mit halbaktiver Radarlenkung. Die AA-10 wurde als Ersatz für die ältere Flugkörperfamilie AA-7 entwickelt und ist der modernste verfügbare sowjetische BVRAAM. Sie zeichnet sich durch hohe Geschwindigkeit, gute Manövrierfähigkeit und einen gegenüber Gegenmaßnahmen widerstandsfähigen Suchkopf aus.\nDie Long-Burn-Varianten AA-10C/D verfügen über deutlich größere Raketenmotoren als die Varianten AA-10A/B. Dadurch erreichen sie eine außergewöhnlich hohe Höchstgeschwindigkeit und eine erheblich größere maximale Reichweite.
wp_aa-10d=R-27ET,,IR AAM,Die AA-10D Alamo (Wympel R-27ET) ist ein sowjetischer Luft-Luft-Flugkörper großer Reichweite mit Infrarotlenkung. Die AA-10 wurde als Ersatz für die ältere Flugkörperfamilie AA-7 entwickelt und ist der modernste verfügbare sowjetische BVRAAM. Sie zeichnet sich durch hohe Geschwindigkeit, gute Manövrierfähigkeit und einen gegenüber Gegenmaßnahmen widerstandsfähigen Suchkopf aus.\nDie Long-Burn-Varianten AA-10C/D verfügen über deutlich größere Raketenmotoren als die Varianten AA-10A/B. Dadurch erreichen sie eine außergewöhnlich hohe Höchstgeschwindigkeit und eine erheblich größere maximale Reichweite.
wp_aa-11=R-73A,,IR AAM,Die AA-11 Archer (Vympel R-73A) ist eine sowjetische, kurzreichweitige Luft-Luft-Rakete mit Infrarotlenkung. Sie zählt zu den leistungsfähigsten Kurzstreckenraketen im sowjetischen Arsenal, ist im internationalen Vergleich äußerst konkurrenzfähig und stellt auf kurze Distanz aus allen Anflugrichtungen eine äußerst tödliche Bedrohung dar.

# ------------------ SAM ------------------
it_aspide_1=Aspide Mk.1A,,SAM/ASuW,Die Aspide ist eine italienische Boden-Luft-Rakete mittlerer Reichweite, die auf Basis der amerikanischen Sparrow-Rakete entwickelt wurde. Basierend auf der AIM-7E verfügt diese Variante über einen verbesserten Antrieb, der Reichweite und Geschwindigkeit erhöht, sowie über einen deutlich modernisierten Monopuls-Suchkopf, der Einsätze gegen niedrig fliegende Ziele und verbesserte ECCM-Fähigkeiten ermöglicht.\nDie bodengestützte Variante besitzt gegenüber der luftgestützten Ausführung eine geringere Reichweite und Geschwindigkeit, ist jedoch weiterhin deutlich leistungsfähiger als die RIM-7E.

jsdf_sam1=Tan-SAM 1,,SAM,Eine japanische, infrarotgelenkte Kurzstrecken-Flugabwehrrakete. Bestandteil des Type-82-Luftabwehrsystems.

plan_hq-61=HQ-61,,SAM,Die HQ-61 ist eine chinesische Boden-Luft-Rakete, die der RIM-7F Sea Sparrow ähnelt und ihr in etwa entspricht.

raf_rapier=FSB Rapier,Rapier,SAM,Britisches Kurzstrecken-Nahverteidigungsraketensystem für niedrige Flughöhen. Wegen des verwendeten CLOS-Lenksystems zeigt es jedoch eine begrenzte Wirksamkeit gegen schnelle Jets und Raketen.

rn_seacat=GWS-21,Sea Cat Mk.1,SAM,Die GWS-21 Seacat ist das erste schiffsgestützte Nahverteidigungs-Raketensystem. Es trat 1962 in den Dienst der Royal Navy und wurde häufig als Ersatz für die Bofors-40mm-Kanone exportiert. Wegen des verwendeten CLOS-Lenksystems zeigt es jedoch eine begrenzte Wirksamkeit gegen schnelle Jets und Raketen.
rn_seacat_mk2=GWS-24,Sea Cat Mk.2,SAM,Die GWS-24 Seacat ist eine weiterentwickelte Version der Sea Cat Mk.1 (GWS-20) mit verbesserter Leistungsfähigkeit in niedrigen Höhen, größerer Reichweite und höherer Zuverlässigkeit, kombiniert mit einem moderneren Feuerleitsystem. Dennoch bleibt es ein insgesamt leistungsschwacher Lenkflugkörper, dessen Wirksamkeit als fraglich gilt.

usa_mim-14=MIM-14,Nike Hercules,SAM,Das MIM-14 Nike Hercules ist ein Boden-Luft-Raketen­system, das von den Streitkräften der Vereinigten Staaten und der NATO zur Luftverteidigung im mittleren und hohen Höhenbereich eingesetzt wird.
usa_mim-23=MIM-23,Hawk,SAM,Das in den 1960er-Jahren in den USA entwickelte HAWK-System ist ein relativ mobiles Mittelstrecken-Flugabwehrraketensystem. Die Lenkwaffe selbst nutzt eine halbaktive Zielverfolgung, wobei sie von einem Hochleistungs-Zielbeleuchtungsradar (HPIR – High Power Illuminator Radar) gelenkt wird, das Teil der umfassenden HAWK-Batterie ist. Ziele werden durch das Puls-Akquisitionsradar (PAR – Pulse Acquisition Radar) in großen Höhen sowie durch das Dauerstrich-Akquisitionsradar (CWAR – Continuous Wave Acquisition Radar) in niedrigen Höhen und bei starkem Bodenclutter erfasst.

usn_rim-8=RIM-8J,Talos,SAM/ASuW,Die RIM-8 Talos war eine Langstrecken-Boden-Luft-Rakete (SAM) und eine der ersten SAMs, die auf den Schiffen der US Navy eingesetzt worden sind. Die Talos nutzte eine Radarstrahlführung zur Annäherung an ihr Ziel und eine halbaktive Radarzielsuche (SARH) zur Endzielführung. Die vier Antennen um die Nase herum waren SARH-Empfänger, die als kontinuierliches Welleninterferometer fungierten. Ein Feststoffraketentriebwerk sorgte für den Startschub, ein Staustrahltriebwerk (Ramjet) trieb den Flug zum Ziel an, wobei der Sprengkopf als Verdichter für den Ramjet diente.

usn_rim-7=RIM-7E,Sea Sparrow,SAM/ASuW,Die Marinevariante der AIM-7, die RIM-7 Sea Sparrow, ist eine verbreitete Rakete, die von zahlreichen NATO-Staaten als Punktverteidigungssystem für Kriegsschiffe eingesetzt wird. Das System wurde als leichtes System entwickelt, das so schnell wie möglich auf bereits existierenden Schiffen nachgerüstet werden konnte, oft anstelle vorhandener luftabwehrwaffenbasierter Geschütze. Es ist ein sehr einfaches System, das von einem manuell ausgerichteten Feuerleitradar gesteuert wird. Nach seiner Einführung wurde das System erheblich weiterentwickelt, um zu einem automatisierten System ähnlich den anderen US-Navy-Raketen wie dem RIM-2 Terrier zu werden.
usn_rim-7h=RIM-7H,Sea Sparrow,SAM/ASuW,Die RIM-7H Sea Sparrow ist eine kurzreichweitige Flugabwehrrakete und stellt den primären schiffsgestützten Punktverteidigungsflugkörper der NATO dar. Die Hotel-Variante der Sea Sparrow ist insgesamt der Echo-Variante sehr ähnlich. Unterschiede bestehen darin, dass die RIM-7H über klappbare Leitflächen verfügt, um in neuere Startsysteme zu passen, sowie über eine leicht verbesserte Zuverlässigkeit.
usn_rim-7m=RIM-7M,Sea Sparrow,SAM/ASuW,Die Marinevariante der AIM-7, die RIM-7 Sea Sparrow, ist eine verbreitete Rakete, die von zahlreichen NATO-Staaten als Punktverteidigungssystem für Kriegsschiffe eingesetzt wird. Das System wurde als leichtes System entwickelt, das so schnell wie möglich auf bereits existierenden Schiffen nachgerüstet werden konnte, oft anstelle vorhandener luftabwehrwaffenbasierter Geschütze. Es ist ein sehr einfaches System, das von einem manuell ausgerichteten Feuerleitradar gesteuert wird. Nach seiner Einführung wurde das System erheblich weiterentwickelt, um zu einem automatisierten System ähnlich den anderen US-Navy-Raketen wie dem RIM-2 Terrier zu werden.

# RIM-2 Terrier
usn_rim-2f=RIM-2F,Terrier,SAM/ASuW,Die RIM-2F ist die finale Variante der Terrier-Rakete, die über ein neues Raketentriebwerk und einen halbaktiven Radarzielsucher verfügt. Diese Rakete blieb bis zur Einführung der RIM-67 im Einsatz. Am 19. April 1972 schoss eine Terrier-Rakete, abgefeuert von der USS Sterett, im Gefecht von Dong Hoi eine nordvietnamesische MiG-17F ab.
usn_rim-24b=RIM-24B,Tartar,SAM/ASuW,Beschreibung folgt

# RIM-66 SM-1MR/SM-2MR
usn_rim-66a=RIM-66A,SM-1MR,SAM/ASuW,Die RIM-66A Standard Missile 1 MR wurde als neuer Flugkörper entwickelt, um auf Plattformen eingesetzt zu werden, die zuvor den RIM-24C Tartar verwendeten. Die Standard-Missile nutzt denselben Flugkörperrumpf wie der Tartar, um die Integration in bestehende Startsysteme zu vereinfachen. Die Variante A war die früheste Version und wurde im Jahr 1967 in Dienst gestellt.
usn_rim-66b=RIM-66B,SM-1MR,SAM/ASuW,Die RIM-66B Standard Missile 1 MR wurde als neuer Flugkörper entwickelt, um auf Plattformen eingesetzt zu werden, die zuvor den RIM-24C Tartar verwendeten. Die Standard-Missile nutzt denselben Flugkörperrumpf wie der Tartar, um die Integration in bestehende Startsysteme zu vereinfachen. Die Variante B stellte eine wesentliche Kampfwertsteigerung gegenüber der Variante A dar und verfügte über modernisierte Komponenten. Der Großteil der Flugkörper der Variante A wurde auf den Stand der Variante B nachgerüstet.
usn_rim-66e=RIM-66E,SM-1MR,SAM/ASuW,Die RIM-66E Standard Missile 1 MR wurde als neuer Flugkörper entwickelt, um auf Plattformen eingesetzt zu werden, die zuvor den RIM-24C Tartar verwendeten. Die Standard-Missile nutzt denselben Flugkörperrumpf wie der Tartar, um die Integration in bestehende Startsysteme zu vereinfachen. Die Variante E stellt eine überarbeitete Version des Modells B dar, mit modernisierter Elektronik unter Verwendung von Komponenten des SM-2MR, und verfügt über die begrenzte Fähigkeit zur Bekämpfung von tief fliegenden Seezielflugkörpern.
usn_rim-66c=RIM-66C,SM-2MR,SAM/ASuW,Die RIM-66C Standard Missile 2 MR (SM-2MR Block I) wurde in den 1970er Jahren entwickelt und war ein wichtiger Bestandteil des Aegis-Kampfsystems und des New Threat Upgrades (NTU). Der Autopilot der Rakete ist so programmiert, dass er den effizientesten Weg zum Ziel fliegt und Kurskorrekturen vom Boden empfangen kann.
usn_rim-66d=RIM-66D,SM-2MR,SAM/ASuW,Die RIM-66D Standard Missile 2 MR (SM-2MR Block I) wurde in den 1970er Jahren entwickelt und war ein wichtiger Bestandteil des Aegis-Kampfsystems und des New Threat Upgrades (NTU). Der Autopilot der Rakete ist so programmiert, dass er den effizientesten Weg zum Ziel fliegt und Kurskorrekturen vom Boden empfangen kann. 
usn_rim-66g=RIM-66G,SM-2MR,SAM/ASuW,Die RIM-66G Standard Missile 2 MR Block II ist Bestandteil des AEGIS-Kampfsystems, das auf den neuesten Kriegsschiffen der US Navy, sowie im Rahmen des New Threat Upgrade (NTU) auf älteren Plattformen eingeführt wurde. Gegenüber der älteren Standard Missile 1 bietet die RIM-66G eine deutlich gesteigerte Leistung bei einem gleichzeitig reduziertem Bedarf an Zielbeleuchtern. Dadurch wird die gleichzeitige Führung einer größeren Anzahl von Flugkörpern im Zielanflug ermöglicht.\nDie Block-II-Variante des SM-2MR verdoppelt die Reichweite gegenüber Block-I-Flugkörpern, verbessert die Wirkung gegen schnelle Ziele und verfügt über eine geringere Wirkhöhe im Vergleich zu älteren Modellen der Standard-Missile, ist jedoch für die Bekämpfung extrem tieffliegender Seezielflugkörper nicht das Mittel der Wahl.
usn_rim-66h=RIM-66H,SM-2MR,SAM/ASuW,Die Standard Missile 2 ist eine Familie radargelenkter Flugabwehrraketen zur weiträumigen Luftverteidigung mit einer zusätzlichen Fähigkeit zur Bekämpfung von Seezielen auf kurze Entfernung. Kennzeichnend sind ihre langbrennenden Marschtriebwerke und ihre ausgewogene Leistungsfähigkeit gegen ein breites Spektrum von Bedrohungen. Gegenüber der SM-1 ersetzt die Standard Missile 2 die halbaktive Radarlenkung während des gesamten Fluges durch eine fortschrittliche Datenlink-Steuerung in der Marschphase; erst in den letzten Sekunden des Anflugs erfolgt die Radarzielverfolgung für die Endphasenlenkung. Dadurch können sich gleichzeitig erheblich mehr SM-2 in der Luft befinden, als Feuerleitradare zur Zielbeleuchtung verfügbar sind – ein entscheidender Vorteil gegenüber mit SM-1 ausgerüsteten Schiffen.\n\nDie SM-2MR Block II (RIM-66H) ist die für AEGIS und das Mark-41-VLS ausgelegte Variante der SM-2-Block-II-Familie. Sie wird senkrecht aus einer Mk-41-Zelle gestartet, wodurch sich die Feuerrate erheblich erhöht, allerdings auf Kosten einer größeren Mindestreichweite.

# RIM-67 SM-1ER/SM-2ER
usn_rim-67a=RIM-67A,SM-1ER,SAM/ASuW,Die RIM-67A Standard Missile 1 ER ist die primäre Langstrecken-Luftabwehrwaffe der US Navy. Im sekundären Anti-Schiff-Modus fliegt sie eine ballistische Bahn, um das Ziel in einem Hochgeschwindigkeits-Sturzflug zu treffen.
usn_rim-67b=RIM-67B,SM-2ER,SAM/ASuW,Die RIM-67B Standard Missile 2 ER (Extended Range) verfügt über einen programmierbaren Autopiloten, um die Rakete in einen SARH (Semi-Active Radar Homing) Endanflug-'Korb' zu lenken, wodurch sie eine effizientere Flugbahn erreicht und die Reichweite der Rakete verdoppelt wird. Im sekundären Anti-Schiffsmodus fliegt sie eine ballistische Bahn, um das Ziel in einem Hochgeschwindigkeits-Endanflug zu treffen.
usn_rim-67c=RIM-67C,SM-2ER,SAM/ASuW,Die RIM-67C Standard Missile 2 ER ist ein Kernelement des New Threat Upgrade (NTU) für Plattformen, die zuvor mit dem RIM-2 Terrier ausgerüstet waren. Der Flugkörper ist weitgehend identisch mit dem RIM-66C, verfügt jedoch über einen zusätzlichen Booster zur Reichweitensteigerung.\nDie Block-II-Variante des SM-2ER verbessert Geschwindigkeit und Reichweite gegenüber den Block-I-Flugkörpern, erhöht die Wirksamkeit gegen schnelle Ziele und verfügt über eine geringere Mindestwirkhöhe im Vergleich zu älteren Varianten der Standard-Missile. Zur Abwehr von Seezielflugkörpern im extremen Tiefflug ist sie jedoch nicht das Mittel der Wahl.


wp_sa-n-1=V-601,Volna-M,SAM/ASuW,Die M-1 Volna (NATO-Codename: SA-N-1 Goa) war das erste schiffsgestützte Flugabwehrraketensystem der Sowjetunion. Es war für die weiträumige Luftverteidigung vorgesehen und bot zugleich einen gewissen Schutz vor anfliegenden Seezielflugkörpern. Die ursprüngliche Ausführung war vor allem gegen hochfliegende Luftziele wirksam. Spätere Varianten erhielten zusätzlich eine Fähigkeit zur Bekämpfung von Seezielen, konnten tieffliegende Ziele wesentlich besser bekämpfen und verfügten über eine größere Reichweite.
wp_sa-n-1c=V-601P,Volna-P,SAM/ASuW,Die M-1 Volna-P (NATO-Codename: SA-N-1C Goa) ist eine weiterentwickelte Variante des ersten sowjetischen schiffsgestützten Flugabwehrraketensystems. Gegenüber früheren Ausführungen ist sie widerstandsfähiger gegen elektronische Störmaßnahmen und Düppel und kann auch tieffliegende Ziele wirksam bekämpfen.
wp_sa-n-1d=V-601M,Volna-N,SAM/ASuW,Die M-1 Volna-N (NATO-Codename: SA-N-1D Goa) ist eine Weiterentwicklung des ersten sowjetischen schiffsgestützten Flugabwehrraketensystems. Diese Ausführung weist eine deutlich verbesserte Wirksamkeit gegen tief über der Meeresoberfläche anfliegende Ziele auf.
wp_sa-n-3=V-611,Shtorm-M,SAM/ASuW,Die M-11 Shtorm (NATO-Codename: SA-N-3 Goblet) ist ein sowjetisches schiffsgestütztes Flugabwehrraketensystem. Es kam auf mehreren Klassen von Raketenkreuzern sowie auf sowjetischen Hubschrauber- und STOVL-Trägern zum Einsatz. Neben seiner eigentlichen Flugabwehrrolle kann das System auch gegen Seeziele eingesetzt werden. Neuere Ausführungen waren zudem effektiver gegen tieffliegende Ziele.
wp_sa-n-3b=V-611M,Shtorm-N,SAM/ASuW,Die M-11 Shtorm-N (NATO-Codename: SA-N-3B Goblet) ist ein sowjetisches schiffsgestütztes Flugabwehrraketensystem. Das System wurde auf verschiedenen Flugkörperkreuzern sowie auf sowjetischen Hubschrauber- und STOVL-Trägern eingesetzt. Es kann zudem gegen Überwasserziele eingesetzt werden. Diese Ausführung ist deutlich effektiver gegen tief fliegende Ziele.
wp_sa-n-4=9M33M3,Osa-MA,SAM/ASuW,Die M-4 Osa (NATO-Codename: SA-N-4 Gekko) ist die Marineversion des landgestützten Flugabwehrraketensystems Osa (NATO-Codename: SA-8 Gecko – mit abweichender Schreibweise). Zwei Flugkörper befinden sich auf einem einfahrbaren und drehbaren Starter. Das System wurde auf zahlreichen sowjetischen Schiffsklassen eingesetzt und dient vor allem der Luftverteidigung im Nahbereich.
wp_sa-n-4c=9M33M5,Osa-MA2,SAM/ASuW,Die M-4 Osa (NATO-Codename: SA-N-4 Gekko) ist die schiffsgestützte Ausführung des landgestützten Flugabwehrraketensystems Osa (NATO-Codename: SA-8 Gecko – mit abweichender Schreibweise) und verfügt über einen einziehbaren, drehbaren Doppelstarter. Diese Ausführung stellt die modernste seegestützte Variante des Osa-Systems dar und bietet eine deutlich verbesserte Wirksamkeit gegen tief fliegende Ziele, eine höhere Widerstandsfähigkeit gegen elektronische Störmaßnahmen sowie eine insgesamt gesteigerte Zuverlässigkeit.
wp_sa-n-5=9M32M,Strela-2M,SAM,Die 9K32 Strela-2 (NATO-Codename: SA-N-5 Grail) ist eine tragbare Flugabwehrrakete, deren landgestützte Ausführung von der NATO als SA-7 bezeichnet wird. An Bord von Schiffen dient sie als Waffe zur Nahbereichsverteidigung.
wp_sa-n-6=5V55RM,S-300F Fort,SAM/ASuW,Die S-300F Fort (NATO-Codename: SA-N-6 Grumble) ist die Marineversion des landgestützten Flugabwehrraketensystems S-300P (SA-10). Dieses leistungsfähige Langstreckensystem kommt auf sowjetischen Raketenkreuzern zum Einsatz und bietet eine Leistungsfähigkeit, die in etwa mit der amerikanischen SM-2 vergleichbar ist.
wp_sa-n-7=9M38M1,Uragan,SAM/ASuW,Die M-22 Uragan (NATO-Codename: SA-N-7 Gadfly) ist die Marineversion des landgestützten Flugabwehrraketensystems 9K37 Buk (SA-11 Gadfly). Das moderne und leistungsfähige System wurde mit den Zerstörern der Sowremenny-Klasse in Dienst gestellt und stellt einen wesentlichen Fortschritt in der sowjetischen schiffsgestützten Luftverteidigung dar.
wp_sa-n-9=9M330,Kinzhal,SAM/ASuW,Die 3K95 Kinzhal (NATO-Codename: SA-N-9 Gauntlet) ist die Marineversion des landgestützten Flugabwehrraketensystems 9K330 Tor (SA-15 Gauntlet). Sie verwendet denselben Flugkörper wie die SA-15 und wurde auf zahlreichen größeren sowjetischen Kampfschiffen installiert.
wp_sa-n-10=9M39,Igla,SAM,Die 9K38 Igla (NATO-Codename: SA-N-10 Grail) ist eine tragbare Flugabwehrrakete, deren landgestützte Ausführung von der NATO als SA-18 bezeichnet wird. An Bord von Schiffen wird sie zur Nahbereichsverteidigung eingesetzt.
wp_sa-n-12=9M317,Uragan,SAM/ASuW,Die 9M317 Uragan-Tornado (NATO-Codename: SA-N-12 Gadfly) ist die Marineversion des landgestützten Flugabwehrraketensystems 9K37 Buk (SA-17 Grizzly). Die weiterentwickelte Ezh-Ausführung bietet gegenüber der ursprünglichen Uragan eine größere Reichweite, verbesserte ECCM-Fähigkeiten und eine deutlich höhere Wirksamkeit gegen tief über der Meeresoberfläche anfliegende Flugkörper.

wp_sa-2=V-759,Volkhov,SAM,Die S-75M2 Volkhov (NATO-Codename: SA-2E Guideline) ist ein sowjetisches Langstrecken-Flugabwehrraketensystem, das vor allem zur Bekämpfung von Bombern über großen Entfernungen entwickelt wurde. Das System wurde in zahlreiche Staaten exportiert und kam in vielen Konflikten zum Einsatz. Besonders bekannt wurde es durch seinen umfangreichen Einsatz während des Vietnamkriegs.
wp_sa-3=V-601P,Neva,SAM,Die S-125M1 Neva-M1 (NATO-Codename: SA-3B Goa) ist ein sowjetisches Flugabwehrraketensystem mittlerer Reichweite. Es wurde speziell für die Bekämpfung manövrierfähigerer Ziele in niedrigen und mittleren Flughöhen entwickelt und ergänzt damit die auf größere Höhen ausgelegten sowjetischen Langstreckensysteme.
wp_sa-4=3M8M1,Krug,SAM,Die 2K11 Krug (NATO-Codename: SA-4 Ganef) ist ein mobiles sowjetisches Flugabwehrraketensystem mittlerer Reichweite. Es wurde zur weiträumigen Bekämpfung feindlicher Luftziele, insbesondere von Bombern, entwickelt.
wp_sa-5=V-880M,Vega,SAM,Die S-200M Vega-M (NATO-Codename: SA-5B Gammon) ist ein sowjetisches Langstrecken-Flugabwehrraketensystem zur Bekämpfung hochfliegender Luftziele über sehr große Entfernungen. Seine Flugkörper verfügen zudem über eine Home-on-Jam-Fähigkeit und können daher gegnerische Störsender selbstständig anpeilen.
wp_sa-6=3M9M3,Kub-M3,SAM,Die 2K12 Kub-M3 (NATO-Codename: SA-6 Gainful) ist ein mobiles sowjetisches Flugabwehrraketensystem zur Bekämpfung von Luftzielen auf kurze bis mittlere Entfernung. Seine effektive Reichweite beträgt etwa 15 Meilen.
wp_sa-8=9M33M3,Osa-AKM,SAM,Die 9K33M3 Osa-AKM (NATO-Codename: SA-8 Gecko) ist ein hochmobiles sowjetisches Flugabwehrraketensystem für den Nahbereich. Es wurde entwickelt, um Panzer- und motorisierte Verbände unmittelbar gegen Luftangriffe zu schützen.
wp_sa-11=9M38,Buk,SAM,Die 9K37 Buk (NATO-Codename: SA-11 Gadfly) ist ein mobiles sowjetisches Flugabwehrraketensystem zur Bekämpfung von Luftzielen auf kurze bis mittlere Entfernung. Seine effektive Reichweite beträgt etwa 18 Meilen.
wp_sa-13=9M37M,Strela-10,SAM,Die 9K35 Strela-10 (NATO-Codename: SA-13 Gopher) ist ein hochmobiles sowjetisches Kurzstrecken-Flugabwehrraketensystem. Es ist besonders für die Bekämpfung tief fliegender und plötzlich auftauchender Ziele wie Hubschraubern ausgelegt.

# ---------- Anti-radar Missiles ---------
usn_agm-45=AGM-45B,Shrike,ARM,Die AGM-45 Shrike ist eine amerikanische Antiradar-Rakete, die dafür konzipiert wurde, feindliche Flugabwehrradarstationen auszuschalten. Die Shrike wurde 1963 vom Naval Weapons Center in China Lake durch die simple Montage eines Suchkopfes auf dem Raketengehäuse einer AIM-7 Sparrow entwickelt. Sie wurde von den USA im Jahr 1992 ausgemustert.
usn_agm-78=AGM-78D,Standard ARM,ARM,Die AGM-78 Standard ARM (STARM) ist ein amerikanischer Langstrecken-Anti-Radar-Flugkörper, ausgelegt zur Bekämpfung hochwertiger Flugabwehrraketensysteme aus großer Stand-off-Entfernung. STARM basiert auf der Flugabwehrrakete SM-1MR und verfügt über ein langbrennendes Marschtriebwerk sowie ein Steigflugprofil zur Reichweitenmaximierung. Zudem ist er mit einem leistungsstarken Gefechtskopf ausgestattet, der die Zerstörung des getroffenen Radarsystems sicherstellen soll. Aufgrund ihrer hohen Kosten und geringen Verfügbarkeit handelt es sich jedoch um eine nicht sehr weit verbreitete Waffe, von der jeweils nur wenige Exemplare eingesetzt werden können.
usn_agm-88a=AGM-88A,HARM,ARM,Die AGM-88A HARM (High-speed Anti-Radiation Missile) ist ein amerikanischer Langstrecken-Anti-Radar-Lenkflugkörper mit außergewöhnlicher Leistungsfähigkeit in allen Kategorien. Die HARM stellt bis 1985 den modernsten Anti-Radar-Lenkflugkörper im NATO-Arsenal dar und übertrifft ihre Vorgänger in nahezu jeder Hinsicht, insbesondere in Zuverlässigkeit und Höchstgeschwindigkeit. Da dieser Lenkflugkörper zum aktuellen Zeitpunkt noch sehr neu ist, stehen jeweils nur begrenzte Stückzahlen (oder unter Umständen gar keine) zum Einsatz zur Verfügung.
usn_agm-122a=AGM-122A,Sidearm,ARM,Die AGM-122A ist ein kurzreichweitiger taktischer Anti-Radar-Lenkflugkörper, der primär für den Einsatz von Hubschraubern und Starrflügelflugzeugen vorgesehen ist. Aus der kurzlebigen AIM-9C abgeleitet, stellt die Sidearm wirksam plötzlich auftretende SHORAD-Bedrohungen bekämpfen, ist jedoch ungeeignet um gegen umfangreiche oder leistungsfähige Luftverteidigungssysteme eingesetzt zu werden.

usn_rgm-8h=RGM-8H,Talos ARM,ARM,Die RGM-8H Talos ist die Anti-Radar-Version des Flugkörpers RIM-8 Talos und erreicht aufgrund seines großen Durchmessers eine sehr hohe Reichweite und Geschwindigkeit. Obwohl die RIM-8H auf einer Flugabwehrrakete basiert, ist sie nicht in der Lage, Luftziele zu bekämpfen und kann daher ausschließlich als Seezielflugkörper gegn Ziele eingesetzt werden, die über eine aktive Radarsignatur verfügen.

wp_as-11=Kh-58,,ARM,Die Kh-58 oder AS-11 Kilter ist eine sowjetische Antiradar-Rakete mit einer Reichweite von 120 km. Die Rakete wurde als Feststoff-Nachfolger der Kh-28 entwickelt, um die neuen Su-24M 'Fencer-D' auszurüsten.
wp_as-12=Kh-25MP,,ARM,Die AS-12 Kegler (Kh-25MP) ist eine sowjetische, luftgestützte überschallschnelle Anti-Radar-Rakete mittlerer Reichweite. Sie ist die am weitesten verbreitete ARM im sowjetischen Dienst und in etwa mit der amerikanischen AGM-45 Shrike vergleichbar.

wp_as-2b=K-10SP,,EW,Der K-10SP ist eine Variante des Flugkörpers K-10S, bei der der Gefechtskopf durch das Störsystem Azaliya ersetzt wurde

# ---------- Anti-ship Missiles ----------
is_gabriel_2=Gabriel 2,,ASM,Gabriel ist eine Familie von Seezielflugkörpern, die in Israel hergestellt wird. Die erste Variante der Rakete wurde in den 1960er Jahren entwickelt, um den Anforderungen der israelischen Marine gerecht zu werden, die sie erstmals 1970 einsetzte. Seitdem wurden Varianten an Marineeinheiten auf der ganzen Welt exportiert.
is_gabriel_3=Gabriel 3,,ASM,Die Gabriel 3 ist ein israelischer Kurzstrecken-Seezielflugkörper mit Sea-Skimming-Flugprofil und aktivem Radarsuchkopf. Es handelt sich um eine weiterentwickelte Version der Gabriel 2 mit überarbeitetem Bug zur Aufnahme eines modernen aktiven Radarsuchkopfs, der einen „Fire-and-Forget“-Einsatz ermöglicht.
is_gabriel_3as=Gabriel 3AS,,ASM,Die Gabriel 3AS ist ein israelischer Kurzstrecken-Seezielflugkörper mit Sea-Skimming-Flugprofil und aktivem Radarsuchkopf. Es handelt sich um die luftgestützte Variante der Gabriel 3 mit erhöhter Reichweite und überarbeitetem Rumpf.

it_seakiller_2=Sea Killer 2,,ASM,Sea Killer ist eine Familie von italienischen Seezielflugkörpern. Die neueste Entwicklung des Systems ist unter dem Namen Marte bekannt. Sea Killer Mark 2 wurde von Iran gekauft, um seine Saam-Klasse von vier Fregatten auszurüsten, von denen jede mit einem einzelnen Fünf-Raketen-Abschussbehälter ausgestattet war.
it_otomat_mk1=Otomat MK1,,ASM,Die Otomat MK1 ist eine Anti-Schiffs-Rakete mittlerer Reichweite, die in Zusammenarbeit zwischen Italien und Frankreich entwickelt wurde.

jasdf_asm-1=ASM-1,,ASM,Die ASM-1 ist ein japanischer Seezielflugkörper. Bei der ASM-1 handelt es sich um die luftgestützte Variante.

fr_as12=AS.12,,ASM,Die AS.12 ist ein Kurzstrecken-Seezielflugkörper französischer Herkunft, der von Hubschraubern eingesetzt wird. Sie ist eine weiterentwickelte Version der Panzerabwehrrakete SS.11 und verfügt über einen längeren Antrieb sowie einen deutlich größeren Gefechtskopf. Dadurch ist sie eine erhebliche Bedrohung für Boote und kleinere Schiffe.
fr_am-39=AM39,Exocet,ASM,Die AM39 Exocet ist ein allwetterfähiger Seezielflugkörper aus französischer Produktion. Produziert wird sie von der französischen Sparte des europäischen Rüstungsunternehmens MBDA. In den 1970er Jahren entwickelt, wurde sie laufend an neue Bedrohungslagen angepasst und modernisiert. Exocet ist bis heute im Einsatz und einer der weltweit am weitesten verbreiteten Seezielflugkörper.
fr_mm-38=MM38,Exocet,ASM,Die MM38 Exocet ist ein allwetterfähiger Seezielflugkörper aus französischer Produktion. Produziert wird sie von der französischen Sparte des europäischen Rüstungsunternehmens MBDA. In den 1970er Jahren entwickelt, wurde sie laufend an neue Bedrohungslagen angepasst und modernisiert. Exocet ist bis heute im Einsatz und einer der weltweit am weitesten verbreiteten Seezielflugkörper.
fr_sm-39=SM39,Exocet,ASM,Die SM39 Exocet ist ein französischer Seezielflugkörper für den Einsatz aus großer Entfernung. Sie ist innerhalb der NATO und bei zahlreichen weiteren Staaten eine verbreitete Alternative zur Harpoon. Die SM39 ist die von U-Booten gestartete Variante und verfügt über bessere ECCM-Eigenschaften sowie eine größere Reichweite als die ursprüngliche schiffsgestützte Exocet, da sie auf der modernisierten AM39 Mod 2 basiert.

knm_penguin_mk2=AGM-119,Penguin Mk2,ASM,Der Seezielflugkörper Penguin, von den US-Streitkräften als AGM-119 bezeichnet, ist eine norwegische, auf passiver Infrarot-Suche basierende, kurz- bis mittelweitreichende Rakete, die speziell für den Einsatz auf See konzipiert worden ist.

plan_sy-1=SY-1,,ASM,Die SY-1 ist eine chinesische Lizenzproduktion der sowjetischen Styx-Rakete.
plan_sy-1a=SY-1A,,ASM,Die SY-1A ist eine chinesische Lizenzproduktion der sowjetischen Styx-Rakete.
plan_hy-1=HY-1,,ASM,Die HY-1 ist eine chinesische Lizenzproduktion der sowjetischen Styx-Rakete.
plan_hy-1j=HY-1J,,ASM,Die HY-1J ist eine chinesische Lizenzproduktion der sowjetischen Styx-Rakete.
plan_hy-1a=HY-1A,,ASM,Die HY-1A ist eine chinesische Lizenzproduktion der sowjetischen Styx-Rakete. Die HY-1A ist eine verbesserte Version der HY-1J mit einem optimierten Suchkopf und einem niedrigeren Flugprofil, wodurch das Abfangen der Rakete deutlich erschwert wird.
plan_hy-2=HY-2,,ASM,Die HY-2 ist eine weiterentwickelte chinesische Version der sowjetischen Styx-Rakete mit größerer Reichweite und in etwa vergleichbar mit der P-20.
pla_hy-3=HY-3,,ASM,Die HY-3 ist eine bodengestützte, überschallschnelle, strahlgetriebene Schiffsabwehrrakete, die Geschwindigkeiten bis Mach 2,5 erreicht und über eine Reichweiten von etwa 130–180 Kilometern verfügt. Ihre Entwicklung wurde Anfang der 1990er-Jahre abgeschlossen, jedoch wurde die Rakete nicht in Dienst gestellt.
plan_hy-4=HY-4,,ASM,Die HY-4 ist eine chinesische Weiterentwicklung der HY-2, bei der das ursprüngliche flüssigkeitsgetriebene Raketentriebwerk durch ein Turbojet-Triebwerk ersetzt wurde. Dadurch konnte die Reichweite deutlich gesteigert werden. Aufgrund der sperrigen Zelle fliegt die HY-4 jedoch über weite Teile ihres Flugprofils in relativ großer Höhe und mit vergleichsweise geringer Geschwindigkeit.
pla_yj-1=YJ-1,,ASM,Der YJ-1 ist ein luftgestützter, überschallschneller Seezielflugkörper kurzer Reichweite mit einer Tiefflug-Endanflugphase im Seaskimming-Profil. Obwohl dieser Flugkörper nicht in den regulären Dienst übernommen wurde, stand Ende der 1980er Jahre eine begrenzte Anzahl von Vorserienmustern zur Verfügung und war primär für den Einsatz auf dem Flugboot SH-5 vorgesehen.
pla_yj-6=YJ-6,,ASM,Der YJ-6 ist ein chinesischer luftgestützter Seezielflugkörper, entwickelt aus dem land- und schiffsgestützten System SY-1/HY-1. Aufgrund des luftgestützten Einsatzprofils verfügt er über eine erhöhte Einsatzreichweite, nutzt jedoch einen alten Suchkopf und ist anfällig gegenüber elektronischen Gegenmaßnahmen, ähnlich wie andere, ältere Flugkörper der Styx- oder Silkworm-Serie.
plan_yj-8=YJ-8,,ASM,Die YJ-8 ist ein chinesischer Seezielflugkörper, welcher der französischen Exocet ähnelt und ihr in etwa entspricht. Nach dem Start steigt die Rakete auf 20–30 Meter und sinkt dann für den Angriff auf eine Flughöhe von 5–7 Metern in einem seegängigen Tiefflugprofil ab.

usn_agm-12b=AGM-12B,Bullpup,ASM,Die AGM-12 Bullpup ist eine amerikanische, luftgestützte, überschallschnelle Luft-Boden-Rakete. Sie wird – ähnlich wie die sowjetische AS-7 – manuell vom Bediener gelenkt und weist daher vergleichbare Nachteile auf, allen voran die Notwendigkeit, das Trägerflugzeug auf direktem Kurs zum Ziel zu halten.
usn_agm-123=AGM-123,Skipper,ASM,Der Seezielflugkörper Penguin, von den US-Streitkräften als AGM-119 bezeichnet, ist eine norwegische, auf passiver Infrarot-Suche basierende, kurz- bis mittelweitreichende Rakete, die speziell für den Einsatz auf See konzipiert worden ist.
usn_agm-84a=AGM-84A,Harpoon,ASM,Die Harpoon ist ein Allwetter-Seezielflugkörper, der eine aktive Radarzielsuche verwendet und knapp über der Wasseroberfläche fliegt, um einer gegnerischen Entdeckung oder der gegnerischen Verteidigungen zu entgehen. Die luftgestützte Variante wird als AGM-84 bezeichnet.
usn_agm-84c=AGM-84C,Harpoon,ASM,Die Harpoon ist ein Allwetter-Seezielflugkörper, der eine aktive Radarzielsuche verwendet und knapp über der Wasseroberfläche fliegt, um einer gegnerischen Entdeckung oder der gegnerischen Verteidigungen zu entgehen. Die Variante AGM-84C wird luftgestützt eingesetzt. Sie führt kein „Pop-up“-Manöver im Endanflug durch, sondern geht in eine sea-skimming-Phase im Tiefflug über, um Schiffe wirkungsvoller bekämpfen zu können.
usn_agm-84d=AGM-84D,Harpoon,ASM,Die Harpoon ist ein Allwetter-Seezielflugkörper, der eine aktive Radarzielsuche verwendet und knapp über der Wasseroberfläche fliegt, um einer gegnerischen Entdeckung oder der gegnerischen Verteidigungen zu entgehen. Die luftgestützte Variante wird als AGM-84 bezeichnet.

usn_rgm-84a=RGM-84A,Harpoon,ASM,Die Harpoon ist ein Allwetter-Seezielflugkörper, der eine aktive Radarzielsuche verwendet und knapp über der Wasseroberfläche fliegt, um einer gegnerischen Entdeckung oder der gegnerischen Verteidigungen zu entgehen. Die bodengestützte Variante wird als RGM-84 bezeichnet.
usn_rgm-84c=RGM-84C,Harpoon,ASM,Die Harpoon ist ein Allwetter-Seezielflugkörper, der eine aktive Radarzielsuche verwendet und knapp über der Wasseroberfläche fliegt, um einer gegnerischen Entdeckung oder der gegnerischen Verteidigungen zu entgehen. Die bodengestützte Variante wird als RGM-84 bezeichnet.
usn_rgm-84d=RGM-84D,Harpoon,ASM,Die Harpoon ist ein Allwetter-Seezielflugkörper, der eine aktive Radarzielsuche verwendet und knapp über der Wasseroberfläche fliegt, um einer gegnerischen Entdeckung oder der gegnerischen Verteidigungen zu entgehen. Die Variante RGM-84D ist schiffsgestützt einsetzbar. Die AGM-84D stellt eine modernisierte Ausführung dar, eingeführt ab 1985.
usn_rgm-109b=RGM-109B,TASM,ASM,Die RGM-109B ist die Seezielflugkörper-Variante der Tomahawk-Rakete.

usn_ugm-84a=UGM-84A,Harpoon,ASM,Die Harpoon ist ein Allwetter-Seezielflugkörper, der eine aktive Radarzielsuche verwendet und knapp über der Wasseroberfläche fliegt, um einer gegnerischen Entdeckung oder der gegnerischen Verteidigungen zu entgehen. Die Variante zum Abschuss aus U-Booten wird als UGM-84 bezeichnet.
usn_ugm-84b=UGM-84B,Harpoon,ASM,Die Harpoon ist ein Allwetter-Seezielflugkörper, der eine aktive Radarzielsuche verwendet und knapp über der Wasseroberfläche fliegt, um einer gegnerischen Entdeckung oder der gegnerischen Verteidigungen zu entgehen. Die Variante zum Abschuss aus U-Booten wird als UGM-84 bezeichnet.
usn_ugm-84c=UGM-84C,Harpoon,ASM,Die Harpoon ist ein Allwetter-Seezielflugkörper, der eine aktive Radarzielsuche verwendet und knapp über der Wasseroberfläche fliegt, um einer gegnerischen Entdeckung oder der gegnerischen Verteidigungen zu entgehen. Die Variante UGM-84C wird auf U-Booten eingesetzt und aus einem Einweg-Startbehälter verschossen. Im Gegensatz zur älteren UGM-84A führt sie kein Endanflug-Pop-up-Manöver aus, sondern nutzt eine Tiefflug-Endphase im Seaskimming-Profil zur wirkungsvolleren Bekämpfung von Seezielen.
usn_ugm-109b=UGM-109B,TASM,ASM,Die RGM-109B Tomahawk Anti-Ship Missile (TASM) ist ein US-amerikanischer Seezielflugkörper. Der Flugkörper verfügt über einen aktiven Radarsuchkopf, der nach Abarbeitung einer vorprogrammierten Flugroute aktiviert wird und ist in der Lage, ein Suchmuster mit Täuschmanövern zu fliegen.\nDiese Variante wird von U-Booten eingesetzt und ausschließlich aus Torpedorohren verschossen.

wp_as-2=K-10S,Kometa-10,ASM,Die K-10S (NATO-Codename: AS-2 Kipper) ist ein sowjetischer überschallschneller, luftgestützter Seezielflugkörper für Angriffe aus großer Entfernung, der für den Einsatz mit der Tu-16 entwickelt wurde. In ihrer Auslegung ähnelt sie grob einer luftgestützten SS-N-3 und weist auch vergleichbare Schwächen auf. Bereits gegen nur mäßig moderne Luftabwehrsysteme ist ihre Wirksamkeit daher deutlich eingeschränkt.
wp_as-4=Kh-22N,Burya,ASM,Die Kh-22 Burya (NATO-Codename: AS-4 Kitchen) ist ein sowjetischer überschallschneller, luftgestützter Seezielflugkörper für Angriffe aus großer Entfernung, der von der Tu-22M und Tu-95 eingesetzt wird. Sie fliegt ihr Ziel in großer Höhe und mit hoher Geschwindigkeit an und geht im Endanflug in einen überschallschnellen Sturzflug über, wodurch sie nur schwer abzufangen ist.
wp_as-6=Kh-26,,ASM,Die Kh-26 (NATO-Codename: AS-6 Kingfish) ist eine sowjetische überschallschnelle, luftgestützte Abstandswaffe für Angriffe auf Land- und Seeziele, die für den Einsatz mit der Tu-16 entwickelt wurde. Als kleinere Verwandte der AS-4 fliegt sie ihr Ziel in großer Höhe und mit hoher Geschwindigkeit an und geht im Endanflug in einen überschallschnellen Sturzflug über, wodurch sie nur schwer abzufangen ist.
wp_as-7=Kh-23M,,ASM,Die Kh-23 (NATO-Codename: AS-7 Kerry) ist eine sowjetische überschallschnelle, luftgestützte Abstandswaffe für Angriffe auf Bodenziele. Der Flugkörper muss vom Bediener während des Fluges manuell zum Ziel gelenkt werden. Das Verfahren ähnelt dem der amerikanischen AGM-12 Bullpup und bringt auch vergleichbare Nachteile mit sich.
wp_as-10=Kh-25,,ASM,Die Kh-25 (NATO-Codename: AS-10 Karen) ist eine sowjetische überschallschnelle, luftgestützte Abstandswaffe für Angriffe auf Bodenziele. Sie verfügt über einen Lasersuchkopf, der einen Fire-and-Forget-Einsatz ermöglicht.
wp_as-13=Kh-59,Ovod,ASM,Die Kh-59 Ovod (NATO-Codename: AS-13 Kingbolt) ist eine sowjetische unterschallschnelle, luftgestützte Abstandswaffe für Angriffe auf Bodenziele. Während des Marschfluges folgt sie mithilfe ihrer Trägheitsnavigation vorprogrammierten Zielkoordinaten, bevor sie im Endanflug auf TV-Zielsuchlenkung übergeht.
wp_as-14a=Kh-29L,,ASM,Die Kh-29L (NATO-Codename: AS-14A Kedge) ist ein sowjetischer überschallschneller Luft-Boden-Flugkörper mit schwerem Gefechtskopf und Laserlenkung.
wp_as-14b=Kh-29T,,ASM,Die Kh-29T (NATO-Codename: AS-14B Kedge) ist ein sowjetischer überschallschneller Luft-Boden-Flugkörper mit schwerem Gefechtskopf und TV-Lenkung. Diese ermöglicht eine größere Einsatzreichweite, weist jedoch bei Nacht eine deutlich eingeschränkte Leistungsfähigkeit auf.

wp_ss-n-2=P-15U,Termit,ASM,Die P-15U Termit (NATO-Codename: SS-N-2 Styx) ist ein sowjetischer unterschallschneller Seezielflugkörper für Angriffe aus großer Entfernung. In China wurde die Waffe in Lizenz gefertigt und unter der bekannten NATO-Bezeichnung CSS-C-2 Silkworm geführt. Neben Schiffen können mit ihr auch küstennahe Landziele angegriffen werden.
wp_ss-n-2c=P-15MT,Termit-M,ASM,Die P-15MT Termit-M (NATO-Codename: SS-N-2C Styx) ist ein sowjetischer unterschallschneller Seezielflugkörper für Angriffe aus großer Entfernung. Gegenüber der ursprünglichen P-15 verfügt sie über eine größere Reichweite und eine verbesserte Widerstandsfähigkeit gegen elektronische Gegenmaßnahmen. Auch küstennahe Landziele können mit ihr bekämpft werden.
wp_ss-n-3=P-35,,ASM,Die P-35 (4K44/4K48) (NATO-Codename: SS-N-3 Shaddock) ist ein sowjetischer unterschallschneller Seezielflugkörper für Angriffe aus großer Entfernung. Zum Zeitpunkt seiner Einführung war der Flugkörper eine äußerst ernstzunehmende Bedrohung, sein hoch verlaufendes Flugprofil macht ihn gegenüber moderneren Flugabwehrraketen jedoch sehr verwundbar. Ein weiterer Nachteil besteht darin, dass die Startplattform während des gesamten Fluges Verbindung zum Flugkörper halten muss. Von U-Booten aus eingesetzt bedeutet dies, dass diese während des Angriffs aufgetaucht bleiben müssen und dadurch selbst besonders anfällig für Gegenangriffe sind.
wp_ss-n-3b=P-35M,Progress,ASM,Die P-35M (3M44) Progress (NATO-Codename: SS-N-3B Sepal) ist ein sowjetischer unterschallschneller Seezielflugkörper für Angriffe aus großer Entfernung. Sie stellt eine Weiterentwicklung der ursprünglichen P-35 dar und verfügt über eine niedrigere Flughöhe sowie eine verbesserte Widerstandsfähigkeit gegen elektronische Störmaßnahmen und Düppel.
wp_ss-n-7=P-70,Ametist,ASM,Die P-70 Ametist (NATO-Codename: SS-N-7 Starbright) ist ein sowjetischer transsonischer, von U-Booten gestarteter Seezielflugkörper. Sie war das weltweit erste Flugkörpersystem, das von einem getauchten U-Boot aus gestartet werden konnte. Ihre Reichweite ist vergleichsweise gering; später wurde sie durch die SS-N-9 Siren abgelöst.
wp_ss-n-9=P-120M1,Malakhit,ASM,Die P-120 Malakhit (NATO-Codename: SS-N-9 Siren) ist ein sowjetischer unterschallschneller Seezielflugkörper für Angriffe aus großer Entfernung. Sie ist schneller und reichweitenstärker als die Styx und kann im Endanflug Ausweichmanöver durchführen, um ihre Überlebensfähigkeit gegenüber der gegnerischen Luftabwehr zu erhöhen.
wp_ss-n-12=P-500,Bazalt,ASM,Die P-500 Bazalt (NATO-Codename: SS-N-12 Sandbox) ist ein sowjetischer überschallschneller Seezielflugkörper für Angriffe aus großer Entfernung und wurde als Nachfolger der SS-N-3 Shaddock entwickelt. Gegenüber ihrem Vorgänger ist sie erheblich schneller und verfügt über einen Datenlink zwischen den Flugkörpern eines Salvos. Dadurch kann der Großteil des Salvos in geringer Höhe anfliegen, während ein einzelner Flugkörper höher steigt und die Zielaufklärung für die übrigen übernimmt. Zusätzlich verfügt die P-500 über elektronische Gegenmaßnahmen, um ihre Überlebensfähigkeit gegenüber der gegnerischen Luftabwehr zu erhöhen.
wp_ss-n-19=P-700,Granit,ASM,Die P-700 Granit (NATO-Codename: SS-N-19 Shipwreck) ist ein sowjetischer überschallschneller Seezielflugkörper für Angriffe aus großer Entfernung. Sie fliegt ein HI-LO-Profil und verfügt über einen fortschrittlichen Datenlink, über den mehrere Flugkörper eines Salvos Ziele untereinander aufteilen können, während ein einzelner Flugkörper in größerer Höhe die Zielaufklärung übernimmt. Im Endanflug kann die Granit Ausweichmanöver durchführen. Zusätzlich verfügt sie über einen eigenen ECM-Störsender und Täuschkörper und ist gegen CIWS-Beschuss sowie Flugkörpersplitter gepanzert. Nach praktisch jedem Maßstab ist sie eine äußerst gefährliche Waffe.
wp_ss-n-22=P-100,Moskit,ASM,Die 3M80 P-100 Moskit (NATO-Codename: SS-N-22 Sunburn) ist ein sowjetischer überschallschneller Seezielflugkörper für Angriffe aus großer Entfernung. Sie fliegt ein LO-LO-Profil mit einer überschallschnellen Endanflugphase dicht über der Meeresoberfläche. Währenddessen führt der Flugkörper schlangenförmige Ausweichmanöver durch, um seine Überlebensfähigkeit gegenüber der gegnerischen Luftabwehr zu erhöhen.
wp_ss-n-22b=P-105,Moskit-M,ASM,Die 3M82 P-105 Moskit-M (NATO-Codename: SS-N-22B Sunburn) ist ein sowjetischer überschallschneller Seezielflugkörper für Angriffe aus großer Entfernung. Sie fliegt ein HI-LO-Profil mit einer überschallschnellen Endanflugphase dicht über der Meeresoberfläche. Währenddessen führt der Flugkörper schlangenförmige Ausweichmanöver durch, um seine Überlebensfähigkeit gegenüber der gegnerischen Luftabwehr zu erhöhen.\nGegenüber der ursprünglichen Sunburn verfügt die Ende der 1980er Jahre eingeführte Moskit-M (3M82, SS-N-22B) über die Fähigkeit, ein HI-LO-Flugprofil zu nutzen. Eine größere Treibstoffkapazität erhöht zudem ihre Gesamtreichweite, während sie gleichzeitig schneller und im Endanflug tiefer fliegt als ihr Vorgängermodell.

#----------- Land Strike only missiles---------
fr_as11=AS.11,,Panzerabwehrlenkwaffe,Die SS.11/AS.11 ist eine gelenkte Kurzstrecken-Panzerabwehrlenkwaffe französischer Herkunft. Diese Ausführung verfügt über einen halbpanzerbrechenden Gefechtskopf zur Bekämpfung kleiner Boote anstelle einer Hohlladung zur Panzerabwehr.

usn_agm-65b=AGM-65B,Maverick,Panzerabwehrlenkwaffe,Die AGM-65 Maverick ist eine TV-, infrarot- oder lasergelenkte Rakete und war die erste taktische Luft-Boden-Waffe mit "Fire-and-Forget"-Technologie im Dienst der Streitkräfte der Vereinigten Staaten. Sie wurde in großer Stückzahl produziert und wird bis heute eingesetzt.
usaf_agm-86c=AGM-86C,CALCM,Seezielflugkörper,Die Conventional Air Launched Cruise Missile (CALCM) ist ein amerikanischer luftgestützter Marschflugkörper zur Bekämpfung von Bodenzielen aus sicherer Entfernung und das Haupt-Stand-off-Waffensystem der B-52. Diese Waffen fliegen nach dem Start eine vorprogrammierte Route zum Ziel, ohne weitere Steuerung durch die Startplattform. Sie verwenden dabei einen Gelände-Kontur-Abgleich mithilfe von digitalen TERCOM-Karten.

usn_rgm-109c=RGM-109C,TLAM-C,Landzielflugkörper,Die Tomahawk Land Attack Missile (TLAM) ist ein weitreichender, allwetterfähiger, strahlgetriebener, unterschalliger Marschflugkörper, der hauptsächlich von der United States Navy und der Royal Navy bei Landangriffsoperationen von Schiffen und U-Booten eingesetzt wird.

usn_ugm-109c=UGM-109C,TLAM-C,Landzielflugkörper,Die RGM-109C Tomahawk Anti-Ship Missile (TASM) ist ein US-amerikanischer Seezielflugkörper. Der Flugkörper verfügt über einen aktiven Radarsuchkopf, der nach Abarbeitung einer vorprogrammierten Flugroute aktiviert wird und ist in der Lage, ein Suchmuster mit Täuschmanövern zu fliegen.\nDiese Variante wird von U-Booten eingesetzt und ausschließlich aus Torpedorohren verschossen. Die UGM-109C kann für den U-Boot-Start nicht vollständig betankt werden und verfügt daher über eine gegenüber der schiffsgestützten Variante reduzierte Reichweite.

usa_bgm-71a=BGM-71A,TOW,Panzerabwehrlenkwaffe,Die BGM-71 TOW ("Tube-launched, Optically tracked, Wire-guided" – Deutsch: "Rohrstart, optisch gelenkt, drahtgeführt") ist eine amerikanische Panzerabwehrrakete. Die TOW ersetzte viel kleinere Raketen wie die SS.10 und ENTAC und bot etwa die doppelte effektive Reichweite, einen leistungsstärkeren Sprengkopf sowie eine deutlich verbesserte halbautomatische Steuerung über Sichtverbindung (SACLOS – „semi-automatic command to line of sight“), die auch mit Infrarotkameras für den nächtlichen Einsatz ausgestattet werden konnte.
usa_bgm-71c=BGM-71C,I-TOW,Panzerabwehrlenkwaffe,Die BGM-71 I-TOW ist ein amerikanischer drahtgelenkter Panzerabwehrlenkflugkörper. Die Waffe wird sowohl von Hubschraubern als auch von gepanzerten Fahrzeugen eingesetzt. Bei diesem Modell handelt es sich um die modernisierte I-TOW mit größerer Reichweite. Gegen die neuesten sowjetischen Kampfpanzer kann ihre Wirkung jedoch weiterhin begrenzt sein.
usa_bgm-71d=BGM-71D,TOW 2,Panzerabwehrlenkwaffe,Die BGM-71D TOW 2 ist ein amerikanischer drahtgelenkter Panzerabwehrlenkflugkörper. Die Waffe wird sowohl von Hubschraubern als auch von gepanzerten Fahrzeugen eingesetzt. Sie ist eine umfassende Neukonstruktion der ursprünglichen BGM-71 TOW und verfügt über einen deutlich größeren Gefechtskopf sowie einen verbesserten Antrieb, wodurch sie auch modernste gepanzerte Ziele zuverlässig bekämpfen kann.

wp_as-4b=Kh-22MP,,Panzerabwehrlenkwaffe,Die Kh-22MP (NATO-Codename: AS-4B Kitchen-B) ist ein sowjetischer überschallschneller Abstandsflugkörper für Angriffe auf Landziele.

wp_at-6=9M114,Kokon,Panzerabwehrlenkwaffe,Die 9M114 Kokon (NATO-Codename: AT-6 Spiral) ist ein sowjetischer überschallschneller Panzerabwehrlenkflugkörper, der von verschiedenen Kampfhubschraubern eingesetzt wird, insbesondere von der Ka-29 und Mi-24. Sie zeichnet sich durch ihre große Reichweite, hohe Geschwindigkeit und einen leistungsstarken Gefechtskopf aus.
wp_at-10=9M117,Bastion,Panzerabwehrlenkwaffe,Die 9M117 Bastion (NATO-Codename: AT-10 Sabber) ist ein sowjetischer Panzerabwehrlenkflugkörper, der vom Kampfpanzer T-55M eingesetzt wird.

wp_ss-1c=R-17,Elbrus,TBM,Die R-17 Elbrus 9K72 (NATO-Codename: SS-1C Scud-B) ist eine sowjetische taktische ballistische Rakete, deren Entwicklung ursprünglich auf die V-2 zurückgeht. Aufgrund ihrer geringen Kosten und vielseitigen Einsatzmöglichkeiten fand sie weltweit eine sehr große Verbreitung. Obwohl ihr eine präzise Endphasenlenkung fehlt und vor dem Start eine langwierige Betankung erforderlich ist, stellt sie für Einrichtungen ohne moderne Luftverteidigung weiterhin eine erhebliche Bedrohung dar.

# ---------- Anti-sub  Missilies ----------
ran_ikara=GWS-40,Ikara,ASW,Der GWS-40 Ikara ist ein australischer U-Jagd-Flugkörper mit Raketenantrieb, der einen Torpedo Mk-46 oder Mk-44 zur Bekämpfung getauchter Ziele aussetzt. Obwohl die Reichweite etwa doppelt so groß ist wie beim US-amerikanischen ASROC-System, ist Ikara langsamer und kann aufgrund seiner Startkonfiguration nicht in schneller Folge gestartet werden.

usn_rur-5=RUR-5,ASROC,ASW,Die RUR-5 ASROC (für "Anti-Submarine Rocket") ist eine Allwetter-Anti-U-Boot-Rakete zur Bekämpfung von Unterwasserzielen in großer Entfernung. Entwickelt von der United States Navy in den 1950er Jahren, wurde sie in den 1960er Jahren eingesetzt, in den 1990er Jahren überarbeitet und schließlich auf über 200 US-Marineschiffen installiert, speziell auf Kreuzern, Zerstörern und Fregatten.
usn_rum-139a=RUM-139A,VL-ASROC,ASW,Die RUM-139A VL-ASROC (Vertical-Launch ASROC) ist ein U-Jagd-Flugkörper für Angriffe aus größerer Entfernung. Sie wurde als Übergangsnachfolgerin der aus den 1960er Jahren stammenden RUR-5 entwickelt und ist für den Einsatz aus dem Senkrechtstartsystem Mark 41 vorgesehen. Als Nutzlast trägt sie den verbesserten Torpedo Mark 46 NEARTIP. Obwohl während des Kalten Krieges offiziell keine Mittel für eine reguläre Beschaffung bereitgestellt wurden, stehen Ende der 1980er Jahre einige Vorserienflugkörper zur Verfügung. Dadurch erhalten neu in Dienst gestellte Schiffe mit VLS zumindest eine begrenzte Fähigkeit zum Einsatz von U-Jagd-Flugkörpern.

wp_apr-2=APR-2,,ASW,Der APR-2 ist ein luftgestützter aktiver/passiver akustischer Torpedo zur U-Boot-Jagd (ASW). Die Reichweite des Zielsuchsystems betrug 1.500 Meter (1.650 Yards). Er konnte in Tiefen von über 600 Metern (2.000 Fuß) eingesetzt werden.
wp_ss-n-14a=URPK-4,Metel,ASW,Die URPK-3 Metel (NATO-Codename: SS-N-14 Silex) ist eine sowjetische U-Jagd-Abstandswaffe. Ähnlich wie die australische Ikara trägt sie einen Torpedo unter einem kleinen Marschflugkörper, der diesen in die Nähe des Zielgebiets transportiert.
wp_ss-n-14b=URK-5,Rastrub,ASW/ASuW,Die URK-5 Rastrub-B (NATO-Codename: SS-N-14 Silex-B) ist eine sowjetische Abstandswaffe zur Bekämpfung von U-Booten und Seezielen. Ähnlich wie die australische Ikara trägt sie einen Torpedo unter einem kleinen Marschflugkörper, der diesen in die Nähe des Zielgebiets transportiert.
wp_ss-n-16=RPK-6,Vodopad,ASW,Die RPK-6M Vodopad (NATO-Codename: SS-N-16 Stallion) ist eine sowjetische, von U-Booten eingesetzte U-Jagd-Abstandswaffe. Sie folgt nach dem Start einer ballistischen Flugbahn und setzt ihren Torpedo in der Nähe des Zielgebiets ab.

# ------------------ RBU ------------------
knm_terne_shell=Terne III Mörser,,ASW Mörser,Terne ist ein norwegisches Anti-U-Boot-Waffensystem, welches durch Raketen abgeworfene Wasserbomben verwendet. Es wurde vom norwegischen Forschungsinstitut der Verteidigung (FFI – „Forsvarets forskningsinstitutt“) in Zusammenarbeit mit der US Navy in den späten 1940er- bis frühen 1960er-Jahren entwickelt.

plan_type62dc=FQF-1200,,ASW Mörser,Der FQF-1200 ist ein chinesischer fünfläufiger Raketenwerfer zur U-Boot-Abwehr.
plan_type75dc=FQF-2500,,ASW Mörser,Der FQF-2500 ist ein chinesischer zwölfläufiger Raketenwerfer zur U-Boot-Abwehr.

rn_limbo_shell=LIMBO Mörser,,ASW Mörser,Limbo, oder „Anti Submarine Mortar Mark 10“ (A/S Mk.10), war die letzte Weiterentwicklung des nach vorne gerichteten Wasserbombenwerfers „Squid“, der während des Zweiten Weltkriegs konzipiert wurde und in den 1950er Jahren vom Admiralty Underwater Weapons Establishment entwickelt wurde.
rn_squid_shell=SQUID Mörser,,ASW Mörser,Squid war eine britische Anti-U-Boot-Waffe für Schiffe im Zweiten Weltkrieg. Sie bestand aus einem dreiläufigen Werfer, der Wasserbomben abfeuerte. Sie ersetzte das Hedgehog-System und wurde ihrerseits wiederum vom Limbo-System abgelöst.

swe_375mm_rocket=Bofors M/50,,ASW Mörser,Das Bofors M/50 iit ein schwedischer 375mm Raketenwerfer zur U-Jagd.

wp_rgb-10=RBU-1000,,ASW Mortar,Der RBU-1000 (oder Smerch-3) ist ein russischer 30mm-Raketenwerfer, der zur Abwehr von U-Booten und Torpedos eingesetzt wird. Er wurde etwa 1962–1963 in Dienst gestellt. Seine Funktionsweise ähnelt dem Hedgehog-System, das im Zweiten Weltkrieg verwendet wurde. Der RBU-1000 wird ferngesteuert vom Feuerleitsystem Burya ausgerichtet. Die Besatzung besteht aus drei Mann, zwei im Magazinraum und einer im Kontrollzentrum. Der Werfer besteht aus sechs Rohren, die automatisch einzeln aus einem unterirdischen Magazin geladen werden, das entweder 60 oder 48 Schuss pro Werfer enthält.
wp_rgb-12=RBU-1200,,ASW Mortar,Der RBU-1200 (oder Smerch-3) ist ein sowjetischer 251mm-Raketenwerfer zur U-Boot-Abwehr. Der RBU-1200 hat eine Reichweite von ca. 1200 yards.
wp_rgb-25=RBU-2500,,ASW Mortar,Der RBU-2500 (oder Smerch-1) ist ein Wasserbombenwerfer sowjetischer Bauart zur U-Boot-Abwehr aus der frühen Zeit des Kalten Krieges. Er wurde in den 1950er Jahren entwickelt und während des Kalten Krieges weit verbreitet eingesetzt. Der RBU-2500 schließt die Lücke zwischen Anti-U-Boot-Raketensystemen großer Reichweite und Wasserbombenwerfern, die Ladungen über das Heck des Schiffes abwerfen. Der RBU-2500 verwendet ein System aus 16-Werferrohren. Winkel und Azimut werden durch das einfache, aber effektive Smerch-Feuerleitsystem gesteuert.
wp_rgb-60=RBU-6000,,ASW Mortar,Der RBU-6000 (oder Smerch-2) ist ein sowjetischer 213mm-Raketenwerfer zur U-Boot-Abwehr. Er funktioniert nach dem gleichen Prinzip wie das Hedgehog-System der Royal Navy, das während des Zweiten Weltkriegs verwendet wurde. Das System wurde 1960–1961 in Dienst gestellt und ist auf einer Vielzahl von russischen Schiffen installiert worden. Es besteht aus einer hufeisenförmigen Anordnung von zwölf Abschussrohren, die ferngesteuert vom Burya-Feuerleitsystem ausgerichtet werden.

# --------------- Torpedoes ---------------
fr_e15=E15,,U-Jagd-Torpedo,Der französische E15-Torpedo ist ein passiv-gelenkter Torpedo mit einem Durchmesser von 55 cm, den ein Feuerleitsystem auf eine Entfernung von bis zu 700 Metern zum Ziel bringt. Dieser Torpedo wurde als Exportvariante des E12 entwickelt, der wiederum auf erbeuteten deutschen Torpedos wie dem T-5 basierte.
fr_l3=L3,,U-Jagd-Torpedo,Der französische L3-Torpedo ist ein 55 cm großer, akustikgelenkter Torpedo zur U-Boot-Bekämpfung. Er ist nicht mehr im Dienst der französischen Marine, wird jedoch als Exportprodukt noch von anderen Nationen verwendet. Etwa 600 Exemplare wurden hergestellt.
fr_l5_mod3=L5,Mod 3,U-Jagd-Torpedo,Der französische L5-Torpedo Mod 3 ist ein mittelschwerer 55-cm-U-Jagd-Torpedo. Diese Variante ist eine schnellere Version des L5-U-Jagd-Torpedos mit größerer Reichweite und wurde entwickelt, um mit größeren Sonar-Erfassungsreichweiten und höheren U-Boot-Geschwindigkeiten Schritt zu halten.
fr_f17_mod1=F17,Mod 1,U-Jagd-Torpedo,Der französische F17-Torpedo ist ein schwerer drahtgelenkter 55-cm-Seezieltorpedo. Diese Variante ist schneller und reichweitenstärker als der E15-Seezieltorpedo und verfügt über Drahtlenkung für Kursänderungen sowie über zwei Geschwindigkeitsstufen.
fr_f17_mod2=F17,Mod 2,Torpedo,Der französische F17-Torpedo ist ein schwerer drahtgelenkter 55-cm-Mehrzwecktorpedo. Diese modernisierte Ausführung des ursprünglichen F17 verfügt dank eines Aktiv-/Passivsuchkopfs über die Fähigkeit zur U-Jagd, größere Tauchtiefe und größere Reichweite.
fr_f17p=F17P,,Torpedo,Der französische F17P-Torpedo („Polyvalent“) ist ein schwerer drahtgelenkter 55-cm-Mehrzwecktorpedo. Diese ausschließlich für den Export vorgesehene modernisierte Ausführung des ursprünglichen F17 verfügt dank eines Aktiv-/Passivsuchkopfs über die Fähigkeit zur U-Jagd und kann sowohl von Schiffen als auch von U-Booten eingesetzt werden.

ger_dm1=DM1,,U-Jagd-Torpedo, Der erste drahtgelenkte Torpedo Deutschlands zum Kampfs gegen U-Boote.
ger_dm2=DM2,,U-Jagd-Torpedo, Ein deutscher drahtgelenkter Torpedo gegen Seeziele.
ger_sst4=SST4,,U-Jagd-Torpedo, Ein schwerer deutscher drahtgelenkter Torpedo gegen Seeziele, welcher für den Export produziert wurde.

it_a-244s_air=A-244,,U-Jagd-Torpedo,Italienischer leichter luftabgeworfener Torpedo zur U-Jagd. Verfügt über aktive und passive Sonarsteuerung.

jmsdf_type80=Type 80,,Torpedo,Torpedo Typ 80. Ergebnis der Forschungsprogramme GRX-1 und GRX-2 aus den 1970er-Jahren und beeinflusst vom USN-Entwurf des Mark 37. Dieser drahtgelenkte Torpedo zur U-Jagd und Schiffsbekämpfung bietet gegenüber dem Mark 37 verbesserte Eigenschaften in Antrieb, Leistung und Reichweite.
jmsdf_type54=Type 54,,Torpedo,Torpedo Typ 54 Modell 3 Mod 1. Erster nach dem Zweiten Weltkrieg in Japan entwickelter Torpedo. Anfangs wenig erfolgreich und anfällig für Fehlfunktionen nach dem Start, wurde er mehrfach überarbeitet und schließlich in der massenproduzierten Variante Modell 3 Mod 1 eingesetzt.

knm_tp612=TP612,,U-Jagd-Torpedoo,Der schwedische TP612-Torpedo ist ein drahtgelenkter Torpedo, der auf der Technologie des deutschen T1-Torpedos basiert (der ebenfalls zu einem drahtgelenkten Torpedo umgebaut wurde).
knm_tp613=TP613,,U-Jagd-Torpedo,Der schwedische TP612-Torpedo ist ein drahtgelenkter Torpedo, der auf der Technologie des deutschen T1-Torpedos basiert (der ebenfalls zu einem drahtgelenkten Torpedo umgebaut wurde).

plan_yu-1=Yu-1,,U-Jagd-Torpedo,Der Yu-1 (Fish Type-1) ist der erste in China eigenständig produzierte schwere Torpedo. Diese geradlinig laufenden Torpedos sind relativ einfach aufgebaut und daher zuverlässig und wirkungsvoll.
plan_yu-1g=Yu-1G,,U-Jagd-Torpedo,Der Yu-1G (Fish Type-1A) ist der erste in China entwickelte und produzierte schwere Torpedo. Es handelt sich um eine weiterentwickelte Version des Yu-1 mit zusätzlicher passiver Zielsuchfähigkeit, um manövrierende Schiffe wirksamer bekämpfen zu können.
plan_yu-3=Yu-3,,ASW Torpedo,Der Yu-3 (Fish Type-3) ist ein chinesischer passiver schwerer Torpedo. Als langsamer Torpedo eignet er sich am besten zum Angriff auf diesel-elektrische U-Boote, da schnellere Ziele dem Torpedo möglicherweise entkommen können. Der Suchkopf hat eine maximale Reichweite von etwa 1.600 Yards.
plan_yu-4=Yu-4A,,U-Jagd-Torpedo,Der Yu-4A (Fish Type-4) ist ein chinesischer passiver schwerer Torpedo. Als langsamer Torpedo ist er wahrscheinlich nur auf sehr kurze Entfernungen wirksam.

rn_mark9_mod2=Mark IX,,U-Jagd-Torpedo,Der britische Mark IX** Torpedo ist ein Anti-Schiff-Torpedo, der während des Zweiten Weltkriegs eingeführt wurde. Er verfügt über einen passiven Sonarsuchkopf, eine längere Laufzeit und einen stärkeren Sprengkopf, was ihn zur neuesten Weiterentwicklung des ursprünglichen Mark IX Designs aus den 1930er Jahren macht.
rn_mark8_mod4=Mark VIII,,U-Jagd-Torpedo,Der britische Torpedo Mark VIII Mod 4 ist ein geradeauslaufender Torpedo zur Bekämpfung von Seezielen, der während des Zweiten Weltkriegs eingeführt wurde. Diese Version stellt die letzte Ausführung der in den 1920er-Jahren entwickelten, von U-Booten eingesetzten Mark-8-Serie dar und blieb bei der Royal Navy bis weit in die 1980er-Jahre im Einsatz, da ein geeigneter Ersatz für die Seezielbekämpfung erst nach dem Kalten Krieg verfügbar wurde.
rn_mark20s=Mark 20S,Bidder,ASW Torpedo,Der Mark 20S „Bidder“ ist ein britischer U-Jagd-Torpedo mittlerer Gewichtsklasse aus den 1950er-Jahren mit zusätzlicher Fähigkeit zur Bekämpfung von Seezielen und galt bereits vor seiner Indienststellung als veraltet. Der Mark 20 „Combined“ stellt eine Modernisierung aus den 1960er-Jahren dar, die die Leistungsfähigkeit des Torpedos geringfügig verbesserte. Insgesamt bleibt es jedoch eine unzureichende Waffe mit nur begrenzter Wirksamkeit gegen moderne U-Boote und aufgrund der niedrigen Geschwindigkeit auch fragwürdigem Nutzen gegen Seeziele. Der Torpedo blieb bis in die 1970er-Jahre im Dienst, da er aus den achtern angeordneten „Gegenmaßnahme“-Torpedorohren der U-Boote der Oberon- und Porpoise-Klasse verschossen werden konnte.
#rn_mark20c
rn_mark23=Mark 23,Grog,Torpedo,Der Mark 23 „Grog“ ist ein britischer U-Jagd-Torpedo mittlerer Gewichtsklasse aus den 1950er-Jahren mit zusätzlicher Fähigkeit zur Bekämpfung von Seezielen und galt bereits vor seiner Indienststellung als veraltet. Der Mark 23 stellt eine umfassende Weiterentwicklung des ursprünglichen Mark-20-Torpedos dar und verfügt über einen erweiterten Batteriesektor sowie Drahtlenkung, übernimmt jedoch weiterhin den äußerst schwachen Suchkopf und die geringe Geschwindigkeit des Bidder. Aufgrund der schlechten Zuverlässigkeit und Leistung ist seine Wirksamkeit gegen moderne U-Boote und Seeziele bestenfalls fragwürdig.

usn_mk16=Mk-16,,U-Jagd-Torpedo,Der Torpedo Mark 16 ist ein geradeaus laufender Torpedo aus der Zeit des Zweiten Weltkriegs, der in den 1950er- und 1960er-Jahren von US-Jagd-U-Booten als schneller und äußerst leistungsstarker Torpedo eingesetzt wurde. Trotz fehlender Zielsuche führen Treffer auf kurze Entfernung nahezu sicher zur Versenkung jedes Ziels, unabhängig von dessen Größe. Die Variante Mod 8 kombiniert den leistungsstarken Gefechtskopf des Mod 0 mit der größeren Reichweite des Mod 1.
usn_mk37=Mk-37 Mod 0,,Torpedo,Der Mark-37-Torpedo ist der standardmäßige leichte U-Jagd-Torpedo der US Navy, der auch von mehreren anderen Nationen verwendet wurde. Eingeführt im Jahr 1959, erwies er sich später als zu langsam und zu leistungsschwach, um gegen moderne sowjetische Hochleistungs-U-Boote bestehen zu können.
usn_mk37_mod1=Mk-37 Mod 1,,Torpedo,Der Mark-37-Torpedo ist der Standard-U-Jagd-Leichtgewichtstorpedo der US Navy, der in vielen Nationen Verwendung fand. Er wurde 1959 eingeführt, erwies sich jedoch bald als zu langsam und zu leistungsschwach, um modernen sowjetischen Hochleistungs-U-Booten wirksam entgegenzutreten. Die Modifikation 1 führte Drahtlenkung ein, allerdings auf Kosten der Geschwindigkeit.
usn_mk37_mod3=Mk-37 Mod 3,,Torpedo,Der Mark-37-Torpedo ist der Standard-U-Jagd-Leichtgewichtstorpedo der US Navy, der in vielen Nationen Verwendung fand. Er wurde 1959 eingeführt, erwies sich jedoch bald als zu langsam und zu leistungsschwach, um modernen sowjetischen Hochleistungs-U-Booten wirksam entgegenzutreten. Der Mk-37 Mod 3 verfügt über einen neuen Suchkopf zur Verbesserung von Zuverlässigkeit und Zielerfassungsreichweite, während der restliche Torpedo gegenüber dem ursprünglichen Mod 0 unverändert blieb.
usn_mk37_mod2=Mk-37 Mod 2,,Torpedo,Der Mark-37-Torpedo ist der Standard-U-Jagd-Leichtgewichtstorpedo der US Navy, der in vielen Nationen Verwendung fand. Er wurde 1959 eingeführt, erwies sich jedoch bald als zu langsam und zu leistungsschwach, um modernen sowjetischen Hochleistungs-U-Booten wirksam entgegenzutreten. Der Mk-37 Mod 2 verfügt über einen neuen Suchkopf zur Verbesserung von Zuverlässigkeit und Zielerfassungsreichweite, während der restliche Torpedo gegenüber dem drahtgelenkten Mod 1 unverändert blieb.
usn_mk37c=Mk-37C,,Torpedo,Der Mark-37C-Torpedo ist eine modernisierte Version des USN-Mk-37-Torpedos mit Otto-Kraftstoff und Drahtlenkung. Er stellt eine deutliche Verbesserung gegenüber dem ursprünglichen Torpedo dar. Der ausschließlich von Exportpartnern ab Mitte der 1970er-Jahre eingesetzte Mk-37C (NT-37C) verfügt über einen verbesserten Antrieb mit 150 % höherer Geschwindigkeit und nahezu doppelter Reichweite, allerdings auf Kosten einer etwas höheren Geräuschentwicklung.
usn_mk37e=Mk-37E,,Torpedo,Der Mark-37E-Torpedo ist eine weiterentwickelte Version des Mk-37C mit Kielwasserverfolgung und überarbeitetem Suchkopf. Der ausschließlich von Exportpartnern eingesetzte Mk-37E (NT-37E) verfügt über verbesserte Fähigkeiten zur Bekämpfung von Seezielen sowie kleinere Verbesserungen am Antrieb. Er stellt damit ab Mitte der 1980er-Jahre einen äußerst leistungsfähigen Torpedo zur U-Jagd und Seezielbekämpfung dar.
usn_mk44_air=Mk-44,,ASW Torpedo,Der Torpedo Mk 44 ist der Standard-U-Jagd-Torpedo der NATO älterer Bauart und wurde während des gesamten Kalten Krieges breit eingesetzt. Trotz hoher Zuverlässigkeit verfügt der Mk 44 über eine geringe Reichweite und eine niedrige Geschwindigkeit und ist gegen schnelle, tief tauchende U-Boote nur eingeschränkt wirksam.\nDies ist die luftgestützte Variante.
usn_mk44_ship=Mk-44,,ASW Torpedo,Der Torpedo Mk 44 ist der Standard-U-Jagd-Torpedo der NATO älterer Bauart und wurde während des gesamten Kalten Krieges breit eingesetzt. Trotz hoher Zuverlässigkeit verfügt der Mk 44 über eine geringe Reichweite und eine niedrige Geschwindigkeit und ist gegen schnelle, tief tauchende U-Boote nur eingeschränkt wirksam.\nDies ist die seegestützte Variante.
usn_mk46_air=Mk-46 Mod 2,,ASW Torpedo,Der Mark-46-Torpedo bildet das Rückgrat der Leichtgewichtstorpedos der United States Navy zur U-Boot-Abwehr und ist der NATO-Standard. Diese luftgestützten Torpedos sind darauf ausgelegt, Hochleistungs-U-Boote anzugreifen.
usn_mk46_ship=Mk-46 Mod 2,,ASW Torpedo,Der Mark-46-Torpedo bildet das Rückgrat der Leichtgewichtstorpedos der United States Navy zur U-Boot-Abwehr und ist der NATO-Standard. Diese luftgestützten Torpedos sind darauf ausgelegt, Hochleistungs-U-Boote anzugreifen. Bei diesem Modell handelt es sich jedoch die seegestützte Variante.
usn_mk46_mod5_air=Mk-46,Mod 5,NEARTIP,Torpedo,Der Torpedo Mark 46 Mod 5 NEARTIP ist der NATO-Standard für leichte Torpedos und wird von mehreren Nationen eingesetzt. Diese Variante wurde zur Bekämpfung moderner sowjetischer Hochleistungs-U-Boote entwickelt und wird aus der Luft abgeworfen.\n\nDer Mk-46 Mod 5 NEARTIP (NEAR Term Improvement Program) ist eine vollständige Überarbeitung des Mk-46-Torpedos. Diese ermöglicht eine größere Reichweite durch eine langsamere, leisere Transitphase, verbesserte Gegen-Gegenmaßnahmen sowie die Fähigkeit, U-Boote in flachen Gewässern und aufgetauchte U-Boote zu verfolgen, wenn auch mit eingeschränkter Wirksamkeit.
usn_mk46_mod5_ship=Mk-46,Mod 5,NEARTIP,Torpedo,Der Torpedo Mark 46 Mod 5 NEARTIP ist der NATO-Standard für leichte Torpedos und wird von mehreren Nationen eingesetzt. Diese Variante wurde zur Bekämpfung moderner sowjetischer Hochleistungs-U-Boote entwickelt und wird von Schiffen aus eingesetzt.\n\nDer Mk-46 Mod 5 NEARTIP (NEAR Term Improvement Program) ist eine vollständige Überarbeitung des Mk-46-Torpedos. Diese ermöglicht eine größere Reichweite durch eine langsamere, leisere Transitphase, verbesserte Gegen-Gegenmaßnahmen sowie die Fähigkeit, U-Boote in flachen Gewässern und aufgetauchte U-Boote zu verfolgen, wenn auch mit eingeschränkter Wirksamkeit.
usn_mk48=Mk-48 Mod 1,,Torpedo,Der Mark 48 ist ein schwerer amerikanischer Torpedo, der von U-Booten abgefeuert wird. Sie wurden entwickelt, um tief tauchende nuklearbetriebene U-Boote und Hochleistungsschiffe zu versenken.
usn_mk48_mod4=Mk-48 Mod 4,,Torpedo,Der Mark 48 Mod 4 ist ein amerikanischer schwerer Mehrzwecktorpedo. Er ist ein sehr schneller Torpedo mit großer Reichweite, Drahtlenkung und einem sehr hochentwickelten Suchkopf. Die Version Mod 4 ist die Modernisierung der 1980er-Jahre und umfasst Verbesserungen am Suchkopf, um modernste Ziele wie SSN der Alfa-Klasse verfolgen zu können. Außerdem verfügt er über eine Zweiwege-Drahtlenkung, die die Fähigkeit zur Abwehr von Gegenmaßnahmen verbessert.
usn_mk48_mod4_adcap=Mk-48 ADCAP,,Torpedo,Der Mark 48 Mod 4 ADCAP ist ein amerikanischer schwerer Mehrzwecktorpedo. Er ist ein sehr schneller Torpedo mit großer Reichweite, Drahtlenkung und einem sehr hochentwickelten Suchkopf. Die Version Mod 4 ADCAP ist eine FY-85-Modernisierung für Mod-4-Torpedos mit neuer Taumelscheibe und Kraftstoffpumpe. Dadurch werden die Leistungsgrenzen des bestehenden Torpedos weiter ausgereizt, mit einer schnelleren Endanlaufgeschwindigkeit von 65 Knoten sowie Verbesserungen am Suchkopf zur besseren Abwehr von Gegenmaßnahmen.

wp_45-36nu=45-36NU,,U-Jagd-Torpedo,Der 45-36NU ist ein veralteter, vor dem Zweiten Weltkrieg entwickelter 450-mm-Laufbahntorpedo, der stark von den italienischen Modellen 45-F und 53-F aus den frühen 1930er Jahren beeinflusst wurde. Leichtgewichtig und mit geringerer Sprengkraft im Vergleich zu den 530-mm-Gegenstücken wurde er bis in die 1950er Jahre zu einer weitgehend ineffektiven Waffe. Doch manchmal muss man eben mit dem arbeiten, was man hat.
wp_53-38=53-38,,U-Jagd-Torpedo,Die 53-38er, die 1938–1939 in Dienst gestellt wurden, waren die Haupttorpedos der Sowjetunion im Zweiten Weltkrieg. Sie erwiesen sich als überaus zuverlässig und effektiv. Die beiden tödlichsten Versenkungen in der Geschichte (die des deutschen 25.484-Tonnen-Militärtransporters Wilhelm Gustloff und des Truppentransporters Goya) wurden von zwei sowjetischen U-Booten mit 53-38-Torpedos am 30. Januar bzw. 16. April 1945 durchgeführt.
wp_53-39=53-39,,U-Jagd-Torpedo,Der 53-39 ist ein sowjetischer Schwergewichtstorpedo aus der Zeit des Zweiten Weltkriegs. Diese Torpedos sind vergleichsweise einfach konstruiert, was sie zuverlässig und wirkungsvoll macht.
wp_53-56v=53-56,,U-Jagd-Torpedo,Der 53-56 und 53-56V waren ungelenkte Torpedos der 53-cm-Familie.
wp_53-61=53-61M,,WH Torpedo,Der 53-61 ist ein sowjetischer Schwergewichtstorpedo zur Bekämpfung von Seezielen, der sein Ziel anhand dessen Kielwassers verfolgt. Als erster sowjetischer Torpedo mit diesem Zielsuchverfahren verfügte er über eine für seine Zeit hohe Geschwindigkeit und große Reichweite.
wp_53-65K=53-65K,,WH Torpedo,Die Torpedofamilie 53-65 sind russische, mit Kielwassersensoren ausgestattete Torpedos. Der 53-65 war 1965 erstmalig einsatzbereit, während 53-65K und 53-65M beide im Jahre 1969 folgten. Die 53-65KE ist eine Exportversion. China erhielt eine unbekannte Anzahl von 53-65KE-Torpedos aus Russland, nachdem es in den 1990er Jahren vier U-Boote der Kilo-Klasse gekauft hatte.
wp_65-76=65-76,,WH Torpedo,Der 65-76 ist ein 650 mm großer Torpedo mit Wake-Homing-Technologie (Zielführung via Kielwassersensor), hergestellt in der Sowjetunion. Er wurde entwickelt, um US-amerikanische Flugzeugträgerkampfgruppen sowie große Handelsziele wie Supertanker oder Großfrachtschiffe anzugreifen.
wp_at-1=AT-1,,ASW Torpedo,Der AT-1 ist eine luftgestützter Torpedo der 4. Generation mit elektrischer Zündung und aktiver/passiver akustischer Zielführung, der nur von Hubschraubern abgeworfen wird.
wp_at-2=AT-2,,ASW Torpedo,Der AT-2 ist ein schwerer luftgestützter Torpedo der 4. Generation mit elektrischer Zündung, der vor allem gegen U-Boote eingesetzt wird und mit aktiver/passiver akustischer Zielführung ausgestattet ist. Er wird von Flugzeugen und einigen ASW-Raketen mitgeführt. Die Anforderungen an Reichweite, Geschwindigkeit und Erkennungsreichweite, machten den großen Durchmesser des Torpedos erforderlich. Dieser macht den AT-2 zu einem der wenigen im Kalten Krieg entwickelten luftgestarteten Schwergewichtstorpedos. Die Mehrheit der luftgestarteten Torpedos ist im Vergleich deutlich kleiner und wiegt ungefähr nur ein Viertel des AT-2.
wp_saet-50=SAET-50M,,ASuW Torpedo,Der SAET-50 ist ein sowjetischer elektrisch angetriebener Schwergewichtstorpedo zur Bekämpfung von Seezielen mit passiver Sonarzielsuche. Er wurde auf Grundlage des deutschen G7e „Zaunkönig“ aus dem Zweiten Weltkrieg entwickelt und war der erste zielsuchende Torpedo, der bei der sowjetischen Marine in Dienst gestellt wurde. Obwohl der SAET-50 später als veraltet galt und durch leistungsfähigere Torpedos ersetzt wurde, blieb er noch über einen beträchtlichen Teil des Kalten Krieges in den Beständen, insbesondere bei Exportkunden.
wp_set-40=SET-40,,ASW Torpedo,Der SET-40 ist ein Torpedo der 4. Generation zur U-Boot-Jagd, welcher eine aktive/passive akustische Zielführung verwendet. Er gehört zur Familie der leichten 400mm-Torpedos.
wp_set-53=SET-53M,,ASW Torpedo,Der SET-53M ist ein sowjetischer elektrisch angetriebener Schwergewichtstorpedo mit passiver Sonarzielsuche zur U-Jagd. Er wurde auf Basis des SAET-50 entwickelt und war der erste sowjetische Schwergewichtstorpedo, der speziell für die Bekämpfung von U-Booten konstruiert wurde. Obwohl er schon bald durch leistungsfähigere Systeme ersetzt wurde, blieben Torpedos dieser Baureihe noch während eines Großteils des Kalten Krieges in den Beständen, insbesondere bei Exportkunden.
wp_set-65=SET-65,,ASW Torpedo,Der SET-65 ist ein Torpedo der 3. Generation, der für die U-Boot-Jagd ausgelegt ist und aktive akustische Zielführung verwendet.
wp_test-71=TEST-71,,ASW Torpedo,Dieser drahtgelenkte Torpedo der vierten Generation verbessert den SET-65, indem er die Nutzung der fortgeschrittenen aktiven/passiven Zielführungsmöglichkeiten des "Sapfir"-Leitsystems bietet. Die Reichweite des Zielsuchsystems bleibt jedoch gleich.
wp_test-71m=TEST-71M,,U-Jagd-Torpedo,Der TEST-71M ist ein sowjetischer schwerer drahtgelenkter U-Jagd-Torpedo. Der TEST-71M verfügt über eine verbesserte digitale Lenksektion sowie eine modernisierte Drahtlenkeinheit, welche die bisherigen Einschränkungen der Drahtlenkung beseitigt und dadurch flexiblere Schussabgaben ermöglicht.
wp_umgt-1=UMGT-1,,ASW Torpedo,Ein Torpedo der vierten Generation, der Ausrüstungsbestandteil der meisten sowjetischen Hubschrauber, U-Boot-Abwehrflugzeuge ist und als Nutzlast für die SS-N-14- und SS-N-16-U-Boot-Abwehrraketen dient. Er ist leichter und seine Sprengköpfe damit schwächer als die Torpedos, die von Schiffen oder U-Booten eingesetzt werden.
wp_uset-80=USET-80,,Torpedo,Dieser sowjetische Mehrzwecktorpedo der 5. Generation ist mit modernster Technologie ausgestattet und bietet eine höhere Leistung als der SET-65. Er verfügt über ein aktives/passives Zielsuchsystem mit erweiterter Reichweite, was ihn zu einer gefährlichen Waffe macht.

# ------------------ Bombs -----------------
fr_samp_t25=SAMP-25,,Bombe,Die SAMP Type 25 ist eine Bombe der 250-kg-Klasse, wiegt jedoch eigentlich 230 kg. Sie ist vergleichbar mit der US-amerikanischen Mk-82.
fr_samp_t21=SAMP-21,,Bombe,Die SAMP Type 21 ist eine Bombe der 400-kg-Klasse, wiegt jedoch tatsächlich 345kg. Sie ist vergleichbar mit der US-amerikanischen Mk-83.

pla_type-2=Typ-100-2,,Bombe,Typ-100-2 ist eine chinesische 100-kg-Allzweck-Bombe. Vergleichbar mit der sowjetischen FAB-100.
pla_type-3-250=Typ-250-3,,Bombe,Typ-250-3 ist eine chinesische 250kg-kg-Allzweck-Bombe. Vergleichbar mit der sowjetischen FAB-250.
pla_type-3-500=Typ-500-3,,Bombe,Typ-500-3 ist eine chinesische 500kg-kg-Allzweck-Bombe. Vergleichbar mit der sowjetischen FAB-500.

raf_bl755=BL755,,Streubombe,Die BL755 enthält 147 panzerbrechende HEAT-Bomblets, die über ein großes Gebiet verteilt werden. Sie wurde weit verbreitet während des Iran-Irak-Kriegs von der IRIAF sowie im Falklandkrieg von der RAF eingesetzt.
rn_dc_mk11=Mark XI,,Wasserbombe,Die Mark XI ist eine britische, für den Abwurf aus Luftfahrzeugen entwickelte Wasserbombe aus dem Zweiten Weltkrieg, die bis weit in die zweite Hälfte des 20. Jahrhunderts im Einsatz blieb.

usaf_gbu-2=GBU-2,Paveway I,Gelenkte Bombe,Die GBU-2 Paveway I ist eine amerikanische lasergelenkte Bombe, die auf der Mk 84 2000-Pfund (907 kg) Mehrzweckbombe basiert, jedoch mit einem Suchkopf an der Spitze ausgestattet ist. Diese Waffe wurde zur Paveway-II weiterentwickelt.
usaf_gbu-15=GBU-15,,Gelenkte Bombe,Die GBU-15(V)2 ist eine infrarotgelenkte Gleitbombe, die von der US Air Force auf bestimmten überschallschnellen taktischen Flugzeugen wie der F-111 und der F-4E eingesetzt und zudem in mehrere Länder exportiert wurde. Sie verfügt über einen bildgebenden Infrarotsuchkopf (IIR), der als sehr zuverlässig gilt und unter allen Wetterbedingungen eingesetzt werden kann. Darüber hinaus besitzt die Waffe eine Datenverbindung, die eine Zielaktualisierung sowie die Übertragung der Suchkopfdaten an die Startplattform ermöglicht.
usaf_bolt-117=BOLT-117,,Gelenkte Bombe,Die BOLT-117 ist eine US-amerikanische lasergelenkte Bombe mit einem Gewicht von 750 lb (340 kg). Die Waffe basiert auf der modifizierten ungelenkten Bombe M-117 und verfügt über einen im Bugbereich integrierten Lasersuchkopf sowie Steuerflächen zur Zielsteuerung.
usaf_gbu-11=GBU-11,Paveway I,Gelenkte Bombe,Die GBU-11 ist eine US-amerikanische lasergelenkte Bombe mit einem Gewicht von 3000 lb (1400 kg). Es handelt sich um eine überschwere Präzisionsbombe zur Bekämpfung stark gehärteter Ziele wie Brücken oder Bunker.
usaf_m117=M117,,Bombe,Die M117 ist eine 750-Pfund-Bombe (340 kg), die von der US-Luftwaffe ausgiebig während des Vietnamkriegs eingesetzt wurde, bis sie durch die Mark-80-Serie ersetzt wurde.
usaf_m118=M118,,Schwere Bombe,Die M118 ist eine US-amerikanische überschwere 3000-lb-(1400-kg)-Bombe zur Bekämpfung stark gehärteter Punktziele wie Brücken, Bunker, Befestigungsanlagen, Eisenbahninfrastruktur und anderer widerstandsfähiger Strukturen.
usaf_cbu-24=CBU-24,,Streubombe,Die CBU-24 enthält 665 Splitter-Bomblets, die über ein weites Gebiet verteilt werden. Sie wurde häufig als Anti-Personen-Waffe von Wild Weasel-Einheiten beim Angriff auf SAM-Stellungen eingesetzt.

usn_gbu-10=GBU-10,Paveway II,Gelenkte Bombe,Die GBU-10 Paveway II ist eine amerikanische, 2000 lb (907 kg) schwere, lasergelenkte Bombe, basierend auf der Mk 84 2000-Pfund (900 kg) Allzweckbombe. Sie ist mit einem vorne montierten Lasersuchkopf und Steuerflächen für die Lenkung ausgestattet. Als Teil der Paveway-Waffenserie trat die Paveway II etwa 1976 in Dienst. Sie wird derzeit von der US Air Force, der US Navy, dem US Marine Corps und verschiedenen anderen Luftstreitkräften eingesetzt.
usn_gbu-12=GBU-12,Paveway II,Gelenkte Bombe,Die GBU-12 Paveway II ist eine amerikanische, 500 lb (227 kg) schwere, lasergelenkte Bombe für den Angriff auf Bodenziele. Sie basiert auf der Mk 82 500-Pfund (227 kg) Mehrweck-Freifallbombe, verfügt jedoch über einen Laserzielsucher und Steuerflächen zur Lenkung. Als Bestandteil der Paveway-Serie wurde die Paveway II etwa 1976 in Dienst gestellt. Sie ist derzeit im Einsatz bei der US-Luftwaffe, der US-Marine, dem US Marine Corps und verschiedenen anderen Luftstreitkräften.
usn_gbu-16=GBU-16,Paveway II,Gelenkte Bombe,Die GBU-16 Paveway II ist eine amerikanische, 1000 lb (460 kg) schwere, lasergelenkte Bombe für den Angriff auf Bodenziele. Sie basiert auf der Mk 82 500-Pfund (227 kg) Mehrweck-Freifallbombe, verfügt jedoch über einen Laserzielsucher und Steuerflächen zur Lenkung. Als Bestandteil der Paveway-Serie wurde die Paveway II etwa 1976 in Dienst gestellt. Sie ist derzeit im Einsatz bei der US-Luftwaffe, der US-Marine, dem US Marine Corps und verschiedenen anderen Luftstreitkräften.
usn_gbu-24=GBU-24,Paveway III,Gelenkte Bombe,Die GBU-24 Paveway III ist eine amerikanische lasergelenkte 2000-lb-Bombe (907 kg) mit erhöhter Reichweite. Sie stellt eine Weiterentwicklung der Paveway II dar und verfügt über eine verbesserte Lenkung, eine größere Gleitreichweite, höhere Zuverlässigkeit sowie ein effizienteres Tiefflugprofil.
usn_mk-81=Mk-81,,Bombe,Die Mark 81 ist eine 250 Pfund (110 kg) schwere, ungelenkte, aerodynamische Mehrzweck-Freifallbombe und Teil der Mark-80-Serie der Vereinigten Staaten. Die Sprengladung besteht normalerweise aus Tritonal, obwohl gelegentlich auch andere Zusammensetzungen verwendet wurden.
usn_mk-82=Mk-82,,Bombe,Die Mark 82 ist eine 500 Pfund (227 kg) schwere, ungelenkte, aerodynamische Mehrzweck-Freifallbombe und Teil der Mark-80-Serie der Vereinigten Staaten. Die Sprengladung besteht normalerweise aus Tritonal, obwohl gelegentlich auch andere Zusammensetzungen verwendet wurden.
usn_mk-82_snakeye=Mk-82 Snakeye,,Bombe,Die Mark 82 „Snake Eye“ ist eine 500 Pfund (227 kg) schwere Mehrzweck-Freifallbombe mit hohem Luftwiderstand und ausklappbaren Leitflächen. Sie eignet sich für den Laydown-Abwurf, bei dem das Luftfahrzeug Bomben mit hoher Geschwindigkeit und in geringer Höhe ohne Hochzieh- oder Sturzflugmanöver ausbringt, allerdings auf Kosten einer verlängerten Flugzeit der Bombe.
usn_mk-83=Mk-83,,Bombe,Die Mark 83 ist eine 1.000 Pfund (454 kg) schwere Bombe und Teil der Mark-80-Serie aerodynamischer Mehrzweck-Freifallbomben im Dienst der Vereinigten Staaten.
usn_mk-84=Mk-84,,Bombe,Die Mark 84 ist eine 2000 Pfund (925 kg) schwere Freifallbombe mit geringem Luftwiderstand, die als universelle, nicht-gelenkte Bombe eingesetzt wird.
usn_rockeye=CBU-100,Rockeye,Streubombe,Die Mk 20 Rockeye II, CBU-99 Rockeye II und CBU-100 Rockeye II bilden eine Familie von amerikanischen Streubomben, die hauptsächlich im Anti-Panzer-Modus gegen gepanzerte Fahrzeuge eingesetzt werden.
usn_walleye2=AGM-62,Walleye II,Gelenkte Bombe,Die AGM-62 Walleye ist eine elektro-optisch geführte Gleitbombe, die von den US-amerikanischen Streitkräften von den 1960er bis zu den 1990er Jahren eingesetzt wurde. Die meisten AGM-62 hatten einen 250 Pfund (113 kg) schweren, konventionellen Sprengkopf. Es gab jedoch einige Exemplare, die mit einem W72-Atomsprengkopf bestückt waren.

usn_mk54_dc=Mk-54,,Depth Bomb,Die Mark 54 ist eine amerikanische, luftgestützte Wasserbombe, die während des Zweiten Weltkriegs entwickelt wurde und bis in den Kalten Krieg hinein im Dienst verblieb.

wp_fab-100=OFAB-100,,Bombe,Die OFAB-100-120 ist eine kleine Bombe, die von Su-17, Su-25, MiG-29, Su-27, Su-30 und verschiedenen anderen Flugzeugen getragen werden kann. Diese Bombe ist darauf ausgelegt, leicht gepanzerte Ziele, militärische Industrieanlagen sowie das entsprechende Personal anzugreifen.
wp_fab-250=FAB-250,,Bombe,Die FAB-250 ist eine sowjetische 250 kg (550 lb) schwere Mehrzweck-Freifallbombe mit hochexplosivem Gefechtskopf, die primär von der Sowjetunion und ihren Verbündeten eingesetzt wurde.
wp_fab-500=FAB-500 M-62,,Bombe,Die FAB-500 ist eine sowjetische 500 kg-(1100 lb)schwere Mehrzweck-Freifallbombe mit hochexplosivem Gefechtskopf, die primär von der Sowjetunion und ihren Verbündeten eingesetzt wurde.
wp_fab-500_m54=FAB-500 M-54,,Bombe,Die FAB-500 ist eine sowjetische 500 kg (1100 lb) schwere Mehrzweck-Freifallbombe mit hochexplosivem Gefechtskopf, die primär von der Sowjetunion und ihren Verbündeten eingesetzt wurde. Diese Ausführung ist eine verkürzte Version mit mittlerem Luftwiderstand, die in größerer Stückzahl im internen Waffenschacht mitgeführt werden kann. Sie weist jedoch gegenüber der stromlinienförmigen Variante eine geringere Treffgenauigkeit auf.
wp_fab-1500_m54=FAB-1500 M-54,,Bombe,Die FAB-1500 ist eine sowjetische, 1500 kg (3300 lb) schwere Mehrzweck-Freifallbombe mit hochexplosivem Gefechtskopf, die primär von der Sowjetunion und ihren Verbündeten eingesetzt wurde. Dieses 1500-kg-Modell gehört zu einer Familie großer Sprengbomben und wird vor allem gegen harte Ziele wie große Kriegsschiffe, Bunker oder Luftwaffenstützpunkte eingesetzt.
wp_fab-3000_m54=FAB-3000 M-54,,Bombe,Die FAB-3000 ist eine sowjetische, 3000 kg (6600 lb) schwere Mehrzweck-Freifallbombe mit hochexplosivem Gefechtskopf, die primär von der Sowjetunion und ihren Verbündeten eingesetzt wurde. Dieses 3000-kg-Modell gehört zu einer Familie großer Sprengbomben und wird vor allem gegen harte Ziele wie große Kriegsschiffe, Bunker oder Luftwaffenstützpunkte eingesetzt.
wp_fab-9000_m54=FAB-9000 M-54,,Bombe,Die FAB-9000 ist eine sowjetische, 9000 kg (20.000 lb) schwere Mehrzweck-Freifallbombe mit hochexplosivem Gefechtskopf, die primär von der Sowjetunion und ihren Verbündeten eingesetzt wurde. Dieses 9000-kg-Modell gehört zu einer Familie großer Sprengbomben und zählt zu den größten konventionellen Bomben, die im Gefecht eingesetzt wurden, mit besonderem Schwerpunkt auf der Zerstörung stark gehärteter Ziele.

wp_kab-500l=KAB-500L,,Gelenkte Bombe,Die KAB-500L ist eine sowjetische 500 kg (1100 lb)schwere lasergelenkte Präzisions-Freifallbombe mit hochexplosivem Gefechtskopf, die vorwiegend durch die Sowjetunion und ihre Verbündeten eingesetzt wird. Sie basiert auf der FAB-500, verfügt jedoch über einen Lasersuchkopf sowie Steuerflächen zur Zielsteuerung.

wp_rbk-250=RBK-250,,Streubombe,Die RBK-250 ist eine sowjetische 250-Kilogramm-Streubombe.
wp_rbk-500=RBK-500,,Streubombe,Die RBK-500 ist eine sowjetische 500-Kilogramm-Streubombe.

wp_plab-100=PLAB-100,,AS Bombe,Die PLAB-100 ist eine sowjetische, 100 kg (220 lb) schwere, aus der Luft abgeworfene Wasserbombe, die hauptsächlich von der Sowjetunion und ihren Verbündeten eingesetzt wurde.

# ---------------- Sonobuoys ---------------
plan_skf-1=SKF-1,,Passive Sonoboje,Die SKF-1 ist eine ausschließlich passive, rundumempfangende Sonarboje, die seit den 1960er-Jahren von der Marine der Volksbefreiungsarmee eingesetzt wird.
plan_skf-2=SKF-2,,Passive Sonoboje,Die SKF-2 ist eine ausschließlich passive, rundumempfangende Sonarboje, die seit Mitte der 1970er-Jahre von der Marine der Volksbefreiungsarmee eingesetzt wird.

usn_ssq-41=AN/SSQ-41,LOFAR,Passiver Sonarboje,Die SSQ-41A „Jezebel“ ist eine Sonoboje vom Typ Low Frequency Analysis and Recording (LOFAR). Sie stellt die am weitesten verbreitete passive NATO-Sonoboje dar. Im Gegensatz zu den späteren DIFAR-Sonarbojen verfügt sie über keine Peilfähigkeit, weist jedoch eine ausreichende Empfindlichkeit auf und ist in großen Stückzahlen in den Beständen nahezu jeder westlichen Marine vorhanden.
usn_ssq-47=AN/SSQ-47,Julie,Aktive Sonarboje,Die SSQ-47A „Julie“ ist eine kontinuierlich aktiv arbeitende Sonarboje mit reiner Entfernungsbestimmung. Sie ist die am weitesten verbreitete aktive Sonoboje der NATO. Im Gegensatz zu den späteren DICASS-Sonarbojen besitzt sie keine Peilfähigkeit, ist jedoch weiterhin geeignet, einen zuvor detektierten Kontakt mittels mehrerer Bojen festzulegen. Aufgrund des permanenten aktiven Pingbetriebs beträgt die Einsatzdauer dieser Sonoboje lediglich etwa 30 Minuten.
usn_ssq-53=AN/SSQ-53,DIFAR,Passive Sonarboje,Die SSQ-53-Familie sind Richtungs-Frequenz-Analyse- und -Aufzeichnungs(DIFAR)-Sensoren. Dies ermöglicht dem Anwender der Sonobojen, magnetische Kursinformationen zu erhalten, was eine erhebliche Verbesserung gegenüber dem früheren omnidirektionalen CRT-1 darstellt.
usn_ssq-62=AN/SSQ-62,DICASS,Aktive Sonarboje,Die AN/SSQ-62 DICASS ist eine aktive Sonoboje zur präzisen Positionsbestimmung eines zuvor mit passiven Sonobojen des Typs SSQ-53 georteten getauchten U-Boots.
usn_ssq-77=AN/SSQ-77,VLAD,Passive Sonarboje,Die SSQ-77A ist eine passive Sonarboje vom Typ VLAD (Vertical Line Array DIFAR), entwickelt als generationsbedingte Weiterentwicklung der ursprünglichen passiven DIFAR-Sonarboje. Diese Boje weist eine ähnliche Architektur wie die DIFAR-Boje auf, verfügt jedoch über ein äußerst empfindliches Sonararray, das eine außergewöhnlich große passive Reichweite für eine Sonarboje ermöglicht, eine hohe Wirksamkeit gegen leise, tief tauchende Ziele bietet und auch in stark gestörten, geräuschintensiven Gewässern gute Leistungen zeigt.
usn_ssq-101=AN/SSQ-101,,Aktive Sonarboje,Die AN/SSQ-101 Air Deployed Active Receiver (ADAR) ist eine Einweg-Sonoboje, die als Empfänger für Multistatiksysteme in seichtem Wasser konzipiert ist.

wp_rgb-1=RGB-1,,Passive Sonarboje,Die RGB-1 ist eine passive, nur omnidirektionale Sonoboje, die von der Sowjetunion verwendet wird.
wp_rgb-nm1=RGB-NM-1,,Passive Sonarboje,Die RGB-NM-1 ist eine passive, ausschließlich omnidirektionale Sonoboje, die Teil der Ausstattung des sowjetischen Flugzeugträgers Baku ist.
wp_rgb-3=RGB-3,,Aktive Sonarboje,Die RGB-3 ist eine aktive Sonoboje, die von der Sowjetunion verwendet wird.

# ------------------ FFAR -----------------
usn_zuni=Zuni,,FFAR,Die Zuni 5-Zoll Folding-Fin Aircraft Rocket (FFAR), oder einfach Zuni, ist eine ungelenkte Rakete, die von den Streitkräften der Vereinigten Staaten und der französischen Luftwaffe eingesetzt wird. Die Rakete wurde sowohl für Luft-Luft- als auch für Luft-Boden-Operationen entwickelt. Sie kann verschiedene Arten von Sprengköpfen tragen, einschließlich Störsendern für Gegenmaßnahmen. Üblicherweise wird sie aus dem LAU-10-Raketenbehälter abgefeuert, welcher vier Raketen fasst.
usn_hydra=Hydra 70,,FFAR,Die Hydra 70 ist eine ungelenkte 2,75-Zoll-(70 mm)-Rakete, die hauptsächlich für der Luft-Boden-Operationen eingesetzt wird. Sie kann mit einer Vielzahl von Sprengköpfen ausgestattet werden und verfügt in neueren Versionen über Zielführungssysteme für genauere Angriffe. Die Hydra wird von den US-amerikanischen und verbündeten Streitkräften weit verbreitet eingesetzt und konkurriert mit der kanadischen CRV7, die aus der gleichen Abschussvorrichtung abgefeuert werden kann.

wp_s-5=S-5,,FFAR,Die S-5 ist eine ungelenkte 55mm-Rakete, die aus einem Rohr des Kalibers 57mm abgefeuert wird. Sie wird hauptsächlich von Jagdbombern und Hubschraubern verwendet. Die Rakete besteht aus einem Stahlkörper, der einen Feststoffraketenantrieb und einen Sprengkopf mit mechanischem Aufschlagzünder enthält.
wp_s-8=S-8,,FFAR,Entwickelt in den 1970er Jahren, ist die S-8 eine 80-mm-Rakete, die von Jagdbombern und Hubschraubern eingesetzt wird. Das System wurde 1984 in Dienst gestellt und wird in verschiedenen Untertypen mit unterschiedlichen Sprengköpfen produziert. Dies wären zum Beispiel Hohlladungs-Gefechtsköpfe zur Bekämpfung von Panzern, Splitterspreng-Gefechtsköpfe zur Weichzielbekämpfung, sowie die spezialisierte S-8BM zur Bunkerbekämpfung und die S-8DM mit Aerosol-Gefechtskopf.
wp_s-24=S-24,,FFAR,Die S-24 ist eine sowjetische 240-mm-Fliegerfaustrakete (Folding-Fin Aircraft Rocket, FFAR), die von Jagdbombern und Hubschraubern eingesetzt wird. Anders als die meisten FFARs wird sie einzeln mitgeführt.
wp_s-25=S-25,,FFAR,Die S-25 ist eine sowjetische Luft-Boden-Rakete, die von Flugzeugen abgefeuert wird. Sie wird aus dem O-25-Pod abgefeuert, der eine Rakete aufnehmen kann. Die Rakete wurde erstmals 1975 bei der sowjetischen Luftwaffe eingeführt.

# ------------------ MLRS -----------------
ir_107mm_rocket=Haseb-1,,MLRS,Die Hasheb-1-Rakete ist eine iranische 107-mm-Rakete, die in verschiedenen Raketenwerfern verwendet wird, die auf dem chinesischen Mehrfachraketenwerfer Type 63 basieren.

usa_m26=M26,,MLRS,Die M26 ist eine ungelenkte 227-mm-Rakete, die im Mehrfachraketenwerfersystem M270 (MLRS) der US-Armee eingesetzt wird.

wp_grad=Grad,,MLRS,Die M-21OF-Rakete ist eine Komponente des Raketensystems M-21. Das vollständige System ist besser bekannt als „Grad-Mehrfachraketenwerfersystem“.

