# ----------------- Decoys ----------------
usn_an_slq_25_nixie_decoy=AN/SLQ-25,Nixie,Das Nixie (offiziell AN/SLQ-25) ist ein Schlepptäuschkörper, der hauptsächlich von Schiffen der US-Marine genutzt wird. Das System erzeugt akustische Signale, die ankommende Torpedos von der eigenen Plattform ablenken sollen.

usn_moss=MOSS,MK-70,Täuschkörper,Der mobile U-Boot-Simulator MK70 ist ein Sonar-Täuschkörper, der von U-Booten der United States Navy verwendet wird. Es war ein 10-Zoll-Fahrzeug ohne Sprengkopf, das jedoch sowohl ein aktives Sonar-Echo als auch eine passive Tonsignatur erzeugen konnte, die der des startenden U-Bootes sehr ähnlich war. Der Zweck des MOSS besteht darin, mehrere Ziele mit der gleichen akustischen Signatur zu erzeugen.

wp_mg-44=MG-44,Korund,Täuschkörper,Zweite Generation eines selbstfahrenden hydroakustischen U-Boot-Imitators. Entwickelt für den Start aus 400-mm-Rohren.
wp_mg-74=MG-74,Korund-2,Täuschkörper,Der MG-74 Korund-2 ist ein selbstangetriebener hydroakustischer U-Boot-Imitator der dritten Generation. Anders als der frühere MG-44 kann er aus 533-mm-Rohren gestartet werden und gilt als hochentwickelt betreffend Geräuscherzeugung, Abstrahlung von Täuschsignalen oder akustischen Störung. Außerdem kann er von Luftfahrzeugen aus eingesetzt werden.

