DefaultDescription=Die F-4 ist ein amerikanisches, zweisitziges und zweimotoriges, sowie allwettertaugliches Überschallflugzeug, welches ursprünglich als Abfangjäger und Jagdbomber für die US-Navy entwickelt wurde. Dank seiner hohen Anpassungsfähigkeit wurde es bereits 1961 von der Marine in Dienst gestellt, bevor es auch von den US-Marine Corps und der US-Air Force übernommen wurde. Bis Mitte der 1960er Jahre war es ein Hauptbestandteil der US-Luftstreitkräfte. Die Produktion der F-4 lief von 1958 bis 1981 und umfasste insgesamt 5.195 Flugzeuge. Damit ist sie das am häufigsten produzierte amerikanische Überschall-Militärflugzeug der Geschichte und festigte ihren Ruf als herausragendes Kampfflugzeug des Kalten Krieges.
