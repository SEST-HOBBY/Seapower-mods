[usn_qh-50c]
Type=Gyrodyne
Default=QH-50C,QH-50
DefaultDescription=Die QH-50 DASH (Drone Anti-Submarine Helicopter) ist als fernwirkende, unbemannte U-Jagd-Waffe für Schiffe konzipiert, die zu klein einen für Hangar und bemannte Hubschrauber sind. Als wesentlicher Bestandteil des FRAM-Programms wurde die QH-50 älteren Einheiten wie den Zerstörern der Gearing-Klasse zugewiesen und fand auch Verwendung auf Hochseebegleitschiffen der Nachkriegszeit. Die Drohne hatte eine hohe Ausfallrate und erwies sich im schiffsgebundenen Einsatz als unzuverlässig. Sie wurde daher 1973 außer Dienst gestellt. Die JMSDF war der einzige ausländische Betreiber, der dank regelmäßigen Einsatzes größere Erfolge erzielte und die Systeme erst 1977 außer Dienst stellte. Die QH-50C war die erste Serienvariante, angetrieben von einem 300 shp Turbinenmotor. 373 Exemplare wurden gebaut.
Squadron1=QH-50,QH-50
Callsigns=Squadron1,Dash

[usn_qh-50d]
Type=Gyrodyne
Default=QH-50D,QH-50
DefaultDescription=Die QH-50 DASH (Drone Anti-Submarine Helicopter) ist als fernwirkende, unbemannte U-Jagd-Waffe für Schiffe konzipiert, die zu klein einen für Hangar und bemannte Hubschrauber sind. Als wesentlicher Bestandteil des FRAM-Programms wurde die QH-50 älteren Einheiten wie den Zerstörern der Gearing-Klasse zugewiesen und fand auch Verwendung auf Hochseebegleitschiffen der Nachkriegszeit. Die Drohne hatte eine hohe Ausfallrate und erwies sich im schiffsgebundenen Einsatz als unzuverlässig. Sie wurde daher 1973 außer Dienst gestellt. Die JMSDF war der einzige ausländische Betreiber, der dank regelmäßigen Einsatzes größere Erfolge erzielte und die Systeme erst 1977 außer Dienst stellte. Die QH-50D war eine Weiterentwicklung der QH-50C und verfügte über ein stärkeres 365-shp-Triebwerk, Rotorblätter aus Fiberglas sowie ein Heck ohne Leitwerk.
Squadron1=QH-50,QH-50
