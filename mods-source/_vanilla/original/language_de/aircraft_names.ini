[usn_sh-2f]
Type=U-Jagd-Hubschrauber
Default=SH-2F,SH-2F
DefaultDescription=Der SH-2F Seasprite wurde ursprünglich als seegestützter Nutzhubschrauber auf Basis des Huey konzipiert. Doch nachdem das DASH-Drohnenprogramm gescheitert war und US-Eskorten keine Langstrecken-U-Boot-Abwehrkapazität mehr hatten, wurde der Seasprite umfunktioniert und als LAMPS (Light Airborne Multipurpose System) Mark I eingesetzt. Dadurch erhielt er eine erheblich verbesserte U-Boot-Abwehrfähigkeit, indem er via Datenlink die große Reichweite des Schiffssonars SQS-26 und das Hubschraubereigene aktive/passive Schleppsonar AN/AQS-13 nutzte. 
