DefaultDescription=Als eines der leistungsfähigsten Jagdflugzeuge im Bestand der USAF ist die F-15 ein großes und äußerst fähiger Luftüberlegenheitsjäger. Ursprünglich entwickelt, um der USAF einen entscheidenden Vorteil gegenüber allen vorhandenen und absehbaren sowjetischen Flugzeugtypen zu verschaffen, verfügt die F-15 über ein leistungsstarkes Radar und unübertroffene Flugleistungen, um dieses Ziel zu erreichen.\nDas Modell „A“ ist die früheste in Dienst gestellte Variante der F-15 und erhielt erst Ende der 1980er-Jahre Gegenmaßnahmen. Dies führte dazu, dass Piloten Chaff-Bündel für den einmaligen Einsatz in der Luftbremse verstauten.
