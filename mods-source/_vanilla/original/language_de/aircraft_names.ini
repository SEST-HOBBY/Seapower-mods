[usaf_hh-3]
Type=Rettungshubschrauber
Default=HH-3E,HH-3
DefaultDescription=Der SH-3 ist ein amerikanischer, zweimotoriges U-Jagd-Flugzeug, sowie gleichzeitig einer der ersten Drehflügler, der Wellenleistungstriebwerke verwendet. Der Sea King hat seinen Ursprung in den Bemühungen der US-Marine, der wachsenden Bedrohung durch sowjetische U-Boote während der 1950er Jahre entgegenzuwirken. Entsprechend wurde der Hubschrauber speziell als leistungsfähige Anti-U-Boot-Plattform entwickelt. Der Sea King hat sich auch auf dem Exportmarkt bei ausländischen Militärkunden als beliebt erwiesen und wurde zudem sogar an zivile Betreiber verkauft.
