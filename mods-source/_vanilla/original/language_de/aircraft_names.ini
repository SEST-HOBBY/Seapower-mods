DefaultDescription=Die Tupolew Tu-16 ist ein zweimotoriger strategischer Bomber, der von der Sowjetunion eingesetzt wurde. Der Prototyp flog erstmals am 27. April 1952. Nachdem er in einem Wettbewerb gegen die Il-46 gewonnen hatte, wurde er im Dezember 1952 zur Produktion freigegeben. Die ersten Serienbomber wurden 1954 in Dienst gestellt und erhielten die entsprechende Dienstbezeichnung Tu-16. Obwohl die Tu-16 als für große Höhen und den Einsatz von Freifallbomben begann, wurde sie später mit ersten sowjetischen Marschflugkörpern ausgestattet. Die Tu-16K konnte AS-1-Marschflugkörper über einen Kampfradius von 1.800 km tragen. Diese sehr großen Waffen waren hauptsächlich für den Einsatz gegen US-amerikanische Flugzeugträger und andere Großschiffe vorgesehen.
