DefaultDescription=Die PS-1 ist ein japanisches Flugboot, entwickelt für die U-Jagd und die Seefernaufklärung. Ihre Indienststellung erfolgte 1971 bei der JMSDF und war mit Zielsuchtorpedos, Wasserbomben, 5"-Zuni-Raketen sowie Sonarbojen ausgerüstet. Mit zahlreichen technischen Neuerungen ihrer Zeit konnte die PS-1 auch bei einem Seegang von bis zu 3 Metern (9,8 ft) landen. Spätere Abwandlungen des Musters umfassten das US-1A-Such- und Rettungsflugzeug sowie ein einzelnes Versuchsflugzeug, das zum Tankflugzeug umgebaut wurde. In den 1980er-Jahren wurde die PS-1 durch die P-3 Orion ersetzt.
Squadron1=PS-1 31st Fleet Air Wing,PS-1
Squadron2=PS-1,PS-1
Callsigns=Squadron1,Stingray|Squadron2,Starfish

[jmsdf_us-1]
Type=Seefernaufklärer
Default=US-1A,US-1A
DefaultDescription=Die US-1A ist ein japanisches Amphibienflugzeug, entwickelt für Such- und Rettungsaufgaben. Die Indienststellung des Musters bei der JMSDF erfolgte in den 1970er-Jahren zusammen mit der U-Jagd-Variante PS-1. Die US-1A blieb bis 2017 im Einsatz, bevor sie außer Dienst gestellt und durch die moderne US-2 ersetzt wurde. Zwischen 1976 und 1999 waren US-1A-Flugzeuge an der Rettung von über 550 Menschen auf See beteiligt.
Squadron1=US-1A 31st Fleet Air Wing,US-1A
Squadron2=US-1A,US-1A
Callsigns=Squadron1,Seagull|Squadron2,Marlin

