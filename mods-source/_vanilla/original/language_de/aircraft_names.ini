[civ_707]
Type=Verkehrsflugzeug
Default=707 Airliner,Verkehrsflugzeug
DefaultDescription=Die 707 war ein amerikanisches Verkehrsflugzeug, sowie eines der beliebtesten Flugzeuge der 1960er Jahre. Obwohl es nicht das erste Verkehrsflugzeug mit Strahltriebwerk im Einsatz war, war die 707 das erste, welches sich weit verbreitet hatte und somit oft mit dem Beginn des Jet-Zeitalters in Verbindung gebracht wird. Sie dominierte die Passagierluftfahrt in den 1960er Jahren und blieb bis in die 1970er Jahre auf Inlands-, transkontinentalen und transatlantischen Flügen sowie in Fracht- und Militäranwendungen weit verbreitet. 
Squadron1=Atlantic Airlines,Atlantic
Squadron1Description=Am 25. Januar 1959 führte Atlantic Airlines ihren ersten transkontinentalen Flug mit einer 707 in der Passagierluftfahrt durch und eröffnete damit offiziell das "Jet-Zeitalter", indem sie die Strecke von Los Angeles nach New York in 4 Stunden und 3 Minuten zurücklegte.
