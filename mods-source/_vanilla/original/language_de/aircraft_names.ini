[civ_dc-10]
Type=Verkehrsflugzeug
Default=DC-10 Airliner, Verkehrsflugzeug
DefaultDescription=Die DC-10 ist ein amerikanisches, dreistrahliges Großraumflugzeug, welches die DC-8 auf Langstreckenflügen ablösen sollte. Das Flugzeug verfügt über zwei Mantelstromtriebwerke unter den Tragflächen und über ein drittes Triebwerk am Ende des vertikalen Stabilisators. Die Zweiklassen-Bestuhlung bietet typischerweise Platz für 270 Passagiere. Die anfänglichen Einsätze der DC-10 waren von einer schlechten Sicherheitsbilanz geprägt, die größtenteils auf einen Konstruktionsfehler der Verriegelung der Frachtraumtüren zurückzuführen war. Hierdurch kam es mehrfach zur Öffnung der Frachtraumtür während des Fluges, was in einem Fall zum Absturz der Maschine und dem Tod aller Menschen an Bord führte. Im August 1983 wurde bekannt gegeben, dass die Produktion aufgrund ausbleibender Bestellungen eingestellt wird. Maßgeblich für die rückläufigen Bestellungen war zum einen die weit verbreitete öffentlichen Besorgnis über die Sicherheitsbilanz der DC-10, zum anderen ihre schlechte Treibstoffeffizienz.
