[wp_mig-17]
Type=Abfangjäger
Default=MiG-17 Fresco,MiG-17
DefaultDescription=Die MiG-17 war eine fortschrittliche Weiterentwicklung der MiG-15, welche von der Sowjetunion während des Koreakriegs produziert wurde. Die Fertigstellung der MiG-17 geschah allerdings zu spät für den Einsatz in dem Konflikt und wurde erstmals während der zweiten Taiwanstraßenkrise im Jahr 1958 eingesetzt. Obwohl die MiG-17 entworfen wurde, um langsame amerikanische Bomber zu bekämpfen, zeigte sie überraschende Erfolge im Vietnamkrieg, in welchem sie von nordvietnamesischen Piloten fast ein Jahrzehnt nach ihrer ersten Entwicklung eingesetzt wurde, um amerikanische Abfangjäger und Jagdbomber zu bekämpfen.
