DefaultDescription=Die F/A-18 ist das neueste Mehrzweckkampfflugzeug der US Navy und gilt allgemein als eines der erfolgreichsten trägergestützten Kampfflugzeuge aller Zeiten. Dank ihrer hervorragenden Flugeigenschaften, modernen Avionik und der großen Auswahl an verfügbaren gelenkten und ungelenkten Waffen ist die F/A-18 ein echter Alleskönner, der für seine Vielseitigkeit nur wenige Kompromisse eingeht.\n\nDies ist die älteste auf Flugzeugträgern eingesetzte Ausführung der F/A-18. Anders als neuere Modelle kann sie keine lasergelenkten Waffen einsetzen.

