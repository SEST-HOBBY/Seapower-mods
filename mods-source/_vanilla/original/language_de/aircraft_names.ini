[usaf_c-141b]
Type=Transportflugzeug
Default=C-141B,C-141B
DefaultDescription=Die C-141 wurde als Ersatz für die älteren propellergetriebenen C-124 und C-133 entwickelt. Sie ist ein amerikanisches strategisches Transportflugzeug, das über 30.000 kg Fracht oder bis zu 120 Fallschirmjäger befördern konnte. Die Maschine war während des gesamten Kalten Krieges im intensiven Einsatz und wurde schließlich 2006 ausgemustert. Die C-141B ist eine verbesserte, verlängerte Version, die entwickelt wurde, um das Ladevolumen gegenüber der C-141A zu vergrößern.
