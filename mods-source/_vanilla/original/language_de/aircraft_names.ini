DefaultDescription=Die SH-3 wurde entwickelt, um der wachsenden Bedrohung durch sowjetische U-Boote entgegenzuwirken. Es existieren zahlreiche Untervarianten dieses Hubschraubers, die ein breites Fähigkeitsspektrum abdecken – von der Suche und Rettung (SAR) bis hin zur luftgestützten Frühwarnung (AEW). In ihrer zivilen Ausführung wird die SH-3 auch von mehreren Fluggesellschaften betrieben, insbesondere durch Betreiber von Ölplattformen in der Nordsee.
