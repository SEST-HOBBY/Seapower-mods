DefaultDescription=Die F-14 Tomcat ist ein amerikanisches, trägergestütztes Überschall-Kampfflugzeug mit zwei Triebwerken, zwei Sitzen, zwei Leitwerken und variabel einstellbaren Flügeln, welches sämtliche Wetterbedingungen bewältigen kann. Die Tomcat wurde im Rahmen des Naval Fighter Experimental (VFX) -Programms der United States Navy entwickelt, nachdem das F-111B-Projekt gescheitert war. Als großes und gut ausgestattetes Kampfflugzeug war die F-14 das erste Flugzeug der amerikanischen "Teen Series Fighter", die speziell unter Berücksichtigung der Luftkampferfahrungen gegen MiG-Jäger während des Vietnamkriegs entworfen wurden.
