DefaultDescription=Die Tu-154 ist ein dreistrahliges, mittelstreckentaugliches Schmalrumpfflugzeug, das Mitte der 1960er Jahre entworfen wurde. Über viele Jahrzehnte hinweg war sie das Rückgrat der sowjetischen Fluggesellschaften und beförderte die Hälfte aller Passagiere, die mit Aeroflot und seinen Tochtergesellschaften reisten. Bis in die Mitte der 2000er Jahre blieb sie das Standard-Inlandsflugzeug für Russland und die ehemaligen Sowjetstaaten. Darüber hinaus wurde sie an 17 nicht-russische Fluggesellschaften exportiert und von den Luftstreitkräften mehrerer Länder als Regierungsflugzeug eingesetzt.
