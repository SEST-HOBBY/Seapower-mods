[LoadingTips]
Count=19
Header=TIPP
Tip001=Harpoon- und Tomahawk-Flugkörper umfliegen kein Gelände. Stellen Sie vor dem Abschuss sicher, dass die Flugbahn frei ist.
Tip002=Aufgelockerte Formationen sind für den Gegner auf dem Radar schwerer zu beurteilen.
Tip003=Standard-Missiles können bei Seezielbekämpfung in direkter Sichtlinie eingesetzt werden und sind in dieser Rolle zuverlässiger als Harpoon.
Tip004=SH-2F-Hubschrauber stellen US-Navy-Geleitschiffen ein luftgestütztes Seezielradar zur Verfügung. Sie können Kontakte jenseits der Reichweite des Schiffsradars erfassen, jedoch nicht nach Luftzielen suchen.
Tip005=Zerstörer der Sovremenny-Klasse führen den SS-N-22 Sunburn mit. Er ist der leistungsfähigste Seezielflugkörper seiner Zeit, wird jedoch durch seine Reichweite von 48 NM begrenzt.
Tip006=Fregatten der Udaloy-Klasse führen das FlaRak-System SA-N-9 mit, das besonders wirksam gegen tieffliegende Seezielflugkörper wie Harpoon und Exocet ist.
Tip007=Störmaßnahmen durch Luftfahrzeuge verringern die Wirksamkeit der feindlichen Luftverteidigung erheblich.
Tip008=Die U-Jagd-Waffe SS-N-14A (Metel) wird von U-Jagd-Schiffen der Krivak- und Kresta-II-Klasse mitgeführt. Die SS-N-14B (Rastrub) verfügt zusätzlich über eine begrenzte Seezielfähigkeit und ist auf Schiffen der Klassen Krivak II, Kara und Udaloy installiert. Ihre Reichweite beträgt 27 NM.
Tip009=Drücken Sie die Tabulatortaste, um die Taktische Karte schnell zu maximieren.
Tip010=Drücken Sie Z, um bei unterstützten Einheiten Ferngläser, Optronik oder Periskope zu verwenden.
Tip011=Verwenden Sie die Kartenwerkzeuge, um die maximale Reichweite der FlaRak-Systeme und Seezielflugkörper identifizierter feindlicher Einheiten einzuzeichnen.
Tip012=Halten Sie die Alt-Taste gedrückt, während Sie den Mauszeiger über eine Waffe in der unteren Leiste bewegen, um ihre Feuerbereiche auf der taktischen Karte und in der 3D-Ansicht anzuzeigen.
Tip013=Drahtgelenkte Torpedos können nach dem Abschuss manuell in Geschwindigkeit, Tiefe und Zielposition gesteuert werden. Ältere Torpedos wie der TEST-71 bilden eine Ausnahme, da bei ihnen nach dem Abschuss nur Geschwindigkeit und Kurs angepasst werden können.
Tip014=Das ausklappbare Statusfenster in der unteren Leiste zeigt je nach Kontext relevante Informationen an, darunter den abgestrahlten Geräuschpegel der ausgewählten Einheit, die Transportkapazität von Hubschraubern für Überlebende, die Entfernung zum Signalgeber eines Rettungsfloßes sowie verfügbare, bestandsgeführte Munitionstypen wie AIM-54 oder AGM-84 auf Flugdecks.
Tip015=Alle Sonartypen können sämtliche Kontakte orten, die Geräusche erzeugen. Dies ist besonders beim Einsatz schiffsgestützter Schleppsonare wie SQR-18 und SQR-19 von Vorteil, mit denen feindliche Schiffe weit jenseits des Radarhorizonts geortet werden können.
Tip016=Die meisten Hubschrauber verfügen über eine gewisse Transportkapazität zur Aufnahme von Überlebenden. Einige kleinere Hubschrauber können jedoch nur wenige oder gar keine Überlebenden aufnehmen, sofern ihre U-Jagd-Ausrüstung nicht durch die Konfiguration „Transport“ entfernt wird.
Tip017=Einige hochrangige sowjetische Kampfschiffe verfügen über ESM-gestützte Fähigkeiten zur Zielerfassung jenseits des Horizonts (OTH-T). Insbesondere Schiffe der Kara-, Slawa-, Sowremenny- und Kirow-Klasse können diese Sensoren nutzen, um Seezielflugkörper weit jenseits des normalen Radarhorizonts abzufeuern, solange die Ziele elektromagnetische Emissionen aussenden.
Tip018=AGM-84D, RGM-84D und UGM-84D verwenden je nach Größe des Ziels unterschiedliche Pop-up-Modi. Kleine Boote und aufgetauchte U-Boote werden mit einer Pop-up-Flugbahn angegriffen, Schiffe hingegen im Konturenflug dicht über der Meeresoberfläche.
Tip019=Die meisten leistungsschwachen Seeraumüberwachungsradare auf Kriegsschiffen sind kaum von zivilen Navigationsradaren zu unterscheiden und lassen sich mittels ESM nicht ohne Weiteres identifizieren. Leistungsstarke Seeraumüberwachungsradare mit zusätzlicher Luftraumüberwachungsfähigkeit besitzen dagegen charakteristische Emissionen und können dadurch die Identität des eigenen Schiffes preisgeben.