ConditionTypeTooltipUnitDamageState=Die Bedingung wird ausgelöst, sobald die festgelegte(n) Einheit(en) eine Integritätsschwelle erreichen oder Sensoren, Waffen- beziehungsweise Antriebssysteme ausgefallen sind.
DamageConditionModeTooltip=Legt den Schadenszustand fest, den die festgelegte(n) Einheit(en) erreichen müssen.
