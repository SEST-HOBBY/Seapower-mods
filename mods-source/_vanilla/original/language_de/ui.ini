RefuseAnalytics=Analysen ablehnen

[LoadScreen]
WarningPSE=Bei einer sehr kleinen Anzahl von Personen können bestimmte visuelle Einflüsse (z. B. flackernde Lichter oder bestimmte Lichtmuster) zu photosensitiven, epileptischen Anfällen führen. Auch Personen, die zuvor noch nie einen Anfall hatten, könnten an bisher nicht erkannter Epilepsie leiden.\r\n\r\nFalls Sie an Epilepsie leiden, konsultieren Sie Ihren Arzt, bevor Sie Videospiele nutzen. Sollte bei Ihnen eines der folgenden Symptome auftreten (Schwindelgefühl, veränderte Sehkraft, Muskelzuckungen, jegliche Art von unkontrollierten Bewegungen, Bewusstseinsverlust, Desorientierung und/oder Krämpfe), so brechen Sie das Spiel SOFORT ab und suchen Sie einen Arzt auf.
WarningValidity=Die Inhalte der Spieldateien stimmen nicht mit der erwarteten Prüfsumme überein. Bitte schließen Sie das Spiel, löschen Sie den Inhalt von /StreamingAssets/original und überprüfen Sie die Spieldateien über Steam mit „Dateien auf Fehler überprüfen“.\r\n\r\nWenn Sie auf „Ordner löschen“ klicken, wird der Ordner automatisch entfernt. Steam lädt ihn beim nächsten Start des Spiels erneut herunter.
CloseGame=Spiel schließen
DeleteOriginal=Ordner löschen
WarningMods=Die folgenden aktivierten Mods wurden vom jeweiligen Autor nicht als mit dieser Version von Sea Power kompatibel angegeben. Möchten Sie diese deaktivieren?
DisableMods=Inkompatible Mods Deaktivieren
