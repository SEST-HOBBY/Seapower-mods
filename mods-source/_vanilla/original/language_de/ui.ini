ConditionTypeTooltipUnitClassified=Bedingung löst aus, wenn die festgelegte(n) Bedingungseinheit(en) von der angegebenen Bedingungsseite klassifiziert werden – „klassifiziert“ bedeutet, die Einheit ist detektiert und ihre Seite ist bekannt, jedoch möglicherweise noch nicht eindeutig identifiziert
ConditionTypeTooltipUnitsAreOutOfAmmo=Bedingung löst aus, wenn die festgelegte(n) Bedingungseinheit(en) über keinerlei Munition mehr verfügen – experimentell; diese Bedingung setzt voraus, dass die Einheit vollständig über alle Munitionsarten hinweg leer ist – spezifische Munitionsanforderungen sind in der Missions-INI-Datei zu konfigurieren
