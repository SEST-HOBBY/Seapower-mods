[Privacy]
Header=Datenschutz
Notice=Sea Power ist ein Spiel in Entwicklung und kann noch Fehler enthalten.\r\n\r\nWir würden uns freuen, wenn Sie uns erlauben würden, über die in das Spiel integrierten automatisierten Tools Analysen zu Abstürzen oder Fehlern an uns zu übermitteln, damit wir unser Spiel weiter verbessern können. Es steht Ihnen selbstverständlich frei, dies abzulehnen. Wir werden zukünftig versuchen, nicht erneut nach Ihrer Zustimmung zu fragen.\r\n\r\nUnsere vollständige Datenschutzerklärung finden Sie über den untenstehenden Link.
