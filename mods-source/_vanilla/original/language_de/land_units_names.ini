[usa_aaa_m51]
Type=Flugabwehrkanone
Default=M51 Skysweeper,M51 AAA
DefaultDescription=Die M51 Skysweeper war eine US-amerikanische Flugabwehrkanone, die ein Zielverfolgungsradar, einen Autolader und einen analogen Feuerleitstand kombinierte, um Kurzstreckenziele zu bekämpfen, da SAM-Systeme zu dieser Zeit auf solche Distanzen noch unwirksam waren. In den USA wurde sie Ende der 1950er-Jahre ausgemustert, blieb jedoch bei ausländischen Nutzern wie Japan und der Türkei bis in die 1960er-/1970er-Jahre im Einsatz.
