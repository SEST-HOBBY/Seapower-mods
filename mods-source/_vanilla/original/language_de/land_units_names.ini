[ -------------------- Vehicles -------------------- ]
[pla_apc_type63]
Type=APC
Default=Type 63 APC,Type 63 APC
DefaultDescription=Der Typ 63 ist das erste chinesische gepanzerte Fahrzeug, das ohne sowjetische Unterstützung entwickelt wurde. Wie der amerikanische M113 ist er äußerst vielseitig und wurde sowohl von China als auch von mehreren verbündeten Staaten, darunter Vietnam, Nordkorea, Bangladesch und Irak eingesetzt. Während des Vietnamkriegs wurde er an die nordvietnamesische Armee geliefert und kam später auch im Iran-Irak-Krieg zum Einsatz. In China wurde er ab den 1990er-Jahren schrittweise durch den ZSD 89 ersetzt.
Variant1=Type 63 APC,Type 63 APC

[pla_lt_type_63]
Type=Leichter Panzer
Default=Typ 63 LT,Typ 63 LT
DefaultDescription=Der Typ 63 ist ein chinesischer leichter Panzer, entwickelt auf Basis des sowjetischen PT-76. Seine Indienststellung erfolgte Mitte der 1960er-Jahre. Im Gegensatz zum PT-76 wurde er stark abgeändert. So verfügt er über eine vierköpfige Besatzung, einen linksseitigen Fahrersitz, einen mittig montierten Turm sowie die Fähigkeit, sich bei Wasserfahrten zusätzlich zu den Wasserstrahlantrieben über seine Ketten fortzubewegen. Der Panzer wurde an mehrere mit China verbündete Staaten exportiert und kam erstmals in den letzten Phasen des Vietnamkriegs zum Einsatz. In der China wurde er später durch die modernisierte Variante Typ 63A ersetzt.
Variant1=Typ 63 LT,Typ 63 LT
Variant2=Typ 63 LT,Typ 63 LT
Variant3=Typ 63 LT,Typ 63 LT
Variant4=Typ 63 LT,Typ 63 LT
Variant5=Typ 63 LT,Typ 63 LT
Variant6=Typ 63 LT,Typ 63 LT
Variant7=Typ 63 LT,Typ 63 LT

[pla_spaag_type63]
Type=SPAAG
Default=Typ 63 SPAAG,Typ 63 SPAAG
DefaultDescription=Der Typ 63 Flakpanzer wurde entwickelt, indem man den Rumpf eines T-34 mit einem Turm ausstattete, der zwei 37-mm-Kanonen des Typs 61 trägt. Während des Vietnamkriegs wurde er von China an die nordvietnamesische Armee geliefert, auch wenn es einige Quellen gibt, die dieser Darstellung widersprechen. Nach dem Krieg blieb er sowohl bei der NVA als auch bei der PLA im Einsatz und wurde schließlich 1990 ausgemustert.
Variant1=Typ 63 SPAAG,Typ 63 SPAAG

