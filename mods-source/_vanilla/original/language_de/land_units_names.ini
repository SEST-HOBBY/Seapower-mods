[swe_ersta]
Type=Küstenartillerie
Default=ERSTA-Batterie,Küstenartillerie
DefaultDescription=Die 12 cm tornautomatpjäs m/70 (auch bekannt als ERSTA) ist ein schwedisches Küstengeschütz, entwickelt als Ersatz für ältere Geschütztypen aus dem Zweiten Weltkrieg. Sie ist ausgelegt zur Verteidigung lebenswichtiger Bereiche wie Häfen gegen sowjetische Landungskräfte sowie zur Sperrung von ganzen Seegebieten. Diese Geschütze waren an Anlagen angeschlossen, die es der Besatzung ermöglichten, bis zu 60 Tage autark im Dienst zu verbleiben, eine wichtige Fähigkeit auf einem möglicherweise nuklearen Gefechtsfeld. Acht dieser Geschütze wurden Ende der 1980er Jahre zudem nach Norwegen exportiert.
Variant1=ERSTA-Batterie,Küstenartillerie

