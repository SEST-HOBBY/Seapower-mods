DefaultDescription=Während des zweiten Weltkrieges wurde von den USA das LSM-1 (Landing Ship Medium) entwickelt, das in seiner Größe zwischen einem LST (Landing Ship Tank) und einem LCI (Landing Craft Infantry) lag. Einige Schiffe wurden bereits während des Baus für Spezialaufgaben umgerüstet, etwa das LSM(R) zur Unterstützung von Truppenlandungen. Die meisten Einheiten wurden in der Nachkriegszeit außer Dienst gestellt, doch mehrere gelangten sowohl in den zivilen Einsatz als auch in die Marinen anderer Staaten, darunter Südvietnam, die Republik China, Thailand und die Philippinen.
