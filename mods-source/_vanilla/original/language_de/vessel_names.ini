[wp_takr_kiev]
Type=TAVKR,Flugzeugträger
Default=Kiev-Klasse,Kiev
DefaultDescription=Die seit 1975 im Dienst befindlichen Schiffe sind die Nachfolgemodelle der Moskva-Klasse. Für die U-Boot-Jagd konzipiert, führen diese Schiffe eine beeindruckende Auswahl an Seezielflugkörpern und Flugabwehrraketen mit. Im Gegensatz zu den Trägern der US Navy liegt ihre Hauptoffensivkraft in ihrer Batterie von Marschflugkörpern, wobei die Bordflugzeuge hauptsächlich für die Deckung aus der Luft verwendet werden. Diese Schiffe operieren oft als Flaggschiffe in Angriffs- oder Jagdverbänden.
