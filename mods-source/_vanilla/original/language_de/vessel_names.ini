[usn_cg_ticonderoga]
Type=CG,Lenkwaffenkreuzer
Default=Ticonderoga-Klasse,Ticonderoga
DefaultDescription=Die Gestaltung der Kreuzer der Ticonderoga-Klasse basierte auf den Zerstörern der Spruance-Klasse. Die Ticonderoga-Klasse führte eine neue Generation von Lenkwaffenschiffen ein, die auf dem Aegis-Phased-Array-Radar basierten, das gleichzeitig nach Bedrohungen scannen, Ziele verfolgen und Abfangraketen lenken kann. Bei ihrer Konzeption verfügten sie über die leistungsstärkste elektronische Kriegsführungsausrüstung in der US-Marine sowie über das fortschrittlichste Unterwasserüberwachungssystem. Diese Schiffe waren eine der ersten Klassen von Kriegsschiffen, die in Modulen gebaut wurden, anstatt auf herkömmliche Weise von unten nach oben montiert zu werden.
Variant1=Ticonderoga CG-47,Ticonderoga
Variant2=Yorktown CG-48,Yorktown
Variant3=Vincennes CG-49,Vincennes
Variant4=Valley Forge CG-50,Valley Forge
Variant5=Thomas S Gates CG-51,Gates

[usn_cgn_alaska]
Type=CGN,Lenkwaffenkreuzer
Default=Alaska-Klasse,Alaska
DefaultDescription=Die CGN der Alaska-Klasse ist bislang die größte CGN-Klasse der US Navy. Sie wurde aus dem CSGN-Programm der späten 1970er Jahre abgeleitet und verfügt über das modernste AEGIS-Waffensystem mit SM-2MR, Tomahawk-Marschflugkörpern, dem 8-Zoll-Geschütz Mk 71 zur Marinefeuerunterstützung sowie einem sehr geräumigen Hangar für den Betrieb großer Hubschrauber oder spezieller VTOL-Luftfahrzeuge. Im Vergleich zur Ticonderoga-Klasse verfügt die Alaska-Klasse über eine stärkere Panzerung und bei allen Waffensystemen über eine deutlich größere Magazinkapazität.\nDiese Klasse ist in Sea Power als interessantes Was-wäre-wenn enthalten.
Variant1=Alaska CGN-42,Alaska
Variant2=Hawaii CGN-43,Hawaii
Variant3=Puerto Rico CGN-44,Puerto Rico
Variant4=Samoa CGN-45,Samoa

[usn_cgn_california]
Type=CGN,Lenkwaffenkreuzer
Default=California-Klasse,California
DefaultDescription=Die beiden Kreuzer der California-Klasse wurden zwischen 1974 und 1975 in die US Navy übernommen und dienten dank ihrer praktisch unbegrenzten Reichweite als ideale schnelle Trägerkampfgruppen-Eskorte. Von Grund auf für Nuklearantrieb konzipiert, galten sie als die ersten nukleargetriebenen Schiffe, die für eine Serienproduktion vorgesehen waren (im Gegensatz zu den Vorgängerschiffen Long Beach, Bainbridge und Truxtun, die Einzelbauten blieben). Der Bau erwies sich jedoch als sehr kostspielig, sodass der Bau weiterer Einheiten zugunsten der späteren Virginia-Klasse gestrichen wurde. Im Dienst zeigten sich die Schiffe als sehr leistungsfähig: Sie verfügten über je einen Mk-13-Raketenstarter vorne und achtern, 5-Zoll-Geschütze sowie einen ASROC-Starter mit Nachladevorräten im Vorschiff. Modernisierungen Anfang der 1980er-Jahre umfassten die Nachrüstung des Phalanx-Nahbereichsverteidigungssystems (CIWS) sowie die Aufwertung der elektronischen Kampfausrüstung auf AN/SLQ-32(V)3. Beide Kreuzer wurden Ende der 1990er-Jahre außer Dienst gestellt, obwohl erst wenige Jahre zuvor kostspielige Reaktorüberholungen durchgeführt worden waren.
Variant1=California CGN-36,California
Variant2=South Carolina CGN-37,South Carolina

[usn_cgn_virginia]
Type=CGN,Lenkwaffenkreuzer
Default=Virginia-Klasse,Virginia
DefaultDescription=Die Virginia-Klasse (auch als CGN-38-Klasse bekannt) waren vier nuklearbetriebene Lenkwaffenkreuzer, die bis Ende der 1990er Jahre in der United States Navy im Dienst standen. Die doppelseitigen Kreuzer (mit Raketenbewaffnung sowohl vorne als auch hinten) wurden zwischen 1976 und 1980 in Dienst gestellt. Sie waren die letzte Klasse von nuklearbetriebenen Kreuzern, die fertiggestellt wurden.
Variant1=Virginia CGN-38,Virginia
Variant2=Texas CGN-39,Texas
Variant3=Mississippi CGN-40,Mississippi
Variant4=Arkansas CGN-41,Arkansas

[usn_cgn_long_beach_73]
Type=CGN,Lenkwaffenkreuzer
Default=Long Beach-Klasse,Long Beach
DefaultDescription=Die USS Long Beach wurde als Begleitschiff für den nuklearbetriebenen Flugzeugträger USS Enterprise konzipiert. Sie verfügt über eine ähnliche Sensorenausstattung, die ihr das charakteristische „Würfel“-Erscheinungsbild verleiht, sowie über eine starke Flugabwehrbewaffnung, bestehend aus zwei Terrier-Werfern und einem Talos-Werfer.
Variant1=Long Beach CGN-9,Long Beach

[usn_cgn_long_beach_83]
Type=CGN,Lenkwaffenkreuzer
Default=Long Beach-Klasse(1983),Long Beach
DefaultDescription=Die USS Long Beach wurde als Begleitschiff für den nuklearbetriebenen Flugzeugträger USS Enterprise konzipiert. In den 1980er-Jahren wurden das SCANFAR-Radar und das Talos-Luftabwehrsystem entfernt und durch konventionelle Radarsysteme sowie Phalanx CIWS, Harpoon- und Tomahawk-Raketen ersetzt, wodurch das Schiff auch über die Fähigkeit verfügte, Ziele an Land zu bekämpfen.
Variant1=Long Beach CGN-9,Long Beach

[usn_clg_oklahoma_city]
Type=CLG,Lenkwaffenkreuzer
Default=Galveston-Klasse,Galveston
DefaultDescription=Ursprünglich als Leichte Kreuzer der Cleveland-Klasse (CL) in der United States Navy während des Zweiten Weltkriegs gebaut, wurden im Jahr 1957 drei Schiffe als Leichte Kreuzer der Galveston-Klasse (CLG) umklassifiziert und mit dem Langstrecken-Boden-Luft-Raketensystem Talos ausgestattet. Während der zweijährigen Umrüstung im Rahmen des Projekts SCB 140 wurden die Aufbauten achtern komplett ersetzt und alle hinteren Geschütze wurden entfernt, um Platz für den doppelarmigen Talos-Starter und ein 46-Raketen umfassendes Magazin zu schaffen.
Variant1=Galveston CLG-3,Galveston
Variant2=Little Rock CLG-4,Little Rock
Variant3=Oklahoma City CLG-5,OK City

[usn_cv_forrestal_75]
Type=CV,Flugzeugträger
Default=Forrestal-Klasse,Forrestal
DefaultDescription=Die Flugzeugträger der Forrestal-Klasse waren vier Flugzeugträger, die in den 1950er Jahren für die United States Navy entworfen und gebaut wurden. Die Schiffsklasse wurde nach James Forrestal benannt, dem ersten Verteidigungsminister der Vereinigten Staaten. Es war die erste Klasse von Superträgern, die eine hohe Tonnage, Deckkantenaufzüge und ein geneigtes Deck kombinierte. Das erste Schiff wurde 1955 in Dienst gestellt, das letzte wurde 1998 außer Dienst gestellt.
Variant1=Forrestal CV-59,Forrestal
Variant2=Saratoga CV-60,Saratoga
Variant3=Ranger CV-61,Ranger
Variant4=Independence CV-62,Independence

[usn_cv_america_79]
Type=CV,Flugzeugträger
Default=America-Klasse,America
DefaultDescription=Die USS America (CVA/CV-66) war einer von drei Superträgern der Kitty Hawk-Klasse, die in den 1960er Jahren für die United States Navy gebaut wurden. Im Jahr 1965 in Dienst gestellt, verbrachte sie den größten Teil ihrer Karriere im Atlantik und im Mittelmeer, absolvierte jedoch drei Pazifik-Einsätze während des Vietnamkriegs. Sie diente auch bei den Operationen Desert Shield und Desert Storm im Persischen Golfkrieg.
Variant1=America CV-66,America

[usn_cv_kitty_hawk]
Type=CV,Flugzeugträger
Default=Kitty Hawk-Klasse,Kitty Hawk
DefaultDescription=Die Superträger der Kitty Hawk-Klasse der United States Navy waren eine schrittweise Verbesserung der Schiffe der Forrestal-Klasse. Die größten Unterschiede zu den Forrestals sind eine größere Länge und eine andere Platzierung der Aufzüge; zwei befinden sich vor der Insel, einer befindet sich hinter der Insel und ein weiterer Backbord-Achtern. Die Verlegung des Aufzugs Nr. 4 vom vorderen zum hinteren Ende machte ihn für Flugzeugbewegungen nützlich, da der vordere Aufzug in den Forrestals sowohl im Landeweg als auch im Startweg der mittleren Katapulte lag.
Variant1=Kitty Hawk CV-63,Kitty Hawk
Variant2=Constellation CV-64,Constellation

[usn_cvn_enterprise]
Type=CVN,Flugzeugträger
Default=Enterprise-Klasse,Enterprise
DefaultDescription=Die Enterprise (CVN-65, bis 1975 CVAN-65) war ein Flugzeugträger der United States Navy. Das 1961 in Dienst gestellte Schiff war der erste Flugzeugträger mit Kernenergieantrieb und für viele Jahre das größte Kriegsschiff der Welt. Auch nach ihrer Ablösung durch die Nimitz 1975 als größtes Kriegsschiff war sie mit 342,3 Metern immer noch das längste Kriegsschiff der Welt. Die Enterprise war das achte Schiff und nach der Enterprise aus dem Zweiten Weltkrieg der zweite Flugzeugträger mit diesem Namen in der US-Marine.
Variant1=Enterprise CVN-65,Enterprise

[usn_cvn_nimitz]
Type=CVN,Flugzeugträger
Default=Nimitz-Klasse,Nimitz
DefaultDescription=Die Flugzeugträger der Nimitz-Klasse sind eine Klasse von zehn nuklearbetriebenen Flugzeugträgern im Dienst der United States Navy. Das Flaggschiff der Klasse ist nach dem Oberbefehlshaber der Pazifikflotte der Vereinigten Staaten im Zweiten Weltkrieg, Flottenadmiral Chester W. Nimitz, benannt, dem letzten Flottenadmiral der US-Marine. Mit einer Gesamtlänge von 1.092 Fuß (333 m) und einer Verdrängung bei voller Beladung von über 100.000 Tonnen waren sie die größten gebauten und im Einsatz befindlichen Kriegsschiffe.
Variant1=Nimitz CVN-68,Nimitz
Variant2=Dwight D. Eisenhower CVN-69,Eisenhower
#Variant3=Carl Vinson CVN-70,Vinson

[usn_dd_gearing]
Type=DD,Zerstörer
Default=Gearing-Klasse FRAM I,Gearing
DefaultDescription=Die Gearing-Klasse war eine Serie von 98 Zerstörern, die für die US Navy während und kurz nach dem Zweiten Weltkrieg gebaut wurden. Das Gearing-Design war eine geringfügige Modifikation der Allen M. Sumner-Klasse, bei der der Rumpf am Mittschiff um 14 Fuß (4,3 m) verlängert wurde, was zu mehr Platz für die Treibstofflagerung und einer erhöhten Reichweite führte. In den späten 1950er und frühen 1960er Jahren durchliefen 79 der Zerstörer der Gearing-Klasse umfangreiche Modernisierungen, die als FRAM I bekannt waren und sie von einem Flugabwehrzerstörer zu einer Plattform für U-Boot-Abwehr umrüsten sollten. Die FRAM I- und FRAM II-Umrüstungen wurden zwischen 1960 und 1965 abgeschlossen. Schließlich erhielten bis auf drei Gearings alle FRAM-Umrüstungen.
