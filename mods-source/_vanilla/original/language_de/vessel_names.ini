DefaultDescription=Die Fregatten der Oliver Hazard Perry-Klasse wurden in Varianten mit einer Länge von 445 Fuß (136 m) "kurzer Rumpf" (Flight I) und 453 Fuß (138 m) "langer Rumpf" (Flight III) hergestellt. Beide waren hauptsächlich als Lenkwaffen-Kriegsschiffe für Luftabwehr, sowie U-Boot-Abwehr und Seeraumeskorte konzipiert. Die Schiffe mit langem Rumpf trugen die größeren und leistungsfähigeren SH-60 Seahawk LAMPS III-Hubschrauber. Sie konnten auch Luftverteidigung gegen Flugkörper und Anti-Schiff-Flugkörper bieten. Diese Kriegsschiffe sind ausgestattet, um Flugzeugträgerkampfgruppen, amphibische Landegruppen, Unterstützungsschiffe und Handelsschiffskonvois zu eskortieren und zu schützen.
