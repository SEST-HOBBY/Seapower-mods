[usn_lha_tarawa]
Type=LHA,Landungsboot
Default=Tarawa-Klasse,Tarawa
DefaultDescription=Die fünf Schiffe der Tarawa-Klasse sind spezialisierte amphibische Angriffsschiffe, die sowohl seegestützte (über an Bord befindliche LCUs) als auch luftgestützte (über an Bord befindliche Hubschrauber) Angriffe unterstützen können. Diese Schiffe haben sich im Einsatz der US Navy bewährt und dienten als Vorlage für das Design aller zukünftigen LHA-Schiffe.
