Variant5=Tashkent BPK-712,Tashkent
Variant6=Tallin BPK-597,Tallin

[wp_bpk_kashin]
Type=BPK,Zerstörer
Default=Kashin-Klasse,Kashin
DefaultDescription=Bei ihrer Einführung im Jahr 1962 war die Kashin-Klasse das weltweit erste Kriegsschiff, das ausschließlich von Gasturbinenantrieb angetrieben wurde. Das Schiff verfügt über das klassische doppelseitige Bewaffnungslayout, das für sowjetische Schiffe der damaligen Zeit typisch ist, wobei die U-Boot-Abwehrbewaffnung aus gelenkten Torpedos und U-Boot-Abwehrraketen besteht. Für ihre Zeit fortschrittlich, wurden diese mittlerweile veralteten Schiffe bis in die 1980er Jahre als „niedere“ Schiffe in einer Flottengruppe eingesetzt, wobei ein 'High-Low'-Mix verwendet wurde.
