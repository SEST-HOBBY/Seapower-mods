[plan_ap_qiongsha]
Type=APA,Landungsschiff
Default=Qiongsha-Klasse,Qiongsha
DefaultDescription=Das Frachtschiff der Qionghsa-Klasse ist eine Klasse chinesischer bewaffneter Fracht- und Truppentransporter der PLAN, abgeleitet aus zivilen Frachtschiffentwürfen. Die Schiffe zeichnen sich durch hohe Vielseitigkeit aus und übernehmen unterschiedlichste Aufgaben: Sie dienen als Truppentransporter, Versorgungsschiffe und können sogar als Lazarettschiffe eingesetzt werden. Damit sind sie wertvolle Unterstützungseinheiten für die PLAN.
