Variant2=Aleksandr Nikolayev

[wp_bdk_ropucha]
Type=BDK,Landungsschiff
Default=Ropucha-Klasse,Ropucha
DefaultDescription=Zwischen 1975 und 1985 wurden insgesamt neunzehn dieser Schiffe fertiggestellt. Jedes Schiff kann 10 Kampfpanzer oder 25 gepanzerte Mannschaftstransporter sowie 340 Soldaten transportieren, was alle Fahrzeuge und 25% der Truppenstärke eines Infanteriebataillons entspricht (der Rest hätte auf konventionellen Transportmitteln wie dem Amguema eingeschifft werden müssen). Wie der größere „Alligator“ sind auch die Ropuchas für Roll-on-Roll-off-Operationen mit Bug- und Heckrampen konzipiert, die zu einem durchgehenden Fahrzeugdeck führen, wobei der Boden des Rumpfes abgeschrägt ist, so dass das Schiff an einem Strand anlanden kann, um Fahrzeuge direkt abzusetzen. Die Schiffe sind auch mit Raketenwerfern ausgestattet, um amphibische Operationen mit Artilleriefeuer zu unterstützen.
