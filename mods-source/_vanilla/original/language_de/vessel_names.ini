Default=Charlie II-Klasse,Charlie 2
DefaultDescription=Der Hauptunterschied der Charlie II zur Charlie I war die Verwendung der SS-N-9 Siren-Rakete anstelle der SS-N-7 Starbright, was eine Verlängerung des U-Bootes erforderlich machte. Sie sind außerdem mit einem etwas leiseren Tandempropeller ausgestattet und haben die Fähigkeit, SS-N-15-Stand-Off-Raketen aus ihren Torpedorohren abzufeuern, was sie zu gefährlicheren Gegnern macht.
