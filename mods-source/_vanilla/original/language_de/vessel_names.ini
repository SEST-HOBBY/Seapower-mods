[usn_ssn_skipjack]
Type=SSN,Jagd-U-Boot
Default=Skipjack-Klasse,Skipjack
DefaultDescription=Die Skipjack-Klasse war der erste US-U-Boot-Entwurf, der das Leistungspotenzial der stromlinienförmigen Albacore-Rumpfform vollständig ausnutzte. Im Vergleich zu früheren Booten konnten diese U-Boote mit deutlich über 30 Knoten laufen und konnten sich damit den damaligen U-Boot-Abwehrwaffen weitestgehend entziehen. Später erhielten sie Nachrüstungen in Form von Schleppsonaranlagen, leiseren Schrägheckpropellern sowie der Fähigkeit zum Einsatz des Torpedos Mark 48, jedoch nie die Ausrüstung zum Verschuss von Sub-Harpoon.
