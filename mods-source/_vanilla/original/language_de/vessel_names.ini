[usn_cg_leahy]
Type=CG,Lenkwaffenkreuzer
Default=Leahy-Klasse,Leahy
DefaultDescription=Die Kreuzer der Leahy-Klasse waren eine Klasse von Lenkwaffenkreuzern, die für die United States Navy gebaut wurden. Sie wurden ursprünglich als Flottillenführer (DLG) bezeichnet, wurden aber bei der Kreuzer-Neuausrichtung von 1975 neu als Lenkwaffenkreuzer (CG) klassifiziert. Es handelte sich um eine neue "doppelseitige" Klasse, die mit Terrier (später Standard ER) Raketensystemen vorne und hinten ausgestattet war und um die erste und einzige Fregattenklasse, die ohne Hauptgeschützbatterie für den Küstenangriff oder Schiffsgefechte konzipiert wurde – die Geschützbewaffnung wurde reduziert, um eine größere Raketenlast tragen zu können.
Variant1=Leahy CG-16,Leahy
