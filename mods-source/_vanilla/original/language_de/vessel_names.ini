[usn_avp_barnegat]
Type=FF,Fregatte
Default=Barnegat-Klasse,Barnegat
DefaultDescription=Die Barnegat-Klasse wurde während des Zweiten Weltkriegs als kleiner Seeflugzeugtender für die US Navy entwickelt, verlor jedoch nach dem Krieg mit dem Niedergang der Seefliegerei rasch an Bedeutung. Infolgedessen wurden viele Einheiten außer Dienst gestellt. Die verbliebenen Schiffe wurden hingegen zu Vermessungsschiffen sowie zu Patrouillen- und/oder Ausbildungseinheiten umgerüstet und dienten in ausländischen Marinen, darunter Äthiopien, Italien, Norwegen, Südvietnam und die Philippinen. Achtzehn Einheiten wurden zudem an die US Coast Guard abgegeben, wo sie als Kutter der Casco-Klasse in Dienst gestellt wurden.
