[wp_bpk_kara]
Type=BPK,Lenkwaffenkreuzer
Default=Kara-Klasse,Kara
DefaultDescription=Diese Klasse ist eine vergrößerte und verbesserte Weiterentwicklung des Designs Kresta II. Gasturbinen haben die früheren Dampfanlagen ersetzt, und die Schiffe verfügen über umfangreichere Kommando- und Kontrollräume. Die ASW-Bewaffnung entspricht der der Kresta II, aber die Luftabwehrfähigkeiten wurden durch die Aufrüstung von SA-N-4-Abschussvorrichtungen in der Schiffsmitte verbessert. Die Größe des Rumpfes hat es auch ermöglicht, diese Schiffe sowohl mit dem Bull Bugsonar als auch mit dem Mare Tail-sonar mit variabler Tiefe auszustatten, das auch auf den Krivaks zu finden ist.
