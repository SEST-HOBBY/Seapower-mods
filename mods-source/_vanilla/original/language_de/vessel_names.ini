[wp_ssgn_charlie1]
Type=SSGN,U-Boot mit Marschflugkörpern
Default=Charlie I-Klasse,Charlie 1
DefaultDescription=Die Charlie war das weltweit erste U-Boot für Marschflugkörper, das zu Abschüssen im getauchten Zustand fähig war, was diese Boote zu einer viel größeren Bedrohung machte als die früheren Echo und Juliett, die noch auftauchen mussten, um ihre Raketen zu starten. Im Gegensatz zur früheren Generation verfügten diese Boote über verbesserte Geräuschdämmung und fortschrittliche Sonare, was sie betreffend ihrer Leistungsfähigkeit mit den Booten der Victor-I-Klasse vergleichbar machte. Die Verwendung eines Einzelreaktors machte sie jedoch wesentlich langsamer und bleibt somit ihr Hauptnachteil.
