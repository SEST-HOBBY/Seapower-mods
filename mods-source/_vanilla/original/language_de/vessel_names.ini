[usn_ddg_kidd]
Type=DDG,Lenkwaffenzerstörer
Default=Kidd-Klasse,Kidd
DefaultDescription=Die Zerstörer der Kidd-Klasse waren eine Serie von vier Lenkwaffenzerstörern, die auf der Spruance-Klasse basierten und für Luftabwehrmissionen anstelle von U-Boot-Abwehrmissionen ausgelegt waren. Die vier Schiffe der Kidd-Klasse waren ursprünglich für die Marine des Iran vorgesehen, jedoch wurden alle vier Verträge im Jahr 1979 storniert, was dazu führte, dass die teilweise fertiggestellten Rümpfe ab 1981 in den Dienst der US Navy traten. In den 2000er Jahren wurden alle vier Schiffe an die Marine der Republik China übertragen, wo sie bis heute im Einsatz sind.
Variant1=Kidd DDG-993,Kidd
Variant2=Callaghan DDG-994,Callaghan
Variant3=Scott DDG-995,Scott
Variant4=Chandler DDG-996,Chandler

[usn_ddg_mahan]
Type=DDG,Lenkwaffenzerstörer
Default=Coontz-Klasse (NTU),Mahan
DefaultDescription=Offiziell nach ihrem Typschiff als Farragut-Klasse bezeichnet, jedoch häufig nach dem ersten als Lenkwaffenzerstörer auf Kiel gelegten Schiff als Coontz-Klasse bekannt, waren die zehn Schiffe dieser Klasse zunächst mit dem Terrier-Flugabwehrsystem ausgerüstet. Später wurden sie jedoch für den Einsatz der Standard Missile umgerüstet.\n\nDas Schiff Mahan (DDG-42) der Coontz-Klasse wurde 1980 zum NTU-Erprobungsschiff umgerüstet und erhielt SM-2ER Block II sowie weitere moderne Systeme, die die Mahan zu dieser Zeit zum leistungsfähigsten Schiff für Luftverteidigung machten.
Variant1=Mahan DDG-42,Mahan

[usn_ff_garcia]
Type=FF,Fregatte
Default=Garcia-Klasse,Garcia
DefaultDescription=Die in der Mitte bis späten 1960er-Jahre in Dienst gestellte Garcia-Klasse wurde primär zur U-Jagd im Schutz von Konvois und amphibischen Verbänden konzipiert. Die Hauptbewaffnung dieser Schiffe bestand aus dem Sonarsystem AN/SQS-26 und dem U-Jagd-Raketensystem ASROC. Ursprünglich war der Einsatz des unbemannten U-Jagd-Hubschraubers DASH vorgesehen. Nach dem Scheitern des DASH-Programms wurden die Schiffe jedoch umgebaut und mit Hangars ausgestattet, die den Betrieb des bemannten Bordhubschraubers SH-2F Seasprite ermöglichten.
