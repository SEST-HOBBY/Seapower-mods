DefaultDescription=Etwa 50 dieser Schiffe wurden in den 1950er Jahren als kommerzielle Tanker gebaut, wobei einige seit 1960 innerhalb der Marine dienen. Die Klasse ähnelt den US-T-2-Tankern aus Kriegszeiten stark, wurde jedoch für die Versorgung auf See umgebaut und verfügt über einen großen zweibeinigen Mast und kleinere Kräne für die Versorgung mit Trockenwaren, während ein Betankungsvorgang auf See auf ein einzelnes Schiff mit dem vergleichsweise ineffizienten Heckbetankungssystem beschränkt ist.
