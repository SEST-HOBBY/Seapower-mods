DefaultDescription=Die Schnellversorgungsschiffe der Sacramento-Klasse waren eine Klasse von vier Versorgungsschiffen der United States Navy, die verwendet wurden, um Schiffe der US-Marine im Atlantischen und Pazifischen Ozean neu zu betanken, zu bewaffnen und zu versorgen.
