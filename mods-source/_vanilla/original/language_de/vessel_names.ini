[usn_takr_algol]
Type=T-AKR,RoRo-Schiff
Default=Algol-Klasse,Algol
DefaultDescription=Die Fahrzeugfrachtschiffe der Algol-Klasse, auch bekannt als Fast Sealift Ships (FSS) oder SL-7s, sind die schnellsten Frachtschiffe der Welt und können Geschwindigkeiten von mehr als 33 Knoten erreichen. Ursprünglich im Jahr 1972 und 1973 als Hochgeschwindigkeits-Containerfrachter bekannt als SL-7 für Sea-Land Services, Inc. gebaut, begrenzten die hohen Betriebskosten der Schiffe ihre Rentabilität. Alle acht Schiffe wurden von der US Navy für den Military Sealift Command in den Jahren 1981 und 1982 erworben. Der Umbau umfasste die Installation von vier Kränen, das Erlangen von Roll-on/Roll-off-Fähigkeiten und eine Neugestaltung des Laderaums, um die Lagerung von Fahrzeugen zu erleichtern. Aufgrund ihrer hohen Betriebskosten werden in Friedenszeiten alle schnellen Versorgungsschiffe im reduzierten Betriebsstatus gehalten, können jedoch innerhalb von 96 Stunden aktiviert und Seefertig gemacht werden. Alle Schiffe sind nach hellen Sternen am Nachthimmel benannt.
