DefaultDescription=Nahezu 30 Zerstörer der Charles-F.-Adams-Klasse wurden in den späten 1950er sowie frühen bis mittleren 1960er Jahren für die US Navy, die Royal Australian Navy (als Perth-Klasse) und die Bundesmarine (als Lütjens-Klasse) gebaut. Die Zerstörer der Adams-Klasse gehörten zu den ersten mit Lenkflugkörpern ausgerüsteten Kriegsschiffen der US Navy und waren zunächst mit dem Flugkörper-System Tartar ausgestattet. Aufgrund der zunehmenden Bedrohung durch Seezielflugkörper, insbesondere U-Boot-gestützte Systeme, wurde der RIM-66A im Jahr 1967 beschleunigt eingeführt und vorrangig auf Zerstörern der Adams-Klasse integriert, um eine wirksame Geleitsicherung gegen moderne Bedrohungen zu gewährleisten.
