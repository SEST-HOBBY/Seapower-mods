[wp_pkr_moskva]
Type=PKR,Flugzeugträger
Default=Moskva-Klasse,Moskva
DefaultDescription=Die beiden Schiffe der Moskva-Klasse wurden entworfen, um US-Polaris-Raketen-U-Boote in offenem Gewässer zu jagen, während der sie ihre große Anzahl von Hubschraubern und nuklearen Tiefenladungen einsetzten. Obwohl dieses Konzept scheiterte (hauptsächlich aufgrund der Einführung der Poseidon-Rakete mit höherer Reichweite im Dienste der US-Streitkräfte), sind ihre Hubschrauber immer noch für ASW-Operationen nützlich. Sie verfügen jedoch nicht über eine nicht-nukleare ASW-Waffe mit Reichweite und können nur ihre eigenen RBUs gegen U-Boote einsetzen, was sie von anderen Einheiten wie den BPKs Kresta oder Kara abhängig macht, um ihr Potenzial zu entfalten.
