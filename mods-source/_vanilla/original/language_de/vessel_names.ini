DefaultDescription=Seit 1976 im Dienst, war diese Klasse die erste, die von Anfang an mit einem Schleppsonar entworfen wurde. Ursprünglich konzipiert, um Flugzeugträgergruppen gegen sowjetische U-Boote zu schützen, kombinieren sie hohe Geschwindigkeit mit einem ausgezeichneten digitalen Sonar und Feuerleitsystemen sowie der fortschrittlichsten Geräuschdämmung. Mit der Aufrüstung von Harpoon- und Tomahawk-Raketen sind diese Boote ebenso zur Bekämpfung feindliche Schiffe und U-Boote fähig. Ihr einziger Nachteil ist ihre Größe, die sie sehr teuer macht und ihre Manövrierfähigkeit und maximale Tauchtiefe einschränkt.
