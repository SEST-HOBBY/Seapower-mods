[wp_rkr_kirov]
Type=TARKR,Lenkwaffenkreuzer
Default=Kirov-Klasse,Kirov
DefaultDescription=Die Kirov ist die ultimative Verkörperung des sowjetischen Raketenkreuzerkonzepts. Mit Abmessungen, die denen eines Schlachtschiffs aus dem Zweiten Weltkrieg ähneln, gehören diese zu den mächtigsten Schlachtschiffen, die jemals gebaut wurden. Zwei dieser Schiffe wurden seit 1980 gebaut, zwei weitere sind im Bau. Ihre Größe ist notwendig, um eine große Batterie von Anti-Schiffs-Raketen sowie ein Flugabwehr-Raketensystem mit mehreren Nahverteidigungssystemen als Backup unterzubringen. Obwohl sie mit fortschrittlichen Sonargeräten und ASW-Waffen ausgestattet sind, fungieren diese Schiffe im Allgemeinen als Flaggschiffe von Seekriegsgruppen, die von speziellen ASW-Schiffen geschützt werden.
Variant1=Kirov RKR-181,Kirov

[wp_rkr_kresta1]
Type=RKR,Lenkwaffenkreuzer
Default=Kresta-Klasse,Kresta
DefaultDescription=Diese Klasse wurde als größerer und leistungsfähigerer Nachfolger der Lenkwaffenkreuzer der Kynda-Klasse konzipiert, die sich als kopflastig und zu eng herausstellten. Die Kresta I ist für die Anti-Schiffs-Rolle gedacht, verfügt jedoch über erheblich verbesserte Fähigkeiten für die Luftabwehr und U-Boot-Abwehr. Wenn diese Schiffe in die Nordatlantik-Konvoistrouten gelassen werden, könnten sie sich als echte Bedrohung für die NATO erweisen.
Variant1=Admiral Zozulya RKR-060,Zozulya
Variant2=Vladivostok RKR-097,Vladivostok
Variant3=Vice-Admiral Drozd RKR-072,Drozd
Variant4=Sevastopol RKR-048,Sevastopol

[wp_rkr_kynda]
Type=RKR,Lenkwaffenkreuzer
Default=Kynda-Klasse,Kynda
DefaultDescription=Die Lenkwaffenkreuzer des Projekts 58, von der NATO als Kynda-Klasse und manchmal auch als Grozny-Klasse bezeichnet, waren die erste Generation sowjetischer Lenkwaffenkreuzer und stellten einen erheblichen Fortschritt für die sowjetische Marine dar. Ihre Hauptrolle war die Seekriegsführung unter Verwendung der SS-N-3b 'Shaddock'-Rakete. Das Design erwies sich als kopflastig und wurde bald von der größeren Kresta-I-Klasse abgelöst, die Kyndas blieben jedoch bis zum Zusammenbruch der Sowjetunion im Dienst.
Variant1=Grozny RKR-121,Grozny
Variant2=Admiral Fokin RKR-118,Fokin
Variant3=Admiral Golovko RKR-043,Golovko
Variant4=Varyag RKR-120,Varyag

[wp_rkr_slava]
Type=RKR,Lenkwaffenkreuzer
Default=Slava-Klasse,Slava
DefaultDescription=Die Slawa-Klasse, sowjetische Bezeichnung Projekt 1164 Atlant, ist eine Klasse von Lenkwaffenkreuzern, die in der Sowjetunion für die sowjetische Marine entworfen und gebaut wurde. Die Entwicklung begann Ende der 1960er Jahre und basierte auf der Verwendung der P-500 Bazalt-Rakete. Der Kreuzer war als eine kostengünstigere, konventionell angetriebene Alternative zu den nuklearbetriebenen Raketenkreuzern der Kirov-Klasse gedacht
Variant1=Slava RKR-103,Slava
Variant2=Marshal Ustinov RKR-088,Ustinov
Variant3=Chervona Ukrayina RKR-119,Ukrayina

[wp_skr_krivak1]
Type=SKR,Fregatte
Default=Krivak I-Klasse,Krivak 1
DefaultDescription=Die in den frühen 1970er Jahren in Dienst gestellte Klasse war dafür gedacht, an kleineren Werften gebaut zu werden, die keine Erfahrung im Bau größerer Kriegsschiffe hatten. Es handelt sich um "leichte" ASW-Schiffe, die jedoch in der Lage sind, NATO-Unterseeboote erheblich zu stören. Es handelt sich um elegante Schiffe mit ausgezeichneten Seeeigenschaften und einem variablen Tiefen-Sonar, aber sie verfügen nur über begrenzte Bewaffnung, tragen keine Hubschrauber und verfügen nur über rudimentäre Kommandoeinrichtungen. In taktischen Situationen werden sie in der Regel dem Kommando größerer BPKs unterstellt sein. Ihnen fehlen die 30-mm-Verteidigungsgeschütze, die auf den meisten anderen sowjetischen Kriegsschiffen zu finden sind, was sie anfällig für Anti-Schiffs-Raketen macht.
