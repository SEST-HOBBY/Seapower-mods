[plan_dd_luda1]
Type=DD,Zerstörer
Default=Luda I-Klasse,Luda I
DefaultDescription=Die Chengdu-Klasse wurde aus der sowjetischen U-Jagd-Fregatte der Riga-Klasse entwickelt, die der Volksrepublik China vor dem sino-sowjetischen Bruch überlassen wurde. Die Chengdu-Klasse verbessert die Fähigkeit zur Bekämpfung von Überwasserzielen, indem sie die ursprünglichen dreifachen Torpedorohre durch einen Zwillingsstarter für die auf der Styx basierende Safflower-Rakete ersetzt. Die U-Jagd-Fähigkeit ist äußerst schwach und beschränkt sich auf zwei RBU-1200-U-Jagd-Mörser. Diese Klasse bildet die Grundlage, aus der sich alle nachfolgenden Fregatten der chinesischen Marine (PLAN) entwickelt haben.
Variant1=Guangzhou DD-160,Guangzhou
Variant2=Xi'an DD-106,Xi'an
Variant3=Changsha DD-161,Changsha
Variant4=Yinchuan DD-107,Yinchuan
Variant5=Nanning DD-162,Nanning
Variant6=Nanjing DD-131,Nanjing
Variant7=Xining DD-108,Xining
Variant8=Nanchang DD-163,Nanchang
Variant9=Chongqing DD-133,Chongqing
Variant10=Zunyi DD-134,Zunyi
Variant11=Guilin DD-164,Guilin

[plan_ff_chengdu]
Type=FF,Fregatte
Default=Chengdu-Klasse,Chengdu
DefaultDescription=Entwickelt auf Basis der sowjetischen U-Jagd-Fregatten der Riga-Klasse, die vor dem Bruch zwischen der Sowjetunion und der Volksrepublik China an China geliefert wurden. Die Chengdu-Klasse verfügt über verbesserte Fähigkeiten zur Bekämpfung von Überwasserschiffen, indem sie die ursprünglichen dreifachen Torpedorohre durch einen Zwillingsstarter für die auf der Styx basierende Safflower-Rakete ersetzt. Die U-Jagd-Fähigkeiten sind hingegen deutlich geringer und bestehen lediglich aus zwei RBU-1200 U-Jagd-Granatwerfern. Diese Klasse bildet die Grundlage für später eingesetzte Fregatten der chinesischen Marine (PLAN).
Variant1=Kunming FF-505,Kunming
Variant2=Chengdu FF-506,Chengdu
Variant3=Guiyang FF-507,Guiyang
Variant4=Hengyang FF-508,Hengyang

[plan_ff_jianghu1]
Type=FF,Fregatte
Default=Jianghu I-Klasse,Jianghu I
DefaultDescription=Diese Schiffe sind die Nachfolger der Chengdu-Klasse und verbessern vor allem die Fähigkeit zur Bekämpfung von Überwasserzielen, indem die Anzahl der CSS-N-2 Safflower-Anti-Schiff-Raketen auf vier verdoppelt wurde. Die Flugabwehrbewaffnung wurde geringfügig verbessert, da nun sechs 37-mm-Geschütze installiert sind, im Vergleich zu nur zwei auf der Chengdu-Klasse. Die U-Jagd-Fähigkeiten bleiben jedoch sehr begrenzt und bestehen lediglich aus doppelläufigen FQF-1200-U-Jagd-Mörsern und Wasserbombenwerfern.
Variant1=Changde FF-509,Changde
Variant2=Shaoxing FF-510,Shaoxing
Variant3=Nantong FF-511,Nantong
Variant4=Wuxi FF-512,Wuxi
Variant5=Huai'an FF-513,Huai'an
Variant6=Zhenjiang FF-514,Zhenjiang
Variant7=Xiamen FF-515,Xiamen
Variant8=Jiujiang FF-516,Jiujiang
Variant9=Nanping FF-517,Nanping
Variant10=Ji'an FF-518,Ji'an 
Variant11=Changzhi FF-519,Changzhi
Variant12=Kaifeng FF-520,Kaifeng
Variant13=Maoming FF-551,Maoming
Variant14=Yibin FF-552,Yibin

[plan_ff_jianghu2]
Type=FF,Fregatte
Default=Jianghu II-Klasse,Jianghu II
DefaultDescription=Diese Schiffe sind die Nachfolger der Chengdu-Klasse und verbessern hauptsächlich die Fähigkeit zur Bekämpfung von Überwasserzielen, indem die Anzahl der eingesetzten CSS-N-2 Safflower-Anti-Schiff-Raketen auf vier verdoppelt wurde. Die Jianghu-II-Klasse ersetzt zudem die Einzellafetten der 100-mm-Geschütze der Jianghu-I-Klasse durch doppelläufige 100-mm-Geschütze. Dies geht jedoch zulasten der Flugabwehrfähigkeit, da zwei 37-mm-Geschütze entfernt wurden, um das zusätzliche Gewicht der Hauptbewaffnung auszugleichen. Die U-Jagd-Fähigkeiten bleiben sehr schwach und beschränken sich auf doppelläufige FQF-1200-U-Jagd-Mörser und Wasserbombenwerfer.
Variant1=Taizhou FF-533,Taizhou
Variant2=Jinhua FF-534,Jinhua
Variant3=Dandong FF-543,Dandong
Variant4=Linfen FF-545,Linfen
Variant5=Shaoguan FF-553,Shaoguan
Variant6=Anshun FF-554,Anshun
Variant7=Zhaotong FF-555,Zhaotong
Variant8=Xiangtan FF-556,Xiangtan
Variant9=Jishou FF-557,Jishou

[plan_ff_jianghu3]
Type=FF,Fregatte
Default=Jianghu III-Klasse,Jianghu III
DefaultDescription=Diese Schiffe sind die ersten modernen Kriegsschiffe, die von China gebaut wurden. Sie verfügen über eine ABC-geschützte, klimatisierte und geschlossene Aufbautenstruktur sowie über eine deutlich stärkere Bewaffnung zur Bekämpfung von Seezielen. Die U-Jagd-Fähigkeiten bleiben jedoch sehr begrenzt und bestehen lediglich aus drehbaren, doppelläufigen FQF-1200D-U-Jagd-Mörsern.
Variant1=Huangshi FF-535,Huangshi
Variant2=Wuhu FF-536,Wuhu
Variant3=Cangzhou FF-547,Cangzhou

[plan_ffg_jiangdong]
Type=FF,Fregatte
Default=Jiangdong-Klasse,Jiangdong
DefaultDescription=Diese Schiffe sind Nachfolger der Chengdu-Klasse und wurden als Flugabwehr-Eskorte konzipiert. Sie setzen die Kurzstrecken-Flugabwehrrakete HQ-61 ein und verfügen über vier doppelläufige 37-mm-Geschütze, im Gegensatz zu nur zwei auf der Chengdu-Klasse. Die U-Jagd-Fähigkeiten bleiben sehr begrenzt und bestehen lediglich aus doppelläufigen FQF-1200-U-Jagd-Mörsern und Wasserbombenwerfern.
Variant1=Yingtan FFG-531,Yingtan
Variant2=Zhongdong FFG-532,Zhongdong

[plan_k_type_037]
Type=FS,Korvette
Default=Typ 037 (Hainan),Hainan
DefaultDescription=Eine weitverbreitete Klasse von U-Boot-Jägern, die von der PLAN und mehreren anderen Marinen genutzt wird, ist die Hainan-Klasse (Typ 037). Sie ist eine kleine, schnelle und ausdauerstarke Korvette, die sich bei Operationen im Südpazifik als sehr fähig erwiesen hat. Das Schiff verfügt trotz seiner Größe über eine beachtliche Bewaffnung. Somit bietet es ein breites Einsatzspektrum, beispielsweise als schnelles Kanonenboot mit U-Jagd-Fähigkeit, auch wenn diese vergleichsweise jedoch eher bescheiden ist.
Variant1=Zhaoyuan 605,Zhaoyuan

[plan_lst_yukan]
Type=LST,Landungsschiff
Default=Yukan-Klasse,Yukan
DefaultDescription=Die LSTs der Yukan-Klasse (Typ 072) sind die erste Generation neuer Panzerlandungsschiffe für die PLAN und ersetzten veraltete Landungsschiffe amerikanischer Bauart aus der Zeit des Zweiten Weltkriegs. Wie viele andere Landungsschiffe sind diese Einheiten mit Geschützen mittleren Kalibers bewaffnet, um sich selbst zu verteidigen und eine Landung zu unterstützen, da sie sich zum Entladen von Fahrzeugen über die Bugrampe auf den Strand setzen müssen. Alternativ können diese Schiffe Landungsboote aussetzen und zusätzlich große Frachtmengen auf dem Deck transportieren.
Variant1=Yuntaishan LST-927,Yuntaishan
Variant2=Wufengshan LST-928,Wufengshan
Variant3=Zijinshan LST-929,Zijinshan

[plan_msc_type_010]
Type=MSO,Minensuchboot
Default=Typ 010,Type 010
DefaultDescription=Der Minensucher der Typ-010-Klasse ist eine chinesische Variante des sowjetischen Minensuchbootes der T-43K-Klasse, ergänzt um zusätzliche Maschinengewehrbewaffnung. Die Schiffe sind weit verbreitet, kostengünstig und vor allem aufgrund erhöhter Seeausdauer, verbesserter Besatzungsunterbringung sowie schwererer Bewaffnung wirksamere Patrouillenboote als das ursprüngliche, sowjetische Original.
Variant1=364,364

[plan_pt_shanghai2]
Type=PT,Schnellboot
Default=Shanghai II-Klasse,Shanghai II
DefaultDescription=Das Patrouillenboot Shanghai II (Typ 062) ist ein kleines, aber stark bewaffnetes Kurzstrecken-Kanonenboot der PLAN, geeignet für Küsteneinsätze und in der Lage, seine Wirkung trotz seiner geringen Größe auch gegen größere Kriegsschiffe zu entfalten. Bei dieser Version handelt es sich um eine frühe Bauserie der Shanghai-II-Klasse mit einem U-Boot-Abwehrmörser und einem kleinen Brückenaufbau.
Variant1=Shanghai II,Shanghai II

[plan_pt_shanghai2b]
Type=PT,Schnellboot
Default=Shanghai IIB-Klass3,Shanghai IIB
DefaultDescription=Das Patrouillenboot Shanghai II (Typ 062) ist ein kleines, aber stark bewaffnetes Kurzstrecken-Kanonenboot der PLAN, geeignet für Küsteneinsätze und in der Lage, seine Wirkung trotz seiner geringen Größe auch gegen größere Kriegsschiffe zu entfalten. Bei dieser Version handelt es sich um eine spätere Bauserie der Shanghai-II-Klasse mit vergrößertem Brückenaufbau, jedoch entfiel dafür der U-Boot-Abwehrmörser.
Variant1=Shanghai IIB,Shanghai IIB

