[rcn_ss_oberon]
Type=SS,Patrouillen-U-Boot
Default=Oberon-Klasse (RCN),Oberon
DefaultDescription=Die Oberon-Klasse war eine Klasse von 27 britischen diesel-elektrischen Jagd- und Patrouillen-U-Booten, die als Weiterentwicklung der Porpoise-Klasse mit stärkerem Rumpfmaterial und modernisierter Ausrüstung entwickelt wurde. Die Royal Canadian Navy bestellte drei U-Boote der Oberon-Klasse in zwei Baulosen mit geringfügigen Abweichungen vom Standard der Royal Navy, insbesondere durch die Verwendung amerikanischer Waffen wie des Mark-37-Torpedos.\n\nDie Royal Canadian Navy begann Ende der 1970er-Jahre mit einem Modernisierungsprogramm (SOUP), um die Einsatzdauer der Boote bis in die 1980er- und 1990er-Jahre zu verlängern. Das erste Boot wurde ab 1980 modernisiert. Dadurch wurde die Fähigkeit zum Einsatz des Mark-48-Torpedos geschaffen, obwohl diese Torpedos erst in den 1990er-Jahren geliefert wurden. Während des Kalten Krieges kam daher übergangsweise der Mk-37C/E-Torpedo zum Einsatz.
