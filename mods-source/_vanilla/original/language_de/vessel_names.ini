[usn_ssbn_lafayette]
Type=SSBN,Strategisches U-Boot
Default=Lafayette-Klasse,Lafayette
DefaultDescription=Die Lafayette-Klasse war der Nachfolger der früheren Ethan-Allen-Klasse, die selbst die Grundversion des ursprünglichen George-Washington-Polaris-U-Boots darstellte. Diese U-Boote wurden mit einem größeren Augenmerk auf die Habitabilität entworfen und wiesen eine raumoptimierte Maschinenanordnung auf, ähnlich der der Permit- und Sturgeon-Klasse, was sie deutlich schwerer erkennbar macht als ihre Vorgänger. In den 1970er Jahren wurden alle mit Poseidon-C-3-Raketen und geschleppten Sonarsystemen aufgerüstet, erhielten jedoch im Gegensatz zu späteren Booten niemals Trident-Raketen. Diese Klasse unterscheidet sich von den Franklins durch das Fehlen von Endplatten an den Hecksteuerflächen sowie durch eine höhere Position der Steuerflächen am Turm.
Variant1=Lafayette SSBN-616,Lafayette
