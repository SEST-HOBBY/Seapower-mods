[wp_ssgn_echo2]
Type=SSGN,U-Boot mit Marschflugkörpern
Default=Echo II-Klasse,Echo 2
DefaultDescription=Die Echo II ist eine Weiterentwicklung der ursprünglichen Echo-Klasse, die die seegestützte Version des nuklearen SS-N-3 Shaddock-Marschflugkörpers trägt. Die Änderungen umfassen die Installation zweier Startvorrichtungen achtern des Turms und die Vergrößerung des Turms selbst, um das vordere Feuerleitradar in einer schwenkbaren Halterung aufnehmen zu können, wie es bereits bei der Juliett-Klasse umgesetzt war. Sie sind mit dem gleichen unzuverlässigen Antriebssystem wie die November-Klasse ausgestattet, allerdings machen die großen Ausschnitte für die Raketenabgase die Schiffe zusätzlich noch lauter.
