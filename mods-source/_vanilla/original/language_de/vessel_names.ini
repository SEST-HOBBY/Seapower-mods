DefaultDescription=Diese Klasse wurde in den 1960er Jahren als schnelle einseitige Lenkwaffenfregatten für die Abschirmung von Trägerverbänden gebaut. Das Design leitet sich von den früheren doppelseitigen Taskforce-Fregatten der Leahy-Klasse ab, ersetzt jedoch den hinteren Raketenwerfer durch ein 5-Zoll-Geschütz sowie ein aufgerüstetes Raketensystem, das sowohl die Standard-Luft-Luft-Rakete als auch die ASROC-Anti-U-Boot-Rakete abfeuern kann. Sie wurden 1975 neu als Lenkwaffenkreuzer klassifiziert.
