DefaultDescription=Dies war das erste wirklich moderne Atom-U-Boot, das von der Sowjetunion gebaut wurde, und folgt eng dem Muster zeitgenössischer westlicher SSBNs mit vorderen Tragflächen am Turm und 16 Raketen in einem Abteil hinter dem Turm (im Gegensatz zu früheren Konstruktionen wie der Golf- und Hotel-Klasse, die viel größere Raketen in einer großen Turmstruktur besaßen). Interessanterweise wurde die gleiche Anordnung vom USN ernsthaft in Betracht gezogen, bevor Polaris eingeführt wurde. Im Gegensatz zu diesen ersten Booten sind die Yankees zu Abschüssen im getauchten Zustand fähig, was sie um Längen leistungsfähiger macht. Wie andere sowjetische Boote sind sie im Vergleich zu westlichen Booten sehr laut. Dieses Design würde später in der Delta-Klasse verfeinert werden.
