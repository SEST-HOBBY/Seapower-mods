DefaultDescription=Die Landungsschiffe der Newport-Klasse waren eine verbesserte Klasse von Panzerlandungsschiffen (LST), die von der United States Navy von 1969 bis 2002 entworfen und eingesetzt wurden. Die Schiffe sollten erhebliche Vorteile gegenüber ihren Vorgängern aus dem Zweiten Weltkrieg bieten. Größer und schneller als jede bisherige LST-Konstruktion, befand sich ihre Rampe über dem Bug, sodass Geschwindigkeiten von über 20 Knoten erreicht werden konnten.
