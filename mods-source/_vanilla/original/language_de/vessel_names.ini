[wp_ssgn_oscar1]
Type=SSGN,U-Boot mit Marschflugkörpern
Default=Oscar I-Klasse,Oscar
DefaultDescription=Die Oscar ist das Unterwasserpendant zu den massiven Lenkwaffenkreuzern der Kirov-Klasse. Mit 16.500 Tonnen sind die Boote dieser Klasse größer als alle anderen U-Boote, mit Ausnahme der riesigen Ohio- und Typhoon-Klassen. Die enorme Größe war nötig, um die gleiche Batterie von 24 SS-N-19 Shipwreck-Raketen aufzunehmen, die auf der Kirov zu finden sind. Trotz der Größe der Boote können sie mit 30 Knoten fahren und verfügen über Waffen, Sensoren und Geräuschdämmung auf dem Niveau der Victor III's, was sie zu gefährlichen Gegnern für jedes NATO-U-Boot macht.
Variant1=K-525
Variant2=K-206

[wp_ssn_alfa]
Type=SSN,Jagd-U-Boot
Default=Alfa-Klasse,Alfa
DefaultDescription=Diese U-Boote gehören zu den schnellsten, die je gebaut wurden. Bestmöglich automatisiert und mit fortschrittlicher Sonar- und Waffentechnik ausgestattet, treibt ein exotischer Brutreaktor diese Boote mit überwältigenden 40 Knoten unter Wasser an. Die hohe Geschwindigkeit ermöglicht es ihnen, den meisten ASW-Torpedos zu entkommen, macht jedoch die Alfas andererseits äußerst laut. Bei langsameren Geschwindigkeiten sind sie jedoch leise und mit speziellen Kriechmotoren für geräuscharmes Fahren ausgestattet.
