[usn_ssbn_franklin]
Type=SSBN,Strategisches U-Boot
Default=Benjamin Franklin-Klasse,Franklin
DefaultDescription=Die strategischen U-Boote der Benjamin Franklin-Klasse der US-Navy waren von den 1960er bis zu den 2000er Jahren im Dienst. Die Klasse war eine Weiterentwicklung der früheren James Madison-Klasse. Die U-Boote der Benjamin Franklin-Klasse wurden mit der ballistischen Rakete Polaris A-3 gebaut und wurden Anfang der 1970er Jahre auf die Trägerrakete Poseidon C-3 umgerüstet. Während der späten 1970er und frühen 1980er Jahre wurden sechs Boote weiter modifiziert, um die Trident I (C-4) Rakete zu tragen.
