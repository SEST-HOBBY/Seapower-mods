DefaultDescription=Als Ersatz für die Garcia-Klasse konzipiert, wurden in den späten 1960er- bis Mitte der 1970er-Jahre fast 50 Schiffe der Knox-Klasse gebaut. Anfangs ohne Luftabwehr ausgestattet, wurden die Schiffe später nachgerüstet, um die Sea-Sparrow-Flugabwehrrakete sowie den Bordhubschrauber SH-2F Seasprite mitführen zu können. In den 1980er-Jahren erhielten sie zusätzlich Harpoon-Schiffsabwehrraketen: Zwei Zellen des ASROC-Starters wurden mit Harpoon-Raketen statt mit RUR-5 ASROC bestückt.
