DefaultDescription=Die Brooke-Klasse wurde als luftkriegsorientierte Abwandlung der Garcia-Klasse (einer Fregatte zur U-Jagd) entworfen, wobei das achtern angebrachte 5"-Geschütz durch einen 16-Schuss-Tartar-Starter ersetzt wurde. Wie die Garcias waren sie ursprünglich mit einem kleinen Hangar für die ASW-Drohne DASH ausgestattet, der später vergrößert wurde, um einen LAMPS-Hubschrauber aufnehmen zu können.
