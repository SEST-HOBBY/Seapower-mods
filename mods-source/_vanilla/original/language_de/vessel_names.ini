DefaultDescription=Als Ersatz für die Garcia-Klasse konzipiert, wurden in den späten 1960er- bis Mitte der 1970er-Jahre fast 50 Schiffe der Knox-Klasse gebaut. Anfangs ohne Luftabwehr ausgestattet, wurden die Schiffe später nachgerüstet, um die Sea-Sparrow-Flugabwehrrakete sowie den Bordhubschrauber SH-2F Seasprite mitführen zu können. \nMitte der 1980er-Jahre wurden viele Schiffe dieses Typs modernisiert: Das SQR-18 TACTAS ersetzte das VDS, das Phalanx CIWS trat an die Stelle des Sea-Sparrow-Startgeräts, und die EloUM-Ausrüstung wurde verbessert, sodass die Fregatten der Knox-Klasse auch in den 1990er-Jahren einsatzfähig und überlebensfähig blieben.
