[usn_bb_iowa]
Type=BB,Schlachtschiff
Default=Iowa-Klasse,Iowa
DefaultDescription=Der Iowa-Klasse gehören Schlachtschiffe der Vereinigten Staaten an. Sie wurden als "schnelle" Schlachtschiffe konzipiert, die auf eine gleichmäßige Mischung aus Geschwindigkeit und Feuerkraft setzen und in der Lage sind, mit der Trägergruppe mitzuhalten. Während ihrer Modernisierung in den 1980er Jahren wurden die Iowas mit vier Phalanx-CIWS-Batterien sowie Harpoon- und Tomahawk-Raketenwerfern ausgestattet.
