Type=DDG,Lenkwaffenzerstörer
Default=Perth-Klass,Perth
DefaultDescription=Fast 30 Zerstörer der Charles-F.-Adams-Klasse wurden Ende der 1950er- sowie Anfang bis Mitte der 1960er-Jahre für die USN, die RAN als Perth-Klasse und die westdeutsche Marine als Lütjens-Klasse gebaut. Die Zerstörer der Adams-Klasse gehörten zu den ersten Schiffen der USN mit Lenkwaffenbewaffnung und waren zunächst mit Tartar ausgerüstet. Mitte der 1970er-Jahre wurde die Adams-Klasse mit neuen Waffen- und Radarsystemen modernisiert, um den Einsatz der Standard Missile zu ermöglichen.
Variant1=Perth D-38,Perth
Variant2=Hobart D-39,Hobart
Variant3=Brisbane D-41,Brisbane

[ran_ffg_adelaide_shorthull]
Type=FFG,Lenkwaffenfregatte
Default=Adelaide-Klasse (Kurzer Rumpf),Adelaide
DefaultDescription=Die Lenkwaffenfregatten der Adelaide-Klasse sind eine Serie von sechs FFGs im Dienste Australiens. Sie sind im Grunde eine Variante der amerikanischen Oliver-Hazard-Perry-Klasse, wobei die ersten vier Schiffe in US-Werften gebaut wurden. Die Fregatten standen ab 1980 bei der Royal Australian Navy im Dienst, um das gescheiterte Leichtzerstörerprogramm der 1970er-Jahre zu ersetzen. Sie entsprechen weitgehend dem Standard ihrer Pendants der US Navy und verfügen dementsprechend über moderne Systeme zur Flugabwehr, Seezielbekämpfung und U-Jagd.\n\nDie ersten drei Schiffe wurden in der Short-Hull-Konfiguration gebaut und verfügen weder über Schleppsonaranlagen noch über die Fähigkeit zum Einsatz von LAMPS-Mk.-III-Hubschraubern. Stattdessen führten sie den unbewaffneten AS-350-Hubschrauber für nicht kampfbezogene Aufgaben mit.
Variant1=Adelaide FFG-1,Adelaide
Variant2=Canberra FFG-2,Canberra
Variant3=Sydney FFG-3,Sydney

[ran_ss_oberon]
Type=SS,Patrouillen-U-Boot
Default=Oberon-Klasse (RAN),Oberon
DefaultDescription=Die Oberon-Klasse war eine Klasse von 27 britischen diesel-elektrischen Jagd- und Patrouillen-U-Booten, die als Weiterentwicklung der Porpoise-Klasse mit stärkerem Rumpfmaterial und modernisierter Ausrüstung entwickelt wurde. Die Royal Australian Navy bestellte sechs U-Boote der Oberon-Klasse in zwei Baulosen mit geringfügigen Abweichungen vom Standard der Royal Navy, insbesondere durch die Verwendung amerikanischer Waffen wie des Mark-37-Torpedos.\n\nDie Royal Australian Navy begann Ende der 1970er-Jahre mit einem Modernisierungsprogramm (SWUP), um Sensorik und Bewaffnung der U-Boote an die erwarteten Bedrohungen der 1980er-Jahre und darüber hinaus anzupassen. Dazu gehörten USN-Mark-48-Torpedos, das passive Flankensonar MicroPUFFS sowie später der UGM-84 Submarine Harpoon. Bis 1985 waren alle sechs Boote entsprechend modernisiert worden.
Variant1=S57 Oxley,Oxley
Variant2=S59 Otway,Otway
Variant3=S60 Onslow,Onslow
Variant4=S61 Orion,Orion
Variant5=S62 Otama,Otama
Variant6=S70 Owens,Owens

[****************************** UK ******************************]
[rn_dd_battle]
Type=DD,Zerstörer
Default=Battle-Klasse,Battle
DefaultDescription=Die Battle-Klasse war eine Klasse von Zerstörern der britischen Royal Navy (RN) und der Royal Australian Navy (RAN), benannt nach Seeschlachten oder anderen Schlachten, die von britischen oder englischen Streitkräften geführt wurden. In drei Gruppen gebaut, wurde die erste Gruppe im Rahmen der Flottenbauschätzungen von 1942 bestellt. Eine modifizierte zweite und dritte Gruppe sowie zwei Schiffe eines erweiterten Designs waren für die Schätzungen von 1943 und 1944 geplant. Die meisten dieser Schiffe wurden jedoch wieder storniert, als klar wurde, dass der Krieg gewonnen war und die Schiffe nicht benötigt würden.
Variant1=PNS Khaibar,Khaibar
Variant2=PNS Badr,Badr
Variant3=Barrosa,Barrosa
Variant4=Matapan,Matapan
Variant5=Corunna,Corunna

[rn_dd_c-class]
Type=DD,Zerstörer
Default=C-Klasse,C-Klasse
DefaultDescription=Die C-Klasse war eine Klasse von 32 Zerstörern der Royal Navy, die von 1943 bis 1945 vom Stapel liefen. Die Klasse wurde in vier Flottillen zu je 8 Schiffen gebaut, den "Ca", "Ch", "Co" und "Cr" Gruppen oder Untergruppen, die als 11., 12., 13. bzw. 14. Notflottille bestellt wurden. Sie wurden im Rahmen des War emergency program basierend auf dem Rumpf und der Maschinerie der Vorkriegs-J-Klasse unter Berücksichtigung aller verfügbaren Fortschritte bei Bewaffnung und Marine-Radar gebaut.
Variant1=PNS Alamgir,Alamgir
Variant2=PNS Shah Jahan,Shah
Variant3=PNS Taimur,Taimur
Variant4=PNS Jahangir,Jahangir
Variant5=Crescent,Crescent

[rn_dd_z-class]
Type=DD,Zerstörer
Default=Z-Klasse,Z-Klasse
DefaultDescription=Die Z-Klasse war eine Klasse von acht Zerstörern der Royal Navy, die zwischen 1943 und 1945 vom Stapel liefen. Sie wurden als Teil des Kriegsnotprogramms gebaut, basierend auf dem Rumpf und den Maschinen der Vorkriegs-J-Klasse, wobei die zu dieser Zeit errungenen technischen Fortschritte in Bewaffnung und Marine-Radar integriert wurden. Nach dem Krieg wurden vier dieser Schiffe an Israel und Ägypten verkauft, während die anderen verschrottet wurden.
Variant1=INS Eilat,Eilat
Variant2=INS Yaffo,Yaffo
Variant3=ENS El Qaher,Qaher
Variant4=ENS El Fateh,Fateh
Variant5=Zest,Zest

[****************************** USA ******************************]
[usn_ae_kilauea]
Type=AE,Flottenhilfsschiff
Default=Kilauea-Klasse,Kilauea
DefaultDescription=Die Munitionsschiffe der Kilauea-Klasse war eine Gruppe von acht Frachtschiffen der United States Navy, die für die Seeversorgung von Kriegsschiffen der Marine entworfen wurden. Die Schiffe wurden zwischen 1968 und 1972 gebaut und waren zunächst in Dienst gestellte Kriegsschiffe, die eine Besatzung aus Marinepersonal hatten. Zu verschiedenen Zeitpunkten zwischen 1980 und 1996 wurden diese Schiffe außer Dienst gestellt und an das Militärseefahrtkommando zur zivilen Nutzung übergeben.
Variant1=Kilauea AE-26,Kilauea
