[wp_bdk_ivan_rogov]
Type=BDK,Landungsschiff
Default=Ivan Rogov-Klasse,Rogov
DefaultDescription=Die Ivan-Rogov-Klasse, sowjetische Bezeichnung "Projekt 1174 Nosorog (Nashorn)", ist eine Klasse von Landungsschiffen (großes Landungsschiff in der sowjetischen Klassifikation), die in der Sowjetunion gebaut wurde. Die Schiffe wurden im Rahmen der Erweiterung der amphibischen Kriegsfähigkeiten der sowjetischen Marine in den 1970er Jahren gebaut. Projekt 1174 verfügt über eine Bugrampe und ein Welldeck; es kann sowohl als LST als auch als LPD operieren. Eine typische Beladung besteht aus einem Bataillon von 520 Soldaten und 25 Panzern. Bis zu 53 Panzer oder 80 gepanzerte Mannschaftstransporter können transportiert werden, wenn das Welldeck ausschließlich zum Transport von Bodenfahrzeugen genutzt wird. Insgesamt können 2.500 Tonnen Fracht transportiert werden.
