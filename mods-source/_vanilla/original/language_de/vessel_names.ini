[usn_lka_charleston]
Type=LKA,Landungsboot
Default=Charleston-Klasse,Charleston
DefaultDescription=Die Charleston-Klasse war die einzige Klasse von Angriffsfrachtschiffen, die von Grund auf als solche gebaut wurden. Alle vorherigen Angriffsfrachtschiffe waren Umbauten von kommerziellen Stückgutschiffen. Die vier Laderäume wurden von 15-Tonnen-Ladebäumen und 70-Tonnen-Stülcken-Kränen bedient, während 40-Tonnen-Ladebäume die Laderäume 1 und 3 versorgten. Das Design beinhaltete Frachtheber, die von Gabelstaplern bedient wurden, um palettierte Ladung wie Treibstoff und Munition schnell an Deck zu bringen, ohne dass die verstauten Landungsboote entfernt werden mussten.
Variant1=Charleston LKA-113,Charleston
Variant2=Durham LKA-114,Durham
Variant3=Mobile LKA-115,Mobile
Variant4=St. Louis LKA-116,St. Louis
Variant5=El Paso LKA-117,El Paso

[usn_lpd_austin]
Type=LPD,Landungsschiff
Default=Austin-Klasse,Austin
DefaultDescription=Die Schiffe der LPD 4 Austin-Klasse kombinieren die Funktionen von drei verschiedenen Schiffsklassen: dem Landungsschiff (LSD), dem Panzerlandungsschiff (LST) und dem Angriffstransportschiff (LKA). Der Amphibientransporter mit Dock wird verwendet, um Marines, ihre Ausrüstung und Versorgungsgüter mit Hilfe der an Bord befindlichen Landungsboote oder Amphibienfahrzeuge sowie Hubschrauber zu transportieren und an Land zu bringen. Diese Schiffe sind als Flaggschiff konfiguriert und bieten umfangreiche Einrichtungen für Kommando, Kontrolle und Kommunikation zur Unterstützung eines Kommandanten der Amphibientaskforce und eines Kommandanten der Landungstruppe. Bei einem amphibischen Angriff würde das Schiff normalerweise als das Hauptkontrollschiff fungieren, das für die Koordinierung der Bootswellen und die Lenkung der Landungsboote zum Strand verantwortlich ist. Eine sekundäre Mission ist die Evakuierung und zivile Katastrophenhilfe. Hunderte Tonnen Hilfsgüter können an Bord transportiert und innerhalb von Minuten nach dem Eintreffen des Schiffes am Einsatzort an die Opfer geliefert werden. Die medizinischen und zahnmedizinischen Einrichtungen der Schiffe können eine begrenzte stationäre Versorgung sowie ambulante Behandlungen für Hunderte von Kranken oder Verletzten gewährleisten.
Variant1=Austin LPD-4,Austin
