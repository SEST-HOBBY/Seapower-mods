[wp_bpk_kanin]
Type=BPK,Zerstörer
Default=Kanin-Klasse,Kanin
DefaultDescription=Die acht Schiffe dieser Klasse wurden ursprünglich als Raketenboote der Krupny-Klasse gebaut und waren mit SS-N-1 Marschflugkörpern bewaffnet. Von 1968 bis 1977 wurden sie übernommen und vollständig als große U-Boot-Abwehrschiffe umgebaut, mit verbesserten Sonaranlagen und ASW-Bewaffnung und ausgestattet mit übrig gebliebenen SA-N-1-Installationen, die ursprünglich für das Kresta-I-Programm vorgesehen waren. Obwohl sie über eine Hubschrauberlandeplattform am Heck verfügen, verfügen sie nicht über Einrichtungen zum effektiven Betrieb von Hubschraubern. Alles in allem sind sie zweitklassige Schiffe in einem Mix aus hochwertigen und weniger hochwertigen Schiffen.
