Variant9=Daniel Webster SSBN-626,Webster

[usn_ssbn_james_madison]
Type=SSBN,Strategisches U-Boot
Default=James Madison-Klasse,Madison
DefaultDescription=Die James-Madison-Klasse stellte eine evolutionäre Weiterentwicklung der vorher entwickelten Lafayette-Klasse dar. In den meisten Aspekten identisch, wurden sie von Anfang an für den Einsatz der Polaris A3-Interkontinentalrakete konzipiert. In den frühen 1970er-Jahren erfolgte eine Umrüstung auf die größere Poseidon C-3-Rakete. Später wurden sie erneut modernisiert, um die Trident I-Rakete tragen zu können. Diese Klasse unterscheidet sich von den Franklins durch das Fehlen von Endplatten an den Hecksteuerflächen sowie durch eine höhere Position der Steuerflächen am Turm.
