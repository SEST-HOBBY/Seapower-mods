Stop_Light=Stop Light ESM|Das Nakat-System (NATO-Codename: Stop Light) ist ein älteres sowjetisches ESM-System, das auf der ersten Generation sowjetischer U-Boote eingesetzt wurde. Obwohl es nur eine geringe Genauigkeit und Empfindlichkeit besitzt, kann es ein relativ breites Spektrum an Radarfrequenzen erfassen.
Watch_Dog=Watch Dog ESM|Das Nakat-M-System (NATO-Codename: Stop Light) ist ein älteres sowjetisches ESM-System, das auf der ersten Generation sowjetischer U-Boote eingesetzt wurde. Obwohl es nur eine geringe Genauigkeit und Empfindlichkeit besitzt, kann es ein relativ breites Spektrum an Radarfrequenzen erfassen.
Zaliv=Bell Nest ESM|Das MRP-10/11/12/13/14 Zaliv (NATO-Codename: Bell Nest) ist ein sowjetisches ELINT- und Bedrohungswarnsystem aus den 1960er-Jahren, das auf vielen Schiffen eingesetzt wurde und zu einer Familie von EloUM- und EloGM-Systemen verschiedenster Ausführungen gehört.
Brick_Pulp=Brick Pulp ESM|Das MRP-21 Zaliv-P (NATO-Codename: Brick Pulp) ist ein sowjetisches ELINT-System, das auf U-Booten der zweiten Generation eingesetzt wird. Es verfügt über verbesserte Signalverarbeitung für größere Reichweiten und eine genauere Peilung sowie über eine schnellere Kontaktidentifikation als frühere ESM-Systemen.
Bald_Head=Bald Head ELINT|Das MRP-23 (NATO-Codename: Bald Head) ist ein sowjetisches ELINT-System, das auf nuklear angetriebenen U-Booten der Alfa- und Oscar-Klasse eingesetzt wird. Es handelt sich um ein einzigartiges kombiniertes Radar- und ESM-System mit guter Genauigkeit und sehr hoher Empfindlichkeit, wodurch auch Raketenangriffe über den Horizont hinaus ermöglicht werden.
Squid_Head=Squid Head ELINT|Das MRP-25 (NATO-Codename: Squid Head) ist ein sowjetisches ELINT-System, das auf U-Booten der Kilo- und Tango-Klasse eingesetzt wird. Es ist für die Bedrohungswarnung optimiert und ist eine deutlich leichtere Variante des Bald-Head ELINT-Systems.
