SSQ-41_Sonar=Sonoboje
SSQ-47_Sonar=Sonoboje
SSQ-53_Sonar=DIFAR Sonoboje|Die AN/SSQ-53 DIFAR ist eine passive, richtungsgebundene LOFAR-Sonoboje, die zur ersten Erkennung von getauchten U-Booten eingesetzt wird.
SSQ-62_Sonar=DICASS Sonoboje|Die AN/SSQ-62 DICASS ist eine aktive Sonoboje, die zur genauen Lokalisierung eines zuvor mit den passiven Sonobojen des Typs "AN/SSQ-53" erkannten U-Bootes verwendet wird.
SSQ-77_Sonar=Sonoboje
#---------------------------------------- ESM ----------------------------------------
US_Aircraft_ESM=EloUM|"Elektronische Unterstützungsmaßnahmen" (EloUM, oder auch ESM) ist die Bezeichnung für Systeme, welche elektromagnetischer Ausstrahlungen wie Radarsignale abfangen und somit eine passive Ortung ermöglichen, ohne jedoch die eigene Position durch aktives Radar preiszugeben.

WLR-1=AN/WLR-1C EloUM|Das AN/WLR-1C ist ein Flugkörperwarnsystem, welches die Suchköpfe feindlicher Raketen sowie Feuerleitradare erkennt.
AN/WLR-6=AN/WLR-6 EloUM|Das AN/WLR-6 ESM-System ist ein verbessertes Funkwarn- und Abfangsystem für ältere U-Boote der Sturgeon-Klasse. Es nutzt den großen Turm sowie digitale Elektronik, um Reichweite und Genauigkeit gegenüber dem älteren Funkwarnsystem WLR-1 deutlich zu erhöhen.
AN/WLQ-4=AN/WLQ-4 ELINT|Das AN/WLQ-4 „Sea Nymph“ ist ein fortschrittliches ELINT- und SIGINT-Sensorsystem für modernisierte U-Boote der Sturgeon-Klasse und bietet eine sehr hohe Genauigkeit und kann zur Aufklärung über den Horizont hinaus verwendet werden.
AN/WLR-8=AN/WLR-8 ELINT|Das AN/WLR-8 ist ein kompaktes ELINT-System, das auf SSNs der Los-Angeles-Klasse eingesetzt wird und der direkte Nachfolger des AN/WLR-1 ESM-Systems ist. Dieses ESM-System wurde vor allem kompakter ausgelegt als das größere WLQ-4, sodass es in den kleinen Mast der U-Boote der Los-Angeles-Klasse integriert werden konnte.

AN/SLQ-32_RWR=AN/SLQ-32(V)1 EloUM|Das AN/SLQ-32(v)1 ist ein Flugkörperwarnsystem, welches die Suchköpfe feindlicher Raketen sowie Feuerleitradare erkennt.
AN/SLQ-32_ESM=AN/SLQ-32(V)2 EloUM|Die Flugkörperwarnsysteme AN/SLQ-32(v)2 und (v)3 verfügen über sämtliche Funktionen des (v)1, können jedoch auch Überwachungsradarsysteme und Frühwarnradare erfassen.

#---------------------------------------- ECM ----------------------------------------
AN/ULQ-6=EloGM-Störsender|Der Störsender AN/ULQ-6 war eine der ersten elektronischen Gegenmaßnahmen (ECM, Deutsch: EloGM) auf Schiffen. Dieses System wird verwendet, um feindliche Radarsysteme zu stören und ihre Verfolgungsleistung zu verringern.
AN/SLQ-17=EloGM-Störsender|Das AN/SLQ-17 ist ein schiffsgestütztes ECM-System, das auf Flugzeugträgern der US-Marine eingesetzt wird. Es dient dazu, feindliche Radarsysteme durch die Erzeugung falscher Ziele zu täuschen.
AN/SLQ-32=EloGM-Störsender|Das AN/SLQ-32(v)3 ist derzeit das wichtigste System zur elektronischen Kampfführung (EloKa), das von Schiffen der US Navy eingesetzt wird. Dieses System wird verwendet, um feindliche Radarsysteme zu stören und ihre Verfolgungsleistung zu verringern.
B-52D_OECM=Offensiver Störsender|Das B-52D Phase V ECM-System (Elektronische Gegenmaßnahmen) verfügt über umfassende offensive Störmöglichkeiten. Es ist mit zwei AN/ALT-16-Breitbandstörsystemen, zwei AN/ALT-32H-Hochfrequenz-Störsystemen und einem AN/ALT-32L-Niederfrequenz-Störsystem ausgestattet.
B-52D_DECM=EloGM-Störsender|Das B-52D Phase V ECM-System umfasst mindestens vier AN/ALT-6B- oder AN/ALT-22-Dauerstrich-Störsender, die speziell zur Beeinträchtigung feindlicher Feuerleitradare eingesetzt werden.
B-52G_OECM=Offensiver Störsender|Das B-52G Phase VI ECM-System bietet umfassende offensive Störmöglichkeiten und ist mit einem AN/ALT-28-Barrage-Störsystem sowie AN/ALT-32H- und AN/ALT-32L-Hoch- und -Niederband-Störsendern ausgestattet.
B-52G_DECM=EloGM-Störsender|Der B-52D verfügt über ein AN/ALQ-117 als aktive Gegenmaßnahme, sowie einen AN/ALQ-122 Fehlzielgenerator, um feindliche Feuerleitradare zu überlisten.
AN/ALT-28=AN/ALT-28
AN/ALQ-99=Offensiver Störsender|Das AN/ALQ-99 ist ein luftgestütztes elektronisches Kampfführungssystem, das zunächst in der EA-6B, später von der  EA-18G Growler genutzt wird. Die ALQ-99E-Version des Systems wurde auf dem EF-111A Raven-Flugzeug als Begleit- oder Standoff-Störer eingesetzt.
AN/ALQ-119=AN/ALQ-119

