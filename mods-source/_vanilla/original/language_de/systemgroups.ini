MGK-1000=MGK-1000 "Okean"|MG-1000 "Okean" (NATO-Codename: Squid Arm) war das erste integrierte sowjetische mittelfrequente Sonarsystem. Es kombiniert ein zylindrisches passives Array mit einem hydraulisch gesteuerten aktiven Planar-Array, das in der Lage ist, einen Bodenreflexionsmodus zu nutzen.
MGK-400=MGK-400 "Rubikon"|MGK-400 "Rubikon" (NATO-Codename: Shark Gill) ist ein sowjetisches integriertes mittelfrequentes Sonarsystem, das ein passives/aktives zylindrisches Array nutzt. Es umfasst unter anderem hochfrequente Minenjagdsonare.
MGK-500=MGK-500 "Skat"|MGK-500 "Skat" (NATO-Codename: Shark Gill/Shark Tail) ist ein sowjetisches integriertes niederfrequentes Sonarsystem, das ein passives/aktives zylindrisches Array sowie ein geschlepptes Array verwendet. Es umfasst unter anderem hochfrequente Minenjagdsonare.
MGK-540=MGK-540 "Skat-3"|MGK-540 "Skat" (NATO-Codename: Shark Gill/Shark Tail) ist ein sowjetisches integriertes niederfrequentes Sonarsystem, das ein passives/aktives zylindrisches Array sowie ein geschlepptes Array verwendet. Es umfasst unter anderem hochfrequente Minenjagdsonare und gilt als verbesserte Version des MGK-500.

