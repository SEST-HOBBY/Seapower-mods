Koltso=Rum Tub ESM|Das MP-404 (NATO-Codename: Rum Tub) ist ein passives Überhorizont-Feuerleitsystem für die Raketen SS-N-12 Sandbox und SS-N-19 Shipwreck, das auf Schiffen der Kirov-, Kiev- und Slava-Klasse verwendet wird.
Band_Stand_ESM=Band Stand ESM|"Monolit" (NATO-Codename: Band Stand) ist ein Überhorizontradar zur Feuerleitung des SS-N-9-Sunburn-Raketensystems, das auf den Schiffsklassen Sovremenny und Nanuchka eingesetzt wird.
Plank_Shave_ESM=Plank Shave ESM|Das 3Ts-25 „Garpun“ (NATO-Meldebezeichnung: Plank Shave) ist das Such- und Feuerleitradar für den mobilen Schiffsabwehr-Raketenkomplex „Rubezh“, bewaffnet mit SS-N-2 Styx (P-15M „Termit“)-Flugkörpern.

