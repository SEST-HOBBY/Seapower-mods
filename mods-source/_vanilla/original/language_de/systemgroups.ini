ActiveIntercept_Early=Active Intercept Receiver|Ein akustisches Abfangsystem (Active Intercept) entspricht im Prinzip einem Radarwarnempfänger für aktives Sonar. Ein Array aus Sonarsensoren erkennt ausgesendete aktive Sonarsignale und bestimmt deren Peilung sowie Herkunft, sei es von Sonaranlagen auf Schiffen oder U-Booten oder von aktiv suchenden Torpedos. Diese Systeme decken einen 360-Grad-Bereich um das U-Boot ab und können auch aktive Aussendungen in den „Baffles“ erfassen, in denen ein passives Sonar nichts hören kann.
ActiveIntercept_Late=Active Intercept Receiver|Ein akustisches Abfangsystem (Active Intercept) entspricht im Prinzip einem Radarwarnempfänger für aktives Sonar. Ein Array aus Sonarsensoren erkennt ausgesendete aktive Sonarsignale und bestimmt deren Peilung sowie Herkunft, sei es von Sonaranlagen auf Schiffen oder U-Booten oder von aktiv suchenden Torpedos. Diese Systeme decken einen 360-Grad-Bereich um das U-Boot ab und können auch aktive Aussendungen in den „Baffles“ erfassen, in denen ein passives Sonar nichts hören kann.
