MK33_Oslo=MK 33 Geschütz|3"/50 caliber Mk 33 Geschütz|Das Mk 33 Geschütz besteht aus einem Paar schnellfeuernder Mk 22 3"/50-Kaliber-Geschütze in einer offenen oder geschlossenen Zwillingslafette. Diese Geschütze haben deutlich mehr Durchschlagskraft als die Vierläufigen 40-mm-Geschütze, die sie ersetzt haben.
