SJD-5=SJD-5|Dies ist eine weiterentwickelte chinesische Version des sowjetischen Tamir-11, eines ausschließlich aktiv arbeitenden Suchstrahl-Sonars. Dabei wurde die Röhrentechnologie durch Transistortechnik ersetzt, was zu einer weiteren Reichweitensteigerung führt.

