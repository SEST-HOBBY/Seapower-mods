Slim_Net=Slim Net|Das "Fut-N" (NATO-Codename: Slim Net) ist ein hochauflösendes Luft- und Seesuchradar der Marine, welches das Hair Net-Radar auf Kreuzern und Zerstörern ablöste. Es wurde 1957 in Dienst gestellt. Das Radar arbeitet im E-Band und wird im sowjetischen Sprachgebrauch als Fut-N bezeichnet.
Top_Through=Top Trough|Das MR-510 "Kil'-U" (NATO-Codename: Top Trough) ist ein hochauflösendes Langstreckenluftsuchradar. Die maximale Reichweite beträgt über 300 km.
Head_Net_A=Head Net A|Das MR-300 "Angara" (NATO-Codename: Head Net A) MR-300 „Angara“ (NATO-Bezeichnung: Head Net A) ist ein zweidimensionales Luft- und Seeraumaufklärungs- sowie Zielerfassungsradar im L-Band. Es verwendet eine einzelne Antenne und verfügt über eine erhebliche Reichweite, ist jedoch nicht sehr effektiv gegen niedrig fliegende Ziele.
