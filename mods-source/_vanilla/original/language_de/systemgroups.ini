CXAM=CXAM|Das CXAM war der Prototyp der US Navy für weitreichende Luftraumüberwachungsradare. Dieses System wurde kurz vor Beginn des Zweiten Weltkriegs auf größeren Kampfeinheiten installiert. Es handelte sich um eine große, 18 × 16 Fuß messende Antennenmatte mit Höhenrichtmöglichkeit, deren Strahl jedoch zu breit war, um eine Höhenbestimmung zu ermöglichen. Das CXAM bildete die Grundlage für die im Krieg eingesetzten Luftraumüberwachungsradare, die fast alle auf diesem Grundentwurf basierten und schrittweise weiterentwickelt wurden.
CXAM-1=CXAM-1|Das CXAM-1 war eine schrittweise Weiterentwicklung des CXAM, von dem insgesamt vierzehn Geräte ausgeliefert und auf Schlachtschiffen, Kreuzern und Flugzeugträgern installiert wurden. Die Antenne behielt ihr Matratzen-ähnliches Erscheinungsbild, jedoch entfiel die Höhenrichtmöglichkeit. Die Genauigkeit wurde auf 180m verbessert, und das System blieb bis 1943 auf einigen Schiffen im Einsatz. Auf größeren Kampfeinheiten wurde es durch die SK- bzw. SK-2-Anlage ersetzt.
SA=SA|Die SA-Baureihe war dazu vorgesehen, die Funktionalität und Leistungsfähigkeit des CXAM mit einer kleineren Antenne nachzubilden, um sie auf Geleitschiffen und Hilfseinheiten einsetzen zu können. Die Serie erwies sich als relativ erfolgreich und wurde zum Standard-Luftraumüberwachungsradar für Geleitzerstörer und Fregatten. Teilweise wurde es auch auf Zerstörern und leichten Kreuzern installiert. Außerdem erhielten Schiffe der Freien Französischen Streitkräfte, die gegen Kriegsende in US-Werften umgerüstet wurden, diesen Radartyp.
SC-1=SC-1|Wie das SA war auch das SC ein Versuch, die Leistungsfähigkeit des CXAM mit einer kleineren Antenne auf kleinere Schiffe zu übertragen. Die verkleinerte Antenne führte jedoch zu einer geringeren effektiven Reichweite. Im Januar 1942 wurde daher das SC-1 eingeführt, das über die doppelte Leistung und Reichweite verfügte; alle bestehenden SC-Anlagen wurden bald entsprechend umgerüstet. Dieses System wurde zu Beginn des Krieges auf Zerstörern und Hilfsschiffen eingesetzt, bevor es durch das SC-2 ersetzt wurde, sobald dieses verfügbar war.
SC-2=SC-2|Das SC-2 stellte eine Weiterentwicklung des SC-1 dar und verfügte über eine deutlich vergrößerte Antenne. Diese Anlage war für die Nutzung der BG- und BL-IFF-Systeme vorbereitet und wurde bis zum Ende des Krieges zum primären Radar für Zerstörer. Leicht verbesserte Varianten des SC-2 (SC-3, SC-4 und SC-5) blieben auf Zerstörern noch bis 1963 im Einsatz.
SK=SK|Das SK war das Standard-Luftraumüberwachungsradar für große Schiffe während des Krieges. Im Wesentlichen handelte es sich um ein SC-2 mit einer Antenne in CXAM-Größe. Es war ein zweidimensionales Radarsystem, das lediglich Azimut- und Schrägentfernungsmessungen lieferte. Für die Höhenbestimmung waren zusätzliche Sensoren erforderlich.
SK-2=SK-2|Dieses System war eine schrittweise Weiterentwicklung des SK und verfügte über eine 15-Meter-Parabolantenne, die die Nebenkeulen reduzieren sollte. Gegen Ende des Krieges wurden sowohl SK als auch SK-2 wegen ihrer unzureichenden Fähigkeit kritisiert, hochfliegende Flugzeuge aufgrund des geringen Strahlungswinkels zu erfassen. Es wurden 75 Anlagen produziert, die auf größeren Kampfeinheiten installiert wurden, sobald diese in Dienst gestellt oder in Werften umgerüstet wurden.
SM=SM|Das SM war das erste US-Radar, das einen konisch abgetasteten „Bleistiftstrahl“ nutzte, um die Höhe eines Luftziels zu bestimmen – eine Fähigkeit, die früheren Luftraumüberwachungsradaren fehlte. Mit einem Gewicht von 18.000 Pfund (davon 4.000 Pfund allein für die Antenne) war das SM sehr schwer und konnte nur auf großen Flugzeugträgern installiert werden. Später wurden mit SM-1 und SP leichtere Varianten für kleinere Schiffe entwickelt.
SP=SP|Das SP war der leichtere Nachfolger des SM-Höhenmessradars. Je nach Schiffstyp konnte das System mit zwei unterschiedlichen Antennen ausgestattet werden, wobei eine kleinere Antenne für Zerstörer und leichte Träger vorgesehen war. Das SP wurde unter anderem auf den Radarvorpostenzerstörern der Gearing-Klasse (DDRs) eingesetzt, die vor Okinawa operierten. Insgesamt wurden 300 Anlagen gefertigt. Gegen Kriegsende war es üblich, dass Großkampfschiffe ein SP am Hauptmast führten, während am Fockmast ein SK oder SK-2 installiert war.
SR=SR|Das SR war das erste vollständig neu entwickelte Luftraumüberwachungsradar seit dem CXAM und vereinte zahlreiche Neuerungen, die zuvor bei anderen Radarsystemen erprobt worden waren. Die Antenne war ungefähr so groß wie die des SC-2, verfügte jedoch über mehr als die doppelte Leistung. Gegen Kriegsende wurde das SR auf Zerstörern installiert, auf größeren Kampfeinheiten diente es als zusätzliches Luftraumüberwachungsradar. Es blieb bis 1961 im Einsatz.
SR-2=SR-2|Das SR-2 war ein 50-cm-2D-Luftraumüberwachungsradar, das ursprünglich für Geleitzerstörer vorgesehen war, sich nach Produktionsbeginn jedoch als viel zu groß erwies. Die Vorserienmodelle wurden auf den großen Trägern der Midway-Klasse sowie auf mehreren leichten Kreuzern und auf vier U-Boot-Radarvorposten (SSR) installiert. Aufgrund seiner unzureichenden Leistungsfähigkeit wurde dieses System durch das AN/SPS-6 ersetzt.
SR-3=SR-3|SR-3 und SR-6 wurden als Ersatz für SK und SC in der gesamten Flotte entwickelt und nutzten das L-Band, um eine bessere Leistung mit weniger Signalabschwächung zu erreichen. In der Praxis erwiesen sich beide Systeme jedoch als unzureichend, was auf die gewählten Antennen zurückgeführt wurde, die in einem Nachkriegsbericht als „unzureichend“ beschrieben wurden. Beim SR-6 handelte es sich um eine leichtere Version des SR-3 mit kleinerer Antenne.
SR-6=SR-6|SR-3 und SR-6 wurden als Ersatz für SK und SC in der gesamten Flotte entwickelt und nutzten das L-Band, um eine bessere Leistung mit weniger Signalabschwächung zu erreichen. In der Praxis erwiesen sich beide Systeme jedoch als unzureichend, was auf die gewählten Antennen zurückgeführt wurde, die in einem Nachkriegsbericht als „unzureichend“ beschrieben wurden. Beim SR-6 handelte es sich um eine leichtere Version des SR-3 mit kleinerer Antenne.
SPS-6=SPS-6|Das AN/SPS-6 ist ein zweidimensionales Radar der ersten Generation, das von der US Navy als Radar zur Luftraumüberwachung nach dem Zweiten Weltkrieg eingesetzt wurde und weit verbreitet an Verbündete exportiert wurde. Da das AN/SPS-6 ein 2D-Radar ist, liefert es nur Azimut- und Informationen zur Schrägdistanz. Um zusätzlich auch die Höhe bestimmen zu können, müssen zusätzliche Sensoren verwendet werden.
SPS-12=SPS-12|Der AN/SPS-12 war von den 1950er- bis in die 1980er-Jahre im Einsatz. Es handelt sich um ein zweidimensionales Luft- und Oberflächenüberwachungsradar mit mittlerer Reichweite.
SPS-29=SPS-29|Das AN/SPS-29 ist ein zweidimensionales Radar, das von der US Navy als Frühwarnradar während des Kalten Krieges auf Kriegsschiffen eingesetzt worden ist. Als 2D-Radar liefert es nur Azimut- und Informationen zur Schrägdistanz. Um zusätzlich auch die Höhe bestimmen zu können, müssen zusätzliche Sensoren verwendet werden.
SPS-30=SPS-30|Eine modernisierte Version des AN/SPS-8, kombiniert mit einem leistungsstärkeren Sender ergibt das AN/SPS-30, ein auf Schiffen eingesetztes, integriertes S-Band-Radarsystem mit Höhenmessung, welches zur Erkennung und Überwachung von Flugzeugen verwendet wird.
UPA-43=UPA-43|Das AN/UPA-43 ist ein Identifizierungsgerät zur Freund-Feind-Erkennung (IFF) der US Navy. Spätere Radarsysteme wie das AN/SPS-48 verfügen über einen integrierten IFF-Interrogator, wodurch eine separate Antenne überflüssig wird.
SPS-32=SPS-32|Das AN/SPS-32 ist Teil des berühmten SCANFAR-Systems, das auf der USS Enterprise und der USS Long Beach eingesetzt wurde. Es bildet den horizontal ausgerichteten Teil des Antennensystems und wird hauptsächlich zur Luftraumüberwachung genutzt.
SPS-33=SPS-33|Das AN/SPS-33 ist Teil des berühmten SCANFAR-Systems, das auf der USS Enterprise und der USS Long Beach eingesetzt wurde. Es bildet den vertikal ausgerichteten Teil des Antennensystems und wird hauptsächlich zur Zielverfolgung eingesetzt.
SPS-37=SPS-37|Das AN/SPS-37 ist ein zweidimensionales Frühwarnradar der US Navy aus der frühen Zeit des Kalten Krieges und eine verbesserte Weiterentwicklung des AN/SPS-29. Als 2D-Radar liefert es lediglich Informationen zu Seitenwinkel und Schrägentfernung, während zur Höhenbestimmung zusätzliche Sensoren erforderlich sind.
SPS-39=SPS-39|Das AN/SPS-39 ist ein 3D-Langstrecken-Luftraumüberwachungsradarsystem, das zur Bestimmung von Richtung, Entfernung und Höhe verwendet wird. Ähnlich wie das größere SPS-48 wird es mechanisch für den Azimut gedreht, während die Höhenmessung elektronisch erfolgt. Dieses 3D-Radar fungiert als Schnittstelle zwischen den 2D-Frühwarnradaren und den Feuerleitradaren, die zur Kampfführung eingesetzt werden.
SPS-40=SPS-40|Das AN/SPS-40 ist ein zweidimensionales Langstrecken-Luftraumüberwachungsradar der United States Navy, das in der Lage ist, die Lage und Entfernung von Kontakten zu liefern. Als 2D-Radar liefert es nur Azimut- und Informationen zur Schrägdistanz. Um zusätzlich auch die Höhe bestimmen zu können, müssen zusätzliche Sensoren verwendet werden.
SPS-43=SPS-43|Das AN/SPS-43 ist ein Langstrecken-Luftraumüberwachungsradarsystem der United States Navy, das im März 1961 eingeführt wurde. Es arbeitet im VHF-Band und kann zwischen 20 verschiedenen Frequenzen wechseln, um Störversuche zu vereiteln. Als 2D-Radar liefert es nur Azimut- und Informationen zur Schrägdistanz.
SPS-48=SPS-48|Das AN/SPS-48 ist ein 3D-Langstrecken-Luftraumüberwachungsradar. Das Azimut des Ziels wird durch mechanisches Scannen erreicht, indem die gesamte Antenne auf ihrem Fuß rotiert, während die Elevation durch elektrisches Scannen bestimmt wird. Das Radar liefert Kontaktentfernung, -richtung und -höhe an die Kommando- und Kontrollsysteme auf den Schiffen, an denen es angebracht ist.
SPS-48E=SPS-48E|Das AN/SPS-48E ist ein weitreichendes 3D-Luftraumüberwachungsradar. Die Zielpeilung wird durch mechanisches Schwenken der gesamten Antenne auf ihrem Sockel bestimmt, während die Höheninformation durch elektronisches Abtasten ermittelt wird. Das 3D-Radar fungiert als Bindeglied zwischen den 2D-Frühwarnradaren und den Feuerleitradaren, die zur Bekämpfung von Zielen eingesetzt werden.\nDiese Version ist das im Rahmen des NTU-Programms modernisierte SPS-48 mit neuer Antenne sowie deutlich verbesserten Fähigkeiten zur Erfassung von Zielen in geringer Höhe. Zudem verfügt es über eine nochmals verbesserte effektive Reichweite.
SPS-49=SPS-49|Das AN/SPS-49 ist ein zweidimensionales Langstrecken-Luftraumüberwachungsradar der US Navy, das Lage und Position des Kontakts liefern kann. Es wird primär von zahlreichen Schiffen in der US-Flotte sowie in Spanien, Polen und Taiwan auf Fregatten der Oliver Hazard Perry-Klasse, in Kanada auf Fregatten der Halifax-Klasse und in Neuseeland auf Fregatten der Anzac-Klasse genutzt.
SPS-49V5=SPS-49(V)5|Das AN/SPS-49(V)5 ist ein weitreichendes zweidimensionales Luftraumüberwachungsradar, sowie der Nachfolger des SPS-40. Es dient auf vielen Schiffen der US Navy und verbündeter Marinen als primäres Radar zur Luftraumaufklärung. Auf älteren Schiffen ersetzte es im Rahmen des NTU-Modernisierungsprogramms das SPS-40.\nDieses Modell ist eine weiterentwickelte Version mit höherer Sendeleistung, die aus dem NTU-Programm hervorging und auch auf anderen Schiffen nachgerüstet wurde. Es verfügt über eine geringere Mindesthöhe für die Zielerfassung sowie über verbesserte ECCM-Eigenschaften.
SPS-52=SPS-52|Das AN/SPS-52 ist ein dreidimensionales Langstrecken- Luftraumüberwachungsradar der US Navy, das Lage, Position und Höhe eines Kontakts liefern kann. Es wurde auf Fregatten der Baleares- und Brooke-Klasse, Zerstörern der Charles F. Adams- und Hatakaze-Klasse, amphibischen Angriffsschiffen der Tarawa- und Wasp-Klasse, Kreuzern der Galveston- und Providence-Klasse sowie anderen Schiffen verwendet. Die Antenne wird mechanisch für die Bestimmung des Azimut gedreht, für die Bestimmung der Elevation scannt es jedoch elektronisch.
SPN-43=SPN-43|Das AN/SPN-43 ist ein zweidimensionales S-Band-Flugverkehrskontrollradar, das auf Flugzeugträgern und amphibischen Schiffen eingesetzt wird. Es liefert Luftnavigationsdaten (Azimut- und Distanzinformationen) zur Flugverkehrsregelung und Identifizierung von Luftfahrzeugen im Bereich von 50 Meilen bis zu einer Minimaldistanz von 250 Yards bei Höhen vom Radarhorizont bis zu 30.000 Fuß.
SPY-1A=SPY-1A|Das AN/SPY-1 ist ein 3D-Radar der United States Navy. Das Array wird passiv elektronisch abgetastet und ist eine Schlüsselkomponente des Aegis Combat System. Das System arbeitet computergesteuert und verwendet vier ergänzende Antennen, um eine 360-Grad-Abdeckung zu erreichen. Das AN/SPY-1 wurde erstmals 1973 auf der USS Norton Sound installiert und trat 1983 als SPY-1A auf der USS Ticonderoga in den aktiven Dienst ein. Als 3D-Radar liefert das AN/SPY-1 Reichweite, Azimut und Elevation eines Ziels und lokalisiert es im dreidimensionalen Raum.
MK-23_TAS=MK-23 TAS|Das Mk. 23 TAS (Target Acquisition System) ist ein zweidimensionales L-Band-Radar mittlerer Reichweite mit Freund-Feind-Erkennung. Es handelt sich um ein kleines, schnell rotierendes Radar zur Erfassung von Seezielflugkörpern oder Angriffen mit hohem Einfallswinkel.

#---Surface only---
SPS-10=SPS-10|AN/SPS-10 ist ein zweidimensionales Seesuchradar. Es wurde von der US Navy nach dem Zweiten Weltkrieg eingesetzt und war während des Kalten Krieges auf Kriegsschiffen installiert.
SPS-55=SPS-55|Das AN/SPS-55 ist ein feststehendes Seesuch- und Navigationsradar, was für die US Navy im Jahre 1971 entwickelt worden ist. Ursprünglich war es lediglich für den Einsatz auf einer Klasse von Schiffen namens Patrol Frigates vorgesehen, es wurde aber auch auf zahlreichen Kreuzern, Zerstörern und Minensuchbooten installiert.
SPS-67=SPS-67|Der AN/SPS-67 ist ein Kurzstrecken-Seesuchradar, das häufig auf US-Schiffen zur Erkennung und Verfolgung von Oberflächenkontakten und sehr niedrig fliegenden Zielen eingesetzt wird.

#---Fire Control---
#SAM
MK-115=MK-115|Das Mk-115 Feuerleitradar ist Teil des Sea Sparrow Point-Defense-Raketensystems und liefert die Zielbeleuchtung für das halbaktive radargelenkte Raketensystem.
MK-95=MK-95|Das Mk-95 Feuerleitradar ist Teil des verbesserten NATO Sea Sparrow Point-Defense-Raketensystems und liefert die Zielbeleuchtung für das halbaktive radargelenkte Raketensystem.
SPW-2=SPW-2|Das AN/SPW-2 ist ein Feuerleitradar, welches für den Einsatz mit der RIM-8 Talos-Rakete entwickelt worden ist. Es war Teil des Mk 77 Talos FCS. Dieses Radar wurde erstmals auf den Kreuzern der Galveston-Klasse eingesetzt, die Umbauten der Kreuzer der Cleveland-Klasse waren. Die erste Installation erfolgte im Jahre 1958.
SPG-49=SPG-49|Das AN/SPG-49 ist ein C-Band-Feuerleitradar für die Luftabwehrsysteme RIM-8 Talos der US-Marine an Bord von Schiffen. Es verwendete ein Drei-Achsen-System - Azimut, Elevation und Quertraverse -welches das Scannen und Verfolgen im gesamten Halbkreis ermöglichte.
SPG-51=SPG-51|Das AN/SPG-51 ist ein C-Band-Geschütz- und Raketen-Feuerleitradar. Es enthält eine X-Band-Dauerzielbeleuchtung für die RIM-24 Tartar- und RIM-66 Standard-Raketen.
SPG-55=SPG-55|Das AN/SPG-55 ist ein Verfolgungs- und Beleuchtungsradar für die Terrier-, Standard SM-1- und Standard SM-2-Flugabwehrraketen-Systeme. Es wird für die Zielverfolgung und die Lenkung der Raketen auf zahlreichen Schiffen der US-amerikanischen Marinen und einigen Verbündeten eingesetzt. Das AN/SPG-55 ist Teil des Mk-76-Raketen-Feuerleitsystems.
SPG-60=SPG-60|Das AN/SPG-60 oder Separate Target Illumination Radar (STIR) arbeitet im X-Band-Monopuls- und Doppler-Verfahren und dient der Erfassung, Verfolgung und Beleuchtung von Zielen für die RIM-24 Tartar- und RIM-66 Standard-Raketen. Es ist Teil des MK-86-Geschützfeuerleitsystems.
SPG-62=SPG-62|Das AN/SPG-62 ist ein X-Band-Feuerleitradar. Es ist ein Bestandteil des MK 99 Fire Control Systems der US Navy und wird als Zielbeleuchtungsradar für die RIM-156 Standard SM-2-Rakete verwendet. Bis zu vier AN/SPG-62 werden vom AN/SPY-1 gesteuert.
SYR-1=SYR-1|Das SYR-1 ist ein US-amerikanisches Datenlink-Antennensystem zum Empfang von Downlink-Steuerkommandos von SM-2-Flugkörpern und wird primär auf Kampfschiffen mit SM-2ER sowie auf später NTU-modernisierten Einheiten mit SM-2MR und SM-2ER eingesetzt. Die Leistungsfähigkeit ist gegenüber dem AEGIS-System eingeschränkt, ermöglicht jedoch die gleichzeitige Führung deutlich mehr Flugkörper im Zielanflug als bei einem mit SM-1 ausgerüsteten Kriegsschiff.
SYR-1_NTU=SYR-1 (NTU)|Die SYR-1 ist eine amerikanische Datenlink-Antennenanlage zum Empfang von Downlink-Steuerkommandos von SM-2-Flugkörpern. Sie wurde Ende der 1980er und Anfang der 1990er Jahre auf Schiffen mit New Threat Upgrade eingesetzt. NTU-Schiffe sind hinsichtlich ihrer Feuerleitfähigkeit in etwa mit frühen AEGIS-Schiffen vergleichbar.
SYS-1=SYS-1
#Guns
MK37_GFCS_MK4=Mark 37 GFCS (Radar Mark 4 "FD")|Das Mark 37 Gun Fire Control System (GFCS) steuert das 5"-Mehzweckgeschütz im Kaliber 38. Der Richtstand ist mit dem Mark-4 „FD“ Entfernungsmessradar bestückt; eine hocheffektive Kombination, die die Bekämpfung von Luft- und Seezielen ermöglicht.
MK37_GFCS_MK12=Mark 37 GFCS (Radar Mark 12/22)|Das Mark 37 Gun Fire Control System (GFCS) steuert das 5"-Mehzweckgeschütz im Kaliber 38. Der Richtstand ist mit dem Entfernungsmessradar Mark 12 sowie dem Höhenfinder Mark 22 ausgerüstet. Diese Kombination aus Richtstand und Radargeräten rüstete bis Mitte 1944 nahezu alle Neubauten und umgerüsteten Kriegsschiffe aus.
MK37_GFCS_MK28=Mark 37 GFCS (Radar Mark 28)|Das Mark 37 Gun Fire Control System (GFCS) steuert das 5"-Mehzweckgeschütz im Kaliber 38. Der Richtstand ist mit der kleinen Parabolantenne des Mark-28-Entfernungsmessradars bestückt, eine gewichtssparende Lösung für ältere, umgerüstete Kriegsschiffe, bei denen Bedenken hinsichtlich des Aufbausgewichts den Einbau der normalerweise am Mark-37-Richtstand vorgesehenen Mark-12- und Mark-22-Anlagen nicht zuließen.
MK37_GFCS=MK37 GFCS|Der MK.37 Director wurde als Feuerleitsystem für die 5"-Mehrzweckkanone im Kaliber 38 verwendet, um gegen Flugzeuge und Seeziele zu wirken, das Feuer von Leuchtgranaten zur Beleuchtung von Seezielen zu lenken und die Suchscheinwerfer zu positionieren.
MK38_GFCS_MK3=Mark 38 GFCS (Radar Mark 3 "FC")|Das Mark 38 Gun Fire Control System (GFCS) steuert die großen Hauptgeschütze von Schlachtschiffen und liefert eine hochpräzise Feuerleitung gegen See- und Landziele. Das System umfasst einen gepanzerten Richtstand, der auf den großen Turmaufbauten der Schlachtschiffe der Klassen North Carolina, South Dakota und Iowa vorhanden war. Es war außerdem auf den Großkreuzern der Alaska-Klasse verbaut. Dieser Richtstand ist mit dem Mark-3-„FC“ Entfernungsmessradar ausgestattet, einem der ersten amerikanischen Feuerleitradare. Die Kombination aus Richtstand und Radar leistete 1942 und 1943 hervorraende Dienste, bevor sie durch die Feuerleitanlagen Mark 8 und später Mark 13 ersetzt wurde.
MK38_GFCS=MK38 GFCS (Radar Mark 13)|Das Mark 38 Gun Fire Control System (GFCS) kontrollierte die großen Hauptgeschütze der Schlachtschiffe der Iowa-Klasse. Die Radarsysteme des Mark 38 GFCS waren weit fortgeschrittener als die primitiven Radaranlagen, die von den Japanern im Zweiten Weltkrieg verwendet wurden. Die Hauptkomponenten waren der Director, der Plottraum und die verbindende Datenübertragungsausrüstung. Die beiden Systeme, vorn und achtern, waren vollständig unabhängig. Ihre Plotträume waren isoliert, um einen Schutz vor Kampfschäden zu bieten, die sich ansonsten vom einen zum anderen System hätten ausbreiten könnten.
MK56_GFCS=MK56_GFCS|Das Mk-56 Feuerleitsystem wird auf Schiffen mit 3- und 5-Zoll-Geschützen eingesetzt. Ein X-Band-Radar ermöglicht es, sowohl Ziele an der Wasseroberfläche als auch schnelle Luftziele effektiv zu bekämpfen.
MK63_GFCS=MK63_GFCS|Das Mk-63 Feuerleitsystem wird auf Schiffen eingesetzt, die mit 3- und 5-Zoll-Geschützen ausgerüstet sind. Ein X-Band-Radar ermöglicht es den Schiffen, sowohl Seeziele als auch schnelle Luftziele effektiv zu bekämpfen.
MK68_GFCS=MK68 GFCS|In den frühen 1950er Jahren eingeführt, war der Mark 68 ein Upgrade des Mark 37, der sehr wirksam gegen Luft- und Seeziele war. Er kombinierte einen bemannten Oberdeck-Director, ein kegelförmiges Scan-Acquisition- und Tracking-Radar, einen analogen Computer zur Berechnung ballistischer Flugbahnen und eine gyroskopische Stabilisierung. Der Geschützdirektor war in einer großen Gabel montiert und befand sich stabilisiert in Querlage (die Pivotachse der Gabel).
MK86_GFCS=MK86 GFCS|Das Mark 86 steuert die auf Schiffen der Aegis-Klasse eingesetzten 5"-Geschütze im Kaliber 54 und kann bis zu zwei Ziele gleichzeitig bekämpfen. Er verwendet ein ferngesteuertes optisches Sichtsystem.
MK92_FCS=MK92 FCS|Das Mk. 92 Feuerleitsystem ist eine amerikanische Version der WM-25 Radarfamilie. Das Mk 92 wird von der US Navy, der US-Küstenwache und ausländischen Kunden auf Plattformen wie Fregatten der Oliver Hazard Perry-Klasse eingesetzt.
MK92_SearchRadar=MK92 Radar|Das Mk-92 umfasst zwei Radaranlagen: ein Such- und Verfolgungsradar sowie ein kontinuierlich arbeitendes Feuerleitradar. Dies ist das Suchradar; es kann gleichzeitig zwei Bodenziele verfolgen und das Geschützfeuer auf diese Ziele lenken.
SPQ-9=SPQ-9|Das AN/SPQ-9 ist ein X-Band-Radar, welches zusammen mit dem Mk-86 Feuerleitradar eingesetzt wird. Besonders hervorzuheben ist, dass dieses Radar auch niedrig fliegende Luftziele, wie etwa Seezielflugkörper im Sea-Skimming-Flugprofil auf kurze Distanz verfolgen kann, wenn auch mit stark eingeschränkter Höhenauflösung.

#---------- Submarines ----------
BPS-14_15=BPS-14_15|Das AN/BPS-14 ist ein Mittelstrecken-Seesuch- und Navigationsradar, das in älteren U-Booten eingesetzt wird. Das Radar verwendet eine Hornantenne, deren Antrieb vom Innenraum des U-Bootes aus bedient wird.

#---------------------------------------- Aircraft radar ----------------------------------------
AN/APY-1=AN/APY-1|Das Das AN/APY-1 ist ein Langstrecken-Luft- und Seeraumüberwachungsradar, das auf der E-3 AWACS verwendet wird. Es bietet Frühwarn- sowie Gefechtsführungs- und Kontrollfunktionen.
LN-66=LN-66|Das LN-66 ist ein ziviles Kurzstrecken-Seeraumüberwachungsradar, welches in großer Zahl in der kommerziellen und militärischen Seefahrt eingesetzt wird, jedoch auch auf dem SH-2F LAMPS Hubschrauber zu finden ist.
AN/ASB-1B=AN/ASB-1B
AN/APS-20=AN/APS-20|Das AN/APS-20 ist ein S-Band-Langstrecken-Luftsuchradar, das auf der P-2H Neptune eingesetzt wurde.
AN/APS-80=AN/APS-80|Das AN/APS-80 ist ein X-Band-Marineradar für luftgestützte Langstreckenüberwachung und Oberflächensuche. Dieses Radarsystem nutzt mechanisch geschwenkte Antennen, um eine 360-Grad-Abdeckung zu gewährleisten. Es wurde in frühen Varianten der P-3-Orion sowie in der japanischen US-1 installiert.
AN/APS-96=AN/APS-96
AN/APS-115=AN/APS-115|Das AN/APS-115 ist ein X-Band-Radar, das in der P-3 Orion eingesetzt wird. Das Radar wurde auf Basis des AN/APS-80A entwickelt.
AN/APS-116=AN/APS-116|Das AN/APS-116 wurde entwickelt, um U-Boot-Periskope und Antennen auch bei rauer See erkennen zu können. Der Scanner des Systems ist in einem Radom in der Flugzeugnase montiert, das Radar ist in die Datensysteme des Flugzeugs integriert. Das APS-116 wurde auch zur Navigation und zur Seeaufklärung eingesetzt.
AN/APS-125=AN/APS-125|Das AN/APS-125 ist ein weitreichendes Luftraumüberwachungsradar im UHF-Band, das von der US Navy zur luftgestützten Frühwarnung eingesetzt wird.
AN/APQ-110=AN/APQ-110
AN/APQ-113=AN/APQ-113
AN/APQ-126=AN/APQ-126|Das AN/APQ-126 ist ein vorwärts gerichtetes Radar für die Luftnavigation und Waffensteuerung im Ku-Band. Seine Hauptfunktionen sind die Bodenkartierung, die Luft-zu-Boden-Entfernungsbestimmung und die Flugsicherung. Das Radar wurde in den frühen 1970er Jahren für die US Navy A-7E und die US Air Force A-7D Corsair Kampfflugzeuge entwickelt.
AN/APS-138=AN/APS-138|Das AN/APS-138 ist ein weitreichendes Luftraumüberwachungsradar im UHF-Band, das von der US Navy zur luftgestützten Frühwarnung eingesetzt wird.
AN/APQ-144=AN/APQ-144
AN/APQ-148=AN/APQ-148|Das AN/APQ-148 ist ein Mehrzweck-Luftradar, das entwickelt wurde, um die Funktionen des AN/APQ-92 sowie des AN/APQ-112 zu kombinieren. Diese beiden Radarsysteme wurden zuvor gemeinsam in den Allwetter-Angriffsflugzeugen A-6 Intruder der US Navy verwendet.
AN/APQ-156=AN/APQ-156|Das AN/APQ-156 ist ein luftgestütztes Mehrzweckradar, das auf der A-6E TRAM eingesetzt wird und dieser eine fortschrittliche Allwetter-Fähigkeit für Angriffe im Tiefflug verleiht.
AN/APQ-161=AN/APQ-161
AN/APD-7=AN/APD-7
AN/AWG-9=AN/AWG-9|Das AN/AWG-9-Radar ist ein Allwetter-Multimode-X-Band-Puls-Doppler-Radarsystem, das in der F-14 Tomcat verwendet wird. Es handelt sich hier um ein Luft-Luft-System mit großer Reichweite, das mehrere AIM-54 Phoenix- oder AIM-120 AMRAAM-Raketen gleichzeitig führen kann, indem es den Track-While-Scan-Modus verwendet.
AN/AWG-9_Phoenix=AN/AWG-9 (AIM-54 Guidance)|Spezieller Feuerleitmodus des AIM-54 Phoenix-Raketensystems, der die gleichzeitige Bekämpfung von bis zu sechs Zielen ermöglicht. Dieser Modus gilt ausschließlich für die AIM-54, während jeweils eine einzelne AIM-7 gleichzeitig geführt werden kann.
AN/APG-53=AN/APG-53A|Das AN/APG-53A ist ein Kurzstrecken-Feuerleitradar für den Einsatz von Bomben, welches im Kampfflugzeug A-4 Skyhawk verwendet wird.
AN/APG-63=AN/APG-63|Das AN/APG-63 ist ein Langstrecken-"track-while-scan"-Radar, welches in der F-15 Verwendung findet.
AN/APQ-109=AN/APQ-109|Das AN/APQ-109 ist ein Langstrecken-Mehrzweckradar, welches in der F-4D eingesetzt wird.
AN/APQ-120=AN/APQ-120|Das AN/APQ-120 ist ein Langstrecken-Mehrzweckradar, das im F-4E Kampfjet integriert ist.
AN/AWG-10A=AN/AWG-10|Das AN/AWG-10 ist ein integriertes Mehrzweck-Langstreckenradar, eingesetzt im Jagdflugzeug F-4S. Es verfügt über Puls-Doppler-Fähigkeit und ist das erste US-Jagdflugzeugradar mit Look-down/Shoot-down-Fähigkeit.
AN/AWG-10B=AN/AWG-10B|Das AN/AWG-10B ist ein integriertes Mehrzweck-Langstreckenradar, eingesetzt im Jagdflugzeug F-4S. Es verfügt über Puls-Doppler-Fähigkeit und ist das erste US-Jagdflugzeugradar mit Look-down/Shoot-down-Fähigkeit.\nWeiterentwickelt aus dem AWG-10A mit Festkörperelektronik und verbesserter Leistungsfähigkeit gegen Ziele in geringer Flughöhe.
AN/AWG-11=AN/AWG-11|Das AN/AWG-11 ist ein integriertes Mehrzweck-Langstreckenradar. Es verfügt über Puls-Doppler-Fähigkeit und ist das erste US-Jagdflugzeugradar mit Look-down/Shoot-down-Fähigkeit.\nDieses System ist die Exportversion des AWG-10A aus der F-4J und wird auf britischen F-4 Phantom sowie auf der JASDF T-2 eingesetzt.
AN/AWG-12=AN/AWG-12|Das AN/AWG-12 ist ein integriertes Mehrzweck-Langstreckenradar. Es verfügt über Puls-Doppler-Fähigkeit und ist das erste US-Jagdflugzeugradar mit Look-down/Shoot-down-Fähigkeit.\nDieses System ist die Exportversion des AWG-10B aus der F-4S und wird auf britischen F-4 Phantom sowie auf der JASDF F-1 eingesetzt.
MD-9=MD-9|Ein Feuerleitradar für das Heckgeschütz, das in den älteren Varianten des B-52-Bombers verwendet wurde.
AN/ALQ-153=AN/ALQ-153|Ein Feuerleitradar für das Heckgeschütz, das in den neueren Varianten des B-52-Bombers verwendet wurde.
AN/APQ-153=AN/APQ-153|Kurzstrecken-Luftraumüberwachungsradar der F-5E.
