QF45=QF 4.5-Zoll|QF 4.5-Zoll Mk IV Geschütz|Das QF 4,5-Zoll Schiffsgeschütz Mk IV war seit dem Jahre 1938 das Standardgeschütz mittleren Kalibers und mittlerer Reichweite der Royal Navy. Es war in der Lage, sowohl Boden-, als auch Luft- und Küstenziele zu bekämpfen. Das QF 4,5-Zoll L/45 wurde ursprünglich als Mehrzweckwaffe für den Einsatz auf Flugzeugträgern, modernisierten Schlachtschiffen und Schlachtkreuzern entwickelt. Später wurde es auch als Waffe für Zerstörer vorgesehen, um das allgegenwärtige QF 4,7-Zoll-(120-mm)-Geschütz zu ersetzen. Ungeachtet des kleineren Kalibers verschoss es eine schwerere Granate und erzeugte so eine größere Wirkung.
