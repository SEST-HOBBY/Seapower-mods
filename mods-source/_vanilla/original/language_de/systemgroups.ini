SJD-3=SJD-3|Dies ist eine weiterentwickelte chinesische Version des sowjetischen Tamir-11, eines ausschließlich aktiv arbeitenden Suchstrahl-Sonars. Es verwendet eine teleskopierbare Halterung, um den Wandler unter den Rumpf abzusenken und so Eigengeräusche des Schiffs zu minimieren.
