MK28=MK 28 Geschütz|5-Zoll/Kaliber 38 - Mark 28 Geschütz|Das Mark-28-Geschütz besteht aus einem Zwillingsgeschütz Mark-12 im Kaliber 5‘‘/38. Der Geschützlauf war ein Kompromiss zwischen dem vorherigen Standardgeschütz der Vereinigten Staaten, dem 5-Zoll/51- Flachwinkelgeschütz und dem 5-Zoll/25-Flugabwehrgeschütz.
