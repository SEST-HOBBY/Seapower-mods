MK42=MK 42 Geschütz|5-Zoll/Kaliber 54 - Mark 42 Geschütz|In den 1950er Jahren wurde ein Geschütz mit größerer Reichweite und schnellerer Feuerrate als das im Zweiten Weltkrieg verwendete 5-Zoll/38-Kaliber-Geschütz benötigt. Daher wurde das 5-Zoll/54-Mark 42-Geschütz parallel zum 3-Zoll/70-Mark-26-Mehrzweckgeschütz entwickelt. Das 5-Zoll/54-Mk-42-Geschütz ist eine automatische, multifunktionale (Luft- / Seeziel) Geschützvariante. Sie wird üblicherweise vom Mk-68-Geschützfeuerleitsystem gesteuert.
