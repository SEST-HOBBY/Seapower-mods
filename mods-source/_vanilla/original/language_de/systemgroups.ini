AN/ASQ-81V2=AN/ASQ-81V2|Das AN/ASQ-81 ist ein luftgestütztes Magnetanomalie-Erkennungsgerät (MAD), was sowohl auf Drehflügel- als auch Starrflügelplattformen eingesetzt wird.

#---------------------------------------- Laser Designator ---------------------------
AN/AVQ-23=AN/AVQ-23|Die AN/AVQ-23 Pave Spike ist ein Zielbeleuchtungssystem, das von Kampfflugzeugen verwendet wird. Es nutzt eine TV-Kamera und einen Laser, um Ziele für lasergesteuerte Bomben zu markieren.
AN/AVQ-26=Pave Tack|Das AN/AVQ-26 Pave Tack ist eine elektro-optische Zielvorrichtung für Kampfflugzeuge. Es verwendet einen Laser und einen nach vorne gerichteten Infrarotstrahl, um Ziele für laser- und präzisionsgelenkte Bomben zu finden und zu markieren. Die Bilder von Pave Tack werden auf ein Cockpit-Display des Waffensystemoffiziers projiziert. 
AN/TVQ-2=G/VLLD|Der AN/TVQ-2 Ground/Vehicular Laser Locator Designator (G/VLLD) ist ein stabilisiertes elektrooptisches Zielgerät in Kombination mit einem Laserentfernungsmesser und -zielbeleuchter.

