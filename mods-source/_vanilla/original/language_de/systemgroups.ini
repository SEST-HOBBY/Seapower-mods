Oerlikon_20mm_v2=Oerlikon 20mm|Oerlikon 20mm-Geschütz|Diese 20-mm-Kanone geht auf deutsche Entwürfe aus dem Ersten Weltkrieg zurück. Sie erwies sich als äußerst beliebt und wurde im Zweiten Weltkrieg sowohl von alliierten als auch von Achsenmächten eingesetzt – und ist bis heute im Einsatz.
