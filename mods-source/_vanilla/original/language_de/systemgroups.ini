#---------------------------------------- Sonar ----------------------------------------
SQS-23=SQS-23|Das AN/SQS-23 war ein Langstrecken-Sonar zur Suche und Ortung von Zielen. Es wurde für die Such-, Such-Analyse-, Angriffs-RDT-, Angriffs-SDT- und die manuelle Anwendung verwendet. Es war in Schiffen der Klassen DDG-2 und DDG-16 installiert und nutzte das Ship Center Display (SCD) für Suchoperationen und das Target Center Display (TCD) für den Angriff.
SQS-26=SQS-26|Das AN/SQS-26 ist ein niederfrequentes, bugmontiertes, aktives/passives Sonar, das seit seiner Einführung im Jahr 1961 weit verbreitet von der United States Navy eingesetzt wird. Dieses Sonar wurde vom Naval Underwater Sound Laboratory entwickelt und von General Electric und der EDO Corporation gebaut.
SQS-53=SQS-53|Das AN/SQS-53 ist eine verbesserte Version des AN/SQS-26CX. Der Hauptunterschied zwischen den Sonaren SQS-26CX und SQS-53 liegt in der digitalen Computer-Schnittstelle mit dem Mk 116 ASW-Feuerleitsystem.
SQS-53B=SQS-53B|Die ursprüngliche analoge Steuerung und Anzeige im AN/SQS-53A wurde durch digitale, festkörperbasierte Steuerungen und Anzeigen ersetzt, die ein integriertes Testsystem und den akustischen Signalprozessor AN/UYS-1 zur Integration im digitalen AN/SQQ-89-System enthalten. Auf späteren Kreuzern der Ticonderoga-Klasse (ab CG-56) als Teil von AN/SQQ-89 installiert.
SQS-56=SQS-56|Das AN/SQS-56 ist ein aktives/passives Sonar zur U-Boot-Erkennung mit stark begrenzten Fähigkeiten. Es handelt sich um ein rumpfmontiertes System, das für Schiffe in der Größe von Fregatten oder Korvetten entwickelt wurde. Die Schiffe der Oliver Hazard Perry-Klasse, die mit diesem Sonar ausgestattet sind, verwenden es hauptsächlich, um U-Boote mit ihren Schleppsonaren (AN/SQR-18 und AN/SQR-19) zu erkennen.

#---------- Submarines ----------
WLR-9=WLR-9|Das AN/WLR-9 ist der erste in einer Serie von akustischen Abhör-Empfängern (AIR) für U-Boote. Alle diese Systeme bestehen aus Hydrophonen, die in zwei Kuppeln montiert sind, wobei eines davon im Turm des U-Boots angebracht ist: ein Empfänger/Prozessor und ein Display. Das System analysiert abgefangene Sonarsignale, um sie nach Frequenz und Impulsdauer sowie Signalpegel und relativer Peilung zu klassifizieren.

BQG-4=BQG-4
BQS-4=BQS-4|Das AN/BQS-4 ist die hochfrequente Komponente des passiven Sonars BQR-21.
BQR-21=BQR-21|Das AN/BQR-21 ist ein mittelfrequentes, zylindrisches, passives Sonar-Array.
BQQ-1=BQQ-1
BQQ-2A=BQQ-2A
BQQ-2B=BQQ-2B
BQQ-5=BQQ-5|Das bugmontierte, sphärische Sonarsystem AN/BQQ-5 wird auf den U-Booten der SSN-637- und SSN-688-Klassen eingesetzt. Dieses Sonar mit niedriger Frequenz für passive und aktive Suche wird von IBM geliefert. Das ursprüngliche AN/BQQ-5 wurde nur mit einer Bedienkonsole entwickelt, mit der die verschiedenen Modi sequenziell bei Bedarf aufgerufen werden können.

#Towed
SQS-35=SQS-35|Das AN/SQS-35 ist Tauchsonar für variable Tiefen, das unterhalb der Thermokline geschleppt werden kann, um die Erkennung von U-Booten zu verbessern, die sich ansonsten in der "Schattenzone" verstecken würden.
AN/SQR-18A=AN/SQR-18A|Die AN/SQR-18-Serie startete mit dem SQR-18 Interim Escort Towed-Array Surveillance System (IETASS), das als vereinfachte Version der AN/SQR-14/15-Langstrecken-Schleppsonar-Arrays für Fregatten und Minensuchboote entwickelt wurde.
AN/SQR-18A(V)1=AN/SQR-18A(V)1|Das AN/SQR-18A(V)1 ist ein amerikanisches Schleppsonarsystem, das auf U-Jagd-Fregatten wie der Knox FF oder Perry FFG verwendet wird. Die Version (V)1 wird bei Fregatten der Knox-Klasse über den SQS-35-VDS-„Fish“ ausgebracht.
AN/SQR-19=AN/SQR-19|Das AN/SQR-19 Tactical Towed Array Sonar (TACTAS) ermöglicht die passive Langstreckenerkennung feindlicher U-Boote. TACTAS ist ein langes Kabel voller Mikrofone, das etwa eine Meile hinter dem Schiff hergeschleppt wird. Die große Schleppdistanz ist erforderlich, um zu verhindern, dass Geräusche, die vom eigenen Schiff abgestrahlt werden, die von den Zielen aufgenommenen Geräusche stören. Anhand dieser Geräusche kann genau bestimmt werden, welches Schiff oder U-Boot verfolgt wird.
BQR-15=BQR-15|Das AN/BQR-15 ist ein passives Schlepparray mit einem sehr schlanken Profil, das auf den U-Booten der Lafayette-, James Madison- und Benjamin Franklin-Klasse für die Früherkennung feindlicher U-Boote und Torpedos eingesetzt wird.
BQR-25=BQR-25|Das AN/BQR-25 ist ein passives Schlepparray, das bei den U-Booten der Skipjack-Klasse nachgerüstet wurde, um ihnen eine verbesserte langfristige passive Erkennung von Schiffen und U-Booten zu ermöglichen.
TB-16=TB-16|Anfang 1960er Jahre führte die US Navy eine Reihe von Experimenten mit zwei U-Booten und einem Überwasserschiff durch, bei denen die Tests 1964-1965 mit der Entdeckung eines schnorchelnden U-Bootes auf 60 Seemeilen ihren Höhepunkt erreichten. Dies führte 1967 zur Ausschreibung für das AN/SQR-14 Schlepp-Array und zur Bereitstellung von drei Systemen auf Zerstörern der Dealy-Klasse, die im Mittelmeer operierten. Der Erfolg dieser Systeme – und die Entwicklung wesentlich leiserer sowjetischer U-Boote der Klassen Charlie, Victor und Yankee – führte zur Entwicklung des TB-16, das schließlich in der gesamten U-Boot-Flotte der US Navy eingesetzt wurde.

#Dipping
AQS-13E=AQS-13E|Die AN/AQS-13-Serie war ein Hubschrauber-Tauchsonarsystem für die United States Navy. Diese Geräte wurden über fünf Jahrzehnte lang primär für die U-Jagd (ASW) im Nahbereich auf Hubschraubern eingesetzt, die beispielsweise auf Flugzeugträgern stationiert waren.

