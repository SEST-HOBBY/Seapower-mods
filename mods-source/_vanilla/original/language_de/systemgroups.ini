VesselRWR=Radarwarnanlage|Radarwarnempfänger (RWR - Radar Warning Reciever) erfassen Such- und Dauerstrichradarsignale und ermöglichen eine passive Erkennung sowie eine Warnung vor bevorstehendem feindlichen Beschuss.
AircraftRWR=Radarwarnanlage|Radarwarnempfänger (RWR - Radar Warning Reciever) erfassen Such- und Dauerstrichradarsignale und ermöglichen eine passive Erkennung sowie eine Warnung vor bevorstehendem feindlichen Beschuss.

#---------- Targeting ----------
ARM_Targeting=ARM-Zielerfassung|Zielerfassungssystem für Anti-Radar-Raketen. Es liefert keine eindeutige Zielidentifikation oder präzise Positionsbestimmung, erzeugt jedoch ein Zielverfolgungssignal, das für einen Angriff genutzt werden kann.

#---------- ELINT ----------
VesselESM=EloUM|"Elektronische Unterstützungsmaßnahmen" (EloUM, oder auch ESM) ist die Bezeichnung für Systeme, welche elektromagnetischer Ausstrahlungen wie Radarsignale abfangen und somit eine passive Ortung ermöglichen, ohne jedoch die eigene Position durch aktives Radar preiszugeben.
Submarine_ESM=EloUM-Mast|"Elektronische Unterstützungsmaßnahmen" (EloUM, oder auch ESM) ist die Bezeichnung für Systeme, welche elektromagnetischer Ausstrahlungen wie Radarsignale abfangen und somit eine passive Ortung ermöglichen, ohne jedoch die eigene Position durch aktives Radar preiszugeben.
AircraftELINT=EloUM|"Elektronische Unterstützungsmaßnahmen" (EloUM, oder auch ESM) ist die Bezeichnung für Systeme, welche elektromagnetischer Ausstrahlungen wie Radarsignale abfangen und somit eine passive Ortung ermöglichen, ohne jedoch die eigene Position durch aktives Radar preiszugeben.

#---------------------------------------- ECM ----------------------------------------
GenericECM=EloGM-Störsender|Elektronische Gegenmaßnahmen (EloGM, oder auch ECM) können feindliche Radarsysteme durch Breitband-Störsender (Rauschstörung) beeinflussen und deren Erkennungsreichweite erheblich reduzieren, bis das Radar genug Energie aufbringt, um das Hintergrundrauschen zu durchdringen („burn-through“). ECM-Systeme können auch feindliche Radarsignale abfangen, modulieren und diese zurücksenden, um das feindliche Radar über die tatsächliche Position des Ziels zu täuschen.
AircraftDECM_Early=Defensiver EloGM-Störsender|Defensive ECM-Systeme (DECM) können feindliche Radarsignale abfangen, modulieren und diese zurücksenden, um das feindliche Radar über die tatsächliche Position des Ziels zu täuschen.
AircraftDECM_Med=Defensiver EloGM-Störsender|Defensive ECM-Systeme (DECM) können feindliche Radarsignale abfangen, modulieren und diese zurücksenden, um das feindliche Radar über die tatsächliche Position des Ziels zu täuschen.
AircraftDECM_Late=Defensiver EloGM-Störsender|Defensive ECM-Systeme (DECM) können feindliche Radarsignale abfangen, modulieren und diese zurücksenden, um das feindliche Radar über die tatsächliche Position des Ziels zu täuschen.

