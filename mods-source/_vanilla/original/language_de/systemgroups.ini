OLT-3=EloGM Störsender|Elektronische Gegenmaßnahmen (Electronic Counter Measures, ECM) können durch Rauschstörungen (Barrage-Jamming) gegnerische Radarsysteme stören und deren Erfassungsreichweite erheblich reduzieren, bis das Radar über genügend Sendeleistung verfügt, um das Hintergrundrauschen zu „durchdringen“. Zusätzlich können sie gegnerische Radarsignale abfangen, modulieren und zurücksenden, um das gegnerische Radar über die tatsächliche Position des Ziels zu täuschen.

