; British theater ORBAT for Operación Soberanía (Dynamic Unit Generation).
; Persistent hulls: a ship sunk in one mission is gone for the campaign, and survivors keep their ammunition.
; Operational eligibility is constrained by exact type,variant selectors in each mission.
; Argentine campaign balance: Antelope, Ambuscade, Argonaut and Ardent are available from 11 May 1982.
; IDs: rn_ff_amazon Variant2 (Antelope), Variant4 (Ambuscade), Variant7 (Ardent), rn_ff_leander_batch2 Variant5 (Argonaut).
; Enforce this arrival through mission selectors. AR05 uses the three Type 21s, with Argonaut held for later allocation.
; Argentine campaign balance: Active, Avenger and Exocet-armed Penelope are eligible in AR06.
; Exeter and Argonaut are allocated to AR06B. Cardiff joins the surviving fleet in AR07.
; See Docs/ArgentinaBritishFleetAudit.md for the earlier fleet audit.
; Carriers are placed in the missions directly (listed so Situation shows them); RFAs and stand-in transports are tracked by campaign variables.

[SurfaceMajorFlagships_UK]
rn_cvs_invincible=Variant1
rn_cv_centaur=Variant1

