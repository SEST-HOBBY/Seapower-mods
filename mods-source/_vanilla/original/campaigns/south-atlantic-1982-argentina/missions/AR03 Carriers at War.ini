Side0Trigger6Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CARRIER ACTION. ENEMY CARRIER SINKING.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. INTERCEPTED BRITISH RADIO TRAFFIC REPORTS A CARRIER BURNING AND SINKING.\n\n2. RECOVER ALL AIRCRAFT, THEN RETIRE WEST AT FLANK SPEED.\n\n3. ENEMY AIRCRAFT MAY FOLLOW THE RETURNING STRIKE. COMPLETE RECOVERY AND CLEAR THE AREA BEFORE THE BRITISH CAN BRING A COUNTERATTACK TO BEAR.\nButtonText=Close\nPopupStyle=NavalMessage
Trigger6TimerLabel=Recover aircraft and retire west
Side0Trigger7Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CARRIER ACTION. ENEMY CARRIER SUNK.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. STRIKE REPORTS AND INTERCEPTED BRITISH TRAFFIC CONFIRM THE LOSS OF AN ENEMY CARRIER.\n\n2. RECOVER THE STRIKE AND OPEN TO THE WEST. PRESERVATION OF 25 DE MAYO FOR FURTHER OPERATIONS IS NOW THE PRIORITY.\n\n3. MY CONGRATULATIONS TO THE SHIPS' COMPANIES AND AIRCREWS. EXCELLENT WORK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger9Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CARRIER ACTION. LOSS OF 25 DE MAYO.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. ESCORT REPORTS CONFIRM 25 DE MAYO HAS BEEN SUNK.\n\n2. THE FLEET HAS LOST ITS ONLY CARRIER. WITHDRAW THE SURVIVING SHIPS AND ACCOUNT FOR ALL AIRCRAFT.\n\n3. REPORT CASUALTIES AND SURVIVORS RECOVERED. A FULL ACCOUNT OF THE ACTION IS REQUIRED.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger10Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CARRIER ACTION. WITHDRAW WEST.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. SIGINT INDICATES THE BRITISH FORCE IS ALERTED TO OUR ATTACK. THE STRIKE WINDOW HAS CLOSED.\n\n2. RECOVER YOUR AIRCRAFT AND WITHDRAW WEST. DO NOT EXPOSE 25 DE MAYO IN PURSUIT OF FURTHER TARGETS.\n\n3. REPORT DAMAGE, AIRCRAFT LOSSES AND REMAINING AMMUNITION WHEN CLEAR.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger15Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CARRIER ACTION. ENEMY ALERTED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. RADIO INTERCEPTS INDICATE THE BRITISH FORCE HAS REPORTED A SHIP HIT AND IS ALERTED TO OUR ATTACK.\n\n2. PRESS HOME ATTACKS ALREADY UNDER WAY. DO NOT DELAY FOR ANOTHER STRIKE.\n\n3. RECOVER YOUR AIRCRAFT AND RETIRE WEST BEFORE ENEMY SEARCH AIRCRAFT CAN LOCATE OUR GROUP.\nButtonText=Close\nPopupStyle=NavalMessage
Trigger15TimerLabel=Complete strike and disengage
Side0Trigger19Message=Title=<size=24>Guerra de Malvinas 1982</size>\nCARRIERS AT WAR\n<size=24>2 May 1982</size>\nBody=The fleet has been ordered to strike the British carriers east of Stanley. ARA 25 de Mayo is approaching with her escorts, but the enemy carriers have not yet been located.\n\nUse the embarked Trackers to find the carrier group and direct the A-4Qs against it. Coordinate the strike to get through the destroyer and frigate screen. The carriers are the main targets, although attacks on their escorts are authorised.\n\nOnce the British force comes under attack, it is very likely to retreat east and out of range. The strike must therefore be carefully coordinated. We will only get one shot at this.\n\nA radar picket and Sea Harrier patrols cover the western approach. Air Force Mirage fighters are available for combat air patrol. Expect the British to search for our carrier in turn. Conduct the strike and then retire west after the attack is complete.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nCARRIER OPERATING AREA EAST OF PUERTO ARGENTINO\nVALID 021200 TO 021800 MAY 82. ZULU TIME.\nWIND: 000 DEGREES, 4 TO 6 KNOTS. SEA: SMOOTH.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: BROKEN.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
Objective_strike=Hit a British carrier
Objective_escort=Sink a British escort
Objective_carrier=Keep 25 de Mayo afloat
