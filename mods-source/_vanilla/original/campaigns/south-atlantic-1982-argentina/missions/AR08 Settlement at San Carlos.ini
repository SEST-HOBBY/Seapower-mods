Side0Trigger48Message=Title=<size=24>Guerra de Malvinas 1982</size>\nSETTLEMENT AT SAN CARLOS\n<size=24>21 May 1982</size>\nBody=Reconnaissance reports ten British assault ships and transports approaching Falkland Sound from the north. Their course indicates a landing at San Carlos. The remaining British carrier group is operating farther north.\n\nCoordinate your available ships, submarines and aircraft to intercept the convoy. Destroy or mission kill enough of the landing force or sink the remaining carriers to force the British to negotiate.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nNORTHERN FALKLAND SOUND AND SAN CARLOS WATER\nVALID 211500 TO 212100 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 4 TO 6 KNOTS. SEA: SMOOTH.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: SCATTERED.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
Trigger48TimerLabel=Time remaining to 2100Z
Side0Trigger49Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=LANDING FORCE DISABLED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. REPORTS FROM YOUR FORCE CONFIRM SUFFICIENT BRITISH ASSAULT SHIPS AND TRANSPORTS SUNK OR PUT OUT OF ACTION TO PREVENT A SUSTAINED LANDING.\n\n2. CEASE OFFENSIVE OPERATIONS. RECOVER YOUR AIRCRAFT AND MAINTAIN WATCH ON THE SURVIVING BRITISH SHIPS.\n\n3. THE LANDING HAS BEEN DEFEATED. MY CONGRATULATIONS TO YOUR SHIPS' COMPANIES AND AIRCREWS. REPORT CASUALTIES AND THE CONDITION OF YOUR FORCE.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger50Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CARRIER COVER ELIMINATED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. THE REMAINING BRITISH CARRIERS HAVE BEEN SUNK OR PUT OUT OF ACTION. NAVAL INTELLIGENCE ASSESSES THAT THE LANDING CANNOT BE SUSTAINED WITHOUT THEIR AIR SUPPORT.\n\n2. BREAK OFF THE ATTACK AND RECOVER YOUR AIRCRAFT. WATCH THE SURVIVING ENEMY SHIPS AND REPORT THEIR MOVEMENTS.\n\n3. YOUR FORCE HAS REMOVED THE PRINCIPAL SUPPORT FOR THE BRITISH OFFENSIVE. MY CONGRATULATIONS AND THANKS TO ALL WHO TOOK PART.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger51Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CEASEFIRE AGREED.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. THE GOVERNMENT ADVISES THAT A CEASEFIRE AND NEGOTIATED SETTLEMENT HAVE BEEN AGREED FOLLOWING THE LOSSES INFLICTED ON THE BRITISH FORCE.\n\n2. CEASE OFFENSIVE OPERATIONS. RECOVER YOUR AIRCRAFT AND MAINTAIN A DEFENSIVE WATCH. FIRE ONLY IN SELF-DEFENCE.\n\n3. REPORT CASUALTIES, REMAINING AMMUNITION AND THE CONDITION OF YOUR SHIPS. AWAIT FURTHER ORDERS. MY THANKS TO ALL WHO HAVE SERVED THROUGH THIS CAMPAIGN.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger52Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=BREAK OFF OPERATION.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. THE TIME ALLOTTED FOR THE ATTACK HAS EXPIRED. BRITISH SHIPPING AND CARRIER SUPPORT REMAIN SUFFICIENT TO CONTINUE THE OPERATION.\n\n2. BREAK OFF THE ATTACK. RECOVER YOUR AIRCRAFT AND WITHDRAW THE SURVIVING FORCE TO THE WEST.\n\n3. REPORT CASUALTIES AND PREPARE A FULL ACCOUNT OF THE ACTION. REPORT TO NAVAL HEADQUARTERS ON ARRIVAL PUERTO BELGRANO FOR DEBRIEFING.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger53Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CONVOY THROUGH.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. BRITISH ASSAULT SHIPS AND TRANSPORTS HAVE REACHED THE SAN CARLOS APPROACHES. YOU HAVE FAILED TO STOP THE MAIN BODY BEFORE IT ENTERED THE LANDING AREA.\n\n2. BREAK OFF THE OPERATION. RECOVER YOUR AIRCRAFT AND WITHDRAW THE SURVIVING FORCE TO THE WEST.\n\n3. REPORT CASUALTIES AND THE LAST OBSERVED POSITIONS OF ENEMY SHIPS. PREPARE A FULL ACCOUNT OF THE ACTION FOR NAVAL HEADQUARTERS.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
