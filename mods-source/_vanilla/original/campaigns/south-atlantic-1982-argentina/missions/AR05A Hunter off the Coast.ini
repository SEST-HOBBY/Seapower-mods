Side0Trigger1Message=Title=<size=24>Guerra de Malvinas 1982</size>\nHUNTERS OFF THE COAST\n<size=24>11 May 1982</size>\nBody=British submarines are believed to be tracking 25 de Mayo as the carrier group returns towards the Patagonian coast. Intelligence indicates that as many as three boats may be operating around the group.\n\nScreen the carrier and use your anti-submarine aircraft and helicopters to search ahead and on the flanks. Locate and destroy the submarines while bringing 25 de Mayo safely into coastal waters.\n\nDo not leave the carrier exposed while pursuing a contact. Any submarines that escape will remain a threat to later operations. The loss of 25 de Mayo would deprive the fleet of its only carrier.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nPATAGONIAN COAST\nVALID 111300 TO 111900 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 7 TO 10 KNOTS. SEA: SLIGHT.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: BROKEN.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
Side0Trigger4Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CARRIER GROUP. LOSS OF 25 DE MAYO.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. 25 DE MAYO IS REPORTED SUNK FOLLOWING SUBMARINE ATTACK. THE ESCORTS ARE TO ACCOUNT FOR SURVIVORS WITHOUT DELAY.\n\n2. THE FLEET HAS LOST ITS ONLY CARRIER. RECOVER SURVIVORS WHERE POSSIBLE WITHOUT EXPOSING FURTHER SHIPS TO THE SUBMARINES.\n\n3. WITHDRAW THE SURVIVING FORCE AND REPORT CASUALTIES. A FULL ACCOUNT OF THE ACTION IS REQUIRED.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger5Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CARRIER GROUP. COASTAL WATERS REACHED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. THE CARRIER GROUP IS NOW IN COASTAL WATERS.\n\n2. KEEP THE ESCORTS IN COMPANY WITH 25 DE MAYO. BRITISH SUBMARINES REMAIN AT SEA AND THE ANTI-SUBMARINE WATCH IS TO BE MAINTAINED.\n\n3. REPORT CONTACTS, WEAPONS EXPENDED AND THE CONDITION OF THE GROUP.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_subs=Sink three British submarines
Objective_one=Sink a British submarine
Objective_carrier=Bring 25 De Mayo to the withdrawal area
