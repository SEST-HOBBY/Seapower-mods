Side0Trigger8Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=FALKLAND SOUND. ENEMY FRIGATES DESTROYED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. REPORTS FROM THE SOUND CONFIRM BOTH BRITISH FRIGATES DESTROYED. THE IMMEDIATE THREAT TO THE ANCHORAGE HAS BEEN REMOVED.\n\n2. MAINTAIN PROTECTION OF THE SUPPLY SHIPS WHILE UNLOADING CONTINUES. REPORT WHEN THE ANCHORAGE IS CLEAR.\n\n3. MY CONGRATULATIONS TO YOU AND YOUR SHIPS' COMPANIES. EXCELLENT WORK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger9Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=SWAN ISLANDS. SUPPLY SHIP LOST.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. THE ANCHORAGE REPORTS ONE OF OUR SUPPLY SHIPS SUNK AT THE SWAN ISLANDS.\n\n2. THE LOSS OF THIS CARGO WILL AFFECT THE GARRISON. PROTECT THE REMAINING SHIPPING AND REPORT WHAT SUPPLIES CAN STILL BE LANDED.\n\n3. REPORT CASUALTIES AND SUBMIT A FULL ACCOUNT OF THE ACTION.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger10Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=FALKLAND SOUND. ENEMY DRIVEN OFF.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. SHORE OBSERVERS REPORT ONE BRITISH FRIGATE SUNK AND THE OTHER CLEARING THE SOUND.\n\n2. COVER THE SUPPLY SHIPS UNTIL UNLOADING IS COMPLETE. MAINTAIN WATCH ON THE APPROACHES TO PORT HOWARD.\n\n3. MY CONGRATULATIONS TO YOU AND YOUR SHIPS' COMPANIES.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger11Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=FALKLAND SOUND. ENEMY DRIVEN OFF.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. SHORE OBSERVERS REPORT ONE BRITISH FRIGATE SUNK AND THE OTHER CLEARING THE SOUND.\n\n2. COVER THE SUPPLY SHIPS UNTIL UNLOADING IS COMPLETE. MAINTAIN WATCH ON THE APPROACHES TO PORT HOWARD.\n\n3. MY CONGRATULATIONS TO YOU AND YOUR SHIPS' COMPANIES.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger12Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=FALKLAND SOUND. ENEMY PASSAGE.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. COASTAL REPORTS PLACE BOTH BRITISH FRIGATES CLEAR OF THE SOUND. NO DAMAGE TO EITHER SHIP HAS BEEN REPORTED.\n\n2. YOUR FORCE HAS FAILED TO INTERCEPT THEM AS ORDERED. THE THREAT TO OUR SUPPLY ROUTE REMAINS.\n\n3. COVER THE REMAINING SHIPPING AND REPORT THE ENEMY LAST KNOWN COURSE AND SPEED.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger13Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=FALKLAND SOUND. NIGHT ACTION COMPLETE.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. COASTAL OBSERVERS REPORT ONE BRITISH WARSHIP SUNK AND THE OTHER CLEARING NORTH.\n\n2. DAYLIGHT IS APPROACHING. COVER COMPLETION OF THE SUPPLY OPERATION AND REPORT THE CONDITION OF THE ANCHORAGE.\n\n3. MY THANKS TO YOU AND YOUR SHIPS' COMPANIES.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger14Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=FALKLAND SOUND. DISENGAGE.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. DAYLIGHT IS APPROACHING AND BOTH BRITISH FRIGATES ARE STILL OPERATING IN THE SOUND.\n\n2. DISENGAGE YOUR SURFACE GROUP AND COVER THE REMAINING SUPPLY SHIPS AS THE TACTICAL SITUATION PERMITS. DAYLIGHT WILL RAISE RISK OF ENEMY AIR ATTACK ON OUR FORCES.\n\n3. REPORT LOSSES AND THE POSITION OF ALL SURVIVING SHIPS.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger16Message=Title=<size=24>Guerra de Malvinas 1982</size>\nNIGHT IN THE SOUND\n<size=24>11 May 1982</size>\nBody=Our supply ships are unloading among the Swan Islands under cover of darkness. British frigates are entering Falkland Sound to search for them and bombard positions ashore.\n\nUse your surface group to intercept the frigates before they reach the anchorage. Sink at least one enemy frigate, protect both supply ships and cover the command post at Port Howard.\n\nThe islands will mask contacts until short range. Identify targets before opening fire, as our own shipping is in the area. Deal with the frigates before daylight exposes the supply operation.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nFALKLAND SOUND AND SWAN ISLANDS\nVALID 110300 TO 110900 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 4 TO 6 KNOTS. SEA: SMOOTH.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: OVERCAST.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
Objective_sink=Sink a British frigate
Objective_both=Sink both British frigates
Objective_runners=Protect the blockade runners at the Swan Islands
Objective_howard=Protect the Port Howard command post
