Side0Trigger4Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=GRYTVIKEN. CONVOY ARRIVED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. GRYTVIKEN REPORTS BOTH TRANSPORTS IN CUMBERLAND BAY WITH UNLOADING IN PROGRESS.\n\n2. THE GRYTVIKEN GARRISON HAS BEEN REINFORCED. MY CONGRATULATIONS TO YOU AND YOUR SHIPS' COMPANIES.\n\n3. MAINTAIN PROTECTION OF THE ANCHORAGE AND REPORT WHEN UNLOADING IS COMPLETE. EXCELLENT WORK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger5Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=GRYTVIKEN. CONVOY LOSSES.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. THE GARRISON CONFIRMS ARRIVAL OF ONE TRANSPORT. THE OTHER HAS BEEN LOST ON THE APPROACH.\n\n2. THE DELIVERED SUPPLIES WILL ALLOW THE GARRISON TO HOLD FOR THE PRESENT. PROTECT THE SURVIVING TRANSPORT WHILE UNLOADING CONTINUES.\n\n3. REPORT CASUALTIES AND CARGO LOST. MY THANKS TO THE OFFICERS AND MEN WHO BROUGHT THE CONVOY THROUGH.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger11Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=GRYTVIKEN. LOSS OF TRANSPORTS.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. BOTH TRANSPORTS HAVE BEEN LOST. YOUR ESCORTS HAVE BEEN UNABLE TO DELIVER THE CONVOY TO GRYTVIKEN.\n\n2. THE GARRISON AT GRYTVIKEN REMAINS WITHOUT THE REINFORCEMENTS AND SUPPLIES ASSIGNED TO IT.\n\n3. BREAK OFF OPERATION AND WITHDRAW SURVIVING FORCE. REPORT CASUALTIES AND THEN PREPARE A FULL ACCOUNT OF THE ACTION. REPORT TO NAVAL HEADQUARTERS ON ARRIVAL PUERTO BELGRANO FOR DEBRIEFING.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger12Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=GRYTVIKEN. BREAK OFF OPERATION.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. THE GRYTVIKEN GARRISON HAS NOT BEEN REINFORCED WITHIN THE TIME REQUIRED.\n\n2. BREAK OFF THE OPERATION AND WITHDRAW YOUR GROUP. ENEMY SUBMARINES ARE BELIEVED TO BE IN THE AREA.\n\n3. REPORT THE POSITION AND CONDITION OF THE TRANSPORTS WHEN CLEAR.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger16Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=SOUTH GEORGIA. ENEMY GROUP DESTROYED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. RECONNAISSANCE AND REPORTS FROM YOUR SHIPS CONFIRM THE BRITISH SURFACE GROUP OFF SOUTH GEORGIA HAS BEEN DESTROYED.\n\n2. CONTINUE THE CONVOY INTO CUMBERLAND BAY AND COMPLETE DELIVERY OF THE REINFORCEMENTS AND SUPPLIES.\n\n3. MY CONGRATULATIONS TO YOU AND YOUR SHIPS' COMPANIES. EXCELLENT WORK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_deliver=Bring both transports into Cumberland Bay
Objective_warship=Damage or sink a British warship
Taskforce1StartMessage=Title=<size=24>Guerra de Malvinas 1982</size>\nGRYTVIKEN CONVOY\n<size=24>25 April 1982</size>\nBody=British warships are closing South Georgia, where our garrison at Grytviken is waiting for reinforcements and supplies. Your group is escorting Río Gualeguay and Río Carcarañá into Cumberland Bay.\n\nBring both transports into the marked delivery area. Use the air assets at your disposal to search for the British task group and sink them.\n\nSIGINT indicates two to three British ships. Expect attacks by their helicopters, which carry Sea Skua missiles.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nSOUTH GEORGIA\nVALID 251300 TO 251900 APR 82. ZULU TIME.\nWIND: 270 DEGREES, 11 TO 16 KNOTS. SEA: SLIGHT.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: BROKEN.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
