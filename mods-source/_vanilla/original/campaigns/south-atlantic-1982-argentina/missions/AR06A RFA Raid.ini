Side0Trigger1Message=Title=TANKER SINKING\nBody=A British tanker is sinking. Expect the escorts to search around our firing position. Complete any follow-up attack and clear the area.\n\nDisengage within 20 minutes!\nButtonText=Close\nPopupStyle=Notification
Side0Trigger2Message=From=COMANDANTE FUERZA DE SUBMARINOS\nTo=SUBMARINE COMMANDER\nInfo=\nSubj=ACTION REPORT\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. CONFIRMING RECEIPT OF YOUR ATTACK REPORT AND SINKING OF A BRITISH FLEET TANKER.\n\n2. CLEAR THE RENDEZVOUS AND REPORT REMAINING TORPEDOES WHEN SAFE TO TRANSMIT.\n\n3. WELL DONE ON SUCCESSFUL OPERATION.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger9Message=Title=BRITISH SHIPS WITHDRAWING\nBody=Warning: The remaining British ships are withdrawing east at speed. Further firing opportunities will be brief. Break contact once your attack is complete.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger10Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=COMANDANTE FUERZA DE SUBMARINOS\nInfo=\nSubj=REPLENISHMENT RAID. SUBMARINE LOST.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. CONTACT WITH THE SUBMARINE WAS LOST AT {$MissionTime}. NO FURTHER REPORT HAS BEEN RECEIVED.\n\n2. THE BOAT WAS LAST TASKED WITH ATTACKING THE BRITISH TANKER RENDEZVOUS NORTH-EAST OF THE ISLANDS.\n\n3. WE ASSESS THE SUBMARINE IS LOST TO BRITISH ACTION.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger11Message=From=COMANDANTE FUERZA DE SUBMARINOS\nTo=SUBMARINE COMMANDER\nInfo=\nSubj=BRITISH REPLENISHMENT. END PATROL.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. WARNING: BRITISH FORCES ARE ALERTED TO YOUR ATTACK AND ADDITIONAL ASW ASSETS ARE INBOUND FROM THE CARRIER GROUP.\n\n2. BREAK CONTACT AND WITHDRAW FROM THE RENDEZVOUS.\n\n3. REPORT ATTACK RESULTS AND REMAINING TORPEDOES WHEN SAFE TO TRANSMIT.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger14Message=Title=BRITISH FORCE ALERTED\nBody=Our attack has revealed our presence. Expect the escorts to begin an immediate search, supported by helicopters. Complete your attack and clear the replenishment area.\n\nDisengage within 30 minutes!\nButtonText=Close\nPopupStyle=Notification
Side0Trigger16Message=Title=<size=24>Guerra de Malvinas 1982</size>\nRFA RAID\n<size=24>16 May 1982</size>\nBody=Intelligence indicates a British tanker rendezvous north-east of the islands. Its position and composition are unconfirmed.\n\nLocate the tankers and sink at least one. Disrupting their fuel deliveries will reduce British carrier air patrols.\n\nExpect escorts and anti-submarine helicopters. Complete the attack and break contact before the search can close around you.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nREPLENISHMENT AREA NORTH-EAST OF THE ISLANDS\nVALID 161600 TO 162200 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 11 TO 16 KNOTS. SEA: SLIGHT.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: BROKEN.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
Objective_tanker=Sink a fleet tanker
Objective_both=Sink both tankers
Objective_recover=Disengage and clear the replenishment area
