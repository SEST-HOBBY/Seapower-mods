Side0Trigger8Message=Title=Bombardment group turning away\nBody=A bombardment ship is sinking and the group is turning east. Recover your aircraft. The action ends in 5 minutes.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger9Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=PUERTO ARGENTINO. BOMBARDMENT REPULSED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. COASTAL OBSERVERS REPORT A BRITISH BOMBARDMENT SHIP SUNK AND THE REMAINING SHIPS RETIRING EAST. SIGINT INDICATES THE ENEMY IS BREAKING OFF THE ACTION.\n\n2. THE AIRFIELD AND GARRISON AT PUERTO ARGENTINO REMAIN IN OUR HANDS. MAINTAIN AIR WATCH AND REPORT THE CONDITION OF YOUR FORCE.\n\n3. MY CONGRATULATIONS TO YOU AND YOUR SHIPS' COMPANIES. EXCELLENT WORK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger10Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=PUERTO ARGENTINO. LOSS OF INSTALLATIONS.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. THE GARRISON REPORTS THE FUEL AND AMMUNITION DEPOTS, RADAR AND COMMAND POST AT PUERTO ARGENTINO HAVE BEEN DESTROYED.\n\n2. THESE LOSSES HAVE SERIOUSLY REDUCED OUR ABILITY TO SUPPORT THE GARRISON.\n\n3. PRESERVE THE REMAINING FORCE AND REPORT CASUALTIES AND DAMAGE. A FULL ACCOUNT OF THE ACTION IS REQUIRED.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger11Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=PUERTO ARGENTINO. ENEMY WITHDRAWAL.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. COASTAL RADAR REPORTS THE BRITISH BOMBARDMENT GROUP RETIRING EAST. THE ENEMY HAS COMPLETED HIS ATTACK.\n\n2. PUERTO ARGENTINO REMAINS IN OUR HANDS, BUT YOUR FORCE DID NOT DRIVE OFF THE ENEMY AS ORDERED.\n\n3. MAINTAIN AIR WATCH AND REPORT DAMAGE TO THE SHORE INSTALLATIONS. FURTHER INSTRUCTIONS WILL FOLLOW.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_drive=Sink at least one ship to drive their bombardment group off
Objective_hold=Defend Puerto Argentino (Stanley) against the first British bombardment and air attack
Objective_recover=Recover your aircraft before the action ends
Taskforce1StartMessage=Title=<size=24>Guerra de Malvinas 1982</size>\nFIRST BLOWS\n<size=24>1 May 1982</size>\nBody=The British carriers have entered the exclusion zone and are preparing the first air attacks against Puerto Argentino. A destroyer and frigates are closing the coast to bombard the garrison.\n\nCommand your surface group and supporting aircraft to drive off the bombardment ships. Sink at least one of them and protect the fuel and ammunition depots, radar and command post at Stanley.\n\nExpect attacks by carrier aircraft and possibly long-range bombers from Ascension.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nPUERTO ARGENTINO AND APPROACHES\nVALID 011230 TO 011830 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 7 TO 10 KNOTS. SEA: SLIGHT.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: BROKEN.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
