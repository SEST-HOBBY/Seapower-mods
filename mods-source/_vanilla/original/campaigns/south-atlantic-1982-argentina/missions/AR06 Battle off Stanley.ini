Side0Trigger1Message=Title=<size=24>Guerra de Malvinas 1982</size>\nBATTLE OFF STANLEY\n<size=24>12 May 1982</size>\nBody=Three supply ships are approaching Port William with runway materials, aircraft spares and aviation fuel for Stanley. British frigates are moving to intercept the convoy and bombard the town.\n\nEscort each supply ship into the marked arrival zone. Sink or drive off both bombardment ships and bring at least one of the supply ships into the harbor.\n\nMainland airfields are closed by weather, leaving island-based Pucaras to support your escorts. A British submarine may be on the convoy route, and carrier air attacks are expected. Deliver all three cargoes if possible. The supplies will be needed for further operations.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nPORT WILLIAM AND PUERTO ARGENTINO APPROACHES\nVALID 121330 TO 121930 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 7 TO 10 KNOTS. SEA: SLIGHT.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: BROKEN.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.\nMAINLAND: AIRFIELDS CLOSED BY WEATHER. ISLAND-BASED AIR SUPPORT ONLY.
Trigger1TimerLabel=Convoy operation
Side0Trigger12Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=PUERTO ARGENTINO. CONVOY OPERATION COMPLETE.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. PORT WILLIAM CONFIRMS THE REQUIRED CARGO ASHORE.\n\n2. REPORT THE QUANTITIES LANDED AND THE CONDITION OF THE PORT AND SHORE INSTALLATIONS. MAINTAIN PROTECTION OF THE TRANSPORTS.\n\n3. MY CONGRATULATIONS TO YOU AND YOUR SHIPS' COMPANIES. EXCELLENT WORK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger13Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=PUERTO ARGENTINO. SUPPLIES DELIVERED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. THE PORT COMMANDER REPORTS THE REQUIRED SUPPLIES LANDED.\n\n2. END THE CONVOY OPERATION AND REPORT LOSSES AND REMAINING AMMUNITION. THE DELIVERED STORES ARE TO BE MADE AVAILABLE TO THE GARRISON.\n\n3. MY CONGRATULATIONS TO ALL WHO BROUGHT THE CONVOY THROUGH.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger14Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=PUERTO ARGENTINO. PARTIAL SUCCESS.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. GARRISON REPORTS CONFIRM PART OF THE CONVOY CARGO HAS REACHED PORT WILLIAM.\n\n2. ONLY PART OF THE CONVOY REACHED PORT WILLIAM. SECURE THE SUPPLIES LANDED AND PRESERVE THE REMAINING FORCE.\n\n3. REPORT CARGO DELIVERED, LOSSES AND DAMAGE TO THE SHORE INSTALLATIONS. FURTHER INSTRUCTIONS WILL FOLLOW.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger15Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=PUERTO ARGENTINO. CONVOY LOST.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. THE ESCORTS REPORT ALL THREE SUPPLY SHIPS LOST BEFORE DELIVERY. NO CARGO HAS REACHED PORT WILLIAM.\n\n2. THE GARRISON REMAINS WITHOUT THE RUNWAY MATERIALS, AIRCRAFT EQUIPMENT AND FUEL ASSIGNED TO IT.\n\n3. WITHDRAW THE SURVIVING ESCORTS AND REPORT CASUALTIES. A FULL ACCOUNT OF THE LOSS OF THE CONVOY IS REQUIRED.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger16Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=PUERTO ARGENTINO. DELIVERY FAILED.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. THE PORT COMMANDER REPORTS NO CARGO DELIVERED.\n\n2. BREAK OFF THE CONVOY OPERATION AND WITHDRAW THE SURVIVING FORCE. THE PLANNED SUPPLY OF THE GARRISON HAS NOT BEEN ACHIEVED.\n\n3. REPORT THE POSITION AND CONDITION OF EACH TRANSPORT AND SUBMIT AN ACCOUNT OF THE ACTION.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
