Taskforce1WindowMessage=Title=BRITISH FORCE ALERTED\nBody=Our attack has revealed our presence. Expect the frigates to begin an immediate search, supported by helicopters. Complete your attack and withdraw south through the marked withdrawal area\n\nDisengage within 30 minutes!\nButtonText=Close\nPopupStyle=Notification
