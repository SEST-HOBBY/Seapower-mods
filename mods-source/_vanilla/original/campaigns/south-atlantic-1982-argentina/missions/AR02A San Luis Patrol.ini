Taskforce1StartMessage=Title=<size=24>Guerra de Malvinas 1982</size>\nSAN LUIS PATROL\n<size=24>2 May 1982</size>\nBody=Two British frigates are expected to enter Falkland Sound from the north tonight. ARA San Luis is on station in the narrows off Fanning Head, ahead of their reported track.\n\nLie in wait and attack as the frigates enter the narrows. Sink at least one frigate, then withdraw south down the Sound. A second sinking is desirable if the tactical situation permits.\n\nExpect an immediate anti-submarine response from the frigates and their helicopters. Break contact after the attack and return south clear of the search forces.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nFALKLAND SOUND\nVALID 022300 TO 030500 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 4 TO 6 KNOTS. SEA: SMOOTH.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: BROKEN.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
