Taskforce1WinMessage=From=COMANDANTE FUERZA DE SUBMARINOS\nTo=SUBMARINE COMMANDER\nInfo=\nSubj=SAN LUIS. PATROL REPORT.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. YOUR PATROL SIGNAL CONFIRMS A BRITISH FRIGATE SUNK AND SAN LUIS CLEAR OF THE ACTION.\n\n2. RETURN SOUTH DOWN THE SOUND AND REPORT WHEN CLEAR OF ENEMY SEARCH FORCES.\n\n3. MY CONGRATULATIONS TO YOU AND YOUR SHIP'S COMPANY. EXCELLENT WORK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1WinBothMessage=From=COMANDANTE FUERZA DE SUBMARINOS\nTo=SUBMARINE COMMANDER\nInfo=\nSubj=SAN LUIS. ENEMY FRIGATES DESTROYED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. CONFIRMING RECEIPT OF YOUR PATROL REPORT AND SINKING OF BOTH ENEMY FRIGATES.\n\n2. BREAK CONTACT AND WITHDRAW SOUTH. REPORT TORPEDO EXPENDITURE AND THE CONDITION OF YOUR BOAT WHEN CLEAR.\n\n3. MY CONGRATULATIONS TO YOU AND YOUR SHIP'S COMPANY.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1LoseMessage=From=COMANDANTE DE OPERACIONES NAVALES\nTo=COMANDANTE FUERZA DE SUBMARINOS\nInfo=\nSubj=SAN LUIS. LOSS OF CONTACT.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. CONTACT WITH ARA SAN LUIS HAS BEEN LOST AT {$MissionTime}. SHE HAS NOW MISSED 3 CHECK INS.\n\n2. ARA SAN LUIS WAS LAST TASKED WITH INTERCEPTING BRITISH FRIGATE FORCE AT FALKLAND SOUND.\n\n3. WE ASSESS ARA SAN LUIS IS LOST TO BRITISH ACTION.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1TimeoutMessage=From=COMANDANTE FUERZA DE SUBMARINOS\nTo=SUBMARINE COMMANDER\nInfo=\nSubj=SAN LUIS. END PATROL.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. ALLOTTED TIME FOR THIS ACTION HAS COMPLETED AND BRITISH AIR ASSETS WILL BE ACTIVE AT FIRST LIGHT.\n\n2. BREAK CONTACT AND RETURN SOUTH DOWN THE SOUND. DO NOT DELAY WITHDRAWAL TO SEEK FURTHER TARGETS.\n\n3. REPORT THE RESULTS OF YOUR PATROL AND REMAINING TORPEDOES WHEN CLEAR.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_sink1=Sink a British frigate
Objective_sink2=Sink both frigates
