Side0Trigger7Message=Title=SEA HARRIERS INBOUND\nBody=Two Sea Harriers are approaching from the east. Our corvettes are now exposed to air attack. Prepare to engage and withdraw towards the marked area to the south-west.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger8Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=OUTER PICKET. RAID COMPLETE.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. YOUR ACTION REPORT CONFIRMS THE RADAR PICKET SUNK AND WITHDRAWAL COMPLETE.\n\n2. THE MAIN STRIKE WILL BENEFIT FROM THIS GAP IN THE BRITISH WARNING SCREEN. REPORT DAMAGE AND MISSILES REMAINING.\n\n3. WELL DONE. CONVEY MY CONGRATULATIONS TO THE OFFICERS AND MEN OF YOUR GROUP.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger9Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=COMANDANTE DE LA FLOTA DE MAR\nInfo=\nSubj=OUTER PICKET. CORVETTES LOST.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. CONTACT WITH BOTH CORVETTES HAS BEEN LOST. NEITHER SHIP HAS REPORTED CLEAR OF THE PICKET AREA.\n\n2. THE GROUP WAS LAST TASKED WITH ATTACKING THE BRITISH RADAR PICKET EAST OF THE ISLANDS. WE ASSESS BOTH SHIPS LOST TO ENEMY ACTION.\n\n3. FORWARD THEIR LAST REPORTED POSITIONS AND ALL INFORMATION CONCERNING SURVIVORS.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger10Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=OUTER PICKET. WITHDRAW BEFORE DAYLIGHT.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. FIRST LIGHT IS APPROACHING. BRITISH AIRCRAFT WILL HAVE GREATER FREEDOM TO SEARCH FOR YOUR GROUP.\n\n2. BREAK OFF THE ATTACK AND WITHDRAW SOUTH-WEST WITH THE SURVIVING CORVETTES.\n\n3. REPORT THE RESULT OF THE ATTACK, CASUALTIES AND THE CONDITION OF YOUR SHIPS WHEN CLEAR.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger14Message=Title=<size=24>Guerra de Malvinas 1982</size>\nTHE OUTER PICKET STATION\n<size=24>19 May 1982</size>\nBody=A British destroyer is reported on radar picket west of the carrier force, with a frigate in company. Your corvettes are to destroy the picket before the main attack.\n\nClose under cover of darkness and coordinate an Exocet attack. Once the picket is sunk, withdraw through the marked area to the south-west before first light at 1000Z.\n\nExpect helicopter patrols and a Sea Harrier response. Destruction of the picket will reduce British early warning of our approaching strikes.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nOUTER PICKET STATION EAST OF THE ISLANDS\nVALID 190730 TO 191330 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 7 TO 10 KNOTS. SEA: SLIGHT.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: OVERCAST.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
Objective_picket=Sink the radar picket
Objective_escort=Sink the picket's escort
Objective_away=Withdraw south-west before first light
