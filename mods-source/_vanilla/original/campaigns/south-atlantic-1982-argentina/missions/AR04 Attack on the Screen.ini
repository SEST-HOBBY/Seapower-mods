Taskforce1WinMessage=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=STRIKE FROM RÍO GRANDE. ACTION REPORT.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. AIRCREW REPORTS CONFIRM A BRITISH WARSHIP SUNK IN THE REPORTED CONTACT AREA.\n\n2. COMPLETE RECOVERY AND WITHDRAW YOUR SURFACE GROUP. REPORT TARGET IDENTIFICATIONS, AIRCRAFT LOSSES AND MISSILE EXPENDITURE.\n\n3. MY CONGRATULATIONS TO ALL WHO TOOK PART. EXCELLENT WORK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_escort=Sink a British escort
Objective_carrier=Hit a British carrier if located
Objective_recover=Recover your aircraft before the operation ends
Taskforce1RecoverMessage=Title=BRITISH WARSHIP SINKING\nBody=A British warship is sinking, but the remaining ships can still engage our aircraft. Finish attacks already in progress and recover the strike.\n\nRecover all aircraft within 30 minutes!\nButtonText=Close\nPopupStyle=Notification
