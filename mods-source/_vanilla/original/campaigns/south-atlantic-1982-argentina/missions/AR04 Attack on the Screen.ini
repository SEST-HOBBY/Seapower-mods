Taskforce1StartMessage=Title=<size=24>Guerra de Malvinas 1982</size>\nSTRIKE FROM RÍO GRANDE\n<size=24>4 May 1982</size>\nBody=A contact report places British warships south-east of Puerto Argentino. The composition of the group is unconfirmed. The British Task Force has withdrawn east, but the carriers have not been located.\n\nUse the Neptune to investigate the reported contacts, then coordinate the available air and surface forces to attack. Identify high-value targets and concentrate the strike accordingly.\n\nExpect missile-armed escorts and possible Sea Harrier patrols. Complete the attack and recover your aircraft when ordered.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nSOUTH-EAST OF PUERTO ARGENTINO\nVALID 041400 TO 042000 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 11 TO 16 KNOTS. SEA: SLIGHT.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: BROKEN.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
