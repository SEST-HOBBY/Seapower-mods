Taskforce1StartMessage=Title=<size=24>Guerra de Malvinas 1982</size>\nBREAKING CONTACT\n<size=24>2 May 1982</size>\nBody=A British nuclear submarine is believed to be tracking the force centred on General Belgrano south of the islands. Her position is unknown and an attack may be imminent.\n\nBring the cruiser west into the marked safe area off Isla de los Estados. Use Bouchard and Piedrabuena to screen the withdrawal and direct supporting patrol aircraft to search the approaches.\n\nAttack confirmed submarine contacts, but do not delay the cruiser to pursue them. Bringing General Belgrano and her crew clear of the threat is your main task.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nISLA DE LOS ESTADOS APPROACHES\nVALID 021700 TO 022300 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 7 TO 10 KNOTS. SEA: SLIGHT.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: OVERCAST.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
