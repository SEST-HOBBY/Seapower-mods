Taskforce1WinMessage=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=GENERAL BELGRANO. WITHDRAWAL COMPLETE.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. GENERAL BELGRANO HAS REACHED THE SHALLOW WATER OFF ISLA DE LOS ESTADOS. THE IMMEDIATE WITHDRAWAL TASK IS COMPLETE.\n\n2. MAINTAIN THE ANTI-SUBMARINE SCREEN AND REPORT THE CONDITION OF THE GROUP.\n\n3. MY CONGRATULATIONS TO YOU AND YOUR SHIPS' COMPANIES FOR BRINGING THE CRUISER CLEAR.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1LoseMessage=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=GENERAL BELGRANO. LOSS OF CRUISER.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. THE ESCORTS REPORT GENERAL BELGRANO TORPEDOED AND SUNK.\n\n2. RESCUE SURVIVORS AS THE TACTICAL SITUATION PERMITS. THE SUBMARINE THREAT REMAINS.\n\n3. REPORT CASUALTIES, SURVIVORS RECOVERED AND THE POSITION OF THE ESCORTS. FURTHER INSTRUCTIONS WILL FOLLOW.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1TimeoutMessage=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=GENERAL BELGRANO. CONTINUE WITHDRAWAL.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. THE BRITISH SUBMARINE APPEARS TO HAVE BROKEN CONTACT.\n\n2. CONTINUE WEST WITH GENERAL BELGRANO UNDER ESCORT. MAINTAIN SONAR WATCH AND DO NOT ASSUME THE THREAT HAS PASSED.\n\n3. REPORT WHEN THE GROUP IS CLEAR OF THE AREA.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
