Side0Trigger2Message=Title=CARRIER SINKING\nBody=British distress traffic reports a carrier burning and sinking. The escorts remain capable of engaging our aircraft and ships. Recover the strike and retire west.\n\nDisengage within 15 minutes!\nButtonText=Close\nPopupStyle=Notification
Side0Trigger3Message=Title=CARRIER WITHDRAWING\nBody=The damaged British carrier is withdrawing east. Further pursuit will take our force deeper into the escort screen. Recover the strike and retire west.\n\nBreak off attack and disengage within 15 minutes!\nButtonText=Close\nPopupStyle=Notification
Side0Trigger4Message=Title=CARRIER WITHDRAWING\nBody=The damaged British carrier is withdrawing east. Further pursuit will take our force deeper into the escort screen. Recover the strike and retire west.\n\nBreak off attack and disengage within 15 minutes!\nButtonText=Close\nPopupStyle=Notification
Side0Trigger5Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=DAMAGE REPORT\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. BRITISH DISTRESS TRAFFIC AND REPORTS FROM THE STRIKE CONFIRM AN ENEMY CARRIER SUNK.\n\n2. WITHDRAW WEST AND REPORT AIRCRAFT LOSSES, DAMAGE AND AMMUNITION STATES.\n\n3. YOU HAVE STRUCK A MAJOR BLOW AGAINST BRITISH AIR SUPPORT FOR THE LANDING. MY CONGRATULATIONS TO THE SHIPS AND AIRCREWS ENGAGED.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger6Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=CARRIERS WITHDRAWING\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. RECONNAISSANCE REPORTS A DAMAGED BRITISH CARRIER RETIRING EAST. HER WITHDRAWAL REDUCES AIR SUPPORT AVAILABLE TO THE LANDING FORCE.\n\n2. BREAK OFF PURSUIT AND WITHDRAW WEST. REPORT CASUALTIES AND THE CONDITION OF YOUR FORCE.\n\n3. CONVEY MY THANKS TO THE SHIPS AND AIRCREWS WHO PRESSED HOME THE ATTACK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger8Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=DISENGAGE\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. THE WINDOW FOR OUR ATTACK HAS CLOSED. NO CARRIER HAS BEEN CONFIRMED SUNK OR DRIVEN OFF.\n\n2. RECOVER THE STRIKE AND WITHDRAW WEST. FURTHER ATTACKS REQUIRE NEW ORDERS.\n\n3. REPORT CASUALTIES AND THEN PREPARE A FULL ACCOUNT OF THE ACTION.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger15Message=Title=BRITISH FORCE ALERTED\nBody=Our attack has alerted the British force. Expect the carriers to withdraw east under cover of their escorts. Press home the strike while they remain within reach.\n\nWe have 1 hour to complete the strike before the British will be out of range!\nButtonText=Close\nPopupStyle=Notification
Side0Trigger17Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=DAMAGE REPORT\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. ACTION REPORTS CONFIRM TWO BRITISH ESCORTS DESTROYED.\n\n2. WITH BOTH CARRIERS ALREADY LOST, THESE FURTHER LOSSES REDUCE THE FORCE AVAILABLE TO COVER A LANDING. WITHDRAW WEST AND REPORT THE CONDITION OF YOUR GROUP.\n\n3. MY CONGRATULATIONS TO THE SHIPS' COMPANIES AND AIRCREWS.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger19Message=Title=<size=24>Guerra de Malvinas 1982</size>\nATTACK ON THE TASK FORCE\n<size=24>19 May 1982</size>\nBody=British forces east of the Malvinas are preparing to support a landing. Command has ordered a coordinated strike against the surviving force.\n\nUse the reconnaissance aircraft to locate the enemy and then coordinate air and surface attacks. Sink or damage at least two of the task force ships to force their withdrawal.\n\nEnemy submarines are expected to form a picket line west of their Task Force. We are supported by aircraft from the mainland, and command has allocated one C-130 tanker to help keep our aircraft on station. Hit the enemy and then retire west when ordered.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nCARRIER OPERATING AREA EAST OF THE ISLANDS\nVALID 191330 TO 191930 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 7 TO 10 KNOTS. SEA: SLIGHT.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: BROKEN.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
Objective_carrier=Sink or damage a British carrier
Objective_escorts=Sink two British escorts
