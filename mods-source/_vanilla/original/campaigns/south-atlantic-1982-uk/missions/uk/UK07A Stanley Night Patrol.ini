Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nSTANLEY NIGHT PATROL\n<size=24>6 June 1982</size>\nBody=Argentine forces continue to supply the Stanley garrison by air, using low-level C-130 flights under cover of darkness. Intelligence indicates two transports are expected within the next 45 minutes.\n\nPatrol the eastern approaches and intercept the transports before they land. Your surface forces are also to bombard the fuel depot at Stanley airfield.\n\nA coastal supply vessel is also attempting to reach Stanley. Intercept and destroy it if encountered. Complete any two of the three tasks and preserve at least one patrol ship.\n\nComplete operations within one hour, and withdraw east before daylight makes mainland air attack possible.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=Forecast 0030Z to 0130Z. Broken cloud. Wind north-west. Sea state 3. Night visibility.
Side0Trigger23Message=Title=MISSION FAILED\nBody=Defeat! All of our ships assigned to the patrol have been lost!\nButtonText=Close\nPopupStyle=Outro
Side0Trigger24Message=Title=MISSION ACCOMPLISHED\nBody=Excellent work, Commander. Interdiction operations are complete. Withdraw east to rejoin the task force.\nButtonText=Close\nPopupStyle=Outro
Side0Trigger25Message=Title=PATROL INCOMPLETE\nBody=The patrol window has closed and we were unable to complete our mission on time. Withdraw east before daylight.\nButtonText=Close\nPopupStyle=Outro
Objective_Patrol=Complete any two supply-denial tasks
Objective_Survive=At least one patrol ship must survive
Objective_Airlift=Stop both C-130 deliveries before they reach Stanley
Objective_Coaster=Stop the coastal supply vessel before it reaches harbour
Objective_Fuel=Destroy the marked Stanley fuel stores
