Side0Trigger1Message=Title=<size=24>福克兰群岛战争1982</size>\n斯坦利夜间巡逻\n<size=24>1982年6月6日</size>\nBody=阿根廷军队正利用夜色掩护，通过低空飞行的C-130运输机继续向斯坦利提供补给。情报显示未来45分钟内将有两架运输机抵达。\n\n在东部航道巡逻，拦截尚未降落的运输机。此外，你的水面部队需要炮击斯坦利机场的燃料库。\n\n一艘近海补给船也在尝试前往斯坦利。如果与其遭遇，需进行拦截并将其摧毁。你需要完成上述三项任务中的任意两项，并且确保至少一艘巡逻船只不被击沉。\n\n务必在一小时内完成行动并在天亮前向东撤离，以防敌方从本土发动空袭。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=预报时段：0030Z时至0130Z时。云量：多云。风向：西北风。海况：3级。
Side0Trigger23Message=Title=任务失败！\nBody=任务失败！所有分配至巡逻任务的船只已被击沉！\nButtonText=关闭\nPopupStyle=Outro
Side0Trigger24Message=Title=任务完成！\nBody=干得好，指挥官。拦截行动已完成。向东撤离，与特遣舰队会合。\nButtonText=关闭\nPopupStyle=Outro
Side0Trigger25Message=Title=未完成巡逻\nBody=巡逻窗口期已结束，我们未能按时完成任务。在天亮前向东撤离。\nButtonText=关闭\nPopupStyle=Outro
Objective_Patrol=完成任意两项补给破坏任务
Objective_Survive=至少一艘巡逻船只不被击沉
Objective_Airlift=在两架C-130运输机抵达斯坦利前进行拦截
Objective_Coaster=在近海补给船抵达港口前进行拦截
Objective_Fuel=摧毁标记的斯坦利燃料库
