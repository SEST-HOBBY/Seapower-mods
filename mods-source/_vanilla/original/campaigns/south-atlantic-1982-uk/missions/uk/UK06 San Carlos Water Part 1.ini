Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nSAN CARLOS WATER PART 1\n<size=24>21 May 1982</size>\nBody=Our forces have landed at San Carlos Water on West Falkland, taking the Argentine forces by surprise. Unloading operations are underway, but heavy air attack from both the island airbases and the mainland is expected. Protect the anchorage and fight off the Argentine air attacks.\n\nDefend the anchorage for seventy-five minutes and until air attacks cease.\n\nExpect repeated low-level air attacks. Position the screen and CAP to intercept aircraft before they reach the anchorage.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: SAN CARLOS WATER\nVALID: 211400Z MAY 82 TO 212000Z MAY 82\nWIND: W FORCE 3. SEA: SLIGHT.\nCLOUD: CLEAR. WEATHER: MAINLY DRY. VISIBILITY: GOOD OUTSIDE LOW CLOUD.\nPRESSURE: 1002 MB, LITTLE CHANGE.\nOUTLOOK: WIND W FORCE 4
Side0Trigger41Message=Title=MISSION FAILED\nBody=Defeat! Four amphibious ships have been lost across the San Carlos operations. The remaining lift cannot sustain the force ashore.\nButtonText=Close\nPopupStyle=Outro
Side0Trigger43Message=Title=MISSION ACCOMPLISHED\nBody=The attacks have cleared. At least seven of the ten amphibious ships remain afloat. Losses carry forward to UK07, with no more than three permitted across both missions. Report losses and remaining ammunition.\nButtonText=Close\nPopupStyle=Outro
Side0Trigger46Message=From=CTG 317.8\nTo=ALL UNITS\nInfo=CINCFLEET\nSubj=GOOSE GREEN OPERATIONS COMPLETED\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. To all units: Goose Green installations are reported suppressed and airfield effectiveness is assessed to be greatly reduced.\n\n2. Cease fire on Goose Green and return to station to defend against air attacks.\nButtonText=Close\nPopupStyle=NavalMessage
Objective_DefendAnchorage=Defend the anchorage for 75 minutes until attacks cease
Objective_PreserveLandingWave=Lose no more than 3 amphibious ships
[Language_cn]
Name=06圣卡洛斯湾第1部分
Description=我方部队已在西福克兰岛的圣卡洛斯湾登陆，令阿根廷军队措手不及。目前卸载作业正在进行，但预计敌方将从岛屿基地和本土发动猛烈空袭。保护好锚地，击退阿根廷的空中攻势。
