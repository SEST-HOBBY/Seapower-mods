Side0Trigger1Message=Title=<size=24>福克兰群岛战争1982</size>\n圣卡洛斯湾第1部分\n<size=24>1982年5月21日</size>\nBody=我方部队已在西福克兰岛的圣卡洛斯湾登陆，令阿根廷军队措手不及。目前卸载作业正在进行，但预计敌方将从岛屿基地和本土发动猛烈空袭。保护好锚地，击退阿根廷的空中攻势。\n\n防御锚地75分钟，直到空袭停止。\n\n预计敌方将发动多次低空攻击。将防空网和战斗空中巡逻部署到位，在敌机抵达锚地前拦截。\nButtonText=开始任务\nPopupStyle=Intro
Side0Trigger41Message=Title=任务失败！\nBody=任务失败！4艘两栖船只已在圣卡洛斯的行动中损毁。剩余投送能力已无法支撑岸上部队。\nButtonText=关闭\nPopupStyle=Outro
Side0Trigger43Message=Title=任务完成！\nBody=空袭已结束。10艘两栖船只中还有至少7艘尚未被击沉。损失情况将累计至下一项任务，两项任务合计的船只损失数不得超过3艘。报告损失和剩余弹药情况。\nButtonText=关闭\nPopupStyle=Outro
Objective_PreserveLandingWave=损失的两栖船只不超过3艘
Objective_DefendAnchorage=防御锚地75分钟，直到空袭停止
