Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nSAN CARLOS WATER PART 1\n<size=24>21 May 1982</size>\nBody=Our forces have landed at San Carlos Water on West Falkland, taking the Argentine forces by surprise. Unloading operations are underway, but heavy air attack from both the island airbases and the mainland is expected. Protect the anchorage and fight off the Argentine air attacks.\n\nDefend the anchorage for seventy-five minutes and until air attacks cease. Protect all ten amphibious ships, including the five Round Table LSLs. No more than three amphibious ships may be lost across UK06 and UK07 combined. The fourth loss causes defeat.\n\nExpect repeated low-level air attacks. Position the screen and CAP to intercept aircraft before they reach the anchorage.\nButtonText=Start mission\nPopupStyle=Intro
