[Language_cn]
Taskforce1StartMessage=Title=<size=24>福克兰群岛战争1982</size>\n福克兰海峡\n<size=24>1982年5月11日</size>\nBody=你的船只已收到命令从福克斯湾出发，向北扫荡福克兰海峡。侦察阿根廷的剩余防御工事并与遭遇的任何船只或岸上阵地交战，最后从北部离开海峡。\n\n避开报告中的雷区并随时保持对水面、空中和水下的监视。最新报告显示圣路易斯号潜艇出现在了群岛以北，但其目前位置尚不明确。堡垒攻击机可能会在你通过海峡时从佩布尔岛靠近。\nButtonText=开始任务\nPopupStyle=Intro
Description=我们计划登陆圣卡洛斯，但在此之前需扫荡福克兰海峡。从福克斯湾派出一艘船只向北航行，侦察剩余的阿根廷防御工事并在必要时进行交战，之后从北部出口离开。
Name=05福克兰海峡
