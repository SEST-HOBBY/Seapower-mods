Taskforce1PlayervictoryMessage=Title=MISSION ACCOMPLISHED\nBody=Victory! Our ship has completed the sweep of Falkland Sound and cleared the northern exit. Excellent work, Commander.\nButtonText=Close\nPopupStyle=Outro
