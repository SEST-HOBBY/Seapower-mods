[Language_vn]
Taskforce1StartMessage=Title=<size=24>Chiến tranh Falkland 1982</size>\nEO BIỂN FALKLAND\n<size=24>Ngày 11 tháng 5 năm 1982</size>\nBody=Tàu của bạn được giao nhiệm vụ quét eo biển Falkland về phía bắc từ Fox Bay. Trinh sát các vị trí phòng thủ Argentina còn lại và giao chiến với mọi tàu thuyền hoặc vị trí trên bờ của địch gặp phải. Rời eo biển qua lối vào phía bắc.\n\nTránh xa bãi mìn được báo cáo. ARA San Luis được báo cáo lần cuối ở phía bắc quần đảo, nhưng vị trí hiện tại chưa rõ. Máy bay cường kích Pucara có thể tiếp cận từ Pebble Island trong hành trình.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Description=Quét eo biển Falkland trước cuộc đổ bộ dự kiến tại San Carlos. Dẫn một tàu từ Fox Bay tiến về phía bắc, trinh sát các vị trí phòng thủ Argentina còn lại và giao chiến khi cần thiết trước khi rời qua lối ra phía bắc.
Name=UK05 Falkland Sound
