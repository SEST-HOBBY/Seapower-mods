[Language_ja]
Taskforce1StartMessage=Title=<size=24>フォークランド紛争 1982</size>\nフォークランド海峡\n<size=24>1982年5月11日</size>\nBody=貴艦はフォックス湾から北へフォークランド海峡を掃討する任務を受けた。残存するアルゼンチン軍の防御陣地を偵察し、遭遇した敵船舶や沿岸陣地と交戦せよ。北側の進入路から海峡を離脱せよ。\n\n報告された機雷原を避けよ。アルゼンチン海軍サン・ルイスの最終報告位置は諸島北方だが、現在位置は不明。通過中、ペブル島からプカラ攻撃機が接近する可能性がある。\nButtonText=任務開始\nPopupStyle=Intro
Description=サンカルロスへの上陸に先立ち、フォークランド海峡を掃討せよ。艦艇1隻を率いてフォックス湾から北上し、残存するアルゼンチン軍の防御陣地を偵察、必要に応じて攻撃した後、北側の出口から離脱せよ。
Name=UK05 Falkland Sound
