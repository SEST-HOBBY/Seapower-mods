[Language_ko]
Taskforce1StartMessage=Title=<size=24>포클랜드 전쟁 1982</size>\n포클랜드 해협\n<size=24>1982년 5월 11일</size>\nBody=아군 함정은 폭스만에서 북쪽으로 포클랜드 해협을 수색하라는 임무를 받았습니다. 남아 있는 아르헨티나 방어 진지를 조사하고 조우하는 모든 적 함선이나 해안 진지와 교전하십시오. 북쪽 접근로를 통해 해협을 벗어나십시오.\n\n보고된 기뢰밭을 피하십시오. 아르헨티나 해군 산루이스는 마지막으로 제도 북쪽에서 보고되었으나 현재 위치는 알 수 없습니다. 통과 중 페블섬에서 푸카라 공격기가 접근할 수 있습니다.\nButtonText=임무 시작\nPopupStyle=Intro
Description=산카를로스 상륙에 앞서 포클랜드 해협을 수색하십시오. 함정 한 척을 이끌고 폭스만에서 북상하여 남아 있는 아르헨티나군 방어 시설을 정찰하고 필요에 따라 교전한 뒤 북쪽 출구로 이탈하십시오.
Name=UK05 Falkland Sound
