[Language_es]
Taskforce1StartMessage=Title=<size=24>Guerra de las Malvinas 1982</size>\nESTRECHO DE SAN CARLOS\n<size=24>11 de mayo de 1982</size>\nBody=Tu buque tiene la misión de explorar el estrecho de San Carlos hacia el norte desde Bahía Fox. Investiga las defensas argentinas restantes y ataca cualquier buque hostil o posición costera que encuentres. Sal del estrecho por el acceso norte.\n\nMantente alejado del campo de minas señalado. El último informe situaba al ARA San Luis al norte de las islas, pero su ubicación actual se desconoce. Durante el tránsito pueden aproximarse aviones de ataque Pucará desde la isla Borbón.\nButtonText=Iniciar misión\nPopupStyle=Intro
Description=Explora el estrecho de San Carlos antes de nuestros desembarcos previstos en San Carlos. Lleva un buque hacia el norte desde Bahía Fox, investiga las defensas argentinas restantes y ataca según sea necesario antes de salir por el extremo norte.
Name=UK05 Falkland Sound
