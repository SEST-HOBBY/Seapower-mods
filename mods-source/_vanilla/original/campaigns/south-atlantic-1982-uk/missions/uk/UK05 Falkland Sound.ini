[Language_fr]
Taskforce1StartMessage=Title=<size=24>Guerre des Malouines 1982</size>\nDÉTROIT DE FALKLAND\n<size=24>11 mai 1982</size>\nBody=Votre navire a reçu pour mission de reconnaître le détroit de Falkland vers le nord depuis Fox Bay. Examinez les défenses argentines restantes et engagez tout navire hostile ou position côtière rencontré. Quittez le détroit par l’accès nord.\n\nRestez à l’écart du champ de mines signalé. Le dernier signalement de l’ARA San Luis le situait au nord des îles, mais sa position actuelle est inconnue. Des avions d’attaque Pucara peuvent approcher depuis Pebble Island pendant le transit.\nButtonText=Commencer la mission\nPopupStyle=Intro
Description=Reconnaissez le détroit de Falkland avant nos débarquements prévus à San Carlos. Faites route au nord depuis Fox Bay avec un navire, examinez les défenses argentines restantes et engagez-les si nécessaire avant de franchir la sortie nord.
Name=UK05 Falkland Sound
