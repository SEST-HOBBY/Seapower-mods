Taskforce1StartMessage=Title=<size=24>Falklands War 1982</size>\nFALKLAND SOUND\n<size=24>11 May 1982</size>\nBody=Your ship has been tasked to sweep the Falkland Sound north from Fox Bay. Investigate the remaining Argentine defences and engage any hostile shipping or shore positions encountered. Exit the sound through the northern approach.\n\nKeep clear of the reported minefield. ARA San Luis was last reported north of the islands, but her location is unknown. Pucara attack aircraft may approach from Pebble Island during the transit.\nButtonText=Start mission\nPopupStyle=Intro
