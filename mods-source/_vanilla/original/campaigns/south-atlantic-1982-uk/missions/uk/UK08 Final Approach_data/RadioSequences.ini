# GOLF 1-1 and CHARLIE 2-0 are invented, no reference found of actual callsigns used in the Falklands, replace if we find the right ones later on
[Language_en]
Speaker_Vulcan=VULCAN XM597 (No. 50 Squadron)
Speaker_Hermes=HMS HERMES
Vulcan_CheckIn_Line1=Hello Hermes, this is Vulcan X-Ray Mike Five Niner Seven. Approaching from the north, armed with Shrike. We are ready to engage enemy radar positions at Stanley. Over.
Vulcan_CheckIn_Line2=Good morning Five Niner Seven, this is Hermes. Roger. Task Force ships are closing the coast at this time for bombardment. Thank you for the support and have a nice flight. Out.
Speaker_ShoreObserver=GOLF 1-1 (148 Cdo Forward Observation Team)
Speaker_GunfireOne=CHARLIE 2-0 (Task Force Bombardment Ships)
PortHarriet_Announce_Line1=Hello Charlie Two Zero, this is Golf One One. Fire mission: enemy coastal guns and observation post at Port Harriet. Targets marked. Over.
PortHarriet_Announce_Line2=Hello Golf One One, Charlie Two Zero. Roger. Gun position and observation post. Stand by for fire. Out.
SapperHill_Announce_Line1=Charlie Two Zero, this is Golf One One. Targets at Port Harriet are destroyed. Good shooting.
SapperHill_Announce_Line2=Charlie Two Zero, this is Golf One One. Further fire mission: enemy guns, radar, and communication sites on Sapper Hill. Targets marked. Over.
SapperHill_Announce_Line3=Golf One One, Charlie Two Zero. Roger. Sapper Hill targets received. Stand by for fire. Out.
Stanley_Announce_Line1=Charlie Two Zero, this is Golf One One. Sapper Hill targets are long gone. Good shooting, lads.
Stanley_Announce_Line2=Charlie Two Zero, this is Golf One One. Further fire mission: remaining enemy coastal guns and artillery around Stanley. Our troops cannot advance before they are destroyed. Targets marked, over.
Stanley_Announce_Line3=Golf One One, Charlie Two Zero. Roger. Stanley gun positions received. Stand by for fire. Out.
Final_Report_Line1=Charlie Two Zero, this is Golf One One. All designated targets destroyed and the lads are advancing in good order. Good shooting, and thank you for your support. Out.
