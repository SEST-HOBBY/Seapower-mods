[Language_es]
Side0Trigger2Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=OPERACIÓN CORPORATE. UNIDAD DE SUPERFICIE ENEMIGA.\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. SIGINT INDICA UNA CORBETA CLASE DRUMMOND AL OESTE DE FOX BAY, PROBABLEMENTE EN APOYO DE BUQUES ARGENTINOS QUE BURLAN EL BLOQUEO.\n\n2. SU ARMAMENTO INCLUYE CUATRO MISILES MM38 EXOCET. ALCANCE ESTIMADO DE 22 MILLAS NÁUTICAS.\n\n3. SI LA SITUACIÓN TÁCTICA LO PERMITE, ATAQUE Y DESTRUYA ESTE BUQUE. EN CASO CONTRARIO, RETÍRESE SIN ENTRAR EN EL ALCANCE DE SUS MISILES.\nButtonText=Acusar recibo y continuar\nPopupStyle=NavalMessage
Side0Trigger8Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=OPERACIÓN CORPORATE. INCURSIÓN EN FOX BAY.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. CONFIRMO RECEPCIÓN DE SU INFORME DE COMBATE Y EL HUNDIMIENTO DE LOS BUQUES ENEMIGOS QUE BURLABAN EL BLOQUEO, ASÍ COMO LA REDUCCIÓN DE LAS RESERVAS ENEMIGAS EN FOX BAY.\n\n2. MIS FELICITACIONES A USTED Y A LAS DOTACIONES DE SUS BUQUES.\n\n3. RETÍRENSE HACIA EL SUR E INFORMEN UNA VEZ ALEJADOS DE LA COSTA. EXCELENTE TRABAJO.\nButtonText=Cerrar\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger1Message=Title=<size=24>Guerra de las Malvinas 1982</size>\nINCURSIÓN EN FOX BAY\n<size=24>2 de mayo de 1982</size>\nBody=Las fuerzas argentinas utilizan pequeños cargueros costeros para burlar el bloqueo y reabastecer a sus fuerzas en las islas Malvinas. Se le ha encomendado atacar el fondeadero de Fox Bay para destruir los buques costeros y los suministros en tierra.\n\nUna vez completado, retírese al sur a la máxima velocidad posible. Hay fuerzas argentinas en la zona y deben ser destruidas si se encuentran.\nButtonText=Iniciar misión\nPopupStyle=Intro
