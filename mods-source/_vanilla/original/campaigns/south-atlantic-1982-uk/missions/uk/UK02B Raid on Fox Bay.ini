Side0Trigger3Message=Title=已摧毁补给船\nBody=两艘阿根廷补给船已被摧毁！继续完成剩余的突袭任务，在收到命令时向南撤离。\nButtonText=关闭\nPopupStyle=Notification
Side0Trigger4Message=Title=已摧毁补给库存\nBody=福克斯湾的燃料和弹药库存已被摧毁！继续完成剩余的突袭任务，在收到命令时向南撤离。\nButtonText=关闭\nPopupStyle=Notification
