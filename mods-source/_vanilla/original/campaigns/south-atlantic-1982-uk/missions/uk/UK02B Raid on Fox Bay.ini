[Language_ja]
Side0Trigger2Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=コーポレート作戦。敵水上艦艇。\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. 電波情報によれば、フォックス湾西方にドゥルモン級コルベット1隻が存在。アルゼンチンの封鎖突破船を支援しているものと推定。\n\n2. 兵装にはMM38エグゾセミサイル4発を含む。推定射程22海里。\n\n3. 戦術状況が許せば交戦し、同艦を撃破せよ。さもなくば、そのミサイル射程内に入ることなく撤退せよ。\nButtonText=確認して続行\nPopupStyle=NavalMessage
Side0Trigger8Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=コーポレート作戦。フォックス湾襲撃。\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. 貴官の戦闘報告を受領。敵封鎖突破船の撃沈ならびにフォックス湾の敵物資備蓄への打撃を確認。\n\n2. 貴官ならびに所属各艦の乗員の健闘を称える。\n\n3. 南へ離脱し、沿岸を離れたら報告せよ。見事な働きであった。\nButtonText=閉じる\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger1Message=Title=<size=24>フォークランド紛争 1982</size>\nフォックス湾襲撃\n<size=24>1982年5月2日</size>\nBody=アルゼンチン軍は小型沿岸貨物船を封鎖突破船として使用し、フォークランド諸島の部隊に補給している。フォックス湾の泊地を襲撃し、沿岸輸送船と陸上の補給物資を破壊せよ。\n\n完了後、可能な限り高速で南へ撤退せよ。付近にはアルゼンチン軍が存在する。遭遇した場合は撃破せよ。\nButtonText=任務開始\nPopupStyle=Intro
