[Language_vn]
Side0Trigger2Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=CHIẾN DỊCH CORPORATE. TÀU MẶT NƯỚC ĐỊCH.\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. TÌNH BÁO TÍN HIỆU CHO THẤY CÓ MỘT TÀU HỘ VỆ LỚP DRUMMOND Ở PHÍA TÂY FOX BAY, CÓ THỂ ĐANG HỖ TRỢ CÁC TÀU VƯỢT PHONG TỎA ARGENTINA.\n\n2. VŨ KHÍ BAO GỒM BỐN TÊN LỬA MM38 EXOCET. TẦM BẮN ƯỚC TÍNH 22 HẢI LÝ.\n\n3. NẾU TÌNH HÌNH CHIẾN THUẬT CHO PHÉP, HÃY GIAO CHIẾN VÀ TIÊU DIỆT TÀU NÀY. NẾU KHÔNG, RÚT LUI MÀ KHÔNG ĐI VÀO TẦM TÊN LỬA CỦA NÓ.\nButtonText=Xác nhận và tiếp tục\nPopupStyle=NavalMessage
Side0Trigger8Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=CHIẾN DỊCH CORPORATE. TẬP KÍCH FOX BAY.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. XÁC NHẬN ĐÃ NHẬN BÁO CÁO TÁC CHIẾN CỦA ĐỒNG CHÍ, VIỆC ĐÁNH CHÌM CÁC TÀU VƯỢT PHONG TỎA CỦA ĐỊCH VÀ LÀM SUY GIẢM KHO VẬT TƯ ĐỊCH TẠI FOX BAY.\n\n2. XIN CHÚC MỪNG ĐỒNG CHÍ VÀ TOÀN THỂ THỦY THỦ CÁC TÀU.\n\n3. RÚT VỀ PHÍA NAM VÀ BÁO CÁO KHI ĐÃ RỜI XA BỜ BIỂN. LÀM RẤT TỐT.\nButtonText=Đóng\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger1Message=Title=<size=24>Chiến tranh Falkland 1982</size>\nTẬP KÍCH FOX BAY\n<size=24>Ngày 2 tháng 5 năm 1982</size>\nBody=Lực lượng Argentina đang dùng các tàu hàng ven bờ nhỏ để vượt phong tỏa và tiếp tế cho lực lượng của họ tại quần đảo Falkland. Bạn được giao nhiệm vụ tập kích khu neo đậu Fox Bay để tiêu diệt tàu vận tải ven bờ và phá hủy vật tư trên bờ.\n\nSau khi hoàn thành, rút về phía nam với tốc độ nhanh nhất có thể. Lực lượng Argentina hiện diện trong khu vực và cần bị tiêu diệt nếu chạm trán.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
