Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nRAID ON FOX BAY\n<size=24>2 May 1982</size>\nBody=Argentine forces are using small coastal freighters as blockade runners to resupply their forces in the Falkland Islands. You have been tasked to raid the anchorage at Fox Bay to destroy the coastal shipping and supplies ashore.\n\nOnce complete, retire south at best speed. Argentine forces are present in the area and should be destroyed if encountered.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: FOX BAY\nVALID: 020955Z MAY 82 TO 021555Z MAY 82\nWIND: N FORCE 3. SEA: SLIGHT.\nCLOUD: BROKEN. WEATHER: MAINLY DRY. VISIBILITY: GOOD OUTSIDE LOW CLOUD.\nPRESSURE: 1031 MB, FALLING.\nOUTLOOK: WIND NW FORCE 5
Side0Trigger2Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=OPERATION CORPORATE. ENEMY SURFACE UNIT.\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. SIGINT INDICATES A DRUMMOND CLASS CORVETTE WEST OF FOX BAY, PROBABLY SUPPORTING ARGENTINE BLOCKADE RUNNERS.\n\n2. ARMAMENT INCLUDES FOUR MM38 EXOCET MISSILES. ASSESSED RANGE 22 NAUTICAL MILES.\n\n3. IF TACTICAL SITUATION PERMITS ENGAGE AND DESTROY THIS SHIP. OTHERWISE RETIRE WITHOUT ENTERING ITS MISSILE RANGE.\nButtonText=Acknowledge & continue\nPopupStyle=NavalMessage
Side0Trigger3Message=Title=SUPPLY SHIPS DESTROYED\nBody=Both Argentine supply ships have been destroyed! Complete any remaining raid tasks, then retire south when ordered.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger4Message=Title=SUPPLY STORES DESTROYED\nBody=The Fox Bay fuel and ammunition stores have been destroyed! Complete any remaining raid tasks, then retire south when ordered.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger5Message=Title=WITHDRAWAL ORDER\nBody=Both coastal craft and the Fox Bay fuel and ammunition stores have been destroyed. The southern withdrawal area is now marked. Withdraw at least one surviving raiding ship south and clear the coast.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger8Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=OPERATION CORPORATE. FOX BAY RAID.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. CONFIRMING RECEIPT OF YOUR ACTION REPORT AND SINKING OF ENEMY BLOCKADE RUNNING SHIPS WITH REDUCTION OF THE ENEMY STORES AT FOX BAY.\n\n2. MY CONGRATULATIONS TO YOU AND YOUR SHIPS' COMPANIES.\n\n3. CLEAR SOUTH AND REPORT ONCE CLEAR OF COAST. EXCELLENT WORK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger9Message=Title=ENEMY CORVETTE DESTROYED\nBody=The Drummond-class corvette has been destroyed. Continue the raid or withdraw south as ordered.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger10Message=Title=MISSION FAILED\nBody=Defeat! All ships assigned to the Fox Bay raid have been sunk!\nButtonText=Close\nPopupStyle=Outro
