[Language_cn]
Side0Trigger2Message=From=第317.8特遣大队指挥官\nTo={SelectedUnitName}\nInfo=\nSubj=共同行动——敌方水面单位\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1.信号情报显示德拉蒙德级轻护卫舰出现在了福克斯湾以西，可能是在支援阿根廷封锁突破船。\n\n2.此船只携带4枚MM38飞鱼导弹，射程22海里。\n\n3.如果战术态势允许，与此船只交战并将其摧毁，否则需避免进入其导弹射程。\nButtonText=收到并继续\nPopupStyle=NavalMessage
Side0Trigger8Message=From=第317.8特遣大队指挥官\nTo={SelectedUnitName}\nInfo=\nSubj=共同行动——突袭‌福克斯湾\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1.已收到你的行动报告，报告显示你击沉了敌方封锁突破船，并且摧毁了敌方在福克斯湾的储备物资。\n\n2.我向你和你部下的各舰官兵表示祝贺。\n\n3.向南撤离，远离海岸后立即报告。干得好。\nButtonText=关闭\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger1Message=Title=<size=24>福克兰群岛战争1982</size>\n突袭‌福克斯湾\n<size=24>1982年5月2日</size>\nBody=阿根廷军队将小型近海货船作为封锁突破船，正向其驻扎在福克兰群岛的部队运送补给。你的任务是突袭福克斯湾锚地，摧毁当地的近海运输船和岸上补给。\n\n完成任务后，以最佳速度向南撤离。此区域内有阿根廷军队，在遭遇时将其摧毁。\nButtonText=开始任务\nPopupStyle=Intro
