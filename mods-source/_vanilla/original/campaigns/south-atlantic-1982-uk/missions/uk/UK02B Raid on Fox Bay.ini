[Language_ko]
Side0Trigger2Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=코퍼레이트 작전. 적 수상함.\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. 신호정보에 따르면 폭스만 서쪽에 드루몬드급 초계함 한 척이 있으며, 아르헨티나 봉쇄 돌파선을 지원하는 것으로 추정됨.\n\n2. 무장에는 MM38 엑조세 미사일 4발이 포함됨. 추정 사거리 22해리.\n\n3. 전술 상황이 허용하면 교전하여 해당 함정을 격파할 것. 그렇지 않으면 적 미사일 사거리에 진입하지 않고 철수할 것.\nButtonText=확인 후 계속\nPopupStyle=NavalMessage
Side0Trigger8Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=코퍼레이트 작전. 폭스만 기습.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. 귀관의 전투 보고 수신을 확인하며 적 봉쇄 돌파선 격침 및 폭스만 적 보급품 비축량 감소를 확인함.\n\n2. 귀관과 예하 각 함의 모든 승조원의 노고를 치하함.\n\n3. 남쪽으로 이탈하고 연안에서 벗어나면 보고할 것. 훌륭히 수행했음.\nButtonText=닫기\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger1Message=Title=<size=24>포클랜드 전쟁 1982</size>\n폭스만 기습\n<size=24>1982년 5월 2일</size>\nBody=아르헨티나군은 소형 연안 화물선을 봉쇄 돌파선으로 사용하여 포클랜드 제도의 자국군에 보급하고 있습니다. 폭스만 정박지를 기습하여 연안 수송선과 육상 보급품을 파괴하라는 임무를 받았습니다.\n\n임무를 마치면 가능한 최고 속력으로 남쪽으로 철수하십시오. 이 지역에 아르헨티나군이 있으며, 조우하면 격파해야 합니다.\nButtonText=임무 시작\nPopupStyle=Intro
