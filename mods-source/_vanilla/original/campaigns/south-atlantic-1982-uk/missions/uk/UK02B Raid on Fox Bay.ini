[Language_fr]
Side0Trigger2Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=OPÉRATION CORPORATE. UNITÉ DE SURFACE ENNEMIE.\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. LE RENSEIGNEMENT ÉLECTROMAGNÉTIQUE SIGNALE UNE CORVETTE DE CLASSE DRUMMOND À L’OUEST DE FOX BAY, PROBABLEMENT EN SOUTIEN DES NAVIRES ARGENTINS FORÇANT LE BLOCUS.\n\n2. SON ARMEMENT COMPREND QUATRE MISSILES MM38 EXOCET. PORTÉE ESTIMÉE À 22 MILLES MARINS.\n\n3. SI LA SITUATION TACTIQUE LE PERMET, ENGAGEZ ET DÉTRUISEZ CE BÂTIMENT. SINON, RETIREZ-VOUS SANS ENTRER À PORTÉE DE SES MISSILES.\nButtonText=Accuser réception et continuer\nPopupStyle=NavalMessage
Side0Trigger8Message=From=CTG 317.8\nTo={SelectedUnitName}\nInfo=\nSubj=OPÉRATION CORPORATE. RAID SUR FOX BAY.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. JE CONFIRME LA RÉCEPTION DE VOTRE COMPTE RENDU DE COMBAT, LE NAUFRAGE DES NAVIRES ENNEMIS FORÇANT LE BLOCUS ET LA RÉDUCTION DES STOCKS ENNEMIS À FOX BAY.\n\n2. MES FÉLICITATIONS À VOUS ET AUX ÉQUIPAGES DE VOS BÂTIMENTS.\n\n3. DÉGAGEZ VERS LE SUD ET RENDEZ COMPTE UNE FOIS ÉLOIGNÉS DE LA CÔTE. EXCELLENT TRAVAIL.\nButtonText=Fermer\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger1Message=Title=<size=24>Guerre des Malouines 1982</size>\nRAID SUR FOX BAY\n<size=24>2 mai 1982</size>\nBody=Les forces argentines utilisent de petits cargos côtiers pour forcer le blocus et ravitailler leurs forces aux îles Falkland. Vous avez reçu pour mission d’attaquer le mouillage de Fox Bay afin de détruire les navires côtiers et les approvisionnements à terre.\n\nUne fois la mission accomplie, retirez-vous vers le sud à la meilleure vitesse possible. Des forces argentines sont présentes dans la zone et doivent être détruites si vous les rencontrez.\nButtonText=Commencer la mission\nPopupStyle=Intro
