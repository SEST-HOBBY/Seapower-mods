Side0Trigger1Message=Title=<size=24>フォークランド紛争 1982</size>\nパラケット作戦\n<size=24>1982年4月25日</size>\nBody=アルゼンチン特殊部隊が、遠隔地サウスジョージア島グリトビケンの旧捕鯨基地を占拠している。貴任務群は諸島の奪還を命じられた。兵員輸送が可能なヘリコプターに特殊部隊を搭乗させ、ヘリコプター用の上陸区域へ向かわせよ。別の方法として、残存するいずれかの艦艇を港内に示された艦艇用の上陸区域へ進めれば、上陸を完了できる。上陸完了後、接近してアルゼンチン軍監視所と沿岸貨物船を艦砲で破壊し、降伏に追い込め。\n\n敵潜水艦サンタフェは増援を輸送した後、付近で行動中。機会があれば撃破せよ。\nButtonText=任務開始\nPopupStyle=Intro
Side0Trigger8Message=Title=部隊上陸完了\nBody=艦載艇が特殊部隊を上陸させました。上陸目標は達成されました。\nButtonText=閉じる\nPopupStyle=Notification
Side0Trigger9Message=Title=輸送ヘリコプター喪失\nBody=輸送ヘリコプターを失いました。残存するいずれかの艦艇を港内に示された艦艇用の上陸区域へ進め、艇による上陸を完了してください。\nButtonText=閉じる\nPopupStyle=Notification
Side0Trigger12Message=Title=任務失敗\nBody=敗北！ 我が軍の全艦艇が撃沈され、サウスジョージア奪還の試みは失敗に終わった。\nButtonText=任務を終了\nPopupStyle=Outro
Objective_LandSpecialForces=グリトビケンに特殊部隊を上陸させる
