Side0Trigger1Message=Title=<size=24>Guerre des Malouines 1982</size>\nOPÉRATION PARAQUET\n<size=24>25 avril 1982</size>\nBody=Des forces spéciales argentines occupent l’ancienne station baleinière de Grytviken sur l’île isolée de Géorgie du Sud. Votre groupe naval a reçu pour mission de reprendre les îles. Embarquez les forces spéciales dans un hélicoptère capable de transporter des troupes et amenez-les dans la zone de débarquement par hélicoptère. Tout navire survivant peut également accomplir le débarquement en entrant dans la zone de débarquement depuis les navires indiquée dans le port. Une fois le débarquement terminé, rapprochez-vous et détruisez le poste d’observation argentin et le cargo côtier au canon afin de les contraindre à se rendre.\n\nLe sous-marin ennemi ARA Santa Fe opère à proximité après avoir acheminé des renforts. Détruisez-le si l’occasion se présente.\nButtonText=Commencer la mission\nPopupStyle=Intro
Side0Trigger8Message=Title=TROUPES À TERRE\nBody=Les embarcations du navire ont débarqué le détachement de forces spéciales. L’objectif de débarquement est accompli.\nButtonText=Fermer\nPopupStyle=Notification
Side0Trigger9Message=Title=HÉLICOPTÈRE DE TRANSPORT PERDU\nBody=L’hélicoptère de transport a été perdu. Amenez n’importe quel navire survivant dans la zone de débarquement depuis les navires indiquée dans le port pour accomplir le débarquement par embarcation.\nButtonText=Fermer\nPopupStyle=Notification
Side0Trigger12Message=Title=ÉCHEC DE LA MISSION\nBody=Défaite ! Tous nos navires ont été coulés et notre tentative de reprendre la Géorgie du Sud a échoué.\nButtonText=Quitter la mission\nPopupStyle=Outro
Objective_LandSpecialForces=Débarquez les forces spéciales à Grytviken
