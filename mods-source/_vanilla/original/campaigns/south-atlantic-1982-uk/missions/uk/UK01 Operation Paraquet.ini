Side0Trigger1Message=Title=<size=24>포클랜드 전쟁 1982</size>\n파라켓 작전\n<size=24>1982년 4월 25일</size>\nBody=아르헨티나 특수부대가 외딴 사우스조지아섬 그리트비켄의 옛 포경 기지를 점령하고 있습니다. 아군 기동전단은 이 섬들을 탈환하라는 임무를 받았습니다. 기함의 헬리콥터를 이용해 제22 SAS 연대 특수부대 병력을 표시된 구역에 상륙시키십시오. 상륙이 완료되면 접근하여 아르헨티나 관측소와 연안 화물선을 함포로 파괴하고 항복을 강요하십시오.\n\n적 잠수함 아르헨티나 해군 산타페는 증원 병력을 수송한 뒤 인근에서 작전 중입니다. 기회가 허락하면 격파하십시오.\nButtonText=임무 시작\nPopupStyle=Intro
Side0Trigger8Message=Title=병력 상륙 완료\nBody=함재정이 특수부대 분견대를 상륙시켰습니다. 상륙 목표를 달성했습니다.\nButtonText=닫기\nPopupStyle=Notification
Side0Trigger9Message=Title=수송 헬리콥터 손실\nBody=헬리콥터를 잃었습니다. 선도함에 병력 8명이 남아 있습니다. 함정을 항구의 상륙 구역으로 이동시켜 보트로 상륙시키십시오.\nButtonText=닫기\nPopupStyle=Notification
Objective_LandSpecialForces=그리트비켄에 특수부대를 상륙시키십시오
