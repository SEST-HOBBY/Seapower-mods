Side0Trigger1Message=Title=<size=24>Guerre des Malouines 1982</size>\nOPÉRATION PARAQUET\n<size=24>25 avril 1982</size>\nBody=Des forces spéciales argentines occupent l’ancienne station baleinière de Grytviken sur l’île isolée de Géorgie du Sud. Votre groupe naval a reçu pour mission de reprendre les îles. Débarquez les hommes des forces spéciales du 22 SAS par hélicoptère depuis votre navire amiral dans la zone marquée. Une fois le débarquement terminé, rapprochez-vous et détruisez le poste d’observation argentin et le cargo côtier au canon afin de les contraindre à se rendre.\n\nLe sous-marin ennemi ARA Santa Fe opère à proximité après avoir acheminé des renforts. Détruisez-le si l’occasion se présente.\nButtonText=Commencer la mission\nPopupStyle=Intro
Side0Trigger8Message=Title=TROUPES À TERRE\nBody=Les embarcations du navire ont débarqué le détachement de forces spéciales. L’objectif de débarquement est accompli.\nButtonText=Fermer\nPopupStyle=Notification
Side0Trigger9Message=Title=HÉLICOPTÈRE DE TRANSPORT PERDU\nBody=L’hélicoptère a été perdu. Huit soldats restent à bord de votre navire de tête. Amenez-le dans la zone de débarquement du port pour les envoyer à terre par embarcation.\nButtonText=Fermer\nPopupStyle=Notification
Objective_LandSpecialForces=Débarquez les forces spéciales à Grytviken
