Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nOPERATION PARAQUET\n<size=24>25 April 1982</size>\nBody=Argentine special forces occupy the old whaling station of Grytviken on the remote island of South Georgia. Your task group has been assigned to recapture the islands. Land the 22 SAS special forces troops via helicopter from your flagship into the marked zone. Once the landing is complete, close and destroy the Argentine observation post and coastal freighter with gunfire to force their surrender.\n\nThe enemy submarine ARA Santa Fe is operating nearby after delivering reinforcements. Destroy her if the opportunity permits.\nButtonText=Start mission\nPopupStyle=Intro
