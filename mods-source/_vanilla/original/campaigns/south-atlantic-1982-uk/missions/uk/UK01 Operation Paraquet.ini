Side0Trigger1Message=Title=<size=24>Chiến tranh Falkland 1982</size>\nCHIẾN DỊCH PARAQUET\n<size=24>Ngày 25 tháng 4 năm 1982</size>\nBody=Lực lượng đặc nhiệm Argentina chiếm giữ trạm săn cá voi cũ tại Grytviken trên đảo Nam Georgia xa xôi. Nhóm đặc nhiệm của bạn được giao nhiệm vụ tái chiếm quần đảo. Dùng trực thăng từ soái hạm đưa lực lượng đặc nhiệm Trung đoàn 22 SAS đổ bộ vào khu vực được đánh dấu. Sau khi đổ bộ hoàn tất, áp sát và dùng pháo hạm phá hủy đài quan sát Argentina cùng tàu hàng ven bờ để buộc đối phương đầu hàng.\n\nTàu ngầm địch ARA Santa Fe đang hoạt động gần đó sau khi vận chuyển quân tiếp viện. Tiêu diệt nó nếu có cơ hội.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Side0Trigger8Message=Title=BINH LÍNH ĐÃ LÊN BỜ\nBody=Xuồng của tàu đã đưa toán đặc nhiệm lên bờ. Mục tiêu đổ bộ đã hoàn thành.\nButtonText=Đóng\nPopupStyle=Notification
Side0Trigger9Message=Title=MẤT TRỰC THĂNG VẬN TẢI\nBody=Trực thăng đã bị mất. Tám binh lính vẫn ở trên tàu dẫn đầu. Đưa tàu vào khu vực đổ bộ trong cảng để đưa họ lên bờ bằng xuồng.\nButtonText=Đóng\nPopupStyle=Notification
Objective_LandSpecialForces=Đổ bộ lực lượng đặc nhiệm tại Grytviken
