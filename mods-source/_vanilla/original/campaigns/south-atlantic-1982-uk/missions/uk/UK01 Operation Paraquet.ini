Side0Trigger1Message=Title=<size=24>포클랜드 전쟁 1982</size>\n파라켓 작전\n<size=24>1982년 4월 25일</size>\nBody=아르헨티나 특수부대가 외딴 사우스조지아섬 그리트비켄의 옛 포경 기지를 점령하고 있습니다. 아군 기동전단은 이 섬들을 탈환하라는 임무를 받았습니다. 병력 수송이 가능한 헬리콥터에 특수부대를 태워 헬리콥터 상륙 구역으로 이동시키십시오. 또는 살아남은 함정 중 어느 함정이든 항구에 표시된 함정 병력 상륙 구역으로 진입하면 상륙을 완료할 수 있습니다. 상륙이 완료되면 접근하여 아르헨티나 관측소와 연안 화물선을 함포로 파괴하고 항복을 강요하십시오.\n\n적 잠수함 아르헨티나 해군 산타페는 증원 병력을 수송한 뒤 인근에서 작전 중입니다. 기회가 허락하면 격파하십시오.\nButtonText=임무 시작\nPopupStyle=Intro
Side0Trigger8Message=Title=병력 상륙 완료\nBody=함재정이 특수부대 분견대를 상륙시켰습니다. 상륙 목표를 달성했습니다.\nButtonText=닫기\nPopupStyle=Notification
Side0Trigger9Message=Title=수송 헬리콥터 손실\nBody=수송 헬리콥터를 잃었습니다. 살아남은 함정 중 어느 함정이든 항구에 표시된 함정 병력 상륙 구역으로 이동시켜 보트로 상륙을 완료하십시오.\nButtonText=닫기\nPopupStyle=Notification
Side0Trigger12Message=Title=임무 실패\nBody=패배! 아군 함정이 모두 격침되었으며, 사우스조지아 탈환 시도는 실패로 끝났다.\nButtonText=임무 종료\nPopupStyle=Outro
Objective_LandSpecialForces=그리트비켄에 특수부대를 상륙시키십시오
