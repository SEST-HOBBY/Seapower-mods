Side0Trigger1Message=Title=<size=24>Chiến tranh Falkland 1982</size>\nCHIẾN DỊCH PARAQUET\n<size=24>Ngày 25 tháng 4 năm 1982</size>\nBody=Lực lượng đặc nhiệm Argentina chiếm giữ trạm săn cá voi cũ tại Grytviken trên đảo Nam Georgia xa xôi. Nhóm đặc nhiệm của bạn được giao nhiệm vụ tái chiếm quần đảo. Đưa lực lượng đặc nhiệm lên trực thăng có khả năng chở quân và cho trực thăng tới khu vực đổ bộ dành cho trực thăng. Ngoài ra, bất kỳ tàu nào còn sống sót cũng có thể hoàn thành cuộc đổ bộ bằng cách đi vào khu vực đổ bộ từ tàu được đánh dấu trong cảng. Sau khi đổ bộ hoàn tất, áp sát và dùng pháo hạm phá hủy đài quan sát Argentina cùng tàu hàng ven bờ để buộc đối phương đầu hàng.\n\nTàu ngầm địch ARA Santa Fe đang hoạt động gần đó sau khi vận chuyển quân tiếp viện. Tiêu diệt nó nếu có cơ hội.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Side0Trigger8Message=Title=BINH LÍNH ĐÃ LÊN BỜ\nBody=Xuồng của tàu đã đưa toán đặc nhiệm lên bờ. Mục tiêu đổ bộ đã hoàn thành.\nButtonText=Đóng\nPopupStyle=Notification
Side0Trigger9Message=Title=MẤT TRỰC THĂNG VẬN TẢI\nBody=Trực thăng vận tải đã bị mất. Đưa bất kỳ tàu nào còn sống sót vào khu vực đổ bộ từ tàu được đánh dấu trong cảng để hoàn thành cuộc đổ bộ bằng xuồng.\nButtonText=Đóng\nPopupStyle=Notification
Side0Trigger12Message=Title=NHIỆM VỤ THẤT BẠI\nBody=Thất bại! Tất cả tàu của ta đã bị đánh chìm và nỗ lực tái chiếm Nam Georgia đã thất bại.\nButtonText=Thoát nhiệm vụ\nPopupStyle=Outro
Objective_LandSpecialForces=Đổ bộ lực lượng đặc nhiệm tại Grytviken
