Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nOPERATION PARAQUET\n<size=24>25 April 1982</size>\nBody=Argentine special forces occupy the old whaling station of Grytviken on the remote island of South Georgia. Your task group has been assigned to recapture the islands.\n\nBring your flagship with the special forces detachment into the marked landing zone in the harbor, or embark the special forces onto a transport-capable helicopter and move them into the zone.\n\nOnce the landing is complete, close and destroy the Argentine observation post and coastal freighter with gunfire to force their surrender.\n\nThe enemy submarine ARA Santa Fe is operating nearby after delivering reinforcements. Destroy her if the opportunity permits.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: SOUTH GEORGIA\nVALID: 250930Z APR 82 TO 251530Z APR 82\nWIND: NW FORCE 4. SEA: SLIGHT.\nCLOUD: CLEAR. WEATHER: MAINLY DRY. VISIBILITY: MODERATE, LOCALLY POOR IN LOW CLOUD.\nPRESSURE: 998 MB, FALLING.\nOUTLOOK: WIND NW FORCE 4
Side0Trigger2Message=Title=MISSION ACCOMPLISHED\nBody=British forces have landed and the Argentines are surrendering. South Georgia is secured. Excellent work, Commander!\nButtonText=Close\nPopupStyle=Outro
Side0Trigger4Message=Title=SPECIAL FORCES TEAM INSERTED\nBody=The Wessex has reached the landing zone. The special forces party is ashore. You may return the helicopter to its ship.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger8Message=Title=TROOPS ASHORE\nBody=The ship's boats have landed the special forces party. The landing objective is complete.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger9Message=Title=TRANSPORT HELICOPTER LOST\nBody=The helicopter has been lost. Eight troops remain aboard ship - move your flagship into the harbor to unload them via boat.\nButtonText=Close\nPopupStyle=Notification
