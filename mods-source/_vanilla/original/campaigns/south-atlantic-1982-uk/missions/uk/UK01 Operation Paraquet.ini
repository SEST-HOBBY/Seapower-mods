Side0Trigger1Message=Title=<size=24>Guerra de las Malvinas 1982</size>\nOPERACIÓN PARAQUET\n<size=24>25 de abril de 1982</size>\nBody=Fuerzas especiales argentinas ocupan la antigua estación ballenera de Grytviken en la remota isla de Georgia del Sur. Su grupo de tareas ha recibido la misión de recuperar las islas. Desembarque las tropas de fuerzas especiales del 22 SAS mediante helicóptero desde su buque insignia en la zona marcada. Una vez completado el desembarco, acérquese y destruya el puesto de observación argentino y el carguero costero con fuego naval para forzar su rendición.\n\nEl submarino enemigo ARA Santa Fe opera en las proximidades tras haber transportado refuerzos. Destrúyalo si se presenta la oportunidad.\nButtonText=Iniciar misión\nPopupStyle=Intro
Side0Trigger8Message=Title=TROPAS EN TIERRA\nBody=Las lanchas del buque han desembarcado al destacamento de fuerzas especiales. El objetivo de desembarco está completo.\nButtonText=Cerrar\nPopupStyle=Notification
Side0Trigger9Message=Title=HELICÓPTERO DE TRANSPORTE PERDIDO\nBody=Se ha perdido el helicóptero. Quedan ocho soldados a bordo del buque principal. Lleve el buque a la zona de desembarco del puerto para enviarlos a tierra en lancha.\nButtonText=Cerrar\nPopupStyle=Notification
Objective_LandSpecialForces=Desembarque fuerzas especiales en Grytviken
