Side0Trigger1Message=Title=<size=24>福克兰群岛战争1982</size>\n长尾小鹦鹉行动\n<size=24>1982年4月25日</size>\nBody=阿根廷特种部队占领了位于遥远南乔治亚岛上的古利德维肯旧捕鲸站。你的特遣大队任务是夺回这些岛屿。\n\n将搭载特种部队分遣队的旗舰开往港口内标记的登陆区域，或让特种部队乘坐具备运输能力的直升机前往。\n\n登陆完成后，靠近海岸并使用舰炮摧毁阿根廷的观察哨和近海货船，迫使他们投降。\n\n运输增援后的敌方潜艇圣菲号正在附近活动。在条件允许时将其摧毁。\nButtonText=开始任务\nPopupStyle=Intro
Side0Trigger8Message=Title=部队已上岸\nBody=舰载小艇已将特种部队成员送至岸上。登陆目标已完成。\nButtonText=关闭\nPopupStyle=Notification
Side0Trigger9Message=Title=已损失运输直升机\nBody=直升机已损毁。船上仍有八名特种部队成员——将你的旗舰开往港口，使用小艇投送他们。\nButtonText=关闭\nPopupStyle=Notification
Objective_LandSpecialForces=将特种部队投送至古利德维肯
Description=指挥战区内的第一批英国军队从阿根廷手中夺回南乔治亚岛。使用直升机投送特种部队，并在古利德维肯附近进行舰炮火力展示，迫使岸上的阿根廷人投降。据推测，阿根廷海军的圣菲号潜艇就在附近——在条件允许时将其找到并击沉。
