Side0Trigger1Message=Title=<size=24>フォークランド紛争 1982</size>\nパラケット作戦\n<size=24>1982年4月25日</size>\nBody=アルゼンチン特殊部隊が、遠隔地サウスジョージア島グリトビケンの旧捕鯨基地を占拠している。貴任務群は諸島の奪還を命じられた。旗艦からヘリコプターで第22 SAS連隊の特殊部隊を指定区域に上陸させよ。上陸完了後、接近してアルゼンチン軍監視所と沿岸貨物船を艦砲で破壊し、降伏に追い込め。\n\n敵潜水艦サンタフェは増援を輸送した後、付近で行動中。機会があれば撃破せよ。\nButtonText=任務開始\nPopupStyle=Intro
Side0Trigger8Message=Title=部隊上陸完了\nBody=艦載艇が特殊部隊を上陸させました。上陸目標は達成されました。\nButtonText=閉じる\nPopupStyle=Notification
Side0Trigger9Message=Title=輸送ヘリコプター喪失\nBody=ヘリコプターを失いました。先頭艦には兵員8名が残っています。艦を港内の上陸区域に進め、艇で上陸させてください。\nButtonText=閉じる\nPopupStyle=Notification
Objective_LandSpecialForces=グリトビケンに特殊部隊を上陸させる
