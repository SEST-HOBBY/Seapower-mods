Side0Trigger1Message=Title=<size=24>Guerra de las Malvinas 1982</size>\nOPERACIÓN PARAQUET\n<size=24>25 de abril de 1982</size>\nBody=Fuerzas especiales argentinas ocupan la antigua estación ballenera de Grytviken en la remota isla de Georgia del Sur. Su grupo de tareas ha recibido la misión de recuperar las islas. Embarque a las fuerzas especiales en un helicóptero con capacidad de transporte y llévelas a la zona de desembarco para helicópteros. Como alternativa, cualquier buque superviviente puede completar el desembarco entrando en la zona marcada para buques en el puerto. Una vez completado el desembarco, acérquese y destruya el puesto de observación argentino y el carguero costero con fuego naval para forzar su rendición.\n\nEl submarino enemigo ARA Santa Fe opera en las proximidades tras haber transportado refuerzos. Destrúyalo si se presenta la oportunidad.\nButtonText=Iniciar misión\nPopupStyle=Intro
Side0Trigger8Message=Title=TROPAS EN TIERRA\nBody=Las lanchas del buque han desembarcado al destacamento de fuerzas especiales. El objetivo de desembarco está completo.\nButtonText=Cerrar\nPopupStyle=Notification
Side0Trigger9Message=Title=HELICÓPTERO DE TRANSPORTE PERDIDO\nBody=Se ha perdido el helicóptero de transporte. Lleve cualquier buque superviviente a la zona marcada de desembarco desde buques en el puerto para completar el desembarco en lancha.\nButtonText=Cerrar\nPopupStyle=Notification
Side0Trigger12Message=Title=MISIÓN FALLIDA\nBody=¡Derrota! Todos nuestros buques han sido hundidos y nuestro intento de recuperar Georgia del Sur ha fracasado.\nButtonText=Salir de la misión\nPopupStyle=Outro
Objective_LandSpecialForces=Desembarque fuerzas especiales en Grytviken
