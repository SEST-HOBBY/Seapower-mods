Side0Trigger1Message=Title=<size=24>Guerra de las Malvinas 1982</size>\nLA TRAMPA DE DESEADO\n<size=24>6 de mayo de 1982</size>\nBody=Las fuerzas argentinas se aproximan a la posición de patrulla de su submarino frente a la costa patagónica. Evada su red antisubmarina para escapar a aguas más profundas sin ser destruido.\n\nUn destructor patrulla al este y puede aproximarse a cualquier contacto notificado. Combata solo cuando sea necesario para abrirse paso y conserve torpedos para futuras operaciones.\nButtonText=Iniciar misión\nPopupStyle=Intro
