Side0Trigger1Message=Title=<size=24>포클랜드 전쟁 1982</size>\n데세아도의 함정\n<size=24>1982년 5월 6일</size>\nBody=아르헨티나군이 파타고니아 연안의 아군 잠수함 초계 위치로 접근하고 있습니다. 대잠망을 피해 파괴되지 않고 더 깊은 수역으로 탈출하십시오.\n\n동쪽에서 구축함이 초계 중이며 보고된 접촉 지점으로 접근할 수 있습니다. 통과를 확보하는 데 필요한 경우에만 교전하고 후속 작전을 위해 어뢰를 아끼십시오.\nButtonText=임무 시작\nPopupStyle=Intro
