Side0Trigger1Message=Title=<size=24>フォークランド紛争 1982</size>\nデセアドの罠\n<size=24>1982年5月6日</size>\nBody=アルゼンチン軍がパタゴニア沖の貴潜水艦の哨戒位置に接近している。対潜網を回避し、撃破されることなく深い海域へ脱出せよ。\n\n東方では駆逐艦が哨戒中で、報告された接触に接近する可能性がある。通過の安全確保に必要な場合のみ交戦し、今後の作戦に備えて魚雷を温存せよ。\nButtonText=任務開始\nPopupStyle=Intro
