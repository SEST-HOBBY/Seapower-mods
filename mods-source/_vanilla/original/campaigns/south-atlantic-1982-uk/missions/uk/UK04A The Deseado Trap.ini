Side0Trigger1Message=Title=<size=24>Chiến tranh Falkland 1982</size>\nCẠM BẪY DESEADO\n<size=24>Ngày 6 tháng 5 năm 1982</size>\nBody=Lực lượng Argentina đang áp sát vị trí tuần tra của tàu ngầm ngoài khơi Patagonia. Tránh mạng lưới chống ngầm của họ để thoát ra vùng nước sâu hơn mà không bị tiêu diệt.\n\nMột khu trục hạm đang tuần tra phía đông và có thể áp sát bất kỳ mục tiêu nào được báo cáo. Chỉ giao chiến khi cần thiết để mở đường và tiết kiệm ngư lôi cho các hoạt động tiếp theo.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
