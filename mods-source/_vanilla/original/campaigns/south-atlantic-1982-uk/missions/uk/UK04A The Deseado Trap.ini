Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nTHE DESEADO TRAP\n<size=24>6 May 1982</size>\nBody=Argentine forces are closing on your submarine's patrol position off the Patagonian coast. Evade their ASW net to escape to deeper water without being destroyed.\n\nA destroyer is patrolling to the east and may close any reported contact. Engage only as necessary to secure passage and conserve torpedoes for further operations.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: PUERTO DESEADO APPROACHES\nVALID: 061400Z MAY 82 TO 062000Z MAY 82\nWIND: N FORCE 2. SEA: SMOOTH.\nCLOUD: OVERCAST. WEATHER: MAINLY DRY. VISIBILITY: GOOD OUTSIDE LOW CLOUD.\nPRESSURE: 1007 MB, FALLING.\nOUTLOOK: WIND NE FORCE 3
