Side0Trigger1Message=Title=<size=24>Guerre des Malouines 1982</size>\nLE PIÈGE DE DESEADO\n<size=24>6 mai 1982</size>\nBody=Les forces argentines se rapprochent de la position de patrouille de votre sous-marin au large de la côte patagonienne. Échappez à leur dispositif anti-sous-marin pour gagner des eaux plus profondes sans être détruit.\n\nUn destroyer patrouille à l’est et peut se rapprocher de tout contact signalé. N’engagez le combat que pour assurer votre passage et conservez vos torpilles pour les opérations à venir.\nButtonText=Commencer la mission\nPopupStyle=Intro
