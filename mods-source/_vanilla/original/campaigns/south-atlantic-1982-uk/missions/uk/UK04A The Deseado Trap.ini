Side0Trigger1Message=Title=<size=24>福克兰群岛战争1982</size>\n德塞阿多陷阱\n<size=24>1982年5月6日</size>\nBody=阿根廷军队正靠近你位于巴塔哥尼亚海岸附近的潜艇巡逻阵位。规避敌方的反潜网，撤往更深的水域，以免被击沉。\n\n一艘驱逐舰正在东部巡逻，可能会靠近报告的任何接触。仅允许在确保通行安全时交战，为后续行动节省鱼雷。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=舰队天气预报\n区域：德塞阿多港附近\n有效期：1982年5月6日1400Z时至2000Z时\n风况：北风2级。海况：2级。\n云量：多云。天气：基本干燥。能见度：低云外良好。\n气压：1007毫巴，正在下降。\n展望：东北风3级。
Side0Trigger2Message=Title=任务失败！\nBody=任务失败！我方潜艇在进入开放水域前被击沉！\nButtonText=关闭\nPopupStyle=Outro
Side0Trigger4Message=Title=任务完成！\nBody=任务完成！任务完成！我方潜艇已离开近海巡逻区域。干得好，指挥官。\nButtonText=关闭\nPopupStyle=Outro
Objective_WithdrawEast=抵达标记在巡逻队以东的脱离区域
