[Language_ko]
Objective_SinkEnemyCarrier=ARA 25 De Mayo가 초계 구역을 벗어나기 전에 격침하십시오
Side0Trigger10Message=Title=임무 실패\nBody=패배! 아르헨티나 해군 베인티싱코 데 마요가 초계 구역을 벗어났습니다. 요격 기회를 놓쳤습니다. 추격을 중단하고 초계 위치로 복귀하십시오.\nButtonText=닫기\nPopupStyle=Outro
Side0Trigger1Message=Title=<size=24>포클랜드 전쟁 1982</size>\n파타고니아 요격\n<size=24>1982년 5월 8일</size>\nBody=아르헨티나 해군 베인티싱코 데 마요가 파타고니아 해안을 따라 북쪽으로 철수 중입니다. 아군 잠수함은 외해에 있으며 보고된 항로의 전방에 위치합니다. 항모가 초계 구역을 벗어나기 전에 요격하여 격침하십시오.\n\n외해 쪽 수색망을 통과하여 사격 위치를 확보하십시오. 항모를 격침한 뒤 호위함을 피해 동쪽의 표시된 탈출 구역에 도달하십시오. 호위함 격침은 필수가 아닙니다.\nButtonText=임무 시작\nPopupStyle=Intro
Name=UK04B 파타고니아 요격
