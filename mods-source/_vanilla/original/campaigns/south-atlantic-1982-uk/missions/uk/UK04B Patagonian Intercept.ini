Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nPATAGONIAN INTERCEPT\n<size=24>8 May 1982</size>\nBody=ARA 25 de Mayo is withdrawing north along the Patagonian coast. Your submarine is offshore and ahead of her reported track. Intercept and sink the carrier before she clears the patrol area.\n\nWork through the seaward search screen to obtain a firing position. After sinking the carrier, evade the escorts and reach the marked escape area to the east. Destroying the escorts is not required.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: SAN MATIAS GULF\nVALID: 081400Z MAY 82 TO 082000Z MAY 82\nWIND: NE FORCE 4. SEA: SLIGHT.\nCLOUD: OVERCAST. WEATHER: MAINLY DRY. VISIBILITY: GOOD OUTSIDE LOW CLOUD.\nPRESSURE: 1008 MB, FALLING.\nOUTLOOK: WIND NE FORCE 4
Side0Trigger2Message=Title=MISSION FAILED\nBody=Defeat! Our submarine has been sunk!\nButtonText=Close\nPopupStyle=Outro
Side0Trigger3Message=Title=ENEMY CARRIER DESTROYED\nBody=ARA 25 de Mayo has been sunk! Break contact with the escorts and withdraw to the marked escape area to the east. The mission is not complete until your submarine reaches the area safely.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger4Message=Title=MISSION ACCOMPLISHED\nBody=Victory! ARA 25 de Mayo has been sunk and our submarine has withdrawn successfully. Excellent work, Commander.\nButtonText=Close\nPopupStyle=Outro
Side0Trigger10Message=Title=MISSION FAILED\nBody=Defeat! ARA 25 de Mayo has cleared the patrol area. The opportunity to intercept has been lost. Break off the pursuit and return to patrol station.\nButtonText=Close\nPopupStyle=Outro
