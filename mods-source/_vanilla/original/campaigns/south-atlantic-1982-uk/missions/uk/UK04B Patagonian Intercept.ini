[Language_ja]
Objective_SinkEnemyCarrier=ARA 25 De Mayoが哨戒区域を離れる前に撃沈せよ
Side0Trigger10Message=Title=任務失敗\nBody=敗北！アルゼンチン海軍五月二十五日号は哨戒区域を離れた。迎撃の機会は失われた。追跡を中止し、哨戒配置に戻れ。\nButtonText=閉じる\nPopupStyle=Outro
Side0Trigger1Message=Title=<size=24>フォークランド紛争 1982</size>\nパタゴニア迎撃\n<size=24>1982年5月8日</size>\nBody=アルゼンチン海軍五月二十五日号はパタゴニア沿岸を北へ撤退中。貴潜水艦は沖合に位置し、報告された航路の前方にいる。哨戒区域を離れる前に空母を迎撃し、撃沈せよ。\n\n沖合側の捜索網を突破して発射位置につけ。空母撃沈後は護衛艦を回避し、東方の指定脱出区域に到達せよ。護衛艦の撃破は不要。\nButtonText=任務開始\nPopupStyle=Intro
Name=UK04B パタゴニア迎撃
