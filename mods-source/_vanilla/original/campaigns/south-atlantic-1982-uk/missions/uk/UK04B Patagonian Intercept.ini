[Language_fr]
Objective_SinkEnemyCarrier=Coulez l’ARA 25 De Mayo avant qu’il ne quitte la zone de patrouille
Side0Trigger10Message=Title=ÉCHEC DE LA MISSION\nBody=Défaite ! L’ARA 25 de Mayo a quitté la zone de patrouille. L’occasion de l’intercepter est perdue. Rompez la poursuite et regagnez votre poste de patrouille.\nButtonText=Fermer\nPopupStyle=Outro
Side0Trigger1Message=Title=<size=24>Guerre des Malouines 1982</size>\nINTERCEPTION EN PATAGONIE\n<size=24>8 mai 1982</size>\nBody=L’ARA 25 de Mayo se replie vers le nord le long de la côte patagonienne. Votre sous-marin se trouve au large, en avant de sa route signalée. Interceptez et coulez le porte-avions avant qu’il ne quitte la zone de patrouille.\n\nFranchissez le dispositif de recherche côté large pour gagner une position de tir. Après avoir coulé le porte-avions, échappez aux escorteurs et rejoignez la zone de dégagement marquée à l’est. La destruction des escorteurs n’est pas requise.\nButtonText=Commencer la mission\nPopupStyle=Intro
Name=UK04B Interception en Patagonie
