[Language_vn]
Objective_SinkEnemyCarrier=Đánh chìm ARA 25 De Mayo trước khi nó rời khu vực tuần tra
Side0Trigger10Message=Title=NHIỆM VỤ THẤT BẠI\nBody=Thất bại! ARA 25 de Mayo đã rời khu vực tuần tra. Cơ hội đánh chặn đã mất. Ngừng truy đuổi và trở về vị trí tuần tra.\nButtonText=Đóng\nPopupStyle=Outro
Side0Trigger1Message=Title=<size=24>Chiến tranh Falkland 1982</size>\nĐÁNH CHẶN NGOÀI KHƠI PATAGONIA\n<size=24>Ngày 8 tháng 5 năm 1982</size>\nBody=ARA 25 de Mayo đang rút về phía bắc dọc bờ biển Patagonia. Tàu ngầm của bạn ở ngoài khơi và phía trước đường đi được báo cáo của nó. Đánh chặn và đánh chìm tàu sân bay trước khi nó rời khu vực tuần tra.\n\nVượt qua màn tìm kiếm phía biển để vào vị trí khai hỏa. Sau khi đánh chìm tàu sân bay, tránh các tàu hộ tống và đến khu vực thoát ly được đánh dấu ở phía đông. Không bắt buộc tiêu diệt các tàu hộ tống.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
