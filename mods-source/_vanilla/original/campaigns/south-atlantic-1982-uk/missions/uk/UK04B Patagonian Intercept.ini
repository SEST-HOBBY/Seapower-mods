Side0Trigger10Message=Title=任务失败！\nBody=任务失败！五月二十五日号已离开巡逻区域。我们已失去拦截机会。放弃追击并返回巡逻阵位。\nButtonText=关闭\nPopupStyle=Outro
Side0Trigger1Message=Title=<size=24>福克兰群岛战争1982</size>\n巴塔哥尼亚拦截战\n<size=24>1982年5月8日</size>\nBody=五月二十五日号航母正在沿巴塔哥尼亚海岸向北撤离。你的潜艇目前位于近海，且处于其报告踪迹的前方。在此航母离开巡逻区域前从海上拦截并将其击沉。\n\n穿过海上搜寻网，抵达有利的射击位置。击沉航母后，摆脱护航舰艇并向东撤离至标记的区域。你无需摧毁护航舰艇。\nButtonText=开始任务\nPopupStyle=Intro
