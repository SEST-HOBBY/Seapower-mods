[Language_es]
Objective_SinkEnemyCarrier=Hunda el ARA 25 De Mayo antes de que abandone la zona de patrulla
Side0Trigger10Message=Title=MISIÓN FRACASADA\nBody=¡Derrota! El ARA 25 de Mayo ha abandonado la zona de patrulla. Se ha perdido la oportunidad de interceptarlo. Abandone la persecución y regrese al puesto de patrulla.\nButtonText=Cerrar\nPopupStyle=Outro
Side0Trigger1Message=Title=<size=24>Guerra de las Malvinas 1982</size>\nINTERCEPCIÓN EN PATAGONIA\n<size=24>8 de mayo de 1982</size>\nBody=El ARA 25 de Mayo se retira al norte por la costa patagónica. Su submarino está mar adentro y por delante de su derrota prevista. Intercepte y hunda el portaaviones antes de que abandone la zona de patrulla.\n\nAtraviese la pantalla de búsqueda del lado de mar abierto para obtener una posición de tiro. Tras hundir el portaaviones, evada a los escoltas y alcance la zona de escape marcada al este. No es necesario destruir a los escoltas.\nButtonText=Iniciar misión\nPopupStyle=Intro
Name=UK04B Intercepción en Patagonia
