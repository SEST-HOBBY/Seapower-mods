Side0Trigger1Message=Title=<size=24>福克兰群岛战争1982</size>\n圣卡洛斯湾第2部分：炸弹小巷\n<size=24>1982年5月25日</size>\nBody=圣卡洛斯湾的登陆行动仍在继续，阿根廷飞机每天都会发动空袭，对登陆部队造成损失。航母战斗群已在海上与大西洋运送者号滚装船会合，后者载有用于替换的直升机和鹞式战斗机。\n\n防御锚地75分钟，直到空袭停止。情报显示阿根廷将对海上的战斗群发动同步攻击。\nButtonText=开始任务\nPopupStyle=Intro
Side0Trigger43Message=Title=任务失败！\nBody=任务失败！4艘两栖船只已在圣卡洛斯的行动中损毁。剩余投送能力已无法支撑岸上部队。\nButtonText=关闭\nPopupStyle=Outro
Side0Trigger46Message=From=诺斯伍德舰队总司令\nTo=特遣大队指挥官\nInfo=\nSubj=共同行动——圣卡洛斯\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1.雷达报告显示不会再有后续空袭。\n\n2.在卸货作业期间维持防空网和对空监视。\n\n3.我向你和你部下的各舰官兵表示祝贺。\nButtonText=关闭\nPopupStyle=NavalMessage\nMessageRole=Outro
