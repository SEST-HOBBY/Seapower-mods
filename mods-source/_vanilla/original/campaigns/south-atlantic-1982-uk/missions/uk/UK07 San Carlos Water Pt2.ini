Side0Trigger1Message=Title=<size=24>フォークランド紛争 1982</size>\nサンカルロス パート2：爆弾横丁\n<size=24>25 May 1982</size>\nBody=サンカルロス湾での上陸作戦は進行中ですが、連日のアルゼンチン軍の空襲で防衛部隊に損害が出ています。空母部隊は沖合で、補充用のハリアーとヘリコプターを積んだアトランティック・コンベアーと合流しました。\n\n空襲が止むまで75分間、泊地を防衛してください。情報部は、アルゼンチン軍が沖合の部隊も同時に攻撃する可能性があると判断しています。\nButtonText=任務開始\nPopupStyle=Intro
Side0Trigger43Message=Title=任務失敗\nBody=敗北！サンカルロス作戦で揚陸艦艇4隻を失いました。残存艦艇では陸上部隊を支えられません。\nButtonText=閉じる\nPopupStyle=Outro
Side0Trigger46Message=From=CINCFLEET NORTHWOOD\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=OPERATION CORPORATE. SAN CARLOS.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. レーダー報告によれば、新たな攻撃隊の接近は認められない。\n\n2. 荷揚げ作業中は警戒陣と対空監視を維持せよ。\n\n3. 貴官および各艦乗員の健闘を称える。\nButtonText=閉じる\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_PreserveAmphibiousLift=揚陸艦艇の損失を3隻以内に抑える
CarrierStationLabel_ja=空母部隊展開区域
Objective_ProtectAtlanticConveyor=任意：アトランティック・コンベアーを護衛する

[Language_vn]
Side0Trigger44Message=Title=NHIỆM VỤ THẤT BẠI\nBody=Thất bại! Cả hai tàu sân bay của ta đã bị mất! Ta không còn có thể duy trì yểm trợ trên không cần thiết để hoàn thành chiến dịch và buộc phải đàm phán các điều khoản với Argentina.\nButtonText=Đóng\nPopupStyle=Outro
Objective_ProtectCarrier=Phải giữ được một tàu sân bay
Name=UK07 - SAN CARLOS PHẦN 2: HẺM BOM
Description=Hoạt động đổ bộ tiếp tục tại San Carlos. Thêm các đợt không kích Argentina đang tiến đến - hãy bảo vệ khu neo đậu để quân ta lên bờ an toàn.
LandingForceStationLabel_vn=Vùng nước San Carlos\nKhu vực tác chiến đổ bộ (AOA) (Phòng thủ)
MapSymbol_New1Label_vn=New Symbol
MapSymbol_New2Label_vn=New Symbol
MapSymbol_New3Label_vn=New Symbol
MapSymbol_New4Label_vn=San Carlos Water
MapSymbol_New7Label_vn=Falkland Sound
MissionBriefingAssetsDirectory=missions/_briefing
Side0Trigger1Message=Title=<size=24>Chiến tranh Falkland 1982</size>\nSAN CARLOS PHẦN 2: HẺM BOM\n<size=24>25 May 1982</size>\nBody=Hoạt động đổ bộ đang diễn ra tại San Carlos. Các cuộc không kích hằng ngày của Argentina đã gây tổn thất cho lực lượng phòng thủ. Nhóm tàu sân bay đang ở ngoài khơi sau khi hội quân với Atlantic Conveyor cùng số máy bay Harrier và trực thăng bổ sung trên tàu.\n\nBảo vệ khu neo đậu trong 75 phút cho đến khi các đợt không kích chấm dứt. Tình báo cho rằng Argentina có thể đồng thời tấn công nhóm tàu ngoài khơi.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Side0Trigger43Message=Title=NHIỆM VỤ THẤT BẠI\nBody=Thất bại! Bốn tàu đổ bộ đã bị mất trong các hoạt động tại San Carlos. Các tàu còn lại không thể duy trì lực lượng trên bờ.\nButtonText=Đóng\nPopupStyle=Outro
Side0Trigger46Message=From=CINCFLEET NORTHWOOD\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=OPERATION CORPORATE. SAN CARLOS.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. RADAR BÁO CÁO KHÔNG CÒN ĐỢT TẬP KÍCH NÀO ĐANG TIẾN ĐẾN.\n\n2. DUY TRÌ ĐỘI HÌNH HỘ VỆ VÀ CẢNH GIỚI TRÊN KHÔNG TRONG KHI TIẾP TỤC DỠ HÀNG.\n\n3. XIN CHÚC MỪNG ĐỒNG CHÍ VÀ TOÀN THỂ THỦY THỦ ĐOÀN CÁC TÀU.\nButtonText=Đóng\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_PreserveAmphibiousLift=Không được mất quá 3 tàu đổ bộ
CarrierStationLabel_vn=Khu vực triển khai nhóm tàu sân bay
Objective_ProtectAtlanticConveyor=TÙY CHỌN: Bảo vệ Atlantic Conveyor

