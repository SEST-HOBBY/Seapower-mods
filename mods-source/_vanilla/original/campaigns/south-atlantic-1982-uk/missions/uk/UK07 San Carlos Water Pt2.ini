Side0Trigger1Message=Title=<size=24>Guerre des Malouines 1982</size>\nSAN CARLOS PARTIE 2 : L’ALLÉE DES BOMBES\n<size=24>25 May 1982</size>\nBody=Les opérations de débarquement se poursuivent à San Carlos, et les attaques aériennes argentines quotidiennes infligent des pertes aux défenseurs. Le groupe de porte-avions est au large après avoir rejoint l’Atlantic Conveyor et sa cargaison de Harrier et d’hélicoptères de remplacement.\n\nDéfendez le mouillage pendant 75 minutes jusqu’à la fin des attaques aériennes. Le renseignement estime que les Argentins pourraient attaquer simultanément le groupe au large.\nButtonText=Commencer la mission\nPopupStyle=Intro
Side0Trigger43Message=Title=MISSION ÉCHOUÉE\nBody=Défaite ! Quatre navires amphibies ont été perdus pendant les opérations de San Carlos. Les navires restants ne peuvent plus soutenir les forces à terre.\nButtonText=Fermer\nPopupStyle=Outro
Side0Trigger46Message=From=CINCFLEET NORTHWOOD\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=OPERATION CORPORATE. SAN CARLOS.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. LE RADAR NE SIGNALE AUCUN NOUVEAU RAID EN APPROCHE.\n\n2. MAINTENEZ L’ÉCRAN DÉFENSIF ET LA VEILLE AÉRIENNE PENDANT LE DÉCHARGEMENT.\n\n3. MES FÉLICITATIONS À VOUS ET AUX ÉQUIPAGES DE VOS NAVIRES.\nButtonText=Fermer\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_PreserveAmphibiousLift=Ne perdez pas plus de 3 navires amphibies
CarrierStationLabel_fr=Zone de déploiement du groupe aéronaval
Objective_ProtectAtlanticConveyor=FACULTATIF : Protégez l’Atlantic Conveyor

