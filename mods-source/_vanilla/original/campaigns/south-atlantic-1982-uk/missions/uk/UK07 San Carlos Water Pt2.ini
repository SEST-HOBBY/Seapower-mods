[Language_es]
Side0Trigger44Message=Title=MISIÓN FRACASADA\nBody=¡Derrota! ¡Hemos perdido nuestros dos portaaviones! Ya no podemos mantener el apoyo aéreo necesario para completar la campaña y nos vemos obligados a negociar las condiciones con Argentina.\nButtonText=Cerrar\nPopupStyle=Outro
Objective_ProtectCarrier=Un portaaviones debe sobrevivir
Name=UK07 - SAN CARLOS PARTE 2: CALLEJÓN DE LAS BOMBAS
Description=Las operaciones de desembarco continúan en San Carlos. Se aproximan más ataques aéreos argentinos - defiende el fondeadero y permite que nuestras tropas desembarquen a salvo.
