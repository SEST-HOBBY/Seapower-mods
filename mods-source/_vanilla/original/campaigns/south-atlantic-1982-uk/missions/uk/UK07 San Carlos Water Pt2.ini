[Language_ja]
Side0Trigger44Message=Title=任務失敗\nBody=敗北！我が軍の空母2隻をともに失った！作戦を完遂するために必要な航空支援を維持できなくなり、アルゼンチンと条件交渉を行わざるを得ない。\nButtonText=閉じる\nPopupStyle=Outro
Objective_ProtectCarrier=空母を1隻生存させる
Name=UK07 - サンカルロス パート2：爆弾横丁
Description=サンカルロス湾での上陸作戦は続いています。アルゼンチン軍のさらなる空襲が接近中です。泊地を防衛し、味方部隊を安全に上陸させてください。
LandingForceStationLabel_ja=サンカルロス湾\n上陸作戦区域（AOA）（防衛）
