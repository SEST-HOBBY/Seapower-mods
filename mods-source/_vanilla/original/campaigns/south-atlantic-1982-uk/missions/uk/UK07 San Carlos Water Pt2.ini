Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nSAN CARLOS PART 2: BOMB ALLEY\n<size=24>25 May 1982</size>\nBody=Landing operations are proceeding at San Carlos Water, and Argentine air attacks have come in each day, exacting a toll on the defenders. The carrier group is offshore having rendezvoused with the Atlantic Conveyor and its cargo of replacement Harriers and helicopters.\n\nDefend the anchorage for 75 minutes until air attacks cease. Intel believes the Argentines may simultaneously attack the offshore group.\nButtonText=Start mission\nPopupStyle=Intro
