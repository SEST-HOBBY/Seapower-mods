Side0Trigger1Message=Title=<size=24>포클랜드 전쟁 1982</size>\n산카를로스 2부: 폭탄 골목\n<size=24>25 May 1982</size>\nBody=산카를로스에서 상륙 작전이 진행되고 있으며, 매일 이어지는 아르헨티나 공습으로 방어 병력이 피해를 입고 있습니다. 항공모함 전단은 보충용 해리어와 헬리콥터를 실은 애틀랜틱 컨베이어와 합류한 뒤 먼바다에 머물고 있습니다.\n\n공습이 멈출 때까지 75분 동안 정박지를 방어하세요. 정보부는 아르헨티나군이 먼바다의 전단도 동시에 공격할 수 있다고 판단합니다.\nButtonText=임무 시작\nPopupStyle=Intro
Side0Trigger43Message=Title=임무 실패\nBody=패배! 산카를로스 작전에서 상륙 함선 4척을 잃었습니다. 남은 함선으로는 지상군을 지원할 수 없습니다.\nButtonText=닫기\nPopupStyle=Outro
Side0Trigger46Message=From=CINCFLEET NORTHWOOD\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=OPERATION CORPORATE. SAN CARLOS.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. 레이더 보고에 따르면 추가로 접근하는 공격 편대는 없다.\n\n2. 하역이 계속되는 동안 경계진과 대공 감시를 유지하라.\n\n3. 귀관과 각 함정 승조원들의 노고를 치하한다.\nButtonText=닫기\nPopupStyle=NavalMessage\nMessageRole=Outro
