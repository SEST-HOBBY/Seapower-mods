Side0Trigger1Message=Title=<size=24>Guerra de las Malvinas 1982</size>\nSAN CARLOS PARTE 2: CALLEJÓN DE LAS BOMBAS\n<size=24>25 May 1982</size>\nBody=Las operaciones de desembarco prosiguen en San Carlos, y los ataques aéreos argentinos se han sucedido cada día, causando bajas entre los defensores. El grupo de portaaviones se encuentra mar adentro tras reunirse con el Atlantic Conveyor y su carga de Harrier y helicópteros de reemplazo.\n\nDefiende el fondeadero durante 75 minutos hasta que cesen los ataques aéreos. Inteligencia cree que los argentinos podrían atacar simultáneamente al grupo situado mar adentro.\nButtonText=Iniciar misión\nPopupStyle=Intro
Side0Trigger43Message=Title=MISIÓN FALLIDA\nBody=¡Derrota! Se han perdido cuatro buques anfibios durante las operaciones de San Carlos. Los buques restantes no pueden sostener a las fuerzas en tierra.\nButtonText=Cerrar\nPopupStyle=Outro
Side0Trigger46Message=From=CINCFLEET NORTHWOOD\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=OPERATION CORPORATE. SAN CARLOS.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. EL RADAR NO DETECTA NUEVAS INCURSIONES EN APROXIMACIÓN.\n\n2. MANTENGAN LA PANTALLA DEFENSIVA Y LA VIGILANCIA AÉREA MIENTRAS CONTINÚA LA DESCARGA.\n\n3. MIS FELICITACIONES A USTED Y A LAS DOTACIONES DE SUS BUQUES.\nButtonText=Cerrar\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_PreserveAmphibiousLift=No pierdas más de 3 buques anfibios
CarrierStationLabel_es=Zona de despliegue del grupo de portaaviones
Objective_ProtectAtlanticConveyor=OPCIONAL: Protege al Atlantic Conveyor

[Language_fr]
Side0Trigger44Message=Title=ÉCHEC DE LA MISSION\nBody=Défaite ! Nos deux porte-avions ont été perdus ! Nous ne pouvons plus assurer le soutien aérien nécessaire pour mener la campagne à son terme et sommes contraints de négocier les conditions avec l’Argentine.\nButtonText=Fermer\nPopupStyle=Outro
Objective_ProtectCarrier=Un porte-avions doit survivre
Name=UK07 - SAN CARLOS PARTIE 2 : L’ALLÉE DES BOMBES
Description=Les opérations de débarquement se poursuivent à San Carlos. De nouvelles attaques aériennes argentines approchent - défendez le mouillage et permettez à nos troupes de débarquer en sécurité.
