Taskforce1StartMessage=Title=<size=24>福克兰群岛战争1982</size>\n战争中的航母\n<size=24>1982年5月2日</size>\nBody=阿根廷正在尝试发动一场决战，意图击沉一或两艘英国航母，从而迫使英国达成和解。阿根廷海军的五月二十五日号正在从西北方靠近，并有多艘水面舰艇支援。指挥你的部队抵挡其攻击并向东撤退。\n\n允许在战术态势允许时对阿根廷舰船发动攻击，但不要求将其击沉。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=舰队天气预报\n区域：航母行动区域\n有效期：1982年5月2日1630Z时至2230Z时\n风况：西北风3级。海况：3级。\n云量：多云。天气：基本干燥。能见度：低云外良好。\n气压：1030毫巴，正在下降。\n展望：风力增强，1730Z时达到4级，1800Z时达到5级，1830Z时达到6级，云量增加至阴。
Taskforce1Northwoodordersdisengageat60minMessage=From=诺斯伍德舰队总司令\nTo=第317.8特遣大队指挥官\nInfo=所有单位\nSubj=向东撤离\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1.所有部队以最佳速度撤离。优先考虑为后续行动保护航母部队，而非摧毁阿根廷海军。\n\n2.截获信号显示阿根廷军队已收到命令向西撤退。潜艇部队司令将命令我方潜艇将其击沉。除自卫外，无需采取进一步攻击性行为。\n\n3.将部队开往东方，离开此区域后进行报告。祝你们好运。\nButtonText=关闭\nPopupStyle=NavalMessage
60minweatherchangeForecast=舰队天气预报\n区域：航母行动区域\n有效期：1982年5月2日1730Z时至2230Z时\n风况：西北风4级。海况：3级。\n云量：多云。天气：基本干燥。能见度：低云外良好。\n展望：风力进一步增强。
90minweatherchangeForecast=舰队天气预报\n区域：航母行动区域\n有效期：1982年5月2日1800Z时至2230Z时\n风况：西北风5级。海况：4级。\n云量：多云。天气：基本干燥。能见度：低云外良好。\n展望：风力进一步增强。
120minweatherchangeForecast=舰队天气预报\n区域：航母行动区域\n有效期：1982年5月2日1830Z时至2230Z时\n风况：西北风6级。海况：5级。\n云量：多云。天气：基本干燥。能见度：低云外良好。\n展望：强风与恶劣海况持续。
