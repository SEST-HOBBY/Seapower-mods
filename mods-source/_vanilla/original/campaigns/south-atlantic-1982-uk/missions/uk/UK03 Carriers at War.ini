Taskforce1StartMessage=Title=<size=24>Falklands War 1982</size>\nCARRIERS AT WAR\n<size=24>2 May 1982</size>\nBody=Argentina is attempting to conduct a decisive battle to sink one or both British carriers, forcing a settlement. ARA 25 De Mayo is approaching from the northwest with multiple surface units in support. Command your forces to resist their attack and withdraw east.\n\nAttacks on Argentine ships are authorised if the tactical situation permits, but their destruction is not required.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: CARRIER OPERATING AREA\nVALID: 021630Z MAY 82 TO 022230Z MAY 82\nWIND: NW FORCE 3. SEA: SLIGHT.\nCLOUD: BROKEN. WEATHER: MAINLY DRY. VISIBILITY: GOOD OUTSIDE LOW CLOUD.\nPRESSURE: 1030 MB, FALLING.\nOUTLOOK: WIND INCREASING FORCE 4 FROM 1730Z, 5 FROM 1800Z, 6 FROM 1830Z. CLOUD BECOMING OVERCAST
Taskforce1SoutherngroupdetectedMessage=From=CTG 317.8\nTo=ALL UNITS\nInfo=\nSubj=CONTACT REPORT\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. WARNING: Argentine surface group centered on ARA GENERAL BELGRANO has been detected south of the Falkland Islands moving east.\n\n2. Escorting destroyers in this group carry EXOCET missiles with 22nm range.\n\n3. Move away at once from this threat. Only engage if tactical situation allows.\nButtonText=Close\nPopupStyle=NavalMessage
Taskforce1CarrierlostMessage=Title=MISSION FAILED\nBody=Defeat! Both of our carriers have been lost! We can no longer sustain the air support required to complete the campaign, and are forced to negotiate terms with Argentina.\nButtonText=Close\nPopupStyle=Outro
Taskforce1Northwoodordersdisengageat60minMessage=From=CINCFLEET NORTHWOOD\nTo=CTG 317.8\nInfo=ALL UNITS\nSubj=WITHDRAW EAST\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. Withdraw all forces east at best speed. Priority is preservation of carrier force for further offensive operations, not destruction of Argentine navy.\n\n2. Intercepted signal shows Argentine forces have been ordered to retire west. Flag Officer Submarines will task our submarines with their sinking. Further offensive action is not required excepting self-defence.\n\n3. Bring the force east and report when clear of the area. Good luck.\nButtonText=Close\nPopupStyle=NavalMessage
Taskforce1CarrierwithdrawseastMessage=Title=MISSION ACCOMPLISHED\nBody=Victory! We have reached the withdrawal area and the Task Force remains operational. Excellent work, Commander.\nButtonText=Close\nPopupStyle=Outro
