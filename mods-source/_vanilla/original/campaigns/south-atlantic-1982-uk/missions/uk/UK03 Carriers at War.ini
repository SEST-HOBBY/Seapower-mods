Taskforce1CarrierwithdrawseastMessage=Title=임무 완수\nBody=승리! 철수 구역에 도달했으며 기동부대는 작전 능력을 유지하고 있습니다. 훌륭합니다, 지휘관님.\nButtonText=닫기\nPopupStyle=Outro
Taskforce1SoutherngroupdetectedMessage=From=CTG 317.8\nTo=ALL UNITS\nInfo=\nSubj=접촉 보고\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. 경고: 아르헨티나 해군 헤네랄 벨그라노를 중심으로 한 수상 전단이 포클랜드 제도 남쪽에서 탐지되었으며 동쪽으로 이동 중입니다.\n\n2. 이 전단의 호위 구축함은 사거리 22해리의 엑조세 미사일을 탑재하고 있습니다.\n\n3. 즉시 이 위협에서 벗어나십시오. 전술 상황이 허용할 때만 교전하십시오.\nButtonText=닫기\nPopupStyle=NavalMessage
Taskforce1CarrierlostMessage=Title=임무 실패\nBody=패배! 아군 항모 두 척을 모두 잃었습니다! 더 이상 전역을 완수하는 데 필요한 항공 지원을 유지할 수 없으므로 아르헨티나와 협상할 수밖에 없습니다.\nButtonText=닫기\nPopupStyle=Outro
Objective_ProtectCarrier=항모 한 척은 반드시 생존해야 합니다
