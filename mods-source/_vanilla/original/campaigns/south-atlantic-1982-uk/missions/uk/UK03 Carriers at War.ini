Taskforce1SoutherngroupdetectedMessage=From=CTG 317.8\nTo=ALL UNITS\nInfo=\nSubj=RAPPORT DE CONTACT\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. ATTENTION : Un groupe de surface argentin articulé autour de l’ARA GENERAL BELGRANO a été détecté au sud des îles Falkland, faisant route vers l’est.\n\n2. Les destroyers d’escorte de ce groupe emportent des missiles EXOCET d’une portée de 22 milles marins.\n\n3. Éloignez-vous immédiatement de cette menace. N’engagez le combat que si la situation tactique le permet.\nButtonText=Fermer\nPopupStyle=NavalMessage
Taskforce1CarrierlostMessage=Title=ÉCHEC DE LA MISSION\nBody=Défaite ! Nos deux porte-avions ont été perdus ! Nous ne pouvons plus assurer le soutien aérien nécessaire pour mener la campagne à son terme et sommes contraints de négocier les conditions avec l’Argentine.\nButtonText=Fermer\nPopupStyle=Outro
