Taskforce1CarrierwithdrawseastMessage=Title=任務完了\nBody=勝利！撤退区域に到達し、任務部隊は作戦能力を維持している。見事な働きだった、司令官。\nButtonText=閉じる\nPopupStyle=Outro
Taskforce1SoutherngroupdetectedMessage=From=CTG 317.8\nTo=ALL UNITS\nInfo=\nSubj=接触報告\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. 警告：アルゼンチン海軍ヘネラル・ベルグラノを中心とする水上部隊をフォークランド諸島南方で探知。東進中。\n\n2. 同部隊の護衛駆逐艦は射程22海里のエグゾセミサイルを装備。\n\n3. 直ちにこの脅威から離れよ。戦術状況が許す場合のみ交戦せよ。\nButtonText=閉じる\nPopupStyle=NavalMessage
Taskforce1CarrierlostMessage=Title=任務失敗\nBody=敗北！我が軍の空母2隻をともに失った！作戦を完遂するために必要な航空支援を維持できなくなり、アルゼンチンと条件交渉を行わざるを得ない。\nButtonText=閉じる\nPopupStyle=Outro
