Taskforce1CarrierwithdrawseastMessage=Title=HOÀN THÀNH NHIỆM VỤ\nBody=Chiến thắng! Ta đã đến khu vực rút lui và lực lượng đặc nhiệm vẫn duy trì khả năng tác chiến. Làm rất tốt, Chỉ huy.\nButtonText=Đóng\nPopupStyle=Outro
Taskforce1SoutherngroupdetectedMessage=From=CTG 317.8\nTo=ALL UNITS\nInfo=\nSubj=BÁO CÁO TIẾP XÚC\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. CẢNH BÁO: Đã phát hiện nhóm tàu mặt nước Argentina do ARA GENERAL BELGRANO làm nòng cốt ở phía nam quần đảo Falkland, đang di chuyển về phía đông.\n\n2. Các khu trục hạm hộ tống trong nhóm mang tên lửa EXOCET có tầm bắn 22 hải lý.\n\n3. Lập tức tránh xa mối đe dọa này. Chỉ giao chiến nếu tình hình chiến thuật cho phép.\nButtonText=Đóng\nPopupStyle=NavalMessage
Taskforce1CarrierlostMessage=Title=NHIỆM VỤ THẤT BẠI\nBody=Thất bại! Cả hai tàu sân bay của ta đã bị mất! Ta không còn có thể duy trì yểm trợ trên không cần thiết để hoàn thành chiến dịch và buộc phải đàm phán các điều khoản với Argentina.\nButtonText=Đóng\nPopupStyle=Outro
Objective_ProtectCarrier=Phải giữ được một tàu sân bay
