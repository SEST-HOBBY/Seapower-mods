Taskforce1CarrierwithdrawseastMessage=Title=MISIÓN CUMPLIDA\nBody=¡Victoria! Hemos llegado a la zona de retirada y la fuerza de tareas sigue operativa. Excelente trabajo, comandante.\nButtonText=Cerrar\nPopupStyle=Outro
Taskforce1SoutherngroupdetectedMessage=From=CTG 317.8\nTo=ALL UNITS\nInfo=\nSubj=INFORME DE CONTACTO\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. ADVERTENCIA: Se ha detectado un grupo de superficie argentino centrado en el ARA GENERAL BELGRANO al sur de las islas Malvinas, navegando hacia el este.\n\n2. Los destructores de escolta de este grupo llevan misiles EXOCET con un alcance de 22 millas náuticas.\n\n3. Aléjese de inmediato de esta amenaza. Entable combate solo si la situación táctica lo permite.\nButtonText=Cerrar\nPopupStyle=NavalMessage
Taskforce1CarrierlostMessage=Title=MISIÓN FRACASADA\nBody=¡Derrota! ¡Hemos perdido nuestros dos portaaviones! Ya no podemos mantener el apoyo aéreo necesario para completar la campaña y nos vemos obligados a negociar las condiciones con Argentina.\nButtonText=Cerrar\nPopupStyle=Outro
