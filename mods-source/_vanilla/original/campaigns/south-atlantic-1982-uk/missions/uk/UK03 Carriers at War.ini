Taskforce1CarrierwithdrawseastMessage=Title=任务完成！\nBody=任务完成！我们已抵达撤离区域且特遣舰队仍有战斗力。干得好，指挥官。\nButtonText=关闭\nPopupStyle=Outro
Taskforce1SoutherngroupdetectedMessage=From=第317.8特遣大队指挥官\nTo=所有单位\nInfo=\nSubj=接触报告\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1.提示：以贝尔格拉诺将军号为核心的阿根廷水面战斗群在福克兰群岛以南被发现，正在向东航行。\n\n2.此战斗群的护航驱逐舰携带了飞鱼导弹，射程22海里。\n\n3.立即远离此威胁，仅在战术态势允许时交战。\nButtonText=关闭\nPopupStyle=NavalMessage
Taskforce1CarrierlostMessage=Title=任务失败！\nBody=任务失败！我方的两艘航母都已被击沉！我们已无法维持此次战役所需的空中支援，被迫与阿根廷谈判。\nButtonText=关闭\nPopupStyle=Outro
