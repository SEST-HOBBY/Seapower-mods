Taskforce1StartMessage=Title=<size=24>福克兰群岛战争1982</size>\n拿下！\n<size=24>1982年5月2日</size>\nBody=一艘英国潜艇追踪到了以贝尔格拉诺将军号巡洋舰为核心的阿根廷军队。诺斯伍德已下达命令：将其击沉。\n\n靠近敌方编队并击沉巡洋舰。其护航舰艇是可选目标。击沉贝尔格拉诺将军号后立即撤离并脱离接触。\nButtonText=开始任务\nPopupStyle=Intro
