Taskforce1StartMessage=Title=<size=24>Falklands War 1982</size>\nGOTCHA!\n<size=24>2 May 1982</size>\nBody=A British submarine has tracked the Argentine force centered on the cruiser General Belgrano. Orders have come down from Northwood: sink it.\n\nClose with the enemy formation and sink the cruiser. Sinking the escorts is optional. Once the Belgrano has been sunk, withdraw and evade contact.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: SOUTHWEST APPROACHES\nVALID: 022000Z MAY 82 TO 030200Z MAY 82\nWIND: N FORCE 6. SEA: ROUGH.\nCLOUD: OVERCAST. WEATHER: MAINLY DRY. VISIBILITY: GOOD OUTSIDE LOW CLOUD.\nPRESSURE: 1015 MB, FALLING.\nOUTLOOK: WIND NW FORCE 7
