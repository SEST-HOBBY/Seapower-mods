Taskforce1FortAustinLostMessage=Title=탄약 보급 능력 상실\nBody=RFA Fort Austin이 격침되었습니다. 캠페인이 끝날 때까지 더 이상 탄약을 보급받을 수 없습니다. 남은 탄약을 아껴 쓰십시오.\nButtonText=닫기\nPopupStyle=Notification
Taskforce1StartMessage=Title=<size=24>포클랜드 전쟁 1982</size>\n구스그린 기습\n<size=24>1982년 5월 5일</size>\nBody=구스그린의 아르헨티나군은 기동부대를 상대로 한 항공 작전을 계속 지원하고 있습니다. 항모 부대를 지휘하여 구스그린의 35 mm 포 진지 네 곳을 공격하십시오. 이 네 진지 중 최소 세 곳을 파괴하십시오.\n\nRFA Appleleaf와 탄약 보급함 RFA Fort Austin은 포클랜드 제도 동쪽 150해리의 군수 지원 기지에 있습니다. Fort Austin을 보호하십시오. 이 함선이 격침되면 캠페인이 끝날 때까지 더 이상 탄약을 보급받을 수 없습니다. 이 지역에 적 잠수함이 있을 수 있습니다.\n\n엑조세를 탑재한 슈페르 에탕다르를 포함하여 본토 항공기의 공격이 예상됩니다. 현지 초계기와 수송 헬리콥터도 섬 상공에서 활동하고 있습니다. 아르헨티나 봉쇄 돌파선 MV Rio Carcarana와 MV Formosa가 수비대 보급품을 싣고 스탠리 앞바다에 있는 것으로 추정됩니다. 발견하면 격침하십시오.\nButtonText=임무 시작\nPopupStyle=Intro
Objective_DestroyGooseGreenFacilities=구스그린의 35 mm 포 진지 네 곳 중 최소 세 곳을 파괴하십시오
