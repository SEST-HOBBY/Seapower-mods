Taskforce1StartMessage=Title=<size=24>福克兰群岛战争1982</size>\n突袭古斯格林\n<size=24>1982年5月5日</size>\nBody=古斯格林的阿根廷军队持续支援攻击我方特遣舰队的空中行动。指挥航母部队打击古斯格林的四处35毫米炮阵地，摧毁这四处阵地中的至少三处。\n\n皇家辅助舰队的苹果叶号油船和奥斯汀堡号弹药补给船目前位于福克兰群岛以东150海里处的后勤站，此区域内可能有敌方潜艇活动。保护好奥斯汀堡号，如果它被击沉，此战役期间就将无法再进行弹药补给。\n\n预计阿根廷本土的飞机将发动攻击，其中包括携带飞鱼导弹的超级军旗。此外，阿根廷还在岛屿周边执行巡逻和直升机运输任务。情报显示阿根廷的卡尔卡拉尼亚河号和美丽号封锁突破船正在斯坦利附近为守军提供补给，如果发现应将其击沉。\nButtonText=开始任务\nPopupStyle=Intro
Description=古斯格林的阿根廷军队持续支援攻击我方特遣舰队的空中行动。指挥航母部队打击岸上的航空支援设施。提示：预计携带飞鱼导弹的超级军旗将发动打击！
