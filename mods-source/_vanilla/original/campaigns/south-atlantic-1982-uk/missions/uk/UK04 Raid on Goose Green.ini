Taskforce1FortAustinLostMessage=Title=MẤT KHẢ NĂNG TIẾP TẾ ĐẠN DƯỢC\nBody=RFA Fort Austin đã bị đánh chìm. Sẽ không còn tiếp tế đạn dược trong phần còn lại của chiến dịch. Hãy tiết kiệm số đạn còn lại.\nButtonText=Đóng\nPopupStyle=Notification
Taskforce1StartMessage=Title=<size=24>Chiến tranh Falkland 1982</size>\nTẬP KÍCH GOOSE GREEN\n<size=24>Ngày 5 tháng 5 năm 1982</size>\nBody=Lực lượng Argentina tại Goose Green tiếp tục hỗ trợ hoạt động không quân chống lại lực lượng đặc nhiệm. Chỉ huy lực lượng tàu sân bay tấn công bốn trận địa pháo 35 mm tại Goose Green. Phá hủy ít nhất ba trong bốn trận địa này.\n\nRFA Appleleaf và tàu tiếp tế đạn dược RFA Fort Austin đang ở trạm hậu cần cách quần đảo Falkland 150 hải lý về phía đông. Bảo vệ Fort Austin. Nếu tàu bị đánh chìm, sẽ không còn tiếp tế đạn dược trong phần còn lại của chiến dịch. Tàu ngầm địch có thể hiện diện trong khu vực.\n\nDự kiến máy bay từ đất liền sẽ tấn công, bao gồm Super Etendard mang Exocet. Các chuyến tuần tra địa phương và trực thăng vận tải cũng đang hoạt động trên các đảo. Các tàu vượt phong tỏa Argentina MV Rio Carcarana và MV Formosa được cho là đang ở ngoài khơi Stanley, chở tiếp tế cho quân đồn trú. Hãy đánh chìm nếu phát hiện.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Objective_DestroyGooseGreenFacilities=Phá hủy ít nhất ba trong bốn trận địa pháo 35 mm tại Goose Green
Taskforce1GooseGreenfacilitiesdestroyedMessage=Title=GOOSE GREEN BỊ CHẾ ÁP\nBody=Ba trong bốn trận địa pháo 35 mm tại Goose Green đã bị phá hủy!\nButtonText=Đóng\nPopupStyle=Notification
