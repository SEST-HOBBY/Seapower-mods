Taskforce1StartMessage=Title=<size=24>Guerre des Malouines 1982</size>\nRAID SUR GOOSE GREEN\n<size=24>5 mai 1982</size>\nBody=Les forces argentines à Goose Green continuent de soutenir les opérations aériennes contre la Task Force. Commandez la force aéronavale pour frapper les quatre positions de canons de 35 mm à Goose Green. Détruisez au moins trois de ces quatre positions.\n\nLe RFA Appleleaf et le ravitailleur en munitions RFA Fort Austin se trouvent à la station logistique, à 150 milles marins à l’est des Falkland. Protégez le Fort Austin. S’il est coulé, aucun autre ravitaillement en munitions ne sera disponible durant la campagne. Des sous-marins ennemis peuvent être présents dans la zone.\n\nAttendez-vous à des attaques d’avions basés sur le continent, notamment des Super Etendard armés d’Exocet. Des patrouilles locales et des hélicoptères de transport opèrent également au-dessus des îles. Les navires argentins forçant le blocus MV Rio Carcarana et MV Formosa seraient au large de Stanley avec du ravitaillement pour la garnison. Coulez-les si vous les trouvez.\nButtonText=Commencer la mission\nPopupStyle=Intro
Objective_DestroyGooseGreenFacilities=Détruisez au moins trois des quatre positions de canons de 35 mm à Goose Green
Taskforce1GooseGreenfacilitiesdestroyedMessage=Title=GOOSE GREEN NEUTRALISÉ\nBody=Trois des quatre positions de canons de 35 mm à Goose Green ont été détruites !\nButtonText=Fermer\nPopupStyle=Notification
