Taskforce1FortAustinLostMessage=Title=弾薬補給能力喪失\nBody=RFA Fort Austinが撃沈された。以後、このキャンペーン中の弾薬補給は利用できない。残存弾薬を節約せよ。\nButtonText=閉じる\nPopupStyle=Notification
Taskforce1StartMessage=Title=<size=24>フォークランド紛争 1982</size>\nグースグリーン襲撃\n<size=24>1982年5月5日</size>\nBody=グースグリーンのアルゼンチン軍は、任務部隊に対する航空作戦を支援し続けている。空母部隊を指揮し、グースグリーンの35 mm砲陣地4か所を攻撃せよ。この4か所のうち少なくとも3か所を破壊せよ。\n\nRFA Appleleafと弾薬補給艦RFA Fort Austinは、フォークランド諸島の東150海里にある補給拠点にいる。Fort Austinを守れ。同艦が撃沈された場合、以後このキャンペーン中の弾薬補給は利用できない。付近に敵潜水艦が存在する可能性がある。\n\nエグゾセ装備のシュペルエタンダールを含む、本土からの航空攻撃が予想される。島々の上空では現地の哨戒機や輸送ヘリも活動している。アルゼンチンの封鎖突破船MV Rio CarcaranaとMV Formosaは、守備隊への補給物資を積んでスタンリー沖にいるとみられる。発見した場合は撃沈せよ。\nButtonText=任務開始\nPopupStyle=Intro
Objective_DestroyGooseGreenFacilities=グースグリーンの35 mm砲陣地4か所のうち少なくとも3か所を破壊する
Taskforce1GooseGreenfacilitiesdestroyedMessage=Title=グースグリーン制圧\nBody=グースグリーンの35 mm砲陣地4か所のうち3か所を破壊した！\nButtonText=閉じる\nPopupStyle=Notification
[Language_vn]
Taskforce1Carrierlost-missionfailedMessage=Title=NHIỆM VỤ THẤT BẠI\nBody=Thất bại! Cả hai tàu sân bay của ta đã bị mất! Ta không còn có thể duy trì yểm trợ trên không cần thiết để hoàn thành chiến dịch và buộc phải đàm phán các điều khoản với Argentina.\nButtonText=Đóng\nPopupStyle=Outro
