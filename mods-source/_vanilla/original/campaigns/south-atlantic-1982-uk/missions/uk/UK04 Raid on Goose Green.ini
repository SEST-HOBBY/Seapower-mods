Taskforce1StartMessage=Title=<size=24>Guerra de las Malvinas 1982</size>\nINCURSIÓN EN GOOSE GREEN\n<size=24>5 de mayo de 1982</size>\nBody=Las fuerzas argentinas en Goose Green siguen apoyando las operaciones aéreas contra la fuerza de tareas. Dirija la fuerza de portaaviones para atacar las cuatro posiciones de cañones de 35 mm en Goose Green. Destruya al menos tres de estas cuatro posiciones.\n\nEl RFA Appleleaf y el buque de reabastecimiento de municiones RFA Fort Austin se encuentran en la estación logística a 150 millas náuticas al este de las Malvinas. Proteja al Fort Austin. Si se hunde, no habrá más reabastecimiento de municiones durante la campaña. Puede haber submarinos enemigos en la zona.\n\nEspere ataques de aviones desde el continente, incluidos Super Etendard con Exocet. También operan sobre las islas patrullas locales y helicópteros de transporte. Se cree que los buques argentinos que burlan el bloqueo, MV Rio Carcarana y MV Formosa, están frente a Stanley transportando suministros para la guarnición. Deben ser hundidos si se localizan.\nButtonText=Iniciar misión\nPopupStyle=Intro
Objective_DestroyGooseGreenFacilities=Destruya al menos tres de las cuatro posiciones de cañones de 35 mm en Goose Green
