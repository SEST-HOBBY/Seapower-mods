Taskforce1StartMessage=Title=<size=24>Falklands War 1982</size>\nRAID ON GOOSE GREEN\n<size=24>5 May 1982</size>\nBody=Argentine forces at Goose Green continue to support air operations against the Task Force. Command the carrier force to strike the four 35 mm gun positions at Goose Green. Destroy at least three of these four positions.\n\nRFA Appleleaf and ammunition replenishment ship RFA Fort Austin are at the logistics station 150 nm east of the Falklands. Protect Fort Austin. If she is sunk, no further ammunition replenishment will be available during the campaign. Enemy submarines may be present in the area.\n\nExpect attacks by mainland aircraft, including Super Etendards with Exocets. Local patrols and helicopter transports are also operating over the islands. Argentine blockade runners MV Rio Carcarana and MV Formosa are believed to be off Stanley carrying supplies for the garrison, and should be sunk if located.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: GOOSE GREEN APPROACHES\nVALID: 051400Z MAY 82 TO 052000Z MAY 82\nWIND: N FORCE 3. SEA: SLIGHT.\nCLOUD: OVERCAST. WEATHER: RAIN. VISIBILITY: MODERATE, LOCALLY POOR IN LOW CLOUD.\nPRESSURE: 1007 MB, FALLING.\nOUTLOOK: WIND W FORCE 3
