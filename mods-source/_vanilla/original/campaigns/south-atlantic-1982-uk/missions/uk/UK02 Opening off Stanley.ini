Side0Trigger6Message=Title=已干扰机场作业\nBody=斯坦利的燃料储罐、通信站和弹药库已被摧毁。我们可以将水面炮击部队撤往东方，或冒遭遇空袭的更大风险继续攻击敌方设施。\nButtonText=关闭\nPopupStyle=Notification
Side0Trigger12Message=Title=火神轰炸机入场\nBody=提示：英国皇家空军的一架火神B.2正在严格的无线电静默状态下从北方靠近，机上载有用于轰炸机场的炸弹。执行打击，之后命令其向北飞往标记的加油机中继站，以便返回阿森松岛。\nButtonText=关闭\nPopupStyle=Notification
Side0Trigger15Message=Title=任务失败！\nBody=任务失败！我方的两艘航母都已被击沉！我们已无法维持此次战役所需的空中支援，被迫与阿根廷谈判。\nButtonText=关闭\nPopupStyle=Outro
