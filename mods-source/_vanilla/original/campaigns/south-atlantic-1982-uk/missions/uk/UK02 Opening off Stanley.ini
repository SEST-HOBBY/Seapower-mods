Side0Trigger6Message=Title=OPÉRATIONS AÉRIENNES PERTURBÉES\nBody=Les réservoirs de carburant, le poste de communications et le dépôt de munitions de Stanley ont été détruits. Nous pouvons retirer notre groupe de bombardement naval vers l’est ou poursuivre les attaques contre les installations ennemies au risque accru de subir une attaque aérienne.\nButtonText=Fermer\nPopupStyle=Notification
Side0Trigger12Message=Title=VULCAN EN APPROCHE\nBody=Attention : Un Vulcan B.2 de la RAF approche par le nord dans un silence radio strict, chargé de bombes pour frapper l’aérodrome. Effectuez la frappe, puis ordonnez au Vulcan de mettre le cap au nord vers la zone de ravitaillement en vol qui apparaîtra sur la carte afin de permettre à l’appareil de rentrer à Ascension.\nButtonText=Fermer\nPopupStyle=Notification
Side0Trigger15Message=Title=ÉCHEC DE LA MISSION\nBody=Défaite ! Nos deux porte-avions ont été perdus ! Nous ne pouvons plus assurer le soutien aérien nécessaire pour mener la campagne à son terme et sommes contraints de négocier les conditions avec l’Argentine.\nButtonText=Fermer\nPopupStyle=Outro
Objective_DisruptStanleyAirOperations=Détruisez les réservoirs de carburant, le poste de communications et le dépôt de munitions de Stanley
Objective_PreserveCarrier=Un porte-avions doit survivre
