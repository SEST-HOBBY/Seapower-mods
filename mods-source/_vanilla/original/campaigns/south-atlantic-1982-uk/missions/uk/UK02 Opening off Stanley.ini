Side0Trigger6Message=Title=飛行場の運用を妨害\nBody=スタンリーの燃料タンク、通信所、弾薬庫を破壊した。艦砲射撃部隊を東へ撤退させるか、空襲の危険が増すことを承知で敵施設への攻撃を続行できる。\nButtonText=閉じる\nPopupStyle=Notification
Side0Trigger12Message=Title=バルカン接近中\nBody=警告：イギリス空軍のバルカン B.2 1機が、飛行場攻撃用の爆弾を搭載し、厳格な無線封止のもと北から接近中。攻撃を実施した後、アセンション島へ帰還できるよう、表示される北方の空中給油中継区域へ向かうようバルカンに命令せよ。\nButtonText=閉じる\nPopupStyle=Notification
Side0Trigger15Message=Title=任務失敗\nBody=敗北！我が軍の空母2隻をともに失った！作戦を完遂するために必要な航空支援を維持できなくなり、アルゼンチンと条件交渉を行わざるを得ない。\nButtonText=閉じる\nPopupStyle=Outro
