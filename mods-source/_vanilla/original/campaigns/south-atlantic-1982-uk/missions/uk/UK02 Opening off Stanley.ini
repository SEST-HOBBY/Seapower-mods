Side0Trigger1Message=Title=<size=24>福克兰群岛战争1982</size>\n斯坦利揭幕战\n<size=24>1982年5月1日</size>\nBody=英国军队收到命令将斯坦利作为对福克兰群岛首轮攻势的目标之一。指挥特遣舰队打击机场支持设施，在压制岸上设施后向东撤离。\n\n工兵高地的预警哨站和斯坦利的35毫米炮阵地是可选目标。预计阿根廷将从本土出动飞机攻击我方部队。\n\n预计岛屿上空将出现IA-58巡逻和直升机运输活动。并非所有空中接触都是来袭的威胁。在动用舰队防空之前需识别接触并判断其优先级。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=舰队天气预报\n区域：斯坦利附近\n有效期：1982年5月1日1200Z时至1800Z时\n风况：西南风3级。海况：3级。\n云量：多云。天气：基本干燥。能见度：低云外良好。\n气压：1027毫巴，正在上升。\n展望：西南风3级。
Side0Trigger7Message=Title=已压制工兵高地\nBody=工兵高地的预警雷达和指挥哨站已被摧毁。\nButtonText=关闭\nPopupStyle=Notification
Side0Trigger8Message=Title=任务完成！\nBody=任务完成！斯坦利的设施已被压制，未被击沉的炮击舰已经撤离。干得好，指挥官。\nButtonText=关闭\nPopupStyle=Outro
Side0Trigger14Message=Title=已损失炮击战斗群\nBody=炮击战斗群的所有船只已被摧毁。无需再进行水面撤离。使用飞机完成对斯坦利的打击。\nButtonText=关闭\nPopupStyle=Notification
Side0Trigger16Message=Title=已完成打击目标\nBody=海岸阵地已被压制，但你损失了炮击战斗群。你可以手动结束任务。无需造成进一步杀伤。\nButtonText=继续\nPopupStyle=Notification
Objective_SilenceSapperHill=可选：摧毁工兵高地的预警雷达和指挥哨站
Objective_WithdrawEast=完成打击后将未被击沉的炮击舰撤往东方
