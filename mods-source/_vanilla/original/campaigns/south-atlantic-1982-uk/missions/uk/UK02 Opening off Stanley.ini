Side0Trigger6Message=Title=OPERACIONES DEL AERÓDROMO INTERRUMPIDAS\nBody=Los depósitos de combustible, la estación de comunicaciones y el depósito de municiones de Stanley han sido destruidos. Podemos retirar nuestra fuerza de bombardeo naval hacia el este o continuar atacando las instalaciones enemigas con mayor riesgo de ataque aéreo.\nButtonText=Cerrar\nPopupStyle=Notification
Side0Trigger12Message=Title=VULCAN EN APROXIMACIÓN\nBody=Advertencia: Un Vulcan B.2 de la RAF se aproxima desde el norte bajo estricto silencio de radio, cargado con bombas para atacar el aeródromo. Ejecute el ataque y después ordene al Vulcan dirigirse al norte, hacia la zona de reabastecimiento en vuelo que aparecerá marcada para permitir el regreso del avión a Ascensión.\nButtonText=Cerrar\nPopupStyle=Notification
Side0Trigger15Message=Title=MISIÓN FRACASADA\nBody=¡Derrota! ¡Hemos perdido nuestros dos portaaviones! Ya no podemos mantener el apoyo aéreo necesario para completar la campaña y nos vemos obligados a negociar las condiciones con Argentina.\nButtonText=Cerrar\nPopupStyle=Outro
Objective_DisruptStanleyAirOperations=Destruye los depósitos de combustible, la estación de comunicaciones y el depósito de municiones de Stanley
Objective_PreserveCarrier=Un portaaviones debe sobrevivir
