Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nOPENING OFF STANLEY\n<size=24>1 May 1982</size>\nBody=British forces have been ordered to strike Stanley as part of the first offensive operations against the Falkland Islands. Command the task force to hit the airfield support installations, then retire east once the shore facilities are suppressed.\n\nThe Sapper Hill warning post and Stanley's 35 mm gun positions are optional targets. Argentine aircraft from the mainland are expected to sortie to attack our force.\n\nExpect local Pucara patrols and helicopter transport movements over the islands. Not every air contact is an incoming strike. Identify and prioritise contacts before committing the fleet air defence.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: STANLEY APPROACHES\nVALID: 011200Z MAY 82 TO 011800Z MAY 82\nWIND: SW FORCE 3. SEA: SLIGHT.\nCLOUD: BROKEN. WEATHER: MAINLY DRY. VISIBILITY: GOOD OUTSIDE LOW CLOUD.\nPRESSURE: 1027 MB, RISING.\nOUTLOOK: WIND SW FORCE 3
Side0Trigger6Message=Title=AIRFIELD OPERATIONS DISRUPTED\nBody=The Stanley fuel tanks, communications station, and ammunition depot have been destroyed. We can withdraw our surface gunnery force east, or continue attacking enemy facilities at higher risk of air attack.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger7Message=Title=SAPPER HILL SILENCED\nBody=The warning radar and command post at Sapper Hill have been destroyed.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger8Message=Title=MISSION ACCOMPLISHED\nBody=Victory! The Stanley installations have been suppressed and the surviving bombardment ships have withdrawn. Excellent work, Commander.\nButtonText=Close\nPopupStyle=Outro
Side0Trigger12Message=Title=VULCAN CHECK-IN\nBody=Warning: An RAF Vulcan B.2 is approaching from the north under strict radio silence, loaded with bombs to strike the airfield. Conduct the strike and then order the Vulcan north to the marked tanker relay zone that appears to allow the aircraft to return to Ascension.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger14Message=Title=BOMBARDMENT GROUP LOST\nBody=All ships in the bombardment group have been lost. Surface withdrawal is no longer required. Complete the strike against Stanley with aircraft.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger15Message=Title=MISSION FAILED\nBody=Defeat! Both of our carriers have been lost! We can no longer sustain the air support required to complete the campaign, and are forced to negotiate terms with Argentina.\nButtonText=Close\nPopupStyle=Outro
Side0Trigger16Message=Title=STRIKE OBJECTIVE ACHIEVED\nBody=Shore positions suppressed, but the bombardment group is lost. You may end the mission manually. Further losses are not required.\nButtonText=Continue\nPopupStyle=Notification
Objective_DisruptStanleyAirOperations=Destroy the Stanley fuel tanks, communications station, and ammunition depot
Objective_SilenceSapperHill=OPTIONAL: Destroy Sapper Hill warning radar and command post
Objective_WithdrawEast=Withdraw every surviving bombardment ship east after the strike
Objective_PreserveCarrier=One carrier must survive
