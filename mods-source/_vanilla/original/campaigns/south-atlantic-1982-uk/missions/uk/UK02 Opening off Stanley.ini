Side0Trigger6Message=Title=비행장 운용 차질\nBody=스탠리의 연료 탱크, 통신소, 탄약고가 파괴되었습니다. 함포 사격 부대를 동쪽으로 철수시키거나, 공습 위험을 더 감수하고 적 시설 공격을 계속할 수 있습니다.\nButtonText=닫기\nPopupStyle=Notification
Side0Trigger12Message=Title=벌컨 접근 중\nBody=경고: 영국 공군 벌컨 B.2 한 대가 엄격한 무선 침묵을 유지하며 북쪽에서 접근 중입니다. 비행장 공격용 폭탄을 탑재하고 있습니다. 공격을 수행한 다음, 벌컨이 어센션섬으로 복귀할 수 있도록 이후 표시되는 북쪽 공중급유 중계 구역으로 이동하라고 명령하십시오.\nButtonText=닫기\nPopupStyle=Notification
Side0Trigger15Message=Title=임무 실패\nBody=패배! 아군 항모 두 척을 모두 잃었습니다! 더 이상 전역을 완수하는 데 필요한 항공 지원을 유지할 수 없으므로 아르헨티나와 협상할 수밖에 없습니다.\nButtonText=닫기\nPopupStyle=Outro
Objective_DisruptStanleyAirOperations=스탠리의 연료 탱크, 통신소, 탄약고를 파괴하십시오
Objective_PreserveCarrier=항모 한 척은 반드시 생존해야 합니다
