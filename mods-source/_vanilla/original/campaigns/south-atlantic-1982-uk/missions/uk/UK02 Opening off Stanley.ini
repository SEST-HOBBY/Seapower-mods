Side0Trigger6Message=Title=HOẠT ĐỘNG SÂN BAY BỊ GIÁN ĐOẠN\nBody=Các bồn nhiên liệu, trạm thông tin liên lạc và kho đạn tại Stanley đã bị phá hủy. Chúng ta có thể rút lực lượng pháo kích hải quân về phía đông hoặc tiếp tục tấn công các cơ sở của địch với nguy cơ bị không kích cao hơn.\nButtonText=Đóng\nPopupStyle=Notification
Side0Trigger12Message=Title=VULCAN ĐANG TIẾP CẬN\nBody=Cảnh báo: Một chiếc Vulcan B.2 của Không quân Hoàng gia Anh đang tiếp cận từ phía bắc, tuân thủ nghiêm ngặt chế độ im lặng vô tuyến và mang bom để tấn công sân bay. Tiến hành cuộc tấn công, sau đó ra lệnh cho Vulcan bay về phía bắc đến khu vực tiếp sức tiếp dầu trên không sẽ được đánh dấu để máy bay có thể trở về Ascension.\nButtonText=Đóng\nPopupStyle=Notification
Side0Trigger15Message=Title=NHIỆM VỤ THẤT BẠI\nBody=Thất bại! Cả hai tàu sân bay của ta đã bị mất! Ta không còn có thể duy trì yểm trợ trên không cần thiết để hoàn thành chiến dịch và buộc phải đàm phán các điều khoản với Argentina.\nButtonText=Đóng\nPopupStyle=Outro
Objective_DisruptStanleyAirOperations=Phá hủy các bồn nhiên liệu, trạm thông tin liên lạc và kho đạn tại Stanley
