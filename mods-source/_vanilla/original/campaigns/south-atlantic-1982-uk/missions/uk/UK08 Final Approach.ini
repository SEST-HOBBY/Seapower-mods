Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nTHE FINAL APPROACH\n<size=24>8 June 1982</size>\nBody=British forces are closing on the remaining Argentine positions around Stanley, advancing on foot and by helicopter. The Welsh Guards have landed at Fitzroy, where their equipment is still being unloaded.\n\nFurther air attacks from the Argentine mainland are expected. Defend the LSLs at the Fitzroy anchorage and provide naval gunfire support for the advance on Stanley. At least one landing ship must survive.\n\nIntelligence reports suggest the Argentines have flown an improvised shore-based Exocet battery into Stanley. Reconnaissance flights have also identified numerous anti-aircraft positions and coastal guns. Use your ships and aircraft to destroy the remaining military shore installations. Expect missile and artillery fire as you close the coast.\n\nSuccess here will pressure the Argentine garrison to surrender. Good luck, Commander!\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: FITZROY APPROACHES\nVALID: 081400Z JUN 82 TO 082000Z JUN 82\nWIND: NW FORCE 4. SEA: SLIGHT.\nCLOUD: BROKEN. WEATHER: MAINLY DRY. VISIBILITY: GOOD OUTSIDE LOW CLOUD.\nPRESSURE: 982 MB, FALLING.\nOUTLOOK: WIND NW FORCE 4 AND OVERCAST CLOUD.
Side0Trigger25Message=From=CINCFLEET NORTHWOOD\nTo=TASK FORCE COMMANDER\nInfo=CTG 317\nSubj=Loss of amphibious shipping\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. We confirm receipt of your message indicating loss of both SIR TRISTRAM and SIR GALAHAD.\n\n2. This is a major failure on your part to protect the task force.\n\n3. Continue operations to support troops ashore. Full accounting of this action will be required once operations are complete.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger30Message=From=CINCFLEET NORTHWOOD\nTo=TASK FORCE COMMANDER\nInfo=CTG 317.8\nSubj=CEASE FIRE\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1. Commander Land Forces reports that the Argentine command at Stanley has requested a ceasefire. Arrangements for the surrender of the garrison are being discussed.\n\n2. Cease naval bombardment and offensive air operations forthwith. Our troops have been ordered not to fire except in self-defence.\n\n3. Your ships and aircraft have given valuable support during the final advance.\n\n4. To all officers and men, my thanks for a difficult duty faithfully performed. Further instructions will follow. Well done.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_ProtectLSLs=At least one landing ship must survive
Objective_DestroyShoreInstallations=Destroy all marked shore installations
