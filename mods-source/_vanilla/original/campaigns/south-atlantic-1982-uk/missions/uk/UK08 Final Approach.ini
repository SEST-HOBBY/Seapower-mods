Side0Trigger1Message=Title=<size=24>福克兰群岛战争1982</size>\n最后推进\n<size=24>1982年6月8日</size>\nBody=英国军队正在通过步行和直升机靠近斯坦利附近剩余的阿根廷阵地。威尔士卫队已在菲茨罗伊登陆，正在卸载装备。\n\n预计阿根廷将从本土发动进一步空袭。保护菲茨罗伊锚地的登陆后勤舰，并为向斯坦利推进的部队提供海军火炮支援。确保至少一艘登陆船只不被击沉。\n\n情报显示阿根廷人已将一个简易的岸基飞鱼发射器空运至斯坦利。空中侦察也识别出大量防空阵地和海岸炮。使用你的船只和飞机摧毁剩余的岸上军用设施。在靠近海岸时准备好应对导弹和火炮攻击。\n\n若我们在此取得成功，即可迫使阿根廷守军投降。祝你好运，指挥官！\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=舰队天气预报\n区域：菲茨罗伊附近\n有效期：1982年6月8日1400Z时至2000Z时\n风况：西北风4级。海况：3级。\n云量：多云。天气：基本干燥。能见度：低云外良好。\n气压：982毫巴，正在下降。\n展望：西北风4级；阴。
Side0Trigger25Message=From=诺斯伍德舰队总司令\nTo=特遣舰队指挥官\nInfo=第317.8特遣大队指挥官\nSubj=两栖船只损毁\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1.我们已收到崔斯特瑞姆爵士号和加拉哈德爵士号损毁的消息。\n\n2.你未能保护好特遣舰队，这是一次重大失职。\n\n3.继续执行支援岸上部队的行动。完成行动后就此次事件提交详尽的说明报告。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger30Message=From=诺斯伍德舰队总司令\nTo=特遣舰队指挥官\nInfo=第317.8特遣大队指挥官\nSubj=停火\nPrecedence=Flash\nClassification=Secret\nTemplate=Britain\nBody=1.地面部队指挥官报告斯坦利的阿根廷指挥部已请求停火，目前正在商讨守军的投降事宜。\n\n2.立即停止海军炮击和空袭。我方部队已收到命令，除非出于自卫，否则不得开火。\n\n3.你的船只和飞机在最后推进中发挥了重要作用。\n\n4.感谢全体官兵尽职尽责地完成了这项艰巨的任务。后续指示将另行下达。干得好。\nButtonText=关闭\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_ProtectLSLs=至少一艘登陆船只不被击沉
