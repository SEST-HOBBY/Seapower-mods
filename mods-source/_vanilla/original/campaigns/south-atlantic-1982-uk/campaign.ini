Description_en=
MissionImage_en=campaigns/south-atlantic-1982-uk/art/south_atlantic_uk04b_sheet.png
MissionIntro_en=ARA 25 de Mayo is withdrawing north along the Patagonian coast under destroyer and aircraft cover. Intercept from seaward and sink the carrier before she clears the patrol area, then withdraw east.
MissionIntro_vn=ARA 25 de Mayo đang rút về phía bắc dọc bờ biển Patagonia dưới sự yểm trợ của khu trục hạm và máy bay. Đánh chặn từ phía biển và đánh chìm tàu sân bay trước khi nó rời khu vực tuần tra, sau đó rút về phía đông.
MissionIntro_ko=아르헨티나 해군 베인티싱코 데 마요가 구축함과 항공기의 엄호를 받으며 파타고니아 해안을 따라 북쪽으로 철수 중입니다. 외해에서 요격하여 항모가 초계 구역을 벗어나기 전에 격침한 뒤 동쪽으로 철수하십시오.
MissionIntro_ja=アルゼンチン海軍五月二十五日号は、駆逐艦と航空機の援護下でパタゴニア沿岸を北へ撤退中。沖合から迎撃し、哨戒区域を離れる前に空母を撃沈した後、東へ撤退せよ。
MissionIntro_cn=五月二十五日号航母正在驱逐舰和飞机的掩护下沿巴塔哥尼亚海岸向北撤离。从海底进行拦截，在航母离开巡逻区域前将其击沉，之后向东撤离。
MissionIntro_fr=L’ARA 25 de Mayo se replie vers le nord le long de la côte patagonienne, sous couverture de destroyers et d’aéronefs. Interceptez-le depuis le large et coulez le porte-avions avant qu’il ne quitte la zone de patrouille, puis retirez-vous vers l’est.
MissionIntro_es=El ARA 25 de Mayo se retira al norte por la costa patagónica bajo cobertura de destructores y aeronaves. Intercéptelo desde mar abierto y hunda el portaaviones antes de que abandone la zona de patrulla, después retírese al este.
MissionIntro_de=ARA 25 de Mayo is withdrawing north along the Patagonian coast under destroyer and aircraft cover. Intercept from seaward and sink the carrier before she clears the patrol area, then withdraw east.
MissionResupplyRules_en=Our extended patrol will not allow for resupply after this mission. Expend weapons wisely.
