MissionSequenceName_en=MISSION 05
MapShortName_en=UK05
Description_en=
MissionImage_en=campaigns/south-atlantic-1982-uk/art/south_atlantic_uk05_sheet.png
MissionIntro_en=Sweep Falkland Sound ahead of our planned landings at San Carlos. Take one ship north from Fox Bay, investigate the remaining Argentine defences and engage as necessary before clearing the northern exit.
MissionIntro_de=Sweep Falkland Sound ahead of our planned landings at San Carlos. Take one ship north from Fox Bay, investigate the remaining Argentine defences and engage as necessary before clearing the northern exit.
MissionIntro_vn=Quét eo biển Falkland trước cuộc đổ bộ dự kiến tại San Carlos. Dẫn một tàu từ Fox Bay tiến về phía bắc, trinh sát các vị trí phòng thủ Argentina còn lại và giao chiến khi cần thiết trước khi rời qua lối ra phía bắc.
MissionIntro_ko=산카를로스 상륙에 앞서 포클랜드 해협을 수색하십시오. 함정 한 척을 이끌고 폭스만에서 북상하여 남아 있는 아르헨티나군 방어 시설을 정찰하고 필요에 따라 교전한 뒤 북쪽 출구로 이탈하십시오.
MissionIntro_ja=サンカルロスへの上陸に先立ち、フォークランド海峡を掃討せよ。艦艇1隻を率いてフォックス湾から北上し、残存するアルゼンチン軍の防御陣地を偵察、必要に応じて攻撃した後、北側の出口から離脱せよ。
MissionIntro_cn=我们计划登陆圣卡洛斯，但在此之前需扫荡福克兰海峡。从福克斯湾派出一艘船只向北航行，侦察剩余的阿根廷防御工事并在必要时进行交战，之后从北部出口离开。
MissionIntro_fr=Reconnaissez le détroit de Falkland avant nos débarquements prévus à San Carlos. Faites route au nord depuis Fox Bay avec un navire, examinez les défenses argentines restantes et engagez-les si nécessaire avant de franchir la sortie nord.
MissionIntro_es=Explora el estrecho de San Carlos antes de nuestros desembarcos previstos en San Carlos. Lleva un buque hacia el norte desde Bahía Fox, investiga las defensas argentinas restantes y ataca según sea necesario antes de salir por el extremo norte.
MissionResupplyRules_en=After this mission, the Task Force will retire west to replenish and repair.
MissionResupplyRules_de=After this mission, the Task Force will retire west to replenish and repair.
MissionResupplyRules_es=Tras esta misión, la fuerza de tareas se retirará al oeste para reabastecerse y efectuar reparaciones.
MissionResupplyRules_fr=Après cette mission, la Task Force se retirera vers l’ouest pour se ravitailler et effectuer des réparations.
MissionResupplyRules_cn=完成此任务后，特遣舰队将向西撤退，进行补给和维修。
MissionResupplyRules_ja=この任務後、任務部隊は西へ撤退し、補給と修理を行う。
MissionResupplyRules_ko=이 임무 후 기동부대는 서쪽으로 철수하여 보급과 수리를 받습니다.
MissionResupplyRules_vn=Sau nhiệm vụ này, lực lượng đặc nhiệm sẽ rút về phía tây để tiếp tế và sửa chữa.
TaskForceModeRibbonAwardRules=UK05_DSC
Name_cn=福克兰海峡
MissionSequenceName_cn=任务05
