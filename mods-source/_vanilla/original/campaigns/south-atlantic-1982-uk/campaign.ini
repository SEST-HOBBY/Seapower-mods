MissionIntro_cn=将菲茨罗伊的登陆船只开往卸载区域，之后连续为开往斯坦利的部队执行三次火力支援任务。协调海军炮火、海鹞巡逻队，以及来自圣卡洛斯和航母的GR.3支援。运输船抵达卸货区域后即可离开。
