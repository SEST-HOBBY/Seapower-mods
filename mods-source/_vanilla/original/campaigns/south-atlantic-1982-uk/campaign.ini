RepairMode=Timed
RepairDays=Light,5|Moderate,10|Heavy,30
RepairIncludesRearm=True
Enabled=True

// Allow detached and submarine-only missions without the overall force flagship.
TaskForceRequireFlagship=False
// One overall flagship, independent of task-force formation leaders.
// Historical mode waits for Hermes to arrive, then locks this hull as flagship.
// Points modes allow reassignment. Only deployed flagship losses end the campaign.
ForceFlagshipMustSurvive=True
