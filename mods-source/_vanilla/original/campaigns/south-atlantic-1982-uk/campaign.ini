Name_en=RAID ON GOOSE GREEN
MissionSequenceName_en=MISSION 04
MapShortName_en=UK04
Description_en=
MissionImage_en=campaigns/south-atlantic-1982-uk/art/south_atlantic_uk04_sheet.png
MissionIntro_en=Argentine forces at Goose Green continue to support air operations against the Task Force. Command the carrier force to strike the aviation support facilities ashore. Warning: strikes by Super Etendards with Exocets are expected!
MissionResupplyRules_en=After this action, the Task Force will retire east to meet up with the logistics train for resupply. Ammunition replenishment requires RFA Fort Austin to survive. Limited repair facilities will be available at sea but heavier damage must be sent back to Britain.
MissionResupplyRules_de=After this action, the Task Force will retire east to meet up with the logistics train for resupply. Ammunition replenishment requires RFA Fort Austin to survive. Limited repair facilities will be available at sea but heavier damage must be sent back to Britain.
MissionResupplyRules_es=Tras esta acción, la fuerza de tareas se retirará al este para reunirse con el grupo logístico y reabastecerse. El reabastecimiento de municiones requiere que sobreviva el RFA Fort Austin. Habrá instalaciones limitadas de reparación en el mar, pero los buques con daños más graves deberán regresar a Gran Bretaña.
MissionResupplyRules_fr=Après cette action, la Task Force se retirera vers l’est pour rejoindre le groupe logistique et se ravitailler. Le ravitaillement en munitions exige la survie du RFA Fort Austin. Des réparations limitées seront possibles en mer, mais les bâtiments les plus endommagés devront rentrer en Grande-Bretagne.
MissionResupplyRules_cn=完成此任务后，特遣舰队将向东撤退，与后勤船队会合以进行补给。补给弹药的前提条件是奥斯汀堡号不被击沉。舰载设备可在海上提供有限的维修，但较重的损伤需返回英国本土处理。
MissionResupplyRules_ja=この戦闘後、任務部隊は東へ撤退し、補給部隊と合流する。弾薬補給にはRFA Fort Austinの生存が必要。海上では限定的な修理が可能だが、大きな損傷を受けた艦は英国へ帰還させる必要がある。
MissionResupplyRules_ko=이번 작전 후 기동부대는 동쪽으로 철수하여 군수 지원 전단과 합류해 보급받습니다. 탄약 보급을 위해서는 RFA Fort Austin이 생존해야 합니다. 해상에서 제한적인 수리가 가능하지만 심한 손상은 영국으로 돌아가 수리해야 합니다.
MissionResupplyRules_vn=Sau trận này, lực lượng đặc nhiệm sẽ rút về phía đông để gặp đoàn hậu cần và tiếp tế. Tiếp tế đạn dược đòi hỏi RFA Fort Austin phải sống sót. Có thể sửa chữa hạn chế trên biển, nhưng tàu bị hư hại nặng phải trở về Anh.
Name_cn=突袭古斯格林
MissionSequenceName_cn=任务04
MapShortName_cn=04
Description_cn=
MissionImage_cn=campaigns/south-atlantic-1982-uk/art/south_atlantic_uk04_sheet.png
MissionIntro_cn=古斯格林的阿根廷军队持续支援攻击我方特遣舰队的空中行动。指挥航母部队打击岸上的航空支援设施。提示：预计携带飞鱼导弹的超级军旗将发动打击！

