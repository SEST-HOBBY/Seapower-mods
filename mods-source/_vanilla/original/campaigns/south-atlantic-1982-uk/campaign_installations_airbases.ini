; Campaign-owned finite aircraft inventory for the South Atlantic campaign.
; Mainland combat allocations follow the FAA deployment table for 1 May 1982.
; https://www.argentina.gob.ar/sites/default/files/2023/10/the-argentine-air-force-during-malvinas-war_ch0-6_.pdf
; Pucara arrivals are staged by campaign completion actions, not duplicated at each strip.
; https://www.radarmalvinas.com.ar/huop/hu_puca_evol_t.pdf
; Two operational naval Neptunes share Rio Grande stock across every patrol mission.
; https://www.argentina.gob.ar/armada/crucero-ara-general-belgrano
; Four Super Etendards are operational. The fifth airframe supplied spares.
; https://www.argentina.gob.ar/node/169368
; Only two EMB-111s arrive, after the 21 May mission, at Rio Gallegos.
; https://www.centronaval.org.ar/boletin/BCN832/832-FORTINI.pdf
; 25 de Mayo owns 8 A-4Q, 4 S-2E and 2 Sea Kings separately from these shore stocks.
; The other two Trackers form the campaign's Puerto Deseado patrol detachment.
; This fixed shore detachment is a gameplay allocation, not a historical basing claim.
; San Carlos aircraft are reserved from the Sutton package, never copied from a carrier.
; Only aircraft types represented by existing game assets are included.
; Fuel is in kg. These illustrative stocks are inactive while TrackFuel=False.
; General ammunition and air-launched torpedo reserves are sized to sustain the full campaign.

[Airbases]
Bases=Stanley|GooseGreen|PebbleIsland|RioGallegos|RioGrande|ComodoroRivadavia|Ascension|PatagoniaSouth|PatagoniaNorth|SanCarlos|SanJulian|ElPalomar

