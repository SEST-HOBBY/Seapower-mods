[Ribbon_distinguished_service_cross]
CitationType=Custom
CitationTemplatePath=campaigns/south-atlantic-1982-uk/art/citations/distinguished_service_cross_en.xml
Type=IndividualAward
Precedence=40
Name_en=Distinguished Service Cross
Description_en=Awarded for completing every assigned task in Falkland Sound or the Stanley night patrol without losing an assigned ship.
ImagePath=campaigns/south-atlantic-1982-uk/art/ribbons/distinguished_service_cross.png
CitationTitle_en=Distinguished Service Cross
CitationDate_en=11 October 1982
CitationText_en=For gallantry and distinguished service during the operations in the South Atlantic.
ReferenceSource=UK campaign historical document adaptations
AssetCredit=Flat ribbon geometry authored for the campaign. See UK-awards-sources.txt for document provenance.
CitationTextMission18_en=In directing the passage through Falkland Sound ahead of the amphibious landings, {CommanderRank} {CommanderName} showed determination and sound tactical judgement in waters threatened by enemy action. The assigned reconnaissance and combat tasks were completed, and the force cleared the northern approaches without the loss of an assigned ship.\n\nThe successful conduct of this operation reduced uncertainty on an important approach to the landing area. Resolute leadership and careful handling of the force combined to achieve the assigned purpose while preserving its ability to take part in subsequent operations.
CitationTextMission24_en=During the night operations off Stanley, {CommanderRank} {CommanderName} directed the interception of coastal supply traffic and the bombardment of the designated fuel stores. All assigned tasks were completed and the patrol ships withdrew without loss. Decisive handling of the force in confined coastal waters denied supplies to the enemy garrison and preserved the patrol for further operations.

