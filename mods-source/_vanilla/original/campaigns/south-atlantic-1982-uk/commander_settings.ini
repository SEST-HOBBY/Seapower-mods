[Ribbon_distinguished_service_order_bar]
CitationType=Custom
CitationTemplatePath=campaigns/south-atlantic-1982-uk/art/citations/distinguished_service_order_bar_en.xml
Type=IndividualAward
Precedence=30
Name_en=Distinguished Service Order and Bar
Description_en=You have been awarded a Bar to your Distinguished Service Order for your conduct of the Fitzroy operation and the final fire-support tasks towards Stanley.
ImagePath=campaigns/south-atlantic-1982-uk/art/ribbons/distinguished_service_order_bar.png
CitationTitle_en=Bar to the Distinguished Service Order
CitationDate_en=11 October 1982
CitationText_en=During the final approach to Stanley, {CommanderRank} {CommanderName} directed the protection of the transports unloading at Fitzroy and co-ordinated naval gunfire with air support for the advance ashore. The transports at the anchorage were preserved, and all marked shore targets were destroyed.\n\nThe security of the shipping and the immediate requirements of the troops placed competing demands upon the available forces. Clear judgement and firm direction sustained the advance while preserving the transports. This further achievement demonstrated outstanding qualities of operational command.
ReferenceSource=UK campaign historical document adaptations
AssetCredit=Flat ribbon geometry authored for the campaign. See UK-awards-sources.txt for document provenance.
ReplacesRibbon=distinguished_service_order

