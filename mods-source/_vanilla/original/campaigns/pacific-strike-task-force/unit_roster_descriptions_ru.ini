[AllowedVessels]
usn_dd_gearing=Эсминцы типа «Гиринг» — модернизированные корабли эскорта военной постройки с хорошим артиллерийским вооружением и базовыми возможностями ПЛО. Эти корабли находятся в конце срока службы, будучи возвращены в строй из резервного флота и лучше всего подходят для действий против подводных лодок и надводных кораблей с ограниченными возможностями.
usn_ff_garcia=Фрегаты типа «Гарсия» — базовые корабли противолодочного охранения, несут один вертолёт SH-2F «Си Спрайт». Они полезны для расширения зоны поиска подводных лодок вокруг соединения, но практически не имеют возможностей противоракетной обороны и должны оставаться под зонтиком ЗРК более защищённых кораблей эскорта.
usn_ffg_brooke=Фрегаты типа «Брук» представляют собой компактные корабли эскорта с ракетным вооружением и возможностями ПЛО. Они превосходят предшествующие фрегаты типа «Гарсия», однако их пусковая установка Mk 22 вмещает только 16 ракет SM-1MR «Стандарт», что ограничивает эффективность ПВО.
usn_ff_knox_84=Фрегаты типа «Нокс» — корабли противолодочного эскорта с хорошими гидроакустическими комплексами и несущие однин вертолёт SH-2F «Си Спрайт». Недавние модернизации добавили кораблям этого типа ПКР «Гарпун» и ЗАК «Фэллэнкс».
usn_ffg_oliver_hazard_perry=Фрегаты типа «Оливер Х. Перри» — сбалансированные корабли эскорта с двумя вертолётами, ракетами «Гарпун» и ПВО средней дальности. Это гибкие корабли охранения, особенно эффективные в сочетании с более сильными специалистами ПВО.
usn_ddg_adams_early=Эсминцы типа «Чарльз Ф. Адамс» — надёжные рабочие корабли с возможностями локальной ПВО и двумя 5-дюймовыми орудиями. Недавние модернизации добавили ракеты «Гарпун», но отсутствие ангара и буксируемой ГАС ограничивает их возможности ПЛО. Ранняя версия представляет первые 13 кораблей типа, оснащённые двухбалочной пусковой установкой Mk 11.
usn_ddg_adams_late=Эсминцы типа «Чарльз Ф. Адамс» — надёжные рабочие корабли с возможностями локальной ПВО и двумя 5-дюймовыми орудиями. Недавние модернизации добавили ракеты «Гарпун», но отсутствие ангара и буксируемой ГАС ограничивает их возможности ПЛО. Поздняя версия представляет последние 10 кораблей типа, оснащённые более скорострельной однобалочной пусковой установкой Mк 13 и двумя дополнительными ракетами «Гарпун» в боекомплекте.
usn_ddg_coontz=Эсминцы типа «Кунц» — старые эсминцы УРО с возможностями зональной ПВО. Они способны защищать соединение от воздушных угроз, но сравнительно низкая скорострельность пусковой установки Mk 10 ограничивает их способность отражать несколько угроз одновременно, а системы ЗАК у них отсутствуют.
usn_ddg_mahan=USS «Мэхэн» был переоборудован в 1980 году в испытательный корабль программы NTU. Благодаря необычно мощным современным средствам ПВО и требованиям военного времени корабль доступен как полноценный эскорт ПВО первой линии.
usn_dd_spruance=Эсминцы типа «Спрюэнс» — мощные противолодочные платформы с двумя вертолётами, буксируемой ГАС и отличной корпусной гидроакустикой. Это очень эффективные охотники за подводными лодками и корабли охранения, но в вопросах ПВО они полагаются на другие корабли. Их просторные ангары позволяют использовать большое количество типов корабельных вертолётов, а не только штатные SH-2F «Си Спрайт».
usn_dd_spruance_abl=В начале 1980-х годов несколько эсминцев типа «Спрюэнс» были переоборудованы с установкой бронированных контейнерных пусковых установок Mk 143 ABL для крылатых ракет «Томагавк», что добавило ударные возможности к их сильному противолодочному потенциалу. Это универсальные корабли эскорта, способные участвовать в ударах по наземным целям и одновременно обеспечивать противолодочное охранение. Их просторные ангары позволяют использовать большое количество типов корабельных вертолётов, а не только штатные SH-2F «Си Спрайт».
usn_ddg_kidd=Эсминцы типа «Кидд» — современные многоцелевые корабли эскорта с двухбалочными ПУ зенитых ракет SM-1MR «Стандарт», ракетами «Гарпун», возможностями ПЛО, вертолётами и ЗАК. Это отличные универсальные командные корабли охранения, но у них нет буксируемой ГАС, поэтому их лучше использовать совместно с другими противолодочными кораблями. Так же следует учитывать особенность ЗРК этих кораблей: они имеют только 2 радара наведения ЗУР, плюс артиллериийская СУО может наводить одну ракету. Поэтому они могут наводить не более 3-х ракет одновременно. Их просторные ангары позволяют использовать большое количество типов корабельных вертолётов, а не только штатные SH-2F «Си Спрайт».
usn_cg_belknap=Крейсеры типа «Белнап» обеспечивают зональную ПВО ракетами SM-2ER «Стандарт». Это ценные опорные корабли ПВО соединения, способные поражать цели на очень большой дальности, но их пусковые установки Mk 10 медленно перезаряжаются, поэтому их лучше сочетать с кораблями оснащёнными более скорострельным SM-1MR «Стандарт» для обеспечения эшелонированной ПВО. В отличие от типа «Лихи», крейсеры «Белнап» имеют ангар и кормовое орудие, что придаёт им гибкость.
usn_cg_leahy=Крейсеры типа «Лихи» — мощные корабли зонального ПВО с ракетами SM-2ER «Стандарт», способные поражать цели на очень большой дальности. Они полностью специализируются на дальней ПВО и должны действовать совместно с кораблями оснащёнными более скорострельным SM-1MR «Стандарт» для обеспечения эшелонированной обороны, так как имеют большое время перезарядки пусковых установок ЗУР.
usn_clg_oklahoma_city=USS «Оклахома Сити» — лёгкий крейсер военной постройки, в 1960 году полностью перестроенный в флагманский корабль и ракетный крейсер. Возвращённый в строй из резервного флота, он оснащён устаревшим ЗРК «Талос», но его скорострельные 6-дюймовые орудия отлично подходят для обстрела побережья.
usn_cgn_california=Атомные крейсеры типа «Калифорния» — многоцелевые корабли эскорта с двумя пусковыми установками Mk 13 и боезапасом на 80 ЗУР SM-1MR «Стандарт». У них нет вертолётов, а возможности ПЛО ограничены, но это надёжные корабли обороны соединения с отличной автономностью.
usn_cgn_virginia=Атомные крейсеры типа «Вирджиния» — многоцелевые корабли эскорта высокого уровня с двухбалочными пусковыми установками Mк 26 для ракет SM-1MR «Стандарт», ракетами «Гарпун» и ограниченными возможностями ПЛО. Как и тип «Калифорния», они не несут вертолётов, но обладают улучшенными боевыми возможностями и автономностью как мощные корабли ПВО.
usn_cgn_long_beach_83=«Лонг Бич» — мощный крейсер ПВО, оснащённый дальнобойными ракетами SM-2ER «Стандарт» с большим боезапасом. Корабль также несёт ракеты «Томагавк» для ударов по наземным целям, но не имеет вертолётов и обладает лишь ограниченными возможностями ПЛО, поэтому нуждается в эскорте.
usn_cg_ticonderoga=Крейсеры типа «Тикондерога» — самые современные корабли ПВО из существующих, оснащённые боевой системой «Иджис» и РЛС SPY-1. Это лучшие корабли ПВО, способные справиться с большинством воздушных угроз; особенно эффективны в сочетании с кораблём более дальнего действия SM-2ER, таким как «Белнап», «Лихи» или «Лонг Бич». Их просторные ангары позволяют использовать большое количество типов корабельных вертолётов, а не только штатные SH-2F «Си Спрайт».
usn_bb_iowa=Линкоры типа «Айова» — тяжело вооружённые и бронированные боевые корабли с мощной артиллерией и противокорабельными ракетными батареями. Они превосходны в обстреле побережья и демонстрации силы на море, но не имеют возможностей ПЛО или ПВО и должны сопровождаться другими кораблями.
usn_lha_tarawa=Десантные корабли типа «Тарава» предоставляют крупную авиационную и десантную платформу для операций с широким применением вертолётов. Это ценные корабли поддержки, но им требуется эскорт, поскольку собственная оборона недостаточна для районов с высокой угрозой.
usn_cv_kitty_hawk=Авианосцы типа «Китти Хок» — стратегические авиационные платформы, проецирующие воздушную мощь через океан. Они способны радикально увеличить радиус действия оперативной группы, но должны защищаться эшелонированным эскортом и подводными лодками.

usn_avp_barnegat_mod=Фрегаты типа «Бонифацио» — переоборудованные плавбазы гидросамолётов, переданные Южному Вьетнаму как излишки военного имущества и позднее поступившие на службу Филиппин. Они оснащены четырьмя ракетами «Гарпун» в контейнерах в средней части корпуса, а импровизированная вертолётная площадка в корме поддерживает лёгкий ударный вертолёт.

ran_ddg_perth=Эсминцы типа «Перт» — австралийская версия американских эсминцев типа «Чарльз Ф. Адамс». Они несколько отличаются от американского проекта конфигурацией, имея ПУ ПЛУР «Икара» в средней части корпуса вместо пусковой установки ASROC. В остальном по вооружению и возможностям они идентичны поздним кораблям типа «Адамс».
ran_ffg_adelaide_shorthull=Фрегаты типа «Аделаида» — австралийские версии американских фрегатов типа «Перри». Это ценные корабли эскорта с возможностями локальной ПВО. Штатно они несут 2 лёгких вертолёта AS-350, но могут быть оснащены другими типами малых корабельных вертолётов, такими как SH-2F «Си Спрайт».

jmsdf_dd_yamagumo=Эсминцы типа «Ямагумо» — старые корабли эскорта Морских сил самообороны Японии, полностью сосредоточенные на ПЛО. Из-за отсутствия возможностей ПВО они должны действовать под прикрытием ЗРК других кораблей.
jmsdf_dd_takatsuki=Эсминцы типа «Такацуки» — противолодочные платформы с двумя 5-дюймовыми орудиями и поддержкой беспилотного вертолёта QH-50 DASH. Не имеют ЗРК, поэтому лучше всего применять их только против подводных лодок или менее опасных надводных кораблей противника.
jmsdf_ddg_tachikaze=Эсминцы типа «Тачиказе» — современные японские корабли ПВО с пусковой установкой Mк 13 в корме. По возможностям они близки к американским эсминцам типа «Чарльз Ф. Адамс» и являются универсальными боевыми кораблями. Примечание: в боекомплекте раннего варианта отсутствует ПКР «Гарпун»
jmsdf_ddh_haruna=Эсминцы-вертолётоносцы типа «Харуна» — специализированные командные корабли противолодочного эскорта с крупной вертолётной группой. Это отличные флагманские корабли противолодочного охранения, но они не оснащены комплексами ПВО и ПКР, поэтому им требуется эскорт.

[AllowedHelicopters]
usn_sh-2f=Вертолёты SH-2F «Си Спрайт» расширяют зону противолодочного поиска корабля и позволяют атаковать подводные контакты за пределами дальности корпусной ГАС. Их РЛС также позволяет вести разведку впереди соединения и выполнять надводную разведку для фрегатов и эсминцев.
usn_sh-3h=Вертолёты SH-3H «Си Кинг» — противолодочные вертолёты большого радиуса действия с опускаемой ГАС, магнитным детектором, гидроакустическими буями и торпедами. Они не несут РЛС надводного поиска, как SH-2F «Си Спрайт», поэтому наиболее сильны в поиске и атаке подводных лодок, а также в поисково-спасательных задачах, а не в воздушной разведке.
usn_qh-50d=Беспилотные вертолёты QH-50 DASH обеспечивают лёгким старым кораблям эскорта дистанционные возможности ПЛО. Они увеличивают дальность доставки торпед, но отсутствие датчиков и экипажа ограничивает их во всех остальных ролях.
jmsdf_hss-2=Вертолёты HSS-2 — противолодочные вертолёты большого радиуса действия с опускаемой ГАС, магнитным детектором, гидроакустическими буями и торпедами. Они не несут РЛС надводного поиска, как SH-2F «Си Спрайт», поэтому наиболее сильны в поиске и атаке подводных лодок, а также в поисково-спасательных задачах, а не в воздушной разведке. Это японский вариант вертолёта «Си Кинг» и как следствие, они идентичны по возможностям.
usmc_ah-1t=Ударные вертолёты AH-1T «Кобра» обеспечивают непосредственную авиационную поддержку, ракетные атаки и противотанковый удар с кораблей, способных их принимать. Они эффективны против малых надводных и наземных целей, но не несут РЛС и не должны использоваться как разведчики.
fr_as-350=Вертолёты AS350 — лёгкие транспортные машины. Они недорогие, но не несут систем обнаруженияв или вооружения и должны держаться в стороне от оспариваемого воздушного пространства. Они в основном пригодны в для выполнения поисково-спасательных задач или в качестве дешёвого средства визуальной идентификации.

[AllowedAircraft]
fr_mirage_iii=Истребитель «Мираж» IIIO обеспечивает базовые возможности воздушного боя, но его ракетное вооружение имеет малую дальность, а сам он уступает более современным истребителям.
raaf_f-111c=Бомбардировщики F-111C обладают большой дальностью, высокой боевой нагрузкой и высокой скоростью. В австралийских ВВС они оснащены для высокоточных ударов и противокорабельной роли, а также могут нести ракеты AIM-9 для самообороны, что делает их более гибкими по сравнению с другими типами ударных самолётов.
usn_ea-6b=Самолёты РЭБ EA-6B обеспечивают ведение радиоэлектронной борьбы, значительно повышая выживаемость ударных групп и нарушая работу сенсоров противника. Их мощные контейнеры постановки помех AN/ALQ-99 ухудшают работу сенсоров противника и снижают эффективность его обороны.
usn_f-14a=Истребители F-14A — высококлассные самолёты обороны флота с возможностями дальнего перехвата. Мощная РЛС и ракеты AIM-54A «Феникс» делают их главным американским палубным истребителем завоевания превосходства в воздухе.
usn_fa-18a=Истребители-бомбардировщики F/A-18A — новейшие многоцелевые истребители, доступные НАТО. Способные как к воздушному бою, так и к ударам по наземным целям, они являются очень гибкими самолётами для множества задач. Эти австралийские самолёты были введены в строй из-за военной необходимости, хотя формально всё ещё проходили испытания.
usn_p-3c=P-3C «Орион» — дальние морские патрульные самолёты, предназначенные для поиска на больших площадях и атаки подводных лодок. Они отлично подходят для обнаружения подводных лодок и надводных контактов до того, как те станут угрозой основным силам.
usmc_av-8a=Истребители AV-8C «Харриер» обеспечивают ударные возможности малой дальности с ВВП/КВП с палуб десантных кораблей и аэродромов. Они хороши для быстрого цикла вылетов, непосредственной поддержки, лёгких ударов и локального подавления ПВО, но малоэффективны в присутствии современных истребителей и плотной ПВО.
usn_a-7e=Штурмовики A-7E — надёжные лёгкие ударные самолёты для задач штурмовки и непосредственной поддержки. Они обеспечивают хорошую эффективность боевой нагрузки, но в защищённом воздушном пространстве нуждаются в эскорте и радиоэлектронной поддержке.
usn_a-6e=Штурмовики A-6E — всепогодные ударные самолёты. Они хорошо подходят для опасных ударных миссий при наличии истребительного прикрытия и средств РЭБ. Их способность нести до 4-х ПКР «Гарпун» делает их очень эффективными в противокорабельной роли.
usn_e-2c=Самолёты E-2C обеспечивают дальнее радиолокационное обнаружение для морских авиационных операций. Они увеличивают дальность обнаружения и позволяют своевременно реагировать на угрозы, существенно увеличивая возможности авианесущей группировки.
usn_s-3a=S-3A «Викинг» - палубные противолодочные самолёты с сильными возможностями морского патрулирования и поддержки. Лучше всего использовать их для создания внешнего противолодочного рубежа вокруг авианосцев и крупных надводных групп.
usaf_f-15c=Истребители F-15C «Игл» — специализированные самолёты завоевания превосходства в воздухе с отличными лётными характеристиками и ракетным вооружением. Используйте их для установления контроля над воздухом и защиты ударных групп от истребителей противника.
usaf_f-4e=Истребители-бомбардировщики F-4E — самолёты, способные выполнять как задачи ПВО и так и наносить бомбовые удары. Они всё ещё актуальны в воздухе, хотя и уступают более новым самолётам.
usaf_e-3a=Самолёты ДРЛО E-3A обеспечивают дальнее воздушное наблюдение. Это самолёты для воздушных операций, обеспечивающие обнаружение и сопровождение целей на большой территории.
usaf_b-52g=Стратегические бомбардировщики B-52G обеспечивают нанесение мощных ударов на больших расстояниях по крупным или стационарных целей. Они требуют тщательного планирования и защиты, но способны дать эффект, недоступный тактической авиации.