[AllowedVessels]
usn_dd_gearing=基林级驱逐舰是经过改装的二战护航舰艇，具备充足的火炮和基础的反潜能力。这些从后备舰队中重新启用的船只已处于服役生涯末期，最适合对抗低性能潜艇和水面单位。
usn_ff_garcia=加西亚级护卫舰是搭载1架SH-2F直升机的基础反潜护航舰艇。它们对于扩大编队的反潜搜索区域有所帮助，但几乎不具备导弹防御能力，必须依靠防御能力更强的护航舰艇提供防空保护伞。
usn_ffg_brooke=紧凑的布鲁克级护卫舰同时具备导弹防御和反潜能力，性能强于前型加西亚级，但其Mk22发射器仅能携带16枚标准-1中程型导弹，因此防空能力有限。
usn_ff_knox=近50艘诺克斯级护卫舰建成于1960年代末至1970年代中期，设计目标为取代加西亚级。和加西亚级类似，它们的核心装备是AN/SQS-26、反潜火箭和无人反潜直升机，最初没有防空系统，但后续进行了改装，携带海麻雀和SH-2F海妖。\n1980年代，它们获得了鱼叉导弹，反潜火箭发射器有2个发射单元中的RUR-5被替换为了鱼叉。后期配置还增加了AN/SQR-18A拖曳阵列，可将船只对潜艇的初步探测范围延伸至第一会聚区。
usn_ff_knox_84=诺克斯级护卫舰是配备了良好声呐套件的反潜护卫舰，可搭载1架SH-2F直升机。它们还在近期的改装中获得了鱼叉导弹和密集阵近防系统。其AN/SQR-18A拖曳阵列可将船只对潜艇的初步探测范围延伸至第一会聚区。
usn_ffg_oliver_hazard_perry=奥利弗·哈泽德·佩里级护卫舰性能均衡，配备了2架直升机、鱼叉反舰导弹和中程防空导弹。它们是灵活的护航舰艇，特别适合与更强大的专业防空舰艇混编。
usn_ffg_oliver_hazard_perry_longhull=奥利弗·哈泽德·佩里级护卫舰有时也被称为FFG-7级，是低成本通用舰艇，共建成70余艘，装备了美国及其多个盟友的海军。其设计方案主要针对中等威胁环境，与同代的斯普鲁恩斯级相比，其武器性能较差，冗余度较低。佩里级有两款子型号，此处为长舰体型，携带SH-60轻型机载多用途系统（LAMPS）Mk.III直升机，还配备AN/SQR-18或AN/SQR-19战术拖曳阵列声呐（TACTAS），从而大幅提升了反潜能力。默认配置的AN/SQR-18A声呐探测范围可达第一会聚区，而后期配置的高性能AN/SQR-19声呐探测范围可达第二会聚区，使佩里级成为强大的力量增幅器。
usn_ddg_adams_early=查尔斯·F·亚当斯级驱逐舰是具备局部防空能力和2门5英寸火炮的主力单位。它们在近期的改装中获得了鱼叉导弹，但没有机库和拖曳阵列，因此反潜能力有限。前期型代表最初的13艘亚当斯级，它们使用Mk11双臂发射器。
usn_ddg_adams_late=查尔斯·F·亚当斯级驱逐舰是具备局部防空能力和2门5英寸火炮的主力单位。它们在近期的改装中获得了鱼叉导弹，但没有机库和拖曳阵列，因此反潜能力有限。后期型代表最后的10艘亚当斯级，它们使用射速更快的Mk13单臂发射器，携带的鱼叉导弹比前期型多2枚。
usn_ddg_coontz=孔茨级驱逐舰是具备区域防空能力的老式导弹驱逐舰，可为编队对抗空中威胁，但Mk10发射器较慢的射速限制了它们同时应对多个威胁的能力。此外，它们也缺少近防系统。
usn_ddg_mahan=1980年，马汉号被重新设计为新威胁升级试验舰。由于具备异常强大的现代化防空能力，它在战时紧急状态下成为了一线防空护航舰艇。
usn_dd_spruance=斯普鲁恩斯级驱逐舰是强大的反潜平台，具备2架直升机、拖曳阵列和优秀的舰壳声呐。它们是强力的潜艇猎手和编队保护者，但需要依靠其他舰艇进行防空。在战时，除了SH-2F直升机外，它们还可携带更新型的SH-3H，进一步强化反潜能力。
usn_dd_spruance_abl=1980年代初，数艘斯普鲁恩斯级驱逐舰加装了Mk143装甲箱发射器，可携带战斧巡航导弹，在其强大反潜装备和直升机组合的基础上增加了打击能力。它们是功能多样的护航舰艇，既能执行对地攻击任务，又能提供反潜保护。在战时，除了SH-2F直升机外，它们还可携带更新型的SH-3H，进一步强化反潜能力。
usn_ddg_kidd=基德级驱逐舰是现代化的多用途护航舰艇，配备强大的标准-1中程型发射器、鱼叉导弹、反潜武器、直升机和近防系统。它们是优秀的通用护航指挥舰，但没有拖曳阵列，因此最好与其他反潜舰艇协同行动。
usn_cg_belknap=贝尔纳普级巡洋舰配备了标准-2增程型导弹，可提供区域防空。它们是高价值的编队防空核心，可在极远距离外与目标交战，但其Mk10发射器装填速度缓慢，所以最好与射速更快的标准-1中程型舰艇搭配使用，组成多层防御。与莱希级不同，贝尔纳普级的尾部装有机库和炮塔，因此任务灵活性更强。
usn_cg_leahy=莱希级巡洋舰是强大的“双向”防空舰，配备了标准-2增程型导弹，可在极远距离外与目标交战。它们完全专注于远程防空，应当与射速更快的标准-1中程型舰艇搭配使用，组成多层防御。
usn_clg_oklahoma_city=俄克拉荷马市号是二战时期的轻巡洋舰，于1960年被彻底改造为旗舰和导弹巡洋舰。它是从后备舰队中重新启用的船只，导弹系统已经过时，但6英寸速射炮在海岸炮击方面表现出色。
usn_cgn_california=加利福尼亚级核动力巡洋舰是前后双向都装有Mk13发射器的多用途护航舰艇，其弹药库可容纳80枚标准-1中程型拦截弹。它们没有直升机，反潜能力有限，但续航力出色，是可靠的编队防御舰艇。
usn_cgn_virginia=弗吉尼亚级核动力巡洋舰是高端多用途护航舰艇，具备发射标准-1中程型的双臂Mk26发射器、鱼叉导弹和有限的反潜能力。和加利福尼亚级类似，它们不携带直升机，但作为强大的防空舰艇，自身拥有更高的作战效率和续航力。
usn_cgn_long_beach_83=长滩号是强大的防空巡洋舰，配备标准-2增程型导弹，弹药库容量大。它还携带了用于对地攻击的战斧导弹，但没有配备直升机，反潜能力有限，因此必须搭配其他护航舰艇。
usn_cg_ticonderoga=提康德罗加级巡洋舰是目前最现代化的防空舰艇，配备了宙斯盾战斗系统和SPY-1雷达。作为顶级防空舰艇，它们可应对大多数空中威胁，并且与贝尔纳普级、莱希级或长滩级等发射标准-2增程型的舰艇搭配使用时效果更佳。
usn_bb_iowa=艾奥瓦级战列舰是火力强大、装甲坚固的水面战斗舰艇，具备强大的火炮和反水面导弹发射器。它们擅长执行海岸炮击和水面威慑任务，但没有反潜战或防空能力，必须由其他单位护航。
usn_lha_tarawa=塔拉瓦级攻击舰可为大量使用直升机的行动提供大型航空和两栖平台。它们是高价值支援舰，但需要护航，因为其自身的防御能力不足以应对高威胁区域。
usn_cv_kitty_hawk=小鹰级航母是在大洋上进行空中力量投射的战略航空平台。它们能彻底改变特遣舰队的作战范围，但必须得到护航舰艇和潜艇的多层保护。

usn_avp_barnegat_mod=博尼法西奥级护卫舰是改装后的水上飞机补给舰，作为二战的剩余物资，它们先后进入南越和菲律宾海军服役。它们的中部加装了四个鱼叉导弹发射筒，尾部有一个简易的直升机平台。

ran_ddg_perth=珀斯级驱逐舰是美国查尔斯·F·亚当斯级驱逐舰的澳大利亚版本。它们在设计上与美国方案略有不同，舰体中部安装了投掷棒反潜导弹发射器，而非美国的反潜火箭发射器。除此之外，它们的武器装备和性能与后期的亚当斯级驱逐舰完全相同。
ran_ffg_adelaide_shorthull=阿德莱德级护卫舰是美国佩里级护卫舰的澳大利亚版本。它们是高价值护航舰艇，具备局部防空能力。在战争期间，它们进行了改装，可携带美国的SH-2F直升机。

jmsdf_dd_yamagumo=山云级驱逐舰是日本海上自卫队的老式护航舰艇，完全专注于反潜。由于没有防空能力，它们只能在其他舰艇的面对空导弹保护下行动。
jmsdf_dd_takatsuki=高月级驱逐舰是强大的反潜平台，具备两门5英寸火炮，船尾可携带QH-50无人反潜直升机。其防空能力非常有限，因此最适合对抗潜艇或性能不强的敌方水面单位。
jmsdf_dd_takatsuki_84=高月级驱逐舰是强大的反潜平台，具备两门5英寸火炮、反潜火箭，船首还装有一门瑞典制造的反潜迫击炮。其中两艘（高月号和菊月号）于1980年代进行了升级改造，拆除了船尾的5英寸火炮和QH-50无人反潜直升机机库，安装了密集阵近防系统、鱼叉反舰导弹和RIM-7海麻雀导弹，显著提升了性能。jmsdf_ddg_tachikaze=太刀风级驱逐舰是尾部装有Mk13发射器的日本现代化防空舰，其性能接近美国的查尔斯·F·亚当斯级驱逐舰，是优秀的通用战斗舰艇。
jmsdf_ddg_tachikaze_84=太刀风级驱逐舰是尾部装有Mk13发射器的日本现代化防空舰，其性能接近美国的查尔斯·F·亚当斯级驱逐舰，是优秀的通用战斗舰艇。1984年，太刀风号和朝风号进行了升级，增加了密集阵近防系统、箔条和电子对抗措施，提高了对抗反舰导弹威胁时的生存能力。
jmsdf_ddh_haruna=榛名级直升机驱逐舰是专业的反潜指挥舰，可搭载3架直升机。它们是优秀的反潜战旗舰，但没有用于自卫的导弹，在可能遭遇敌方空袭的场景下需要其他单位护航。

[AllowedHelicopters]
usn_sh-2f=SH-2F可扩大舰艇的反潜搜索区域，协助追踪舰壳声呐探测范围外的水下接触。机载雷达使其可执行前沿侦察任务，为护卫舰和驱逐舰进行水面搜索。
usn_sh-3h=SH-3H是远程反潜直升机，配有吊放声呐、磁异常探测器、声呐浮标和鱼雷。与SH-2F不同，它们没有对面搜索雷达，因此最擅长反潜和搜救，而非空中侦察。
usn_qh-50d=QH-50无人反潜直升机可为老旧护航舰艇提升远程轻型反潜作战范围。它们可将鱼雷投送至更远的距离，但由于没有传感器和乘员，执行其他任务的能力非常有限。
jmsdf_hss-2=HSS-2是远程反潜直升机，配有吊放声呐、磁异常探测器、声呐浮标和鱼雷。与SH-2F不同，它们没有对面搜索雷达，因此最擅长反潜和搜救，而非空中侦察。
usmc_ah-1t=AH-1T攻击直升机可在舰艇上起降，提供近距离空中支援、火箭弹攻击和反装甲打击。它们擅长处理暴露在外的水面或陆地目标，但没有配备雷达系统，因此不应执行侦察任务。
fr_as-350=AS.350是执行运输和联络任务的轻型通用直升机。它们是价格低廉的支援资产，但不携带作战传感器或武器，应当远离交战空域。在澳大利亚，它们是阿德莱德级护卫舰的训练飞机，也辅助执行侦察和战斗搜救任务。

[AllowedAircraft]
fr_mirage_iii=幻影IIIO战斗机具备基础的空对空能力，但其导弹射程近，机型本身也弱于更现代化的拦截机。
raaf_f-111c=F-111C攻击机航程远，载弹量大，具备优秀的纵深打击能力。在澳大利亚服役时，它们既有精确打击和反舰装备，又能携带AIM-9导弹进行自卫，因此比其他类型的攻击机更灵活。
usn_ea-6b=EA-6B的任务是提供电子战支援，可干扰敌方传感器，提高打击任务的安全性。作为强大的力量增幅器，其AN/ALQ-99干扰吊舱可削弱敌方传感器性能，降低敌方防御效率。
usn_f-14a=F-14A是具备远程拦截能力的高端舰队防御战斗机。强大的雷达和AIM-54A导弹使它们成为了美国最优秀的舰载空优战斗机。
usn_fa-18a=F/A-18A是北约最新的多用途战斗机，既能空对空作战，也能对地攻击，具备极高的灵活性，可执行多种任务。虽然按照计划，它们在澳大利亚尚处于试验阶段，但战时状态加速了其服役流程。
usn_p-3c=P-3C是执行大范围搜索和反潜任务的远程海上巡逻平台，非常适合在敌方水面和水下接触威胁到主力部队前进行侦察。
usmc_av-8a=AV-8C可在两栖航空甲板和机场进行短距/垂直起降，擅长快速周转的近距离支援、轻型打击和局部对敌防空压制任务，但面对现代化战斗机和密集防空系统时需要其他飞机的保护。
usn_a-7e=A-7E是执行打击和近距离支援任务的可靠轻型攻击平台。它们载弹能力良好，但在进入有防空威胁的空域时需要护航和电子战支援。
usn_a-6e=A-6E是全天候攻击平台，具备强大的对海打击能力，非常适合在战斗机和电战机的配合下执行危险的打击任务。
usn_e-2c=E-2C能为海空行动提供空中预警和指挥支援。它们可以扩大探测范围，缩短反应时间，是强大的力量增幅器。
usn_s-3a=S-3A是具备强大海上巡逻和支援能力的舰载反潜平台，最适合在航母和大型水面编队外围建立反潜保护网。
usaf_f-15c=F-15C战斗机是具备优异性能和强大导弹的专业空优战斗机。利用它们赢得制空权，为打击机群驱赶敌方战斗机。
usaf_f-4e=F-4E是灵活的战斗机，可执行防空和打击任务。虽然弱于更新型的空中优势平台，但它们仍适合进行混编。
usaf_e-3a=E-3A预警机可提供大范围空中监视和指挥支援。它们是强大的空中行动力量增幅器，可强化大片区域内的侦察和协调。
usaf_b-52g=B-52G轰炸机可对大型或固定目标进行远程重型打击。它们需要细致的任务规划和保护，但可以提供战术飞机无法比拟的打击效果。