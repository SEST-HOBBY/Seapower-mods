Side0Trigger1Message=Title=<size=24>Тихоокеанский Удар - Часть 9</size>\nГроза над Палаваном\n<size=24>30 сентября 1985</size>\nBody=После отражения вражеской атаки на Сандакан союзники предпринимают высадку десанта на Палаван. Проведите зачистку акватории, а затем высадите 17-й экспедиционный отряд морской пехоты в порту Пуэрто-Принсеса Сити.\n\nПримечание: Ожидайте последующих операций в этом районе, времени на пополнение боекомплекта не будет. Расходуйте боеприпасы осмотрительно.\nButtonText=Начать миссию\nPopupStyle=Intro
StartForecast=Прогноз погоды для района о. Палаван\nАктуален: 302000Z Сентябрь - 010200Z Октябрь 85\nВосточный ветер над морем Сулу и подходами к Палавану обусловливает малую облачность и волнение моря в 3 балла. В период проведения десантной операции осадки, туман и грозовая активность не ожидаются. Видимость должна оставаться хорошей, лишь у побережья возможна локальная дымка.
Side0Trigger2Message=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! {FlagshipName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Side0Trigger3Message=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! Потеряно слишком много десантных кораблей!\nButtonText=Продолжить\nPopupStyle=Outro
Side0Trigger5Message=1.(S) Донесения от ОТГ 77.6 подтверждают, что 17-й экспедиционный отряд морской пехоты высадился в Пуэрто-Принсесе, а пляжи высадки находятся под нашем контролем.\n\n2. (S) Угроза со стороны береговых комплексов ПКР и средств ПВО ликвидирована и операция «Челленджер» может развиваться далее. Союзные силы вернулись на Палаван.\n\n3. (S) Разведка считает, что силы противника вскоре выйдут для контратаки
Side0Trigger7Message=Title=ВАЖНАЯ ИНФОРМАЦИЯ\nBody=Командир, вражеские ударные вертолеты приближаются к зоне высадки!\nButtonText=Продолжить\nPopupStyle=Notification
