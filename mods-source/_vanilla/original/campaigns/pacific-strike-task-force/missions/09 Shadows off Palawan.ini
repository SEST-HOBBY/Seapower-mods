Side0Trigger1Message=Title=<size=24>パシフィック・ストライク――第9部</size>\nパラワン島沖の陰影\n<size=24>1985年9月30日</size>\nBody=サンダカンへの敵の攻撃を退け、同盟軍はパラワン島への水陸両用強襲に向けて部隊を集結させた。周辺海域の敵水上部隊を掃討し、第17海兵両用部隊（17 MAU）をプエルト・プリンセサに上陸させよ。\n\n注記：この海域では後続作戦が見込まれ、本任務後の再補給は受けられない。兵装は慎重に使用せよ。\nButtonText=作戦開始\nPopupStyle=Intro
StartForecast=パラワン島接近海域艦隊気象予報\n予報期間：85年9月30日2000Z～10月1日0200Z\nスールー海とパラワン島への接近海域では東風により雲が所々に広がり、海況はシーステート3と比較的穏やか。上陸作戦の時間帯にまとまった降水、霧、雷雨は予想されない。沿岸付近に局地的なもやがある程度で、水上捜索、航空作戦、上陸作戦に必要な視程は良好な見込み。
Side0Trigger2Message=Title=作戦失敗\nBody=敗北！{FlagshipName}が撃沈された！\nButtonText=任務に戻る\nPopupStyle=Outro
Side0Trigger3Message=Title=作戦失敗\nBody=任務失敗！揚陸艦を失いすぎた！\nButtonText=任務に戻る\nPopupStyle=Outro
Side0Trigger5Message=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=太平洋艦隊司令長官　パールハーバー、ハワイ州\n第77.6任務群（TG 77.6）\nSubj=チャレンジャー作戦――任務達成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 第77.6任務群の報告により、第17海兵両用部隊（17 MAU）がプエルト・プリンセサに上陸し、上陸海岸を確保したことを確認した。\n\n2. (S) 沿岸ミサイルと防空戦力による脅威は、チャレンジャー作戦を続行できる程度まで減じられた。同盟軍はパラワン島に戻った。\n\n3. (S) 情報部は、敵軍がまもなく反撃のため出撃するとみており、後続作戦が見込まれる。東方へ離脱し、次の命令を待て。第77任務部隊指揮官より。\nButtonText=任務に戻る\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger7Message=Title=作戦状況更新\nBody=指揮官、敵の攻撃ヘリコプターが上陸海岸へ接近するのを確認した！\nButtonText=了解して続行\nPopupStyle=Notification
Objective_LandMAU=第17海兵両用部隊（17 MAU）を指定の上陸海岸に上陸させる
Objective_FlagshipMustSurvive={FlagshipName}の生存
Objective_USAmphibsMustSurvive=同盟軍揚陸艦の全艦生存
