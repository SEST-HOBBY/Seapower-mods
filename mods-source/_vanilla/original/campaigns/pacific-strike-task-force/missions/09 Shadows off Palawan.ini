Side0Trigger1Message=Title=<size=24>Pacific Strike - Part 9</size>\nSHADOWS OFF PALAWAN\n<size=24>September 30th, 1985</size>\nBody=After repulsing the enemy attack against Sandakan, the Allies have mobilized for an amphibious assault against Palawan. Conduct an anti-surface sweep of the area, then land 17 MAU at Puerto Princesa.\n\nNote: follow-on operations are anticipated in the area, and resupply will not be available after this mission. Expend ordnance carefully.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR PALAWAN APPROACHES\nVALID: 302000Z SEP-010200Z OCT 85\nEasterly flow across the Sulu Sea and Palawan approaches is producing scattered cloud cover and moderate seas at Sea State 3. No organized precipitation, fog, or thunderstorm activity is expected during the amphibious window. Visibility should remain good for surface search, aviation, and landing operations, with only localized haze near the coast.
Side0Trigger2Message=Title=DEFEAT\nBody=Defeat! {FlagshipName} has been sunk!\nButtonText=Return to mission\nPopupStyle=Outro
Side0Trigger3Message=Title=MISSION FAILED\nBody=Mission failed! Too many amphibious ships have been lost!\nButtonText=Return to mission\nPopupStyle=Outro
Side0Trigger5Message=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nTG 77.6\nSubj=OPERATION CHALLENGER-MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Reports from TG 77.6 confirm 17 MAU is ashore at Puerto Princesa and landing beaches are secure.\n\n2. (S) Coastal missile and air-defense threat has been reduced sufficiently to permit continuation of Operation CHALLENGER. Allied forces are back on Palawan.\n\n3. (S) Intel believes enemy forces will sortie to counterattack soon and follow-on operations are anticipated. Clear east and await further orders. CTF 77 sends.\nButtonText=Return to mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger7Message=Title=MISSION UPDATE\nBody=Commander, enemy attack helicopters have been spotted approaching the landing beaches!\nButtonText=Acknowledge & continue\nPopupStyle=Notification
