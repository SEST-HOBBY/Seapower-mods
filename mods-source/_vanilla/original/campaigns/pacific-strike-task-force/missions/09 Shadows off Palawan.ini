Side0Trigger1Message=Title=<size=24>Pacific Strike - Teil 9</size>\nSCHATTEN VOR PALAWAN\n<size=24>30. September 1985</size>\nBody=Nach der Abwehr des feindlichen Angriffs auf Sandakan haben sich die Alliierten Kräfte für einen Angriff auf Palawan gesammelt. Führen Sie eine Säuberung des Einsatzraums durch und landen Sie anschließend die 17th MAU bei Puerto Princesa.\n\nHinweis: Da Folgeoperationen in diesem Gebiet erwartet werden, ist zu beachten, dass nach dieser Mission keine Versorgung zur Verfügung stehen wird. Setzen Sie Ihre Munition mit Bedacht ein.\nButtonText=Mission starten\nPopupStyle=Intro
Side0Trigger2Message=Title=NIEDERLAGE\nBody=Niederlage! {FlagshipName} wurde versenkt!\nButtonText=Zurück zur Mission\nPopupStyle=Outro
Side0Trigger3Message=Title=MISSION FEHLGESCHLAGEN\nBody=Mission fehlgeschlagen! Sie haben zu viele amphibische Schiffe verloren!\nButtonText=Zurück zur Mission\nPopupStyle=Outro
Side0Trigger5Message=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nTG 77.6\nSubj=OPERATION CHALLENGER-MISSION ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Meldungen von TG 77.6 bestätigen, dass 17 MAU bei Puerto Princesa an Land ist und die Landungsstrände gesichert sind.\n\n2. (S) Die Bedrohung durch Küstenflugkörper und Luftverteidigung wurde ausreichend verringert, um Operation CHALLENGER fortzusetzen. Alliierte Kräfte sind zurück auf Palawan.\n\n3. (S) Verdammt gute Arbeit für einen Tag, Kommandant. Bergen Sie Überlebende, soweit möglich, und bereiten Sie sich auf eine feindliche Reaktion von Luzon vor. CTF 77 Ende.\nButtonText=Zurück zur Mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger7Message=Title=MISSIONSUPDATE\nBody=Kommandant, feindliche Kampfhubschrauber wurden im Anflug auf die gelandeten Kräfte gesichtet!\nButtonText=Bestätigen und fortfahren\nPopupStyle=Notification
