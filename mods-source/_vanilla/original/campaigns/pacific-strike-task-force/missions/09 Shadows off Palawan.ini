Side0Trigger1Message=Title=<size=24>出击太平洋：第9部分</size>\n巴拉望沿海的阴影\n<size=24>1985年9月30日</size>\nBody=在击退进攻山打根的敌军后，盟军已做好对巴拉望岛发动两栖突击的准备。先对此区域进行反水面扫荡，再让海军陆战队第17远征队登上普林塞萨港。\n\n注意：预计此区域内还有后续行动，完成此任务后将无法进行补给。请谨慎地使用军械。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=巴拉望航道舰队天气预报\n有效期：1985年9月30日2000Z时至10月1日0200Z时\n苏禄海和巴拉望航道的东风使云量维持在少云，海况为3级。两栖突击窗口期内预计不会出现组织化降水、雾或雷暴活动。能见度良好，利于水面搜索、航空和登陆行动，仅海岸附近局部有霾。
Side0Trigger2Message=Title=任务失败！\nBody=任务失败！{FlagshipName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Side0Trigger3Message=Title=任务失败！\nBody=任务失败！我们损失了过多两栖舰艇！\nButtonText=返回任务\nPopupStyle=Outro
Side0Trigger5Message=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=夏威夷州珍珠港太平洋舰队总司令\n第77.6特遣大队\nSubj=挑战者行动——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）第77.6特遣大队的报告确认海军陆战队第17远征队已在普林塞萨港登陆，登陆海滩已安全。\n\n2.（机密）海岸导弹和防空威胁已显著降低，为挑战者行动的继续进行创造了条件。盟军已重返巴拉望岛。\n\n3.（机密）情报显示敌军即将出动反击，预计我们将展开后续行动。立即向东撤退并等待进一步命令。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger7Message=Title=任务更新\nBody=指挥官，已发现敌方攻击直升机靠近登陆海滩！\nButtonText=收到并继续\nPopupStyle=Notification
