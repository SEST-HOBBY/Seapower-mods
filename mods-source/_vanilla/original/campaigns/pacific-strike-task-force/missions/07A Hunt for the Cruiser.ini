MapSymbol_New2Label_ru=Slava SAG
MapSymbol_New3Label_ru=New Symbol
MapSymbol_New4Label_ru=?
MapSymbol_New5Label_ru=Enemy ASW Air
Taskforce1StartMessage=<size=24>Дополнительная миссия</size>\nОхота на крейсер\n<size=24>23 сентября 1985</size>|Поступили сведения о обнаружении корабельной ударной группы во главе с крейсером «Слава» в Южно-Китайском море|Close
StartForecast=Прогноз погоды для района западнее островов Спратли\nАктуален:230500-231200Z Сентябрь 85\nШтормовые условия в районе островов Спратли, наблюдаемые в 05:00 по местному времени, вскоре начнут ослабевать по мере уменьшения атмосферного давления и постепенного стихания северо-западного ветра. К 06:00 волнение моря снизится с 5 до 4 баллов, а дожди прекратятся, хотя остаточная облачность и локальные туманы могут по-прежнему ограничивать видимость. Умеренные погодные условия (с тенденцией к улучшению) сохранятся до 12:00 по местному времени
Taskforce1OrionmustsurviveMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! HMAS «Орион» уничтожена!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1Slavasunk-playervictoryMessage=From=MARITIME HQ\nTo=HMAS ORION\nInfo=Ком. подв. силами США на Тихом Океане PEARL HARBOR HI\nКом. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=AustraliaRAN\nBody=1. (S) Штаб подтверждает получение донесения об успешном потоплении крейсера «Слава» 23 сентября. \n\n2. (S) Уничтожение этого корабля устраняет главную ракетную угрозу в районе Южно-Китайского моря и существенно ослабляет силы противника, способные действовать против нас.\n\n3. (S) Отличная работа, командир!\nButtonText=Вернуться к миссии\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroySlava=Потопить РКР «Слава»
Objective_OrionMustSurvive=HMAS «Орион» должна выжить
Objective_DestroySAG=Опционально: Потопить все корабли противника
[Language_de]
Name=07A Jagd auf den Kreuzer
Description=Die Slava-SAG wurde irgendwo in der Sulusee gemeldet. Übernehmen Sie das Kommando über die HMAS Orion, um sie aufzuspüren und zu versenken.
MapSymbol_New1Label_de=South China Sea
MapSymbol_New2Label_de=Slava SAG
MapSymbol_New3Label_de=New Symbol
MapSymbol_New4Label_de=?
MapSymbol_New5Label_de=Enemy ASW Air
Taskforce1StartMessage=Title=<size=24>Pacific Strike - U-Boot-Herausforderung 2</size>\nJAGD AUF DEN KREUZER\n<size=24>23. September 1985</size>\nBody=Die Slava-SAG wurde im Südchinesischen Meer gesichtet und alliierte U-Boote haben den Befehl erhalten, sie zu versenken. Der Nachrichtendienst geht davon aus, dass die SAG ein amphibisches Schiff eskortiert, das Palawan verstärken soll und dass feindliche U-Boote den Verband wahrscheinlich begleiten. Seefernaufklärer, die von Cam Ranh aus operieren, befinden sich ebenfalls im Gebiet.\n\nSpüren Sie die Slava auf und versenken Sie sie. Die Zerstörung weiterer feindlicher Einheiten ist optional.\nButtonText=Mission starten\nPopupStyle=Intro
StartForecast=FLOTTEN-WETTERVORHERSAGE FÜR DEN RAUM SPRATLY-INSELN\nGÜLTIG: 230500-231200Z SEP 85\nDie stürmischen Wetterbedingungen über den Spratly-Inseln um 0500 Ortszeit werden nachlassen, wenn der Luftdruck weiter sinkt und die nordwestlichen Winde allmählich abnehmen. Der Seegang wird sich bis etwa 0600 von der Stufe 5 auf die Stufe 4 abschwächen, während zeitgleich auch die Regenschauer nachlassen. Restbewölkung und vereinzelte Nebelfelder können die Sicht jedoch weiterhin einschränken. Bis 1200 Ortszeit werden sich die Bedingungen verbessern, bleiben jedoch mäßig. Erneute stürmische Wetterbedingungen werden im Vorhersagezeitraum nicht erwartet.
Taskforce1OrionmustsurviveMessage=Title=MISSION FEHLGESCHLAGEN\nBody=Niederlage! Die HMAS Orion wurde zerstört!\nButtonText=Zurück zur Mission\nPopupStyle=Outro
Taskforce1Slavasunk-playervictoryMessage=From=COMSUBPAC\nTo=HMAS ORION\nInfo=CTF 77\nCINCPACFLT PEARL HARBOR HI\nSubj=U-BOOT-MELDUNG - MISSION ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=AustraliaRAN\nBody=1. (S) Eingang Ihrer Meldung bestätigt: Kreuzer der SLAVA-Klasse zerstört.\n\n2. (S) Der Verlust dieser Einheit beseitigt die wichtigste Flugkörperbedrohung des feindlichen Verstärkungsverbandes nach Palawan und schwächt die Führung des Sicherungsschirms erheblich.\n\n3. (S) Ausgezeichnete Arbeit, ORION. Falls die Lage es zulässt, setzen Sie den Angriff gegen verbleibende Transporte und Sicherungseinheiten fort. Andernfalls Datum räumen und Boot erhalten. COMSUBPAC Ende.\nButtonText=Zurück zur Mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroySlava=Versenken Sie die Slava
Objective_OrionMustSurvive=Die HMAS Orion muss überleben
Objective_DestroySAG=OPTIONAL: Zerstören Sie alle feindlichen Einheiten
