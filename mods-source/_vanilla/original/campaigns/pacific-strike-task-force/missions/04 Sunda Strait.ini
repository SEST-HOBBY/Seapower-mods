MapSymbol_New8Label_cn=爪哇岛
MapSymbol_New9Label_cn=巽他海峡
MapSymbol_New10Label_cn=防空炮
Trigger1Condition_Condition1AreaLabel=到达此区域以撤离！
Taskforce1Playershipsreacharea-playerwinsMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=夏威夷州珍珠港太平洋舰队总司令\nSubj=位置报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）已收到并确认你的最后位置报告。虽然遭遇敌对行动，但你出色完成了穿越海峡的任务。\n\n2.（机密）此地区内的盟军部队面临巨大压力，保存实力是首要任务。离开此区域并前往达尔文，等待进一步命令。\n\n3.干得好，指挥官。你带领你的部队完成了一次危险的撤退，保存了特遣舰队的战斗力。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=任务失败！\nBody=任务失败！{FlagshipName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1StartMessage=Title=<size=24>出击太平洋：第4部分</size>\n巽他海峡\n<size=24>1985年7月15日</size>\nBody=盟军已收到命令撤退至澳大利亚。{TaskForceName}在敌军进攻中几乎全军覆没，正在尝试撤离爪哇海。穿越巽他海峡，抵达公海，保存实力以图来日再战。\n\n情报显示海峡附近至少有一艘敌方潜艇，预计还有大量民用船只通行。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=巽他海峡舰队天气预报\n有效期：1985年7月15日2300Z时至16日0500Z时\n1985年7月15日2300Z时至次日0500Z时，巽他海峡天气状况稳定，有中低强度西南风，海况为3级。多云，能见度良好，预计无雾或降水。在此期间，天气状况预计不会发生重大变化。
Taskforce1SealiftCaribbeanSeamustsurviveMessage=Title=任务失败！\nBody=任务失败！油船已被击沉。你加入了巽他海峡海底的休斯顿号和珀斯号！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1KilopresencemessageMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=\nSubj=潜艇威胁更新——巽他海峡\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）太平洋潜艇部队司令发来报告称休斯顿号潜艇于7月8日在你的位置以北与一个强大的敌方潜艇狼群交战并将其消灭。\n\n2.（机密）情报部门评估认为这些单位的任务是封锁巽他海峡。\n\n3.（机密）我们评估认为潜艇对你的威胁将大幅降低，但穿越海峡时仍需谨慎。\n\n4.（机密）第77特遣舰队指挥官在达尔文为休斯顿号的船员们准备了庆功酒。祝你好运，我们在那里相见。\nButtonText=收到并继续\nPopupStyle=NavalMessage
Taskforce1+30minRNZAFcheckinMessage=Title=特高频空中协调网‌\nBody={TaskForceName}，我们是两架天鹰攻击机组成的编组鹬鸵1号，携带Mk82炸弹和火箭弹，目前位于海峡以南100英里的海面上，正在从南方靠近，30分钟后燃料将到达返航阈值。准备执行任务，完毕。\nButtonText=收到并继续\nPopupStyle=Notification
Taskforce1+1hrRNZAFcheckoutMessage=Title=特高频空中协调网‌\nBody={TaskForceName}，这里是鹬鸵1号，我们仅剩返航燃料，必须撤退。祝你好运。鹬鸵1号完毕。\nButtonText=收到并继续\nPopupStyle=Notification
