[Settings]
GradientMinValue=-2000     // everything below will use the first gradient color (value is meter)
GradientMaxValue=6000      // everything above will use the last gradient color (value is meter)
GradientTextureSeaLevel=31 // defines where the sea level ends in the texture
MapUpdateIntervall=1       // updates the map every x frames
DefaultRange=30.0          // default size of the mini map in nautical miles
MinRange=0.1               // diameter of the mini map in nautical miles
LineThickness=1.5          // in pixels for lines like bearing lines, circles etc
PassiveSonarBearingLineLength=200  // length in pixels for the bearing lines
DefaultZoom=1
#0.025

[TrackPoints]
MaxTrackPoints=20
TrackPointDistance=0.03    // in degrees, one degree is 60nm

[Waypoints]
CurrentWaypointLineColor=255,0,0,255
SetWaypointsLineColor=255,192,0,255

[DropPoints]
CurrentDropPointLineColor=255,0,0,255
SetDropPointsLineColor=255,20,147,255
DropPointIconColor=94,0,255,255

[SeekerCones]
InactiveConeColor=0,153,0,255
ActivatedConeColor=255,20,147,255

[IlluminationVectors]
IlluminationVectorColor=255,0,0,255

