[---------- General Data ----------]
[General]
UnitType=Biologic
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.1

Length=25                      // in meters
Beam=4                         // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=150               // in tons
HorsePower=500

MaxForwardVelocity=20          // Max submerged forward velocity in knots
MaxBackwardVelocity=3.0        // Max submerged backward velocity in knots

TelegraphVelocities=-2,0,5,8,10,12,14 // Overrides default telegraph values
UnderwaterTime=600       // time a whale can go without taking a breath, in seconds. 0 means it doesn't need to breath
BreathTime=40            // time needed to replenish air, in seconds
MigrateTime=2800         // time to go to another feed area, in seconds
FeedTime=1200            // time to feed, in seconds

LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.5                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=20.0
RollChangeRate=2.0

DepthChangeRate=5.0

TrimDepth=2                    // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

BreathDepth=2                  // in feet
FeedDepth=300                  // in feet
CrushDepth=700.0               // in feet

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=130                  // base sound level in db at 1m distance
FlowNoise=1.2                  // additional flow noise per knot in db (20kn would be +20db)
TargetReflectionStrength=15    // in dB for broad side
DistinctiveNoise=False         //If True, this vessel can be identified easier than usually by passive sonars
DetectedAs=Submarine // will be detected along with this type of objects for the purposes of classification
[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_bio_blue_whale

