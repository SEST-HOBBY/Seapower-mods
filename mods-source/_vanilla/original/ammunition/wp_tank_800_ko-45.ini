[General]
#820 liters fuel tank
Type=Fueltank                       // can be Projectile, Missile, RBU, ASROC, Torpedo,AerialRocket,MLRS
#Mass=100                                   // in kg. Used for aircraft. Container mass. Weapon mass is read from weapon ini. Better not use it for fueltanks
Fuel=656

[Guidance]
