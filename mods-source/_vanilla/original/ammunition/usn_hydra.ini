[General]
Type=AerialRocket                       // can be Projectile, Missile, RBU, ASROC, Torpedo,AerialRocket,MLRS
TargetType=ASuW                         // can be AAW, ASuW, ASW
#SecondaryTargetType=AAW

Mass=11                                // in kg. Used for aircraft
AmmoPoints=13.75                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=2
Power=3
ImpactSize=Small                    // Impact size, can be small, medium, large, verylarge
Penetration=Minor                       // can be minor, moderate, heavy, always


[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
AxialRotation=180                      // In degrees per second. Doesnt work when "SupportsBanking" is true
#========================================= Launch stats ============================================================
MaxVelocity=1409                       // Maximum speed in knots
Acceleration=140                       // Acceleration factor
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.16                    // Minimum launch range in nautical miles
MaxLaunchRange=1                       // Maximum launch range in nautical miles

MinLaunchAltitude=200                  // Minimum launch altitude in feet.
MaxLaunchAltitude=5000                 // Maximum launch altitude in feet.


LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=100.0              // Circular error radius in meter
#Homing
#ECCM
#GravityFactor=32.0
# Torpedo related
#SelfDestruct
[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/usn_hydra70/
ResourcesRoot=usn_hydra70
ResourcesMesh=usn_hydra_inflight
ResourcesMaterialFolder=ships/materials/
ResourcesMaterial=modular_parts

ResourcesMeshForLaunch=usn_hydra_dummy
ResourcesMeshSwitchTime=0.1  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

BoosterEffect=None
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/rocket_small_launch_effect
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0

HitDefaultExplosionClass=RocketShipHitExplosion
HitShipExplosionClass=RocketShipHitExplosion
#HitAirExplosionClass=RocketShipHitExplosion

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

ExplosionOverwaterSplash=effects/splashes/emitters/splash_small

############################################################
# Sounds
############################################################
#Not needed here

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043