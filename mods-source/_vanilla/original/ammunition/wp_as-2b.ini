#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# K-10S
# Users: wp_tu-16k
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=4533                              // in kg. Used for aircraft
AmmoPoints=13599                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard          // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=5  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=5
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=22
ImpactSize=VerySmall            // Impact size, can be small, medium, large, verylarge
Penetration=Always              // can be minor, moderate, heavy, always

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing

#In flight tests, the Kipper cruised on its approach to a target at an altitude of about 10,000 meters, using inertial guidance

# until it reaches a range of about 100 to 110 kilometers from the target,
# where it enters a shallow 15 degree dive, commanded by a mid-course update via radio link.

# When it reaches a range of 60 to 70 kilometers it levels out at an altitude of between 800 and 1,000 meters
# where it cruises until it reaches a range of 10 to 16 kilometers, when the missile's active radar homing guidance is engaged.
# It then enters a dive, striking the target vessel close to or below the waterline. 
[OnBoardSystems]
ECM=Azaliya_OECM

[Guidance]
GuidanceType=0
LandAttackGuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
#TargetRequired=True                    // Cannot be launched to bearing
DropDuration=3.0                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=11.0        // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=30.0                      // Climb angle for initial loft
MaxLoftAlt=Maintain                    // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=3000.0                  // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=15.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=1                    // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=53        // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=50                // in N. miles. Recommended to set this distance slightly less than the seeker range
LocalTerminalOnly=True                 // if true connection with a guiding radar will be severed upon entering terminal approach stage
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=1100.0                     // Maximum speed in knots
Acceleration=12.0                      // Acceleration factor
MaxTurnRate=10                         // Maximum turnrate in degrees per second

MinLaunchRange=35                      // Minimum launch range in nautical miles
MaxLaunchRange=150                     // Maximum launch range in nautical miles
MinLaunchAltitude=16400                // Minimum launch altitude in feet.
MaxLaunchAltitude=32800                // Maximum launch altitude in feet.

LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=140    // Circular error vs 'Installation' land units
#Homing
SeekerGain=38.0                        // Seeker gain in dB
SeekerFOV=45                           // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerActiveRange=19                   // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=0                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=35.0                         // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
DefaultIgnoredTypes=LandUnit           // Seeker ignores objects of this type while in default mode
#ECCM
AntiCountermeasuresBonus=0.1           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0                      // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=10.0                 // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/wp_as-2/
ResourcesRoot=wp_as-2
ResourcesMesh=wp_as-2
ResourcesMaterial=wp_as-2_mat
//ResourcesMeshForLaunch=wp_as-2
ResourcesMeshSwitchTime=4.0 // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=1

SubModel1=Afterburner

[Afterburner]
Type=Afterburner                  //Dot: afterburner is invisible by default and will be turned on only after launch
Mesh=wp_as-2_afterburner
ResourcesMaterialFolder=aircraft/materials/
Material=afterburner_mat
Position=0,0,0
Rotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=None

InFlightEffect=effects/weapons/emitters/turbojet_sustainer
InFlightEffectPosition=0,-0.01,-0.058
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions

HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=GroundHitExplosions

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
#creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637