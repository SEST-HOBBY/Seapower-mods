[General]
Type=Chaff                             // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW

Mass=0.1                               // in kg. Used for aircraft
AmmoPoints=0.1                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
#IOCDate=19XX						   // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
#FOCDate=19XX						   // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available


[ECM]
# Chaff -related parameters
SpoofChance=0.5                       // Base chance to spoof missile
DefensiveEffectTime=50                // Period of defensive effect being active in seconds
ReactionRange=2.7                     // in miles; Distance to missile at which chaff is auto-launched

[SensorData]
IRSignature=VeryLarge
# radar related (RCS => radar cross section)
RCS=VeryLarge