[General]
# Progress aka SS-N-3B Sepal
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation,ShoreTargetsOnly // can be  All, Installation, Mobile, ShoreTargetsOnly

CIWSDefenceBonus=10                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.10                     // Less chance to be intercepted by SAM because of anti-interception maneuvers
#Armored warhead & weaving terminal maneuver

Mass=4400                              // in kg. Used for aircraft
AmmoPoints=15000                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=5
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=240                 // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=95
ImpactSize=VeryLarge            // Impact size, can be small, medium, large, verylarge
Penetration=Always               // can be minor, moderate, heavy, always

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=5.0         // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=15.0                      // Climb angle for initial loft
MaxLoftAlt=23000.0                     // in feet. Maximum altitude for lofting
MaxLoftVelocity=970.0                 // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=13200                    // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=25.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=1                    // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=130.0      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=1312.0               // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=45.0
FinalFlightPhaseDistToTarget=50.0      // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=20.0               // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalAlt=65                         // in feet. Weapon will try to get to this altitude at the start of terminal approach
#TerminalVelocity=5.0                   // Maximum speed in knots when missile is locked on target
TerminalDiveDistance=1                 // in N. miles.
RequiresTargetToProceed=True           // Will not change its flight phase unless have a target selected by operator
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=780.0                      // Maximum speed in knots
Acceleration=6.0                       // Acceleration factor
MaxTurnRate=9.0                        // Maximum turnrate in degrees per second
MinLaunchRange=23.5                    // Minimum launch range in nautical miles
MaxLaunchRange=248                     // Maximum launch range in nautical miles
MaxDepth=0
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=150    // Circular error vs 'Installation' land units
#Homing
SeekerGain=40.0                        // Seeker gain in dB
SeekerFOV=70.0                         // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerActiveRange=50                   // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=50                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=38                           // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
DefaultIgnoredTypes=LandUnit           // Seeker ignores objects of this type while in default mode
UseFinalFlightInLandMode=False         // Skip FinalFlightPhase when in LandAttack mode
#Misc Guidance Properties
SizeGate=10							   //
RangeGate=2							   // 
#ECCM
AntiCountermeasuresBonus=0.25          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.1                    // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/wp_ss-n-3/
ResourcesRoot=wp_ss-n-3
ResourcesMesh=wp_ss-n-3
ResourcesMaterial=wp_ss-n-3_mat
// optional below
ResourcesMeshForLaunch=wp_ss-n-3_dummy
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=1

SubModel1=Afterburner

[Afterburner]
Type=Afterburner                  //Dot: afterburner is invisible by default and will be turned on only after launch
Mesh=wp_ss-n-3_afterburner
ResourcesMaterialFolder=aircraft/materials/
Material=afterburner_mat
Position=0,0,0
Rotation=0,0,0

# Optional debris related stuff
[Debris]
DebrisProbability=101              // in %, probability for debris to happen
ResourcesMeshForDebris=wp_ss-n-3_d // optional debris mesh after destruction
DebrisPosition=0.05                // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.999
DebrisHeightLossAdd=0.0005   // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/wp_ss-n-3_booster
BoosterEffectPosition=0,0,0

InFlightEffect=effects/weapons/emitters/turbojet_sustainer
InFlightEffectPosition=0,0,-0.072
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions

HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=VeryLargeGroundHitExplosions

DebrisSplashClass=LargeWaterSplashes
DebrisTrailClass=MissileDebrisFire

[---------- Colliders ----------]
[Colliders]
#creates the hit boxes for this object
Collider=coll_main

[coll_main]
Collider=Box
Position=0,-0.0025,-0.005
Rotation=0,0,0
Scale=0.01,0.015,0.14
