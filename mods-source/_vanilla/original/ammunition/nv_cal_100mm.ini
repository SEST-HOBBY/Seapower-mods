[General]
Type=Projectile                  // can be Projectile, Missile, Torpedo
TargetType=AAW                   // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=28                                // in kg. Used for aircraft
AmmoPoints=28                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts            // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts   // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=880               // meter per second
MaxRange=15000                   // in meters
CircularErrorProbable=130        // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
#Warhead Types:
#0 = HighExplosive     =  100% damage to structre
#1 = Armor Piercing		TBD
#2 = HEAT				TBD
#3 = Illumination		TBD
#4 = Cluster           =  -50% damage to structre
#5 = Runway Cratering	TBD
#6 = Fragmentation     =  -50% damage to structre
[WarheadData]
WarheadType=6
Power=4
ImpactSize=Small                 // Impact size, can be small, medium, large, verylarge
Penetration=Minor                // can be minor, moderate, heavy, always
FuzeProximityDistance=15         // In meters
KillProbability=0.001            // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_medium_shell
HitAirExplosionClass=MediumFlakExplosions
HitDefaultExplosion=effects/Particle Emitters/impact_medium_shell
HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=MediumGroundHitExplosions
