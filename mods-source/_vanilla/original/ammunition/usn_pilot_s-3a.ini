[General]
Type=Paratrooper                          // can be Projectile, Missile, RBU, ASROC, Torpedo

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

OnHitWaterSpawn=all_life_raft_single
OnHitGroundSpawn=all_life_raft_single

[SensorData]
IRSignature=VeryTiny
RCS=VerySmall                   //radar related (RCS => radar cross section) i.e how visible is target

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
ParachuteSlowDown=0.99                   // speed damping
ParachuteVelocities=1000,30|5000,75|10000,100                  // ft, knot  Max allowed velocities
ParachuteEndVelocity=10                  // slow down end speed in knots of torpedo with parachute
ParachuteDeployDelay=3.2
ParachuteDeployMaxAltitude=15000

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=-1

[---------- Guidance ----------]
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1           // Time in seconds before colliders are enabled
EjectVelocity=-80                      // Initial forward speed in knots
MaxTurnRate=1.0                        // Maximum turnrate in degrees per second
CircularErrorRadius=120.0              // Circular error radius in meters

[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_mk-82
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_mk-82_mat
AssetBundleMeshHullCollider=usn_mk-82_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=aircraft/emitters/
ResourcesRoot=usn_pilot_a_eject

ResourcesMesh=usn_pilot_a_ejected
ResourcesMeshForLaunch=usn_pilot_a_seated
ResourcesMaterialFolder=characters/materials/
ResourcesMaterial=usn_pilot_a_mat

ResourcesMeshSwitchTime=4.2  // time in seconds after launch to switch from launch mesh to main mesh

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFlightEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

InFlightEffect=aircraft/particles/usn_s-3a_seat

ParachuteEffect=aircraft/particles/usn_parachute
ParachuteEffectPosition=0,-0.001,-0.0242
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.01374
Rotation=0,0,0
Scale=0.008,0.005,0.03
