[General]
# Yu-1G (WIP model, should have new tail)
# cass note: used as a testbed for the Yu-6 torpedo therefore has an early development Yu-6 seeker
# Users: 
Type=Torpedo                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=1615                              // in kg. Used for aircraft
AmmoPoints=2422                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=TorpedoImpacts  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=122                   // base sound level in db at 1m distance
FlowNoise=0.7                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0               // additional noise for cavitation in db
TargetReflectionStrength=1      // in dB for broad side
#Transient
TransientRCS=-1                        // Transient visibility on the radar
TransientVisualIdentificationRange=-1  // Transient can be visually detected at this distance
TransientBaseNoise=180                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=80
ImpactSize=Large               // Impact size, can be small, medium, large, verylarge
Penetration=Always              // can be minor, moderate, heavy, always

FuzeProximityDistance=5         // for proximity fuze: distance to target in meter
SmartFuse=True                  // Explodes not immediately but when when target start to go away
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=10
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
VesselAttackGuidanceType=8
InitialFlightPhaseDuration=5           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
TerminalVelocity=39.0                  // Maximum speed in knots when torpedo is locked on target
#========================================= Launch stats ============================================================
Acceleration=10.0                      // Acceleration factor
MaxTurnRate=10                         // Maximum turnrate in degrees per second

SpeedSettings=39,50                    // selectable speeds in knots, lowest to highest
SpeedSettingRanges=4.85,1.9            // full tank range in nautical miles at each of the speeds above

MinLaunchRange=0.1                     // Minimum launch range in nautical miles
MinLaunchAltitude=0                    // Minimum launch altitude in feet.
MaxLaunchAltitude=1000                 // Maximum launch altitude in feet.

MaxDepth=500                           // Maximum allowed depth in feet.

LaunchReliability=85                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerFOV=60.0                         // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerActiveRange=1.2                    // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=1.2                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
SeekerGain=30.0                        // Seeker gain in dB
SeekerOutputPower=215                  // Active seeker output power in dB, unused for passive ones
#ECCM
AntiCountermeasuresBonus=0.15          // This value substracted from probability of spoofing by countermeasures (0...1)
MinAfterSpoofEffectTime=8.0            // Min time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
MaxAfterSpoofEffectTime=25.0           // Max time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
# Torpedo related
SearchMode=0                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
SearchVelocity=30.0                    // velocity in search mode in knots
SnakeSearchAngle=30.0                  // going left/right using that angle
SnakeSearchTurnCycleTime=6.0           // time in seconds it takes for one complete snake cycle (left/right)
ReattackMode=1                         // 0 = None, 1 = Circle
ReattackCircleDegreesPerSecond=10.0    // degrees per second for circle reattack pattern
DefaultDepth=80.0                     // default depth in feet a torpedo is using for submerged targets for bearing only launches
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################

AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/plan_yu-1/
ResourcesRoot=plan_yu-1
ResourcesMesh=plan_yu-1
ResourcesMaterial=plan_yu-1g_mat
# optional below
ResourcesMeshForLaunch=plan_yu-1_dummy
ResourcesMeshSwitchTime=1	//0  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=2

SubModel1=Propeller_Left
SubModel2=Propeller_Right

[Propeller_Left]
Type=Propulsion
RotationDirection=Left
Mesh=plan_yu-1_propl
Rotation=-90,0,0

[Propeller_Right]
Type=Propulsion
RotationDirection=Right
Mesh=plan_yu-1_propr
Rotation=-90,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
BoosterEffectPosition=0,0,0

InFlightEffect=effects/weapons/emitters/aswtorpedo_cavitation_particle
InFlightEffectPosition=0,0,-0.057
InFlightEffectStartTime=0

HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes
ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo

############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
PropAudioClip=audio/weapons/torpedo
PropAudioRollOff=Logarithmic
PropAudioDistance=1,20
PropAudioPitch=1.0
PropAudioPosition=0,0,0
PropAudioAudibility=Below

[---------- Colliders ----------]
[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,-0.0051,0.0053
Rotation=0,0,0
Scale=0.01,0.01703,0.09293
