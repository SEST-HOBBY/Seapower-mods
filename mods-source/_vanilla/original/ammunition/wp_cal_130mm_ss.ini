[General]
Type=Projectile                        // can be Projectile, Missile, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW

Mass=33.4                              // in kg. Used for aircraft
AmmoPoints=33.4                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts  // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=850         // meter per second
MaxRange=25540             // in meters
CircularErrorProbable=120  // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=0
ImpactSize=Tiny            // Impact size, can be small, medium, large, verylarge
Penetration=Moderate       // can be minor, moderate, heavy, always

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_medium
ResourcesMaterial=shell_tracer_yellow

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_starshell
HitAirExplosionClass=Starshells
HitDefaultExplosion=effects/Particle Emitters/impact_starshell
HitWaterSplashClass=Starshells
HitGroundExplosionClass=Starshells
