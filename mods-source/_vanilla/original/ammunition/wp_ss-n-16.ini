#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# RPK-6 Vodopad
Type=ASROC                             // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW

Mass=2150                              // in kg. Used for aircraft
AmmoPoints=6450                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
#IOCDate=19XX						   // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
#FOCDate=19						   // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available


DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

FrontalArea=0.1768
SideArea=1.67
BottomArea=1.67
[SensorData]
#Visual
VisualIdentificationRange=1  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
[WarheadData]
#No need to specify anything since its warhead is never used

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=2.0         // time in seconds where the missile moves straight on without guiding
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
WaterEntryLaunch=True                  // True = surface-ship launch enters the water like a torpedo, runs submerged, then breaches to ignite the booster (as when sub-launched). No effect on sub/air launches.
#======================================== Flight Profile ===========================================================
# Flight profile for ASROK type is hardcoded
#========================================= Launch stats ============================================================
MaxVelocity=1000.0                      // Maximum speed in knots
Acceleration=24.0                      // Acceleration factor
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second
MinLaunchRange=1.2                     // Minimum launch range in nautical miles
MaxLaunchRange=27.0                    // Maximum launch range in nautical miles (RPK-6 Vodopad: ~50 km)

MinDepth=30                            // Minimum required depth in feet.
MaxDepth=200                           // Maximum allowed depth in feet.

#========================================     Seeker     ===========================================================
CircularErrorRadius=0.0                // Circular error radius in meter
#Homing
#ECCM
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=6.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
# TODO
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/wp_ss-n-16/
ResourcesRoot=wp_ss-n-16
ResourcesMesh=wp_ss-n-16
ResourcesMaterial=wp_ss-n-16_mat
ResourcesMeshForLaunch=wp_ss-n-16_dummy
ResourcesMeshCanister=wp_ss-n-16_dummy
ResourcesMeshSwitchTime=0.2  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

# optional entry below, allows to switch to a second type of ammunition
# e.g. used for ASROC where a MK46 torpedo is spawned
[Submunition]
Ammunition=wp_umgt-1
Offset=0,0,0.035    // offset of submunition to have it perfectly aligned with the "host"
SpawnTime=3

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/wp_ss-n-16_booster
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/wp_ss-n-16_separation
InFlightEffectPosition=0,0,0
InFlightEffectStartTime=0
UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.022
HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
WaterEntrySplashClass=SmallWaterSplashes  // torpedo-sized splash when a surface-launched round dives into the sea (WaterEntryLaunch)

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.003
Rotation=0,0,0
Scale=0.005,0.005,0.045
