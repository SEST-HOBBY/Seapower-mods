[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW            // can be AAW, ASuW, ASW

Mass=9                     // in kg. Used for aircraft
AmmoPoints=9               // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=680         // meter per second
MaxRange=3800              // in meters
GravityFactor=14
CircularErrorProbable=8    // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
#Warhead Types:
#0 = HighExplosive     =  100% damage to structre
#1 = Armor Piercing		TBD
#2 = HEAT              =  200% damage to mobile land units
#3 = Illumination		TBD
#4 = Cluster           =  -50% damage to structre
#5 = Runway Cratering	TBD
#6 = Fragmentation     =  -50% damage to structre
[WarheadData]
WarheadType=2
Power=2.4
ImpactSize=Small           // Impact size, can be small, medium, large, verylarge
Penetration=Moderate       // can be minor, moderate, heavy, always

[---------- Guidance ----------]
[Guidance]
RequiresLOS=True

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_small
ResourcesMaterial=shell_mat_red

