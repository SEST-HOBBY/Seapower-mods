#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# 65-76 "Kit"
# Users: 
Type=Torpedo                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=4500                              // in kg. Used for aircraft
AmmoPoints=13500                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=120                   // base sound level in db at 1m distance
FlowNoise=0.75                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0               // additional noise for cavitation in db
TargetReflectionStrength=2      // in dB for broad side
# Transient
TransientRCS=-1                        // Transient visibility on the radar
TransientVisualIdentificationRange=-1  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=185                 // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=94
ImpactSize=VeryLarge                // Impact size, can be small, medium, large, verylarge
Penetration=Always                  // can be minor, moderate, heavy, always

FuzeProximityDistance=6             // for proximity fuze: distance to target in meter
[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=9
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=5           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
TerminalVelocity=45.0                  // Maximum speed in knots when missile is locked on target
#========================================= Launch stats ============================================================
Acceleration=10.0                      // Acceleration factor
MaxTurnRate=10                         // Maximum turnrate in degrees per second

MinLaunchRange=0.5                     // Minimum launch range in nautical miles

MinLaunchAltitude=100                  // Minimum launch altitude in feet.
MaxLaunchAltitude=1000                 // Maximum launch altitude in feet.

SpeedSettings=35,50                    // selectable speeds in knots, lowest to highest
SpeedSettingRanges=54,27            // full tank range in nautical miles at each of the speeds above
MaxDepth=1575                          // Maximum allowed depth in feet.

LaunchReliability=85                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerFOV=350.0                        // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerPassiveRange=0.25                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
TurnDelayStartRange=0.0215             // Range to a wakebubble target to begin wakehoming torpedo turn delay, in nmi
TurnDelay=8                            // time to delay turning on next wakebubble target to make the sine wave like torpedo movement within a wake, in seconds, 7 as default
WakeHomingSeekerSensitivity=0.0        // the minimum remaining wakebubble lifetime left in seconds that can be tracked by wakehoming sensor, 0 as default
WakeHomingTurnSettingReliability=97    // the chance for a wakehoming torpedo to make the correct initial turn, e.g. onto a target following a wake
#ECCM
#AntiCountermeasuresBonus=0.10          // This value substracted from probability of spoofing by countermeasures (0...1)
# Torpedo related
SearchMode=0                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
ReattackMode=1                         // 0 = None, 1 = Circle, 2 = Drive-around
DefaultDepth=5                         // default depth in feet a torpedo is using for submerged targets for bearing only launches
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################

AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/wp_65-76/
ResourcesRoot=wp_65-76
ResourcesMesh=wp_65-76
ResourcesMaterial=wp_65-76_mat
# optional below
ResourcesMeshForLaunch=wp_65-76_dummy
ResourcesMeshSwitchTime=0  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=2

SubModel1=Propeller_Left
SubModel2=Propeller_Right

[Propeller_Left]
Type=Propulsion
RotationDirection=Left
Mesh=wp_65-76_propl
Rotation=-90,0,0

[Propeller_Right]
Type=Propulsion
RotationDirection=Right
Mesh=wp_65-76_propr
Rotation=-90,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
BoosterEffectPosition=0,0,0

InFlightEffect=effects/weapons/emitters/aswtorpedo_cavitation_particle
InFlightEffectPosition=0,0,-0.057
InFlightEffectStartTime=0

HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes
ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo

############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
PropAudioClip=audio/weapons/torpedo
PropAudioRollOff=Logarithmic
PropAudioDistance=1,20
PropAudioPitch=1.0
PropAudioPosition=0,0,0
PropAudioAudibility=Below

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,-0.0051,0.0053
Rotation=0,0,0
Scale=0.01,0.01703,0.09293
