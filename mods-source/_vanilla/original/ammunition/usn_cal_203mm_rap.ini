[General]
#cass: previously a RAP round, now maintains its filename to prevent errors, this is just the improved HC projectile intended (but never built) for the Mk71 203mm gun
# per NavWeaps: New design: 2,950 fps (899 mps)
# per NAVAL GUNFIRE SUPPORT OF AMPHIBIOUS OPERATIONS: PAST, PRESENT, AND FUTURE, MCLWG with the improved projectile has >40,000yd range
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW            // can be AAW, ASuW, ASW
SecondaryTargetType=AAW

Mass=118                               // in kg. Used for aircraft
AmmoPoints=118                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=900         // meter per second
MaxRange=36500             // in meters
CircularErrorProbable=40   // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=9.6
ImpactSize=Medium          // Impact size, can be small, medium, large, verylarge
Penetration=Heavy          // can be minor, moderate, heavy, always
FuzeProximityDistance=10
KillProbability=0.02       // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_large
ResourcesMaterial=shell_mat_red

[---------- Effects ----------]
[Particles]
HitShipExplosion=effects/Particle Emitters/impact_large_shell
HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground
HitGroundExplosionClass=MediumGroundHitExplosions

