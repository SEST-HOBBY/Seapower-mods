[General]
# Rockeye
Type=Bomb                              // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=222                               // in kg. Used for aircraft
AmmoPoints=333                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
#IOCDate=19XX						   // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=1968						   // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available


DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

FrontalArea=0.0984
SideArea=0.6867
BottomArea=0.6867
[SensorData]
#Visual
VisualIdentificationRange=1       // Biggest range in nm at which this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=4
Power=20
ImpactSize=40           // Impact size, can be small, medium, large, verylarge
Penetration=Minor              // can be minor, moderate, heavy, always
BombletsEjectAltitude=300      // in feet. MUST be lower than MinLaunchAltitude

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================

#========================================= Launch stats ============================================================
MinLaunchRange=0.01                    // Minimum launch range in nautical miles
MaxLaunchRange=10.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=400                  // Minimum launch altitude in feet.
MaxLaunchAltitude=60000                // Maximum launch altitude in feet.
WarheadReliability=0.97             // Chance that warhead will detonate upon hit
#========================================     Seeker     ===========================================================
CircularErrorRadius=40                 // Circular error radius in meters
#Homing
#ECCM
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/usn_rockeye/
ResourcesRoot=usn_rockeye
ResourcesMesh=usn_rockeye
ResourcesMaterial=usn_rockeye_mat
ResourcesMeshForLaunch=usn_rockeye_dummy
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
DudExplosionClass=SmallFlakExplosions
#For Cluster bombs both BoosterEffect and InFlightEffect = canister open and bomblets ejection
#BoosterEffect - stays in place
#InFlightEffect - moves with invisible bomb
#Both can be used simultaneously
BoosterEffect=effects/weapons/emitters/rockeye_release
BoosterEffectPosition=0,0,0
#InFlightEffectClass=LargeMissileExplosions
#InFlightEffectPosition=0,0,0


#HitShipExplosionClass=LargeShipHitExplosion
#HitAirExplosionClass=SmallGroundHitExplosions
#HitDefaultExplosionClass=SmallGroundHitExplosions	//MediumMissileExplosions
#HitWaterSplashClass=SmallWaterSplashes

HitShipExplosionClass=ClusterGroundHitExplosions
HitAirExplosionClass=ClusterGroundHitExplosions
HitDefaultExplosionClass=ClusterGroundHitExplosions
HitGroundExplosionClass=ClusterGroundHitExplosions
HitWaterSplashClass=SmallWaterSplashes

#ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb
#ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637
