[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=AAW             // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=0.83                              // in kg. Used for aircraft
AmmoPoints=0.83                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=900         // meter per second
MaxRange=4000              // in m
CircularErrorProbable=19  // radius in meters at max range for shells to impact
RoundMaxDistance=5000      // in m; 0/unset = fly ballistically until it hits water/ground

[---------- Warhead Data ----------]
[WarheadData]
Power=0.6
ImpactSize=VerySmall            // Impact size, can be small, medium, large, verylarge
Penetration=Minor          // can be minor, moderate, heavy, always

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini
TrailEffect=None
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitDefaultExplosionClass=SmallFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
