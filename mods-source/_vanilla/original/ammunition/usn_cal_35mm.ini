[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=AAW             // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=1.58                              // in kg. Used for aircraft
AmmoPoints=1.58                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=1175         // meter per second
MaxRange=4200               // in m
GravityFactor=12
CircularErrorProbable=4.8    // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=0.7
ImpactSize=VerySmall           // Impact size, can be small, medium, large, verylarge
Penetration=Minor          // can be minor, moderate, heavy, always
FuzeProximityDistance=3    // In meters
KillProbability=0.001     // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_tiny
ResourcesMaterial=shell_mat_yellow

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitWaterSplashClass=TinyWaterSplashes
