#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Ikara
# Users: 
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW

Mass=513                              // in kg. Used for aircraft
AmmoPoints=1026                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=1            // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance
TransientBaseNoise=240                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
ImpactSize=Small                       // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                      // can be minor, moderate, heavy, always

# optional entry below, allows to switch to a second type of ammunition
# e.g. used for ASROC where a MK46 torpedo is spawned
[Submunition]
Ammunition=usn_mk46_air
Offset=0,0,0.0    // offset of submunition to have it perfectly aligned with the "host"
SpawnTime=3

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=4.0         // time in seconds where the missile moves straight on without guiding
DefaultHorizonHeight=1000              // in feet. Target height for calculating default horizon rings
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
#УРК-5 Раструб - anti submarine mode - 400m altitude
MaxLoftAngle=22.5                      // Climb angle for initial loft
MaxLoftAlt=1000.0                      // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#УРК-5 Раструб - anti ship mode - 15m altitude
SeaSkimmingAlt=1000.0                    // height in feet for sea skimming
SeaSkimmingSubAlt=1000                 // height in feet for sea skimming while using submunition
SeaSkimmingMaxDescentAngle=15.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#УРПК-3(4) Метель - anti-sub mode only - 600-700m
FinalFlightPhaseAlt=1000.0             // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=40.0
#FinalFlightPhaseDistToTarget=28.0       // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=17.0              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=564.8                      // Maximum speed in knots
Acceleration=6.0                       // Acceleration factor
MaxTurnRate=25.0                       // Maximum turnrate in degrees per second
MinLaunchRange=1.0                     // Minimum launch range in nautical miles
MaxLaunchRange=10.0                    // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
#ECCM
#SelfDestruct
SelfDestructDelay=1.0                  // delay in seconds for self destruction

############################################################
# Main Model with collider
############################################################
[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=ran_ikara
AssetBundleDamagedMesh=
AssetBundleMaterial=ran_ikara_mat
AssetBundleMeshHullCollider=ran_ikara_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/ran_ikara/
ResourcesRoot=ran_ikara
ResourcesMesh=ran_ikara
ResourcesMaterial=ran_ikara_mat
// optional below
#ResourcesMeshForLaunch=ran_ikara_dummy
#ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0
############################################################

# References to the launchers are just used for positioning relative to the launcher of the missile
[Launchers]
NumberOfLaunchers=1
Launcher1=Ikara

[Ikara]
LoadedPosition=0,0.006,0.005
UnloadedPosition=0,0.006,0.07
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[-Debris]
DebrisProbability=101              // in %, probability for debris to happen
ResourcesMeshForDebris=ran_ikaraa  // optional debris mesh after destruction
#DebrisPosition=0.05                // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.999
DebrisHeightLossAdd=0.0005   // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.022
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.015 
SustainerEffectStartTime=3.0

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
DebrisSplashClass=MediumWaterSplashes
DebrisTrail=effects/aircraft/emitters/helicopterfireeffect

ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,-0.0051,0.0053
Rotation=0,0,0
Scale=0.01,0.01703,0.09293