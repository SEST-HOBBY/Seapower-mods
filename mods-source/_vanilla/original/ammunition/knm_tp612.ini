[General]
Type=Torpedo                           // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=1770                              // in kg. Used for aircraft
AmmoPoints=5310                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini
[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
BaseNoise=117                   // base sound level in db at 1m distance
FlowNoise=0.75                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0               // additional noise for cavitation in db
TargetReflectionStrength=1      // in dB for broad side
# Transient
TransientRCS=-1                        // Transient visibility on the radar
TransientVisualIdentificationRange=-1  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=180                 // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=69
ImpactSize=Large                // Impact size, can be small, medium, large, verylarge
Penetration=Always              // can be minor, moderate, heavy, always

FuzeProximityDistance=10        // for proximity fuze: distance to target in meter
SmartFuse=True                  // Explodes not immediately but when when target start to go away

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
#10 = Combined Active&Passive Sonar Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=2                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=5           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
TerminalVelocity=45.0                  // Maximum speed in knots when torpedo is locked on target
#========================================= Launch stats ============================================================
Acceleration=12.0                      // Acceleration factor
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.4                     // Minimum launch range in nautical miles
MinLaunchAltitude=100                  // Minimum launch altitude in feet.
MaxLaunchAltitude=1000                 // Maximum launch altitude in feet.

SpeedSettings=45                    // selectable speeds in knots, lowest to highest
SpeedSettingRanges=10            // full tank range in nautical miles at each of the speeds above
WireControlsDepth=True                // the wire can pass depth orders and target depth data to the torpedo
WireBreakSpeed=10                      // launch platform speed in knots above which the wire breaks (default 20)
MaxSpeedOnWire=45                      // torpedo speed in knots above which it snaps its own wire (default unlimited)
WireMinSeafloorClearance=0           // wire breaks if the launching sub runs closer to the seafloor than this (feet, 0 = disabled)
WireCountermeasureBonus=0.4            // extra countermeasure rejection while on the wire; kept after a break if homing already started (default 0)

MaxDepth=350                          // Maximum allowed depth in feet.

LaunchReliability=95                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
#ECCM
# Torpedo related
DefaultDepth=20.0                      // default depth in feet a torpedo is using for submerged targets for bearing only launches
DestructionDepth=1600.0                // depth in feet where the torpedo is destructed
#SelfDestruct

[---------- Mesh definitions----------]
[Models]
############################################################
ResourcesFolder=weapons/knm_tp61/
ResourcesRoot=knm_tp61
ResourcesMesh=knm_tp61
ResourcesMaterialFolder=weapons/knm_tp61/
ResourcesMaterial=knm_tp61_mat
# optional below
ResourcesMeshForLaunch=knm_tp61_dummy
ResourcesMeshSwitchTime=0.5              // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=2

SubModel1=Propeller_l
SubModel2=Propeller_r

[Propeller_l]
Type=Propulsion
RotationDirection=Left
Mesh=knm_tp61_prop_l
Rotation=-90,0,0

[Propeller_r]
Type=Propulsion
RotationDirection=Right
Mesh=knm_tp61_prop_r
Rotation=-90,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
