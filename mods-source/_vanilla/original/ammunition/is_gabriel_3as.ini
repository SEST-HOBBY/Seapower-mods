[General]
# Gabriel 3A/S
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=600                               // in kg. Used for aircraft
AmmoPoints=1500                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
IRSignature=Small
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
# Radar related (RCS => radar cross section)
RCS=0.2
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=210                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=37
ImpactSize=SemiSmall                   // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                      // can be minor, moderate, heavy, always

FuzeProximityDistance=5.0              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=65.0                    // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=1.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=4.0              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalDiveDistance=0.1                // in N. miles.
TerminalAlt=7                          // in feet. Weapon will try to get to this altitude at the start of terminal approach
SupportsBanking=False                  // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=480.0                      // Maximum speed in knots
Acceleration=1.0                       // Acceleration factor
MaxTurnRate=10                         // Maximum turnrate in degrees per second
MinLaunchRange=3                    // Minimum launch range in nautical miles
MaxLaunchRange=35                      // Maximum launch range in nautical miles
LaunchReliability=95                   // The lower the value, the greater risk of misfire or accident (0...100)
MinLaunchAltitude=300                  // Minimum launch altitude in feet.
MaxLaunchAltitude=30000                // Maximum launch altitude in feet.
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=55                           // Seeker gain in dB
SeekerFOV=60.0,5                         // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerActiveRange=10                    // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=0                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=5.0                          // Active radar seeker output peak power in kW
#Misc Guidance Properties
RangeGate=2							   // 
#ECCM
AntiCountermeasuresBonus=0.2          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.1                      // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/is_gabriel_3/
ResourcesRoot=is_gabriel_3_new
ResourcesMesh=is_gabriel_3AS
ResourcesMaterial=is_gabriel_3as_new_mat
############################################################

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
#BoosterEffect=effects/weapons/emitters/sam_medium_effect
#BoosterEffectPosition=0,0,-0.028
InFlightEffect=effects/weapons/emitters/missile_sustainer_small_effect
InFlightEffectPosition=0,0,-0.015
InFlightEffectStartTime=1.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosionClass=MediumMissileExplosions

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.06606571
