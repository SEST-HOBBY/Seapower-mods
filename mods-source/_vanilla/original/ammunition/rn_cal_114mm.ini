[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW            // can be AAW, ASuW, ASW
SecondaryTargetType=AAW

Mass=21                                // in kg. Used for aircraft
AmmoPoints=21                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=869         // meter per second
MaxRange=22000             // in meters
CircularErrorProbable=30  // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=4.5
ImpactSize=SemiSmall       // Impact size, can be small, medium, large, verylarge
Penetration=Minor          // can be minor, moderate, heavy, always
FuzeProximityDistance=5
KillProbability=0.02      // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS
# 30% chance to kill missile assuming all rounds hit in 1 burst

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_medium
ResourcesMaterial=shell_mat_red

[---------- Effects ----------]
[Particles]
HitShipExplosion=effects/Particle Emitters/impact_medium_shell
HitAirExplosionClass=MediumFlakExplosions
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_small	//HitDefaultExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=MediumGroundHitExplosions
