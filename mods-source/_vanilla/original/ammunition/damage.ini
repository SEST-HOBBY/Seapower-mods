[General]
BaseRoll=20      // 1D20 dice
CIWSSizeMultiplier=1.20
CIWSMultiplier=0.7
#Size=CIWSSizeMultiplier for small missiles or 1 for big ones
#InterceptChance=CIWSRating - (CIWSMultiplier*Sqrt(MissileSpeedKnots)*Size) - DefenseBonus
InterceptOutOfAltitudePenalty=0.5 //If target is outside attack altitudes, missile will suffer this penalty on intercept calculations
InterceptSpeedPenaltyMultiplier=1.4 //Target speed penalty will be multiplied by this on intercept calculations
InterceptChanceOutOfAltitudeOverride=0.05 // Limits intercept chance to this value when intercepting targets outside of altitudes, if calculated chance is greater

InterceptSizeBonusWeapon=0.2
InterceptSizeBonusHelicopter=0.05
InterceptSizeBonusAircraftSmall=0
InterceptSizeBonusAircraftLarge=-0.1
InterceptSizeBonusAircraftLargeSARH=-0.2

[ImpactSize]
# Impact size diameter in meter
Tiny=0.5
TinyDamageMinRoll=1
TinyDamageMaxRoll=2
TinyDecalScale=0.75

# Impact size diameter in meter
VerySmall=5.0
VerySmallDamageMinRoll=1
VerySmallDamageMaxRoll=10
VerySmallDecalScale=0.9

Small=15.0
SmallDamageMinRoll=3
SmallDamageMaxRoll=15
SmallDecalScale=1

SemiSmall=30.0
SemiSmallDamageMinRoll=8
SemiSmallDamageMaxRoll=18
SemiSmallDecalScale=1.3

Medium=40.0
MediumDamageMinRoll=10
MediumDamageMaxRoll=20
MediumDecalScale=1.5

Large=75.0
LargeDamageMinRoll=15
LargeDamageMaxRoll=20
LargeDecalScale=2.5

VeryLarge=120.0
VeryLargeDamageMinRoll=20
VeryLargeDamageMaxRoll=20
VeryLargeDecalScale=3.0

[Dud]
Dud=2    // 1...2 is a dud but based on the unmodified D20 (so warhead doesn't matter yet)

# If Dud roll passed, check for damage severity
[Damage]
LightDamage=5    // 1...5
MediumDamage=10  // 6...10
SevereDamage=15  // 11...15
Destroyed=20     // 16...20

# Fire calculation is based on fuel: calculated by max launch Range - remaining range as %
[Fire]
NoFire=5
SelfExtinguishingFire=10
ModerateFire=15
SevereFire=20
FireDecalTime=60             // time in seconds until "fire decal" is placed for moderate/severe fire
FireDecalFadeTime=60         // time in seconds for fading the effect in
SevereFireDecalFadeFactor=2  // means in terms of severe fire the fading in will speed up by this factor
FireDecalClass=FireDamage

# If hit hull compartment or some lower parts perform flood roll to see if we get flooding
[Flooding]
NoFlooding=5
NoFloodingWeight=5                    //relative weight of chance to randomly select this flooding tier
MinorFlooding=10
MinorFloodingWeight=20                //relative weight of chance to randomly select this flooding tier
ModerateFlooding=15
ModerateFloodingWeight=10             //relative weight of chance to randomly select this flooding tier
SevereFlooding=20
SevereFloodingWeight=5                //relative weight of chance to randomly select this flooding tier
MinorFloodingPerSec=0.001             // flooding value per second
MinorFloodingMax=10                   // max absolute value in percent for minor flooding
ModerateFloodingPerSec=0.005          // flooding value per second
ModerateFloodingMax=30                // max absolute value in percent for moderate flooding
SevereFloodingPerSec=0.01             // flooding value per second
SevereFloodingMax=60                  // max absolute value in percent for severe flooding
MaxFloodingValue=1.0                  // max flooding value per compartment
MaxFloodingValueWhenSinking=1.05      // max flooding value when sinking (1.0 == 100%, 100% means it has the same density as water), needs to be larger than 1 to let the ship sink
FloodingMultiplicatorWhenSinking=1.1  // multiplicator to accelerate the flooding

[PenetrationVsArmorMatrix]
#Format: ArmorValue=minMinorPen,MaxMinorPen|minModeratePen,MaxModeratePen|minHeavyPen,MaxHeavyPenn|minAlwaysPen,MaxAlwaysPen
#Armor values:
None=1.0|1.0|1.0|1.0
Minor=0.5,0.75|0.85,1.0|0.9,1.0|0.95,1.0
Moderate=0.1,0.25|0.5,0.75|0.85,1.0|0.9,1.0
Heavy=0.0,0.01|0.1,0.25|0.5,0.75|0.85,1.0

#Current penetration meaning:

#Armor		by Minor	by Moderate	by Heavy	by Always

#None		100%		100%		100%		100%
#Minor		50%			85%			90%			95%
#Moderate	10%			50%			85%			90%
#Heavy		0%			10%			50%			85%