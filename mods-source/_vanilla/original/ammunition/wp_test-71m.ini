[General]
# TEST-71M (KTU-81)
# Users: 
Type=Torpedo                           // can be Projectile, Missile, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW

Mass=1750                              // in kg. Used for aircraft
AmmoPoints=5250                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
BaseNoise=115                          // base sound level in db at 1m distance
FlowNoise=0.5                          // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0                      // additional noise for cavitation in db
TargetReflectionStrength=1             // in dB for broad side
# Transient
TransientRCS=-1                        // Transient visibility on the radar
TransientVisualIdentificationRange=-1  // Transient can be visually detected at this distance
TransientBaseNoise=180                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=57
ImpactSize=Large                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

FuzeProximityDistance=10.0             // for proximity fuze: distance to target in yard
SmartFuse=True                         // True = get as close as possible before exploding, False = explode as soon as target in proximity radius

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
#10 = Combined Active&Passive Sonar Homing
[Guidance]
GuidanceType=10
MidCourseCorrection=2                  // 0 = None, 1 = Radio Command, 2 = Wire Guided 
InitialFlightPhaseDuration=5.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
TerminalVelocity=40.0                  // Maximum speed in knots when torpedo is locked on target
#========================================= Launch stats ============================================================
Acceleration=10.0                      // Acceleration factor
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.5                     // Minimum launch range in nautical miles

SpeedSettings=25,40                    // selectable speeds in knots, lowest to highest
SpeedSettingRanges=13.5,8.1            // full tank range in nautical miles at each of the speeds above
WireControlsDepth=True                // the wire can pass depth orders and target depth data to the torpedo
WireBreakSpeed=15                      // launch platform speed in knots above which the wire breaks (default 20)
MaxSpeedOnWire=40                      // torpedo speed in knots above which it snaps its own wire (default unlimited)
WireMinSeafloorClearance=100           // wire breaks if the launching sub runs closer to the seafloor than this (feet, 0 = disabled)
WireCountermeasureBonus=0.2            // extra countermeasure rejection while on the wire; kept after a break if homing already started (default 0)
MaxDepth=1500                          // Maximum allowed depth in feet.

LaunchReliability=85                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerFOV=60.0                         // Seeker field-of-view in degrees
SeekerActiveRange=1                  // Seeker active range in nautical miles
SeekerPassiveRange=1                 // Seeker passive range in nautical miles
SeekerGain=25.0                        // Seeker gain in dB
SeekerOutputPower=215.0                // Active seeker output power in dB, unused for passive ones
FractionOfRangeToActivateSeeker=0.8    // Fraction of seeker range left to target before activation of seeker for wire guided torpedoes

#ECCM
AntiCountermeasuresBonus=0.2          // This value substracted from probability of spoofing by countermeasures (0...1)
MinAfterSpoofEffectTime=5.0            // Min time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
MaxAfterSpoofEffectTime=20.0            // Max time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
# Torpedo related
SearchMode=1                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
SearchVelocity=35.0                    // velocity in search mode in knots
ReattackMode=1                         // 0 = None, 1 = Circle, 2 = Drive-around
DefaultDepth=200.0                     // default depth in feet a torpedo is using for submerged targets for bearing only launches
#SelfDestruct
SelfDestructDelay=6                    // For sonobouy it is a time in seconds while its sonar works <- not used here atm TODO: Decide merge or no

[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/wp_test-71/
ResourcesRoot=wp_test-71
ResourcesMesh=wp_test-71
ResourcesMaterial=wp_test-71_mat
# optional below
ResourcesMeshForLaunch=wp_test-71_dummy
ResourcesMeshSwitchTime=0  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfSubModels=2

SubModel1=Propeller_Left
SubModel2=Propeller_Right

[Propeller_Left]
Type=Propulsion
RotationDirection=Left
Mesh=wp_test-71_propl
Rotation=-90,0,0

[Propeller_Right]
Type=Propulsion
RotationDirection=Right
Mesh=wp_test-71_propr
Rotation=-90,0,0

############################################################
# Wake and smoke
############################################################

[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/aswtorpedo_cavitation_particle
InFlightEffectPosition=0,0,-0.057
InFlightEffectStartTime=0

HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes
ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo

