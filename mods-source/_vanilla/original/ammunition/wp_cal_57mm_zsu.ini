[General]
Type=Projectile                        // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=6.4                               // in kg. Used for aircraft
AmmoPoints=6.4                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts                  // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=1000                    // meter per second
MaxRange=4000                          // in meters
GravityFactor=12
CircularErrorProbable=40               // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=1.5
ImpactSize=VerySmall                        // Impact size, can be small, medium, large, verylarge
Penetration=Minor                      // can be minor, moderate, heavy, always
FuzeProximityDistance=10               // In meters
KillProbability=0.005                 // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_small
ResourcesMaterial=shell_mat_green

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini
#TrailEffect=effects/weapons/emitters/sam_small_effect_ext
HitShipExplosion=effects/Particle Emitters/impact_small_shell
HitAirExplosionClass=SmallFlakExplosions
HitDefaultExplosion=effects/Particle Emitters/impact_small_shell
HitWaterSplashClass=SmallWaterSplashes

