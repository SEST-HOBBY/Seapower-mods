#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# MK70 Mobile submarine simulator (MOSS) 
# Users: 
Type=MOSS                           // can be Projectile, Missile, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW

Mass=450                               // in kg. Used for aircraft
AmmoPoints=900                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard                    // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
RCS=Small

BaseNoise=180                          // base sound level in db at 1m distance
FlowNoise=1                            // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0                      // additional noise for cavitation in db
TargetReflectionStrength=50            // reflection on active sonar
# Transient
TransientRCS=-1                        // Transient visibility on the radar
TransientVisualIdentificationRange=-1  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=140                 // In db
NoiseFrequencies=MF,HF                     // comma-separated bands this noisemaker radiates in (LF, MF, HF)

[WarheadData]
WarheadType=-1

[ECM]
# Decoy related
SpoofChance=0.85                       // Base chance to spoof torpedo

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=2                  // 0 = None, 1 = Radio Command, 2 = Wire Guided 
InitialFlightPhaseDuration=2.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#========================================= Launch stats ============================================================
Acceleration=1.0                       // Acceleration factor
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second

SpeedSettings=24,36                    // selectable speeds in knots, lowest to highest
SpeedSettingRanges=20,9            // full tank range in nautical miles at each of the speeds above
WireControlsDepth=True                // the wire can pass depth orders and target depth data to the torpedo
WireBreakSpeed=15                      // launch platform speed in knots above which the wire breaks (default 20)
MaxSpeedOnWire=36                      // torpedo speed in knots above which it snaps its own wire (default unlimited)
WireMinSeafloorClearance=100           // wire breaks if the launching sub runs closer to the seafloor than this (feet, 0 = disabled)
WireCountermeasureBonus=0.4            // extra countermeasure rejection while on the wire; kept after a break if homing already started (default 0)

MinLaunchRange=0.1                     // Minimum launch range in nautical miles

MaxDepth=1300                          // Maximum allowed depth in feet.

LaunchReliability=85                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
# N/A
# Torpedo related
DefaultDepth=200.0                     // default depth in feet a torpedo is using for submerged targets for bearing only launches

[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/usn_moss/
ResourcesRoot=usn_moss
ResourcesMesh=usn_moss
ResourcesMaterial=usn_moss_mat

############################################################
NumberOfSubModels=1

SubModel1=Propeller_Left

[Propeller_Left]
Type=Propulsion
RotationDirection=Left
Mesh=usn_moss_prop
Rotation=-90,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/aswtorpedo_cavitation_particle
InFlightEffectPosition=0,0,-0.021
InFlightEffectStartTime=0
HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
PropAudioClip=audio/weapons/torpedo
PropAudioRollOff=Logarithmic
PropAudioDistance=1,20
PropAudioPitch=1.0
PropAudioPosition=0,0,0
PropAudioAudibility=Below

[---------- Colliders ----------]
[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.0015
Rotation=0,0,0
Scale=0.005,0.005,0.04
