#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Name is displayed in context menu and bottom bar
Name=76mm Gun
Type=Projectile                        // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
HideIn=Encyclopedia,MissionEditor,Signatures

DecalClass=FireDamage  // referenced in effects/decals.ini

############################################################
# Physics
############################################################
[Physics]
MuzzleVelocity=823         // meter per second
MaxRange=13350             // in meters
CircularErrorProbable=100  // radius in meters at max range for shells to impact

[WarheadData]
ImpactSize=VerySmall                       // Impact size, can be small, medium, large, verylarge
Penetration=Minor       // can be minor, moderate, heavy, always

############################################################
# Main Model with collider (optional)
############################################################

[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

############################################################
# Particles
############################################################
[Particles]
# Effects are referenced in /effects/effects.ini
TrailEffect=
HitShipExplosion=effects/Particle Emitters/
HitWaterSplashClass=SmallWaterSplashes
