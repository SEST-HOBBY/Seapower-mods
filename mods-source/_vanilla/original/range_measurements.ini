############################################################
# Range measurement standards: how a published range was flown.
# An aircraft names one with [Performance] RangeMeasurement=<section> (helicopters: [Physics]);
# without one it takes [Settings] DefaultByPrefix for its file-name prefix, else Default. ToDry flies the authored range to dry tanks with no allowances.
# The fuel burn is calibrated so the authored range comes out under these rules, and in game
# aircraft pay the pre-takeoff fuel at launch and plan to land with the reserve still aboard.
#
# PreTakeoffMinutes     engine running before brake release (start, warm-up, taxi)
# PreTakeoffPower       fraction of full dry power over those minutes (helicopters: of hover power); default 0.9
# ReservePercent        percent of the fuel kept for landing: in game of internal fuel only; calibrating a RatedRangeLoadout, of all initial fuel
# ReserveLoiterMinutes  optional: plus fuel for this long at max-endurance speed at sea level
# CountsDescent         true if the range includes the descent's ground; default true
# CruiseClimb           true if the cruise climbs as fuel burns (constant Mach, weight over pressure held); default false
############################################################

[Settings]
// the measurement of an aircraft that names none
Default=SAC
// an unnamed unit whose file name starts with one of these takes that standard instead: prefix:section, comma-separated
DefaultByPrefix=wp_:SovietPractical,pla_:SovietPractical,plan_:SovietPractical

[ToDry]
// flown to dry tanks: no pre-takeoff burn, no reserve, the descent counted
PreTakeoffMinutes=0
ReservePercent=0
CountsDescent=true

[SAC]
// US Standard Aircraft Characteristics (MIL-C-5011A): 5 min normal rated power, 5% + 20 min sea-level loiter, cruise-climb (altitude bands), range ends at altitude
PreTakeoffMinutes=5
PreTakeoffPower=0.9
ReservePercent=5
ReserveLoiterMinutes=20
CountsDescent=false
CruiseClimb=true

[SAC_VSTOL]
// AV-8A SAC: 3 min maximum continuous, 5% + 10 min sea-level loiter
PreTakeoffMinutes=3
PreTakeoffPower=0.9
ReservePercent=5
ReserveLoiterMinutes=10
CountsDescent=false
CruiseClimb=true

[SAC_Bomber]
// B-52 SACs: 5 min normal power, 5% + 30 min sea-level loiter, cruise-climb, range ends at altitude
PreTakeoffMinutes=5
PreTakeoffPower=0.9
ReservePercent=5
ReserveLoiterMinutes=30
CountsDescent=false
CruiseClimb=true

[SovietPractical]
// Soviet practical range: start, run-up and taxi (estimate: idle taxi plus a full-power run-up) and a navigation reserve of 5% of fuel (L-29/L-39 data)
PreTakeoffMinutes=5
PreTakeoffPower=0.5
ReservePercent=5
CountsDescent=true
