Taskforce1=Blue
Taskforce2=Red
Neutral=Neutral
Side0Trigger1Message=Title=ISAKOV STRIKE GROUP\n<size=24>27 June 1985 / 0530Z</size>\nBody=Comrade Commander, hostilities have begun. Locate the American supply convoy north of the Faroe Islands and destroy it with your missiles or guns. PRESIDENT VAN BUREN carries military stores for Norway. Our satellites show three American warships in company with her.\n\nThe area remains heavy with merchant traffic as ships at sea make for port. Neutral shipping is not to be attacked under any circumstances.\nButtonText=Start mission\nPopupStyle=Intro
Side0Trigger2Message=From=GHQ, RED BANNER NORTHERN FLEET\nTo=COMMANDER, ISAKOV STRIKE GROUP\nSubj=RELIEF OF COMMAND\nPrecedence=Immediate\nClassification=TopSecret\nTemplate=USSR\nBody=1. You have sunk another civilian vessel in action, contrary to your standing orders.\n\n2. Command of Isakov Strike Group is now transferred to the executive officer of BPK Admiral Isakov.\n\n3. To the executive officer of BPK Admiral Isakov: Break off the attack at once and proceed north at best speed to Northern Fleet bases. The former commander is to be detained immediately and transferred to court-martial upon arrival.\nButtonText=Acknowledge\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger3Message=Title=MISSION FAILED\nBody=Defeat! Admiral Isakov has been sunk, taking you with her!\nButtonText=Continue\nPopupStyle=Outro
Side0Trigger4Message=From=GHQ, RED BANNER NORTHERN FLEET\nTo=COMMANDER, ISAKOV STRIKE GROUP\nSubj=NEUTRAL SHIPPING\nPrecedence=Immediate\nClassification=TopSecret\nTemplate=USSR\nBody=1. Reports indicate that a neutral merchant has been sunk in your area of operations.\n\n2. Headquarters reminds you that neutral shipping is not to be attacked under any circumstances. Confirm the identity of every target before opening fire.\n\n3. Your assigned task remains the destruction of the American military convoy. You are personally responsible for ensuring that all ships of the group obey these orders.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Side0Trigger5Message=From=GHQ, RED BANNER NORTHERN FLEET\nTo=COMMANDER, ISAKOV STRIKE GROUP\nSubj=FINAL WARNING\nPrecedence=Immediate\nClassification=TopSecret\nTemplate=USSR\nBody=1. A second neutral merchant has been sunk. Your standing orders expressly prohibit attacks on neutral shipping.\n\n2. Headquarters will tolerate no further disregard of these orders. Any further loss of neutral shipping will result in your immediate relief of command and trial by court-martial.\n\n3. Ensure that every commanding officer in the group understands this warning. Withhold fire on all unidentified contacts.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Side0Trigger6Message=Title=MISSION ACCOMPLISHED\nBody=Victory! The American cargo ship has been sunk, and their cargo will not reach Norway. We can withdraw east. Excellent work, Comrade Commander.\nButtonText=Continue playing\nPopupStyle=Outro
Objective_Transport1985=Sink President Van Buren
Objective_Flagship1985=Admiral Isakov must survive
StartForecast=RED BANNER NORTHERN FLEET\nHYDROMETEOROLOGICAL SERVICE\nWEATHER AND SEA FORECAST\n\nAREA: NORTHERN APPROACHES TO THE FAROE ISLANDS.\nVALID: 0530-1200 GMT, 27 JUNE 1985.\n\nWIND: NORTHERLY.\nSEA: STATE 4.\nCLOUD: OVERCAST.\nPRECIPITATION: NONE EXPECTED.\nVISIBILITY: POOR IN FOG.\nOUTLOOK: LITTLE CHANGE EXPECTED DURING THE OPERATION.
