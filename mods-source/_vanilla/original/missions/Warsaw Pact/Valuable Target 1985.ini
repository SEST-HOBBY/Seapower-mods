
[Language_en]
Name=Valuable Target (1985)
Description=At the outbreak of hostilities, a Northern Fleet surface group is ordered to intercept an American military supply convoy bound for Norway. Identify the transport amid civilian traffic and conduct a strike against it.
VT_OwnGroupLabel_en=Isakov Strike Group
VT_SearchLabel_en=Convoy search area
VT_ConvoyRouteLabel_en=Convoy eastbound to Norway
VT_NorthernTrafficLabel_en=Westbound merchant traffic
VT_AirSearchLabel_en=Likely patrol aircraft search area
