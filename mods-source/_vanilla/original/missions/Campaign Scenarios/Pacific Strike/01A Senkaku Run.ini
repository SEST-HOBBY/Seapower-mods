
[Language_en]
Name=01A Senkaku Run (NATO)
Description=At the outbreak of hostilities, the newest USN surface combatant has been ordered to return to Okinawa under emergency wartime routing. Enemy intelligence has compromised the transit window. Command this vessel to reach Okinawa, and do not become the opening prize of the Pacific war.
MissionBriefingAssetsDirectory=missions/_briefing
MissionBriefingLeftPane=missions/_briefing\BriefingText_en.xml
MissionBriefingRightPane=missions/_briefing\BriefingMap_en.xml
Taskforce1=Blue
Taskforce2=Red
Neutral=Neutral
Taskforce2LandUnit1NameOverride=Fuzhou Airbase
Taskforce2LandUnit1ShortNameOverride=ZSFZ
Trigger3Condition_Condition1AreaLabel=Reach this area to escape
Side0Trigger1Message=Title=<size=24>Pacific Strike - Ship Challenge</size>\nSENKAKU RUN\n<size=24>June 26th, 1985</size>\nBody=Hostilities are underway in the Pacific, and U.S. and Allied forces are under coordinated attack across the theater. Command USS Hawaii to escape the East China Sea.\n\nSoviet aircraft just shot down the E-3A providing radar picture. A single S-3A from VS-29 is off the deck from Kadena inbound to assist, but no other Allied air support is available at this time. \n\nGood luck, Commander.\nButtonText=Start mission\nPopupStyle=Intro
Side0Trigger2Message=Title=MISSION FAILED\nBody=Defeat! The USS Hawaii has been sunk!\nButtonText=Continue playing\nPopupStyle=Outro
Side0Trigger3Message=From=CINCPACFLT\nTo=CO USS HAWAII CGN-44\nInfo=COMUSJAPAN YOKOTA AB\nCOMSEVENTHFLT PEARL HARBOR HI\nCTF 77 YOKOSUKA JA\nSubj=POSITION REPORT - MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) CINCPAC acknowledges your position report having exited East China Sea. We assess enemy threat greatly reduced now that you are clear of Ryukyus chain.\n\n2. (S) Proceed east at best speed to rendezvous with KITTY HAWK and Battle Group FOXTROT for further tasking.\n\n3. (S) When available, submit OPREP detailing performance of new weapons and ship class.\n\n4. (S) CINCPAC passes personal congratulations to ships of HAWAII SAG. Excellent work, Commander.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger5Message=From=NAVFAC OKINAWA\nTo=CO USS HAWAII CGN-43\nInfo=CTF 77 YOKOSUKA JA\nCOMUSJAPAN YOKOTA AB\nSubj=CONTACT REPORT - DATUM A01\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) WARNING: SOSUS reports multiple intermittent contacts north of Miyako-jima.\n\n2. (S) Contacts evaluated as KILO and VICTOR class submarines.\n\n3. (S) DATUM A01 is established at time 1100Z.\n\n4. (S) Prosecute this contact if tactical situation permits and report location of sinking. Good luck HAWAII.\nButtonText=Acknowledge & continue\nPopupStyle=NavalMessage
Objective_ReachMarkedArea=Escape the East China Sea
Objective_HawaiiMustSurvive=USS Hawaii must survive
[Language_cn]
Name=01A逃离钓鱼岛（北约）
Description=战事爆发时，美国海军最新的水面作战舰艇收到命令从紧急战时路线返回冲绳。敌方获得的情报压缩了航行的窗口期。指挥这艘船只返回冲绳，不要成为太平洋战争的第一个牺牲品。
MissionBriefingAssetsDirectory=missions/_briefing
MissionBriefingLeftPane=missions/_briefing\BriefingText_cn.xml
MissionBriefingRightPane=missions/_briefing\BriefingMap_cn.xml
Taskforce2LandUnit1NameOverride=福州航空基地
Taskforce2LandUnit1ShortNameOverride=福州航空基地
Trigger3Condition_Condition1AreaLabel=到达此区域以撤离
Side0Trigger1Message=Title=<size=24>出击太平洋：船只挑战</size>\n逃离钓鱼岛\n<size=24>1985年6月26日</size>\nBody=太平洋战事已经爆发，美国和盟友的部队在整个战区内遭到了协同攻击。指挥夏威夷号撤离东海。\n\n苏联飞机刚刚击落了提供雷达图像的E-3A。VS-29的一架S-3A已从嘉手纳机场起飞，准备提供支援，但目前盟军没有其他空中支援。 \n\n祝你好运，指挥官。\nButtonText=开始任务\nPopupStyle=Intro
Side0Trigger2Message=Title=任务失败！\nBody=任务失败！夏威夷号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Side0Trigger3Message=From=太平洋舰队总司令\nTo=夏威夷号巡洋舰舰长\nInfo=日本横田空军基地美国驻日本部队司令\n夏威夷州珍珠港第七舰队司令\n日本横须贺市第77特遣舰队指挥官\nSubj=位置报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）太平洋司令部总司令已收到你离开东海的位置报告。我们评估敌方威胁已在你离开琉球岛链后明显降低。\n\n2.（机密）以最佳速度向东航行，与小鹰号和F战斗群会合，以备后续部署。\n\n3.（机密）在情况允许时提交新武器和船型性能的详情报告。\n\n4.（机密）太平洋司令部总司令向夏威夷号水面行动群的船只传达私人祝贺。干得漂亮，指挥官。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger5Message=From=海军设施工程系统司令部驻冲绳单位\nTo=夏威夷号巡洋舰舰长\nInfo=日本横须贺市第77特遣舰队指挥官\n日本横田空军基地美国驻日本部队司令\nSubj=接触报告——基准点A01\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）提示：声波监听系统在宫古岛以北报告了多个间歇性接触。\n\n2.（机密）接触被评估为877型和671型潜艇。\n\n3.（机密）基准点已于1100Z时建立。\n\n4.（机密）如果战术态势允许，攻击上述接触并报告击沉位置。祝你好运，夏威夷号。\nButtonText=收到并继续\nPopupStyle=NavalMessage
Objective_ReachMarkedArea=撤离东海
Objective_HawaiiMustSurvive=夏威夷号不能被击沉
