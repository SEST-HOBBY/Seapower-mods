
[Language_en]
Name=01A Senkaku Run (NATO)
Description=At the outbreak of hostilities, the newest USN surface combatant has been ordered to return to Okinawa under emergency wartime routing. Enemy intelligence has compromised the transit window. Command this vessel to reach Okinawa, and do not become the opening prize of the Pacific war.
Taskforce2LandUnit1NameOverride=Fuzhou Airbase
Taskforce2LandUnit1ShortNameOverride=ZSFZ
Trigger3Condition_Condition1AreaLabel=Reach this area to escape
Taskforce1StartMessage=Title=<size=24>Pacific Strike - Ship Challenge</size>\nSENKAKU RUN\n<size=24>June 26th, 1985</size>\nBody=Hostilities are underway in the Pacific, and U.S. and Allied forces are under coordinated attack across the theater. Command USS Hawaii to escape the East China Sea.\n\nSoviet aircraft just shot down the E-3A providing radar picture. A single S-3A from VS-29 is off the deck from Kadena inbound to assist, but no other Allied air support is available at this time. \n\nGood luck, Commander.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1HawaiimustsurviveMessage=Title=MISSION FAILED\nBody=Defeat! The USS Hawaii has been sunk!\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1ReachmarkedareaplayervictoryMessage=From=CINCPACFLT\nTo=CO USS HAWAII CGN-44\nInfo=COMUSJAPAN YOKOTA AB\nCOMSEVENTHFLT PEARL HARBOR HI\nCTF 77 YOKOSUKA JA\nSubj=POSITION REPORT - MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) CINCPAC acknowledges your position report having exited East China Sea. We assess enemy threat greatly reduced now that you are clear of Ryukyus chain.\n\n2. (S) Proceed east at best speed to rendezvous with KITTY HAWK and Battle Group FOXTROT for further tasking.\n\n3. (S) When available, submit OPREP detailing performance of new weapons and ship class.\n\n4. (S) CINCPAC passes personal congratulations to ships of HAWAII SAG. Excellent work, Commander.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce130mindatumMessage=From=NAVFAC OKINAWA\nTo=CO USS HAWAII CGN-43\nInfo=CTF 77 YOKOSUKA JA\nCOMUSJAPAN YOKOTA AB\nSubj=CONTACT REPORT - DATUM A01\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) WARNING: SOSUS reports multiple intermittent contacts north of Miyako-jima.\n\n2. (S) Contacts evaluated as KILO and VICTOR class submarines.\n\n3. (S) DATUM A01 is established at time 1100Z.\n\n4. (S) Prosecute this contact if tactical situation permits and report location of sinking. Good luck HAWAII.\nButtonText=Acknowledge & continue\nPopupStyle=NavalMessage
Objective_ReachMarkedArea=Escape the East China Sea
Objective_HawaiiMustSurvive=USS Hawaii must survive
