Side0Trigger1Message=Title=<size=24>South Atlantic 1982</size>\nCARRIERS AT WAR\n<size=24>2 May 1982</size>\nBody=Argentine forces are closing on the Task Force. ARA 25 de Mayo and her escorts are approaching from the northwest, while land-based strike aircraft approach from the south. Locate and sink the Argentine carrier!\n\nUse the air wing aboard HMS Invincible to strike 25 de Mayo while the escorts screen against air and submarine attack. Keep Sea Harriers ready to intercept raids from either direction.\n\nBreak up the enemy attack and bring Invincible through the action. Good luck, Commander!\nButtonText=Start mission\nPopupStyle=Intro
Side0Trigger2Message=Title=MISSION FAILED\nBody=Defeat! HMS Invincible has been sunk!\nButtonText=Close\nPopupStyle=Outro
Side0Trigger3Message=Title=ENEMY CARRIER SUNK\nBody=ARA 25 de Mayo has been sunk! We have 30 minutes to recover aircraft and prevent an Argentine counterattack.\nButtonText=Close\nPopupStyle=Notification
Trigger3TimerLabel=Survive
Side0Trigger4Message=From=CINCFLEET NORTHWOOD\nTo=CTG 317.8\nInfo=\nSubj=CARRIER ACTION. MISSION ACCOMPLISHED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Britain\nBody=1. ARA 25 DE MAYO HAS BEEN SUNK AND INVINCIBLE HAS COME THROUGH THE ACTION.\n\n2. YOU HAVE WON A GREAT VICTORY FOR THE TASK FORCE!\n\n3. MY CONGRATULATIONS TO THE SHIPS' COMPANIES AND AIRCREWS. EXCELLENT WORK, COMMANDER.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_sink=Sink ARA 25 de Mayo
Objective_survive=Keep HMS Invincible afloat until 30 minutes after the enemy carrier sinks
