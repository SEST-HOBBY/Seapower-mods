Side0Trigger1Message=Title=<size=24>포클랜드 전쟁 1982</size>\nHUNT FOR BELGRANO\n<size=24>1982년 5월 2일</size>\nBody=영국 잠수함이 순양함 헤네랄 벨그라노를 중심으로 한 아르헨티나 함대를 추적했습니다. 노스우드에서 명령이 내려왔습니다. 순양함을 격침하십시오.\n\n적 편대에 접근하여 순양함을 격침하십시오. 호위함 격침은 선택 사항입니다. 벨그라노를 격침한 뒤에는 철수하여 접촉을 피하십시오.\nButtonText=임무 시작\nPopupStyle=Intro
