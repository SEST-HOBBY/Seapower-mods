Side0Trigger1Message=Title=<size=24>Falklands War 1982</size>\nHUNT FOR BELGRANO\n<size=24>2 May 1982</size>\nBody=A British submarine has tracked the Argentine force centered on the cruiser General Belgrano. Orders have come down from Northwood: sink it.\n\nClose with the enemy formation and sink the cruiser. Sinking the escorts is optional. Once the Belgrano has been sunk, withdraw and evade contact.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST\nAREA: SOUTHWEST APPROACHES\nVALID: 022000Z MAY 82 TO 030200Z MAY 82\nWIND: N FORCE 6. SEA: ROUGH.\nCLOUD: OVERCAST. WEATHER: MAINLY DRY. VISIBILITY: GOOD OUTSIDE LOW CLOUD.\nPRESSURE: 1015 MB, FALLING.\nOUTLOOK: WIND NW FORCE 7
Side0Trigger2Message=Title=MISSION FAILED\nBody=Defeat! Our submarine has been sunk!\nButtonText=Close\nPopupStyle=Outro
Side0Trigger3Message=Title=MISSION FAILED\nBody=Defeat! The Argentine force has escaped!\nButtonText=Close\nPopupStyle=Outro
Side0Trigger4Message=Title=PRIMARY TARGET SUNK\nBody=General Belgrano has been sunk! Withdraw to the marked area, or destroy both remaining escorts.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger7Message=Title=MISSION ACCOMPLISHED\nBody=Victory! General Belgrano has been sunk and our submarine has withdrawn. Excellent work, Commander.\nButtonText=Close\nPopupStyle=Outro
Side0Trigger8Message=Title=MISSION ACCOMPLISHED\nBody=Victory! General Belgrano and both escorts have been sunk. Excellent work, Commander.\nButtonText=Close\nPopupStyle=Outro
Side0Trigger9Message=Title=MISSION FAILED\nBody=Defeat! The Belgrano has reached the shallow Burdwood Bank and pursuit is impossible.\nButtonText=Close\nPopupStyle=Outro
