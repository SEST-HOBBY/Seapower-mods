Side0Trigger1Message=Title=<size=24>フォークランド紛争 1982</size>\nHUNT FOR BELGRANO\n<size=24>1982年5月2日</size>\nBody=イギリスの潜水艦が、巡洋艦ヘネラル・ベルグラノを中心とするアルゼンチン艦隊を追跡している。ノースウッドから命令が下った。同艦を撃沈せよ。\n\n敵編隊に接近し、巡洋艦を撃沈せよ。護衛艦の撃沈は任意。ベルグラノを撃沈したら、撤退して接触を回避せよ。\nButtonText=任務開始\nPopupStyle=Intro
