Side0Trigger1Message=Title=<size=24>Guerra de las Malvinas 1982</size>\nHUNT FOR BELGRANO\n<size=24>2 de mayo de 1982</size>\nBody=Un submarino británico ha seguido a la fuerza argentina centrada en el crucero General Belgrano. Han llegado órdenes de Northwood: húndalo.\n\nAcérquese a la formación enemiga y hunda el crucero. Hundir a los escoltas es opcional. Una vez hundido el Belgrano, retírese y evite el contacto.\nButtonText=Iniciar misión\nPopupStyle=Intro
