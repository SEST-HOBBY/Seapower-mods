Side0Trigger1Message=Title=<size=24>Chiến tranh Falkland 1982</size>\nHUNT FOR BELGRANO\n<size=24>Ngày 2 tháng 5 năm 1982</size>\nBody=Một tàu ngầm Anh đã bám theo lực lượng Argentina do tuần dương hạm General Belgrano làm nòng cốt. Northwood đã ra lệnh: đánh chìm nó.\n\nÁp sát đội hình địch và đánh chìm tuần dương hạm. Đánh chìm các tàu hộ tống là tùy chọn. Sau khi đánh chìm Belgrano, hãy rút lui và tránh tiếp xúc.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
