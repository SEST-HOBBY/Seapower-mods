Side0Trigger1Message=Title=<size=24>South Atlantic 1982</size>\nCARRIERS AT WAR\n<size=24>2 May 1982</size>\nBody=The British Task Force has moved east to raid the Malvinas. Our forces have assembled for a coordinated strike against the British carrier group. Locate and sink HMS Invincible!\n\nUse the airwing aboard ARA Veinticinco De Mayo in concert with the land-based strike aircraft of Ala and Zonda flights approaching from the south to conduct a pincer attack on the British. \n\nA C-130 tanker is over the Malvinas to provide tanking support. Good luck, Commander!\nButtonText=Start mission\nPopupStyle=Intro
Side0Trigger2Message=Title=MISSION FAILED\nBody=Defeat! ARA 25 de Mayo has been sunk!\nButtonText=Close\nPopupStyle=Outro
Side0Trigger3Message=Title=ENEMY CARRIER SUNK\nBody=HMS Invincible has been sunk! We have 30 minutes to recover aircraft and prevent a counterattack by the British.\nButtonText=Close\nPopupStyle=Notification
Trigger3TimerLabel=Survive
Side0Trigger4Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=COMANDANTE GRUPO DE TAREAS 79.1\nInfo=\nSubj=CARRIER ACTION. MISSION ACCOMPLISHED.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. HMS INVINCIBLE HAS BEEN SUNK AND THE BRITISH TASK FORCE IS TURNING AWAY.\n\n2. WE HAVE SCORED A GREAT VICTORY AGAINST THE GRINGOS!\n\n3. MY CONGRATULATIONS TO THE SHIPS' COMPANIES AND AIRCREWS. EXCELLENT WORK.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_sink=Sink HMS Invincible
Objective_survive=ARA 25 De Mayo must survive
