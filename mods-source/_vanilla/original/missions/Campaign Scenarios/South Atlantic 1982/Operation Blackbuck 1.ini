Side0Trigger1Message=Title=<size=24>Operation Corporate</size>\nOPERATION BLACK BUCK 1\n<size=24>30 April 1982</size>\nBody=Execute BLACK BUCK. Strike Stanley airfield to impede Argentine air operations. Place the bombs across the runway, then recover the Vulcan at Ascension.\n\nTime on target 0700Z on 1 May. Launch delays are acceptable provided time on target is no later than 0900Z.\n\nOne Vulcan and twelve RAF tankers are available at Wideawake. Arrange refuelling support for the outward and return flights. Launch timings, rendezvous and fuel allocations are your responsibility. Every effort is to be made to recover the entire tanker force safely at Ascension!\nButtonText=Start mission\nPopupStyle=Intro
Side0Trigger3Message=Title=MISSION ACCOMPLISHED\nBody=Victory! Black Buck 1 was a success! Excellent flying, Commander.\nButtonText=Close\nPopupStyle=Outro
Objective_Runway=Land a stick of bombs across Stanley's runway and damage the runway
