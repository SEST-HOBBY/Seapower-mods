
[Language_en]
Name=Operation Black Buck 1 - Britain (1982)
Description=Execute Operation Black Buck 1 from Ascension to disrupt Argentine air operations at Stanley in the Falkland Islands. Strike the runway and recover the Vulcan, with twelve RAF tankers at your disposal. Plan the entire refuelling operation yourself. This mission is an organization and planning challenge: can you complete the roughly 6,600nm round trip without losing any aircraft or diverting to Brazil?
