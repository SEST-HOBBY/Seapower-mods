Side0Trigger1Message=Title=<size=24>Guerra de Malvinas 1982</size>\nBREAKING CONTACT\n<size=24>2 May 1982</size>\nBody=A British nuclear submarine is believed to be tracking the force centred on General Belgrano south of the islands. Her position is unknown and an attack may be imminent.\n\nBring the cruiser west into the marked safe area off Isla de los Estados. Use Bouchard and Piedrabuena to screen the withdrawal and direct supporting patrol aircraft to search the approaches.\n\nAttack confirmed submarine contacts, but do not delay the cruiser to pursue them. Bringing General Belgrano and her crew clear of the threat is your main task.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=ARMADA ARGENTINA\nPRONÓSTICO METEOROLÓGICO\nISLA DE LOS ESTADOS APPROACHES\nVALID 021700 TO 022300 MAY 82. ZULU TIME.\nWIND: 270 DEGREES, 7 TO 10 KNOTS. SEA: SLIGHT.\nVISIBILITY: GOOD OUTSIDE LOW CLOUD.\nCLOUD: OVERCAST.\nSIGNIFICANT WEATHER: NO PRECIPITATION EXPECTED.\nOUTLOOK: NO SIGNIFICANT CHANGE.
Side0Trigger2Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=GENERAL BELGRANO. WITHDRAWAL COMPLETE.\nPrecedence=Immediate\nClassification=Secret\nTemplate=Argentina\nBody=1. GENERAL BELGRANO HAS REACHED THE SHALLOW WATER OFF ISLA DE LOS ESTADOS. THE IMMEDIATE WITHDRAWAL TASK IS COMPLETE.\n\n2. MAINTAIN THE ANTI-SUBMARINE SCREEN AND REPORT THE CONDITION OF THE GROUP.\n\n3. MY CONGRATULATIONS TO YOU AND YOUR SHIPS' COMPANIES FOR BRINGING THE CRUISER CLEAR.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger3Message=From=COMANDANTE DE OPERACIONES NAVALES\nTo=TASK GROUP COMMANDER\nInfo=\nSubj=GENERAL BELGRANO. LOSS OF CRUISER.\nPrecedence=Flash\nClassification=Secret\nTemplate=Argentina\nBody=1. THE ESCORTS REPORT GENERAL BELGRANO TORPEDOED AND SUNK.\n\n2. RESCUE SURVIVORS AS THE TACTICAL SITUATION PERMITS. THE SUBMARINE THREAT REMAINS.\n\n3. REPORT CASUALTIES, SURVIVORS RECOVERED AND THE POSITION OF THE ESCORTS. FURTHER INSTRUCTIONS WILL FOLLOW.\nButtonText=Close\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_safe=Bring General Belgrano to the safe area off Isla de los Estados
Objective_sub=Sink the British submarine
