MissionBriefingGenerateMapFromSymbols=True
Taskforce1=Blue
Taskforce2=Red
Neutral=Neutral
Taskforce3=MV British Renown
Side0Trigger2Message=From=Cmdr TG 321.1\nTo=Capt HMS Cardiff\nInfo=Capt HMS Alacrity\nSubj=Request for Assistance\nPrecedence=Flash\nClassification=Confidential\nTemplate=Britain\nBody=MV British Renown, a British merchant vessel outbound from Kuwait, reports that Iranian vessels have ordered her to stop for inspection. She has requested assistance and an escort. TU 321.1.3 is to rendezvous with British Renown and provide assistance. Rules of engagement remain unchanged.\nButtonText=Affirmative\nPopupStyle=NavalMessage
Side0Trigger3Message=Title=MV British Renown\nBody=Iranian gunboats are firing on us. Request immediate assistance.\nButtonText=Close\nPopupStyle=Notification
Side0Trigger4Message=From=Cmdr TG 321.1\nTo=Capt HMS Cardiff\nInfo=Capt HMS Alacrity\nSubj=Update\nPrecedence=Immediate\nClassification=Confidential\nTemplate=Britain\nBody=The Iranian attack appears to be over. Escort MV British Renown back to Kuwait City.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger5Message=From=Cmdr TG 321.1\nTo=Capt HMS Cardiff\nInfo=Capt HMS Alacrity\nSubj=ROE Update\nPrecedence=Immediate\nClassification=Confidential\nTemplate=Britain\nBody=Effective immediately, you are authorised to engage Iranian forces attacking MV British Renown or TU 321.1.3. Do not engage Iranian units that have not committed hostile acts against either.\nButtonText=Acknowledged\nPopupStyle=NavalMessage
Side0Trigger6Message=From=Cmdr TG 321.1\nTo=Capt HMS Cardiff\nInfo=Capt HMS Alacrity\nSubj=RAID WARNING\nPrecedence=Flash\nClassification=Confidential\nTemplate=Britain\nBody=An Iranian strike has been reported inbound over the northern Persian Gulf. Assume that your task unit or MV British Renown is the intended target.\nButtonText=Acknowledged\nPopupStyle=NavalMessage
Objective_PlayerUnitSurvial=HMS Cardiff and HMS Alacrity must survive.
