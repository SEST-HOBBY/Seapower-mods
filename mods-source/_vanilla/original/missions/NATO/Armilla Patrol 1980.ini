
[Language_en]
Name=Armilla Patrol - Britain (1980)
Description=Command HMS Cardiff and HMS Alacrity on patrol from Kuwait City to Bahrain during the first month of the Armilla Patrol.
MapSymbol_New1Label_en=TU 321.1.3
MapSymbol_New5Label_en=Patrol route to Bahrain
MissionBriefingAssetsDirectory=missions/_briefing
