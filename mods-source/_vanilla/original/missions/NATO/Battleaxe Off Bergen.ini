Side0Trigger1Message=From=CINCEASTLANT\nTo=CO HMS BATTLEAXE\nInfo=CINCFLEET NORTHWOOD\nCINCLANTFLT\nSubj=Contact report\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) NAVFAC Norway and British trawler force report five independent undersea implosions in vicinity Bergen approaches.\n\n2. (S) We assess enemy submarine threat has been eliminated.\n\n3. (S) BRAVO ZULU to all units. Clear west and await further tasking.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Side0Trigger2Message=Title=MISSION FAILED\nBody=Defeat! HMS Battleaxe has been sunk!\nButtonText=Close\nPopupStyle=Outro
Side0Trigger3Message=Title=BATTLEAXE OFF BERGEN\nBody=Command believes Soviet submarines are moving south along the Norwegian coast to interdict our convoy bound for Bergen. Take charge of the Northern ASW Picket Group to hunt down any enemy submarines encountered.\n\nNAVFAC Norway reported 5 intermittent contacts. Sink all five submarines to clear the approaches to Bergen. One P-3C of VP-45 is inbound from England to assist search, callsign Pelican 1, reporting on top by 0220L.\n\nNote: the convoy and its escorts are operating independently of your command.\nButtonText=Start mission\nPopupStyle=Intro
Side0Trigger4Message=Title=MISSION FAILED\nBody=Defeat! Two convoy ships have been sunk, failing our mission to reinforce Norway!\nButtonText=Close\nPopupStyle=Outro
