# ==================== Royal Navy ====================
# ADAWS (Action Data Automation Weapon System) and CAAIS (Computer Assisted Action Information System)
# are the two RN families. ADAWS ships carried Link 11 and read as tier 5; CAAIS ships worked the RN's
# own ship-to-ship Link 10, which is a group exchange rather than a fleet standard net, so tier 4.
# Anything older is an Action Information Organisation on a Link 14 teleprinter broadcast - it reads the
# picture, it cannot put anything back into it.

# County-class Batch 1 (Devonshire, Hampshire, Kent, London). ADA Mk 1: the first-generation RN action
# data system, and rudimentary next to what followed - the Batch 1 ships leaned on a data link to the
# carrier for the primary radar picture and Seaslug targeting rather than working it themselves.
[ADA_Mk1]
ReactionTime=Slow
DatalinkTier=3
DatalinkSource=False
SignalProcessingBonus=0
CICSlots=8
EvaluationSlots=1

# County-class Batch 2 (Fife, Glamorgan, Antrim, Norfolk) as built. ADAWS-1 on Ferranti Poseidon
# computers, first installed in HMS Fife in 1965 and reworked after trials in HMS Norfolk in 1970.
[ADAWS_1]
ReactionTime=Medium
DatalinkTier=4
DatalinkSource=True
SignalProcessingBonus=0
CICSlots=12
EvaluationSlots=2

# The same ships after their mid-70s Exocet refit, by which point ADAWS ships were on Link 11.
[ADAWS_1_Refit]
ReactionTime=Medium
DatalinkTier=5
DatalinkSource=True
SignalProcessingBonus=0
CICSlots=16
EvaluationSlots=2

# Type 42 (Sheffield class). ADAWS-4 on Ferranti FM1600B - automatic detection and tracking with the
# operator still hooking tracks, driving Sea Dart through the Type 909 directors.
[ADAWS_4]
ReactionTime=Fast
DatalinkTier=5
DatalinkSource=True
SignalProcessingBonus=0
CICSlots=48
EvaluationSlots=3

# Invincible class. ADAWS-6 on FM1600s, in a flagship operations room running the group's air picture -
# the widest watch team the RN put to sea in this period.
[ADAWS_6]
ReactionTime=Fast
DatalinkTier=5
DatalinkSource=True
SignalProcessingBonus=0
CICSlots=140
EvaluationSlots=4

# CAAIS on the Ferranti FM1600B - the frigate-scale system, fitted to the Type 21s and to the Leanders
# during their Ikara and Exocet conversions through the 1970s.
[CAAIS]
ReactionTime=Medium
DatalinkTier=4
DatalinkSource=True
SignalProcessingBonus=0
