# ==================== People's Liberation Army Navy ====================
# The PLAN had no tactical data link at all until the HN-900 (a Link-11 analogue) was developed through
# the 1980s, and the Ludas were the first ships to carry it. Frigates got a one-way set, so they read the
# picture without publishing into it. Everything earlier fought off a plotting table and a voice circuit.

# Type 673-II / H/ZKJ-1, the first Chinese integrated combat direction system, completing sea trials in
# Type 051 hull 132 in December 1983 and retrofitted across the Luda class. Holds seventeen tracks.
[ZKJ-1]
ReactionTime=Medium
DatalinkTier=4
DatalinkSource=True
SignalProcessingBonus=0
CICSlots=17
EvaluationSlots=2

# H/ZKJ-II, derived from the British CTC-1629 and fitted to the Type 053K Jiangdong. Twenty tracks, tied
# into the HQ-61 fire control - a trials ship's system, with nothing to link to.
[ZKJ-2]
ReactionTime=Medium
DatalinkTier=1
DatalinkSource=False
SignalProcessingBonus=0
CICSlots=20
EvaluationSlots=1

# Pre-ZKJ frigate plot: the Jianghu I and II and the Chengdus fought off a plotting table and a voice
# circuit, but off a proper CIC rather than a bridge wing - a rung above a wartime gun destroyer.
[AIO_PLAN_Plot]
ReactionTime=Slow
DatalinkTier=1
DatalinkSource=False
SignalProcessingBonus=0
CICSlots=6
EvaluationSlots=1

