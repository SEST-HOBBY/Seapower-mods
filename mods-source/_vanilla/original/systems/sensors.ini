# IR Signature values
############################################################

[IRSignature]
VeryTiny=0.001
Tiny=0.01
VerySmall=0.1
Small=1.0
SemiSmall=10.0
Meager=50.0
Medium=100.0
SemiLarge=1000.0
Large=10000.0
VeryLarge=100000.0

