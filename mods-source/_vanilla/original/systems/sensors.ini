[ ========================================= General ========================================== ]
[General]
DataLinkUpdateRate=1             // every x seconds there will be an update for the overall sensor image for the minimap
NewContactProcessTime=10         // in seconds. Base time to process a new contact. Modified by crew skill

[TargetAquisitionTime]
VerySlow=30		//slow 50s-60s firing process, mostly using voice communication and vacuum tube technology; e.g. Terrier (RIM-2) or Sea Slug or Volna
Slow=25			//late 60s streamlined weapon systems and early adoption of integrated combat systems e.g. Tartar (RIM-24) or 4K65 Shtorm
Medium=15		//average 70s combat system with decent reaction time; e.g. Tartar-D (RIM-66) or Osa-M 
Fast=10			//highly digitized integrated combat system with some manual elements; e.g. SYS-1 CG/SM-2 (SM-2ER Belknap/Leahy) or S-300F
VeryFast=5		//virtually completely automated combat system with operator veto; e.g. AEGIS or 3K95 Kinzhal or GWS.25 Sea Wolf

[Sonar]
# AboveLayerShadowingAngle: This angle determines the "ray" from the sensor to the layer. The smaller this angle is
#                           the flatter that ray is and the later it reaches the layer. A small value means that
#                           the shadow zone starts further away
# BelowLayerShadowingAngle: This angle determines how the "ray" continues when crossing the layer. Everything above
#                           that ray but below the layer will be considered in the shadow zone
AboveLayerShadowingAngle=3.0 //2.5 or 3.0 provides the best variants so far
BelowLayerShadowingAngle=5.0 //5.0 is the best variant so far
DebugSonarLineColor=64,224,208,255
DebugSonarLineShadowZoneColor=208,224,64,160
DebugSonarLineThickness=2.0

[TMA]
#deprecated and possibly will be removed soon as new TMA fully introduced
LostContactTimeToReset=60          // time in seconds after the TMA gets invalid when contact is lost and needs to start over
# Thresholds for the signal quality which can be poor, average and good
# These values are used for passive sonar contacts
# The value is calculated by: ratio = (SignalValue - SNRDetectionThreshold) / SNRDetectionThreshold
# E.g., a SNRDetectionThreshold of 5 and a signal value in db of 12 would give:
# ratio = (12 - 5) / 5 = 1.4 -> meaning the signal quality for TMA would be average
SignalQualityPoor=1.0       // 0...1 is poor
SignalQualityAverage=3.0    // 1...3 is average, everything above is good
# The initial deviation will be multiplied each update (DataLinkUpdateRate) with the current deviation
# Lower numbers will lead to more accurate values much faster
DeviationPoorDecreaseFactor=0.98
DeviationAverageDecreaseFactor=0.9
DeviationGoodDecreaseFactor=0.8
FanMaxDistanceInMiles=100

############################################################
# RCS values
############################################################

[RCS]
VeryTiny=0.001      //suitable for modern stealth aircrafts and weapons
Tiny=0.01           //suitable for early stealth aircraft usage e.g. F-117
VerySmall=0.1       //small missiles such as Harpoon, sa-n-4 etc.
Small=1.0           //larger missiles such as ss-n-3 shaddock, common helicopters
SemiSmall=10.0      //typical fighter sized aircraft, big helicopters, small cutters
Meager=50.0			//small surface combatants
Medium=100.0        //bomber size aircraft, frigates
SemiLarge=1000.0    //Destroyers/ Small cruisers
Large=10000.0       //Big cruisers, BPKs
VeryLarge=100000.0  //Biggest ships: Carriers, Battlecruisers, Battleships
FrontalToBroadsideFactor=0.5
JamToSignalBurnThroughRatio=3.0 //the ratio between ECM jammer signal and radar signal used to calculate the burnthrough range. Lesser values make ECM jammers more powerful
MinDetectableReturnPowerRadar=0.00000000000002 //minimal detectable radar echo power, in kW
MinDetectableReturnPowerESM=0.0000000004 //minimal detectable ESM/anti-radiation seeker echo power, in kW

##### Possible frequency bands (ITU => ECM):
# VHF-Band  => A-Band    100...300MHz
# UHF-Band  => B/C-Band: 300...1000MHz
# L-Band    => D-Band:     1...2GHz
# S-Band    => E/F-Band:   2...4GHz
# C-Band    => G-Band:     4...8GHz
# X-Band    => H/I-Band:   8...10GHz
# Ku-Band   => J-Band:    10...20GHz
# K-Band    => K-Band:    20...30GHz
# Ka-Band   => K-Band:    30...40GHz
#####

#Range Resolution = Rres = c/(2*PRF) where C = 3x10E8 and PRF = Pulse repetition frequency

