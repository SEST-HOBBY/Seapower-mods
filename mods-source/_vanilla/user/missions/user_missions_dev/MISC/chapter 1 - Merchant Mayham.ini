Taskforce1startMessage=After a series of sabotaged deep-sea cables, wind turbines and other critical infrastructure, the Norwegian coast guard has deployed all available vessels to show increased presence near its oil infrastructure in the hopes to deter any would be saboteurs. The Norwegian forces are spread thin however, and the coast guard is reliant on older and outdated units. \r\n\r\nDuring all that tension, a Mayday call has been received just north of a Norwegian Oil installation. The call mentioned a torpedo attack, ostensibly by a submarine. But the caller failed to provide any additional information regarding sustained damage, not even identifying themselves. A helicopter from the Belgian coast guard happened to be close by and is on route to investigate. \r\n\r\nObjective: Investigate all potential threats and protect critical infrastructure\r\n
Taskforce1startIntel=After a series of sabotaged deep-sea cables, wind turbines and other critical infrastructure, the Norwegian coast guard has deployed all available vessels to show increased presence near its oil infrastructure in the hopes to deter any would be saboteurs. The Norwegian forces are spread thin however, and the coast guard is reliant on older and outdated units. \r\n\r\nDuring all that tension, a Mayday call has been received just north of a Norwegian Oil installation. The call mentioned a torpedo attack, ostensibly by a submarine. But the caller failed to provide any additional information regarding sustained damage, not even identifying themselves. A helicopter from the Belgian coast guard happened to be close by and is on route to investigate. \r\n\r\nObjective: Investigate all potential threats and protect critical infrastructure\r\n\r\n
Taskforce1identifyMessage=Armed merchants sailing under false flags! They apparently tried to use the bad weather to covertly sabotage our infrastructure.
