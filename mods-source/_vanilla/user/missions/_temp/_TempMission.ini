Taskforce1ObjectivemetMessage=<color=lime>Mission complete.</color>|Fujian is burning. The Banda front just became a one-carrier war.|Close
Taskforce2ObjectivemetMessage=<color=red>Red defeat.</color>|Fujian is burning. The Banda front just became a one-carrier war.|Close
Taskforce1PlayerforcegoneMessage=<color=red>Mission failed.</color>|FORD is gone. There is no second carrier this side of Guam.|Close
