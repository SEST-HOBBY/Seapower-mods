NeutralLandUnit1ShortNameOverride=三亚航空基地
Taskforce1StartMessage=<size=20>中越战争</size>\n中建岛海战\n1979|中越双方已经交战，我方位于西沙群岛的的孤立前哨遭到了越南和苏联的攻击。一支增援护航队已从榆林海军基地出发，护送运输船前往西沙群岛，消灭遭遇的所有敌军。\n\n情报显示越南的小股部队正从海防向东移动，此外，一支以谢尼亚文海军上将号轻巡洋舰为核心的小型苏联舰队于昨夜离开了金兰湾。\n\n护航队至少有一艘登陆舰只不被击沉。|开始任务
StartForecast=当地时间1030时：雨停，风力3级
Taskforce1AtleastoneLSTmustsurviveMessage=任务失败！|发件：南海舰队司令\n收件：海军总部\n\n1.南海攻击支队报告前往西沙群岛的我方增援舰队已被越军和苏军摧毁。\n\n2.我们已下令此区域内的所有部队撤回海南岛重整。对抗越南的后续行动计划正在制定中。\n\n3.现场指挥官南海攻击支队支队长将乘坐第一班可用的军机返回，进行汇报并接受调查。|退出任务
Taskforce1Time+30minweatherchangeMessage=海军消息|发件：南海舰队司令\n收件：南海攻击支队支队长\n\n1.当地时间1030时的气象观测显示云层正在散开。三亚航空基地的飞机现在可以出击。\n\n2.空军航空兵第8师和海军航空兵第5师已准备好执行任务。\n\n3.由于战斗损失和大量的导弹消耗，我方能出击的架次不多。祝你好运。|收到并继续
Taskforce1DestroySverdlovSAGandconvoyreachareaMessage=任务完成！|发件：南海攻击支队支队长\n收件：南海舰队司令\n\n1.喜讯！南海攻击支队报告增援护航队已抵达我方位于甘泉岛的前哨。\n\n2.此外，越军队攻势已被击退。他们的突袭队虽有谢尼亚文海军上将号轻巡洋舰的支援，但还是被我军消灭。\n\n3.我方虽有损失，但重创了敌军，取得了一场大胜。|退出任务
Taskforce1Noplayershipsremaining-defeatMessage=任务失败！|发件：南海舰队司令\n收件：海军总部\n\n1.我们与前往西沙群岛执行任务的所有船只失去了联系。我们评估我方所有船只已在与敌军交战时沉没。\n\n2.我们已下令此区域内的所有部队撤回海南岛重整。对抗越南的后续行动计划正在制定中。\n\n3.现场指挥官南海攻击支队支队长在行动中失踪，据评估已经阵亡。|退出任务
