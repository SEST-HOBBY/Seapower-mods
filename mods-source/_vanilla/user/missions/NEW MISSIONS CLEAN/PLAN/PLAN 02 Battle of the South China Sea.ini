[Language_cn]
Name=中建岛海战（1979）
Description=中越双方已经交战，越南军队再次尝试驱逐西沙群岛的解放军。在苏联的支持下，他们正在对我方位于甘泉岛的孤立前哨发动进攻。指挥海南的南海舰队，为我们在西沙群岛的部队提供补给和增援，消灭越南的反击部队。
