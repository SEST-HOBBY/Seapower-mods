Taskforce1Vessel9ShortNameOverride=322
NeutralLandUnit1NameOverride=Base aérienne de Sanya
NeutralLandUnit1ShortNameOverride=Base aérienne de Sanya
Taskforce1StartMessage=<size=20>Guerre sino-vietnamienne de 1979</size>\nBATAILLE DE LA MER\nDE CHINE MERIDIONALE|Alors que les hostilités font rage sur terre entre la Chine et le Vietnam, notre avant-poste isolé des Paracels a été attaqué par les Vietnamiens et les Soviétiques. Un convoi de renforts a été envoyé depuis la base navale de Yulin. Escortez-le jusqu'aux Paracels et détruisez toutes les forces ennemies rencontrées.\n\nDes forces légères vietnamiennes se déplaceraient vers l'est depuis Haïphong, et une petite force soviétique a quitté Cam Ranh la nuit dernière, centrée sur le croiseur de classe Sverdlov Amiral Senyavin.\n\nAu moins un navire de débarquement du convoi doit survivre.|Démarrer la mission
StartForecast=1030 Local: La pluie a cessé, Vent Force 3
Taskforce1AtleastoneLSTmustsurviveMessage=DEFAITE|DE CMDT Flotte des mers du sud\nA CMDT Théâtre d'opérations sud\n\n1. La Force d'attaque des mers du Sud signale que notre groupe de renforts se dirigeant vers les îles Xisha a été détruit par les forces vietnamiennes et soviétiques.\n\n 2. Nous avons ordonné à toutes les forces présentes dans la zone de se replier sur Hainan pour se regrouper. De nouvelles actions contre les Vietnamiens sont prévues.\n\n 3. Le commandant de la Force d'attaque des mers du Sud, en charge des opérations, arrivera par le premier vol militaire pour se présenter aux autorités et être entendu.|Quitter la mission
Taskforce1Time+30minweatherchangeMessage=MESSAGE NAVAL|DE CMDT Flotte des mers du sud\nA CMDT Forces d'attaque des mers du sud\n\n1. Les observations météorologiques à 10h30, heure locale, indiquent un fort changement de temps. Les opérations aériennes sont désormais possibles depuis la base aérienne de Sanya.\n\n2. Les avions de la 8e Division aérienne et de la 5e Division aérienne de la PLANAF sont désormais disponibles pour des missions.\n\n3. En raison des pertes au combat et de l'utilisation intensive de missiles, seules quelques sorties seront possibles. Bonne chance.|Bien reçu
Taskforce1DestroySverdlovSAGandconvoyreachareaMessage=VICTOIRE|DE CMDT Forces d'attaque des mers du sud\nA CMDT Théâtre d'opérations sud\n\n1. C'est avec grand plaisir que la Force d'attaque des mers du Sud annonce que le convoi de renforts a atteint notre garnison de l'île Robert.\n\n2. De plus, l'attaque vietnamienne a été repoussée. Leurs forces commandos, appuyées par le croiseur léger soviétique Amiral Senyavine, ont été détruites.\n\n3. Nous avons subi des pertes, mais remporté une grande victoire sur l'ennemi.|Quitter la mission
Taskforce1Noplayershipsremaining-defeatMessage=DEFAITE|DE CMDT Flotte des mers du sud\nA CMDT Forces d'attaque des mers du sud\n\n1. Nous avons perdu tout contact avec tous les navires affectés à l'opération des îles Xisha. Nous estimons que tous nos navires ont été perdus au combat contre l'ennemi.\n\n2. Nous avons ordonné à toutes les forces présentes dans la zone de se replier sur Hainan pour se regrouper. De nouvelles actions contre les Vietnamiens sont prévues.\n\n3. Le commandant de la Force d'attaque des mers du Sud, sur place, est porté disparu et présumé mort.|Quitter la mission
