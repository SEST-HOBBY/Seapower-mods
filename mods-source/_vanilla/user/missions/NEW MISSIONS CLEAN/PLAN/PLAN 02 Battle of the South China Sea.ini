Taskforce1StartMessage=<size=20>Sino-Vietnamesischer Krieg 1979</size>\nSCHLACHT IM\nS�DCHINESISCHEN MEER|Da die Feindseligkeiten an Land zwischen China und Vietnam andauern, wird unser isolierter Vorposten auf den Paracel-Inseln von vietnamesischen und sowjetischen Kr�ften angegriffen. Zur Vers�rkung wurde ein Konvoi von der Marinebasis Yulin ausgesandt. Eskortieren Sie den Konvoi zu den Paracel-Inseln und vernichten Sie alle angetroffenen feindlichen Kr�fte.\n\nBerichten zufolge verlegen leichte vietnamesische Kr�fte ostw�rts aus Haiphong, zudem ist in der vergangenen Nacht ist eine kleiner sowjetischer Verband von Cam Ranh ausgelaufen, angef�hrt von einem Kreuzer der Sverdlov-Klasse �Admiral Senyavin�.\n\nMindestens ein Landungsschiff des Konvois muss �berleben.|Mission Starten
StartForecast=1030 Ortszeit: Regen h�rt auf, Windst�rke 3
Taskforce1AtleastoneLSTmustsurviveMessage=NIEDERLAGE|VON KDT S�dmeerflotte\nAN KDT, Southern Theater Command\n\n1. Der S�dmeerkampfverband meldet, dass unsere Verst�rkunk auf dem Weg zu den Xisha-Inseln von vietnamesischen und sowjetischen Streitkr�ften vernichtet wurde.\n\n2. Wir haben allen Kr�fte im Einsatzgebiet befohlen, sich nach Hainan zur�ckzuziehen, um sich neu zu formieren. Weitere Operationen gegen die Vietnamesen sind geplant.\n\n3. Der Kommandant des S�dmeerkampfverbandes, der den Einsatz vor Ort gef�hrt hat, wird mit dem fr�hestm�glichen Milit�rflug eintreffen, um sich zur Vernehmung zu melden.|Mission Beenden
Taskforce1Time+30minweatherchangeMessage=NACHRICHT DER MARINE|VON KDT S�dmeerflotte\nAN KDT S�dmeerkampfverband\n\n1. Wetterbericht, 1030 Ortszeit: Das schwere Wetter hat nachgelassen. Der Flugbetrieb vom Luftwaffenst�tzpunkt Sanya kann ab sofort aufgenommen werden.\n\n2. Flugzeuge der 8th Air Division und der 5th Air Division der PLAN-Luftstreitkr�fte stehen nun zur Auftragserteilung bereit.\n\n3. Aufgrund von Verlusten im Gefecht und intensivem Raketeneinsatz sind nur noch wenige Eins�tze m�glich. Viel Erfolg.|Best�tigen & Fortfahren
Taskforce1DestroySverdlovSAGandconvoyreachareaMessage=SIEG|VON KDT S�dmeerkampfverband\nAN KDT Southern Theater Command\n\n1. Mit gro�er Freude meldet der S�dmeerkampfverband, dass der Konvoi erfolgreich unsere Garnison auf Robert Island erreicht hat.\n\n2. Dar�ber hinaus wurde der Angriff der Vietnamesen zur�ckgeschlagen. Ihr Kampfverband, angef�hrt vom sowjetischen Kreuzer ADMIRAL SENYAVIN, ist vernichtet.\n\n3. Wir haben Verluste erlitten, aber einen gro�en Sieg �ber den Feind errungen.|Mission Beenden
Taskforce1Noplayershipsremaining-defeatMessage=NIEDERLAGE|VON KDT S�dmeerflotte\nAN KDT, Southern Theater Command\n\n1. Wir haben jeglichen Kontakt zu allen Schiffen verloren, die an der Operation um die Xisha-Inseln beteiligt waren. Wir gehen davon aus, dass s�mtliche Einheiten im Gefecht gegen den Feind zerst�rt worden sind.\n\n2. Wir haben allen Kr�fte im Einsatzgebiet befohlen, sich nach Hainan zur�ckzuziehen, um sich neu zu formieren. Weitere Operationen gegen die Vietnamesen sind geplant.\n\n3. Der Kommandant des S�dmeerkampfverbandes, der den Einsatz vor Ort gef�hrt hat, gilt als im Einsatz vermisst und wird als gefallen betrachtet.|Mission Beenden
