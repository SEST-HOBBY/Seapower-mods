[Language_en]
Name=SEST Banda - Rafale, Timor Gap
Description=TIMOR GAP, late afternoon, weather closing. Two Russian frigates have been shadowing the southern lane for a week and have now turned toward the Darwin approaches. The 22350 is a small ship with a serious air-defence suite and no reason to be here.

Four Rafale M of the French battle group, LRASM on the heavy stations and three tanks for the reach. The F5 fit trades the Exocet's short legs for a missile that can be launched from outside anything they carry - the point of the sortie is to prove that, not to close the range. Sea state four, and the weather is on your side for once.
Objective_Frigates=Sink both frigates
Objective_Flight=Bring the flight home
Taskforce1StartMessage=<color=yellow>Rafale, Timor Gap</color>|TIMOR GAP, late afternoon, weather closing. Two Russian frigates have been shadowing the southern lane for a week and have now turned toward the Darwin approaches. The 22350 is a small ship with a serious air-defence suite and no reason to be here.

Four Rafale M of the French battle group, LRASM on the heavy stations and three tanks for the reach. The F5 fit trades the Exocet's short legs for a missile that can be launched from outside anything they carry - the point of the sortie is to prove that, not to close the range. Sea state four, and the weather is on your side for once.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Both frigates down, launched from outside their envelope. The F5 fit works.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|The flight is scattered and the frigates are still closing Darwin.
