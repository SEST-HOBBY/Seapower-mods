[Language_en]
Name=SEST ANL Convoy - Coral Sea
Description=Escort an ANL convoy across the Coral Sea. HMAS Hobart, two Anzacs and HMAS Supply shepherd six merchantmen toward Port Moresby while a PLAN diesel patrol line waits somewhere along the track.
Taskforce1startMessage=Convoy CX-1 - six ANL and RAN-chartered merchantmen - has cleared the reef passage north of Townsville, bound for Port Moresby.\r\n\r\nIntelligence assesses a PLAN diesel submarine patrol line astride the convoy track: at least two Type 039 variants and a Kilo, operating quiet and shallow.\r\n\r\nYour escort: HMAS Hobart (AAW), HMAS Anzac and HMAS Stuart (ASW screen), HMAS Supply in company.\r\n\r\nObjective: bring the convoy through. Every merchant hull matters.
Taskforce1startIntel=PLAN diesel patrol line assessed ahead of the convoy track, two to three boats, quiet and shallow. Screen ahead, vary the convoy's base course, and keep the helicopters cycling.

