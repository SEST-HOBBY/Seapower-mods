Taskforce1maraudersMessage=That should be all of the marauders. The Spanish coastguard is very grateful for your help with the matter. \r\n\r\n
Taskforce1maraudersIntel=That should be all of the marauders. The Spanish coastguard is very grateful for your help with the matter. \r\n\r\n
Taskforce1startMessage=Intel from the freed scientists suggest the Kremlin wants to take revenge for the sinking of Kuznetsov. The French aircraft carrier “Charles De Gaulle” and its escort are headed to Toulon for rest and repair. It is highly likely the Russians will make a move during this last section of the journey though. Enemy reliance on asymmetric warfare suggests they will use for-hire spies on the Baleares or satellite data to track the allied carrier group. This would render us unable to conceal our position reliably. \r\n\r\nObjective: Reach Toulon safely OR find and kill all enemy units posing a threat \r\n\r\n\r\nThe Spanish coastguard reports frequent harassment from drones. They are not able to eradicate the drone threat on their own and have asked for support. \r\n\r\nOptional: Find and destroy all marauders.\r\n
Taskforce1startIntel=Intel from the freed scientists suggest the Kremlin wants to take revenge for the sinking of Kuznetsov. The French aircraft carrier “Charles De Gaulle” and its escort are headed to Toulon for rest and repair. It is highly likely the Russians will make a move during this last section of the journey though. Enemy reliance on asymmetric warfare suggests they will use for-hire spies on the Baleares or satellite data to track the allied carrier group. This would render us unable to conceal our position reliably. \r\n\r\nObjective: Reach Toulon safely OR find and kill all enemy units posing a threat \r\n\r\n\r\nThe Spanish coastguard reports frequent harassment from drones. They are not able to eradicate the drone threat on their own and have asked for support. \r\n\r\nOptional: Find and destroy all marauders.\r\n
