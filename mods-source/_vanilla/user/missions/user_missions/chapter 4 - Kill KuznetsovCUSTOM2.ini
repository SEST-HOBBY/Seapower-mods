[Language_en]
Name=chapter 4 - Kill Kuznetsov
Description=Strike a port with a French submarine.
Taskforce1noenterMessage=You trigger a mine and die
Taskforce1sideMessage=The secondary target is sucessfully destroyed.
Taskforce1sideIntel=The secondary target is sucessfully destroyed.
Taskforce1startMessage=The Russians are secretly refurbishing and rearming their officially defunct aircraft carrier Kuznetsov. This vessel poses a serious threat to allied units and must be taken care of. The French submarine De Grasse is near Murmansk ready to strike it before it leaves port. However, due to abundant minefields and sensors in the Kola bay, the sub cannot enter the bay itself and has guide its torpedoes at periscope depth by wire to hit the target. Terminal sonar guidance will acquire automatically once a torpedo is close enough. NOTICE: this means the torpedo must not get too close to civilian units or it will wrongfully acquire those. (If the torpedo is close to the end of its green pre-planned course it will automatically acquire the closest target. Make sure it’s the right one.)\r\n\r\nThe Norwegians are providing reconnaissance to determine the exact position of the main target, as well as scout for any additional targets. Due to previous Russian attacks on the Kirkenes airfield their capabilities are severely limited though. \r\n\r\nObjective: sink the carrier while it is still in port. \r\n\r\nOptional: Sink any additional high level threat units you may detect inside the port.\r\n
Taskforce1startIntel=The Russians are secretly refurbishing and rearming their officially defunct aircraft carrier Kuznetsov. This vessel poses a serious threat to allied units and must be taken care of. The French submarine De Grasse is near Murmansk ready to strike it before it leaves port. However, due to abundant minefields and sensors in the Kola bay, the sub cannot enter the bay itself and has guide its torpedoes at periscope depth by wire to hit the target. Terminal sonar guidance will acquire automatically once a torpedo is close enough. NOTICE: this means the torpedo must not get too close to civilian units or it will wrongfully acquire those. (If the torpedo is close to the end of its green pre-planned course it will automatically acquire the closest target. Make sure it’s the right one.)\r\n\r\nThe Norwegians are providing reconnaissance to determine the exact position of the main target, as well as scout for any additional targets. Due to previous Russian attacks on the Kirkenes airfield their capabilities are severely limited though. \r\n\r\nObjective: sink the carrier while it is still in port. \r\n\r\nOptional: Sink any additional high level threat units you may detect inside the port.\r\n
Trigger3Condition_noenterAreaLabel=DANGER \n\nDO NOT ENTER
