#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# GBU-39 SDB 122kg GPS guibed bomb.  by dts
Type=Missile                               // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=122                                // in kg. Used for aircraft
AmmoPoints=250    

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=1  // at what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=12
ImpactSize=Medium                // Impact size, can be small, medium, large, verylarge
Penetration=Moderate       		// can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3.0         // time in seconds where the missile moves straight on without guiding
DropDuration=4 
#======================================== Flight Profile ===========================================================
ApplyKinematics=True 
#SeaSkimming=True 
#SeaSkimmingStartDistToTarget=1000
#SeaSkimmingMaxDescentAngle=1.0        // Dive angle whlie going to sea skimming
#SeaSkimmingAlt=1000
TypicalTargetAlt=0
TerminalApproachDist=15.0 
TerminalDiveDistance=15                 // in N. miles.
MaxVelocity=680                       // Maximum speed in knots
#VelocityBleed=0.8
DragCoefficient=0.6
Acceleration=0 
MaxTurnRate=30                       // Maximum turnrate in degrees per second
MinLaunchRange=2.0                     // Minimum launch range in nautical miles
MaxLaunchRange=40.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=5000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=60000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=0  //20.0               // Circular error radius in meters
#Homing
SeekerGain=10                     // Seeker gain in dB
SeekerFOV=0.1                   // Seeker field-of-view in degrees
SeekerActiveRange=0.0
SeekerPassiveRange=100.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True
#ECCM
#Search params for torpedoes
#SelfDestruct
SelfDestructAfterTargetGone=False
SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_gbu-12
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_gbu-12_mat
AssetBundleMeshHullCollider=usn_gbu-12_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/gbu-39/
ResourcesRoot=dts_gbu_39.obj
ResourcesMesh=launch
ResourcesMaterial=dts_gbu-39_mat.ini
ResourcesMeshForLaunch=bomb
ResourcesMeshSwitchTime=3 

############################################################

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=FALSE
InFlightEffect=FALSE
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
#HitAirExplosionClass=SmallGroundHitExplosions
HitGroundExplosionClass=MediumGroundHitExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637