[AmmunitionNames]
# ------------------ AAM ------------------
dts_aim-9x=AIM-9X,响尾蛇,空对空,AIM-9X响尾蛇是雷神公司研制的AIM-9系列的最新型号，是美军现役主力近程红外格斗导弹，于2003年服役。它采用成像红外导引头和推力矢量控制，具备90°大离轴角攻击和发射后锁定能力

dts_agm-65d=AGM-65D,小牛,对地攻击,AGM-65D 是“小牛”导弹系列中的一员。它采用被动红外制导，具备全天候、昼夜作战能力，抗干扰性强，可发射后不管，专为打击装甲车辆、工事、舰船及点目标设计。广泛装备于北约及多国空中力量。


dts_aim-120d-3=AIM-120D-3,AMRAAM,空对空,AIM-120是美国的主动雷达制导空对空导弹，最新的AIM-120D型号经过F3R升级，通过更换关键电路板、升级处理器和采用高能电池，具备了更远的射程和更强的抗干扰能力，拥有双向数据链和GPS辅助惯性导航系统
dts_aim-120d-3_w=AIM-120D-3,AMRAAM,空对空,AIM-120是美国的主动雷达制导空对空导弹，最新的AIM-120D型号经过F3R升级，通过更换关键电路板、升级处理器和采用高能电池，具备了更远的射程和更强的抗干扰能力，拥有双向数据链和GPS辅助惯性导航系统

dts_aim-260=AIM-260,JATM,空对空,AIM-260是2017年启动研制的远程空对空导弹，预计2026年其产量将超过AIM-120。它配备双脉冲发动机，无中翼，射程超过260公里，速度达5马赫
dts_aim-260_w=AIM-260,JATM,空对空,AIM-260是2017年启动研制的远程空对空导弹，预计2026年其产量将超过AIM-120。它配备双脉冲发动机，无中翼，射程超过260公里，速度达5马赫

dts_aim-174b=AIM-174B,神枪手,空对空,AIM-174B超远程空空导弹是美国海军基于RIM-174“标准”-6舰空导弹改进的空射型号，通过去除舰射版助推器并结合高空高速发射条件，实现400千米以上射程，是目前美国空/海军装备的射程最远空空导弹

dts_apkws-ii=APKWS II,,制导火箭,APKWS II（AGR-20A）是由 BAE 系统公司研发的 70 毫米半主动激光制导火箭弹，由“九头蛇”Hydra 70火箭弹改装而来,在弹体前方安装了激光制导套件，一般用作打击低价值目标和反无人机弹药。

dts_gbu-32=GBU-32,JDAM,制导炸弹,GBU-32是美国的1000磅GPS制导炸弹
dts_gbu-31=GBU-31,JDAM,制导炸弹,GBU-31是美国的2000磅GPS制导炸弹
dts_gbu-53=GBU-53/B,SDB II,制导炸弹,GBU-53/B “风暴破坏者” 是美军第二代小直径精确制导滑翔炸弹，由雷神公司研制。采用折叠弹翼设计，最大射程达 110 公里。核心优势是三模制导系统（毫米波雷达、红外成像、半主动激光）与双向数据链，可全天候对抗复杂电磁干扰，精准打击固定及移动目标（坦克、舰艇等）。

dts_gbu-75=GBU-75,JDAM-LR,制导炸弹,GBU-75 JDAM-LR 是美军最新推出的制导炸弹，采用500lb的mk82弹头。弹体中部安装了一节带有发动机的画像套件，可以使得其最大射程达到200海里以上，用较为低廉的价格精确打击敌方高价值目标

dts_agm-88c=AGM-88C,HARM,反辐射,AGM-88C是美国的一款反辐射导弹。C型相比A型提升了导引头性能
dts_agm-88g=AGM-88G,AARGM-ER,反辐射,AGM-88G是美国 AGM-88 “哈姆” 反辐射导弹的增程改进型，为隐身战机适配的新一代防空压制武器。其相对于之前的型号取消中部主翼改用侧边条与尾舵，可装入 F-35 内置弹舱以保持隐身。

dts_agm-154a=AGM-154A,JSOW,对地攻击,AGM-154是GPS/惯性导航制导的空对地滑翔炸弹，于1999年服役，并在多场战争中投入使用。其射程在低空为28公里，高空为74公里，携带145枚BLU-97/B子弹药，可打击装甲车辆和防空阵地等面目标


dts_agm-158b-2=AGM-158B-2,JASSM-ER,对地攻击,由洛克希德·马丁公司研制的AGM-158B-2增程型联合空对地防区外导弹是一种隐身远程巡航导弹，采用涡轮风扇发动机，射程超过1900公里。它配备惯性导航+GPS+红外成像末制导系统和454公斤弹头，具备升级后的GPS接收机和抗干扰软件，能够对高价值目标实施防区外打击，并与多种战斗机兼容
dts_agm-158c-3=AGM-158C-3,LRASM-ER,反水面,AGM-158C-3 是洛克希德·马丁公司为美海空军研发的 AGM-158C 远程反舰导弹（LRASM）最新改进型，拥有更远射程、更强协同攻击与隐身突防能力。可从 B-1B、F/A-18E/F、F-15EX 等平台发射。
dts_agm-183a=AGM-183A,ARRW,弹道导弹,AGM-183A（ARRW，空射快速响应武器）是美国洛克希德・马丁公司为空军研制的助推滑翔式高超音速导弹，全长约 5.89 米，重 2.27 吨，最大速度达 10 马赫，射程超 926 千米。它采用惯性 + GPS 复合制导，配备 68 千克高爆钨制破片战斗部
dts_agm-183a(w62)=AGM-183A(W62),ARRW,弹道导弹,AGM-183A（ARRW，空射快速响应武器）是美国洛克希德・马丁公司为空军研制的助推滑翔式高超音速导弹，这个版本搭载了一枚W62核弹头。请注意：不当使用可能会导致世界末日！

dts_b-61=B61,,核航弹,B61核弹是美国研发的战术核武器。其采用模块化设计及两级辐射内爆技术，爆炸当量可在0.3千吨至30万吨TNT间调节。体积小巧,可由B-2、F-16、F-35等机型搭载。