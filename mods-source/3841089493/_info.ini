Name=Mil Mi-26 Halo
Description=Soviet Mi-26 (NATO: Halo) heavy transport helicopter, in service from 1983, in grey Soviet Air Force finish with red stars and side number 52. Eight-blade 32 m main rotor and five-blade tail rotor, glossy cockpit glass, 82 equipped troops, unarmed. Nose and cockpit reshaped after Mi-26 drawings, weathered skin, two levels of detail and a burnt crash wreck. Model "MI-26 Soviet Helicopter" by Savy (Sketchfab, CC BY 4.0), converted for Sea Power by Thomas. No other mods required. Version 1.0.
