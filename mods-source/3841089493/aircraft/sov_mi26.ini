# Mil Mi-26 Halo (sov_mi26), version 1.0. 1 game unit = 68 m. Origin on the main rotor axis, 3.0 m above the nose wheels.
# Layout follows the Mi-6 mod (stock wp_mi-14 rotor, discs and rudder system; usn_ch-46 transport). Unarmed.
# Data (Mi-26): empty 28,200 kg; internal fuel 12,000 l (about 9,600 kg); 295 km/h; ceiling 4,600 m; range 800 km on internal
# fuel; 82 equipped troops or 20,000 kg of cargo; eight-blade 32 m main rotor at 132 rpm (clockwise seen from above),
# five-blade 7.6 m tail rotor on the right. Climb rate and tail rotor rpm are estimates.
[General]
UnitType=Helicopter
# CombatCosts mod (optional): airframe price in USD (estimate; average unit price about 25 M USD today). Ignored by the game itself.
AircraftCosts=10000000
CurrentYearCost=25000000
CarrierCapable=False

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.0

Length=33.7                         // in meters (fuselage)

GroundedPitchAngle=0  // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.04412,0   // nose wheels 3.0 m below the origin (main wheels 0.24 m higher)
GroundTaxiInterval=0.4
ForwardsTaxiVelocity=15
BackwardsTaxiVelocity=0

PilotPositions=-0.0091,0.0199,0.1466|0.0091,0.0199,0.1466

FrontalArea=26
SideArea=125
BottomArea=150
[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[AI]
Role=Transport,SAR

[---------- Physics and Control ----------]
[Physics]
MaxPitchRate=7.0                   // in degrees per second
MaxRollRate=14.0                   // in degrees per second
MaxYawRate=22.0                    // in degrees per second
MaxPitchAngle=20
MaxRollAngleHovering=20
MaxRollAngleForwardFlight=35
TargetPitchForForwardFlight=6.0    // angle in degrees the helicopter stays in when moving forward when releasing controls

// hovering movements
HoverStrength=0.1                  // determines how strong the hover movements are
MinVelocityForNoHoverMovement=40   // in knots, above this value there won't be additional hover movements
MaxHoverRadius=5                   // radius in meter the heli is allowed to do hover movements

MaxSpeedAtSeaLevel=159             // in knots (295 km/h)
MaxBackwardSpeed=15                // in knots
MaxSidewardSpeed=15                // in knots
Ceiling=15100                      // ceiling in feet (4,600 m)
Altitudes=20,200,500,1000,3000,6000,10000  // in feet
ClimbRate=24.6                     // feet per second (7.5 m/s, estimate)

EmptyMass=28200                    // in kg
MaxFuel=9600                       // in kg, 12,000 l internal
MaxRange=432                       // in n miles (800 km on internal fuel)

TransportCapacity=82               // equipped troops

HoveringFuelConsumption=1.2        // Minimum fuel consumption when hovering.

MainThrustAccelerationFactor=3.0   // determines the engine thrust acceleration factor (as multiplicator of v=a*t)
LinearDrag=0.9995                  // this is for velocity damping (linear drag)
CurveDragFactor=2.0                // determines how quickly the helicopter loses velocity (dependend on steepness of curve)
GravityDragFactor=1.0              // determines the gravity factor (1.0 means here standard 9.81m/s²)

MousePitchFactor=0.3
MouseYawFactor=0.3

EngineWarmUpTime=45
RotorsSpinUpTime=60

[SensorData]
VisualIdentificationRange=10       // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
RCS=70

[FlightControls]
RotorConfiguration=SingleMain      // can be singlemain, coaxial, tandem
SwashplateMaxAngle=5.0
NumberOfRotors=2
Rotor1_Model=Rotor_Shaft
Rotor1_DiscModel=Rotor_Disc
Rotor1_SwashplateModel=Swashplate
Rotor1_Direction=-1.0
Rotor1_RotationAxis=Z
Rotor1_RPM=132
Rotor1_Type=Main     // can be main or tail

Rotor2_Model=Tail_Rotor
Rotor2_DiscModel=Tail_Rotor_Disc
Rotor2_Direction=1.0
Rotor2_RotationAxis=Z
Rotor2_RPM=555       // estimated from the same tip speed as the main rotor (7.6 m rotor)
Rotor2_Type=Tail     // can be main or tail

[RudderSystem]
LeftRollRudder=Rotor_Disc
RightRollRudder=Rotor_Disc
PitchRudder=Rotor_Disc
YawRudder=Tail_Rotor
LeftRollRudderAxis=Z
RightRollRudderAxis=Z
PitchRudderAxis=X
YawRudderAxis=Z
LeftRollRudderBaseAngle=-90.0
RightRollRudderBaseAngle=-90.0
PitchRudderBaseAngle=-90.0
YawRudderBaseAngle=90.0
RollRudderDirection=1.0
PitchRudderDirection=-1.0
YawRudderDirection=-1.0

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1

[SensorSystem1] #Cockpit
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0,0
ModuleType=Sensor

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1
AvailableLoadouts=Transport

[WeaponSystem1] #Decoy dispensers (stock chaff dispenser as stand-in, as the Mi-6 and the stock CH-46)
Type=Chaff
SystemName=WP_AIR_CHAFF_DISP
Mount=Dummy
ContainerBase=Dummy
AssociatedMagazine=WeaponMagazineChaff
NumberOfEffects=4
DelayBetweenLaunches=0.1
WorksStandalone=True
ModuleType=Weapon

[--------------------------- Loadouts ---------------------------]
[WeaponSystem1Transport]
ReadyUpTime=20               // in minutes. Time that plane will spend refueling and rearming before takeoff.
CoolDownTime=40              // in minutes. Time that plane will spend in maintenance after landing.

[---------- WeaponMagazines ----------]
[WeaponMagazineChaff]
NumberOfAmmunitionTypes=1
Ammunition1_Count=15
Ammunition1=all_air_chaff_standard
ModuleType=WeaponMagazine

[---------- Mesh definitions----------]
[Models]
LODLevels=2
LOD1Distance=1.0  // nautical miles
LOD2Distance=2.0  // nautical miles
# Crashed version: mi26_wreck (+ _lod1/_lod2) with its own burnt texture. mi26_body_d is an empty stand-in so the
# game's per-part damage swap hides the intact fuselage; every submodel below hides with the damage model.
HideAllMeshesWithActiveDamageModel=True
ResourcesFolder=assets/sov_mi26/models/
ResourcesRoot=sov_mi26.obj
ResourcesMesh=mi26_body
ResourcesMaterialFolder=assets/sov_mi26/materials/
ResourcesMaterial=mi26_mat.ini
NumberOfDamageModels=1
DamageModel1=mi26_wreck
DamageModelMaterial1=mi26_wreck_mat.ini

[Submodels]
SubModel1=Parts
SubModel2=Swashplate
SubModel3=Rotor_Shaft
SubModel4=Rotor_Disc
SubModel5=Tail_Rotor
SubModel6=Tail_Rotor_Disc
SubModel7=Glass

[Parts]   # landing gear, rotor shaft and hub cap, tail rotor hub, small parts
ResourcesMeshFolder=assets/sov_mi26/models/
RootMesh=sov_mi26.obj
Mesh=mi26_parts
ResourcesMaterialFolder=assets/sov_mi26/materials/
Material=mi26_mat.ini
Position=0,0,0
Rotation=0,0,0
HideWithActiveDamageModel=True

[Glass]   # cockpit window panes: own glossy material, the CB 90 CX glass values (dark diffuse, strong specular)
ResourcesMeshFolder=assets/sov_mi26/models/
RootMesh=sov_mi26.obj
Mesh=mi26_glass
ResourcesMaterialFolder=assets/sov_mi26/materials/
Material=mi26_glass_mat.ini
Position=0,0,0
Rotation=0,0,0
HideWithActiveDamageModel=True

[Swashplate]
Rotation=0,0,0
HideWithActiveDamageModel=True

[Rotor_Shaft]   # eight blades and the hub hinges, mesh local Z = up (Rotation -90,0,0 as the stock Mi-14)
ResourcesMeshFolder=assets/sov_mi26/models/
