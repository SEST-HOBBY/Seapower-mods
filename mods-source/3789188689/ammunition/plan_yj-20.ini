#!extend ammunition/plan_yj-20.ini

[Guidance]
InitialFlightPhaseDuration=1.0        // time in seconds where the missile moves straight on without guiding

LaunchTurnRate=3
[Models]
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/yj-20/
ResourcesRoot=yj-20_ac.obj
ResourcesMesh=launch
ResourcesMaterial=yj-20_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfStages=4

Stage1Mesh=launch
Stage1MeshPosition=0,0,0
Stage1MeshRotation=0,0,0
Stage1SeparationTime=0.6
Stage1FlightEffect=effects/weapons/emitters/s-300_effect
Stage1FlightEffectPosition=0,0,0
Stage1BurnTime=0.6

Stage2Mesh=launch
Stage2MeshPosition=0,0,0
Stage2MeshRotation=0,0,0
Stage2SeparationTime=45
Stage2FlightEffect=effects/weapons/emitters/sam_medium_effect
Stage2FlightEffectPosition=0,0,-0.035
Stage2BurnTime=45
Stage2SeparationEffect=effects/weapons/usn_rur-5_separation
Stage2SeparationEffectPosition=0,0,0
Stage2JettisonMesh=yj-20_s1d
Stage2JettisonMeshPosition=0,0,0
Stage2JettisonMeshRotation=0,0,0

Stage3Mesh=yj-20
Stage3MeshPosition=0,0,0
Stage3MeshRotation=0,0,0
Stage3SeparationTime=TerminalApproach                                 // value in s, or flight stage: TerminalApproach, MaintainSeaSkimming   

Stage4Mesh=yj-20
Stage4MeshPosition=0,0,0
Stage4MeshRotation=0,0,0
Stage4FlightEffect=effects/weapons/emitters/sam_small_effect
Stage4FlightEffectPosition=0,-0.0007,0
Stage4BurnTime=15.0                                                    // value in s for FlightEffect



[Particles]
BoosterEffect=
BoosterEffectPosition=0,0,-0.072

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.095
InFlightEffectStartTime=0.5  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=