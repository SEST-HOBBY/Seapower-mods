#!extend ammunition/pla_hq-16b.ini

[Guidance]
AutoAttackBelowMinAltitude=True
AutoAttackAboveMaxAltitude=True
OptimalTargetDist=5,25

InitialFlightPhaseDuration=0.8         // time in seconds where the missile moves straight on without guiding

MaxLoftAngle=60.0                      // Climb angle for initial loft

TerminalLoft=True
OptimizeLoftAlt=True

MinLaunchRange=2.0                     // Minimum launch range in nautical miles

[Models]

NumberOfStages=1

Stage1Mesh=hq-16b
Stage1MeshPosition=0,0,0
Stage1MeshRotation=0,0,0
Stage1SeparationTime=0.6
Stage1FlightEffect=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium_boost.ini
Stage1AudioClip=audio/weapons/Missile-Medium_MotorLoop.wav
Stage1FlightEffectPosition=0,0,-0.039568
Stage1BurnTime=30

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav

[MissileLaunchControl]
Enabled=True
Profile=PoweredTurnover // Same ejection + powered turnover as the 48N6 reference
EjectBeforeTurnover=True
EjectionSpeed=25
ClearanceDistance=20
ReplaceInitialFlightPhase=True
TurnoverAim=NativeFlightPath
TurnoverRate=60
TurnoverTolerance=3
HandoffTime=0.2
MaxControlTime=2
VisualPivot=Auto              // Cosmetic pivot at the geometric missile midpoint.
DelayStage1EffectsUntilTurnoverComplete=False
ControlEffects=Auto 
Debug=False

[Launch_MainMotor]
Type=StageExhaust                       // Add a visual deflection to the Stage mod's existing exhaust anchor.
Stage=1                                // Use the single flying stage.
MaxDeflectionAngle=15                   // Degrees of maximum visible nozzle/plume deflection.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full visual deflection.
ResponseTime=0.8                       // Seconds of visual response smoothing.


[Particles]
BoosterEffect=
BoosterEffectClass=
InFlightEffect=
InFlightEffectClass=
SustainerEffect=
SustainerEffectClass=

HitEffectSpeedMode=Relative
HighSpeedHitDefaultExplosion=effects/explosions/emitters/kinetic_kill_hit/kinetic_kill_hit.ini
HighSpeedHitDefaultExplosionUseTargetVelocity=True

[Measured]
BakeVersion=8
InputHash=510f784ed2bb054e
FrontalArea=0.0619
SideArea=1.32
BottomArea=1.32
Volume=0.2448