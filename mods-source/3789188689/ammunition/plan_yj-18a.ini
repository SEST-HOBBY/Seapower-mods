#!extend ammunition/plan_yj-18a.ini


[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/yj-18/
ResourcesRoot=yj-18_ac.obj
ResourcesMesh=launch
ResourcesMaterial=yj-18_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=1.9  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfStages=3

Stage1Mesh=launch
Stage1MeshPosition=0,0,0
Stage1MeshRotation=0,0,0
Stage1SeparationTime=1.9                                             // value in s, or flight stage: TerminalApproach, MaintainSeaSkimming   


Stage2Mesh=yj-18
Stage2MeshPosition=0,0,0
Stage2MeshRotation=0,0,0
Stage2SeparationTime=TerminalApproach                                 // value in s, or flight stage: TerminalApproach, MaintainSeaSkimming   
Stage2SeparationEffect=effects/weapons/usn_rur-5_separation
Stage2SeparationEffectPosition=0,0,0
Stage2JettisonMesh=yj-18_s2d
Stage2JettisonMeshPosition=0,0.01,0
Stage2JettisonMeshRotation=-5,0,0

Stage3Mesh=warhead
Stage3MeshPosition=0,0,0
Stage3MeshRotation=0,0,0
Stage3FlightEffect=effects/weapons/emitters/aam_small_smokeless_effect
Stage3FlightEffectPosition=0,-0.0007,0.018
Stage3FlightEffect2=effects/weapons/emitters/missile_sustainer_small_effect
Stage3FlightEffect2Position=0,-0.0007,0.018
Stage3FlightEffect2Scale=0.6,0.6,2.5
Stage3BurnTime=80.0                                                    // value in s for FlightEffect



[Particles]
BoosterEffect=effects/weapons/emitters/usn_rgm-109_booster
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available