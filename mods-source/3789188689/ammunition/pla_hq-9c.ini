#!extend ammunition/pla_hq-9c.ini

[Guidance]
AutoAttackBelowMinAltitude=True
AutoAttackAboveMaxAltitude=False
OptimalTargetDist=50,260


InitialFlightPhaseDuration=0.5         // time in seconds where the missile moves straight on without guiding

IgnoreHeightDifferenceForTargetDist=False //True  // useful for hight loft alt missiles to ignore the height for distance calculation

MaxLoftAngle=80.0                      // Climb angle for initial loft

LaunchTurnRate=60                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
TerminalLoft=True
OptimizeLoftAlt=True

OptimalTargetDist=2,50 // Preferred range in nautical miles

[Models]

NumberOfStages=1

Stage1Mesh=hhq-9c
Stage1MeshPosition=0,0,0
Stage1MeshRotation=0,0,0
Stage1FlightEffect=effects/weapons/emitters/solidrocket_small/rocketmotor_solid_small_boost.ini
Stage1AudioClip=audio/weapons/Missile-HighAltitude_MotorLoop_2.wav
Stage1FlightEffectPosition=0,0,-0.025845
Stage1BurnTime=15.0

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav

[MissileLaunchControl]
Enabled=True                           // Enable nose-jet-assisted alignment during the powered launch.
Profile=PoweredTurnover                 // Preserve native motor thrust and the existing stage motor effects during launch.
ReplaceInitialFlightPhase=False         // Replace the native straight-flight delay with clearance and alignment control.
ClearanceDistance=10                     // Metres traveled along the original launch axis before the nose starts turning.
TurnoverAim=NativeFlightPath             // Follow the game's current waypoint/loft steering goal.
TurnoverRate=80                        // Maximum launch-body rotation in degrees/second; matches the inherited launch turn rate.
TurnoverTolerance=3                     // Remaining angular error in degrees that completes launch alignment.
HandoffTime=0.15                        // Seconds of handoff before terminal maneuver authority becomes eligible.
MaxControlTime=3.0                     // Maximum clearance/alignment time before release to native guidance.
VisualPivot=0,0,-0.024401              // Cosmetic pivot at the geometric missile midpoint.
DelayStage1EffectsUntilTurnoverComplete=False // The powered launch keeps its existing motor-effect timing.
ControlEffects=Auto                      // Reuse the same four nose-jet definitions for launch; this file has no StageExhaust controller.
Debug=False                             // Log jet binding and first emission while checking visibility; set False after tuning.

[Launch_MainMotor]
Type=StageExhaust
Stage=1
MaxDeflectionAngle=15
FullDeflectionRate=30
ResponseTime=0.5

#TVC+RCS
[MissileThrustVectorControl]
Enabled=True                           // Enable the optional maneuver controller for this ammunition.
FlightPhases=TerminalApproach           // Native flight phases in which the additional control authority is available.
MaxTurnGBonus=23               //TVC+RCS         // Extra lateral acceleration in G; also raises the corresponding angular-rate limit.
MinTurnRate=5                          // TVC effects start at 3 deg/s of combined pitch/yaw; stop below 80% of this rate. 0 = no threshold. Does not limit launch effects or G bonus.
ActiveDuration=-1                     // Seconds from first eligible phase entry; the timer never resets on phase re-entry. -1 = unlimited.
RequireMotorBurning=True               // False allows independent attitude-control jets after main-motor burnout.
ControlEffects=Auto                     // Auto selects Maneuver_ effect sections; All selects all control-effect sections.
Debug=False                             // Log terminal authority, jet binding and first emission for visibility checks.

[Maneuver_MainMotor]
Type=StageExhaust                       // Add a visual deflection to the Stage mod's existing exhaust anchor.
Stage=1                                // Use the single flying stage.
MaxDeflectionAngle=5                   // Degrees of maximum visible nozzle/plume deflection.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full visual deflection.
ResponseTime=0.06                       // Seconds of visual response smoothing.

[Maneuver_NoseLeft]
Type=Thruster                                                           // Independent left-side control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini     // Jet resource; neutral emission is local +Z.
Position=-0.001921,0,0.024553                                             // Missile-local mesh units; mounted near the nose on the left side.
Rotation=0,-90,0                                                        // Jet toward -X; reaction force toward +X.
Stages=1,2
FullDeflectionRate=30                                                   // Body turn rate in degrees/second for full emission.
ResponseTime=0.04                                                       // Emission response time in seconds.

[Maneuver_NoseTop]
Type=Thruster                                                           // Independent top-side control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini     // Jet resource; neutral emission is local +Z.
Position=0,0.001921,0.024553                                              // Missile-local mesh units; mounted near the nose on the top side.
Rotation=-90,0,90                                                       // Roll the five-port row along missile Z; jet direction is unchanged.
Stages=1,2
FullDeflectionRate=30                                                   // Body turn rate in degrees/second for full emission.
ResponseTime=0.04                                                       // Emission response time in seconds.

[Maneuver_NoseTopRight]
Type=Thruster                                                           // Independent upper-right diagonal control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini     // Jet resource; neutral emission is local +Z.
Position=0.00129401,0.00129401,0.024553                                  // 45-degree diagonal mount; same 0.001921 radial distance and nose Z as the cardinal jets.
Rotation=-45,90,0                                                       // Jet outward toward +X/+Y; the five-port row stays along missile Z.
Stages=1,2
