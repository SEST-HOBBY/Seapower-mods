#!extend ammunition/pla_df-21d.ini

[Guidance]
InitialFlightPhaseDuration=1.0        // time in seconds where the missile moves straight on without guiding

MaxLoftAngle=70.0                      // Climb angle for initial loft

TargetRequired=False                    // Cannot be launched to bearing

LiftFactor=0.03				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
DragCoefficient=2.7          // 阻力系数。0表示无阻力，1表示默认阻力，数值越大表示阻力越大。默认值为-1，此时我们会根据导弹的最大射程来计算阻力系数

BallisticLoft=True
TerminalAlt=90000

[Models]
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/df-21/
ResourcesRoot=df-21d_ac.obj
ResourcesMesh=dummy
ResourcesMaterial=df-21d_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfStages=4

// Nose heating during atmospheric ascent; visual settings copied from IRCPS.
ThermalGlowMaterial=assets/europack/materials/thermal_glow/w88_mk5_glow.ini
ThermalGlowStartSpeed=2600
ThermalGlowFullSpeed=5000
ThermalGlowMaxIntensity=1
ThermalGlowHeatUpTime=5
ThermalGlowCoolDownTime=10
ThermalGlowFadeInTime=2
ThermalGlowStartStage=3
Stage1GlowEnabled=False

// Standalone glow OBJ, resolved by its resource path (same layout as IRCPS).
Stage2GlowMesh=df-21_glow
Stage2GlowEnabled=True
Stage2InheritGlow=True
Stage2GlowStartDelay=0
Stage2GlowFadeInTime=2
Stage2GlowPosition=0,0,0
Stage2GlowRotation=0,0,0
Stage2GlowScale=1,1,1

Stage4GlowMesh=df-21_terminal_glow
Stage4GlowEnabled=True
Stage4InheritGlow=True
Stage4GlowStartDelay=0
Stage4GlowFadeInTime=2
Stage4GlowPosition=0,0,0
Stage4GlowRotation=0,0,0
Stage4GlowScale=1,1,1


Stage1Mesh=dummy
Stage1MeshPosition=0,0,0
Stage1MeshRotation=0,0,0
Stage1SeparationTime=20
Stage1FlightEffect=effects/weapons/emitters/solidrocket_large/rocketmotor_solid_large_boost.ini
Stage1AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
Stage1FlightEffectPosition=0,0,-0.099611
Stage1BurnTime=20

// 复制自 Stage1：第二级助推（原 65s 拆成 20 + 剩余 45）。特效去掉 booster
Stage2Mesh=dummy
Stage2MeshPosition=0,0,0
Stage2MeshRotation=0,0,0
Stage2SeparationTime=65
Stage2FlightEffect=effects/weapons/emitters/solidrocket_large/rocketmotor_solid_large.ini
Stage2AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
Stage2FlightEffectPosition=0,0,-0.099611
Stage2BurnTime=45
Stage2SeparationEffect=effects/weapons/usn_rur-5_separation
Stage2SeparationEffectPosition=0,0,0
Stage2JettisonMesh=df-21d_s1d
Stage2JettisonMeshPosition=0,0,0
Stage2JettisonMeshRotation=0,0,0

Stage3Mesh=head
Stage3MeshPosition=0,0,0
Stage3MeshRotation=0,0,0
Stage3SeparationTime=TerminalApproach

Stage4Mesh=head
Stage4MeshPosition=0,0,0
Stage4MeshRotation=0,0,0

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav

[MissileLaunchControl]
Enabled=True
Profile=PoweredTurnover // Same ejection + powered turnover as the 48N6 reference
EjectBeforeTurnover=True
EjectionSpeed=25
ClearanceDistance=20
ReplaceInitialFlightPhase=True
TurnoverAim=NativeFlightPath
TurnoverRate=10
TurnoverTolerance=3
HandoffTime=0.2
MaxControlTime=2
VisualPivot=Auto // Set explicitly if needed after positioning the model
DelayStage1EffectsUntilTurnoverComplete=False
ControlEffects=Auto
Debug=False


[KinematicRangeOverride]
Enabled=True
NoTargetDragSeaLevel=True              //打空地阻力正常
MaxRange=0            // 0 = 用本弹 MaxLaunchRange（静态值）；-1 = 无限；>0 = 指定海里
PlayerOnly=False       // True = 只放行玩家发射，AI 行为不变；False = AI 也放行
Debug=False           // True = 读取时输出一条日志

[LoftTrajectory]
EndAltitude=100000          // 英尺；0/不写 = 原版（目标高度）
EndAltitudeType=Absolute                    //可选：AboveSeaLevel（默认，高于海平面）、Absolute（绝对高度）、RelativeToTarget（目标高度 + 值）、PercentageOfTarget、AboveTerrain。
Debug=False                 // True = 生成航点时输出一条日志



[Particles]
BoosterEffect=
BoosterEffectPosition=0,0,-0.072

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.095
InFlightEffectStartTime=3  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=

[Measured]
BakeVersion=8
InputHash=dcf262c78a971540
FrontalArea=1.43
SideArea=11.2
BottomArea=11.2
Volume=10.1