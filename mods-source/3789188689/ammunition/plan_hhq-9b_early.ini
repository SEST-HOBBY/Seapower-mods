#!extend ammunition/plan_hhq-9b_early.ini

[Guidance]
InitialFlightPhaseDuration=0.8         // time in seconds where the missile moves straight on without guiding

MaxLoftAngle=80.0                      // Climb angle for initial loft

MinLaunchRange=1.8                     // Minimum launch range in nautical miles
LaunchTurnRate=60                    // Missiles like S-300 rapidly orient themselves after launch. in degrees per second

OptimalTargetDist=8,50 // Preferred range in nautical miles
AutoAttackBelowMinAltitude=True
AutoAttackAboveMaxAltitude=False

TerminalLoft=True
OptimizeLoftAlt=True

[Models]

NumberOfStages=1

Stage1Mesh=hq-9
Stage1MeshPosition=0,0,0
Stage1MeshRotation=0,0,0
Stage1SeparationTime=65
Stage1FlightEffect=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium_boost.ini
Stage1AudioClip=audio/weapons/Missile-Medium_MotorLoop.wav
Stage1FlightEffectPosition=0,0,-0.047157
Stage1BurnTime=24

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav

[MissileLaunchControl]
Enabled=True
Profile=PoweredTurnover // Same ejection + powered turnover as the 48N6 reference
EjectBeforeTurnover=True
EjectionSpeed=25
ClearanceDistance=20
ReplaceInitialFlightPhase=True
TurnoverAim=NativeFlightPath
TurnoverRate=60
TurnoverTolerance=3
HandoffTime=0.2
MaxControlTime=2
VisualPivot=Auto // Set explicitly if needed after positioning the model
DelayStage1EffectsUntilTurnoverComplete=False
ControlEffects=Auto
Debug=False

[Launch_MainMotor]
Type=StageExhaust
Stage=1
MaxDeflectionAngle=15
FullDeflectionRate=30
ResponseTime=0.5

[Particles]
BoosterEffect=effects/weapons/emitters/LauncherSmoke
BoosterEffectPosition=0,0,-0.012
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.025
InFlightEffectStartTime=3  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=
SustainerEffectPosition=0,0,-0.021
SustainerEffectStartTime=6.0
HitEffectSpeedMode=Relative
HighSpeedHitDefaultExplosion=effects/explosions/emitters/kinetic_kill_hit/kinetic_kill_hit.ini
HighSpeedHitDefaultExplosionUseTargetVelocity=True
