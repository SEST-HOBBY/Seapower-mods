#!extend ammunition/plaaf_jl-1.ini

[Guidance]
InitialFlightPhaseDuration=2      // time in seconds where the missile moves straight on without guiding
MaxLoftAngle=65.0                      // Climb angle for initial loft

SeaSkimmingStartDistToTarget=220      // in N. miles.

DragCoefficient=4


[Models]
ResourcesRoot=jinglei-1_ac.obj
// 主网格直接设为发射外形 launch：原版不再有 launch→jl-1 的切换窗口，
// 避免 Stage1 接管前露出光弹体 jl-1。Stage1 克隆 launch 后无缝接管。
ResourcesMesh=launch
ResourcesMeshSwitchTime=0
ResourcesMeshForLaunch=
ResourcesMeshCanister=

NumberOfStages=4

// Nose heating during atmospheric ascent; visual settings copied from IRCPS.
ThermalGlowMaterial=assets/europack/materials/thermal_glow/w88_mk5_glow.ini
ThermalGlowStartSpeed=2600
ThermalGlowFullSpeed=5000
ThermalGlowMaxIntensity=1
ThermalGlowHeatUpTime=5
ThermalGlowCoolDownTime=10
ThermalGlowFadeInTime=2
ThermalGlowStartStage=3
Stage1GlowEnabled=False

// Standalone glow OBJ, resolved by its resource path (same layout as IRCPS).
Stage2GlowMesh=jl-1_glow
Stage2GlowEnabled=True
Stage2InheritGlow=True
Stage2GlowStartDelay=0
Stage2GlowFadeInTime=2
Stage2GlowPosition=0,0,0
Stage2GlowRotation=0,0,0
Stage2GlowScale=1,1,1

Stage4GlowMesh=jl-1_glow
Stage4GlowEnabled=True
Stage4InheritGlow=True
Stage4GlowStartDelay=0
Stage4GlowFadeInTime=2
Stage4GlowPosition=0,0,0
Stage4GlowRotation=0,0,0
Stage4GlowScale=1,1,1

Stage1Mesh=launch
Stage1MeshPosition=0,0,0
Stage1MeshRotation=0,0,0
Stage1SeparationTime=35
Stage1FlightEffect=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium_boost.ini
Stage1AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
Stage1FlightEffectPosition=0,0,-0.09836
Stage1BurnTime=34.5
Stage1SeparationEffect=effects/weapons/usn_rur-5_separation
Stage1SeparationEffectPosition=0,0,0
Stage1JettisonMesh=jl-1_s1d
Stage1JettisonMeshPosition=0,0,0
Stage1JettisonMeshRotation=0,0,0

Stage2Mesh=jl-1_s1
Stage2MeshPosition=0,0,0
Stage2MeshRotation=0,0,0
Stage2SeparationTime=60
Stage2FlightEffect=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium.ini
Stage2AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
Stage2FlightEffectPosition=0,0,-0.035907
Stage2BurnTime=25
Stage2SeparationEffect=effects/weapons/usn_rur-5_separation
Stage2SeparationEffectPosition=0,0,0
Stage2JettisonMesh=jl-1_s2d
Stage2JettisonMeshPosition=0,0,0
Stage2JettisonMeshRotation=0,0,0

Stage3Mesh=jl-1
Stage3MeshPosition=0,0,0
Stage3MeshRotation=0,0,0
Stage3SeparationTime=TerminalApproach

Stage4Mesh=jl-1
Stage4MeshPosition=0,0,0
Stage4MeshRotation=0,0,0

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav

[KinematicRangeOverride]
Enabled=True
MaxRange=0            // 0 = 用本弹 MaxLaunchRange（静态值）；-1 = 无限；>0 = 指定海里
PlayerOnly=False       // True = 只放行玩家发射，AI 行为不变；False = AI 也放行
NoTargetDragSeaLevel=True   // True = 无目标时诱导阻力按海平面密度算（修正原版高空阻力爆表）
Debug=False           // True = 读取时输出一条日志

[LoftTrajectory]
EndAltitude=300000          // 英尺；0/不写 = 原版（目标高度）
EndAltitudeType=Absolute                    //可选：AboveSeaLevel（默认，高于海平面）、Absolute（绝对高度）、RelativeToTarget（目标高度 + 值）、PercentageOfTarget、AboveTerrain。
Debug=False                 // True = 生成航点时输出一条日志

[Particles]
BoosterEffect=
BoosterEffectClass=
InFlightEffect=
SustainerEffect=
SustainerEffectClass=

HitShipExplosion=effects/explosions/emitters/nuclear_500kt_surface/nuclear_500kt_surface.ini
HitShipExplosionPosition=0,0,0
HitShipExplosionRotation=0,360,0
HitShipExplosionScale=1,1,1

HitWaterSplash=effects/explosions/emitters/nuclear_500kt_surface/nuclear_500kt_surface.ini
HitWaterSplashPosition=0,0,0
HitWaterSplashRotation=0,360,0
HitWaterSplashScale=1,1,1

HitDefaultExplosion=effects/explosions/emitters/nuclear_500kt_surface/nuclear_500kt_surface.ini
HitDefaultExplosionPosition=0,0,0
HitDefaultExplosionRotation=0,360,0
HitDefaultExplosionScale=1,1,1

HitGroundExplosion=effects/explosions/emitters/nuclear_500kt_surface/nuclear_500kt_surface.ini
HitGroundExplosionPosition=0,0,0
HitGroundExplosionRotation=0,360,0
HitGroundExplosionScale=1,1,1

; Terrain collisions can use the air-destruction slot when native _hitLand is unset.
HitAirExplosion=effects/explosions/emitters/nuclear_500kt_surface/nuclear_500kt_surface.ini
HitAirExplosionPosition=0,0,0
HitAirExplosionRotation=0,360,0
HitAirExplosionScale=1,1,1

DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes

