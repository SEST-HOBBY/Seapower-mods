[General]
# runway-denial cluster weapon
Type=Bomb                              // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=25                               // in kg. Used for aircraft

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=0.2       // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Tiny
# Sonar related

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=1
ImpactSize=VerySmall               // Impact size, can be small, medium, large, verylarge
Penetration=Minor               // can be minor, moderate, heavy, always

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1       // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#========================================= Launch stats ============================================================
MinLaunchRange=0.01                    // Minimum launch range in nautical miles
MaxLaunchRange=10.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=200                  // Minimum launch altitude in feet.
MaxLaunchAltitude=60000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=20                 // Circular error radius in meters
#Homing
#ECCM
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction

[Physics]
ParachuteSlowDown=0.99          // speed damping（每帧 90% 速度，迅速减速到末速；越小越快，原版鱼雷 0.99 太慢）
ParachuteEndVelocity=100.0     // 伞降末速 100 节（用户要求：投放后迅速减速到 100 节）
MaxAngleWithParachute=85.0     // 伞降最大俯仰角（85°≈垂直，速度尽量垂直下落）
ParachuteDeployDelay=1         // 立即部署（投放后即开始减速s）

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/models/ammunition/akf-98/
ResourcesRoot=akf-98_ac.obj
ResourcesMesh=rdcw
ResourcesMaterial=akf98_mat.ini
############################################################
NumberOfSubModels=0


[SubAmmunition]
SubAmmunitionType=Missile
SubAmmunitionName=plaaf_rdcw_sub
SubAmmunitionPosition=0,0,0
SubAmmunitionRotation=0,0,0
SubAmmunitionTriggerHeight=500
SubAmmunitionInheritTarget=True
MainAmmunitionMesh=clear
SubAmmunitionDisplayOnParent=True
SubAmmunitionIgnoreHeightDifferenceForTargetDist=True
MainAmmunitionForceLevelFlight=True
MainAmmunitionDisappear=True


[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

ParachuteEffect=effects/weapons/emitters/parachute_square
ParachuteEffectPosition=0,0,-0.002
ParachuteEffectScale=0.2,0.2,0.2
InFlightEffect=None

HitDefaultExplosionClass=None
HitShipExplosionClass=None
#HitAirExplosionClass=None
HitWaterSplashClass=None
HitGroundExplosionClass=None

ExplosionOverwaterSplash=None

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637
