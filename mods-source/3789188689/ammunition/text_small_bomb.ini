# text_small_bomb — 小型炸弹
# 模型：声呐浮标（usn_ssq-53）展开前的折叠罐
# 威力/物理：全部参考 wp_fab-100（OFAB-100-120 炸弹）
# 弹出速度：EjectVelocity=40 kt（投放时沿宿主前进方向叠加弹出）

[General]
# 参考 OFAB-100-120
Type=Bomb                              // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=103                               // in kg. Used for aircraft
AmmoPoints=103                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard                    // referenced in effects/decals.ini

[SensorData]
VisualIdentificationRange=1            // Biggest range in nm at which this unit can be visually identified
IRSignature=VerySmall
RCS=VerySmall

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
#Explosive:42kg
WarheadType=0
Power=20
ImpactSize=SemiSmall               // Impact size, can be small, medium, large, verylarge
Penetration=Minor               // can be minor, moderate, heavy, always

[---------- Guidance ----------]
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.5         // time in seconds where the weapon moves straight on without guiding
EjectVelocity=12                       // 弹出速度（knots）：投放时沿宿主前进方向叠加，模拟从挂架/容器弹出
MinLaunchRange=0.01                    // Minimum launch range in nautical miles
MaxLaunchRange=10.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=200                  // Minimum launch altitude in feet.
MaxLaunchAltitude=60000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
CircularErrorRadius=80                 // Circular error radius in meters
SelfDestructDelay=0.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
# 模型 = 声呐浮标（usn_ssq-53）展开前的折叠罐：AssetBundle 主网格 + Resources dummy 兜底
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_mk-82
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_mk-82_mat
AssetBundleMeshHullCollider=usn_mk-82_coll
ResourcesFolder=weapons/usn_ssq-53/
ResourcesRoot=usn_ssq-53
ResourcesMesh=usn_ssq-53_dummy
ResourcesMaterial=usn_ssq-53_mat
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
InFlightEffect=None
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0
HitDefaultExplosionClass=MediumGroundHitExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=MediumGroundHitExplosions
ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[---------- Colliders ----------]
[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637
