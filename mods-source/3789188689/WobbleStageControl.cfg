# WobbleStageControl 配置（导弹摆动阶段控制）
# 修改后重启游戏生效。
# 阶段名见 BepInEx/LogOutput.log 里 "[WobbleStageControl] 可用阶段名" 一行。
# 所有阶段列表为空 = 保持原版（全程摆动）。

[General]
# 总开关
Enabled=true
# 禁用某阶段摆动时，是否连模型视觉晃动一起停掉（true=物理和视觉都停；false=只停物理）
DisableVisual=true

[Stages]
# 白名单：非空时只保留这些阶段，其余全部禁用（例：Only=TerminalApproach）
Only=TerminalApproach
# 黑名单：这些阶段水平+垂直都禁用
Disable=
# 只禁用水平摆动
DisableHorizontal=
# 只禁用垂直摆动
DisableVertical=
