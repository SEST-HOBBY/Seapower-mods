[ger_ffg_f124]
Type=FFG,Guided Missile Frigate
Default=F124 Sachsen-class,F124
DefaultDescription=The F124 Sachsen class is a German Navy's class of air-defense frigates. The design of the hull is based on that of the F123 Brandenburg class but with enhanced stealth features designed to deceive an opponent's radar and acoustic sensors. The class incorporates an advanced multifunction radar APAR and a SMART-L long-range radar which is purported to be capable of detecting stealth aircraft and stealth missiles.
