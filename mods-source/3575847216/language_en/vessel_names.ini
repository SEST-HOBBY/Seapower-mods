[ger_ffg_f125]
Type=FFG,Guided Missile Frigate
Default=F125 Baden-Wuerttemberg-class,F125
DefaultDescription=The F125 Baden-Wuerttemberg class is a German Navy class of large, long-endurance frigates optimized for stabilization operations, maritime security and sustained overseas deployments. The design emphasizes survivability, automation and reduced crew workload rather than high-end area air defense. Armament includes a 127 mm main gun, RAM close-in air-defense launchers, anti-surface missiles, machine guns and facilities for two helicopters. Its sensor and combat systems support surveillance, command, self-defense and land-attack fire support, while its limited missile air-defense fit makes it less suited for fleet air-defense roles than the F124 Sachsen class.
Variant1=F222 Baden-Wuerttemberg
Variant2=F223 Nordrhein-Westfalen
Variant3=F224 Sachsen-Anhalt
Variant4=F225 Rheinland-Pfalz

