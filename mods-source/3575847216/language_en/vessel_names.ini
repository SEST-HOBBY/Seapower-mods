[ger_ssk_type_212a_batch1_upgraded]
Type=SSK,Attack Submarine
Default=Type 212A-class (Batch 1 Upgraded),Type 212A
DefaultDescription=For 2030-era operations, two additions expand its defensive envelope: IDAS provides a submarine-launched close-range air-defense option against ASW helicopters and patrol aircraft, while SeaSpider offers a hard-kill anti-torpedo capability to defeat incoming threats at close range when soft-kill alone is insufficient. Primary lethality remains centered on heavyweight wire-guided torpedoes for anti-submarine and anti-surface warfare, complemented by layered countermeasures and careful maneuver to break engagements and regain separation. Overall: a highly survivable, intelligence-capable hunter optimized for covert presence and decisive underwater strikes, now with enhanced last-ditch defenses against air and torpedo threats.
Variant1=S181 U31,U31
Variant2=S182 U32,U32
Variant3=S183 U33,U33
Variant4=S184 U34,U34

[ger_ssk_type_212a_batch1]
Type=SSK,Attack Submarine
Default=Type 212A-class (Batch 1),Type 212A
DefaultDescription=Designed as a modern air-independent propulsion (AIP) attack submarine for the German Navy, Type 212A emphasizes stealth, endurance, and ambush capability in both littoral and open-ocean environments. A low-signature hull, quiet electric drive, and fuel-cell AIP enable prolonged submerged operations at very low acoustic output, supporting covert patrols and patient target prosecution. The combat system integrates a comprehensive sonar suite, including flank and intercept sensors plus a towed array for improved long-range detection - allowing the boat to build a high-quality underwater picture while minimizing emissions. Primary lethality is delivered through heavyweight wire-guided torpedoes for anti-submarine and anti-surface warfare, complemented by layered soft-kill countermeasures to break torpedo engagements and regain separation. Overall: a highly survivable, intelligence-capable hunter optimized for covert presence and decisive underwater strikes rather than high-speed pursuit.
Variant1=S181 U31,U31
Variant2=S182 U32,U32
Variant3=S183 U33,U33
Variant4=S184 U34,U34

[ger_ffg_f127]
Type=FFG,Guided Missile Frigate
Default=F127-class (Batch 1), F127
DefaultDescription=Conceived as a next-generation German large frigate optimized for air and missile defense, the design centers on a modern AESA volume-search radar and a large Mk 41 battery to deliver layered area defense with SM-2/SM-6 and dense local coverage with quad-packed ESSM. For ballistic-missile defense tasking, SM-3 provides exo-atmospheric reach, while the strike role is supported by long-range anti-ship/land-attack missiles (e.g., Tyrfing-class concepts) alongside standard surface-warfare weapons. Close-in protection combines hard-kill guns and missiles with soft-kill decoys and electro-optical directors for precise terminal cueing. The ASW suite pairs a medium-frequency hull sonar with a low-frequency variable-depth/towed array to improve detection across difficult littoral and deep-water conditions, enabling the ship to prosecute submarines with shipborne torpedoes and helicopter support. Overall: a fleet air-defense and high-end escort platform that trades patrol-oriented features for sensor reach, missile depth, and sustained multi-layer protection.
Variant1=F232
Variant2=F233
Variant3=F234

