[ger_ffg_f123_1994]
Type=FFG,Guided Missile Frigate
Default=F123 Brandenburg-class, F123
DefaultDescription=Entering service in the early 1990s, the class is defined by a clear ASW focus: the Atlas Elektronik DSQS-23BZ medium-frequency hull sonar underpins submarine prosecution and torpedo warning. For air defense the ships add point defense with semi-active RIM-7P, directed by the Thales STIR 180 fire-control radar and the Atlas MSP 600 electro-optical director. In the surface-warfare role the then-common MM38 Exocet provides a conservative but proven option; light 20 mm mounts cover close-in threats. The Thales (Signaal) LW08 2D air-search radar supplies early warning and cueing, while precise engagements are handled by director/EO. Soft-kill launchers (e.g., SCLAR/TKWA) create multi-spectral deception against sea-skimmers and sensors. Overall: ASW as the core mission, complemented by point AAW and reliable, if dated, anti-ship capability.
Variant1=F215 Brandenburg 
Variant2=F216 Schleswig-Holstein
Variant3=F217 Bayern
Variant4=F218 Mecklenburg-Vorpommern

[ger_ffg_f123_2007]
Type=FFG,Guided Missile Frigate
Default=F123 Brandenburg-class, F123
DefaultDescription=Mid-2000s upgrades strengthen the inner defensive layer: the stabilized, remote Rheinmetall MLG 27 replaces manual 20 mm mounts and delivers accurate fire in sea states and during maneuvers. Rheinmetall MASS introduces programmable multi-spectral decoys (RF/IR/EO), superseding older soft-kill with greater flexibility against diverse seeker types. The sensor backbone of Thales (Signaal) LW08, Thales STIR 180, and Atlas MSP 600 remains, providing robust surveillance and dependable fire control. In ASW, DSQS-23BZ continues as the principal shipboard sensor and informs torpedo-defense doctrine. Surface effect stays serviceable with MM38 Exocet, though no longer cutting-edge. Net effect: markedly improved self-protection and EW without changing the mission profile.
Variant1=F215 Brandenburg 
Variant2=F216 Schleswig-Holstein
Variant3=F217 Bayern
Variant4=F218 Mecklenburg-Vorpommern

[ger_ffg_f123_2012_MVP]
Type=FFG,Guided Missile Frigate
Default=F123 Brandenburg-class MVP, F123 MVP
DefaultDescription=Marine-Versuchs-Projekt (Naval Test subject) for the integration of RIM-162B on the platform F123. As a trial configuration, Raytheon ESSM Block 1 (RIM-162B) is integrated to raise AAW performance without major deck changes. With semi-active terminal homing, the Thales STIR 180 remains pivotal as illuminator; mid-course support eases the terminal burden and improves end-game quality. The proven ASW chain (DSQS-23BZ plus shipborne helicopter) stays the core task and benefits indirectly from a more resilient air picture. Rheinmetall MASS continues to provide flexible deception, Rheinmetall MLG 27 preserves close-in lethality. Structurally little changes—gains come from software, fire-control logic, and doctrine. The frigate becomes notably more raid-resilient while retaining its characteristic silhouette.
Variant1=F218 Mecklenburg-Vorpommern

[ger_ffg_f123_2015_essm]
Type=FFG,Guided Missile Frigate
Default=F123 Brandenburg-class, F123
DefaultDescription=With the addition of ESSM Block 1, the class moves toward local-area air defense. ESSM Block 1 benefits from improved salvo planning and availability; the Thales STIR 180 still governs the terminal phase. In surface warfare, Boeing Harpoon RGM-84D replaces the older Exocet, bringing more flexible approach profiles. The ASW pillar (DSQS-23BZ, embarked helicopter, and countermeasures) remains integral and is eased by the stronger air picture. Rheinmetall MASS and MLG 27 keep the inner layer current. The result is a distinctly broader capability set with familiar operating and maintenance routines.
Variant1=F215 Brandenburg 
Variant2=F216 Schleswig-Holstein
Variant3=F217 Bayern
Variant4=F218 Mecklenburg-Vorpommern

[ger_ffg_f123_2025_mlu]
Type=FFG,Guided Missile Frigate
Default=F123B Brandenburg-class, F123B
DefaultDescription=The mid-life upgrade delivers a notable sensor leap: Saab Sea Giraffe 1X and Saab Sea Giraffe 4A (AESA) raise track quality, update rate, and littoral performance. ESSM Block 2, with an active seeker, reduces dependence on terminal illumination and improves multi-target handling and CCM robustness. The EW suite (e.g., KORA family) is modernized, strengthening ESM/ECM and soft-kill coordination; Rheinmetall MASS remains the scalable effector. For ASW, DSQS-23BZ continues as the foundational ship sensor, backed by the helicopter and shallow-water doctrine. In surface warfare, Saab/Diehl RBS15 Mk3 adds a long-range, navigation-robust option with limited land-attack. Overall, the ship matures into a true multi-mission combatant with shorter kill chains and stronger self-defense.
Variant1=F215 Brandenburg 
Variant2=F216 Schleswig-Holstein
Variant3=F217 Bayern
Variant4=F218 Mecklenburg-Vorpommern

[ger_ffg_f123_2030_mlu_high]
Type=FFG,Guided Missile Frigate
Default=F123B Brandenburg-class (fictional), F123B
DefaultDescription=In this fictional peak state, VLS capacity grows to 4×8 cells, doubling ESSM Block 2 depth—dramatically boosting fire density and persistence against saturation raids. Saab Sea Giraffe 1X/4A (AESA) provide the high-refresh picture needed for complex multi-target fights, while a modern EW suite underwrites survivability in task-group combat. Saab/Diehl RBS15 Mk3 sustains contemporary ASuW with limited land-attack. The ASW pillar remains and benefits from stronger air/EW coverage. Note: The move to 4×8 Mk 41 leverages the class’s original growth provisions—space/weight/services and foundations for two additional 8-cell positions were planned from the outset—with supplemental structural reinforcement where required. The package represents a high-end AAW/ASuW escort with notable staying power.
Variant1=F215 Brandenburg 
Variant2=F216 Schleswig-Holstein
Variant3=F217 Bayern
Variant4=F218 Mecklenburg-Vorpommern



[ger_fsg_k130_batch1_early]
Type=FSG,Guided Missile Corvette
Default=K130 Braunschweig-class Batch 1 early, K130
DefaultDescription=As built for littoral operations, the corvette pairs a compact strike fit with robust self-defense. Surface warfare centers on two twin canisters for Saab/Diehl RBS15 Mk3, while a OTO Melara 76/62 Compact and the stabilized Rheinmetall MLG 27 cover the gun layer. Point air defense is provided by two 21-cell RAM Mk 49 launchers optimized for sea-skimming threats. Surveillance comes from a rotating C-band 3D radar (TRS-3D) cued to a MIRADOR EO director; a passive ESM suite supports classification and EMCON tactics. The design omits a hull sonar and long-range AAW in favor of range, RHIB operations, and low-crew sustainment in congested coastal waters. Multi-spectral decoys complement the soft-kill doctrine and emphasize survivability close to shore.
Variant1=F260 Braunschweig 
Variant2=F261 Magdeburg
Variant3=F262 Erfurt
Variant4=F263 Oldenburg
Variant5=F264 Ludwighafen am Rhein

[ger_fsg_k130_batch1_late]
Type=FSG,Guided Missile Corvette
Default=K130 Braunschweig-class Batch 1 late, K130
DefaultDescription=Later Batch-1 ships and refitted units are recognizable by enlarged SATCOM/communications radomes and added armor against small caliber guns. The combat system and the sensors stays the same.
Variant1=F260 Braunschweig 
Variant2=F261 Magdeburg
Variant3=F262 Erfurt
Variant4=F263 Oldenburg
Variant5=F264 Ludwighafen am Rhein

[ger_fsg_k130_batch2]
Type=FSG,Guided Missile Corvette
Default=K130 Braunschweig-class Batch 2, K130
DefaultDescription=Batch 2 introduces a modernized sensor/EW suite built around the HENSOLDT TRS-4D rotating AESA and an improved MIRADOR Mk 2 EO director for faster cue-to-track and better small-target handling. The weapons layout remains proven: RBS15 Mk3 for long-range surface attack, two RAM Mk 49 for point AAW, plus a 76/62 Super Rapid and MLG 27 for close-in engagements—now benefiting from higher track quality and doctrine automation. The result is a more connected, quicker-reacting corvette with the same compact punch and an appreciably tougher defensive bubble.
Variant1=F265 Koeln
Variant2=F266 Emden
Variant3=F267 Karlsruhe
Variant4=F268 Augsburg
Variant5=F269 Luebeck

[ger_fsg_k130_batch2_late]
Type=FSG,Guided Missile Corvette
Default=K130 Braunschweig-class Batch 2, K130
DefaultDescription=Batch 2 is defined by the replacement of the older MLG 27 with modern MSI Seahawk 30 mm mounts, giving the corvette a sharper close-in layer against fast boats, drones and low-end asymmetric threats. The upgraded gun fit is backed by a modernized sensor/EW suite built around the HENSOLDT TRS-4D rotating AESA and an improved MIRADOR Mk 2 EO director, allowing faster cue-to-track, more precise target handoff and better small-target handling. RBS15 Mk3 remains the long-range surface-strike weapon, two RAM Mk 49 provide point AAW, and the 76/62 Super Rapid covers the medium gun layer. The result is a more connected, quicker-reacting corvette with a noticeably stronger close-range defensive bubble.
Variant1=F265 Koeln
Variant2=F266 Emden
Variant3=F267 Karlsruhe
Variant4=F268 Augsburg
Variant5=F269 Luebeck


