[SystemNames]

eu_SPEXER_2000_3D_MkIII_Naval=SPEXER 2000 MkIII|Hensoldt SPEXER 2000 3D MkIII Naval is a compact X-band AESA surveillance radar for close-range surface and low-altitude air defence. It is optimized for small and low-signature targets such as UAVs, USVs, fast boats and sea-skimming threats, complementing the ship's main radar and SPQ-9B in the force-protection layer.
eu_VIRGILIUS_R-ECM=VIRGILIUS R-ECM|VIRGILIUS provides the active radar-band countermeasures layer for the KORA 40 electronic-warfare suite. Using distributed ECM transmitters and combat-system cueing, it can apply timed deception, noise and seduction techniques against hostile fire-control radars, missile seekers and targeting emitters, with strongest effect in the ship’s self-defence and task-group escort sectors.




Smart_L_F124=SMART-L|SMART-L (Signaal Multibeam Acquisition Radar for Tracking, L band) is a long-range naval search radar introduced in 2002 by Thales Nederland, formerly Hollandse Signaalapparaten (Signaal).
APAR_F124=APAR|Active Phased Array Radar (APAR) is a shipborne active electronically scanned array multifunction 3D radar (MFR) developed and manufactured by Thales Nederland. The radar receiver modules are developed and built in the US by the Sanmina Corporation.
FL_1800_S_II_ESM=FL 1800 S II ESM|FL 1800 S II is a German naval electronic warfare system that detects and jams radar signals across 0.5–18 GHz. It provides 360° coverage, precise threat tracking, and targeted jamming to protect ships from electronic and radar-guided threats.
DSQS_24C_F124=DSQS 24C||Placeholder for DSQS 24B as not enough is known about the sonar.
FL_1800_S_II_ECM=FL 1800 S II ECM|FL 1800 S II is a German naval electronic warfare system that detects and jams radar signals across 0.5–18 GHz. It provides 360° coverage, precise threat tracking, and targeted jamming to protect ships from electronic and radar-guided threats.
KORA-40_ESM_F124=KORA-40 ESM|A modern digital ESM with wideband receivers and precise direction finding for radar intercept. It classifies emitters via a threat library and provides cues to the combat system and soft-kill suite. The system supports bearings-only target motion analysis to refine contact positions over time. It operates passively and is well suited to contested littoral environments. Data can be shared with allied units to build a common electronic order of battle. It does not provide jamming by itself.
KORA-40_ECM_F124=KORA-40 ECM|A reprogrammable self-protection/escort electronic attack suite paired with KORA-40 ESM. Provides noise and deception techniques against surveillance radars, fire-control radars, and active seekers, using doctrine-driven emissions to manage HOJ risk. Synchronized with decoys via the combat system for screening/seduction effects. Optimized for near-to-medium range escort/self-protection in littorals; not a dedicated standoff jammer. Complements, but does not replace, hard-kill defenses.
TRS-4D_LR_Rot_F124=TRS-4D LR|The TRS-4D LR is a long-range S-band AESA radar developed by HENSOLDT for advanced air and surface surveillance. It provides fast, high-precision 3D detection and tracking of numerous targets for naval and land-based defence systems.


#---------------------------------------- CIWS ----------------------------------------
mlg_27=MLG 27|MLG 27|A stabilized 27 mm remote weapon station intended for close-in ship self defense. It is remotely operated from the combat or bridge console and uses electro-optical sensors for day and night engagement. The mount is gyrostabilized so it can fire accurately in sea state and during maneuvers. Typical targets include small craft, fast inshore attack craft, UAVs, and low, slow air threats inside the inner layer. The weapon can employ burst control and has selectable ammunition types. It is not a CIWS and relies on external cueing for early detection.
Rh202=Rh202|Rheinmetall Rh202|A manually trained and laid 20 mm single gun for close-range self protection. The mount is open and unstabilized, so accuracy depends on sea state and operator skill. It is suited for warning shots, policing, and last-resort defense against small boats at short ranges. Ammunition is typically HE and AP types in simple box magazines. It requires local control on deck and is not integrated with radar fire control. Compared to remote mounts, it offers low complexity but limited combat effectiveness.
SeaSnake_30mm=SeaSnake 30mm|SeaSnake 30mm|A remotely operated 30 mm naval gun system for close-range defense against small craft and aerial targets. A stabilized mount and high rate of fire enable accurate bursts while maneuvering. It can be used as an inner-layer point-defense system depending on doctrine.
eu_hitrole=Hitrole|Hitrole
KORA-40_ESM=KORA-40 ESM|A modern digital ESM with wideband receivers and precise direction finding for radar intercept. It classifies emitters via a threat library and provides cues to the combat system and soft-kill suite. The system supports bearings-only target motion analysis to refine contact positions over time. It operates passively and is well suited to contested littoral environments. Data can be shared with allied units to build a common electronic order of battle. It does not provide jamming by itself.
KORA-40_ECM_F123=KORA-40 ECM (F123)|A reprogrammable self-protection/escort electronic attack suite paired with KORA-40 ESM. Provides noise and deception techniques against surveillance radars, fire-control radars, and active seekers, using doctrine-driven emissions to manage HOJ risk. Synchronized with decoys via the combat system for screening/seduction effects. Optimized for near-to-medium range escort/self-protection in littorals; not a dedicated standoff jammer. Complements, but does not replace, hard-kill defenses.
KORA-40_ECM_F127=KORA-40 ECM (F127)|A higher-power “Escort+” fit on F127, made possible by the class’s increased shipboard generator capacity and larger/aperture-rich placements. Delivers an expanded sector EA bubble and improved multi-emitter handling—especially against X/Ku-band FCRs and active seekers—with precise timing and cueing through the combat system. Emissions remain tightly controlled; this is not a theater standoff system, but a high-grade task group protection suite. Backward-compatible mission libraries ease updates and interoperability.
KORA-18_ESM=KORA-18 ESM|A mid-generation digital ESM covering VHF through Ku bands for passive intercept. It provides bearing, signal parameters, and basic classification of radar and some comms emitters. Bearings can be used for threat warning and for bearings-only localization when combined over time. The system feeds the combat system with emitter tracks to enrich the tactical picture. It is particularly valuable in coastal clutter where radar line-of-sight is limited. As a passive sensor, it does not radiate and preserves emissions control.
KORA-18_ECM=KORA-18 ECM|A defensive ECM suite intended to protect the ship from radar-guided threats. It delivers noise and deceptive jamming techniques tailored to the threat seeker. The suite is integrated with decoy systems to create coordinated soft-kill responses. Operators follow doctrine to minimize ownship exposure while maximizing jamming effect. It is not a replacement for maneuver or kinetic interception. Control is centralized through the EW management function.
UL5000K_ESM=UL 5000K ESM|A shipboard electronic support suite used on K130 to passively intercept and classify radar emitters. It provides bearing, parameters, and threat alerts to the combat system for situational awareness. Bearings over time can assist in localization and cue soft-kill responses. The system is optimized for littoral operations with high clutter and reflections. As a passive sensor it preserves emissions control.
UL5000K_ECM=UL 5000K ECM|A self-protection electronic attack suite providing noise and deceptive techniques against hostile radars and seekers. It is coordinated with decoy launchers to create screening and seduction effects. Emissions are doctrine-controlled to limit ownship exposure and HOJ risks. The suite is intended for close-to-medium-range escort/self-protection, not wide-area standoff jamming. It complements, but does not replace, hard-kill defenses.
FL-1800S_ESM=FL 1800S ESM|A legacy electronic support suite that passively intercepts radar emissions for situational awareness. It measures bearing and characterizes emitters to support threat warning and basic identification. The system contributes to bearings-only localization and complements the ship radar picture. It has no transmission function and therefore does not reveal ownship by itself. Data is typically displayed on the EW console and can be forwarded to the CMS. Performance depends on emitter strength, geometry, and environment.
FL-1800S_ECM=FL 1800S ECM|An electronic countermeasures set that radiates jamming or deceptive techniques for ship self protection. It is used to break or prevent missile seeker locks and to degrade hostile surveillance radars. Techniques and power levels are selected according to the threat and rules of engagement. The system is coordinated with decoy launchers to create combined soft-kill effects. Because it transmits, it may reveal ownship if used outside engagement conditions. It is managed by the EW console and follows doctrine-based fire rules.


CEROS-200_CWI=CEROS-200 CWI|A radar and electro-optical director that includes a continuous-wave illumination mode. It provides high-precision target tracking for gun engagements and semi-active missile endgame guidance. The system offers good resistance to countermeasures using agile waveforms and narrow beams. Electro-optical sensors enable passive tracking in emission-controlled conditions. It is tightly integrated with the combat system for automatic handover and guidance. The director is optimized for point-target control rather than wide-area search.
STIR-180=STIR 1.8|A radar and electro-optical fire-control director with precision tracking capability. The director can provide continuous-wave illumination for semi-active missiles such as ESSM Blk 1 or SM-2 MR. It also supports gun fire control when high accuracy is required against air or surface targets. The optical sensors offer passive tracking when radar emissions are constrained. Tracks from surveillance radars are handed over for terminal engagement. The director is typically mounted on elevated platforms for clear arcs.

SMART-S=SMART-S|A rotating 3D surveillance radar operating in S-band for medium-range air and surface search. It provides range, bearing, and altitude and supports weapon cueing through the combat system. The radar is optimized for weather penetration and manages clutter over sea states common to maritime operations. Track updates are sufficient to handle complex air raids and surface traffic. It complements long-range 2D sets and terminal fire control sensors. It is not a continuous-wave illuminator.
LW08_SATIR=LW08|LW08 is a long-range 2D air-search radar operating in NATO D-band (IEEE L-band). It provides bearing and range but not height, so it is used for early warning and cueing rather than fire control. The rotating slotted array offers wide-area coverage and good detection of high-flying aircraft and raid-size targets. It is commonly integrated with IFF to support air picture compilation in the combat management system. In a task group it shares plots for composite tracks and cueing of 3D radars. It is not a height finder and does not illuminate targets.
TRS-3D_16=TRS-3D/16|A C-band 3D surveillance radar for air and surface search on early K130 units. The rotating array delivers medium-range coverage with good performance against low flyers and small surface targets. Track updates are suitable for cueing weapons and decoys via the combat system. Built-in ECCM and sea clutter processing support operations in congested littorals. It is not a fire-control illuminator and relies on directors for terminal guidance.
TRS-4D_Rot=TRS-4D Rotator|A C-band AESA 3D multi-function radar with a rotating face and electronic beam steering. The system combines wide-area coverage with rapid, agile beam scheduling for complex air pictures. It offers improved detection of sea-skimming and small cross-section threats compared with legacy sets. Tracks are fed directly to the combat system for weapon cueing and decoy coordination. It is not a continuous-wave illuminator.
TRS-4D_NR=TRS-4D/NR|A fixed-panel AESA multi-function radar providing continuous 360° coverage without mechanical rotation. It supports simultaneous air and surface search, track-while-scan, and rapid update rates for dense threat environments. The radar can cue weapons and fire-control sensors, enabling fast reaction against sea-skimming missiles, aircraft, and small surface targets. It is optimized for high track quality and resilience in heavy clutter and ECM.
SPY-6(V)1_CMS330=AN/SPY-6(V)1|A fixed-face S-band AESA radar providing long-range area air and surface surveillance under Aegis control. Composite apertures scale sensitivity and track capacity to handle raids and ballistic/air-breathing threats. Electronic beam agility and advanced ECCM provide resilience in heavy clutter and jamming. The radar supplies high-quality tracks for engagement planning and midcourse updates. It does not provide continuous-wave illumination; terminal needs depend on missile type.
SeaGiraffe_1X=Sea Giraffe 1X|A compact X-band AESA 3D multi-mode radar for simultaneous air and surface surveillance. Electronic beam steering provides fast updates and good performance against sea-skimming and small cross-section targets. The radar supplies stabilized 3D tracks to the combat system for cueing of weapons and decoys. Its X-band operation yields fine angular resolution in the littoral environment. The antenna is light and suited for smaller masts and patrol craft. It is not a dedicated fire-control illuminator and does not replace a director.
SeaGiraffe_4A=Sea Giraffe 4A|An S-band AESA 3D multi-function radar designed for area surveillance and weapon cueing. Electronic beam steering enables high track capacity and rapid refresh in complex air pictures. S-band offers better weather and clutter penetration than X-band, aiding long-range surveillance. The rotating array with electronic beams combines mechanical coverage with agile waveform control and ECCM. The radar feeds high-quality tracks to the combat system for air and surface engagements. It does not provide continuous-wave illumination.

Pathfinder_ST_Mk2_X=Raytheon Pathfinder ST Mk2 (X-band)|An IMO-compliant navigation radar operating in X-band with an open-array slotted antenna. It provides the high-resolution surface picture used for conning, collision avoidance, and ARPA tracking. Sea and rain clutter controls allow reliable operation in coastal waters and bad weather. The radar shares navigation tracks and overlays with the ship's electronic chart system. Instrumented ranges up to 96 nautical miles are available, but detection is limited by radar horizon and target size. It is not a fire-control illuminator and does not provide missile guidance.
Pathfinder_ST_Mk2_S=Raytheon Pathfinder ST Mk2 (S-band)|A long-range navigation radar operating in S-band with a larger open-array antenna. S-band operation offers better performance in rain and sea clutter for wide-area awareness. The system supports ARPA and integration with the bridge network and combat system picture. It complements the X-band set by providing a stable plot at extended ranges. The antenna typically rotates at standard navigation speeds suitable for shiphandling. It is not a weapon director and does not illuminate targets.
SharpEye_X=SharpEye X-band|A solid-state X-band navigation radar with Doppler processing for small target detection. It provides the conning surface picture and ARPA tracks and integrates with bridge and combat systems. X-band operation yields high resolution in coastal waters but is horizon-limited. Sea and rain clutter suppression maintains usable returns in poor weather. It is not a weapon director and does not illuminate targets.
SharpEye_S=SharpEye S-band|A solid-state S-band navigation radar for wide-area surface awareness in adverse weather. Longer wavelength improves performance through rain and sea clutter compared with X-band. The radar supports ARPA and picture sharing with bridge and combat systems. It complements the X-band set for a stable long-range surface plot. It is not intended for fire control or missile guidance.

Mirador_Mk1=Thales MIRADOR Mk 1|An electro-optical fire-control director with day TV, thermal imager, and laser rangefinder. It provides passive detection, tracking, and gunfire control for the main gun in emission-controlled conditions. Tracks can be slaved from surveillance radars for terminal aim. The director also supports identification and battle damage assessment. It is not a CW illuminator for semi-active missiles.
Mirador_Mk2=Thales MIRADOR Mk 2|An upgraded EO director with improved sensors, stabilization, and automatic tracking. Enhanced thermal imaging and processing extend night and haze performance. It supports precise gunfire control and passive tracking with faster lock-on and handover. The director integrates with the combat system for automated cueing and engagement support. It remains a passive electro-optical system without CW illumination.
MSP600=MSP600|A stabilized electro-optical director with day TV, thermal imager, and laser rangefinder. It enables passive detection and tracking when radar emissions are undesirable. The director provides ranges for light weapons such as MLG 27 and supports surveillance tasks. Video and track data can be distributed to the combat system for cueing. Stabilization allows operation in moderate sea states. It is not a radar and cannot illuminate targets.
GatekeeeperMk2=Gatekeeper Mk2|A passive electro-optical/infrared surveillance and tracking system optimized for close-range threats. It provides wide-area panoramic coverage with automatic detection and track initiation for small surface contacts and low-signature targets. Gatekeeper Mk2 complements radar by delivering visual/IR confirmation, precise bearing/elevation, and classification support without emitting. It is especially effective in cluttered littoral environments and during EMCON operations.


DSQS_23BZ=DSQS-23BZ|An Atlas Elektronik medium-frequency hull-mounted sonar for anti-submarine warfare. It supports active and passive search, classification, and torpedo warning functions. The sonar is optimized for littoral conditions where reverberation and shipping noise are high. Data is fused with towed arrays and helicopter sonars to form a coherent underwater picture. The system cues shipborne and airborne weapons for prosecution. Performance depends on ocean environment and platform radiated noise.
ACTAS=ACTAS|An Atlas Elektronik low-frequency active towed array / variable depth sonar (VDS) system designed for long-range anti-submarine warfare. By operating at controlled depth, it mitigates surface-layer effects and improves detection in challenging littoral and deep-water environments. It provides active and passive search, classification, tracking, and torpedo warning support, and can cue shipborne weapons and helicopters. Performance is highly dependent on ocean conditions and platform self-noise.
ASO_713=ASO 713|An Atlas Elektronik 4th-generation medium-frequency hull-mounted sonar for anti-submarine warfare. It supports active and passive search, classification, and tracking, optimized for demanding littoral conditions with high reverberation and shipping noise. The sonar contributes to the ship’s local underwater picture and can be fused with towed arrays and airborne sonars for prosecution and weapon cueing. Performance depends on ocean environment and platform radiated noise.
ASO_723=ASO 723|An Atlas Elektronik 4th-generation medium-frequency hull-mounted sonar positioned as a higher-capability variant within the ASO family. It supports active and passive search, classification, and tracking with improved performance in complex acoustic environments, including shallow water and high-clutter scenarios. The system integrates into the ship’s ASW suite to provide continuous close-to-medium range coverage and cue shipborne and airborne ASW assets. Performance depends on ocean environment and platform radiated noise.
EFAS=EFAS
FAS-3-1=FAS-3-1
FAS-3-1_L=FAS-3-1
FAS-3-1_R=FAS-3-1
OTO76-62_SuperRapid=Leonardo 76/62 Super Rapid|Leonardo 76/62 Super Rapid|A modernized variant of the widely used OTO Melara (now Leonardo) 76 mm naval gun featuring an increased rate of fire, improved drive systems, and compatibility with advanced ammunition types. The Super Rapid mount sustains up to 120 rounds per minute and integrates automated handling that allows rapid switching between HE, PFF, and specialized extended-range or anti-missile rounds depending on configuration. When paired with a contemporary fire-control director or EO/IR tracker, it provides effective close- to mid-range defense against missiles, aircraft, and surface threats. The system offers higher engagement performance than the Compact model while retaining similar weight and footprint.
OTO76-62=OTO Melara 76/62 Compact|OTO Melara 76/62 Compact|A 76 mm multi-role naval gun widely fitted to frigates and corvettes. It can engage air, surface, and limited shore targets with high rate of fire. The compact mount integrates ready-use ammunition below the shield for rapid bursts. Fire control is provided by a director such as STIR or an EO tracker depending on doctrine. The system offers a balance of weight, volume, and firepower for medium ships. It is distinct from the Super Rapid variant that has a higher cyclic rate.
OTO127-64_LW=Leonardo 127/64 LW|Leonardo 127/64 Lightweight|A 127 mm naval gun for naval surface fire support and anti-surface engagements. It can employ conventional and guided extended-range ammunition. Fire control is typically provided by the ship combat system using radar and/or EO directors depending on doctrine.
exocet_twin=MM38 Twin Launcher|Exocet MM38 twin launcher|A legacy twin canister launcher for the Exocet MM38 anti-ship missile. The canisters are deck-mounted and angled to provide safe launch arcs. The system interfaces with the ship combat system for targeting and firing authorization. It represents an earlier generation of surface-to-surface capability with subsonic sea-skimming missiles. Maintenance centers on canister condition and system interlocks. The launcher is retained on some ships for training or legacy capability.
MK41_Quad=Mk41 VLS|Mk41 VLS|A modular vertical launching system capable of quad-packing ESSM and carrying other compatible missiles. The system supports rapid 360 degree engagements under combat system control. Launch sequence and safety interlocks are fully integrated with sensors and doctrine. Cells can be configured by mission with a mix of air defense and other payloads as authorized. The launcher itself does not guide missiles; midcourse updates and terminal guidance depend on missile type. Strike-length and tactical-length modules are part of the family but are configured per ship.
MK41_VLS=Mk41 VLS|Mk41 VLS|A modular vertical launching system used for area air defense and other missile roles. It consists of canisterized cells controlled by the combat system for rapid firing. The launcher architecture supports mixed loads to tailor capability to the mission. Safety, monitoring, and cooling are integral to the module design. The system relies on ship sensors and data links for target information. Terminal guidance requirements vary by missile and are not provided by the launcher.
MK49_animated=Mk49 RAM|Mk49 RAM|A 21-cell launcher for the RIM-116 RAM point-defense missile. It provides quick-reaction engagements against sea-skimming missiles and aircraft under combat system control. The launcher slews to target cues from radar/EO sensors and fires canisterized missiles for short-range self-defense.
HEL=HEL|Rheinmetall High Energy Laser|A directed-energy close-in weapon system concept. It uses a high-power laser to defeat small UAVs and degrade or destroy targets at short range. Effectiveness depends on tracking quality, dwell time, atmospheric conditions, and target construction.

MASS=MASS|The Multi Ammunition Softkill System is a programmable decoy launcher for RF, IR, and EO countermeasures. It creates screening and seduction effects to confuse missile seekers and hostile sensors. Salvos are planned by doctrine and synchronized with ship maneuvers and ECM. The system can generate multi-spectral coverage to counter different seeker types. Integration with the combat system enables automatic or semi-automatic firing in threat scenarios. It does not destroy threats but reduces their probability of hit.
MASS_ATD=MASS ATD|An optional anti-torpedo decoy add-on to MASS that launches expendable acoustic effectors. The effectors are used to draw off or confuse incoming torpedoes in conjunction with maneuvers. Firing is coordinated with ship sonar warnings and engagement doctrine. The system extends soft-kill protection into the underwater domain without committing a hard-kill effector. It is limited by inventory and environment-dependent performance. It complements, but does not replace, active anti-torpedo systems.

MK41_vls_1=Mk41 forward battery|Mk41 forward battery|
MK41_vls_2=Mk41 aft battery|Mk41 aft battery|
