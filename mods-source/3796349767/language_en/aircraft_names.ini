DefaultDescription=The YF-23 was Northrop's entry in the US Air Force's Advanced Tactical Fighter competition, developed with McDonnell Douglas. The first prototype flew on August 27, 1990, and both aircraft supercruised, the second passing Mach 1.6 without afterburner. It was considered stealthier and faster than the rival YF-22, but on April 23, 1991 the Air Force chose Lockheed's design. A naval version was offered for the Navy's NATF program before that program was dropped.\nThis carrier YF-23 imagines the path not taken, with internal weapons bays, a 20 mm M61 cannon, radar, infrared search and track and defensive electronics.
