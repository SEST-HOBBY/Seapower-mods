[Language_en]
Name=02 Long Reach
Description=Escort two sealift ships through the corridor and stop the Russian strike aircraft.
Objective_Primary=Escort both sealift ships and defeat or drive off the strike package.
Objective_Support=Preserve Hawkeye and the cruiser.
Execution=Title=EXECUTION ORDER\nBody=The convoy is linked in line astern; its cruiser screen follows the lead ship. WIDOW is a fighter section. Use Hawkeye warning to intercept the strike pairs. Protect both sealift ships through the 25-minute check and their western checkpoint. Aircraft reaching the enemy egress sector count as driven off.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Intro
Outcome2=Title=MISSION FAILED\nBody=A military sealift ship was lost.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Outcome3=Title=MISSION FAILED\nBody=Both YF-23s were lost.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Outcome4=Title=MISSION FAILED\nBody=Protected commercial shipping was lost.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Area1=EGRESS
StrikeClear=Title=STRIKE PACKAGE CLEAR\nBody=The four strike aircraft are destroyed or withdrawing. Continue convoy protection and clear any incoming weapons.\nButtonText=Continue\nPopupStyle=Notification
Area2=CONVOY
Outcome6=Title=MISSION COMPLETE\nBody=Both sealift ships passed the corridor. The strike package is destroyed or withdrawn and incoming weapons are clear.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Outcome8=Title=MISSION FAILED\nBody=The assigned operating window has closed. Operation terminated.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro

