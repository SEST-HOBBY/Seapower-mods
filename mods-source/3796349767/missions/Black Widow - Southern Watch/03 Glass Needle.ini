[Language_en]
Name=03 Glass Needle
Description=Destroy the coastal radar and military stores, then withdraw both strike aircraft.
Objective_Primary=Destroy both targets and withdraw both strike aircraft.
Objective_Radar=Destroy the coastal surveillance radar.
Objective_Depot=Destroy the military stores compound.
Objective_Support=Preserve both escorts and Hawkeye.
Execution=Title=EXECUTION ORDER\nBody=Two linked strike aircraft, two linked fighter escorts and Hawkeye are airborne. Select each flight leader to command its section. Four GBU-12s total; assign the radar and stores separately. Destroy both military targets and withdraw BOTH strike aircraft. Civilian communications must survive.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Intro
Area1=STRIKE EXIT
Outcome5=Title=MISSION COMPLETE\nBody=Both military targets destroyed and both strike aircraft clear of the coast.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
TargetsDone=Title=WITHDRAW STRIKE SECTION\nBody=Both targets destroyed. Bring BOTH strike aircraft to the offshore circle at 15,000 feet. Escort their withdrawal.\nButtonText=Continue\nPopupStyle=Notification
Outcome7=Title=MISSION FAILED\nBody=A strike aircraft was lost.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Outcome8=Title=MISSION FAILED\nBody=Protected civilian communications were destroyed.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Outcome10=Title=MISSION FAILED\nBody=The assigned operating window has closed. Operation terminated.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro

