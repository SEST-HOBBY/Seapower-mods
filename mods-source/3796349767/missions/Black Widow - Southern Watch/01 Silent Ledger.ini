[Language_en]
Name=01 Silent Ledger
Description=Classify both reconnaissance contacts as hostile, then withdraw both fighters. Fictional 2025 operation; requires F-23A Block 40 and Block 40 Strike.
Objective_Primary=Classify both scouts and withdraw both fighters.
Objective_Unseen=Keep both fighters unclassified.
Execution=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=EXECUTION ORDER\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=Two fighters are airborne in Vic. Classify BOTH scouts as hostile before withdrawing. Radar OFF, weapons HOLD. Neutral traffic is protected. The extraction gate opens after confirmation.\nButtonText=Acknowledge\nPopupStyle=NavalMessage\nMessageRole=Intro
Outcome2=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=MISSION FAILED\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=A scout was destroyed before the reconnaissance task was complete.\nButtonText=Acknowledge\nPopupStyle=NavalMessage\nMessageRole=Outro
Area1=WITHDRAW BOTH FIGHTERS
Outcome3=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=MISSION COMPLETE\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=Both scouts classified and both fighters clear of the patrol sector.\nButtonText=Acknowledge\nPopupStyle=NavalMessage\nMessageRole=Outro
ReconDone=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=CONTACTS CONFIRMED\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=Both contacts are classified. Withdraw BOTH fighters to the western circle at 26,000 feet.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Reaction=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=PATROL REACTION\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=Enemy fighters are moving west. Continue the reconnaissance or withdraw once both contacts are confirmed.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
