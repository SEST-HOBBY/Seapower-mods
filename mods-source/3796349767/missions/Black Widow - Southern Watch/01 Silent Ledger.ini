[Language_en]
Name=01 Silent Ledger
Description=Identify the approaching aircraft, protect the sealift transit, then withdraw both fighters.
Objective_Primary=Resolve the reconnaissance package, screen sealift, and recover both YF-23s.
Objective_Recon=Resolve the maritime patrol and fighter contacts.
Objective_Transit=Protect sealift and Hawkeye through the exposed transit.
Objective_Screen=Preserve the cruiser.
Execution=Title=EXECUTION ORDER\nBody=The selected YF-23 leads a two-aircraft section. Screen the sealift corridor with Hawkeye and the cruiser. Resolve the Russian patrol aircraft and lead fighter, protect the transit through 18 minutes, then bring both YF-23s to the western handoff. Radar use authorized; weapons TIGHT.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Intro
Area1=HANDOFF
Outcome2=Title=MISSION COMPLETE\nBody=The reconnaissance package was resolved, sealift passed the exposed sector, and both fighters reached the handoff.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Picture=Title=AIR PICTURE RESOLVED\nBody=Both required contacts have been resolved. Maintain cover until the 18-minute transit check is complete.\nButtonText=Continue\nPopupStyle=Notification
Area2=SEALIFT
Handoff=Title=RECOVERY RELEASE\nBody=Reconnaissance and transit tasks complete. Bring BOTH YF-23s to the western circle at 26,000 feet. Continue protecting Hawkeye and sealift until mission end.\nButtonText=Continue\nPopupStyle=Notification
Outcome7=Title=MISSION FAILED\nBody=A fighter in the assigned section was lost.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Outcome8=Title=MISSION FAILED\nBody=Sealift or Hawkeye was lost.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Outcome9=Title=MISSION FAILED\nBody=Protected commercial shipping was lost.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Outcome11=Title=MISSION FAILED\nBody=The assigned operating window has closed. Operation terminated.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro

