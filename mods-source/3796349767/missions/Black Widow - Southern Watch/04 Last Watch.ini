[Language_en]
Name=04 Last Watch
Description=Defend Nimitz against two strike pairs approaching from the east and northeast.
Objective_Primary=Protect Nimitz and defeat or drive off both strike pairs.
Objective_OriginalCAP=Preserve the original CAP section.
Objective_Support=Preserve Hawkeye and both escorts.
Execution=Title=EXECUTION ORDER\nBody=Nimitz, a cruiser and a destroyer, Hawkeye and the linked CAP section are on station. Four reserve YF-23s are aboard; the first pair is queued for ready-up. Launch reserves to cover the second approach. Protect Nimitz through the 30-minute check and until both strike pairs are destroyed or withdrawing.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Intro
Outcome2=Title=MISSION FAILED\nBody=Nimitz was lost.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Outcome3=Title=MISSION FAILED\nBody=Protected commercial shipping was lost.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
Area1=EGRESS
RaidClear=Title=RAIDS CLEAR\nBody=The four strike aircraft are destroyed or withdrawing. Maintain group defense until incoming weapons clear and the 30-minute watch is complete.\nButtonText=Continue\nPopupStyle=Notification
Outcome5=Title=MISSION COMPLETE\nBody=Nimitz survived the watch, both strike pairs are destroyed or withdrawn, and incoming weapons are clear.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro
ReserveCue=Title=RESERVE SECTION\nBody=Check the first reserve pair in Flight Deck and launch when ready. Keep one section covering the northeastern sector. Track fuel and missile state.\nButtonText=Continue\nPopupStyle=Notification
Outcome9=Title=MISSION FAILED\nBody=The assigned operating window has closed. Operation terminated.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro

