[Language_en]
Name=04 Last Watch
Description=Protect Nimitz against four bombers on two raid axes. Fictional 2025 operation; requires F-23A Block 40 and Block 40 Strike.
Objective_Primary=Destroy all four bombers and protect Nimitz.
Objective_OriginalCAP=Preserve both original airborne fighters.
Execution=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=EXECUTION ORDER\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=Nimitz and the airborne pair are in position. Four additional F-23s are aboard; the first reserve pair is queued. Launch reserves through Flight Deck. Four bombers approach on eastern and northeastern axes.\nButtonText=Acknowledge\nPopupStyle=NavalMessage\nMessageRole=Intro
Outcome2=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=MISSION FAILED\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=Nimitz was lost.\nButtonText=Acknowledge\nPopupStyle=NavalMessage\nMessageRole=Outro
Outcome3=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=MISSION FAILED\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=A protected neutral vessel was lost.\nButtonText=Acknowledge\nPopupStyle=NavalMessage\nMessageRole=Outro
BombersDown=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=BOMBERS DESTROYED\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=All four bombers are down. Defend against any missiles still inbound.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Outcome5=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=MISSION COMPLETE\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=All four bombers destroyed, incoming weapons clear and Nimitz afloat.\nButtonText=Acknowledge\nPopupStyle=NavalMessage\nMessageRole=Outro
Reserves=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=FLIGHT DECK\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=Launch the reserve pair when ready. Keep coverage for the northeastern axis; check each aircraft for fuel and missiles.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Outcome8=From=CTF 57\nTo=BLACK WIDOW DETACHMENT\nSubj=MISSION FAILED\nPrecedence=Priority\nClassification=Secret\nTemplate=USAUSNavy\nBody=The assigned operating window has closed. Operation terminated.\nButtonText=Acknowledge\nPopupStyle=NavalMessage\nMessageRole=Outro

