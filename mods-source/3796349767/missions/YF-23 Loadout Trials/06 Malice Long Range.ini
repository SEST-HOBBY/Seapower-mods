[Language_en]
Name=06 Malice Long Range
Description=One YF-23 with two AIM-424s faces a Tu-16 approaching from 180 nm at 40000 feet. Enable radar and order an AIM-424 attack. Observe bay opening, clean drop, visible motor ignition and guidance. Long straight tracks prevent repeated course reversals. The 255 nm circle is an upper envelope, not a guaranteed shot against every target.
Objective_Primary=Destroy the target and keep your YF-23 airborne.
Start=Title=MALICE LONG RANGE\nBody=One YF-23 carries two AIM-424s. A Tu-16 approaches from 180 nm at 40000 feet and holds fire. Keep radar on and order an AIM-424 attack when tracking permits. Observe release and guidance. Range depends on flight conditions; this is not a guaranteed-range demonstration.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Intro
Win=Title=TARGET DESTROYED\nBody=Trial complete. Continue observing the aircraft or exit the scenario.\nButtonText=Continue\nPopupStyle=Notification
Loss=Title=AIRCRAFT LOST\nBody=Restart the trial to try again.\nButtonText=Continue\nPopupStyle=Notification\nMessageRole=Outro

