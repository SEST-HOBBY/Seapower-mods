[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=4.9                     // in meters
Beam=1.7                      // in meters
Range=200                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=2  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=23mm AAA ZSU-23-4 Technical
Tag=Ground+Vehicle

[Physics]
HorsePower=97
Mass=1.5                       // in tons

MaxForwardVelocity=81          // in knots
MaxBackwardVelocity=15         // in knots
Braking=20                     // knots/sec
TurnRate=48                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=AAW,Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destructable
Integrity=3

[SensorData]
#Visual
VisualIdentificationRange=4  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.03,0.025
ModuleType=Bridge

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #FIM launcher
Type=Missile
SystemName=FIM_Man
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Launcher
NumberOfContainers=1
Container1=Launcher
AreContainersRotatable=True
#Angles
FixVerticalLaunchAngle=False
AdditionalFixVerticalLaunchAngle=4
ElevationArc=-10,80
RestAngles=0,25
LoadAngles=-10,25
#Loading
AssociatedMagazine=WeaponMagazineTOW
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
WorksStandalone=True
MaxReactiontime=2.5
VIDIncrease=6  // In miles. Flat base VID increace when firing.
ModuleType=Weapon


[---------- WeaponMagazines ----------]
############################################################
# Weapon Magazine Systems
############################################################
[WeaponMagazineTOW]
NumberOfAmmunitionTypes=1
Ammunition1=usa_fim-92
Ammunition1_Count=8
ModuleType=SmallMagazine

#Enemy units will use this local coordinates to aim their attacks to
[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=0.0021,0.015,-0.0059
TargetPointAssociatedSystems1=WeaponSystem1
TargetPointPriority1=High

[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/land_units/car_pickup/
ResourcesRoot=car_pickup.obj
ResourcesMesh=car_pickup
ResourcesMaterialFolder=ground objects/civ_car_pickup_1983/
ResourcesMaterial=civ_car_pickup_1983_mat
############################################################

[Submodels]
Details=Details
Submodel1=Turret
Submodel2=Launcher

[Details]
Mesh=car_pickup_1983_type63_cargo
ResourcesMaterialFolder=ships/materials/
Material=ms_cargoatlas
Position=0,0,0
Rotation=0,0,0

[Turret]
Mesh=crew_fim
ResourcesMaterialFolder=ships/materials/
Material=usn_crew
Position=0,0.017926,-0.015442

[Launcher]
Mesh=launcher_fim
Material=FIM_Launcher_mat.ini
Parent=Turret
Position=0,0.015911,-0.005905
Rotation=25,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1


[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.018,-0.002
Rotation=0,0,0
Scale=0.04,0.036,0.086

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default