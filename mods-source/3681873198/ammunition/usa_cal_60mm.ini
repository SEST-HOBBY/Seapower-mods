#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Grad
# Users:
Type=MLRS                     // can be Projectile, Missile, RBU, ASROC, Torpedo,AerialRocket,MLRS
TargetType=ASuW                         // can be AAW, ASuW, ASW

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
RCS=Tiny

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=5
ImpactSize=medium                      // Impact size, can be small, medium, large, verylarge
Penetration=heavy                     // can be minor, moderate, heavy, always

FuzeProximityDistance=6                // for proximity fuze: distance to target in meter

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
AxialRotation=60                      // In degrees per second. Doesnt work when "SupportsBanking" is true
#========================================= Launch stats ============================================================
MaxVelocity=563                       // Maximum speed in knots
Acceleration=140                       // Acceleration factor
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.25                       // Minimum launch range in nautical miles
MaxLaunchRange=1.89                      // Maximum launch range in nautical miles

LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=0             // Circular error radius in meter
#Homing
#ECCM
#GravityFactor=32.0
# Torpedo related
#SelfDestruct
