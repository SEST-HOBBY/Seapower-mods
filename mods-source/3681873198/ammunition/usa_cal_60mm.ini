AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat
############################################################
NumberOfSubModels=0

