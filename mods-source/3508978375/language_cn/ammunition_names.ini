# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------
usn_jsm=联合攻击导弹,,反舰,是由挪威康斯伯格防务与航空航天公司和美国雷神导弹与防御公司共同研发的多用途空射巡航导弹。
#-----------Land Strike only missiles---------
usn_jsm_land=联合攻击导弹,,对地攻击,是由挪威康斯伯格防务与航空航天公司和美国雷神导弹与防御公司共同研发的多用途空射巡航导弹。

usn_gbu-31_v1=GBU-31(V)1,杰达姆,对地攻击,联合直接攻击弹药,是由波音公司为美国海军和空军联合开发的一种空投炸弹配件，装在由飞机施放的传统炸弹上，将本来无控的传统航空炸弹转变为可控，并能在恶劣气象条件下使用的精确制导武器。

usn_gbu-53=GBU-53,破风者,对地攻击,GBU-53是一款空射精确制导滑翔炸弹。该炸弹由雷神公司开发。在最初的竞标中波音与洛克希德·马丁所组成的团队曾赢得该弹的合约，但因达琳·德鲁云贪污案而被搁置了几年，到2005年9月才重新竞标。

