[AmmunitionNames]
# ------------------ AAM ------------------
usn_aim-9m=AIM-9M,响尾蛇,空对空,AIM-9M响尾蛇是美国的红外制导空对空导弹，M型在L型的基础上增加了抗干扰能力，且采用了低尾焰发动机，不容易在近距离使用时被发现。

usn_aim-9x=AIM-9X,响尾蛇,空对空,AIM-9X响尾蛇是美国的红外制导空对空导弹，X型进行了大幅度的升级，拥有强大的抗干扰能力更远的射程，以及令人印象深刻的越肩发射能力。

usaf_aim-120c7=AIM-120C-7,阿姆拉姆,空对空,AIM-120是美国的的主动雷达制导空对空导弹，用于取代老旧的麻雀半主动雷达制导空对空导弹，其体积小巧。可以被大部分飞机携带。

usaf_aim-120d=AIM-120D,阿姆拉姆,空对空,AIM-120是美国的的主动雷达制导空对空导弹，用于取代老旧的麻雀半主动雷达制导空对空导弹，其体积小巧。可以被大部分飞机携带。

usn_aim-174b=AIM-174B,神枪手,空对空,AIM-174B神枪手空对空导弹是由美国国防承包商雷神公司为美国海军研发的一种远程空对空导弹。美国海军将AIM-174B描述为SM-6的“空射版”。目前只有F/A-18E/F 超级大黄蜂战机能够携带和发射AIM-174B。
