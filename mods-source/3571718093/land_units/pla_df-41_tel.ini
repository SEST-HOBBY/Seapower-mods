[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.35
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=30                      // in meters
Beam=3                         // in meters
Range=270                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=DF-41
Tag=Ground+Vehicle

[Physics]
HorsePower=1500
Mass=40                        // in tons

MaxForwardVelocity=25          // in knots
MaxBackwardVelocity=5          // in knots
Braking=16                      // knots/sec
TurnRate=15                    // in degrees per second

[AI]
UnitScoreValue=1             // value for calculation of mission score
Role=ASuW

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_pla_df-41

