[AN/ASQ-170_TADS/PNVS] #AN/ASQ-170 TADS IR Navigation/targeting detector
Kind=Visual
#Infrared
VIDRangeMultiplier=2.2          // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=2.9           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.7            // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

