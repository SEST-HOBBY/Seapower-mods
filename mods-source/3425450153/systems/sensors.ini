[AN/APG-78]
#Users: usa_ah-64d
Kind=Radar
Type=DirectedSearch             // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface           // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True  // True means the radar can see ground objects
ViewArcs=-181,181|-30,30      // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=0.9      // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=256       // if applicable number of targets it can track simultaneously
WeaponChannels=16       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=10                 // revolutions per minute
MinRange=0.3        // (400 m)
MaxRange=16         // (40 nmi)
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=4000          // max altitude in meters, relevant for air, unused for surface
RangeResolution=15    // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.1         // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=140               // gain in dB on the sensor
Frequency=Ka-Band      // frequency band
PeakPower=25         // output peak power in kW
ModuleType=SmallSensor

