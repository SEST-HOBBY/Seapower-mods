usa_agm-114b_misaka=AGM-114B,Hellfire,Land Attack,The AGM-114 Hellfire is an American missile developed for anti-armor use,[6] later developed for precision[7] drone strikes against other target types, especially high-value targets.[8] It was originally developed under the name "Heliborne laser, fire-and-forget missile", which led to the colloquial name "Hellfire" ultimately becoming the missile's formal name.[9] It has a multi-mission, multi-target precision-strike ability and can be launched from multiple air, sea, and ground platforms, including the MQ-1 Predator and MQ-9 Reaper. The Hellfire missile is the primary 100-pound (45 kg) class air-to-ground precision weapon for the armed forces of the United States and many other countries. It has also been fielded on surface platforms in the surface-to-surface and surface-to-air roles.

usa_agm-114k_misaka=AGM-114K,Hellfire II,Land Attack,The AGM-114 Hellfire is an American missile developed for anti-armor use,[6] later developed for precision[7] drone strikes against other target types, especially high-value targets.[8] It was originally developed under the name "Heliborne laser, fire-and-forget missile", which led to the colloquial name "Hellfire" ultimately becoming the missile's formal name.[9] It has a multi-mission, multi-target precision-strike ability and can be launched from multiple air, sea, and ground platforms, including the MQ-1 Predator and MQ-9 Reaper. The Hellfire missile is the primary 100-pound (45 kg) class air-to-ground precision weapon for the armed forces of the United States and many other countries. It has also been fielded on surface platforms in the surface-to-surface and surface-to-air roles.

usa_agm-114l_misaka=AGM-114L,Longbow Hellfire,Land Attack,Longbow Hellfire, is a fire-and-forget weapon: equipped with millimeter-wave (MMW) active radar homing, it requires no further guidance after launch—even being able to lock on to its target after launch[18]—and can hit its target without the launcher or other friendly unit being in line of sight of the target. It also works in adverse weather and battlefield obscurants, such as smoke and fog, which can mask the position of a target or prevent a designating laser from forming a detectable reflection.

