# ------------------ AAM ------------------
usa_aim-92_misaka=AIM-92,Stinger,AAM,The FIM-92 Stinger is an American man-portable air-defense system (MANPADS) that operates as an infrared homing surface-to-air missile (SAM). It can be adapted to fire from a wide variety of ground vehicles, and from helicopters and drones as the Air-to-Air Stinger (ATAS). It entered service in 1981 and is used by the militaries of the United States and 29 other countries. It is principally manufactured by Raytheon Missiles & Defense and is produced under license by Airbus Defence and Space in Germany and by Roketsan in Turkey.

uk_starstreak=Starstreak​,,AAM,Starstreak​ is a British-led, man-portable, short-range air defence missile system renowned for its hypersonic speed and unique laser beam riding guidance.
