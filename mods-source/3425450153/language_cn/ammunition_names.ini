usa_agm-114b_misaka=AGM-114B,地狱火,空对面,AGM-114地狱火导弹（AGM-114 Hellfire）是一种多平台、多目标的美国制导弹，AGM意为“空对地”，即后来的空对面导弹。主要用于反战车，但后期型号也被用于无人机攻击，精确打击高价值目标等。[3]最初导弹名为“直升机激光导引射后不理导弹”（Heliborne laser, fire-and-forget），后以英文名称的缩略“地狱火”为其正式名称而广为人知。[4]AGM-114具备多任务、多目标精确打击的能力，重约为45公斤（100磅），可以从海陆空多种不同载台发射，包括MQ-1捕食者无人攻击机。目前服役于美国等多个国家，后期型号也具备一定的地对地和地对空打击能力。

usa_agm-114k_misaka=AGM-114K,地狱火II,空对面,轻型AGM-114F，机身较短，射程8公里，电子保险箱和布防装置。使用AGM-114F串联HEAT弹头用于打击装甲目标。

usa_agm-114l_misaka=AGM-114L,长弓地狱火,空对面,长弓地狱火，是一种一劳永逸的武器：配备毫米波（MMW）主动雷达寻的，发射后不需要进一步的制导——甚至能够在发射后锁定目标——并且可以在发射器或其他友方单位不在目标视线内的情况下击中目标。它还适用于恶劣天气和战场遮挡物，例如烟雾和雾，可以掩盖目标的位置或防止指定激光形成可检测的反射。

uk_brimstone_l_heli=硫磺石,激光,对地攻击,

uk_brimstone_mmw_heli=硫磺石,毫米波,对地攻击,

