# ------------------ AAM ------------------
usa_aim-92_misaka=AIM-92,毒刺,空对空,FIM-92毒刺便携式防空导弹（英语：FIM-92 Stinger，又称毒刺防空导弹）中文一般称为便携式防空导弹或肩射导弹，为小型便携式防空导弹，采用红外线制导热追踪以及紫外线物体追踪，由美国研发并使用于所有美军部队，1981年服役至今。在美国和其他29个国家中。主要由雷神公司制造，授权德国的EADS和土耳其的ROKETSAN生产导弹，已经生产超过70,000枚导弹。

uk_starstreak=星光,,空对空,星光导弹是由英国主导研制的一款超高速、激光驾束制导的便携式近程防空导弹系统，以其极高的飞行速度和独特的制导方式而闻名。
