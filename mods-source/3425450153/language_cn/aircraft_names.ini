[usa_ah-64d]
Type=攻击直升机
Default=AH-64D,AH-64D 阿帕奇
DefaultDescription=AH-64D长弓阿帕奇（Apache Longbow）是搭载了先进的感测与武器系统的改良型。D型与A型最大的不同，在于主旋翼上方装置了AN/APG-78长弓毫米波雷达系统。由于雷达装置的位置较高，使得AH-64D可以藏匿于掩蔽物（如高地、树木、建筑物等）的后方进行侦测与攻击，也可藉内建的调制解调器与其他没有观测到目标的AH-64D交换攻击目标信息。因此只要一架AH-64D露出雷达观测目标，就可以与多架AH-64D协同进行攻击，大幅增加了攻击的效率与安全性。而毫米波雷达也可拆卸并安装于其他同型直升机上，即使是未配备毫米波雷达，但仍搭载了先进武器系统的AH-64，也同样称为AH-64D长弓。目前美军服役于伊拉克与阿富汗的AH-64D即未配备毫米波雷达，因为当地并无对装甲部队攻击的需求。

Squadron1=AH-64D,AH-64D
