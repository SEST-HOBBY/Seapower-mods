#-----------Land Strike only missiles---------
wp_9m114=AT-6,Spiral,Anti Tank,The 9M114 is a Soviet anti-tank guided missile, originally called the AS-8 by NATO and later the AT-6 "Spiral". The "Kokon" can be deployed on a variety of platforms, including the Mi-24 and the 9P149 "Shturm-S" tank destroyer based on the MT-LB armored personnel carrier after 1979. There is also a ship-borne version of the missile, with six missiles mounted on the launcher.
