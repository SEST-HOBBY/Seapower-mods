#-----------Land Strike only missiles---------
wp_9m114=9M114,蚕茧,反坦克,9M114是苏联反坦克导弹，北约最初称之为AS-8后该称AT-6“螺旋”，“蚕茧”可以部署在各种平台上，包括米-24和1979年以后的基于MT-LB装甲输送车的9P149“风暴-S”坦克歼击车。除此以外还有一款该导弹的舰载版本，发射器以上装有六枚导弹。
