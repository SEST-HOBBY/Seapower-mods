DefaultDescription=米-24是苏联的第一种专用武装直升机。米-24主要用于为己方部队开辟前进通道，清除防空火力和各种障碍，担负护航任务，还可以载8-10名士兵，由于在高原飞行时速度很快，会使得坠落事件发生可能性增大，并且自身目标大，很容易被敌军防空武器击落。
