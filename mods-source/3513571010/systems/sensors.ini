[KPS-53A] #Thermal Targeting Sight/FLIR
#Users: wp_mi-24v
Kind=Visual
#Infrared
UseIRValues=True
VIDRangeMultiplier=1.5           // Target VID range multiplied by this for identification check
MaxRangeMultiplier=2.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=1             // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1               // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

[KPS-53L] #Laser ranger finder/designator of the KPS-53 System.
#Users: wp_mi-24v, wp_mi-24p, wp_mi-24vp
Kind=LaserDesignator
MaxRange=12.0                        //max distance in nm
NightCapable=True                   //is the designator can be used in low-visibility conditions
TargetChannels=2                    //number of targets that can be tracked at once
WeaponChannels=1000                 //if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                           // Field of View of the designator

[Ataka]
Kind=Radar
Type=Targeting            // Classes can be "Search", "Targeting"
HasDataLink=False       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface               // Role can be "Surface", "Air", "AirAndSurface"
Mode=RadioCommand        // Can be "Illuminate", "RadioCommand"
TargetChannels=1      // if applicable number of targets it can track simultaneously
WeaponChannels=1      // if applicable number of weapons (missiles) it can guide simultaneously
MinRange=0           // min range in km
MaxRange=4         // max range in km
MinAltitude=0       // min altitude in meters, relevant for air, unused for surface
MaxAltitude=10000    // max altitude in meters, relevant for air, unused for surface
RangeResolution=30  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.4          // defáines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=50              // gain in dB on the sensor
Frequency=X-Band       // frequency banWd
PeakPower=10      //with a peak power output on 1MW (average 60 kW)
// output peak power in kW
