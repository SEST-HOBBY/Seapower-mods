b-2_gbu_31=GBU-31,JDAM 2000 lbs,Guided Bomb,Heavy (2000 lbs), GPS-guided precision bomb with high explosive yield. Designed for hardened or deeply buried targets and strategic strikes with sub-15-meter accuracy.
b-2_gbu_32=GBU-32,JDAM 1000 lbs,Guided Bomb,Medium (1000 lbs), GPS-guided precision, all purpose, medium-sized bomb. Viable against a wide varity of targets while capable of surgical strikes with a CEP of under 10m.
b-2_gbu_38=GBU-38,JDAM 500 lbs,Guided Bomb,Lightweight (500 lbs), GPS-guided precision bomb for tactical precision strikes against soft or medium targets. Ideal for minimizing collateral damage while maintaining high accuracy.
b-2_gbu-57=GBU-57,Massive Ordnance Penetrator,MOP,The GBU-57, officially called the Massive Ordnance Penetrator (MOP), is a large, precision-guided bunker buster bomb developed by the United States. It's designed to penetrate deeply buried and reinforced structures like bunkers or tunnels, making it a powerful weapon for destroying hardened targets.
