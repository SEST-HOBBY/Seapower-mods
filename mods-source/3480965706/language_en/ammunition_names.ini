# ---------- Anti-ship Missiles ----------
b-2_agm-109b=AGM-109B,Tomahawk,ASM,The AGM-109B Tomahawk Anti-Ship Missile (TASM) is an American standoff anti-ship weapon. The weapon has an active radar seeker that is activated after following a pre-programmed route, and is capable of flying a search pattern with deceptive manuevers.
b-2_lrasm=AGM-158C,LRASM,ASM,The AGM-158C LRASM (Long Range Anti-Ship Missile) is a stealthy, long-range missile designed to engage and destroy heavily defended naval targets. It carries a 450 kg penetrator and blast-fragmentation warhead and uses a combination of GPS, passive sensors, and an advanced seeker for autonomous targeting in complex environments. Its range exceeds 500 km, allowing launch from well beyond enemy air defense zones.

#-----------Land Strike only missiles---------
b-2_agm-109c=AGM-109C,Tomahawk,Land Attack,The Tomahawk Land Attack Missile (TLAM) is an American standoff land attack missile. These weapons fly a pre-programmed route to a target with no input from the launch platform after launch, using terrain contour matching using a terrain mapping radar and onboard digital maps.
b-2_jassm=AGM-158D,JASSM,Land Attack,The AGM-158D JASSM is a long-range cruise missile equipped with a 907 kg penetrating blast-fragmentation warhead. It uses an advanced infrared seeker and GPS guidance for precise strikes against fortified or high-value land targets. With a range of over 1800km, it can be launched from outside heavily defended areas.
b-2_jsow=AGM-154A-1,JSOW,Glide Bomb, The AGM-154C JSOW (Joint Standoff Weapon) is a long-range, precision-guided glide bomb used to engage targets from a standoff distance. It's designed to allow aircraft to strike land targets beyond enemy air defenses while maintaining aircraft survivability. The JSOW is a "glide bomb" and not a true missile, meaning it is launched without a propulsion system and glides to its target. The A-1-Version features a BLU-111 warhead, a 500lbs Mk-82 optimized for penetration.
b-2_jsow_clus=AGM-154A,JSOW,Cluster Glide Bomb,The AGM-154A, also known as the Joint Standoff Weapon (JSOW-A), is a precision-guided glide bomb designed for air-to-surface attacks. It's a modular weapon that can carry different payloads, including the BLU-97/B submunition cluster, which is the standard for the AGM-154A. The AGM-154A is used against a variety of soft land targets, including parked aircraft, trucks, armored personnel carriers, and surface-to-air missile sites. 
b-2_jsow_sead=AGM-154A-2,JSOW,Anti-Radiation Glide Bomb, The AGM-154A-2 JSOW (Joint Standoff Weapon) is a long-range, precision-guided glide bomb used to engage radiation sources from a standoff distance. It's designed to allow aircraft to strike targets beyond enemy air defenses while maintaining aircraft survivability. The AGM-154A-2 is designed to detect and home in on an enemy radio emission sources, like Radar or ECM.
b-2_jsow_ecm=ADM-160,MALD,Aerial Decoy, The ADM-160 Miniature Air-Launched Decoy (MALD) is a low-cost, expendable, air-launched decoy missile designed to mimic the radar signatures and flight characteristics of various aircraft types. It's used to deceive enemy integrated air defense systems (IADS) by diverting their attention away from actual strike aircraft. The MALD can be launched from various aircraft and flies autonomously, following a pre-programmed mission. While the ADM-160 is ideal to draw enemy attention away from the strike package, its own strike capability is rather limited.

