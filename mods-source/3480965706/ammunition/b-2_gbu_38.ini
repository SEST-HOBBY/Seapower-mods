#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Mk-82 241kg bomb
Type=Missile                              // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=241                               // in kg. Used for aircraft
AmmoPoints=241                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=0.1       // Biggest range in nm at which this unit can be visually identified
IRSignature=0.00000000000001
# Radar related (RCS => radar cross section)
RCS=0.00000000000001
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=32
ImpactSize=Medium               // Impact size, can be small, medium, large, verylarge
Penetration=Heavy               // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=4.0                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
GravityFactor=6
TerminalApproachDist=1000              // in N. miles. At this distance seeker will be turned on.
SupportsBanking=True                   // if the missile will bank when turning
Lofted=False                           // If true, the weapon is launched to a high altitude, then dives to reach its target
SeaSkimming=False                      // If true, fly at wavetop altitude during entire flight
FinalFlightPhase=False                  // final flight phase, e.g. terminal pop up
#========================================= Launch stats ============================================================
MaxTurnRate=4                          // Maximum turnrate in degrees per second
MinLaunchRange=4                     // Minimum launch range in nautical miles
MaxLaunchRange=15.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=80                  // Minimum launch altitude in feet.
MaxLaunchAltitude=60000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#VerticalWobblingStrength=4.0           // amplitude of wobbling
#VerticalWobblingSpeed=1.0              // frequency of wobbling
Acceleration=0                      // Acceleration factor
MaxVelocity=1000                        // Maximum speed in knots
VelocityBleed=2                     // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
AccelerationTime=0                   // Time until start of the velocity bleed, in seconds

GroupSize=0
#========================================     Seeker     ===========================================================
CircularErrorRadius=10                // Circular error radius in meters
#Homing
#ECCM
CounterMeasuresRejection=100            // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=75                      // The lower the value, the greater risk of spoofing by jamming	(0...100)
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
AttachmentPosition=0,0,-0.001
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_mk-82
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_mk-82_mat
AssetBundleMeshHullCollider=usn_mk-82_coll
############################################################
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=assets/models/weapon/ammunition/b-2_gbu-38/
ResourcesRoot=b-2_gbu-38.obj
ResourcesMesh=b-2_gbu-38
ResourcesMaterial=b-2_gbu-38_mat.ini
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

InFlightEffect=None
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0

HitShipExplosion=effects/explosions/emitters/missile_hit_ship_large
HitAirExplosion=effects/explosions/emitters/bomb_hit_ground
HitGroundExplosion=effects/explosions/emitters/bomb_hit_ground
HitDefaultExplosion=effects/explosions/emitters/bomb_hit_ground
HitWaterSplashClass=SmallWaterSplashes

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb
#ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo

############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
BoosterAudioClip=
BoosterAudioRollOff=Logarithmic
BoosterAudioDistance=1,20
BoosterAudioPitchRange=0.4,1
SustainerAudioClip=
SustainerAudioRollOff=Logarithmic
SustainerAudioDistance=1,20
SustainerAudioPitchRange=0.1,0.6
InflightAudioClip=audio/weapons/TorpedoEngine
InflightAudioRollOff=Logarithmic
InflightAudioDistance=1,20
InflightAudioPitchRange=0.1,0.6

[---------- Colliders ----------]
