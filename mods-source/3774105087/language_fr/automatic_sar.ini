Started=Le SAR automatique a commencé.
NoActiveBeacons=Le SAR automatique n'a pas été lancé : aucune balise de détresse active trouvée.
NoSunkTargets=Le SAR automatique n'a pas été lancé : aucun navire coulé non traité trouvé.
CompleteHelicopter=Le SAR automatique est terminé : toutes les balises de détresse à portée ont été traitées.
CompleteVessel=Le SAR automatique est terminé : tous les navires et sous-marins coulés ont été traités.
CapacityReached=Le SAR automatique est terminé : la capacité SAR est atteinte. Retour à la base.
UnsafeTargetPosition=Le SAR automatique ignore une cible : la profondeur d'eau à la position de la cible est insuffisante.
NoSafeTargetRoute=Le SAR automatique ignore une cible : aucun itinéraire sûr vers la cible n'a été trouvé.
TerrainUnavailable=Le SAR automatique ignore une cible : les données de terrain sont restées indisponibles après l'attente.
NoSafeRecoveryRoute=SAR automatique arrêté : délai de traitement de la cible dépassé.
NoReachableSunkTargets=Le SAR automatique est terminé : il ne reste aucune cible de navire coulé atteignable en toute sécurité.
