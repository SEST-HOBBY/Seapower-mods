[AutomaticSAR]
Start=Bắt đầu SAR tự động
Running=SAR tự động đang hoạt động
Settings=Cài đặt SAR
Helicopters=Trực thăng
NearestDownedPilot=Ưu tiên phi công gặp nạn gần nhất
NearestDistressBeacon=Ưu tiên đèn hiệu cấp cứu gần nhất
SARTarget=Mục tiêu SAR
Completion=Hoàn tất
Ships=Tàu
RescueIsolatedPilots=Cứu phi công bị cô lập (thử nghiệm)
ReturnToBase=Về căn cứ
Loiter=Chờ tại chỗ


Started=Đã bắt đầu SAR tự động.
NoActiveBeacons=Không bắt đầu SAR tự động: không tìm thấy đèn hiệu cấp cứu đang hoạt động.
NoSunkTargets=Không bắt đầu SAR tự động: không tìm thấy tàu bị chìm chưa được xử lý.
CompleteHelicopter=Hoàn tất SAR tự động: đã xử lý tất cả đèn hiệu cấp cứu trong tầm hoạt động.
CompleteVessel=Hoàn tất SAR tự động: đã xử lý tất cả tàu và tàu ngầm bị chìm.
CapacityReached=Hoàn tất SAR tự động: đã đạt sức chứa cứu hộ. Đang quay về căn cứ.
UnsafeTargetPosition=SAR tự động bỏ qua mục tiêu: độ sâu nước tại vị trí mục tiêu không đủ.
NoSafeTargetRoute=SAR tự động bỏ qua mục tiêu: không tìm thấy tuyến đường an toàn đến mục tiêu.
TerrainUnavailable=SAR tự động bỏ qua mục tiêu: dữ liệu địa hình vẫn không khả dụng sau thời gian chờ.
NoSafeRecoveryRoute=Đã dừng SAR tự động: xử lý mục tiêu quá thời gian.
NoReachableSunkTargets=Hoàn tất SAR tự động: không còn mục tiêu tàu bị chìm nào có thể tiếp cận an toàn.
