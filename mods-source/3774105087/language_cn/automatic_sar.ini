[AutomaticSAR]
Start=开始自动搜救
Running=自动搜救运行中
Settings=自动搜救设置
Helicopters=直升机
NearestDownedPilot=落水飞行员优先
NearestDistressBeacon=最近的求救信标优先
SARTarget=搜救目标
Completion=完成行为
Ships=舰船
RescueIsolatedPilots=搜救落水飞行员(实验性)
ReturnToBase=返回基地
Loiter=原地待命


Started=自动搜救已开始。
NoActiveBeacons=自动搜救未开始：没有活动的求救信标。
NoSunkTargets=自动搜救未开始：没有待处理的沉没舰船或潜艇。
CompleteHelicopter=自动搜救完成：航程内的所有求救信标均已处理。
CompleteVessel=自动搜救完成：所有沉没舰船和潜艇均已处理。
CapacityReached=自动搜救完成：载具已满员，正在返回基地。
UnsafeTargetPosition=自动搜救跳过目标：目标位置水深不足，无法安全接近。
NoSafeTargetRoute=自动搜救跳过目标：没有通往目标的安全航线。
TerrainUnavailable=自动搜救跳过目标：地形数据在等待后仍不可用。
NoSafeRecoveryRoute=自动搜救停止：目标处理超时。
NoReachableSunkTargets=自动搜救结束：没有可安全到达的沉没舰船或潜艇。
