Started=Se inició el SAR automático.
NoActiveBeacons=No se inició el SAR automático: no se encontraron balizas de socorro activas.
NoSunkTargets=No se inició el SAR automático: no se encontraron buques hundidos sin procesar.
CompleteHelicopter=SAR automático completado: se han procesado todas las balizas de socorro dentro del alcance.
CompleteVessel=SAR automático completado: se han procesado todos los buques y submarinos hundidos.
CapacityReached=SAR automático completado: se alcanzó la capacidad de SAR. Regresando a la base.
UnsafeTargetPosition=El SAR automático omite un objetivo: la profundidad del agua en la posición del objetivo es insuficiente.
NoSafeTargetRoute=El SAR automático omite un objetivo: no se encontró una ruta segura hasta el objetivo.
TerrainUnavailable=El SAR automático omite un objetivo: los datos del terreno seguían sin estar disponibles después de esperar.
NoSafeRecoveryRoute=SAR automático detenido: tiempo de procesamiento del objetivo agotado.
NoReachableSunkTargets=SAR automático completado: no quedan objetivos de buques hundidos a los que se pueda llegar de forma segura.
