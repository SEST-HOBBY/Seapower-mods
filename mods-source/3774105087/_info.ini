[Language_en]
Name=Automatic SAR
Description=Adds automatic SAR to units rightclick menus. Ships and submarines visit sunken vessels with nearby distress beacons. Helicopters retain beacons by beacons SAR.

[Language_cn]
Name=自动搜救
Description=为单位右键菜单添加自动搜救：舰船和潜艇前往附近存在求救信标的沉没舰艇，潜艇位置搜救。直升机则逐个求救信标搜救。

[Language_de]
Name=Automatische SAR
Description=Fügt automatische SAR-Befehle zu den Kontextmenüs von Einheiten hinzu. Schiffe und U-Boote besuchen gesunkene Schiffe mit nahegelegenen Notrufsignalen. Hubschrauber bearbeiten die Signale einzeln.

[Language_ru]
Name=Автоматический SAR
Description=Добавляет автоматический SAR в контекстные меню подразделений. Корабли и подводные лодки направляются к затонувшим судам с находящимися поблизости аварийными маяками. Вертолёты обрабатывают маяки по одному.

[Language_es]
Name=Rescate aéreo y marítimo automático
Description=Añade SAR automático a los menús contextuales de las unidades. Los buques y submarinos visitan los buques hundidos con balizas de socorro cercanas. Los helicópteros procesan las balizas una por una.

[Language_fr]
Name=Recherche et sauvetage automatiques
Description=Ajoute le SAR automatique aux menus contextuels des unités. Les navires et sous-marins se rendent auprès des navires coulés ayant des balises de détresse à proximité. Les hélicoptères traitent les balises une par une.

[Language_ja]
Name=自動捜索救難
Description=ユニットのコンテキストメニューに自動SARを追加します。艦船と潜水艦は近くに遭難ビーコンがある沈没艦へ向かいます。ヘリコプターはビーコンを一つずつ処理します。

[Language_vn]
Name=SAR tự động
Description=Thêm SAR tự động vào menu ngữ cảnh của các đơn vị. Tàu mặt nước và tàu ngầm sẽ đến các tàu bị chìm có đèn hiệu cấp cứu ở gần. Trực thăng xử lý từng đèn hiệu một.

