[Features]
// 加油时伸出/收回受油探头（Refuel_Probe_Extend / Refuel_Probe_Retract）
RefuelProbe=True
// 开加力时喷口收敛片张开
AfterburnerNozzle=True
NozzleOpenAngle=8
NozzleOpenTime=0.45
NozzleCloseTime=0.45
NozzleCloseDelay=0.55
// 伙伴加油吊舱（Tanker 挂载）：加油时锥套拖出 + 伞瓣张开 + 程序化软管
BuddyPod=True
BuddyHoseRadius=0.07
BuddyHoseSag=0.03
BuddyHoseFlutter=0.004
BuddyRetractTimeout=20
// 吊舱尾口中心，米，机体系（软管起点）
BuddySocket=0.0000,-1.0120,-3.4420
// 锥套篮口完全展开后的位置，米，机体系（静态）；station = BuddyBasket - 探头尖
BuddyBasket=0.0000,-2.7370,-18.2270
// 动态对接容差（米）
BuddyDockToleranceM=1.5
BuddyDockReleaseM=3.0
BuddyDockHoldS=2.0
# ---- 版本分流：0=自动探测游戏原生空中加油系统，1=强制原生（游戏画软管搬锥套），2=强制旧版（插件全包）
NativeRefuel=0
# true=输出逐事件调试日志（加油流程、花瓣、灯态）。功能已稳定，默认关闭。
DebugLog=False
BuddyPetalDrive=True
BuddyPetalOpenSeconds=0.9
// 锥套枢轴 ps_upaz_drogue 的收拢位/展开位（模型单位，与 planaf_j-15.ini 子模型 Position 同尺度）
BuddyDrogueStowed=0.000000,-0.016605,-0.030000
BuddyDrogueDeployed=0.000000,-0.039965,-0.260663

[BuddyReceivers]
// 受油机探头尖位置（米，机体系 x右 y上 z前），初始值来自 PROBE_TIP_M 估算
// 进游戏后开 BepInEx log 观察 "dynamic station" 行打印的 basket-contact 数据来校准
planaf_j-15 = -1.041, 0.630, 6.725
# 原生软管下垂：重写 AerialRefuelingHose.Render 的两个常量（需重启，补丁在启动时注入）
# BuddyHoseSag 替代原版 0.3（稳态下垂/跨度）；BuddyHoseSlackK 替代原版 1.0（卷轴余量坠管项）
NativeHoseSagFix=True
# 夜间加力火焰会变成冷色调是游戏按太阳高度角改全局 _AfterburnerDaylight 造成的；
# True = 钉死在白天值（昼夜都橘黄）。这是全局着色器变量，所有飞机都受影响。
DaylightAfterburner=False
BuddyHoseSlackK=0.0001
# 受油探头收回延迟（秒）：锥套收回 ~8 s、探头只要 2.5 s，等一等再缩才不会「探头先进、锥套还在后面」
ProbeRetractDelaySeconds=5.5
# 锥套/软管是否等到 PreContact 阶段才伸出（False = 原版时机，一有受油机就伸）
HoseDeployFromPreContact=True
