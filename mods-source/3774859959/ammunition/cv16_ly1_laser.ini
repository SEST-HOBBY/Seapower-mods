; CV17 Shandong - LY-1 laser ammunition.
;
; Modelled on J-36's plaaf_j36_atp_laser (J-36/ammunition/plaaf_j36_atp_laser.ini),
; which is the only working laser in this install.  A laser is represented as an
; ordinary Projectile with a very high muzzle velocity and no gravity so the
; existing CIWS interception model can drive it; MaxRange is what the mount
; actually engages at, MuzzleVelocity just has to outrun the target.
;
; Differences from J-36's round (deliberate, this is a shipboard mount):
;   Power 1.25 -> 0.75              this is the knob that actually governs lethality.
;                                   WeaponSystemCIWS.ResolveFireTick builds damage from
;                                   CiwsBallistics.EffectiveDamage(ap) = _warheadPower *
;                                   _damageMultiplier * armorPen (CiwsBallistics.cs:729),
;                                   so Power feeds straight into hits-needed-per-kill.
;                                   0.75 of J-36 keeps a laser burst able to down an
;                                   aircraft without a single hit always being decisive.
;   MuzzleVelocity 40000 -> 30000   still effectively instantaneous at 12 km, less
;                                   likely to tunnel through a target in one tick.
;   MaxRange 14000 -> 12000         LY-1 is a short/medium-range point defence laser;
;                                   the mount should not reach out to 14 km.
;   FuzeProximityDistance 6 -> 2    a beam hit is point-like, not a fragmentation
;                                   burst, so the proximity window is tightened.
;
; On KillProbability: it is deliberately NOT used as a balance knob here.  A CIWS
; round never reads it - WeaponSystemCIWS.cs does not reference _killProbability at
; all; kills come from the Poisson hit model above.  The only readers are
; Blastzone.cs:1153 (RBU and torpedo proximity only) and PointValueWeaponScorer's
; GunShellPk (:287), an AI preference score.  0.75 is kept as a plausible displayed
; value, not as the strength control.
;
; WarheadType=2 is a HE-style damage type; the game has no dedicated laser warhead
; type (0 hits for "Laser" in original/ammunition/*.ini).

[General]
Type=Projectile
TargetType=AAW
Mass=0.01
AmmoPoints=0.01
DecalClass=GunImpacts
GroundDecalClass=GroundImpacts

[Physics]
MuzzleVelocity=30000
MaxRange=12000
MaxAARange=12000
GravityFactor=0.001
CircularErrorProbable=0

[WarheadData]
WarheadType=2
Power=0.75
ImpactSize=Medium
Penetration=Always
FuzeType=1
FuzeProximityDistance=2
SmartFuse=False
KillProbability=0.75

[Particles]
; No TrailEffect: a laser does not leave a tracer.  The visible beam needs a
; renderer that this mod does not ship (J-36 draws it from J36Beam*.cs on
; WeaponSystemCIWS.StartFire); without one the mount fires silently.
TrailEffect=None
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosionClass=SmallGroundHitExplosions
