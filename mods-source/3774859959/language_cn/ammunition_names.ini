plan_cal_30mm=30毫米近防炮弹,30毫米近防炮弹药,H/PJ-11型近防炮使用的30毫米炮弹。
plan_hq-10=海红旗-10,近程舰空导弹,海红旗-10型舰载近程防空导弹。
su_rgb-12=RGB-12,反潜火箭,RBU-12000发射器使用的RGB-12反潜火箭。
cv16_726_chaff=726-4型箔条诱饵弹,箔条诱饵弹,舰载无源雷达箔条诱饵弹。
usn_adc_mk1_noisemaker=ADC Mk1噪声诱饵,声学诱饵,反潜对抗
