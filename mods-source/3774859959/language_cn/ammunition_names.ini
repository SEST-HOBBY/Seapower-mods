cv16_ly1_laser=燎原-1激光束,定向能武器,山东舰燎原-1舰载激光近程防御系统使用的能量束。
cv16_gb-500=GB-500,,激光制导炸弹,GB-500是中国空军装备的500千克级激光制导炸弹，由500千克低阻航空炸弹加装激光导引头改装而成，具备较高的命中精度。

plaaf_ls-6_250_ayone=LS-6 250千克,,滑翔炸弹,雷石-6增程型是使用滑翔套件并加装涡轮喷气发动机改装的250公斤通用航空炸弹，GPS制导，主要用于打击固定地面目标。
plaaf_yings-3_ayone=YINGS-III,,瞄准吊舱,鹰隼-III 光电瞄准吊舱，集成红外成像与激光指示通道，用于对地目标的探测、识别与制导。
plaaf_yj-91_ayone=YJ-91,,反辐射导弹,鹰击-91是中国空军装备的反辐射导弹，是引进自俄罗斯的Kh-31P反辐射导弹的国产版本。
