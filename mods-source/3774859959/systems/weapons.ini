; CV17 Shandong - weapon definitions owned by this mod.
;
; The CIWS used to borrow SystemName=Type_1130 out of CV16_Liaoning's
; systems/weapons.ini, and that definition leaves both effect anchors at
; EffectPosition=0,0,0.0 / SpawnPosition=0,0,0.0 - the Gun submodel's origin, which is
; the trunnion in the middle of the mount.  The eleven barrel tips of cv16_1130_00N_gun
; sit at local +Z = 0.040042 model units, and the tip ring is centred on y = 0.002499,
; i.e. 2.74 m ahead of the trunnion and 17 cm above it (1 unit = 306.0 / 4.4725 =
; 68.4 m), so the burst and its tracer appeared inside the housing instead of at the
; muzzle.  All three mounts are the same mesh - the tip ring measured identically on
; cv16_1130_001_gun, _002_gun and _0_gun (132 of 400 vertices at z >= 0.039).
;
; Vanilla always offsets these two keys on a gun that has a barrel to speak of - see
; original/systems/weapons.ini:67-68 (EffectPosition=0,0,0.117 / SpawnPosition=0,0,0.117),
; :320-321 (0,0,0.075 / 0,0,0.135), :339-340 (0,0,0.065), :376-377 (0,0,0.09) and
; :395-396 (-0.005,0,0.107 / -0.005,0,0.2) - and a vessel ini cannot override them: the
; only EffectPosition/SpawnPosition keys under original/vessels belong to [ElevatorN].
; Mod-provided definitions are merged rather than shadowed, which is why this ship could
; resolve CV16's Type_1130 at all; a mod-local name keeps this change off the Liaoning.
;
; Everything else is CV16's [Type_1130] verbatim, so the mount keeps its exact
; behaviour and only the two effect anchors move onto the muzzle.
;
; 0.8.3/0.8.5 CIWS fire discipline.  In the installed build a CIWS definition that
; leaves BOTH RangingBurstRounds and VolleyMaxRounds unset has
; WeaponSystemCIWS.FireDisciplineConfigured == false and quietly falls back to the
; legacy CiwsBallistics.SimulateEngagement() model: no volley cap, no barrel cooldown,
; and no closed-loop fall-of-shot correction.  That is exactly the state this section
; was in (it is CV16's [Type_1130] verbatim - CV16_Liaoning/systems/weapons.ini:1-13),
; which is why the 1130 neither broke nor used anything the overhaul added.  The keys
; below put the mount on the same footing as the vanilla 30mm Gatling CIWS
; ([AK630], original/systems/weapons.ini:3472) and the self-contained Phalanx
; ([MK15_Blk1], :1883):
;   FireControlMode=ClosedLoop  the mount's own tracker follows its outgoing rounds
;                               (FireControlClass.TracksRounds; FallOfShotNullFactor
;                               then converges in ~25 rounds of observation)
;   ReactionTime=3.0            seconds committed to a target before a new one is taken
;                               (0 disables the commitment in HoldsCurrentEngagement)
;   BurstTime=1.0               resolution window of the interception model / burst cap
;   VolleyMaxRounds=1000        sustained-fire cap before the water-cooled barrels rest
;   VolleyCooldown=5.0          seconds after a full volley
;   VolleyRange=2000            beyond this the mount fires the continuous volley
; RangingBurstRounds/RangingBurstInterval are deliberately absent: they are the
; off-mount-director spotting path ([AK630] uses 40/2.0), and a closed-loop mount spots
; its own rounds instead.  AdvancedCIWS=True is set deliberately (2026-10-18): no vanilla
; CIWS definition carries it (0 hits in original/systems/weapons.ini), and it only widens
; the target set to bombs and unguided rockets (WeaponSystemCIWS.IsAdvancedCiwsExtraTarget,
; WeaponSystemCIWS.cs:448).  A modern 1130 mount is expected to engage either, so the
; deviation from vanilla is intentional.  MissileInterceptChance/AircraftInterceptChance are calibration
; anchors, not per-round dice: EnsureCalibrated() bisects sigmaFcs until the simulated
; kill probability against the reference missile/aircraft equals the authored percentage.
; The three vessel-ini CIWS blocks carry Automatic=True for the same reason - see the
; comment above [WeaponSystem1] in vessels/plan_cv16_shandong.ini.

[cv16_1130]
FireControlMode=ClosedLoop
AdvancedCIWS=True
MissileInterceptChance=90
AircraftInterceptChance=90
ReactionTime=3.0
HorizontalDegreesPerSecond=80
VerticalDegreesPerSecond=86
FireRate=10000
BurstTime=1.0
VolleyMaxRounds=1000
VolleyCooldown=5.0
VolleyRange=2000
RoundsLoaded=2560
ReloadTime=15
MoveToRestPositionTime=10.0
Effect=effects/weapons/emitters/wp_ak630_burst
EffectPosition=0,0.0025,0.040
SpawnPosition=0,0.0025,0.040
ModuleType=CIWS

; ---------------------------------------------------------------------------
; LY-1 laser point-defence mount (2026-10-20).
;
; Same module type as the 1130 - ModuleType=CIWS - because that is the only
; module the interception model runs for a hitscan/no-ballistics mount.  The
; ammunition is a Projectile with a very high MuzzleVelocity (see
; ammunition/cv16_ly1_laser.ini); the CIWS code does not care what the round
; looks like in flight.
;
; Why no plugin is needed: WeaponSystemCIWS.cs:491-497 only applies the
; "airborne targets are skipped" filter when _baseObject._type is Aircraft or
; Helicopter.  A ship falls into the else branch and engages missiles out of
; the box.  J-36's BeamAawPatch exists solely to defeat that filter for an
; aircraft mount - not applicable here.
;
; Fire discipline mirrors the 1130 (ClosedLoop / self-spotting) but the mount
; is faster, has effectively unlimited rounds, and never needs a barrel rest:
;   ReactionTime=1.0            a beam engagement is decided in a fraction of a second
;   Horizontal/VerticalDegreesPerSecond=120   lightweight mirror turret
;   FireRate=12000              inherited from J-36's working laser
;   RoundsLoaded=1000000        no magazine; this is a chemical/electrical supply
;   ReloadTime=0                nothing to reload
;   VolleyMaxRounds=1000000     no cooldown interval for a laser
;   VolleyCooldown=0
;   VolleyRange=12000           stays in continuous fire for the whole engagement band
;   AdvancedCIWS=True           a laser can burn bombs and unguided rockets too
;
; EffectPosition/SpawnPosition point at the lens origin: cv16_ly1_fwd_gun's
; pivot is the trunnion and its bbox is x[-0.0179,+0.0075] y[-0.0146,+0.0115]
; z[-0.0153,+0.0142], so the emitter sits at 0,0,0.  No Effect is set: the mod
; ships no beam renderer, so the mount fires without a visible tracer rather
; than flashing the 30mm burst effect out of a laser lens.
[cv16_LY1]
FireControlMode=ClosedLoop
AdvancedCIWS=True
MissileInterceptChance=85
AircraftInterceptChance=85
ReactionTime=1.0
HorizontalDegreesPerSecond=120
VerticalDegreesPerSecond=120
FireRate=12000
BurstTime=1.0
VolleyMaxRounds=1000000
VolleyCooldown=0
VolleyRange=12000
RoundsLoaded=1000000
ReloadTime=0
MoveToRestPositionTime=1.0
EffectPosition=0,0,0
SpawnPosition=0,0,0
ModuleType=CIWS

[Type_726_4]
# Eighteen physical Type 726-4 tubes.
RoundsLoaded=2
ReloadTime=90
Effect=effects/countermeasures/emitters/chaff_burst
EffectPosition=0,0,0
ModuleType=Inert
