; ===========================================================================
; CV16 辽宁舰插件设置
;
; 由 CV17 山东舰插件（meltemi.acc.cv17.skijumpfix）移植而来，
; 程序集 CV16.dll，插件 GUID meltemi.acc.cv16.decksystems。
;
; 每一段管一个独立功能，Enabled=false 时该功能的 Harmony 补丁完全不安装，
; 游戏行为和插件不存在时一模一样。缺文件不是错误：所有开关保持内置默认值。
; ===========================================================================

; ---------------------------------------------------------------------------
; [AdvancedFlightControl] 进近航线 + 复飞判定 + 阻拦索 + 降落灯
;
; 进近和复飞是同一个开关：复飞判据读的就是进近几何（航线偏差、下沉趋势、
; 抽到的接地点），没有"只跑一个"的有效状态。False = 游戏自己进近、自己落地，
; 插件不碰 ApproachDeviation / ArrestorWireAnim / LandingLightsDriver。
;
; 注意：阻拦索动画和 OLS 灯驱动都挂在这个开关下面。想把辽宁的阻拦索
; 做出来，这一段必须是 true。
; ---------------------------------------------------------------------------
[AdvancedFlightControl]
Enabled=true

; ---------------------------------------------------------------------------
; [WhipAntenna] 鞭状天线摇摆动画
;
; 按 animations_plan_cv16_liaoning.ini 里的 Whip_Up_NN / Whip_Down_NN 键找节点，
; 键名与山东一致，节点已由 build_runtime.py 生成。
; ---------------------------------------------------------------------------
[WhipAntenna]
Enabled=true

; ---------------------------------------------------------------------------
; [DeckDecor] 甲板年代装饰
;
; 辽宁这边先关掉：
;   * 山东的 BakedSubModelKeys 是 CV17_aircraft_parked / CV17_static_j15，
;     辽宁模型里没有这两个组，隐藏静态机无从谈起；
;   * [Spots] 的停机位和 [Deck Aircraft] 的机型表都是按山东甲板量出来的，
;     直接套用会停在错的位置。
; 等辽宁自己的停机位量好再打开。
; ---------------------------------------------------------------------------
[DeckDecor]
Enabled=true
HideBakedStatic=true
EraAircraft=true
Era=auto
FallbackEra=2
ForceFold=true
DeckClearance=0.05
YawTrim=0
SerialSeed=0
DeckLights=false
IslandNightLights=false
DebugLog=true

; ---------------------------------------------------------------------------
; [Deck Aircraft] 静态装饰机（DeckDecor 打开后才生效）
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; [Deck Aircraft] 年代机组（DeckDecor 打开后按年代生成；年代按年份升序编号 1..N）
;   Era=<服役年份> 开始一个年代块；下面每行 Aircraft=<机型 ini 名> 一架。
;   ⚠ 这些年份是**辽宁舰自己的改造节点**，不是山东的（原来是直接抄山东的）：
;     2012-09-25 服役 / 2012-11-25 首次 J-15 着舰 → 2012 档（服役状态，两次改造前）
;     2018-05 ~ 2019-01 第一次改造 → 2019 档（一改完工后，Z-18 系列上舰）
;     2023-02 ~ 2024-01 第二次改造 → 2024 档（二改完工后，J-15T / J-35）
;   编号顺序 = 年份升序 → 2012=era1、2019=era2、2024=era3；
;   [DeckDecor] FallbackEra=2 即默认采用 2019 这一档（与 [Default] 变体一致）。
;   plan_j-15dh（滑跃电战型）暂时都不排进去，等该机型做完。
;   机型可用性（已核实 ini 存在）：planaf_j-15（本包）、plan_j-15t / plan_j-15dt /
;   plan_j-35 / plan_z-20f / plan_z-18ja / plan_z-9d（工坊 3775128499）。
;   停机位见 [Spots]，四个位按书写顺序轮流使用。
; ---------------------------------------------------------------------------
[Deck Aircraft]
Era=2012
Aircraft=planaf_j-15
Aircraft=planaf_j-15
Aircraft=plan_ka-28
Aircraft=plan_ka-31

Era=2019
Aircraft=planaf_j-15
Aircraft=planaf_j-15
Aircraft=plan_z-18ja
Aircraft=plan_z-9d

Era=2024
Aircraft=plan_j-15t
Aircraft=plan_j-15t
Aircraft=plan_j-35
Aircraft=planaf_z-20j

[Spots]
Spot=16.628,-52.586,-61.5
Spot=13.502,-36.973,-61.5
Spot=11.318,-22.886,-61.5
Spot=10.148,-8.701,-61.5

; ---------------------------------------------------------------------------
; [Offsets] 按机型的位置微调（可选）
; ---------------------------------------------------------------------------
[Offsets]

;-------------------------------------------------------------------------------
; [Log] - diagnostics.  Both channels are OFF unless this section turns them on.
;
; Dev      the [ACC CV17 DEV] / [ACC CV17 Probe] verification traces.  Dense:
;          several lines per approach, per wire, per launch.  Switch on when a
;          session needs to be diagnosed after the fact, then switch off again.
; Verbose  per-call patch detail, even denser than Dev.
;
; Info and Warn are always on; a normal session produces a handful of them.
;
; [Log]
; Dev=True
; Verbose=False
;-------------------------------------------------------------------------------
