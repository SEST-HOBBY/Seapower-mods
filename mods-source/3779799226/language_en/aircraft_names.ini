; ============================================================
;  Operation STEADFAST LANTERN - aircraft name override
;
;  Sole purpose: the Saab GlobalEye mod (Workshop 3673250557) gives
;  its Swedish squadron the callsign "Uranus", which is what the UI
;  prints beside the aircraft. Mission 04 calls her ARGUS - after the
;  Swedish Air Force's own name for the type, the S 100 Argus, and
;  after the watchman it is named for.
;
;  The section is repeated COMPLETE rather than as a fragment. Which
;  copy of a language section wins when two mods define the same one
;  is not knowable from the files - the install already contains such
;  collisions (fr_sa-321 in the base game and in 3567228449,
;  nl_sea_lynx in 3455931957 and 3456241867) and loads fine either
;  way. Shipping the whole section means nothing is lost whichever
;  copy the engine keeps. Worst case this file is ignored and she is
;  called Uranus again; nothing else depends on it.
; ============================================================

[General]
DefaultSquadronShortName=N/A

[dts_saab_ge]
Type=AEW&C
Default=Saab GlobalEye,GlobalEye
DefaultDescription=The Saab GlobalEye is an advanced multi-domain airborne early warning and control aircraft developed by Sweden Saab, modified from the Bombardier Global 6000 business jet, with integrated air, maritime, and ground surveillance capabilities.

Squadron1=Saab GlobalEye (28th Group),GlobalEye
Squadron2=Saab GlobalEye (17th R&S Squadron),GlobalEye

Callsigns=Squadron1,Griffin Eye|Squadron2,Argus
