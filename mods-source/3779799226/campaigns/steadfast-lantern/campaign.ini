; ============================================================
;  OPERATION STEADFAST LANTERN
;  Task Force Mode campaign - TG NORTHWIND
;  Skagerrak / Kattegat / Danish Straits / Bornholm, April 2028
; ============================================================
;  Requires (undeclared - the _info.ini format has no dependency key):
;    3629144864  Euromod pack            (HARD dependency: eu_* sensors/weapons)
;    3575847216  Modern German Navy
;    3444379330  Euromod-Dutch Navy
;    3455931957  Sea Lynx
;    3390330875  Modern US Navy          (from mission 2 onward)
;    3567228449  French Helicopter Package  (supplies nl_nh90)
;    3673250557  Saab Global Eye         (mission 4 only - ARGUS)
;                NOTE: that mod declares ApproximateVersion=0.7.0, so
;                subscribers get the dismissible version warning.
; ============================================================

[File] # Location of this file - required for all systems to work properly
Base=campaigns/steadfast-lantern/campaign.ini

[Campaign]
Type=Linear
Difficulty=4
Length=8
DisplayFormat=MapView

[TaskForceMode]
Enabled=True
TaskForceRequireFlagship=False
DefaultTaskForceName=TG NORTHWIND
CommanderSettingsFile=commander_settings.ini
RosterFile=player_task_force_roster.ini
TaskForceDifficultyPresets=Easy|Moderate|Hard
DefaultTaskForceDifficultyPreset=Moderate
ShipIncludesAirwing=True
StartingPoints=700
PointCap=700
PurchaseLoadouts=False
BasicShipLoadoutVariants=Default|Early|Late|LandAttack|AntiShip
CrewSkillInitial=Trained
UnitDecommissionPointReturnModifier=0.25
UnitDismissPointReturnModifier=0.5
DamageToAllowRepair=Light,Moderate
DamageToDisallowRepair=Heavy
RepairPointsCost=Light,0.1|Moderate,0.25

; Budgets are deliberately tight, and SameNationUnitDiscount=0.25 in
; commander_settings.ini makes German hulls a quarter cheaper for a German
; commander. At the displayed prices a Moderate start buys roughly
; F124 MLU + Sea Tiger + F123B + Sea Lynx + K130 = 590 of 700.
[TaskForceModeDifficulty_Easy]
Name=Easy
StartingPoints=850
PointCap=850
ShipIncludesAirwing=True
PurchaseLoadouts=False
InitialUnlockedLoadouts=Default|Early|Late|LandAttack|AntiShip
RepairCostModifier=0.75
UnitDecommissionPointReturnModifier=0.35
UnitDismissPointReturnModifier=0.65
CrewSkillInitial=Trained

[TaskForceModeDifficulty_Moderate]
Name=Moderate
StartingPoints=700
PointCap=700
ShipIncludesAirwing=True
PurchaseLoadouts=False
InitialUnlockedLoadouts=Default|Early|Late|LandAttack|AntiShip
RepairCostModifier=1
UnitDecommissionPointReturnModifier=0.25
UnitDismissPointReturnModifier=0.5
CrewSkillInitial=Trained

[TaskForceModeDifficulty_Hard]
Name=Hard
StartingPoints=580
PointCap=580
ShipIncludesAirwing=False
PurchaseLoadouts=False
InitialUnlockedLoadouts=Default|Early
RepairCostModifier=1.25
UnitDecommissionPointReturnModifier=0.2
UnitDismissPointReturnModifier=0.4
CrewSkillInitial=Green

[Language_en]
Name=Operation STEADFAST LANTERN
Description=A multinational NATO standing group in the North Sea has been seized by its own staff and has closed the Baltic approaches. You command TG NORTHWIND. Both sides fly the same flag and sail the same hulls. Keep the straits open without starting the war you were sent to prevent.

[Missions]
NumberOfMissions=8

