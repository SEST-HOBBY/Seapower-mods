MissionWarningPopup_en=FINAL PHASE|This is the last mission of the campaign and it runs long: six hours on the clock, beginning with nobody in contact. Vahl is running silent somewhere in a hundred miles of basin and your ships see about twenty of them, so put a helicopter up early and expect to hunt. U32 has her own release area marked forward of the task force. Deploy her into it during setup and she can deal with his picket submarine herself. How it ends depends on what you destroy first: kill the escort and leave the flagship afloat, and Vahl surrenders. Kill the flagship, and nobody is left who can order a surrender.|Understood, launch|Return to the task force

