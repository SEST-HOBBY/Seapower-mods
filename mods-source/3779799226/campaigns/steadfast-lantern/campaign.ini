TaskForceModeDebriefNoticeTitle_en=Submarine Operations Unlocked
TaskForceModeDebriefNoticeText_en=U32 remains with the task group at no points cost. FGS Erfurt and FGS Oldenburg have been detached to Kiel: their crews changed sides in the middle of a shooting war, and the inquiry wants them first.

Name_en=DEEP SILENCE
MissionSequenceName_en=MISSION 3
MapShortName_en=03
Description_en=Central Kattegat, night
MissionIntro_en=Your task force is alongside in Gothenburg with three weeks of yard work and none of it optional. Two Type 212A boats hold a barrier across the Kattegat in forty metres of water. Command has found you a boat of your own.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=Note: This is a detached submarine operation. You will command U32 for this mission and your task force will not deploy. She joins the group afterwards at no cost. Any ships that come over tonight fight at your side for this mission only; afterwards they are detached for debriefing.

