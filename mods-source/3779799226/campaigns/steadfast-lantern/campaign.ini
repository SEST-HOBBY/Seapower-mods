;  NODE 1 - narrative card: the world finds out
; ============================================================
[Mission1]
Type=FreeEvent
IsUnlocked=True
IsComplete=False
Name_en=The Approaches Close\n16 April 2028
Description_en=A standing NATO group shuts the Baltic approaches and the alliance cannot agree what to call it.
AssetsPath_en=campaigns/steadfast-lantern/art
FilePath_en=campaigns/steadfast-lantern/art/20280416_newspaper_event.xml

; ============================================================
;  NODE 2 - MISSION 01
; ============================================================
[Mission2]
Type=Mission
MissionType=Main
MissionFile=campaigns/steadfast-lantern/missions/01 Show of Force.ini
MissionImage_en=campaigns/steadfast-lantern/art/briefing/01_show_of_force.png
TaskForceModeMissionGenerationType=Generated
IsUnlocked=False
IsComplete=False
Parents=1
RequiredResult=CostlyVictory
TaskForceModeServiceRecordOnboarding=True
Onboarding=True

TaskForceModeIncludesTaskForce=True
TaskForceModeIncludesAirwing=True
TaskForceModeIncludesSubmarine=False

TaskForceModeThreatProfileShip=True,3
TaskForceModeThreatProfileAir=False
TaskForceModeThreatProfileSub=False
TaskForceModeThreatProfileLand=False

TaskForceModeRearm=True
TaskForceModeRepair=True
TaskForceModeEnableTaskForceBuilder=True

; !! NEVER ADD TaskForceModeRequiredUnitType HERE !!
; Its presence with value "Vessel" routes the launch to the restricted
; path, which deploys a hard-coded ONE ship regardless of what was bought.
; TaskForceModeMaxUnits is only read behind that same gate - inert alone,
; and half the bug beside it. A Generated mission cannot be capped.
TaskForceModeDeploymentOptions=True
TaskForceModeDefaultDisposition=Formation
TaskForceModeRequireEntireTaskForce=True

; No Arleigh Burke yet - Washington has not committed. No submarines:
; this is a presence operation, not a hunt.
TaskForceModeAllowedRosterUnits=ger_ffg_f124_MLU,Variant1,Variant2,Variant3|ger_ffg_f125_MLU,Variant1,Variant2|ger_ffg_f123_2025_mlu,Variant3|ger_fsg_k130_batch2,Variant1,Variant2,Variant3,Variant4,Variant5|rnn_ddg_zeven_mlu,Variant1,Variant2|rnn_ffg_karel_mlu,Variant1,Variant2|ger_nh90,Squadron1|nl_nh90,Squadron1|ger_sea_lynx_mk88,Squadron1

TaskForceModeCompletionPoints=120
TaskForceModeCompletionCapPoints=120

Name_en=SHOW OF FORCE
MissionSequenceName_en=MISSION 1
MapShortName_en=01
Description_en=Skagerrak operational area
MissionIntro_en=Build TG NORTHWIND and establish presence in the Skagerrak. Identify who is still under alliance command and who is not. Weapons tight until fired upon.

