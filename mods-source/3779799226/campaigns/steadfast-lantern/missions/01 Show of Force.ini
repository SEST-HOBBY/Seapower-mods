; ------------------------------------------------------------
;  TRIGGERS
; ------------------------------------------------------------
[Trigger1]
Name=Briefing
Condition_Condition1_Type=Time
Condition_Condition1_Time=5
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1StartMessage

; The ultimatum. Everything in the lane turns hostile at once,
; and the message arrives with it - not after it.
[Trigger2]
Name=Ultimatum
Condition_Condition1_Type=Time
Condition_Condition1_Time=2400
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1DefectMessage
Action_UnitTransferToTaskforce=Taskforce2
Action_Units=NeutralVessel1,NeutralVessel2,NeutralVessel3
Action_ObjectivesCompleted=Identify

[Trigger3]
Name=AreaSecured
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=NeutralVessel1,NeutralVessel2,NeutralVessel3
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1WinMessage
Action_ObjectivesCompleted=Engage
Action_Victory=Taskforce1
Action_EndMissionDelay=20
Action_EndMission=True

[Trigger4]
Name=Timeout
Condition_Condition1_Type=Time
Condition_Condition1_Time=9000
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1TimeoutMessage
Action_EndMissionDelay=10
Action_EndMission=True

; Any genuine civilian lost in the lane fails the Civilians objective -
; without this trigger the Complete column awarded +30 at mission end no
; matter how many merchants burned. NeutralVessel1-3 are the renegades
; and are deliberately NOT in this list. MinimumUnits=1 flips the
; default all-destroyed semantics to "any one of these" (the editor
; tooltip: minimum number of Condition Units to fire the condition;
; pattern: pacific-strike 05 Strike on the Monster, Trigger5).
[Trigger5]
Name=CivilianLoss
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=NeutralVessel4,NeutralVessel5,NeutralVessel6,NeutralVessel7,NeutralVessel8,NeutralVessel9,NeutralVessel10
Condition_Condition1_MinimumUnits=1
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1CivilianLossMessage
Action_ObjectivesFailed=Civilians

[Taskforce1_Objectives]
Identify=30,-30,Complete,Main
Engage=60,-60,None,Main
Civilians=30,-30,Complete,Main

