; ============================================================
;  MISSION 01 - SHOW OF FORCE
;  Operation STEADFAST LANTERN
;  Skagerrak, 57.67 N / 8.26 E  (verified open water, -285 m)
;  All unit positions verified against the game DEM - no unit on land.
;
;  DESIGN NOTE - why the Nordverband starts NEUTRAL:
;  Taskforce2 is ALWAYS hostile from t=0, so anything placed there
;  opens fire before the story says it should. The three renegade
;  combatants therefore start as Neutral (hostile to nobody, and
;  un-attackable by the player) and are handed to Taskforce2 by
;  Trigger2 at the moment of the ultimatum. Only Vahl's flagship
;  sits in Taskforce2 from the start - 98 nm out, far beyond any
;  weapon, purely so the player has one declared hostile on the plot.
;
;  THE ANCHOR IS A POSITION TEMPLATE, NOTHING MORE.
;  Under Generated + TaskForceModeDeploymentOptions=True the generator
;  reads only RelativePositionInNM, Telegraph, Heading (and Waypoints)
;  from [Taskforce1Vessel1], then DELETES the section and rewrites the
;  player's purchased ships into Vessel1..VesselN, overwriting
;  NumberOfTaskforce1Vessels itself. Every other key here - CrewSkill,
;  WeaponStatus, StationRole, Morale, Nation - is discarded and never
;  reapplied, so setting them is pointless rather than harmful.
;  Do not add further [Taskforce1VesselN] sections: they are collected
;  into the omitted set and deleted before regeneration.
;  Formation comes from campaign.ini (TaskForceModeDefaultDisposition).
; ============================================================

[Language_en]
Name=SHOW OF FORCE
Description=The renegade standing group has closed the Baltic approaches. TG NORTHWIND deploys into the Skagerrak to establish presence and determine who is still under alliance command. Weapons tight. Do not fire first.

ZoneNorthwindDeploymentLabel=TG NORTHWIND DEPLOYMENT
SymbolTrafficLaneLabel=SKAGERRAK APPROACHES - BLOCKADE ZONE

Objective_Identify=Establish presence in the Skagerrak operating area
Objective_Engage=Neutralise the renegade element once it opens hostilities
Objective_Civilians=Avoid civilian casualties in the shipping lane

Taskforce1StartMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=OPERATION ORDER - STEADFAST LANTERN\nSubj=Presence Operations, Skagerrak\nPrecedence=Immediate\nClassification=Secret\nTemplate=NATO\nBody=1. SITUATION. Elements of the standing group in the North Sea have refused alliance orders and are holding the Baltic approaches. The ships doing it are our own classes under our own flag, crewed by officers who went through the same schools yours did.\n\n2. Optical and electronic identification will not separate friend from renegade in this operating area. You will rely on datalink, position reporting and judgement.\n\n3. MISSION. Establish presence in the Skagerrak box. Identify the units operating there. Keep the shipping lane open.\n\n4. RULES OF ENGAGEMENT. WEAPONS TIGHT. You will not fire first. The political situation would not survive it, and the alliance is still trying to end this without a war.\n\n5. Merchant traffic through the straits is heavy and continuous. Every contact is presumed civilian until it proves otherwise. Civilian casualties will be charged against you.\n\n6. One declared hostile is plotted to the west at long range. Leave him there. Your business this morning is the ships in the lane.\nButtonText=Assume command\nPopupStyle=NavalMessage
Taskforce1DefectMessage=From=FGS SCHLESWIG-HOLSTEIN\nTo=TG NORTHWIND\nInfo=SIGNAL IN CLEAR - ALL STATIONS\nSubj=\nPrecedence=Flash\nClassification=Unclassified\nTemplate=NATO\nBody=NORTHWIND, THIS IS NORDVERBAND.\n\nThe alliance has had five weeks to decide something and has decided nothing, so we have decided for it. The approaches stay shut until someone in Brussels signs something.\n\nYou were sent to look at us. You have looked. Turn back.\n\n// FLASH - CONTACTS IN THE LANE HAVE OPENED FIRE //\n\nThe decision has been taken out of your hands. WEAPONS FREE on declared hostiles only.\n\nWatch your background. There are merchants behind them and they know it.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Taskforce1WinMessage=From=Commander, TG NORTHWIND\nTo=Allied Maritime Command\nInfo=SITUATION REPORT\nSubj=Skagerrak - Area Secured\nPrecedence=Priority\nClassification=Secret\nTemplate=NATO\nBody=1. The renegade element in the Skagerrak box has been neutralised. The shipping lane is open.\n\n2. The Nordverband flagship stood off to the west throughout and did not engage. She has since withdrawn toward the Belts. Vahl traded three ships this morning to watch how far we would go, and he watched it from over the horizon.\n\n3. One further observation for the intelligence staff. A trawler under a flag of convenience held station in the traffic separation scheme for the duration of the engagement and never put out a net. Request she be identified.\n\n4. The main body of the group is still at sea, and the approaches are still shut.\nButtonText=End mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1TimeoutMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=RELIEF ON STATION\nSubj=Detachment\nPrecedence=Routine\nClassification=Secret\nTemplate=NATO\nBody=1. Your relief is on station. TG NORTHWIND is detached from the Skagerrak box.\n\n2. The renegade element held the operating area and you did not break it. Command will not record that as a failure: you were ordered not to start a war, and you did not.\n\n3. But nothing was decided this morning, and the approaches are still shut.\nButtonText=End mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1CivilianLossMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=FLASH\nSubj=Civilian vessel lost\nPrecedence=Flash\nClassification=Secret\nTemplate=NATO\nBody=1. A civilian vessel has been destroyed inside the separation scheme. Casualty reports will follow.\n\n2. Continue the mission.\nButtonText=Acknowledge\nPopupStyle=NavalMessage

[Environment]
; 17 April at 57.67 N / 8.26 E, all times UTC:
;   nautical twilight 02:34 - civil twilight 03:30 - sunrise 04:20
; Start 03:40 = first light, brightening through the approach, with Trigger2
; at +40 min landing on sunrise. Bright enough to see, early enough that the
; sun is not simply up - and the Nordverband declares itself as the light does.
;   Want full darkness instead?  Time=2,45  and Clouds=Overcast
;   Want plain daylight?         Time=6,0
Date=2028,4,17
Time=3,40
ConvertTimeToLocal=False
SeaState=4
Clouds=Scattered_1
WindDirection=W
MapCenterLatitude=57.67
MapCenterLongitude=8.26
LoadBackgroundData=False

[Mission]
Difficulty=3
PlayerTaskforce=Taskforce1
EnemyTaskforce=Taskforce2
NumberOfTaskforce1Vessels=1
NumberOfTaskforce2Vessels=1
NumberOfNeutralVessels=10
Taskforce1_NumberOfFormations=0
Taskforce2_NumberOfFormations=0
Neutral_NumberOfFormations=0
