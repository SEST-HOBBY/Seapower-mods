; ============================================================
;  MISSION 04 - STEADFAST LANTERN
;  Operation STEADFAST LANTERN - the finale
;  Bornholm Basin, 55.02 N / 13.26 E - dawn
;
;  Longer than the others by design: a six-hour clock, open water
;  and no coastline to hide behind. Vahl is out of sea room.
;
;  TWO ENDINGS, decided by target selection - not by a menu.
;    Kill his ESCORTS first and leave the flagship afloat, and he
;    surrenders (Trigger4).
;    Kill the FLAGSHIP first and Trigger3 permanently disables the
;    surrender path, because there is nobody left who can order one.
;    Then it ends the only other way it can (Trigger5).
;  The whole campaign has argued that restraint is the harder course.
;  This is where the player either proves it or does not.
;
;  ---- BALANCE REBUILD, 11 Aug 2026 -------------------------------
;  Playtest report: "started with near immediate blaze of missile
;  fire / counter-fire expending nearly all ordnance < 2 mins since
;  every ship was so close."
;
;  Cause, measured from the files: the whole engagement box was 46 nm
;  wide while the shortest anti-ship missile in it (RBS-15) reaches
;  108 nm and NSM reaches 165.6. There was no approach phase because
;  there could not be one. Contact came from HELICOPTERS, not ship
;  radar - rnn_ddg_zeven_mlu ships a default [AirGroup] nl_nh90=1,
;  so both escorts carried an airborne 200 km AirAndSurface datalink
;  radar the mission never accounted for. A helo at normal cruise
;  altitude sees a ship at 41-52 nm, which is exactly the range at
;  which everything opened fire.
;
;  Fix - NOTHING is nerfed. Full magazines, unmodified sensors.
;    1. Opening range tripled: 52 / 83 / 88 / 102 nm. Every position
;       and waypoint checked against the game's own terrain, 0 errors.
;    2. The Nordverband loses its two NH90 (CustomAirGroup=True with
;       no aircraft line - the pattern of 01 Raid on Okinawa.ini:473).
;       Three weeks at sea without maintenance support. He now sees
;       roughly 20 nm and can only react.
;    3. The player has to earn his picture: own helicopter at altitude
;       first, Swedish GlobalEye from T+25 min. The initiative, and
;       therefore the choice of engagement range, is his.
;
;  ---- MEASURED IN THE SENSOR TEST, 11 Aug 2026 -------------------
;  Two stationary task forces at 40 / 70 / 100 nm, nobody moving:
;    - ship radar alone produces NO surface contacts at any of them.
;      The layout below therefore starts with nobody in contact.
;    - ESM does pick up a radiating warship at roughly 87 nm, which
;      is inside the escort distances here. Hence EMCON below.
;    - the nearest target shot down a helicopter at 40 nm although
;      every unit in that mission carried WeaponStatus=Hold. Hold is
;      not honoured for the enemy taskforce - assume they always
;      shoot what they can see. That is also why EMCON matters for
;      ARGUS: SM-2 reaches 110 nm and this basin is narrower than
;      that, so there is no safe orbit. A ship with its radars off
;      has no air picture to shoot her with, and lighting up to get
;      one is exactly what gives Vahl's position away.
;
;  ---- HUNT, DESTROY OR CAPTURE -----------------------------------
;  RadarsActive=False on all three Nordverband ships. He went dark
;  and he is somewhere in a hundred miles of basin. The mission is
;  no longer a meeting engagement - it is a search that ends in a
;  choice, and the surrender path is now a literal capture: the
;  flagship transfers to Taskforce1 in Trigger4.
;
;  ---- 14 Aug 2026: U32 FORWARD RELEASE + HONEST SCORING ----------
;  1. Zone_LanternSubRelease (AllowedUnitTypes=Submarine) 18 nm west
;     of U31's patrol - deployed at the anchor the boat had 52 nm to
;     swim and never reached the fight. Briefing para 3 and the launch
;     popup point the player at it. Dev pattern: 09 Shadows off
;     Palawan Zone2.
;  2. Trigger3 now fails Restraint immediately; Trigger6 (timeout)
;     fails Break and Resolve instead of resolving nothing.
; ============================================================

[Language_en]
Name=STEADFAST LANTERN
Description=Vahl has taken what remains of the standing group into the open water of the Bornholm Basin. How this ends depends on what you shoot at first.

ZoneLanternDeploymentLabel=TG NORTHWIND DEPLOYMENT
ZoneLanternSubDeploymentLabel=U32 RELEASE AREA
SymbolBasinLabel=BORNHOLM BASIN - FINAL ENGAGEMENT AREA

Objective_Locate=Find the Nordverband flagship
Objective_Break=Destroy the Nordverband escort
Objective_Resolve=Bring the operation to an end
Objective_Restraint=Take Vahl's surrender rather than his ship

Taskforce1StartMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=OPERATION ORDER - FINAL PHASE\nSubj=Bornholm Basin - hunt, destroy or capture\nPrecedence=Immediate\nClassification=Secret\nTemplate=NATO\nBody=1. SITUATION. What is left of the standing group went dark at 2030 last night and has not transmitted since: two Dutch air-defence destroyers, one submarine, and the flagship. The last fix is eight hours old. The basin is a hundred miles across and he is somewhere in it.\n\n2. Running silent cuts both ways. He cannot see much either, and the loudest thing in this sea area for the next few hours will be you. Every radar you light and every active ping you send is a bearing he does not otherwise have. Assume he is listening.\n\n3. His last boat is out there ahead of him, and no frigate of yours will find a Type 212A passively. That is work for U32. Her release area is marked on your chart, forward of the task force; put her there during deployment and let her deal with the picket while your surface group keeps its distance.\n\n4. MISSION. Find the Nordverband. Destroy it, or take its surrender.\n\n5. A note that is not an order, because nobody will put it in writing. Vahl has not fired on a neutral ship in three weeks, and about the paralysis he was protesting he was not entirely wrong. If the chance presents itself to end this with him alive, the political staff would prefer it. So, for what it is worth, would the people who trained with him.\n\n6. That decision is yours, and you will make it with your weapons. Choose deliberately.\nButtonText=Assume command\nPopupStyle=NavalMessage
Taskforce1LocatedMessage=From=Operations\nTo=Commander, TG NORTHWIND\nInfo=CONTACT REPORT\nSubj=Nordverband flag\nPrecedence=Flash\nClassification=Secret\nTemplate=NATO\nBody=Flagship classified. That is F218, and that is Vahl.\n\nNo radar from him since last night, and none now. Whatever he means to do, he means to do it blind.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Taskforce1VahlMessage=From=NORDVERBAND FLAG\nTo=TG NORTHWIND\nInfo=SIGNAL IN CLEAR\nSubj=\nPrecedence=Flash\nClassification=Unclassified\nTemplate=NATO\nBody=NORTHWIND, this is Vahl.\n\nI know what I have left. So do you.\n\nBrussels signed something at 0400 this morning, six weeks late, and only because I closed the door. I am told the signature makes me a criminal rather than a lever. I can live with that.\n\nI will not run into the Baltic, and I will not strike my flag while my escorts are still afloat. Do what you came to do.\n\nWe are, all of us, still the same navy. Remember that when you choose what to shoot at.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Taskforce1SupportMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=SUPPORT RELEASE - AIR SURVEILLANCE\nSubj=ARGUS\nPrecedence=Immediate\nClassification=Secret\nTemplate=NATO\nBody=1. The resolution signed in Brussels at 0400 releases theatre assets to this operation. You needed them nine days ago. You have them now.\n\n2. A Swedish Air Force GlobalEye of 17 Wing has been flying Baltic surveillance out of Ronneby since the approaches were closed. Until 0400 we were not permitted to pass you her picture. That restriction is lifted.\n\n3. She is re-tasked to your operating area. Callsign ARGUS, on station in approximately one five minutes, surface picture direct to your link.\n\n4. She is what can reach you inside the hour. Everything else the resolution released is a day away, and this will be over by then.\n\n5. Why the signature took three engagements and a closed strait to obtain is a question for the inquiry, not for this morning.\nButtonText=Roger, out\nPopupStyle=NavalMessage
Taskforce1ArgusMessage=From=ARGUS\nTo=TG NORTHWIND\nInfo=AEW ON STATION\nSubj=\nPrecedence=Priority\nClassification=Secret\nTemplate=NATO\nBody=NORTHWIND, ARGUS. On station angels three zero, orbiting west of you, surface picture on your link now.\n\nHolding four contacts in the basin, disposed in depth, nothing airborne over any of them. Nobody down there can see past his own horizon this morning; you can.\n\nWe are unarmed. Keep the missiles off us and we will stay up here as long as you need the picture.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Taskforce1ArgusLostMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=FLASH\nSubj=ARGUS\nPrecedence=Flash\nClassification=Secret\nTemplate=NATO\nBody=1. ARGUS is down. An unarmed Swedish surveillance aircraft, destroyed in international airspace; what follows from that is for governments to deal with.\n\n2. You are on your own sensors from this moment. Continue the mission.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Taskforce1SurrenderMessage=From=NORDVERBAND FLAG\nTo=TG NORTHWIND\nInfo=SIGNAL IN CLEAR - ALL STATIONS\nSubj=Cessation\nPrecedence=Flash\nClassification=Unclassified\nTemplate=NATO\nBody=NORTHWIND, this is Vahl.\n\nMy escort is gone and you have not fired on this ship. I understand what that means.\n\nOperation TORWACHT is terminated. The approaches are open as of this signal. I am hauling down and proceeding to Kiel under your escort, and I will answer for all of it. That is what I was asking the alliance to do six weeks ago, so there is a kind of order in it.\n\nMy people acted on my instruction. Say that at the inquiry.\n\nTo the officers of this task group: holding fire this morning was not a small thing. In time somebody will call it sentiment. The people who were on this water will know better.\nButtonText=Accept surrender\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1DestroyedMessage=From=Commander, TG NORTHWIND\nTo=Allied Maritime Command\nInfo=SITUATION REPORT\nSubj=Bornholm Basin - Operation Concluded\nPrecedence=Priority\nClassification=Secret\nTemplate=NATO\nBody=1. The Nordverband is destroyed. The flagship went down with Konteradmiral Vahl aboard. The Baltic approaches are open.\n\n2. The operation is concluded. The objective is met in full.\n\n3. There will be an inquiry. It will find that Vahl closed a strait because his alliance could not decide anything, and that the alliance decided six weeks too late for the deciding to matter out here.\n\n4. Nobody aboard is celebrating.\nButtonText=End mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1TimeoutMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=WITHDRAWAL ORDER\nSubj=Detachment\nPrecedence=Routine\nClassification=Secret\nTemplate=NATO\nBody=1. Break off and withdraw west. Relief is en route.\n\n2. He is still out there with his flag up, and the approaches are still his.\nButtonText=End mission\nPopupStyle=NavalMessage\nMessageRole=Outro

