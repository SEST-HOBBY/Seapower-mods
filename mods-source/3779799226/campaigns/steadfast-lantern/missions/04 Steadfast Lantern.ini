; --- the branch ---
; Kill the flagship and there is nobody left to order a surrender.
; This permanently disables the surrender path, and the Restraint
; objective flips to failed on the spot - the debrief consequence is
; visible the moment the choice is made, not at mission end.
[Trigger3]
Name=FlagshipKilled
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=Taskforce2Vessel1
ConditionsCompleted=<Condition1>
Action_DisableTriggers=Trigger4
Action_ObjectivesFailed=Restraint

; Escort destroyed while the flagship is still afloat -> surrender.
; If the flagship died first, Trigger3 has already disabled this.
[Trigger4]
Name=Surrender
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=Taskforce2Vessel2,Taskforce2Vessel3,Taskforce2Submarine1
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1SurrenderMessage
Action_ObjectivesCompleted=Locate,Break,Resolve,Restraint
Action_Victory=Taskforce1
; The capture, made literal: F218 hauls down and comes over. The
; 25 s delay is there so it is actually visible before the debrief.
Action_UnitTransferToTaskforce=Taskforce1
Action_Units=Taskforce2Vessel1
Action_EndMissionDelay=25
Action_EndMission=True

; Everything destroyed, flagship included.
[Trigger5]
Name=AllDestroyed
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=Taskforce2Vessel1,Taskforce2Vessel2,Taskforce2Vessel3,Taskforce2Submarine1
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1DestroyedMessage
Action_ObjectivesCompleted=Locate,Break,Resolve
Action_ObjectivesFailed=Restraint
Action_Victory=Taskforce1
Action_EndMissionDelay=25
Action_EndMission=True

; Six hours. This one is meant to be long. On timeout the operation
; was not brought to an end and the escort is still (at least partly)
; afloat, so Break and Resolve fail explicitly - all four objectives
; carry None in the status column and previously resolved to nothing.
; Locate stays as Trigger11 left it; Restraint stays unresolved at 0.
[Trigger6]
Name=Timeout
Condition_Condition1_Type=Time
Condition_Condition1_Time=21600
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1TimeoutMessage
Action_ObjectivesFailed=Break,Resolve
Action_EndMissionDelay=10
Action_EndMission=True

