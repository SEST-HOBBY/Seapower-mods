; ------------------------------------------------------------
;  TRIGGERS
; ------------------------------------------------------------
[Trigger1]
Name=Briefing
Condition_Condition1_Type=Time
Condition_Condition1_Time=5
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1StartMessage

; The convoy masters call once the player is on the plot.
[Trigger2]
Name=ConvoyCall
Condition_Condition1_Type=Time
Condition_Condition1_Time=420
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1ConvoyMessage

; Two win triggers, split on whether the convoy survived - the boolean
; gate is the developers' own pattern (05 Shadow of the Enterprise:
; "<Condition2> AND NOT <Condition1>"). Neither completes Convoy by
; hand any more: the objective resolves through its Complete column at
; mission end unless a loss trigger has already failed it. The old
; single trigger re-completed Convoy over a failed state and announced
; "convoy clearing north" over a burning ferry.
[Trigger3]
Name=LineBroken
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=Taskforce2Vessel1,Taskforce2Vessel2,Taskforce2Vessel3
Condition_Condition2_Type=UnitDestroyed
Condition_Condition2_Units=NeutralVessel1,NeutralVessel2,NeutralVessel3
Condition_Condition2_MinimumUnits=1
ConditionsCompleted=<Condition1> AND NOT <Condition2>
Action_Taskforce1_Message=Taskforce1WinMessage
Action_ObjectivesCompleted=Break
Action_Victory=Taskforce1
Action_DisableTriggers=Trigger7
Action_EndMissionDelay=20
Action_EndMission=True

; Losing a convoy hull does not end the mission - it just costs,
; permanently, which is the point. MinimumUnits=1 makes any single
; loss fail the objective; the old pair of triggers (Vessel1 alone,
; Vessel2+Vessel3 together) let a lone loss of Vessel2 or Vessel3
; slip through the all-destroyed default unpunished.
[Trigger4]
Name=ConvoyLost
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=NeutralVessel1,NeutralVessel2,NeutralVessel3
Condition_Condition1_MinimumUnits=1
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1ConvoyLostMessage
Action_ObjectivesFailed=Convoy

; Ordinary traffic in the separation scheme. Without this trigger the
; Civilians objective auto-completed at mission end regardless.
[Trigger5]
Name=CivilianLoss
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=NeutralVessel4,NeutralVessel5,NeutralVessel6,NeutralVessel7
Condition_Condition1_MinimumUnits=1
ConditionsCompleted=<Condition1>
Action_ObjectivesFailed=Civilians

; Timeout means the line held and the convoy stays inside it - say so
; in the score instead of letting the Complete column award +60 for a
; convoy that never moved.
[Trigger6]
Name=Timeout
Condition_Condition1_Type=Time
Condition_Condition1_Time=10800
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1TimeoutMessage
Action_ObjectivesFailed=Break,Convoy
Action_EndMissionDelay=10
Action_EndMission=True

; The pyrrhic ending: line broken, but not every ship inside it came
; out. Convoy was already failed by Trigger4 and stays failed.
[Trigger7]
Name=LineBrokenAtCost
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=Taskforce2Vessel1,Taskforce2Vessel2,Taskforce2Vessel3
Condition_Condition2_Type=UnitDestroyed
Condition_Condition2_Units=NeutralVessel1,NeutralVessel2,NeutralVessel3
Condition_Condition2_MinimumUnits=1
ConditionsCompleted=<Condition1> AND <Condition2>
Action_Taskforce1_Message=Taskforce1WinCostMessage
Action_ObjectivesCompleted=Break
Action_Victory=Taskforce1
Action_DisableTriggers=Trigger3
Action_EndMissionDelay=20
Action_EndMission=True

[Taskforce1_Objectives]
Break=50,-50,None,Main
Convoy=60,-60,Complete,Main
Civilians=30,-30,Complete,Main

