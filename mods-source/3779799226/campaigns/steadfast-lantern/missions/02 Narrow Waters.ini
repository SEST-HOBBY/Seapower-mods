; ============================================================
;  MISSION 02 - NARROW WATERS
;  Operation STEADFAST LANTERN
;  Northern Kattegat, 57.58 N / 11.34 E
;  Jutland to the west, Sweden to the east - the navigable water
;  is barely 30 nm wide. All positions verified against the DEM.
;
;  The Nordverband is now a DECLARED hostile, so unlike mission 01
;  its ships sit in Taskforce2 from t=0. They still fly the German
;  ensign: the ambiguity that remains is telling a warship from a
;  merchant at long range in the busiest water in northern Europe.
;
;  They hold a barrier line across the narrows rather than closing.
;  That is deliberate - see MissionType=ASuWBarrier below.
; ============================================================

[Language_en]
Name=NARROW WATERS
Description=The Nordverband has stopped a merchant convoy in the northern Kattegat and holds it inside its blockade line. Free the convoy. The water is thirty miles wide and full of neutral traffic, and every shot you take has a coastline behind it.

ZoneNarrowDeploymentLabel=TG NORTHWIND DEPLOYMENT
SymbolNarrowsLabel=THE NARROWS - BLOCKADE LINE
SymbolConvoyLabel=DETAINED CONVOY

Objective_Break=Break the blockade line across the narrows
Objective_Convoy=Bring the detained convoy out intact
Objective_Civilians=Avoid civilian casualties in the traffic separation scheme

Taskforce1StartMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=OPERATION ORDER\nSubj=Convoy Relief, Northern Kattegat\nPrecedence=Immediate\nClassification=Secret\nTemplate=NATO\nBody=1. SITUATION. Following the engagement in the Skagerrak the standing group is a declared hostile force. It has moved south and closed the northern Kattegat.\n\n2. Three renegade units hold a barrier line across the narrows. Behind that line they are holding a merchant convoy of three ships, whose masters report that requests to proceed and requests to turn back are both refused.\n\n3. MISSION. Break the line and bring the convoy out.\n\n4. The navigable water here is thirty miles wide, with Jutland to the west and Sweden to the east. Neutral traffic is continuous and there is a coastline behind every bearing, which is exactly why they chose this stretch of water.\n\n5. They still fly our ensign. Identify before you engage.\nButtonText=Assume command\nPopupStyle=NavalMessage
Taskforce1ConvoyMessage=From=MV NORDLAND\nTo=TG NORTHWIND\nInfo=DISTRESS - RELAYED\nSubj=\nPrecedence=Flash\nClassification=Unclassified\nTemplate=NATO\nBody=NORTHWIND, this is the master of NORDLAND, speaking for all three of us.\n\nThey came aboard at 0400 and left again. They have not harmed anyone. They simply will not let us move, and they will not let us anchor.\n\nWe have four hundred and ten people between the three ships, including passengers on the ferry.\n\nWe can see you on the radar. Please be careful. We are directly behind them.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Taskforce1WinMessage=From=Commander, TG NORTHWIND\nTo=Allied Maritime Command\nInfo=SITUATION REPORT\nSubj=Northern Kattegat - Blockade Broken\nPrecedence=Priority\nClassification=Secret\nTemplate=NATO\nBody=1. The barrier line across the narrows has been broken. The detained convoy is under way and clearing north with all three ships.\n\n2. Vahl did not reinforce the line and did not intervene. That is three more hulls he has traded for a look at how we fight in confined water, and he took the look from the mouth of the Belts.\n\n3. Intelligence note: the trawler reported in the Skagerrak, or one indistinguishable from it, was on station throughout, three miles outside the engagement area. Same flag of convenience. Still no nets.\nButtonText=End mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1WinCostMessage=From=Commander, TG NORTHWIND\nTo=Allied Maritime Command\nInfo=SITUATION REPORT\nSubj=Northern Kattegat - Blockade Broken\nPrecedence=Priority\nClassification=Secret\nTemplate=NATO\nBody=1. The barrier line across the narrows has been broken. The surviving convoy ships are under way north.\n\n2. The convoy did not come out whole. The casualty signal follows under separate cover.\n\n3. Intelligence note: the trawler reported in the Skagerrak, or one indistinguishable from it, was on station throughout, three miles outside the engagement area. Same flag of convenience. Still no nets.\nButtonText=End mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1ConvoyLostMessage=From=Commander, TG NORTHWIND\nTo=Allied Maritime Command\nInfo=CASUALTY REPORT\nSubj=Merchant Losses, Northern Kattegat\nPrecedence=Flash\nClassification=Secret\nTemplate=NATO\nBody=1. A ship of the detained convoy has been lost.\n\n2. Whatever else is decided about this operation, that is the number people will remember.\nButtonText=Acknowledge\nPopupStyle=NavalMessage
Taskforce1TimeoutMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=WITHDRAWAL ORDER\nSubj=Detachment\nPrecedence=Routine\nClassification=Secret\nTemplate=NATO\nBody=1. Withdraw from the narrows. The convoy remains where it is.\n\n2. The line held. Four hundred and ten people spend another night inside it.\nButtonText=End mission\nPopupStyle=NavalMessage\nMessageRole=Outro

