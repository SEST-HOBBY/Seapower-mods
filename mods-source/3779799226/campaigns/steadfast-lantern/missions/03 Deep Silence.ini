; ------------------------------------------------------------
;  U32 - borrowed, not bought. The task force is in the yard.
;
;  TowedArrayDeployed=True is the most important line in this file.
;  eu_TAS-3 streams at 120 ft; every towed array on a surface hull in
;  this campaign wants 800-984 ft, and there are 31-141 m of water here.
;  This boat carries the only array dimensioned for the sea it fights in,
;  which is the whole reason the mission is winnable from a submarine and
;  was not from a frigate.
;
;  JoinTaskForce=True + CampaignTag: she survives into the campaign at no
;  points cost. (Only here - on an authored player section - does that
;  pair work; see the defector note below.)
;
;  Start is the deep channel in the east - 111 m, and about 20 nm from
;  the barrier: roughly two hours of approach at patrol speed out of a
;  four-hour mission.
; ------------------------------------------------------------
[Taskforce1Submarine1]
Type=ger_ssk_type_212a_batch1
VariantReference=Variant2
TaskForceModeAnchor=True
JoinTaskForce=True
CampaignTag=ger_ssk_type_212a_batch1_Variant2
UnlimitedFuel=False
TowedArrayDeployed=True
CrewSkill=Trained
Morale=3
RelativePositionInNM=14,shallow,12
Telegraph=2
Heading=200

; ------------------------------------------------------------
;  THE SUBMARINE BARRIER - two Type 212A holding the southern half of the
;  barrier box, 16 and 24 nm from the release point. Both carry the same
;  DM2A4 the player does, so range is no longer the deciding factor and
;  the approach is about who hears whom first.
;  WeaponStatus=Tight: Tight is the engine default, and Free was an
;  override that had them shooting before the player had a contact.
;  CrewSkill=Seasoned against the player's Trained - the format spec says
;  CrewSkill affects TMA speed only, so they convert a bearing into a
;  firing solution faster. That is the whole of their edge, and it is
;  enough.
; ------------------------------------------------------------
[Taskforce2Submarine1]
Type=ger_ssk_type_212a_batch1
VariantReference=Variant3
Nation=nordverband
FlagTexture=ships/materials/textures/flag_nordverband.png
UnlimitedFuel=False
WeaponStatus=Tight
CrewSkill=Seasoned
Morale=4
RelativePositionInNM=0,shallow,-8
Telegraph=1
Heading=180
MissionType=ASuWBarrier
Waypoints=0,shallow,-4/SetTelegraph,1|0,shallow,-10/SetTelegraph,1|Loop

