Difficulty=4
PlayerTaskforce=Taskforce1
EnemyTaskforce=Taskforce2
NumberOfTaskforce1Submarines=1
NumberOfTaskforce2Vessels=1
NumberOfTaskforce2Submarines=2
NumberOfNeutralVessels=4
Taskforce1_NumberOfFormations=0
Taskforce2_NumberOfFormations=0
Neutral_NumberOfFormations=0
