;  TRIGGERS
; ------------------------------------------------------------
[Trigger1]
Name=Briefing
Condition_Condition1_Type=Time
Condition_Condition1_Time=5
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1StartMessage

[Trigger2]
Name=Defection
Condition_Condition1_Type=Time
Condition_Condition1_Time=420
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1DefectionMessage
Action_UnitTransferToTaskforce=Taskforce1
Action_Units=NeutralVessel1,NeutralVessel2

; The defectors hand over the barrier plot - both boats are revealed,
; permanently (UnitRevealTime=-1). Story and mechanic in one. Without
; this the player is inside a 35 nm torpedo envelope with a 24 nm hull
; sonar against the quietest boat in the game, which is not a hunt.
[Trigger3]
Name=BarrierPlotHandover
Condition_Condition1_Type=Time
Condition_Condition1_Time=540
ConditionsCompleted=<Condition1>
Action_UnitRevealToTaskforce=Taskforce1
Action_Units=Taskforce2Submarine1,Taskforce2Submarine2
Action_UnitRevealTime=-1
; Receive is no longer completed here. "Receive the defecting units
; INTACT" means they have to survive the night: the objective resolves
; through its Complete column at mission end unless Trigger6 has failed
; it. Completing it at T+540 paid out +30 for ships that could still
; die an hour later.

[Trigger4]
Name=BarrierCleared
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=Taskforce2Submarine1,Taskforce2Submarine2
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1WinMessage
Action_ObjectivesCompleted=Hunt
Action_Victory=Taskforce1
Action_EndMissionDelay=20
Action_EndMission=True

; Timeout: the barrier survives the night, and the score says so.
[Trigger5]
Name=Timeout
Condition_Condition1_Type=Time
Condition_Condition1_Time=14400
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1TimeoutMessage
Action_ObjectivesFailed=Hunt
Action_EndMissionDelay=10
Action_EndMission=True

; The defectors are Taskforce1 units from T+420 and the 212As will
; engage them. Losing either one fails Receive - the corvettes joined
; the campaign roster as living ships, not as salvage.
[Trigger6]
Name=DefectorLost
Condition_Condition1_Type=UnitDestroyed
Condition_Condition1_Units=NeutralVessel1,NeutralVessel2
Condition_Condition1_MinimumUnits=1
ConditionsCompleted=<Condition1>
Action_Taskforce1_Message=Taskforce1DefectorLostMessage
Action_ObjectivesFailed=Receive

[Taskforce1_Objectives]
Hunt=70,-70,None,Main
Receive=30,-30,Complete,Main

