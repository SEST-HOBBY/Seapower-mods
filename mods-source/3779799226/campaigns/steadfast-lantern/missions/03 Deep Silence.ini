; ------------------------------------------------------------
;  MAGAZINE OVERRIDES - mission-local, the mod files are untouched.
;
;  As built each boat carries 13 DM2A4, 36 noisemakers and 12 MOSS decoys.
;  Forty-eight countermeasures against helicopter torpedoes rated 0.15 for
;  anti-countermeasure performance is not a hunt, it is a formality: eight
;  torpedoes went into the water in the last playtest and none of them
;  arrived. These counts keep both boats lethal and make them expendable.
;
;  Section form is [<unit>_WeaponSystem<N>] with Ammunition<N>_Count. It is
;  undocumented but shipped 78 times - see
;  original/missions/NATO/Sub Duel Pacific Shield 1971.ini:87.
;  Written once per magazine, on the first launcher that shares it:
;    WeaponSystem1..6  -> TorpedoRoom
;    WeaponSystem7..12 -> NoisemakerMagazine
;    WeaponSystem13,14 -> TorpedoDecoyMagazine
; ------------------------------------------------------------
[Taskforce2Submarine1_WeaponSystem1]
Ammunition1_Count=8
[Taskforce2Submarine1_WeaponSystem7]
Ammunition1_Count=8
[Taskforce2Submarine1_WeaponSystem13]
Ammunition1_Count=2

[Taskforce2Submarine2_WeaponSystem1]
Ammunition1_Count=8
[Taskforce2Submarine2_WeaponSystem7]
Ammunition1_Count=8
[Taskforce2Submarine2_WeaponSystem13]
Ammunition1_Count=2

; ------------------------------------------------------------
;  Vahl, standing off to the east toward Bornholm. He has left the
;  boats to hold the Kattegat on their own - he is out of escorts.
;  His ships now fly his own ensign. FlagTexture in a mission file is
;  passed to the texture loader VERBATIM - no folder prepended, no
;  extension appended - so it needs the full path INCLUDING .png.
;  The example in MissionFileInformation.ini:395 omits the extension
;  and does not load; on a miss the engine writes a red 32x32
;  placeholder to that path, which is why the textures folder fills
;  with plausible-looking 154-byte files. Check Sea Power_Data/Logs/
;  for "Could not find flag override texture" before believing a flag
;  works.
; ------------------------------------------------------------
[Taskforce2Vessel1]
; F218 Mecklenburg-Vorpommern - the flagship
Type=ger_ffg_f123_2025_mlu
VariantReference=Variant4
Nation=nordverband
FlagTexture=ships/materials/textures/flag_nordverband.png
UnlimitedFuel=False
StationRole=Core
WeaponStatus=Hold
CrewSkill=Veterans
Morale=4
RelativePositionInNM=30,0,-15
Telegraph=1
Heading=110

