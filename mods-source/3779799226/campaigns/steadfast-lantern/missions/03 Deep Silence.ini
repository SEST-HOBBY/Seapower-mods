; ============================================================
;  MISSION 03 - DEEP SILENCE
;  Operation STEADFAST LANTERN
;  Central Kattegat, 57.05 N / 11.15 E - night
;
;  THE FLAG CHANGES HERE. Every Nordverband unit carries
;  FlagTexture=ships/materials/textures/flag_nordverband.png while
;  keeping Nation=germany:
;  the same ships, the same crews, a different ensign. That is the
;  point of no return the whole campaign has been walking toward.
;
;  THE PLAYER COMMANDS ONE BOAT. The task force is alongside after the
;  Kattegat and the campaign node sets TaskForceModeIncludesTaskForce=False
;  - the developers' own pattern for 03A Run Silent Run Deep. This is not a
;  difficulty setting, it is the only fair shape for this fight: against a
;  212A no surface hull in the roster can win. Its torpedo reaches 35 nm,
;  the best the player can buy reaches 16, it is the quietest boat of the
;  86 installed, and every towed array on a frigate wants 800-984 ft of
;  water that the Kattegat does not have. One 212A against two is hard.
;  A frigate against two was arithmetic.
;
;  Submarines use a DEPTH KEYWORD in the Y slot, not a number:
;  shallow | periscope | abovelayer | belowlayer | deep | verydeep.
;  Everything here sits SHALLOW. A thermal layer needs 500 ft of water
;  (environment.ini [Sonar] MinDepthForLayerAppearance) and there are
;  forty metres, so abovelayer/belowlayer/deep/verydeep all ask for a
;  band that does not exist and put the boat on the surface instead.
;
;  Defection runs the other way too: two Nordverband escorts come
;  over mid-mission (Trigger2) and fight the rest of the night on the
;  player's side. MEASURED 14 Aug 2026: they do NOT persist into the
;  campaign - JoinTaskForce=True + CampaignTag only work on authored
;  player sections (U32). Trigger-transferred neutrals are gone after
;  the mission, so every text now says they detach for debriefing.
; ============================================================

[Language_en]
Name=DEEP SILENCE
Description=Vahl has struck the alliance ensign and hoisted his own, and put two submarines into the Kattegat. Your task force is in the yard. You will do this from a boat of your own, in forty metres of water where neither side can hear anything. Somebody on the other side has been having second thoughts.

ZoneDeepDeploymentLabel=U32 RELEASE AREA
SymbolBarrierLabel=SUSPECTED SUBMARINE BARRIER

Objective_Hunt=Destroy the submarine barrier in the Kattegat
Objective_Receive=Receive the defecting units intact

Taskforce1StartMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=OPERATION ORDER\nSubj=Anti-Submarine Operations, Central Kattegat\nPrecedence=Immediate\nClassification=Secret\nTemplate=NATO\nBody=1. SITUATION. At 2140 the standing group struck the alliance ensign. Vahl has hoisted a flag of his own and signalled that his ships are no longer subject to alliance command in any respect.\n\n2. Whatever this was until tonight, it is a war now.\n\n3. He has moved two Type 212A boats into the central Kattegat. Forty metres of water, a cluttered bottom, and no thermal layer: a layer needs five hundred feet and nowhere in the Kattegat is that deep. Conditions could not suit a small AIP boat better, or suit the people hunting one from the surface worse.\n\n4. Your task force is alongside in Gothenburg. Two hulls took damage in the narrows, the yard has them opened up, and none of it can be hurried.\n\n5. U32 is released to you from the training flotilla, fully stored, with a crew that has never fired a shot in anger. She is the same class the other side is running and she carries the same torpedo. Boat against boat is an even fight tonight; nothing on the surface would have been.\n\n6. MISSION. Find and destroy the submarine barrier. Vahl has taken his surviving surface units east and left the boats to hold the Kattegat alone.\n\n7. One further matter. Naval intelligence has been contacted, in the clear, by officers aboard two of Vahl's escorts. Treat any approach with extreme caution and do not fire on a unit that is transmitting in the clear.\nButtonText=Assume command\nPopupStyle=NavalMessage
Taskforce1DefectionMessage=From=FGS ERFURT and FGS OLDENBURG\nTo=TG NORTHWIND\nInfo=SIGNAL IN CLEAR\nSubj=\nPrecedence=Flash\nClassification=Unclassified\nTemplate=NATO\nBody=NORTHWIND, this is Erfurt, with Oldenburg in company.\n\nWe took an oath and we have spent three weeks arguing about what it meant. We finished arguing this evening when the admiral hauled down the flag.\n\nWe are coming over. Our weapons are tight and they will stay tight until you tell us otherwise.\n\nBe aware: we know where one of the boats is. We were screening for them yesterday.\nButtonText=Bring them in\nPopupStyle=NavalMessage
Taskforce1WinMessage=From=Commander, TG NORTHWIND\nTo=Allied Maritime Command\nInfo=SITUATION REPORT\nSubj=Central Kattegat - Barrier Cleared\nPrecedence=Priority\nClassification=Secret\nTemplate=NATO\nBody=1. The submarine barrier in the central Kattegat is destroyed. U32 is undamaged and remains attached to this task group.\n\n2. FGS ERFURT and FGS OLDENBURG came through the night intact. They handed over the barrier plot before we made contact; without it this would have taken until morning and cost more than it did. Both detach for Kiel at first light, where the inquiry is waiting for them.\n\n3. For the record, this was not winnable from the surface. Every towed array on our frigates wants deeper water than the Kattegat has, and their torpedo outranges every anti-submarine weapon we own. It took their own class of boat to get close enough.\n\n4. Vahl has withdrawn east toward Bornholm with the remainder of the group. There is not much sea room left out there.\n\n5. Replenish and stand by for further tasking.\nButtonText=End mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1TimeoutMessage=From=Allied Maritime Command\nTo=Commander, TG NORTHWIND\nInfo=WITHDRAWAL ORDER\nSubj=Detachment\nPrecedence=Routine\nClassification=Secret\nTemplate=NATO\nBody=1. Dawn is coming and the barrier is still there. Break off and take U32 north.\n\n2. Nobody blames a submarine commander for failing to find a 212A in forty metres of water; that is what the boat was built for. The Kattegat is no more open than it was last night.\nButtonText=End mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1DefectorLostMessage=From=Operations\nTo=Commander, TG NORTHWIND\nInfo=CASUALTY REPORT\nSubj=\nPrecedence=Flash\nClassification=Secret\nTemplate=NATO\nBody=1. One of the two ships that came over tonight has been lost.\n\n2. Recover survivors if the tactical situation allows. The other defector is still on the plot; keep her alive.\nButtonText=Acknowledge\nPopupStyle=NavalMessage

[Environment]
; Night. Sunset at this latitude on 22 April is about 1830 UTC, so 2330
; is full darkness - and against submarines it changes nothing, which is
; the joke the mission is built on.
Date=2028,4,22
Time=23,30
ConvertTimeToLocal=False
SeaState=3
Clouds=Overcast
WindDirection=NW
MapCenterLatitude=57.05
MapCenterLongitude=11.15
LoadBackgroundData=False

