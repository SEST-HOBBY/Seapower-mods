[AllowedVessels]
ger_ffg_f124_MLU=Sachsen-class frigates, out of mid-life upgrade since 2027 and the air-defence backbone of TG NORTHWIND. APAR and long-range volume search give them the only genuine area air-defence umbrella in the group, and they can operate the Sea Tiger. All three stayed loyal. They are expensive, and there are only three: lose one and you have lost the sky over the whole task force.
ger_ffg_f125_MLU=Baden-Wuerttemberg-class frigates, upgraded in 2028 and built for prolonged presence rather than fleet combat. Excellent endurance, a heavy gun and a large flight deck make them ideal for boarding, blockade and standing patrol, but their air defence is strictly self-protection, so keep them out of the missile line. The class was never given sonar or torpedo tubes; whatever anti-submarine work she does is done by the helicopter on her deck. Their sister Sachsen-Anhalt is on the other side.
ger_ffg_f123_2025_mlu=F217 Bayern, the only Brandenburg-class boat that is both modernised and loyal. A dedicated submarine hunter with towed array, two helicopters and credible point defence; in the shallow, noisy water of the Belts she is the most useful hull you can buy. She cannot take the Sea Tiger, because the class never completed the conversion and still flies the Sea Lynx. Two of her sisters are with the Nordverband, and Brandenburg herself is still in the yard.
ger_fsg_k130_batch2=Braunschweig-class corvettes, Batch 2, delivered from 2025 and the newest hulls in the fleet. Small, fast and cheap, built for exactly this coastal water, with an RBS-15 punch far out of proportion to their size. They have almost no air defence, no hangar and little endurance, so use them as scouts and ambushers rather than escorts. Against a submarine they are helpless: no sonar, no torpedoes. The renegades hold the older Batch 1 boats.
rnn_ddg_zeven_mlu=De Zeven Provincien-class air-defence frigates carry the same APAR radar family as the Sachsen class, a heavier missile load and strong command facilities. The most capable single escort available to you and a natural flagship, which also makes her the ship the other side will look for first. Dutch hulls sit outside the German national discount, so you pay the full listed price.
rnn_ffg_karel_mlu=Van Amstel and Van Speijk, the last two M-frigates left after the rest of the class was sold abroad. Compact, quiet and genuinely versatile: good sonar, Harpoon, an NH90, and enough self-defence to survive an air threat they did not start. The cheapest way to add a second ASW hull, crewed by the two most experienced ships' companies in the North Sea.

usn_ddg_burke_f2a_g4_2022=Arleigh Burke-class Flight IIA destroyers bring Aegis and a deep VLS magazine; nothing else in the roster can absorb a saturation attack the way one can. The Flight IIA landed its Harpoon launchers, though, so her surface answer is the 5-inch gun or the missile under her helicopter. Leave the anti-surface work to the corvettes and the Harpoon frigates and use her as the umbrella she is. She is also the most expensive purchase here, and a visible statement that Washington has taken a side.

[AllowedSubmarines]
ger_ssk_type_212a_batch1=Type 212A submarines run on air-independent propulsion and are close to silent at patrol speed, which makes them lethal in exactly the shallow water where surface sonar performs worst. She also carries the only towed array in this campaign dimensioned for forty metres of water; every array on a surface hull wants far deeper water than the Kattegat allows. If you intend to hunt in the Belts rather than be hunted, this is the hull that can do it. The other side runs the same class, crewed from the same school.

[AllowedHelicopters]
usn_mh-60r_26=MH-60R Seahawk in the 2026 fit, flown from the Arleigh Burke's deck. Dipping sonar, torpedoes and, unlike the destroyer carrying it, an anti-ship missile. If you buy the Burke, buy this too: her hangar is empty otherwise, and most of her anti-surface reach lives in this aircraft.
ger_nh90=NH90 Sea Tiger, in German service since the Sea Lynx retired at the end of 2026 after forty-five years. Longer legs, better sensors and a real cabin, flown from the deck of a Sachsen or a Baden-Wuerttemberg. When every hull on the plot looks identical, an aircraft that can fly out and visually identify a contact is worth more than another missile cell.
nl_nh90=NH90 NFH of 860 Squadron, the Dutch naval variant. Dipping sonar, torpedoes and a long look over the horizon from the deck of a Karel Doorman. Buy one if you take a Dutch frigate; she cannot embark anything else.
ger_sea_lynx_mk88=Sea Lynx Mk 88A, officially retired but not yet gone. The Brandenburg class never completed the transition to the Sea Tiger, so the older airframes still fly from her deck, with dipping sonar, torpedoes and crews who have been doing this a very long time. Buy one if your task force includes F217 Bayern; she cannot embark anything else.
