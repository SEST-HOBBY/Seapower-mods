; ============================================================
;  TG NORTHWIND - purchase catalogue
;  Format:  <unit_id>=<VariantRef,VariantRef,...>|<point cost>
;
;  Prices live HERE, not in the mod unit files. This is the
;  officially supported path since 0.8.1:
;    "[FIX] Task Force Mode: Restored points cost directly to
;     campaign roster to avoid conflict with modded base game
;     files producing 0 pt cost units"
;  No mod file is ever touched.
;
;  EVERY unit and variant below was checked against its own
;  ServiceDate=<from>|<to> for the campaign year 2028. Nothing here
;  is retired, and nothing has not yet entered service.
;  Notable exclusions and why:
;    ger_ffg_f124 / _ASMD            out of service 2015 / 2027
;    ger_ffg_f123_2015_essm          out of service 2025-2027
;    ger_ffg_f127                    enters service 2034
;    ger_fsg_k130_batch2_late        enters service 2030
;    ger_ssk_type_212a_*_upgraded    enters service 2029
;    rnn_ffg_karel (unmodernised)    all sold or paid off by 2011
;    rnn_ss_dolfijn                  the 1960s Dolfijn class, long gone
;
;  Variants are also split from the renegade order of battle so no
;  hull number ever appears twice in the same mission.
; ============================================================

[AllowedVessels]
; --- German Navy: the modern high end ---
; F124 MLU in service from 2027. All three boats stayed loyal.
ger_ffg_f124_MLU=Variant1,Variant2,Variant3|320
; F125 MLU from 2028. Sachsen-Anhalt (Variant3) went with the Nordverband.
ger_ffg_f125_MLU=Variant1,Variant2|240
; F123B: only F217 Bayern is loyal and available. F216 and F218 are with
; Vahl, and F215 Brandenburg herself is still in the yard until 2029.
ger_ffg_f123_2025_mlu=Variant3|260
; K130 Batch 2 - the new corvettes. The renegades took the Batch 1 boats.
ger_fsg_k130_batch2=Variant1,Variant2,Variant3,Variant4,Variant5|130

; --- Royal Netherlands Navy ---
; De Ruyter and Evertsen went with the Nordverband - only two are yours.
rnn_ddg_zeven_mlu=Variant1,Variant2|340
; Only Van Amstel and Van Speijk survive of the M-frigates; the rest of the
; class was sold off years ago. Both are here.
rnn_ffg_karel_mlu=Variant1,Variant2|210

; --- US Navy detachment (unlocked from mission 2) ---
usn_ddg_burke_f2a_g4_2022=Variant13,Variant14,Variant15|420

[AllowedSubmarines]
; Batch 1 boats, not the _upgraded refit - that one only commissions in 2029.
ger_ssk_type_212a_batch1=Variant1,Variant2,Variant3,Variant4|230

[AllowedHelicopters]
; The Sea Lynx Mk 88A left German service at the end of 2026 after 45 years,
; replaced by the NH90 Sea Tiger. Which helicopter a ship can take is fixed by
; its own AircraftSupported list:
;   F124 MLU / F125 MLU  -> ger_nh90 (Sea Tiger) or Sea Lynx
;   F123B Brandenburg    -> Sea Lynx ONLY, the class never converted
;   Karel Doorman MLU    -> nl_nh90 (Dutch NFH)
;   K130 corvettes       -> no hangar at all
ger_nh90=Squadron1|70
nl_nh90=Squadron1|70
ger_sea_lynx_mk88=Squadron1|45
; Kept purchasable although the hulls now ship their own: as installed,
; ger_ffg_f124_MLU and ger_ffg_f125_MLU carry ger_nh90=Squadron1,2, the Burke
; carries usn_mh-60r_26=Default,2 and both Dutch hulls one nl_nh90 each. Only
; the F123B has an empty [AirGroup] and the K130 has none at all. Buying is
; how you get a second airframe, a different type onto a hull that supports
; several, or anything at all onto the Brandenburg. The 2026 Seahawk build is
; the right one for 2028 and, unlike the ship under it, carries an anti-ship
; missile - and its AN/APS-153 is the only helicopter radar in this roster
; without LookDownMultiplier=0, so it is the only one that can find a ship.
usn_mh-60r_26=Squadron1|75
