[Language_en]
Name=Operation STEADFAST LANTERN
Description=April 2028. A multinational NATO standing group in the North Sea has been seized by its own staff and has closed the Baltic approaches. You command TG NORTHWIND. Both sides fly the same flag and sail the same hulls; identification will not tell you who is who.

Four missions: a presence operation in the Skagerrak under weapons-tight orders; a convoy held inside a blockade line in thirty miles of navigable water; a detached submarine operation against a Type 212A barrier in the night Kattegat; and a finale off Bornholm whose ending depends on what you shoot at first.

Requires the Euromod pack, Modern German Navy, Euromod-Dutch Navy, Sea Lynx, Modern US Navy, the French Helicopter Package and Saab Global Eye. Subscribe to the required items listed on the Workshop page and the game will pull them in.

PLEASE LOAD THIS MOD FIRST in the mod manager. It ships the nation list that gives the renegade task force its own ensign, and Sea Power only reads that file from the earliest mod in load order. If another mod loads above this one, the renegade crest falls back to a blank placeholder. The list is a union of every nation in the base game and in the packs above, so loading it first takes nothing away from them.

