[General]
#Shell for M109 Paladin
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW            // can be AAW, ASuW, ASW

Mass=43.2                               // in kg. Used for aircraft
AmmoPoints=73.2                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=800         // meter per second
MaxRange=38000             // in meters
CircularErrorProbable=0   // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=0
Power=6.8
ImpactSize=Medium          // Impact size, can be small, medium, large, verylarge
Penetration=Heavy          // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=5
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
AxialRotation=360                      // In degrees per second. Doesnt work when "SupportsBanking" is true
#========================================= Launch stats ============================================================
MaxVelocity=1556                       // Maximum speed in knots
Acceleration=140                       // Acceleration factor
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.2                       // Minimum launch range in nautical miles
MaxLaunchRange=13.5                      // Maximum launch range in nautical miles

LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=0                // Circular error radius in meter
#Homing
#ECCM
#GravityFactor=32.0
# Torpedo related
#SelfDestruct
[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_large_shell
HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground
HitGroundExplosionClass=MediumGroundHitExplosions