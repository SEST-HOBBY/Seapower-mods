Name=Project 2498 Zyetseth Class Assault Vessel

Description=This East German-built, second-generation container ship was taken in for Project 2498, a conversion program with the goal of taking a common bulk freighter and using it for a sudden, unexpected strike with an arsenal of hidden weapons and helicopters. Once discovered, it is not expected that the Zyetseth would be able to return home, but it is armed to go down fighting.

This mod includes:
One heavily modified Mercur Class Freighter
Custom Animations for everything onboard
SS-N-19's
SA-N-9's
SA-N6's
MG-44 Decoy Torps
CIWS
and ka-27's

Special thanks to:
Longbow for beta testing
Autiepup for naming this beast

