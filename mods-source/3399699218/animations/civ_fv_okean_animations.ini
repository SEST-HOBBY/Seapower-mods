[Animations]
NumberOfAnimations=80

Animation1=deploy
Animation2=undeploy

[deploy]
NumberOfSequencesToPlay=15
Sequence1=pivot
Sequence1_Model=pivot
Sequence2=lift
Sequence2_Model=rope2
Sequence3=holder
Sequence3_Model=torp_holder


[undeploy]
NumberOfSequencesToPlay=15
Sequence1=pivot_return
Sequence1_Model=pivot
Sequence2=drop
Sequence2_Model=rope2
Sequence3=holder2
Sequence3_Model=torp_holder

[------------------------------ Sequences ------------------------------]
[pivot_return]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationY1=-90
PositionZ1=0.175
PositionX1=0.005
Smoothness1=Linear  // can be: Linear, EaseInOut - transition to the next step
Time2=4                // time in seconds - here for the end
RotationY2=0
PositionZ2=0.165
PositionX2=0.005
Smoothness2=Linear  // can be: Linear, EaseInOut - is not used here as it's the last entry

[drop]
NumberOfSteps=2
Time1=4                // time in seconds for the start
PositionZ1=-0.03
Smoothness1=Linear  // can be: Linear, EaseInOut - transition to the next step
Time2=8                // time in seconds - here for the end
PositionZ2=-0.05
Smoothness2=Linear  // can be: Linear, EaseInOut - is not used here as it's the last entry

[holder2]
NumberOfSteps=3
Time1=1                // time in seconds for the start
PositionY1=-0.115
Smoothness1=Linear  // can be: Linear, EaseInOut - transition to the next step
Time2=4                // time in seconds - here for the end
