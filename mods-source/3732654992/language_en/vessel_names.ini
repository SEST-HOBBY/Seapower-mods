#Proj 12411T aka Tarantul II
Type=PTG,Missile Boat
Default=Projekt 1241.1M Molniya,Tarantul III 
DefaultDescription=The superstructures were redesigned and the angled mast of the previous projects has been replaced by a narrow, straight lattice. The sensor position remained almost the same as the Project 1241.1. The "Pechera" navigation radar was off the roof of the bridge, with the MR-123 "Vympel" fire control radar installed. Two jamming system (NATO: "Wine Glass") were installed on both sides at the foot of the mast. The reason for this was the installation of four SS-N-22 'Sunburn' supersonic ship-to-ship missiles with a range of at least 100 km. The associated radar system is the L-band 'Band Stand' radar, with a 120 km active and 500 km (310 mi) passive range and the capability to track 15 different targets. The missiles can also receive third party guidance through the 'Light Bulb' uplink (from other ships, helicopters or long range patrol aircraft). Cannon armament is retained, as were the PK-16 launchers, although Soviet Navy ships benefited from the improved SA-N-8 quadruple MANPADS launcher. At least one ship had an SA-N-11 Kashtan gun and missile CIWS installed instead of the AK-630s.The Tarantul-III, built from 1987 on, received an improved electronic countermeasures suite, consisting of two 'Half Hat' and two 'Foot Ball' jamming systems, coupled to four improved PK-10 decoy launchers. At least 24 of these ships were built for the Soviet Navy before production ended in 1992.
