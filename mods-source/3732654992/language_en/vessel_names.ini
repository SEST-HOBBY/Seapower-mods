[wp_bpk_udaloy2]
Type=BPK,Destroyer
Default=Project 1155.1 Fregat-M ,Fregat-M 
NatoDefault=Udaloy II-class,Udaloy II 
DefaultDescription=Known in Russian as the Fregat (Project 1155) the Udaloy is the most modern class of large anti-submarine ship in service with the Soviet Navy. These ships are heavily specialized, very modern ASW combatants with their 'Polinom' sonar suite and high-performance 'Kinzhal' point defense missiles, at the cost of any area air defense capability.\nThese ships were built in roughly three "batches" due to delays with the Kinzhal (SA-N-9 Gauntlet) missile system, with the earliest ships never receiving SAMs whatsoever, and the later ships being being extremely competent at missile defense with the full Kinzhal system installed.
