[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=7.7                     // in meters
Beam=3.3                       // in meters
Range=270                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

FrontalArea=0.1396
SideArea=1.04
BottomArea=1.25
[Tacview]
Name=2S3 Akatsiya
Tag=Ground+Vehicle+Artillery

[Physics]
HorsePower=520
Mass=27.5                      // in tons

MaxForwardVelocity=32.4        // in knots
MaxBackwardVelocity=5          // in knots
Braking=8                      // knots/sec
TurnRate=15                    // in degrees per second

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destructable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #2A33
Type=Gun
SystemName=2A33
#Sensors
#Animations
#Mount
Mount=TURRET
IsMountRotatable=True   #Containers
ContainerBase=MOUNT              #NEED TO MAKE CONTAIER OTHER THAN GUN FOR IT SO ROTATE WHOLE?
NumberOfGuns=1
Gun1=Gun
AreContainersRotatable=True    #FALSE IF MADE SEPARATE CONTAINER BASE 
#Angles
FiringArcs=-25,25
ElevationArc=-2,45
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
VIDIncrease=10  // In miles. Flat base VID increace when firing.


[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=2
Ammunition1=wp_152mm_2a33
Ammunition1_Count=42  // plus 4 in the gun
Ammunition2=wp_3bv3
Ammunition2_Count=4  // plus 4 in the gun
ModuleType=MediumMagazine

