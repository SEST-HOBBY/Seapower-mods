#SA-10 TEL trailer erector launcher vehicle
[General]
UnitType=LandUnit
LandUnitSubType=SAM

DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

FrontalArea=26.1
SideArea=17.2
BottomArea=4.61
[Tacview]
Name=SA-10
Tag=Ground+Vehicle+SAM

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=7  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small


[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.036,0.088
ModuleType=Bridge

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #SA-N-6
Type=Missile
SystemName=SA-N-6V2
#Sensors
#AssociatedSensors=SensorSystem2
ExternalGuidingSystems=92H6E
ExternalGuidingSystemSearchRadius=5     // in nmi
#Animations
#Mount
Mount=LAUNCHERS
IsMountRotatable=False
#Containers
NumberOfContainers=4
Container1=Dummy
Container1_Position=-0.009,0.0265,0.032
Container2=Dummy
Container2_Position=0.009,0.0265,0.032
Container3=Dummy
Container3_Position=-0.0168,0.0105,0.032
Container4=Dummy
Container4_Position=0.0168,0.0105,0.032
AreContainersRotatable=False
#Angles
#Loading
Ammunition=wp_40h6e
ReloadableWithoutMagazine=False
#Effects
#Other
WorksStandalone=False
AutoEnableSensor=True
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineLauncher] #Purely fictional to mitigate lack of reloading
NumberOfAmmunitionTypes=1
Ammunition1=wp_40h6e
Ammunition1_Count=16 //40 on vehicle + 80 in reloading vehicle
ModuleType=SmallMagazine



