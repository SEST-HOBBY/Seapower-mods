#SA-10 TEL trailer erector launcher vehicle
[General]
UnitType=LandUnit
LandUnitSubType=SAM

DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SA-10
Tag=Ground+Vehicle+SAM

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=7  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small


[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.036,0.088
ModuleType=Bridge

[SensorSystem2]  #Big_Bird
Type=Radar
SystemName=SNR-125
Mount=Peel_Group_1_Radar
ModuleType=Sensor

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=0



[--------------------------- Mesh definitions ---------------------------]
[Models]
ResourcesFolder=ground objects/wp_sa-10/
ResourcesRoot=wp_sa-10
ResourcesMesh=wp_sa-10_trailer
ResourcesMaterial=wp_sa-10_mat
############################################################
[Submodels]
Peel_Group_1_Mount=Peel_Group_1_Mount
Peel_Group_1_Radar=Peel_Group_1_Radar
Peel_Group_1_Trans=Peel_Group_1_Trans
BARB=BARB


[Peel_Group_1_Mount]
ResourcesMeshFolder=ships/wp_bpk_kanin/
RootMesh=wp_bpk_kanin
Mesh=wp_bpk_kanin_peel_group_base
ResourcesMaterialFolder=ships/materials/
Material=modular_parts
Scale=1,1,1
Position=0,0.06,-0.08


[Peel_Group_1_Radar]
ResourcesMeshFolder=ships/wp_bpk_kanin/
RootMesh=wp_bpk_kanin
Mesh=wp_bpk_kanin_peel_group_radar
ResourcesMaterialFolder=ships/materials/
Material=modular_parts
Parent=Peel_Group_1_Mount
Scale=1,1,1
Position=0,0.03,0

[Peel_Group_1_Trans]
ResourcesMeshFolder=ships/wp_bpk_kanin/
RootMesh=wp_bpk_kanin
Mesh=wp_bpk_kanin_peel_group_trans
ResourcesMaterialFolder=ships/materials/
Material=wp_peelgroup
Parent=Peel_Group_1_Radar
Position=0,0,0


[BARB]
ResourcesMeshFolder=weapons/usn_lau-68/
RootMesh=usn_lau-68
Mesh=usn_lau-68
ResourcesMaterialFolder=materials/ships/
Material=soviet_gray_mat.ini
Parent=
Position=0,0.05,-0.08
Scale=3.5,3.5,3
Rotation=-90,0,0


[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=ModerateShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
