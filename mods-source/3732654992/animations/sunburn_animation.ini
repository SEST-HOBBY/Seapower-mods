// sunburn_animation.ini - hatch animations for the Kitbash Pack Sunburn (SS-N-22) launcher sets.
// Reference it from your unit ini:   [Animations] / NumberOfAnimationReferences=N / AnimationFile_N=sunburn_animation
// and bind each tube to its animation in the [WeaponSystemN] (see sample.ini). Firing a missile from a tube opens BOTH of
// that tube's hatches (Sequence1 = aft hatch, Sequence2 = front hatch); the close animation plays after the launch.
// Sequence models are the SECTION names of the hatch submodels (sample.ini).
// 2x2 (quad) launchers: parts_sunburn_hatch_<fwd|aft>_<n>, starboard 1,3,5,7 / port 2,4,6,8 -> SunburnHatchOpen_<n> / Close_<n>.
// 1x2 (twin) launchers: parts_sunburn_1x2_hatch_<fwd|aft>_<n>, starboard 1,3 / port 2,4 -> Sunburn1x2HatchOpen_<n> / Close_<n>.
// A tube's front and aft hatch share its number.
// The hatch meshes pivot at their hinge, so only RotationY (about the hatch's own height axis) is needed.
// CW = +90 deg about Y, CCW = -90 deg. If a hatch swings into the launcher instead of away, swap its CW/CCW sequence.

[Animations]
NumberOfAnimations=24
Animation1=SunburnHatchOpen_1
Animation2=SunburnHatchOpen_2
Animation3=SunburnHatchOpen_3
Animation4=SunburnHatchOpen_4
Animation5=SunburnHatchOpen_5
Animation6=SunburnHatchOpen_6
Animation7=SunburnHatchOpen_7
Animation8=SunburnHatchOpen_8
Animation9=SunburnHatchClose_1
Animation10=SunburnHatchClose_2
Animation11=SunburnHatchClose_3
Animation12=SunburnHatchClose_4
Animation13=SunburnHatchClose_5
Animation14=SunburnHatchClose_6
Animation15=SunburnHatchClose_7
Animation16=SunburnHatchClose_8
Animation17=Sunburn1x2HatchOpen_1
Animation18=Sunburn1x2HatchOpen_2
Animation19=Sunburn1x2HatchOpen_3
Animation20=Sunburn1x2HatchOpen_4
Animation21=Sunburn1x2HatchClose_1
Animation22=Sunburn1x2HatchClose_2
Animation23=Sunburn1x2HatchClose_3
Animation24=Sunburn1x2HatchClose_4

[SunburnHatchOpen_1]
NumberOfSequencesToPlay=2
Sequence1=SunburnHatchOpenSeq_CW
Sequence1_Model=parts_sunburn_hatch_aft_1
Sequence2=SunburnHatchOpenSeq_CCW
Sequence2_Model=parts_sunburn_hatch_fwd_1

[SunburnHatchOpen_2]
