// ---- sequences: rotation about the hatch's own Y (height) axis; 3 steps like the stock file --------------------
[SunburnHatchOpenSeq_CW]
NumberOfSteps=3
Time1=0                // seconds: start
RotationY1=0
Smoothness1=EaseInOut  // Linear or EaseInOut: how this step blends into the next
Time2=2                // seconds: open complete
RotationY2=90
Smoothness2=EaseInOut
Time3=5                // seconds: hold the final pose
RotationY3=90
Smoothness3=EaseInOut

[SunburnHatchOpenSeq_CCW]
NumberOfSteps=3
Time1=0                // seconds: start
RotationY1=0
Smoothness1=EaseInOut  // Linear or EaseInOut: how this step blends into the next
Time2=2                // seconds: open complete
RotationY2=-90
Smoothness2=EaseInOut
Time3=5                // seconds: hold the final pose
RotationY3=-90
Smoothness3=EaseInOut

[SunburnHatchCloseSeq_CW]
NumberOfSteps=3
Time1=0                // seconds: start
RotationY1=90
Smoothness1=EaseInOut  // Linear or EaseInOut: how this step blends into the next
Time2=2                // seconds: closed complete
RotationY2=0
Smoothness2=EaseInOut
Time3=5                // seconds: hold the final pose
RotationY3=0
Smoothness3=EaseInOut

[SunburnHatchCloseSeq_CCW]
NumberOfSteps=3
Time1=0                // seconds: start
RotationY1=-90
Smoothness1=EaseInOut  // Linear or EaseInOut: how this step blends into the next
Time2=2                // seconds: closed complete
RotationY2=0
Smoothness2=EaseInOut
Time3=5                // seconds: hold the final pose
RotationY3=0
Smoothness3=EaseInOut

