; Kh-80 / 3M25A Meteorit-A material for Sea Power (Marmoset/Bumped Specular IBL)
; Textures: TX = diffuse RGB, SPEC = specular RGB + gloss in alpha, NM = tangent-space normal map (OpenGL / Unity, green = up)
; Adjust the texture paths to match where your mod keeps its textures.
[Shader]
Path=Marmoset/Bumped Specular IBL
[Properties]
_Color=Color,#808080
_SpecColor=Color,White
_SpecInt=1
_Shininess=6.5
_Fresnel=0.75
[Textures]
_MainTex=redweapons/p750/kh80_meteorit_TX.png
_SpecTex=redweapons/p750/kh80_meteorit_SPEC.png
_BumpMap=redweapons/p750/kh80_meteorit_NM.png
