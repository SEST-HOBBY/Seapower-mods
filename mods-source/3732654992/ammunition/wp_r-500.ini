#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# TLAM
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation      // can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode
Mass=1450                              // in kg. Used for aircraft
AmmoPoints=4350                        // For Supply System. Defines "price" of ammunition based on mass, volume, 
complexity and availability


CIWSDefenceBonus=30                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.30                     // Less chance to be intercepted by SAM because of anti-interception maneuvers
#Armored warhead & Deceptive Maneuver

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=64
ImpactSize=Large                      // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always
#[OnBoardSystems]

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.58          // time in seconds where the missile moves straight on without guiding
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
PerformsSlightBallisticInitialFlight=True   // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
TerrainFollowFlight=True
#TargetRequired=True                    // Cannot be launched to bearing
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=90.0                      // Climb angle for initial loft
MaxLoftAlt=90                          // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#SeaSkimmingAlt=20.0                    // height in feet for sea skimming TODO:make terrain following
#SeaSkimmingAlt=2000.0                    // height in feet for sea skimming
#SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
#SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
#SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#FinalFlightPhaseAlt=3500.0             // in feet. altitude of pop-up
#FinalFlightPhaseMaxAngle=40.0
#FinalFlightPhaseDistToTarget=20.0       // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=20           // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalVelocity=550.00                  // Maximum speed in knots when missile is locked on target
TerminalAlt=200
TerminalDiveDistance=0.5              // in N. miles.
SupportsBanking=True                   // if the missile will bank when turning
TerminalVerticalTurnRate=30            // Override of vertical turn rate in terminal (intended for Pop-up)

#========================================= Launch stats ============================================================
MaxVelocity=550.00                   // Maximum speed in knots
Acceleration=10.0                       // Acceleration factor
LaunchTurnRate=300
MaxTurnRate=16.0                       // Maximum turnrate in degrees per second
MinLaunchRange=5.0                    // Minimum launch range in nautical miles
MaxLaunchRange=269.97                  // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
WobblingStrength=120.5                   // amplitude of wobbling. Marks that missile performs some wobbling flight
WobblingSpeed=1.5                      // frequency of wobbling
VerticalWobblingStrength=4.5                   // amplitude of wobbling. Marks that missile performs some wobbling flight
VerticalWobblingSpeed=2                      // frequency of wobbling
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=1    // Circular error vs 'Installation' land units
#Homing
#N/A
#ECCM
AntiCountermeasuresBonus=0.40          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.30                   // This value substracted from probability of being jammed  (0...1)

#SelfDestruct
#SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
#SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/ammunition/3m14/
ResourcesRoot=3m14.obj
ResourcesMesh=3m14
ResourcesMaterial=3m14_mat.ini
ResourcesMeshForLaunch=3m14launch
ResourcesMeshForLaunch=3m14launch
ResourcesMeshSwitchTime=0.58  // time in seconds after launch to switch from launch mesh to main mesh
NumberOfSubmunitionLaunchers=1
Submunition1Ammunition=usn_rr144_chaff
Submunition1ChaffSystem=US_AIR_CHAFF_DISP
Submunition1Count=128
Submunition1Interval=1
Submunition1Position=0,0,0
Submunition1Rotation=180,0,0
Submunition1Distance=20000
#Submunition1Aim=Parent





############################################################

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/usn_rgm-109_booster
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=0.58 // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions

HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=LargeGroundHitExplosions

UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.022
[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.008,0.007,0.08