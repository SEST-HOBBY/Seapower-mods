[AmmunitionNames]
depth_charge=Charge de profondeur
fr_dsta_2=DSTA-2,RO,Bouée Sonar,Le DSTA-2 est une bouée acoustique française active et à portée limitée utilisée dans les années 1960.
fr_DTCN_L4=DTCN-L4,,Torpille ASM,La L4 est une torpille aérienne française de puissance moyenne construite par la société DTCN dans les années 1960. Elle utilise un sonar actif et a une vitesse de 30 nœuds.
usn_ssq-47=AN/SSQ-47A,Julie,Bouée Sonar,La bouée acoustique SSQ-47A Julie est une bouée active continue mesurant uniquement la distance. Bien que son émetteur soit puissant et puisse déterminer avec précision la position d'un sous-marin repéré, cette bouée ne fournit que des informations de distance et aucune indication d'azimut ; plusieurs bouées sont donc nécessaires pour une localisation précise. La puissance de son émetteur acoustique explique sa courte durée de vie de 30 minutes.
fr_as12=AS.12,,ASM,L'AS-12 est un missile air-sol filoguidé de fabrication française, dérivé de l'AS-11, dont l'ogive a été agrandie pour engager des navires.
usn_hvar=HVAR,,Rocket,La High Velocity Aircraft Rocket (HVAR), également connue sous le nom de « Holy Moses », est une roquette non guidée développée par les États-Unis pendant la Seconde Guerre mondiale pour attaquer des cibles terrestres depuis des avions. Elle a été largement utilisée pendant la Seconde Guerre mondiale et la guerre de Corée.
rn_rp_3_ap=3.5-Inch AP,RP-3,FFAR,La roquette de 3 pouces était une roquette britannique de la Seconde Guerre mondiale pouvant être équipée de diverses ogives.
rn_rp_3_sap=3.5-Inch SAP,RP-3,FFAR,La roquette de 3 pouces était une roquette britannique de la Seconde Guerre mondiale pouvant être équipée de diverses ogives.
rn_gp_500=GP-500LB,,Bomb,Une bombe britannique à usage général de 500 livres.
rn_gp_1000=GP-1000LB,,Bomb,Une bombe britannique à usage général de 1000 livres.