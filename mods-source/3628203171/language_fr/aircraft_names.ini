[in_br1050]
Type=ASW Plane
Default=Br.1050 Alizé IN, Alizé
DefaultDescription=Le Breguet Alizé était un avion de patrouille et de lutte anti-sous-marine embarqué français, mis en service en 1959. Il constitua le principal atout de l'aviation embarquée française en matière de lutte anti-sous-marine des années 1960 aux années 1980. En 1961, la marine indienne acquit 12 appareils (et deux autres en 1968 pour remplacer les pertes), qui servirent à bord de l'INS Vikrant et depuis la base aéronavale de Garuda, au sein de l'escadrille INAS 310, jusqu'aux années 1990. L'un d'eux fut perdu au combat en 1971 contre un chasseur pakistanais. Durant sa carrière au sein de la marine indienne, il coula trois canonnières et participa à la destruction d'un sous-marin lors de conflits contre le Pakistan. Il s'agit de la version originale, non modernisée, de l'Alizé, et à ce titre elle est dépourvue de bouées acoustiques et de torpilles autoguidées.
Squadron1=Br.1050 Alizé INAS 310 'White Cobras',Alizé
Squadron2=Br.1050 Alizé INAS 310 'White Cobras',Alizé
Callsigns=Squadron1,Cobra|Squadron2,Cobra