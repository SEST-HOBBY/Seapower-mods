DefaultDescription=Le Breguet Alizé était un avion de patrouille et de lutte anti-sous-marine embarqué français, mis en service en 1959. Il constitua le principal atout de l'aviation embarquée française en matière de lutte anti-sous-marine des années 1960 aux années 1980. Entre 1996 et 1997, 15 appareils furent modernisés au standard « ALizé mis à Hauteur » (ALH), recevant une avionique améliorée et une caméra infrarouge Thomson-CSF installée sous l'aile gauche. À cette époque, il n'était plus affecté aux missions de lutte anti-sous-marine et fut relégué aux missions de détection et de contrôle aériens en attendant l'arrivée de l'E-2 Hawkeye dans la flotte française.
