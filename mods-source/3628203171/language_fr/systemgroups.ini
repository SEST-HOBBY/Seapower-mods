[SystemNames]
DRAA-10A=Iguane|L'Iguane (désignation constructeur : DRAA-10A ou TMV-118) est un radar de surveillance aéroporté multimode fonctionnant en bande X et destiné à être installé sur des aéronefs à voilure fixe. Ce radar possède une sensibilité lui permettant de détecter des cibles de petite taille, de la taille d'un périscope. Il peut fonctionner simultanément en mode de recherche de surface et en mode d'évitement des intempéries, et effectue un suivi pendant le balayage. Un système d'identification ami-ennemi (IFF) est intégré au radar.
DRAA-2A=DRAA-2A|Le DRAA-2 est un radar de recherche de surface utilisé sur les avions de patrouille maritime et de lutte anti-sous-marine (ASM) français. Ce système est logé dans un radôme rétractable sous le fuselage et sert à la recherche de navires et de schnorchel de sous-marins.
ARAR-11D=ARAR-11B|L'ARAR-11B était monté d'origine sur le Breguet Alizé. Il permettait d'intercepter les signaux dans les bandes S, C et X avec une précision relative.
ARAR-12=ARAR-12|Le système ESM ARAR-12 fut installé sur le Breguet Alizé lors de la modernisation ALM à la fin des années 1970. Il s'agit d'un système ESM plus avancé que l'ARAR-11B d'origine, avec une gamme de fréquences plus large et une capacité de recherche en azimut accrue.
Chlio_FLIR=Chlio FLIR|Le système FLIR Thomson CSF Chlio a été installé sur le Breguet Alizé lors de la mise à niveau ALH à la fin des années 1990.
