Default=Br.1050 Alizé ALH, Alizé
DefaultDescription=The Breguet Alizé was a French carrier-based patrol and anti-submarine warfare aircraft introduced in 1959. It was the main French carrier aviation's ASW asset from the 1960s to the 1980s. Between 1996 and 1997, 15 airframes were updated to the "ALizé mis à Hauteur" (ALH) standard, receiving upgraded avionics and a Thomson-CSF infrared camera installed under the port wing. By then it was no longer assigned to ASW tasks and was instead shoehorned into early warning and control missions pending the E-2 Hawkeye's arrival to the French fleet.
