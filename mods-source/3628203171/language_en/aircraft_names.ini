[in_br1050]
Type=ASW Plane
Default=Br.1050 Alizé IN, Alizé
DefaultDescription=The Breguet Alizé was a French carrier-based patrol and anti-submarine warfare aircraft introduced in 1959. It was the main French carrier aviation's ASW asset from the 1960s to the 1980s. In 1961 the Indian Navy purchased 12 airframes (and two more in 1968 to replace losses), which served aboard INS Vikrant and from Naval Air Station Garuda as part of INAS 310 until the 1990s. One was lost in combat in 1971 against a Pakistani fighter, and during its career in the Indian Navy it sank three gunboats and was involved in the destruction of a submarine during conflicts against Pakistan. This is the original, non-upgraded version of the Alizé, and as such it lacks sonobuoys and guided torpedoes.
Squadron1=Br.1050 Alizé INAS 310 'White Cobras',Alizé
Squadron2=Br.1050 Alizé INAS 310 'White Cobras',Alizé
Callsigns=Squadron1,Cobra|Squadron2,Cobra