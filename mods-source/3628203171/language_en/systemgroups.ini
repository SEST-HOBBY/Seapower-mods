[SystemNames]
DRAA-10A=Iguane|Iguane (Manufacturer’s designation: DRAA-10A or TMV-118) is operating in the X band airborne a multimode surveillance radar intended for installation on fixed-wing aircraft. The radar has the sensitivity to detect small periscope-size targets. It can operate in surface search mode and weather avoidance mode simultaneously and carries out track-while-scan. An Identification Friend or Foe (IFF) system is integrated into the radar.
DRAA-2A=DRAA-2A|The DRAA-2 is a surface search radar used in the French-built Atlantic maritime patrol and anti-submarine warfare (ASW) aircraft. The system is housed in a retractable radome on the underside of the fuselage and is used to search for ships and submarine snorkels.
ARAR-11D=ARAR-11B|The ARAR-11B was fitted to the base Breguet Alizé model before any upgrade. It was able to intercept signals in the S, C and X bands with relative accuracy. 
ARAR-12=ARAR-12|The ARAR-12 ESM system was fitted to the Breguet Alizé following the ALM upgrade in the 1980s. It is a more advanced ESM system that the original ARAR-11B, with broader frequency range and increased azimuth finding capability. 
Chlio_FLIR=Chlio FLIR|The Thomson CSF Chlio FLIR was fitted to the Breguet Alizé during the ALH upgrade at the end  of the 1990s.
