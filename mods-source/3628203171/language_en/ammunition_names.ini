depth_charge=Air Dropped Depth Charge
fr_dsta_2=DSTA-2,RO,Active Sonobuoy,The DSTA-2 is a french active only and range only sonobuoy used in the 1960s. 
fr_DTCN_L4=DTCN-L4,,Torpedo,The L4 a French air launched medium-weight torpedo built by the DTCN State Company during the 1960s. It uses an active sonar and has a speed of 30 knots.
usn_ssq-47=AN/SSQ-47A,Julie,Active Sonobuoy,The SSQ-47A Julie is a continuous active range-only type sonobouy. While the transmitter is quite powerful and can accurately 'fix' the position of a located submarine, this sonobuoy only provides range information and no bearing information, meaning multiple are required to accurately determine position. The high power acoustic transmitter lends to this sonobuoy's short lifetime of 30 minutes.
fr_as12=AS.12,,ASM,The AS-12 is a French made Air to Ground wire guided missile developed from the AS-11, with the warhead enlarged to engage shipping.
usn_hvar=HVAR,,Rocket,The High Velocity Aircraft Rocket (HVAR), also known as "Holy Moses," is an unguided rocket developed by the United States during World War II for attacking ground targets from aircraft. It was widely used during both World War II and the Korean War.
rn_rp_3_ap=3.5-Inch AP,RP-3,FFAR,The 3-Inch Rocket was a World War 2 rocket capable of being fitted with a variety of warheads.
rn_rp_3_sap=3.5-Inch SAP,RP-3,FFAR,The 3-Inch Rocket was a World War 2 rocket capable of being fitted with a variety of warheads.
rn_gp_500=GP-500LB,,Bomb,A 500lb general purpose British made bomb.
rn_gp_1000=GP-1000LB,,Bomb,A 1000lb general purpose British made bomb.