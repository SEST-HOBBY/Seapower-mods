[General]
# AGM-130 TV guided bomb.  by dts
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=1323                               // in kg. Used for aircraft
AmmoPoints=2500                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=62
ImpactSize=Large                // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

FuzeProximityDistance=5.0              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=6
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=7        // time in seconds where the missile moves straight on without guiding
DropDuration=2.0                       // time in seconds where the missile just falls unpropelled
#======================================== Flight Profile ===========================================================
TerminalApproachDist=100           // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalDiveDistance=100 
MaxVelocity=1268                       // Maximum speed in knots
VelocityBleed=0.1                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
#ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
DragCoefficient=-1
AccelerationTime=60                   // Time until start of the velocity bleed, in seconds
Acceleration=15                      // Acceleration factor
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
MinLaunchRange=10.0                     // Minimum launch range in nautical miles
MaxLaunchRange=40.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=10000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=60000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=10.0                         // Seeker gain in dB
SeekerFOV=40.0                         // Seeker field-of-view in degrees
SeekerActiveRange=10.0
SeekerPassiveRange=10.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
NightVisionLevel=0.0
Zoom=2
#ECCM
#Search params for torpedoes
#SelfDestruct
SelfDestructAfterTargetGone=False
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[Models]
ResourcesFolder=assets/models/weapon/ammunition/agm-130/
ResourcesRoot=dts_agm-130.obj
ResourcesMesh=AGM
ResourcesMaterial=dts_agm-130_mat.ini
ResourcesMeshForLaunch=launch
ResourcesMeshSwitchTime=5
##########################       SUB MODEL       ##################################
NumberOfSubModels=1

SubModel1=eye
[eye]
Mesh=eye
ResourcesMaterialFolder=aircraft/materials/
Material=cockpit_glass_gold

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_effect
BoosterEffectPosition=0,-0.01,-0.022

InFlightEffectClass=None
InFlightEffectStartTime=1  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
HitGroundExplosionClass=LargeGroundHitExplosions
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=MediumWaterSplashes
ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[coll_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.066