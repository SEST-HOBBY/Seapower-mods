[AmmunitionNames]

dts_aim-9m=AIM-9M,Sidewinder,AAM,The AIM-9M Sidewinder is an American infrared-guided air-to-air missile. The M model has increased anti-interference capability based on the L model, and uses a low-tail flame engine, making it difficult to be detected when used at close range.

dts_aim-120c=AIM-120C,AMRAAM,AAM,AIM-120 is an active radar-guided air-to-air missile of the United States, used to replace the old Sparrow semi-active radar-guided air-to-air missile. It is relatively small and can be carried by most aircraft.The C variant upgraded the seeker and solid rocket motor. 
dts_aim-120c_w=AIM-120C,AMRAAM,AAM,AIM-120 is an active radar-guided air-to-air missile of the United States, used to replace the old Sparrow semi-active radar-guided air-to-air missile. It is relatively small and can be carried by most aircraft.The C variant upgraded the seeker and solid rocket motor. 

dts_agm-65d=AGM-65D,Maverick,Land Attack,The AGM-65D is an American IR-guided air-to-ground standoff weapon. 

dts_gbu-32=GBU-32,JDAM,Guided Bomb,The GBU-32 is an American 1000lb GPS-guided Bomb.

dts_gbu-31=GBU-31,JDAM,Guided Bomb,The GBU-31 is an American 2000lb GPS-guided Bomb.

dts_gbu-39=GBU-39,SDB,Guided Bomb,The GBU-39 Small Diameter Bomb (SDB) adopts GPS/INS composite guidance, with a hit accuracy of less than 5 meters and a range of over 110 kilometers, and is capable of penetrating 90-centimeter-thick reinforced concrete structures

dts_agm-130=AGM-130,AGM,Land Attack,The AGM-130 air-to-surface missile is a standoff air-to-surface missile developed by Rockwell International of the United States, based on the GBU-15 mode-guided glide bomb it designed for the U.S. Air Force. It is intended to strike heavily fortified and strongly defended enemy targets.



