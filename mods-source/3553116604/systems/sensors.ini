[AN/APG-70]
#Users: usaf_f-15e_SE
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=False      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface              // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
CanDetectLandTargets=True  // True means the radar can see ground objects
TargetChannels=2       // if applicable number of targets it can track simultaneously
WeaponChannels=4       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-60,60|-60,60      // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=0.9     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0.4           // min range in km
MaxRange=200           // max range in km
MinAltitude=9          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30000      // max altitude in meters, relevant for air, unused for surface
RangeResolution=35.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.1          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=53.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=10.0           // output peak power in kW
RequiresAlignment=False   // For aircraft. Allows guide weapon without flying towards target

[AN/AAQ-13] # FLIR detector
Kind=Visual
#Infrared
NightCapable=True                   // is the designator can be used in low-visibility conditions
VIDRangeMultiplier=2.0           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=2.5           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=1          // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1

[AN/AAQ-14(L)] # Navigation/targeting detector
Kind=LaserDesignator
MaxRange=15                           // max distance in nm
NightCapable=True                 // is the designator can be used in low-visibility conditions
TargetChannels=2                    // number of targets that can be tracked at once
WeaponChannels=1000          // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                       // Field of View of the designator

[AN/AAQ-14(V)] # detector
Kind=Visual
#Infrared
NightCapable=True                   // is the designator can be used in low-visibility conditions
VIDRangeMultiplier=1.5        // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=2.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=3.5          // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1