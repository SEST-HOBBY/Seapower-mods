DefaultDescription=F-15E“打击鹰”是美国麦克唐纳-道格拉斯公司在F-15“鹰”的基础上改型设计的以对地攻击为主要任务的双座超音速战斗轰炸机，兼具对地攻击和空中优势能力，称为双重任务战斗机。该机在外形上与F-15D基本相同，重新设计了发动机舱以及部分结构，使航程增加了33%，武器挂架增加了1倍，除原挂架外，在每个保形油箱边还有6个挂架，采用了具有自动地形跟踪能力3余度的数字式电传操纵系统和先进的电子座舱显示系统。
