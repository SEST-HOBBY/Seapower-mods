[AmmunitionNames]
# ------------------ AAM ------------------
dts_aim-9m=AIM-9M,响尾蛇,空对空,AIM-9M“响尾蛇”是美国的一种红外制导空对空导弹。M型在L型的基础上增强了抗干扰能力，并且采用了低尾焰发动机，在近距使用时很难被发现

dts_aim-120c=AIM-120C,AMRAAM,空对空,AIM-120是美国的一种主动雷达制导空对空导弹，用来替代老式的半主动雷达制导“麻雀”空对空导弹。它体积相对较小，大多数飞机都能携带。C型号升级了导引头与固体火箭发动机
dts_aim-120c_w=AIM-120C,AMRAAM,空对空,AIM-120是美国的一种主动雷达制导空对空导弹，用来替代老式的半主动雷达制导“麻雀”空对空导弹。它体积相对较小，大多数飞机都能携带。C型号升级了导引头与固体火箭发动机

dts_agm-65d=AGM-65D,Maverick,对地攻击, AGM-65D是“小牛”空地导弹系列的红外导引头版本

dts_gbu-32=GBU-32,JADM,制导炸弹,GBU-32是美国著名的联合制导攻击弹药（JDAM）系列中的1000磅GPS制导炸弹

dts_gbu-31=GBU-31,JADM,制导炸弹,GBU-31是美国著名的联合制导攻击弹药（JDAM）系列中的2000磅GPS制导炸弹

dts_gbu-39=GBU-39,SDB,制导炸弹,GBU-39小直径炸弹采用GPS/INS复合制导，命中精度小于5米，射程超过110千米，可击穿90厘米钢混凝土结构。

dts_agm-130=AGM-130,AGM,对地攻击,AGM-130空地导弹，是美国罗克韦尔国际公司在其为美空军研制的GBU-15模式制导滑翔炸弹基础上发展的防区外空地导弹，用来攻击敌方严密设防的坚固目标


