[General]
UnitType=LandUnit
LandUnitSubType=Airbase //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DisplayClassName=PVO_Airbase
DefaultCameraDistance=18
MinCameraDistanceForeAft=8
MinCameraDistanceBroadside=32
CameraPivotHeight=0.15

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=600  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[AI]
