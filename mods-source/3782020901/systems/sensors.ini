[ ---------------------------- Airborne Early Warning Radars ----------------------------- ]
# Only KJ3000_Aircraft_Radar is provided here - it is the one sensor this mod
# introduces that isn't in original/systems/sensors.ini.  The ESM system the
# KJ-3000 references (AircraftELINT) already exists in the base game, so it is
# deliberately not redefined.
#
# The rotodome's spin is NOT an animation: Sea Power turns whatever submodel is
# named by the sensor system's Mount= at this RPM in this RotationDirection,
# exactly as usaf_e-3a does with AN/APY-1 mounted on its Radar submodel.  See
# aircraft/plaaf_kj-3000.ini [SensorSystem2] -> Mount=AwacsRotodome.
#
# Values tuned 2026-08-09 against every AEW set in this install so the newest,
# largest platform is strictly superior: AN/APY-1 (E-3A, 550 km / gain 53 /
# 1000 kW / 3.0 deg), AN/APS-125/-138 (E-2C, 463 km / UHF), KLC-500 (KJ-500,
# 500 km / 1.0 deg / 30 m res / 200+60 channels / 1200 kW) and KJ-600 (500 km).
# Real KJ-3000 (first flight 2024-12, Y-20B based): ROTATING radome carrying two
# AESA arrays - so the engine-driven 6 RPM dome spin is authentic - with
# reported conventional-target detection 600-1000 km; 800 (user's call
# 2026-08-09) sits in the upper half of that band.  The airframe's IRST is
# represented by the 3rd_Gen_FLIR sensor system in plaaf_kj-3000.ini.
[KJ3000_Aircraft_Radar]
#Users: plaaf_kj-3000
Kind=Radar
Type=Search            // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface     // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True  // True means the radar can see ground objects
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=300     // if applicable number of targets it can track simultaneously
WeaponChannels=80      // if applicable number of weapons (missiles) it can guide simultaneously
RotationDirection=1    // -1 means left, 1 means right
RPM=6                  // revolutions per minute
MinRange=0.1           // min range in km
MaxRange=800         // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=300000     // max altitude in meters, relevant for air, unused for surface
RangeResolution=25   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.8          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=58                // gain in dB on the sensor
Frequency=S-Band       // frequency band
PeakPower=1500       // output peak power in kW
