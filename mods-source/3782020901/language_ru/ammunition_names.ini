[AmmunitionNames]
pla_jl-1=JL-1,,Авиационная баллистическая ракета,Экспериментальная ракета воздушного базирования, созданная на основе серии JL. Перевозится в грузовом отсеке Y-20B (экспериментального) и извлекается через грузовые створки. Ракета отделяется в транспортном контейнере и падает до запуска двигателя первой ступени.
pla_paratrooper=Десантник,,Воздушно-десантная пехота,Десантники НОАК, выбрасываемые с грузовой рампы Y-20. Только визуальный эффект: десантники приземляются на парашютах, но не становятся управляемыми подразделениями.
pla_airdrop_type63=Тип 63 (десантируемый),,Воздушно-десантная бронетехника,Лёгкий танк Тип 63 на десантной платформе, извлекаемый через грузовую рампу. Без башни: сбрасываемый груз — единая модель, поэтому перевозится только корпус. Только визуальный эффект: танк приземляется, но не становится управляемым подразделением.
