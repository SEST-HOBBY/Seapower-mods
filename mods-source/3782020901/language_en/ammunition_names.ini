[AmmunitionNames]
pla_jl-1=JL-1,,Land Attack,An experimental air-launched derivative of the JL series, carried internally by the Y-20B (Experimental) and extracted through the cargo doors. The round falls clear in its canister before first-stage ignition.
pla_paratrooper=Paratrooper,,Airborne Infantry,PLA airborne infantry dropped from the Y-20's cargo ramp. Cosmetic: troopers land under canopy and are not delivered as playable units.
pla_airdrop_type63=Type 63 (Airdropped),,Airborne Armour,A Type 63 light tank rigged on a platform and extracted over the ramp. Turretless: a dropped store is a single mesh, so only the hull is carried. Cosmetic: it lands and is not delivered as a playable unit.
