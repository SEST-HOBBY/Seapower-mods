[General]
# Airdropped PLA light tank.  TEST ASSET.
#
# Ammunition inis have NO [Submodels] section - the engine reads exactly one
# in-flight mesh and one on-rack mesh - so this is the Type 63's HULL only,
# turretless.  It borrows the base game's mesh straight out of Unity Resources
# (ground objects/pla_lt_type_63/), the same asset the Y-20's static CargoTank1
# and CargoTank2 submodels already use, so the load looks continuous with what
# is modelled in the hold.
#
# It lands and despawns.  Nothing spawns on impact - see the note in
# pla_paratrooper.ini.
Type=Paratrooper
TargetType=ASuW

DefaultCameraDistance=1.2
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.01

Mass=18400                               // in kg - Type 63 combat weight
DecalClass=Standard

OnHitWaterSpawn=
OnHitGroundSpawn=

[SensorData]
IRSignature=Small
RCS=Small

[Physics]
# Heavy load under a multi-canopy cluster: falls faster than a man, settles hard.
ParachuteSlowDown=0.93
ParachuteVelocities=1000,60|5000,110|10000,180
ParachuteEndVelocity=28
ParachuteDeployDelay=2.0
ParachuteDeployMaxAltitude=15000

[WarheadData]
WarheadType=-1

[Guidance]
GuidanceType=0
MidCourseCorrection=0
InitialFlightPhaseDuration=1
EjectVelocity=-95                        // extractor chute yanks the pallet off the ramp
MaxTurnRate=1.0
CircularErrorRadius=90.0

[Models]
# Borrowed base-game mesh: ResourcesMaterialFolder must be set explicitly - the
# aircraft's own ResourcesFolder does not cover a borrowed asset.
ResourcesFolder=ground objects/pla_lt_type_63/
ResourcesRoot=pla_lt_type_63
ResourcesMesh=pla_lt_type_63_hull
ResourcesMeshForLaunch=pla_lt_type_63_hull
ResourcesMaterialFolder=ground objects/pla_lt_type_63/
ResourcesMaterial=pla_lt_type_63_mat
ResourcesMeshSwitchTime=1.0

[Particles]
InFlightEffect=none
ParachuteEffect=aircraft/particles/wp_parachute
ParachuteEffectPosition=0,-0.001,-0.0242
HitWaterSplashClass=SmallWaterSplashes

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.024,0.014,0.045
