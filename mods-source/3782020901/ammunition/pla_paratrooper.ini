[General]
# PLA airborne infantry, dropped from the Y-20 cargo ramp.
# Uses the base game's paratrooper/pilot meshes with its own PLA-marked material
# (weapons/pla_paratrooper/): the stock olive wp_pilot_a texture with the Soviet
# hammer-and-sickle removed from the helmet star and a red/gold sleeve patch.
Type=Paratrooper
TargetType=ASuW

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

Mass=120                                 // in kg - trooper plus combat load
DecalClass=Standard

# NOTE: OnHitGroundSpawn is parsed by the engine but never read (verified in
# Seapower-Scripts.dll 0.8.2 - AmmunitionParameters._onHitGroundSpawn has no
# consumer).  Only OnHitWaterSpawn works, and it can only create a *vessel*.
# A ground drop is therefore cosmetic; see AGENTS.md for the trigger-based
# route to delivering real units.
OnHitWaterSpawn=all_life_raft_single
OnHitGroundSpawn=

[SensorData]
IRSignature=VeryTiny
RCS=VerySmall

[Physics]
ParachuteSlowDown=0.99
ParachuteVelocities=1000,50|5000,100|10000,300
ParachuteEndVelocity=10
ParachuteDeployDelay=3.2
ParachuteDeployMaxAltitude=15000
TrimDepth=-0.004

[WarheadData]
WarheadType=-1

[Guidance]
GuidanceType=0
MidCourseCorrection=0
InitialFlightPhaseDuration=1
EjectVelocity=-60                        // walks out of the ramp, not thrown forward
MaxTurnRate=1.0
CircularErrorRadius=140.0                // stick dispersion on the DZ

[Models]
ResourcesFolder=aircraft/emitters/
ResourcesRoot=wp_pilot_a_eject
ResourcesMesh=wp_pilot_a_ejected
ResourcesMeshForLaunch=wp_pilot_a_seated
ResourcesMaterialFolder=weapons/pla_paratrooper/
ResourcesMaterial=pla_paratrooper_mat.ini
ResourcesMeshSwitchTime=1.5              // canopy out shortly after leaving the ramp

[Particles]
InFlightEffect=none
ParachuteEffect=aircraft/particles/wp_parachute
ParachuteEffectPosition=0,-0.001,-0.0242
HitWaterSplashClass=SmallWaterSplashes

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.01374
Rotation=0,0,0
Scale=0.008,0.005,0.03
