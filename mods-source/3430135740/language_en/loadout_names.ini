AntiShipGBUmix=Anti-ship w GBUs
AirToAirTanksJam=Air to Air w Tanks w Jammer
AirToAirTanks=Air to Air w Tanks
AirToAirJam=Air to Air w Jammer
SEADNoTanks=SEAD No Tanks

