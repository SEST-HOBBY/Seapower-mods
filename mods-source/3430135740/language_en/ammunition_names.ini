[AmmunitionNames]
# ------------------ AAM ------------------
usn_aim-174b=AIM-174B,Gunslinger,AAM,The AIM-174B "Gunslinger" is an American active radar-homing air-to-air missile.  Specifically used to reach out and touch someone, the AIM-174B is the longest range air-to-air missile in the US inventory.  Currenntly in testing with the US Navy's Super hornet squadrons.

usn_aim_120d=AIM-120D,AMRAAM,AAM,AIM-120D is an active radar-guided air-to-air missile of the United States, used to replace the old Sparrow semi-active radar-guided air-to-air missile. It is relatively small and can be carried by most aircraft.

usn_aim_9x=AIM-9X,Sidewinder,AAM,The AIM-9X Sidewinder is an American infrared homing air-to-air missile. The X-ray variant features an infrared sensor system with near 360 degree viewing angles.  A longer duration burn time with thrust vectoring delivers extended range and maneuverability
# ------------------ SAM ------------------
# ---------- Anti-radar Missiles ---------
# ---------- Anti-ship Missiles ----------
usn_agm-84d=AGM-84D,Harpoon,ASM,The Harpoon is an American standoff anti-ship weapon used widely throughout NATO. The weapon has an active radar seeker that is activated after following a pre-programmed route. The AGM-84 variant is air launched. The Block 1C variant has improved range via more energetic fuel, both a sea-skim profile and an optimized terminal pop-up maneuver, and a more interference-resistant seeker head.
