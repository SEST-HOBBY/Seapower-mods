# ------------------ Bombs -----------------
usn_gbu-24=GBU-24,Paveway III,Land Attack,GBU-24 Paveway III or simply GBU-24 is a family of laser-guided bombs, a sub-group of the larger Raytheon Paveway III family of weapons. The Paveway guidance package consists of a seeker package attached to the nose of the weapon, and a wing kit attached to the rear to provide stability and greater range.

