[---------- General Data ----------]
[General]
UnitType=Aircraft
Size=VeryLarge

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.0

Length=72.7                     // in meters

#Taxi values
GroundedPitchAngle=-0.5    // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.0461,0   // defines the relative location of the landing gear
#ForwardsTaxiVelocity=50 //Default
#BackwardsTaxiVelocity=-5 //Default

[AI]
UnitScoreValue=10             // value for calculation of mission score
Role=Airliner

[SensorData]
#Visual
VisualIdentificationRange=18.0  // at what range in nm this unit can be visually identified
IRSignature=SemiLarge
# Radar related (RCS => radar cross section)
RCS=SemiLarge

[Animations]
NumberOfAnimationReferences=0
#AnimationFile_1=

[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=6.78             //Pi* r * r where r is engine radius, in meters

[FlightModel]
PitchGain=0.35                         // Vertical manuverability
VelocityGain=0.045                   // Acceleration
HeadingGain=0.85                         // Horizontal manuverability
YawRateLimit=4                      // in degrees per second

BankGain=0.32                          // Roll change speed
MaxRollForHeading=25.0                // bank limit in normal flight
MaxRollRate=6.0                      // in degrees per second

ThrustGain=0.15                      // Thrust change speed
SpeedBrakeFractionGain=8            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.070

[Performance]
#Dimensions
WingSpan=79.75                           //meters
#Parameters
MaxG=1.5                                // Mostly for horizontal turns

MaxClimbRate=12.5                     //Meters per second
MaxClimbPitch=12                      // in degrees Default: 20
MaxCombatClimbPitch=15                // in degrees Defaults: 80 for MachLimit 1+ and 45 otherwise
MaxDescentPitch=-12                   // in degrees Default: -20
MaxCombatDescentPitch=-18             // in degrees Defaults: -60 for MachLimit 1+ and -30 otherwise
EmptyMass=276800                       // in kg
MaxFuel=253500                         // in kg

PerEngineMaxThrust=340000              //Newtons
EngineCount=4

Ceiling=43100.0                       // ceiling in feet
CruiseAltitude=39000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.55,0.6,0.45       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=340                //in knots, Defines max speed at altitude curve
StallSpeed=138.0                      //in knots
MachLimit=0.89                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.21,0.35        // Landing
SpeedAndRange_Loiter=0.42,0.65          // Loiter
SpeedAndRange_Cruise=0.85,8000         // Cruise
SpeedAndRange_Max=0.88,0.89            // Attack/Fast/High/Max without AB


Altitudes=1000,3000,6000,10000,20000,30000,40000  // in feet

