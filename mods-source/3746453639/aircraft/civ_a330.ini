[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=3.80             //Pi* r * r where r is engine radius, in meters

[FlightModel]
PitchGain=0.65                         // Vertical manuverability
VelocityGain=0.085                   // Acceleration
HeadingGain=1.5                         // Horizontal manuverability
YawRateLimit=8                      // in degrees per second

BankGain=0.6                          // Roll change speed
MaxRollForHeading=30.0                // bank limit in normal flight
MaxRollRate=12.0                      // in degrees per second

ThrustGain=0.25                      // Thrust change speed
SpeedBrakeFractionGain=12            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.090

[Performance]
#Dimensions
WingSpan=60.3                           //meters
#Parameters
MaxG=2.0                                // Mostly for horizontal turns

MaxClimbRate=15.0                     //Meters per second
MaxClimbPitch=15                      // in degrees Default: 20
MaxCombatClimbPitch=20                // in degrees Defaults: 80 for MachLimit 1+ and 45 otherwise
MaxDescentPitch=-15                   // in degrees Default: -20
MaxCombatDescentPitch=-20             // in degrees Defaults: -60 for MachLimit 1+ and -30 otherwise
EmptyMass=121220                       // in kg
MaxFuel=109185                         // in kg

PerEngineMaxThrust=316000              //Newtons
EngineCount=2

Ceiling=41100.0                       // ceiling in feet
CruiseAltitude=37000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.6,0.65,0.5       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=350                //in knots, Defines max speed at altitude curve
StallSpeed=135.0                      //in knots
MachLimit=0.89                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.22,0.35        // Landing
SpeedAndRange_Loiter=0.4,0.65          // Loiter
SpeedAndRange_Cruise=0.82,6344         // Cruise
SpeedAndRange_Max=0.86,0.89            // Attack/Fast/High/Max without AB


Altitudes=1000,3000,6000,10000,20000,30000  // in feet

