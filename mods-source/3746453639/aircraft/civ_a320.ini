[---------- General Data ----------]
[General]
UnitType=Aircraft
Size=Large

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.0

Length=37.57                     // in meters

#Taxi values
GroundedPitchAngle=-0.3    // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.0461,0   // defines the relative location of the landing gear
#ForwardsTaxiVelocity=50 //Default
#BackwardsTaxiVelocity=-5 //Default

[AI]
UnitScoreValue=10             // value for calculation of mission score
Role=Airliner

[SensorData]
#Visual
VisualIdentificationRange=9.0  // at what range in nm this unit can be visually identified
IRSignature=Meager
# Radar related (RCS => radar cross section)
RCS=Meager

[Animations]
NumberOfAnimationReferences=0
#AnimationFile_1=

[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=1.28             //Pi* r * r where r is engine radius, in meters

[FlightModel]
PitchGain=0.95                         // Vertical manuverability
VelocityGain=0.125                   // Acceleration
HeadingGain=2.4                         // Horizontal manuverability
YawRateLimit=15                      // in degrees per second

BankGain=1.0                          // Roll change speed
MaxRollForHeading=35.0                // bank limit in normal flight
MaxRollRate=20.0                      // in degrees per second

ThrustGain=0.4                      // Thrust change speed
SpeedBrakeFractionGain=12            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.090

[Performance]
#Dimensions
WingSpan=35.8                           //meters
#Parameters
MaxG=2.5                                // Mostly for horizontal turns

MaxClimbRate=18.0                     //Meters per second
MaxClimbPitch=18                      // in degrees Default: 20
MaxCombatClimbPitch=25                // in degrees Defaults: 80 for MachLimit 1+ and 45 otherwise
MaxDescentPitch=-18                   // in degrees Default: -20
MaxCombatDescentPitch=-25             // in degrees Defaults: -60 for MachLimit 1+ and -30 otherwise
EmptyMass=42600                       // in kg
MaxFuel=24210                         // in kg

PerEngineMaxThrust=120000              //Newtons
EngineCount=2

Ceiling=39000.0                       // ceiling in feet
CruiseAltitude=37000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.65,0.65,0.45       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=350                //in knots, Defines max speed at altitude curve
StallSpeed=120.0                      //in knots
MachLimit=0.82                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.22,0.35        // Landing
SpeedAndRange_Loiter=0.4,0.65          // Loiter
SpeedAndRange_Cruise=0.78,3500         // Cruise
SpeedAndRange_Max=0.82,0.85            // Attack/Fast/High/Max without AB


Altitudes=1000,3000,6000,10000,20000  // in feet

