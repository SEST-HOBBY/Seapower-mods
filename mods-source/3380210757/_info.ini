[Language_en]
Name=Anchor Chain
Description=The Sea Power community chainloader. \r\n\r\n[h1]This mod will not function on its own. To fully install Anchor Chain, please see our documentation [url=https://seapower-modders.github.io/AnchorChain/install-anchor-chain.html]here.[/url][/h1]\r\n\r\nAnchor Chain does not change your game alone. Instead, it allows other mods that require changing the game's code to be loaded into the game via the steam workshop. The project is open-source and distributed under the MIT license. You can view and contribute to the code [url=https://github.com/SeaPower-Modders/AnchorChain]here[/url].\r\n\r\n[h1]Troubleshooting[/h1]\r\nThis is a quick guide to troubleshooting AnchorChain issues (and figuring out if AnchorChain is the source of the issue).\r\n\r\n[h2]Rules of Thumb[/h2]\r\n[list]\r\n[*]AnchorChain is highly unlikely to be version-dependent. You can most likely ignore any version errors it causes without problems.\r\n[*]AnchorChain will ignore the in-game mod enable/disable states (checkboxes in the Mod Manager). This is because it cannot unload mods at runtime (yet).\r\n[/list]\r\n\r\n[h2]Troubleshooting Yourself[/h2]\r\nAnchorChain and Sea Power have two separate log files. If you suspect that something is going wrong with AnchorChain, you should check the BepInEx log file. It is named LogOutput.log and is located in the BepInEx folder withinin Sea Power's installation folder. If something went wrong with AnchorChain or its Preloader, there will be a log message there.\r\n\r\nIf you suspect a game compatibility issue, it may be logged in Sea Power's game log. This file is named Player.log and is located within the Triassic Games folder within your LocalLow AppData folder (google is your best friend for finding this).\r\n\r\n[h2]Reporting an issue[/h2]\r\nIf you would like to report something to be fixed by a dev, please create an issue on the github ([url=https://github.com/SeaPower-Modders/AnchorChain]linked here[/url]) and send a message in the comments of this workshop item. The github issue should have your LogOutput.log file, Player.log file, and a complete list of your installed mods so that it can be properly addressed. For more details on how to find the .log files, look at the Troubleshooting Yourself section (or just google it).

[Compatibility]
GreaterThanEqualToVersion=0.4.0
LessThanVersion=1.0.0

