#!extend ammunition/usn_ugm-96a.ini
#!extend ammunition/usn_trident_c4.ini
// Requires MultiStageMissiles 1.5.1+ and MissileControlMod 0.1.14+.
// Numeric separation times are seconds from water exit; BurnTime is local to stage ignition.
// Three game motors use five visual stages. Stages 2 and 3 share motor 2.

[General]
DecalClass=
GroundDecalClass=

[WarheadData]
// The carrier is inert; each released Mk4 uses its own warhead values.
Power=0

[Guidance]
MaxLoftAngle=65                            // Maximum climb angle for the native loft profile


[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_ugm-96a_stage1
ResourcesMaterialFolder=assets/europack/materials/UGM-96A Trident I C4/
ResourcesMaterial=ugm-96a_mat.ini
ResourcesMeshForLaunch=eu_missile_ugm-96a_stage1
ResourcesMeshCanister=eu_missile_ugm-96a_stage1
ResourcesMeshSwitchTime=0
NumberOfSubModels=0
NumberOfStages=5
UseBaseGameThrust=False // Use the stage accelerations below instead of native thrust.

// Motor 1. The exported debris also contains the first interstage.
Stage1Mesh=eu_missile_ugm-96a_stage1
Stage1SeparationTime=65
Stage1FlightEffect=effects/weapons/emitters/solidrocket_verylarge/rocketmotor_solid_verylarge_launch.ini
Stage1FlightEffectPosition=0,0,-0.119161
Stage1BurnTime=63
Stage1Acceleration=3.0
Stage1BurnTimeDelay=0
Stage1AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
;Stage1SeparationEffect=effects/weapons/emitters/usn_rur-5_separation
;Stage1SeparationEffectPosition=0,0,-0.016298
Stage1JettisonMesh=eu_missile_ugm-96a_stage1_debris
Stage1JettisonVelocity=0,0,-6
Stage1JettisonAngularVelocity=1,0.5,0
Stage1JettisonLifetime=45
Stage1Submodel1=eu_missile_ugm-96a_aerospike
Stage1Submodel1StartPosition=0,0,-0.023419
Stage1Submodel1EndPosition=0,0,0
Stage1Submodel1Duration=0.8
Stage1Submodel1Delay=5

// Motor 2. Exhaust moves to the newly exposed second nozzle.
Stage2Mesh=eu_missile_ugm-96a_stage2
Stage2SeparationTime=80
Stage2FlightEffect=effects/weapons/emitters/solidrocket_large/rocketmotor_solid_large.ini
Stage2FlightEffectPosition=0,0,-0.044937
Stage2BurnTime=15
Stage2Acceleration=4.0
Stage2BurnTimeDelay=0
Stage2AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
;Stage2SeparationEffect=effects/weapons/emitters/usn_rur-5_separation
;Stage2SeparationEffectPosition=0,0,0.020709
Stage2JettisonMesh=eu_missile_ugm-96a_stage2_nosecone1
Stage2JettisonMeshPosition=0,0,0
Stage2JettisonVelocity=15,0,30
Stage2JettisonAngularVelocity=0,90,0
Stage2JettisonLifetime=30

Stage2JettisonMesh2=eu_missile_ugm-96a_stage2_nosecone2
Stage2JettisonMeshPosition2=0,0,0
Stage2JettisonVelocity2=-15,0,30
Stage2JettisonAngularVelocity2=0,-90,0
Stage2JettisonLifetime2=30

// Motor 2 continues after both nosecone halves have separated.
// Stage2 and Stage3 are visual phases of the SAME motor; discard it at 107 s.
Stage3Mesh=eu_missile_ugm-96a_stage3
Stage3SeparationTime=107
Stage3FlightEffect=effects/weapons/emitters/solidrocket_large/rocketmotor_solid_large.ini
Stage3FlightEffectPosition=0,0,-0.044937
Stage3BurnTime=25
Stage3Acceleration=3.5
Stage3BurnTimeDelay=0
Stage3AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
;Stage3SeparationEffect=effects/weapons/emitters/usn_rur-5_separation
;Stage3SeparationEffectPosition=0,0,0.031704
Stage3JettisonMesh=eu_missile_ugm-96a_stage3_debris
Stage3JettisonVelocity=0,0,-10           // Cosmetic aft separation of the spent motor.
Stage3JettisonAngularVelocity=0,0,0
Stage3JettisonLifetime=10

// Motor 3, with the payload section visible around it.
Stage4Mesh=eu_missile_ugm-96a_stage4
Stage4SeparationTime=180
Stage4FlightEffect=effects/weapons/emitters/solidrocket_upperstage/rocketmotor_upperstage_medium.ini
Stage4FlightEffectPosition=0,0,-0.012227
Stage4BurnTime=30
Stage4Acceleration=3.0
Stage4BurnTimeDelay=0
Stage4AudioClip=audio/weapons/Missile-HighAltitude_MotorLoop_2.wav
;Stage4SeparationEffect=effects/weapons/emitters/usn_rur-5_separation
;Stage4SeparationEffectPosition=0,0,0.021415
Stage4JettisonMesh=eu_missile_ugm-96a_stage4_debris
Stage4JettisonVelocity=0,0,-3
Stage4JettisonAngularVelocity=0.5,0,0
Stage4JettisonLifetime=10

// Motor 3 burns for 30 s, then coasts until release at 180 s after water exit, matching D5.
// Inert carrier. Eight Mk4 rounds release on entry to Stage5.
Stage5Mesh=eu_missile_ugm-96a_stage5
Stage5BurnTime=0
Stage5Acceleration=0
Stage5BurnTimeDelay=0
InFlightSound=

// Eight plate mounts, starting at +Y and stepping 45 degrees toward -X.
// Reference Unity position: 0,0.007968,0.01133. INI Position values are metres. Every nose tilts 6 degrees inward.
// Carried meshes use the Trident material and disappear individually on release.
// Aim=Point uses each seekerless W76's native inertial guidance.
// Provisional gameplay spread: random points on a 500 m ring around the carrier aimpoint.
// For a filled circle, set all InnerRadius values to 0. Impacts retain native flight error.
// Stage5 releases across two physics updates (maximum four spawns per update).
NumberOfSubmunitionLaunchers=8

// RV 1: plate azimuth 0 degrees.
Submunition1Ammunition=usn_w76_mk4
Submunition1Count=1
Submunition1Stage=5
Submunition1Time=201
Submunition1Position=0,0.535450135,0.761376761
Submunition1Rotation=6,0,0
Submunition1StowedMesh=eu_missile_w76_mk4
Submunition1EjectVelocity=0,0,20
Submunition1InitialDrop=0
Submunition1Aim=Point
Submunition1Radius=50000
Submunition1InnerRadius=20000

// RV 2: plate azimuth 45 degrees.
Submunition2Ammunition=usn_w76_mk4
Submunition2Count=1
Submunition2Stage=5
Submunition2Time=202
Submunition2Position=-0.378620422,0.378620422,0.761376761
Submunition2Rotation=4.238756093,4.250403469,45.157366779
Submunition2StowedMesh=eu_missile_w76_mk4
Submunition2EjectVelocity=0,0,20
Submunition2InitialDrop=0
Submunition2Aim=Point
Submunition2Radius=50000
Submunition2InnerRadius=20000

// RV 3: plate azimuth 90 degrees.
Submunition3Ammunition=usn_w76_mk4
Submunition3Count=1
Submunition3Stage=5
Submunition3Time=203
Submunition3Position=-0.535450135,0,0.761376761
Submunition3Rotation=0,6,90
Submunition3StowedMesh=eu_missile_w76_mk4
Submunition3EjectVelocity=0,0,20
Submunition3InitialDrop=0
Submunition3Aim=Point
Submunition3Radius=50000
Submunition3InnerRadius=20000

// RV 4: plate azimuth 135 degrees.
Submunition4Ammunition=usn_w76_mk4
Submunition4Count=1
Submunition4Stage=5
Submunition4Time=204
Submunition4Position=-0.378620422,-0.378620422,0.761376761
Submunition4Rotation=-4.238756093,4.250403469,134.842633221
Submunition4StowedMesh=eu_missile_w76_mk4
Submunition4EjectVelocity=0,0,20
Submunition4InitialDrop=0
Submunition4Aim=Point
Submunition4Radius=50000
Submunition4InnerRadius=20000

// RV 5: plate azimuth 180 degrees.
Submunition5Ammunition=usn_w76_mk4
Submunition5Count=1
Submunition5Stage=5
Submunition5Time=205
Submunition5Position=0,-0.535450135,0.761376761
Submunition5Rotation=-6,0,180
Submunition5StowedMesh=eu_missile_w76_mk4
Submunition5EjectVelocity=0,0,20
Submunition5InitialDrop=0
Submunition5Aim=Point
Submunition5Radius=50000
Submunition5InnerRadius=20000

// RV 6: plate azimuth 225 degrees.
Submunition6Ammunition=usn_w76_mk4
Submunition6Count=1
Submunition6Stage=5
Submunition6Time=206
Submunition6Position=0.378620422,-0.378620422,0.761376761
Submunition6Rotation=-4.238756093,-4.250403469,-134.842633221
Submunition6StowedMesh=eu_missile_w76_mk4
Submunition6EjectVelocity=0,0,20
Submunition6InitialDrop=0
Submunition6Aim=Point
Submunition6Radius=50000
Submunition6InnerRadius=20000

// RV 7: plate azimuth 270 degrees.
Submunition7Ammunition=usn_w76_mk4
Submunition7Count=1
Submunition7Stage=5
Submunition7Time=207
Submunition7Position=0.535450135,0,0.761376761
Submunition7Rotation=0,-6,-90
Submunition7StowedMesh=eu_missile_w76_mk4
Submunition7EjectVelocity=0,0,20
Submunition7InitialDrop=0
Submunition7Aim=Point
Submunition7Radius=50000
Submunition7InnerRadius=20000

// RV 8: plate azimuth 315 degrees.
Submunition8Ammunition=usn_w76_mk4
Submunition8Count=1
Submunition8Stage=5
Submunition8Time=208
Submunition8Position=0.378620422,0.378620422,0.761376761
Submunition8Rotation=4.238756093,-4.250403469,-45.157366779
Submunition8StowedMesh=eu_missile_w76_mk4
Submunition8EjectVelocity=0,0,20
Submunition8InitialDrop=0
Submunition8Aim=Point
Submunition8Radius=50000
Submunition8InnerRadius=20000

[MissileLaunchControl]
Enabled=True
StartAfterWaterExit=True              // Native underwater ascent first; reset clearance/stage clocks at water exit.
Profile=SoftLaunchTurnover
ReplaceInitialFlightPhase=False
ClearanceDistance=15                  // Metres from the observed exit position; clears the aft end before ignition.
EjectionSpeed=35                      // Used for a surface test launch only; submerged exit speed is inherited.
TurnoverAim=FixedPitch //NativeFlightPath
TurnoverPitch=77                      // Near-vertical ignition, then hand over to the native ballistic flight planner.
TurnoverRate=12
TurnoverTolerance=5
TurnoverBraking=False
StopUpwardMotion=True                   // Brake positive world-up velocity near the end of tip-over; False keeps the previous behavior.
UpwardBrakeTime=1.00                     // Seconds to stop ascent; 0 stops immediately; default 0.25, range 0..5.
UpwardBrakeMode=SmoothStep                   // Linear (default), SmoothStep for a soft start/end, or Instant.
IgnitionStage=0
HandoffTime=0.25
MaxControlTime=2.7
VisualPivot=Auto
DelayStage1EffectsUntilTurnoverComplete=False // SoftLaunchTurnover already holds the motor and its stage effects.
ControlEffects=Auto
Debug=True

[MissileThrustVectorControl]
Enabled=True
FlightPhases=ToBearing,MoveToLoftAlt,MaintainLoftAlt
MaxTurnGBonus=10                       // Visual exhaust deflection; no extra terminal maneuver capability.
MinTurnRate=0.25
ActiveDuration=-1
RequireMotorBurning=True
ControlEffects=Auto
Debug=False

[Maneuver_Motor1]
Type=StageExhaust
Stage=1
Stages=1
EffectIndex=1
MaxDeflectionAngle=4
FullDeflectionRate=3
ResponseTime=0.15

[Maneuver_Motor2]
Type=StageExhaust
Stage=2
Stages=2
EffectIndex=1
MaxDeflectionAngle=4
FullDeflectionRate=3
ResponseTime=0.15

[Maneuver_Motor3]
Type=StageExhaust
Stage=4
Stages=4
EffectIndex=1
MaxDeflectionAngle=4
FullDeflectionRate=3
ResponseTime=0.15

[Particles]
// Clear native motor slots to prevent duplicate plumes or an exhaust at an old nozzle.
BoosterEffect=
BoosterEffectClass=
InFlightEffect=
InFlightEffectClass=
SustainerEffect=
SustainerEffectClass=
UnderwaterTrail=effects/weapons/emitters/submarine_torpedo_launch //aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.119161


// Native None disables each impact effect, including inherited EffectClass fallbacks.
HitDefaultExplosion=None
HitShipExplosion=None
HitGroundExplosion=None
HitObjectExplosion=None
HitAirExplosion=None
// Native water-exit splash also uses this slot; keep it available for launch.
HitWaterSplash=effects/splashes/emitters/splash_large
ExplosionOverwaterSplash=None
DebrisTrail=None
DebrisSplash=None