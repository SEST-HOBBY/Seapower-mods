#!extend ammunition/wp_sa-n-9.ini

[General]
DefaultCameraDistance=0.3
MinCameraDistanceForeAft=0.14
MinCameraDistanceBroadside=0.12
CameraPivotHeight=0.0

[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_sa-n-9_body
ResourcesMaterialFolder=assets/europack/materials/SA-N-9/
ResourcesMaterial=SA-N-9_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshSwitchTime=  // time in seconds after launch to switch from launch mesh to main mesh

NumberOfSubModels=2
SubModel1=ControlFinPair1
SubModel2=ControlFinPair2
ControlSurfaceMaxAngle=20
ControlSurfaceFullDeflectionRate=30
ControlSurfaceResponseTime=0.08

NumberOfStages=1

Stage1Mesh=eu_missile_sa-n-9_body
Stage1FlightEffect=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium_boost.ini
Stage1FlightEffectPosition=0,0,-0.020229
Stage1BurnTime=16
Stage1AudioClip=audio/weapons/Missile-Small_MotorLoop.wav

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav


[ControlFinPair1]
Type=None
Mesh=eu_missile_sa-n-9_fin
// Mesh contains two opposite fins; its origin is the centre of their hinge axis.
Position=0,0,0.014459
Rotation=0,0,-30
ControlSurface=True
ControlDirection=Reversed

[ControlFinPair2]
Type=None
Mesh=eu_missile_sa-n-9_fin
Position=0,0,0.014459
Rotation=0,0,60
ControlSurface=True
ControlDirection=Reversed


[MissileLaunchControl]
Enabled=True                           // Enable the short launch controller for this ammunition.
Profile=SoftLaunchTurnover              // Eject without motor thrust, turn the body, ignite, then hand back to native guidance.
ReplaceInitialFlightPhase=True          // Replace InitialFlightPhaseDuration; the native mesh switch and launch initialization still run.
ClearanceDistance=3                     // Metres traveled along the original launch axis before tip-over is allowed.
EjectionSpeed=22                        // Initial ejection speed in metres/second; gravity acts during the unpowered launch.
TurnoverAim=NativeFlightPath             // Follow the native steering goal, including TerminalLoft and target-altitude corrections.
TurnoverPitch=0                        // Used by FixedPitch or RelativePitch only: positive = nose up; negative = nose down.
TurnoverRate=200                        // Maximum launch-body rotation in degrees/second, independent of the later maneuver G bonus.
TurnoverTolerance=3                     // Degrees of remaining alignment error that complete tip-over.
TurnoverBraking=True                    // Optional soft-launch slowdown with opposite jets before alignment. Default: False.
TurnoverBrakeAngle=10                   // Maximum remaining angle in degrees at which braking may start; must exceed TurnoverTolerance.
TurnoverBrakeDuration=0.08              // Maximum braking time in simulation seconds; shortened when less stopping angle remains.
HandoffTime=0.20                        // Seconds used to blend ejection movement into native powered flight.
MaxControlTime=2.0                     // Safety timeout in seconds; ignite and release to native guidance if alignment cannot finish.
VisualPivot=Auto                        // Geometric mesh midpoint; an explicit x,y,z value is in metres and affects visuals only.
DelayStage1EffectsUntilTurnoverComplete=True // Explicit visual gate; SoftLaunchTurnover already delays ignition and its scheduled effects.
ControlEffects=Auto                     // Auto selects Launch_ sections; All selects every control-effect section.
Debug=True                             // Log launch transitions, jet binding and first emission while checking visibility.

[Launch_NoseRight]
Type=Thruster                          // Optional visible tip-over jet, selected by the Launch_ section-name prefix.
Effect=effects/weapons/emitters/thrusters/control_thruster.ini // Local +Z jet before the configured rotation.
Position=0.001388,0,0.014787                 // Missile-local mesh units; approximate nose-side visual mount.
Rotation=0,90,0                        // Jet toward +X; reaction force toward -X.
FullDeflectionRate=180                  // Body turn rate in degrees/second for full emission.
ResponseTime=0.025                      // Jet emission response time in seconds.

[Launch_NoseLeft]
Type=Thruster                          // Left-side tip-over jet.
Effect=effects/weapons/emitters/thrusters/control_thruster.ini // Local +Z jet before Rotation.
Position=-0.001388,0,0.014787                // Missile-local mesh units; approximate nose-side visual mount.
Rotation=0,-90,0                       // Jet toward -X; reaction force toward +X.
FullDeflectionRate=180                  // Body turn rate in degrees/second for full emission.
ResponseTime=0.025                      // Jet emission response time in seconds.

[Launch_NoseTop]
Type=Thruster                          // Top-side tip-over jet.
Effect=effects/weapons/emitters/thrusters/control_thruster.ini // Local +Z jet before Rotation.
Position=0,0.001388,0.014787                 // Missile-local mesh units; approximate nose-side visual mount.
Rotation=-90,0,0                       // Jet toward +Y; reaction force toward -Y.
FullDeflectionRate=180                  // Body turn rate in degrees/second for full emission.
ResponseTime=0.025                      // Jet emission response time in seconds.

[Launch_NoseBottom]
Type=Thruster                          // Bottom-side tip-over jet.
Effect=effects/weapons/emitters/thrusters/control_thruster.ini // Local +Z jet before Rotation.
Position=0,-0.001388,0.014787                // Missile-local mesh units; approximate nose-side visual mount.
Rotation=90,0,0                        // Jet toward -Y; reaction force toward +Y.
FullDeflectionRate=180                  // Body turn rate in degrees/second for full emission.
ResponseTime=0.025                      // Jet emission response time in seconds.


[---------- Effects ----------]

[Particles]
BoosterEffect=
BoosterEffectPosition=0,0,0
InFlightEffectClass=
InFlightEffectPosition=0,0,-0.045
InFlightEffectStartTime=0.1  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=
SustainerEffectPosition=0,0,0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion
