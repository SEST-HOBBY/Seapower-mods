#!extend ammunition/usn_aim-9x.ini

[General]
DefaultCameraDistance=0.3
MinCameraDistanceForeAft=0.14
MinCameraDistanceBroadside=0.12
CameraPivotHeight=0.0

[Guidance]
MaxTurnRate=100                       // Maximum turnrate in degrees per second
MaxTurnG=50                       // Maximum G-limit of missile turns

DragCoefficient=-1               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
TypicalTargetAlt=20000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=300						// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=20000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=500				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
MaxFlightTime=60               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited

[---------- Mesh definitions----------]

[Models]
ResourcesFolder=assets/models/ammunition/aim-9/
ResourcesRoot=usn_aim-9x.obj
ResourcesMesh=aim-9
ResourcesMaterial=usn_aim-9x_mat.ini
ResourcesMeshSwitchTime=0.2  // time in seconds after launch to switch from launch mesh to main mesh

NumberOfSubModels=5

SubModel1=ControlFinPair1         
SubModel2=ControlFinPair2         
SubModel3=ControlFinPair1_JetVane 
SubModel4=ControlFinPair2_JetVane 
SubModel5=Glas                    

ControlSurfaceMaxAngle=30
ControlSurfaceFullDeflectionRate=30
ControlSurfaceResponseTime=0.08

NumberOfStages=1

Stage1Mesh=aim-9_body
Stage1MeshPosition=0,0,0
Stage1MeshRotation=0,0,0
Stage1FlightEffect=effects/weapons/emitters/solidrocket_aam_small/rocketmotor_solid_aam_small_smokeless.ini
Stage1FlightEffectPosition=0,0,-0.021077
Stage1FlightEffectScale=0.5,0.5,0.5
Stage1BurnTime=5.23
Stage1AudioClip=audio/weapons/Missile-Small_MotorLoop.wav

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav


[MissileThrustVectorControl]
Enabled=True                           // Enable the optional maneuver controller for this ammunition.
FlightPhases=TerminalApproach           // Native flight phases in which the additional control authority is available.
MaxTurnGBonus=20                        // Extra lateral acceleration in G; also raises the corresponding angular-rate limit.
MinTurnRate=0                          // TVC effects start at 3 deg/s of combined pitch/yaw; stop below 80% of this rate. 0 = no threshold. Does not limit launch effects or G bonus.
ActiveDuration=-1                     // Seconds from first eligible phase entry; the timer never resets on phase re-entry. -1 = unlimited.
RequireMotorBurning=True               // False allows independent attitude-control jets after main-motor burnout.
ControlEffects=Auto                     // Auto selects Maneuver_ effect sections; All selects all control-effect sections.
Debug=False                             // Log terminal authority, jet binding and first emission for visibility checks.

[Maneuver_MainMotor]
Type=StageExhaust                       // Add a visual deflection to the Stage mod's existing exhaust anchor.
Stage=1                                // Use the single flying stage.
MaxDeflectionAngle=20                   // Degrees of maximum visible nozzle/plume deflection.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full visual deflection.
ResponseTime=0.06                       // Seconds of visual response smoothing.



[Glas]
Mesh=Glas
ResourcesMaterialFolder=aircraft/materials/
Material=cockpit_glass

[ControlFinPair1]
Type=None
Mesh=aim-9_fin
Position=0,0,-0.019343
Rotation=0,0,45
ControlSurface=True

[ControlFinPair2]
Type=None
Mesh=aim-9_fin
Position=0,0,-0.019343
Rotation=0,0,-45
ControlSurface=True

[ControlFinPair1_JetVane]
Type=None
Mesh=aim-9_jet_vane
Position=0,0,-0.021077
Rotation=0,0,45
ControlSurface=True

[ControlFinPair2_JetVane]
Type=None
Mesh=aim-9_jet_vane
Position=0,0,-0.021077
Rotation=0,0,-45
ControlSurface=True

[---------- Effects ----------]
[Particles]
BoosterEffect=
BoosterEffectPosition=0,0,-0.022

InFlightEffectClass=
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=7.75  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=
SustainerEffectPosition=0,0,-0.02 
SustainerEffectStartTime=4.0

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
