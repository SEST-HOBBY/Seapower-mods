#!extend ammunition/usn_pac3_mse.ini

[Guidance]
AutoAttackBelowMinAltitude=True
AutoAttackAboveMaxAltitude=False
OptimalTargetDist=10,30

MaxTurnRate=30.0                       // Maximum turnrate in degrees per second

[Models]
InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_PAC-3_MSE
ResourcesMaterialFolder=assets/europack/materials/PAC-3_MSE/
ResourcesMaterial=PAC-3_MSE_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfSubModels=2
SubModel1=ControlFinPair1
SubModel2=ControlFinPair2
ControlSurfaceMaxAngle=20
ControlSurfaceFullDeflectionRate=30
ControlSurfaceResponseTime=0.08

NumberOfStages=2

Stage1Mesh=eu_missile_PAC-3_MSE          // Existing complete MSE mesh; the former launch-mesh name is absent from weapons.obj.
Stage1SeparationTime=0.1
Stage1FlightEffect=effects/weapons/emitters/solidrocket_small/rocketmotor_solid_small_boost.ini
Stage1FlightEffectPosition=0,0,-0.035
Stage1BurnTime=0.1
Stage1AudioClip=audio/weapons/Missile-Large_MotorLoop.wav

Stage2Mesh=eu_missile_PAC-3_MSE_body
Stage2FlightEffect=effects/weapons/emitters/solidrocket_small/rocketmotor_solid_small_boost.ini
Stage2FlightEffectPosition=0,0,-0.035
Stage2BurnTime=9.0
Stage2AudioClip=audio/weapons/Missile-Medium_MotorLoop.wav


[ControlFinPair1]
Type=None
Mesh=eu_missile_PAC-3_MSE_fin_1
// Mesh contains two opposite fins; its origin is the centre of their hinge axis.
Position=0,0,-0.031473
Rotation=0,0,45
ControlSurface=True
ControlStages=2

[ControlFinPair2]
Type=None
Mesh=eu_missile_PAC-3_MSE_fin_2
Position=0,0,-0.031473
Rotation=0,0,-45
ControlSurface=True
ControlStages=2


[---------- Effects ----------]

[Particles]
BoosterEffect=
BoosterEffectPosition=0,0,0
InFlightEffect=
InFlightEffectPosition=0,0,0
InFlightEffectStartTime=1  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=
SustainerEffectPosition=0,0,0
SustainerEffectStartTime=0.2

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

// MissileControlMod: configurable game tuning, not measured missile performance.
[MissileLaunchControl]
Enabled=True                           // Enable nose-jet-assisted alignment during the powered launch.
Profile=PoweredTurnover                 // Preserve native motor thrust and the existing stage motor effects during launch.
ReplaceInitialFlightPhase=True          // Replace the native straight-flight delay with clearance and alignment control.
ClearanceDistance=1                     // Metres traveled along the original launch axis before the nose starts turning.
TurnoverAim=NativeFlightPath             // Follow the game's current waypoint/loft steering goal.
TurnoverRate=150                        // Maximum launch-body rotation in degrees/second; matches the inherited launch turn rate.
TurnoverTolerance=3                     // Remaining angular error in degrees that completes launch alignment.
HandoffTime=0.15                        // Seconds of handoff before terminal maneuver authority becomes eligible.
MaxControlTime=3.0                     // Maximum clearance/alignment time before release to native guidance.
VisualPivot=0,0,-0.016335              // Cosmetic pivot at the geometric missile midpoint.
DelayStage1EffectsUntilTurnoverComplete=False // The powered launch keeps its existing motor-effect timing.
ControlEffects=All                      // Reuse the same eight nose-jet definitions for launch; this file has no StageExhaust controller.
Debug=True                             // Log jet binding and first emission while checking visibility; set False after tuning.

[MissileThrustVectorControl]
Enabled=True                           // Enable the optional maneuver controller for this ammunition.
FlightPhases=TerminalApproach           // Native flight phases in which the additional control authority is available.
MaxTurnGBonus=15                        // Extra lateral acceleration in G; also raises the corresponding angular-rate limit.
MinTurnRate=5                          // TVC effects start at 3 deg/s of combined pitch/yaw; stop below 80% of this rate. 0 = no threshold. Does not limit launch effects or G bonus.
ActiveDuration=-1                     // Seconds from first eligible phase entry; the timer never resets on phase re-entry. -1 = unlimited.
RequireMotorBurning=False               // False allows independent attitude-control jets after main-motor burnout.
ControlEffects=Auto                     // Auto selects Maneuver_ effect sections; All selects all control-effect sections.
Debug=True                             // Log terminal authority, jet binding and first emission for visibility checks.

[Maneuver_NoseRight]
Type=Thruster                          // A separately configured visual control jet; it does not add another G bonus.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini // Particle resource emitting along local +Z before Rotation.
Position=0.00225,0,0.020394                // Missile-local mesh units; positive Z points toward the nose.
Rotation=0,90,0                        // Rotate the jet toward +X; reaction force points toward -X.
Stages=2                               // Only show the jet on the flying Stage-2 model.
FullDeflectionRate=30                   // Degrees/second for full emission; signed position and jet direction choose the active side.
ResponseTime=0.04                       // Emission response time in seconds.

[Maneuver_NoseLeft]
Type=Thruster                          // Independent left-side control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini // Jet resource; neutral emission is local +Z.
Position=-0.00225,0,0.020394               // Missile-local mesh units; mounted near the nose on the left side.
Rotation=0,-90,0                       // Jet toward -X; reaction force toward +X.
Stages=2                               // Only show this jet in visual Stage 2.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full emission.
ResponseTime=0.04                       // Emission response time in seconds.

[Maneuver_NoseTop]
Type=Thruster                          // Independent top-side control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini // Jet resource; neutral emission is local +Z.
Position=0,0.00225,0.020394                // Missile-local mesh units; mounted near the nose on the top side.
Rotation=-90,0,90 // Roll the five-port row along missile Z; jet direction is unchanged.
Stages=2                               // Only show this jet in visual Stage 2.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full emission.
ResponseTime=0.04                       // Emission response time in seconds.

[Maneuver_NoseTopRight]
Type=Thruster                          // Independent upper-right diagonal control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini // Jet resource; neutral emission is local +Z.
Position=0.00159099,0.00159099,0.020394 // 45-degree diagonal mount; same 0.00225 radial distance and nose Z as the cardinal jets.
Rotation=-45,90,0                      // Jet outward toward +X/+Y; the five-port row stays along missile Z.
Stages=2                               // Only show this jet in visual Stage 2.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full emission.
ResponseTime=0.04                       // Emission response time in seconds.

[Maneuver_NoseTopLeft]
Type=Thruster                          // Independent upper-left diagonal control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini // Jet resource; neutral emission is local +Z.
Position=-0.00159099,0.00159099,0.020394 // 45-degree diagonal mount; same 0.00225 radial distance and nose Z as the cardinal jets.
Rotation=-45,-90,0                      // Jet outward toward -X/+Y; the five-port row stays along missile Z.
Stages=2                               // Only show this jet in visual Stage 2.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full emission.
ResponseTime=0.04                       // Emission response time in seconds.

[Maneuver_NoseBottom]
Type=Thruster                          // Independent bottom-side control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini // Jet resource; neutral emission is local +Z.
Position=0,-0.00225,0.020394               // Missile-local mesh units; mounted near the nose on the bottom side.
Rotation=90,0,90 // Roll the five-port row along missile Z; jet direction is unchanged.
Stages=2                               // Only show this jet in visual Stage 2.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full emission.
ResponseTime=0.04                       // Emission response time in seconds.

[Maneuver_NoseBottomRight]
Type=Thruster                          // Independent lower-right diagonal control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini // Jet resource; neutral emission is local +Z.
Position=0.00159099,-0.00159099,0.020394 // 45-degree diagonal mount; same 0.00225 radial distance and nose Z as the cardinal jets.
Rotation=45,90,0                      // Jet outward toward +X/-Y; the five-port row stays along missile Z.
Stages=2                               // Only show this jet in visual Stage 2.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full emission.
ResponseTime=0.04                       // Emission response time in seconds.

[Maneuver_NoseBottomLeft]
Type=Thruster                          // Independent lower-left diagonal control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_pac3.ini // Jet resource; neutral emission is local +Z.
Position=-0.00159099,-0.00159099,0.020394 // 45-degree diagonal mount; same 0.00225 radial distance and nose Z as the cardinal jets.
Rotation=45,-90,0                      // Jet outward toward -X/-Y; the five-port row stays along missile Z.
Stages=2                               // Only show this jet in visual Stage 2.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full emission.
ResponseTime=0.04                       // Emission response time in seconds.
