#!extend ammunition/mbda_aster_15.ini

[Guidance]
AutoAttackBelowMinAltitude=True
AutoAttackAboveMaxAltitude=False
OptimalTargetDist=3,15

InitialFlightPhaseDuration=0.3         // time in seconds where the missile moves straight on without guiding

MaxLoftAngle=80.0                      // Climb angle for initial loft

LaunchTurnRate=120                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second

[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_aster_15
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime= // time in seconds after launch to switch from launch mesh to main mesh
ResourcesMaterialFolder=assets/europack/materials/aster_15/
ResourcesMaterial=aster_15_mat.ini

NumberOfStages=2

Stage1Mesh=eu_launch_aster_15
Stage1MeshPosition=0,0,0
Stage1MeshRotation=0,0,0
Stage1SeparationTime=4
Stage1FlightEffect=effects/weapons/emitters/sam_medium_effect
Stage1FlightEffectPosition=0,0,-0.033
Stage1BurnTime=3.5
Stage1SeparationEffect=
Stage1SeparationEffectPosition=0,0,0
Stage1JettisonMesh=eu_missile_aster_15_stage1_debris
Stage1JettisonMeshPosition=0,0,0
Stage1JettisonMeshRotation=0,0,0

Stage2Mesh=eu_missile_aster_15
Stage2MeshPosition=0,0,0
Stage2MeshRotation=0,0,0
Stage2FlightEffect=effects/weapons/emitters/sam_small_effect
Stage2FlightEffectPosition=0,0,-0.025
Stage2FlightEffect2=effects/weapons/emitters/wp_ss-n-3_sustainer
Stage2FlightEffect2Position=0,0,0.1
Stage2FlightEffect2Scale=0.35,0.35,1.5
Stage2BurnTime=8

[---------- Effects ----------]

[Particles]
BoosterEffect=
BoosterEffectPosition=0,0,0
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.045
InFlightEffectStartTime=0.1  // in seconds, after that the Inflight Effect will be played if available
InFlightEffectScale=0.2,0.2,0.2

SustainerEffect=
SustainerEffectPosition=0,0,0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion