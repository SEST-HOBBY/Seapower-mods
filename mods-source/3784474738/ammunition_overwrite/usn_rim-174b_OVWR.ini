#!extend ammunition/usn_rim-174b.ini

[Guidance]
AutoAttackBelowMinAltitude=True
AutoAttackAboveMaxAltitude=False
OptimalTargetDist=60,180

InitialFlightPhaseDuration=1         // time in seconds where the missile moves straight on without guiding

MaxLoftAngle=80.0                      // Climb angle for initial loft

LaunchTurnRate=90                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
TimeLimited=True

[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_launch_SM-6
ResourcesMaterialFolder=assets/europack/materials/RIM-174_ERAM/
ResourcesMaterial=RIM-174A_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfSubModels=2
SubModel1=ControlFinPair1
SubModel2=ControlFinPair2
ControlSurfaceMaxAngle=20
ControlSurfaceFullDeflectionRate=30
ControlSurfaceResponseTime=0.08

NumberOfStages=2

Stage1Mesh=eu_launch_SM-6
Stage1SeparationTime=8.5
Stage1FlightEffect=effects/weapons/emitters/solidrocket_mk72/rocketmotor_solid_mk72.ini
Stage1FlightEffectPosition=0,0,-0.053
Stage1BurnTime=8.0
Stage1AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
Stage1SeparationEffect=effects/weapons/usn_rur-5_separation
Stage1SeparationEffectPosition=0,0,0
Stage1JettisonMesh=eu_missile_SM-3_Blk2_stage1_debris

Stage2Mesh=eu_missile_SM-6_body
Stage2FlightEffect=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium.ini
Stage2FlightEffectPosition=0,0,-0.0328
Stage2BurnTime=44.0
Stage2AudioClip=audio/weapons/Missile-Medium_MotorLoop.wav

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav

[ControlFinPair1]
Type=None
Mesh=eu_missile_SM_fin
// Mesh contains two opposite fins; its origin is the centre of their hinge axis.
Position=0,0,-0.030263
Rotation=0,0,45
ControlSurface=True
ControlStages=2

[ControlFinPair2]
Type=None
Mesh=eu_missile_SM_fin
Position=0,0,-0.030263
Rotation=0,0,-45
ControlSurface=True
ControlStages=2

[---------- Effects ----------]

[Particles]
InFlightEffectClass=
BoosterEffect=
BoosterEffectPosition=0,0,0
InFlightEffect=
InFlightEffectPosition=0,0,-0.025
InFlightEffectStartTime=1  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=
SustainerEffectPosition=0,0,-0.033
SustainerEffectStartTime=0.2

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion
