#!extend ammunition/usn_aim-120a.ini
# AIM-120A air-to-air missile.

[General]
DefaultCameraDistance=0.3
MinCameraDistanceForeAft=0.14
MinCameraDistanceBroadside=0.12
CameraPivotHeight=0.0

[---------- Warhead ----------]
[WarheadData]
InterceptSpeedPenaltyMultiplier=1.00            // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
InterceptOutOfAltitudePenalty=0.30              // base value used for out-of-altitude calculations, 0.20 is excellent, 0.30 is good, 0.40 is average, 0.50 is poor
InterceptSizePenaltyMultiplier=0.20             // multiplier to the size penalty, 1.0 is default
KillProbability=0.80                            // Base chance to hit

[---------- Guidance ----------]
[Guidance]
MaxLoftAngle=20                                 // Climb angle for initial loft
MaxLoftAlt=45000                                // Maximum altitude for lofting
ApplyKinematics=True                            // If we should use full kinematics rules. If this is true, we will only use kinematics
MaxVelocity=1600                                // Maximum speed in knots
AccelerationTime=1.7                            // Burn time for initial booster burn
Acceleration=16.2                               // Gs of acceleration in initial burn
SustainerAccelerationTime=5.3                   // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=11.9                      // Acceleration of sustainer burn. -1 if there is no sustainer
DragCoefficient=2.1                             // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
TypicalTargetAlt=40000                          // Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=450                          // Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=40000                          // Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=790                       // Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
MaxFlightTime=90                                // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TimeLimited=True
LiftFactor=0.005                                // default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
OptimizeLoftAlt=True
MaxLaunchRange=50                               // Maximum launch range in nautical miles
MinAttackAltitude=50                            // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackVelocity=1600                          // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed

[---------- Mesh definitions----------]

[Models]
ResourcesFolder=assets/models/ammunition/aim-120/
ResourcesRoot=usn_aim-120a.obj
ResourcesMesh=usn_aim-120a_body
ResourcesMeshForLaunch=usn_aim-120a
ResourcesMaterial=usn_aim-120a_mat.ini
ResourcesMeshSwitchTime=0.2                     // time in seconds after launch to switch from launch mesh to main mesh

Rotation=0,0,45

NumberOfSubModels=2
SubModel1=ControlFinPair1
SubModel2=ControlFinPair2

ControlSurfaceMaxAngle=20
ControlSurfaceFullDeflectionRate=30
ControlSurfaceResponseTime=0.08

NumberOfStages=1

Stage1Mesh=usn_aim-120a_body
Stage1MeshPosition=0,0,0
Stage1MeshRotation=0,0,0
Stage1FlightEffect=effects/weapons/emitters/solidrocket_aam_medium/rocketmotor_solid_aam_medium_smokeless.ini
Stage1FlightEffectPosition=0,0,-0.014713
Stage1BurnTime=7
Stage1AudioClip=audio/weapons/Missile-Small_MotorLoop.wav

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav

[ControlFinPair1]
Type=None
Mesh=usn_aim-120a_fin
Position=0,0,-0.014713
Rotation=0,0,45
ControlSurface=True

[ControlFinPair2]
Type=None
Mesh=usn_aim-120a_fin
Position=0,0,-0.014713
Rotation=0,0,-45
ControlSurface=True

[---------- Effects ----------]
[Particles]
BoosterEffect=
BoosterEffectPosition=0,0,-0.022

InFlightEffectClass=
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=7                       // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=
SustainerEffectPosition=0,0,-0.02
SustainerEffectStartTime=1.7

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
HighSpeedHitDefaultExplosion=effects/explosions/emitters/warhead_highspeed_medium/warhead_highspeed_medium.ini

