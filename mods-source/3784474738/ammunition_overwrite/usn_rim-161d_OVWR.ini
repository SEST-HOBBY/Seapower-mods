#!extend ammunition/usn_rim-161d.ini

[General]
TargetType=AAW                         // can be AAW, ASuW, ASW
CanNotAttackTypes=     // Seeker ignores objects of this type while in default mode

[Guidance]
AutoAttackBelowMinAltitude=False
AutoAttackAboveMaxAltitude=False
OptimalTargetDist=150,600

InitialFlightPhaseDuration=5         // time in seconds where the missile moves straight on without guiding

MaxLoftAngle=90.0                      // Climb angle for initial loft
TerminalApproachDist=50.0              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LaunchTurnRate=5                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
TimeLimited=True
MaxFlightTime=3000                       // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited

SeekerFOV=90                          // Seeker field-of-view in degrees
SeekerPassiveRange=100                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)

[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_launch_SM-3_Blk2
ResourcesMaterialFolder=assets/europack/materials/RIM-161/
ResourcesMaterial=RIM-161D_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

NumberOfStages=5

Stage1Mesh=eu_missile_SM-3_Blk2_stage1
Stage1SeparationTime=8.5                                               // value in s, or flight stage: TerminalApproach, MaintainSeaSkimming   
Stage1FlightEffect=effects/weapons/emitters/solidrocket_mk72/rocketmotor_solid_mk72.ini
Stage1FlightEffectPosition=0,0,-0.053
Stage1BurnTime=8.0                                                     // value in s for FlightEffect
Stage1AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
Stage1SeparationEffect=effects/weapons/usn_rur-5_separation 
Stage1SeparationEffectPosition=0,0,0
Stage1JettisonMesh=eu_missile_SM-3_Blk2_stage1_debris
Stage1JettisonMeshPosition=0,0,0
Stage1JettisonMeshRotation=0,0,0

Stage2Mesh=eu_missile_SM-3_Blk2_stage2
Stage2SeparationTime=29.0                                              // value in s, or flight stage: TerminalApproach, MaintainSeaSkimming   
Stage2FlightEffect1=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium.ini
Stage2FlightEffect1Position=0,0,-0.0328
Stage2BurnTime=20.0                                                    // value in s for FlightEffect
Stage2AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
Stage2SeparationEffect=effects/weapons/usn_rur-5_separation
Stage2SeparationEffectPosition=0,0,0
Stage2JettisonMesh=eu_missile_SM-3_Blk2_stage2_debris
Stage2JettisonMeshPosition=0,0,0
Stage2JettisonMeshRotation=0,0,0

Stage3Mesh=eu_missile_SM-3_Blk2_stage3
Stage3SeparationTime=45.5                                              // value in s, or flight stage: TerminalApproach, MaintainSeaSkimming   
Stage3FlightEffect=effects/weapons/emitters/solidrocket_small/rocketmotor_solid_small.ini
Stage3FlightEffectPosition=0,0,0.02
Stage3BurnTime=15.0                                                    // value in s for FlightEffect
Stage3AudioClip=audio/weapons/Missile-HighAltitude_MotorLoop_2.wav
Stage3SeparationEffect=effects/weapons/usn_rur-5_separation
Stage3SeparationEffectPosition=0,0,0

Stage4Mesh=eu_missile_SM-3_Blk2_stage4
Stage4SeparationTime=TerminalApproach                                 // value in s, or flight stage: TerminalApproach, MaintainSeaSkimming   
Stage4FlightEffect=effects/weapons/emitters/solidrocket_small/rocketmotor_solid_small.ini
Stage4FlightEffectPosition=0,0,0.02
Stage4BurnTime=15.0                                                   // value in s for FlightEffect
Stage4AudioClip=audio/weapons/Missile-HighAltitude_MotorLoop_2.wav
Stage4SeparationEffect=effects/weapons/usn_rur-5_separation
Stage4SeparationEffectPosition=0,0,0
Stage4JettisonMesh=eu_missile_SM-3_Blk2_stage4_debris
Stage4JettisonMeshPosition=0,0,0
Stage4JettisonMeshRotation=0,0,0

Stage5Mesh=eu_missile_SM-3_Blk2_stage5
Stage5FlightEffect=effects/weapons/emitters/thrusters/ACT_medium.ini
Stage5FlightEffectPosition=0,0,0.028
Stage5FlightEffectRotation=0,0,0

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav


[---------- Effects ----------]

[Particles]
BoosterEffect=
BoosterEffectPosition=0,0,0.0088

InFlightEffectClass=
InFlightEffectPosition=0,0,0
InFlightEffectStartTime=1  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=
SustainerEffectPosition=0,0,-0.033
SustainerEffectStartTime=4.0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion
