#!extend ammunition/usn_aim-174b.ini
# AIM-174B flight settings

[Guidance]
InitialFlightPhaseDuration=1.5                  // time in seconds where the missile moves straight on without guiding
MaxLoftAngle=80.0                               // Climb angle for initial loft
MaxLoftAlt=110000.0                             // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
MaxLoftVelocity=3600.0                          // Maximum speed in knots for lofting
TerminalApproachDist=13                         // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=False                         // if true connection with a guiding radar will be severed upon entering terminal approach stage
ApplyKinematics=True                            // If we should use full kinematics rules. If this is true, we will only use kinematics
MaxVelocity=3600.0                              // Maximum speed in knots
MaxTurnRate=30.0                                // Maximum turnrate in degrees per second
MaxTurnG=35                                     // Maximum G-limit of missile turns
AccelerationTime=0                              // Burn time for initial booster burn
Acceleration=0                                  // Gs of acceleration in initial burn
SustainerAccelerationTime=44                    // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=3.15                      // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetSpeed=990                          // Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalLaunchVelocity=660                       // Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=1.78                            // 1.45                        // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.3                               // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=300                               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
OptimizeLoftAlt=True
TerminalLoft=True
TimeLimited=True
LiftFactor=0.0025                               // default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
