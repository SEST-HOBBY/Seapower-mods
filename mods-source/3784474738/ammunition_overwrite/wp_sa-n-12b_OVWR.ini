#!extend ammunition/wp_sa-n-12b.ini

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=sovietweapons.obj
ResourcesMesh=eu_missile_sa-n-12b
ResourcesMaterialFolder=assets/europack/materials/SA-N-12/
ResourcesMaterial=SA-N-12B_mat.ini
ResourcesMeshSwitchTime=0.1  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfSubModels=4
SubModel1=ControlFinPair1
SubModel2=ControlFinPair2
SubModel3=ControlFinPair3
SubModel4=ControlFinPair4
ControlSurfaceMaxAngle=20
ControlSurfaceFullDeflectionRate=30
ControlSurfaceResponseTime=0.08

NumberOfStages=1

Stage1Mesh=eu_missile_sa-n-12b_body
Stage1FlightEffect=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium_boost.ini //effects/weapons/emitters/solidrocket_small/rocketmotor_solid_small.ini 
Stage1FlightEffectPosition=0,0,-0.030
Stage1BurnTime=21
Stage1AudioClip=audio/weapons/Missile-Medium_MotorLoop.wav

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav


[ControlFinPair1]
Type=None
Mesh=eu_missile_sa-n-12b_fin
// Mesh contains two opposite fins; its origin is the centre of their hinge axis.
Position=0,0,-0.032033
Rotation=0,0,-45
ControlSurface=True
ControlStages=1

[ControlFinPair2]
Type=None
Mesh=eu_missile_sa-n-12b_fin
Position=0,0,-0.032033
Rotation=0,0,45
ControlSurface=True
ControlStages=1

[ControlFinPair3]
Type=None
Mesh=eu_missile_sa-n-12b_jet_vane
// Mesh contains two opposite fins; its origin is the centre of their hinge axis.
Position=0,0,-0.036362
Rotation=0,0,-45
ControlSurface=True
ControlStages=1

[ControlFinPair4]
Type=None
Mesh=eu_missile_sa-n-12b_jet_vane
Position=0,0,-0.036362
Rotation=0,0,45
ControlSurface=True
ControlStages=1

[MissileLaunchControl]
Enabled=True                           // Enable nose-jet-assisted alignment during the powered launch.
Profile=PoweredTurnover                 // Preserve native motor thrust and the existing stage motor effects during launch.
ReplaceInitialFlightPhase=True          // Replace the native straight-flight delay with clearance and alignment control.
ClearanceDistance=6                     // Metres traveled along the original launch axis before the nose starts turning.
TurnoverAim=NativeFlightPath             // Follow the game's current waypoint/loft steering goal.
TurnoverRate=120                        // Maximum launch-body rotation in degrees/second; matches the inherited launch turn rate.
TurnoverTolerance=3                     // Remaining angular error in degrees that completes launch alignment.
HandoffTime=0.15                        // Seconds of handoff before terminal maneuver authority becomes eligible.
MaxControlTime=3.0                     // Maximum clearance/alignment time before release to native guidance.
VisualPivot=0,0,-0.016335              // Cosmetic pivot at the geometric missile midpoint.
DelayStage1EffectsUntilTurnoverComplete=False // The powered launch keeps its existing motor-effect timing.
ControlEffects=All                      // Reuse the same four nose-jet definitions for launch; this file has no StageExhaust controller.
Debug=False                             // Log jet binding and first emission while checking visibility; set False after tuning.

[MissileThrustVectorControl]
Enabled=True                           // Enable the optional maneuver controller for this ammunition.
FlightPhases=TerminalApproach           // Native flight phases in which the additional control authority is available.
MaxTurnGBonus=15                        // Extra lateral acceleration in G; also raises the corresponding angular-rate limit.
MinTurnRate=5                          // TVC effects start at 3 deg/s of combined pitch/yaw; stop below 80% of this rate. 0 = no threshold. Does not limit launch effects or G bonus.
ActiveDuration=-1                     // Seconds from first eligible phase entry; the timer never resets on phase re-entry. -1 = unlimited.
RequireMotorBurning=True               // False allows independent attitude-control jets after main-motor burnout.
ControlEffects=All                     // Auto selects Maneuver_ effect sections; All selects all control-effect sections.
Debug=False                             // Log terminal authority, jet binding and first emission for visibility checks.

[Launch_MainMotor]
Type=StageExhaust                       // Add a visual deflection to the Stage mod's existing exhaust anchor.
Stage=1                                // Use the single flying stage.
MaxDeflectionAngle=15                   // Degrees of maximum visible nozzle/plume deflection.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full visual deflection.
ResponseTime=0.06                       // Seconds of visual response smoothing.

[---------- Effects ----------]

[Particles]
BoosterEffect=
InFlightEffectClass=
InFlightEffectStartTime=0.1  // in seconds, after that the Inflight Effect will be played if available
SustainerEffect=
