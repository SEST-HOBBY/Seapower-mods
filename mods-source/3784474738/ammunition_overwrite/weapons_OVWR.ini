#!extend systems/weapons.ini
[ ----------------------- MK 41 ------------------------ ]

[eu_mk41]
# Mark 41 missile launcher
HorizontalDegreesPerSecond=0     // rotation speed horizontally
VerticalDegreesPerSecond=0       // rotation speed vertically
NumberOfAttachments=1            // per container
AttachmentPosition1=0,0,0
PerContainerReload=True          // cells fire any magazine type directly - no seating/unload swaps, rounds spawn at launch
ReloadTime=2                     // per-cell time before the same cell can fire again
FireRate=30                             // rounds per minute
MoveToRestPositionTime=1      // time in seconds the weapon goes back to rest position if not used
Warmup=False
SmokeEffect=effects/weapons/emitters/mk41/smoke_mk41_ring.ini
SmokeEffectPosition=0,0.0,0.065
SmokeEffectDirectional=True
ModuleType=VLS

[eu_mk41_quad]
# Mark 41 missile launcher - quadpack for ESSM
HorizontalDegreesPerSecond=0     // rotation speed horizontally
VerticalDegreesPerSecond=0       // rotation speed vertically
NumberOfAttachments=4            // per container
AttachmentPosition1=0.002248,-0.002332,0
AttachmentPosition2=-0.002248,-0.002332,0
AttachmentPosition3=0.002248,0.002332,0
AttachmentPosition4=-0.002248,0.002332,0
PerContainerReload=True          // cells fire any magazine type directly - no seating/unload swaps, rounds spawn at launch
ReloadTime=2                     // per-cell time before the same cell can fire again
FireRate=30                             // rounds per minute
MoveToRestPositionTime=1      // time in seconds the weapon goes back to rest position if not used
Warmup=False
SmokeEffect=effects/weapons/emitters/mk41/smoke_mk41_ring.ini
SmokeEffectPosition=0,0.0,0.065
SmokeEffectDirectional=True
ModuleType=VLS

[SA-N-9]
; The launcher-effects mapping supplies the cold-ejection cloud once per shot.
SmokeEffect=
