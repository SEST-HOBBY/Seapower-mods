#!extend ammunition/usn_rim-156a.ini

[Guidance]
AutoAttackBelowMinAltitude=True
AutoAttackAboveMaxAltitude=False
OptimalTargetDist=40,90

InitialFlightPhaseDuration=1         // time in seconds where the missile moves straight on without guiding

MaxLoftAngle=80.0                      // Climb angle for initial loft

LaunchTurnRate=90                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
TimeLimited=True

[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_SM-2ER
ResourcesMaterialFolder=assets/europack/materials/RIM-66/
ResourcesMaterial=RIM-156A_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfStages=2

Stage1Mesh=eu_launch_SM-2ER
Stage1SeparationTime=4
Stage1FlightEffect=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium_boost.ini
Stage1FlightEffectPosition=0,0,-0.033
Stage1BurnTime=4
Stage1AudioClip=audio/weapons/Missile-Medium_MotorLoop.wav
Stage1SeparationEffect=
Stage1SeparationEffectPosition=0,0,0

Stage2Mesh=eu_missile_SM-2ER
Stage2FlightEffect=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium.ini
Stage2FlightEffectPosition=0,0,-0.025
Stage2BurnTime=40
Stage2AudioClip=audio/weapons/Missile-Small_MotorLoop.wav

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav

[---------- Effects ----------]

[Particles]
BoosterEffect=
BoosterEffectPosition=0,0,0
InFlightEffect=
InFlightEffectPosition=0,0,-0.025
InFlightEffectStartTime=1  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=
SustainerEffectPosition=0,0,0
SustainerEffectStartTime=0.2

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion
BoosterEffectClass=
SustainerEffectClass=
InFlightEffectClass=
