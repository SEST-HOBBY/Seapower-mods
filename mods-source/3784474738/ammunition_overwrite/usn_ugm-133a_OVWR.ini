#!extend ammunition/usn_ugm-133a.ini
// Requires MissileControlMod 0.1.13+ and MultiStageMissiles 1.2.36+.
// Numerical separation times count from native water exit for submerged launches.
// Five exported visual states represent THREE propulsion stages, a shroud release
// and the unpowered payload carrier. Timings are game tuning, not measured D5 data.
// All meshes share the OBJ origin. Positions are game units, +Z forward.

[Models]
ResourcesFolder=assets/europack/materials/UGM-133A Trident II D5/
ResourcesRoot=Trident_II_D5.obj
ResourcesMesh=eu_missile_ugm-133a_stage1
ResourcesMaterialFolder=assets/europack/materials/UGM-133A Trident II D5/
ResourcesMaterial=ugm-133a_mat.ini
ResourcesMeshForLaunch=eu_launch_ugm-133a
ResourcesMeshCanister=eu_launch_ugm-133a
ResourcesMeshSwitchTime=0
NumberOfSubModels=0
NumberOfStages=5

// Motor 1. The exported debris also contains the first interstage.
Stage1Mesh=eu_missile_ugm-133a_stage1
Stage1SeparationTime=65
Stage1FlightEffect=effects/weapons/emitters/solidrocket_verylarge/rocketmotor_solid_verylarge_launch.ini
Stage1FlightEffectPosition=0,0,-0.119161
Stage1FlightEffectRotation=0,0,0
Stage1BurnTime=63
Stage1AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
Stage1SeparationEffect=effects/weapons/emitters/usn_rur-5_separation
Stage1SeparationEffectPosition=0,0,-0.016298
Stage1JettisonMesh=eu_missile_ugm-133a_stage1_debris
Stage1JettisonMeshPosition=0,0,0
Stage1JettisonVelocity=0,0,-6
Stage1JettisonAngularVelocity=1,0.5,0
Stage1JettisonLifetime=45

// Motor 2. Exhaust moves to the newly exposed second nozzle.
Stage2Mesh=eu_missile_ugm-133a_stage2
Stage2SeparationTime=130
Stage2FlightEffect=effects/weapons/emitters/solidrocket_verylarge/rocketmotor_solid_verylarge.ini
Stage2FlightEffectPosition=0,0,-0.024784
Stage2FlightEffectRotation=0,0,0
Stage2BurnTime=63
Stage2AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
Stage2SeparationEffect=effects/weapons/emitters/usn_rur-5_separation
Stage2SeparationEffectPosition=0,0,0.020709
Stage2JettisonMesh=eu_missile_ugm-133a_stage2_debris
Stage2JettisonMeshPosition=0,0,0
Stage2JettisonVelocity=0,0,-5
Stage2JettisonAngularVelocity=1,-0.5,0
Stage2JettisonLifetime=45

// Short unpowered upper-stage interval; discard the one-piece shroud and spike.
// Stage3 in this OBJ is the covered upper stage, not a fourth rocket motor.
Stage3Mesh=eu_missile_ugm-133a_stage3
Stage3SeparationTime=132
Stage3BurnTime=0
Stage3SeparationEffect=effects/weapons/emitters/usn_rur-5_separation
Stage3SeparationEffectPosition=0,0,0.031704
Stage3JettisonMesh=eu_missile_ugm-133a_stage3_debris
Stage3JettisonMeshPosition=0,0,0
Stage3JettisonVelocity=4,0,25           // Cosmetic forward/sideways shroud clearance.
Stage3JettisonAngularVelocity=0,0,0
Stage3JettisonLifetime=30

// Motor 3, with the payload section visible around it.
Stage4Mesh=eu_missile_ugm-133a_stage4
Stage4SeparationTime=180
Stage4FlightEffect=effects/weapons/emitters/solidrocket_upperstage/rocketmotor_upperstage_medium.ini
Stage4FlightEffectPosition=0,0,0.017886
Stage4FlightEffectRotation=0,0,0
Stage4BurnTime=46
Stage4AudioClip=audio/weapons/Missile-HighAltitude_MotorLoop_2.wav
Stage4SeparationEffect=effects/weapons/emitters/usn_rur-5_separation
Stage4SeparationEffectPosition=0,0,0.021415
Stage4JettisonMesh=eu_missile_ugm-133a_stage4_debris
Stage4JettisonMeshPosition=0,0,0
Stage4JettisonVelocity=0,0,-3
Stage4JettisonAngularVelocity=0.5,0,0
Stage4JettisonLifetime=45

// Unpowered terminal visual. The exported bus/RVs stay together as one game round.
Stage5Mesh=eu_missile_ugm-133a_stage5
Stage5BurnTime=0
InFlightSound=

[MissileLaunchControl]
Enabled=True
StartAfterWaterExit=True              // Native underwater ascent first; reset clearance/stage clocks at water exit.
Profile=SoftLaunchTurnover
ReplaceInitialFlightPhase=False
ClearanceDistance=15                  // Metres from the observed exit position; clears the aft end before ignition.
EjectionSpeed=35                      // Used for a surface test launch only; submerged exit speed is inherited.
TurnoverAim=FixedPitch //NativeFlightPath
TurnoverPitch=77                      // Near-vertical ignition, then hand over to the native ballistic flight planner.
TurnoverRate=12
TurnoverTolerance=5
TurnoverBraking=False
StopUpwardMotion=True                   // Brake positive world-up velocity near the end of tip-over; False keeps the previous behavior.
UpwardBrakeTime=1.00                     // Seconds to stop ascent; 0 stops immediately; default 0.25, range 0..5.
UpwardBrakeMode=SmoothStep                   // Linear (default), SmoothStep for a soft start/end, or Instant.
IgnitionStage=0
HandoffTime=0.25
MaxControlTime=3
VisualPivot=Auto
DelayStage1EffectsUntilTurnoverComplete=False // SoftLaunchTurnover already holds the motor and its stage effects.
ControlEffects=Auto
Debug=True

[MissileThrustVectorControl]
Enabled=True
FlightPhases=ToBearing,MoveToLoftAlt,MaintainLoftAlt
MaxTurnGBonus=0                       // Visual exhaust deflection; no extra terminal maneuver capability.
MinTurnRate=0.25
ActiveDuration=-1
RequireMotorBurning=True
ControlEffects=Auto
Debug=False

[Maneuver_Motor1]
Type=StageExhaust
Stage=1
Stages=1
EffectIndex=1
MaxDeflectionAngle=4
FullDeflectionRate=3
ResponseTime=0.15

[Maneuver_Motor2]
Type=StageExhaust
Stage=2
Stages=2
EffectIndex=1
MaxDeflectionAngle=4
FullDeflectionRate=3
ResponseTime=0.15

[Maneuver_Motor3]
Type=StageExhaust
Stage=4
Stages=4
EffectIndex=1
MaxDeflectionAngle=4
FullDeflectionRate=3
ResponseTime=0.15

[Particles]
// Clear native motor slots to prevent duplicate plumes or an exhaust at an old nozzle.
BoosterEffect=
BoosterEffectClass=
InFlightEffect=
InFlightEffectClass=
SustainerEffect=
SustainerEffectClass=
