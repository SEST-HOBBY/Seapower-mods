#!extend ammunition/ger_3DDS.ini

# 3DDS: Nulka-ADAP gameplay template with original 3DDS visuals.
# Research and assumptions: ../3DDS-CONFIG.md

[General]
Type=Chaff
TargetType=AAW
IsAirDecoy=True
Mass=0.1
AmmoPoints=0.1
DefaultCameraDistance=0.15
MinCameraDistanceForeAft=0.06
MinCameraDistanceBroadside=0.06
CameraPivotHeight=0.014

[ECM]
SpoofChance=0.95                      // Base chance to spoof missile
DefensiveEffectTime=90
ReactionRange=5

[SensorData]
VisualIdentificationRange=1
IRSignature=Small
RCS=Large

[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_3DDS
ResourcesMaterialFolder=assets/europack/materials/3DDS/
ResourcesMaterial=3DDS_mat.ini
ResourcesMeshForLaunch=eu_launch_3DDS
ResourcesMeshCanister=eu_launch_3DDS
ResourcesMeshSwitchTime=1.5  // time in seconds after launch to switch from launch mesh to main mesh

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07

[Particles]
HitWaterSplashClass=SmallWaterSplashes
DebrisSplashClass=SmallWaterSplashes
# Rotor drone: keep the original 3DDS splash effects, no continuous Nulka rocket plume.

[AirDecoy]
MatchLauncherRCS=True               // One ship-sized RCS for the whole swarm
RollRate=0                         // No Nulka-style body spin
MapSymbol=Missile
BodyAxis=Z                         // Original 3DDS mesh longitudinal axis
ClimbHeight=0                      // No extra loft above the launcher; approach HoverHeight directly
HoverHeight=15                     // Metres ASL; gameplay assumption, not a published 3DDS specification
ClimbSpeed=15
TransitSpeed=10
VerticalSpeed=5
OffsetDistance=150
MaxTiltAngle=20
TiltResponseTime=0.35
LaunchSpeed=20
LaunchDuration=0.2


# Swarm: 10 is the frigate preset; 20 is supported (range 1..32).
# One launched drone consumes one round. Supply enough loaded cells/ammunition.
SalvoCount=10
SalvoInterval=0.5                   // Seconds; retained Euromod assumption, not a published firing rate
SearchPattern=None                 // Hover when the leader arrives
# Optional movement pattern; enable with SearchPattern=CircleSearch.
SearchDelay=2
CircleRadius=50
CircleDegreesPerSecond=10
