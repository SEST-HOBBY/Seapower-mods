#!extend ammunition/usn_rim-174c.ini

[Guidance]
AutoAttackBelowMinAltitude=True
AutoAttackAboveMaxAltitude=False
OptimalTargetDist=80,260

InitialFlightPhaseDuration=2         // time in seconds where the missile moves straight on without guiding

MaxLoftAngle=80.0                      // Climb angle for initial loft

LaunchTurnRate=60                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second

[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_launch_SM-6_Blk1B
ResourcesMaterialFolder=assets/europack/materials/RIM-174_ERAM/
ResourcesMaterial=RIM-174C_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfSubModels=2
SubModel1=ControlFinPair1
SubModel2=ControlFinPair2
ControlSurfaceMaxAngle=20
ControlSurfaceFullDeflectionRate=30
ControlSurfaceResponseTime=0.08

NumberOfStages=2

Stage1Mesh=eu_launch_SM-6_Blk1B
Stage1SeparationTime=8.5
Stage1FlightEffect=effects/weapons/emitters/solidrocket_mk72/rocketmotor_solid_mk72.ini
Stage1FlightEffectPosition=0,0,-0.053
Stage1BurnTime=8.0
Stage1AudioClip=audio/weapons/Missile-Large_MotorLoop.wav
Stage1SeparationEffect=effects/weapons/usn_rur-5_separation
Stage1SeparationEffectPosition=0,0,0
Stage1JettisonMesh=eu_missile_SM-3_Blk2_stage1_debris

Stage2Mesh=eu_missile_SM-6_Blk1B_body
Stage2FlightEffect=effects/weapons/emitters/solidrocket_medium/rocketmotor_solid_medium.ini
Stage2FlightEffectPosition=0,0,-0.0328
Stage2BurnTime=44.0
Stage2AudioClip=audio/weapons/Missile-Medium_MotorLoop.wav

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav

[ControlFinPair1]
Type=None
Mesh=eu_missile_SM-3_Blk2_fin
// Mesh contains two opposite fins; its origin is the centre of their hinge axis.
Position=0,0,-0.030263
Rotation=0,0,0
ControlSurface=True
ControlStages=2

[ControlFinPair2]
Type=None
Mesh=eu_missile_SM-3_Blk2_fin
Position=0,0,-0.030263
Rotation=0,0,-90
ControlSurface=True
ControlStages=2

[MissileLaunchControl]
Enabled=True                           // Enable nose-jet-assisted alignment during the powered launch.
Profile=PoweredTurnover                 // Preserve native motor thrust and the existing stage motor effects during launch.
ReplaceInitialFlightPhase=True          // Replace the native straight-flight delay with clearance and alignment control.
ClearanceDistance=6                     // Metres traveled along the original launch axis before the nose starts turning.
TurnoverAim=NativeFlightPath             // Follow the game's current waypoint/loft steering goal.
TurnoverRate=100                        // Maximum launch-body rotation in degrees/second; matches the inherited launch turn rate.
TurnoverTolerance=3                     // Remaining angular error in degrees that completes launch alignment.
HandoffTime=0.15                        // Seconds of handoff before terminal maneuver authority becomes eligible.
MaxControlTime=3.0                     // Maximum clearance/alignment time before release to native guidance.
VisualPivot=0,0,-0.024401              // Cosmetic pivot at the geometric missile midpoint.
DelayStage1EffectsUntilTurnoverComplete=False // The powered launch keeps its existing motor-effect timing.
ControlEffects=All                      // Reuse the same four nose-jet definitions for launch; this file has no StageExhaust controller.
Debug=False                             // Log jet binding and first emission while checking visibility; set False after tuning.

[Launch_MainMotor]
Type=StageExhaust                       // Add a visual deflection to the Stage mod's existing exhaust anchor.
Stage=1                                // Use the single flying stage.
MaxDeflectionAngle=15                   // Degrees of maximum visible nozzle/plume deflection.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full visual deflection.
ResponseTime=0.06                       // Seconds of visual response smoothing.

[---------- Effects ----------]

[Particles]
InFlightEffect=
BoosterEffect=
BoosterEffectPosition=0,0,-0.012
InFlightEffectClass=
InFlightEffectPosition=0,0,-0.025
InFlightEffectStartTime=1  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=
SustainerEffectPosition=0,0,-0.033
SustainerEffectStartTime=0.2

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion
