#!extend ammunition/usn_rim-174c.ini

[Guidance]
AutoAttackBelowMinAltitude=True
AutoAttackAboveMaxAltitude=False
OptimalTargetDist=80,260

InitialFlightPhaseDuration=2         // time in seconds where the missile moves straight on without guiding

MaxLoftAngle=80.0                      // Climb angle for initial loft

LaunchTurnRate=40                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second

[Models]
