#!extend ammunition/wp_ss-n-26b.ini
// AC features only. Native performance and P-700 resource references are in ammunition/wp_ss-n-26.ini.
// Requires MissileControlMod 0.1.13+ and MultiStageMissiles 1.2.35+ for controlled launches after water exit.
// Timings and jet mounts are visual tuning for the temporary P-700 mesh, not measured Oniks hardware.

[General]
DefaultCameraDistance=0.3
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.14
CameraPivotHeight=0.0

[Guidance]
MidCourseCorrection=4                  // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH), 4 = SATCOM
Retargetable=True

[Models]
ResourcesFolder=assets/europack/materials/SS-N-26/
ResourcesRoot=ss-n-26.obj
ResourcesMesh=eu_missile_ss-n-26
ResourcesMaterialFolder=assets/europack/materials/SS-N-26/
ResourcesMaterial=SS-N-26_mat.ini
ResourcesMeshForLaunch=eu_launch_ss-n-26
ResourcesMeshCanister=eu_capsule_ss-n-26
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh

ResourcesMeshSwitchTime=0.5                                                             // Explicit native mesh-switch time; a blank value would fall back to 1 second.
NumberOfSubModels=0                                                                  
NumberOfStages=4                                                    

Stage1Mesh=eu_launch_ss-n-26                                                                  
Stage1SeparationTime=0.7                                                                // Seconds since launch for the visual booster-to-sustainer transition.                                
Stage1FlightEffect=effects/weapons/emitters/solidrocket_large/rocketmotor_solid_large_boost.ini      // AC booster plume.                                                                        
Stage1FlightEffectPosition=0,0,-0.072                                                   // Tail position matching the temporary P-700 mesh.                                                      
Stage1BurnTime=0.7                                                                        // Seconds of booster emission; it remains active throughout the short tip-over.                         
Stage1AudioClip=audio/weapons/Missile-Large_LaunchPlusMotorLoop_SSM.wav                          // Booster motor audio owned by this stage.                                                          
Stage1FlightEffect2=effects/weapons/emitters/thrusters/oniks_stage1_side_thrusters_double.ini                // One composite effect for both nozzles and both pulses.
Stage1FlightEffect2StartDelay=0.35                                                         // Seconds after Stage 2 starts; currently 0.5 seconds after launch.
Stage1BurnTime2=0.40 // Safety cutoff; children emit at 0.00-0.12 and 0.24-0.36 seconds, then smoke fades naturally.
Stage1FlightEffect2ContinuousChildren=True                                              // Preserve child mounts, rotations, durations and start delays.

Stage2Mesh=eu_missile_ss-n-26_stage1                                                   
Stage2SeparationTime=1.7                                                                // Seconds since launch for the visual booster-to-sustainer transition.
Stage2FlightEffect=effects/weapons/emitters/solidrocket_large/rocketmotor_solid_large_boost.ini      // AC booster plume.
Stage2FlightEffectPosition=0,0,-0.072                                                   // Tail position matching the temporary P-700 mesh.
Stage2BurnTime=4                                                                        // Seconds of booster emission; it remains active throughout the short tip-over.
Stage2AudioClip=audio/weapons/Missile-Large_LaunchPlusMotorLoop_SSM.wav                          // Booster motor audio owned by this stage.
Stage2JettisonMesh=eu_missile_ss-n-26_stage1_debris                                     // No separate nose cover is configured for the temporary P-700 model.
Stage2JettisonVelocity=0,-35,80                                                          // Additional local velocity in m/s; +Z forward, -Z backward.
Stage2JettisonAngularVelocity=0,0,0                                                     // Local rotation in degrees/second; zero disables tumble.
Stage2JettisonLifetime=15                                                               // Debris lifetime in simulation seconds.
Stage2JettisonEffect=effects/weapons/emitters/thrusters/oniks_stage1_debris_thrusters.ini // Two Large Thruster jets mounted on the discarded nose-cover nozzles
Stage2JettisonEffectContinuousChildren=True                                             // Keep both nozzle mounts and directions attached to the moving debris
Stage2JettisonEffectDuration=0.5                                                        // Emission cutoff after release; -1 = no extra cutoff.
Stage2JettisonAudioClip=audio/weapons/Missile-Booster_FlyAway_Oniks.wav                       // Optional one-shot audio resource attached to the discarded mesh
Stage2JettisonAudioVolume=1                                                             // Volume from 0 to 1; sound ends naturally or when debris expires
Stage2JettisonAudioDebug=True                                                                       // Log cap sound playback, listener distance and source state; set False after verification.



Stage3Mesh=eu_missile_ss-n-26_stage2                                                    
Stage3SeparationTime=10                                                                  // Seconds since launch for the visual booster-to-sustainer transition.
Stage3FlightEffect=effects/weapons/emitters/solidrocket_large/rocketmotor_solid_large_boost.ini      // AC booster plume.
Stage3FlightEffectPosition=0,0,-0.072                                                   // Existing P-700 sustainer mount.
Stage3BurnTime=10                                                                       // Seconds of booster emission; it remains active throughout the short tip-over.
Stage3AudioClip=audio/weapons/Missile-Large_MotorLoop_SSM.wav                               // Booster motor audio owned by this stage.
Stage3JettisonMesh=eu_missile_ss-n-26_stage2_debris                                                                         // No separate nose cover is configured for the temporary P-700 model.
Stage3JettisonVelocity=0,-5,-20                                                          // Additional local velocity in m/s; +Z forward, -Z backward.
;Stage3JettisonAudioClip= // Optional one-shot audio resource attached to the discarded mesh
;Stage3JettisonAudioVolume=1 // Volume from 0 to 1; sound ends naturally or when debris expires

// Stage2BurnTime is omitted: keep sustainer emission until the flying missile is removed.


Stage4Mesh=eu_missile_ss-n-26                                                                
Stage4FlightEffect=effects/weapons/emitters/ramjet_large/ramjet_large.ini
Stage4FlightEffectPosition=0,0,-0.0382

InFlightSound=audio/environment/Missile-InFlight_WindLoop.wav                      // Separate flight noise shared by both stages.


[MissileLaunchControl]
StartAfterWaterExit=True                // Keep native underwater ascent; start clearance and the stage clock at water exit. False retains native launch.
ThrusterAudioClip= //audio/weapons/Missile-Large_MotorLoop.wav // Optional audio resource for control-thruster pulses; empty disables sound
ThrusterAudioVolume=1 // Volume from 0 to 1; simultaneous control jets share one sound
Enabled=True                           // Enable the short AC launch controller for this ammunition.
Profile=BoostedTurnover                 // Keep native motor thrust while the body tips over and movement retains inertia.
ReplaceInitialFlightPhase=True          // Replace the native initial straight-flight delay; retain normal launch cleanup.
ClearanceDistance=35                     // Metres along the original launch axis before tip-over starts; not altitude above sea level.
TurnoverAim=FixedPitch                  // Use an explicit launch pitch; the native initial loft goal can remain almost vertical.
TurnoverPitch=0                       // Degrees above the horizon after tip-over; native bearing is retained and normal guidance resumes afterwards.
TurnoverRate=150                        // Maximum body turn rate in degrees/second during launch.
TurnoverTolerance=3                     // Remaining alignment error in degrees that completes tip-over.
TurnoverBraking=True                    // Briefly select opposing control jets as alignment is reached.
TurnoverBrakeAngle=15                   // Maximum remaining angle in degrees at which braking may start.
TurnoverBrakeDuration=0.10              // Maximum braking duration in simulation seconds.
StopUpwardMotion=True                   // Brake positive world-up velocity near the end of tip-over; False keeps the previous behavior.
UpwardBrakeTime=0.25                     // Seconds to stop ascent; 0 stops immediately; default 0.25, range 0..5.
UpwardBrakeMode=SmoothStep                   // Linear (default), SmoothStep for a soft start/end, or Instant.
IgnitionStage=3                         // Hold Stage 3 until tip-over and braking finish; 0 disables the stage gate.
HandoffTime=0.10                        // Seconds blending retained launch momentum into native nose-aligned flight.
MaxControlTime=6                        // Launch-controller timeout in seconds; normal guidance takes over afterwards.
VisualPivot=Auto                        // Use the geometric body centre for cosmetic rotation compensation.
DelayStage1EffectsUntilTurnoverComplete=False // Required for BoostedTurnover; Stage 1 emits during clearance and tip-over.
ControlEffects=Auto                     // Select only sections whose names begin with Launch_.
Debug=True                             // Log clearance, actual first steering, effect binding and first jet emission during verification.


[Launch_MainMotor]
Type=StageExhaust                       // Add a visual deflection to the Stage mod's existing exhaust anchor.
Stage=2                                // Use the single flying stage.
MaxDeflectionAngle=30                   // Degrees of maximum visible nozzle/plume deflection.
FullDeflectionRate=30                   // Body turn rate in degrees/second for full visual deflection.
ResponseTime=0.06                       // Seconds of visual response smoothing.

[Launch_NoseTop]
Type=Thruster                          // Upper nose-side control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_large.ini // Local +Z before Rotation.
Position=0,0.0052,0.050                 // Approximate upper mount in missile-local mesh units.
Rotation=-90,0,0                       // Exhaust toward +Y; reaction toward -Y.
FullDeflectionRate=100                  // Body turn rate in degrees/second for full emission.
ResponseTime=0.005                      // Emission response time in seconds.

[Launch_NoseBottom]
Type=Thruster                          // Lower nose-side control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_large.ini // Local +Z before Rotation.
Position=0,-0.0052,0.050                // Approximate lower mount in missile-local mesh units.
Rotation=90,0,0                        // Exhaust toward -Y; reaction toward +Y.
FullDeflectionRate=100                  // Body turn rate in degrees/second for full emission.
ResponseTime=0.005                      // Emission response time in seconds.

[MissileThrustVectorControl]
Enabled=False                          // Launch jets only; normal flight uses native guidance without an added terminal G bonus.
FlightPhases=TerminalApproach          // Optional future maneuver phase if Enabled is changed to True.
MaxTurnGBonus=0                        // Extra native turn authority in G; zero keeps the baseline turn limit.
MinTurnRate=3                          // Minimum pitch/yaw turn rate in degrees/second for optional maneuver jet emission.
ActiveDuration=-1                      // -1 adds no time limit; nonnegative values are seconds from first eligible phase.
RequireMotorBurning=True               // Optional maneuver effects/bonus require a burning motor.
ControlEffects=Auto                    // Select Maneuver_ sections only; none are configured in this initial version.

[Particles]
BoosterEffect=                         // Clear the inherited stock booster; Stage 1 supplies its own plume.
BoosterEffectClass=                    // Clear class-based fallback as well.
InFlightEffect=                        // Clear the inherited stock sustainer; Stage 2 supplies its own effect.
InFlightEffectClass=                   // Clear class-based fallback to avoid duplicate exhaust.
