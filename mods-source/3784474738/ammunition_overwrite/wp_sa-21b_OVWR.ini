#!extend ammunition/wp_sa-21b.ini,ammunition/rfn_40n6.ini,ammunition/wp_40n6.ini,ammunition/wp_40h6e.ini
# 40N6 - S-400 Triumf
# Fin, jet-vane and Stage1 effect positions copied from wp_sa-n-20_OVWR.ini.

[Guidance]
MaxTurnRate=20                        // Maximum turnrate in degrees per second
MaxTurnG=25                           // Maximum G-limit of missile turns
OptimalTargetDist=80,216 // Preferred range in nautical miles
AutoAttackAboveMaxAltitude=False

[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj,CORRECT_OBJ_ORIENTATION
ResourcesMesh=eu_missile_sa-n-21b_body
ResourcesMaterialFolder=assets/europack/materials/SA-N-20/
ResourcesMaterial=SA-N-20_Blue_Tip_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=0.1  // time in seconds after launch to switch from launch mesh to main mesh

NumberOfSubModels=4
SubModel1=ControlFinPair1
SubModel2=ControlFinPair2
SubModel3=JetVanePair1
SubModel4=JetVanePair2
ControlSurfaceMaxAngle=20
ControlSurfaceFullDeflectionRate=30
ControlSurfaceResponseTime=0.08

NumberOfStages=1
UseBaseGameThrust=False

Stage1Mesh=eu_missile_sa-n-21b_body
Stage1Acceleration=15.5 // Original SustainerAcceleration
Stage1BurnTime=20 // Original SustainerAccelerationTime
Stage1BurnTimeDelay=0
Stage1FlightEffect=effects/weapons/emitters/solidrocket_large/rocketmotor_solid_large_boost.ini
Stage1FlightEffectPosition=0,0,-0.039
Stage1AudioClip=audio/weapons/Missile-Medium_MotorLoop.wav

InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav

[ControlFinPair1]
Type=None
Mesh=eu_missile_sa-n-20_fin
Position=0,0,-0.038093
Rotation=0,0,-45
ControlSurface=True
ControlStages=1

[ControlFinPair2]
Type=None
Mesh=eu_missile_sa-n-20_fin
Position=0,0,-0.038093
Rotation=0,0,45
ControlSurface=True
ControlStages=1

[JetVanePair1]
Type=None
Mesh=eu_missile_sa-n-20c_jet_vane
Position=0,0,-0.042306
Rotation=0,0,-45
ControlSurface=True
ControlStages=1

[JetVanePair2]
Type=None
Mesh=eu_missile_sa-n-20c_jet_vane
Position=0,0,-0.042306
Rotation=0,0,45
ControlSurface=True
ControlStages=1

[MissileLaunchControl]
Enabled=True
Profile=PoweredTurnover // Same ejection + powered turnover as the 48N6 reference
EjectBeforeTurnover=True
EjectionSpeed=25
ClearanceDistance=20
ReplaceInitialFlightPhase=True
TurnoverAim=NativeFlightPath
TurnoverRate=100
TurnoverTolerance=3
HandoffTime=0.2
MaxControlTime=2
VisualPivot=Auto // Set explicitly if needed after positioning the model
DelayStage1EffectsUntilTurnoverComplete=False
ControlEffects=Auto
Debug=False

[MissileThrustVectorControl]
Enabled=False                           // Enable the optional maneuver controller for this ammunition.
FlightPhases=TerminalApproach           // Native flight phases in which the additional control authority is available.
MaxTurnGBonus=0                        // Extra lateral acceleration in G; also raises the corresponding angular-rate limit.
MinTurnRate=5                          // TVC effects start at 3 deg/s of combined pitch/yaw; stop below 80% of this rate. 0 = no threshold. Does not limit launch effects or G bonus.
ActiveDuration=-1                     // Seconds from first eligible phase entry; the timer never resets on phase re-entry. -1 = unlimited.
RequireMotorBurning=True               // False allows independent attitude-control jets after main-motor burnout.
ControlEffects=All                     // Auto selects Maneuver_ effect sections; All selects all control-effect sections.
Debug=False                             // Log terminal authority, jet binding and first emission for visibility checks.


[Launch_MainMotor]
Type=StageExhaust
Stage=1
MaxDeflectionAngle=15
FullDeflectionRate=30
ResponseTime=0.06

[Particles]
BoosterEffect=
BoosterEffectClass=
InFlightEffect=
InFlightEffectClass=
SustainerEffect=
SustainerEffectClass=

