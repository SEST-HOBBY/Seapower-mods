#!extend ammunition/wp_ss-n-26_10kt.ini
// AC features only. Native performance and P-700 resource references are in ammunition/wp_ss-n-26.ini.
// Requires MissileControlMod 0.1.13+ and MultiStageMissiles 1.2.35+ for controlled launches after water exit.
// Timings and jet mounts are visual tuning for the temporary P-700 mesh, not measured Oniks hardware.

[Models]
Stage1JettisonAudioClip= // Optional one-shot audio resource attached to the discarded mesh
Stage1JettisonAudioVolume=1 // Volume from 0 to 1; sound ends naturally or when debris expires
ResourcesMeshSwitchTime=0.5             // Explicit native mesh-switch time; a blank value would fall back to 1 second.
NumberOfSubModels=0                    // Suppress the stock afterburner mesh; MultiStageMissiles owns both motor visuals.
NumberOfStages=2                       // Booster visual followed by ramjet sustainer; both temporarily use the same P-700 body.

Stage1Mesh=wp_ss-n-19                   // Existing P-700 body from the base file's ResourcesRoot.
Stage1MeshPosition=0,0,0                // Missile-local mesh units.
Stage1MeshRotation=0,0,0                // Missile-local Euler degrees.
Stage1SeparationTime=4                  // Seconds since launch for the visual booster-to-sustainer transition.
Stage1FlightEffect=effects/weapons/emitters/solidrocket_mediumlarge/rocketmotor_solid_medium_boost.ini // AC booster plume.
Stage1FlightEffectPosition=0,0,-0.072   // Tail position matching the temporary P-700 mesh.
Stage1FlightEffectRotation=0,0,0        // Preserve the motor resource's authored rearward direction.
Stage1BurnTime=4                       // Seconds of booster emission; it remains active throughout the short tip-over.
Stage1AudioClip=audio/weapons/Missile-Large_MotorLoop.wav // Booster motor audio owned by this stage.
Stage1JettisonMesh=                    // No separate nose cover is configured for the temporary P-700 model.

// Simultaneous side jets: independent of steering demand, timed from launch in Stage 1.
Stage1FlightEffect2=effects/weapons/emitters/thrusters/control_thruster_large.ini // Large right-side jet with dark smoke.
Stage1FlightEffect2Position=0.0052,0,0.050 // Right nose-side mount on the temporary P-700 model.
Stage1FlightEffect2Rotation=0,90,0       // Local +Z exhaust rotated toward missile-local +X.
Stage1FlightEffect2StartDelay=1         // Simulation seconds after launch; native mesh-switch time is not added.
Stage1BurnTime2=0.35                    // Emission duration after this slot starts; stage separation still stops it.
Stage1FlightEffect2ContinuousChildren=True // Drive the private flame/glow/smoke children directly to preserve sideward orientation.
Stage1FlightEffect3=effects/weapons/emitters/thrusters/control_thruster_large.ini // Matching left-side jet, scheduled simultaneously.
Stage1FlightEffect3Position=-0.0052,0,0.050 // Left nose-side mount.
Stage1FlightEffect3Rotation=0,-90,0      // Exhaust toward missile-local -X.
Stage1FlightEffect3StartDelay=1         // Same launch-relative deadline as the right-side jet.
Stage1BurnTime3=0.35                    // Seconds of emission; remaining smoke particles finish their own lifetime.
Stage1FlightEffect3ContinuousChildren=True // Preserve the configured sideward direction of every child emitter.

Stage2Mesh=wp_ss-n-19                   // Same P-700 body until a dedicated Oniks model is available.
Stage2MeshPosition=0,0,0                // Preserve the body position across the stage transition.
Stage2MeshRotation=0,0,0                // Preserve the body orientation across the stage transition.
Stage2FlightEffect=effects/weapons/emitters/turbojet_sustainer // Stock sustainer effect as a temporary ramjet visual.
Stage2FlightEffectPosition=0,0,-0.072   // Existing P-700 sustainer mount.
Stage2FlightEffectRotation=0,0,0        // Preserve the resource's authored direction.
// Stage2BurnTime is omitted: keep sustainer emission until the flying missile is removed.
InFlightSound=audio/environment/Missile-InFlight_WindOnly_Loop.wav // Separate flight noise shared by both stages.

[MissileLaunchControl]
StartAfterWaterExit=True                // Keep native underwater ascent; start clearance and the stage clock at water exit. False retains native launch.
ThrusterAudioClip= // Optional audio resource for control-thruster pulses; empty disables sound
ThrusterAudioVolume=1 // Volume from 0 to 1; simultaneous control jets share one sound
Enabled=True                           // Enable the short AC launch controller for this ammunition.
Profile=BoostedTurnover                 // Keep native motor thrust while the body tips over and movement retains inertia.
ReplaceInitialFlightPhase=True          // Replace the native initial straight-flight delay; retain normal launch cleanup.
ClearanceDistance=3                     // Metres along the original launch axis before tip-over starts; not altitude above sea level.
TurnoverAim=FixedPitch                  // Use an explicit launch pitch; the native initial loft goal can remain almost vertical.
TurnoverPitch=15                       // Degrees above the horizon after tip-over; native bearing is retained and normal guidance resumes afterwards.
TurnoverRate=150                        // Maximum body turn rate in degrees/second during launch.
TurnoverTolerance=3                     // Remaining alignment error in degrees that completes tip-over.
TurnoverBraking=True                    // Briefly select opposing control jets as alignment is reached.
TurnoverBrakeAngle=15                   // Maximum remaining angle in degrees at which braking may start.
TurnoverBrakeDuration=0.10              // Maximum braking duration in simulation seconds.
HandoffTime=0.20                        // Seconds blending retained launch momentum into native nose-aligned flight.
MaxControlTime=3                        // Launch-controller timeout in seconds; normal guidance takes over afterwards.
VisualPivot=Auto                        // Use the geometric body centre for cosmetic rotation compensation.
DelayStage1EffectsUntilTurnoverComplete=False // Required for BoostedTurnover; Stage 1 emits during clearance and tip-over.
ControlEffects=Auto                     // Select only sections whose names begin with Launch_.
Debug=True                             // Log clearance, actual first steering, effect binding and first jet emission during verification.

[Launch_MainMotor]
Type=StageExhaust                       // Deflect the existing Stage-1 plume without creating a second motor effect.
Stage=1                                // Booster stage only.
EffectIndex=1                          // First motor-effect slot; also the default when omitted.
MaxDeflectionAngle=15                   // Maximum cosmetic plume deflection in degrees.
FullDeflectionRate=150                  // Body turn rate in degrees/second for full plume deflection.
ResponseTime=0.04                       // Visual response time in seconds.

[Launch_NoseRight]
Type=Thruster                          // Temporary nose-side control jet on the P-700 placeholder mesh.
Effect=effects/weapons/emitters/thrusters/control_thruster_large.ini // Effect emits along local +Z before Rotation.
Position=0.0052,0,0.050                 // Approximate right-side mount in missile-local mesh units; retune for an Oniks model.
Rotation=0,90,0                        // Exhaust toward +X; reaction toward -X.
FullDeflectionRate=150                  // Body turn rate in degrees/second for full emission.
ResponseTime=0.025                      // Emission response time in seconds.

[Launch_NoseLeft]
Type=Thruster                          // Opposite nose-side control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_large.ini // Local +Z before Rotation.
Position=-0.0052,0,0.050                // Approximate left-side mount in missile-local mesh units.
Rotation=0,-90,0                       // Exhaust toward -X; reaction toward +X.
FullDeflectionRate=150                  // Body turn rate in degrees/second for full emission.
ResponseTime=0.025                      // Emission response time in seconds.

[Launch_NoseTop]
Type=Thruster                          // Upper nose-side control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_large.ini // Local +Z before Rotation.
Position=0,0.0052,0.050                 // Approximate upper mount in missile-local mesh units.
Rotation=-90,0,0                       // Exhaust toward +Y; reaction toward -Y.
FullDeflectionRate=150                  // Body turn rate in degrees/second for full emission.
ResponseTime=0.025                      // Emission response time in seconds.

[Launch_NoseBottom]
Type=Thruster                          // Lower nose-side control jet.
Effect=effects/weapons/emitters/thrusters/control_thruster_large.ini // Local +Z before Rotation.
Position=0,-0.0052,0.050                // Approximate lower mount in missile-local mesh units.
Rotation=90,0,0                        // Exhaust toward -Y; reaction toward +Y.
FullDeflectionRate=150                  // Body turn rate in degrees/second for full emission.
ResponseTime=0.025                      // Emission response time in seconds.

[MissileThrustVectorControl]
Enabled=False                          // Launch jets only; normal flight uses native guidance without an added terminal G bonus.
FlightPhases=TerminalApproach          // Optional future maneuver phase if Enabled is changed to True.
MaxTurnGBonus=0                        // Extra native turn authority in G; zero keeps the baseline turn limit.
MinTurnRate=3                          // Minimum pitch/yaw turn rate in degrees/second for optional maneuver jet emission.
ActiveDuration=-1                      // -1 adds no time limit; nonnegative values are seconds from first eligible phase.
RequireMotorBurning=True               // Optional maneuver effects/bonus require a burning motor.
ControlEffects=Auto                    // Select Maneuver_ sections only; none are configured in this initial version.

[Particles]
BoosterEffect=                         // Clear the inherited stock booster; Stage 1 supplies its own plume.
BoosterEffectClass=                    // Clear class-based fallback as well.
InFlightEffect=                        // Clear the inherited stock sustainer; Stage 2 supplies its own effect.
InFlightEffectClass=                   // Clear class-based fallback to avoid duplicate exhaust.
