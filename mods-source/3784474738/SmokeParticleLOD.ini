; SmokeParticleLOD 0.4.0 - native and mod particles; reloads within two seconds.
[Global]
Enabled=True
DiscoveryIntervalSeconds=1
; Particle inspections only: smoke keeps emitting and aging outside all camera views.
OffscreenSmokeIntervalSeconds=1
ProtectSingleParticles=True
ProtectSubEmitters=True
Exclude=

[Defaults]
FullQualityPixels=24
MinimumQualityPixels=4
MinimumFraction=0.4
MinimumParticles=8
UpdateIntervalSeconds=0.2
FadeSeconds=0.8
ProtectYoungSeconds=0.5

[Smoke]
MinimumParticles=6
MinimumFraction=0.3
MinimumQualityPixels=6
FullQualityPixels=32
Enabled=True

[Dust]
Enabled=True

[Bubbles]
Enabled=True

[Sparks]
Enabled=True
MinimumFraction=0.65
MinimumParticles=12

[Debris]
Enabled=True
MinimumFraction=0.65
MinimumParticles=12

[Flame]
Enabled=False

[Flash]
Enabled=False

; Unrecognized names/materials. Enable to include these too.
[Other]
Enabled=False

; Optional overrides. Last matching rule wins.
; Match: comma-separated patterns; * = any text, ? = one character.
; Compares resource/INI path, hierarchy, emitter name and material names.
;[Rule:OniksSmoke]
;Match=*ramjet_large*smoke*
;Category=Smoke
;MinimumFraction=0.6

;[Rule:KeepOneEffect]
;Match=*nuclear_500kt*
;Enabled=False

; Extreme smoke test: uncomment the entire block.
;[Rule:SmokeStressTest]
;Match=*smoke*,*puff*
;Category=Smoke
;Enabled=True
;FullQualityPixels=10000
;MinimumQualityPixels=9999
;MinimumFraction=0.1
;MinimumParticles=8
;ProtectYoungSeconds=0
;FadeSeconds=0.4

; Stronger distant diffuse-smoke thinning; the general Smoke profile also reduces distant nozzle smoke.
[Rule:DiffuseSmokeConservative]
MinimumParticles=6
MinimumFraction=0.25
MinimumQualityPixels=6
Match=*smoke_diffuse*
FullQualityPixels=36
UpdateIntervalSeconds=0.25
FadeSeconds=1.0

; Local missile flames: freeze first, then use one larger glow for the whole flame group.
; Pixel thresholds use the projected bounds of the complete flame, including camera zoom.
[FlameLOD]
Enabled=True
; Pause eligible local flames outside camera views; retain particles for re-entry.
PauseOffscreen=True
FreezeBelowPixels=18
ResumeAbovePixels=26
ProxyBelowPixels=5
ProxyAbovePixels=8
CheckIntervalSeconds=0.2
WarmupSeconds=0.5
ProxySizeMultiplier=1
Match=*effects/weapons/emitters/*/exhaust_*.ini,*sam_*effect*,*aam_*effect*,*asm_*effect*,*rocket*effect*,*missile*effect*
