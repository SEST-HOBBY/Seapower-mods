; SmokeParticleLOD 0.2.0 - native and mod particles; reloads within two seconds.
[Global]
Enabled=True
DiscoveryIntervalSeconds=1
ProtectSingleParticles=True
ProtectSubEmitters=True
Exclude=

[Defaults]
FullQualityPixels=24
MinimumQualityPixels=4
MinimumFraction=0.4
MinimumParticles=8
UpdateIntervalSeconds=0.2
FadeSeconds=0.8
ProtectYoungSeconds=0.5

[Smoke]
Enabled=True

[Dust]
Enabled=True

[Bubbles]
Enabled=True

[Sparks]
Enabled=True
MinimumFraction=0.65
MinimumParticles=12

[Debris]
Enabled=True
MinimumFraction=0.65
MinimumParticles=12

[Flame]
Enabled=False

[Flash]
Enabled=False

; Unrecognized names/materials. Enable to include these too.
[Other]
Enabled=False

; Optional overrides. Last matching rule wins.
; Match: comma-separated patterns; * = any text, ? = one character.
; Compares resource/INI path, hierarchy, emitter name and material names.
;[Rule:OniksSmoke]
;Match=*ramjet_large*smoke*
;Category=Smoke
;MinimumFraction=0.6

;[Rule:KeepOneEffect]
;Match=*nuclear_500kt*
;Enabled=False

; Extreme smoke test: uncomment the entire block.
;[Rule:SmokeStressTest]
;Match=*smoke*,*puff*
;Category=Smoke
;Enabled=True
;FullQualityPixels=10000
;MinimumQualityPixels=9999
;MinimumFraction=0.1
;MinimumParticles=8
;ProtectYoungSeconds=0
;FadeSeconds=0.4
