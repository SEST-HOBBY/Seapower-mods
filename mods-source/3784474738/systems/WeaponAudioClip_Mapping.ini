// Section name: exact WeaponSystem name (SystemName), as with sonar-system mappings.
// WeaponAudioClip is required for an active section. WAV must be uncompressed PCM16.
// Missing sections keep Sea Power's original firing-effect sound unchanged.
// A missing or invalid mapped WAV also keeps the original sound as a fail-safe.
// Empty, None, Disabled, or Off suppresses the original sound without a replacement.
// Optional values inherit from the original firing-effect AudioSource when omitted.
// CIWS overrides loop while the CIWS is firing; gun and launcher overrides are one-shots.

[eu_goalkeeper]
WeaponAudioClip=audio/weapons/Gun-Goalkeeper.wav
WeaponAudioPosition=0,0,0
WeaponAudioRollOff=Logarithmic
WeaponAudioDistance=1,10
WeaponAudioVolume=1.2
WeaponAudioAudibility=Above    // AboveAndBelow

