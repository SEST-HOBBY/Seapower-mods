# Section name: ammunition INI filename without the .ini extension.
# This file handles both Type=Noisemaker and Type=MOSS/decoy ammunition.
# NoisemakerAudioClip is required for every active section. WAV must be PCM16.
# Optional values fall back to the corresponding ammunition/source settings.
# Empty, None, Disabled, or Off explicitly disables the mapped sound.

[ger_C303S_MTE]
NoisemakerAudioClip=audio/weapons/Noisemaker-C303S-MTE.wav
NoisemakerAudioPosition=0,0,0     
NoisemakerAudioRollOff=Logarithmic
NoisemakerAudioDistance=1,20      
NoisemakerAudioPitch=1            
NoisemakerAudioVolume=1           
NoisemakerAudioAudibility=Below   

