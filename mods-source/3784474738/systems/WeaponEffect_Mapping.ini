;LauncherContainerEffectPosition=0,0,0
;LauncherContainerEffectRotation=-90,0,0 // Emit upward from the firing container.
;LauncherContainerEffectScale=1,1,1

LauncherContainerEffect2=effects/weapons/emitters/coldlaunch_sa_n9/vent_cloud.ini
LauncherContainerEffect2Position=0,0,0
LauncherContainerEffect2Rotation=-90,0,0 // Apply the same upward axis to the wider cloud.
