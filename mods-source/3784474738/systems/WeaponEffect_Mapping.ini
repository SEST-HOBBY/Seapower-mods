// Weapon launcher effect mappings. Section names are exact SystemName values
// from systems/weapons.ini. Remove the leading // to activate an example.
//
// Reference frames:
// LauncherEffect                 = weapon system ContainerBase
// LauncherContainerEffect        = firing WeaponContainer
// LauncherAttachementEffect      = fired AttachmentPosition inside that container
//
// Up to 16 effects are supported per reference frame. Slot 1 has no number;
// additional slots use Effect2, Effect3, etc. Effect1 is also accepted.
// Every shot receives a fresh private effect clone and can overlap other shots.
// Position, Rotation, and Scale are optional.

[eu_mk41]
LauncherEffect=effects/weapons/emitters/mk41/FireEmitter_mk41_2.ini
LauncherEffectPosition=0,0,0
LauncherEffectRotation=0,0,0
LauncherEffectScale=1,1,1
LauncherEffect2=effects/weapons/emitters/mk41/smoke_mk41.ini
LauncherEffect2Position=0,0,0
LauncherEffect2Rotation=0,0,0
LauncherEffect2Scale=1,1,1
LauncherContainerEffect= //effects/weapons/emitters/mk41/smoke_mk41_ring.ini
LauncherContainerEffectPosition=0,0.065,0.065
LauncherContainerEffectRotation=0,0,0
LauncherContainerEffectScale=0,0,0

[eu_mk41_quad]
LauncherEffect=effects/weapons/emitters/mk41/FireEmitter_mk41_2.ini
LauncherEffectPosition=0,0,0
LauncherEffectRotation=0,0,0
LauncherEffectScale=1,1,1
LauncherEffect2=effects/weapons/emitters/mk41/smoke_mk41.ini
LauncherEffect2Position=0,0,0
LauncherEffect2Rotation=0,0,0
LauncherEffect2Scale=1,1,1
LauncherAttachementEffect= //effects/weapons/emitters/mk41/smoke_mk41_ring.ini
LauncherAttachementEffectPosition=0,0.065,0.065
LauncherAttachementEffectRotation=0,0,0
LauncherAttachementEffectScale=0.7,0.7,0.7

