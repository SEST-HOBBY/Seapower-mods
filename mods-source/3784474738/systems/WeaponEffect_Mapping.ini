// Muzzle-effect replacements via WeaponLauncherEffects 1.0.20 or newer.
// Effect selects the full muzzle effect for each actual gun shot.
// Replace only the native effect resource; retain the original muzzle placement.
// Full effects include flash, smoke and one case. Do not play both effects.
// Sounds are assigned separately in WeaponAudioClip_Mapping.ini.
// Case deck bounce is supplied by the DLL; gun, barrel and magazine colliders are excluded.

