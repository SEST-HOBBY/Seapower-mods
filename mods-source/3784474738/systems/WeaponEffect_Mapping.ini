;LauncherContainerEffect3=effects/weapons/emitters/coldlaunch_sa_n9/debris.ini
;LauncherContainerEffect3Position=0,0,0
;LauncherContainerEffect3Rotation=-90,0,0 // Eject upward; the authored local -Z force then pulls downward.
