// AUDIO PART SWITCHES - change True/False, then fully restart Sea Power.
// FlightAudio.Missiles: custom missile motor sounds.
// FlightAudio.Jets: custom aircraft jet motor sounds.
// SonicBoom.Enabled: sonic booms for missiles AND aircraft (currently OFF).
// MissileExplosion.Enabled: custom missile explosion audio.
// Rocket near launch:0.42s transition from the supplied base-game launch effect.
// Alarms and sonar can be switched independently in the AC Pack mod menu.
// Keep FlightAudio.Enabled=True to use this engine; use Missiles/Jets for part switches.

[FlightAudio]
Enabled=True
Missiles=True
Jets=True
DiagnosticLogging=True
SampleIntervalSeconds=0.10
SmoothingSeconds=0.15
StartSmoothingSeconds=0.01
MaxTrackedSources=256
MaxHistorySegments=1024
MaxMotorVoices=12
CameraJumpMetres=1000

[SonicBoom]
Enabled=False
MaxVoices=4
MixHeadroom=0.80
SmoothingSeconds=0.03

[MissileExplosion]
Enabled=True
UsePowerBasedClips=True
MediumMinPower=20
LargeMinPower=50
VeryLargeMinPower=80
MaxVoices=8
MixHeadroom=0.80
FadeInStartMetres=50
FullLevelMetres=250
HalfLevelMetres=6000
MaxDistanceMetres=24000
Volume=0.90
PropagationDelay=True

// MOTOR AND EFFECT PROFILES
// Rocket near sound uses the normalized large motor loop; native jet and far profiles remain.

[Motor.Rocket]
Enabled=True
IgnitionAudioClip=audio/weapons/Missile_Rocket_Launch.wav
IgnitionCrossfadeSeconds=0.42
IgnitionGain=1.0
IgnitionNearOnly=True
NearAudioClip=audio/weapons/Missile_Rocket_MotorLoop.wav
OverrideNativeNearClip=True
AudioClip=audio/weapons/Missile_Distant_Rumble_Loop.wav
AlternateAudioClip=audio/weapons/Missile_Distant_Rumble_Loop_B.wav
UseNativeASMClips=True
Volume=0.65
// NearGain fades back to 1 between BlendStartMetres and BlendEndMetres.
NearGain=1.50
HalfLevelMetres=2500
MaxDistanceMetres=20000
BlendStartMetres=300
BlendEndMetres=1200
NearLowpassHz=10000
FarLowpassHz=650
FilterDistanceMetres=5000
ForwardGain=0.65
ReferenceMassFlowKgPerSecond=25
Strength=1.0

[Motor.Jet]
Enabled=True
NearAudioClip=audio/weapons/turbojet_sustainer
OverrideNativeNearClip=False
UseNativeASMClips=True
Volume=0.45
NearGain=1.0
HalfLevelMetres=400
MaxDistanceMetres=3500
BlendStartMetres=300
BlendEndMetres=1200
NearLowpassHz=10000
FarLowpassHz=650
FilterDistanceMetres=1400
ForwardGain=0.65
Strength=1.0

// Uses each aircraft's own loaded engine, far and afterburner clips.

[Motor.AircraftJet]
Enabled=True
Volume=0.65
HalfLevelMetres=3500
MaxDistanceMetres=30000
BlendStartMetres=300
BlendEndMetres=1200
NearLowpassHz=10000
FarLowpassHz=650
FilterDistanceMetres=5000
ForwardGain=0.65
Strength=1.0

// Optional overrides: [Motor.Unit.exact_ini_stem], then .Stage1, .Stage2, ...
// Inherit all unspecified settings. MotorType=Auto/Rocket/Jet/Ramjet/Off.
// MassFlowKgPerSecond overrides the source-strength estimate (0=automatic).
// Acoustic mass: recognized booster 50/50%; burning stages 50/50/20/20...%.

// Native cold-ejection effects are not engine ignition. MSM uses its own burn/effect gate.

[Motor.Unit.wp_sa-n-6]
NativeIgnitionEffect=Sustainer

[Motor.Unit.wp_sa-n-9]
NativeIgnitionEffect=Sustainer

[Explosion.Small]
AudioClips=audio/explosions/explosion_small

[Explosion.Medium]
AudioClips=audio/explosions/explosion_medium,audio/explosions/explosion_medium_2

[Explosion.Large]
AudioClips=audio/explosions/explosion_large,audio/explosions/explosion_large_2

[Explosion.VeryLarge]
AudioClips=audio/explosions/explosion_very_large

[MotorTypeOverrides]
// Nulka: no additional missile motor layer.
usn_mk234_nulka=Off
usn_mk234_nulka_adap=Off
// Exact ammunition INI stem = Auto, Rocket, Jet, or Off (motor layer only).
// example_missile=Rocket

// Native game resources: one original loop across Mach; active only while motor burns.
// NearLevel fills missing native near audio; falls to zero while a native loop plays.

[SonicBoom.Missile]
Enabled=True
AudioClip=audio/effects/SonicBoom_Missile.wav
Volume=0.50
HalfLevelMetres=2500
MaxDistanceMetres=20000

[SonicBoom.Aircraft]
Enabled=True
AudioClip=audio/effects/SonicBoom_Aircraft.wav
Volume=0.65
HalfLevelMetres=5000
MaxDistanceMetres=40000

