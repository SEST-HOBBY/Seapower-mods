// Actual operator nation, not manufacturer nation. No fallback for unmapped nations.
[Settings]
// Bounded contact diagnostics for the current Patriot investigation.
DiagnosticLogging=True
IncomingAlarmAirfields=True
GroundLinkRadiusMetres=2500
GroundClearHoldSeconds=60
AirfieldMinimumSeconds=180
ShipRearmQuietSeconds=120
// Gap after the complete ship clip. RepeatCount: extra plays, 0=once, -1=unlimited.
ShipAlarmPauseSeconds=10
ShipAlarmRepeatCount=2
// Camera distance in metres; independent of the selected unit.
FullLevelDistanceMetres=50
HalfLevelDistanceMetres=400
IncomingProtectedRadiusMetres=1500
CheckIntervalSeconds=2
MaxDistanceMetres=6000
Volume=1
// Siren, incoming and ship alarms never duck one another.

[US]
// Two rounds: announcement, short gap, alarm. RepeatCount counts extra rounds.
ShipAnnouncementAudioClip=audio/alarms/US_Navy_GeneralQuarters.wav
ShipMissileAnnouncementAudioClip=audio/alarms/US_Navy_GeneralQuarters_Missiles.wav
ShipAnnouncementVolume=1
ShipAnnouncementGapSeconds=0.5
ShipAlarmDurationSeconds=15
ShipAlarmPauseSeconds=2
ShipAlarmRepeatCount=1
IncomingAlarmAudioClip=audio/alarms/US_SAM_Siren.wav
AirfieldAlarmAudioClip=audio/alarms/US_Airbase_AlarmRed_Loop.wav
AirfieldAlarmReleaseClip=audio/alarms/US_Airbase_AlarmRed_Tail.wav
ShipAlarmAudioClip=audio/alarms/US_Navy_GeneralAlarm_SIA114B.wav

// Model profile > year range > nation default. Unknown years use [US].
// The 1965 boundary is a configurable approximation, not a fleet-wide refit date.
[US.Ship.1800-1964]
ShipAlarmAudioClip=audio/alarms/US_Navy_GeneralAlarm_Stromberg.wav

[US.Ship.1965-2200]
ShipAlarmAudioClip=audio/alarms/US_Navy_GeneralAlarm_SIA114B.wav

