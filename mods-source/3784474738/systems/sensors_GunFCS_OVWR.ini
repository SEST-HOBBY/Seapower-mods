#!extend systems/sensors.ini
# CIWS radar and gun fire-control settings.

[eu_Mk15_blk0_radar]
RPM=90                                  // revolutions per minute
MaxRange=20.0                           // max range in km
RangeResolution=30.0                    // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.5                           // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
SubClutterVisibility=40
Gain=42.0                               // gain in dB on the sensor
PeakPower=15.0                          // output peak power in kW
FCSolutionGainRate=1.5
FCMinSolution=0.75
FCTracksRounds=True

[eu_Mk15_blk1_radar]
RPM=90                                  // revolutions per minute
MaxRange=20.0                           // max range in km
RangeResolution=15.0                    // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.5                           // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
SubClutterVisibility=45
Gain=43.0                               // gain in dB on the sensor
PeakPower=15.0                          // output peak power in kW
FCSolutionGainRate=2.0
FCMinSolution=0.80
FCTracksRounds=True

[eu_Mk15_blk1b_radar]
RPM=90                                  // revolutions per minute
MaxRange=20.0                           // max range in km
RangeResolution=10.0                    // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.5                           // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
SubClutterVisibility=47
Gain=44.0                               // gain in dB on the sensor
PeakPower=15.0                          // output peak power in kW
FCSolutionGainRate=2.25
FCMinSolution=0.85
FCTracksRounds=True

[eu_goalkeeper_radar]
MinRange=0.05                          // min range in km
RangeResolution=10.0                   // defines the minimum range where two targets behind can be recognized as two; in meters
FCSolutionGainRate=2.0
FCMinSolution=0.80
FCTracksRounds=True
