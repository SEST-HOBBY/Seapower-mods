; Verylarge: MK72 texture/shader with darker neutral shadow response.
; Dedicated missile smoke material. Native smoke shader and flipbook retained.
; Enable ForwardAdd lighting from the existing local motor point light.
[Shader]
Path=Particles/Particle_Multi_Pass

[Properties]
_Threshold=Float,1
_Min=Float,1
_AdditivePass=Float,0
_ColorLit=Color,{*}BEBEBE80
_ColorUnlit=Color,{*}585A5C80
_minBright=Float,0.10
_Multiplier=Float,1
_TintColor=Color,{*}FFFFFF00
_IsUnderwater=Float,0
_C1=Color,{*}808080FF
_C2=Color,{*}808080FF
_FogFadeFactor=Float,-0.5
_Cutoff=Float,0.5

[Textures]
_MainTex=effects/weapons/textures/fx_boostersmoke2_white
