// Oniks side jets: both sides emit twice, independent of steering demand.
// Keep the effect root at 0,0,0; the nozzle mounts are authored below.
// Pulse 1: 0.00-0.12 s. Pulse 2: 0.24-0.36 s. No looping.
// Requires Stage2FlightEffect2ContinuousChildren=True to preserve each nozzle direction.
// Duration/StartDelay in the private child files define the pulses; stage burn time is only a cutoff.
[Main]
Duration=0.40
Loop=False
Prewarm=False
StartLifetime=0.40
StartSpeed=0
StartSize=0
StartColor=1,1,1,0
SimulationSpace=Local
ScalingMode=Shape
PlayOnAwake=True
MaxParticles=1
StopAction=None
CullingMode=AlwaysSimulate

[Emission]
RateOverTime=0
RateOverDistance=0
Bursts=0:1:1:1:0.01

[Shape]
ShapeType=Sphere
Radius=0

[Renderer]
RenderMode=None
Material=effects/weapons/materials/solidrocket_white.ini

[SubEmitters]
Count=12 // Two pulses x two nozzles x flame, glow and dark smoke

// Right nozzle, pulse 1: flame.
SubEmitter0=effects/weapons/emitters/thrusters/oniks_side_pulse1_flame.ini
SubEmitter0_Position=0.0052,0,0.050
SubEmitter0_Rotation=0,90,0
SubEmitter0_Scale=1,1,1
SubEmitter0_Type=Birth
SubEmitter0_Properties=InheritNothing
SubEmitter0_Probability=1

// Right nozzle, pulse 1: glow.
