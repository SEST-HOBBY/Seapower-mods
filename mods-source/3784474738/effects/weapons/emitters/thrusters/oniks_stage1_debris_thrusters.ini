// Two large thrusters for eu_missile_ss-n-26_stage1_debris.
// Nozzle centres use the authored debris mesh coordinates; keep the effect root at 0,0,0.
// Both jets point rearward (-Z), canted 20 degrees outward along the mesh nozzle axes.
// Requires MultiStageMissiles 1.2.31+: Stage2JettisonEffectContinuousChildren=True.
// Stage2JettisonEffectDuration controls emission; existing particles finish on the debris.
[Main]
Duration=10000
Loop=False
Prewarm=False
StartLifetime=10000
StartSpeed=0
StartSize=0
StartColor=1,1,1,0
SimulationSpace=Local
ScalingMode=Shape
PlayOnAwake=True
MaxParticles=1
StopAction=None
CullingMode=AlwaysSimulate

[Emission]
RateOverTime=0
RateOverDistance=0
Bursts=0:1:1:1:0.01

[Shape]
ShapeType=Sphere
Radius=0

[Renderer]
RenderMode=None
Material=effects/weapons/materials/solidrocket_white.ini

[SubEmitters]
Count=6 // Flame, glow and dark smoke for each nozzle

// Right nozzle: flame; existing Large Thruster component.
SubEmitter0=effects/weapons/emitters/thrusters/control_thruster_large_flame.ini
SubEmitter0_Position=0.005676,0,0.050815 // Debris-local nozzle exit centre
SubEmitter0_Rotation=0,160,0 // Local +Z jet rotated rearward and 20 degrees outward
SubEmitter0_Scale=1,1,1
SubEmitter0_Type=Birth
SubEmitter0_Properties=InheritNothing
SubEmitter0_Probability=1

// Right nozzle: glow; existing Large Thruster component.
SubEmitter1=effects/weapons/emitters/thrusters/control_thruster_large_glow.ini
SubEmitter1_Position=0.005676,0,0.050815 // Debris-local nozzle exit centre
SubEmitter1_Rotation=0,160,0 // Local +Z jet rotated rearward and 20 degrees outward
SubEmitter1_Scale=1,1,1
SubEmitter1_Type=Birth
SubEmitter1_Properties=InheritNothing
SubEmitter1_Probability=1

// Right nozzle: smoke; existing Large Thruster component.
SubEmitter2=effects/weapons/emitters/thrusters/control_thruster_large_smoke.ini
SubEmitter2_Position=0.005676,0,0.050815 // Debris-local nozzle exit centre
SubEmitter2_Rotation=0,160,0 // Local +Z jet rotated rearward and 20 degrees outward
SubEmitter2_Scale=1,1,1
SubEmitter2_Type=Birth
SubEmitter2_Properties=InheritNothing
SubEmitter2_Probability=1

// Left nozzle: flame; existing Large Thruster component.
