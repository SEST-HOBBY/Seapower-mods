SubEmitter3_Position=-0.005676,0,0.050815 // Debris-local nozzle exit centre
SubEmitter3_Rotation=0,-160,0 // Local +Z jet rotated rearward and 20 degrees outward
SubEmitter3_Scale=1,1,1
