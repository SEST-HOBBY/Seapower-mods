// Matches current control_thruster_large_smoke.ini; only pulse timing differs.
// World-space smoke: immediate visibility, rapid expansion and monotonic fade.
// Private alpha-blended material avoids additive whitening by nearby motor lights.
[Main]
StartDelay=0.24 // Seconds after the composite effect starts
Duration=0.12 // Emission duration of this pulse in seconds
Loop=False
Prewarm=False
StartLifetime=1.6|2.2
StartSpeed=0.22|0.36
StartSize=0.010|0.016
StartRotation=0|6.283185
StartColor=0.20,0.21,0.22,0.18
GravityModifier=0
SimulationSpace=World
ScalingMode=Shape
PlayOnAwake=True
EmitterVelocityMode=Custom
CustomVelocity=0,0,0
MaxParticles=1600
StopAction=None
CullingMode=AlwaysSimulate

[Emission]
RateOverTime=600
RateOverDistance=0

[Shape]
ShapeType=Cone
Angle=22
Length=0
Radius=0.00065
Arc=360
ArcMode=Random
Position=0,0,0
Rotation=0,0,0
Scale=1,1,1

[VelocityOverLifetime]
X=curve(0:0/0.12:0.018/0.45:0.050/1:0.075)
Y=curve(0:0/0.12:0.003/0.45:0.012/1:0.020)
Z=curve(0:0/0.12:0.007/0.45:0.020/1:0.030)
; Authored world drift; not dynamically coupled to game weather.
Space=World
SpeedModifier=curve(0:1/0.12:0.75/0.4:0.35/1:0.15)

[ColorOverLifetime]
Color=gradient(0:1,1,1,1/0.045:1,1,1,0.72/0.12:1,1,1,0.48/0.3:1,1,1,0.22/0.5:1,1,1,0.095/0.75:1,1,1,0.025/1:1,1,1,0)

[SizeOverLifetime]
SeparateAxes=False
Size=curve(0:0.8/0.06:1.8/0.18:3.5/0.4:5.5/0.7:7/1:8.5)

[Noise]
Strength=curve(0:0.001/0.08:0.004/0.3:0.014/0.6:0.028/1:0.045)
Frequency=1.3
OctaveCount=3
ScrollSpeed=0.65
Damping=True
Quality=Medium

[Renderer]
RenderMode=Billboard
Material=effects/weapons/materials/control_thruster_large_smoke.ini
SortMode=Distance
SortingFudge=0
SortingOrder=0
MinParticleSize=0
MaxParticleSize=1
Alignment=View
ShadowCastingMode=Off
ReceiveShadows=False
LightProbeUsage=Off
ReflectionProbeUsage=Off

[TextureSheetAnimation]
Mode=Grid
NumTilesX=8
NumTilesY=16
Animation=WholeSheet
RowMode=Custom
RowIndex=0
TimeMode=Lifetime
StartFrame=0|0.03
Cycles=1
FrameOverTime=curve(0:0.22/0.2:0.32/0.55:0.44/1:0.58)
