; Four independent pulse schedules, each reusing the original thrust effect.
; Root starts four unrotated clocks; directional aliases rotate shape and velocity together.
; Random 0/1 bursts skip pulses; distinct phases/intervals avoid shared beats.
; All GameObject positions/rotations are zero; nozzle radius remains 0.003 in each direction.
[Main]
Duration=10000
Loop=False
Prewarm=False
StartDelay=0
StartLifetime=10000
StartSpeed=0
StartSize=0
StartRotation=0
StartColor=1,1,1,0
GravityModifier=0
SimulationSpace=Local
SimulationSpeed=1
UnscaledTime=False
ScalingMode=Shape
PlayOnAwake=True
EmitterVelocityMode=Custom
CustomVelocity=0,0,0
MaxParticles=1
StopAction=None
CullingMode=AlwaysSimulate
RingBufferMode=Disabled

[Emission]
RateOverTime=0
RateOverDistance=0
Bursts=0:1:1:1:0.01

[Shape]
