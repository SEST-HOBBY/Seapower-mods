; Version 1.1.1: matching fore/aft X-fin pairs with local +Y hinge/span.
; Runtime missile forward is +Z. X layout: +/-45 around Z.
; This example assumes a normal-flight body centred at Z=0.
; Front and rear pairs have IDENTICAL rotations but opposite automatic commands.
; No axis/factor keys are needed.

[Models]
NumberOfSubModels=4
SubModel1=ControlFinPair1
SubModel2=ControlFinPair2
SubModel3=ControlFinFrontPair1
SubModel4=ControlFinFrontPair2
ControlSurfaceFullDeflectionRate=30
ControlSurfaceResponseTime=0.08
ControlSurfaceMaxAngle=20

[ControlFinPair1]
Type=None
Mesh=fin_pair
Position=0,0,-0.02
Rotation=0,0,45
ControlSurface=True
ControlStages=1-2

[ControlFinPair2]
Type=None
Mesh=fin_pair
Position=0,0,-0.02
Rotation=0,0,-45
ControlSurface=True
ControlStages=1-2

[ControlFinFrontPair1]
Type=None
Mesh=fin_pair
Position=0,0,0.02
Rotation=0,0,45
ControlSurface=True
ControlStages=1-2

[ControlFinFrontPair2]
Type=None
Mesh=fin_pair
Position=0,0,0.02
Rotation=0,0,-45
ControlSurface=True
ControlStages=1-2

; Optional per-SubModel override (default is automatic):
; Choose from actual fore/aft position:
; ControlDirection=Auto
; Force the rear/tail convention anywhere:
; ControlDirection=Normal
; Force the opposite of Normal anywhere:
; ControlDirection=Reversed
; Use only one uncommented ControlDirection key in a fin section if needed.
; Reversed is NOT an additional flip of Auto; a front fin already uses that sign.
; With explicit manual factors, Reversed negates the manual mixture.
;
; Fore/aft is relative to the regular flight body's geometric midpoint,
; not necessarily the modelling origin or the missile's centre of mass.
; For a plus layout, use Rotation=0,0,0 and Rotation=0,0,-90.
; Omit ControlStages to keep fins active in every stage.
; Position is only illustrative: use the actual model's hinge position.
; Optional ControlAxis overrides the local +Y hinge for nonstandard meshes.
; Optional ControlPivotPosition specifies a pivot in the parent's coordinates.
; Optional ControlObject=fin_hinge/fin_visible selects a child.
; Any explicit ControlPitchFactor/ControlYawFactor/ControlRollFactor opts that
; surface back into manual mixing. Remove all three to use automatic mixing.
