// Reference only: merge the relevant keys into your ammunition override.
// Replace the placeholder mesh/effect names with assets from that ammunition.
// Sample values are visual/gameplay tuning, not measured missile performance.

[MissileLaunchControl]
Enabled=True                            // Enable the short launch controller for this ammunition.
Profile=BoostedTurnover                  // Keep the native motor running while movement retains inertia during tip-over.
ReplaceInitialFlightPhase=True          // Replace the native initial straight-flight delay.
ClearanceDistance=6                     // Metres along the original launch axis before tip-over starts.
TurnoverAim=NativeFlightPath             // Use the native waypoint/loft direction after its own guidance calculations.
TurnoverRate=150                        // Maximum body rotation in degrees per second.
TurnoverTolerance=3                     // Remaining angular error that completes tip-over, in degrees.
TurnoverBraking=True                    // Optional slowdown with opposite control jets near alignment.
TurnoverBrakeAngle=20                   // Maximum remaining angle at which braking may begin.
TurnoverBrakeDuration=0.12              // Maximum braking interval in simulation seconds.
HandoffTime=0.2                        // Seconds blending retained momentum into normal nose-aligned movement.
MaxControlTime=3                       // Timeout for clearance and tip-over; handoff can add its own duration.
DelayStage1EffectsUntilTurnoverComplete=False // Required for BoostedTurnover: do not defer Stage-1 exhaust effects.
ControlEffects=Auto                     // Select existing Launch_ control-effect sections.

[Models]
NumberOfStages=2                        // This example drops a front cover when changing to the second visual mesh.
Stage1Mesh=your_missile_with_cover       // Mesh from this ammunition's existing model resource.
Stage1FlightEffect=your_stage1_motor.ini // Main motor resource; remains active until its burn time or separation.
Stage1BurnTime=2                        // Stage-1 visual motor duration; launch control does not extend it.
Stage1SeparationTime=2                  // Seconds since launch; independent of tip-over completion.
Stage1JettisonMesh=your_front_cover     // Detached mesh; remove that part from Stage2Mesh to avoid a duplicate.
Stage1JettisonMeshPosition=0,0,0        // Missile-local mesh units; use the actual part placement.
Stage1JettisonMeshRotation=0,0,0        // Missile-local Euler degrees at release.
Stage1JettisonVelocity=0,0,20           // Additional velocity in m/s along missile axes; +Z forward, -Z rearward.
Stage1JettisonAngularVelocity=0,0,0     // Local degrees/second; zero disables the default random tumble.
Stage1JettisonLifetime=25              // Debris lifetime in simulation seconds after release.
Stage1JettisonEffect=your_cover_jet.ini // New private effect attached to the detached mesh, separate from SeparationEffect.
Stage1JettisonEffectPosition=0,0,0     // Debris-local mesh units, relative to the detached mesh origin.
Stage1JettisonEffectRotation=0,0,0     // Debris-local Euler degrees applied to the resource's authored emission direction.
Stage1JettisonEffectScale=0,0,0        // Zero preserves authored scale; nonzero values set the effect's local scale.
Stage1JettisonEffectDuration=0.4       // Maximum new-emission time after release; -1 adds no cutoff, 0 disables the effect.
Stage2Mesh=your_missile_without_cover  // Remaining flying mesh after the front part is released.
Stage2FlightEffect=your_stage2_motor.ini // Continue the flying missile's own motor effect separately.

// JettisonVelocity omitted: retain the original gentle backward release.
// JettisonAngularVelocity omitted: retain the original small random tumble.
// JettisonEffectClass can be used instead of JettisonEffect for an effect class.
// Debris and its effect are cosmetic; they do not propel or damage the missile.
