; Add these keys to the ammunition's existing [Guidance] section.
; Example only: choose a suitable range for the ammunition.
[Guidance]
LoLoMaxLaunchRange=40    // Nautical miles; 0 or omitted disables Lo-Lo selection
ShowLowLowRange=True    // Default True; False hides the extra map ring only

