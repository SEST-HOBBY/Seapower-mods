; Hull Damage 0.4.2 - AC Pack submod. Restart Sea Power after changes.
[HullDamage]
Enabled=true
UseHullDamageDecal=true
UseFractureDecals=true
OnlyFatalKeelBreak=true

; Automatically cut upper-model geometry; directly fatal surface hits only.
UseFlyingDebris=true
MaxFlyingFragments=48
DebrisLifetimeSeconds=4.5

; Native effective damage power, not kilograms of explosive.
MinimumPower=8
ReferencePower=68
ReferenceDisplacement=8000
; Surface vessels only. Submarines receive local dents with no global bending.
SingleCrease=true
BaseBendDegrees=12
MaxTotalBendDegrees=24
BandLengthFraction=0.08
DentBeamFraction=0.06

; Hull animation can stretch under load; debris uses the native mission clock.
AnimationSeconds=5
InitialLiftSeconds=1
InitialLiftRatio=0.75
HeaveBeamFraction=0.075
ElasticBendRatio=0.25
MeshUpdatesPerSecond=20
MaxHits=4

; Shared main-thread preparation/upload budget per rendered frame (milliseconds).
; Individual engine mesh readbacks/uploads cannot be subdivided by this budget.
PreparationBudgetMilliseconds=2
MaxVerticesPerMesh=300000
MaxVerticesPerShip=1200000
