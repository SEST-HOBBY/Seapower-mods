; Hull Damage 0.5.9 - AC Pack submod. Restart Sea Power after changes.
[HullDamage]
; Local missile/shell dents use native warhead power + ammunition mass + actual impact speed.
; Kinetic energy uses speed squared; contacts are aligned with the visible hull/deck mesh.
MissileDamage=true
ShellDamage=true
; Shells below 75 mm are excluded. 0 disables this shell-specific gate.
MinimumShellCaliberMm=75
; Only when no explicit mm caliber exists in the ammunition filename: native WarheadData Power.
MinimumUnknownShellPower=2
MinimumLocalPower=0.5
MaxLocalHits=12
; Absolute visual caps per missile/shell hit, independent of ship beam.
MaxLocalRadiusMeters=12
MaxLocalDepthMeters=3
; 0 publishes one finished dent; positive values animate it in mission seconds.
LocalAnimationSeconds=0
Enabled=true
UseHullDamageDecal=true
UseFractureDecals=true
OnlyFatalKeelBreak=true

; Automatically cut upper-model geometry; directly fatal surface torpedo hits only.
UseFlyingDebris=true
UseFlyingSubmodels=true
MaxFlyingSubmodels=8
MaxFlyingFragments=48
DebrisLifetimeSeconds=4.5

; Torpedo threshold and shared power reference; native damage power is not explosive kg.
MinimumPower=8
ReferencePower=68
ReferenceDisplacement=8000
; Surface vessels only. Submarines receive local dents with no global bending.
SingleCrease=true
BaseBendDegrees=12
MaxTotalBendDegrees=24
BandLengthFraction=0.08
DentBeamFraction=0.06

; Hull animation can stretch under load; debris uses the native mission clock.
AnimationSeconds=5
InitialLiftSeconds=1
InitialLiftRatio=0.75
HeaveBeamFraction=0.075
ElasticBendRatio=0.25
MeshUpdatesPerSecond=20
MaxHits=4

; Shared main-thread preparation/upload budget per rendered frame (milliseconds).
; Individual engine mesh readbacks/uploads cannot be subdivided by this budget.
PreparationBudgetMilliseconds=2
MaxVerticesPerMesh=300000
MaxVerticesPerShip=1200000
