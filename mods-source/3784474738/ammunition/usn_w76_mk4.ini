; W76 / Mk 4: fictional game variant for the C4 carrier.
; Uses the existing Mk5 mesh, material and thermal overlay as stand-ins.
; All performance/damage values are game balance, not a real weapon or yield model.
[General]
Type=Missile
TargetType=ASuW
LandAttackCapability=All
CanNotAttackTypes=Vessel,Submarine,Aircraft,Helicopter,Missile
Mass=250
AmmoPoints=150
FOCDate=1980
DefaultCameraDistance=0.06
MinCameraDistanceForeAft=0.15
MinCameraDistanceBroadside=0.14
CameraPivotHeight=0
DecalClass=SAMImpacts

[SensorData]
VisualIdentificationRange=1
IRSignature=Small
RCS=VerySmall

[WarheadData]
; Independent game damage score; the carrier itself has Power=0.
WarheadType=0
Power=10000
ImpactSize=25000
Penetration=Always

[Guidance]
GuidanceType=0
LandAttackGuidanceType=0
MidCourseCorrection=0
InertialGuidance=True
InitialFlightPhaseDuration=0.2
DropDuration=0
MaxLoftAngle=0
MaxLoftAlt=0
TerminalLoft=False
TerminalApproachDist=0.1
AxialRotation=360                      // In degrees per second. Doesnt work when "SupportsBanking" is true
IgnoreHeightDifferenceForTargetDist=True
ApplyKinematics=True
; Inherited carrier velocity supplies motion. No booster or sustainer thrust.
Acceleration=0
AccelerationTime=0
SustainerAcceleration=0
SustainerAccelerationTime=0
MaxVelocity=11000
MaxTurnRate=5
MaxTurnG=100
LaunchTurnRate=3
DragCoefficient=0.15
LiftFactor=0.0001
MaxFlightTime=2400
TimeLimited=True
MinLaunchRange=0
MaxLaunchRange=4000
LaunchReliability=100
CircularErrorRadiusInstallation=150
SelfDestructDelay=2400

[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
