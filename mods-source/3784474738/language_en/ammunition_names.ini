# ---------- Anti-ship Missiles ---------
wp_ss-n-12_350kt=SS-N-12,350kt Sandbox,ASM,The SS-N-12 Sandbox (P-500 Bazalt) is a Soviet surface-launched supersonic standoff anti-ship weapon designed to replace the SS-N-3 Shaddock. This variant carries a 350-kiloton nuclear warhead. Compared to the Shaddock, it is much faster and incorporates an inter-missile data-link that allows the majority of a salvo to remain at low altitude while a single missile flies higher to act as a target spotter. It also carries defensive ECM to improve survivability against anti-air defenses.
wp_ss-n-19_500kt=SS-N-19,500kt Shipwreck,ASM,The SS-N-19 Shipwreck (P-700 Granit) is a Soviet surface-launched supersonic standoff anti-ship weapon. This variant carries a 500-kiloton nuclear warhead. It flies a HI-LO profile and features an advanced inter-missile data-link that allows missiles in a salvo to coordinate and distribute targets, with one missile capable of flying higher to provide targeting information to the group. It can perform evasive maneuvers during the terminal phase and carries onboard ECM and decoys to improve survivability against enemy air defenses.

