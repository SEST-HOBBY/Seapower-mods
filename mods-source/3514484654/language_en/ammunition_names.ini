# ---------- Anti-ship Missiles ----------
usaf_jsm=JSM,,Anti Ship,The Joint Strike Missile (JSM) is a multi-role, air-launched cruise missile under development by the Norwegian company Kongsberg Defence & Aerospace and American company Raytheon Missiles & Defense. 

#-----------Land Strike only missiles---------
usaf_gbu-31_v1=GBU-31(V)1,JDAM,Land Strike,The Joint Direct Attack Munition is an air-dropped bomb accessory developed jointly by Boeing for the U.S. Navy and Air Force. It is installed on traditional bombs dropped by aircraft to transform the originally uncontrolled traditional aerial bombs into controllable precision-guided weapons that can be used in severe weather conditions.

usaf_jsm_land=JSM,,Land Strike,The Joint Strike Missile (JSM) is a multi-role, air-launched cruise missile under development by the Norwegian company Kongsberg Defence & Aerospace and American company Raytheon Missiles & Defense. 

usaf_gbu-53=GBU-53,StormBreaker,Land Strike,The GBU-53 is an air-launched precision-guided glide bomb. The bomb was developed by Raytheon. In the initial bidding, the team of Boeing and Lockheed Martin won the contract for the bomb, but it was shelved for several years due to the Darlene Drewyn corruption case and was not re-bid until September 2005.

