[AmmunitionNames]
# ------------------ AAM ------------------
usn_aim-9m=AIM-9M,Sidewinder,AAM,The AIM-9M Sidewinder is an American infrared-guided air-to-air missile. The M model has increased anti-interference capability based on the L model, and uses a low-tail flame engine, making it difficult to be detected when used at close range.

usn_aim-9x=AIM-9X,Sidewinder,AAM,The AIM-9X Sidewinder is an American infrared-guided air-to-air missile. The X-model has been significantly upgraded, with strong anti-jam capabilities, a longer range, and an impressive backwards firing capability.

usaf_aim-120c7=AIM-120C-7,AMRAAM,AAM,AIM-120 is an active radar-guided air-to-air missile of the United States, used to replace the old Sparrow semi-active radar-guided air-to-air missile. It is relatively small and can be carried by most aircraft.

