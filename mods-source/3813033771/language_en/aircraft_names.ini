[jasdf_ec-2]
Type=EW Aircraft
Default=EC-2,EC-2
DefaultDescription=Stand off electronic warfare aircraft of the Japan Air Self-Defense Force, converted from the Kawasaki C-2 transport. Its passive ESM receivers detect and identify radar emitters, while the J/ALQ-5 jammer reduces the reach of enemy search and fire-control radars and blocks enemy radios and data links to support friendly operations. Use Offensive ECM to aim at an enemy unit or map position. Jamming covers a 30 degree sector and requires line of sight within the radar horizon. The listed 450 km maximum is not a guaranteed effective range. Keep the aircraft behind friendly forces and outside enemy missile reach. Powerful radars can burn through the interference. Enemy units inside the jamming sector lose their radio and data links unless a friendly unit that still has its links is close enough to talk through the noise. Modern data links hold out longer. Jamming does not guarantee protection from missiles. A radar warning receiver and chaff provide additional warning and protection. The broad nose radome, two dorsal fairings and two aft side fairings house its electronic warfare equipment.
Squadron1=Air Development and Test Wing,Gifu
Squadron2=Electronic Warfare Operations Group,Iruma
Callsigns=Default,Static|Squadron1,Static|Squadron2,Static
