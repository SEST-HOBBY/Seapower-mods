Type=EW Aircraft
Default=EC-2,EC-2
DefaultDescription=The EC-2 is the Japan Air Self-Defense Force's new stand-off electronic warfare aircraft, converted from the first production Kawasaki C-2 transport. Its broad nose radome and dorsal and side fairings house jamming and electronic support equipment that can disrupt enemy search and fire control radars, radios and data links from long range while it listens for and identifies emitters. Two General Electric CF6-80C2 turbofans give it the C-2's Mach 0.82 speed and 40,000 ft ceiling. It first flew from Gifu on March 17, 2026, and is planned to join the Electronic Warfare Operations Group at Iruma.
Squadron1=Air Development and Test Wing,Gifu
