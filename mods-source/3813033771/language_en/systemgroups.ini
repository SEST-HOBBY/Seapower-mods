[SystemNames]
J/ALQ-5=J/ALQ-5 Stand Off Jammer|Directional stand off jammer for radars, radios and data links. Aim Offensive ECM at an enemy unit or map position to reduce enemy radar detection and tracking range within a 30 degree sector. Enemy units inside the sector lose their radio and data links unless a friendly unit that still has its links is close enough to talk through the noise. A jammed unit stops sharing contacts with its side and fights with what its own sensors see. Modern data links hold out longer. The 450 km listed maximum is limited by distance, terrain and the radar horizon. Radar burn-through remains possible. Jamming does not guarantee protection from missiles. Communications jamming requires Anchor Chain.
EC-2_ESM=ESM|Wideband electronic support receivers in the EC-2's nose radome and fairings. They detect, identify and take bearings on radar emitters so the jammer can be aimed.
EC-2_RWR=RWR|Radar warning receiver of the C-2 airframe. It warns the crew when a radar locks on or a radar-guided missile is inbound.
