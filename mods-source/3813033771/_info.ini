[Language_en]
Name=EC-2 Stand Off Jammer
Description=Kawasaki EC-2 stand off jammer of the Japan Air Self-Defense Force, converted from the C-2 transport. Jams enemy radars, radios and data links across all frequency bands, with wideband ESM, a radar warning receiver and chaff. Jammer reach is limited by the radar horizon and it remains vulnerable to long-range missiles. Performance follows published C-2 figures. Communications jamming and the jammer tooltip require Anchor Chain.

