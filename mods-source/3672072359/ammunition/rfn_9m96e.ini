[General]
# 9m96e
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=ShoreTargetsOnly  // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=333                              // in kg. Used for aircraft
AmmoPoints=1450                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Tiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=16
ImpactSize=Small                       // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                     // can be minor, moderate, heavy, always

FuzeProximityDistance=12.0             // for proximity fuze: distance to target in yard
KillProbability=0.88                     //Chance to intercept missile
InterceptOutOfAltitudePenalty=0.30                
InterceptSpeedPenaltyMultiplier=0.65                
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
 ; === ESSM_B1_Generic profile ===
 ; Semi-Active Radar Homing (SARH), illumination required.
 ; Moderate look-down climb (no high loft), minimal terminal dive.
GuidanceType=3
#RequiresIllumination=true
MidCourseCorrection=1
InitialFlightPhaseDuration=0.5
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=25.0
MaxLoftAlt=26000.0
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=6
LocalTerminalOnly=False
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=1750.0                     // Maximum speed in knots
MaxTurnRate=40.0    //35.0                   // Maximum turnrate in degrees per second
LaunchTurnRate=120                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=8.0                  // Burn time for initial booster burn
Acceleration=10.5                      // Gs of acceleration in initial burn
SustainerAccelerationTime=-1            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=-1               // Acceleration of sustainer burn. -1 if there is no sustainer
#TypicalTargetAlt=30000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=-1               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.8                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=120               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TerminalLoft=True
TimeLimited=True
#========================================= Launch stats ============================================================
MinLaunchRange=0.5                     // Minimum launch range in nautical miles
MaxLaunchRange=21.6                    // Maximum launch range in nautical miles
MinAttackAltitude=16                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=65617              // Maximum altitude of target, in feet
MaxAttackVelocity=3300				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#CircularErrorRadius=3.5
#Homing
SeekerGain=50.0                         // Seeker gain in dB
SeekerFOV=60.0
SecondaryPassiveRadarGuidanceType=HomeOnJam
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
SeekerActiveRange=13.5
SeekerPassiveRange=60.0
Frequency=X-Band
PeakPower=11.0
#ECCM
AntiCountermeasuresBonus=0.35           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.25                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=2.0

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/ammunition/9m96/
ResourcesRoot=9m96.obj
ResourcesMesh=9m96
ResourcesMaterialFolder=assets/ammunition/9m96/
ResourcesMaterial=9m96_mat.ini
#ResourcesMeshForLaunch=usn_rim-66c_dummy
#ResourcesMeshForLaunch=usn_rim-66c_dummy
ResourcesMeshSwitchTime=1.2  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
Rotation=0,0,0
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_small_effect
BoosterEffectPosition=0,0,-0.022			///-0.022

InFlightEffectClass=DefaultMissileInflightEffect
BoosterEffectPosition=0,0,-0.022			///-0.022
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.05
