[General]
# AIM-174B
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes
Mass=860                               // in kg. Used for aircraft
AmmoPoints=2500

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db


[WarheadData]
WarheadType=0
Power=35
ImpactSize=Medium                       // Impact size, can be small, medium, large, verylarge
Penetration=Heavy                     // can be minor, moderate, heavy, always

KillProbability=0.92                     //Chance to intercept missile
FuzeProximityDistance=30.0              // for proximity fuze: distance to target in meters. Also indicates that Fuze Type = Proximity Fuze


[Guidance]
GuidanceType=3
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=2.2         // time in seconds where the missile moves straight on without guiding


MaxLoftAngle=50.0                      // Climb angle for initial loft
MaxLoftAlt=100000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
TerminalApproachDist=6.5                // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=False                 // if true connection with a guiding radar will be severed upon entering terminal approach stage


ApplyKinematics=True
MaxVelocity=2300                       // Maximum speed in knots
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
AccelerationTime=0.01                  // 初始助推器燃烧的燃烧时间
Acceleration=0                     // 初始燃烧阶段的加速度Gs
SustainerAccelerationTime=44            // 持续燃烧时间。若无持续燃烧，则记为-1
SustainerAcceleration=3.15               // 持续燃烧加速。若无持续燃烧，则值为-1
#---- Total Δv ≈ 1360 m/s ≈ 4.0Ma

DragCoefficient=-1	//1.45
MaxTurnRate=21.0                       // Maximum turnrate in degrees per second
MinLaunchRange=2.0                     // Minimum launch range in nautical miles
MaxLaunchRange=260.0                    // Maximum launch range in nautical miles
#MinLaunchVelocity=0				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
#MinLaunchAltitude=0                  // Minimum launch altitude in feet.
#MaxLaunchAltitude=65000                // Maximum launch altitude in feet.
MaxAttackVelocity=4000				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
MinAttackAltitude=20                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=130000               // Maximum altitude of target, in feet
MaxFlightTime=240               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
TerminalLoft=True
TimeLimited=True


CircularErrorRadius=0.0                // Circular error radius in meters (fuse 40 with CEP 106 = 20%)
CircularErrorRadiusLarge=0.0         // Circular error vs 'Large' aircraft (fuse 40 with CEP 10.51 = 85%)
#Homing
SeekerGain=68.0                        // Seeker gain in dB
SeekerFOV=70.0                          // Seeker field-of-view in degrees
SeekerGimbalFOV=120                     // Seeker gimbal FOV in degrees
SeekerActiveRange=22.0                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=50.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=12.0                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
SecondaryPassiveRadarGuidanceType=Full  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
AntiCountermeasuresBonus=0.47           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.4                   // This value substracted from probability of being jammed  (0...1)
SelfDestructDelay=4.0                  // delay in seconds for self destruction


[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-66c
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_aim_174_mat.ini
AssetBundleMeshHullCollider=usn_rim-66c_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/aim-174/
ResourcesRoot=aim-174b.obj
ResourcesMesh=aim-174
ResourcesMaterial=aim-174b_mat.ini
############################################################
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.031
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.025
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosionClass=MediumMissileExplosions

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07