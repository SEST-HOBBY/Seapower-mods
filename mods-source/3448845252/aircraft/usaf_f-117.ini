[---------- General Data ----------]
[General]
UnitType=Aircraft

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.0

#Taxi values
GroundedPitchAngle=0              // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.039,-0.0182     // defines the distance between center coordinates and the wheels on ground

[AI]
Role=Bomber

[SensorData]
#Visual
VisualIdentificationRange=5.8  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Tiny
# Sonar related

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usaf_f-117

[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=0.6                   //Pi* r * r where r is engine radius, in meters

[FlightModel]
PitchGain=1                           // Vertical manuverability
VelocityGain=0.1136                   // Acceleration
HeadingGain=3                         // Horizontal manuverability
YawRateLimit=130                      // in degrees per second

BankGain=1                            // Roll change speed
#MaxRollForHeading=65.0                // bank limit in normal flight
MaxRollRate=120.0                     // in degrees per second

ThrustGain=0.325                      // Thrust change speed
SpeedBrakeFractionGain=10             // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

[Performance]
#Dimensions
WingSpan=13.2                        //meters
#Parameters
MaxG=4                                // Mostly for horizontal turns

MaxClimbRate=140                     //Meters per second
EmptyMass=13400                     // in kg
MaxFuel=6040.0                        // in kg

PerEngineMaxThrust=48000                  //Newtons
EngineCount=2
EngineWarmUp=20

Ceiling=45000                       // ceiling in feet
CruiseAltitude=35000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.5,0.5,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=410                //in knots, Defines max speed at altitude curve
StallSpeed=127.0                      //in knots
MachLimit=0.93                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.21,0.4        // Landing
SpeedAndRange_Loiter=0.37,0.6         // Loiter
SpeedAndRange_Cruise=0.7,1070        // Cruise
SpeedAndRange_Max=0.92,0.3             // Attack/Fast/High/Max without AB

Altitudes=200,1000,3000,6000,10000,20000,30000  // in feet

