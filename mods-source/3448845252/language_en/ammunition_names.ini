usn_gbu-31_117=GBU-31,JDAM,Land Attack,JDAM

usn_gbu-27_117=GBU-27,Paveway III,Land Attack,The GBU-27 Paveway III (Guided Bomb Unit) is a laser-guided bomb with bunker buster capabilities, it is a GBU-24 Paveway III (fitted on the warhead of the BLU-109 bomb body) that has been redesigned to be used by the F-117A Nighthawk stealth ground attack aircraft. The pilots flying over Iraq during the First Gulf War nicknamed it the "Hammer", for its considerable destructive power and blast radius.

