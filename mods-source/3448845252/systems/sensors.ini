[---------------------------------------- Laser Designator ---------------------------]

[F-117_Laser]
Kind=LaserDesignator
MaxRange=15.0                       // max distance in nm
NightCapable=True                   // is the designator can be used in low-visibility conditions
TargetChannels=1                    // number of targets that can be tracked at once
WeaponChannels=1000                 // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                           // Field of View of the designator

[ ------------------------ Visual/Infared ------------------------- ]

[F-117_Visual]
Kind=Visual
#Infrared
VIDRangeMultiplier=1.8          // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=3.5           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.9            // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.8             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day