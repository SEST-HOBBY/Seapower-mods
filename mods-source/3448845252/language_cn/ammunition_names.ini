usn_gbu-31_117=GBU-31,JDAM,对地攻击,联合直接攻击弹药

usn_gbu-27_117=GBU-27,宝石路 III,对地攻击,GBU-27“铺路三式”激光制导炸弹（英语：GBU-27 Paveway III，以下简称：GBU-27）是一款具备碉堡克星能力的激光制导炸弹，为原GBU-24“铺路三式”（制导套件安装在BLU-109硬化穿透炸弹弹体的弹头头以上的版本）经过重新设计，配备了WGU-25/B、WGU-25A/B或WGU-39/B制导头和BSU-88B弹尾，使得其跨度比其他宝石路激光制导炸弹都要小，然后由F-117A“夜鹰”隐身对地攻击机所搭载的版本。GBU-27的主要用途是从安全距离摧毁坚固的地面目标（如掩体、碉堡、地下指挥所）。第一次海湾战争期间，由于其强大的破坏力和爆炸半径，在伊拉克上空飞行的飞行员将其昵称为“铁锤”。

