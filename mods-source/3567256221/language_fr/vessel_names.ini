[fr_cvn_charles-de-gaulle]
Type=CVN, Porte avion
Default=Charles de Gaulle
DefaultDescription=Le porte-avions Charles de Gaulle est le navire amiral de la Marine nationale française. Mis en service en 2001, il est le dixième porte-avions français, le premier bâtiment de surface à propulsion nucléaire français et le seul porte-avions à propulsion nucléaire construit hors de l'US Navy. Il porte le nom du président et général français Charles de Gaulle..
Variant1=Charles De Gaulle R91, Charles De Gaulle

[fr_ddg_horizon]
Type=DDG,Destroyer
Default=Classe Horizon,Horizon
DefaultDescription=La classe Horizon (en français : Classe Horizon ; en italien : Classe Orizzonte) est une classe de destroyers de défense aérienne en service dans les marines française et italienne. Les Italiens les désignent comme des destroyers, tandis que les Français les appellent « frégates ». Ils utilisent néanmoins également la classification OTAN « D », réservée aux destroyers.
