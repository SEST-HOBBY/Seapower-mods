[fr_lhd_mistral]
Type=LHD
Default=Classe Mistral ,Mistral
DefaultDescription=La classe Mistral est une classe de cinq porte-hélicoptères amphibies construits par la France. Également appelés « porte-hélicoptères » et désignés « navires de projection et de commandement » (BPC) et « porte-hélicoptères amphibie » (PHA) depuis 2019, ces navires peuvent embarquer et déployer 16 hélicoptères NH90 ou Tiger, quatre engins de débarquement, jusqu'à 70 véhicules dont 13 chars Leclerc, ou un bataillon de 40 chars Leclerc et 450 soldats. Ils sont équipés d'un hôpital de 69 lits et peuvent servir au sein d'une force de réaction de l'OTAN ou des forces de maintien de la paix des Nations Unies ou de l'Union européenne.
Variant1=Mistral L9013,Mistral
Variant2=Tonnerre L9014,Tonnerre
Variant3=Dixmude L9015,Dixmude

