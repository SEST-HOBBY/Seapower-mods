fr_mistral=Mistral,,SAM,Le Missile Anti-aérien Léger Transportable (anglais : Transportable lightweight anti-air missile), communément appelé Mistral, est une famille de systèmes de défense aérienne polyvalents à courte portée à guidage infrarouge français fabriqués par MBDA France

fr_cal_76mm=76mm

fr_cal_20mm=20mm

fr_cal_12,7x99mm=12.7mm

fr_cal_7,62x51mm=7.62mm

fr_aster_15=Aster 15,,SAM,L'Aster 15 est un missile sol-air franco-italien tout temps à lancement vertical. Les missiles Aster ont été développés pour intercepter et détruire l'ensemble du spectre des menaces aériennes, des avions de combat hautes performances, des drones et des hélicoptères aux missiles de croisière, anti-radiations et même anti-navires supersoniques à ras de mer.

fr_aster_30=Aster 30,,SAM,L'Aster 30 est un missile sol-air franco-italien tout temps à lancement vertical. Les missiles Aster ont été développés pour intercepter et détruire l'ensemble du spectre des menaces aériennes, des avions de combat hautes performances, des drones et des hélicoptères aux missiles de croisière, anti-radiations et même anti-navires supersoniques à ras de mer.

fr_mu_90_ship=MU90,Impact,ASW Torpedo,La MU90 Impact est une torpille anti-sous-marine légère et avancée franco-italienne. Elle dispose d'un système de guidage actif/passif et d'une profondeur maximale de plus de 1000 m, ce qui en fait une arme extrêmement dangereuse contre les sous-marins ennemis.

fr_canto=Leurre anti-torpille,Canto, 

fr_mm-40_block3=MM40 Block 3c,Exocet,ASM,Le missile MM40 Block 3 a une portée améliorée, supérieure à 180 kilomètres, et accepte les commandes de points de cheminement du système de guidage GPS, qui lui permettent d'attaquer des cibles navales sous différents angles.

fr__mdcn=MdCN,,LAM,Le Missile de Croisière Naval (MdCN) est un missile de croisière subsonique français à turboréacteur destiné aux opérations d'attaque terrestre à partir de navires et de sous-marins. Initialement baptisé SCALP Naval, ce programme est né d'un besoin du ministère français de la Défense pour un missile de croisière plus puissant, capable de frapper des cibles stratégiques et militaires à distance de sécurité accrue, afin de compléter le SCALP-EG lancé depuis un avion.

fr_crotale_vt1=Crotale,,SAM,Le Crotale est un système de missiles sol-air à courte portée français, conçu pour intercepter les armes et aéronefs à longue portée, qu'il s'agisse de missiles de croisière, de missiles antinavires, d'hélicoptères, de drones ou d'avions de chasse performants volant à basse altitude.

fr_cal_100mm=100mm

fr_sm39=SM39 Block 2,Exocet,ASM,Conçue pour les sous-marins, cette version est un missile lancé depuis un sous-marin. Les études du SM39 original ont débuté en 1978 et il est entré en service en 1985. Le missile est logé dans une capsule étanche de la taille d'une torpille, propulsée et lancée par un tube lance-torpilles. À la sortie de l'eau, le carénage de la capsule est éjecté et le missile explose ; il se comporte alors comme un missile AM39.

fr__f21=F21,,Torpille,La F21 est une torpille lourde française de 533 mm entrée en service en 2018 pour remplacer les torpilles F17. Dérivée de la torpille italienne Black Shark, elle est conçue pour neutraliser les navires et les sous-marins et peut opérer en eaux profondes et à proximité des côtes, même dans des environnements bruyants et à fort trafic maritime.

fr__mdcn_sub=MdCN,,LAM,Le missile de croisière naval (MdCN) (anciennement appelé « SCALP Naval ») et parfois MCN, fait partie, avec le missile air-sol moyenne portée amélioré, l’Apache et le SCALP-EG, des missiles de croisière utilisés par l’armée française. Son développement par la société MBDA a commencé en 2006. Il est entré en service sur les frégates de la classe Aquitaine (les six premières FREMM[4]) en 2015 et le premier tir par un sous-marin nucléaire d'attaque (SNA) de classe Suffren a lieu en octobre 2020

fr__sm40=SM40,Exocet,ASM,Conçue pour les sous-marins, cette version est un missile lancé depuis un sous-marin. Elle remplacera le SM39 d'ici 2030.

fr_ngds_sealem_chaff=NGDS Chaff,,Le NGDS (New Generation Dagaie System) est l'évolution du système DAGAIE et équipe la plupart des frégates françaises des années 2000 à 2010. Il se compose de leurres infrarouges et électromagnétiques appelés SEALIR et SEALEM.

fr_sylena_chaff=SYLENA Chaff,,SYLENA est un lanceur de leurres RF/IR de nouvelle génération compatible avec SEALEM, SEALIR et CANTO.

fr__m51=M51,,SLBM,Le M51 SLBM est un missile balistique mer-sol français, construit par ArianeGroup et en service au sein de la Marine nationale. Conçu pour remplacer le M45 SLBM (MSBS – Mer-Sol-Balistique-Stratégique), il a été déployé pour la première fois en 2010.

fr_gbu-12=GBU-12,Paveway II,Guided Bomb, Paveway est une série de bombes à guidage laser. Pave, ou PAVE, est parfois utilisé comme acronyme pour « Precision Avionics Vectoring Equipment » (équipement de vectorisation avionique de précision) ; littéralement, les systèmes électroniques permettant de contrôler la vitesse et la direction des aéronefs. Le guidage laser est une forme de Pave.

fr_sonoflash=SonoFlash,,Bouée acoustique passive et active
