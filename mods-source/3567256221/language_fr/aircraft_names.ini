DefaultDescription=L'E-2D Advanced Hawkeye (AHE) est un avion de détection et de contrôle aéroporté (AEW&C) embarqué de pointe, conçu par Northrop Grumman pour jouer le rôle de « coordinateur numérique » pour l'US Navy et désormais pour la Marine nationale Française. La France acquiert trois E-2D pour remplacer sa flotte vieillissante d'E-2C Hawkeye 2000. La production devrait débuter fin 2024 et les livraisons sont prévues entre 2027 et 2028.
