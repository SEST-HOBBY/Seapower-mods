DefaultDescription=L'Aéronautique navale française met en œuvre trois E-2C Hawkeye et est, outre l'US Navy, la seule force à opérer l'E-2 Hawkeye depuis un porte-avions. Le porte-avions à propulsion nucléaire français Charles de Gaulle embarque actuellement deux E-2C Hawkeye lors de ses patrouilles de combat en mer. Le troisième E-2C Hawkeye français a été modernisé avec des hélices à huit pales dans le cadre du programme NP2000.
