[fr_aliaca]
Type=Drone de reconnaissance
Default=Survey Copter Aliaca, Aliaca
DefaultDescription=Le Survey Copter Aliaca est un drone de reconnaissance tactique français, utilisé par la Marine nationale dans le cadre de son système de mini-drones embarqués (SMDM). Il est conçu et fabriqué par la PME Survey Copter, filiale d’Airbus Defence and Space depuis 2011. Mis en œuvre par catapulte et récupéré à l’aide d’un filet, l’Aliaca peut être déployé rapidement, sans nécessiter d’infrastructure spécialisée. Doté d’une propulsion électrique, il est équipé de systèmes de surveillance optiques et électroniques. Au sein de la Marine nationale, il est déployé sur des bâtiments de plus petite taille, tels que des patrouilleurs, tandis que les navires plus importants sont dotés du système de drones aériens principal de la Marine.
Squadron1=Survey Copter Aliaca, Aliaca




