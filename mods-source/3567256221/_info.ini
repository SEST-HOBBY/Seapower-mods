[Language_en]
Name=Charles De Gaulle & Modern French Navy
Description= The French Navy (French: Marine nationale), informally La Royale, is the maritime arm of the French Armed Forces and one of the four military service branches of France. It is among the largest and most powerful naval forces in the world recognised as being a blue-water navy. The French Navy is capable of operating globally and conducting expeditionary missions, maintaining a significant overseas presence. The French Navy is one of eight naval forces currently operating fixed-wing aircraft carriers with its flagship Charles de Gaulle being the only nuclear-powered aircraft carrier outside the United States Navy, and one of two non-American vessels to use catapults to launch aircraft.

[Language_fr]
Name=Charles De Gaulle & Modern French Navy
Description= La Marine nationale (officiellement appelée « La Royale ») est la branche maritime des forces armées françaises et l'une des quatre armes de guerre françaises. Elle compte parmi les forces navales les plus importantes et les plus puissantes au monde, reconnue comme une marine hauturière. Capable d'opérer à l'échelle mondiale et de mener des missions expéditionnaires, elle maintient une présence internationale significative. Elle est l'une des huit forces navales actuellement en service sur porte-avions, son navire amiral, le Charles de Gaulle, étant le seul porte-avions à propulsion nucléaire hors de la marine américaine, et l'un des deux navires non américains à utiliser des catapultes pour le lancement d'avions.


