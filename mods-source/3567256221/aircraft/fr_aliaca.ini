[---------- General Data ----------]
[General]
UnitType=Aircraft
Size=VerySmall
CarrierCapable=True

DefaultCameraDistance=0.20
MinCameraDistanceForeAft=0.15
MinCameraDistanceBroadside=0.15
CameraPivotHeight=0.0

#Taxi values
GroundedPitchAngle=0         // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,0,0   // defines the relative location of the landing gear
LandingPivot=0,0,0 // defines the relative location of the arrestor hook
OnDeckPositionOffset=0,0,-0.012


[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=Recon

[SensorData]
#Visual
VisualIdentificationRange=7.5  // Biggest range in nm at which this unit can be visually identified
IRSignature=Meager
# Radar related (RCS => radar cross section)
RCS=Meager

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_fr_aliaca

[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=1.8      // Propellor diameter value used

[FlightModel]
PitchGain=1.1                         // Vertical manuverability
VelocityGain=0.22                   // Acceleration
HeadingGain=4.2                         // Horizontal manuverability
YawRateLimit=120                      // in degrees per second

BankGain=1.1                          // Roll change speed
MaxRollForHeading=42.0                // bank limit in normal flight
MaxRollRate=95.0                      // in degrees per second

ThrustGain=0.45                      // Thrust change speed
SpeedBrakeFractionGain=0.2            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

[Performance]
#Dimensions
WingSpan=3.6                       //meters
#Parameters
MaxG=3.2                              // Mostly for horizontal turns

MaxClimbRate=8.5                     //Meters per second
EmptyMass=13.0                     // in kg
MaxFuel=5                    // in kg

PerEngineMaxPower=2800             // Power in Watts. Also indicates Turboprop engine type
EngineCount=1

Ceiling=13000.0                       // ceiling in feet
CruiseAltitude=5000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.82,0.72,0.50       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=240                //in knots, Defines max speed at altitude curve
StallSpeed=60.0                      //in knots
MachLimit=0.3                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.09,0.35        // Landing
SpeedAndRange_Loiter=0.10,0.6         // Loiter
SpeedAndRange_Cruise=0.26,62       // Cruise
SpeedAndRange_Max=0.32,0.55          // Attack/Fast/High/Max without AB

Altitudes=250,500,1000,2000,3000,4000,5000  // in feet

