[fr_lhd_mistral]
Type=LHD
Default=Mistral class,Mistral
DefaultDescription=The Mistral class is a class of five landing helicopter docks built by France. Also known as helicopter carriers, and referred to as "projection and command ships" (French: bâtiments de projection et de commandement or BPC) and "porte-hélicoptères amphibie" (PHA) since 2019, a Mistral-class ship is capable of transporting and deploying 16 NH90 or Tiger helicopters, four landing craft, up to 70 vehicles including 13 Leclerc tanks, or a 40-strong Leclerc tank battalion and 450 soldiers. The ships are equipped with a 69-bed hospital, and are capable of serving as part of a NATO Response Force, or with United Nations or European Union peace-keeping forces.
Variant1=Mistral L9013,Mistral
Variant2=Tonnerre L9014,Tonnerre
Variant3=Dixmude L9015,Dixmude

