DefaultDescription=The Triomphant class of ballistic missile submarines of the French Navy is the active lead boat class of four boats that entered service in 1997, 1999, 2004, and 2010. These four superseded the older Redoutable class, and they provide the ocean-based component of France's multi-discipline nuclear deterrent strike force, the Force de dissuasion.
