[fr_cvn_charles-de-gaulle]
Type=CVN,Aircraft Carrier
Default=Charles de Gaulle
DefaultDescription=Charles de Gaulle is the flagship of the French Navy. Commissioned in 2001, the ship is the tenth French aircraft carrier, the first French nuclear-powered surface vessel, and the only nuclear-powered carrier completed outside of the United States Navy. She is named after French president and general Charles de Gaulle.
Variant1=Charles De Gaulle R91, Charles De Gaulle

[fr_ddg_horizon]
Type=DDG,Destroyer
Default=Horizon class,Horizon class
DefaultDescription=The Horizon class (French: Classe Horizon; Italian: Classe Orizzonte) is a class of air-defence destroyers in service with the French and Italian navies. They are designated as destroyers by the Italiansand are referred to as "frigates" by the French but nonetheless also use the NATO classification "D" intended for destroyers.
Variant1=Forbin D620,Forbin
Variant2=Chevalier Paul D621,Chevalier Paul

