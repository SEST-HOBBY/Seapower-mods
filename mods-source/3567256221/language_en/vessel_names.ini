[fr_fdi_amiral_ronarc'h]
Type=FFG,Defense and intervention frigate
Default=Amiral Ronarc'h class, Amiral Ronarc'h
DefaultDescription=The Frégate de Défense et d'Intervention (English: Defence and Intervention Frigate) or FDI, formerly denominated Frégate de Taille Intermédiaire (English: Medium-Size Frigate) or FTI, is a programme launched in 2015 to produce a new class of first-rank French frigates to complement the Aquitaine-class. As of February 2022, five ships have been ordered for the French Navy and will form the Amiral Ronarc'h class, with the lead ship expected to be commissioned in 2026.
