fr_aster_15=Aster 15,,SAM,The Aster 15 is a Franco-Italian all-weather, vertical launch surface-to-air missile.The Aster missiles were developed to intercept and destroy the full spectrum of air threats from high-performance combat aircraft, UAVs and helicopters to cruise, anti-radiation and even sea-skimming supersonic anti-ship missiles.

fr_aster_30=Aster 30,,SAM,The Aster 30 is a Franco-Italian all-weather, vertical launch surface-to-air missile.The Aster missiles were developed to intercept and destroy the full spectrum of air threats from high-performance combat aircraft, UAVs and helicopters to cruise, anti-radiation and even sea-skimming supersonic anti-ship missiles.

fr_mu_90_ship=MU90,Impact,ASW Torpedo,The MU90 Impact is a Franco-Italian advanced lightweight anti-submarine torpedo.It has active/passive homing system and a maximum depth of over 1000m,making this an extremely dangerous weapon against enemy submarines.

fr_canto=Anti-torpedo decoy,Canto, 

fr_mm-40_block3=MM40 Block 3c,Exocet,ASM,The MM40 Block 3 missile has an improved range, in excess of 180 kilometres, and accepts GPS guidance system waypoint commands, which allow it to attack naval targets from different angles.

fr__mdcn=MdCN,,LAM,The Missile de Croisière Naval (MdCN), meaning Naval Cruise Missile, is a French turbojet-powered subsonic cruise missile intended for ship and submarine-based land-attack operations. Originally dubbed SCALP Naval, the program arose out of a requirement issued by the French Ministry of Defence for a more potent cruise missile capable of striking strategic and military targets from extended stand-off ranges in order to complement the air-launched SCALP-EG.

fr_crotale_vt1=Crotale,,SAM,The Crotale is a French short-range surface-to-air missile system developed to intercept airborne ranged weapons and aircraft, from cruise or anti-ship missiles to helicopters, UAVs or low-flying high-performance fighter aircraft.

fr_cal_100mm=100mm

fr_sm39=SM39 Block 2,Exocet,ASM,Designed for submarines, this version is a submarine-launched missile. Studies of the original SM39 began in 1978, and it entered service in 1985. The missile is housed in a watertight capsule the size of a torpedo, which is propelled and launched by a torpedo tube. Upon exiting the water, the capsule's fairing is ejected, and the missile is detonated; it then behaves like an AM39 missile.

fr__f21=F21,,Torpedo,The F21 is a French 533mm heavyweight torpedo that entered service in 2018 as a replacement for the F17 torpedoes. Developed from the Italian Black Shark, these torpedoes are designed to neutralize ships and submarines and capable of operating in deep waters and near coastal areas with high levels of noise and dense shipping.

fr__mdcn_sub=MdCN,,LAM,The Missile de Croisière Naval (MdCN), meaning Naval Cruise Missile, is a French turbojet-powered subsonic cruise missile intended for ship and submarine-based land-attack operations. Originally dubbed SCALP Naval, the program arose out of a requirement issued by the French Ministry of Defence for a more potent cruise missile capable of striking strategic and military targets from extended stand-off ranges in order to complement the air-launched SCALP-EG.

fr__sm40=SM40,Exocet,ASM,Designed for submarines, this version is a submarine-launched missile. It will replace the SM39 by 2030.

fr_ngds_sealem_chaff=NGDS Chaff,,The NGDS (New Generation Dagaie System) is the evolution of the DAGAIE system and equips most French frigates from the 2000s–2010s. It consists of IR and EM decoys known as SEALIR and SEALEM.

fr_sylena_chaff=SYLENA Chaff,,SYLENA is a new-generation RF/IR decoy launcher compatible with SEALEM, SEALIR, and CANTO.

fr__m51=M51,,SLBM,The M51 SLBM is a French submarine-launched ballistic missile, built by ArianeGroup, and deployed with the French Navy. Designed to replace the M45 SLBM (in French terminology the MSBS – Mer-Sol-Balistique-Stratégique "Sea-ground-Strategic ballistic"), it was first deployed in 2010.

fr_gbu-12=GBU-12,Paveway II,Guided Bomb, Paveway is a series of laser-guided bombs.Pave or PAVE is sometimes used as an acronym for precision avionics vectoring equipment; literally, electronics for controlling the speed and direction of aircraft. Laser guidance is a form of Pave.

fr_sonoflash=SonoFlash,,Passive and Active Sonobuoy
