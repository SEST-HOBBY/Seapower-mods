[------------------------------ Sequences ------------------------------]
// possible values for rotations are either a complete vector (x,y,z)
// or single axis like RotationX1, RotationY1, RotationZ1
// same is true for positions
// both rotation and position values are optional, so if you leave the position away,
// only the rotation will be applied

[------------------------------ FlightDeck Sequences ------------------------------]
#Open Hangar Doors
[HangarOpenDoorLAnimSequence]
NumberOfSteps=2
Time1=1                // time in seconds for the start
RotationX1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=10            // time in seconds - here for the end
RotationX2=80
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[HangarOpenDoorRAnimSequence]
NumberOfSteps=2
Time1=1                // time in seconds for the start
RotationX1=0
PositionY1=0.13929
PositionZ1=-0.6695
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=9.5            // time in seconds - here for the end
RotationX2=-90
PositionY2=0.182
PositionZ2=-0.709
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[HangarCloseDoorLAnimSequence]
NumberOfSteps=2
Time1=1                // time in seconds for the start
RotationX1=80
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=10           // time in seconds - here for the end
RotationX2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[HangarCloseDoorRAnimSequence]
NumberOfSteps=2
Time1=1                // time in seconds for the start
RotationX1=-90
PositionY1=0.182
PositionZ1=-0.709
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=9.5            // time in seconds - here for the end
RotationX2=0
PositionY2=0.13929
PositionZ2=-0.6695
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[TorpedoDoorOpenSequence]
NumberOfSteps=2
Time1=0
RotationZ1=0
Smoothness1=EaseInOut
Time2=3
RotationZ2=90
Smoothness2=EaseInOut

[TorpedoDoorCloseSequence]
