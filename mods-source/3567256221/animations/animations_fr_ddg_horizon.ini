Animation2=HangarCloseAnim
Animation3=TorpedoDoorOpenL
Animation4=TorpedoDoorCloseL
Animation5=TorpedoDoorOpenR
Animation6=TorpedoDoorCloseR


[HangarOpenAnim]
NumberOfSequencesToPlay=2
Sequence1=HangarOpenDoorLAnimSequence
Sequence1_Model=HangarDoor_1
Sequence2=HangarOpenDoorRAnimSequence
Sequence2_Model=HangarDoor_2

[HangarCloseAnim]
NumberOfSequencesToPlay=2
Sequence1=HangarCloseDoorLAnimSequence
