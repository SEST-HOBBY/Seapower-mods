[Animations]
NumberOfAnimations=2
Animation1=RaisePeriscope
Animation2=LowerPeriscope



[RaisePeriscope]
NumberOfSequencesToPlay=1
Sequence1=RaisePeriscopeSequence
Sequence1_Model=Telescope

[LowerPeriscope]
NumberOfSequencesToPlay=1
Sequence1=LowerPeriscopeSequence
Sequence1_Model=Telescope




********************************************

[RaisePeriscopeSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
RotationX2=90
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[LowerPeriscopeSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=90
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
RotationX2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry



