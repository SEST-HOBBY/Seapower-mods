#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Mistral
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW  
SecondaryTargetType=ASuW               // can be AAW, ASuW, ASW
Mass=19.7                               // in kg. Used for aircraft

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=3  // at what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Tiny
IRSignature=VerySmall
# Sonar related

[WarheadData]
WarheadType=0                          // Blast Fragmentation (ogive HE 3 kg)
Power=3                                // Puissance réelle ~3 kg TNT équivalent
ImpactSize=Small                       // Impact petit (avions légers/drones/missiles)
Penetration=Minor                      // Pénétration faible (structure légère)
FuzeProximityDistance=8.0              // Détonation proximité 8 yards (proche cible aérienne)
KillProbability=0.90                   // Chance haute de destruction (guidage IR précis)

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1                         // IR Homing (guidage infrarouge passif)
MidCourseCorrection=0                  // Pas de correction mid-course (portée courte)
DropDuration=0.3                       // Temps chute libre après lancement (très court)
InitialFlightPhaseDuration=0.25         // Phase initiale droite (sortie lanceur + accélération)

#======================================== Flight Profile ===========================================================

#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=1000              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough

#========================================= Launch stats ============================================================

MaxVelocity=1800                       // Maximum speed in knots
VelocityBleed=0.9                      // Missile will eventually slowdown to 
AccelerationTime=2.6                   // Time until start of the velocity bleed, in seconds
Acceleration=20.0                      // Acceleration factor
MaxTurnRate=16.0                       // Maximum turnrate in degrees per second
MinLaunchRange=0.1                     // Minimum launch range in nautical miles
MaxLaunchRange=5                       // Maximum launch range in nautical miles
MinAttackAltitude=0                    // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=19685                // Maximum altitude of target, in feet
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)

#========================================     Seeker     ===========================================================

#Homing
SeekerFOV=90.0                         // Seeker field-of-view in degrees
SeekerActiveRange=0.0                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=20.0                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#ECCM
AntiCountermeasuresBonus=0.5           // This value substracted from probability of spoofing by countermeasures (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=4.0                  // delay in seconds for self destruction


[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_aim-9l
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_aim-9l_mat
AssetBundleMeshHullCollider=usn_aim-9l_coll
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/mistral/
ResourcesRoot=mistral.obj
ResourcesMesh=mistral
ResourcesMeshForLaunch=launch
ResourcesMeshSwitchTime=0.2  // time in seconds after launch to switch from launch mesh to main mesh
ResourcesMaterial=mistral_mat.ini
############################################################
#NumberOfSubModels=0
[---------- Launchers ----------]
# References to the launchers are just used for positioning relative to the launcher of the missile
[Launchers]
NumberOfLaunchers=2
Launcher1=sadral_tourelle_g
Launcher2=sadral_tourelle_d

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_small_effect
BoosterEffectPosition=0,0,-0.015

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.015
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043