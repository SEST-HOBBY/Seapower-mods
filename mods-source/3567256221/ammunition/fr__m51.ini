#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
#  M51
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation      // can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode

SubmergedLaunch=true                   // Lancement depuis plongée
SubmergedTransparency=0.0              // Opaque complet (fix transparence underwater)
SubmergedTransitionTime=2.5            // Temps réaliste sortie d'eau (~2,5 s)

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=8  // at what range in nm this unit can be visually identified
IRSignature=Large
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=250                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze

[WarheadData]
WarheadType=0                          // Blast Fragmentation (nucléaire MIRV)
Power=2000000                          // **x20** : 2 Mt équivalent (destruction massive)
ImpactSize=2000                   // **Max** : Impact nucléaire géant
Penetration=Always                     // Pénétration totale (sous-terrain inclus)


[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0                         // Balistique pur (inertiel + GPS/astro)
MidCourseCorrection=0                  // Pas de correction externe (autonome interne)
DropDuration=1.0                       // Temps chute libre après lancement (court)
InitialFlightPhaseDuration=5.0         // Phase boost + sortie d'eau (~5 s)

#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=90.0                      // Montée verticale quasi-parfaite
MaxLoftAlt=99990                       // Limite max du jeu (~30 km) – simule apogée haute

#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
# Non applicable (pas de sea-skimming pour SLBM)

#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
# Pas de pop-up (trajectoire balistique)

#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
TerminalApproachDist=50                // Phase terminale longue (simule rentrée depuis orbite)
TerminalDiveDistance=100               // Plongée finale sur 100 nmi (réaliste reentry)
SupportsBanking=False                  // Pas de banking (balistique)
IgnoreHeightDifferenceForTargetDist=True
TerminalDiveAngle=90                   // Reentry quasi-verticale

#========================================= Kinematics ============================================================
ApplyKinematics=False                  // Cinématique complète activée
MaxVelocity=25000.0                    // Vitesse reentry ~Mach 20+ (~25 000 knots)
Acceleration=15.0                      // Accélération booster forte
AccelerationTime=20                    // Burn time for initial booster burn
MaxTurnRate=8.0                        // Virages limités (quasi-ballistique)
VelocityBleed=0.5                      // Ralentissement atmosphérique (clé pour éviter dépassement)
MaxFlightTime=1800                     // Temps vol max ~30 min (portée 10 000 km)

#========================================= Launch stats ============================================================
MinLaunchRange=500.0                   // Distance minimale de sécurité (éloignement SNLE)
MaxLaunchRange=5400.0                  // ~10 000 km (~5 400 nmi)
MinLaunchAltitude=200                  // Minimum launch altitude in feet.
MaxLaunchAltitude=99990                // Limite jeu
LaunchReliability=99                   // Fiabilité stratégique

#========================================     Seeker     ===========================================================
#Homing
# Pas de seeker actif (balistique inertiel + GPS)
CircularErrorRadiusInstallation=150    // CEP ~150 m (précision M51 MIRV)

#ECCM
AntiCountermeasuresBonus=0.5           // Résistance ECM/GPS jamming
AntiJammerBonus=0.4

#SelfDestruct
SelfDestructDelay=10.0                 // Délai autodestruction si erreur

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets\models\ammunition\m51/
ResourcesRoot=M51.obj
ResourcesMesh=M-51
ResourcesMeshForLaunch=M-51
ResourcesMeshSwitchTime=60 // time in seconds after launch to switch from launch mesh to main mesh
ResourcesMeshCanister=M-51
ResourcesMaterial=m51_mat.ini


############################################################
[---------- Effects ----------]
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.024137
BoosterEffectDuration=30
InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available



HitShipExplosion=effects/explosions/emitters/nuclear_underwater_surface_part
HitGroundExplosion=effects/explosions/emitters/nuclear_underwater_surface_part
HitDefaultExplosionClass=effects/explosions/emitters/nuclear_underwater_surface_part
HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=VeryLargeGroundHitExplosions

ExplosionOverwaterSplash=effects/explosions/emitters/nuclear_underwater_surface_part

UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.08

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
#creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.017,0.017,0.14