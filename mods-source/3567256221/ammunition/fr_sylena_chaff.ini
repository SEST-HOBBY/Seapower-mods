# SYLENA countermeasures
[General]
Type=Chaff                             // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW

Mass=0.12                               // in kg. Used for aircraft
AmmoPoints=0.22                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

[ECM]
# Chaff -related parameters
SpoofChance=0.66                      // Base chance to spoof missile
DefensiveEffectTime=60                // Period of defensive effect being active in seconds
ReactionRange=3.25                     // in miles; Distance to missile at which chaff is auto-launched

[SensorData]
IRSignature=Large
# radar related (RCS => radar cross section)
RCS=VeryLarge