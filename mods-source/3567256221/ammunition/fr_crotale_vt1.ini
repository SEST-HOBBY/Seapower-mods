#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Crotale NG
# Users: 
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW

DefaultCameraDistance=0.3
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0                          // Blast Fragmentation (ogive HE 13 kg)
Power=13                               // Puissance réelle ~13 kg TNT équivalent
ImpactSize=Medium                      // Impact moyen (avions/missiles/drones)
Penetration=Moderate                   // Pénétration structure avion
FuzeProximityDistance=15.0             // Détonation proximité 15 yards (proche cible aérienne)
KillProbability=0.90                   // Chance haute de destruction (guidage précis Crotale VT-1)

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=2                         // Semi-Active Radar Homing (SARH) – guidage par illuminateur (Castor 30 ou STIR)
MidCourseCorrection=1                  // Radio Command (inertiel + corrections depuis le navire)
DropDuration=0.5                       // Temps chute libre après lancement (court pour SAM)
InitialFlightPhaseDuration=1.0         // Phase initiale droite (sortie lanceur + accélération)
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=60.0                      // Montée forte (quasi verticale pour SAM courte portée)
MaxLoftAlt=10000                      // Altitude max 

#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
# Non applicable (pas de sea-skimming pour Crotale VT-1)

#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
# Pas de pop-up (trajectoire directe ou loftée)

#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
TerminalApproachDist=1000               // Activation terminale à ~3 nmi
LocalTerminalOnly=True                 // Déconnexion mid-course (autonome terminal)

#========================================= Kinematics ============================================================
ApplyKinematics=True                   // Cinématique complète activée
MaxVelocity=1800.0                     // Mach 3+ (~1800 knots) – vitesse Crotale VT-1
MaxTurnRate=50.0                       // Maniabilité exceptionnelle (vecteur poussée)
AccelerationTime=2.0                   // Temps accélération booster ultra-court
Acceleration=40.0                      // Accélération très forte (vecteur poussée)
DragCoefficient=-1                    // Coefficient traînée faible (supersonique)
MaxFlightTime=30                       // Temps vol max ~30 s (portée courte)

#========================================= Launch stats ============================================================
MinLaunchRange=0.5                     // Distance min réelle
MaxLaunchRange=6.0                     // Portée max ~11 km (~6 nmi)
MinAttackAltitude=10                   // Altitude cible min (sea-skimming)
LaunchReliability=97                   // Fiabilité élevée (SAM Crotale)

#========================================     Seeker     ===========================================================
#Homing
SeekerGain=48.0                        // Gain radar SARH
SeekerFOV=35.0                         // Champ vision radar réduit pour précision
SecondaryPassiveRadarGuidanceType=None // Pas de mode passif secondaire
PassiveRadarGuidanceFrequencies=None
SeekerPassiveRange=20                   
SeekerActiveRange=20                   
Frequency=X-Band                       // X-band illuminateur (Castor 30)
PeakPower=0.0                          // Pas de puissance radar embarquée
TargetMemory=True                      // Lock persistant

#ECCM
AntiCountermeasuresBonus=0.40          // Résistance leurres élevée (Crotale VT-1)
AntiJammerBonus=0.30                   // Résistance brouillage

#SelfDestruct
SelfDestructDelay=5.0                  // Autodestruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/vt_1/
ResourcesRoot=vt_1.obj
ResourcesMesh=VT_1
ResourcesMeshForLaunch=Launch
ResourcesMeshCanister=Launch
ResourcesMeshSwitchTime=0.4// time in seconds after launch to switch from launch mesh to main mesh
ResourcesMaterial=vt_1_mat.ini
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.043

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.04
InFlightEffectStartTime=4.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=coll_main

[coll_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043
