#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW            // can be AAW, ASuW, ASW
SecondaryTargetType=AAW

Mass=35                                // in kg. Used for aircraft
AmmoPoints=35                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=870         // meter per second
MaxRange=12000             // in meters
CircularErrorProbable=105  // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=5
ImpactSize=SemiSmall       // Impact size, can be small, medium, large, verylarge
Penetration=Moderate       // can be minor, moderate, heavy, always
FuzeProximityDistance=15
KillProbability=0.01       // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_large_shell
HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_small
HitGroundExplosionClass=MediumGroundHitExplosions
