#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# MDCN
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation      // can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode

Mass=1450                              // in kg. Used for aircraft
AmmoPoints=4350                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze

[WarheadData]
WarheadType=1                          // Armor Piercing (BROACH tandem : pénétration + blast/fragmentation)
Power=450                              // Puissance réelle ~450 kg TNT équivalent
ImpactSize=Medium                      // Impact moyen (bunker + structures)
Penetration=Always                     // Pénétration béton renforcé
FuzeProximityDistance=5.0              // Détonation airburst légère (5 m rayon max dégâts)
KillProbability=0.95                   // Précision CEP ~3 m → quasi létal

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing

[Guidance]
GuidanceType=6                         // TV-Homing (imagerie infrarouge terminale)
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=3.0         // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=True  // flag if the missile performs a slight ballistic flight curve during the initial phase
TerrainFollowFlight=True               // Terrain following activé (réel MDCN)

#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=25.0                      // Climb angle for initial loft
MaxLoftAlt=80                      // in feet. Maximum altitude for lofting

#flight phase 2: sea skimming / terrain following---------------------------------------------------------------------------------------------------------
#SeaSkimmingAlt=20.0                    // height in feet for sea skimming TODO:make terrain following
#SeaSkimmingAlt=2000.0                    // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=30.0        // Dive angle while going to sea skimming / terrain following
SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=1000       // in N. miles. (début terrain following)

#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#FinalFlightPhaseAlt=3500.0             // in feet. altitude of pop-up
#FinalFlightPhaseMaxAngle=40.0
#FinalFlightPhaseDistToTarget=20.0       // in N. miles. Recommended to set this distance equal to the seeker range

#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
TerminalApproachDist=6.5               // in N. miles. Recommended to set this distance slightly less than the seeker range
SupportsBanking=True                   // if the missile will bank when turning
TerminalAlt=80                         // in feet. Weapon will try to get to this altitude at the start of terminal approach
TerminalDiveDistance=0.5                // in N. miles.

#========================================= Launch stats ============================================================

MaxVelocity=550.0                      // Maximum speed in knots (Mach 0.8)
Acceleration=6.0                       // Acceleration factor
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
MinLaunchRange=2                       // Minimum launch range in nautical miles
MaxLaunchRange=540.0                   // Maximum launch range in nautical miles (~1 000 km)
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)

#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=20     // Circular error vs 'Installation' land units (~20 m CEP)
#Homing
#N/A (imagerie IR terminale)
#ECCM
AntiCountermeasuresBonus=0.3           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.1                    // This value substracted from probability of being jammed (0...1)
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/models/ammunition/mdcn_sm/
ResourcesRoot=mdcn_sm.obj
ResourcesMesh=Mdcn
ResourcesMaterial=mdcn__mat.ini
ResourcesMeshForLaunch=Launch
ResourcesMeshCanister=Launch
ResourcesMeshSwitchTime=3  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.0345
#BoosterEffect=effects/weapons/emitters/aam_effect	//LargeASMSmokeEmitter
#BoosterEffectPosition=0,0,-0.015

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.0345
#InFlightEffectPosition=0,0,0.01
#InFlightEffectStartTime=0.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=LargeWaterSplashes

DebrisTrail=effects/aircraft/emitters/helicopterfireeffect
HitWaterSplashClass=LargeWaterSplashes
ExplosionOverwaterSplash=False

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.008,0.007,0.08