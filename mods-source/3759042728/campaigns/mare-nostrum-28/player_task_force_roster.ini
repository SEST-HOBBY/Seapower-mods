; ROSTER GLOBAL - Mare Nostrum '28
; DISENO: TODAS las unidades tienen COSTE en puntos (sintaxis <unit>=<variantes>|<coste>).
; Escala v3 tipo "Bigs2013" (probada por la comunidad). Progresion doble: DESBLOQUEO por acto
; (via TaskForceModeAllowedRosterUnits) + PRESUPUESTO de puntos (StartingPoints + recompensas).
; Portaaviones/LHD a precio de CASCO PELADO: el juego suma el ala embarcada aparte (verificado).
;
; PLAN DE DESBLOQUEO (ver mare_nostrum_28_design.md):
;   Acto I  (M1-M3): Espana
;   Acto II (M4-M6): + Francia + Italia
;   Acto III(M7-M10): + Alemania + Holanda
; EEUU y Rusia son fuerzas de escalada/enemigo: se colocan directamente en las
; misiones, NO se compran (por eso no van en el roster del jugador).

[AllowedVessels]
