Taskforce1GenericTrigger1Message=Title=<size=24>Mare Nostrum '28 - Mision 3</size>\nCAZA SILENCIOSA\n<size=24>Golfo de Cadiz</size>\nBody=La inteligencia situa dos submarinos diesel hostiles operando contra el trafico entre la Peninsula y Canarias. Emplea tu sonar y tu helicoptero para localizarlos y hundirlos.\n\nCuidado: el Golfo esta lleno de mercantes, pesqueros y ballenas que ensuciaran tu sonar con falsos contactos. Identifica bien antes de disparar.\nButtonText=Iniciar mision\nPopupStyle=Intro
Taskforce1GenericTrigger2Message=Title=VICTORIA\nBody=Ambos submarinos destruidos. La ruta queda asegurada.\nButtonText=Continuar\nPopupStyle=Outro
Taskforce1TorpedoedmerchantMessage=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=MERCANTE ALCANZADO\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Uno de los submarinos hostiles ha alcanzado a un mercante. Se hunde rapido, hay supervivientes en el agua. Desvia un helicoptero para busqueda y rescate si puedes prescindir de el.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1FightersenabledMessage=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=CAZAS ENTRANTES\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Contacto de radar: tres cazas hostiles se acercan rapido, directos hacia tu helicoptero de rescate. Cubridlo o retiradlo, no sobrevivira solo a una pasada de ametrallamiento.\nButtonText=Continuar\nPopupStyle=NavalMessage
