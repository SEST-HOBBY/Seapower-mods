
[Language_en]
Name=03 Silent Hunt
Description=Hostile diesel submarines threaten the sea route to the Canaries. Locate and destroy them.
MN3_DeployLabel_en=Task Force Deployment
MN3_SubAreaLabel_en=Suspected submarine operating area
Taskforce1GenericTrigger1Message=Title=<size=24>Mare Nostrum '28 - Mission 3</size>\nSILENT HUNT\n<size=24>Gulf of Cadiz</size>\nBody=Intelligence has located two hostile diesel submarines operating against shipping between the mainland and the Canaries. Use your sonar and helicopter to locate and sink them.\n\nBeware: the Gulf is crowded with merchant vessels, fishing boats and whales, all of which will clutter your sonar with false contacts. Identify each contact before engaging.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1GenericTrigger2Message=Title=VICTORY\nBody=Both submarines destroyed. The route is secure.\nButtonText=Continue\nPopupStyle=Outro
Taskforce1TorpedoedmerchantMessage=One of the hostile submarines has torpedoed a merchant vessel. She is sinking fast
Taskforce1FightersenabledMessage=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=FIGHTERS INBOUND\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Radar contact: three hostile fighters are closing fast, heading straight for your rescue helicopter. Cover it or wave it off—it will not survive a strafing pass alone.\nButtonText=Continue\nPopupStyle=NavalMessage
