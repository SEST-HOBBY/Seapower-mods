Taskforce1IntroMessage=Title=<size=24>Mare Nostrum '28 - Mision 8</size>\nESCUDO DE EUROPA\n<size=24>Augusta, Sicilia</size>\nBody=Con la OTAN muerta y Washington en tu contra, Augusta es el unico puerto que le queda a la Fuerza Naval Europea en el Mediterraneo central. Su combustible, su refineria y la municion de toda la flota estan en el mismo sitio, y en Moscu lo saben.\n\nLa aviacion rusa de largo alcance opera desde campos libios. Espera todo a la vez: regimientos de Backfire repartidos entre tus cascos y el puerto, cazas SEAD a la caza de tus radares antiaereos, y submarinos aprovechando la confusion para colarse.\n\nTu flota es el escudo. A Sicilia no llega nada.\nButtonText=Iniciar mision\nPopupStyle=Intro
Taskforce1ReconMessage=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=SOMBRA SOBRE LA FORMACION\nPrecedence=Priority\nClassification=Confidential\nTemplate=Generic\nBody=Contacto de largo alcance manteniendose sobre la formacion: avion ruso de reconocimiento maritimo, de momento bien fuera de nuestro alcance de tiro.\n\nNo viene a pelear. Viene a contar cascos y a cartografiar nuestras emisiones, y todo lo que ve va directo a quien esta armando el golpe que viene detras.\n\nUsted decide si le tiramos, Comandante. Pero tenga presente que derribar un avion ruso es un titular, y ahora mismo somos los malos de todos los titulares del planeta.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1SubWaveMessage=From=Inteligencia de Senales\nTo=Grupo Naval\nInfo=\nSubj=ACTIVIDAD SUBMARINA BAJO EL ATAQUE\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Mientras sus sensores miraban al cielo, algo se ha movido por debajo.\n\nEstamos captando contactos transitorios dentro de la linea de barrera. Submarinos diesel en silencio, usando el ruido de la batalla aerea para colarse por detras.\n\nNo van a por sus buques. Van a por el puerto.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1BomberWaveMessage=From=Defensa Aerea de Sigonella\nTo=Agrupacion Naval Europea\nInfo=\nSubj=FLASH - REGIMIENTO DE BACKFIRE ENTRANTE\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Ahi los tiene.\n\nBombarderos Tu-22M Backfire entrando desde el sur, alto y rapido, con misiles de lanzamiento a distancia. Dispararan mucho antes de llegar hasta usted y viraran de vuelta a casa.\n\nA los aviones no los va a parar. Pare los misiles. Cada uno que se cuele va contra Augusta.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1CruiseWaveMessage=From=Defensa Aerea de Sigonella\nTo=Agrupacion Naval Europea\nInfo=\nSubj=FLASH - SALVA DE MISILES DE CRUCERO SOBRE AUGUSTA\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Segunda oleada detras de los Backfire: portamisiles lanzando desde fuera de alcance, y sus pajaros no van contra sus buques.\n\nVan a por Augusta. El combustible, la refineria, el polvorin, todo.\n\nComandante, no puede cubrir las dos cosas. Cada interceptor que mantenga sobre la flota es uno que no esta sobre el puerto, y cada uno que mande a la costa deja sus propios cascos desnudos con los bombarderos todavia en el aire.\n\nElija. Ahora.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1SurfaceWaveMessage=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=GRUPO DE SUPERFICIE RUSO ACERCANDOSE\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Contactos de superficie cerrando por el este, y esto no son restos de segunda mano libios. Fragata Proyecto 22350 y destructor 21956, modernos y bien llevados, entrando detras del ataque aereo para rematar lo que quede de nosotros.\n\nEs la ultima carta que le queda a Moscu por jugar hoy. Rompala y Augusta aguanta.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1AmmoDepotLostMessage=From=Mando de Operaciones de la Flota\nTo=Agrupacion Naval Europea\nInfo=\nSubj=POLVORIN DE LA FLOTA DESTRUIDO\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=El polvorin ha desaparecido. Todos los misiles de repuesto que le quedaban a la Fuerza Naval Europea en el Mediterraneo central se han ido en esa bola de fuego.\n\nAguante la linea igualmente, Comandante, pero entienda una cosa: lo que sus buques llevan ahora mismo es lo que van a llevar durante mucho tiempo. No hay mas.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1VictoryMessage=Title=VICTORIA - AUGUSTA AGUANTA\nBody=El ultimo Backfire ha virado de vuelta a casa, los submarinos han roto el contacto y el grupo ruso se retira hacia el este. A tu espalda, Augusta sigue ardiendo por algunos sitios, pero sigue ahi.\n\nCinco marinas se plantaron esta manana en esa linea. Dos de ellas eran neutrales hace una semana.\n\nEuropa acaba de descubrir que puede aguantar.\nButtonText=Continuar\nPopupStyle=Outro
Taskforce1ThreatSpentMessage=Title=VICTORIA - AUGUSTA AGUANTA\nBody=El ultimo Backfire ha virado de vuelta a casa, los submarinos han roto el contacto y el grupo ruso se retira hacia el este. A tu espalda, Augusta sigue ardiendo por algunos sitios, pero sigue ahi.\n\nCinco marinas se plantaron esta manana en esa linea. Dos de ellas eran neutrales hace una semana.\n\nEuropa acaba de descubrir que puede aguantar.\nButtonText=Continuar\nPopupStyle=Outro
Taskforce1DefeatMessage=Title=MISION FALLIDA - AUGUSTA ESTA PERDIDA\nBody=Los depositos de combustible han desaparecido. Sin Augusta no queda en el Mediterraneo central un solo puerto capaz de dar combustible y municion a la Fuerza Naval Europea.\n\nLa flota sigue a flote. Simplemente ya no tiene adonde volver.\nButtonText=Continuar\nPopupStyle=Outro
