Taskforce1IntroMessage=Title=<size=24>Mare Nostrum '28 - Mission 8</size>\nSHIELD OF EUROPE\n<size=24>Augusta, Sicily</size>\nBody=With NATO dead and Washington hostile, Augusta is the only port left in the central Mediterranean where the Combined Naval Force can rearm. Its fuel, its refinery and the fleet's ammunition are all in one place, and Moscow knows it.\n\nRussian long-range aviation is staging out of Libyan fields. Expect everything at once: Backfire regiments splitting between your hulls and the harbour, SEAD fighters hunting your air-defence radars, and submarines using the confusion to slip past you.\n\nYour fleet forms the shield. Nothing gets through to Sicily.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1ReconMessage=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=SHADOWER OVERHEAD\nPrecedence=Priority\nClassification=Confidential\nTemplate=Generic\nBody=Long-range contact holding station above the formation - a Russian maritime reconnaissance aircraft, well outside our engagement envelope for now.\n\nHe is not here to fight. He is counting our hulls and mapping our emitters, and everything he sees is going straight to whoever is arming the strike behind him.\n\nYour call whether we reach for him, Commander. Just be aware that shooting down a Russian aircraft is a headline, and we are already the villains of every headline on earth.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1SubWaveMessage=From=Signals Intelligence\nTo=Task Force\nInfo=\nSubj=SUBSURFACE ACTIVITY UNDER THE RAID\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=While your sensors were pointed at the sky, something moved underneath them.\n\nWe are picking up transient contacts inside the barrier line. Diesel boats, running quiet, using the noise of the air battle to work their way in behind you.\n\nThey are not hunting your ships. They are hunting the harbour.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1BomberWaveMessage=From=Sigonella Air Defence\nTo=European Naval Task Group\nInfo=\nSubj=FLASH - BACKFIRE REGIMENT INBOUND\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Here they come.\n\nTu-22M Backfires inbound from the south at high altitude and high speed, carrying stand-off missiles. They will launch well before they reach you and turn for home.\n\nYou cannot stop the aircraft. You stop the missiles. Every one that leaks through goes into Augusta.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1CruiseWaveMessage=From=Sigonella Air Defence\nTo=European Naval Task Group\nInfo=\nSubj=FLASH - CRUISE MISSILE SALVO INBOUND ON AUGUSTA\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Second wave behind the Backfires - missile carriers, launching from stand-off range, and their birds are not tracking on your ships.\n\nThey are going for Augusta. Fuel, refinery, the depot, all of it.\n\nCommander, you cannot cover both. Every interceptor you hold over the fleet is one that is not over the harbour, and every one you push inshore leaves your own hulls naked with bombers still in the air.\n\nChoose. Now.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1SurfaceWaveMessage=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=RUSSIAN SURFACE GROUP CLOSING\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Surface contacts closing from the east, and these are not Libyan hand-me-downs. A Project 22350 frigate and a 21956 destroyer, modern and well handled, coming in behind the air raid to finish whatever is left of us.\n\nThis is the last card Moscow has to play today. Break it and Augusta stands.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1AmmoDepotLostMessage=From=Fleet Operations Command\nTo=European Naval Task Group\nInfo=\nSubj=FLEET AMMUNITION DEPOT DESTROYED\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=The ammunition depot is gone. Every replacement missile the Combined Naval Force had left in the central Mediterranean went up in that fireball.\n\nHold the line anyway, Commander - but understand that what your ships are carrying right now is what they will be carrying for a long while. There is no more.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1VictoryMessage=Title=VICTORY - AUGUSTA HOLDS\nBody=The last Backfire has turned for home, the boats have broken contact and the Russian group is withdrawing east. Behind you, Augusta is still burning in places - but it is still there.\n\nFive navies stood on that line this morning. Two of them had been neutral a week ago.\n\nEurope has just discovered that it can hold.\nButtonText=Continue\nPopupStyle=Outro
Taskforce1ThreatSpentMessage=Title=VICTORY - AUGUSTA HOLDS\nBody=The last Backfire has turned for home, the boats have broken contact and the Russian group is withdrawing east. Behind you, Augusta is still burning in places - but it is still there.\n\nFive navies stood on that line this morning. Two of them had been neutral a week ago.\n\nEurope has just discovered that it can hold.\nButtonText=Continue\nPopupStyle=Outro
Taskforce1DefeatMessage=Title=MISSION FAILED - AUGUSTA IS LOST\nBody=The fuel depots are gone. Without Augusta there is no port in the central Mediterranean that can fuel and arm the Combined Naval Force.\n\nThe fleet is still afloat. It simply has nowhere left to come home to.\nButtonText=Continue\nPopupStyle=Outro
