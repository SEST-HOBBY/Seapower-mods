Taskforce1GenericTrigger1Message=Title=<size=24>Mare Nostrum '28 - Mision 5</size>\nYUNQUE Y MARTILLO\n<size=24>Costa norteafricana</size>\nBody=La coalicion pasa a la ofensiva. OBJETIVO PRINCIPAL: destruye el deposito de municion del puerto de Argel. Tus Eurofighter llevan armamento de precision para el golpe. El puerto esta defendido por antiaereos, SAM SA-8, radar y lanzadores Shahed, y un grupo naval argelino patrulla la aproximacion. Abre paso y arrasa el deposito.\nButtonText=Iniciar mision\nPopupStyle=Intro
Taskforce1GenericTrigger2Message=Title=VICTORIA\nBody=Deposito de municion destruido. El puerto de Argel queda inutilizado y la ofensiva de la coalicion avanza.\nButtonText=Continuar\nPopupStyle=Outro
Taskforce1RussianrevealMessage=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=CONTACTO DE SUPERFICIE MAYOR - PABELLON IDENTIFICADO\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Contacto de superficie mayor en el puerto: un crucero lanzamisiles clase Slava, con pabellon RUSO. Moscu ya no se esconde tras los argelinos: les entrega sus buques de guerra mas potentes. Esto cambia la guerra.\nButtonText=Continuar\nPopupStyle=NavalMessage
