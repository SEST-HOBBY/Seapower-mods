Trigger1Condition_Condition2AreaLabel=Port of Algiers
Taskforce1GenericTrigger1Message=Title=<size=24>Mare Nostrum '28 - Mission 5</size>\nHAMMER AND ANVIL\n<size=24>North African coast</size>\nBody=The coalition goes on the offensive. PRIMARY OBJECTIVE: destroy the ammunition depot in the port of Algiers. Your Eurofighters are armed with precision-guided munitions for the strike. The port is defended by AAA, SA-8 SAMs, radar sites and Shahed launchers, while an Algerian naval group patrols the approaches. Break through and level the depot.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1GenericTrigger2Message=Title=VICTORY\nBody=Ammunition depot destroyed. The port of Algiers is crippled, and the coalition offensive advances.\nButtonText=Continue\nPopupStyle=Outro
Taskforce1RussianrevealMessage=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=MAJOR SURFACE CONTACT - FLAG IDENTIFIED\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Major surface contact inside the port: a Slava-class guided-missile cruiser flying the RUSSIAN flag. Moscow is no longer hiding behind the Algerians - it is supplying them with some of its most powerful warships. This changes the war.\nButtonText=Continue\nPopupStyle=NavalMessage
