
[Language_en]
Name=07 Neutral Waters
Description=Escort duty over the Tyrrhenian trade route. A US destroyer patrols the same water, and it does not like being watched.
MN7_CorridorLabel_en=Commercial Corridor
MN7_USDestroyerLabel_en=USS Oscar Austin (DDG-79)\nUS Navy - DO NOT ENGAGE
MN7_USCautionLabel_en=Keep clear
MN7_RaidersLabel_en=Hostile fast attack craft
