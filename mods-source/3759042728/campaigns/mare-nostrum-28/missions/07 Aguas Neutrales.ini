Taskforce1LandUnit1ShortNameOverride=Airbase
Taskforce1IntroMessage=Title=<size=24>Mare Nostrum '28 - Mission 7</size>\nNEUTRAL WATERS\n<size=24>Tyrrhenian Sea</size>\nBody=Raids on merchant shipping along the Tyrrhenian route have multiplied. Your group is ordered to patrol the commercial corridor and protect civilian traffic.\n\nOne more thing: a United States destroyer is operating in the same waters. Washington is not your ally, but it is not your enemy either. Keep your distance, give them no reason, and under no circumstances open fire on them.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1USHail1Message=From=USS Oscar Austin (DDG-79)\nTo=European Naval Task Group\nInfo=\nSubj=CHANNEL 16 - DIRECT COMMUNICATION\nPrecedence=Routine\nClassification=Unclassified\nTemplate=Generic\nBody=European task group, this is USS Oscar Austin.\n\nBe advised you are operating in close proximity to a United States warship in international waters. Maintain current separation.\n\nWe are not here to interfere with your patrol and we expect the same courtesy. Oscar Austin, out.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1USHail2Message=From=USS Oscar Austin (DDG-79)\nTo=European Naval Task Group\nInfo=\nSubj=CHANNEL 16 - SECOND CALL\nPrecedence=Priority\nClassification=Unclassified\nTemplate=Generic\nBody=European task group, Oscar Austin again.\n\nYour helicopter has overflown our position twice in the last hour and your sonar is painting us continuously. My orders are to observe, not to be observed.\n\nWhatever your intentions, understand this: Washington reads every line of my log. Ease off. Oscar Austin, out.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1USHail3Message=From=USS Oscar Austin (DDG-79)\nTo=European Naval Task Group\nInfo=\nSubj=CHANNEL 16 - FINAL WARNING\nPrecedence=Priority\nClassification=Confidential\nTemplate=Generic\nBody=European task group, Oscar Austin. Third and final call on this channel.\n\nYour group has held an intercept posture on this ship for over four hours. It is logged, and it has been forwarded to Sixth Fleet.\n\nWhatever game your government thinks it is playing out here, it stops being a game the moment somebody makes a mistake. Break off. Oscar Austin, out.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1TorpedoAlarmMessage=From=USS Oscar Austin (DDG-79)\nTo=ALL STATIONS\nInfo=\nSubj=TORPEDO IN THE WATER\nPrecedence=Flash\nClassification=Unclassified\nTemplate=Generic\nBody=TORPEDO! TORPEDO IN THE WATER!\n\nBearing zero-four-zero, close aboard, high speed, tracking on us -\n\nHARD RIGHT RUDDER! ALL AHEAD FLANK! COUNTERMEASURES AWAY!\n\nBrace for shock, brace for sh-\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1USSunkMessage=From=USS Oscar Austin (DDG-79)\nTo=ALL STATIONS - MAYDAY RELAY\nInfo=\nSubj=SOS - VESSEL SINKING - UNDER ATTACK\nPrecedence=Flash\nClassification=Unclassified\nTemplate=Generic\nBody=MAYDAY. MAYDAY. MAYDAY.\n\nThis is United States Ship Oscar Austin, DDG-79. We have taken a torpedo amidships. The ship is breaking up. Engineering is flooded, we have lost all propulsion.\n\nWE ARE UNDER ATTACK BY EUROPEAN SURFACE UNITS OPERATING IN OUR IMMEDIATE VICINITY. Repeat: we are under attack by European warships shadowing this vessel.\n\nAll hands abandon ship. Position three-seven degrees five-eight minutes north -\n\nMAYDAY, MAY-\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1AftermathMessage=From=Fleet Operations Command\nTo=European Naval Task Group\nInfo=Signals Intelligence\nSubj=BREAK OFF AND WITHDRAW - EXCLUSION ZONE DECLARED\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=1. The Oscar Austin's final transmission named EUROPEAN warships as her attackers. That recording is already playing on every network on earth.\n\n2. The United States has declared a fifty-mile exclusion zone around the wreck. A salvage and rescue group has sailed from Haifa, Israel - and we are tracking a US carrier battle group closing on this position at high speed.\n\n3. BREAK OFF THE PATROL IMMEDIATELY. Make for the nearest friendly port and clear the area before they arrive. Do not interfere with the recovery. Do not approach the survivors. Do not answer their hails.\n\n4. The raiders are no longer your problem, Commander. Whatever is still afloat out there can wait. What cannot wait is your task group being found inside that zone when the Sixth Fleet arrives, because that is the war nobody walks back from.\n\n5. Our sonar recorded no torpedo launch from any of your units. We know that. The problem is that nobody out there is going to want to hear it.\nButtonText=Continue\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1MerchantLostMessage=Title=MISSION FAILED - CIVILIAN LOSSES\nBody=A merchant under your protection has been lost. The one task you were given was to keep the trade route safe, and the sea is now full of wreckage that flies a civilian flag.\nButtonText=Continue\nPopupStyle=Outro
