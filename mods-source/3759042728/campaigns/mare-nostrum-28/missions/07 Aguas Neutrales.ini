Taskforce1IntroMessage=Title=<size=24>Mare Nostrum '28 - Mision 7</size>\nAGUAS NEUTRALES\n<size=24>Mar Tirreno</size>\nBody=Los asaltos a mercantes en la ruta tirrena se han multiplicado. Tu grupo tiene orden de patrullar el corredor comercial y proteger el trafico civil.\n\nUn detalle mas: un destructor de los Estados Unidos opera en la misma zona. Washington no es tu aliado, pero tampoco tu enemigo. Manten las distancias, no le des motivos y bajo ningun concepto abras fuego contra el.\nButtonText=Iniciar mision\nPopupStyle=Intro
Taskforce1USHail1Message=From=USS Oscar Austin (DDG-79)\nTo=Agrupacion Naval Europea\nInfo=\nSubj=CANAL 16 - COMUNICACION DIRECTA\nPrecedence=Routine\nClassification=Unclassified\nTemplate=Generic\nBody=Agrupacion europea, aqui el USS Oscar Austin.\n\nLes informo de que operan en las inmediaciones de un buque de guerra de los Estados Unidos en aguas internacionales. Mantengan la separacion actual.\n\nNo estamos aqui para interferir en su patrulla y esperamos la misma cortesia. Oscar Austin, corto.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1USHail2Message=From=USS Oscar Austin (DDG-79)\nTo=Agrupacion Naval Europea\nInfo=\nSubj=CANAL 16 - SEGUNDA LLAMADA\nPrecedence=Priority\nClassification=Unclassified\nTemplate=Generic\nBody=Agrupacion europea, Oscar Austin de nuevo.\n\nSu helicoptero ha sobrevolado nuestra posicion dos veces en la ultima hora y su sonar nos esta iluminando de forma continua. Mis ordenes son observar, no ser observado.\n\nSean cuales sean sus intenciones, entiendan una cosa: en Washington leen cada linea de mi diario de a bordo. Aflojen. Oscar Austin, corto.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1USHail3Message=From=USS Oscar Austin (DDG-79)\nTo=Agrupacion Naval Europea\nInfo=\nSubj=CANAL 16 - ULTIMO AVISO\nPrecedence=Priority\nClassification=Confidential\nTemplate=Generic\nBody=Agrupacion europea, Oscar Austin. Tercera y ultima llamada por este canal.\n\nSu grupo lleva mas de cuatro horas manteniendo postura de intercepcion sobre este buque. Queda registrado, y ya ha sido remitido a la Sexta Flota.\n\nSea cual sea el juego al que crea estar jugando su gobierno aqui fuera, deja de ser un juego en el momento en que alguien cometa un error. Apartense. Oscar Austin, corto.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1TorpedoAlarmMessage=From=USS Oscar Austin (DDG-79)\nTo=TODAS LAS ESTACIONES\nInfo=\nSubj=TORPEDO EN EL AGUA\nPrecedence=Flash\nClassification=Unclassified\nTemplate=Generic\nBody=TORPEDO! TORPEDO EN EL AGUA!\n\nDemora cero-cuatro-cero, muy cerca, alta velocidad, viene a por nosotros -\n\nTODO A ESTRIBOR! AVANTE TODA! LANZAD SENUELOS!\n\nPreparados para el impacto, preparados para el im-\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1USSunkMessage=From=USS Oscar Austin (DDG-79)\nTo=TODAS LAS ESTACIONES - RETRANSMISION DE SOCORRO\nInfo=\nSubj=S.O.S. - BUQUE HUNDIENDOSE - BAJO ATAQUE\nPrecedence=Flash\nClassification=Unclassified\nTemplate=Generic\nBody=MAYDAY. MAYDAY. MAYDAY.\n\nAqui buque de los Estados Unidos Oscar Austin, DDG-79. Hemos recibido un impacto de torpedo por el traves. El buque se esta partiendo. Maquinas inundadas, sin propulsion.\n\nESTAMOS SIENDO ATACADOS POR UNIDADES DE SUPERFICIE EUROPEAS QUE OPERAN EN NUESTRAS INMEDIACIONES. Repito: estamos bajo ataque de buques de guerra europeos que llevaban horas sombreandonos.\n\nToda la dotacion, abandonen el buque. Posicion tres-siete grados cinco-ocho minutos norte -\n\nMAYDAY, MAY-\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1AftermathMessage=From=Mando de Operaciones de la Flota\nTo=Agrupacion Naval Europea\nInfo=Inteligencia de Senales\nSubj=ROMPA LA PATRULLA Y RETIRESE - ZONA DE EXCLUSION DECLARADA\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=1. La ultima transmision del Oscar Austin senala a buques de guerra EUROPEOS como sus atacantes. Esa grabacion ya esta sonando en todas las cadenas del planeta.\n\n2. Estados Unidos ha declarado una zona de exclusion de cincuenta millas alrededor del pecio. Un grupo de salvamento y rescate ha zarpado de Haifa, Israel, y estamos siguiendo a un grupo de combate de portaaviones estadounidense que se dirige hacia esta posicion a toda maquina.\n\n3. ROMPA LA PATRULLA DE INMEDIATO. Ponga rumbo al puerto amigo mas cercano y despeje la zona antes de que lleguen. No interfiera en el rescate. No se acerque a los supervivientes. No responda a sus llamadas.\n\n4. Los asaltantes ya no son su problema, Comandante. Lo que siga a flote ahi fuera puede esperar. Lo que no puede esperar es que encuentren a su agrupacion dentro de esa zona cuando llegue la Sexta Flota, porque de esa guerra no se vuelve.\n\n5. Nuestro sonar no registro lanzamiento de torpedo alguno desde ninguna de sus unidades. Eso lo sabemos. El problema es que ahi fuera nadie va a querer oirlo.\nButtonText=Continuar\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1MerchantLostMessage=Title=MISION FALLIDA - PERDIDAS CIVILES\nBody=Se ha perdido un mercante bajo tu proteccion. La unica tarea que se te encomendo era mantener segura la ruta comercial, y el mar esta ahora lleno de restos con bandera civil.\nButtonText=Continuar\nPopupStyle=Outro
