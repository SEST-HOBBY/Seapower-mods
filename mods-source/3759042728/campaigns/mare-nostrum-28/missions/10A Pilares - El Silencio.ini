
[Language_en]
Name=10A Pillars - The Silence
Description=You kept the evidence buried. Now Europe faces the Russian fleet AND an American carrier group in the waters south of Cyprus.
MN10A_DeployLabel_en=Task Force Deployment
MN10A_RussianLabel_en=Russian Battle Group
MN10A_USNLabel_en=US Sixth Fleet Carrier Group
Taskforce1IntroMessage=Title=<size=24>Mare Nostrum '28 - Mission 10A</size>\nTHE SILENCE\n<size=24>South of Cyprus</size>\nBody=The sonar logs never left your safe. Washington still believes Europe sank the Oscar Austin, and the Sixth Fleet has moved to cut off the Russian fleet's withdrawal in the Levantine basin.\n\nAhead of you: a Russian battle group that wanted exactly this, and an American carrier group that should never have been your enemy. Break through. Both of them.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1VictoryMessage=Title=VICTORY - THE SEA IS OPEN\nBody=Russian and American wrecks burn on the same water south of Cyprus, and Europe holds its ground in the eastern Mediterranean.\n\nHistory will never know why the Americans died here. You will.\nButtonText=Continue\nPopupStyle=Outro
