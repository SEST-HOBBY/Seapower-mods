[Language_es]
Name=10A Pilares - El Silencio
Description=Enterraste las pruebas. Ahora Europa se enfrenta a la flota rusa Y a un grupo de portaaviones americano al sur de Chipre.
MN10A_DeployLabel_es=Despliegue del Grupo Naval
MN10A_RussianLabel_es=Grupo de Combate Ruso
MN10A_USNLabel_es=Grupo de Portaaviones de la Sexta Flota
Taskforce1IntroMessage=Title=<size=24>Mare Nostrum '28 - Mision 10A</size>\nEL SILENCIO\n<size=24>Al sur de Chipre</size>\nBody=Los registros del sonar nunca salieron de tu caja fuerte. Washington sigue creyendo que Europa hundio al Oscar Austin, y la Sexta Flota se ha desplegado para cortarle la retirada a la flota rusa en la cuenca de Levante.\n\nDelante tienes un grupo de combate ruso que buscaba exactamente esto, y un grupo de portaaviones americano que jamas debio ser tu enemigo. Abrete paso. Por los dos.\nButtonText=Iniciar mision\nPopupStyle=Intro
Taskforce1VictoryMessage=Title=VICTORIA - EL MAR QUEDA ABIERTO\nBody=Restos rusos y americanos arden sobre la misma agua al sur de Chipre, y Europa mantiene su posicion en el Mediterraneo oriental.\n\nLa historia nunca sabra por que murieron aqui los americanos. Tu si.\nButtonText=Continuar\nPopupStyle=Outro
