Trigger1Condition_Condition2AreaLabel=Flota Rusa
Taskforce1GenericTrigger1Message=Title=<size=24>Mare Nostrum '28 - Mision 6</size>\nEL OSO DESPIERTA\n<size=24>Mar Jonico</size>\nBody=Moscu deja de ocultarse: un grupo naval ruso, con crucero lanzamisiles y submarino de escolta, corta la ruta hacia el Egeo. Enfrenta a la flota rusa por primera vez.\nButtonText=Iniciar mision\nPopupStyle=Intro
Taskforce1GenericTrigger2Message=Title=VICTORIA\nBody=Grupo ruso destruido. Pero esto es solo el principio.\nButtonText=Continuar\nPopupStyle=Outro
Taskforce1SubmarineintelwarningMessage=From=Inteligencia de Senales\nTo=Grupo Naval\nInfo=\nSubj=POSIBLE CONTACTO SUBMARINO\nPrecedence=Priority\nClassification=Secret\nTemplate=Generic\nBody=Inteligencia de senales detecta un pico de comunicaciones cifradas en la zona. Podria haber un submarino hostil operando cerca. Mantened el sonar activo, no esta confirmado pero no bajeis la guardia.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1USdestroyersightedMessage=From=Mando Naval\nTo=Flota Europea Combinada\nInfo=\nSubj=\nPrecedence=Priority\nClassification=Secret\nTemplate=Generic\nBody=USS Oscar Austin, clase Arleigh Burke, transitando cerca en patrulla rutinaria. Sin intencion hostil declarada, pero el intercambio es seco y frio. Washington observa esta guerra de cerca, y no con buenos ojos.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1OscarAustindestroyedMessage=Title=MISION FALLIDA\nBody=El USS Oscar Austin ha sido destruido. Washington lo llamara un acto de guerra: la fragil posicion de Europa se derrumba de la noche a la manana.\nButtonText=Continuar\nPopupStyle=Outro
