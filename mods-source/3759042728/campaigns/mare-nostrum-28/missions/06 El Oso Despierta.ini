
[Language_en]
Name=06 The Bear Awakens
Description=Russia intervenes openly. The first clash with a Russian naval group takes place in the Ionian Sea.
MN6_DeployLabel_en=Task Force Deployment
MN6_BattleGroupLabel_en=Russian battle group
MN6_SubAreaLabel_en=Possible submarine
MN6_ThreatLabel_en=Russian axis - southeast
Trigger1Condition_Condition2AreaLabel=Russian Fleet
Taskforce1GenericTrigger1Message=Title=<size=24>Mare Nostrum '28 - Mission 6</size>\nTHE BEAR AWAKENS\n<size=24>Ionian Sea</size>\nBody=Moscow is no longer hiding: a Russian naval group, centered on a guided-missile cruiser and escorted by a submarine, is blocking the route to the Aegean. For the first time, you must face the Russian fleet directly.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1GenericTrigger2Message=Title=VICTORY\nBody=Russian naval group destroyed. But this is only the beginning.\nButtonText=Continue\nPopupStyle=Outro
Taskforce1SubmarineintelwarningMessage=From=Signals Intelligence\nTo=Naval Task Group\nInfo=\nSubj=POSSIBLE SUBMARINE CONTACT\nPrecedence=Priority\nClassification=Secret\nTemplate=Generic\nBody=Signals intelligence has detected a spike in encrypted communications in the area. A hostile submarine may be operating nearby. Maintain sonar watch. The contact is unconfirmed, but do not let your guard down.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1USdestroyersightedMessage=From=Naval Command\nTo=Combined European Fleet\nInfo=\nSubj=\nPrecedence=Priority\nClassification=Secret\nTemplate=Generic\nBody=USS Oscar Austin, an Arleigh Burke-class destroyer, is transiting nearby on a routine patrol. No hostile intent has been declared, but the bridge-to-bridge exchange is curt and cold. Washington is watching this war closely - and not favorably.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1OscarAustindestroyedMessage=Title=MISSION FAILED\nBody=The USS Oscar Austin has been destroyed. Washington will call it an act of war - Europe's fragile position will collapse overnight.\nButtonText=Continue\nPopupStyle=Outro
