[Language_es]
Name=01 Aguas Turbias
Description=Lanchas rapidas norteafricanas escoltan un mercante sospechoso a traves del concurrido Mar de Alboran, ocultandose entre el trafico pesquero y comercial. Identifica y neutraliza la amenaza SIN causar bajas civiles.
MN1_DeployLabel_es=Despliegue del Grupo Naval
MN1_FACLabel_es=Lanchas rapidas hostiles
MN1_MerchantLabel_es=Mercante sospechoso (escoltado)
MN1_ThreatLabel_es=Eje de amenaza - costa norteafricana
Taskforce1GenericTrigger1Message=Title=<size=24>Mare Nostrum '28 - Parte 1</size>\nAGUAS TURBIAS\n<size=24>14 de mayo de 2028</size>\nBody=Inteligencia confirma lanchas rapidas hostiles escoltando un mercante sin identificar por el Mar de Alboran. Se ocultan deliberadamente entre pesqueros, mercantes neutrales y bajo rutas de aviacion civil.\n\nREGLAS DE ENFRENTAMIENTO ESTRICTAS: identifica cada contacto antes de disparar. NO se permite ni una sola baja civil. Un solo error y la mision fracasa.\nButtonText=Iniciar mision\nPopupStyle=Intro
Taskforce1GenericTrigger2Message=From=MOM (Mando de Operaciones)\nTo=Agrupacion Naval Europea\nInfo=\nSubj=MISION CUMPLIDA - ALBORAN\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. Amenaza neutralizada con cero bajas civiles. Trafico y ferry a salvo. Trabajo quirurgico, Comandante.\n\n2. Regrese a Cartagena. Se preveen nuevas operaciones.\nButtonText=Continuar\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1GenericTrigger3Message=Title=MISION FALLIDA - VIOLACION DE ROE\nBody=Se ha destruido una embarcacion o aeronave CIVIL. La prensa internacional ya lo emite y Europa carga con la culpa. La operacion es un desastre politico.\nButtonText=Continuar\nPopupStyle=Outro
