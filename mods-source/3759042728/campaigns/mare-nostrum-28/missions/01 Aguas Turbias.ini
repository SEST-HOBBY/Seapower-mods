
[Language_en]
Name=01 Troubled Waters
Description=North African fast attack craft are escorting a suspicious merchant through the congested Alboran Sea, using fishing and commercial traffic as cover. Identify and neutralize the threat WITHOUT causing civilian casualties.
MN1_DeployLabel_en=Task Force Deployment
MN1_FACLabel_en=Hostile fast attack craft
MN1_MerchantLabel_en=Suspect merchant (escorted)
MN1_ThreatLabel_en=Threat axis - North African coast
Taskforce1GenericTrigger1Message=Title=<size=24>Mare Nostrum '28 - Part 1</size>\nTROUBLED WATERS\n<size=24>14 May 2028</size>\nBody=Intelligence confirms that hostile fast attack craft are escorting an unidentified merchant through the Alboran Sea. They are deliberately concealing themselves among fishing vessels, neutral merchant traffic and civilian air routes.\n\nSTRICT RULES OF ENGAGEMENT: identify every contact before opening fire. NO civilian casualties are permitted. A single mistake will result in mission failure.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1GenericTrigger2Message=From=Fleet Operations Command\nTo=European Naval Task Group\nInfo=\nSubj=MISSION ACCOMPLISHED - ALBORAN\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. Threat neutralized with zero civilian casualties. Commercial traffic and the ferry are safe. Surgical work, Commander.\n\n2. Return to Cartagena. Further operations are expected.\nButtonText=Continue\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1GenericTrigger3Message=Title=MISSION FAILED - ROE VIOLATION\nBody=A CIVILIAN vessel or aircraft has been destroyed. The international press is already broadcasting the incident, and Europe is being held responsible. The operation is a political disaster.\nButtonText=Continue\nPopupStyle=Outro
