
[Language_en]
Name=02 Iron Gate
Description=A North African air and missile offensive, spearheaded by swarms of Shahed-136 drones, threatens traffic in the Strait of Gibraltar. Hold the air-defense line, rely on support from Moron Air Base and bring down the attackers.
MN2_DeployLabel_en=Task Force Deployment
MN2_DefendLabel_en=DEFEND - Algeciras fuel reserves
MN2_MoronLabel_en=Moron Air Base (friendly)
MN2_SA10Label_en=SA-10 (S-300) SAM
MN2_ShahedLabel_en=Shahed launcher fields
MN2_ThreatLabel_en=Air & missile axis - North Africa
Taskforce1LandUnit4NameOverride=Moron Air Base
Taskforce1GenericTrigger1Message=Title=<size=24>Mare Nostrum '28 - Mission 2</size>\nIRON GATE\n<size=24>Strait of Gibraltar</size>\nBody=North Africa has launched a massive drone-and-missile offensive against the strategic fuel reserves at Algeciras. Waves of Shahed-136 loitering munitions and Su-30 strike aircraft are inbound under the cover of an S-300 battery.\n\nYour F-100 anchors the air defense over the depots, supported by Moron Air Base: Eurofighters to engage enemy fighters, and F-18s for SEAD (suppress the S-300) and strike missions (destroy the launchers). PROTECT THE FUEL DEPOTS: losing even one means defeat. Each wave will reveal its launchers on your map.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1GenericTrigger2Message=Title=VICTORY\nBody=The waves are spent and Algeciras still stands. The strategic reserves are safe. Outstanding defense, Commander.\nButtonText=Continue\nPopupStyle=Outro
Taskforce1GenericTrigger4Message=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=SECOND WAVE INBOUND\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Radar reports new launches: a second wave of Shahed-136 drones is lifting off from the North African coast. Hold the air-defense line!\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1GenericTrigger6Message=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=ADDITIONAL FIGHTERS DETECTED\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Radar reports a second formation of Su-30 fighters approaching from the south. Prepare the air defenses!\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1GenericTrigger7Message=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=THIRD WAVE INBOUND\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=New launches from inland: more Shahed drones are inbound toward the task group.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1GenericTrigger8Message=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=FOURTH WAVE INBOUND\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=A final wave of Shahed drones is launching from the North African rear areas. Hold the line!\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1GenericTrigger10Message=Title=MISSION FAILED\nBody=One of the Algeciras fuel depots has been destroyed. The strategic reserve is lost—a catastrophic blow to the European war effort. Mission failed.\nButtonText=Continue\nPopupStyle=Outro
Taskforce1GenericTrigger11Message=Title=VICTORY\nBody=The waves are spent and Algeciras still stands. The strategic reserves are safe. Outstanding defense, Commander.\nButtonText=Continue\nPopupStyle=Outro
