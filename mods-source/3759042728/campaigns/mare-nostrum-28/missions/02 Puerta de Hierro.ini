[Language_es]
Name=02 Puerta de Hierro
Description=Un ataque aereo-misil norteafricano, con enjambres de drones Shahed-136, amenaza el trafico en el Estrecho de Gibraltar. Aguanta la defensa antiaerea, apoyate en la Base Aerea de Moron y derriba a los atacantes.
MN2_DeployLabel_es=Despliegue del Grupo Naval
MN2_DefendLabel_es=DEFENDER - reservas de Algeciras
MN2_MoronLabel_es=Base Aerea de Moron (amiga)
MN2_SA10Label_es=SA-10 (S-300) SAM
MN2_ShahedLabel_es=Lanzadores Shahed
MN2_ThreatLabel_es=Eje aereo-misil - Norte de Africa
Taskforce1LandUnit4NameOverride=Base Aerea de Moron
Taskforce1GenericTrigger1Message=Title=<size=24>Mare Nostrum '28 - Mision 2</size>\nPUERTA DE HIERRO\n<size=24>Estrecho de Gibraltar</size>\nBody=El norte de Africa ha lanzado una ofensiva masiva de drones y misiles contra las reservas estrategicas de combustible en Algeciras. Llegan oleadas de drones merodeadores Shahed-136 y ataques de Su-30, cubiertos por una bateria S-300.\n\nTu F-100 ancla la defensa antiaerea sobre los depositos, con apoyo de la Base Aerea de Moron: Eurofighter contra los cazas, y F-18 para SEAD (suprimir el S-300) y Strike (destruir los lanzadores). PROTEGE LOS DEPOSITOS DE COMBUSTIBLE: perder uno solo es la derrota. Cada oleada revela sus lanzadores en tu mapa.\nButtonText=Iniciar mision\nPopupStyle=Intro
Taskforce1GenericTrigger2Message=Title=VICTORIA\nBody=Las oleadas se han agotado y Algeciras sigue en pie. Las reservas estrategicas estan a salvo. Defensa excepcional, Comandante.\nButtonText=Continuar\nPopupStyle=Outro
Taskforce1GenericTrigger4Message=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=SEGUNDA OLEADA ENTRANTE\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=El radar detecta nuevos lanzamientos: una segunda tanda de drones Shahed-136 despega desde la costa norteafricana. Mantened la defensa antiaerea!\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1GenericTrigger6Message=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=NUEVOS CAZAS DETECTADOS\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Radar detecta una segunda formacion de cazas Su-30 aproximandose desde el sur. Preparad la defensa aerea!\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1GenericTrigger7Message=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=TERCERA OLEADA ENTRANTE\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Nuevos lanzamientos desde el interior: mas drones Shahed en camino hacia el grupo.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1GenericTrigger8Message=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=CUARTA OLEADA ENTRANTE\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Ultima tanda de drones Shahed desde la retaguardia norteafricana. Aguantad la linea!\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1GenericTrigger10Message=Title=MISION FALLIDA\nBody=Un deposito de combustible de Algeciras ha sido destruido. La reserva estrategica se ha perdido, un golpe catastrofico para el esfuerzo belico europeo. Mision fallida.\nButtonText=Continuar\nPopupStyle=Outro
Taskforce1GenericTrigger11Message=Title=VICTORIA\nBody=Las oleadas se han agotado y Algeciras sigue en pie. Las reservas estrategicas estan a salvo. Defensa excepcional, Comandante.\nButtonText=Continuar\nPopupStyle=Outro
