
[Language_en]
Name=09 Counterstroke
Description=The sonar and comms from the Incident triangulated Russia's forward base on the Libyan coast. Escort the amphibious ships in, put the troops ashore, and break the base.
MapSymbol_New1Label_en=Landing Zone - land the French force here
MN9_FleetLabel_en=Russian Naval Group
MN9_AirbaseLabel_en=Enemy Air Base
MN9_SA5Label_en=SA-5 Long-Range SAM
MN9_SA5RangeLabel_en=SA-5 engagement zone
MN9_BaseLabel_en=Russian Forward Base
MN9_DeployLabel_en=Task Force Deployment
Taskforce1IntroMessage=Title=<size=24>Mare Nostrum '28 - Mission 9</size>\nCOUNTERSTROKE\n<size=24>Libyan coast</size>\nBody=Everything that hit Augusta came from here. The sonar recordings and the intercepts from the Tyrrhenian pointed to one place: Russia's forward base on the Libyan coast, the hub of every wave they have thrown at you.\n\nNow you take it back to them. Escort the two Spanish amphibious ships all the way to the beach - alive - and put the French mechanized force ashore. Then break the port: its ships, its fuel, its air.\n\nCrossing into Libya guarantees open war with Moscow. After the Oscar Austin, there was never going to be any other road.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce1SubIntelMessage=From=Signals Intelligence\nTo=Task Force\nInfo=\nSubj=CONTACT IDENTIFIED - NUCLEAR ATTACK SUBMARINE IN PORT\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Commander, we have classified the submarine berthed in the port. It is a Russian nuclear attack boat - the most advanced hull Moscow keeps in this sea, and it is sitting cold at the pier.\n\nCross-check the acoustic signature against the Tyrrhenian recording and it is a match. This is very likely the boat that put a torpedo into the Oscar Austin and left Europe holding the blame.\n\nShe is not going anywhere. If you want the one piece of the truth that is still floating, she is right there.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1BeachheadMessage=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=BEACHHEAD REACHED - DISEMBARKING\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Both amphibious ships are in the landing box and lowering their craft. The French mechanized force is going ashore - Leclercs, VBCI, the lot.\n\nThey are exposed until they form up. Keep the naval gunfire and the air over that beach.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1CoastalCounterMessage=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=RUSSIAN COASTAL DEFENCE COUNTERATTACKING\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Movement off the beach - the Russian coastal defence has woken up. Armour and technicals rolling toward the beachhead to throw the landing back into the sea before it consolidates.\n\nThe French are ashore but light. This is their moment of maximum danger - cover them.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1SubKilledMessage=From=Task Force CIC\nTo=Bridge\nInfo=\nSubj=SUBMARINE DESTROYED AT THE PIER\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=The submarine is gone - broken open at her own pier.\n\nWith her go the only certain answer to what happened in the Tyrrhenian. Nobody will ever raise that hull and read her logs now. But she will never frame anyone again either.\n\nSome things you sink for the truth. This one you sank so it could never lie again.\nButtonText=Continue\nPopupStyle=NavalMessage
Taskforce1VictoryMessage=Title=VICTORY - THE BASE IS BROKEN\nBody=The French flag is on the beach, the Russian warships are on the bottom of their own harbour, and the base that fed every attack against you is burning.\n\nEurope has carried the war onto Russian ground for the first time. There is no ambiguity left now, no incident to argue over - just two sides and one sea between them.\n\nWhatever waits at the Pillars, you will meet it having proven you can take as well as hold.\nButtonText=Continue\nPopupStyle=Outro
Taskforce1DefeatMessage=Title=MISSION FAILED - LANDING LOST\nBody=An amphibious ship is gone, and with her the men she carried. Without both hulls there is no landing, and without the landing there is no counterstroke.\n\nThe base still stands. So does everything it will send next.\nButtonText=Continue\nPopupStyle=Outro
