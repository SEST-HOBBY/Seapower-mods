[Language_es]
Name=09 Contragolpe
Description=El sonar y las comunicaciones del Incidente triangularon la base avanzada rusa en la costa libia. Escolta a los buques anfibios hasta la playa, desembarca las tropas y destruye la base.
MapSymbol_New1Label_es=Zona de Desembarco - desembarca aqui la fuerza francesa
MN9_FleetLabel_es=Grupo Naval Ruso
MN9_AirbaseLabel_es=Base Aerea Enemiga
MN9_SA5Label_es=SA-5 SAM de largo alcance
MN9_SA5RangeLabel_es=Zona de tiro del SA-5
MN9_BaseLabel_es=Base Avanzada Rusa
MN9_DeployLabel_es=Despliegue del Grupo Naval
Taskforce1IntroMessage=Title=<size=24>Mare Nostrum '28 - Mision 9</size>\nCONTRAGOLPE\n<size=24>Costa libia</size>\nBody=Todo lo que golpeo Augusta salio de aqui. Las grabaciones del sonar y las interceptaciones del Tirreno apuntaron a un solo sitio: la base avanzada de Rusia en la costa libia, el nudo de cada oleada que te han lanzado.\n\nAhora se lo devuelves. Escolta a los dos buques anfibios espanoles hasta la playa - vivos - y desembarca la fuerza mecanizada francesa. Luego destruye el puerto: sus buques, su combustible, su aviacion.\n\nEntrar en Libia garantiza la guerra abierta con Moscu. Despues del Oscar Austin, nunca hubo otro camino.\nButtonText=Iniciar mision\nPopupStyle=Intro
Taskforce1SubIntelMessage=From=Inteligencia de Senales\nTo=Grupo Naval\nInfo=\nSubj=CONTACTO IDENTIFICADO - SUBMARINO NUCLEAR DE ATAQUE EN PUERTO\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Comandante, hemos clasificado el submarino atracado en el puerto. Es un submarino nuclear de ataque ruso, el casco mas avanzado que Moscu tiene en este mar, y esta frio en el muelle.\n\nContrasta la firma acustica con la grabacion del Tirreno y coincide. Es muy probablemente el barco que metio un torpedo en el Oscar Austin y dejo a Europa cargando con la culpa.\n\nNo va a ir a ninguna parte. Si quieres el unico pedazo de la verdad que sigue a flote, esta justo ahi.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1BeachheadMessage=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=CABEZA DE PLAYA ALCANZADA - DESEMBARCANDO\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Los dos buques anfibios estan en la zona de desembarco y arriando sus lanchas. La fuerza mecanizada francesa baja a tierra: Leclerc, VBCI, todo.\n\nEstan expuestos hasta que se organicen. Manten el fuego naval y la aviacion sobre esa playa.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1CoastalCounterMessage=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=LA DEFENSA COSTERA RUSA CONTRAATACA\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=Movimiento tierra adentro: la defensa costera rusa ha despertado. Blindados y pickups artillados avanzando hacia la cabeza de playa para tirar el desembarco al mar antes de que se consolide.\n\nLos franceses estan en tierra pero ligeros. Es su momento de maximo peligro: cubrelos.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1SubKilledMessage=From=CIC del Grupo Naval\nTo=Puente\nInfo=\nSubj=SUBMARINO DESTRUIDO EN EL MUELLE\nPrecedence=Flash\nClassification=Secret\nTemplate=Generic\nBody=El submarino ha desaparecido, reventado en su propio muelle.\n\nCon el se va la unica respuesta segura a lo que paso en el Tirreno. Nadie levantara ya ese casco para leer sus registros. Pero tampoco volvera a incriminar a nadie.\n\nHay cosas que hundes por la verdad. A esta la hundiste para que no pudiera volver a mentir.\nButtonText=Continuar\nPopupStyle=NavalMessage
Taskforce1VictoryMessage=Title=VICTORIA - LA BASE ESTA DESTRUIDA\nBody=La bandera francesa esta en la playa, los buques de guerra rusos en el fondo de su propio puerto, y la base que alimentaba cada ataque contra ti arde.\n\nEuropa ha llevado la guerra a suelo ruso por primera vez. Ya no queda ambiguedad, ni incidente que discutir: solo dos bandos y un mar entre ellos.\n\nSea lo que sea lo que espera en las Columnas, llegaras a ello habiendo demostrado que sabes atacar tan bien como resistir.\nButtonText=Continuar\nPopupStyle=Outro
Taskforce1DefeatMessage=Title=MISION FALLIDA - DESEMBARCO PERDIDO\nBody=Un buque anfibio ha desaparecido, y con el los hombres que llevaba. Sin los dos cascos no hay desembarco, y sin desembarco no hay contragolpe.\n\nLa base sigue en pie. Y todo lo que enviara despues, tambien.\nButtonText=Continuar\nPopupStyle=Outro
