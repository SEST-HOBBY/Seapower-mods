; ============================================================================
; *** BANCO DE PRUEBAS - PROTOTIPO DE FINAL RAMIFICADO (Acto III) ***
;
; ESTRUCTURA (5 bloques):
;   Mission10 = diapositiva de decision (intro, explica las dos vias)
;   Mission11 = ELECCION "Callar"  (FreeEvent) -.
;   Mission12 = ELECCION "Hablar"  (FreeEvent) -'  se EXCLUYEN entre si
;   Mission13 = FINAL A (cuelga de la eleccion 11)
;   Mission14 = FINAL B (cuelga de la eleccion 12)
;
; CLAVE DEL MECANISMO: un FreeEvent se COMPLETA con solo abrirlo. Las dos
; elecciones llevan `ExpiresAfterMissionComplete` apuntandose la una a la otra,
; asi que al abrir una, la otra CADUCA y desaparece del mapa -> solo se
; desbloquea el final correspondiente (via Parents). Eleccion vinculante.
; `ExpiresAfterMissionComplete` es oficial: Pacific 03A/03B lo usan (=12).
; `OnCompleteActionJSON` graba una variable persistente con el final elegido
; (oficial: Pacific usa setPersistentOnComplete con "07ASlavaDestroyed").
;
; IsUnlocked=True en la decision para poder probarlo sin jugar M1-M9.
; QUITAR ESTOS 5 BLOQUES ANTES DE PUBLICAR (y NumberOfMissions=15 -> 9 e incluir el bloque M7 (Mission15)).
; ============================================================================

