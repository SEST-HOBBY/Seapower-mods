[File] # Localización de este archivo - necesario para que todo resuelva rutas
Base=campaigns/mare-nostrum-28/campaign.ini

[Campaign] # Datos generales de la campaña
Type=Linear
Difficulty=3
Length=18
DisplayFormat=MapView
; PLACEHOLDER: imagen de fondo de la campana (sustituir por arte propio)
BackgroundImage=campaigns/mare-nostrum-28/art/mn28_intro_map.png

[TaskForceMode] # Reglas de Task Force Mode
Enabled=True

; El buque insignia NO es obligatorio (no pierdes si lo hunden)
TaskForceRequireFlagship=False

; Nombres de la agrupación
DefaultTaskForceName=Agrupacion Naval Europea
TaskForceNameOptions=Agrupacion Naval Europea|Fuerza Naval Europea Combinada|Task Group Alboran|SNMG-Sur

; Comandante (naciones, rangos, descuentos) y roster de unidades
CommanderSettingsFile=commander_settings.ini
RosterFile=player_task_force_roster.ini

; Dificultad
TaskForceDifficultyPresets=Easy|Normal|Hard
DefaultTaskForceDifficultyPreset=Normal

; Los barcos vienen con su ala aerea gratis
ShipIncludesAirwing=True

; DISENO: TODAS las unidades tienen COSTE (escala v3 "Bigs2013", ver roster). Progresion por
; DESBLOQUEO (cada mision abre unidades/naciones) + PRESUPUESTO (StartingPoints + recompensas).
; PointCap = valor maximo de la fuerza ACTIVA (ya no hay tope de barcos por mision: el
; presupuesto es el unico limite). Calibrado para ~10 misiones y un grupo aeronaval al final.
StartingPoints=80
PointCap=600

; Rescate: 100 supervivientes = +1 punto
CSARPointModifier=100

; Loadouts disponibles desde el principio (simplificado para el arranque)
PurchaseLoadouts=False

; Tripulaciones
CrewSkillInitial=Trained
CrewSkillThresholds=Trained:1|Seasoned:2|Veterans:5|Ultra:9

; Devolucion de puntos al retirar unidades
UnitDecommissionPointReturnModifier=0.25
UnitDismissPointReturnModifier=0.5

; EMBARGO DE EEUU: reparacion cara y limitada (refuerza "estais solos")
DamageToAllowRepair=Light,Moderate
DamageToDisallowRepair=Heavy
RepairPointsCost=Light,0.15|Moderate,0.30

[TaskForceModeDifficulty_Easy]
Name=Facil
StartingPoints=105
PointCap=650
ShipIncludesAirwing=True
RepairCostModifier=0.75
UnitDecommissionPointReturnModifier=0.35
UnitDismissPointReturnModifier=0.65
CrewSkillInitial=Trained

[TaskForceModeDifficulty_Normal]
Name=Normal
StartingPoints=80
PointCap=600
ShipIncludesAirwing=True
RepairCostModifier=1
UnitDecommissionPointReturnModifier=0.25
UnitDismissPointReturnModifier=0.5
CrewSkillInitial=Trained

[TaskForceModeDifficulty_Hard]
Name=Dificil
StartingPoints=55
PointCap=515
ShipIncludesAirwing=True
RepairCostModifier=1.25
UnitDecommissionPointReturnModifier=0.15
UnitDismissPointReturnModifier=0.35
CrewSkillInitial=Green

[Language_es]
Name=Mare Nostrum '28
Description=2028. Estados Unidos da la espalda a Europa: embargos, retirada de la OTAN y restricciones comerciales. Rusia y China aprovechan el vacio. En el Magreb, una coalicion hostil respaldada por Moscu hostiga el trafico maritimo del sur de Europa.<LineBreak/><LineBreak/>Sin el paraguas americano, las marinas europeas improvisan una Fuerza Naval Combinada. Empiezas con una pequena agrupacion espanola y, mision a mision, sumas a Francia, Italia, Alemania y Holanda hasta una guerra abierta con Rusia.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTA</Span>: Campana de Task Force Mode. Construye y personaliza tu agrupacion; las perdidas y el gasto de munición se arrastran de mision en mision. El reabastecimiento es limitado por el embargo: usa tus recursos con cabeza.

[Language_en]
Name=Mare Nostrum '28
Description=2028. The United States turns its back on Europe: embargoes, NATO withdrawal and trade restrictions. Russia and China exploit the vacuum. In the Maghreb, a Moscow-backed hostile coalition harasses southern Europe's shipping.<LineBreak/><LineBreak/>Without the American umbrella, Europe's navies improvise a Combined Naval Force. You start with a small Spanish task group and, mission by mission, add France, Italy, Germany and the Netherlands until open war with Russia.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: Task Force Mode campaign. Losses and weapon expenditure carry across missions. Resupply is limited by the embargo - spend wisely.

[Missions] # Debe coincidir con el numero de bloques [MissionN]
; CADENA COMPLETA (orden por Parents, no por indice): Prologo(1) -> M1(2) -> M2(3) -> M3(4)
; -> interludio ActoII(8) -> M4(5) -> M5(6) -> M6(7) -> M7(10) -> interludio ActoIII(11)
; -> M8(12) -> M9(13) -> "Continuara"(9).
; PENDIENTE: M10 Pilares (final ramificado) - los .ini 10A/10B existen en missions/ pero
; NO estan cableados aqui (prototipo retirado). Cablear cuando se termine el Acto III.
NumberOfMissions=19

