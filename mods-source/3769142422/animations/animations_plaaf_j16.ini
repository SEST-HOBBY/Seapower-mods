; Original FBX: Dummy017, -95 degrees around runtime X, frames 1-151.
; Mesh is pre-offset +5 degrees so Sea Power only evaluates +5..-90.
[Nose_Gear_Up]
NumberOfSteps=2
Time1=0
RotationX1=5
Smoothness1=EaseInOut
Time2=3
RotationX2=-90
Smoothness2=EaseInOut

[Nose_Gear_Down]
NumberOfSteps=2
Time1=0.6
RotationX1=-90
Smoothness1=EaseInOut
Time2=3.6
RotationX2=5
Smoothness2=EaseInOut

; Original FBX Dummy019: axle-sleeve strut, 0 to +50 degrees around X.
[Nose_Gear_Strut_Up]
NumberOfSteps=2
Time1=0
RotationX1=0
Smoothness1=EaseInOut
Time2=3
RotationX2=50
Smoothness2=EaseInOut

[Nose_Gear_Strut_Down]
NumberOfSteps=2
Time1=0.6
RotationX1=50
Smoothness1=EaseInOut
Time2=3.6
RotationX2=0
Smoothness2=EaseInOut

; Sea Power's runtime X handedness is opposite the author FBX controller here:
; use -35 so the sleeve rotates toward the fuselage rather than downward.
[Nose_Gear_Axle_Sleeve_Up]
NumberOfSteps=2
Time1=0
RotationX1=0
Smoothness1=EaseInOut
Time2=3
RotationX2=-35
Smoothness2=EaseInOut

[Nose_Gear_Axle_Sleeve_Down]
NumberOfSteps=2
Time1=0.6
RotationX1=-35
Smoothness1=EaseInOut
Time2=3.6
RotationX2=0
Smoothness2=EaseInOut

; LGFF is a simple long-edge door.  Its hinge runs along the aircraft Z axis;
; do not use the FBX controller's imported global-Y conversion.
[Nose_Gear_Door_Open]
NumberOfSteps=2
; Gear-down order: open the door first, then deploy the wheel assembly.
Time1=0
RotationZ1=-90
Smoothness1=EaseInOut
Time2=0.6
RotationZ2=0
Smoothness2=EaseInOut

[Nose_Gear_Door_Close]
NumberOfSteps=2
Time1=3.0
RotationZ1=0
Smoothness1=EaseInOut
Time2=3.6
RotationZ2=-90
Smoothness2=EaseInOut
