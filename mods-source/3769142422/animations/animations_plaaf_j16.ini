; do not close until the gear has reached its end position.
[Main_Large_Door_252_Open]
NumberOfSteps=2
Time1=0
RotationY1=-70.000006501
Smoothness1=EaseInOut
Time2=0.65
RotationY2=0
Smoothness2=EaseInOut

[Main_Large_Door_252_Close]
