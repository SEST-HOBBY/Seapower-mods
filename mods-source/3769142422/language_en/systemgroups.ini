[SystemNames]
J-16_AESA=J-16 AESA Fire-Control Radar||Active electronically scanned array fire-control radar for air search, tracking, and weapon guidance.
J-16 EOTS/IRST=J-16 EOTS/IRST||Electro-optical targeting and infrared search-and-track system for passive detection, identification, tracking, and night observation.
J16_RKL15_RWR=K/RKL-15 Radar Warning Receiver||J-16 airborne radar warning receiver that passively analyzes hostile radar emissions for threat warning and bearing information.
J16_ESM=J-16 Electronic Support Measures||Passively intercepts and analyzes electromagnetic emissions to assist detection and localization without active radiation.
J16_RKZ15_ECM=K/RKZ-15 Defensive ECM Suite||J-16 defensive electronic countermeasures suite with four jamming channels for self-protection against hostile radars.
J16_Gun_30mm=Type 30-4 Cannon||Copy of the Soviet 30mm single-barrel cannon, fitted to the J-11 family, J-15 and J-16; 150 rounds; used for close-in air combat and strafing.
J16_RKZ930A_ECM=K/RKZ-930A ECM Suite||J-16D airborne electronic countermeasures system; covers VHF to Ka band with four jamming channels for escort support jamming.
YINGS-IIIA=YINGS-III EOTS||Combines electro-optical targeting and infrared search for target identification, tracking, and laser ranging.
YINGS-IIIA_Designator=YINGS-III Laser Designator||Provides target illumination for laser-guided weapons, day or night.
