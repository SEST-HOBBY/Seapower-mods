[AmmunitionNames]
plaaf_j16_yj-80=AKF-80,,Air-to-Surface Missile,The AKF-80 (YJ-80) is a Chinese air launched supersonic air to surface missile, the domestic Kh-29 fitted with an infrared seeker in place of the original laser or TV guidance, with a heavy warhead.
plaaf_j16_pl-15=PL-15,,AAM,The PL-15 is a medium-to-long-range active radar homing air-to-air missile in service with the People's Liberation Army Air Force.
plaaf_j16_pl-10=PL-10,,AAM,The PL-10 is a short-range infrared air-to-air missile.
plaaf_j16_pl-17=PL-17,,AAM,The PL-17 is a long-range active radar homing air-to-air missile fielded by the People's Liberation Army Air Force. It is primarily used against hostile auxiliary and support aircraft at very long standoff ranges, that include tankers, AWACSs, and bombers. The missile possesses a very long range and high terminal speed, but it suffers from inferior maneuverability, making it unsuitable for engaging very maneuverable targets.
j16_ls-6_250=LS-6(250kg),Glide Bomb,Land Attack,The LS-6 extended-range glide bomb is a 250-kilogram GPS-guided glide weapon composed of a low-drag general-purpose bomb fitted with a turbojet, glide kit and guidance components, providing stand-off precision strike capabilities.
j16_hq19=HQ-19,,Anti-satellite interceptor,
plaaf_j16_yj-91=YJ-91,,ARM,The YJ-91 is an anti-radiation missile (ARM) in service with the People's Liberation Army Air Force (PLAAF), and is the domestic Chinese variant of the Russian Kh-31P anti-radiation missile.
plaaf_j16_yings-iii=YINGS-III,,Targeting Pod,An electro-optical targeting and laser-designation pod providing target identification and illumination for precision-guided weapons.
plaaf_j16_ld-8a=LD-8A,,Anti-Radiation Missile,The LD-8A is a general-purpose anti-radiation missile derived from the PL-15 air-to-air missile airframe.
j16_cal_30mm=30-4 Cannon Round,,Autocannon Round,30×165mm round for the Type 30-4 cannon, used for both air-to-air and strafing fire.
