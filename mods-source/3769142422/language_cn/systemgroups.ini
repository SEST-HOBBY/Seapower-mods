[SystemNames]
J-16_AESA=歼-16 AESA 火控雷达||歼-16的有源相控阵火控雷达，具备空中搜索、跟踪与制导能力。
J-16 EOTS/IRST=歼-16 光电瞄准/红外搜索系统||机载光电与红外搜索系统，用于被动发现、识别与跟踪目标，并提升夜间观察能力。
J16_RKL15_RWR=K/RKL-15 雷达告警接收机||歼-16机载雷达告警接收机，被动接收并分析敌方雷达辐射，为飞行员提供威胁告警与方位信息。
J16_ESM=歼-16 电子支援措施系统||被动侦收与分析电磁辐射，在不主动发射信号的情况下辅助发现和定位目标。
J16_RKZ15_ECM=K/RKZ-15 防御电子对抗系统||歼-16机载防御电子对抗系统，具备4个干扰通道，可对敌方雷达实施自卫干扰。
J16_Gun_30mm=30-4型航炮||苏制30毫米单管航炮的仿制型号，用于近距空战与对地扫射。
J16_RKZ930A_ECM=K/RKZ-930A 电子对抗系统||歼-16D机载电子对抗系统，覆盖VHF至Ka波段，具备4个干扰通道，可实施随队支援干扰。
YINGS-IIIA=鹰隼-III 光电瞄准系统||集成了光电瞄准与红外搜索功能，用于目标识别、跟踪与激光测距。
YINGS-IIIA_Designator=鹰隼-III 激光指示器||为激光制导武器提供目标照射，具备昼夜工作能力。
