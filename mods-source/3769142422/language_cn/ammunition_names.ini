[AmmunitionNames]
plaaf_j16_yj-80=鹰击-80,,空对地导弹,鹰击-80是中国的空中发射超音速空对面导弹，是 Kh-29 改装红外导引头的国产型号，取代原有的激光与电视制导，具有重型弹头。
plaaf_j16_pl-15=PL-15,折叠弹翼,空对空,霹雳-15是中国空军装备的中远程主动雷达制导空空导弹，采用双脉冲固体火箭发动机，有源相控阵雷达导引头和双向数据链，具备长射程，高末端速度和优异的抗干扰性能。
plaaf_j16_pl-10=PL-10,,近距空对空,霹雳-10近距格斗导弹。
plaaf_j16_pl-17=PL-17,,远程空对空,霹雳-17是中国空军装备的远程主动雷达制导空空导弹，主要用于在超远距离上攻击地方辅助和支援飞机目标，包括加油机，预警机，轰炸机等，具有射程远速度快的特点。
j16_ls-6_250=LS-6 250千克,,滑翔炸弹,雷石-6增程型是使用滑翔套件并加装涡轮喷气发动机改装的250公斤通用航空炸弹，GPS制导，主要用于打击固定地面目标。
j16_hq19=红旗-19,,反卫星拦截弹,
plaaf_j16_yj-91=YJ-91,,反辐射导弹,鹰击-91是中国空军装备的反辐射导弹，是引进自俄罗斯的Kh-31P反辐射导弹的国产版本。
plaaf_j16_yings-iii=鹰隼-III,,瞄准吊舱,光电瞄准与激光指示吊舱，为精确制导武器提供目标识别和照射。
plaaf_j16_ld-8a=LD-8A,,反辐射,雷电-8A反辐射导弹是利用霹雳-15空空导弹构型改进而来的通用反辐射导弹。
j16_cal_30mm=30-4型航炮炮弹,,航炮炮弹,30×165毫米炮弹，供30-4型航炮使用，兼顾对空与对地。
