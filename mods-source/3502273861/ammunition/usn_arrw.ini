#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# AGM-183A
# Users: 
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
LandAttackCapability=All // can be  All, Installation, Mobile, ShoreTargetsOnly

CIWSDefenceBonus=8                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers

Mass=850                              // in kg. Used for aircraft
AmmoPoints=6350                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=7  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=VeryTiny
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=22  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=300               // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=45
ImpactSize=Medium                 // Impact size, can be small, medium, large, verylarge
Penetration=Always                   // can be minor, moderate, heavy, always
FuzeType=0

[OnBoardSystems]
ECM=AN/ALQ-183A

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=2.4                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=35.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=75.0                      // Climb angle for initial loft
MaxLoftAlt=99000.0                     // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalVelocity=4000
TerminalApproachDist=22.0              // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalDiveDistance=22                 // in N. miles.
SupportsBanking=True                   // if the missile will bank when turning
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#========================================= Launch stats ============================================================
MaxVelocity=10,648                       // Maximum speed in knots
VelocityBleed=0.6                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime                    
Acceleration=16.0                      // Acceleration factor
AccelerationTime=75.7                  // Time until start of the velocity bleed, in seconds
MaxTurnRate=8.0                       // Maximum turnrate in degrees per second                 
MinLaunchRange=132.0                     // Minimum launch range in nautical miles
MaxLaunchRange=1375                    // Maximum launch range in nautical miles
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=5.00                // Circular error radius in meters (fuse 40 with CEP 106 = 20%)
CircularErrorRadiusLarge=2.5         // Circular error vs 'Large' aircraft (fuse 40 with CEP 10.51 = 85%)
#Homing
SeekerGain=48.0                        // Seeker gain in dB
SeekerFOV=180.0                         // Seeker field-of-view in degrees
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
SeekerPassiveRange=60                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=55.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=100.0                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.95          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.85                    // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/183/
ResourcesRoot=arrw.obj
ResourcesMesh=Glider
ResourcesMeshForLaunch=agm-183
ResourcesMeshSwitchTime=35.0  // time in seconds after launch to switch from launch mesh to main mesh
ResourcesMaterial=arrw_mat.ini
############################################################

NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.072

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.095
InFlightEffectStartTime=6  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
HitShipExplosionRotation=0,25,0
HitAirExplosionClass=LargeMissileExplosions
HitAirExplosionRotation=0,25,0
HitDefaultExplosionClass=LargeMissileExplosions
HitDefaultExplosionRotation=0,25,0
HitWaterSplashClass=LargeWaterSplashes
HitWaterSplashRotation=0,25,0

DebrisTrail=effects/aircraft/emitters/helicopterfireeffect
DebrisSplashClass=MediumWaterSplashes
ExplosionOverwaterSplash=False

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043