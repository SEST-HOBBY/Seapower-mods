################################################# U S A #################################################
[AN/APG-79]
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=Ture      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface               // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True  // True means the radar can see ground objects
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=24       // if applicable number of targets it can track simultaneously
WeaponChannels=18       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-60,60|-60,60      // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=0.97     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0.6           // min range in km
MaxRange=268.2           // max range in km
MinAltitude=2          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=60480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=5.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.8          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=58.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=20.0         // output peak power in kW
RequiresAlignment=True// 

