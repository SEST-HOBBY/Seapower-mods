usn_arrw=AGM-183A,ARRW,空射高超音速导弹,AGM-183A，空射快速响应武器，是洛克希德马丁研发的一款高超音速防区外导弹，火箭助推阶段能达到5马赫，大气外锥形弹头能达到20马赫。从2020年研发至今几经波折，但最终敲定于2026年花费3.871亿美元为美国空军购买第一批。
plan_yj-18=鹰击-18,巡航导弹,ASW,鹰击18改装自进口俄罗斯的3M-54E口径巡航导弹，亚音速巡航，末端三马赫冲刺命中目标
