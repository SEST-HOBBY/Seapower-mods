[Seaspray] #Lynx Radar
Kind=Radar
Type=DirectedSearch     // Classes can be "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface           // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=1       // if applicable number of targets it can track simultaneously
WeaponChannels=4       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=60                 // revolutions per minute
MinRange=0.2           // min range in km
MaxRange=75.0          // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=0          // max altitude in meters, relevant for air, unused for surface
RangeResolution=50.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=2.0          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=33.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=25.0         // output peak power in kW
ModuleType=SmallSensor

[Seaspray7000E] #Lynx Radar
Kind=Radar
Type=Search     // Classes can be "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface           // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=50       // if applicable number of targets it can track simultaneously
WeaponChannels=4       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=0                 // revolutions per minute
MinRange=0.1           // min range in km
MaxRange=100.0          // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=0          // max altitude in meters, relevant for air, unused for surface
RangeResolution=2.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.0          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=64.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=125.0         // output peak power in kW
ModuleType=SmallSensor

[MX-15HDi] #Optical aiming system
Kind=Visual
#Infrared
VIDRangeMultiplier=20           // Target VID range multiplied by this for identification check
MaxRangeMultiplier=21           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.99          // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.99             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

[Wildcat_Laser] #Laser
Kind=LaserDesignator
MaxRange=20.0                       // max distance in nm
NightCapable=True                   // is the designator can be used in low-visibility conditions
TargetChannels=1                   // number of targets that can be tracked at once
WeaponChannels=20                // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0,360                           // Field of View of the designator
