[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.1                     // in meters
Beam=3.2                       // in meters
Range=250                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=7  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

#[Tacview]
#Name=M109
#Tag=Ground+Vehicle+Artillery

[Physics]
HorsePower=405
Mass=23.8                      // in tons

MaxForwardVelocity=35          // in knots
MaxBackwardVelocity=5          // in knots
Braking=8                      // knots/sec
TurnRate=15                    // in degrees per second

[AI]
UnitScoreValue=1.0              // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destructable
Integrity=7

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=2

[WeaponSystem1]  #Mark8
Type=Gun
SystemName=2A65_2S19
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-2,45
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
VIDIncrease=10  // In miles. Flat base VID increace when firing.

[WeaponSystem2]  #Mark8
Type=Gun
SystemName=2A65_2S19_LASER
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-2,45
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun2
#Effects
#Other
VIDIncrease=10  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=1
Ammunition1=wp_2s19_152mm
Ammunition1_Count=40  // plus 4 in the gun
ModuleType=MediumMagazine

[WeaponMagazineGun2]
NumberOfAmmunitionTypes=1
Ammunition1=wp_2s19_152mm_laser
Ammunition1_Count=12  // plus 4 in the gun
ModuleType=MediumMagazine

[Models]

############################################################
ResourcesFolder=assets/models/land_units/2s19/
ResourcesRoot=2s19.obj
ResourcesMesh=body
ResourcesMaterial=2s19_mat.ini

[Submodels]
Turret=Turret
Gun=Gun

[Turret]
Mesh=turret
Material=2s19_mat.ini
Position=0,0.038894,-0.005317

[Gun]
Mesh=gun
Material=2s19_mat.ini
Parent=Turret
Position=0.020524,-0.009715,0.017327

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.02,0
Rotation=0,0,0
Scale=0.045,0.04,0.09

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default