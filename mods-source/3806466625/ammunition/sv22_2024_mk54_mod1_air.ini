# SV-22 2024 prototype: uniquely named gameplay data; native visual assets only.
# Public dimensions/mass/IOC: US Navy Mk 54 fact file (updated 2023-11-15).
# Mod 1 IOC 2023; no claim of actual Mk 54 certification on a V-22.
# Speed/range/depth/seeker/accuracy/reliability/ECCM below are explicit gameplay
# estimates. Public evidence does not provide a complete real performance table.
[General]
Type=Torpedo
TargetType=ASW
Mass=275.33
AmmoPoints=550.66
IOCDate=2023
SupplyCategory=AirTorpedo
AirLaunched=True
DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0
DecalClass=Standard
FrontalArea=0.0789
SideArea=0.7751
BottomArea=0.7761

[SensorData]
IRSignature=VeryTiny
RCS=VerySmall
BaseNoise=115
FlowNoise=0.5
CavitationNoise=0
TargetReflectionStrength=1

[Physics]
ParachuteSlowDown=0.99
ParachuteEndVelocity=100
MaxAngleWithParachute=80

[WarheadData]
WarheadType=0
# 100 lb / 45.36 kg HE is public; Power uses that mass as a game scalar,
# not a measured TNT-equivalent yield.
Power=45.36
ImpactSize=Medium
Penetration=Always
FuzeProximityDistance=8
SmartFuse=True

[Guidance]
GuidanceType=10
MidCourseCorrection=0
InitialFlightPhaseDuration=2
TerminalVelocity=45
Acceleration=10
MaxTurnRate=12
SpeedSettings=35,45
SpeedSettingRanges=8,6
MinLaunchRange=0.5
MinLaunchAltitude=100
MaxLaunchAltitude=1000
# Conservative prototype rear-ramp release envelope, not HAAWC.
EjectVelocity=8
MaxDepth=2000
SeekerReliability=0.95
WarheadReliability=0.97
SeekerFOV=120
SeekerActiveRange=2
SeekerPassiveRange=2
SeekerGain=38
SeekerOutputPower=215
AntiCountermeasuresBonus=0.35
MinAfterSpoofEffectTime=3
MaxAfterSpoofEffectTime=12
FractionOfRangeToActivateSeeker=0.8
SearchMode=3
SearchVelocity=35
ReattackMode=1
ReattackCircleDegreesPerSecond=12
SpiralSearchParams=65,1500
SpiralSearchRadius=0.4
SpiralSearchAngle=6
DefaultDepth=300

[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_mk46
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_mk46_mat
AssetBundleMeshHullCollider=usn_mk46_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/usn_mk46/
ResourcesRoot=usn_mk46_mod2
ResourcesMesh=usn_mk46_mod2
ResourcesMaterial=usn_mk46_mod5_mat
ResourcesMeshForLaunch=usn_mk46_mod2_capless_dummy
ResourcesMeshSwitchTime=0.25  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=3

SubModel1=Propeller_Left
SubModel2=Propeller_Right
SubModel3=Stabilizer

[Propeller_Left]
Type=Propulsion
RotationDirection=Left
Mesh=usn_mk46_mod2_prop_l
Rotation=0,90,-90

[Propeller_Right]
Type=Propulsion
RotationDirection=Right
Mesh=usn_mk46_mod2_prop_r
Rotation=0,90,-90

[Stabilizer]
Type=Stabilizer
Mesh=usn_mk46_mod2_capless_stabilizer

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
DudExplosionClass=SmallFlakExplosions
ParachuteEffect=effects/weapons/emitters/parachute_square
ParachuteEffectPosition=0,0,-0.02
BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/aswtorpedo_cavitation_particle
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0

HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes
ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb
############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
PropAudioClip=audio/weapons/torpedo
PropAudioRollOff=Logarithmic
PropAudioDistance=1,20
PropAudioPitch=1.0
PropAudioPosition=0,0,0
PropAudioAudibility=Below
SonarAudioClip=audio/environment/Sonar-MF
SonarAudioPosition=0,0,0
SonarAudioRollOff=Logarithmic
SonarAudioDistance=1,50
SonarAudioPitch=1
SonarAudioVolume=1
SonarAudioAudibility=Below

