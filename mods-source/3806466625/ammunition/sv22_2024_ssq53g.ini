# AN/SSQ-53G DIFAR: independent SV-22 2024 data; original visual resources only.
# Mass/life/launch envelope and depth options: Ultra Maritime product sheets.
# IOCDate=2020 is a scenario availability gate, not a claimed actual IOC year.
# 30 nm receiver range, release ejection and accuracy are game assumptions.
[General]
Type=Sonobuoy
TargetType=ASW
LifeTime=28800
Mass=9.5
AmmoPoints=11.875
IOCDate=2020
AirLaunched=True
DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0
DecalClass=Standard
FrontalArea=0.6649
SideArea=0.6421
BottomArea=0.2059

[SensorData]
IRSignature=VeryTiny
RCS=VerySmall

[Physics]
ParachuteSlowDown=0.99
ParachuteEndVelocity=100
TrimDepth=-0.004

[WarheadData]
WarheadType=-1

[OnBoardSystems]
Sonar=SV22_2024_SSQ53G_Sonar
SonarDepth=90
TransmitterRange=30

[Guidance]
GuidanceType=0
MidCourseCorrection=0
InitialFlightPhaseDuration=1
EjectVelocity=8
MinLaunchRange=0
MaxLaunchRange=100
# Public sonobuoy launch envelope; platform rear-ramp trials remain pending.
MinLaunchAltitude=40
MaxLaunchAltitude=30000
MaxTurnRate=1
CircularErrorRadius=10

[Models]
#AttachmentPosition=0,0,-0.001
