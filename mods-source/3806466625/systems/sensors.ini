# Gameplay avionics using native sensor schemas; not a real-aircraft equipment claim.
# Modernized search parameters use the native AN/APS-128 range/gain baseline.
# MaxRange is a radar limit, not a guaranteed detection distance.
[MV22_SearchRadar]
Kind=Radar
Type=DirectedSearch
HasDataLink=True
CanDetectLandTargets=True
Role=Surface
Mode=Illuminate
ViewArcs=-90,90|-80,45
MinRange=0.05
MaxRange=220
MinAltitude=0
MaxAltitude=0
RangeResolution=15.0
BeamWidth=0.5
Gain=51
Frequency=X-Band
PeakPower=10.0
CanDetectPeriscope=True

[MV22_FLIR]
# Matches installed F/A-18F Block III AN/ASQ-228 ATFLIR IRIS optical parameters.
# Native aircraft Type=Infrared enables infrared detection; no camera UI changes.
Kind=Visual
UseIRValues=True
VIDRangeMultiplier=3.0
MaxRangeMultiplier=5.5
LookDownMultiplier=0.95
NightVisionLevel=1.0

[MV22_RWR]
Kind=ESM
Type=RWR
Gain=15
HasDataLink=True
AngularResolution=5.0
Frequencies=L-Band,S-Band,C-Band,X-Band,Ku-Band

[MV22_DECM]
Kind=ECM
Frequencies=L-Band,S-Band,C-Band,X-Band,Ku-Band
Type=Defensive
JamChance=0.55

