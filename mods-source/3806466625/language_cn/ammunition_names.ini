[AmmunitionNames]
sv22_2024_mk54_mod1_air=Mk 54 Mod 1,SV-22 2024,航空反潜鱼雷,Mk 54 Mod 1是航空投放的轻型反潜鱼雷，使用主动和被动声呐搜索水下目标。可在搜索与攻击阶段采用不同航速，并具备再攻击和抗声学诱饵能力，用于打击已定位的潜艇。
sv22_2024_ssq53g=AN/SSQ-53G,SV-22 2024,被动DIFAR浮标,AN/SSQ-53G是定向频率分析和记录（DIFAR）型被动声呐浮标。通过接收水下目标的辐射噪声提供方位信息，适合布设搜索阵列和持续监视潜艇活动，并将探测信息传送给反潜飞机。
sv22_2024_ssq62f=AN/SSQ-62F,SV-22 2024,主动DICASS浮标,AN/SSQ-62F是定向指令主动声呐系统（DICASS）型声呐浮标。通过发射声脉冲测定水下目标的距离和方位，通常配合被动浮标使用，对已发现的潜艇进一步定位并为反潜攻击提供依据。
