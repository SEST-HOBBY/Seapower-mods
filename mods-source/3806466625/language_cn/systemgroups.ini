[LanguageResources]
MV22_SearchRadar=搜索雷达|广角海面与地面搜索，支持数据共享。
MV22_FLIR=先进光电|昼夜红外探测、目标识别与下视搜救。
MV22_RWR=雷达告警|宽频段雷达侦收与方位告警。
MV22_DECM=防御干扰|宽频段防御电子干扰。
SV22_2024_RearRampLauncher=后舱门反潜投放系统|通过后货舱门依次投放机舱内储存的轻型反潜鱼雷和声呐浮标，支持搜索布标与潜艇攻击。
SV22_2024_SSQ53G_Sonar=AN/SSQ-53G DIFAR（SV-22）|AN/SSQ-53G浮标的被动定向声呐，接收水下目标的辐射噪声并提供方位信息，用于潜艇初步搜索和持续监视。
SV22_2024_SSQ62F_Sonar=AN/SSQ-62F DICASS（SV-22）|AN/SSQ-62F浮标的主动定向声呐，通过声脉冲测定目标的距离和方位，用于进一步定位已发现的潜艇。

SV22_2024_ALFS=ALFS 低频吊放声呐（SV-22 / 2024）|ALFS是一套低频主被动吊放声呐，可在飞机低空悬停时将探头下放至水下，执行潜艇搜索和定位，并通过数据链共享探测信息。
