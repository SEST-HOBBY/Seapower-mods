GroundPivot=0,-0.000016,0
SpawnPositionOffset=0,0,0.032
OnDeckPositionOffset=0,0,0
GroundTaxiInterval=0.3
ForwardsTaxiVelocity=4
BackwardsTaxiVelocity=2

Pilot=  // CockpitCrew submodel supplies the two seated naval pilots
PilotPositions=0,0.04,0.0672
EjectChance=0.0

[OpticalView]
Views=binocular_7x50,binocular_10x50
