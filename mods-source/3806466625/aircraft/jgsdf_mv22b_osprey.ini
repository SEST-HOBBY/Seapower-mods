# JGSDF V-22B variant sharing the MV-22B geometry and flight model.

[---------- General Data ----------]
[General]
UnitType=VTOL
CarrierCapable=True

DefaultCameraDistance=1.44
MinCameraDistanceForeAft=0.56
MinCameraDistanceBroadside=0.56
CameraPivotHeight=0

# Existing ground/taxi settings retained; source geometry rests near Y=0.
