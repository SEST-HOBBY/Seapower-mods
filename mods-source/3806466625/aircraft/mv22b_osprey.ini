MaxRollRate=42.0
MaxYawRate=70.0
MaxPitchAngle=18
MaxRollAngleHovering=34
MaxRollAngleForwardFlight=62
TargetPitchForForwardFlight=0

# hovering movements
HoverStrength=0.32
MinVelocityForNoHoverMovement=45
MaxHoverRadius=6

MaxSpeedAtSeaLevel=275
MaxBackwardSpeed=25
MaxSidewardSpeed=25
Ceiling=25000.0
Altitudes=50,200,500,1000,3000,6000,10000,20000
ClimbRate=32

EmptyMass=15032
MaxFuel=6070
