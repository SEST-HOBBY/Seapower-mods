# MV-22B articulated source rig. Requires OspreyMechanics.dll / Anchor Chain.

[---------- General Data ----------]
[General]
UnitType=VTOL
CarrierCapable=True

DefaultCameraDistance=1.305
MinCameraDistanceForeAft=0.5075
MinCameraDistanceBroadside=0.5075
CameraPivotHeight=0

# Existing ground/taxi settings retained; source geometry rests near Y=0.
GroundedPitchAngle=0
GroundPivot=0,-0.0000145,0
SpawnPositionOffset=0,0,0.029
OnDeckPositionOffset=0,0,0
GroundTaxiInterval=0.3
ForwardsTaxiVelocity=4
BackwardsTaxiVelocity=2

Pilot=  // CockpitCrew submodel supplies the two seated naval pilots
PilotPositions=0,0.03625,0.0609
EjectChance=0.0

[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[AI]
Role=Transport,SAR

[SensorData]
#Visual
VisualIdentificationRange=8.0
IRSignature=Large
# Radar
RCS=Large

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_mv22b_osprey

[Engine]
EngineIntakeArea=1.10

[---------- Physics ----------]
[Physics]
