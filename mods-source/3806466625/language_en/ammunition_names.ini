[AmmunitionNames]
sv22_2024_mk54_mod1_air=Mk 54 Mod 1,SV-22 2024,Aerial ASW torpedo,The Mk 54 Mod 1 is an air-dropped lightweight anti-submarine torpedo using active and passive sonar to search for underwater targets. It can use different speeds during search and attack and supports reattack and resistance to acoustic decoys for engaging a located submarine.
sv22_2024_ssq53g=AN/SSQ-53G,SV-22 2024,Passive DIFAR sonobuoy,The AN/SSQ-53G is a Directional Frequency Analysis and Recording (DIFAR) passive sonobuoy. It detects radiated underwater noise and provides bearing information to the receiving aircraft. Arrays of these buoys support submarine search and sustained acoustic surveillance.
sv22_2024_ssq62f=AN/SSQ-62F,SV-22 2024,Active DICASS sonobuoy,The AN/SSQ-62F is a Directional Command Activated Sonobuoy System (DICASS) active sonobuoy. It transmits acoustic pulses to determine the range and bearing of underwater targets. It is commonly used with passive buoys to localize a previously detected submarine for attack.
