[LanguageResources]
MV22_SearchRadar=Search radar|Wide-sector surface and ground search with data sharing.
MV22_FLIR=Advanced EO/IR|Day/night infrared detection, identification and downward rescue search.
MV22_RWR=Radar warning|Wideband radar interception and bearing warning.
MV22_DECM=Defensive jammer|Wideband defensive electronic jamming.
SV22_2024_RearRampLauncher=Aft ramp ASW launcher|Sequentially releases internally stored lightweight torpedoes and sonobuoys through the aft cargo ramp for submarine search and attack.
SV22_2024_SSQ53G_Sonar=AN/SSQ-53G DIFAR (SV-22)|The passive directional sonar of the AN/SSQ-53G sonobuoy detects radiated underwater noise and provides bearing information for initial submarine detection and sustained surveillance.
SV22_2024_SSQ62F_Sonar=AN/SSQ-62F DICASS (SV-22)|The active directional sonar of the AN/SSQ-62F sonobuoy uses acoustic pulses to determine range and bearing for localization of a previously detected submarine.

SV22_2024_ALFS=ALFS Low-Frequency Dipping Sonar (SV-22 / 2024)|ALFS is a low-frequency active and passive dipping sonar. Its probe is lowered into the water while the aircraft hovers at low altitude to search for and localize submarines and share detections by data link.
