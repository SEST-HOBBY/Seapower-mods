fr_mica-em=MICA-EM,,AAM, Le MICA-EM (Missile d’Interception, de Combat et d’Auto-défense) est un missile air-air français toutes conditions météorologiques de moyenne et courte portée doté d'une tête chercheuse à radar actif (ARH). Il a été développé par MBDA France en tant que remplacement universel des missiles obsolètes Super 530 et Magic II. Adopté en 1996 et intégré au Rafale, au Mirage 2000, ainsi qu'à des plateformes d'exportation (par exemple, le *Su-30MKI*). Il se caractérise par une grande manœuvrabilité (jusqu'à 50g), la capacité de lancer selon le principe "tire et oublie" (fire-and-forget) et la fonction d'interception de cibles dans l'hémisphère arrière. Prend en charge les modes LOAL (capture de cible après le lancement) et le réglage via la Liaison 16.

fr_mica-ir=MICA-IR,,AAM, Le MICA-IR est un missile air-air français toutes conditions météorologiques de courte et moyenne portée doté d'un autodirecteur à imagerie thermique (guidage IR). Développé par MBDA dans le cadre de la famille MICA (Missile d’Interception, de Combat et d’Auto-défense) pour remplacer les missiles obsolètes Matra R550 Magic II. Il est entré en service en 1998 et reste en service en raison de sa grande manœuvrabilité et de sa résistance au brouillage.

fr_r550-2=R.550-2,Magic-2,AAM, Le R.550 Magic 2 est un missile guidé air-air français à courte portée et à recherche de chaleur, développé par Matra (aujourd'hui MBDA) comme une mise à niveau du R.550 Magic d'origine. Il est entré en service en 1985 et a été largement utilisé dans les années 1980 et 2000 avant d'être remplacé par le MICA-IR et l'ASRAAM.

fr_super-530d=Super 530D,,AAM, Le Super 530D est un missile guidé air-air français de moyenne portée développé par Matra (aujourd'hui MBDA) comme une mise à niveau des missiles R530 et Super 530F. Il a été adopté en 1988 pour équiper les chasseurs Mirage 2000 dotés du radar à impulsions Doppler RDI. Il se caractérise par une résistance accrue au brouillage et la capacité d'intercepter des cibles volant à basse altitude.

fr_scalp-eg=SCALP-EG,Storm Shadow,AGM, Le Storm Shadow (dans la version française – SCALP-EG) est un missile de croisière de haute précision lancé par les airs, développé conjointement par le Royaume-Uni et la France par MBDA. Il est conçu pour détruire des cibles stratégiquement importantes et bien protégées à une portée allant jusqu'à 550 km (les versions d'exportation sont limitées à 250-300 km).

uae_black_shaheen=Black Shaheen,,AGM, Le Black Shaheen est la version émiratie du SCALP-EG. Limité à 300 km.

fr_pgm500_tv=PGM500,TV,AGM, Le PGM500 est un missile air-surface de haute précision développé conjointement par les États-Unis et le Royaume-Uni par International Signal and Control (plus tard MBDA). Il a été adopté en 1992 et est activement utilisé par l'armée de l'air des Émirats arabes unis sous le nom de Hakeem.

fr_pgm2000_tv=PGM2000,TV,AGM, Le PGM2000 est un missile d'aviation air-sol de haute précision doté d'une charge militaire agrandie, développé conjointement par les États-Unis et le Royaume-Uni (International Signal and Control et MBDA). Le nom d'exportation est Hakeem B, adopté dans les années 1990 et activement utilisé par l'armée de l'air des Émirats arabes unis.

fr_as-30l=AS-30L,,Attaque au sol, L'AS-30L est un missile français de haute précision air-sol à guidage laser semi-actif lancé par les airs. Développé par Aérospatiale (aujourd'hui MBDA) comme une mise à niveau du missile AS-30, remplaçant le guidage par radiocommande (MCLOS) par un ciblage laser moderne. Adopté en 1988, il reste en service en raison de sa grande précision (jusqu'à 1 m de CEP) et de sa polyvalence.

iaf_agm-142_tv=AGM-142,Popeye TV,AGM, AGM-142 Have Nap est la désignation américaine du missile israélien Popeye, une munition air-sol de haute précision et de moyenne portée. Développé par Rafael Advanced Defense Systems et adapté pour l'US Air Force. Il a été adopté en 1992 comme principal moyen de détruire des cibles stratégiques pour les bombardiers B-52H.

fr_gbu-12=GBU-12,GBU-12,Paveway II,Bombe guidée,La GBU-12 Paveway II est une bombe américaine de 500 lb (227 kg) guidée par laser. L'arme est basée sur la Mk 82 mais avec l'ajout d'un chercheur laser monté sur le nez et d'ailettes pour le guidage.

fr_gbu-24=GBU-24,Paveway II,Bombe guidée, La GBU-24 Paveway III est une bombe aérienne de précision guidée par laser américaine développée par Texas Instruments (aujourd'hui Raytheon) dans le cadre de la famille Paveway III. Elle a été adoptée en 1983 pour engager des cibles hautement défendues avec une précision et une portée accrues par rapport aux générations précédentes Paveway II.

fr_gbu-49=GBU-49,Paveway IV,AGM,Le Paveway IV est une mise à niveau de l'ancien GBU-12 Paveway II, et dispose de deux modes de guidage, satellite et laser, ce qui le rend plus reliable.

