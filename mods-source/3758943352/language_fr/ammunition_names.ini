fr_meteor=Meteor,,BVRAAM,Le Meteor est un missile air-air européen au-delà de la portée visuelle (BVRAAM) guidé par radar actif, développé et fabriqué par MBDA. Il offre une capacité de tirs multiples (lancements multiples contre plusieurs cibles) et a la capacité d'engager des cibles hautement manœuvrables telles que des avions de chasse, et de petites cibles telles que des drones et des missiles de croisière dans un environnement de contre-mesures électroniques (ECM) sévère avec une portée supérieure à 200 kilomètres (110 nmi).

fr_mica-ng-em=MICA-EM NG,,AAM, Le MICA EM NG est une version avancée et guidée par radar du missile air-air de nouvelle génération construit par MBDA.

fr_mica-ng-ir=MICA-IR NG,,AAM, Le MICA IR NG est une version avancée et guidée par radar du missile air-air de nouvelle génération construit par MBDA.

fr_am-39_B2=AM39 B2,Exocet,ASM,L'AM39 Exocet B2 est un missile anti-navire français à distance de sécurité. C'est une alternative populaire au Harpoon dans l'ensemble de l'OTAN et dans un certain nombre d'autres pays. L'AM39 est la variante lancée par les airs.

fr_sbu-38=SBU-38,Hammer,AASM,L'AASM (Armement Air-Sol Modulaire), également connu sous le nom d'AASM Hammer ("Hammer" signifiant "Highly Agile Modular Munition Extended Range"), est une arme intelligente air-surface française tout temps à distance de sécurité, développée par Safran Electronics & Defense. Conçu à la fois pour l'appui aérien rapproché et les missions de frappe en profondeur, l'AASM est hautement modulaire.

fr_sbu-54=SBU-54,Hammer,AASM,L'AASM (Armement Air-Sol Modulaire), également connu sous le nom d'AASM Hammer ("Hammer" signifiant "Highly Agile Modular Munition Extended Range"), est une arme intelligente air-surface française tout temps à distance de sécurité, développée par Safran Electronics & Defense. Conçu à la fois pour l'appui aérien rapproché et les missions de frappe en profondeur, l'AASM is hautement modulaire.

fr_sbu-64=SBU-64,Hammer,AASM,L'AASM (Armement Air-Sol Modulaire), également connu sous le nom d'AASM Hammer ("Hammer" signifiant "Highly Agile Modular Munition Extended Range"), est une arme intelligente air-surface française tout temps à distance de sécurité, développée par Safran Electronics & Defense. Conçu à la fois pour l'appui aérien rapproché et les missions de frappe en profondeur, l'AASM est hautement modulaire.

fr_asmp-a=ASMP-A,,ASMP,L'Air-sol moyenne portée (ASMP) est un missile de croisière français lancé par les airs et fabriqué par MBDA France. Dans la doctrine nucléaire française, il joue un rôle de dissuasion dit "pré-stratégique". Il est destiné à être l'ultime "tir d'avertissement" avant l'emploi à grande échelle de l'arme nucléaire stratégique armant les sous-marins lanceurs d'engins de la classe Le Triomphant. Le développement du missile a été entrepris par la division des systèmes de missiles d'Aérospatiale, dont les actifs font aujourd'hui partie de MBDA.

fr_tank_1200=Réservoir de carburant 1200L