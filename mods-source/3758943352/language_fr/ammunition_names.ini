[AmmunitionNames]

uav_aim-9x=AIM-9X,Sidewinder,AAM,L'AIM-9X Sidewinder est un missile air-air américain guidé par infrarouge. Le modèle X a été considérablement amélioré, avec de fortes capacités anti-brouillage, une portée plus longue et une capacité impressionnante de tir vers l'arrière.

uav_aim-92=AIM-92,Stinger,AAM,Le MANPADS FIM-92 Stinger est un petit missile de défense aérienne portable qui utilise un suivi thermique guidé par infrarouge et un suivi d'objet par ultraviolets. Il a été développé par les États-Unis et utilisé par toutes les forces militaires américaines. Il est en service depuis 1981. Aux États-Unis et dans 29 autres pays, il est principalement fabriqué par Raytheon, et autorisé à la production par EADS en Allemagne et ROKETSAN en Turquie. Plus de 70 000 missiles ont été produits.


uav_agm-114k=AGM-114K,Hellfire,agm,Le missile AGM-114 Hellfire est un missile de fabrication américaine multi-plateforme et multi-cible. Il est principalement utilisé pour les attaques anti-chars, mais les modèles ultérieurs ont également été utilisés pour des attaques de drones, des frappes de précision sur des cibles de haute valeur, etc.

uav_gbu-12d=GBU-12D,Paveway II,AGM,Les États-Unis ont amélioré le système Paveway I dans les années 1970. Le nouveau système disposait d'un empennage déployable, ce qui rendait le vol plané plus lointain, plus précis et moins cher. Le système Paveway amélioré a été appelé Paveway II.

uav_gbu-49=GBU-49,Paveway IV,AGM,Le Paveway IV est une mise à niveau de l'ancien GBU-12 Paveway II, et dispose de deux modes de guidage, satellite et laser, ce qui le rend plus fiable.

