[---------- General Data ----------]
[General]
UnitType=Aircraft
Size=VeryLarge

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.0

#Taxi values
GroundedPitchAngle=0.0    // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.075,0   // defines the relative location of the landing gear
TaxiInterval=0.85              // In unity units. Minimum distance between planes while taxiing


[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[AI]
Role=AEW

[SensorData]
#Visual
VisualIdentificationRange=9.0  // at what range in nm this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_fr_a330_mrtt

[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=1.48             //Pi* r * r where r is engine radius, in meters

[FlightModel]
PitchGain=0.8                         // Vertical manuverability
VelocityGain=0.1136                   // Acceleration
HeadingGain=2                         // Horizontal manuverability
YawRateLimit=130                      // in degrees per second

BankGain=0.8                          // Roll change speed
MaxRollForHeading=45.0                // bank limit in normal flight
MaxRollRate=60.0                      // in degrees per second

ThrustGain=0.325                      // Thrust change speed
SpeedBrakeFractionGain=10            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

[Performance]
#Dimensions
WingSpan=60.30                          //meters
#Parameters
MaxG=2                                // Mostly for horizontal turns

MaxClimbRate=12.0                     //Meters per second
EmptyMass=120000                       // in kg
MaxFuel=110000                         // in kg

PerEngineMaxThrust=320000             //Newtons
EngineCount=2

Ceiling=41000                       // ceiling in feet
CruiseAltitude=35000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.5,0.5,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=330                //in knots, Defines max speed at altitude curve
StallSpeed=115.0                      //in knots
MachLimit=0.86                         //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.28,0.35        // Landing
SpeedAndRange_Loiter=0.48,0.55          // Loiter
SpeedAndRange_Cruise=0.78,4200        // Cruise
SpeedAndRange_Max=0.95,0.8             // Attack/Fast/High/Max without AB


Altitudes=1000,3000,6000,10000,20000,30000  // in feet

MaxClimbPitch=20
MaxCombatClimbPitch=30
MaxDescentPitch=-20
MaxCombatDescentPitch=-30

