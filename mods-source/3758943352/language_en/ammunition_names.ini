fr_mica-em=MICA-EM,,AAM, MICA-EM (Missile d’Interception, de Combat et d’Auto-défense) is a French all-weather medium- and short-range air-to-air missile with an active radar homing head (ARH). It was developed by MBDA France as a universal replacement for the outdated Super 530 and Magic II missiles. Adopted in 1996 and integrated into the Rafale, Mirage 2000, as well as export platforms (for example, *Su-30MKI*). It is characterized by high maneuverability (up to 50g), the ability to launch "on the forgotten" principle (fire-and-forget) and the function of intercepting targets in the rear hemisphere. Supports LOAL modes (target capture after launch) and adjustment through Link 16.

fr_mica-ir=MICA-IR,,AAM, MICA-IR is a French all-weather short- and medium-range air-to-air missile with a thermal imaging seeker (IR-homing). Developed by MBDA as part of the MICA (Missile d’Interception, de Combat et d’Auto-défense) family to replace the outdated Matra R550 Magic II missiles. It entered service in 1998 and remains in service due to its high maneuverability and resistance to jamming.

fr_r550-2=R.550-2,Magic-2,AAM, R.550 Magic 2 is a French short-range, heat-seeking, air-to-air guided missile developed by Matra (now MBDA) as an upgrade to the original R.550 Magic. It entered service in 1985 and was widely used in the 1980s and 2000s before being replaced by MICA-IR and ASRAAM.

fr_super-530d=Super 530D,,AAM, Super 530D is a French medium-range air-to-air guided missile developed by Matra (now MBDA) as an upgrade to the R530 and Super 530F missiles. It was adopted in 1988 to equip Mirage 2000 fighters with the RDI pulse-Doppler radar. It is characterized by increased jamming resistance and the ability to intercept low-flying targets.

fr_scalp-eg=SCALP-EG,Storm Shadow,AGM, Storm Shadow (in the French version – SCALP-EG) is a high-precision air-launched cruise missile developed jointly by the UK and France by MBDA. It is designed to destroy strategically important, well-protected targets at a range of up to 550 km (export versions are limited to 250-300 km).

uae_black_shaheen=Black Shaheen,,AGM, Black Shaheen is UAE version of the SCALP-EG. Limited to 300 km.

fr_pgm500_tv=PGM500,TV,AGM, PGM500 is a high-precision air-to-surface missile developed jointly by the United States and the United Kingdom by International Signal and Control (later MBDA). It was adopted in 1992 and is actively used by the UAE Air Force under the name Hakeem.

fr_pgm2000_tv=PGM2000,TV,AGM, PGM2000 is a high-precision air-to-ground aircraft missile with an enlarged warhead, developed jointly by the United States and the United Kingdom (International Signal and Control and MBDA). Export name is Hakeem B, adopted in the 1990s and actively used by the UAE Air Force.

fr_as-30l=AS-30L,,Land Attack, AS-30L is a French high-precision air-to-ground semi-active laser-guided air-launched missile. Developed by Aerospatiale (now MBDA) as an upgrade of the AS-30 missile, replacing the radio command guidance (MCLOS) with modern laser targeting. Adopted in 1988 and remains in service due to its high accuracy (up to 1 m CEP) and versatility.

iaf_agm-142_tv=AGM-142,Popeye TV,AGM, AGM-142 Have Nap is the American designation for the Israeli Popeye missile, a high–precision medium-range air-to-ground air munition. Developed by Rafael Advanced Defense Systems and adapted for the US Air Force. It was adopted in 1992 as the main means of defeating strategic targets for B-52H bombers.

fr_gbu-12=GBU-12,GBU-12,Paveway II,Guided Bomb,The GBU-12 Paveway II is an American 500 lb (227 kg) laser-guided bomb. The weapon is based on the Mk 82 but with the addition of a nose-mounted laser seeker and fins for guidance.

fr_gbu-24=GBU-24,Paveway II,Guided Bomb, GBU-24 Paveway III is an American laser-guided precision-guided aerial bomb developed by Texas Instruments (now Raytheon) as part of the Paveway III family. It was adopted in 1983 to engage highly defended targets with increased accuracy and range compared to previous generations Paveway II

fr_gbu-49=GBU-49,Paveway IV,AGM,The Paveway IV is an upgrade of the older GBU-12 Paveway II, and has dual guidance modes, satellite and laser, making it more reliable.

