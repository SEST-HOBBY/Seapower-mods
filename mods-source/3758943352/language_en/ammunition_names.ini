fr_meteor=Meteor,,BVRAAM,The Meteor is a European active radar guided beyond-visual-range air-to-air missile (BVRAAM) developed and manufactured by MBDA. It offers a multi-shot capability (multiple launches against multiple targets), and has the ability to engage highly maneuverable targets such as jet aircraft, and small targets such as UAVs and cruise missiles in a heavy electronic countermeasures (ECM) environment with a range in excess of 200 kilometres (110 nmi)

fr_mica-ng-em=MICA-EM NG,,AAM, The MICA EM NG is an advanced, radar-guided version of the new-generation air-to-air missile built by MBDA.

fr_mica-ng-ir=MICA-IR NG,,AAM, The MICA IR NG is an advanced, radar-guided version of the new-generation air-to-air missile built by MBDA.

fr_am-39_B2=AM39 B2,Exocet,ASM,The AM39 Exocet B2 is a French standoff anti-ship missile. It is a popular alternative to the Harpoon throughout NATO and in a number of other nations. The AM39 is the air-launched variant.

fr_sbu-38=SBU-38,Hammer,AASM,The AASM (French: Armement Air-Sol Modulaire, lit. 'Modular Air-to-Ground Armament') also known as AASM Hammer ("Hammer" standing for "Highly Agile Modular Munition Extended Range") is a French, all-weather, smart air-to-surface stand-off weapon developed by Safran Electronics & Defense. Meant for both close air support and deep strike missions, the AASM is highly modular.

fr_sbu-54=SBU-54,Hammer,AASM,The AASM (French: Armement Air-Sol Modulaire, lit. 'Modular Air-to-Ground Armament') also known as AASM Hammer ("Hammer" standing for "Highly Agile Modular Munition Extended Range") is a French, all-weather, smart air-to-surface stand-off weapon developed by Safran Electronics & Defense. Meant for both close air support and deep strike missions, the AASM is highly modular.

fr_sbu-64=SBU-64,Hammer,AASM,The AASM (French: Armement Air-Sol Modulaire, lit. 'Modular Air-to-Ground Armament') also known as AASM Hammer ("Hammer" standing for "Highly Agile Modular Munition Extended Range") is a French, all-weather, smart air-to-surface stand-off weapon developed by Safran Electronics & Defense. Meant for both close air support and deep strike missions, the AASM is highly modular.

fr_asmp-a=ASMP-A,,ASMP,The Air-sol moyenne portée (ASMP; lit. 'Medium-Range Air-to-Surface') is a French air-launched cruise missile manufactured by MBDA France. In French nuclear doctrine, it serves what is referred to as a "pre-strategic" deterrence role. It is intended to be the ultimate "warning shot" prior to the full-scale employment of the strategic nuclear weapons arming the Triomphant-class ballistic missile submarines. The missile's development was undertaken by Aérospatiale's missile systems division, whose assets are now part of MBDA.

