[AmmunitionNames]

uav_aim-9x=AIM-9X,响尾蛇,AAM,AIM-9X“响尾蛇”是美国研制的红外导引空对空导弹。X型进行了重大升级，具有极强的抗干扰能力、更远的射程和出色的后射能力。

uav_aim-92=AIM-92,毒刺,AAM,FIM-92“毒刺”便携式防空导弹是一种小型便携式防空导弹，采用红外导引热追踪和紫外线目标追踪技术。它由美国研制，供美国所有武装部队使用，自1981年起服役。在美国和其他29个国家中，它主要由雷神公司制造，并授权德国EADS和土耳其ROKETSAN生产。目前已生产了7万多枚。


uav_agm-114k=AGM-114K,地狱火,agm,AGM-114“地狱火”导弹是美国制造的多平台、多目标导弹。它主要用于反坦克攻击，但后来的型号也被用于无人机攻击、对高价值目标进行精准打击等。

uav_gbu-12d=GBU-12D,铺路二,AGM,美国在20世纪70年代对“铺路一”系统进行了改进。新系统拥有可展开的尾翼，这使得滑翔距离更远、更精确且成本更低。改进后的铺路系统被称为“铺路二”。

uav_gbu-49=GBU-49,铺路四,AGM,“铺路四”是老旧的GBU-12“铺路二”的升级版，拥有卫星和激光双重制导模式，使其更加可靠。

