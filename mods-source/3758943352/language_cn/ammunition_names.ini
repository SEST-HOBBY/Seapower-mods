fr_mica-em=MICA-EM,,AAM,MICA-EM（拦截、战斗与自卫导弹）是法国研制的全天候中短程空对空导弹，配备主动雷达导引头（ARH）。它由法国MBDA公司开发，作为过时的“超级530”和“魔术二”导弹的通用替代品。于1996年服役，并集成到阵风、幻影2000以及出口平台（例如苏-30MKI）中。其特点是高机动性（高达50g）、具备“发射后不管”（fire-and-forget）能力以及拦截后半球目标的功能。支持LOAL（发射后锁定）模式，并可通过Link 16进行修正。

fr_mica-ir=MICA-IR,,AAM,MICA-IR是法国研制的全天候短中程空对空导弹，配备红外成像导引头（IR红外制导）。由MBDA开发，属于MICA（拦截、战斗与自卫导弹）系列，用于取代过时的马特拉 R550“魔术二”导弹。该导弹于1998年投入使用，因其高机动性和抗干扰能力目前仍在服役。

fr_r550-2=R.550-2,魔术-2,AAM,R.550“魔术2”是法国研制的短程红外制导空对空导弹，由马特拉公司（现为MBDA）开发，是原始R.550“魔术”导弹的升级版。它于1985年投入使用，在1980年代至2000年代被广泛使用，后被MICA-IR和ASRAAM取代。

fr_super-530d=Super 530D,,AAM,Super 530D是法国研制的中程空对空导弹，由马特拉公司（现为MBDA）开发，是R530和“超级530F”导弹的升级版。它于1988年服役，用于装备配备RDI脉冲多普勒雷达的幻影2000战斗机。其特点是抗干扰能力增强，并具备拦截低空目标的能力。

fr_scalp-eg=SCALP-EG,风暴阴影,AGM,“风暴阴影”（法国版本为SCALP-EG）是由英国和法国MBDA联合研制的高精度空射巡航导弹。它旨在摧毁战略重要性高、防护良好的目标，射程可达550公里（出口版本限制为250-300公里）。

uae_black_shaheen=Black Shaheen,,AGM,Black Shaheen是阿联酋版本的SCALP-EG，射程限制为300公里。

fr_pgm500_tv=PGM500,TV,AGM,PGM500是由美国和英国通过国际信号与控制公司（后为MBDA）联合研制的高精度空对地导弹。它于1992年服役，被阿联酋空军积极使用，代号为“哈基姆”（Hakeem）。

fr_pgm2000_tv=PGM2000,TV,AGM,PGM2000是一种配备加大战斗部的高精度空对地航空导弹，由美国和英国（国际信号与控制公司和MBDA）联合研制。出口名称为“哈基姆B”（Hakeem B），于1990年代服役，被阿联酋空军积极使用。

fr_as-30l=AS-30L,,对地攻击,AS-30L是法国研制的高精度半主动激光制导空射空对地导弹。由法国宇航公司（现为MBDA）开发，作为AS-30导弹的升级版，将无线电指令指导（MCLOS）替换为现代激光瞄准。于1988年服役，因其高精度（圆概率误差CEP在1米以内）和通用性目前仍在服役。

iaf_agm-142_tv=AGM-142,突眼 TV,AGM,AGM-142 Have Nap是美国对以色列“突眼”（Popeye）导弹的称呼，这 family是一种高精度中程空对地航空弹药。由拉斐尔先进防御系统公司开发，并为美国空军进行了改装。它于1992年服役，作为B-52H轰炸机摧毁战略目标的主要手段。

fr_gbu-12=GBU-12,GBU-12,铺路二,制导炸弹,GBU-12“铺路二”是美国研制的500磅（227公斤）激光制导炸弹。该武器基于Mk 82设计，但在机鼻处加装了激光导引头，并增加了用于制导的翼片。

fr_gbu-24=GBU-24,铺路二,制导炸弹,GBU-24“铺路三”是美国研制的激光制导高精度航空炸弹，由德州仪器（现为雷神）开发，属于“铺路三”系列的一部分。它于1983年服役，与前几代“铺路二”相比，能够以更高的精度和更远的射程打击严密防护的目标。

fr_gbu-49=GBU-49,铺路四,AGM,“铺路四”是老旧的GBU-12“铺路二”的升级版，拥有卫星和激光双重制导模式，使其更加可靠。

