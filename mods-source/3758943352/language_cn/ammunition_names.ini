fr_meteor=流星,,BVRAAM,“流星”（Meteor）是由MBDA开发和制造的欧洲主动雷达制导超视距空对空导弹（BVRAAM）。它提供多发齐射能力（针对多个目标进行多次发射），并有能力在强电子对抗（ECM）环境中攻击高机动性目标（如喷气式飞机）以及微小目标（如无人机和巡航导弹），射程超过200公里（110海里）。

fr_mica-ng-em=MICA-EM NG,,AAM,MICA EM NG是MBDA制造的新一代空对空导弹的主动雷达制导先进版本。

fr_mica-ng-ir=MICA-IR NG,,AAM,MICA IR NG是MBDA制造的新一代空对空导弹的红外成像先进版本。

fr_am-39_B2=AM39 B2,飞鱼,ASM,AM39“飞鱼”B2是法国研制的防区外反舰导弹。它是整个北约和许多其他国家中替代“鱼叉”导弹的流行选择。AM39是其空射型号。

fr_sbu-38=SBU-38,铁锤,AASM,AASM（法语：Armement Air-Sol Modulaire，意为模块化空对地武器），也被称为AASM Hammer（“Hammer”代表高机动模块化延伸射程弹药），是萨基姆/赛峰电子与国防公司研制 field的一种法国全天候智能空对地防区外武器。AASM高度模块化，既适用于近距离空中支援，也适用于纵深打击任务。

fr_sbu-54=SBU-54,铁锤,AASM,AASM（法语：Armement Air-Sol Modulaire，意为模块化空对地武器），也被称为AASM Hammer（“Hammer”代表高机动模块化延伸射程弹药），是萨基姆/赛峰电子与国防公司研制的一种法国全天候智能空对地防区外武器。AASM高度模块化，既适用于近距离空中支援，也适用于纵深打击任务。

fr_sbu-64=SBU-64,铁锤,AASM,AASM（法语：Armement Air-Sol Modulaire，意为模块化空对地武器），也被称为AASM Hammer（“Hammer”代表高机动模块化延伸射程弹药），是萨基姆/赛峰电子与国防公司研制的一种法国全天候智能空对地防区外武器。AASM高度模块化，既适用于近距离空中支援，也适用于纵深打击任务。

fr_asmp-a=ASMP-A,,ASMP,Air-sol moyenne portée（ASMP，意为中程空对地导弹）是法国MBDA公司制造的空射巡航导弹。在法国核战略学说中，它承担着所谓的“预先战略”威慑角色。它旨在作为全面动用凯旋级弹道导弹核潜艇战略核武器之前的终极“警告一枪”。该导弹的研发由法国宇航公司的导弹系统部门承担，其资产现已成为MBDA的一部分。

fr_tank_1200=1200L副油箱