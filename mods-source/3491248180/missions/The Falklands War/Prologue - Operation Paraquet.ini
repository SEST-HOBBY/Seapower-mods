Taskforce1MissionStartMessage=TOP SECRET – UK EYES ONLY\nFROM: CINCFLEET\nTO: CAPTAIN BRIAN YOUNG RN, HMS ANTRIM\nTASK FORCE 317.9\nDATE: 25 APRIL 1982\nTIME: 0900Z\nOPERATION PARAQUET – EXECUTION ORDERS\n\n1. SITUATION\nArgentine forces have occupied the island of South Georgia. Intelligence indicates a company-strength garrison is present at Grytviken, supported by limited heavy weapons and a potential submarine presence. SBS reports possible contact with ARA Santa Fe operating in vicinity.\n\n2. MISSION\nTask Force 317.9 is to proceed with immediate effect to the vicinity of South Georgia and execute Operation PARAQUET. Your primary objectives are as follows:\n\nObjective Alpha:\nCAPTURE Grytviken. Effect enemy surrender. If not forthcoming support the insertion of Royal Marines to secure the settlement.\n\nObjective Beta:\nNEUTRALISE ARA Santa Fe.\n\n3. EXECUTION\nOperations are to commence upon receipt of this signal. Intelligence and reconnaissance to be conducted via embarked Wessex and Lynx flights. Electronic warfare support and radar surveillance to be maintained throughout. You are to preserve the element of surprise wherever possible.\n\nReport immediately upon successful accomplishment of either objective. Further orders will follow for consolidation phase post-Grytviken.\n\n4. ADMINISTRATION\nLogistical support and replenishment remain available from RFA Tidespring and accompanying units. Medical support on standby. Communications silence to be observed unless contact is necessary for operational or safety reasons.\n\n5. COMMAND AND SIGNAL\nYou retain command of Task Force 317.9. Tactical control of embarked forces rests with you upon insertion. All communications to be via secure naval channels, signal precedence FLASH for engagement updates.\n\nGOD SPEED AND GOOD HUNTING\n\nSIGNED:\nADMIRAL JOHN FIELDHOUSE\nCINCFLEET, NORTHWOOD
Taskforce1MissionStartIntel=ARA Santa Fe spotted leaving Grytviken by SBS observation team.
