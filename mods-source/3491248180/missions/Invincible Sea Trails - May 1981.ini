
[Debug]
DisableEnemyAIPlayer=True
[Language_en]
Name=Invincible Sea Trials - May 1981
Description=Take command of the Royal Navy's newest carrier and put her and her air wing through her paces.
Taskforce1OrdersMessage=CONFIDENTIAL\n\nFROM: Flag Officer Sea Training (FOST)\n\nTO: Captain Micheal Livesay, HMS Invincible\n\nDATE: 8 May 1981\n\nSUBJECT: Sea Trials and ASW Exercise\n\n1. Objective: Conduct sea trials to evaluate HMS Invincible's operational capabilities, focusing on anti-submarine warfare (ASW).​\n\n2. Tasking:\n\nASW Operations: Utilize shipboard sonar and deploy Sea King helicopters to locate and simulate engagement with the submarine contact reported by USS Tattnall.​ Communicate with USS Tattnall for contact details and support as needed.​\n\n3. Reporting: Submit an after-action report detailing ASW performance and any recommendations.​ This exercise provides an opportunity to demonstrate HMS Invincible’s capabilities and reinforce the Royal Navy’s interoperability with the United States Navy. A high standard of professionalism and coordination is expected to ensure a strong showing for the Service.\n\nBy order of Rear Admiral David M. Eckersley-Maslin, Flag Officer Sea Training.
Taskforce1AAOrdersMessage=CONFIDENTIAL\n\nFROM: Flag Officer Sea Training (FOST)\nTO: Captain Michael Livesay, HMS Invincible\nDATE: 8 May 1981\nSUBJECT: Air Intercept – TU-95RT Detection\n\n1. Objective:\nIntercept and destroy TU-95RT reconnaissance aircraft approaching the task group. The Sea Harriers carry the brand new AIM-9L all aspect heat seeking air to air missile for this purpose.\n\n2. Tasking:\n\nImmediate Action:\n\nLaunch two Sea Harriers to intercept the contact.\n\nMaintain radar and visual tracking, ensuring positive identification.\n\n3. Reporting:\n\nSubmit a post-mission report detailing aircraft movements and any unusual activity.\n\nBy order of Rear Admiral David M. Eckersley-Maslin, Flag Officer Sea Training.
Taskforce1OrdersAtGMessage=CONFIDENTIAL\n\nFROM: Flag Officer Sea Training (FOST)\nTO: Captain Micheal Livesay, HMS Invincible\nDATE: 8 May 1981\nSUBJECT: Strike Mission – Fuel Depot\n\n1. Objective:\nConduct an air strike on a designated fuel depot. Enemy defenses include Bofors AAA, which may be engaged at the discretion of mission command.\n\n2. Tasking:\n\nLaunch Sea Harriers armed for ground attack. Primary target: Fuel depot. Secondary target: AAA defenses (engagement optional).\n\n3. Reporting:\n\nSubmit post-strike assessment detailing damage and aircraft performance.\n\nBy order of Rear Admiral David M. Eckersley-Maslin, Flag Officer Sea Training.
Taskforce1MissionCompleteMessage=CONFIDENTIAL\n\nFROM: Flag Officer Sea Training (FOST)\nTO: Captain Michael Livesay, HMS Invincible\nDATE: 8 May 1981\nSUBJECT: Exercise Completion\n\nBravo Zulu. All assigned targets have been successfully engaged and destroyed. HMS Invincible and her air wing have demonstrated effective coordination in ASW, air interception, and strike operations. Stand down from exercise conditions and commence post-action reporting. Further instructions to follow.\n\nBy order of Rear Admiral David M. Eckersley-Maslin, Flag Officer Sea Training.
