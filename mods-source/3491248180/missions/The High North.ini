[Language_en]
Name=The High North
Description=Take command of the Royal Navy and stop the Soviets from using their surface fleet to force access to the Atlantic.
MissionBriefingAssetsDirectory=missions\Briefing Assets
MissionBriefingLeftPane=missions\Briefing Assets\BriefingText_en.xml
MissionBriefingRightPane=missions\Briefing Assets\BriefingMap_en.xml
Taskforce1BlueVictoryMessage=Key Soviet ships sunk! Congratulations Admiral. Feel free top mop up any remaining Soviet units.
Taskforce1BlueLossMessage=Both carriers are sunk, all ships are to withdraw to the UK immediately.
Taskforce1OrdersMessage=Officer Commanding, HMS Invincible\nFrom: Northwood\n\nAdmiral,\n\nA large Soviet surface fleet is attempting to force a breakout. Intelligence suggests they have air and submarine support. Use all availible assets to neutralise key Soviet surface vessels and any other targets of oppertunity.\n\nSpartan and Splendid are close to the estimated poistion of the Soviet fleet. You can use them as well as the three Nimrods on station to locate the enemy. Loss of hulls and airframes is expected, however if both carriers are lost this would be critical.\n\nWe are on our own for this one, the inclement weather conditions preclude any support from the USAF and there are no USN ships in the area. Civilian aviation or shipping in the operations area is extremely unlikely, assume any unknown contacts are hostile.\n\nGodspeed.\n\n
