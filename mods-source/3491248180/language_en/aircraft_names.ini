[rn_buccaneer_s2b]
Type=Attack
Default=Buccaneer S.2B, S.2B
DefaultDescription=The Blackburn Buccaneer is a British twin engined, carrier-capable attack aircraft designed in the 1950's as an anti-ship platform against Soviet cruisers. She was designed to attack at low level to take advantage of the enemy ship's radar horizon, to minimise the opportunity to be fired upon. In July 1968 the RAF ordered 26 modified Buccaneer S.2s. These new-build aircraft were fitted for the Martel missile and partly de-navalized. They were not capable of carrier operations. In 1979, the RAF obtained the Pave Spike laser target designator pod for the Buccaneers, enabling guidance of laser-guided bombs for sibling Buccaneers, Jaguars, and other strike aircraft. Whilst 15 and 16 Squadron converted to Tornado in July 1983 and February 1984, 12 and 208 Squadron continued operating the Buccaneer in the maritime strike role until the early 1990s.
Squadron1=Buccaneer S.2B No.12 Squadron,S.2B
Squadron2=Buccaneer S.2B No.15 Squadron,S.2B
Squadron3=Buccaneer S.2B No.16 Squadron,S.2B
Callsigns=Squadron1,Jackal|Squadron2,Deer|Squadron3,Saint|

[rn_harrier_gr3]
Type=Attack
Default=Harrier GR.3,Harrier GR.3
DefaultDescription=The Harrier GR.3 was a further development of the Harrier series of vertical/short takeoff and landing (V/STOL) jet fighters. It entered service with the Royal Air Force (RAF) in 1976 and was used in various combat operations, including the Falklands War in 1982. The Harrier GR.3 had a number of improvements over the earlier Harrier GR.1, such as a more powerful Pegasus Mk 103 engine, a nose-mounted Laser Rangefinder and Marked Target Spotter (Ferranti LRMTS) for use as a laser receiver, an AN/ALE-40 chaff/flare dispenser for increased survivability, provision for Sidewinder air-to-air missiles, and the addition of a Radar Warning Receiver.
Squadron1=Harrier GR.3 No.1 Squadron RAF,GR.3
Callsigns=Squadron1,Giant

[raf_canberra_bomber]
Type=Bomber
Default=Electric English Canberra, Canberra
DefaultDescription=The Electric English Canberra was the first jet powered bomber designed for the Royal Air Force. Initially designed as a medium bomber they first entered service in 1951 and were eventually retired in 2007. The ‘B’ bomber versions could carry a variety of bombs, missiles and rockets, including nuclear weapons. The ‘PR’ photo reconnaissance versions were instead fitted with a variety of cameras for intelligence gathering operations.

[rn_nimrod_mr1]
Type=ASW Plane,Maritime Patrol
Default=Hawker Siddeley Nimrod MR.1, MR.1
DefaultDescription=The Hawker Siddeley Nimrod MR.1 was the premier maritime patrol aircraft of the Royal Air Force in the 1970's. It was based on the De Havilland Comet jet airliner and extensively modified to meet air force needs for a long range maritime patrol and ASW platform. The first version the MR.1 was mainly an ASW platform first and a maritime surveillance aircraft second. It could be equipped with up to 150 sonobuoys and various types of anti submarine and anti surface weapons. In 1975 all aircraft were upgraded to the MR.2 standard with newer sensor and weapon systems to keep up with advancing technology.
Squadron1=Nimrod MR.1 No.42 Squadron ,Nimrod
Squadron2=Nimrod MR.1 No.120 Squadron,Nimrod
Squadron3=Nimrod MR.1 No.201 Squadron,Nimrod
Squadron4=Nimrod MR.1 No.203 Squadron,Nimrod
Squadron5=Nimrod MR.1 No.206 Squadron,Nimrod
Callsigns=Squadron1,Mawgan|Squadron2,Kinloss|Squadron3,Sneak|Squadron4,Cyclone|Squadron5,Tedder

[rn_nimrod_mr2]
Type=ASW Plane,Maritime Patrol
Default=Hawker Siddeley Nimrod MR.2, MR.2
DefaultDescription=The MR.2 was a 1975 upgrade to all Nimrod MR.1 aircaft of the RAF, which expanded the Nimrod's duties from a mainly ASW platform to a true Maritime Patrol aircraft. The MR.2 package delivered various sensor and weapon upgrades. Air to air refueling capability and integratiion of the AIM-9 sidewinder as a last ditch self-defence measure were hurridly added following the outbreak of the Falklands conflict in 1982.
Squadron1=Nimrod MR.2 No.42 Squadron ,Nimrod
Squadron2=Nimrod MR.2 No.120 Squadron,Nimrod
Squadron3=Nimrod MR.2 No.201 Squadron,Nimrod
Squadron4=Nimrod MR.2 No.206 Squadron,Nimrod
Callsigns=Squadron1,Mawgan|Squadron2,Kinloss|Squadron3,Wyton|Squadron4,Tedder

