DefaultDescription=The R.1 was a modification of the MR.2 which removed all weaponry and sensors to accomondate powerful ELINT equipment and was used as an aerial surveillance platform. Only 4 aircaft were modified to this standard and all saw service with the No.51 squadron.
Squadron1=Nimrod R.1 No.51 Squadron,Nimrod
Callsigns=Squadron1,Phantom,Watcher

[rn_nimrod_aew3]
Type=AEW&C
Default=Hawker Siddeley Nimrod AEW.3 (AH), AEW.3
DefaultDescription=The Nimrod AEW.3 was an attempt at creating a modern airborne early warning and control aircraft to replace the ageing Shackleton AEW.2 fleet. The aicraft chosen to create this new AEW&C platform was the Nimrod MR.2, modified to carry the Thorn EMI Skymaster radar. The Nimrod AEW project proved to be hugely complex and expensive as a result of the difficulties of producing new radar and computer systems and integrating them successfully into the Nimrod airframe. The project was eventually cancelled, with the RAF instead purchasing new build Boeing E-3 Sentry aircraft to fulfil the AEW requirement. Nine Nimrod aircraft were modified in the late 1970's and served as trials aircraft until the project's cancelation in late 1980's
Squadron1=Nimrod R.1 No.8 Squadron,Nimrod
Callsigns=Squadron1,Crow,Owl
