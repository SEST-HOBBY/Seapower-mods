[rn_sea_king_aew]
Type=AEW Helicopter
Default=Sea King AEW.5,AEW5
DefaultDescription=The Westland WS-61 Sea King is a British licence-built version of the American Sikorsky S-61 helicopter of the same name. Developed to counter the increasingly threatening prospect of the Soviet submarine forces the Sea King is a capable anti-submarine warfare platform used extensively across NATO. During the Falklands War, a number of warships were lost in part due to the lack of an AEW platform. Consequently two Sea Kings were modified with the addition of a Searchwater radar attached to the fuselage on a swivel arm, allowing the radar to be lowered below the fuselage during flight and for it to be raised for landing. These prototypes were both flying within 11 weeks and deployed on HMS Illustrious, serving in the Falklands shorlty after the cessation of hostilities. A further 9 were modified to a production standard, known as the AEW.
Squadron1=Sea King AEW.5 849 NAS, Sea King
Callsigns=Squadron1,Owl

