[rn_mbt_mk5-1]
Type=MBT
Default=Centurion Mk 5/1,Centurion
DefaultDescription=The Centurion Mk 5 represented one of the most refined post-war iterations of Britain’s famous Centurion series. Armed with the powerful 84 mm QF 20-pounder gun, it offered excellent firepower and armor protection for the 1950s era. The Mk 5 incorporated numerous improvements over earlier marks, including a redesigned mantlet, new communications systems, and simplified hull fittings. The subsequent Mk 5/1 upgrade introduced further internal and external refinements and became the basis for many Commonwealth and export variants, notably those operated by Australia, Canada, India, Israel, and Sweden. While later Centurions would receive the 105 mm L7 gun, the 20-pounder-armed Mk.5/1 remained highly effective, balancing mobility, protection, and accuracy through its stabilized fire-control system. Renowned for its versatility and reliability, the Centurion Mk.5/1 bridged the gap between World War II heavy tanks and the true main battle tanks that followed, serving across the world well into the 1970s.
Variant1=Centurion Mk 5/1,Centurion
