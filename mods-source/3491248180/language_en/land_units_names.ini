[rn_mbt_mk13]
Type=MBT
Default=Centurion Mk 13,Centurion
DefaultDescription=The Centurion Mk 13 represented the final major production and upgrade standard of Britain’s renowned Centurion series. Based on the Mk 10 hull and armed with the formidable 105 mm L7 gun, it incorporated decades of combat experience into a mature and balanced main battle tank design. Improvements included upgraded fire control, a fully stabilized main armament, enhanced optics, and infrared night-fighting equipment, ensuring effectiveness in all weather and light conditions. Additional refinements to the powertrain, suspension, and stowage increased reliability and crew efficiency. The Mk 13 served as the ultimate evolution of the Centurion in British Army service before the arrival of the Chieftain, and its advanced features influenced tank development worldwide. Robust, accurate, and battle-proven, the Mk 13 marked the culmination of one of the most successful tank families of the 20th century.
Variant1=Centurion Mk 13,Centurion

[rn_mbt_chieftain]
Type=MBT
Default=Chieftain Mk 10,Chieftain Mk 10
DefaultDescription=The Chieftain Mk.10 represents one of the most significant upgrades to Britain’s Cold War main battle tank, fielded widely by the British Army in the early to mid-1980s. Based on the earlier Mk.5, the Mk.10 introduced the Stillbrew composite armour package, greatly improving protection against modern kinetic and HEAT threats. The additional armour blocks on the turret and glacis gave the vehicle a distinctive, heavier profile and brought its survivability in line with newer NATO tanks of the period. The Chieftain retained its powerful L11A5 120 mm rifled gun, noted for its long-range accuracy and the use of separate-loading bagged charges and fin-stabilised ammunition. Secondary armament consisted of a coaxial 7.62 mm L8A2 machine gun and a roof-mounted 7.62 mm L37A1 for the commander. Powered by the Leyland L60 multi-fuel engine, the Chieftain offered good firepower and strong defensive characteristics, although mobility and reliability were persistent concerns. Despite these limitations, the Mk.10 formed a major part of Britain’s armoured forces during the mid-1980s, particularly within the British Army of the Rhine (BAOR), where it served as a frontline deterrent against Warsaw Pact armour.
Variant1=Chieftain Mk 10,Chieftain Mk 10


