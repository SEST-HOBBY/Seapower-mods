Type_177=Type 177|The Type 177 is a hull-mounted, medium-frequency sonar, which scans a 360-deg area around the ship. It was the first British scanning sonar. 
Type 184M=Type 184M|A hull mounted sonar intented for use by capitol ships to offer some limited ASW capabilities.
Type2016=Type 2016|The Type 2016 is a British anti-submarine search and attack sonar for use on surface ships. The system can operate in passive or active search modes.
Type2031=Type 2031|The Type 2031 is a British towed array sonar designed for the Type 22 frigate. It is designed to detect the latest Soviet submarines.

