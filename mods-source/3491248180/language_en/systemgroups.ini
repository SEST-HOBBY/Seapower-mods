Mark6=Twin MK6 4.5"|MK6 4.5"|The QF 4.5" Mark 6 turret was the standard Royal Navy dual-purpose gun during the mid to late Cold war.This mounting houses twin guns.
QF20=QF 20‑pounder (84 mm)|Royal Ordnance QF 20‑pdr|Compact, high‑velocity 84 mm rifled tank gun developed by the United Kingdom in the early Cold War era. The 20‑pdr was designed to provide excellent muzzle velocity and armour‑piercing performance in a relatively light package, making it suitable for retrofit to existing chassis such as the Centurion. It was the standard British medium‑tank gun through the 1950s before the adoption of the 105 mm L7 family.
L11A5=L11A5|Royal Ordnance L11A5|Heavy 120 mm rifled tank gun developed by the United Kingdom to provide superior long‑range armour‑penetration and accuracy. Introduced with the FV4201 Chieftain, the L11A5 used separate‑loading ammunition and a thermal‑sleeved, fume‑extractor‑equipped barrel to deliver consistent performance in adverse conditions. It became the cornerstone of British main battle tank firepower from the late 1960s through the 1980s, and served as the basis for later British 120 mm rifled gun designs.
L3A2=L3A2 0.30 cal|L3A2/Browning M1919A4 Machine Gun|The Commonwealth designation for the Browning M1919A4 fitted in a flexible/pintle mount — typically used as a commander's external machine‑gun on armored fighting vehicles, used for close defence and anti‑infantry suppression.
L3A2_762=L3A2 7.62mm|L3A2/Browning M1919A4 Machine Gun|The Commonwealth designation for the Browning M1919A4 fitted in a flexible/pintle mount — typically used as a commander's external machine‑gun on armored fighting vehicles, used for close defence and anti‑infantry suppression. Converted to fire standard NATO 7.62mm ammunition.
L37A1=L37A1|L37A1 GPMG|The L37A1 is a British 7.62 mm General Purpose Machine Gun (GPMG), a licence built Belgian FN MAG. It is an Enfield L7 GPMG with modifications to make it suitable for use as as a turret mounted machine gun on Armoured Fighting Vehicles (AFVs).
