DUUX-2C=DUUX-2C|The DUUX-2C is a side mounted passive hull sonar operating in medium frequencies with a a 27.8 kilometres range.
AN-407=AN-407|The AN-407 is an hull mounted active sonar with a short 7.4 kilometre range.
PRS 3-4=PRS 3-4|The PRS 3-4 is a hull-mounted passive ranging flank array designed to search and track for the CSU 3-4 Sonar array,with a range of 11.1 kilometres
IPS CSU 3=IPS CSU 3|The IPS CSU 3 is an acoustic intercept passive sonar with a range of 66.7 kilometres
Type_187=Type 187|The Type 187 is a British low frequency active/passive attack sonar.
Type_2001=Type 2001|The Type 2001 is a British high frequency active/passive attack sonar.
Type_2007=Type 2007|The Type 2007 is a British long range passive sonar.
Sperry_BQG-4=BQS-4|The Sperry BQG-4 is an American made low frequency passive sonar similar to the AN/BQR-21 sonar.
Krupp_CSU3-41=CSU3-41|The Krupp CSU3-41 is an German made medium frequency active sonar.

