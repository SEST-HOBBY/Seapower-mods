Calypso III=Calypso III|A 70S radar designed for submarine use aboard submarines thanks to its high water pressure recistance.It is relatively short range with only 37 kilometers range.

#---------------------------------------- Aircraft radar ----------------------------------------
Sea Spray=Sea Spray|The Sea Spray Radar APS-705 is a 1970s surface search radar developed for Anti Submarine Warfare,SAR and other maritime missions.Mainly used by helicopters in the ventral or dorsal configuration
Ferranti Blue Fox=Ferranti Blue Fox|The Ferranti Blue Fox was a British multi-role airborne radar designed and built for the Royal Navy by Ferranti Defence Systems in the late 1970's.
Ferranti Blue Parrot=Ferranti Blue Parrot|The Ferranti Blue Parrot was a British surface search radar designed and built for the Royal Navy by Ferranti Defence Systems in the late 1970's.
GEC AI.18 Radar=GEC AI.18 Radar|The AI.18 was a British made Air Interception radar designed to be used by two seater aircraft,it was mainly used by Royal Navy and Air Force fighters and interceptors in the 1970s'.
ASV-19A=ASV-19A|The ASV-19A was a British made surface search radar used by maritime patrol aircraft in the 1970's.
ASV-21=ASV-21|The ASV-21 was a British made surface search radar used by maritime patrol aircraft in the 1970's.It was an upgraded variant of the ASV-19A with more range and accuracy.
ASV-21D=ASV-21D|The ASV-21D was a British made surface search radar used by maritime patrol aircraft in the 1970's.
AN/APS-88=AN/APS-88|Long range surface detection radar used for detecting naval targets at long ranges,mainly used by maritime patrol aircraft
Thorn EMI Searchwater=Thorn EMI Searchwater|Searchwater was a maritime surveillance radar developed by Thorn EMI under project P1149.
Thorn EMI Skymaster=Thorn EMI Skymaster|Skymaster was a british made airborne radar designed to be used on aerial early warning and control platforms like the Nimrod AEW.3 .It had significant range for both aerial and surface targets but was difficult to operate.
ECKO_290=ECKO 290|The ECKO 290 was an aerial weather radar with limited plane spotting capabilities.
FLIR=FLIR|Advanced optics for day and night engagements


