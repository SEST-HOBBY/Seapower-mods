[rn_cv_centaur_catobar_73]
Type=CVL,Light Carrier
Default=Centaur-class (CATOBAR-Late),Centaur
DefaultDescription=The Centaur Class was a WW2 era design which was delayed due to the war and first entered service in the 1950s.The ships were designed as straight flight deck CATOBAR carriers to accomondate late ww2 carrier aircraft but that was changed to an angled deck to accomondate the newer and heavier jet powered aircraft. The class consisted of four ships, but only one, HMS Hermes, saw service after the late 1970s. The 1970s era air wing consisted of Sea Vixens, S2 Buccanners, Sea Gannet AS.4 and AEW.3 and Wessex helicopters for SAR and misc duties. Hermes was the only vessel of this class by the 1970s still operating as a conventional fixed-wing carrier, with Albion and Bulwark having already been converted to commando carriers.
Variant1=HMS Hermes,Hermes

[rn_cv_centaur_catobar]
Type=CVL,Light Carrier
Default=Centaur-class (CATOBAR-Early),Centaur
DefaultDescription=The Centaur Class was a WW2 era design which was delayed due to the war and first entered service in the 1950s. The ships were designed as straight flight deck CATOBAR carriers to accomondate late WW2 carrier aircraft but that was changed to an angled deck to accommodate the newer and heavier jet powered aircraft. The class consisted of four ships, but only one, HMS Hermes, saw service after the late 1970s. The 1960s era air wing consisted of Sea Vixens, S1 Buccanners, Sea Gannet AS.4 and AEW.3 and Wessex helicopters for SAR and misc duties. Albion and Bulwark would be converted to commando carriers in the 1960s, with Hermes following in the early 1970s.
Variant1=HMS Hermes,Hermes
Variant2=HMS Bulwark,Hermes
Variant3=HMS Albion,Hermes

[rn_cv_centaur]
Type=CVL,Light Carrier
Default=Centaur-class (STOVL),Centaur
DefaultDescription=The Centaur Class was a WW2 era design which was delayed due to the war and first entered service in the 1950s.The ships were designed as straight flight deck CATOBAR carriers to accomondate late WW2 carrier aircraft but that was changed to an angled deck to accomondate the newer and heavier jet powered aircraft. The class consisted of four ships, but only one, HMS Hermes, saw service after the late 1970s. Between 1980-1981 she was reffited again with a ski-ramp to accomondate Harrier VTOL jets and saw action during the Falklands conflict. Her wartime complement consisted of 21 Harrier fighters and 10 Sea King helicopters offering ASW and utility support. After returning from the war, she remained in service briefly, and after an offer to sell her to Australia was rejected after the deal to sell HMS Invincible fell through, she was sold to India and entered service with the Indian Navy in 1987 as INS Viraat.
Variant1=HMS Hermes,Hermes

[rn_cv_centaur_commando]
Type=LPH,Landing Ship
Default=Centaur-class (Commando),Centaur (Commando)
DefaultDescription=The Centaur Class was a WW2 era design which was delayed due to the war and first entered service in the 1950s.The ships were designed as straight flight deck CATOBAR carriers to accomondate late WW2 carrier aircraft but that was changed to an angled deck to accomondate the newer and heavier jet powered aircraft. The class consisted of four ships, with only one, HMS Hermes, seeing service after the late 1970s. In the 1960s it was decided to modify Albion and Bulwark to a Commando carrier to act as an amphibious landing and support platform, with all catapults removed and the air wing reduced to Sea King and Wessex utility helicopters. Along with the air group changes, facilities were installed at the rear end of the ship to support the launch and retrieval of LCVP landing craft. Albion and Bulwark were worked hard in the 1960s, with Albion decommissioned in 1973 with Hermes having her conversion at the same time to replace her. Hermes would move towards ASW duties, with Bulwark in and out of service until 1976. Bulwark was recommissioned again in 1979 to fill the ASW role, this being short lived due to a number of fires and she was out again in 1980. Rapidly surveyed for recommissioning during the Falklands, this was rejected and she was sold for scrap in 1983. Hermes would get a ski-jump fitted between 1980-1981, returning to fixed-wing operations in time for the Falklands.
Variant1=HMS Hermes,Hermes
Variant2=HMS Bulwark,Hermes
Variant3=HMS Albion,Hermes

