[rn_cv_invincible_deckparks]
Type=CVL,Light Carrier
Default=Invincible-class (DP),Invincible
DefaultDescription=The Invincible class was a class of light aircraft carrier operated by the Royal Navy. Three ships were constructed: HMS Invincible, HMS Illustrious and HMS Ark Royal. The vessels were built as aviation-capable anti-submarine warfare (ASW) platforms to counter the Cold War North Atlantic Soviet submarine threat, and initially embarked Sea Harrier aircraft and Sea King HAS.1 anti-submarine helicopters. With cancellation of the aircraft carriers renewal programme in the 1960s, the three ships became the replacements for Ark Royal and Eagle fleet carriers and the Centaur-class light fleet carriers, and the Royal Navy's sole class of aircraft carrier for decades.(Deck Park Variant)
Variant1=HMS Invincible, Invincible
Variant2=HMS Illustrious, Illustrious
Variant3=HMS Ark Royal, Ark Royal

[rn_cv_invincible_refit_deckparks]
Type=CVL,Light Carrier
Default=Invincible-class (Refit-DP),Invincible
DefaultDescription=The Invincible class was a class of light aircraft carrier operated by the Royal Navy. Three ships were constructed: HMS Invincible, HMS Illustrious and HMS Ark Royal. The vessels were built as aviation-capable anti-submarine warfare (ASW) platforms to counter the Cold War North Atlantic Soviet submarine threat, and initially embarked Sea Harrier aircraft and Sea King HAS.1 anti-submarine helicopters. With cancellation of the aircraft carriers renewal programme in the 1960s, the three ships became the replacements for Ark Royal and Eagle fleet carriers and the Centaur-class light fleet carriers, and the Royal Navy's sole class of aircraft carrier for decades. After the Falklands conflict the Royal Navy recognised the lack of close in defenses with its carriers and refitted all three with Phalanx close in weapon systems to provide better missile defense.(Deck Park Variant)
Variant1=HMS Invincible, Invincible
Variant2=HMS Illustrious, Illustrious
Variant3=HMS Ark Royal, Ark Royal

