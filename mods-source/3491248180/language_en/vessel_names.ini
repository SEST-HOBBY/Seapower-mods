[rn_churchill_class_ssn]
Type=SSN,Attack Submarine
Default=Churchill-class, Churchill
DefaultDescription=The Churchill class nuclear fleet submarines were built as a follow on to the highly successful Valiant class for the Royal Navy. Two boats were completed, with the first entering service in 1970. The Churchills received improved internal machinery and sensors, and like their predecessors had several refits adding enhanced capabilities and new weapons, such as the Harpoon anti ship missile. The boats were decommissioned in 1990 and 1991 and remain the only class of SSN to have sunk an enemy surface combatant with torpedoes. 
Variant1=HMS Churchill S46, Churchill
Variant2=HMS Conqueror S48, Conqueror
Variant3=HMS Courageous S50, Courageous

[rn_swiftsure_class_ssn]
Type=SSN,Attack Submarine
Default=Swiftsure-class, Swiftsure
DefaultDescription=The Swiftsure class nuclear fleet submarines were designed for the Royal Navy in the early 1970’s. First entering service in 1973 the Swiftsure’s built on the success of the previous Valiant and Churchill classes but with an improved hull form to allow deeper operation. The Swiftsure’s also pioneered the use of a shrouded pump jet propulsion rather than a traditional propeller, allowing them to be quieter than their already notably quiet predecessors. Like other Royal Navy SSN’s they had long careers with multiple refits and upgrades, including Harpoon anti ship missiles, Tomahawk cruise missiles, and Spearfish heavyweight torpedoes. The Swiftsures were finally withdrawn from service and decommissioned in 2010. 
Variant1=HMS Swiftsure S126, Swiftsure
Variant2=HMS Sovereign S108, Sovereign
Variant3=HMS Superb S109, Superb
Variant4=HMS Sceptre S104, Sceptre
Variant5=HMS Spartan S105, Spartan
Variant6=HMS Splendid S106, Splendid

[rn_valiant_class_ssn]
Type=SSN,Attack Submarine
Default=Valiant-class, Valiant
DefaultDescription=The Valiant class nuclear fleet submarines were the first Royal Navy nuclear boats with British designed reactors. Entering service in 1966 they featured ‘rafted’ noise isolated machinery, as well as a diesel-electric system, making the Valiants significantly quieter than the preceding Dreadnought class and even contemporary U.S. submarines. Their design proved highly successful and they remained in service until 1994, receiving several refits and upgrades during their careers, including the addition of UGM-84B Harpoon anti ship missiles sometime in the 1980’s.
Variant1=HMS Valiant S102, Valiant
Variant2=HMS Warspite S103, Warspite

