[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.2

Length=158                     // in meters
Beam=16                        // in meters

CompartmentsHeight=0.08        // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[TaskForce]
TaskForceCost=25
[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=6200              // in tons

MaxForwardVelocity=30.0        // sets the max forward velocity
MaxBackwardVelocity=6.0        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=2.5             // turn rate of the rudder in degrees per second
RudderForce=0.5                // multiplicator defining how agile the ship can turn

TiltFactor=2.5                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-5.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

#WaypointTolerance=10     //in meters, range at which waypoint is considered reached
#LoiterRange=2           //in nmi, how far unit can go away from loitering center

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=13.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Large
# Radar related (RCS => radar cross section)
RCS=Large
# Sonar related
BaseNoise=160                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=6					 //number of blades on vessels propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset
MachineryRaftingGeneration=3

[Animations]
