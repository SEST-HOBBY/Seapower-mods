[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=10.08                     // in meters
Beam=3.5                       // in meters
Range=280                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=14  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=Chieftain Mk 10
Tag=Ground+Vehicle+Armor+Tank

[Physics]
HorsePower=750
Mass=55.0                        // in tons

MaxForwardVelocity=28.0          // in knots
MaxBackwardVelocity=10.0          // in knots
Braking=5.5                     // knots/sec
TurnRate=16                    // in degrees per second

[AI]
UnitScoreValue=0.6             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=14

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

