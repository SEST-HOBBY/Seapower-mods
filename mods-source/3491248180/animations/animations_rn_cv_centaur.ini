Sequence1=Deflector1MoveDownSequence
Sequence1_Model=JBD_A
Sequence2=Deflector1MoveDownSequence
Sequence2_Model=JBD_B
Sequence3=Deflector1MoveDownSequence
Sequence3_Model=JBD_C

[MoveDownDeflector2]
