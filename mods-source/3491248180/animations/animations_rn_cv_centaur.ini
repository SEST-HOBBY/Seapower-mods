[Animations]
NumberOfAnimations=8
Animation1=MoveDownElevator1
Animation2=MoveDownElevator2
Animation3=MoveUpElevator1
Animation4=MoveUpElevator2
Animation5=MoveUpDeflector1
Animation6=MoveUpDeflector2
Animation7=MoveDownDeflector1
Animation8=MoveDownDeflector2


[MoveDownElevator1]
NumberOfSequencesToPlay=1
Sequence1=Elevator1MoveDownSequence
Sequence1_Model=Elevator_1

[MoveDownElevator2]
NumberOfSequencesToPlay=1
Sequence1=Elevator1MoveDownSequence
Sequence1_Model=Elevator_2

[MoveUpElevator1]
NumberOfSequencesToPlay=1
Sequence1=Elevator1MoveUpSequence
Sequence1_Model=Elevator_1

[MoveUpElevator2]
NumberOfSequencesToPlay=1
Sequence1=Elevator1MoveUpSequence
Sequence1_Model=Elevator_2

[MoveUpDeflector1]
NumberOfSequencesToPlay=3
Sequence1=Deflector1MoveUpSequence
Sequence1_Model=JBD_A
Sequence2=Deflector1MoveUpSequence
Sequence2_Model=JBD_B
Sequence3=Deflector1MoveUpSequence
Sequence3_Model=JBD_C

[MoveUpDeflector2]
NumberOfSequencesToPlay=3
Sequence1=Deflector1MoveUpSequence
Sequence1_Model=JBD_D
Sequence2=Deflector1MoveUpSequence
Sequence2_Model=JBD_E
Sequence3=Deflector1MoveUpSequence
Sequence3_Model=JBD_F

[MoveDownDeflector1]
