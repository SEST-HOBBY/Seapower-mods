[ContactInfo]

## Show a Depth readout (with thermal-layer position) for submarine/biologic/torpedo contacts, in place of the vanilla altitude line.
# Setting type: Boolean
# Default value: true
Depth = true

## Show a Time-To-Go (TTG) readout for in-flight weapons that currently have a resolved target.
# Setting type: Boolean
# Default value: true
TimeToGo = true

## Show a Speed readout (in knots) for contacts. Own/friendly contacts show true speed; other contacts show the tracked/sensor-derived estimate.
# Setting type: Boolean
# Default value: false
Speed = true

## Show the vanilla Altitude line for airborne contacts and weapons. Superseded by Depth whenever a depth reading is available for that contact.
# Setting type: Boolean
# Default value: true
Altitude = true

## Draw a highlight marker on the map for any life-raft (ejected pilot) contact your own sensors have detected.
# Setting type: Boolean
# Default value: true
DistressBeacons = true

## While one of your own units is selected, show each closing contact's closest point of approach to it (range and time), from your own track data on that contact.
# Setting type: Boolean
# Default value: true
CPA = true

## Show how long ago your sensors last updated a contact, once that is more than 15 seconds.
# Setting type: Boolean
# Default value: true
ContactAge = true

## Show the true depth of non-friendly submerged contacts once your sensors have any depth solution on them, instead of the estimate and its error. Gives you information your sensors don't actually provide.
# Setting type: Boolean
# Default value: false
ExactEnemyDepth = false

PlanView = true

[Hotkeys]

## Toggles the matching Map Layers entry. Set to None to disable.
# Setting type: KeyboardShortcut
# Default value: Alpha1 + LeftControl + LeftAlt
ToggleDepth = Alpha1 + LeftControl + LeftAlt

## Toggles the matching Map Layers entry. Set to None to disable.
# Setting type: KeyboardShortcut
# Default value: Alpha2 + LeftControl + LeftAlt
ToggleAltitude = Alpha2 + LeftControl + LeftAlt

## Toggles the matching Map Layers entry. Set to None to disable.
# Setting type: KeyboardShortcut
# Default value: Alpha3 + LeftControl + LeftAlt
ToggleSpeed = Alpha3 + LeftControl + LeftAlt

## Toggles the matching Map Layers entry. Set to None to disable.
# Setting type: KeyboardShortcut
# Default value: Alpha4 + LeftControl + LeftAlt
ToggleTimeToGo = Alpha4 + LeftControl + LeftAlt

## Toggles the matching Map Layers entry. Set to None to disable.
# Setting type: KeyboardShortcut
# Default value: Alpha5 + LeftControl + LeftAlt
ToggleCPA = Alpha5 + LeftControl + LeftAlt

## Toggles the matching Map Layers entry. Set to None to disable.
# Setting type: KeyboardShortcut
# Default value: Alpha6 + LeftControl + LeftAlt
ToggleContactAge = Alpha6 + LeftControl + LeftAlt

## Toggles the matching Map Layers entry. Set to None to disable.
# Setting type: KeyboardShortcut
# Default value: Alpha7 + LeftControl + LeftAlt
ToggleExactEnemyDepth = Alpha7 + LeftControl + LeftAlt

## Toggles the matching Map Layers entry. Set to None to disable.
# Setting type: KeyboardShortcut
# Default value: Alpha8 + LeftControl + LeftAlt
ToggleDistressBeacons = Alpha8 + LeftControl + LeftAlt

TogglePlanView = Alpha9 + LeftControl + LeftAlt

[Waypoints]

## What the vanilla 'Waypoint: ETA' menu row cycles through on click: Eta (vanilla absolute clock-time arrival), Distance (vanilla nautical-mile range), or TtgSeconds (BetterTacMap's time-to-go countdown, shown as h/m/s).
# Setting type: WaypointEtaDisplayMode
# Default value: Eta
# Acceptable values: Eta, Distance, TtgSeconds
EtaDisplayMode = TtgSeconds

