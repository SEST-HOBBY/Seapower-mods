[General]
#THAAD
# Users, Land SAM:
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
RequiresWarmUp=False                   // False - removes need to reload launcher before first launch

Mass=700                            // in kg. Used for aircraft
AmmoPoints=7200                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db
[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=35
ImpactSize=Large                    // Impact size, can be small, medium, large, verylarge
Penetration=Heavy                       // can be minor, moderate, heavy, always
FuzeType=1
FuzeProximityDistance=50.0              // for proximity fuze: distance to target in meters
KillProbability=0.93                     // Base chance to hit
[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=8         // time in seconds where the missile moves straight on without guiding

#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=20.0                      // Climb angle for initial loft
MaxLoftAlt=98000.0                     // in feet. Maximum altitude for lofting
MaxLoftVelocity=5200.0
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=75              // in N. miles. Recommended to set this distance slightly less than the seeker range
SupportsBanking=True                   // if the missile will bank when turning
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation

#========================================= Launch stats ============================================================
MaxVelocity=6800                      // Maximum speed in knots
Acceleration=50                      // Acceleration factor
AccelerationTime=5.0                  // Time until start of the velocity bleed, in seconds
MaxTurnRate=360                       // Maximum turnrate in degrees per second LaunchTurnRate=20                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MinLaunchRange=27                   // Minimum launch range in nautical miles
MaxLaunchRange=108                  // Maximum launch range in nautical miles
MinAttackAltitude=20000                  // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=99000                // Maximum altitude of target, in feet
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=4.9              // Circular error radius in meters (fuse 30 with CEP 15.77 = 80%)
CircularErrorRadiusLarge=4.6         // Circular error vs 'Large' aircraft (fuse 30 with CEP 12.29 = 90%)
MinAltMalusFactor=0.8                  // Factor that multiplies the CEP value if target below min alt of AAW weapon

#Homing
SeekerGain=0                         // Seeker gain in dB
SeekerFOV=270.0                         // Seeker field-of-view in degrees
SeekerActiveRange=100.0                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=10    //40???     // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only

#ECCM
AntiCountermeasuresBonus=0.50           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.40                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructAfterTargetGone=True      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=3.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/thaad/
ResourcesRoot=thaad.obj
ResourcesMesh=Missile_2
ResourcesMaterialFolder=assets/models/weapon/thaad/textures/
ResourcesMaterial=thaad_mat.ini
ResourcesMeshForLaunch=Missile_2
ResourcesMeshCanister=Missile
ResourcesMeshSwitchTime=3.25  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/usn_rgm-109_booster
BoosterEffectPosition=0,0,0
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.032
InFlightEffectStartTime=5.5  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,0,0.01 
SustainerEffectStartTime=2

HitShipExplosion=effects/explosions/emitters/missile_hit_ship_large
HitShipExplosionRotation=0,25,0
HitAirExplosion=effects/explosions/emitters/missile_hit_air
HitAirExplosionRotation=0,25,0
HitWaterSplash=effects/splashes/emitters/splash_large
HitWaterSplashRotation=0,25,0
HitDefaultExplosion=effects/explosions/emitters/bomb_hit_ground_large
HitDefaultExplosionRotation=0,25,0
HitGroundExplosion=effects/explosions/emitters/bomb_hit_ground_large
HitGroundExplosionRotation=0,25,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.0324
Rotation=0,0,0
Scale=0.009963,0.010919,0.111335