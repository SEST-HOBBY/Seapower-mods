[General]
UnitType=LandUnit
LandUnitSubType=SAM

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.03


GroundOffset=-.001
AutoFlatten=true
MaskVegetation=False

Length=6.2                     // in meters
Beam=3.3                       // in meters
Range=227                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=50  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed



[Tacview]
Name=THAAD
Tag=Ground+Vehicle+SAM

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[ControlSystem]
