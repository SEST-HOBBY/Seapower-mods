[ ------------------------ Visual/Infared ------------------------- ]

[OLS-M]
Kind=Visual
#Infrared
VIDRangeMultiplier=1          // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=1.3           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.7             // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day


[------------------------- Radar ---------------------------]

[---Air/Air&Surface---]

[JL10A]
#Users: 
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface           // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True  // True means the radar can see ground objects
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=10       // if applicable number of targets it can track simultaneously
WeaponChannels=2       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-60,60|-90,0         // Field of View of the radar
MinRange=0.4           // min range in km
MaxRange=150.0          // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=5.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.0          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=75.0              // gain in dB on the sensor
Frequency=Ku-Band      // frequency band
PeakPower=100.0         // output peak power in kW	

[JL10]
#Users: 
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Air         // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True  // True means the radar can see ground objects
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=1       // if applicable number of targets it can track simultaneously
WeaponChannels=2       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=60.0          // Field of View of the radar
MinRange=0.4           // min range in km
MaxRange=150         // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=30.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.0          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=45.0              // gain in dB on the sensor
Frequency=Ku-Band      // frequency band
PeakPower=60.0         // output peak power in kW	

[K/JDC01A]
Kind=LaserDesignator
MaxRange=15.0                       // max distance in nm
NightCapable=True                   // is the designator can be used in low-visibility conditions
TargetChannels=2                    // number of targets that can be tracked at once
WeaponChannels=1000                 // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                           // Field of View of the designator
