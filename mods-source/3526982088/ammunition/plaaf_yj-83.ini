#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# YJ-83
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
Mass=715                             // in kg. Used for aircraft

CIWSDefenceBonus=8                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

SaturationValue=1

[SensorData]
#Visual
VisualIdentificationRange=2.5  // at what range in nm this unit can be visually identified
IRSignature=Low
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=220
ImpactSize=Large                      // Impact size, can be small, medium, large, verylarge
Penetration=Heavy                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=4.5         // time in seconds where the missile moves straight on without guiding
DropDuration=0                      // time in seconds where the missile just falls unpropelled
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=18.0                      // Climb angle for initial loft
MaxLoftAlt=12000.0                     // in feet. Maximum altitude for lofting
MaxLoftVelocity=580.0                 // Maximum speed in knots for lofting
LoftToSkim=True
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=100.0                 // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=28.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=1.5                    // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=85.0     // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=220.0              // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=22.0
FinalFlightPhaseDistToTarget=22.0      // in N. miles. Recommended to set this distance equal to the seeker range
SearchForTargetsTime=15                // in seconds. Missile will wait this time after finding before going to terminal if it 
MaxSearchTime=45                       // in seconds. Missile will wait this time after enabling seeker before going to terminal if it 
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=18.0               // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalVelocity=860.0                   // Maximum speed in knots when missile is locked on target
TerminalDiveDistance=2.5                 // in N. miles.
#============================================= Misc ================================================================
GroupSize=6                            // Indicates that missiles can join into groups
GroupJoinRange=15                      // in miles
GroupSpacing=0.06                       // in miles. interval between misseles in line
GroupLeaderAlt=200                    // in feet. altitude of leading missile. Only for FinalFlightPhase
GroupWingmanAlt=160.0                  // in feet. altitude of non-leading missile. FinalFlightPhase
#RequiresTargetToProceed=True           //Will not change its flight phase unles have a target selected by operator
SupportsBanking=True                   // if the missile will bank when turning#========================================= Launch stats ============================================================
MaxVelocity=600                      // Maximum speed in knots
Acceleration=6.2                       // Acceleration factor
MaxTurnRate=26.0                       // Maximum turnrate in degrees per second
MinLaunchRange=3                     // Minimum launch range in nautical miles
MaxLaunchRange=120                   // Maximum launch range in nautical miles
LaunchReliability=99                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=12.0                         // Seeker gain in dB
SeekerFOV=25.0                         // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
SeekerActiveRange=12                    // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=10                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
CounterMeasuresRejection=80           // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=85                      // The lower the value, the greater risk of spoofing by jamming	(0...100)
#Search params for torpedoes
#SelfDestruct
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/KH-31/
ResourcesRoot=kd88.obj
ResourcesMesh=kd
ResourcesMaterialFolder=assets/models/ammunition/KH-31/textures/
ResourcesMaterial=YJ83_mat.ini
############################################################
[Debris]
# Optional debris related stuff
DebrisProbability=95         // probability for debris to happen
ResourcesMeshForDebris=dummy // optional debris mesh after destruction
DebrisPosition=0.05          // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.99
DebrisHeightLossAdd=0.0005   // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=None
#BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.028
InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosionClass=MediumMissileExplosions
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.06606571
