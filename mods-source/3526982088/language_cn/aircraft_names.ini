Type=战斗轰炸机
Default=歼轰7A战斗轰炸机,歼轰7A战斗轰炸机
DefaultDescription=歼轰-7，又名飞豹，对外名称FBC-1（JH-7），北约代号：比目鱼（Flounder），是中国于20世纪80年代开始自行设计研制的中型战斗轰炸机。由中国西安飞机制造集团与603研究所合作设计制造，其主要用以进行战役纵深攻击以及海上和地面目标攻击，可进行超音速飞行。该战机于1973年开始研发，至1988年首次试飞，在1988年范保罗航展上首次以模型形式亮相，1998年珠海航展上首次公开，其改良型歼轰-7A则在2004年公布。
Squadron1=JH7A,JH7A战斗轰炸机
