# ------------------ AAM ------------------

plaaf_pl-2=PL-2,,空对空,霹雳-2导弹是中国的一种近程空对空导弹，仿制自由苏联引进的K-13导弹，于1972年定型生产。

plaaf_pl-5b=PL-5B,,空对空,霹雳-5空对空导弹是中国战斗机使用的一种短程红外寻的导弹。它基于苏联R-13导弹技术，类似于 AIM-9 响尾蛇。

plaaf_pl-8=PL-8,,空对空,霹雳-8近距空空导弹是中国研制的红外格斗空空导弹，由西安东方机械厂大批生产，仿制自以色列怪蛇3导弹。

