DefaultDescription=The JH-7, also known as the Feibao (Flying Leopard), with the external designation FBC-1 (JH-7) and the NATO reporting name Flounder, is a medium-sized fighter-bomber independently designed and developed by China starting from the 1980s. Collaboratively designed and manufactured by Xi'an Aircraft Manufacturing Group and the 603 Research Institute, it is primarily used for deep campaign attacks as well as strikes against maritime and ground targets, and is capable of supersonic flight. The development of this aircraft began in 1973, with its first test flight in 1988. It first appeared in model form at the 1988 Farnborough Airshow and was publicly unveiled at the 1998 Zhuhai Airshow. Its improved version, the JH-7A, was announced in 2004.
