Name=S-70B-2 Seahawk with AGM-114 'Hellfire' Missiles
Description=The S-70B-2 Seahawk is a derivative of the SH-60F, but was designed by Sikorsky to meet RAN specifications for anti-submarine warfare (ASW) and anti-surface surveilance and targeting (ASST) operations.

This asset is currently WIP while I tweak some minor things but instead of holding onto it I wanted to release it for everyone to use as is and iterate on it, especially with texturing as I am garbage at textures and learnt everything from scratch for this mod.

*Important: This model has been implemented into Sea Power with the original authors permission**.
**This permission does not extend to any of Simpson's Virtual Slipway other models, if you would like to implement any of his other models you MUST request permission as these are copyrighted assets.

If you'd like to see more of Jason's work, head over to https://www.simpsonslipways.com/home.html

If you need help installing the Pre-Requisite files to run this mod, please check out Skyblazer's tutorial at https://www.youtube.com/watch?v=2PTAQYOCjcw

This helicopter can be spawned through the Encyclopedia or I have included two updated .ini for the Spruance and Oliver Hazard Perry who are setup to operate this aircraft (Optimised for their flight deck and hangar+taxi path)

Special thanks to Jason Simpson of Simpson's Virtual Slipway for permission to utilise his model and providing me with another source file for another Seahawk variant ;)

And thank you to Skyblazer for his assistance with fault finding some issues I was having and to the wider BuOrd: Naval Modding Community discord!!

I hope you enjoy the mod, please feel free to iterate on this mod all I ask is that you credit those who worked on this before you :)

