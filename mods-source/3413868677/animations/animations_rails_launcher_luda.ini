[Animations]
NumberOfAnimations=2

Animation1=UnloadAmmunition
Animation2=LoadAmmunition

[UnloadAmmunition]
NumberOfSequencesToPlay=1
Sequence1=MoveMissileDown
Sequence1_Model=SpawnedObject

[LoadAmmunition]
NumberOfSequencesToPlay=2
Sequence1=SpawnMissile
Sequence1_Model=Dummy  // doesn't matter here, spawned object (missile) is used, keep the entry so the logfile doesn't contain a warning
Sequence2=MoveMissileUp
Sequence2_Model=SpawnedObject

[SpawnMissile]
UseLauncherPositionOffsets=True  // optional, if true means that it uses the launcher position offsets from the ammunition file in section [Launchers]
Spawn=True
NumberOfSteps=1
Time1=0
PositionZ1=0           // can be 0 here as we use the missile specific positions from the ammunition file from section [Launchers]

[MoveMissileUp]
UseLauncherPositionOffsets=True  // optional, if true means that it uses the launcher position offsets from the ammunition file in section [Launchers]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionZ1=0           // can be 0 here as we use the missile specific positions from the ammunition file from section [Launchers]
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1                // time in seconds - here for the end
PositionZ2=0           // can be 0 here as we use the missile specific positions from the ammunition file from section [Launchers]
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[MoveMissileDown]
UseReverseLauncherPositionOffsets=True  // optional, if true means that it uses the reverse launcher position offsets from the ammunition file in section [Launchers]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionZ1=0           // can be 0 here as we use the missile specific positions from the ammunition file from section [Launchers]
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1                // time in seconds - here for the end
PositionZ2=0           // can be 0 here as we use the missile specific positions from the ammunition file from section [Launchers]
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry
