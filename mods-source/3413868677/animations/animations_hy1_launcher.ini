// possible values for rotations are either a complete vector (x,y,z)
// or single axis like RotationX1, RotationY1, RotationZ1
// same is true for positions
// both rotation and position values are optional, so if you leave the position away,
// only the rotation will be applied

[HatchOpenAnimSequence_Front]
NumberOfSteps=3
Time1=0                // time in seconds for the start
PositionZ1=0.072
RotationX1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=3                // time in seconds - here for the end
PositionZ2=0.072
RotationX2=-90
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry
Time3=5                // time in seconds - here for the end
PositionZ3=0.064
Smoothness3=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

