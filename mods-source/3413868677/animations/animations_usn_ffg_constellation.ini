[------------------------------ Sequences ------------------------------]
#Open Doors
[HangarOpenDoor1AnimSequence]
NumberOfSteps=3
#Step<i>=Time|Position|Rotation|SmoothnessType
#Step<i>=0|None|0,0,0|Linear
Step1=0|x,0.097,-0.685|15,y,z|Linear
Step2=8|x,0.16,-0.66|80,y,z|Linear
Step3=12.5|x,0.178,-0.62|90,y,z|Linear

#Close Doors
[HangarCloseDoor1AnimSequence]
NumberOfSteps=3

Step1=0|x,0.178,-0.62|90,y,z|Linear
Step2=4.5|x,0.16,-0.66|80,y,z|Linear
Step3=12.5|x,0.097,-0.685|15,y,z|Linear

#Both bottom and up variants of definition is equal

Time1=0                // time in seconds for the start
PositionY1=0.178
RotationX1=90
Smoothness1=Linear  // can be: Linear, EaseInOut - transition to the next step
Time2=1               // time in seconds - here for the end
PositionY2=0.17
RotationX2=70
Smoothness2=Linear  // can be: Linear, EaseInOut - is not used here as it's the last entry
Time3=12.5                // time in seconds - here for the end
PositionY3=0.095
RotationX3=15
Smoothness3=Linear  // can be: Linear, EaseInOut - is not used here as it's the last entry


