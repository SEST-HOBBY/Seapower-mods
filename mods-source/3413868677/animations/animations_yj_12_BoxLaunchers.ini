[------------------------------ Sequences ------------------------------]
// possible values for rotations are either a complete vector (x,y,z)
// or single axis like RotationX1, RotationY1, RotationZ1
// same is true for positions
// both rotation and position values are optional, so if you leave the position away,
// only the rotation will be applied

[HatchOpenAnimSequence_F]
NumberOfSteps=2
Step1=0|x,y,z|0,90,90|Linear
Step2=1|x,y,z|0,90,180|Linear

[HatchOpenAnimSequence_A]
NumberOfSteps=2
Step1=0|x,y,z|0,-90,-90|Linear
Step2=1|x,y,z|0,-90,-180|Linear

[HatchCloseAnimSequence_F]
NumberOfSteps=2
Step1=0|x,y,z|0,90,180|Linear
Step2=1|x,y,z|0,90,90|Linear

[HatchCloseAnimSequence_A]
NumberOfSteps=2
Step1=0|x,y,z|0,-90,-180|Linear
