[Animations]
NumberOfAnimations=2
Animation1=MoveDownElevator1
Animation2=MoveUpElevator1

[MoveDownElevator1]
NumberOfSequencesToPlay=1
Sequence1=Elevator1MoveDownSequence
Sequence1_Model=Elevator

[MoveUpElevator1]
NumberOfSequencesToPlay=1
Sequence1=Elevator1MoveUpSequence
Sequence1_Model=Elevator

[------------------------------ Sequences ------------------------------]

[Elevator1MoveDownSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionY1=-0.094
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=10               // time in seconds - here for the end
PositionY2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Elevator1MoveUpSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionY1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=10               // time in seconds - here for the end
PositionY2=-0.094
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry
