[General]
#30 kW Laser
Type=Projectile                // can be Projectile, Missile, Torpedo
TargetType=AAW                // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

DecalClass=GunImpacts          // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=40000             // meter per second
MaxRange=14000                 // in meters
GravityFactor=99999
CircularErrorProbable=0      // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=4
ImpactSize=Medium             // Impact size, can be small, medium, large, verylarge
Penetration=Always             // can be minor, moderate, heavy, always
FuzeType=1
FuzeProximityDistance=4             // for proximity fuze: distance to target in yard
SmartFuse=False
KillProbability=150  

[---------- Effects ----------]
[Particles]
TrailEffect=
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosionClass=SmallGroundHitExplosions	//MediumGroundHitExplosions	//LargeMissileExplosions
