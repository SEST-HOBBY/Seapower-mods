#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# RUM-139 VL-ASROC
Type=Missile                           // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW
Mass=487                               // in kg. Used for aircraft
AmmoPoints=1217                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

[SensorData]
#Visual
VisualIdentificationRange=4            // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                     // Transient visibility on the radar
TransientVisualIdentificationRange=5   // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
[WarheadData]
#No need to specify anything since its warhead is never used

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
DefaultHorizonHeight=2000              // in feet. Target height for calculating default horizon rings
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=35.0                      // Climb angle for initial loft
MaxLoftAlt=6000.0                     // in feet. Maximum altitude for lofting
MaxLoftVelocity=750.0                 // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=5                 // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=750.0                     // Maximum speed in knots
MaxTurnRate=2.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=120                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=5.2                       // Burn time for initial booster burn
Acceleration=7.13                      // Gs of acceleration in initial burn
SustainerAccelerationTime=-1            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=-1               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=0					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0		           		// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0		       		// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=0.8                       // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.6                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=100                       // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MinLaunchRange=0.5                     // Minimum launch range in nautical miles
MaxLaunchRange=13.0                    // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
#ECCM
#SelfDestruct
SelfDestructDelay=1.0                  // delay in seconds for self destruction
