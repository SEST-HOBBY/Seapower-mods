#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# RUR-5 ASROC + Nuclear Depth Charge
Type=RBU                               // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=487                               // in kg. Used for aircraft
AmmoPoints=10000                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
SupplyCategory=Nuclear_ASW              // For Supply System. Makes that presence of such category is required for replenishment of this weapon

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
[WarheadData]
WarheadType=0
#200kT warhead, lethal radius 10km
Power=3636
ImpactSize=10000                      // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

FuzeProximityDistance=1000                // for proximity fuze: distance to target in meter
SmartFuse=True                  // Explodes not immediately but when when target start to go away
KillProbability=5.0                    //Chance to intercept torpedo

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
SinkRate=20.0                          // sink rate in m/s (for depth charges)
MaxDepth=4000                          // max depth in feet (for depth charges)
#========================================= Launch stats ============================================================
MaxVelocity=1000                        // Maximum speed in knots
Acceleration=40                        // Acceleration factor
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second

MinLaunchRange=10.00                    // Minimum launch range in nautical miles
MaxLaunchRange=100.00                    // Maximum launch range in nautical miles

LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=200.0                // Circular error radius in meter
ApplyKinematics=False
[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
# TODO
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/usn_rur-5/
ResourcesRoot=usn_rur-5
ResourcesMesh=usn_rur-5
ResourcesMaterial=usn_rur-5_mat
ResourcesMeshForLaunch=usn_rur-5_dummy
ResourcesMeshCanister=usn_rur-5_dummy
ResourcesMeshSwitchTime=0.2  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

# References to the launchers are just used for positioning relative to the launcher of the missile
[Launchers]
NumberOfLaunchers=3
Launcher1=MK10
Launcher2=MK26
Launcher3=MK13

[MK10]
LoadedPosition=0,0,0.005
UnloadedPosition=0,0,-0.09
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[MK26]
LoadedPosition=0,0,0.02
UnloadedPosition=0,0,-0.07
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[MK13]
LoadedPosition=0,0,0.02
UnloadedPosition=0,0,-0.07
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/usn_rur-5_booster
BoosterEffectPosition=0,0,0
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.038
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.022

HitShipExplosion=effects/explosions/emitters/nuclear_underwater_part
HitAirExplosion=effects/explosions/emitters/nuclear_underwater_part
HitDefaultExplosion=effects/explosions/emitters/nuclear_underwater_part
HitWaterSplash=SmallWaterSplashes
ExplosionOverwaterSplash=effects/explosions/emitters/nuclear_underwater_surface_part

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.003
Rotation=0,0,0
Scale=0.005,0.005,0.045