#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Users: wp_rkr_andropov
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All      // can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes
CIWSDefenceBonus=50                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.25                     // Less chance to be intercepted by SAM because of anti-interception maneuvers
#hypersonic SAM

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=1
Power=1000000000
ImpactSize=Large                      // Impact size, can be small, medium, large, verylarge
Penetration=Always                    // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.6         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=60.0                      // Climb angle for initial loft
MaxLoftAlt=98000.0                     // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
#Radio-command SAM are going into Terminal stage immediately, so all previous stages are not needed
TerminalApproachDist=100              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
TerminalDiveDistance=50                 // in N. miles.
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#========================================= Launch stats ============================================================
MaxVelocity=15200                       // Maximum speed in knots
#VelocityBleed=0.01                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
Acceleration=500.1                       // Acceleration factor
MaxTurnRate=18.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=1400                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MinLaunchRange=500.0                     // Minimum launch range in nautical miles
MaxLaunchRange=2000.0                    // Maximum launch range in nautical miles
MinAttackAltitude=0                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=130000                // Maximum altitude of target, in feet
LaunchReliability=100                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=2     // Circular error vs 'Installation' land units
#Homing
SeekerFOV=0.5                          // Seeker field-of-view in degrees
SeekerGimbalFOV=10                     // Seeker gimbal FOV in degrees
SeekerActiveRange=0.0
SeekerPassiveRange=0.0001                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/wp_sa-n-6/
ResourcesRoot=wp_sa-n-6
ResourcesMesh=wp_sa-n-6
ResourcesMaterial=all_tungsten_rod_mat.ini
############################################################

NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
HitShipExplosion=effects/explosions/emitters/Ammo_ship_explosion_1
HitGroundExplosion=effects/explosions/emitters/Ammo_ship_explosion_1
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=LargeWaterSplashes


[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043