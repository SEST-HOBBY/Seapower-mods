#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# M-22 «Uragan»
# Users: wp_cv_orel, wp_em_sovremenny
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=ShoreTargetsOnly // can be  All, Installation, Mobile, ShoreTargetsOnly
RequiresWarmUp=False  //False - removes need to reload launcher before first launch

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=300                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=35
ImpactSize=SemiSmall                        // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                      // can be minor, moderate, heavy, always

FuzeProximityDistance=15.0              // for proximity fuze: distance to target in meters. Also indicates that Fuze Type = Proximity Fuze

KillProbability=0.93                     //Chance to intercept missile
InterceptOutOfAltitudePenalty=0.1                  // yay!
InterceptSpeedPenaltyMultiplier=0.2                  // yay!
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.6         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=40.0                      // Climb angle for initial loft
MaxLoftAlt=50000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=10               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=False                 // if true connection with a guiding radar will be severed upon entering terminal approach 
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance 
TerminalDiveDistance=10                 // in N. miles.calculationstage#========================================= Launch stats ============================================================
ApplyKinematics=True                   // 如果我们使用完整的运动学规则。如果这是真的，我们将只使用运动学
MaxVelocity=1600                    // Stall at 400 knots   // Maximum speed in knots
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
AccelerationTime=8                  // 初始助推器燃烧的燃烧时间
Acceleration=14.3                   // 初始燃烧阶段的加速度Gs
SustainerAccelerationTime=-1            // 持续燃烧时间。若无持续燃烧，则记为-1
SustainerAcceleration=-1               // 持续燃烧加速。若无持续燃烧，则值为-1
#---- Total Δv ≈ 1126 ≈ 3.31Ma

TypicalLaunchVelocity=0 
TypicalFiringAlt=0                    //SAM的阻力计算应该从0高度开始

DragCoefficient=-1               // 阻力系数。0表示无阻力，1表示默认阻力，数值越大表示阻力越大。默认值为-1，此时我们会根据导弹的最大射程来计算阻力系数

MaxFlightTime=160               // 基于电池等因素，导弹完全失效前的运行时间作为硬限制。默认值：无限

MaxTurnRate=28.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=100                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MinLaunchRange=0.5                    // Minimum launch range in nautical miles
MaxLaunchRange=38.0                    // Maximum launch range in nautical miles
MinAttackAltitude=10                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=70000                // Maximum altitude of target, in feet
MaxAttackVelocity=2200				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=48.0                        // Seeker gain in dB
SeekerFOV=60.0                         // Seeker field-of-view in degrees
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
#SeekerPassiveRange=10                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=10.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=10.0                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.5          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.4                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=2.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=wp_sa-n-7
AssetBundleDamagedMesh=
AssetBundleMaterial=wp_sa-n-7_mat
AssetBundleMeshHullCollider=wp_sa-n-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/wp_sa-n-7/
ResourcesRoot=wp_sa-n-7
ResourcesMesh=wp_sa-n-7
ResourcesMaterial=wp_sa_n_12_mat.ini
############################################################

NumberOfSubModels=0


[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.043

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.04
InFlightEffectStartTime=4.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=coll_main

[coll_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043
