#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# 3M55 "Oniks"
# Users: lots
Type=Missile
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation      // can be  All, Installation, Mobile, ShoreTargetsOnly

CIWSDefenceBonus=30                     // added chance to evade CIWS compounded by below factors
MissileDefenceBonus=0.10                     // added chance to evade missile compounded by below factors
#weaving terminal maneuver

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

SaturationValue=2

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance
TransientBaseNoise=240                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = HighExplosive     =  100% damage to structre
#1 = Armor Piercing		TBD
#2 = HEAT				TBD
#3 = Illumination		TBD
#4 = Cluster           =  -50% damage to structre
#5 = Runway Cratering	TBD
#6 = Fragmentation     =  -50% damage to structre
[WarheadData]
WarheadType=0
Power=60
ImpactSize=Large                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                       // can be minor, moderate, heavy, always

[OnBoardSystems]
ECM=SS-N-12B_ECM

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=50.0                      // Climb angle for initial loft
MaxLoftAlt=65000.0                      // in feet. Maximum altitude for lofting
MaxLoftVelocity=1725.0                 // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=35.0                    // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=75.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=1.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=65        // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=16                 // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=15.0
FinalFlightPhaseDistToTarget=32.0      // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=20                // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalVelocity=1400                  // Maximum speed in knots when missile is locked on target
SupportsBanking=False                  // if the missile will bank when turning
TerrainFollowFlight=True
#========================================= Launch stats ============================================================
MaxVelocity=1320                       // Maximum speed in knots
Acceleration=8.0                      // Acceleration factor
Deceleration=2.0                      // Deceleration factor
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=30                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MinLaunchRange=3                       // Minimum launch range in nautical miles
MaxLaunchRange=320                     // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)

#Dot: Blocked until fixed
#nstk: causes missile to lose target and re-acquire randomly based on distance, causes horde swarms and isnt very good overall
#WobblingStrength=50.0                  // amplitude of wobbling
#WobblingSpeed=2.5                      // frequency of wobbling
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=50.0                        // Seeker gain in dB
SeekerFOV=90,10                        // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerActiveRange=14.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SecondaryPassiveRadarGuidanceType=Full  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
#SeekerPassiveRange=65                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                       //Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=38                           //Active radar seeker output peak power in kW
DefaultIgnoredTypes=LandUnit           // Seeker ignores objects of this type while in default mode
UseFinalFlightInLandMode=False         // Skip FinalFlightPhase when in LandAttack mode
CircularErrorRadiusInstallation=1.5    // Circular error vs 'Installation' land units
#ECCM
AntiCountermeasuresBonus=0.48           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.50                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // delay in seconds for self destruction
ApplyKinematics=False
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-8
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-8_mat
AssetBundleMeshHullCollider=usn_rim-8_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/usn_rim-8/
ResourcesRoot=usn_rim-8
ResourcesMesh=usn_rim-8
ResourcesMaterial=wp_ss_n_26a_mat.ini
ResourcesMeshForLaunch=usn_rim-8_dummy
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
[---------- Launchers ----------]
# References to the launchers are just used for positioning relative to the launcher of the missile
[Launchers]
NumberOfLaunchers=1
Launcher1=MK7

[MK7]
LoadedPosition=0,0,0.041
UnloadedPosition=0,0,-0.11
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/usn_rim-8_booster
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/turbojet_sustainer
InFlightEffectPosition=0,0,-0.018
InFlightEffectStartTime=6.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07

