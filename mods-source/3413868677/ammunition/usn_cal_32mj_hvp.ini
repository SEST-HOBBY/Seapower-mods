[General]
#HVP 32 MJ Railgun
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW            // can be AAW, ASuW, ASW
SecondaryTargetType=AAW

Mass=12.7                               // in kg. Used for aircraft
AmmoPoints=12.7                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=2245         // meter per second
MaxRange=204000             // in meters
CircularErrorProbable=10   // radius in meters at max range for shells to impact
KillProbability=0.04       // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Warhead Data ----------]
[WarheadData]
Power=6.8
ImpactSize=Medium          // Impact size, can be small, medium, large, verylarge
Penetration=Heavy          // can be minor, moderate, heavy, always

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_large_shell
HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground
HitGroundExplosionClass=MediumGroundHitExplosions