#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# 9M96
# Users: wp_skr_admiral_gorshkov
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
RequiresWarmUp=False  //False - removes need to reload launcher before first launch

Mass=340                               // in kg. Used for aircraft
AmmoPoints=680                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

CIWSDefenceBonus=30                     // added chance to evade CIWS compounded by below factors
MissileDefenceBonus=0.15                     // added chance to evade missile compounded by below factors
#supersonic SAM

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                     // Transient visibility on the radar
TransientVisualIdentificationRange=5   // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=20
ImpactSize=Small                    // Impact size, can be small, medium, large, verylarge
Penetration=Always                      // can be minor, moderate, heavy, always
Bomblets=0                              // Number of bomblets carried
Dispersion=0                            // Area covered by bomblets in square km

FuzeProximityDistance=5.0              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.90                     //Chance to intercept missile
InterceptOutOfAltitudePenalty=0.15                  // yay!
InterceptSpeedPenaltyMultiplier=0.3                  // yay!
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
InitialFlightPhaseDuration=0.6         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=60.0                      // Climb angle for initial loft
MaxLoftAlt=50000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=8                // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=False                // if true connection with a guiding radar will be severed upon entering terminal approach stage
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#========================================= Launch stats ============================================================
MaxVelocity=3300                       // Maximum speed in knots
Acceleration=20.0                      // Acceleration factor
VelocityBleed=0.35                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
AccelerationTime=4                     // Time until start of the velocity bleed, in seconds
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=720                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MinLaunchRange=1.0                     // Minimum launch range in nautical miles
MaxLaunchRange=27                     // Maximum launch range in nautical miles
MinAttackAltitude=15                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=100000                // Maximum altitude of target, in feet
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=60.0                        // Seeker gain in dB
SeekerFOV=45.0                          // Seeker field-of-view in degrees
SeekerGimbalFOV=120                     // Seeker gimbal FOV in degrees
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
#SeekerPassiveRange=12                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=12.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=20.0                         // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.4          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.35                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // delay in seconds for self destruction

ApplyKinematics=True
DragCoefficient=-1
MaxFlightTime=108
TypicalTargetAlt=15000
TypicalFiringAlt=0
TypicalLaunchVelocity=0

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/wp_sa-n-9/
ResourcesRoot=wp_sa-n-9
ResourcesMesh=wp_sa-n-9
ResourcesMaterial=wp_sa_n_28_mat.ini
############################################################
NumberOfSubModels=3

SubModel1=Nose
SubModel2=Fins_Front
SubModel3=Fins_Rear

