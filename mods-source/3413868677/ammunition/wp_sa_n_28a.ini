#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================

[General]
# 9M96 
Type=Missile                          // can be Projectile, Missile, Torpedo
TargetType=AAW                        // can be AAW, ASuW, ASW

Mass=333                              // in kg. Used for aircraft
AmmoPoints=1332                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.2
MinCameraDistanceBroadside=0.2
CameraPivotHeight=0

DecalClass=SAMImpacts                 // referenced in effects/decals.ini

FrontalArea=0.0661
SideArea=0.7583
BottomArea=0.7584

[SensorData]
#Visual
VisualIdentificationRange=4           // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=15 // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=8
ImpactSize=Small                      // Impact size, can be small, medium, large, verylarge
Penetration=Minor                     // can be minor, moderate, heavy, always

FuzeProximityDistance=10              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.9                   // Base chance to hit
InterceptSpeedPenaltyMultiplier=0.85  // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
InterceptOutOfAltitudePenalty=0.3     // base value used for out-of-altitude calculations, 0.20 is excellent, 0.30 is good, 0.40 is average, 0.50 is poor
InterceptSizePenaltyMultiplier=0.7    // multiplier to the size penalty, 1.0 is default

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=3                 // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
InitialFlightPhaseDuration=1          // time in seconds where the missile moves straight on without guiding
Retargetable=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAlt=65617                      // in feet. Maximum altitude for lofting
MaxLoftVelocity=2138                  // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=7                // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=True                // if true connection with a guiding radar will be severed upon entering terminal approach stage
SupportsBanking=False                 // if the missile will bank when turning
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                  // If we should use full kinematics rules. If this is true, we will only use kinematics
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=2138                      // Maximum speed in knots
MaxTurnRate=40                        // Maximum turnrate in degrees per second
MaxTurnG=60                           // Maximum G-limit of missile turns
LaunchTurnRate=100                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=1                    // Burn time for initial booster burn
Acceleration=10                       // Gs of acceleration in initial burn
SustainerAccelerationTime=8          // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=13.5               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=20808                // Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=0                  // Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=0                    // Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0               // Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=2.05                   // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
MaxFlightTime=60                      // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
LiftFactor=0.0015                     // default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
TimeLimited=True
TerminalLoft=True
#========================================= Launch stats ============================================================
MinLaunchRange=0.81                   // Minimum launch range in nautical miles
MaxLaunchRange=22                     // Maximum launch range in nautical miles
MinAttackAltitude=16                  // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=65617               // Maximum altitude of target, in feet
MaxAttackVelocity=1944                // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=0.98                // Chance that engine will start when launching from aircraft
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=60                         // Seeker gain in dB
SeekerFOV=60                          // Seeker field-of-view in degrees
SeekerGimbalFOV=120                   // Seeker gimbal FOV in degrees
SeekerActiveRange=8                   // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=0                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                      // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=5                           // Active radar seeker output peak power in kW
TargetMemory=True                     // Always locks on preselected target unless spoofed or jammed
#Misc Guidance Properties
#ECCM
AntiCountermeasuresBonus=0.65          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.60                  // This value substracted from probability of being jammed  (0...1)
#SelfDestruct
SelfDestructDelay=2                   // delay in seconds for self destruction

