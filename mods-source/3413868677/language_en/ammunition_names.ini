# ----------- Noisemakers/Chaff -----------
usn_adc_mk2_noisemaker_rsa=Noisemaker,ADC Mk2,Torpedo Decoy,The ADC Mk2 mod 0 Torpedo Decoy is an acoustic countermeasure designed to mimic the signature of a vessel's cavitation noise, either a submarine or ship, which attempts to lure away torpedoes from the vessel. The Mk2 has a 6 minute lifetime, and greater emitting capacity given its larger size.
usn_adc_mk4_jammer_rsa=Jamming Noisemaker,ADC Mk4,Torpedo Decoy,The ADC Mk4 Torpedo Decoy is an acoustic countermeasure designed to confuse both torpedo seekers and opponent sonars, although experienced sonar operators can easily pick out false contacts from real ones. This is an extremely effective countermeasure, but only lasts for 1 minute before it's battery depletes.

plan_726_4_chaff=Chaff

# ----------------- Decoys ----------------
usn_an_slq_25a_nixie_decoy=AN/SLQ-25A,Nixie,Decoy,The Nixie (formally the AN/SLQ-25A) is a towed decoy system utilised primarily by the surface ships of the USN. The System generates signals designed to lure approaching torpedoes away from the host platform. The SLQ-25A model has greater radiating characteristics, and can fool incoming torpedoes with greater ease.

# ---------- Lasers ----------
all_laser=Laser,,DEW,Shipboard directed-energy weapons (DEWs) are high-energy laser systems developed to give naval vessels a new layer of close-in defense and sensor control. Unlike missiles or guns, they use concentrated beams of light to disable or destroy targets at the speed of light, with an effectively unlimited magazine so long as the ship can supply power.
all_600kW_laser=Laser,,DEW,Shipboard directed-energy weapons (DEWs) are high-energy laser systems developed to give naval vessels a new layer of close-in defense and sensor control. Unlike missiles or guns, they use concentrated beams of light to disable or destroy targets at the speed of light, with an effectively unlimited magazine so long as the ship can supply power.
