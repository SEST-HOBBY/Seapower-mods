[usn_fa_xx]
Type=Fighter
Default=F/A-38A Specter,F/A-38A
DefaultDescription=The F/A-38 is the U.S. Navy’s sixth-generation carrier-capable strike fighter, fielded as the outcome of the F/A-XX program. It has replaced the F/A-18E/F Super Hornet in front-line service and now serves as the backbone of carrier air wings. Optimized for long-range Pacific operations, the F/A-38 combines next-generation stealth, smart-skin sensor technology, and optionally-manned operation. It is a true multi-role aircraft, capable of both precision strike missions and high-end air combat. With greater range and payload than its predecessors, the F/A-38 extends the Navy’s ability to project power from the sea into heavily defended airspace.
Squadron1=F/A-38A,F/A-38A
Callsigns=Squadron1,Bee

[usaf_f_47]
Type=Fighter
Default=F-47A Talon,F-47A
DefaultDescription=The F-47 is the U.S. Air Force’s first operational sixth-generation fighter, developed under the Next Generation Air Dominance (NGAD) program. It has fully replaced the F-22 Raptor in the air-superiority role. Designed for operations in highly contested environments, the F-47 combines extreme stealth shaping, advanced sensor fusion, and AI-driven battle management. It can command formations of unmanned aircraft, extend battlespace awareness across theaters, and engage targets at ranges far beyond earlier fighters. With supercruise engines and deep-strike capability, the F-47 ensures U.S. dominance in both offensive and defensive air operations.
Squadron1=F-47A,F-47A
Callsigns=Squadron1,Brick

[usn_f-14e]
