[wp_tavkr_ulyanovsk]
Type=TAVKR,Aircraft Carrier
Default=Ulyanovsk-class,Ulyanovsk
DefaultDescription=Ulyanovsk, Soviet designation Project 1143.7, was a STOBAR aircraft carrier laid down at the now-defunct Black Sea Shipyard on 25 November 1988 as the first of a class of nuclear-powered supercarriers for the Soviet Navy. It was intended for the first ship to offer true blue water naval aviation capability for the Soviet Union, as the ship would have been equipped with two steam catapults that could launch heavier fixed-wing aircraft, representing a major advance over the comparatively smaller Kuznetsov class, which could only launch lighter/partly loaded aircraft via a bow ski-jump. However, construction of Ulyanovsk was stopped at about 40% due to the dissolution of the Soviet Union in 1991, and the unfinished hull was later scrapped in early 1992.
Variant1=TAVKR Ulyanovsk,Ulyanovsk
Variant2=TAVKR Murmansk,Murmansk

[wp_rkr_varyag_95]
Type=TARKR,Missile Cruiser
Default=Kirov II-class (1995—Fictional),Kirov II
DefaultDescription=The Project 1144.4 Orlan, or Kirov II-class, the second batch of the Kirov-class guided-missile battlecruisers, is a modernized, nuclear-powered warship currently in service with the Russian Navy, boasting a displacement of 24,300–28,000 tons. This formidable platform has replaced its outdated Top Sail and Top Steer radars with a state-of-the-art sensor suite, including Sky Watch (Mars Passat) flat-panel PESA arrays mounted around the superstructure for 360-degree air surveillance, the extremely long-range MR-850 Forum radar derived from Podberezovik for early threat detection, and the Top Plate (Fregat-MA) radar for medium-range tracking of sea-skimming targets. Its air defenses have been significantly enhanced with the SA-N-20B (3S90M Shtil) long-range SAM system and the short-range SA-N-9 (9K331 Kinzhal) missile system, providing robust layered protection. Point defenses are bolstered by the CADS-N-1 (Kortik) CIWS, integrating 30mm rotary cannons and SA-N-11 (9M311K) missiles for close-in threat interception. Retaining its original armament of 20 SS-N-19 Shipwreck (P-700 Granit) supersonic anti-ship missiles, the Kirov II-class remains a versatile and powerful asset, capable of dominating modern naval battlefields with its advanced sensors and comprehensive defensive and offensive systems.
Variant1=Varyag RKR-100,Varyag
Variant2=Grozny RKR-108,Grozny

