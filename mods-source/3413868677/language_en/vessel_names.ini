Variant2=New Jersey BB-62,New Jersey
Variant3=Missouri BB-63,Missouri
Variant4=Wisconsin BB-64,Wisconsin

[usn_aem_nathan_hale]
Type=AEM,Fleet Auxiliary
Default=Nathan Hale-class (Fictional),Nathan Hale
DefaultDescription=The Nathan Hale-class AEM (Missile Ammunition Auxillary) is a very large United States missile-armed warship colloquially known as an 'Arsenal Ship' from the program of the same name. In the 1980's, the USN had determined that with the introduction of Mark 41 VLS and the Tomahawk missile, the fleet could easily expend hundreds of missiles in a single week, so studies were made to plan a new generation of VLS armed warships, and the concept of a very large warship carrying 500+ missiles alone become attractive. However, such a purpose-built warship would be exorbitantly expensive, so the Nathan Hale-class uses a modified conventional Bulk Carrier layout, with VLS and other systems to provide a minimum amount of self defense.
Variant1=Nathan Hale AEM-1,Nathan Hale
Variant2=John Adams AEM-2,John Adams
Variant3=James Wilson AEM-3,James Wilson
Variant4=Thomas Jefferson AEM-4,Thomas Jefferson

[usn_aem_james_madison]
Type=AEM,Fleet Auxiliary
Default=James Madison-class (Fictional),James Madison
DefaultDescription=The Lockheed Martin Marine Systems Arsenal Ship Baseline 1A was a conceptual low-observable design developed for the U.S. Navy’s Arsenal Ship program in the mid-1990s. It featured a minimal superstructure, low freeboard, and a clean flat deck housing 384 vertical launch system cells for Tomahawk and other missiles, with no onboard radar, fire-control systems, or guns. The ship was highly automated, operated with a crew of fewer than 50, and functioned solely as a networked floating magazine that received targeting data through the Cooperative Engagement Capability from allied ships or aircraft.
Variant1=James Madison AEM-5,James Madison
Variant2=Nathanael Greene AEM-6,Nathanael Greene
Variant3=John Jay AEM-7,John Jay
Variant4=Gouverneur Morris AEM-8,Gouverneur Morris
Variant5=John Stark AEM-9,John Stark
Variant6=Baron von Steuben AEM-10,Baron von Steuben
Variant7=Marquis de Lafayette AEM-11,Marquis de Lafayette
Variant8=Casimir Pulaski AEM-12,Casimir Pulaski
Variant9=Kamehameha AEM-13,Kamehameha
Variant10=Horatio Gates AEM-14,Horatio Gates

[usn_cgn_virginia_vls_refit]
Type=CGN,Missile Cruiser
Default=Virginia-class (VLS—Fictional),Virginia
DefaultDescription=The Virginia-class nuclear-powered guided-missile cruisers received a Vertical Launch System refit to enhance their strike and air defense capabilities. The modernization replaced the existing twin-arm launchers with Mk 41 VLS modules, allowing the ships to carry a larger and more versatile mix of Standard Missiles, Tomahawk cruise missiles, and ASROC anti-submarine weapons. Upgraded combat systems and fire control software improved target tracking and engagement speed, while the ships retained their nuclear propulsion, granting unlimited range and high sustained speeds. The refit extended the operational relevance of the class, enabling them to counter evolving air, surface, and subsurface threats with greater flexibility.
Variant1=Virginia CGN-38,Virginia
Variant2=Texas CGN-39,Texas
Variant3=Mississippi CGN-40,Mississippi
Variant4=Arkansas CGN-41,Arkansas

[usn_cgn_california_alt]
Type=CGN,Missile Cruiser
Default=California-class (Fictional),California
DefaultDescription=The two California-class cruisers were commissioned into the USN between 1974 and 1975, serving as ideal fast carrier task force escorts with their effectively unlimited range. Designed from the ground up around nuclear power, these ships were described as the first nuclear-powered surface units intended for series production (vs the proceeding Long Beach, Bainbridge, and Truxtun, all singular ships). Construction proved very expensive, and follow on units were canceled in favor of the later Virginia-class cruisers. In service, these were capable ships which mounted fore and aft Mark 13 missile launchers and 5" guns, with an ASROC launcher and reloads forward. Refits in the early 1980s added Phalanx CIWS and updated the electronic warfare suite to the AN/SLQ-32(V)3. Both ships were retired in the late 1990s, despite expensive refueling refits undertaken only a few years prior.
Variant1=California CGN-36,California
Variant2=South Carolina CGN-37,South Carolina

[usn_cgn_alaska_vls]
Type=CGN,Missile Cruiser
Default=Alaska-class (VLS—Fictional),Alaska
DefaultDescription=The Alaska-class CGN is the US Navy's largest CGN class so far, being derived from the late 1970s CSGN programme, it includes the newest AEGIS weapons system with SM-2MR, Tomahawk cruise missiles, the 8-inch Mk 71 gun for naval gunfire support, and a very spacious hangar to operate large helicopters or special VTOL aircraft. Compared to the Ticonderoga-class, the Alaska-class has greater armor protection and significantly greater magazine depth with all of its weapon systems.\nThis class is included in Sea Power as an interesting what-if.
Variant1=Alaska CGN-42,Alaska
Variant2=Hawaii CGN-43,Hawaii
Variant3=Puerto Rico CGN-44,Puerto Rico
Variant4=Samoa CGN-45,Samoa

