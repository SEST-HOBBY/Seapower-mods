DefaultDescription=The Project 1160.4 Eagle or Project 1160.4 Orel II is the second batch of Orel class carriers, replacing the old Top Sail and Top Steer radars with a new suite of very modern air search sets, notably the Sky Watch (Mars Passat) flat panel PESA arrays located around the superstructure, the extremely long-range 'Forum' radar set derived from Podberezovik, and of course a Top Plate (Fregat-MA) radar set for medium range tracking and detection of sea-skimming targets. Alongside the comprehensive upgrades to the air defenses of the ship through the addition of the SA-N-12 medium range SAM system (3S90M Shtil) and the short range SA-N-9 (9K331 Kinzhal) missile system. Alongside this, the point-defenses of the ship were also dramatically improved via the introduction of the CADS-N-1 (Kortik) combined CIWS system utilizing 30mm rotary cannons, and SA-N-11 (9M311K) missiles.
