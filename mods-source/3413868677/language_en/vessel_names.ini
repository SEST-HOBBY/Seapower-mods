DefaultDescription=The Trump-class battleship (BBG) is a proposed U.S. Navy guided-missile capital ship under the “Golden Fleet” concept, intended to be the largest American surface combatant since World War II. Displacing roughly 35,000 tons and measuring about 260–270 meters in length, the class is designed as a heavily armed, missile-centric warship rather than a traditional gun battleship, emphasizing long-range strike, air and missile defense, and fleet command capabilities. It is envisioned to carry a very large vertical-launch missile battery, advanced sensors, aviation facilities, and potential future weapons such as hypersonic missiles and directed-energy systems.
