DefaultDescription=The Columbia-class is the next generation of nuclear-powered ballistic missile submarines, designed to replace the Ohio-class and ensure the United States maintains a credible sea-based nuclear deterrent into the late 21st century. Twelve boats are planned, each carrying 16 Trident II D5 ballistic missiles in a Common Missile Compartment. The class introduces a life-of-ship nuclear reactor, eliminating the need for refueling, and an electric-drive system with a pump-jet propulsion for quieter operation. Advanced sonar, stealth features, and modern combat systems make the Columbia-class the most survivable leg of the U.S. nuclear triad.
