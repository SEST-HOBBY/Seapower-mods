DefaultDescription=A large and powerful class of nuclear attack submarines, the Los Angeles-class were designed to provide anti-submarine escorts to carrier groups. These submarines are quiet and fitted with complex digital fire control and tracking systems, and designed from the outset to carry the BQQ-5 digital sonar and TB-16 towed array. The Flight 2 upgrade adds a 12-cell TLAM/TASM VLS launcher in the bow ballast tank, improves the reactor for higher output, and adds additional quieting for an exceptional multi-purpose submarine.
