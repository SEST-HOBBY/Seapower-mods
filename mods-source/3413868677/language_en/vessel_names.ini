Variant7=Alan Shepard CVN-81,Alan Shepard
Variant8=Ulysses S. Grant CVN-82,Ulysses S. Grant
Variant9=Saratoga CVN-83,Saratoga
Variant10=John F. Kennedy CVN-84,John F. Kennedy

