[usn_cvn_united_states]
Type=CVN,Aircraft Carrier
Default=United States-class (Fictional),United States
DefaultDescription=The United States-class is a class of nuclear-powered aircraft carriers developed as a successor to the Nimitz-class. Originally planned as further Nimitz-class ships, the design was reworked in response to emerging threats and advanced weapon systems fielded by the People’s Liberation Army Navy. Beginning with CVN-75, ten carriers were built with enhanced survivability, modern sensors, and an expanded air defense capability. Each ship is equipped with Mk 41 Vertical Launch System modules dedicated solely to Standard Missiles, providing layered protection against air and missile threats. Retaining a full-length flight deck and nuclear propulsion, the class is designed to project power globally while operating in high-threat environments.
Variant1=United States CVN-75,United States
Variant2=Benjamin Franklin CVN-76,Benjamin Franklin
Variant3=James Monroe CVN-77,James Monroe
Variant4=Independence CVN-78,Independence
Variant5=Franklin D. Roosevelt CVN-79,Franklin D. Roosevelt
