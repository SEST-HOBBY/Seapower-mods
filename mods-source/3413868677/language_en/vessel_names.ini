[usn_lha_tripoli]
Type=LHA,Aircraft Carrier
Default=Tripoli-class (Fictional),Tripoli
DefaultDescription=The Tripoli-class Landing Helicopter Assault (LHA) ship is a versatile amphibious assault vessel built for multi-domain operations, serving as an essential component of Marine Expeditionary Units (MEUs). It is equipped with the AN/SPY-3 multi-function radar array, delivering superior air and missile tracking for comprehensive situational awareness. The ship features MK41 Vertical Launch Systems (VLS), loaded with RGM-109C Tomahawk Land Attack Missiles (TLAMs) for precision land strikes and RUM-139C VL-ASROC missiles for robust anti-submarine warfare. Its expansive flight deck and hangar support the AV-8B Plus Harrier II for rapid air support, while also accommodating helicopter operations, including landings and anti-submarine warfare (ASW) missions, making it a cornerstone of MEU flexibility and power projection.
Variant1=Tripoli LHA-6,Tripoli
