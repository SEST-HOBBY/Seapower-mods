AN/APQ-173=AN/APQ-173|AN/APQ-173 is the development of AN/APQ-156 with the addition to include synthetic aperture radar (SAR). and multi-function cockpit displays – the APQ-173 gives the Intruder air-to-air capacity with provision for the AIM-120 AMRAAM.
AN/APG-71=AN/APG-71|The AN/APG-71, developed by Hughes Aircraft (later Raytheon) for the F-14D Tomcat, is an all-weather, multi-mode X-band pulse-Doppler radar that modernizes the earlier AN/AWG-9. It incorporates a digital computer for faster signal processing, improved mode switching, and better clutter rejection, enhancing performance in dense electromagnetic environments. Designed primarily for air-to-air combat, it supports simultaneous engagements with missiles like the AIM-54 Phoenix, while its low-sidelobe antenna and monopulse tracking improve resistance to jamming. The radar’s datalink integration enables coordinated operations, making it a reliable system for naval air superiority missions.
AN/APG-71(V)=AN/APG-71(V)|The AN/APG-71(V), built by Raytheon for the Super Tomcat 21, is an advanced all-weather, multi-mode X-band radar leveraging active electronically scanned array (AESA) technology. It builds on the AN/APG-71 with significantly faster processing, seamless mode transitions, and enhanced resolution for both air-to-air and air-to-ground roles. Its AESA design provides rapid beam steering, robust electronic countermeasures, and low-probability-of-intercept operation, ensuring effectiveness in contested environments.
