[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=2.0
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.25

Length=189                     // in meters
Beam=21                      // in meters

CompartmentsHeight=0.08        // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None
NumberOfDCTeams=3

[---------- FlightDeck Definitions ----------]
[AirGroup]
usn_sh-2g=Default,2

#Prev launch time was 128 sec
[FlightDeck]
AircraftCapacity=2
NumberOfElevators=2
NumberOfLaunchPoints=1
NumberOfRecoveryPoints=1
NumberOfTaxiPaths=4
AircraftSupported=usn_sh-2g
LaunchDelay=50
SpawnInterval=50

HoldWaypoints=0,300,0.8|0.8,300,0|0,300,-0.8|-0.8,300,0
HoldStackSeparation=200 //In feet
HoldSpeed=200           //In knots. Landing is permitted once speed was lower than this

[Elevator1]
AssociatedLaunchPoints=1
Mesh=Dummy
HangarOpenAnimation=HangarLeftOpenAnim
HangarCloseAnimation=HangarLeftCloseAnim

BlocksElevators=2

SpawnPosition=-0.095,0.143,-0.23
RidePosition=-0.085,0.143,-0.45

SingleVehicle=True
RequiresFreeLaunchpoint=True

[Elevator2]
AssociatedLaunchPoints=1
Mesh=Dummy
HangarOpenAnimation=HangarRightOpenAnim
HangarCloseAnimation=HangarRightCloseAnim

BlocksElevators=1

SpawnPosition=0.095,0.143,-0.23
RidePosition=0.085,0.143,-0.45

SingleVehicle=True
RequiresFreeLaunchpoint=True

[LaunchPoint1]
AllowedType=Helicopter
Position=0,0.143,-0.637

[RecoveryPoint1]
AllowedType=Helicopter
AssociatedElevators=1,2
BlocksLaunchPoints=1
Position=0,0.143,-0.637
CircuitWaypoints=0,100,-0.4
FinalApproachPath=0.1,100|0,100  //distance in miles behind airstrip, height in feet over airstrip

[TaxiPath1]
From=Elevator1
To=LaunchPoint1
IsBackwards=True

[TaxiPath2]
From=Elevator2
To=LaunchPoint1
IsBackwards=True

[TaxiPath3]
From=RecoveryPoint1
To=Elevator1
#IsBackwards=True
Waypoints=-0.085,0.143,-0.5

[TaxiPath4]
From=RecoveryPoint1
To=Elevator2
#IsBackwards=True
Waypoints=0.085,0.143,-0.5

[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
// all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=13500              // in tons

MaxForwardVelocity=30.5        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
RudderForce=0.5                // multiplicator defining how agile the ship can turn

TiltFactor=2.0               // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=3.0                  // default trim depth in feets
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=15.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Large
# Radar related (RCS => radar cross section)
RCS=Large
# Sonar related
BaseNoise=155                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=6					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usn_cg_baseline_rsa

[---------- AI related ----------]
[AI]
UnitCostValue=8000            // value for the unit cost for least valuable target checks
UnitScoreValue=9              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=10
ASuW_Capability=7
ASW_Capability=7

#Defence
MissilesToSaturate=40        //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=2       //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD          //Anti-Missile Defence
ATD_Capability=TBD          //Anti-Torpedo Defence
HasChaff=True

#Special
Role=AAW,ASuW,ASW

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
Collider=coll_sup_15
ModuleType=CIC

[MainPowerSystem]
############################################################
# Main Power System (engine room, boiler, reactor)
############################################################
