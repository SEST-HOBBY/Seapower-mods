[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=5.25
MinCameraDistanceForeAft=2.8
MinCameraDistanceBroadside=1.2
CameraPivotHeight=0.25

Length=326                     // in meters
Beam=73                        // in meters

CompartmentsHeight=0.25        // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None


[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=39000             // in tons

MaxForwardVelocity=24.0        // sets the max forward velocity
MaxBackwardVelocity=5.0        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=1.5             // turn rate of the rudder in degrees per second
RudderForce=0.3               // multiplicator defining how agile the ship can turn

TiltFactor=10.5                // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData] 
#Visual
VisualIdentificationRange=15.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge
# Sonar related
BaseNoise=170                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=2
AnimationFile_1=animations_usn_lha_tripoli
AnimationFile_2=animations_usn_mk_41_vls

[---------- AI related ----------]
[AI]
UnitCostValue=10000            // value for the unit cost for least valuable target checks
UnitScoreValue=10             // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=2
ASuW_Capability=2
ASW_Capability=1

#Defence
MissilesToSaturate=12       //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=5       //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD          //Anti-Missile Defence
ATD_Capability=TBD          //Anti-Torpedo Defence
HasChaff=True

#Special
Role=CVS
Carrier_Capability=TBD

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_ph1
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=Steam
HorsePower=280000
Collider=coll_engineroom

[PropulsionSystems]
NumberOfPropulsionSystems=2

[PropulsionSystem1]
Mount=Propeller_1
RotationDirection=Left
Collider=coll_propulsion_port

[PropulsionSystem2]
Mount=Propeller_2
RotationDirection=Right
Collider=coll_propulsion_stbd

#Rudder Systems
[RudderSystems]
NumberOfRudderSystems=2

[RudderSystem1]
Mount=Rudder_Left
Collider=coll_rudder_port

[RudderSystem2]
Mount=Rudder_Right
Collider=coll_rudder_stbd

[---------- FlightDeck Definitions ----------]
[AirGroup]
usmc_av-8a=Default,6
usmc_ah-1t=Squadron1,4
usn_sh-3h=Squadron1,8  //CH-53 placeholder
usn_ch-46=Squadron1,8

[FlightDeck]
