FlightDeck_NumberOfAccountableAmmunitionCategories=1
FlightDeck_AccountableAmmunitionCategory_1=AirTorpedo,24/24

# ------------ System ------------
Collider=coll_flightdeck,coll_hangar

[Elevator1]
