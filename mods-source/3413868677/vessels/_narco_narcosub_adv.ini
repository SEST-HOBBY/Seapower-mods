[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.1

Length=58                    // in meters
Beam=6.8                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1038               // in tons
HorsePower=1600

MaxForwardVelocity=15          // Max submerged forward velocity in knots
MaxForwardVelocitySurfaced=12.0
MaxBackwardVelocity=5.0        // Max submerged backward velocity in knots
MaxBackwardVelocitySurfaced=3

TelegraphVelocities=-5,0,3,5,10,13,15 // Overrides default telegraph values

BowUnderWater=10.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=25.0            // depth in feet, from where the sail is under water

LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.6                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=10.0
RollChangeRate=2.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=2                // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=25.0            // in feet
CrushDepth=80.0               // in feet


[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
BaseNoise=130                  // base sound level in db at 1m distance
FlowNoise=1.2                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=30             // additional noise for cavitation in db
TargetReflectionStrength=15    // in dB for broad side
BladesCount=3                  //number of blades on vessel's propulsion systems
ElectricFrequency=50           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
DistinctiveNoise=False         //If True, this vessel can be identified easier than usually by passive sonars

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_narco_narcosub_adv_animations

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=4
ASW_Capability=2

#Defence
#Special
Role=SS

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=1600
AdditionalNoise=20        //Added to current noise level when running on this power
Collider=coll_engineroom

[AuxPowerSystem]
Type=Electric
HorsePower=1223
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
Capacity=15000        //Range 15 miles at top underwater speed 15 knots
DischargeRate=1.475   //Rate of discharging batteries. Lower values provide more range on low underwater speed on batteries
RechargeRate=1.0      //Capacity per second when charging batteries. When a unit goes at Standard telegraph setting or slower, the charge rate doubles
Collider=coll_battery_1,coll_battery_2

[SnorkelMastSystem]
MaxForwardVelocity=8
Collider=coll_snorkel_mast
Mount=Snorkel
OpenSystemAnimation=RaiseSnorkel
CloseSystemAnimation=LowerSnorkel
ModuleType=Inert

[PropulsionSystems]
NumberOfPropulsionSystems=2

[PropulsionSystem1]
Mount=Propeller_Left
RotationDirection=Left
Collider=coll_prop_l

[PropulsionSystem2]
Mount=Propeller_Right
RotationDirection=Right
Collider=coll_prop_r


#Rudder Systems
[RudderSystems]
NumberOfRudderSystems=1

[RudderSystem1]
Mount=Rudder
Collider=coll_rudder

[DepthRudderSystems]
NumberOfDepthRudderSystems=2

[DepthRudderSystem1]
