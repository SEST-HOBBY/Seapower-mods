Plane1=Bowplane_Left
Plane2=Bowplane_Right
MaxAngle=30.0
Direction=1.0
OpenSystemAnimation=BowplanesExtend
CloseSystemAnimation=BowplanesRetract
Collider=coll_rudder

[DepthRudderSystem2]
