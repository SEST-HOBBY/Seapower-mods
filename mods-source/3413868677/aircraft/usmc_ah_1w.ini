MaxSpeedAtSeaLevel=190             // in knots
MaxBackwardSpeed=30                // in knots
MaxSidewardSpeed=40                // in knots
Ceiling=12200                      // ceiling in feet
Altitudes=20,200,500,1000,3000,6000,10000,11000  // in feet
ClimbRate=27                     // feet per second

EmptyMass=4630                     // in kg
MaxFuel=920                        // in kg
MaxRange=317                       // in n miles
HoveringFuelConsumption=0.44       // Minimum fuel consumption when hovering.

MainThrustAccelerationFactor=5.0   // determines the engine thrust acceleration factor (as multiplicator of v=a*t)
LinearDrag=0.9995                  // this is for velocity damping (linear drag)
CurveDragFactor=2.0                // determines how quickly the helicopter loses velocity (dependend on steepness of curve)
GravityDragFactor=1.0              // determines the gravity factor (1.0 means here standard 9.81m/s²)

MousePitchFactor=0.3
MouseYawFactor=0.3

EngineWarmUpTime=30
RotorsSpinUpTime=40

