[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=0.75         // Propellor diameter value used

[FlightModel]
PitchGain=1                           // Vertical manuverability
VelocityGain=0.1136                   // Acceleration
HeadingGain=3                         // Horizontal manuverability
YawRateLimit=170                      // in degrees per second

BankGain=4.5                            // Roll change speed
#MaxRollForHeading=65.0                // bank limit in normal flight - defaults to -1 which gives fighter like behaviour
MaxRollRate=120.0                     // in degrees per second

ThrustGain=0.325                      // Thrust change speed
SpeedBrakeFractionGain=10             // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

[Performance]
#Dimensions
WingSpan=19.545                       //meters
#Parameters
MaxG=9.0                              // Mostly for horizontal turns

MaxClimbRate=380.0                    //Meters per second
MaxClimbPitch=20                      // in degrees Default: 20
MaxCombatClimbPitch=70                // in degrees Defaults: 80 for MachLimit 1+ and 45 otherwise
MaxDescentPitch=-20                   // in degrees Default: -20
MaxCombatDescentPitch=-70             // in degrees Defaults: -60 for MachLimit 1+ and -30 otherwise
EmptyMass=18800.0                     // in kg
MaxFuel=14470.0                       // in kg

#PerEngineMaxPower=???         //For turboprops only! Defines if engine type is turboprop
PerEngineMaxThrust=116000              //Newtons
PerEngineMaxAfterburnerThrust=156000  //Newtons
EngineCount=2
EngineWarmUp=25

Ceiling=65000.0                       // ceiling in feet
CruiseAltitude=42000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.5,0.5,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=1000                //in knots, Defines max speed at altitude curve
StallSpeed=145.0                      //in knots
MachLimit=2.4                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values
SpeedAndRange_Landing=0.21,0.4        // Landing
SpeedAndRange_Loiter=0.45,0.6         // Loiter
SpeedAndRange_Cruise=1.1,1600        // Cruise
SpeedAndRange_Max=1.8,0.4             // Attack/Fast/High/Max without AB
SpeedAndRange_Afterburner=2.4,0.2    // AB max

