[---------- General Data ----------]
[General]
UnitType=Aircraft
#CarrierCapable=True

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.38
MinCameraDistanceBroadside=0.38
CameraPivotHeight=0.0

#Taxi values
GroundedPitchAngle=-0.4         // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.0335,-0.0126   // defines the relative location of the landing gear
LandingPivot=0,-0.0335,-0.0964  // defines the relative location of the arrestor hook
LandingPitch=-3

[AI]
Role=Fighter

[SensorData]
#Visual
VisualIdentificationRange=6       // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_wp_su_47

[---------- Flight Model ----------]

[Engine]
EngineIntakeArea=1.09               //Pi* r * r where r is engine radius, in meters

[FlightModel]
PitchGain=1                         // Vertical manuverability
VelocityGain=0.1136                   // Acceleration
HeadingGain=3                         // Horizontal manuverability
YawRateLimit=130                      // in degrees per second

BankGain=1                          // Roll change speed
#MaxRollForHeading=65.0                // bank limit in normal flight
MaxRollRate=120.0                      // in degrees per second

ThrustGain=0.325                      // Thrust change speed
SpeedBrakeFractionGain=10            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

[Performance]
#Dimensions
WingSpan=16.7                       //meters
#Parameters
MaxG=9.5                              // Mostly for horizontal turns

MaxClimbRate=230.0                    //Meters per second
MaxClimbPitch=20                      // in degrees Default: 20
MaxCombatClimbPitch=70                // in degrees Defaults: 80 for MachLimit 1+ and 45 otherwise
MaxDescentPitch=-20                   // in degrees Default: -20
MaxCombatDescentPitch=-50             // in degrees Defaults: -60 for MachLimit 1+ and -30 otherwise
EmptyMass=16375.0                     // in kg
MaxFuel=15000.0                        // in kg, internal tanks only

#PerEngineMaxPower=???         //For turboprops only! Defines if engine type is turboprop
PerEngineMaxThrust=93100              //Newtons
PerEngineMaxAfterburnerThrust=152000   //Newtons
EngineCount=2
EngineWarmUp=15                       //Delay on launchpad before takeoff

Ceiling=59000.0                       // ceiling in feet
CruiseAltitude=44290                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.5,0.5,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=783                //in knots, Defines max speed at altitude curve
StallSpeed=108.0                      //in knots
MachLimit=2.1                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.36,0.4        // Landing
SpeedAndRange_Loiter=0.41,0.6         // Loiter
SpeedAndRange_Cruise=1.6,1458        // Cruise
SpeedAndRange_Max=1.9,0.3             // Attack/Fast/High/Max without AB
SpeedAndRange_Afterburner=2.1,0.2    // AB max

Altitudes=50,100,200,1000,3000,6000,10000,20000  // in feet

