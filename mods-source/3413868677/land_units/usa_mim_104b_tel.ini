[General]
UnitType=LandUnit
LandUnitSubType=SAM
IsMobile=False

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=MIM-104A
Tag=Ground+Vehicle+SAM

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.024,0.05
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=Missile
SystemName=M901
#Sensors
ExternalGuidingSystems=AN/MPQ-53
ExternalGuidingSystemSearchRadius=0.5     // in nmi
#Animations
#Mount
Mount=RotatingMount_1
IsMountRotatable=True
#Containers
NumberOfContainers=1
ContainerBase=Launcher_1
NumberOfContainers=1
Container1=Dummy
AreContainersRotatable=False
#Angles
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
WorksStandalone=False
AutoEnableSensor=True
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=usa_mim_104b
Ammunition1_Count=16 // 4 at launcher and usually 8 per launcher at loading trucks
ModuleType=WeaponMagazine

