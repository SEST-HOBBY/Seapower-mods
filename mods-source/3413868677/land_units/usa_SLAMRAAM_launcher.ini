NumberOfContainers=1
AreContainersRotatable=True
Container1=weapons_elev
Container1_Position=0,0,0
Container1_Rotation=0,0,0
#Angles
FiringArcs=-90,90
ElevationArc=0,60
RestAngles=0,0
LoadAngles=Any
#Loading
