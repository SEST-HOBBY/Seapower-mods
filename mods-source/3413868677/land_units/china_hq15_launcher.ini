#SA-10 TEL trailer erector launcher vehicle
[General]
UnitType=LandUnit
LandUnitSubType=SAM

DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=HQ-15
Tag=Ground+Vehicle+SAM

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=7  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small


[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.036,0.088
ModuleType=Bridge

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #SA-N-6
Type=Missile
SystemName=SA-N-6
#Sensors
#AssociatedSensors=SensorSystem2
ExternalGuidingSystems=Big_Bird
ExternalGuidingSystemSearchRadius=0.5     // in nmi
#Animations
#Mount
Mount=Launchers
IsMountRotatable=False
#Containers
NumberOfContainers=4
Container1=Dummy
Container1_Position=-0.009,0.0265,0.002
Container2=Dummy
Container2_Position=0.009,0.0265,0.002
Container3=Dummy
Container3_Position=-0.0168,0.0105,0.002
Container4=Dummy
Container4_Position=0.0168,0.0105,0.002
AreContainersRotatable=False
#Angles
#Loading
Ammunition=plan_hq15
#Effects
#Other
WorksStandalone=False
AutoEnableSensor=True
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/wp_sa-10/
ResourcesRoot=wp_sa-10
ResourcesMesh=wp_sa-10_trailer
ResourcesMaterial=wp_sa-10_mat
############################################################

[Submodels]
Submodel1=Launchers

[Launchers]
Mesh=wp_sa-10_launchers
Material=wp_sa-10_launchers_mat
#Parent=Base
Position=0,0.029,-0.0764
Rotation=-90,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=ModerateShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
NumberOfMeshColliders=0
UseKinematicCollision=False

Collider1=coll_hitbox

[coll_hitbox]
Collider=Box
Position=0,0.0316,-0.0041
Rotation=0,0,0
Scale=0.04,0.063,0.2
