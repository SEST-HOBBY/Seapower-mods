[General]
UnitType=LandUnit
LandUnitSubType=MissileSite //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=RGM-109B
Tag=Ground+Vehicle

[AI]
UnitScoreValue=3              // value for calculation of mission score
Role=ASuW,ASM

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=2

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #M-192
Type=Missile
SystemName=M-192
#Sensors
ExternalGuidingSystems=AN/MPQ-46
ExternalGuidingSystemSearchRadius=0.5     // in nmi
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
NumberOfContainers=1
ContainerBase=Rail
NumberOfContainers=1
Container1=Rail
AreContainersRotatable=True
#Angles
ElevationArc=0,45
RestAngles=0,-15
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=usn_rgm-109b
Ammunition1_Count=9 // 3 at launcher and usually 6 per launcher at loading trucks
ModuleType=WeaponMagazine

[Models]
ResourcesFolder=ground objects/nato_mim-23_hawk/
ResourcesRoot=nato_mim-23_launcher
ResourcesMesh=nato_mim-23_launcher_base
ResourcesMaterialFolder=ground objects/wp_radars/
ResourcesMaterial=wp_radars_trailers_mat
############################################################

[Submodels]
Mount=Mount
Rail=Rail

[Mount]
Mesh=nato_mim-23_launcher_mount
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Position=0,0.017,0.0065

[Rail]
Mesh=nato_mim-23_launcher_rail
ResourcesMaterialFolder=ground objects/wp_radars/
Material=wp_radars_trailers_mat
Parent=Mount
Position=0,0.011,-0.0038
Rotation=-15,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=ModerateShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
NumberOfMeshColliders=0
UseKinematicCollision=False

Collider1=coll_hitbox

[coll_hitbox]
Collider=Box
Position=0,0.0199,0.0021
Rotation=0,0,0
Scale=0.04,0.04,0.04
