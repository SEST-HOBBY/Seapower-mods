[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.9                     // in meters
Beam=2.97                      // in meters
Range=270                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=M270
Tag=Ground+Vehicle+Artillery

[Physics]
HorsePower=500
Mass=26.4                      // in tons

MaxForwardVelocity=35          // in knots
MaxBackwardVelocity=5          // in knots
Braking=8                      // knots/sec
TurnRate=15                    // in degrees per second

[AI]
UnitScoreValue=0.6             // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
MountPosition=0,0.04,0

[SensorSystem2]  #GPS
Type=Radar
SystemName=GPS
Mount=Dummy
MountPosition=0.044,3500.0,0.41

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #MLRS
Type=Missile
SystemName=MLRS
#Sensors
AssociatedSensors=SensorSystem2
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
NumberOfContainers=1
ContainerBase=Launcher
NumberOfContainers=1
Container1=Launcher
AreContainersRotatable=True
#Angles
RestAngles=0,0
LoadAngles=0,0
FiringArcs=-90,90
ElevationArc=-1,45
#Loading
AssociatedMagazine=WeaponMagazineLauncher
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineLauncher] #Purely fictional to mitigate lack of reloading
NumberOfAmmunitionTypes=1
Ammunition1=usa_prsm
Ammunition1_Count=36 //12 on vehicle + 24 in reloading vehicle
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=ground objects/usa_m270/
ResourcesRoot=usa_m270
ResourcesMesh=usa_m270_chassis
ResourcesMaterial=usa_m270_mat
############################################################

[Submodels]
Turret=Turret
Launcher=Launcher

[Turret]
Mesh=usa_m270_turret
Material=usa_m270_mat
Position=0,0.0165,-0.0232

[Launcher]
Mesh=usa_m270_launcher
Material=usa_m270_mat
Parent=Turret
Position=0,0.0066,-0.022

[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.0197,0
Rotation=0,0,0
Scale=0.045,0.04,0.1

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default
