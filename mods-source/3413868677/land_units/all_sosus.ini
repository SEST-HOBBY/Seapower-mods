[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.25

AutoFlatten=False
MaskVegetation=True
# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SOSUS
Tag=Ground

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Radar,ESM

[SensorData]
#Visual
VisualIdentificationRange=0.01  // Camouflaged  (x0.5)
IRSignature=Tiny
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #OPTIC_SOSUS
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=OPTIC_SOSUS
Mount=Dummy
MountPosition=0,0.255,0
ModuleType=Bridge
Collider=coll_tower
Integrity=3

[SensorSystem2] #LF_SOSUS
Type=Sonar
SystemName=LF_SOSUS
Mount=Dummy
MountPosition=0,0.21,0
Collider=coll_ecm

[SensorSystem3] #LF_SOSUS
Type=Sonar
SystemName=HF_SOSUS
Mount=Dummy
MountPosition=0,0.21,0
Collider=coll_ecm

[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/watchtower/
ResourcesRoot=watchtower
ResourcesMesh=watchtower
ResourcesDamagedMesh=watchtower_d
ResourcesMaterialFolder=ground objects/watchtower/
ResourcesMaterial=watchtower_mat
############################################################

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=0.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
Collider1=coll_tower
NumberOfMeshColliders=2
MeshCollider1=l_1
MeshCollider2=l_2

[coll_tower]
Collider=Hitbox
Position=0,0.13112,0
Rotation=0,0,0
Scale=0.09862312,0.2809993,0.114375

[l_1]
Collider=watchtower_coll_1

[l_2]
Collider=watchtower_coll_2
