[General]
#180 gallon / 685 liters fuel tank
Type=Fueltank                       // can be Projectile, Missile, RBU, ASROC, Torpedo,AerialRocket,MLRS
Mass=5                                   // in kg. Used for aircraft. Container mass. Weapon mass is read from weapon ini. Better not use it for fueltanks
Fuel=685

[Guidance]
CircularErrorRadius=2000                // Circular error radius in meters

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=aircraft/nl_sh-14/
ResourcesRoot=nl_sh-14.obj
ResourcesMesh=685_tank
ResourcesMaterialFolder=aircraft/nl_sh-14/
ResourcesMaterial=nl_sh-14b_mat.ini

[---------- Effects ----------]
[Particles]
HitShipExplosionClass=SmallShipHitExplosion
HitGroundExplosionClass=SmallGroundHitExplosions
HitDefaultExplosionClass=SmallGroundHitExplosions
HitWaterSplashClass=SmallWaterSplashes