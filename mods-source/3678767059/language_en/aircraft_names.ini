DefaultDescription=The AH-11A is the Brazilian version of the British made Westland Super Lynx helicopter,particularly the MK21A version.It is a multipuprose helicopter capable of fulfilling many duties like ASW(Anti-Submarine Warfare), ASuW(Anti-Surface warfare) along with SAR(Search and Rescue).It comes equipped with a Sea Spray radar and can carry modern torpedoes and the Sea Skua anti-ship missile.
