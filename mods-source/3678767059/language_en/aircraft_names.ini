DefaultDescription=The Sikorsky SH-60 Seahawk is a twin turboshaft engine, multi-mission United States Navy helicopter based on the United States Army UH-60 Black Hawk and a member of the Sikorsky S-70 family. The SH-60F OceanHawk is the ship-borne ASW variant deployed on US Navy fleet carriers from 1985 to 2015.
