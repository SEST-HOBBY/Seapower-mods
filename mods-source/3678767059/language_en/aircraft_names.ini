DefaultDescription=The AH-11B is the Brazilian version of the British made Westland Super Lynx helicopter,particularly its an upgraded AH-11A variant with modern avionics,engines and and and an electro-optical sensor on the nose.It is a multipuprose helicopter capable of fulfilling many duties like ASW(Anti-Submarine Warfare), ASuW(Anti-Surface warfare) along with SAR(Search and Rescue).It comes equipped with a Sea Spray radar and the SEAFIRE III FLIR(forward-looking infrared thermal imagining sensor) and can carry modern torpedoes and the Sea Skua anti-ship missile.
Squadron1=AH-11B Super Lynx 1º Esquadrão de Helicópteros de Esclarecimento e Ataque Anti-submarino (HA-1),Super Lynx
