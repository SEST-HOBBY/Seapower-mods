DefaultDescription=The AS.350 is a French utility helicopter produced since 1975, and is a prolific multipurpose helicopter used by both civilian and military operators all across the world. While primarily used in civilian service, the AS.350 notably has found use in some navies, such as the Royal Australian Navy onboard the Adelaide-class frigate.In the Brazilian navy, its main role are Light visual reconnaissance, rough clarification, and liaison.
Squadron1=UH-12 1.º Esquadrão de Helicópteros de Emprego Geral (EsqdHU-1),UH-12

