[bra_p-95a]
Type=Maritime Patrol
Default=P-95A Bandeirulha,Bandeirulha
DefaultDescription=Developed in the late 1970s from the EMB-110 Bandeirante, the EMB-111 (P-95A/B) Bandeirulha served as the primary coastal patrol and search and rescue aircraft for the Brazilian Air Force. Equipped with an AN/APS-128 sea-search nose radar, integral wingtip fuel tanks, and underwing pylons for unguided rockets and light bombs, the aircraft provided an economical means to monitor Brazil's vast territorial waters. It saw extensive service across all four patrol squadrons during the Cold War era.
