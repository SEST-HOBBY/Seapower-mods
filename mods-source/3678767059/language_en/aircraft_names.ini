[bra_a4m]
Type=Fighter
Default=AF-1A Skyhawk,AF-1A
DefaultDescription=The Douglas A-4 Skyhawk is a single seat carrier launched attack aircraft designed for the United States Navy. First entering service in 1956 they were finally withdrawn in US service in 2008, with the last export models leaving Israeli service in 2015. The A-4G was developed from the A-4F variant of the Skyhawk specifically for the Royal Australian Navy, intended to provide fleet air defence and strike aboard HMAS Melbourne. The RAN received ten A-4Gs in 1967 and another ten in 1971, and operated the type from 1967 to 1984 after Melbourne was decomissioned in 1982. The aircraft got a new lease on life after being sold to New Zealand, being upgraded in Project Kahu in 1985 and serving on through until 2001.
Squadron1=AF-1A VF-1 'Falcões',AF-1A
Squadron2=AF-1A VF-1 'Falcões' (Late),AF-1A
Callsigns=Squadron1,Falcão|Squadron2,Falcão

