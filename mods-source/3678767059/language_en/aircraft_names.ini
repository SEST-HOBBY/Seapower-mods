[bra_uh14]
Type=Medium Lift Helicopter
Default=UH-14 Super Puma,Super Puma
DefaultDescription=The UH-14 Super Puma was the Brazilian Navy’s heavy-lift utility workhorse, based on the Aérospatiale AS332F1. Operated primarily by the HU-1 squadron, it was a dedicated transport and logistics platform that did not carry offensive ordnance or specialized search radars. It served as the fleet's primary "heavy lifter" for moving up to 21 marines, performing vertical replenishment (VERTREP), and conducting long-range search and rescue (SAR) missions from the decks of the NAe São Paulo.
Squadron1=UH-14 Super Puma 2º Esquadrão de Helicópteros de Emprego Geral (HU-2),Super Puma
Callsigns=

[bra_uh15]
Type=Medium Lift Helicopter
Default=UH-15 Super Cougar,Super Cougar
DefaultDescription=The UH-15 Super Cougar is the Brazilian Navy’s modern multi-mission helicopter, based on the Airbus H225M (formerly Eurocopter EC725). Operated by the HU-2 squadron, it is an evolution of the Super Puma featuring a five-blade main rotor, uprated Turbomeca Makila 2A1 engines, and a full glass cockpit. As the fleet's primary utility and logistical heavy-lifter, it is used for transporting up to 28 marines, vertical replenishment (VERTREP), and long-range search and rescue (SAR) missions. Unlike the specialized AH-15 variant, the standard UH-15 is configured for transport and does not carry heavy anti-ship missiles.
Squadron1=UH-15 Super Cougar 2º Esquadrão de Helicópteros de Emprego Geral (HU-2),Super Cougar
Callsigns=

[bra_ah15]
Type=Medium Lift Helicopter
Default=AH-15 Super Cougar,Super Cougar
DefaultDescription=The AH-15 is the specialized combat version of the H225M Super Cougar, custom-developed for the Brazilian Navy to provide advanced Anti-Surface Warfare (ASuW) capabilities. While it shares the same five-blade rotor and airframe as the standard UH-15, the AH-15 is a sophisticated "hunter-killer" platform equipped with a full tactical mission suite and a glass cockpit. It is uniquely capable of carrying two AM-39 Exocet Block 2 Mod 2 anti-ship missiles, supported by a nose-mounted APS-143(V)3 maritime surveillance radar and a MAGE Defensor electronic warfare system. Operated by the EsqdHU-2, it serves as the most powerful naval helicopter in the Southern Hemisphere, enabling the fleet to strike surface targets from over the horizon.
Squadron1=AH-15 Super Cougar 2º Esquadrão de Helicópteros de Emprego Geral (HU-2),Super Cougar
Callsigns=

