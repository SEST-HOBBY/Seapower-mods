DefaultDescription=Developed from the EMB-110 Bandeirante light transport, the EMB-111 (P-95) Bandeirulha was designed for the Brazilian Air Force to conduct maritime patrol and search and rescue missions across the country's vast coastline. Equipped with tip tanks, specialized surface search radar, and underwing hardpoints for rockets, the aircraft proved to be a durable and cost-effective coastal surveillance platform. Modernized to the P-95M standard with digital glass cockpits and advanced AESA radars, the type remains in active service across multiple squadrons.
Squadron1=P-95M 2nd Sqn/7th FG (Phoenix),Bandeirulha
