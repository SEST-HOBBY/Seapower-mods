[AmmunitionNames]
# ------------------ AAM ------------------
bra_python3=Python 3,,AAM,Python 3 is Israel's infrared-guided air-to-air combat missile with a longer range than other combat missiles.

bra_python4=Python 4,,AAM,The Python 4 is a highly agile short-range infrared air-to-air missile developed by Israel, designed to engage enemy aircraft in close-in combat. It features an advanced all-aspect seeker with strong resistance to countermeasures, allowing reliable target acquisition from any angle. Equipped with high off-boresight capability and extreme maneuverability, the Python 4 enables modern dogfight tactics, including helmet-mounted sight cueing for rapid target engagement.

bra_derby=Derby,,AAM,Derby is Israel's active radar-guided air-to-air missile, developed from the Python 4/5 air-to-air missile, so its range is much shorter than other active radar-guided air-to-air missiles.
# ------------------ SAM ------------------

# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------
bra_mansup=MANSUP,,ASM,The MANSUP (Míssil Antinavio Nacional de Superfície) is a Brazilian-developed standoff anti-ship missile designed to equip the Brazilian Navy’s surface combatants. Developed with technology transfer and national industry participation, it is intended to replace older Exocet variants in Brazilian service. The MANSUP uses inertial navigation with active radar homing in the terminal phase, flying a low sea-skimming profile to reduce detection and improve survivability against shipboard defenses.
#-----------Land Strike only missiles---------

# ---------- Anti-sub  Missilies ----------
bra_ikara=GWS-40,Ikara,ASW,The GWS-40 Ikara is an Australian anti-submarine cruise missile, powered by a rocket motor, that deploys a Mk-46 or Mk-44 torpedo to defeat sub-surface threats. While it has twice the range of the American ASROC, Ikara is somewhat slower, and multiple missiles cannot be quickly fired due to the launch configuration.

