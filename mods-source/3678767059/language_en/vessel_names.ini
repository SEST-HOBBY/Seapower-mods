[bra_cv_Sao_Paulo]
Type=CV,Aircraft Carrier
Default=Clemenceau-class (NAe São Paulo),São Paulo
DefaultDescription=NAe São Paulo (A12) was a Clemenceau-class aircraft carrier originally built for the French Navy as Foch and commissioned in 1963. Acquired by Brazil in 2000, she became the Brazilian Navy’s flagship and its only platform capable of operating fixed-wing naval aviation, including A-4 Skyhawk fighters and helicopters. Despite modernization efforts, her Brazilian service was marked by recurring propulsion and maintenance issues, which limited operational availability, leading to her decommissioning in 2018 and eventual disposal.
