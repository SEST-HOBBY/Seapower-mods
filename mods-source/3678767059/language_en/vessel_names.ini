[bra_type22b12]
Type=FF,Frigate
Default=Type 22 (Greenhalgh)-class,Type 22
DefaultDescription=The Greenhalgh-class frigate comprises four former Royal Navy Type 22 frigates (Batches 1 and 2) acquired by the Brazilian Navy in the 1990s to rapidly modernize its ocean-going escort force. Commissioned as **F-46 Greenhalgh, F-47 Dodsworth, F-48 Bosísio, and F-49 Rademaker**, the class entered service with a strong emphasis on anti-submarine warfare in the South Atlantic, fleet escort, and task-group protection. Retaining their original Type 2016 hull-mounted sonar, Sea Wolf point-defence missile system, and Exocet anti-ship missiles, the ships routinely operated a Westland Lynx / Super Lynx helicopter for ASW and surface surveillance. The later Batch 2 units introduced a longer hull, improved command facilities, and better aviation support, making them well suited for extended blue-water deployments. Throughout their Brazilian service, the Greenhalgh class formed the Navy’s most capable high-end escorts, frequently participating in multinational exercises and long-range patrols until their gradual decommissioning between the 2000s and 2020s.
Variant1=Greenhalgh F46, Greenhalgh
Variant2=Dodsworth F47, Dodsworth
Variant3=Bosísio F48, Bosísio
Variant4=Rademaker F49, Rademaker

