DefaultDescription=The NAM Atlântico (A140) is the current flagship of the Brazilian Navy, serving as a Multipurpose Aircraft Carrier (Navio-Aeródromo Multipropósito). Originally commissioned into the British Royal Navy in 1998 as HMS Ocean (L12), she was acquired by Brazil in 2018 to fill the operational gap left by the decommissioning of the NAe São Paulo.
