[h1][u]⚓ "Marinha do Brasil" - Brazilian Navy[/u][/h1]
[img]https://i.imgur.com/R6XaC5A.png[/img]

[h2]📖 About[/h2]
This mod brings the [b]Brazilian Navy[/b] into [b]Sea Power[/b], featuring Brazilian naval and aviation assets inspired by real platforms operated from the Cold War through the modern era.
The project try to foucus on representing Brazilian armed forces with consistent visuals, believable configurations, and roles aligned with their real-world missions.
Unlike major Cold War superpowers, Brazilian forces rely on fewer high-end sensors, weapons, and platforms. This creates a different style of gameplay, where success depends more on positioning, coordination, and smart use of available assets rather than overwhelming technological advantage.
As a result, the mod provides a more demanding and rewarding experience, especially for players looking for scenarios that emphasize tactical decision-making over raw capability.


