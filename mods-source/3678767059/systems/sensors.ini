[============================================ Brazil ===========================================]
[ ---------------------------- Radars ----------------------------- ]
[---------- Surface ships ----------]
[---Air/Air&Surface---]
[---Surface only---]

[bra_Safran-10]
Kind=Radar
Type=Search            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface           // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=10       // if applicable number of targets it can track simultaneously
WeaponChannels=0       // if applicable number of weapons (missiles) it can guide simultaneously
RotationDirection=1    // -1 means left, 1 means right
RPM=20                 // revolutions per minute
MinRange=0.1           // min range in km
MaxRange=40.0          // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=5000          // max altitude in meters, relevant for air, unused for surface
RangeResolution=80.0  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=2.0            // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=38.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=15.0         // output peak power in kW
ModuleType=SmallSensor


[ ---------------------------- Sonars ----------------------------- ]
[---------- Ships ----------]
[----- Towed/VDS -----]
[---------- Submarines ----------]
[ ------------------------ Visual/Infared ------------------------- ]
[bra_SAFIRE_III] #Star SAFIRE III IR Navigation/targeting detector
Kind=Visual
#Infrared
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=3.0           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=3.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.6             // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.5             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day


[ ------------------------------ ESM ------------------------------ ]
[ ---------- ELINT ---------- ]
[bra_MIR-2]
#Users: 60s UK Radar Warning Receivers #https://www.iwm.org.uk/collections/item/object/1060029583
Kind=ESM
Type=RWR
Gain=5                              // gain of sensor in dB
HasDataLink=True                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=22.5             // in degrees
Frequencies=S-Band,X-Band           // Frequencies that current ESM system can detect

