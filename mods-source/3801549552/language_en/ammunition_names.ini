[AmmunitionNames]
# ------------------ AAM ------------------
# Air-to-Air Missiles
plaaf_j36_pl15=PL-15,,Air-to-Air Missile,The PL-15 is a medium-to-long-range active-radar air-to-air missile with a dual-pulse solid rocket motor, an AESA radar seeker and a two-way datalink, giving long range, high terminal velocity and excellent countermeasure resistance.
plaaf_j36_pl17=PL-17,,Very-Long-Range AAM,The PL-17 is a very-long-range active-radar air-to-air missile used mainly against high-value support and auxiliary aircraft such as tankers, AEW aircraft and bombers. It offers long range and high speed but limited maneuverability, making it unsuitable against highly agile targets.

# ---------- Anti-ship Missiles ----------
# Anti-Ship Missiles
plan_yj-15=YJ-15,,Anti-Ship Missile,The YJ-15 is a supersonic anti-ship cruise missile with a ramjet engine and low-altitude sea-skimming flight profile, offering long range, high lethality and high speed.

# ---------- Anti-radiation Missiles ---------
# Anti-Radiation Missiles
plaaf_yj-91=YJ-91,,Anti-Radiation Missile,The YJ-91 is an anti-radiation missile operated by the PLA Air Force, a domestic version of the Russian Kh-31P.
plaaf_j-10c_ld-8a=LD-8A,,Anti-Radiation Missile,The LD-8A is a general-purpose anti-radiation missile derived from the PL-15 air-to-air missile airframe.

# ----------- Air-to-surface Weapons -----------
# Air-to-Surface Weapons
plaaf_akf-98=AKF-98,,Low-Observable Strike Weapon,The AKF-98 is a low-observable runway-denial dispenser that uses its reduced radar signature to penetrate enemy air defenses and strike airfield runways and similar targets.

# ----------- Mounts & ECM -----------
# Mounts & ECM
plaaf_4xgj=4xGJ,,Composite Launcher,An internal-bay composite launcher carrying four BBM-2 guided glide bombs.
plaaf_j36_ecm_mount=Internal ECM,,Electronic Warfare,The J-36's internal defensive electronic-countermeasures suite.
