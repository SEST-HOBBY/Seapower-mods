[AmmunitionNames]
# ------------------ AAM ------------------
#空空导弹
plaaf_j36_pl15=PL-15,,空对空,霹雳-15是中国空军装备的中远程主动雷达制导空空导弹，采用双脉冲固体火箭发动机、有源相控阵雷达导引头和双向数据链，具备长射程、高末端速度和优异的抗干扰性能。
plaaf_j36_pl17=PL-17,,远程空对空,霹雳-17是中国空军装备的远程主动雷达制导空空导弹，主要用于在超远距离上攻击敌方辅助和支援飞机目标，包括加油机、预警机、轰炸机等，导弹射程远速度快，但机动性较差，不适合攻击高机动性的目标。

# ---------- Anti-ship Missiles ----------
#反舰导弹
plan_yj-15=YJ-15,,反舰导弹,鹰击-15是中国海军航空兵装备的超音速反舰巡航导弹，采用冲压发动机和低空掠海飞行剖面，具备射程远、威力大、速度快的特点。

# ---------- Anti-radiation Missiles ---------
#反辐射导弹
plaaf_yj-91=YJ-91,,反辐射导弹,鹰击-91是中国空军装备的反辐射导弹，是引进自俄罗斯的Kh-31P反辐射导弹的国产版本。
plaaf_j-10c_ld-8a=LD-8A,,反辐射,雷电-8A反辐射导弹是利用霹雳-15空空导弹构型改进而来的通用反辐射导弹。

# ----------- Air-to-surface Weapons -----------
#对地弹药
plaaf_akf-98=AKF-98,,隐身对地弹药,AKF-98是中国空军装备的隐身构型反跑道子母弹布撒器，可利用其雷达低可视特性穿透敌方防空网络，对机场跑道等目标发动精确打击。

# ----------- Mounts & ECM -----------
#挂架与电子对抗
plaaf_4xgj=4xGJ,,复合挂架,主弹舱复合挂架，内置四枚 BBM-2 制导滑翔炸弹。
plaaf_j36_ecm_mount=内置 ECM,,电子对抗,歼-36 内置防御性电子对抗系统。
