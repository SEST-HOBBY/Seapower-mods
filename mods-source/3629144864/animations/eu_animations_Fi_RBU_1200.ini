[------------------------------ Sequences ------------------------------]

#RBU_OpenAnim_l

[Door_Open_l]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionZ1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
PositionZ2=-0.0343
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

[Mount_Out_l]
NumberOfSteps=2
Time1=5                // time in seconds for the start
RotationY1=-180
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=10                // time in seconds - here for the end
RotationY2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry

