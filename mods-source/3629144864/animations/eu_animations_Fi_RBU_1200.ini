[RBU_OpenAnim_l]
NumberOfSequencesToPlay=3
Sequence1=Door_Open_l
Sequence1_Model=Door_l
Sequence2=Mount_Out_l
Sequence2_Model=RBU_mount_l
Sequence3=Door_Close_l
Sequence3_Model=Door_l

