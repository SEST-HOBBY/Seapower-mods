# ----------- Noisemakers/Chaff -----------
ger_MASS_omnitrap=MASS Omni-Trap,,Chaff,A multispectral 81 mm decoy round for the MASS launcher family. Payloads can be programmed to create screening and seduction effects in RF, IR, and EO bands. Salvos are coordinated with ship maneuvers and EW doctrine to defeat missile seekers. The system supports layered soft-kill when combined with onboard ECM. Effectiveness depends on timing, geometry, and the threat seeker type.
ger_MASS_ATD_noisemaker=MASS ATD,,Noisemaker,An optional anti-torpedo capability for MASS that launches expendable acoustic effectors. The decoys are used to distract or confuse incoming torpedoes while the ship maneuvers. Firing is coordinated with sonar warnings and countermeasure doctrine. The approach extends soft-kill protection into the underwater domain. Inventory is limited and employment is conditioned by water conditions and threat behavior.
ger_C303S_noisemaker=C303/S,,Noisemaker,An expendable acoustic noisemaker launched via the C303/S countermeasure ejector system to degrade torpedo homing. The decoy increases local acoustic clutter and can mask the platform s true bearing to delay or disrupt seeker classification. Best results are achieved when combined with course and depth changes and layered countermeasures. Inventory is limited and employment depends on sonar warning quality and threat type.
usn_mk214_chaff=Chaff,,SRBOC,The Mark 36 SRBOC (Super Rapid Bloom Offboard Countermeasures) is the US Navy's solution to an emerging antiship missile threat, both against radar-homing and infrared-guided missiles. This system is connected to the central weapons system of a ship, is highly automated, and can deploy both chaff and flare countermeasures with a very short reaction time, proving ideal against sea-skimming threats.\n\nThis particular system uses the advanced Sea Gnat countermeasure system to effectively counter modern anti-ship missiles with the MK 214, MK 216 chaff seduction and distraction countermeasures, and the MK 245 GIANT flare type countermeasure.
usn_adc_mk2_noisemaker=Noisemaker,ADC MK 2,Torpedo Decoy,The ADC MK 2 mod 0 Torpedo Decoy is an acoustic countermeasure designed to mimic the signature of a vessel's cavitation noise, either a submarine or ship, which attempts to lure away torpedoes from the vessel. The MK 2 has a 6 minute lifetime, and greater emitting capacity given its larger size.
usn_adc_mk2_mod3_noisemaker=Noisemaker,ADC MK 2 Mod 3,Torpedo Decoy,The ADC MK 2 Mod 3 is a 3-inch diameter battery-powered expendable acoustic torpedo decoy optimized for Virginia-class attack submarines. Introduced in 2007 it uses the same fundamental 3-inch acoustic projector as the Mod 0/1 baseline, hovering at a pre-selected depth and emitting acoustic signals to spoof incoming torpedoes. The Mod 3 designation reflects Virginia-class internal launch system compatibility rather than any acoustic capability improvement over earlier variants.
usn_adc_mk2_mod4_noisemaker=Noisemaker,ADC MK 2 Mod 4,Torpedo Decoy,The ADC MK 2 Mod 4 is a 3-inch diameter expendable acoustic torpedo decoy for surface vessels, launched manually by hand from DDGs and CGs as a backup torpedo defense layer. It represents a newer electronics generation than earlier Mod 0/1/3 variants and is acoustically identical to the submarine-launched Mod 5 once deployed in the water. It serves as a manual backup to the primary LEAD system on surface ships.
usn_adc_mk2_mod5_noisemaker=Noisemaker,ADC MK 2 Mod 5,Torpedo Decoy,The ADC MK 2 Mod 5 is a 3-inch diameter expendable acoustic torpedo decoy for submarines, launched from the Internal Countermeasure Launcher (ICL) also known as the Signal Ejector. It is acoustically identical to the surface-launched Mod 4, sharing the same electronics generation and 3-inch projector. The Mod 5 designation reflects ICL launch compatibility only, with no acoustic performance difference over Mod 4.
usn_adc_mk2_mod7_noisemaker=Noisemaker,ADC MK 2 Mod 7,Torpedo Decoy,The ADC MK 2 Mod 7 is the newest variant of the 3-inch MK 2 family. Its primary improvement over earlier variants is the introduction of a thermal lithium battery in place of the seawater-activated battery, significantly extending operational lifetime to 7 minutes. Acoustic output remains the same 3-inch projector as all prior MK 2 variants — the thermal lithium battery improves duration, not spoofing capability.
usn_adc_mk3_mod1_noisemaker=Noisemaker,ADC MK 3 Mod 1,Torpedo Decoy,The ADC MK 3 Mod 1 is a 6.25-inch diameter expendable acoustic torpedo decoy representing a major capability leap over the entire 3-inch MK 2 family. Externally stored between the submarine pressure hull and outer hull in special launch containers, it is deployed via gas generator. The larger projector delivers substantially greater acoustic output than any 3-inch device and supports multiple modes including programmed acoustic noise, jamming and decoy signals. IOC 2004, in active production and service across all USN submarines.
usn_adc_mk4_jammer=Jamming Noisemaker,ADC MK 4,Torpedo Decoy,The ADC MK 4 Torpedo Decoy is an acoustic countermeasure designed to confuse both torpedo seekers and opponent sonars, although experienced sonar operators can easily pick out false contacts from real ones. This is an extremely effective countermeasure, but only lasts for 1 minute before it's battery depletes.
usn_adc_mk5_ngcm_noisemaker=Noisemaker,ADC MK 5 NGCM,Torpedo Decoy,The ADC MK 5 is the Next Generation Countermeasure (NGCM) intended to replace the ADC MK 3 in US Navy service. Despite sharing the 3-inch form factor of the MK 2 family it introduces a fundamentally new capability tier through Adaptive Countermeasure (ACM) technology. The MK 5 classifies incoming torpedoes via an onboard threat classifier and adapts its acoustic response in real time. It can be deployed as a static jammer or a mobile decoy, operate cooperatively in groups of up to six units via a full-duplex acoustic communications link, and receive tactical updates from submarines and surface ships. IOC FY2027.
usn_LEAD_noisemaker=LEAD,Launched Expendable Acoustic Decoy,Torpedo Decoy,The LEAD (Launched Expendable Acoustic Decoy) is a surface ship expendable acoustic torpedo decoy fired from the standard MK 36 SRBOC mortar launcher. Introduced in 1997 it enters the water after launch, hovers at depth using a seawater battery and broadcasts broadband acoustic noise to divert incoming torpedoes away from the ship. It is deployed on all US Navy surface ships equipped with MK 36 SRBOC launchers and serves as a complementary layer to the towed Nixie system.
ita_canto-v=Noisemaker,CANTO-V,Noisemaker

# ----------------- Decoys ----------------
ger_C303S_MTE=C303/S MTE,Mobile Target Emulator,Torpedo Decoy,A mobile expendable acoustic decoy deployed from the C303/S countermeasure ejector system. It is intended to seduce or distract incoming torpedoes by presenting a convincing moving target signature and forcing the seeker to commit to the decoy. Use is coordinated with evasive maneuvers and additional countermeasures to break the engagement geometry. Effectiveness depends on timing, separation, and local water conditions.
ger_3DDS=3DDS,Decoy Drone
fr_canto=Anti-torpedo decoy,Canto, 
usn_an_slq_25a_nixie_decoy=AN/SLQ-25A,Nixie-A,Decoy,The Nixie (formally the AN/SLQ-25A) is a towed decoy system utilised primarily by the surface ships of the USN. The System generates signals designed to lure approaching torpedoes away from the host platform. The SLQ-25A model has greater radiating characteristics, and can fool incoming torpedoes with greater ease.
usn_an_slq_25b_nixie_decoy=AN/SLQ-25B,Nixie-B,Decoy,The AN/SLQ-25B is an upgraded Nixie towed decoy system used primarily on US Navy carriers. Building on the 25A it adds the ability to defeat active homing torpedoes by intercepting and returning the incoming torpedo's sonar pings at 2-3 times the received amplitude. It also introduces a towed array sensor for torpedo alertment and a fiber optic display LAN.
usn_an_slq_25c_nixie_decoy=AN/SLQ-25C,Nixie-C,Decoy,The AN/SLQ-25C is a general electronics upgrade of the AN/SLQ-25A first procured in 2007. It introduces additional countermeasure modes, more reliable power amplification, a new COTS signal generator and a longer littoral fiber optic tow cable for improved performance in shallow water. It became the standard Nixie variant across the full US Navy surface fleet.
usn_an_slq_25e_nixie_decoy=AN/SLQ-25E,Nixie-E,Decoy,The AN/SLQ-25E is the most capable variant of the Nixie towed decoy family, with specifically improved capability against wake-homing, acoustic-homing and wire-guided torpedoes. Entering production in 2019 it is replacing all prior Nixie variants fleet-wide and represents the current standard for US Navy surface ship torpedo defense.


