eu_mm_sclar_he=Sclar HE,,Rocket,The Sclar is an Italian decoy launcher system installed on many Marina Militare surface combatants through the 1970s and 1980s. Beside decoys the system is also able of launching HE projectiles to function as an MLRS system. 

