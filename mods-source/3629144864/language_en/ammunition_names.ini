ger_27mm=27mm,,MLG 27,High-rate 27 mm ammunition for the MLG 27 remote mount used in close-in defense. The family includes suitable natures for surface and limited air targets. Effective employment relies on stabilized fire control and good cueing. Typical roles are warning fire and the defeat of small boats and UAVs at short range. Magazine selection depends on ship doctrine and expected threats.
