eu_35mm_AHEAD=35mm,AHEAD,Gun,Advanced hit efficiency and destruction (AHEAD) ammunition is a type of airburst round ammunition that releases a cloud of sub-projectiles just ahead of a target enabling it to engage conventional as well as low slow and small (LSS) air threats including unmanned aerial vehicles and perform counter rocket artillery and mortar duties. The 35 mm variety produced by Oerlikon Contraves splits each projectile into 152 tungsten submunitions "that form a cone-shaped pattern to destroy a target's control surfaces and other vital components"
