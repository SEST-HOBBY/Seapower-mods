# ------------------ CIWS -----------------
ger_HEL=Laser CIWS,Rheinmetall High Energy Laser,Laser Weapon,A shipborne high-energy laser system intended for close-in defense against small, fast targets. It engages by delivering sustained energy on a line-of-sight track to damage or disable sensors, control surfaces, or structural elements, and is most effective against UAVs and small boats. Performance is strongly dependent on atmospheric conditions, stabilization quality, target aspect, and dwell time. Integration with the fire-control chain and precise tracking is critical for consistent results.
