[AmmunitionNames]
# ------------------ AAM ------------------
usn_aim-9m=AIM-9M,Sidewinder,AAM,The AIM-9 Sidewinder is an American infrared homing air-to-air missile. The AIM-9M is a further improvement of the AIM-9L produced from 1982 onwards, greatly enhancing its countermeasure resistance thanks to the introduction of an IRCCM system. 
usaf_aim-120a=AIM-120A,AAMRAM,AAM,The AIM-120 AAMRAM is the standard beyond-visual-range missile in service with the United States. Developed in the 1980s it is the follow-on to the AIM-7 Sparrow, being a faster, more compact and lighter missile with a very capable radar seeker and advanced on-board electronics. After being launched the AAMRAM receives guidance via datalink from the launching aircraft until entering its terminal phase, upon which the missile severs the link and turns on its on-board seeker to acquire and hit its target.

eu_am_aspide=Aspide,,AAM,The Aspide is an Italian development of the AIM-7E previously produced under license. Compared to the Sparrow the Aspide replaces the continuous-wave seeker with a inverse monopulse model, significantly increasing accuarcy and ECM resistance. Furthermore the missile features a new warhead, more powerful engine and closed-loop hydraulics for better down-range maneuverability.
eu_am_slyflash=Skyflash,,AAM,The Skyflash is an improved variant of the AIM-7E developed in Great Britain. The most significant upgrade is an inverse monopulse seeker replacing the original continuous-wave model used on the Sparrow, significantly increasing accuarcy and ECM resistance. Further changes include a more powerful engine, adapted control surfaces and a new radar fuze.

# ------------------ SAM ------------------
ger_rim-116a=RIM-116,Rolling Airframe Missile,SAM,The RIM-116 Rolling Airframe Missile (RAM) is a small, lightweight, infrared homing surface-to-air missile in use by the German, Japanese, Greek, Turkish, South Korean, Saudi Arabian, Egyptian, Mexican, UAE, and United States navies. It was originally intended and used primarily as a point-defense weapon against anti-ship missiles. As its name indicates, RAM rolls as it flies. The missile must roll during flight because the RF tracking system uses a two-antenna interferometer that can measure phase interference of the electromagnetic wave in one plane only. The rolling interferometer permits the antennas to look at all planes of incoming energy. In addition, because the missile rolls, only one pair of steering canards is required. As of 2005, it is the only U.S. Navy missile to operate in this manner.

usn_rim-116a=RIM-116A,RAM Blk 0,SAM,An early RAM configuration optimized for point defense against sea-skimming anti-ship missiles. It primarily homes on target emissions with passive RF in the midcourse and transitions to infrared homing in the terminal phase. Designed to work without shipboard illuminators after launch and intended for rapid inner-layer engagements.
usn_rim-116b=RIM-116B,RAM Blk IA,SAM,An improved RAM variant adding an infrared-only (IR-all-the-way) guidance option to defeat threats that do not radiate or use low-observable emission profiles, while retaining the passive RF/IR capability of earlier rounds. The 1A/HAS software baseline expands engagement logic beyond classic anti-ship missiles to additional air and surface targets.
usn_rim-116c=RIM-116C,RAM Blk II,SAM,A kinematic and seeker upgrade for more stressing, maneuvering threats. Adds a control section upgrade (four canards), a larger propulsion section (6.25-inch class motor), and an evolved passive RF receiver designed to better handle modern seekers including low-probability-of-intercept (LPI) characteristics, improving endgame energy and ECCM performance.
usn_rim-116d=RIM-116D,RAM Blk IIA,SAM,An incremental Block 2 follow-on focused on software/electronics refinements to improve guidance performance and raid handling while retaining the Block 2 hardware features (enhanced control section, larger motor, evolved RF receiver). Intended to increase effectiveness against modern anti-ship missiles and asymmetric air threats without changing launcher compatibility.
usn_rim-116e=RIM-116E,RAM Blk IIB,SAM,A further-evolved RAM round with a more modern infrared seeker and a missile-to-missile link to improve salvo coordination and performance in complex raid/decoy environments. Builds on the Block 2 kinematic and ECCM baseline (enhanced control and evolved RF receiver), improving discrimination and engagement robustness against the latest gene_

usn_rim-161b=RIM-161B,SM-3 Blk IA,BMD,An exo-atmospheric hit-to-kill interceptor for Aegis BMD that engages ballistic missiles in the midcourse phase. After shipboard cueing and datalink updates, the third stage separates and the kinetic warhead homes using its IR seeker and divert thrusters to collide with the target. It carries no explosive warhead and is not intended for aircraft or cruise missiles. It is the first SM-3 variant that entered service.
usn_rim-161c=RIM-161C,SM-3 Blk IB,BMD,An exo-atmospheric hit-to-kill interceptor for Aegis BMD that engages ballistic missiles in the midcourse phase. Compared to earlier SM-3 variants, Block IB improves endgame performance and target discrimination with a two-color infrared seeker and an upgraded divert and attitude control system on the kinetic warhead. After shipboard cueing and datalink updates, the third stage separates and the kinetic warhead homes using its IR seeker and divert thrusters to collide with the target. It carries no explosive warhead and is not intended for aircraft or cruise missiles.
usn_rim-161d=RIM-161D,SM-3 Blk IIA,BMD,A US-Japan co-developed evolution of SM-3 that expands Aegis BMD coverage with larger diameter propulsion stages and a more capable kinetic warhead, delivering higher burnout velocity and a larger defended footprint against longer-range and more stressing ballistic missile threats. Like other SM-3 variants it performs exo-atmospheric hit-to-kill midcourse intercepts using ship and network cueing, then terminal infrared homing with divert thrusters, without an explosive warhead. Block IIA has been flight tested against an ICBM-class target and has seen operational combat use for ballistic missile defense. It is launched from MK 41 VLS on Aegis ships and is also associated with Aegis Ashore configurations, but it is not intended for aircraft or cruise missiles.

usn_rim-162a=RIM-162A,ESSM Blk I,SAM,A semi-active radar homing surface-to-air missile for point and local area defense. It requires terminal illumination from a fire-control radar to guide in the endgame. The missile offers high agility against sea-skimmers and conventional aircraft. Integration supports quad-pack in MK 41 VLS and interfaces with legacy combat systems. Performance depends on illuminator availability and geometry during the final seconds.
usn_rim-162b=RIM-162B,ESSM Blk I,SAM,A semi-active ESSM variant tailored for non-Aegis combat systems while retaining VLS quad-pack capability. It provides improved maneuverability over earlier point-defense missiles and helps thicken ship self-defense. Guidance depends on shipboard illuminators for terminal homing. Midcourse command and autopilot reduce illuminator time where supported. Engagement envelopes vary with radar horizon and target altitude.
usn_rim-162c=RIM-162C,ESSM Blk I,SAM,A semi-active radar homing ESSM variant compatible with MK 41 VLS as well as MK 48 and MK 56 launch systems. It provides point and local area defense against sea-skimming missiles, aircraft and other high-speed threats. Guidance requires shipboard fire-control illumination in the terminal phase. The variant supports flexible integration on ships using NATO-compatible vertical launch systems outside the standard Aegis-only path. Performance depends on combat-system support, illuminator availability and target geometry during endgame homing.
usn_rim-162d=RIM-162D,ESSM Blk I,SAM,A rail-launched ESSM version for MK 29 launchers without thrust-vector control. It provides short-to-medium range point defense on platforms without VLS. Guidance is semi-active and requires a fire-control radar in the terminal phase. Kinematics are reduced compared to the VLS variant. It remains a viable upgrade path for older ships with legacy launchers.
usn_rim-162f=RIM-162F,ESSM Blk 1,SAM,The RIM-162F ESSM Block 1 is a semi-active radar homing surface-to-air missile adapted for use on the Zumwalt class. To function on this platform, the missile relies on combat-system and fire-control modifications that replace the standard integration path used on other ESSM-capable ships. It still requires terminal illumination for the endgame and is intended for point and local area defense against aircraft and sea-skimming missiles. The missile offers high agility and a compact footprint suitable for layered defense. Effective performance depends on the availability of compatible illuminator support and the specific Zumwalt integration changes made for this configuration.
usn_rim-162h=RIM-162H,ESSM Blk II,SAM,An active radar seeker variant that reduces reliance on terminal illumination. The missile retains MK 41 quad-pack compatibility and improves endgame agility and clutter rejection. Midcourse guidance is provided via the combat system with datalink updates where available. It enhances raid handling and off-boresight opportunities within the local area envelope. Performance benefits from good quality tracks from 3D surveillance radars.
usn_rim-162j=RIM-162J,ESSM Blk II,SAM,An active seeker ESSM integration for non-Aegis combat systems. The missile offers better autonomy in terminal guidance and supports complex multi-target scenarios. Quad-pack compatibility is retained for magazine efficiency. Engagements depend on reliable midcourse cueing from the CMS. It improves performance against sea-skimmers and maneuvering aircraft compared to semi-active variants.
usn_rim-162k=RIM-162K,ESSM Blk II,SAM,An active radar seeker ESSM Block II variant compatible with MK 41 VLS as well as MK 48 and MK 56 launch systems. The missile provides point and local area defense against sea-skimming missiles, aircraft and maneuvering threats while reducing dependence on continuous terminal illumination. Midcourse guidance and datalink support are provided through the ship combat system where available. The active seeker improves raid handling, clutter rejection and terminal engagement flexibility compared to earlier semi-active ESSM variants. Performance depends on track quality, combat-system integration and available midcourse support.

usn_rim-156a=RIM-156A,SM-2ER Blk IV,SAM,The RIM-156A Standard Missile 2 ER is the AEGIS VLS version of SM-2ER, and is a highly advanced Block IV variant with the seeker upgrades of a late Block III SM-2MR, and also boasts some level of anti-ballistic-missile capability. This missile has an effective range (100nmi) significantly smaller than its maximum kinematic range, so be mindful that SARH illumination cannot guide these very long range SAMs to their maximum listed ranges.

usn_rim-174a=RIM-174A,SM-6 Blk I,SAM,A multi-mission extended-range missile for fleet air defense and terminal missile defense. Uses inertial guidance with a dual-mode terminal seeker (active + semi-active radar homing) to engage aircraft, cruise missiles, and some ballistic missile threats in their terminal phase. Can also be employed in limited anti-surface roles when supported by the combat system.
usn_rim-174b=RIM-174B,SM-6 Blk IAU,SAM,An improved SM-6 variant adding GPS-aided guidance to expand over-the-horizon anti-surface and land-attack employment while retaining the long-range anti-air and terminal defense roles. Still supports active and semi-active terminal homing, enabling both autonomous endgame and illuminated engagements.
usn_rim-174c=RIM-174C,SM-6 Blk IB,SAM,A next-generation SM-6 upgrade centered on a larger 21-inch second-stage rocket motor and updated software to substantially increase kinematic reach and endgame energy against advanced air and surface threats. Intended to provide longer-range fires and improved performance versus fast, stressing targets while remaining compatible with the Aegis/MK 41 ecosystem.

usn_pac3_mse=PAC-3 MSE,,BMD,A hit-to-kill interceptor designed for ballistic missile defense and high-performance air defense at short to medium ranges. The MSE variant uses a larger motor and control surfaces to improve range, altitude, and endgame maneuverability over earlier PAC-3 missiles. It is optimized for engaging tactical ballistic missiles, cruise missiles, and aircraft with very high precision. Its effectiveness depends on strong radar support and rapid reaction against fast, high-angle threats.

usn_rim-66g=RIM-66G,SM-2MR Blk II,SAM,A Block II medium-range area-defense missile optimized for the Aegis combat system and the MK 26 GMLS twin-arm launcher. Block II introduced the MK 104 rocket motor and an improved fragmentation warhead to extend the engagement envelope against faster threats. Guidance is inertial with command mid-course updates, transitioning to terminal semi-active radar homing that requires shipboard illumination.
usn_rim-66h=RIM-66H,SM-2MR Blk II,SAM,The Block II variant tailored for Aegis ships equipped with the MK 41 VLS. It retains the Block II kinematic and warhead improvements (MK 104 motor, upgraded fragmentation warhead) and uses inertial/command mid-course guidance to reduce illuminator time-on-target. Final guidance is semi-active radar homing and depends on illuminator geometry and scheduling in multi-engagement scenarios.
usn_rim-66j=RIM-66J,SM-2MR Blk II,SAM,A Block II missile integrated with the New Threat Upgrade (NTU) for upgraded Tartar-era ships rather than Aegis. It shares the Block II propulsion/warhead step-up for longer effective reach and uses inertial/command mid-course updates with terminal semi-active radar homing requiring illumination. Typically employed to give NTU ships a true area-defense layer, constrained by illuminator availability and track quality.
usn_rim-66k=RIM-66K,SM-2MR Blk IIIA,SAM,A medium-range area defense missile using semi-active radar homing. Block 3A improved low-altitude performance against sea-skimming threats. It relies on shipboard illuminators for the final guidance phase. The missile is typically employed as part of layered air defense. Effective use depends on track quality and illuminator scheduling in multi-target scenarios.
usn_rim-66l=RIM-66L,SM-2MR Blk IIIA,SAM,A medium-range area defense missile using semi-active radar homing. Block 3A improved low-altitude performance against sea-skimming threats. It relies on shipboard illuminators for the final guidance phase. The missile is typically employed as part of layered air defense. Effective use depends on track quality and illuminator scheduling in multi-target scenarios.
usn_rim-66m-2=RIM-66M-2,SM-2MR Blk IIIA,SAM,A medium-range area defense missile using semi-active radar homing. Block 3A improved low-altitude performance against sea-skimming threats. It relies on shipboard illuminators for the final guidance phase. The missile is typically employed as part of layered air defense. Effective use depends on track quality and illuminator scheduling in multi-target scenarios.
usn_rim-66m-5=RIM-66M-5,SM-2MR Blk IIIB,SAM,A newer SM-2 medium-range iteration with guidance and ECCM improvements. It enhances performance against maneuvering aircraft and missiles in jamming environments. Semi-active terminal homing requires reliable illumination geometry. The missile integrates with modern combat systems for coordinated engagements. It remains a backbone effector for area air defense on qualified platforms.
usn_rim-66n=RIM-66N,SM-2MR Blk IIIAZ,SAM,The RIM-66N Standard Missile 2 MR Block IIIAZ is a medium-range area-defense missile adapted for operation from the Zumwalt class. To function on this platform, it incorporates integration changes tied to the ship s combat system, launcher arrangement, and terminal fire-control support rather than the standard configuration used on legacy Aegis ships. The missile uses semi-active radar homing in the terminal phase and is intended to strengthen layered defense against aircraft and anti-ship missiles. Block IIIAZ retains the established Standard Missile role of outer-layer fleet air defense while extending the ship s engagement options beyond point defense weapons. Operational effectiveness depends on the availability of the modified Zumwalt-specific guidance and illumination chain.
usn_rim-66p=RIM-66P,SM-2MR Blk IIIC,SAM,A medium-range area air-defense missile from the SM-2 family. It uses inertial guidance with mid-course updates and terminal semi-active radar homing (depending on variant/doctrine). Employed for fleet air defense against aircraft and cruise missiles.

usn_rim-7p=RIM-7P,Sea Sparrow,SAM,A semi-active point-defense missile used from rail or VLS launchers. It provides short-range air defense against aircraft and older anti-ship missiles. Guidance requires a fire-control radar for terminal illumination. Inventory is retained for certain platforms and training roles. It is gradually superseded by ESSM on modern ships.

mbda_aster_15=Aster 15,,SAM,The Aster 15 is a Franco-Italian all-weather, vertical launch surface-to-air missile.The Aster missiles were developed to intercept and destroy the full spectrum of air threats from high-performance combat aircraft, UAVs and helicopters to cruise, anti-radiation and even sea-skimming supersonic anti-ship missiles.
mbda_aster_30=Aster 30,Block 0,SAM,The Aster 30 is a Franco-Italian all-weather, vertical launch surface-to-air missile.The Aster missiles were developed to intercept and destroy the full spectrum of air threats from high-performance combat aircraft, UAVs and helicopters to cruise, anti-radiation and even sea-skimming supersonic anti-ship missiles.
mbda_aster_30_blk1=Aster 30,Block 1,SAM,The Aster 30 is a long-range surface-to-air missile designed for extended area defense against advanced threats like aircraft, missiles, and even short-range ballistic missiles. Using a similar two-stage design and active seeker as the Aster 15, it boasts significantly increased range and altitude, making it a key component of layered air defense systems.
mbda_camm=CAMM,,SAM,The Common Anti-Air Modular Missile was developed by MBDA UK for the role of advanced medium range air defense, replacing the aging GWS.26 Sea Wolf in British service. It is based on the ASRAAM air-to-air missile but with new software, a turnover pack, folding fins, an RF seeker and data-link. Other components not directly taken from ASRAAM were reused from other programs such as Sea Wolf Block 2 and PAAMS to lower cost and increase commonality.
mbda_camm-er=CAMM-ER,,SAM,The Common Anti-Air Modular Missile was developed by MBDA UK for the role of advanced medium range air defense, replacing the aging GWS.26 Sea Wolf in British service. It is based on the ASRAAM air-to-air missile but with new software, a turnover pack, folding fins, an RF seeker and data-link. Other components not directly taken from ASRAAM were reused from other programs such as Sea Wolf Block 2 and PAAMS to lower cost and increase commonality.

ger_IDAS=IDAS,,SAM,IDAS (Interactive Defence and Attack System for Submarines): An encapsulated short-range missile system launched from a submarine torpedo tube for self-defense and limited strike options. It is primarily intended to engage ASW helicopters and maritime patrol aircraft, and can also be used against small surface targets depending on engagement geometry. Guidance and seeker behavior are optimized for fast-reacting, close-in threats. Effective employment depends on target aspect, mast exposure, and tactical timing.
ger_IRIS-T_SLM=IRIS-T SLM,,SAM,IRIS-T SLM (Surface-Launched Medium Range): A medium-range surface-launched air defence missile derived from the IRIS-T family, using an imaging infrared seeker, high agility and datalink-supported mid-course guidance. It is optimized against aircraft, helicopters, UAVs and cruise missiles, with strong terminal performance against manoeuvring and low-flying targets. Naval employment benefits from passive terminal homing and reduced illumination demands, but effectiveness depends on combat-system cueing, target aspect, seeker lock conditions and launcher placement.
ger_IRIS-T_SLX=IRIS-T SLX,,SAM,IRIS-T SLX (Surface-Launched Extended Range): An extended-range surface-launched air defence missile developed from the IRIS-T family for medium-to-long range area defence. It combines high manoeuvrability, datalink-supported mid-course guidance and an imaging infrared terminal seeker, allowing passive endgame homing without continuous radar illumination. The missile is intended to engage aircraft, helicopters, UAVs, cruise missiles and other agile or low-flying air threats at greater stand-off ranges than IRIS-T SLM. Naval employment benefits from low terminal emissions and flexible combat-system cueing, but performance depends on launch geometry, target aspect, seeker acquisition conditions and the quality of offboard or shipborne sensor tracks.

fr_mistral=Mistral,,SAM,The Missile Transportable Anti-a rien L ger (English: Transportable lightweight anti-air missile), commonly called Mistral, is a family of French infrared homing multipurpose short range air defense system manufactured by MBDA France 
fr_crotale_vt1=Crotale,,SAM,The Crotale is a French short-range surface-to-air missile system developed to intercept airborne ranged weapons and aircraft, from cruise or anti-ship missiles to helicopters, UAVs or low-flying high-performance fighter aircraft.

eu_mm_aspide=Aspide,,SAM,The Aspide is an Italian development of the AIM-7E previously produced under license. Compared to the Sparrow the Aspide replaces the continuous-wave seeker with a inverse monopulse model, significantly increasing accuarcy and ECM resistance. Furthermore the missile features a new warhead, more powerful engine and closed-loop hydraulics for better down-range maneuverability.
eu_mm_mistral=Mistral,,SAM
eu_seawolf_GWS26=GWS.26,Sea Wolf VLS,SAM,VLS variant of the GWS25. Provided with a booster that allows the missile to perform their initial flight phase alowing 360° cover. Thus eliminating the need for the traditional sixtuple launcher.

# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------
fi_MTO_85=MTO 85,Meritorjuntaohjus,ASM,Swedish RBS 15 MK 2 anti-ship missile developed by Saab Bofors Dynamics.
js_ssm-1b=SSM-1B,Type 90,ASM,The Type 90 is a navalized version of Mitsubishi Heavy Industries' Type 88 anti-ship missile

usn_rgm-109b1=RGM-109B1,TASM Blk I,ASM,The RGM-109B1 Tomahawk Anti-Ship Missile (TASM) is an American standoff anti-ship weapon. The weapon has an active radar seeker that is activated after following a pre-programmed route, and is capable of flying a search pattern with deceptive manuevers. The B1 modification has a new booster to support VLS operations and an enhanced sea skim mode.
usn_ugm-109b1=UGM-109B1,TASM Blk I,ASM,The UGM-109B1 Tomahawk Anti-Ship Missile (TASM) is an American standoff anti-ship weapon. The weapon has an active radar seeker that is activated after following a pre-programmed route, and is capable of flying a search pattern with deceptive manuevers. The B1 modification has a new booster to support VLS operations and an enhanced sea skim mode. This version is submarine launched.
usn_rgm-109e5a=RGM-109E5a,MST Blk Va,ASM,A long-range anti-ship variant of Tomahawk intended to engage surface combatants at standoff distance. It typically navigates via inertial updates to a designated search area, then transitions to terminal seeker-based acquisition (active radar) to select and home on a ship target. Subsonic and low-flying, it benefits heavily from accurate cueing (bearing/range/track) to minimize terminal search time and reduce the chance of acquiring the wrong contact in cluttered formations.
usn_ugm-109e5a=UGM-109E5a,MST Blk Va,ASM,A long-range anti-ship variant of Tomahawk intended to engage surface combatants at standoff distance. It typically navigates via inertial updates to a designated search area, then transitions to terminal seeker-based acquisition (active radar) to select and home on a ship target. Subsonic and low-flying, it benefits heavily from accurate cueing (bearing/range/track) to minimize terminal search time and reduce the chance of acquiring the wrong contact in cluttered formations.
usn_rgm-109m=RGM-109M,MST Blk Va,ASM,A long-range anti-ship variant of Tomahawk intended to engage surface combatants at standoff distance. It typically navigates via inertial updates to a designated search area, then transitions to terminal seeker-based acquisition (active radar) to select and home on a ship target. Subsonic and low-flying, it benefits heavily from accurate cueing (bearing/range/track) to minimize terminal search time and reduce the chance of acquiring the wrong contact in cluttered formations.

usn_ircps=IRCPS,,HGV,The Intermediate-Range Conventional Prompt Strike (IRCPS) weapon is a ship-launched hypersonic glide vehicle intended to provide the Zumwalt class with a long-range conventional strike capability. To function on this class, the weapon is integrated for launch from the ship s large missile cells rather than standard MK 41-sized cells. This adaptation allows the platform to employ a much larger booster and glide body than conventional fleet missiles. The system is intended for rapid long-range strikes against heavily defended or time-sensitive targets. Employment depends on the specialized launch arrangement and combat-system support unique to the modified Zumwalt configuration.
usn_ircps_asm=IRCPS,,HGV,The Intermediate-Range Conventional Prompt Strike (IRCPS) weapon is a ship-launched hypersonic glide vehicle intended to provide the Zumwalt class with a long-range conventional strike capability. To function on this class, the weapon is integrated for launch from the ship s large missile cells rather than standard MK 41-sized cells. This adaptation allows the platform to employ a much larger booster and glide body than conventional fleet missiles. The system is intended for rapid long-range strikes against heavily defended or time-sensitive targets. Employment depends on the specialized launch arrangement and combat-system support unique to the modified Zumwalt configuration.

usn_rgm-84d=RGM-84D,Harpoon Blk IC,ASM,A widely used NATO subsonic sea skimming anti-ship missile with an active radar terminal seeker and programmable pre launch routing. The Block 1C RGM-84D introduced selectable terminal profiles such as pop up or sea skimming and improved ECCM while using JP-10 fuel for increased reach.
usn_rgm-84g=RGM-84G,Harpoon Blk IG,ASM,A later NATO subsonic sea skimming anti-ship missile derived from the Block 1C Harpoon with an active radar terminal seeker and improved terminal recovery logic. The Block 1G RGM-84G added re attack capability from the cancelled Block 1D program and further improved ECCM while retaining the programmable routing and terminal attack options of the RGM-84D.
usn_rgm-84l=RGM-84L,Harpoon Blk II,ASM,A modernized export Harpoon Block II subsonic sea skimming anti-ship missile with GPS aided inertial midcourse navigation and an active radar terminal seeker. The RGM-84L improved precision navigation and littoral attack flexibility while remaining based on the proven Harpoon airframe and sea skimming terminal attack profile.
usn_rgm-84n=RGM-84N,Harpoon Blk II+,ASM,A network enabled Harpoon Block II+ subsonic sea skimming anti-ship missile with an active radar terminal seeker, updated GPS guidance and in flight target update capability. The RGM-84N added a two way data link, mission abort option, improved target selectivity and enhanced resistance to electronic countermeasures.
usn_rgm-84q=RGM-84Q,Harpoon Blk II+ ER,ASM,Modernized surface-launched Harpoon with extended range and network-enabled midcourse update capability. Compared to older RGM-84D/G variants, the -84Q represents the late Harpoon ER/II+ standard with improved GPS-aided navigation, better littoral/landmask discrimination, and longer reach. It remains primarily an anti-ship missile, but can also attack fixed coastal or harbor targets when valid coordinates are available. Terminal homing is active radar, so moving ships can be engaged. True mobile land-target attack is not its core role.

usn_ugm-84d=UGM-84D,Harpoon Blk IC,ASM,The Harpoon is an American standoff anti-ship weapon used widely throughout NATO. The weapon has an active radar seeker that is activated after following a pre-programmed route. The UGM-84 variant is submarine launched. The Block 1C variant has improved range via more energetic fuel, both a sea-skim profile and an optimized terminal pop-up maneuver, and a more interference-resistant seeker head.
usn_ugm-84g=UGM-84G,Harpoon Blk IG,ASM,A submarine launched NATO subsonic sea skimming anti-ship missile derived from the Block 1C Harpoon with an active radar terminal seeker and improved terminal recovery logic. The Block 1G UGM-84G added re attack capability from the cancelled Block 1D program and further improved ECCM while retaining the programmable routing and terminal attack options of the UGM-84D.
usn_ugm-84n=UGM-84N,Harpoon Blk II+,ASM,A submarine launched network enabled Harpoon Block II+ subsonic sea skimming anti-ship missile with an active radar terminal seeker, updated GPS guidance and in flight target update capability. The UGM-84N added a two way data link, mission abort option, improved target selectivity and enhanced resistance to electronic countermeasures.

knm_nsm_1a=NSM,Naval Strike Missile Blk IA,ASM,A low-observable subsonic anti-ship and land-attack missile with an imaging infrared seeker. The guidance uses terrain and scene matching plus waypointing for complex approach paths. Sea-skimming and terminal maneuvers enhance survivability against modern defenses. The IIR seeker enables discrimination of targets in cluttered littorals. It can also strike selected land targets when authorized.
knm_3sm_tyrfing=3SM,Tyrfing,ASM,A next generation supersonic anti-ship and land-attack missile under joint Norwegian and German development. It is intended to provide long range standoff with high endgame energy and modern seeker and datalink support for complex target sets. The stated development goal is Mach 2 to 3 performance.

swe_rbs15_mk1=RBS15 Mk1,,ASM,An early generation subsonic sea skimming anti-ship missile with an active radar seeker and fire and forget operation. It follows low altitude routes to reduce detection and supports basic pre planned approaches against surface targets.
swe_rbs15_mk2=RBS15 Mk2,,ASM,An upgraded RBS15 variant focused on improved midcourse and terminal guidance and better survivability in electronic warfare environments. It retains subsonic sea skimming tactics with an active radar seeker and autonomous terminal homing against surface targets.
swe_rbs15_mk3=RBS15 Mk3,,ASM,A long range subsonic anti-ship and land-attack missile with an all weather active radar seeker and robust electronic protection. Mission planning supports multiple waypoints and coordinated multi angle attacks while the missile maintains sea state adapted sea skimming to limit detection. Terminal flight can include evasive maneuvers and timing control for synchronized strikes.
swe_rbs15_mk4=RBS15 Mk4,Gungnir,ASM,A next generation evolution of the RBS15 family with improved radar seeker and enhanced navigation resilience for complex contested environments. It supports coordinated attacks from multiple platforms and flexible routing at very low altitude with sea state adaptation.

fr_sm39=SM.39,Exocet Blk 2,ASM,Designed for submarines, this version is a submarine-launched missile. Studies of the original SM39 began in 1978, and it entered service in 1985. The missile is housed in a watertight capsule the size of a torpedo, which is propelled and launched by a torpedo tube. Upon exiting the water, the capsule's fairing is ejected, and the missile is detonated; it then behaves like an AM39 missile.
fr_mm-40_block3=MM.40,Exocet Blk 3C,ASM,The MM40 Block 3 missile has an improved range, in excess of 180 kilometres, and accepts GPS guidance system waypoint commands, which allow it to attack naval targets from different angles.

eu_mm_otomat_mk2_blk1=Otomat MK 2,Block I,ASM,The Otomat is a subsonic anti-ship missile developed in the late 1960s as the primary ASM for the Italian navy. While other well-known anti-ship missiles such as the Harpoon and the Exocet are powered by a rocket motor the Otomat is powered by a turbofan, a decision taken to allow for a higher range and a larger payload capacity compared to other missiles. The Otomat MK 1 was originally limited in its maximum engagement range by the radar horizon of the launching ship, a shortcoming which the new Ototmat MK 2 Block I solved in the late 1970s with the introduction of a datalink for over-the-horizon targeting.
eu_mm_otomat_mk2_blk2=Otomat MK 2,Block II,ASM,The Otomat is a subsonic anti-ship missile developed in the late 1960s as the primary ASM for the Italian navy. While other well-known anti-ship missiles such as the Harpoon and the Exocet are powered by a rocket motor the Otomat is powered by a turbofan, a decision taken to allow for a higher range and a larger payload capacity compared to other missiles. The Otomat MK 2 Block II is a 1980s upgrade of the missile which introduces folding wings to the design, enabling storage in 50% smaller containers and therefore allowing surface combatants to carry more missiles.
mm_otomat_mk2_blk4=Otomat MK 2,Block IV,ASM,The Otomat is a subsonic anti-ship missile developed in the late 1960s as the primary ASM for the Italian navy. While other well-known anti-ship missiles such as the Harpoon and the Exocet are powered by a rocket motor the Otomat is powered by a turbofan, a decision taken to allow for a higher range and a larger payload capacity compared to other missiles. The Block IV upgrade utilizes components from the development of the Marte MK 2/S missile and abolishes the use of the helicopter-based datalink in favor of a ship-based one for over-the-horizon targeting. It is additionally fitted for receiving waypoint via GPS, performing autonomous re-attack and terminal evasive maneuvers.
mm_otomat_mk2e=Otomat MK 2E,Teseo EVO,ASM,The Otomat is a subsonic anti-ship missile developed in the late 1960s as the primary ASM for the Italian navy. While other well-known anti-ship missiles such as the Harpoon and the Exocet are powered by a rocket motor the Otomat is powered by a turbofan, a decision taken to allow for a higher range and a larger payload capacity compared to other missiles. The Otomat MK 2E "Teseo EVO" is the latest iteration of the missile with a significantly extended range and an enhanced land-attack mode, providing the Marina Militare with a tactical strike capability previously only possessed by the Italian airforce with its Storm Shadow missiles.
eu_mm_marte=Marte MK 2/S,,ASM,The Marte is a medium range anti-ship missile developed in the mid 1970s by Sistemi Elettronici in Italy as the successor of the Sea Killer missile. Compared to its predecessor the Marte has a much improved range, partially thanks to dropping the beam-riding guidance method in favor of using the active radar seeker of the Otomat missile. The Marte MK 2/S is the helicopter-launched version of the Marte MK 2 which entered service with the Marina Militare in 1990.

eu_as34=AS.34,Kormoran,ASM,The Kormoran is a medium range anti-ship missile developed jointly by France and Germany and carried by West German F-104 Starfighters and Panavia Tornados. The Bundeswehr originally evaluated the US made AGM-12 Bullpup and the French AS.30 for use in the anti-shipping role, but after both missiles failed to meet expectations the German firm of MBB and French A rospatiale cooperated to develop a new missile based on the AS.33 in the mid 1960s. The Kormoran is broadly similar to the Exocet in looks and capabilities due to being developed at the same time.

#-----------Land Strike only missiles---------
eu_mm_alfa=Alfa,,MRBM,The Alfa ballistic missile is the result of Italian efforts to develop a domestic nuclear detterence in the mid 1960s. Originally Italy sought to base its nuclear deterrence around the US-made Polaris SLBM, which would be carried by large surface combatants which had already been built with facilities for the missiles in the mid and late 1960s. However, the United States refused to provide the Polaris missile, which caused Italy to start development of a domestic medium-range ballistic missile from the ground up in the early 1970s. The program was progressing well until the ratification of the Treaty on the Non-Proliferation of Nuclear Weapons by Italy in 1975 put an end to all Italian nuclear programs.

fr_mdcn=MdCN,,Land Attack,The Missile de Croisi re Naval (MdCN), meaning Naval Cruise Missile, is a French turbojet-powered subsonic cruise missile intended for ship and submarine-based land-attack operations. Originally dubbed SCALP Naval, the program arose out of a requirement issued by the French Ministry of Defence for a more potent cruise missile capable of striking strategic and military targets from extended stand-off ranges in order to complement the air-launched SCALP-EG.

usn_rgm-109c3=RGM-109C3,TLAM Blk III,Land Attack,The Tomahawk Land Attack Missile (TLAM) is an American standoff land attack missile. These weapons fly a pre-programmed route to a target with no input from the launch platform after launch, using terrain contour matching using a terrain mapping radar and onboard digital maps. The C3 modification adds GPS guidance, allowing for accurate waypoint guidance (modeled via RC midcourse guidance) and extended range, alongside higher accuracy.
usn_rgm-109e=RGM-109E,TLAM Blk IV,Land Attack,A long-range land-attack cruise missile for precision strikes against fixed or relocatable targets. It uses an inertial/GPS navigation stack with terrain/scene-matching updates and a two-way datalink for in-flight retargeting and mission updates. Subsonic, low-altitude routing emphasizes survivability through route planning rather than speed; best employed with good ISR/target coordinates and deconflicted airspace.
usn_rgm-109e5=RGM-109E5,TLAM Blk V,Land Attack,A Block V land-attack Tomahawk (RGM-109E family) recertified from Block IV with NAV/COMMs upgrades for improved navigation performance and more robust communications. It retains long-range, low-altitude, subsonic flight using INS/TERCOM/DSMAC/GPS and supports in-flight retargeting/loitering via datalink.
usn_rgm-109e5b=RGM-109E5b,TLAM Blk Vb,Land Attack,A Block Vb land-attack Tomahawk (RGM-109E family) recertified from Block IV with NAV/COMMs upgrades for improved navigation performance and more robust communications. It retains long-range, low-altitude, subsonic flight using INS/TERCOM/DSMAC/GPS and supports in-flight retargeting/loitering via datalink. The Block Vb update replaces the legacy warhead with the Joint Multiple Effects Warhead System (JMEWS) to improve effectiveness against hardened and more diverse land targets.

usn_ugm-109c3=UGM-109C3,TLAM Blk III,Land Attack,The Tomahawk Land Attack Missile (TLAM) is an American standoff land attack missile. These weapons fly a pre-programmed route to a target with no input from the launch platform after launch, using terrain contour matching using a terrain mapping radar and onboard digital maps. The C3 modification adds GPS guidance, allowing for accurate waypoint guidance (modeled via RC midcourse guidance) and extended range, alongside higher accuracy. This version is submarine launched.
usn_ugm-109e=UGM-109E,TLAM Blk IV,Land Attack,The Tomahawk Land Attack Missile (TLAM) is an American standoff land attack missile. These weapons fly a pre-programmed route to a target with no input from the launch platform after launch, using terrain contour matching using a terrain mapping radar and onboard digital maps. The Tactical Tomahawk (RGM-109E) is a major rework of the original TLAM missile, with a new airframe and rebuilt guidance system allowing for mid-flight updates, this missile is truly a modern land-attack missile. This version is submarine launched.
usn_ugm-109e5=UGM-109E5,TLAM Blk V,Land Attack,A Block V land-attack Tomahawk (RGM-109E family) recertified from Block IV with NAV/COMMs upgrades for improved navigation performance and more robust communications. It retains long-range, low-altitude, subsonic flight using INS/TERCOM/DSMAC/GPS and supports in-flight retargeting/loitering via datalink.
usn_ugm-109e5b=UGM-109E5b,TLAM Blk Vb,Land Attack,A Block Vb land-attack Tomahawk (RGM-109E family) recertified from Block IV with NAV/COMMs upgrades for improved navigation performance and more robust communications. It retains long-range, low-altitude, subsonic flight using INS/TERCOM/DSMAC/GPS and supports in-flight retargeting/loitering via datalink. The Block Vb update replaces the legacy warhead with the Joint Multiple Effects Warhead System (JMEWS) to improve effectiveness against hardened and more diverse land targets.

# ---------- Anti-sub Missilies ----------
eu_mm_milas=Otomat MILAS,,ASW Missile,The Otomat MILAS is a long-range anti-submarine stand-off missile based on the Otomat anti-ship missile. Originally developed jointly by Italy and France MILAS consists of an almost unchanged fuselage of the Otomat missile which was supposed to carry the upcoming A.290 (for Italy) and Murene (for France) light-weight ASW torpedos in its nose. The two torpedo programs were merged in 1991 however, producing the MU90 ASW torpedo which would now also be carried by the MILAS. The Marina Militare is the only user of the missile since 2002, as France decided in 1998 that it would not procure the system once development concluded.

usn_rur-5a=RUR-5A,ASROC,ASW,The RUR-5 ASROC (for Anti-Submarine Rocket) is a standoff anti-submarine weapon. The ASROC missile is launched from the shooting platform and deploys a MK 46 Mod 5 NEARTIP (Near Term Improvement Program) ASW torpedo after flying a ballistic trajectory.

usn_rur-5_mod3=RUR-5,Mod 3 ASROC,ASW,The RUR-5 ASROC (for Anti-Submarine Rocket) is a standoff anti-submarine weapon. The ASROC missile is launched from the shooting platform and deploys a MK 44 ASW torpedo after flying a ballistic trajectory.
usn_rur-5_mod4=RUR-5,Mod 4 ASROC,ASW,The RUR-5 ASROC (for Anti-Submarine Rocket) is a standoff anti-submarine weapon. The ASROC missile is launched from the shooting platform and deploys a MK 46 Mod 0 ASW torpedo after flying a ballistic trajectory.
usn_rur-5_mod4_2=RUR-5,Mod 4 ASROC,ASW,The RUR-5 ASROC (for Anti-Submarine Rocket) is a standoff anti-submarine weapon. The ASROC missile is launched from the shooting platform and deploys a MK 46 Mod 1 ASW torpedo after flying a ballistic trajectory.

usn_rum-139a=RUM-139A,VL-ASROC,ASW,The RUM-139A VL-ASROC is a standoff anti-submarine weapon. The ASROC missile is launched from the shooting platform and deploys a MK 46 Mod 5 ASW torpedo after flying a ballistic trajectory. The VL version is launched from a MK 41 VLS cell, and has double the range of its earlier counterpart.
usn_rum-139c=RUM-139C,VL-ASROC,ASW,The RUM-139C VL-ASROC is a standoff anti-submarine weapon. The ASROC missile is launched from the shooting platform and deploys a MK 54 ASW torpedo after flying a ballistic trajectory. The VL version is launched from a MK 41 VLS cell, and has double the range of its earlier counterpart.

# ------------------ RBU ------------------
swe_sjunkbomb_m33_DC=Sjunkbomb m/33,,Depth Charge,A simple depth charge weapon for close-range anti-submarine attacks. It relies on accurate target depth/range estimation and is most effective against slow or constrained submarines (e.g., in narrow waters). In gameplay terms, it is a short-range area effect weapon: prioritize dropping patterns when contact quality is high and the sub cannot rapidly evade vertically.
eu_mm_dc=Depth charge
eu_mm_bas=BAS,,Depth Charge Mortar
eu_mm_bas_sr=BAS (short range),,Depth Charge Mortar

# ---------- Torpedoes ----------
eu_mu_90_ship=MU90,Impact,ASW Torpedo,A lightweight anti-submarine torpedo with active and passive acoustic homing. It is designed to perform in both shallow littoral waters and deep ocean conditions. The torpedo incorporates counter-countermeasure features to cope with decoys and noise. Launch is from 324 mm tubes or by helicopter and aircraft. Performance depends on environmental conditions and target tactics.
eu_mu_90_air=MU90,Impact,ASW Torpedo,A lightweight anti-submarine torpedo with active and passive acoustic homing. It is designed to perform in both shallow littoral waters and deep ocean conditions. The torpedo incorporates counter-countermeasure features to cope with decoys and noise. Launch is from 324 mm tubes or by helicopter and aircraft. Performance depends on environmental conditions and target tactics.

ger_g7e=G7e,T IIIa,ASuW Torpedo,The G7e is a Germany legacy WWII electric torpedo first introduced in 1936. Following the end of the war sizeable stockpiles of the type remained in service with the newly founded Bundesmarine but also with the navies of Spain, Denmark and Norway.
ger_mu_90_ship=MU90,Impact,ASW Torpedo,A lightweight anti-submarine torpedo with active and passive acoustic homing. It is designed to perform in both shallow littoral waters and deep ocean conditions. The torpedo incorporates counter-countermeasure features to cope with decoys and noise. Launch is from 324 mm tubes or by helicopter and aircraft. Performance depends on environmental conditions and target tactics.
ger_seaspider=SeaSpider,,Anti-Torpedo Torpedo,An anti-torpedo torpedo intended for hard-kill defense of ships and high-value assets. The effector autonomously intercepts incoming torpedoes based on onboard processing. It complements soft-kill decoys by providing a terminal hard-kill option. Integration requires cueing from ship sensors and engagement doctrine. Inventory and loadout depend on platform and mission priorities.
ger_dm2a4=DM2A4,SeaHake,ASuW/ASW Torpedo,A heavyweight 533 mm submarine-launched torpedo with wire guidance and terminal active/passive acoustic homing. Optimized for long-range attacks against submarines and surface ships with robust counter-countermeasure logic. Effectiveness depends on doctrine, water conditions, and target maneuvers, and employment is limited by tube and reload cycles.
ger_dm2a4_er=DM2A4 ER,SeaHake,ASuW/ASW Torpedo,Extended-range SeaHake mod4 derivative based on the DM2A4 family. A 2012 test firing demonstrated a range of more than 140 km, making this a specialist long-endurance stand-off weapon rather than the standard German submarine torpedo. Exact speed/range curves are not public; the in-game values are estimated.
ger_dm2a5=DM2A5,SeaHake,ASuW/ASW Torpedo,Future German-Norwegian 533 mm heavyweight torpedo intended for the Type 212CD class. Public information describes a software-centred architecture, modular battery-electric propulsion, fibre-optic datalink and advanced digital sonar for multi-target and acoustically complex coastal-water engagements. Exact performance data are not public; the in-game values are estimated.
ita_blackshark=Black Shark,,ASuW/ASW Torpedo,A heavyweight 533 mm submarine-launched torpedo with wire guidance and terminal active/passive acoustic homing. Known for a high warhead mass and modern search and reattack behavior with strong resistance to decoys. Performance depends on tactical settings, environment, and target reactions, and is constrained by tube capacity and reload time.

fr_F21=F21,Artemis,ASuW/ASW Torpedo,A heavyweight 533 mm submarine-launched torpedo with wire guidance and terminal active/passive acoustic homing. Designed for deep-water operations, high speed, and precise endgame control against submarines and surface ships with improved counter-countermeasure handling. Real-world outcomes depend on doctrine, conditions, and target maneuvering, and are limited by tube availability and reload procedures.
fr_mu_90_ship=MU90,Impact,ASW Torpedo,The MU90 Impact is a Franco-Italian advanced lightweight anti-submarine torpedo.It has active/passive homing system and a maximum depth of over 1000m,making this an extremely dangerous weapon against enemy submarines.

rn_stingray_mod0_air=Stingray Mod 0,,ASW Torpedo,The Stingray is the result of the British desire to develop a domestic light-weight ASW torpedo in the mid 1960s to decrease dependency on the United States. After a lengthy development period with numerous changes to the original design the torpedo was completely revised in 1976 to avoid having to revert to buying a US-made model.
rn_stingray_mod0_ship=Stingray Mod 0,,ASW Torpedo,The Stingray is the result of the British desire to develop a domestic light-weight ASW torpedo in the mid 1960s to decrease dependency on the United States. After a lengthy development period with numerous changes to the original design the torpedo was completely revised in 1976 to avoid having to revert to buying a US-made model.
rn_stingray_mod1_air=Stingray Mod 1,,ASW Torpedo,The Stingray is the result of the British desire to develop a domestic light-weight ASW torpedo in the mid 1960s to decrease dependency on the United States. After a lengthy development period with numerous changes to the original design the torpedo was completely revised in 1976 to avoid having to revert to buying a US-made model. The Stingray mod. 1 is a modernization of the torpedo which entered service in 2006, featuring a number of improvements such as a whole new digital acoustic seeker, guidance computer and electro-mechanical actuation system for the control surfaces.
rn_stingray_mod1_ship=Stingray Mod 1,,ASW Torpedo,The Stingray is the result of the British desire to develop a domestic light-weight ASW torpedo in the mid 1960s to decrease dependency on the United States. After a lengthy development period with numerous changes to the original design the torpedo was completely revised in 1976 to avoid having to revert to buying a US-made model. The Stingray mod. 1 is a modernization of the torpedo which entered service in 2006, featuring a number of improvements such as a whole new digital acoustic seeker, guidance computer and electro-mechanical actuation system for the control surfaces.

swe_torped_45=Torped 45,SLWT,ASW Torpedo,A Swedish lightweight anti-submarine torpedo intended for short- to medium-range engagements. It uses active/passive acoustic homing and is optimized for littoral operations where bottom clutter and reverberation complicate detection. Best employed with good initial target localization from hull sonar or a towed/VDS cue, then handed over to the weapon seeker in the terminal phase.
swe_torped_47=Torped 47,SLWT,ASW Torpedo,A newer Swedish lightweight torpedo optimized for modern shallow-water ASW. It is designed for improved performance in noisy littorals, better counter-countermeasures, and higher reliability in complex propagation conditions. Use it as the primary close-in ASW effector when you can provide accurate initial bearing/range from sonar systems.

eu_mm_g6e=G6e,,ASuW Torpedo,The G6e is a modified version of the German WWII G7e electrical straight running torpedo. Motivated by the need to arm the upcoming Toti class submarines the Italian company Whitehead-Motofides modified the G7e by shortening it by a meter, introducing more power-dense silver-zinc batteries and mounting a passive acoustic seeker. Due to being a stop-gap solution pending the arrival of the dual-purpose A.184 torpedo only two-dozen G6e were produced until the mid 1960s and distributed among the Toti class submarines.
eu_mm_a184=A.184 Mod 0,,ASuW/ASW Torpedo,The A.184 is the standard heavyweight dual-purpose torpedo of the Italian navy. Until its introduction in 1974 the Italian navy was still armed with legacy WWII torpedoes for anti-ship warfare and possessed no dedicated heavyweight ASW torpedo. This was a problem especially for the new Toti class submarines which had been built as dedicated submarine hunters in the mid 1960s, without there actually being a suitable ASW torpedo in the navies arsenal. Subsequently work started on an improvement of the A.182 torpedo, resulting in the A.184.
eu_mm_a184_mod1=A.184 Mod 1,,ASuW/ASW Torpedo,The A.184 is the standard heavyweight dual-purpose torpedo of the Italian navy. Starting in 1978 the torpedo was upgraded with an improved electronic guidance system to increase resistance against countermeasures and improve reliability.
eu_mm_a184_mod2=A.184 Mod 2,,ASuW/ASW Torpedo,The A.184 is the standard heavyweight dual-purpose torpedo of the Italian navy. The mod. 2 variant is an engagement envelope expansion upgrade for the A.184 which aims to improve its ability to combat the new generation of Soviet attack submarines, elevating its capabilities closer to newer and faster torpedoes fielded by other NATO members in the mid 1980s.
eu_mm_si270=S.I. 270/533,,ASuW Torpedo,The S.I. 270/533X7,2 Tipo I is an Italian WWII wet-heater straight running torpedo.
eu_mm_a244_ship=A.244,,ASW Torpedo,The A.244 is a lightweight anti-submarine torpedo developed by Whitehead Alenia in Italy as a replacement for the MK 44 torpedo. It shares many design similarities with the older weapon such as the mono-frequency seeker, but improves in key areas such as speed and endurance.
eu_mm_a244_air=A.244,,ASW Torpedo,The A.244 is a lightweight anti-submarine torpedo developed by Whitehead Alenia in Italy as a replacement for the MK 44 torpedo. It shares many design similarities with the older weapon such as the mono-frequency seeker, but improves in key areas such as speed and endurance.
eu_mm_a244s_ship=A.244/S,,ASW Torpedo,The A.244/S is an improved variant of the A.244 lightweight anti-submarine torpedo originally developed by Whitehead Alenia as a replacement for the MK 44 torpedo. It was introduced in 1984 and most notably differs from the base model by using the new CIACIO-S triple frequency seeker, significantly enhancing the weapons detection capabilities.
eu_mm_a244s_air=A.244/S,,ASW Torpedo,The A.244/S is an improved variant of the A.244 lightweight anti-submarine torpedo originally developed by Whitehead Alenia as a replacement for the MK 44 torpedo. It was introduced in 1984 and most notably differs from the base model by using the new CIACIO-S triple frequency seeker, significantly enhancing the weapons detection capabilities.
eu_mm_a244s_mod1_ship=A.244/S Mod 1,,ASW Torpedo,The A.244/S is an improved variant of the A.244 lightweight anti-submarine torpedo originally developed by Whitehead Alenia in Italy as a replacement for the MK 44 torpedo. The mod. 1 upgrade of the weapon introduces a few engagement envelope improvements as well as a new seeker capable of using multiple pre-formed beams, the shape of which can be changed to suit acoustic conditions.
eu_mm_a244s_mod1_air=A.244/S Mod 1,,ASW Torpedo,The A.244/S is an improved variant of the A.244 lightweight anti-submarine torpedo originally developed by Whitehead Alenia in Italy as a replacement for the MK 44 torpedo. The mod. 1 upgrade of the weapon introduces a few engagement envelope improvements as well as a new seeker capable of using multiple pre-formed beams, the shape of which can be changed to suit acoustic conditions.
mm_mu_90=MU90,Impact,ASW Torpedo,The MU90 is a Franco-Italian lightweight ASW torpedo produced by a consortium called "EuroTorp". It is the result of two separate projects from Italy (the A.290) and France (the Mur ne) to develop a new light ASW torpedo towards the end of the cold war. The MU90 is powered by a high-speed pump-jet engine and uses a very sophisticated dual-mode seeker with advanced anti-countermeasure capabilities.
mm_mu_90_ship=MU90,Impact,ASW Torpedo,The MU90 is a Franco-Italian lightweight ASW torpedo produced by a consortium called "EuroTorp". It is the result of two separate projects from Italy (the A.290) and France (the Mur ne) to develop a new light ASW torpedo towards the end of the cold war. The MU90 is powered by a high-speed pump-jet engine and uses a very sophisticated dual-mode seeker with advanced anti-countermeasure capabilities.

usn_mk14=MK 14,,ASuW Torpedo, The Mark 14 is a straight running heavyweight anti-ship torpedo which was developed before WWII. Although plagued with numerous flaws and reliabilty issues it entered mass production and became the standard heavyweight torpedo of the US Navy, with its kinks being gradually ironed out throughout the war. After WWII it remained in US service as the primary anti-ship torpedo beside the MK 16 until the arrival of the MK 48. The mod. 3 variant of the torpedo features a heavier warhead.
usn_mk16_mod8=MK 16 Mod 8,,ASuW Torpedo,The Mark 16 is a hydrogen-peroxide fueled torpedo developed from the US Navy's standard Mark 14 torpedo in use during WWII, incorporating a number of war-tested improvements. Due to high unit cost and the Mark 14's reliability issues being solved before the end of the war the torpedo was only produced in limited numbers, but remained the primary anti-ship torpedo of the US Navy alongside the MK 14 until the arrival of the MK 48. The mod. 8 variant of the torpedo combines the originally larger warhead of the MK 16 mod. 0 with the improved range of the MK 16 mod. 1.
usn_mk46_mod0_air=MK 46 Mod 0,,ASW Torpedo,The Mark 46 Mod 0 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. Designed to attack modern Soviet high-performance submarines this variant is air dropped.
usn_mk46_mod0_ship=MK 46 Mod 0,,ASW Torpedo,The Mark 46 Mod 0 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. Designed to attack modern Soviet high-performance submarines this variant is air dropped.
usn_mk46_mod1_air=MK 46 Mod 1,,ASW Torpedo,The Mark 46 Mod 1 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. Designed to attack modern Soviet high-performance submarines this variant is air dropped. The Mod 1 is an upgraded version with a new liquid Otto fuel engine, increasing the weapons' range.
usn_mk46_mod1_ship=MK 46 Mod 1,,ASW Torpedo,The Mark 46 Mod 1 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. Designed to attack modern Soviet high-performance submarines this variant is air dropped. The Mod 1 is an upgraded version with a new liquid Otto fuel engine, increasing the weapons' range.
usn_mk46_5_air=MK 46 Mod 5,NEARTIP,ASW/ASuW Torpedo,The Mark 46 Mod 5 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. The Mod 5 version allows for the ability to engage surface targets or surfaced submarines with limited effectiveness, improves the fuel and motor system for more efficient cruising and faster terminal phase, and increases the immunity of the seeker against countermeasures. This variant is air dropped.
usn_mk46_5_asroc=MK 46 Mod 5,NEARTIP,ASW/ASuW Torpedo,The Mark 46 Mod 5 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. The Mod 5 version allows for the ability to engage surface targets or surfaced submarines with limited effectiveness, improves the fuel and motor system for more efficient cruising and faster terminal phase, and increases the immunity of the seeker against countermeasures. This variant is ASROC deployed.
usn_mk46_5_ship=MK 46 Mod 5,NEARTIP,ASW/ASuW Torpedo,The Mark 46 Mod 5 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. The Mod 5 version allows for the ability to engage surface targets or surfaced submarines with limited effectiveness, improves the fuel and motor system for more efficient cruising and faster terminal phase, and increases the immunity of the seeker against countermeasures. This variant is ASROC deployed.
usn_mk48_5=MK 48 Mod 5,ADCAP,ASW/ASuW Torpedo,The Mark 48 Mod 5 ADCAP is an American heavyweight torpedo. These torpedoes are wire guided and capable of being retargeted from the launch platform. The Mod 5 ADCAP (ADvanced CAPability) is a comprehensive upgrade to the kinematic abilities on Mark 48 Mod 4, greatly improving speed, range, maneuverability, and deep-diving performance considerably, while retaining the potent seeker characteristics of Mark 48 Mod 4. Truly a top-class torpedo for its time.
usn_mk48_6=MK 48 Mod 6,ADCAP,ASW/ASuW Torpedo,The Mark 48 Mod 6 ADCAP is an American heavyweight torpedo. These torpedoes are wire guided and capable of being retargeted from the launch platform. The Mod 6 variant primarily improves the seeker and propulsion on the torpedo, increasing countermeasure resistance and reliability, while also making the torpedo significantly longer range and quieter than its earlier counterparts.
usn_mk48_7=MK 48 Mod 7,CBASS,ASW/ASuW Torpedo,The Mark 48 Mod 7 CBASS is an American heavyweight torpedo. These torpedoes are wire guided and capable of being retargeted from the launch platform. The Mod 7 CBASS variant improves shallow-water capability, countermeasure rejection performance, and maneuverability to face the latest threats. It also features a shorter minimum range than its predecessors.
usn_mk48_8=MK 48 Mod 8,TI-1,ASW/ASuW Torpedo,The MK 48 Mod 8 is the latest major hardware upgrade to the U.S. Navy’s standard heavyweight acoustic-homing torpedo, engineered to counter modern stealth submarines and anti-torpedo countermeasures across the entire submarine fleet. A primary advancement is the Improved Post Launch Communications System (IPLCS), which replaces traditional copper wire with fiber optics to provide vastly increased bandwidth for real-time sonar data and targeting updates. Additionally, through the Technology Insertion 1 (TI-1) and APB 6 initiatives, the torpedo integrates advanced digital signal processing, upgraded fuzing, and a revamped sonar array that expands its acoustic frequency range and spatial resolution. Guided by these upgraded digital control algorithms, the Mod 8 possesses superior resistance against enemy acoustic decoys and excels at operating in complex shallow and littoral waters.
usn_mk50_air=MK 50,ALWT,ASW Torpedo,The Mark 50 Advanced Lightweight Torpedo is a next-generation anti-submarine weapon designed to give lighter-weight platforms the extreme capability required to effectively counter the latest deep-diving submarines. While the ALWT program was cancelled, several hundred torpedoes were produced, allowing for just enough for the entire fleet to share. This variant is air dropped.
usn_mk50_ship=MK 50,ALWT,ASW Torpedo,The Mark 50 Advanced Lightweight Torpedo is a next-generation anti-submarine weapon designed to give lighter-weight platforms the extreme capability required to effectively counter the latest deep-diving submarines. While the ALWT program was cancelled, several hundred torpedoes were produced, allowing for just enough for the entire fleet to share. This variant is ship launched.
usn_mk50_asroc=MK 50,ALWT,ASW Torpedo,The Mark 50 Advanced Lightweight Torpedo is a next-generation anti-submarine weapon designed to give lighter-weight platforms the extreme capability required to effectively counter the latest deep-diving submarines. While the ALWT program was cancelled, several hundred torpedoes were produced, allowing for just enough for the entire fleet to share. This variant is ASROC deployed.
usn_mk54_air=MK 54,LHT,ASW Torpedo,The Mark 54 Lightweight Hybrid Torpedo (LHT) is an affordable new standard of lightweight ASW torpedo combining all of the seeker technologies used from the high-performance MK 50 ALWT, while using a modestly upgraded version of the MK 46 torpedo body. This lets a cheap, common torpedo like MK 54 have very high performance against most targets, even if it may not be as capable against ultra-deep-diving fast submarines. This variant is air dropped.
usn_mk54_ship=MK 54,LHT,ASW Torpedo,The Mark 54 Lightweight Hybrid Torpedo (LHT) is an affordable new standard of lightweight ASW torpedo combining all of the seeker technologies used from the high-performance MK 50 ALWT, while using a modestly upgraded version of the MK 46 torpedo body. This lets a cheap, common torpedo like MK 54 have very high performance against most targets, even if it may not be as capable against ultra-deep-diving fast submarines. This variant is ship launched.
usn_mk54_asroc=MK 54,LHT,ASW Torpedo,The Mark 54 Lightweight Hybrid Torpedo (LHT) is an affordable new standard of lightweight ASW torpedo combining all of the seeker technologies used from the high-performance MK 50 ALWT, while using a modestly upgraded version of the MK 46 torpedo body. This lets a cheap, common torpedo like MK 54 have very high performance against most targets, even if it may not be as capable against ultra-deep-diving fast submarines. This variant is ASROC deployed.
usn_mk54_1_air=MK 54 Mod 1,LHT,ASuW/ASW Torpedo,The MK 54 Mod 1 primarily improves the sonar array, electronics and signal processing over earlier MK 54 weapons while retaining broadly similar propulsion and range performance.
usn_mk54_1_ship=MK 54 Mod 1,LHT,ASuW/ASW Torpedo,The MK 54 Mod 1 primarily improves the sonar array, electronics and signal processing over earlier MK 54 weapons while retaining broadly similar propulsion and range performance.
usn_mk54_1_asroc=MK 54 Mod 1,LHT,ASuW/ASW Torpedo,The MK 54 Mod 1 primarily improves the sonar array, electronics and signal processing over earlier MK 54 weapons while retaining broadly similar propulsion and range performance.
usn_mk54_2_air=MK 54 Mod 2,LHT,ASuW/ASW Torpedo,Estimated near-future MK 54 Mod 2 air-launched torpedo. Public test reporting describes Mod 2 as adding a new engine and warhead to improve speed, endurance, lethality and operating depth.
usn_mk54_2_ship=MK 54 Mod 2,LHT,ASuW/ASW Torpedo,Estimated near-future MK 54 Mod 2 air-launched torpedo. Public test reporting describes Mod 2 as adding a new engine and warhead to improve speed, endurance, lethality and operating depth.
usn_mk54_2_asroc=MK 54 Mod 2,LHT,ASuW/ASW Torpedo,Estimated near-future MK 54 Mod 2 air-launched torpedo. Public test reporting describes Mod 2 as adding a new engine and warhead to improve speed, endurance, lethality and operating depth.
usn_mk58_craw=MK 58,CRAW VLWT,ASuW/ASW Torpedo,MK 58 Compact Rapid Attack Weapon / very lightweight torpedo. Public information indicates a compact offensive and defensive torpedo concept for increased magazine depth and counter-torpedo roles, but detailed speed.

wp_53-56va=53-56VA,,WH Torpedo,The 53-56 is a series of Soviet heavyweight straight running torpedos. They are updated variants of the 53-38. The 53-56VA is an improved version of the 53-56V, introducing a wake-homing seeker and also being produced exclusively for export.
wp_53-65m=53-65M,,WH Torpedo,The 53-65 is a Soviet wake-homing heavyweight torpedo designed to destroy surface ships. The 53-65M is an improved variant of the original 53-65 with an improved kerosene-hydrogen peroxide turbine for increased range.
wp_saet-60=SAET-60,,ASuW Torpedo,The SAET-60 is a Soviet heavyweight anti-ship torpedo first introduced in 1961. Due to the limited anti-ship capability of the dual-purpose USET-80 the SAET-60 remained in Soviet service for a long time, receiving several upgrades.
wp_saet-60m=SAET-60M,,ASuW Torpedo,The SAET-60 is a Soviet heavyweight anti-ship torpedo first introduced in 1961. Due to the limited anti-ship capability of the dual-purpose USET-80 the SAET-60 remained in Soviet service for a long time, receiving several upgrades. The SAET-60M features range improvements with only minimal sacrifice of speed.
wp_at-2_early=AT-2,,ASW Torpedo,The AT-2 is a Soviet electrical heavy-weight anti-submarine air-launched torpedo with active/passive acoustic guidance. The AT-2 is one of the few air-launched heavyweight torpedoes as the majority of the air-launched torpedoes are much smaller and only a quarter of the weight.
wp_at-2=AT-2M,,ASW Torpedo,The AT-2 is a Soviet electrical heavy-weight anti-submarine air-launched torpedo with active/passive acoustic guidance. The AT-2 is one of the few air-launched heavyweight torpedoes as the majority of the air-launched torpedoes are much smaller and only a quarter of the weight. The AT-2M is an improved variant utilizing the new 'Sapfir' seeker previously introduced on the SET-65M.
wp_set-40u=SET-40U,,ASW Torpedo,The SET-40 is a Soviet lightweight electrical anti-submarine torpedo. The SET-40U upgrade introduces an improved seeker.
wp_set-53=SET-53,Yenot 1,ASW Torpedo,The SET-53 is a Soviet heavyweight anti-submarine torpedo. With its introduction in 1958 it became the first dedicated anti-submarine torpedo in the Soviet arsenal.
wp_set-53m=SET-53M,Yenot 1,ASW Torpedo,The SET-53 is a Soviet heavyweight anti-submarine torpedo. SET-53M is an upgraded variant of the SET-53 with increased range.
wp_set-65m=SET-65M,Yenot 2,ASW Torpedo,The SET-65 is a Soviet heavyweight electrical anti-submarine torpedo. The SET-65M is an improved version of the SET-65 which was introduced in 1972, utilizing the new 'Sapfir' acoustic seeker.
wp_set-65k=SET-65K,Yenot 2,ASW Torpedo,The SET-65 is a Soviet heavyweight electrical anti-submarine torpedo. The SET-65K is a further improved version of the SET-65M introduced in 1986, now equipped with the newly developed 'Keramika' seeker simultaneously introduced on the TEST-71MK. 
wp_test-71mk=TEST-71MK,,ASW Torpedo,The TEST-71 is a Soviet heavyweight anti-submarine wire-guided torpedo. The TEST-71MK was introduced in 1986 and features the newly developed 'Keramika' seeker simultaneously introduced on the SET-65K.
wp_test-71m-nk=TEST-71M-NK,,ASW Torpedo,The TEST-71 is a Soviet heavyweight anti-submarine wire-guided torpedo. The TEST-71M-NK is the universal variant of the Test-71MK for launch from submarines and surface vessels.
wp_umgt-1m=UMGT-1M,Orlan,ASW Torpedo,The UMGT-1 is a Soviet air dropped anti-submarine torpedo which also serves as the payload for the SS-N-14 and SS-N-16 ASW missiles. These lightweight torpedoes pack less of a punch than Soviet heavyweight torpedoes but are still extremely dangerous. The UMGT-1M is an upgraded version capable of engaging targets at larger depths and the ability to attack surface vessels.
wp_uset-80k=USET-80K,,ASuW/ASW Torpedo,The USET-80 is the first by-design dual-purpose torpedo for the Soviet navy. The USET-80K was an upgraded variant introduced into the Soviet navy shortly before the end of the cold war. It replaced the sophisticated and troublesome 'Vodopad' seeker with the more reliable 'Keramika' acoustic seeker previously introduced on the SET-65K and TEST-71MK.

# ------------------ Bombs -----------------
usn_gbu-12d=GBU-12D,,Guided Bomb
gre_mk_54=MK 54,,Depth Charge,US Made depth charge designed to be dropped from aircraft

eu_am_kb44=KB 44,,Anti-Tank Cluster Bomblet,The Kleinbombe 44 is one of the submunitions carried by the MW-1 munitions dispenser developed in West Germany. It has a combined cluster and HEAT warhead intended to be used against unarmored or lightly armored targets such as APCs and parked aircraft.

eu_am_stabo=STABO,,Anti-Runway Bomblet,The Startbahnbombe ("Runway bomb") is one of the submunitions carried by the MW-1 munitions dispenser developed in West Germany. It carries a two-stage shaped charge warhead of which the first charge detonates on impact to create a channel into the asphalt and the second explodes beneath the surface to create a cavity, making it much harder to repair.

# ---------------- Sonobuoys ---------------
rn_ssq-904=SSQ-904,,Sonobuoy,The SSQ-904 is a F-size version of the AN/SSQ-41 "Jezebel" sonobuoy developed in the United Kingdom, being roughly a third of the size of a regualr A-size buoy. This allows ASW platforms to carry thrice the amount of sonobuoy payload while sacrificing battery life.
rn_ssq-906=SSQ-906,,Sonobuoy,The SSQ-906 is a F-size version of the AN/SSQ-53B DIFAR sonobuoy developed in the United Kingdom, being roughly a third of the size of a regualr A-size buoy. This allows ASW platforms to carry thrice the amount of sonobuoy payload while sacrificing battery life.
rn_ssq-906g=SSQ-906G,,Sonobuoy,The SSQ-906G is a F-sized LOFAR sonobuoy developed in the United Kingdom. It allows ASW platforms to carry thrice the amount of sonobuoy payload while sacrificing somne battery life By being roughly a third of the size of a regualr A-size buoy.
rn_ssq-926=SSQ-926,ALFEA,Active Sonobuoy,The SSQ-626 is a British high-power active sonobuoy equivalent to the AN/SSQ-101 ADAR.
rn_ssq-954=SSQ-954,,Sonobuoy,The SSQ-954 is a miniaturized version of the AN/SSQ-41 "Jezebel" sonobuoy developed in the United Kingdom. It doubles overall sonobuoy payload that can be carried by ASW helicopters by being half the size of a standard-size buoy, sacrificing battery life in return.
rn_ssq-955=SSQ-955,HIDAR,Sonobuoy,The SSQ-955 is an F-sized passive sonobuoy developed in the United Kingdom. It is roughly equivalent to the AN/SSQ-53F.
rn_ssq-955b=SSQ-955B,HIDAR,Sonobuoy,The SSQ-955B is an F-sized passive sonobuoy developed in the United Kingdom. It is roughly equivalent to the AN/SSQ-53G.
rn_ssq-963a=SSQ-963A,CAMBS III,Active Sonobuoy,The SSQ-963A is a British active sonobuoy equivalent to the AN/SSQ-62A.
rn_ssq-963b=SSQ-963B,CAMBS IV,Active Sonobuoy,The SSQ-963B is a British active sonobuoy equivalent to the AN/SSQ-62B.
rn_ssq-963c=SSQ-963C,CAMBS V,Active Sonobuoy,The SSQ-963C is a British active sonobuoy equivalent to the AN/SSQ-62C.
rn_ssq-963d=SSQ-963D,CAMBS VI,Active Sonobuoy,The SSQ-963D is a British active sonobuoy equivalent to the AN/SSQ-62E.

usn_ssq-41b=AN/SSQ-41B,LOFAR,Sonobuoy,The AN/SSQ-41B "Jezebel" is a Low Frequency Analysis and Recording (LOFAR) type sonobouy. This is the most common NATO passive sonobuoy, and has no ability to determine bearing like the later DIFAR sonobuoy, but still has decent sensitivity, and can be found in large numbers in any Western navy's stockpile.
usn_ssq-53b=AN/SSQ-53B,DIFAR,Sonobuoy,The AN/SSQ-53B is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1. This version has a further improved hydrophone and allows for greater operational flexibility compared to prior models.
usn_ssq-53d=AN/SSQ-53D,DIFAR,Sonobuoy,The AN/SSQ-53D is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1. This version has a further improved hydrophone and allows for greater operational flexibility compared to prior models.
usn_ssq-53f=AN/SSQ-53F,DIFAR,Sonobuoy,The AN/SSQ-53F is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1. This version has a further improved hydrophone and allows for greater operational flexibility compared to prior models.
usn_ssq-53g=AN/SSQ-53G,DIFAR,Sonobuoy,The AN/SSQ-53G is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1. This version has a further improved hydrophone and allows for greater operational flexibility compared to prior models.
usn_ssq-53h=AN/SSQ-53H,DIFAR,Sonobuoy,The AN/SSQ-53H is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1. This version has a further improved hydrophone and allows for greater operational flexibility compared to prior models.
usn_ssq-62b=AN/SSQ-62B,DICASS,Active Sonobuoy,The AN/SSQ-62B DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys. This model has a significantly improved sonar system for greatly increased accuracy and range, alongside increasing the available frequencies the sonobuoy can detect, allowing for greater performance in littoral waters.
usn_ssq-62c=AN/SSQ-62C,DICASS,Active Sonobuoy,The AN/SSQ-62C DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys. This model has a significantly improved sonar system for greatly increased accuracy and range, alongside increasing the available frequencies the sonobuoy can detect, allowing for greater performance in littoral waters.
usn_ssq-62e=AN/SSQ-62E,DICASS,Active Sonobuoy,The AN/SSQ-62E DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys. This model has a significantly improved sonar system for greatly increased accuracy and range, alongside increasing the available frequencies the sonobuoy can detect, allowing for greater performance in littoral waters.
usn_ssq-62f=AN/SSQ-62F,DICASS,Active Sonobuoy,The AN/SSQ-62F DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys. This model has a significantly improved sonar system for greatly increased accuracy and range, alongside increasing the available frequencies the sonobuoy can detect, allowing for greater performance in littoral waters.
usn_ssq-62g=AN/SSQ-62G,DICASS,Active Sonobuoy,The AN/SSQ-62G DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys. This model has a significantly improved sonar system for greatly increased accuracy and range, alongside increasing the available frequencies the sonobuoy can detect, allowing for greater performance in littoral waters.
usn_ssq-75=AN/SSQ-75A,ERAPS,Active Sonobuoy,The AN/SSQ-75 ERAPS (Expendable Reliable Acoustic Path Sonobuoy) is a long-range, directional command-activated active sonobuoy. Known for its high performance against quiet submarines in the open ocean, this sonobuoy offers exceptional performance, but unfortunately, its procurement is extremely limited, so few have survived.
usn_ssq-77b=AN/SSQ-77B,VLAD,Sonobuoy,The AN/SSQ-77B is a Vertical Line Array DIFAR passive sonobuoy, designed to be a generational improvement for the original DIFAR type passive sonobuoy. This buoy has a similar architecture to the DIFAR buoy, but incorporates an extremely sensitive sonar array that allows for extremely long passive range for a sonobuoy, high capability against quiet, deep-diving targets and exhibits good performance operating in cluttered, noisy waters.\n\nThe consequence of this greater performance is the weight and cost of this buoy, meaning these are not standard detection buoys, and their accuracy at range is poor, so they are mostly useful for localization of submerged targets.
usn_ssq-77c=AN/SSQ-77C,VLAD,Sonobuoy,The AN/SSQ-77C is a Vertical Line Array DIFAR passive sonobuoy, designed to be a generational improvement for the original DIFAR type passive sonobuoy. This buoy has a similar architecture to the DIFAR buoy, but incorporates an extremely sensitive sonar array that allows for extremely long passive range for a sonobuoy, high capability against quiet, deep-diving targets and exhibits good performance operating in cluttered, noisy waters.\n\nThe consequence of this greater performance is the weight and cost of this buoy, meaning these are not standard detection buoys, and their accuracy at range is poor, so they are mostly useful for localization of submerged targets.
usn_ssq-101=AN/SSQ-101A,ADAR,Active Sonobuoy,The AN/SSQ-101A ADAR is an active sonobuoy used for weapons-quality tracking of undersea targets like submarines. This is a highly capable active sonobuoy that can detect quiet or deep-diving submarine targets effectively, and can provide longer-range tracks on noisier submerged targets, allowing for effective long-range ASW operations.

