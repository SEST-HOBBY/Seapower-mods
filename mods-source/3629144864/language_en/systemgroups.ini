eu_Type_2050=Type 2050|The Type 2050 is a British medium-range bow-mounted active/passive search and attack sonar fitted to Royal Navy Type 23 frigates. It provides local submarine detection, classification, tracking and attack support, complementing the ship's much longer-ranged Type 2087 variable-depth sonar. Its passive performance is limited by the relatively small hull-mounted array and the host ship's own noise.
eu_Type_2150=Type 2150|The Type 2150 is a modern British bow-mounted active/passive hull sonar developed under the Sonar 2050 Technology Refresh programme. Fitted to modernized Royal Navy Type 23 anti-submarine warfare frigates, it replaces the older Type 2050 with improved digital processing, reliability, detection and classification performance. It complements the long-range Type 2087 variable-depth sonar by covering the local and medium-range underwater environment.

