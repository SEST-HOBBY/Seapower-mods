eu_APR-25=AN/APR-25|A radar detection and homing receiver installed on a multitude of US aircraft of the 1960s.
eu_APR-39v1=AN/APR-39(V)1|A radar detection and homing receiver.
eu_ALR-67v2=AN/ALR-67(V)2|A radar detection and homing receiver.

#--------- ELINT ----------
eu_AN/SLQ-32_RWR=AN/SLQ-32(V1) RWR|The AN/SLQ-32(v)1 electronic warfare suite detects enemy missile seekers and targeting radars, providing a missile warning capability.
eu_AN/SLQ-32_ESM=AN/SLQ-32(V) ESM|The AN/SLQ-32(v)2 and (v)3 electronic warfare suites retain the missile warning capability of (v)1 but adds the ability to detect surface-search and early warning radars.
eu_AN/SLQ-32=AN/SLQ-32(V3) ECM|The AN/SLQ-32(v)3 is the primary shipboard ECM in use by U.S. Navy ships. This system is used to jam enemy radars to reduce their tracking performance, and also controls chaff.
eu_Active_Intercept_Warning=Active Intercept Warning|An all-direction sonar receiver that can pick up active sonar pings from any angle, and allows submarines to detect active sonar pings from the baffles, where normal active/passive sonar cannot hear.
eu_AN/BLQ-10=AN/BLQ-10|The AN/BLQ-10 is a submarine electronic-warfare support suite. Its radar-intercept receivers provide automatic threat warning, signal analysis and emitter bearings during passive surveillance.
eu_AN/WLY-1=AN/WLY-1|The AN/WLY-1 is an acoustic intercept and warning system. It listens for active sonar transmissions and threatening acoustic signals to alert the submarine crew.

eu_els=ELS|The Texas Instruments Emitter Locating System is a modern ESM system used on the Tornado ECR in conjuction with the AGM-88 HARM to passively locate and combat a wide range of radiating threats.
eu_apecs_asp2000=APECS 2|An APECS electronic-support installation using ASP2000 signal processing. It detects and analyzes radar emissions for naval threat warning, direction finding and emitter identification.
eu_AN/SRS-1A=AN/SRS-1A CDF|The AN/SRS-1A Combat Direction Finding system supports passive radio surveillance and emitter location. This VHF/UHF receiving component represents its low-frequency direction-finding role.
eu_WBR-2000_ESM=WBR-2000 ESM|The SenSyTech/Argon ST WBR-2000 is a passive naval electronic-support system installed on early Freedom-class littoral combat ships. Its wideband receiver detects radar emissions from 2 to 18 GHz and provides threat warning, emitter identification and direction finding.
eu_AN/SLQ-32A(V)1_ESM=AN/SLQ-32A(V)1 ESM|The AN/SLQ-32A(V)1 is a high-band radar-warning receiver. It detects targeting radars and missile seekers to provide rapid warning of an approaching threat.
eu_AN/SLQ-32A(V)2_ESM=AN/SLQ-32A(V)2 ESM|The AN/SLQ-32A(V)2 is the passive electronic-support suite. It detects search radars as well as targeting radars and missile seekers, providing emitter bearings and threat identification.
eu_AN/SLQ-32A(V)3_ESM=AN/SLQ-32A(V)3 ESM|The AN/SLQ-32A(V)3 is the electronic-support receiver of the combined detection and jamming suite. It detects search radars as well as targeting radars and missile seekers, providing emitter bearings and threat identification.
eu_AN/SLQ-32A(V)4_ESM=AN/SLQ-32A(V)4 ESM|The AN/SLQ-32A(V)4 is the aircraft-carrier electronic-support receiver. It detects search radars as well as targeting radars and missile seekers, providing emitter bearings and threat identification.
eu_AN/SLQ-32A(V)5_ESM=AN/SLQ-32A(V)5 ESM|The AN/SLQ-32A(V)5 is the electronic-support receiver paired with the Sidekick jammer. It detects search radars as well as targeting radars and missile seekers, providing emitter bearings and threat identification.
eu_AN/SLQ-32A(V)2_SEWIP1_ESM=AN/SLQ-32A(V)2 ESM (SEWIP 1)|The AN/SLQ-32A(V)2 electronic-support receiver with SEWIP Block 1 improvements. Upgraded processing and Specific Emitter Identification improve threat recognition while retaining the legacy receiving equipment.
eu_AN/SLQ-32A(V)3_SEWIP1_ESM=AN/SLQ-32A(V)3 ESM (SEWIP 1)|The AN/SLQ-32A(V)3 electronic-support receiver with SEWIP Block 1 improvements. Upgraded processing and Specific Emitter Identification improve threat recognition while retaining the legacy receiving equipment.
eu_AN/SLQ-32A(V)4_SEWIP1_ESM=AN/SLQ-32A(V)4 ESM (SEWIP 1)|The AN/SLQ-32A(V)4 electronic-support receiver with SEWIP Block 1 improvements. Upgraded processing and Specific Emitter Identification improve threat recognition while retaining the legacy receiving equipment.
eu_AN/SLQ-32A(V)5_SEWIP1_ESM=AN/SLQ-32A(V)5 ESM (SEWIP 1)|The AN/SLQ-32A(V)5 electronic-support receiver with SEWIP Block 1 improvements. Upgraded processing and Specific Emitter Identification improve threat recognition while retaining the legacy receiving equipment.
eu_AN/SLQ-32A(V)6_ESM=AN/SLQ-32A(V)6 ESM|The AN/SLQ-32A(V)6 introduces the SEWIP Block 2 electronic-support receiver. Improved sensitivity, direction finding and emitter identification are combined with integrated High Gain High Sensitivity and Specific Emitter Identification functions.
eu_AN/SLQ-32B(V)6_ESM=AN/SLQ-32B(V)6 ESM|The AN/SLQ-32B(V)6 is the aircraft-carrier installation of SEWIP Block 2 electronic support. Its receiving and processing installation provides radar warning, direction finding and detailed emitter identification for carrier operations.
eu_AN/SLQ-32C(V)6_ESM=AN/SLQ-32C(V)6 ESM (SEWIP Lite)|The AN/SLQ-32C(V)6 SEWIP Lite is a compact electronic-support system for smaller ships. It brings Block 2 radar detection, analysis and threat warning to installations with tighter space and weight limits. This passive receiver does not include an electronic-attack transmitter.
eu_AN/SLQ-32A(V)7_ESM=AN/SLQ-32A(V)7 ESM|The electronic-support receiver within the AN/SLQ-32A(V)7 SEWIP Block 3 suite. It retains the Block 2 receiving functions, including High Gain High Sensitivity and Specific Emitter Identification, alongside the separate Block 3 electronic-attack equipment.
eu_CS-3701=Condor CS-3701|The Condor CS-3701 is a naval radar electronic-support system using interferometric direction finding. It intercepts radar signals to provide threat warning, emitter identification and accurate bearings.
eu_ES_3701_ESM=ES-3701 Tactical Radar ESM|The EDO/L3Harris ES-3701 is a wideband shipboard electronic-support system that passively detects, identifies and direction-finds radar emissions. It provides threat warning, emitter classification and electronic-intelligence data to the ship's combat-management system.

#-------------------------------------- ECM ---------------------------------------
eu_ALQ-73=AN/ALQ-73|The ALQ-73 is an airborne radar self-protection jammer associated with the F-104 and the ELT 70/73 equipment family. It counters radar-guided threats to its carrying aircraft.
eu_AN/ALQ-164=AN/ALQ-164|The AN/ALQ-164 is a defensive radar-countermeasure pod used by the AV-8B. It combines pulse-radar and continuous-wave countermeasures to protect its carrying aircraft from radar-guided threats.
eu_apecs2=APECS II|APECS II is a naval electronic-warfare suite combining radar intercept equipment with active countermeasure transmitters. The jammer component provides ship self-protection against radar-directed threats; AR-700 identifies the receiver side of the installation.
eu_AN/SLQ-32A(V)3_ECM=AN/SLQ-32A(V)3 ECM|The AN/SLQ-32A(V)3 electronic-attack equipment provides radar and missile-seeker countermeasures. It combines noise and deception techniques for active radar jamming and ship self-protection.
eu_AN/SLQ-32A(V)4_ECM=AN/SLQ-32A(V)4 ECM|The AN/SLQ-32A(V)4 is the aircraft-carrier electronic-attack installation. Its expanded equipment arrangement provides radar jamming and missile-seeker countermeasures for carrier self-protection.
eu_AN/SLQ-32A(V)5_ECM=AN/SLQ-32A(V)5 Sidekick ECM|The AN/SLQ-32A(V)5 combines the passive receiver with the compact Sidekick jammer. This countermeasure component provides defensive deception against incoming radar-guided missiles.
eu_AN/SLQ-32A(V)7_ECM=AN/SLQ-32A(V)7 ECM|The SEWIP Block 3 electronic-attack component of AN/SLQ-32A(V)7. Active electronically scanned arrays direct jamming energy against hostile radars and missile seekers, providing electronic attack and ship self-protection.
eu_AN/SLQ-59_ECM=AN/SLQ-59 TEWM|The AN/SLQ-59 is a Transportable Electronic Warfare Module associated with the Block 3T effort. It supplements the ship's electronic-warfare suite with defensive countermeasures against selected anti-ship missile threats.
eu_AN/SLQ-62_ECM=AN/SLQ-62 TEWM|The AN/SLQ-62 is a Transportable Electronic Warfare Module fielded through the Speed to Fleet effort. It adds threat-specific defensive countermeasures to the ship's existing electronic-warfare equipment.
AN/DPW-23=AN/DPW-23|AN/DPW-23 identifies terrain-reference navigation equipment associated with the Tomahawk missile. It is not a radar countermeasure transmitter and provides no radar jamming.
eu_AN/DPW-69=AN/DPW-69|AN/DPW-69 is retained as a legacy equipment reference. No radar-countermeasure capability is assigned to this entry.
eu_2T_Datalink=2T Missile Data Link|A naval missile data link for transmitting midcourse guidance updates. It connects the ship's fire-control system with compatible missiles during an engagement.

#-------------------------------------Datalink -------------------------------------
eu_UYK-43=AN/UYK-43|The AN/UYK-43 was a standard US Navy 32-bit combat direction computer used for sensor processing, tracking, and weapon control in a wide range of surface combatants and support systems. It provided a major improvement in processing power, reliability, and maintainability over earlier naval computers and became a core element of many Cold War and post-Cold War combat systems. In service it was commonly used as part of larger distributed shipboard combat system architectures rather than as a standalone unit.
eu_UYK-44=AN/UYK-44|The AN/UYK-44 was a compact 16-bit naval computer developed for distributed processing, data handling, and control tasks within US Navy combat and platform systems. Smaller and more flexible than larger combat system mainframes, it was widely used for subsystem control, sensor interfaces, display processing, and embedded naval applications. Its broad adoption made it one of the most common computing elements in late Cold War US naval electronics.
eu_UYK-44B=AN/UYK-44B|The AN/UYK-44B was an improved version of the AN/UYK-44, offering greater performance, updated electronics, and better support for later combat system and sensor integration requirements. It retained the compact and modular character of the original design while improving reliability and long-term service usefulness in modernised naval systems. In practice it served as a refined evolution of the UYK-44 for distributed processing and subsystem control roles.

eu_AEGIS_BL5=AEGIS BL5|The missile data-link and fire-control component of Aegis Baseline 5. It maintains engagement information and sends guidance updates to compatible missiles during flight.
eu_AEGIS_BL9=AEGIS BL9|The missile data-link and fire-control component of Aegis Baseline 9. It maintains engagement information and sends guidance updates to compatible missiles during flight.
eu_AEGIS_BL10=AEGIS BL10|The missile data-link and fire-control component of Aegis Baseline 10. It maintains engagement information and sends guidance updates to compatible missiles during flight.
eu_JUWL=JUWL|The Joint Universal Weapon Link provides communications between the ship and compatible guided weapons. It supports transmission of target and guidance updates during missile flight.


