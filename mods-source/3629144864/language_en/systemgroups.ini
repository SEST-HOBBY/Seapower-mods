eu_SeaGiraffe_4A=Sea Giraffe 4A|An S-band AESA 3D multi-function radar designed for area surveillance and weapon cueing. Electronic beam steering enables high track capacity and rapid refresh in complex air pictures. S-band offers better weather and clutter penetration than X-band, aiding long-range surveillance. The rotating array with electronic beams combines mechanical coverage with agile waveform control and ECCM. The radar feeds high-quality tracks to the combat system for air and surface engagements. It does not provide continuous-wave illumination.

eu_SeaGiraffe_4A_NR=Sea Giraffe 4A|
eu_SeaGiraffe_1X=Sea Giraffe 1X|A compact X-band AESA 3D multi-mode radar for simultaneous air and surface surveillance. Electronic beam steering provides fast updates and good performance against sea-skimming and small cross-section targets. The radar supplies stabilized 3D tracks to the combat system for cueing of weapons and decoys. Its X-band operation yields fine angular resolution in the littoral environment. The antenna is light and suited for smaller masts and patrol craft. It is not a dedicated fire-control illuminator and does not replace a director.
