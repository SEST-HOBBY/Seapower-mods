eu_Mk20_EOSS=Mk20_EOSS|The Mk 20 Electro-Optical Sensor System provides stabilized visual and thermal observation for naval gunfire control. It supports passive target identification and tracking.

#-------------------------------------- Radar ---------------------------------------
eu_OPS-20=J/OPS-20|Early 1990s Technology. Role:	Radar, Surface Search & Navigation. Abilities:Surface Search, Range Information, Speed Information, Heading Info.
eu_OPS-48=J/OPS-48|The J/OPS-48 is a Japanese surface-search and surveillance radar fitted to the JMSDF Asahi-class destroyers. It complements the ship's J/OPY-1 multifunction radar by providing dedicated surface-search coverage for navigation, maritime surveillance and target detection.
eu_OPY-1=J/OPY-1|The J/OPY-1 is a Japanese multifunction AESA radar fitted to the JMSDF Asahi-class destroyers. Developed from the FCS-3/OPS-50 radar family and using gallium-nitride technology, it provides three-dimensional air and surface search, target tracking and fire-control support for the ship's combat system.

#-------------------------------------- ESM ---------------------------------------
eu_NOLQ-2_ECM=NOLQ-2 ECM|The NOLQ-2 is a Japanese naval radar-intercept and jamming system. Its active countermeasure component protects destroyers by interfering with hostile radar tracking and radar-guided threats.
eu_NOLQ-2_ESM=J/NOLQ-2 ESM|Early 1990s Technology. Role: ELINT w/ OTH Targeting. Abilities: Air Search, Surface Search, OTH (Surface Wave), Specific Emitter ID.
eu_NOLQ-3D_ECM=NOLQ-3D ECM|The NOLQ-3D is a later Japanese naval radar-intercept and jamming system. Its countermeasure component works with the electronic-support receivers to disrupt threat radars and radar-guided weapons.
eu_NOLQ-3D_ESM=J/NOLQ-3D_ESM|The J/NOLQ-3D ESM is the passive detection and emitter-identification component of the Japanese NOLQ-3D electronic warfare suite fitted to modern JMSDF destroyers. It detects radar and missile-seeker emissions, classifies threat emitters and supplies warning and targeting-quality bearing information to the ship's combat system.

#-------------------------------------- Towed Array ---------------------------------------
eu_OQR-4=J/OQR-4 MFTA|The J/OQR-4 VDS is a Japanese variable-depth low-frequency sonar system fitted to the Asahi-class ASW destroyers. It is modelled as the active variable-depth component of the OQR-4 sonar suite, providing long-range active search and improved below-layer detection against submarines in open-ocean ASW conditions.
eu_OQR-5=J/OQR-5|The J/OQR-5 is a modern Japanese passive towed array sonar manufactured by Oki Electric. It provides long-range broadband and narrowband detection, classification and tracking of submarines while operating away from the host ship's machinery noise. It forms the passive TASS component of the Mogami-class VDS-TASS suite. Its continued use aboard the New FFM is probable but has not been explicitly confirmed in public platform documentation.
eu_OQQ-25=J/OQQ-25|The J/OQQ-25 is the active/passive variable-depth component of the Mogami-class frigate's anti-submarine sonar suite. Lowering the acoustic body beneath unfavorable surface layers improves detection conditions in both littoral and open-water environments. It operates together with the OQR-5 passive towed array.
eu_OQQ-27=J/OQQ-27|The J/OQQ-27 is a new Japanese surface-ship sonar system procured alongside the New FFM programme. It is the class's improved active/passive variable-depth sonar, offering better resolution and processing than the Mogami-class OQQ-25 while remaining below the largest long-range low-frequency VDS systems.

#-------------------------------------- Hull Sonar ---------------------------------------
eu_OQQ-11=J/OQQ-11|The J/OQQ-11 is a Hitachi mine hunting sonar fitted to the Mogami-class frigate. Its high-frequency hull-mounted acoustic sensor searches for underwater mines and other small objects ahead of and beneath the ship. It is a short-range, high-resolution active-only sonar and is not used for passive anti-submarine detection.
eu_OQQ-11-2=J/OQQ-11-2|The J/OQQ-11-2 is an improved Japanese mine-warfare sonar system developed from the OQQ-11 family. It is the New FFM's high-resolution multifunction sonar for mine and small-object detection.
eu_OQQ-24=J/OQQ-24|The J/OQQ-24 is a Japanese hull-mounted sonar fitted to the Asahi-class ASW destroyers. It combines active and passive search functions for local submarine detection, target tracking and torpedo-attack support, while the ship's OQR-4 VDS and towed-array systems provide longer-range ASW coverage.


#======================================== Germany ========================================
#-------------------------------------- Visual ---------------------------------------
eu_Mirador_Mk1=Thales MIRADOR Mk 1|An electro-optical fire-control director with day TV, thermal imager, and laser rangefinder. It provides passive detection, tracking, and gunfire control for the main gun in emission-controlled conditions. Tracks can be slaved from surveillance radars for terminal aim. The director also supports identification and battle damage assessment. It is not a CW illuminator for semi-active missiles.
eu_Mirador_Mk2=Thales MIRADOR Mk 2|An upgraded EO director with improved sensors, stabilization, and automatic tracking. Enhanced thermal imaging and processing extend night and haze performance. It supports precise gunfire control and passive tracking with faster lock-on and handover. The director integrates with the combat system for automated cueing and engagement support. It remains a passive electro-optical system without CW illumination.
eu_MSP600=MSP600|A stabilized electro-optical director with day TV, thermal imager, and laser rangefinder. It enables passive detection and tracking when radar emissions are undesirable. The director provides ranges for light weapons such as MLG 27 and supports surveillance tasks. Video and track data can be distributed to the combat system for cueing. Stabilization allows operation in moderate sea states. It is not a radar and cannot illuminate targets.
eu_GatekeeeperMk2=Gatekeeper Mk2|A passive electro-optical/infrared surveillance and tracking system optimized for close-range threats. It provides wide-area panoramic coverage with automatic detection and track initiation for small surface contacts and low-signature targets. Gatekeeper Mk2 complements radar by delivering visual/IR confirmation, precise bearing/elevation, and classification support without emitting. It is especially effective in cluttered littoral environments and during EMCON operations.
eu_EO_FCS_SeaSnake=EO FCS SeaSnake|The electro-optical sensor package of the SeaSnake weapon station. Thermal imaging helps the operator acquire and identify small surface and airborne targets.
eu_EO_FCS_MLG27=EO FCS MLG27|The electro-optical sight of the MLG 27 naval gun. It provides day and night observation for finding and tracking nearby threats.
eu_SIMONE=SIMONE|Ship Infrared Monitoring, Observation and Navigation Equipment. A distributed passive EO/IR visual-surveillance system using multiple infrared camera modules around the ship to provide continuous close-range coverage for navigation, watchkeeping and asymmetric-threat detection. Optimised for early visual cueing and classification of small boats, periscopes, swimmers and other low-RCS contacts without emitting radar energy.

#-------------------------------------- Radar ---------------------------------------
#---Air/Air&Surface----
eu_TRS-3D_16=TRS-3D/16|A C-band 3D surveillance radar for air and surface search on early K130 units. The rotating array delivers medium-range coverage with good performance against low flyers and small surface targets. Track updates are suitable for cueing weapons and decoys via the combat system. Built-in ECCM and sea clutter processing support operations in congested littorals. It is not a fire-control illuminator and relies on directors for terminal guidance.
eu_TRS-3D_20=TRS-3D|TRS-3D is a three-dimensional naval radar for air and surface surveillance. Electronic elevation scanning and mechanical rotation provide target positions for the combat system.
eu_TRS-3D_32=TRS-3D|TRS-3D is a three-dimensional naval radar for air and surface surveillance. Electronic elevation scanning and mechanical rotation provide target positions for the combat system.
eu_TRS-4D_Rot=TRS-4D|The TRS-4D LR is a long-range S-band AESA radar developed by HENSOLDT for advanced air and surface surveillance. It provides fast, high-precision 3D detection and tracking of numerous targets for naval and land-based defence systems.
eu_TRS-4D_LR_Rot=TRS-4D LR|The TRS-4D LR is a long-range S-band AESA radar developed by HENSOLDT for advanced air and surface surveillance. It provides fast, high-precision 3D detection and tracking of numerous targets for naval and land-based defence systems.
eu_TRS-4D_NR=TRS-4D/NR|A fixed-panel AESA multi-function radar providing continuous 360° coverage without mechanical rotation. It supports simultaneous air and surface search, track-while-scan, and rapid update rates for dense threat environments. The radar can cue weapons and fire-control sensors, enabling fast reaction against sea-skimming missiles, aircraft, and small surface targets. It is optimized for high track quality and resilience in heavy clutter and ECM.
eu_SPEXER_2000_3D_MkIII_Naval=SPEXER 2000 MkIII|Hensoldt SPEXER 2000 3D MkIII Naval is a compact X-band AESA surveillance radar for close-range surface and low-altitude air defence. It is optimized for small and low-signature targets such as UAVs, USVs, fast boats and sea-skimming threats, complementing the ship's main radar and SPQ-9B in the force-protection layer.

eu_LW08_SATIR=LW08|LW08 is a long-range 2D air-search radar operating in NATO D-band (IEEE L-band). It provides bearing and range but not height, so it is used for early warning and cueing rather than fire control. The rotating slotted array offers wide-area coverage and good detection of high-flying aircraft and raid-size targets. It is commonly integrated with IFF to support air picture compilation in the combat management system. In a task group it shares plots for composite tracks and cueing of 3D radars. It is not a height finder and does not illuminate targets.
eu_SMART-S=SMART-S|A rotating 3D surveillance radar operating in S-band for medium-range air and surface search. It provides range, bearing, and altitude and supports weapon cueing through the combat system. The radar is optimized for weather penetration and manages clutter over sea states common to maritime operations. Track updates are sufficient to handle complex air raids and surface traffic. It complements long-range 2D sets and terminal fire control sensors. It is not a continuous-wave illuminator.
eu_SMART-S_Mk2=SMART-S|A rotating 3D surveillance radar operating in S-band for medium-range air and surface search. It provides range, bearing, and altitude and supports weapon cueing through the combat system. The radar is optimized for weather penetration and manages clutter over sea states common to maritime operations. Track updates are sufficient to handle complex air raids and surface traffic. It complements long-range 2D sets and terminal fire control sensors. It is not a continuous-wave illuminator.
eu_SMART-L=SMART-L|SMART-L (Signaal Multibeam Acquisition Radar for Tracking, L band) is a long-range naval search radar introduced in 2002 by Thales Nederland, formerly Hollandse Signaalapparaten (Signaal).
eu_SMART-L_S1850M=SMART-L S1850M|SMART-L (Signaal Multibeam Acquisition Radar for Tracking, L band) is a long-range naval search radar introduced in 2002 by Thales Nederland, formerly Hollandse Signaalapparaten (Signaal).

#---Surface only----
eu_NautoScanNX_S=NautoScan NX|The S-band NautoScan NX radar supports navigation and maritime surveillance. It provides bearing and range measurements for contacts near the ship, including in darkness and poor visibility.
eu_NautoScanNX_X_25kW_6ft=NautoScan NX|The X-band NautoScan NX radar supports navigation and maritime surveillance. It provides bearing and range measurements for contacts near the ship, including in darkness and poor visibility.
eu_NautoScanNX_X_25kW_8ft=NautoScan NX|The X-band NautoScan NX radar supports navigation and maritime surveillance. It provides bearing and range measurements for contacts near the ship, including in darkness and poor visibility.
eu_Atlas_9600M_ARPA_X=Atlas 9600-M ARPA|STN Atlas 9600-M ARPA is an older I/J-band naval navigation radar used on the German F124 Sachsen-class. It provides local surface search, collision avoidance and automatic radar plotting for bridge navigation, but is not a combat air-search or fire-control radar.

#-------------------------------------- Sonar ---------------------------------------
#---------- Surface -----------
eu_DSQS_23BZ=DSQS-23BZ|The DSQS-23BZ is a German STN ATLAS bow-mounted active/passive hull sonar fitted to the Brandenburg-class F123 frigates. It provides medium-frequency submarine search, local tracking and torpedo-attack support, forming the ship's primary organic underwater sensor before the addition of later towed or variable-depth systems. It is a capable 1990s hull sonar, below later systems such as DSQS-24C, ASO 713/723 or M670.
eu_DSQS-21BZ-M=DSQS-23BZ-M|The DSQS-21BZ-M is an ATLAS Elektronik bow-mounted active/passive hull sonar fitted to South Korean KDX-III destroyers. It belongs to the DSQS-21 / ASO 83-86 medium-frequency sonar family and provides local submarine search, tracking and attack support. It is a modernized medium-frequency hull sonar with about 30 km / 16 nm public maximum range, below larger blue-water sonars such as SQS-53C but clearly stronger than older light hull sonars.
eu_ASO_713=ASO 713|An Atlas Elektronik 4th-generation medium-frequency hull-mounted sonar for anti-submarine warfare. It supports active and passive search, classification, and tracking, optimized for demanding littoral conditions with high reverberation and shipping noise. The sonar contributes to the ship’s local underwater picture and can be fused with towed arrays and airborne sonars for prosecution and weapon cueing. Performance depends on ocean environment and platform radiated noise.
eu_ASO_723=ASO 723|An Atlas Elektronik 4th-generation medium-frequency hull-mounted sonar positioned as a higher-capability variant within the ASO family. It supports active and passive search, classification, and tracking with improved performance in complex acoustic environments, including shallow water and high-clutter scenarios. The system integrates into the ship’s ASW suite to provide continuous close-to-medium range coverage and cue shipborne and airborne ASW assets. Performance depends on ocean environment and platform radiated noise.
eu_dsqs-24b=DSQS-24B|The STN ATLAS DSQS-24B is the bow-mounted active/passive sonar of the German Sachsen class and is closely associated with the ATLAS ASO 95 designation. Its large 1.88 m cylindrical array forms multiple electronically steered and stabilized beams for submarine search, tracking and attack support. The sonar operates over 6-9 kHz in active mode and 2-11 kHz in passive mode. Exact real-world detection ranges remain classified.
eu_ASO_95=ASO 95|ASO 95 is the ATLAS product designation associated with the DSQS-24B sonar fitted to the German Sachsen class. Its 1.88 m cylindrical array provides greater aperture and directivity than the more compact ASO 94 family and supports active and passive anti-submarine search, classification and tracking. This mod entry is acoustically identical to DSQS-24B and is provided as an alternate designation.
eu_dsqs-24c=DSQS-24C|The STN ATLAS DSQS-24C is a medium-frequency active/passive hull-mounted search and attack sonar fitted to the Royal Netherlands Navy's De Zeven Provincien class. It was developed from the DSQS-24B generation with increased digital processing capability but uses a more compact array installation. It provides submarine detection, classification and tracking in difficult littoral acoustic conditions. Exact array and detection-performance details are not publicly available.
eu_ASO_94=ASO 94|ASO 94 is an ATLAS medium-frequency active/passive hull-sonar family for frigates and corvettes. It provides submarine search, classification and tracking from a compact bow or keel-mounted array and represents the smaller-aperture branch of the same general ATLAS generation as the DSQS-24 series. Customer installations and suffix variants differ in hardware and processing, so this generic entry represents a full-size baseline ASO 94 installation.
eu_ASO_94-01=ASO 94-01|The ATLAS ASO 94-01 is the medium-frequency active/passive hull sonar fitted to the Danish Absalon and Iver Huitfeldt classes. Public sources describe active operation from 6 to 9 kHz and passive reception from approximately 2 to 11 kHz, with simultaneous active and passive processing. The compact array provides submarine search and attack support while also supporting passive classification and self-protection functions.
eu_ASO_94-FS=ASO 94-FS|ASO94-FS is the official Danish service designation used for the ATLAS ASO 94 sonar system maintained by the Danish Defence Acquisition and Logistics Organisation. Public procurement material confirms the designation but does not establish a separate acoustic configuration from the Danish ASO 94 installation. It is therefore modelled identically to ASO 94-01 in this mod.
eu_ASO_94-2=ASO 94-2|The ATLAS ASO 94-2 is an active/passive hull-mounted sonar operated by the Bangladesh Navy. Public documentation confirms passive classification functions including LOFAR and DEMON processing, while technical academic material describes a listening channel extending from very low frequencies up to 5 kHz. Its exact active carrier frequency, array dimensions and detection ranges are not public, so those parameters are conservatively estimated in this mod.
eu_ASO_94-41=ASO 94-41|The ATLAS ASO 94-41 is a compact hull-mounted active search and attack sonar fitted to the Malaysian Laksamana-class missile corvettes. It provides organic anti-submarine detection and attack support from a much smaller platform than the frigate-sized ASO 94 installations. Detailed acoustic specifications are not publicly available; its reduced range, gain and resolution in this mod are therefore based on the compact installation rather than published performance figures.
eu_TRAPS=Elbit TRAPS|Elbit TRAPS is a compact active/passive variable-depth sonar developed by GeoSpectrum Technologies and marketed by Elbit Systems. It combines a reelable low-frequency active source with a directional passive receive array and is designed for frigates, corvettes and patrol vessels with limited space. Public data claims detection beyond the second convergence zone, giving it a maximum favourable-condition range of about 150 km / 81 nm. The system can use up to about 650 m of tow cable and current data lists an operating depth of up to 300 m.
eu_M670=Elbit M670|The M670 HMS is a modern low-/medium-frequency hull-mounted sonar by GeoSpectrum Technologies / Elbit Systems. It provides 360-degree active and passive detection, classification and tracking of submarines, torpedoes and mine-like objects. With performance described as beyond the first convergence zone, a realistic maximum active range is about 65 km / 35 nm in favourable acoustic conditions. It is best represented as a compact modern hull sonar rather than a full towed-array system.

#---- Towed/VDS -----
eu_TAS-3=TAS-3|The TAS-3 is the passive low-frequency towed array sonar of the Type 212A submarine. Deployed from the sail area, it provides long-range passive detection and classification of ships and submarines while keeping the array away from the boat's own machinery and flow noise.
eu_CSU100_Bow=CSU 100 Bow Sonar|The bow-sonar component of the CSU 100 submarine sonar suite. It combines active search and passive listening for underwater surveillance and target acquisition.
eu_ACTAS=ACTAS|ACTAS is an active and passive low-frequency towed sonar from ATLAS ELEKTRONIK. Variable-depth operation allows the sonar to search beneath acoustic layers that can limit hull-sonar coverage.

#--------- Submarines ----------
eu_DSQS-21DG=DSQS-21DG|The DSQS-21DG is the medium-frequency bow sonar component of the ATLAS CSU 90 / DBQS-40FTC submarine sonar suite fitted to Type 212A submarines. It provides active and passive forward-sector search, contact tracking and attack support, while the flank arrays and towed array provide wider passive coverage.
eu_FAS-3-1=FAS 3-1|The FAS-3-1 is the passive low- and medium-frequency flank array sonar of the Type 212A submarine's CSU 90 / DBQS-40FTC sonar suite. Mounted along the hull, it provides broad passive bearing coverage and acoustic classification support without exposing the submarine through active transmissions.
eu_FAS-3-1_R=FAS 3-1|The FAS-3-1 is the passive low- and medium-frequency flank array sonar of the Type 212A submarine's CSU 90 / DBQS-40FTC sonar suite. Mounted along the hull, it provides broad passive bearing coverage and acoustic classification support without exposing the submarine through active transmissions.
eu_FAS-3-1_L=FAS 3-1|The FAS-3-1 is the passive low- and medium-frequency flank array sonar of the Type 212A submarine's CSU 90 / DBQS-40FTC sonar suite. Mounted along the hull, it provides broad passive bearing coverage and acoustic classification support without exposing the submarine through active transmissions.
eu_PRS_3_15=PRS 3-15|PRS 3-15 is a passive ranging sonar used on Type 212A submarines. Separated receiving arrays help estimate the position of underwater contacts without active transmissions.
eu_EFAS=EFAS|The Expanded Flank Array Sonar, is an improved passive flank array sonar associated with later Type 212A upgrades and ISUS-equipped boats. It replaces or improves upon the earlier FAS-3 flank array with greater aperture, improved processing and longer passive detection ranges.
eu_EFAS_R=EFAS Starboard|The starboard extended flank-array sonar. Its long hull-mounted receiving aperture supports passive detection and bearing measurement of underwater contacts.
eu_EFAS_L=EFAS Port|The port extended flank-array sonar. Its long hull-mounted receiving aperture supports passive detection and bearing measurement of underwater contacts.
eu_SA9510S_MkII=SA9510S Mk. II|The SA9510S Mk. II is a high-frequency sonar for detecting nearby underwater obstacles and mines. It supports safe submarine navigation at short range.
eu_MOA-3070=MOA-3070|The MOA 3070 is the mine and obstacle avoidance sonar of the Type 212A submarine's CSU 90 / DBQS-40FTC sonar suite. It is used for short-range high-resolution detection of mines, obstacles and close underwater hazards, especially in shallow or confined waters.It is a short-range active safety and mine-avoidance sonar rather than a long-range ASW sensor.
eu_AN_5039_A1=AN5039A1|The AN5039A1 is the active sonar intercept component of the Type 212A submarine's CSU 90 / DBQS-40FTC sonar suite. It passively detects, warns and localizes hostile active sonar transmissions, including ship, submarine, helicopter dipping sonar and torpedo seeker emissions. It is an active-intercept sensor, not as a general-purpose search sonar.

#-------------------------------------- ESM ---------------------------------------
#--------- ELINT ----------
eu_FL-1800U_ESM=FL-1800U|FL-1800U is a submarine electronic-support and radar-warning system. It intercepts radar signals through the mast installation and supplies bearings and threat information without active radar transmissions.
eu_FL-1800S_ESM=FL-1800S ESM|A legacy electronic support suite that passively intercepts radar emissions for situational awareness. It measures bearing and characterizes emitters to support threat warning and basic identification. The system contributes to bearings-only localization and complements the ship radar picture. It has no transmission function and therefore does not reveal ownship by itself. Data is typically displayed on the EW console and can be forwarded to the CMS. Performance depends on emitter strength, geometry, and environment.
eu_FL_1800_S_II_ESM=FL-1800S  II|The FL-1800S II is a German naval electronic warfare system that detects and jams radar signals across 0.5–18 GHz. It provides 360° coverage, precise threat tracking, and targeted jamming to protect ships from electronic and radar-guided threats.
eu_UL5000K_ESM=UL5000K ESM|A shipboard electronic support suite used on K130 to passively intercept and classify radar emitters. It provides bearing, parameters, and threat alerts to the combat system for situational awareness. Bearings over time can assist in localization and cue soft-kill responses. The system is optimized for littoral operations with high clutter and reflections. As a passive sensor it preserves emissions control.
eu_KORA-18_ESM=KORA-18 ESM|A mid-generation digital ESM covering VHF through Ku bands for passive intercept. It provides bearing, signal parameters, and basic classification of radar and some comms emitters. Bearings can be used for threat warning and for bearings-only localization when combined over time. The system feeds the combat system with emitter tracks to enrich the tactical picture. It is particularly valuable in coastal clutter where radar line-of-sight is limited. As a passive sensor, it does not radiate and preserves emissions control.
eu_KORA-40_ESM=KORA-40|A modern digital ESM with wideband receivers and precise direction finding for radar intercept. It classifies emitters via a threat library and provides cues to the combat system and soft-kill suite. The system supports bearings-only target motion analysis to refine contact positions over time. It operates passively and is well suited to contested littoral environments. Data can be shared with allied units to build a common electronic order of battle. It does not provide jamming by itself.

#-------------------------------------- ECM ---------------------------------------
eu_C303S_active_jammer=C303/S|The C303/S is a submarine anti-torpedo countermeasure system using acoustic noise generators and mobile target emulators. It does not provide radio-frequency radar jamming.
eu_FL-1800S_ECM=FL 1800 S|The FL 1800 S is a German naval electronic-warfare system. Its countermeasure transmitters provide noise and deception jamming against threat radars and radar-guided weapons.
eu_FL_1800_S_II_ECM=FL 1800 S II|The FL 1800 S II is an improved German naval electronic-warfare system. Its active countermeasure component protects the ship through radar noise and deception jamming.
eu_UL5000K_ECM=UL 5000 K|The UL 5000 K electronic-warfare suite equips German K130 corvettes. Its active radar-countermeasure component uses jamming and deception alongside the suite’s passive intercept receivers.
eu_VIRGILIUS_R-ECM=VIRGILIUS R-ECM|VIRGILIUS is a modular digital electronic-warfare family from ELT Group. Its radar-countermeasure component combines programmable deception techniques with coordinated receiving and transmitting equipment to counter hostile radars and radar-guided weapons.


#======================================== Italy ========================================
#-------------------------------------- Visual ---------------------------------------
eu_3JB10=3JB10|The 3JB10 is an anti-air TV targeting system.
eu_leonardo_dss=Leonardo DSS|Leonardo DSS is a distributed infrared search and track system for shipboard surveillance. Multiple sensors provide panoramic observation and passive warning of approaching air and surface threats.

#-------------------------------------- Radar ---------------------------------------
#---Air/Air&Surface----
eu_Argos_5000D=Argos 5000D|The Argos 5000 is a long-range air surveillance radar and one of the earliest domestic radars produced in Italy. Due to its enormous size and high operating power requirement the sole example of this radar was mounted on the converted guided missile cruiser Giuseppe Garibaldi. 
eu_SPS-768=MM/SPS-768|The MM/SPS-768 is an Italian long-range air search radar with modern solid-state electronics and fully digital processing capability. It was first introduced in the late 1960s and is in use on the largest surface combattants of the Italian navy.
eu_SPS-774=MM/SPS-774|The MM/SPS-774 is an Italian medium-range combined air and surface search radar designed for use on frigate- and corvette-sized ships. It is a fully digital system with modern solid-state electronics which was first introduced in the mid 1970s.
eu_RAN-30x=RAN-30X|The RAN-30X (designated MM/SPS-732 in Italian Navy service) is a medium-sized radar intended for medium range surface search and low-level airspace surveillance.
eu_EMPAR=EMPAR|EMPAR is a rotating multifunction phased-array radar for naval air and surface surveillance. It supplies engagement tracks to the combat system and supports the Aster missile system.
eu_EMPAR_2=EMPAR (Guidance channel)|The missile-guidance channel associated with the EMPAR radar. It supplies command updates to compatible missiles while the main radar maintains the target track.
eu_MFRA=MFRA|The MFRA (Multi Functional Radar Active) is an evolved version of the EMPAR radar which utilizes a new active phased array antenna with active TRM (Transmit and Receive Module) modules replacing the phase shifters present in the original passive EMPAR antenna.
eu_MFRA_guidance=MFRA (Guidance channel)|The missile-guidance channel associated with the MFRA radar. It supplies command updates to compatible missiles while the main radar maintains the target track.
eu_KRONOS_c=KRONOS Quad|KRONOS Quad is a multifunction naval radar using fixed C-band active arrays. It provides air and surface surveillance and target tracks for the ship's combat system.
eu_KRONOS_x=KRONOS StarFire|KRONOS StarFire is a fixed-array X-band multifunction radar. It combines detailed surface surveillance with air-target tracking and support for missile and gun engagements.
eu_KRONOS_guidance=KRONOS (Guidance channel)|The missile-guidance channel associated with the KRONOS radar. It supplies command updates to compatible missiles while the main radar maintains the target track.
eu_KRONOS_l=KRONOS Power Shield|KRONOS Power Shield is an L-band active-array radar for long-range air surveillance. Its early-warning role includes detecting and tracking high-altitude and ballistic threats.
eu_KRONOS_s=KRONOS S-Band|An S-band KRONOS radar installation for long-range air surveillance. It supplies early-warning and tracking information for the ship's air-defence system.

#---Surface only----
eu_CFL-3_C25=CFL-3 C25|The CFL-3 C25 is an Italian navigation radar and one of the earliest domestic radars produced in Italy by the electronics company 'Selenia' in the 1950s, paving the way for the company to become one of the most important players in the Italian radar technology sector. 
eu_SPQ-2=MM/SPQ-2|The MM/SPQ-2 is one of the earliest domestic Italian surface search radars mounted on a majority of the Marina Militares surface combattants throughout the 1950s and 1960s, often replacing older systems previously provided by the United States.
eu_SPQ-701=MM/SPQ-701|The MM/SPQ-701 is an Italian navigation radar.
eu_SPS-702=MM/SPS-702|The MM/SPS-702 is an Italian combined surface and low-altitude air search radar with an integrated IFF system. It is the successor of the MM/SPQ-2 and has been mounted on the majority of Italian navy surface combattants throughout the 1970s and 1980s.
eu_SPN-703=MM/SPN-703|The MM/SPN-703 is an Italian navigation radar.
eu_SPN-748=MM/SPN-748|The MM/SPN-748 is an Italian navigation radar used on a large number of Marina Militare surface vessels since the 1980s.
eu_BPS-704=MM/BPS-704|The MM/BPS-704 is an Italian surface search radar designed specifically for the use on submarines.
eu_SPN-730=MM/SPN-730|The MM/SPN-730 is a naval navigation radar. It supplies nearby surface-contact information for manoeuvring and safe passage.
eu_SPN-753=MM/SPN-753|The MM/SPN-753 is a naval surface search radar. It supports navigation and the detection and tracking of maritime contacts.
eu_gemini-db=GEMINI-DB|GEMINI-DB is a naval navigation and surface surveillance radar system. It provides detailed contact information for manoeuvring and monitoring the area around the ship.

#---Fire Control----
eu_MLT-4=MLT-4|The MLT-4 is an Italian license-produced version of the US-made Mk. 39 fire control radar used on the Mk. 57 heavy anit-air gun director. Experience gained from manufacturing this radar would later allow Italy to develop its renowned 'Orion' series fire control radars in the 1960s.
eu_RTN-1A=RTN-1A|The RTN-1A is the earliest member of the Italian 'Orion' fire control radar family. On board the guided missile cruiser Giuseppe Garibaldi it works in conjunction with the CLT-135/76-1A fire control computer to obtain a targeting solution for the OTO 135mm guns.
eu_Sagittario_200=Sagittario 200|The Sagittario 200 is an early Italian fire control radar installed on the guided missile cruiser Giuseppe Garibaldi and works in conjuction with the CLT-76-1A fire control computer to obtain a targeting solution for the OTO 76mm guns.
eu_RTN-10X=RTN-10X|The RTN-10X 'Orion' is an Italian fire control radar used to guide several models of cannons such as the OTO-Melara 76.2mm and 127mm. 
eu_RTN-20X=RTN-20X|The RTN-20X 'Orion' is an Italian fire control radar developed from the RTN-10X radar. It is used primarily to guide the DARDO close-in weapon system.
eu_RTN-30X=RTN-30X|The RTN-30X 'Orion' is an Italian fire control radar developed from the RTN-10X and RTN-20X radars. It is used to guide several models of weapons such as the OTO-Melara 76.2mm and 127mm guns and also the Aspide surface-to-air missile.
eu_PRT-401=PRT-401|The PRT-401 is a command data-link antenna for the Otomat missile system. It relays guidance information to the missile during flight.
eu_NA-25X=NA-25X|The NA-25X is a naval fire-control system combining radar tracking with electro-optical observation. It supplies accurate target data for gun engagements against air and surface threats.
eu_NA-30S_mk2=NA-30S Mk. 2|The NA-30S Mk. 2 is a naval fire-control system combining radar tracking with electro-optical observation. It supplies accurate target data for gun engagements against air and surface threats.

#-------------------------------------- Aircraft Radar ---------------------------------------
#---Surface only----
eu_APS-705=MM/APS-705|The MM/APS-705 was developed in the mid 1970s for use on the Marina Militare fleet of AB.212ASW helicopters. Its main roles are facilitating over-the-horizon guidance of Otomat missiles, early detection of approaching small craft as well as spotting and tracking submarine periscopes.
eu_APS-784=MM/APS-784|The MM/APS-784 was developed by a consortium of SMA and FIAR (known as Consorzio ELIRADAR) starting in 1987 to provide a modern surface-search radar for the upcoming EH 101 helicopter then under development by AgustaWestland. It is a fully solid-state radar with an integrated IFF system and equips the whole EH 101 fleet of the Marina Militare.
eu_ARI_23274=ARI 23274|The ARI 23274 is an advanced ground-mapping and attack radar able to simultaneously scan for targets and conduct fully automated terrain-following flight for low-level strike missions in all weather conditions.

#-------------------------------------- Sonar ---------------------------------------
