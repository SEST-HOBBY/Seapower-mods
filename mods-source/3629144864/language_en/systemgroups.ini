#---Air/Air&Surface----
eu_SPQ-9B=AN/SPQ-9B
eu_SPY-1A=AN/SPY-1A|The AN/SPY-1A is the early production S-band PESA radar of the AEGIS combat system. It uses four fixed arrays to maintain continuous 360-degree air and surface surveillance while supporting Standard Missile engagements through the combat system. This entry represents the original Ticonderoga-era fit, with good fleet air-defense performance but less processing, clutter rejection, and BMD growth margin than later SPY-1 versions.
eu_SPY-1A(V)=AN/SPY-1A(V)|The AN/SPY-1A(V) entry represents a modernized or late-service SPY-1A-style installation with improved signal processing and target handling over the original early cruiser radar. It keeps the same basic four-face S-band AEGIS architecture, but is treated as a non-BMD air-defense sensor rather than a full SPY-1D(V) equivalent.
eu_SPY-1B=AN/SPY-1B|The AN/SPY-1B is an improved SPY-1 variant used on later Ticonderoga-class cruisers. It introduced a better antenna with reduced sidelobes and substantially higher average power than SPY-1A, improving performance in clutter, jamming, and long-range fleet air-defense work. It remains a classic AEGIS S-band PESA with four fixed arrays and continuous 360-degree coverage.
eu_SPY-1B(V)=AN/SPY-1B(V)|The AN/SPY-1B(V) is an upgraded SPY-1B configuration with improved processing and target handling for later-service AEGIS cruisers. It keeps the SPY-1B antenna and high-power PESA architecture, but represents a better software and signal-processing standard for low-altitude, surface, and cluttered littoral environments.
eu_SPY-1B(BMD)=AN/SPY-1B(BMD)|The AN/SPY-1B(BMD) represents a BMD-upgraded cruiser radar installation. It retains the SPY-1B S-band PESA hardware basis but uses AEGIS BMD processing and high-elevation search/track modes to handle ballistic missile tracks above the normal air-defense altitude regime. In game terms it should be treated as an AAW radar with an expanded BMD altitude ceiling, not as an LRDR-class sensor.
eu_SPY-1D=AN/SPY-1D|The AN/SPY-1D is the destroyer-optimized member of the SPY-1 family and a core sensor of Arleigh Burke and allied AEGIS ships. It uses four fixed S-band PESA arrays for continuous volume search, track, and missile-support functions. Compared with early SPY-1A systems it benefits from higher average power, improved module control, and better overall track quality.
eu_SPY-1D(V)=AN/SPY-1D(V)|The AN/SPY-1D(V) is a littoral-improved SPY-1D variant with enhanced moving-target indication, clutter rejection, and low-altitude target handling. It is optimized for sea-skimmers, surface contacts, and dense coastal backgrounds while retaining the long-range AEGIS air-defense role. This is the strongest non-BMD SPY-1D-style entry in this file.
eu_SPY-1D(BMD)=AN/SPY-1D(BMD)|The AN/SPY-1D(BMD) represents an AEGIS BMD-capable SPY-1D installation used for ballistic missile search, track, and engagement support. It adds high-elevation BMD track handling and a much higher altitude ceiling than a pure air-defense SPY-1D, while still relying on the SPY-1D(V)-class S-band PESA architecture rather than a newer GaN AESA.
eu_SPY-1F=AN/SPY-1F|The AN/SPY-1F is a reduced-size export/frigate member of the SPY-1 family. It retains the AEGIS-style fixed-array S-band PESA concept but has a smaller aperture and lower practical search volume than the cruiser and destroyer SPY-1 variants. It is suitable for local or medium-area air defense, not for full AEGIS BMD use.
eu_SPY-1F(V)=AN/SPY-1F(V)|The AN/SPY-1F(V) is a modernized reduced-size SPY-1F-style radar for frigate-sized ships. It is modeled with somewhat better processing, tracking, and low-altitude performance than the basic SPY-1F while keeping the same smaller-array limitations. It should remain clearly below SPY-1D and SPY-1D(V) in altitude and long-range volume-search capability.
eu_SPY-1K=AN/SPY-1K|The AN/SPY-1K is a compact SPY-1 derivative intended for much smaller combatants. Its smaller S-band arrays and lower power make it a local-area air-defense radar rather than a fleet AEGIS sensor. It should have good reaction and track quality for its size, but a much lower altitude and range envelope than SPY-1F or SPY-1D.
eu_SPY-1E=AN/SPY-1E|The AN/SPY-1E entry represents the solid-state growth path from SPY-1 toward later S-band volume-search and BMD radar concepts. It is treated as a high-end experimental or developmental AEGIS-family sensor with better waveform agility and reliability than classic crossed-field-amplifier SPY-1 radars. Its altitude ceiling is expanded for high-volume search, but it is not modeled as an LRDR-class system.
eu_SPY-3=AN/SPY-3|The AN/SPY-3 is an X-band multifunction radar associated with the Dual Band Radar suite on Zumwalt and Ford-class ships. It emphasizes horizon search, precision tracking, fire-control quality data, and missile support rather than very large S-band volume search. Its high resolution and periscope/sea-skimmer utility should not be confused with a high-altitude BMD search role.
eu_SPY-4=AN/SPY-4|The AN/SPY-4 is the S-band Volume Search Radar component of the original Dual Band Radar concept. It provides broad-area air and volume search to complement the X-band SPY-3 fire-control radar. It is modeled as a strong non-BMD volume-search radar with a high air-defense ceiling, but below SPY-6(V)1 or SPY-7 BMD-class sensors.
eu_SPY-5=AN/SPY-5|The AN/SPY-5 is a lightweight X-band phased-array radar concept for precision tracking and ESSM-class fire-control support. It is smaller and more limited than SPY-3, with good angular and range precision but without the aperture and search volume of the major S-band AEGIS radars. It should be used as a compact tracking/fire-control radar, not a strategic volume-search sensor.
eu_SPY-6(V1)=AN/SPY-6(V)1|The AN/SPY-6(V)1 is the 37-RMA-per-face Air and Missile Defense Radar fitted to Flight III Arleigh Burke destroyers. It is a large fixed-face S-band GaN AESA built for simultaneous air defense and ballistic missile defense. In this file it is the main shipborne U.S. IAMD sensor and receives a high, but not land-LRDR-level, altitude ceiling.
eu_SPY-6(V2)=AN/SPY-6(V)2|The AN/SPY-6(V)2 is the rotating 9-RMA Enterprise Air Surveillance Radar configuration. It provides a modern S-band GaN AESA surveillance capability for carriers and amphibious ships, but its rotating single-face layout makes it less suitable for continuous high-altitude BMD work than fixed-face SPY-6 variants. It is modeled as a strong air-surveillance radar with a non-BMD altitude cap.
eu_SPY-6(V3)=AN/SPY-6(V)3|The AN/SPY-6(V)3 is the fixed-face 9-RMA Enterprise Air Surveillance Radar configuration. With three fixed faces it provides better sector persistence than the rotating V2 while remaining much smaller than the 37-RMA SPY-6(V)1. It is suitable for high-end air surveillance and local IAMD support, but not for the full BMD altitude envelope of V1 or V4.
eu_SPY-6(V4)=AN/SPY-6(V)4|The AN/SPY-6(V)4 is the 24-RMA-per-face backfit radar planned for upgraded Flight IIA Arleigh Burke destroyers. It is smaller than SPY-6(V)1 but still a large fixed-face S-band GaN AESA with substantial IAMD and BMD growth over SPY-1D(V). In game terms it should sit between SPY-1D(BMD) and SPY-6(V)1.
eu_SPY-7_LRDR=AN/SPY-7 LRDR|The AN/SPY-7 LRDR entry represents the large land-based Long Range Discrimination Radar class rather than a normal shipboard radar. It is a large S-band GaN AESA optimized for long-range ballistic missile tracking and discrimination at very high altitude. It should use the highest altitude ceiling in this file and should not be used as a standard naval air-search fit.
eu_SPY-7(V1)=AN/SPY-7(V)1|The AN/SPY-7(V)1 is the large shipborne SPY-7 variant associated with Japan’s Aegis System Equipped Vessel program. It uses Lockheed Martin’s solid-state S-band radar technology derived from the LRDR family and is intended for high-end air and ballistic missile defense. It is modeled below the land-based LRDR but above smaller frigate-sized SPY-7 variants.
eu_SPY-7(V2)=AN/SPY-7(V)2|The AN/SPY-7(V)2 is the SPY-7 variant associated with Spain’s F-110 frigate program. It is a modern fixed-face S-band AESA radar for frigate-sized combatants and AEGIS-derived combat systems, but its ship and array size put it below the Japanese ASEV and LRDR-class installations. It is modeled as a strong air-defense radar with limited high-altitude growth.
eu_SPY-7(V3)=AN/SPY-7(V)3|The AN/SPY-7(V)3 is the SPY-7 variant associated with Canada’s River-class/Canadian Surface Combatant program. It is larger and more capable than a small frigate radar, but it should still be separated from the very large ASEV and LRDR-class BMD installations. In this file it receives a moderate IAMD altitude ceiling without being treated as a strategic BMD radar.


