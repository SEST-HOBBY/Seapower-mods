eu_Rh202=Rh202|20mm Rheinmetall Rh202|A manually trained and laid 20 mm single gun for close-range self protection. The mount is open and unstabilized, so accuracy depends on sea state and operator skill. It is suited for warning shots, policing, and last-resort defense against small boats at short ranges. Ammunition is typically HE and AP types in simple box magazines. It requires local control on deck and is not integrated with radar fire control. Compared to remote mounts, it offers low complexity but limited combat effectiveness.
eu_DS30M_A1=MSI Seahawk DS30M A1|MSI Seahawk DS30M A1|A stabilized 30 mm naval gun system from MSI-Defence Systems with coaxially mounted electro-optical sensors. The mount combines a Mk44-series cannon, video auto tracking and ballistic fire control for close-range defense against small craft, drones and other asymmetric threats.
