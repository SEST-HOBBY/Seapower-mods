#======================================== Brazil ========================================
#-------------------------------------- Visual ---------------------------------------
#-------------------------------------- Radar ---------------------------------------
#---Air/Air&Surface----
eu_RAN20S=RAN-20S|The RAN-20S (also known as the MM/SPS-702) is a medium-range, 2D air and surface surveillance radar developed by Leonardo (formerly Selenia/Alenia) that operates in the S-band and is primarily used on medium-sized warships like frigates and corvettes. Known for its reliability in hostile electronic environments, it features a dual-beam antenna (high and low beams) to provide simultaneous coverage for high-altitude air threats and sea-skimming missiles, with an instrumented range of approximately 150 nautical miles (≈278 km). It is widely recognized for its service on the Brazilian Niterói-class frigates and the Italian Maestrale-class, where it serves as a critical sensor for target acquisition and situational awareness.

#---Surface only----

#---Submarines------
eu_CalypsoIII=Calypso III DRUA 33B|The Calypso III (also designated as DRUA 33B) is a vintage French surface search and navigation radar series developed by Thomson-CSF (now Thales) specifically for submarines. Designed to operate effectively in high-clutter marine environments, it serves as the primary sensor for surface surveillance while a submarine is surfaced or at periscope depth. The system is driven by a magnetron and features multiple operational modes—including continuous scan, sectoral, and short "burst" transmissions (0.1 or 1 second)—to minimize the submarine's own electronic signature and reduce the risk of detection by enemy Electronic Support Measures (ESM).
eu_ScanterMIL24X=Scanter MIL 24X|The SCANTER MIL 24X is a high-resolution, X-band naval surveillance radar developed by Terma, designed to bridge the gap between standard commercial navigation radars and high-end military surveillance systems. It is engineered for "small target detection," making it exceptionally capable of spotting low-signature threats like jet skis, RHIBs, and even small drones in heavy seas and foul weather. Operating as a solid-state, 2D coherent radar, it provides simultaneous surface surveillance, short-range air tracking (up to 15–20 nautical miles), and helicopter approach control, and is frequently integrated into the bridge systems of offshore patrol vessels (OPVs), corvettes, and frigates worldwide.

#-------------------------------------- Aircraft Radar ---------------------------------------
#---Air/Air&Surface----
bra_Grifo-F=Grifo-F|The Grifo-F is a specialized, multi-mode pulse-Doppler fire-control radar developed by Leonardo, specifically optimized to fit the constrained nose profile of the Northrop F-5E/F Tiger II fighter. Part of the highly successful Grifo family, it features a unique elliptical antenna and a modular, air-cooled design that allows for advanced air-to-air and air-to-surface capabilities—including Track-While-Scan (TWS) of up to 10 targets, high-resolution SAR mapping, and support for Beyond-Visual-Range (BVR) missiles—making it the cornerstone of F-5 modernization programs for the Brazilian and Singaporean Air Forces.

#---Surface only----

