eu_MASS=MASS|MASS|The Multi Ammunition Softkill System is a programmable decoy launcher for RF, IR, and EO countermeasures. It creates screening and seduction effects to confuse missile seekers and hostile sensors. Salvos are planned by doctrine and synchronized with ship maneuvers and ECM. The system can generate multi-spectral coverage to counter different seeker types. Integration with the combat system enables automatic or semi-automatic firing in threat scenarios. It does not destroy threats but reduces their probability of hit.
eu_MASS_ATD=MASS ATD|MASS ATD|An optional anti-torpedo decoy add-on to MASS that launches expendable acoustic effectors. The effectors are used to draw off or confuse incoming torpedoes in conjunction with maneuvers. Firing is coordinated with ship sonar warnings and engagement doctrine. The system extends soft-kill protection into the underwater domain without committing a hard-kill effector. It is limited by inventory and environment-dependent performance. It complements, but does not replace, active anti-torpedo systems.
