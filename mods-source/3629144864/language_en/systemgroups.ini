eu_AN/SLQ-32_RWR=AN/SLQ-32(V1) RWR|The AN/SLQ-32(v)1 electronic warfare suite detects enemy missile seekers and targeting radars, providing a missile warning capability.
eu_AN/SLQ-32_ESM=AN/SLQ-32(V) ESM|The AN/SLQ-32(v)2 and (v)3 electronic warfare suites retain the missile warning capability of (v)1 but adds the ability to detect surface-search and early warning radars.
eu_AN/SLQ-32A_ESM=AN/SLQ-32A(V) ESM|The AN/SLQ-32A(v)2 and (v)3 electronic warfare suites retain the missile warning capability of (v)1 but adds the ability to detect surface-search and early warning radars.\n\nThe SLQ-32A is an upgraded module for ships to have improved missile warning for a greater variety of threats at longer ranges than before
eu_AN/SLQ-32(V6)_ESM=AN/SLQ-32(V6) ESM|SEWIP Block 2 ESM|An electronic support measures suite for threat warning. It detects and classifies hostile emitters. It improves situational awareness and survivability.
eu_AN/SLQ-32=AN/SLQ-32(V3) ECM|The AN/SLQ-32(v)3 is the primary shipboard ECM in use by U.S. Navy ships. This system is used to jam enemy radars to reduce their tracking performance, and also controls chaff.
eu_AN/SLQ-32(V5)=AN/SLQ-32(V5) ECM|The AN/SLQ-32(v)5 Sidekick system is a bolt-on deceptive jammer system used on lighter SLQ-32(V)2 systems that cannot support the full weight and power of the V3 system, and is primarily used on FFGs after the 1989 USS Stark incident.As it has only low power modes, this ECM system cannot effectively perform offensive noise jamming to blind radars, and must rely on deceptive jamming to soft-kill incoming threats.
eu_AN/SLQ-32A=AN/SLQ-32A(V3) ECM|The AN/SLQ-32A(v)3 is the primary shipboard ECM in use by U.S. Navy ships. This system is used to jam enemy radars to reduce their tracking performance, and also controls chaff.\n\nThe SLQ-32A is an upgraded module for ships to have enhanced electronic warfare capabilities, both with noise and deception jamming modes, and increases effective output of the system through redesigned antennas to effectively counter modern antiship missile threats.
eu_Active_Intercept_Warning=Active Intercept Warning|An all-direction sonar receiver that can pick up active sonar pings from any angle, and allows submarines to detect active sonar pings from the baffles, where normal active/passive sonar cannot hear.

