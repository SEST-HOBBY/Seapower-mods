eu_AN/SQR-19=AN/SQR-19|The AN/SQR-19 Tactical Towed Array SONAR (TACTAS) is a passive towed array used for very long-range detection of enemy submarines. Being towed far behind the ship, interference from own-ship noise is minimized.

#-------------------------------------Datalink -------------------------------------
eu_UYK-43=AN/UYK-43|The AN/UYK-43 was a standard US Navy 32-bit combat direction computer used for sensor processing, tracking, and weapon control in a wide range of surface combatants and support systems. It provided a major improvement in processing power, reliability, and maintainability over earlier naval computers and became a core element of many Cold War and post-Cold War combat systems. In service it was commonly used as part of larger distributed shipboard combat system architectures rather than as a standalone unit.
eu_UYK-44=AN/UYK-44|The AN/UYK-44 was a compact 16-bit naval computer developed for distributed processing, data handling, and control tasks within US Navy combat and platform systems. Smaller and more flexible than larger combat system mainframes, it was widely used for subsystem control, sensor interfaces, display processing, and embedded naval applications. Its broad adoption made it one of the most common computing elements in late Cold War US naval electronics.
eu_UYK-44B=AN/UYK-44B|The AN/UYK-44B was an improved version of the AN/UYK-44, offering greater performance, updated electronics, and better support for later combat system and sensor integration requirements. It retained the compact and modular character of the original design while improving reliability and long-term service usefulness in modernised naval systems. In practice it served as a refined evolution of the UYK-44 for distributed processing and subsystem control roles.

