eu_MK15A=Phalanx Blk-1|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1 upgrade expands ammo capacity by 50%, fire rate by 50%, increases the maximum elevation of the gun, improves the radar, and increases system performance against high-speed threats, although it still is deficient against sea-skimming supersonic maneuvering anti ship missiles.\n\nFrom Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.
eu_MK15B=Phalanx Blk-1A|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1A model improves accuracy by a high degree through software upgrades, which makes it effective against supersonic sea-skimming missiles with terminal maneuvers.\n\nFrom Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.
eu_MK15C=Phalanx Blk-1B|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1B model adds a FLIR and television camera to the side for increased performance against small, maneuvering sea targets, and improves capabilities against very low observable (VLO) targets such as stealthy missiles.\n\nFrom Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.

#-------------------------------------- Radar ---------------------------------------
#---Air/Air&Surface----
eu_SPQ-9B=AN/SPQ-9B|The AN/SPQ-9B is a naval horizon-search radar. It detects and tracks low-altitude air threats and surface contacts, providing rapid updates for ship self-defence.
eu_SPY-1A=AN/SPY-1A|The AN/SPY-1A is the early production S-band PESA radar of the AEGIS combat system. It uses four fixed arrays to maintain continuous 360-degree air and surface surveillance while supporting Standard Missile engagements through the combat system. This entry represents the original Ticonderoga-era fit, with good fleet air-defense performance but less processing, clutter rejection, and BMD growth margin than later SPY-1 versions.
eu_SPY-1A(V)=AN/SPY-1A(V)|The AN/SPY-1A(V) entry represents a modernized or late-service SPY-1A-style installation with improved signal processing and target handling over the original early cruiser radar. It keeps the same basic four-face S-band AEGIS architecture, but is treated as a non-BMD air-defense sensor rather than a full SPY-1D(V) equivalent.
eu_SPY-1B=AN/SPY-1B|The AN/SPY-1B is an improved SPY-1 variant used on later Ticonderoga-class cruisers. It introduced a better antenna with reduced sidelobes and substantially higher average power than SPY-1A, improving performance in clutter, jamming, and long-range fleet air-defense work. It remains a classic AEGIS S-band PESA with four fixed arrays and continuous 360-degree coverage.
eu_SPY-1B(V)=AN/SPY-1B(V)|The AN/SPY-1B(V) is an upgraded SPY-1B configuration with improved processing and target handling for later-service AEGIS cruisers. It keeps the SPY-1B antenna and high-power PESA architecture, but represents a better software and signal-processing standard for low-altitude, surface, and cluttered littoral environments.
eu_SPY-1B(BMD)=AN/SPY-1B(BMD)|The AN/SPY-1B(BMD) represents a BMD-upgraded cruiser radar installation. It retains the SPY-1B S-band PESA hardware basis but uses AEGIS BMD processing and high-elevation search/track modes to handle ballistic missile tracks above the normal air-defense altitude regime. In game terms it should be treated as an AAW radar with an expanded BMD altitude ceiling, not as an LRDR-class sensor.
eu_SPY-1D=AN/SPY-1D|The AN/SPY-1D is the destroyer-optimized member of the SPY-1 family and a core sensor of Arleigh Burke and allied AEGIS ships. It uses four fixed S-band PESA arrays for continuous volume search, track, and missile-support functions. Compared with early SPY-1A systems it benefits from higher average power, improved module control, and better overall track quality.
eu_SPY-1D(V)=AN/SPY-1D(V)|The AN/SPY-1D(V) is a littoral-improved SPY-1D variant with enhanced moving-target indication, clutter rejection, and low-altitude target handling. It is optimized for sea-skimmers, surface contacts, and dense coastal backgrounds while retaining the long-range AEGIS air-defense role. This is the strongest non-BMD SPY-1D-style entry in this file.
eu_SPY-1D(BMD)=AN/SPY-1D(BMD)|The AN/SPY-1D(BMD) represents an AEGIS BMD-capable SPY-1D installation used for ballistic missile search, track, and engagement support. It adds high-elevation BMD track handling and a much higher altitude ceiling than a pure air-defense SPY-1D, while still relying on the SPY-1D(V)-class S-band PESA architecture rather than a newer GaN AESA.
eu_SPY-1F=AN/SPY-1F|The AN/SPY-1F is a reduced-size export/frigate member of the SPY-1 family. It retains the AEGIS-style fixed-array S-band PESA concept but has a smaller aperture and lower practical search volume than the cruiser and destroyer SPY-1 variants. It is suitable for local or medium-area air defense, not for full AEGIS BMD use.
eu_SPY-1F(V)=AN/SPY-1F(V)|The AN/SPY-1F(V) is a modernized reduced-size SPY-1F-style radar for frigate-sized ships. It is modeled with somewhat better processing, tracking, and low-altitude performance than the basic SPY-1F while keeping the same smaller-array limitations. It should remain clearly below SPY-1D and SPY-1D(V) in altitude and long-range volume-search capability.
eu_SPY-1K=AN/SPY-1K|The AN/SPY-1K is a compact SPY-1 derivative intended for much smaller combatants. Its smaller S-band arrays and lower power make it a local-area air-defense radar rather than a fleet AEGIS sensor. It should have good reaction and track quality for its size, but a much lower altitude and range envelope than SPY-1F or SPY-1D.
eu_SPY-1E=AN/SPY-1E|The AN/SPY-1E entry represents the solid-state growth path from SPY-1 toward later S-band volume-search and BMD radar concepts. It is treated as a high-end experimental or developmental AEGIS-family sensor with better waveform agility and reliability than classic crossed-field-amplifier SPY-1 radars. Its altitude ceiling is expanded for high-volume search, but it is not modeled as an LRDR-class system.
eu_SPY-3=AN/SPY-3|The AN/SPY-3 is an X-band multifunction radar associated with the Dual Band Radar suite on Zumwalt and Ford-class ships. It emphasizes horizon search, precision tracking, fire-control quality data, and missile support rather than very large S-band volume search. Its high resolution and periscope/sea-skimmer utility should not be confused with a high-altitude BMD search role.
eu_SPY-4=AN/SPY-4|The AN/SPY-4 is the S-band Volume Search Radar component of the original Dual Band Radar concept. It provides broad-area air and volume search to complement the X-band SPY-3 fire-control radar. It is modeled as a strong non-BMD volume-search radar with a high air-defense ceiling, but below SPY-6(V)1 or SPY-7 BMD-class sensors.
eu_SPY-5=AN/SPY-5|The AN/SPY-5 is a lightweight X-band phased-array radar concept for precision tracking and ESSM-class fire-control support. It is smaller and more limited than SPY-3, with good angular and range precision but without the aperture and search volume of the major S-band AEGIS radars. It should be used as a compact tracking/fire-control radar, not a strategic volume-search sensor.
eu_SPY-6(V1)=AN/SPY-6(V)1|The AN/SPY-6(V)1 is the 37-RMA-per-face Air and Missile Defense Radar fitted to Flight III Arleigh Burke destroyers. It is a large fixed-face S-band GaN AESA built for simultaneous air defense and ballistic missile defense. In this file it is the main shipborne U.S. IAMD sensor and receives a high, but not land-LRDR-level, altitude ceiling.
eu_SPY-6(V2)=AN/SPY-6(V)2|The AN/SPY-6(V)2 is the rotating 9-RMA Enterprise Air Surveillance Radar configuration. It provides a modern S-band GaN AESA surveillance capability for carriers and amphibious ships, but its rotating single-face layout makes it less suitable for continuous high-altitude BMD work than fixed-face SPY-6 variants. It is modeled as a strong air-surveillance radar with a non-BMD altitude cap.
eu_SPY-6(V3)=AN/SPY-6(V)3|The AN/SPY-6(V)3 is the fixed-face 9-RMA Enterprise Air Surveillance Radar configuration. With three fixed faces it provides better sector persistence than the rotating V2 while remaining much smaller than the 37-RMA SPY-6(V)1. It is suitable for high-end air surveillance and local IAMD support, but not for the full BMD altitude envelope of V1 or V4.
eu_SPY-6(V4)=AN/SPY-6(V)4|The AN/SPY-6(V)4 is the 24-RMA-per-face backfit radar planned for upgraded Flight IIA Arleigh Burke destroyers. It is smaller than SPY-6(V)1 but still a large fixed-face S-band GaN AESA with substantial IAMD and BMD growth over SPY-1D(V). In game terms it should sit between SPY-1D(BMD) and SPY-6(V)1.
eu_SPY-7_LRDR=AN/SPY-7 LRDR|The AN/SPY-7 LRDR entry represents the large land-based Long Range Discrimination Radar class rather than a normal shipboard radar. It is a large S-band GaN AESA optimized for long-range ballistic missile tracking and discrimination at very high altitude. It should use the highest altitude ceiling in this file and should not be used as a standard naval air-search fit.
eu_SPY-7(V1)=AN/SPY-7(V)1|The AN/SPY-7(V)1 is the large shipborne SPY-7 variant associated with Japan’s Aegis System Equipped Vessel program. It uses Lockheed Martin’s solid-state S-band radar technology derived from the LRDR family and is intended for high-end air and ballistic missile defense. It is modeled below the land-based LRDR but above smaller frigate-sized SPY-7 variants.
eu_SPY-7(V2)=AN/SPY-7(V)2|The AN/SPY-7(V)2 is the SPY-7 variant associated with Spain’s F-110 frigate program. It is a modern fixed-face S-band AESA radar for frigate-sized combatants and AEGIS-derived combat systems, but its ship and array size put it below the Japanese ASEV and LRDR-class installations. It is modeled as a strong air-defense radar with limited high-altitude growth.
eu_SPY-7(V3)=AN/SPY-7(V)3|The AN/SPY-7(V)3 is the SPY-7 variant associated with Canada’s River-class/Canadian Surface Combatant program. It is larger and more capable than a small frigate radar, but it should still be separated from the very large ASEV and LRDR-class BMD installations. In this file it receives a moderate IAMD altitude ceiling without being treated as a strategic BMD radar.

#---Surface only----
eu_SG-6=SG-6|The SG-6 is an improved version of the SG surface-search radar originally introduced in WWII. It was mounted on a large variety of US surface combatants throughout the 1950s and 1960s until being replaced by the AN/SPS-10.
eu_SPS-67(V3)=AN/SPS-67(V)3|The AN/SPS-67(V)3 is a naval surface-search radar. It provides navigation and tactical contact information, including detection of small targets close to the sea surface.
eu_Pathfinder_ST_Mk2_X=Pathfinder ST Mk. 2|The X-band Pathfinder ST Mk. 2 radar supports navigation and maritime surveillance. It provides bearing and range measurements for contacts near the ship, including in darkness and poor visibility.
eu_Pathfinder_ST_Mk2_S=Pathfinder ST Mk. 2|The S-band Pathfinder ST Mk. 2 radar supports navigation and maritime surveillance. It provides bearing and range measurements for contacts near the ship, including in darkness and poor visibility.

#--------- Submarines ----------
eu_BPS-12=AN/BPS-12|The AN/BPS-12 is a submarine radar for navigation and surface surveillance. It measures contact positions while its mast is raised above the water.
eu_BPS-15A=AN/BPS-15A|The AN/BPS-15A is a submarine radar for navigation and surface surveillance. It measures contact positions while its mast is raised above the water.
eu_AN_BPS-16=AN/BPS-16|The AN/BPS-16 is a submarine radar for navigation and surface surveillance. It measures contact positions while its mast is raised above the water.
eu_AN_BPS-17=AN/BPS-17|The AN/BPS-17 is a submarine radar for navigation and surface surveillance. It measures contact positions while its mast is raised above the water.
eu_BQQ-5D=AN/BQQ-5D|The AN/BQQ-5D bow and hull sonar installation combines active search with passive acoustic processing. It supports submarine detection, classification and fire control, with towed arrays providing additional coverage.
eu_BQQ-10-ARCI=AN/BQQ-10 ARCI|The AN/BQQ-10 sonar suite uses Acoustic Rapid Commercial Off-the-Shelf Insertion processing. This bow-sonar installation supports active and passive underwater search and target classification.
eu_BQQ-10-LAB=AN/BQQ-10 LAB|The Large Aperture Bow sonar installation associated with AN/BQQ-10. Its enlarged receiving aperture and acoustic processing support detection and classification of quiet underwater contacts.
eu_LWWAA=LWWAA|The hull-mounted arrays of the Lightweight Wide Aperture Array sonar. Passive acoustic reception provides bearings to underwater contacts alongside the submarine's bow and towed sonars.
eu_LWWAA_R=LWWAA Starboard|The starboard array of the Lightweight Wide Aperture Array sonar. Passive acoustic reception provides bearings to underwater contacts alongside the submarine's bow and towed sonars.
eu_LWWAA_L=LWWAA Port|The port array of the Lightweight Wide Aperture Array sonar. Passive acoustic reception provides bearings to underwater contacts alongside the submarine's bow and towed sonars.

#---Fire Control----
eu_PVS-2_Sharpshooter=PVS-2 Sharpshooter|PVS-2 Sharpshooter is a naval fire-control radar. It precisely tracks surface contacts and supplies aiming information to the associated gun system.
eu_SPG-62=SPG-62|The AN/SPG-62 is the target-illumination radar of the Aegis fire-control system. It directs radar energy onto a selected target for the terminal guidance of compatible semi-active missiles.
eu_Mk15_blk0_radar=Mk15 Blk 0 Radar|The radar component of the Phalanx Block 0 close-in weapon system. It searches for nearby threats and supplies tracking data for automatic control of the 20 mm gun.
eu_Mk15_blk1_radar=Mk15 Blk 1 Radar|The radar component of the Phalanx Block 1 close-in weapon system. It searches for nearby threats and supplies tracking data for automatic control of the 20 mm gun.
eu_Mk15_blk1b_radar=Mk15 Blk 1B Radar|The radar component of the Phalanx Block 1B close-in weapon system. It searches for nearby threats and supplies tracking data for automatic control of the 20 mm gun.
eu_FLIR_Periscope=FLIR Periscope|A submarine periscope or observation mast equipped with thermal imaging. It allows the crew to observe and identify surface contacts at night while operating at periscope depth.
eu_AN/BVS-1=AN/BVS-1|The AN/BVS-1 photonics mast provides electronic imagery in place of a conventional optical periscope. Daylight and infrared cameras support surface observation and target identification on Virginia-class submarines.
eu_AN/BVS-1(V)=AN/BVS-1(V)|An updated AN/BVS-1 photonics mast installation. Electronic day and night imagery supports surveillance, navigation and identification of surface contacts from periscope depth.

#-------------------------------------- Aircraft Radar ---------------------------------------
#---Air/Air&Surface----
eu_NASARR_F-15A=NASARR F-15A|The NASARR is a search and tracking radar produced in the United States in the mid 1960s. It features a notably advanced ground-mapping capabilty for its time, making it especially useful for ground-strike missions. For this reason it is featured on the F-104G fighter-bomber variant of the F-104 Starfighter family.
eu_NASARR_F-15G=NASARR F-15G|The NASARR is a search and tracking radar produced in the United States in the mid 1960s. It features a notably advanced ground-mapping capabilty for its time, making it especially useful for ground-strike missions. The F-15G variant of the system adds a moving-target indicator and continuous-wave illuminator, enabling guidance of SARH missiles such as the AIM-7 Sparrow.
eu_NASARR_R-21G/M1=NASARR R-21G/M1|The NASARR is a search and tracking radar produced in the United States in the mid 1960s. It features a notably advanced ground-mapping capabilty for its time, making it especially useful for ground-strike missions. The R-21G/M1 is a significantly upgraded varianr of the system, introducing look-down/shoot-down capability and frequency hopping for improved ECM resistance.
eu_AN/APG-65=AN/APG-65|The AN/APG-65 is a multimode pulse-Doppler airborne radar. It supports air-target search and tracking as well as surface-target acquisition for the aircraft's weapons.
eu_AN/APS-145=AN/APS-145|The AN/APS-145 is the airborne early-warning radar of later E-2C Hawkeye aircraft. It provides wide-area surveillance and target tracks for fleet air defence and fighter control.
eu_ZPY-4(V)1=AN/ZPY-4(V)1|A surface search radar for maritime surveillance. It detects and tracks contacts at sea. It supports navigation and situational awareness.
eu_SQS-4=AN/SQS-4|The AN/SQS-4 is a hull-mounted sonar for active submarine search and passive listening. It provides contact bearings and ranges for anti-submarine operations.

#-------------------------------------- Sonar ---------------------------------------
#--------- Surface ----------
eu_SQS-11A=AN/SQS-11A|The AN/SQS-11 is a modernized postwar version of the late-war QHB active sonar. The SQS-11A is a further modified version upgraded with a boost capacitor to achieve higher detection ranges.
eu_SQS-29=AN/SQS-29B|The AN/SQS-4 is an active/passive search sonar operating on the azmumith scanning method. The AN/SQS-29 is a re-designation of the AN/SQS-4 Mod 1 after being modified with Rotating Directional Transmission (RDT) capability to extend its service life.
eu_SQS-30=AN/SQS-30|The AN/SQS-4 is an active/passive search sonar operating on the azmumith scanning method. The AN/SQS-30 is a re-designation of the AN/SQS-4 Mod 2 after being modified with Rotating Directional Transmission (RDT) capability to extend its service life.
eu_SQS-39=AN/SQS-39|The AN/SQS-39 is an upgraded version of the AN/SQS-29 active/passive search sonar. Compared to the previous variant it has been upgraded with Steered Directional Transmission (SDT) capability and was modified with the Maintainability And Reliability Kit (MARK) to extend its service life.
eu_SQS-43=AN/SQS-43|The AN/SQS-43 is an upgraded version of the AN/SQS-29B/C active/passive search sonar. Compared to the previous variant it has been upgraded with Steered Directional Transmission (SDT) capability and was modified with the Maintainability And Reliability Kit (MARK) to extend its service life.
eu_SQS-53C=AN/SQS-53C|Highly upgraded and digitized version of the SQS-53B with newer physical sonar assembly for greater sensitivity and higher accuracy using bottom-bounce and convergence-zone modes, alongside better capabilities against fast, deep-diving submarines.
eu_SQS-53D=AN/SQS-53D|Highly upgraded and digitized version of the SQS-53B with newer physical sonar assembly for greater sensitivity and higher accuracy using bottom-bounce and convergence-zone modes, alongside better capabilities against fast, deep-diving submarines.
eu_SQS-60=AN/SQS-60|The AN/SQS-60 is a medium-frequency hull-mounted sonar installed on the Zumwalt-class as part of its integrated underwater warfare sensor fit. It supports active and passive detection, tracking, and classification of submarine threats and other underwater contacts, especially in situations where a hull-mounted system offers faster localised response than a towed array alone. Together with the AN/SQS-61 and AN/SQR-20 it contributes to the class's layered anti-submarine warfare capability.
eu_SQS-61=AN/SQS-61|The AN/SQS-61 is a high-frequency hull-mounted sonar developed as part of the Zumwalt-class ASW suite, providing active and passive underwater search capability from the ship's bow. It is optimised for broad-area detection, tracking, and classification of submarines and underwater contacts in the ship's forward sector. As the primary hull sonar of the class it works together with the towed array to give the ship a balanced near- and mid-range ASW capability.

eu_LVA=LVA|The Large Vertical Array (LVA) is a hull-mounted flank sonar integrated into Block V Virginia-class submarines to dramatically enhance passive detection and tracking. Working alongside existing Light-Weight Wide Aperture Arrays (LWWAA) and onboard processing systems, it builds a highly detailed tactical picture to secure a crucial acoustic advantage over the quietest modern Russian and Chinese submarines. Developed and manufactured by Collins Aerospace's Engineered Polymer Products division in Jacksonville, Florida, the LVA's advanced acoustic structures are constructed using sophisticated polyurethane and composite polymer technologies.

eu_LVA_R=LVA|The Large Vertical Array (LVA) is a hull-mounted flank sonar integrated into Block V Virginia-class submarines to dramatically enhance passive detection and tracking. Working alongside existing Light-Weight Wide Aperture Arrays (LWWAA) and onboard processing systems, it builds a highly detailed tactical picture to secure a crucial acoustic advantage over the quietest modern Russian and Chinese submarines. Developed and manufactured by Collins Aerospace's Engineered Polymer Products division in Jacksonville, Florida, the LVA's advanced acoustic structures are constructed using sophisticated polyurethane and composite polymer technologies.

eu_LVA_L=LVA|The Large Vertical Array (LVA) is a hull-mounted flank sonar integrated into Block V Virginia-class submarines to dramatically enhance passive detection and tracking. Working alongside existing Light-Weight Wide Aperture Arrays (LWWAA) and onboard processing systems, it builds a highly detailed tactical picture to secure a crucial acoustic advantage over the quietest modern Russian and Chinese submarines. Developed and manufactured by Collins Aerospace's Engineered Polymer Products division in Jacksonville, Florida, the LVA's advanced acoustic structures are constructed using sophisticated polyurethane and composite polymer technologies.
eu_TB-16B=TB-16B|The TB-16B is a passive submarine towed array. Hydrophones streamed behind the submarine listen for low-frequency target noise with reduced interference from the towing platform.
eu_TB-23=TB-23|The TB-23 is a passive submarine towed array. Hydrophones streamed behind the submarine listen for low-frequency target noise with reduced interference from the towing platform.
eu_TB-29A=TB-29A|The TB-29A is a passive submarine towed array. Hydrophones streamed behind the submarine listen for low-frequency target noise with reduced interference from the towing platform.
eu_TB-34A=TB-34A|The TB-34A is a passive submarine towed array. Hydrophones streamed behind the submarine listen for low-frequency target noise with reduced interference from the towing platform.
eu_AN/BLD-1=AN/BLD-1|The AN/BLD-1 is a submarine microwave direction-finding system. It passively intercepts radar signals and measures emitter bearings to support covert surveillance.
eu_AN/WLR-8(V6)=AN/WLR-8(V)6|The AN/WLR-8(V)6 is a submarine electronic-support receiver. It automatically detects and analyzes intercepted radar signals for threat warning and electronic surveillance.

eu_FAR-2167DS=FAR-2167DS|An S-band navigation and surface search radar. It is used for surface detection and safe navigation. It improves awareness in poor weather and sea clutter.
eu_FAR-2127=FAR-2127|An X-band navigation and surface search radar. It is used for short-range detection and navigation. It offers improved detail against surface contacts.

#--------- Submarines ----------
eu_AN_SQS_4_Tench=AN/SQS-4|An active hull-sonar installation for the Tench submarine configuration. It provides short-range detection and ranging of underwater contacts.

#----- Towed/VDS -----
eu_SQA-10=AN/SQA-10|The SQA-10 is a variable-depth sonar. Its lowered transducer provides active and passive underwater search while operating away from the hull at a selected depth.
eu_AN/SQR-19B=AN/SQR-19B|The AN/SQR-19 Tactical Towed Array SONAR (TACTAS) is a passive towed array used for very long-range detection of enemy submarines. Being towed far behind the ship, interference from own-ship noise is minimized.
eu_SQR-20=AN/SQR-20|The AN/SQR-20 Multi-Function Towed Array is a modern passive towed sonar system designed to greatly improve long-range submarine detection, target tracking, and performance in difficult acoustic conditions. Towed well behind the ship to reduce self-noise and baffle effects, it is particularly effective for detecting quiet submarines at extended range. On Zumwalt-class destroyers it forms a key part of the ship's ASW suite and complements the bow-mounted sonars with improved passive search capability.
SSQ-41B_Sonar=AN/SSQ-41B Sonobuoy|The AN/SSQ-41B is a passive omnidirectional sonobuoy. It relays underwater sound to the monitoring aircraft for initial detection and acoustic analysis.
SSQ-53B_Sonar=AN/SSQ-53B DIFAR|The AN/SSQ-53B is a directional passive sonobuoy of the DIFAR family. It transmits underwater noise and bearing information to the monitoring aircraft for submarine detection and tracking.
SSQ-53D_Sonar=AN/SSQ-53D DIFAR|The AN/SSQ-53D is a directional passive sonobuoy of the DIFAR family. It transmits underwater noise and bearing information to the monitoring aircraft for submarine detection and tracking.
SSQ-53F_Sonar=AN/SSQ-53F DIFAR|The AN/SSQ-53F is a directional passive sonobuoy of the DIFAR family. It transmits underwater noise and bearing information to the monitoring aircraft for submarine detection and tracking.
SSQ-53G_Sonar=AN/SSQ-53G DIFAR|The AN/SSQ-53G is a directional passive sonobuoy of the DIFAR family. It transmits underwater noise and bearing information to the monitoring aircraft for submarine detection and tracking.
SSQ-53H_Sonar=AN/SSQ-53H DIFAR|The AN/SSQ-53H is a directional passive sonobuoy of the DIFAR family. It transmits underwater noise and bearing information to the monitoring aircraft for submarine detection and tracking.
SSQ-62B_Sonar=AN/SSQ-62B DICASS|The AN/SSQ-62B is a command-activated DICASS sonobuoy. Active sonar pulses provide range and bearing information to help localize a submarine contact.
SSQ-62C_Sonar=AN/SSQ-62C DICASS|The AN/SSQ-62C is a command-activated DICASS sonobuoy. Active sonar pulses provide range and bearing information to help localize a submarine contact.
SSQ-62E_Sonar=AN/SSQ-62E DICASS|The AN/SSQ-62E is a command-activated DICASS sonobuoy. Active sonar pulses provide range and bearing information to help localize a submarine contact.
SSQ-62F_Sonar=AN/SSQ-62F DICASS|The AN/SSQ-62F is a command-activated DICASS sonobuoy. Active sonar pulses provide range and bearing information to help localize a submarine contact.
SSQ-62G_Sonar=AN/SSQ-62G DICASS|The AN/SSQ-62G is a command-activated DICASS sonobuoy. Active sonar pulses provide range and bearing information to help localize a submarine contact.
SSQ-75_Sonar=AN/SSQ-75 Sonobuoy|The AN/SSQ-75 is an active sonobuoy for underwater search and localization. It uses transmitted pulses and returning echoes to obtain contact information.
SSQ-77B_Sonar=AN/SSQ-77B Sonobuoy|The AN/SSQ-77B is a passive vertical-line-array sonobuoy. Its receiving array supports detection and bearing analysis of underwater acoustic contacts.
SSQ-77C_Sonar=AN/SSQ-77C Sonobuoy|The AN/SSQ-77C is a passive vertical-line-array sonobuoy. Its receiving array supports detection and bearing analysis of underwater acoustic contacts.
SSQ-101A_Sonar=AN/SSQ-101A ADAR|The AN/SSQ-101A Air-Deployable Active Receiver is a receiving sonobuoy for multistatic anti-submarine operations. Its passive acoustic array listens for target noise and echoes from separate active sources.

