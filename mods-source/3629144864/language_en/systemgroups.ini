eu_HELRAS=HELRAS|The HELRAS (Helicopter Long Range Active Sonar) is a modern dipping sonar developed jointly by the Italian company FIAR and British Aerospace in the 1990s to equip a large variety of ASW helicopters. A direct competitor to the system is Thales' FLASH dipping sonar.
