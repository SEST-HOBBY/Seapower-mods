eu_SQS-11A=AN/SQS-11A|The AN/SQS-11A is an active/passive search and attack sonar fitted to US Navy destroyers and escorts in the early 1950s. It was replaced by newer and more capable systems in the 1960s.
eu_SQS-30=AN/SQS-30|The AN/SQS-4 is an active/passive search sonar operating on the azmumith scanning method. The AN/SQS-4 mod. 2 was re-designated as AN/SQS-30 in the 1960s.
eu_SQS-39=AN/SQS-39|The AN/SQS-39 is an upgraded version of the AN/SQS-29 active/passive search sonar. Compared to its previous variant it has the added capability of steered directional transmission (SDT) and was modified with the Maintainability And Reliability Kit (MARK) to extend its service life.
