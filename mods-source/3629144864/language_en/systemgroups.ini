eu_SPQ-2=MM/SPQ-2|The MM/SPQ-2 is one of the earliest domestic Italian surface search radars mounted on a majority of the Marina Militares surface combattants throughout the 1950s and 1960s, often replacing older systems previously provided by the United States.
