eu_NASARR_F-15A=NASARR F-15A|The NASARR is a search and tracking radar produced in the United States in the mid 1960s. It features a notably advanced ground-mapping capabilty for its time, making it especially useful for ground-strike missions. For this reason it is featured on the F-104G fighter-bomber variant of the F-104 Starfighter family.
eu_NASARR_F-15G=NASARR F-15G|The NASARR is a search and tracking radar produced in the United States in the mid 1960s. It features a notably advanced ground-mapping capabilty for its time, making it especially useful for ground-strike missions. The F-15G variant of the system adds a moving-target indicator and continuous-wave illuminator, enabling guidance of SARH missiles such as the AIM-7 Sparrow.
eu_NASARR_R-21G/M1=NASARR R-21G/M1|The NASARR is a search and tracking radar produced in the United States in the mid 1960s. It features a notably advanced ground-mapping capabilty for its time, making it especially useful for ground-strike missions. The R-21G/M1 is a significantly upgraded varianr of the system, introducing look-down/shoot-down capability and frequency hopping for improved ECM resistance.
