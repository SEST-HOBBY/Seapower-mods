eu_MGK-365_Hull=MGK-365 "Zvezda-M1" Hull|The MGK-365 Zvezda-M1 (NATO Reporting name: Ox Yoke) is a Soviet integrated hydroacoustic complex developed for the Project 11540 Neustrashimy-class frigate. Its hull-mounted multichannel array provides active and passive search, tracking and target-data generation against submarines and other underwater contacts. It operates together with the suite's variable-depth towed antenna, covering the local and medium-range underwater sector.
eu_MGK-365_VDS=MGK-365 "Zvezda-M1" VDS|The MGK-365 Zvezda-M1 VDS  (NATO Reporting name: Ox Tail) is the towed variable-depth component of the Zvezda-M1 hydroacoustic complex. Lowering the array away from the ship and beneath unfavorable surface layers improves acoustic conditions and extends the suite's search volume. It is the longer-ranged component of the MGK-365 suite, complementing the hull-mounted array aboard the Project 11540 Neustrashimy class.
