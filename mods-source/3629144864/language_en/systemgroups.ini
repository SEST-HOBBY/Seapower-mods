eu_OTO135=OTO-Ansaldo 135|135mm/45 OTO-Ansaldo|The OTO-Ansaldo 135mm guns are part of the last generation of a handfull of guns in this caliber range designed and produced during the cold war. Being a further development of the WWII 135mm caliber used by Italy this new gun is fed by a fully automatic loading system and controlled by a modern radar-based fire control system, enabling it to function as a lethal dual-purpose weapon. The only ship to carry these guns would be the converted guided missile cruiser Guiseppe Garibaldi.
eu_OTO127=OTO-Melara Compact|127mm/54 OTO-Melara Compact|The OTO-Melara Compact is an Italian dual-purpose mount and one of the most wide-spread naval guns in the world. Developed in the 1970s the OTO-Melara Compact is a modern system with a fully automatic loading mechanism and controlled remotely from a central console and by a single crew member. 
eu_OTO76=Allargato|76.2mm/62 Allargato|The Allargato was developed in the 1960s as the first dual-purpose mount in line of the now famous Italian 76.2mm naval guns, laying the groundwork for wide-spread use of later models among countless navies across the globe. It is fed by a fully automatic loading system for a very high rate of fire and controlled remotely from the ship's CIC.
eu_OTO76_SR=OTO-Melara SR|76.2mm/62 OTO-Melara Super Rapido|The OTO-Melara Super Rapido is an improved, faster-firing version of OTO-Melaras 76.2mm Compact turret designed specifically for close-in missile defense. Thanks to lightened moving parts, a heavily optimized loading system and improved ammunition the Super Rapido is capable of achieving an even higher fire-rate 120 round per minute. Due to this it is considered an even more effective missile defense weapon than OTO-Melaras own DARDO system.

eu_oto127=OTO-Melara Compact|127mm/54 OTO-Melara Compact|The OTO-Melara Compact is an Italian dual-purpose mount and one of the most wide-spread naval guns in the world. Developed in the 1970s the OTO-Melara Compact is a modern system with a fully automatic loading mechanism and controlled remotely from a central console and by a single crew member. 
eu_oto127lw=Leonardo 127/64 Lightweight|127mm/64 Leonardo Lightweight|A 127 mm naval gun for naval surface fire support and anti-surface engagements. It can employ conventional and guided extended-range ammunition. Fire control is typically provided by the ship combat system using radar and/or EO directors depending on doctrine.
eu_oto76_allargato=Allargato|76.2mm/62 Allargato|The Allargato was developed in the 1960s as the first dual-purpose mount in line of the now famous Italian 76.2mm naval guns, laying the groundwork for wide-spread use of later models among countless navies across the globe. It is fed by a fully automatic loading system for a very high rate of fire and controlled remotely from the ship's CIC.
eu_oto76sr=OTO_Melara 76/62 SR|76.2mm/62 Leonardo Super Rapid|A modernized variant of the widely used OTO Melara (now Leonardo) 76 mm naval gun featuring an increased rate of fire, improved drive systems, and compatibility with advanced ammunition types. The Super Rapid mount sustains up to 120 rounds per minute and integrates automated handling that allows rapid switching between HE, PFF, and specialized extended-range or anti-missile rounds depending on configuration. When paired with a contemporary fire-control director or EO/IR tracker, it provides effective close- to mid-range defense against missiles, aircraft, and surface threats. The system offers higher engagement performance than the Compact model while retaining similar weight and footprint.
eu_oto76lw=OTO-Melara 76/62 Compact|76.2mm/62 OTO-Melara Compact|An upgraded variant of a 76 mm multi-role naval gun widely fitted to frigates and corvettes. It incorporates a slightly higher rate of fire. It can engage air, surface, and limited shore targets with high rate of fire. The compact mount integrates ready-use ammunition below the shield for rapid bursts. Fire control is provided by a director such as STIR or an EO tracker depending on doctrine. The system offers a balance of weight, volume, and firepower for medium ships. It is distinct from the Super Rapid variant that has an even higher cyclic rate.
