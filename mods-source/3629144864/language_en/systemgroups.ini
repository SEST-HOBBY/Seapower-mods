eu_EDO-610E=EDO-610E|The EDO‑610E hull sonar is a hull-mounted active/passive sonar system developed by EDO Corporation for naval vessels. It is used primarily for anti-submarine warfare (ASW) to detect, track, and classify submarines and underwater contacts.
eu_EDO-997=EDO-997|The EDO-997 (currently L3Harris Model 997 or SONAT MkII) is a high-performance active hull-mounted sonar used by the Brazilian Navy. Designed for the detection, tracking, and classification of underwater targets, the system equips the Niterói-class frigates and the Barroso corvette, and is undergoing modernization upgrades.
eu_TSM_2233_Mk2=TSM-2233 Mk2|The TSM-2233 Mk. 2 is a submarine bow sonar. It combines active detection with passive listening as part of the submarine's underwater surveillance suite.
eu_TSM_2253=TSM-2253|The flank arrays of the TSM-2253 passive sonar. Hydrophones along the submarine's hull detect radiated noise and provide bearings for underwater surveillance.
eu_TSM_2253_R=TSM-2253 Starboard|The starboard flank array of the TSM-2253 passive sonar. Hydrophones along the submarine's hull detect radiated noise and provide bearings for underwater surveillance.
eu_TSM_2253_L=TSM-2253 Port|The port flank array of the TSM-2253 passive sonar. Hydrophones along the submarine's hull detect radiated noise and provide bearings for underwater surveillance.
