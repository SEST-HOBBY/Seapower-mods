eu_Type_2065=Type 2065|The Type 2065 is an advanced towed array designed and manufactured by Thales.
eu_Type_2087=Type 2087|The Type 2087 is the Royal Navy version of the Thales CAPTAS-4 low-frequency active/passive variable-depth sonar. Fitted to the anti-submarine warfare variants of the Type 23 frigate, it combines a variable-depth active source with a long passive towed array for detecting, classifying and tracking submarines at considerable range. By operating below the thermal layer, it provides substantially greater detection performance than a conventional hull-mounted sonar and can exploit first- and second-convergence-zone propagation under suitable deep-water conditions.

