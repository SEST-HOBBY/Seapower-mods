eu_SharpEye_S=SharpEye S-band|A solid-state S-band navigation radar for wide-area surface awareness in adverse weather. Longer wavelength improves performance through rain and sea clutter compared with X-band. The radar supports ARPA and picture sharing with bridge and combat systems. It complements the X-band set for a stable long-range surface plot. It is not intended for fire control or missile guidance.
