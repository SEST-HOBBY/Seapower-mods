eu_mlg_27=MLG 27mm|Marine-Leicht-Geschütz 27mm|The MLG 27 is a remotely operated, fully automatic naval gun system developed by Rheinmetall. It features a 27mm caliber cannon, designed for close-range defense against aerial, surface, and asymmetric threats, offering high precision and rapid fire capability.
eu_SeaSnake_27mm=SeaSnake 27mm|SeaSnake 27mm|A remotely operated 27 mm naval gun system derived from Rheinmetall's Mauser BK-27 revolver cannon. The lightweight stabilized mount provides rapid, accurate fire against small surface threats, drones and close-range aerial targets, making it suitable as a modern replacement for older MLG 27 installations.
eu_SeaSnake_30mm=SeaSnake 30mm|SeaSnake 30mm|A remotely operated 30 mm naval gun system for close-range defense against small craft and aerial targets. A stabilized mount and high rate of fire enable accurate bursts while maneuvering. It can be used as an inner-layer point-defense system depending on doctrine.
