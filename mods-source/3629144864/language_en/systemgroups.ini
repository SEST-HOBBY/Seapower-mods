eu_EDO-700E=EDO-700E|The EDO-700 series was developed by EDO Corporation as a towed/variable-depth active sonar used for anti-submarine warfare (ASW). Instead of being mounted in the ship’s bow like a hull sonar, the transducer is lowered into the water on a cable from the stern, allowing the operator to change the operating depth.
eu_CSU-83/1=CSU-83/1|The CSU-83/1 is a submarine hull-sonar installation. Active search and passive listening provide underwater-contact information for navigation, surveillance and torpedo fire control.
eu_CSU-83/13=CSU-83/13|The CSU-83/13 is a submarine hull-sonar installation. Active search and passive listening provide underwater-contact information for navigation, surveillance and torpedo fire control.

#-------------------------------------- ESM ---------------------------------------
#--------- ELINT ----------
eu_MageDefensorMK3_ESM=Mage Defensor Mk. 3|The MAGE Defensor MK3 is the latest generation of indigenous Brazilian Electronic Support Measures (ESM) systems, developed by the Brazilian Navy's Research Institute (IPqM) and manufactured by Omnisys (a Thales Group subsidiary). Functioning as a passive sensor for electronic warfare, it is designed to detect, intercept, and analyze electromagnetic signals from enemy radars in the 2 to 18 GHz frequency range, allowing a ship to identify and categorize threats without revealing its own position. As a centerpiece of Brazil's technological independence in defense, the MK3 represents a major upgrade over the previous ET/SLR-1 version and is the primary electronic warfare sensor designated for the new Tamandaré-class frigates.
eu_ET/SLR-1_ESM=ET/SLR-1|The ET/SLR-1 "Defensor" is a Brazilian-designed Electronic Support Measures (ESM) system developed by the Navy's Research Institute (IPqM) and Omnisys to provide surface ships with passive situational awareness by intercepting and analyzing enemy radar emissions. Operating across a wide frequency spectrum (typically 2 to 18 GHz), it allows a vessel to detect, identify, and track the bearing of incoming threats—such as anti-ship missile seekers or maritime patrol aircraft—well before the ship itself is detected by those same radars. This "silent" sensor is a foundational piece of the Niterói-class frigate modernization (ModFrag) and the Inhaúma-class corvettes, serving as the "ears" of the ship's electronic warfare suite by feeding critical data to the ET/SLQ-1 jamming system for a coordinated defensive response.
eu_DR-3000U=DR-3000U|The DR-3000U (French designation ARUR-13) is a high-sensitivity Radar Electronic Support Measures (RESM) system developed by Thales, specifically designed for integration into submarines. It serves as a tactical "ear" for the vessel, capable of detecting, intercepting, and identifying radar emissions across the D-to-K frequency bands while the submarine is at periscope depth or on the surface. Notable for its lightweight design (roughly half the weight of its predecessor, the DR-2000U), the system uses an artificial intelligence-based "expert system" to automatically de-interleave and identify up to 256 simultaneous radar pulses, providing the crew with critical early warning of airborne or surface-based threats.
eu_DR-4000U=DR-4000U|The DR-4000U (French designation ARUR-14) is an advanced, high-performance Radar Electronic Support Measures (RESM) system developed by Thales for modern submarines, serving as a more powerful and technologically evolved sibling to the DR-3000U. It is a wideband digital interception system that provides 360° situational awareness by detecting, identifying, and precisely locating radar emissions from the C through J bands (0.5 to 18 GHz). Engineered to handle the extremely "noisy" and dense electromagnetic environments of modern littoral waters, the DR-4000U uses high-speed digital signal processing and artificial intelligence to distinguish between common navigation radars and lethal threats—such as low-probability-of-intercept (LPI) radars or airborne search sensors—while the submarine remains stealthily at periscope depth.
eu_AR-900=AR-900|The AR-900 is a wideband Electronic Support Measures (ESM) and Signals Intelligence (SIGINT) system originally developed by ARGOSystems (later part of Boeing and L3Harris) and often integrated into larger electronic warfare suites like the APECS III. It is primarily used for the automated detection, location, and identification of complex radar emitters across the 2 to 18 GHz frequency range (E to J bands), offering a 100% probability of intercept in dense electromagnetic environments. The system is highly versatile and found on multiple high-value platforms, including the E-3 AWACS (where it serves as the basis for the AYR-1 ESM suite) and various naval vessels, where it uses digital instantaneous frequency measurement (DIFM) and precision monopulse direction-finding to identify up to 500 signals per second with an accuracy of roughly 2° RMS.

