### US Navy items to be fixed and removed, double check if not needed anymore ####
MK 41=MK 41 VLS|Originally designed for use with the Aegis Combat System, requirements grew to include TLAM, TASM, and an assortment of other weapons. Missiles are pre-loaded canisters, which are then placed into up-right missile cells. Modules come in 8-cell blocks, with specialized "Strikedown" modules losing three cells for a non-functional reloading crane. The MK 41 offers increased flexibility, reliability, and rate of fire compared to traditional arm launchers.

SPY-1D=SPY-1D|The AN/SPY-1D is a long range 3D passive electronically scanned array and is a key component of the AEGIS combat system. Four distributed, computer-controlled antennae are used to provide a continous 360-degree coverage of the airspace around the ship. The "D" variant has a greater output power, more optimized computer driver for the individual modules, and over double the duty cycle (what fraction of time each module is actually operating per second) for dramatically better performance against all targets, especially at range or under jamming.

SPY-1D(V)=SPY-1D (V)|The SPY-1D (V) is a long range 3D passive electronically scanned array and is a key component of the AEGIS combat system. Four distributed, computer-controlled antennae are used to provide a continous 360-degree coverage of the airspace around the ship. The (V) variant of the SPY-1D has a digital MTI mode, allowing for easy tracking of both sea skimming and surface targets with no downsides, alongside further noise rejection features to improve range and performance.

SPY-1D(BMD)=SPY-1D (BMD)|The SPY-1D (BMD) is a long range 3D passive electronically scanned array and is a key component of the AEGIS combat system. Four distributed, computer-controlled antennae are used to provide a continous 360-degree coverage of the airspace around the ship. The BMD upgrade for SPY-1D (V) includes a major update to how the AEGIS weapons system handles the radar for high elevation/altitude tracking and sea skimming target tracking, and increases the maximum effective range and altitude ceiling for the radar to include targets in space at extreme range.

MK15A=Phalanx Blk-1|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1 upgrade expands ammo capacity by 50%, fire rate by 50%, increases the maximum elevation of the gun, improves the radar, and increases system performance against high-speed threats, although it still is deficient against sea-skimming supersonic maneuvering anti ship missiles.\n\nFrom Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.

MK15B=Phalanx Blk-1A|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1A model improves accuracy by a high degree through software upgrades, which makes it effective against supersonic sea-skimming missiles with terminal maneuvers.\n\nFrom Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.

MK15C=Phalanx Blk-1B|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1B model adds a FLIR and television camera to the side for increased performance against small, maneuvering sea targets, and improves capabilities against very low observable (VLO) targets such as stealthy missiles.\n\nFrom Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.

#--------------------------------------- Sonar ---------------------------------------

SQS-53C=SQS-53C|Highly upgraded and digitized version of the SQS-53B with newer physical sonar assembly for greater sensitivity and higher accuracy using bottom-bounce and convergence-zone modes, alongside better capabilities against fast, deep-diving submarines.

#-------------------------------------Towed Sonar -------------------------------------

AN/SQR-19=AN/SQR-19|The AN/SQR-19 Tactical Towed Array SONAR (TACTAS) is a passive towed array used for very long-range detection of enemy submarines. Being towed far behind the ship, interference from own-ship noise is minimized.

#-------------------------------------- ESM ---------------------------------------

AN/SLQ-32_RWR=AN/SLQ-32(V1) RWR|The AN/SLQ-32(v)1 electronic warfare suite detects enemy missile seekers and targeting radars, providing a missile warning capability.

AN/SLQ-32_ESM=AN/SLQ-32(V) ESM|The AN/SLQ-32(v)2 and (v)3 electronic warfare suites retain the missile warning capability of (v)1 but adds the ability to detect surface-search and early warning radars.

AN/SLQ-32A_ESM=AN/SLQ-32A(V) ESM|The AN/SLQ-32A(v)2 and (v)3 electronic warfare suites retain the missile warning capability of (v)1 but adds the ability to detect surface-search and early warning radars.\n\nThe SLQ-32A is an upgraded module for ships to have improved missile warning for a greater variety of threats at longer ranges than before

AN/SLQ-32=AN/SLQ-32(V3) ECM|The AN/SLQ-32(v)3 is the primary shipboard ECM in use by U.S. Navy ships. This system is used to jam enemy radars to reduce their tracking performance, and also controls chaff.

AN/SLQ-32(V5)=AN/SLQ-32(V5) ECM|The AN/SLQ-32(v)5 Sidekick system is a bolt-on deceptive jammer system used on lighter SLQ-32(V)2 systems that cannot support the full weight and power of the V3 system, and is primarily used on FFGs after the 1989 USS Stark incident.As it has only low power modes, this ECM system cannot effectively perform offensive noise jamming to blind radars, and must rely on deceptive jamming to soft-kill incoming threats.

AN/SLQ-32A=AN/SLQ-32A(V3) ECM|The AN/SLQ-32A(v)3 is the primary shipboard ECM in use by U.S. Navy ships. This system is used to jam enemy radars to reduce their tracking performance, and also controls chaff.\n\nThe SLQ-32A is an upgraded module for ships to have enhanced electronic warfare capabilities, both with noise and deception jamming modes, and increases effective output of the system through redesigned antennas to effectively counter modern antiship missile threats.
Active_Intercept_Warning=Active Intercept Warning|An all-direction sonar receiver that can pick up active sonar pings from any angle, and allows submarines to detect active sonar pings from the baffles, where normal active/passive sonar cannot hear.

