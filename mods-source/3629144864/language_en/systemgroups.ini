eu_SPS-768=MM/SPS-768|The MM/SPS-768 is an Italian long-range air search radar with modern solid-state electronics and fully digital processing capability. It was first introduced in the late 1960s and is in use on the largest surface combattants of the Italian navy.
eu_SPS-774=MM/SPS-774|The MM/SPS-774 is an Italian medium-range combined air and surface search radar designed for use on frigate- and corvette-sized ships. It is a fully digital system with modern solid-state electronics which was first introduced in the mid 1970s.
