eu_MK15A=Phalanx Blk-1|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1 upgrade expands ammo capacity by 50%, fire rate by 50%, increases the maximum elevation of the gun, improves the radar, and increases system performance against high-speed threats, although it still is deficient against sea-skimming supersonic maneuvering anti ship missiles.\n\nFrom Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.
eu_MK15B=Phalanx Blk-1A|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1A model improves accuracy by a high degree through software upgrades, which makes it effective against supersonic sea-skimming missiles with terminal maneuvers.\n\nFrom Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.
eu_MK15C=Phalanx Blk-1B|20mm Mk 15 Phalanx CIWS|The Phalanx CIWS is an American fully-automated close in weapons system (CIWS) consisting of a 20mm rotary cannon and a fire-control radar acquisition and tracking radar. The Block 1B model adds a FLIR and television camera to the side for increased performance against small, maneuvering sea targets, and improves capabilities against very low observable (VLO) targets such as stealthy missiles.\n\nFrom Block 1 onwards there is also a rapid casette reloading system that improves the reload time from 15-30 minutes to 2-4 minutes.

