#======================================== Brazil ========================================
#-------------------------------------- Visual ---------------------------------------
#-------------------------------------- Radar ---------------------------------------
#---Air/Air&Surface----
eu_RAN20S=RAN-20S|The RAN-20S (also known as the MM/SPS-702) is a medium-range, 2D air and surface surveillance radar developed by Leonardo (formerly Selenia/Alenia) that operates in the S-band and is primarily used on medium-sized warships like frigates and corvettes. Known for its reliability in hostile electronic environments, it features a dual-beam antenna (high and low beams) to provide simultaneous coverage for high-altitude air threats and sea-skimming missiles, with an instrumented range of approximately 150 nautical miles (≈278 km). It is widely recognized for its service on the Brazilian Niterói-class frigates and the Italian Maestrale-class, where it serves as a critical sensor for target acquisition and situational awareness.

#---Surface only----

#---Submarines------
eu_CalypsoIII=Calypso III DRUA 33B|The Calypso III (also designated as DRUA 33B) is a vintage French surface search and navigation radar series developed by Thomson-CSF (now Thales) specifically for submarines. Designed to operate effectively in high-clutter marine environments, it serves as the primary sensor for surface surveillance while a submarine is surfaced or at periscope depth. The system is driven by a magnetron and features multiple operational modes—including continuous scan, sectoral, and short "burst" transmissions (0.1 or 1 second)—to minimize the submarine's own electronic signature and reduce the risk of detection by enemy Electronic Support Measures (ESM).
eu_ScanterMIL24X=Scanter MIL 24X|The SCANTER MIL 24X is a high-resolution, X-band naval surveillance radar developed by Terma, designed to bridge the gap between standard commercial navigation radars and high-end military surveillance systems. It is engineered for "small target detection," making it exceptionally capable of spotting low-signature threats like jet skis, RHIBs, and even small drones in heavy seas and foul weather. Operating as a solid-state, 2D coherent radar, it provides simultaneous surface surveillance, short-range air tracking (up to 15–20 nautical miles), and helicopter approach control, and is frequently integrated into the bridge systems of offshore patrol vessels (OPVs), corvettes, and frigates worldwide.

#-------------------------------------- Aircraft Radar ---------------------------------------
#---Air/Air&Surface----
bra_Grifo-F=Grifo-F|The Grifo-F is a specialized, multi-mode pulse-Doppler fire-control radar developed by Leonardo, specifically optimized to fit the constrained nose profile of the Northrop F-5E/F Tiger II fighter. Part of the highly successful Grifo family, it features a unique elliptical antenna and a modular, air-cooled design that allows for advanced air-to-air and air-to-surface capabilities—including Track-While-Scan (TWS) of up to 10 targets, high-resolution SAR mapping, and support for Beyond-Visual-Range (BVR) missiles—making it the cornerstone of F-5 modernization programs for the Brazilian and Singaporean Air Forces.
eu_SeaSpray5000E=SeaSpray 5000E|The SeaSpray 5000E is a compact, lightweight Active Electronically Scanned Array (AESA) multi-mode radar developed by Leonardo, designed primarily for maritime and overland surveillance on helicopters, fixed-wing aircraft, and UAVs. Weighing roughly 45 kg, it excels at detecting small targets—such as submarine periscopes or small boats in heavy seas—at ranges up to 200 nautical miles (approx 370km) by using electronic beam steering rather than a mechanical dish. Its sophisticated software suite supports high-resolution imaging through ISAR and SAR modes, allowing operators to identify specific ship classes or map terrain while simultaneously tracking moving targets on land or sea.
#---Surface only----

#-------------------------------------- Sonar  ----------------------------------------
#---------- Surface -----------
eu_EDO-610E=EDO-610E|The EDO‑610E hull sonar is a hull-mounted active/passive sonar system developed by EDO Corporation for naval vessels. It is used primarily for anti-submarine warfare (ASW) to detect, track, and classify submarines and underwater contacts.
eu_EDO-997=EDO-997|The EDO-997 (currently L3Harris Model 997 or SONAT MkII) is a high-performance active hull-mounted sonar used by the Brazilian Navy. Designed for the detection, tracking, and classification of underwater targets, the system equips the Niterói-class frigates and the Barroso corvette, and is undergoing modernization upgrades.
eu_TSM_2233_Mk2=TSM-2233 Mk2
eu_TSM-2253=TSM-2253
eu_TSM-2253_L=TSM-2253
eu_TSM-2253-R=TSM-2253
#---- Towed/VDS -----
eu_EDO-700E=EDO-700E|The EDO-700 series was developed by EDO Corporation as a towed/variable-depth active sonar used for anti-submarine warfare (ASW). Instead of being mounted in the ship’s bow like a hull sonar, the transducer is lowered into the water on a cable from the stern, allowing the operator to change the operating depth.

#-------------------------------------- ESM ---------------------------------------
#--------- ELINT ----------
eu_MageDefensorMK3_ESM=Mage Defensor Mk. 3|The MAGE Defensor MK3 is the latest generation of indigenous Brazilian Electronic Support Measures (ESM) systems, developed by the Brazilian Navy's Research Institute (IPqM) and manufactured by Omnisys (a Thales Group subsidiary). Functioning as a passive sensor for electronic warfare, it is designed to detect, intercept, and analyze electromagnetic signals from enemy radars in the 2 to 18 GHz frequency range, allowing a ship to identify and categorize threats without revealing its own position. As a centerpiece of Brazil's technological independence in defense, the MK3 represents a major upgrade over the previous ET/SLR-1 version and is the primary electronic warfare sensor designated for the new Tamandaré-class frigates.
eu_ET/SLR-1_ESM=ET/SLR-1|The ET/SLR-1 "Defensor" is a Brazilian-designed Electronic Support Measures (ESM) system developed by the Navy's Research Institute (IPqM) and Omnisys to provide surface ships with passive situational awareness by intercepting and analyzing enemy radar emissions. Operating across a wide frequency spectrum (typically 2 to 18 GHz), it allows a vessel to detect, identify, and track the bearing of incoming threats—such as anti-ship missile seekers or maritime patrol aircraft—well before the ship itself is detected by those same radars. This "silent" sensor is a foundational piece of the Niterói-class frigate modernization (ModFrag) and the Inhaúma-class corvettes, serving as the "ears" of the ship's electronic warfare suite by feeding critical data to the ET/SLQ-1 jamming system for a coordinated defensive response.
eu_DR-3000U=DR-3000U|The DR-3000U (French designation ARUR-13) is a high-sensitivity Radar Electronic Support Measures (RESM) system developed by Thales, specifically designed for integration into submarines. It serves as a tactical "ear" for the vessel, capable of detecting, intercepting, and identifying radar emissions across the D-to-K frequency bands while the submarine is at periscope depth or on the surface. Notable for its lightweight design (roughly half the weight of its predecessor, the DR-2000U), the system uses an artificial intelligence-based "expert system" to automatically de-interleave and identify up to 256 simultaneous radar pulses, providing the crew with critical early warning of airborne or surface-based threats.
eu_DR-4000U=DR-4000U|The DR-4000U (French designation ARUR-14) is an advanced, high-performance Radar Electronic Support Measures (RESM) system developed by Thales for modern submarines, serving as a more powerful and technologically evolved sibling to the DR-3000U. It is a wideband digital interception system that provides 360° situational awareness by detecting, identifying, and precisely locating radar emissions from the C through J bands (0.5 to 18 GHz). Engineered to handle the extremely "noisy" and dense electromagnetic environments of modern littoral waters, the DR-4000U uses high-speed digital signal processing and artificial intelligence to distinguish between common navigation radars and lethal threats—such as low-probability-of-intercept (LPI) radars or airborne search sensors—while the submarine remains stealthily at periscope depth.
eu_AR-900=AR-900|The AR-900 is a wideband Electronic Support Measures (ESM) and Signals Intelligence (SIGINT) system originally developed by ARGOSystems (later part of Boeing and L3Harris) and often integrated into larger electronic warfare suites like the APECS III. It is primarily used for the automated detection, location, and identification of complex radar emitters across the 2 to 18 GHz frequency range (E to J bands), offering a 100% probability of intercept in dense electromagnetic environments. The system is highly versatile and found on multiple high-value platforms, including the E-3 AWACS (where it serves as the basis for the AYR-1 ESM suite) and various naval vessels, where it uses digital instantaneous frequency measurement (DIFM) and precision monopulse direction-finding to identify up to 500 signals per second with an accuracy of roughly 2° RMS.

#-------------------------------------- ECM ---------------------------------------
eu_ET/SLQ-1_ECM=ET/SLQ-1|The ET/SLQ-1 is an indigenous Brazilian Electronic Countermeasures (ECM) system developed by the Brazilian Navy's Research Institute (IPqM) and Elebra (later integrated into the national defense industry) to provide active radar jamming and protection for surface combatants. Often paired with the ET/SLR-1 "Defensor" ESM receiver to form a complete electronic warfare suite, it is designed to neutralize enemy surveillance and fire-control radars by emitting interfering signals that "blind" or deceive incoming threats. Most notably installed as a modernization upgrade on the Niterói-class frigates and the Inhaúma-class corvettes, the ET/SLQ-1 represented a major step in Brazil’s effort to replace aging foreign systems (like the British Racal Cygnus) with sovereign technology.


