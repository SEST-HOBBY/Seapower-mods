eu_stir180=STIR 1.8|A radar and electro-optical fire-control director with precision tracking capability. The director can provide continuous-wave illumination for semi-active missiles such as ESSM Blk 1 or SM-2 MR. It also supports gun fire control when high accuracy is required against air or surface targets. The optical sensors offer passive tracking when radar emissions are constrained. Tracks from surveillance radars are handed over for terminal engagement. The director is typically mounted on elevated platforms for clear arcs.
