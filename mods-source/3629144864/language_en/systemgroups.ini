eu_Atlas_9600M_ARPA_X=Atlas 9600-M ARPA|STN Atlas 9600-M ARPA is an older I/J-band naval navigation radar used on the German F124 Sachsen-class. It provides local surface search, collision avoidance and automatic radar plotting for bridge navigation, but is not a combat air-search or fire-control radar.

#-------------------------------------- Sonar ---------------------------------------
#---------- Surface -----------
eu_DSQS_23BZ=DSQS-23BZ|The DSQS-23BZ is a German STN ATLAS bow-mounted active/passive hull sonar fitted to the Brandenburg-class F123 frigates. It provides medium-frequency submarine search, local tracking and torpedo-attack support, forming the ship's primary organic underwater sensor before the addition of later towed or variable-depth systems. It is a capable 1990s hull sonar, below later systems such as DSQS-24C, ASO 713/723 or M670.
eu_DSQS-21BZ-M=DSQS-23BZ-M|The DSQS-21BZ-M is an ATLAS Elektronik bow-mounted active/passive hull sonar fitted to South Korean KDX-III destroyers. It belongs to the DSQS-21 / ASO 83-86 medium-frequency sonar family and provides local submarine search, tracking and attack support. It is a modernized medium-frequency hull sonar with about 30 km / 16 nm public maximum range, below larger blue-water sonars such as SQS-53C but clearly stronger than older light hull sonars.
eu_ASO_713=ASO 713|An Atlas Elektronik 4th-generation medium-frequency hull-mounted sonar for anti-submarine warfare. It supports active and passive search, classification, and tracking, optimized for demanding littoral conditions with high reverberation and shipping noise. The sonar contributes to the ship’s local underwater picture and can be fused with towed arrays and airborne sonars for prosecution and weapon cueing. Performance depends on ocean environment and platform radiated noise.
eu_ASO_723=ASO 723|An Atlas Elektronik 4th-generation medium-frequency hull-mounted sonar positioned as a higher-capability variant within the ASO family. It supports active and passive search, classification, and tracking with improved performance in complex acoustic environments, including shallow water and high-clutter scenarios. The system integrates into the ship’s ASW suite to provide continuous close-to-medium range coverage and cue shipborne and airborne ASW assets. Performance depends on ocean environment and platform radiated noise.
eu_dsqs-24b=DSQS-24B|The STN ATLAS DSQS-24B is the bow-mounted active/passive sonar of the German Sachsen class and is closely associated with the ATLAS ASO 95 designation. Its large 1.88 m cylindrical array forms multiple electronically steered and stabilized beams for submarine search, tracking and attack support. The sonar operates over 6-9 kHz in active mode and 2-11 kHz in passive mode. Exact real-world detection ranges remain classified.
eu_ASO_95=ASO 95|ASO 95 is the ATLAS product designation associated with the DSQS-24B sonar fitted to the German Sachsen class. Its 1.88 m cylindrical array provides greater aperture and directivity than the more compact ASO 94 family and supports active and passive anti-submarine search, classification and tracking. This mod entry is acoustically identical to DSQS-24B and is provided as an alternate designation.
eu_dsqs-24c=DSQS-24C|The STN ATLAS DSQS-24C is a medium-frequency active/passive hull-mounted search and attack sonar fitted to the Royal Netherlands Navy's De Zeven Provincien class. It was developed from the DSQS-24B generation with increased digital processing capability but uses a more compact array installation. It provides submarine detection, classification and tracking in difficult littoral acoustic conditions. Exact array and detection-performance details are not publicly available.
eu_ASO_94=ASO 94|ASO 94 is an ATLAS medium-frequency active/passive hull-sonar family for frigates and corvettes. It provides submarine search, classification and tracking from a compact bow or keel-mounted array and represents the smaller-aperture branch of the same general ATLAS generation as the DSQS-24 series. Customer installations and suffix variants differ in hardware and processing, so this generic entry represents a full-size baseline ASO 94 installation.
eu_ASO_94-01=ASO 94-01|The ATLAS ASO 94-01 is the medium-frequency active/passive hull sonar fitted to the Danish Absalon and Iver Huitfeldt classes. Public sources describe active operation from 6 to 9 kHz and passive reception from approximately 2 to 11 kHz, with simultaneous active and passive processing. The compact array provides submarine search and attack support while also supporting passive classification and self-protection functions.
eu_ASO_94-FS=ASO 94-FS|ASO94-FS is the official Danish service designation used for the ATLAS ASO 94 sonar system maintained by the Danish Defence Acquisition and Logistics Organisation. Public procurement material confirms the designation but does not establish a separate acoustic configuration from the Danish ASO 94 installation. It is therefore modelled identically to ASO 94-01 in this mod.
eu_ASO_94-2=ASO 94-2|The ATLAS ASO 94-2 is an active/passive hull-mounted sonar operated by the Bangladesh Navy. Public documentation confirms passive classification functions including LOFAR and DEMON processing, while technical academic material describes a listening channel extending from very low frequencies up to 5 kHz. Its exact active carrier frequency, array dimensions and detection ranges are not public, so those parameters are conservatively estimated in this mod.
eu_ASO_94-41=ASO 94-41|The ATLAS ASO 94-41 is a compact hull-mounted active search and attack sonar fitted to the Malaysian Laksamana-class missile corvettes. It provides organic anti-submarine detection and attack support from a much smaller platform than the frigate-sized ASO 94 installations. Detailed acoustic specifications are not publicly available; its reduced range, gain and resolution in this mod are therefore based on the compact installation rather than published performance figures.
eu_TRAPS=Elbit TRAPS|Elbit TRAPS is a compact active/passive variable-depth sonar developed by GeoSpectrum Technologies and marketed by Elbit Systems. It combines a reelable low-frequency active source with a directional passive receive array and is designed for frigates, corvettes and patrol vessels with limited space. Public data claims detection beyond the second convergence zone, giving it a maximum favourable-condition range of about 150 km / 81 nm. The system can use up to about 650 m of tow cable and current data lists an operating depth of up to 300 m.
eu_M670=Elbit M670|The M670 HMS is a modern low-/medium-frequency hull-mounted sonar by GeoSpectrum Technologies / Elbit Systems. It provides 360-degree active and passive detection, classification and tracking of submarines, torpedoes and mine-like objects. With performance described as beyond the first convergence zone, a realistic maximum active range is about 65 km / 35 nm in favourable acoustic conditions. It is best represented as a compact modern hull sonar rather than a full towed-array system.

#---- Towed/VDS -----
eu_TAS-3=TAS-3|The TAS-3 is the passive low-frequency towed array sonar of the Type 212A submarine. Deployed from the sail area, it provides long-range passive detection and classification of ships and submarines while keeping the array away from the boat's own machinery and flow noise.
eu_ACTAS=ACTAS|

#--------- Submarines ----------
eu_DSQS-21DG=DSQS-21DG|The DSQS-21DG is the medium-frequency bow sonar component of the ATLAS CSU 90 / DBQS-40FTC submarine sonar suite fitted to Type 212A submarines. It provides active and passive forward-sector search, contact tracking and attack support, while the flank arrays and towed array provide wider passive coverage.
eu_FAS-3-1=FAS 3-1|The FAS-3-1 is the passive low- and medium-frequency flank array sonar of the Type 212A submarine's CSU 90 / DBQS-40FTC sonar suite. Mounted along the hull, it provides broad passive bearing coverage and acoustic classification support without exposing the submarine through active transmissions.
eu_FAS-3-1_R=FAS 3-1|The FAS-3-1 is the passive low- and medium-frequency flank array sonar of the Type 212A submarine's CSU 90 / DBQS-40FTC sonar suite. Mounted along the hull, it provides broad passive bearing coverage and acoustic classification support without exposing the submarine through active transmissions.
eu_FAS-3-1_L=FAS 3-1|The FAS-3-1 is the passive low- and medium-frequency flank array sonar of the Type 212A submarine's CSU 90 / DBQS-40FTC sonar suite. Mounted along the hull, it provides broad passive bearing coverage and acoustic classification support without exposing the submarine through active transmissions.
eu_EFAS=EFAS|The Expanded Flank Array Sonar, is an improved passive flank array sonar associated with later Type 212A upgrades and ISUS-equipped boats. It replaces or improves upon the earlier FAS-3 flank array with greater aperture, improved processing and longer passive detection ranges.
eu_MOA-3070=MOA-3070|The MOA 3070 is the mine and obstacle avoidance sonar of the Type 212A submarine's CSU 90 / DBQS-40FTC sonar suite. It is used for short-range high-resolution detection of mines, obstacles and close underwater hazards, especially in shallow or confined waters.It is a short-range active safety and mine-avoidance sonar rather than a long-range ASW sensor.
eu_AN_5039_A1=AN5039A1|The AN5039A1 is the active sonar intercept component of the Type 212A submarine's CSU 90 / DBQS-40FTC sonar suite. It passively detects, warns and localizes hostile active sonar transmissions, including ship, submarine, helicopter dipping sonar and torpedo seeker emissions. It is an active-intercept sensor, not as a general-purpose search sonar.

#-------------------------------------- ESM ---------------------------------------
#--------- ELINT ----------
eu_FL-1800U_ESM=FL-1800U|
eu_FL-1800S_ESM=FL-1800S ESM|A legacy electronic support suite that passively intercepts radar emissions for situational awareness. It measures bearing and characterizes emitters to support threat warning and basic identification. The system contributes to bearings-only localization and complements the ship radar picture. It has no transmission function and therefore does not reveal ownship by itself. Data is typically displayed on the EW console and can be forwarded to the CMS. Performance depends on emitter strength, geometry, and environment.
eu_FL_1800_S_II_ESM=FL-1800S  II|The FL-1800S II is a German naval electronic warfare system that detects and jams radar signals across 0.5–18 GHz. It provides 360° coverage, precise threat tracking, and targeted jamming to protect ships from electronic and radar-guided threats.
eu_UL5000K_ESM=UL5000K ESM|A shipboard electronic support suite used on K130 to passively intercept and classify radar emitters. It provides bearing, parameters, and threat alerts to the combat system for situational awareness. Bearings over time can assist in localization and cue soft-kill responses. The system is optimized for littoral operations with high clutter and reflections. As a passive sensor it preserves emissions control.
eu_KORA-18_ESM=KORA-18 ESM|A mid-generation digital ESM covering VHF through Ku bands for passive intercept. It provides bearing, signal parameters, and basic classification of radar and some comms emitters. Bearings can be used for threat warning and for bearings-only localization when combined over time. The system feeds the combat system with emitter tracks to enrich the tactical picture. It is particularly valuable in coastal clutter where radar line-of-sight is limited. As a passive sensor, it does not radiate and preserves emissions control.
eu_KORA-40_ESM=KORA-40|A modern digital ESM with wideband receivers and precise direction finding for radar intercept. It classifies emitters via a threat library and provides cues to the combat system and soft-kill suite. The system supports bearings-only target motion analysis to refine contact positions over time. It operates passively and is well suited to contested littoral environments. Data can be shared with allied units to build a common electronic order of battle. It does not provide jamming by itself.

#-------------------------------------- ECM ---------------------------------------
eu_C303S_active_jammer=C303S|
eu_FL-1800S_ECM=FL-1800S ECM|An electronic countermeasures set that radiates jamming or deceptive techniques for ship self protection. It is used to break or prevent missile seeker locks and to degrade hostile surveillance radars. Techniques and power levels are selected according to the threat and rules of engagement. The system is coordinated with decoy launchers to create combined soft-kill effects. Because it transmits, it may reveal ownship if used outside engagement conditions. It is managed by the EW console and follows doctrine-based fire rules.
eu_FL_1800_S_II_ECM=FL-1800S II ECM|FL 1800 S II is a German naval electronic warfare system that detects and jams radar signals across 0.5–18 GHz. It provides 360° coverage, precise threat tracking, and targeted jamming to protect ships from electronic and radar-guided threats.
eu_UL5000K_ECM=UL5000K ECM|A self-protection electronic attack suite providing noise and deceptive techniques against hostile radars and seekers. It is coordinated with decoy launchers to create screening and seduction effects. Emissions are doctrine-controlled to limit ownship exposure and HOJ risks. The suite is intended for close-to-medium-range escort/self-protection, not wide-area standoff jamming. It complements, but does not replace, hard-kill defenses.
eu_VIRGILIUS_R-ECM=VIRGILIUS R-ECM|VIRGILIUS provides the active radar-band countermeasures layer for the KORA 40 electronic-warfare suite. Using distributed ECM transmitters and combat-system cueing, it can apply timed deception, noise and seduction techniques against hostile fire-control radars, missile seekers and targeting emitters, with strongest effect in the ship’s self-defence and task-group escort sectors.


