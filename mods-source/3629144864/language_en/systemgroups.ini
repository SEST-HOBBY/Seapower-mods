eu_SeaGiraffe_4A=Sea Giraffe 4A|An S-band AESA 3D multi-function radar designed for area surveillance and weapon cueing. Electronic beam steering enables high track capacity and rapid refresh in complex air pictures. S-band offers better weather and clutter penetration than X-band, aiding long-range surveillance. The rotating array with electronic beams combines mechanical coverage with agile waveform control and ECCM. The radar feeds high-quality tracks to the combat system for air and surface engagements. It does not provide continuous-wave illumination.

eu_SeaGiraffe_4A_NR=Sea Giraffe 4A|Sea Giraffe 4A in its non-rotating configuration uses four fixed active arrays. It provides continuous three-dimensional air surveillance and surface tracking around the ship.
eu_SeaGiraffe_1X=Sea Giraffe 1X|A compact X-band AESA 3D multi-mode radar for simultaneous air and surface surveillance. Electronic beam steering provides fast updates and good performance against sea-skimming and small cross-section targets. The radar supplies stabilized 3D tracks to the combat system for cueing of weapons and decoys. Its X-band operation yields fine angular resolution in the littoral environment. The antenna is light and suited for smaller masts and patrol craft. It is not a dedicated fire-control illuminator and does not replace a director.
eu_SeaGiraffe_AMB_3D=Sea Giraffe AMB|Sea Giraffe AMB is a three-dimensional naval surveillance radar. Its agile multi-beam operation provides rapid updates on aircraft, missiles and surface contacts.

#---Fire Control----
eu_CEROS-200=CEROS-200|A radar and electro-optical director. It provides high-precision target tracking for gun engagements. The system offers good resistance to countermeasures using agile waveforms and narrow beams. Electro-optical sensors enable passive tracking in emission-controlled conditions. It is tightly integrated with the combat system for automatic handover and guidance. The director is optimized for point-target control rather than wide-area search.
eu_CEROS-200_CWI=CEROS-200 CWI|A radar and electro-optical director that includes a continuous-wave illumination mode. It provides high-precision target tracking for gun engagements and semi-active missile endgame guidance. The system offers good resistance to countermeasures using agile waveforms and narrow beams. Electro-optical sensors enable passive tracking in emission-controlled conditions. It is tightly integrated with the combat system for automatic handover and guidance. The director is optimized for point-target control rather than wide-area search.


