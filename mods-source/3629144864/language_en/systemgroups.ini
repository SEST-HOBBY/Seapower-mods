eu_LFAPS=LFAPS|The Ultra Maritime LFAPS (Low Frequency Active Passive Sonar) is a low-frequency variable-depth sonar system combining active search with passive detection to extend submarine detection and tracking ranges, improving performance across different thermal layers and in both deep and littoral waters.
eu_LFAPS_SeaLancer=LFAPS Sea Lancer|Sea Lancer is the passive receiving array of the LFAPS low-frequency sonar system. It listens for underwater contacts while being towed away from the ship's own noise sources.
eu_LFAPS_SeaSabre=LFAPS Sea Sabre|Sea Sabre is the active-source component of the LFAPS low-frequency sonar system. Its variable-depth transmitter is used with the receiving array to search for underwater contacts.
eu_Alto=Alto|ALTO is a passive towed sonar array. It supplements the ship's underwater picture by listening for contacts away from the hull and its machinery noise.
eu_CAPTAS=CAPTAS|CAPTAS is a low-frequency active and passive variable-depth sonar. Its towed source and receiving array support anti-submarine search beyond the coverage of a hull-mounted sonar.
eu_CAPTAS-4=CAPTAS-4|CAPTAS-4 is the four-projector member of the CAPTAS variable-depth sonar family. A low-frequency active source and passive receiving array provide long-range underwater surveillance.

