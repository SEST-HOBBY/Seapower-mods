eu_PHS-36=PHS-36|A medium-frequency hull-mounted bow sonar fitted to the Karel Doorman class. Provides active and passive underwater search for submarine and torpedo contacts, with reliable close-to-medium range performance but less reach than later low-frequency towed-array systems.
eu_SeaStar=SeaStar|A fixed-face X-band active phased-array surface surveillance radar, also known as SeaWatcher 100. Fitted during the Dutch and Belgian M-class modernisation, it automatically detects and tracks small surface contacts such as fast boats, swimmers, mines and periscopes in littoral clutter, and can also support helicopter approach guidance.
eu_APECS-II_AR-700_ESM=APECS-II AR-700|An older electronic-support suite fitted to early Karel Doorman class frigates. Detects, classifies and provides bearings to hostile radar emissions across common naval radar bands, giving the ship passive warning and targeting support without emitting.
eu_APECS-II_AR-700_ECM=APECS-II AR-700|A defensive electronic-countermeasures system associated with the early M-class EW fit. Provides soft-kill protection by attempting to degrade or confuse incoming radar-guided threats, mainly in the higher radar bands used by fire-control and missile seekers.
eu_Vigile_APX=Vigile APX|A modern Thales radar electronic-support system fitted during M-class modernisation. Provides improved passive detection, identification and bearing accuracy against contemporary naval, airborne and missile radar emitters, supporting faster threat warning and soft-kill reactions.

