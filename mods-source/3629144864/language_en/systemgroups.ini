eu_SeaSpray=Seaspray 2000|The Seaspray is a British lightweight radar developed in the late 1970s for use on shipborne helicopters, primarily to detect small missile boats which could utilize the radar horizon of a surface vessel sensors to conceal their approach. The Seaspray 2000 is an improved version of the Seaspray which introduces a pulse-doppler mode.
eu_SeaSpray5000E=SeaSpray 5000E|The SeaSpray 5000E is a compact, lightweight Active Electronically Scanned Array (AESA) multi-mode radar developed by Leonardo, designed primarily for maritime and overland surveillance on helicopters, fixed-wing aircraft, and UAVs. Weighing roughly 45 kg, it excels at detecting small targets—such as submarine periscopes or small boats in heavy seas—at ranges up to 200 nautical miles (approx 370km) by using electronic beam steering rather than a mechanical dish. Its sophisticated software suite supports high-resolution imaging through ISAR and SAR modes, allowing operators to identify specific ship classes or map terrain while simultaneously tracking moving targets on land or sea.
