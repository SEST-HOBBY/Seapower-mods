########################################################################
########################################################################
########################################################################

use Mesh=eu_8-cell_mk41_base_v4 for single packed missiles

use Mesh=eu_8-cell_mk41_base_quad_v4 for quad packed missiles

########################################################################

The meshes have small circles where the 8-cell bases have to go. Just get theyre coordinates!

Mounts avaiable:
Mesh=eu_64-cell_mk41_mount
you only have to place the 64-cell_mk41_mount_1. mk41_bases 1-8 are parented to it

Mesh=eu_32-cell_mk41_mount
use base 3-6

Mesh=eu_48-cell_mk41_mount

Mesh=eu_16-cell_mk41_mount

Mesh=eu_8-cell_mk41_mount
same position as base

