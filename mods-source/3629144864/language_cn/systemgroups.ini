[SystemNames]
### US Navy items to be fixed and removed, double check if not needed anymore ####
MK 41=MK 41 VLS|最初为宙斯盾作战系统设计，需求逐渐扩展至包括战斧对陆攻击导弹、战斧反舰导弹以及各种其他武器。导弹预先装入发射筒，然后放入垂直发射单元中。模块以8单元为一组，其中专用的"下卸"模块因安装非功能性再装填起重机而减少三个单元。与传统臂式发射器相比，MK 41提供了更高的灵活性、可靠性和射速。

SPY-1D=SPY-1D|AN/SPY-1D是一种远程3D无源电子扫描阵列雷达，是宙斯盾作战系统的关键组成部分。四个分布式计算机控制天线用于提供舰艇周围空域的连续360度覆盖。"D"变体具有更大的输出功率、更优化的各模块计算机驱动器，以及超过两倍的占空比（每个模块每秒实际工作的时间比例），从而显著提升对各种目标的性能，特别是在远距离或干扰环境下。

SPY-1D(V)=SPY-1D (V)|SPY-1D (V)是一种远程3D无源电子扫描阵列雷达，是宙斯盾作战系统的关键组成部分。四个分布式计算机控制天线用于提供舰艇周围空域的连续360度覆盖。SPY-1D的(V)变体具有数字动目标指示模式，可轻松跟踪掠海目标和海面目标而无任何缺点，同时进一步增强了噪声抑制功能以提升探测距离和性能。

SPY-1D(BMD)=SPY-1D (BMD)|SPY-1D (BMD)是一种远程3D无源电子扫描阵列雷达，是宙斯盾作战系统的关键组成部分。四个分布式计算机控制天线用于提供舰艇周围空域的连续360度覆盖。SPY-1D (V)的BMD升级包括对宙斯盾武器系统处理雷达高仰角/高度跟踪和掠海目标跟踪方式的重大更新，并将雷达的最大有效距离和高度上限提升至可在极远距离跟踪太空目标。

MK15A=Phalanx Blk-1|20mm Mk 15 Phalanx CIWS|Phalanx近防武器系统是一种美制全自动近防武器系统(CIWS)，由一门20mm转管炮和一部火控雷达搜索与跟踪雷达组成。Block 1升级将弹药容量提高50%、射速提高50%、增大火炮最大仰角、改进雷达，并提升了系统对抗高速威胁的性能，尽管其对掠海超音速机动反舰导弹仍显不足。\n\n从Block 1起还配备了快速弹箱再装填系统，将再装填时间从15-30分钟缩短至2-4分钟。

MK15B=Phalanx Blk-1A|20mm Mk 15 Phalanx CIWS|Phalanx近防武器系统是一种美制全自动近防武器系统(CIWS)，由一门20mm转管炮和一部火控雷达搜索与跟踪雷达组成。Block 1A型号通过软件升级大幅提高了精度，使其能够有效对抗具有末端机动的超音速掠海导弹。\n\n从Block 1起还配备了快速弹箱再装填系统，将再装填时间从15-30分钟缩短至2-4分钟。

MK15C=Phalanx Blk-1B|20mm Mk 15 Phalanx CIWS|Phalanx近防武器系统是一种美制全自动近防武器系统(CIWS)，由一门20mm转管炮和一部火控雷达搜索与跟踪雷达组成。Block 1B型号在侧面增加了前视红外和电视摄像机，以提升对抗小型机动海上目标的性能，并增强了对隐身导弹等极低可观测性(VLO)目标的打击能力。\n\n从Block 1起还配备了快速弹箱再装填系统，将再装填时间从15-30分钟缩短至2-4分钟。

