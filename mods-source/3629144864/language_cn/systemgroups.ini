AN/SLQ-32_RWR=AN/SLQ-32(V1) RWR|AN/SLQ-32(v)1电子战套件可探测敌方导弹导引头和目标指示雷达，提供导弹预警能力。

AN/SLQ-32_ESM=AN/SLQ-32(V) ESM|AN/SLQ-32(v)2和(v)3电子战套件保留了(v)1的导弹预警能力，但增加了探测对海搜索和早期预警雷达的能力。

AN/SLQ-32A_ESM=AN/SLQ-32A(V) ESM|AN/SLQ-32A(v)2和(v)3电子战套件保留了(v)1的导弹预警能力，但增加了探测对海搜索和早期预警雷达的能力。\n\nSLQ-32A是一款升级模块，为舰艇提供改进的导弹预警能力，能够在更远距离上应对更多种类的威胁。

AN/SLQ-32=AN/SLQ-32(V3) ECM|AN/SLQ-32(v)3是美国海军舰艇使用的主要舰载ECM系统。该系统用于干扰敌方雷达以降低其跟踪性能，同时控制箔条弹。

AN/SLQ-32(V5)=AN/SLQ-32(V5) ECM|AN/SLQ-32(v)5 Sidekick系统是一种附加式欺骗干扰系统，用于无法支持V3系统全重和功率的轻型SLQ-32(V)2系统，主要部署在1989年斯塔克号事件后的护卫舰上。由于仅具有低功率模式，此ECM系统无法有效执行进攻性噪声干扰以致盲雷达，必须依赖欺骗干扰对来袭威胁进行软杀伤。

AN/SLQ-32A=AN/SLQ-32A(V3) ECM|AN/SLQ-32A(v)3是美国海军舰艇使用的主要舰载ECM系统。该系统用于干扰敌方雷达以降低其跟踪性能，同时控制箔条弹。\n\nSLQ-32A是一款升级模块，为舰艇提供增强的电子战能力，兼具噪声和欺骗干扰模式，并通过重新设计的天线提高系统有效输出，以有效对抗现代反舰导弹威胁。

Active_Intercept_Warning=Active Intercept Warning|一种全向声呐接收器，可从任何角度接收主动声呐脉冲信号，使潜艇能够探测到从尾后盲区传来的主动声呐脉冲，而普通主动/被动声呐无法听到这些信号。

