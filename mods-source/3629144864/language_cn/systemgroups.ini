eu_RAN20S=RAN-20S|RAN-20S（也称MM/SPS-702）是一种由Leonardo（前身为Selenia/Alenia）开发的中程2D对空与对海监视雷达，工作在S波段，主要用于护卫舰和轻型护卫舰等中型战舰。以其在恶劣电子环境中的可靠性著称，采用双波束天线（高波束和低波束）同时覆盖高空空中威胁和掠海导弹，仪表探测距离约150海里（约278公里）。该雷达因在巴西尼泰罗伊级护卫舰和意大利西北风级护卫舰上的服役而广为人知，是目标获取和态势感知的关键传感器。

#---Surface only----

#---Submarines------
eu_CalypsoIII=Calypso III DRUA 33B|Calypso III（也命名为DRUA 33B）是Thomson-CSF（现Thales）专门为潜艇开发的经典法式对海搜索与导航雷达系列。设计用于在强杂波海洋环境中有效工作，是潜艇在水面或潜望镜深度时的主要对海监视传感器。该系统由磁控管驱动，具有多种工作模式——包括连续扫描、扇区扫描和短"突发"发射（0.1或1秒）——以最小化潜艇自身的电子信号特征，降低被敌方电子支援措施(ESM)探测的风险。

eu_ScanterMIL24X=Scanter MIL 24X|SCANTER MIL 24X是Terma开发的高分辨率X波段海军监视雷达，旨在弥合标准商用导航雷达与高端军用监视系统之间的差距。该雷达专为"小目标探测"而设计，能够在恶劣海况和天气条件下出色地发现水上摩托、刚性充气艇甚至小型无人机等低信号特征威胁。作为固态2D相干雷达，它同时提供对海监视、短程对空跟踪（最远15-20海里）和直升机进近引导，广泛集成于全球近海巡逻舰(OPV)、轻型护卫舰和护卫舰的舰桥系统中。

#-------------------------------------- Aircraft Radar ---------------------------------------
#---Air/Air&Surface----
bra_Grifo-F=Grifo-F|Grifo-F是由Leonardo开发的专用多模式脉冲多普勒火控雷达，专门优化以适应Northrop F-5E/F Tiger II战斗机的狭窄机头轮廓。作为极为成功的Grifo家族成员，它采用独特的椭圆天线和模块化风冷设计，具备先进的空对空和空对地能力——包括对多达10个目标的边扫描边跟踪(TWS)、高分辨率合成孔径雷达成像，以及对超视距(BVR)导弹的支持——使其成为巴西和新加坡空军F-5现代化计划的核心支柱。

eu_SeaSpray5000E=SeaSpray 5000E|SeaSpray 5000E是由Leonardo开发的紧凑型轻型有源电子扫描阵列(AESA)多模式雷达，主要用于直升机和固定翼飞机及无人机上的海上和陆上监视。重约45公斤，通过电子波束扫描而非机械天线，擅长在远达200海里（约370公里）的距离上探测小型目标——如潜艇潜望镜或波涛汹涌海面上的小艇。其复杂的软件套件通过ISAR和SAR模式支持高分辨率成像，使操作员能够在跟踪陆地或海上移动目标的同时识别特定舰船类别或绘制地形。

#---Surface only----

