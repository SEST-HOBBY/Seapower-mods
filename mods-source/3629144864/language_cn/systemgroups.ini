AN/SQR-19=AN/SQR-19|AN/SQR-19战术拖曳阵列声呐(TACTAS)是一种被动拖曳阵列，用于对敌方潜艇进行超远程探测。由于拖曳在舰艇后方远处，自身舰艇噪声的干扰被降至最低。

