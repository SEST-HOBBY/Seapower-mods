eu_SPY-5=AN/SPY-5|AN/SPY-5是一种轻型X波段相控阵雷达概念，用于精确跟踪和ESSM级火控支援。比SPY-3更小且能力更有限，具有良好的角度和距离精度，但没有主要S波段宙斯盾雷达的孔径和搜索立体范围。应作为紧凑型跟踪/火控雷达使用，而非战略性立体搜索传感器。

