eu_SPY-1A(V)=AN/SPY-1A(V)|AN/SPY-1A(V)条目代表一种现代化或服役后期SPY-1A型安装配置，相比原始早期巡洋舰雷达具有改进的信号处理和目标处理能力。保持相同的四面S波段宙斯盾基本架构，但被视为非弹道导弹防御的防空传感器，而非完全的SPY-1D(V)等效系统。

eu_SPY-1B=AN/SPY-1B|AN/SPY-1B是一种改进型SPY-1变体，用于后期提康德罗加级巡洋舰。引入了具有更低旁瓣和显著更高平均功率的改进天线，相比SPY-1A在杂波、干扰和远程舰队防空工作中性能更优。仍保留经典的宙斯盾S波段无源相控阵架构，具有四个固定阵列和连续360度覆盖。

eu_SPY-1B(V)=AN/SPY-1B(V)|AN/SPY-1B(V)是一种升级型SPY-1B配置，具有改进的处理和目标处理能力，用于服役后期宙斯盾巡洋舰。保留SPY-1B天线和高功率无源相控阵架构，但代表了针对低空、海面和杂乱近海环境的更好软件和信号处理标准。

eu_SPY-1B(BMD)=AN/SPY-1B(BMD)|AN/SPY-1B(BMD)代表一种具备弹道导弹防御升级的巡洋舰雷达安装配置。保留SPY-1B S波段无源相控阵硬件基础，但使用宙斯盾BMD处理能力和高仰角搜索/跟踪模式来处理超出正常防空高度范围的弹道导弹跟踪。在游戏术语中应视为具有扩展BMD高度上限的防空雷达，而非LRDR级传感器。

eu_SPY-1D=AN/SPY-1D|AN/SPY-1D是SPY-1家族中针对驱逐舰优化的成员，是阿利·伯克级和盟军宙斯盾舰艇的核心传感器。使用四个固定S波段无源相控阵阵列进行连续立体搜索、跟踪和导弹支援功能。与早期SPY-1A系统相比，受益于更高的平均功率、改进的模块控制和更好的整体跟踪质量。

eu_SPY-1D(V)=AN/SPY-1D(V)|AN/SPY-1D(V)是一种针对近海改进的SPY-1D变体，具有增强的动目标指示、杂波抑制和低空目标处理能力。针对掠海导弹、水面目标和密集沿岸背景进行了优化，同时保留远程宙斯盾防空能力。这是本文件中非BMD SPY-1D类条目中最强的。

eu_SPY-1D(BMD)=AN/SPY-1D(BMD)|AN/SPY-1D(BMD)代表一种具有宙斯盾弹道导弹防御能力的SPY-1D安装配置，用于弹道导弹搜索、跟踪和交战支持。相比纯防空SPY-1D，增加了高仰角BMD跟踪处理能力和远更高的高度上限，但仍依赖SPY-1D(V)级S波段无源相控阵架构而非更新的GaN有源相控阵。

eu_SPY-1F=AN/SPY-1F|AN/SPY-1F是SPY-1家族中缩小尺寸的出口/护卫舰成员。保留宙斯盾式固定阵列S波段无源相控阵概念，但具有更小的孔径和比巡洋舰及驱逐舰SPY-1变体更低的实际搜索立体范围。适用于局部或中程防空，不适用于完全的宙斯盾BMD用途。

eu_SPY-1F(V)=AN/SPY-1F(V)|AN/SPY-1F(V)是一种现代化缩小尺寸的SPY-1F型雷达，用于护卫舰大小的舰艇。建模为相比基本SPY-1F具有更好的处理、跟踪和低空性能，同时保持相同的较小阵列限制。在高度和远程立体搜索能力方面应明显低于SPY-1D和SPY-1D(V)。

eu_SPY-1K=AN/SPY-1K|AN/SPY-1K是一种紧凑型SPY-1衍生型号，用于远较小的作战舰艇。其较小的S波段阵列和较低功率使其成为局部区域防空雷达而非舰队宙斯盾传感器。应具有对其尺寸而言良好的反应和跟踪质量，但高度和距离包络远低于SPY-1F或SPY-1D。

eu_SPY-1E=AN/SPY-1E|AN/SPY-1E条目代表从SPY-1向后期S波段立体搜索和BMD雷达概念的固态增长路径。被视为一种高端实验或开发中的宙斯盾家族传感器，比经典正交场放大器SPY-1雷达具有更好的波形敏捷性和可靠性。其高度上限扩展用于高立体搜索，但不被建模为LRDR级系统。

