eu_OTO135=OTO-Ansaldo 135|135mm/45 OTO-Ansaldo|OTO-Ansaldo 135mm舰炮是冷战期间设计和生产的该口径炮的最后一代中的一员。作为意大利在二战中使用135mm口径的进一步发展，这门新炮由全自动装填系统供弹，并由现代化雷达火控系统控制，使其能够作为致命的双用途武器运作。唯一搭载这些火炮的舰艇是改装的导弹巡洋舰朱塞佩·加里波第号。

eu_OTO127=OTO-Melara Compact|127mm/54 OTO-Melara Compact|OTO-Melara Compact是一种意大利双用途炮架，也是世界上最广泛使用的舰炮之一。开发于1970年代，OTO-Melara Compact是一种现代化系统，具有全自动装填机构，可从中控台远程控制并仅需一名操作员。

eu_OTO76=Allargato|76.2mm/62 Allargato|Allargato于1960年代开发，是现在著名意大利76.2mm舰炮系列中的第一款双用途炮架，为后续型号在全球众多海军中的广泛使用奠定了基础。由全自动装填系统供弹以实现极高射速，并可从舰艇作战情报中心远程控制。

eu_OTO76_SR=OTO-Melara SR|76.2mm/62 OTO-Melara Super Rapido|OTO-Melara Super Rapido是OTO-Melara 76.2mm Compact炮塔的改进型、射速更快的版本，专门设计用于近程导弹防御。得益于轻量化运动部件、高度优化的装填系统和改进的弹药，Super Rapido能够达到每分钟120发的更高射速。因此它被认为比OTO-Melara自家的DARDO系统更有效的导弹防御武器。

eu_oto127=OTO-Melara Compact|127mm/54 OTO-Melara Compact|OTO-Melara Compact是一种意大利双用途炮架，也是世界上最广泛使用的舰炮之一。开发于1970年代，OTO-Melara Compact是一种现代化系统，具有全自动装填机构，可从中控台远程控制并仅需一名操作员。

eu_oto127lw=Leonardo 127/64 Lightweight|127mm/64 Leonardo Lightweight|一种用于海军对海火力支援和对海交战的127mm舰炮。可发射常规和制导增程弹药。火控通常由舰艇作战系统根据条令使用雷达和/或光电指挥仪提供。

eu_oto76_allargato=Allargato|76.2mm/62 Allargato|Allargato于1960年代开发，是现在著名意大利76.2mm舰炮系列中的第一款双用途炮架，为后续型号在全球众多海军中的广泛使用奠定了基础。由全自动装填系统供弹以实现极高射速，并可从舰艇作战情报中心远程控制。

eu_oto76sr=OTO_Melara 76/62 SR|76.2mm/62 Leonardo Super Rapid|广泛使用的OTO Melara（现Leonardo）76mm舰炮的现代化变体，具有提高的射速、改进的驱动系统和与先进弹药类型的兼容性。Super Rapid炮架维持每分钟最高120发的射速，并集成自动处理系统，可根据配置在HE、PFF和专用增程或反导弹药之间快速切换。搭配现代火控指挥仪或光电/红外跟踪器时，可提供有效的中近程防御能力，对抗导弹、飞机和水面威胁。该系统提供比Compact型号更高的交战性能，同时保持相似的重量和占地面积。

eu_oto76lw=OTO-Melara 76/62 Compact|76.2mm/62 OTO-Melara Compact|广泛装备于护卫舰和轻型护卫舰的76mm多用途舰炮升级变体。具有略高的射速。可高射速地攻击空中、水面和有限岸上目标。紧凑型炮架将备用弹药集成在防盾下方用于快速连射。火控由指挥仪如STIR或光电跟踪器提供，具体取决于条令。该系统为中型舰艇提供了重量、体积和火力的平衡。不同于具有更高循环射速的Super Rapid变体。

eu_oto76_retrofit=OTO-Melara 76/62 Compact|76.2mm/62 OTO-Melara Compact|广泛装备于护卫舰和轻型护卫舰的76mm多用途舰炮。可高射速地攻击空中、水面和有限岸上目标。紧凑型炮架将备用弹药集成在防盾下方用于快速连射。火控由指挥仪如STIR或光电跟踪器提供，具体取决于条令。该系统为中型舰艇提供了重量、体积和火力的平衡。不同于具有更高循环射速的Super Rapid变体。

