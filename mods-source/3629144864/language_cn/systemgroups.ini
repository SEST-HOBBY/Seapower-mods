eu_EDO-610E=EDO-610E|EDO-610E舰壳声呐是EDO Corporation为海军舰艇开发的舰壳安装主动/被动声呐系统。主要用于反潜战(ASW)，探测、跟踪和分类潜艇及水下目标。

eu_EDO-997=EDO-997|EDO-997（现为L3Harris Model 997或SONAT MkII）是巴西海军使用的高性能主动舰壳安装声呐。专为水下目标的探测、跟踪和分类而设计，装备于尼泰罗伊级护卫舰和巴罗索号轻型护卫舰，目前正进行现代化升级。

