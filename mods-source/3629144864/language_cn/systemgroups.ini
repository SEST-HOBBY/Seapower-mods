eu_MageDefensorMK3_ESM=Mage Defensor Mk. 3|MAGE Defensor MK3是巴西海军研究所(IPqM)开发、Omnisys（Thales集团子公司）制造的最新一代国产电子支援措施(ESM)系统。作为一种被动电子战传感器，它设计用于探测、截获和分析2至18 GHz频率范围内敌方雷达的电磁信号，使舰艇能够在不暴露自身位置的情况下识别和分类威胁。作为巴西国防技术自主的核心成果，MK3相比前代ET/SLR-1版本有重大升级，是指定用于新型塔曼达雷级护卫舰的主要电子战传感器。

eu_ET/SLR-1_ESM=ET/SLR-1|ET/SLR-1 "Defensor"是由巴西海军研究所(IPqM)和Omnisys设计的电子支援措施(ESM)系统，通过截获和分析敌方雷达辐射为水面舰艇提供被动态势感知。工作于宽频范围（通常2至18 GHz），使舰艇能够在被相同雷达探测之前发现、识别和跟踪来袭威胁的方位——如反舰导弹导引头或海上巡逻机。这种"静默"传感器是尼泰罗伊级护卫舰现代化改造(ModFrag)和因豪米级轻型护卫舰的基础装备，作为舰艇电子战套件的"耳朵"，向ET/SLQ-1干扰系统提供关键数据以实现协同防御反应。

eu_DR-3000U=DR-3000U|DR-3000U（法国编号ARUR-13）是Thales开发的高灵敏度雷达电子支援措施(RESM)系统，专门设计用于集成到潜艇中。它充当舰艇的战术"耳朵"，能够在潜艇处于潜望镜深度或水面状态时探测、截获和识别D至K频段的雷达辐射。该系统以其轻型设计著称（约为前代DR-2000U的一半重量），采用基于人工智能的"专家系统"自动分选和识别多达256个同步雷达脉冲，为艇员提供空中或海面威胁的关键预警。

eu_DR-4000U=DR-4000U|DR-4000U（法国编号ARUR-14）是Thales为现代潜艇开发的先进高性能雷达电子支援措施(RESM)系统，是DR-3000U更强大且技术更先进的姊妹系统。它是一种宽带数字截获系统，通过探测、识别和精确定位C至J频段（0.5至18 GHz）的雷达辐射，提供360度态势感知。DR-4000U专为应对现代近海水域极其"嘈杂"和密集的电磁环境而设计，使用高速数字信号处理和人工智能技术，在潜艇保持潜望镜深度隐蔽时，区分普通导航雷达和致命威胁——如低截获概率(LPI)雷达或空中搜索传感器。

eu_AR-900=AR-900|AR-900是由ARGOSystems（后隶属于Boeing和L3Harris）最初开发的宽带电子支援措施(ESM)和信号情报(SIGINT)系统，通常集成到如APECS III等更大的电子战套件中。主要用于在2至18 GHz频率范围（E至J波段）内自动探测、定位和识别复杂雷达辐射源，在密集电磁环境中提供100%的截获概率。该系统高度通用，部署于多个高价值平台，包括E-3 AWACS（作为AYR-1 ESM套件的基础）和各种海军舰艇，使用数字瞬时测频(DIFM)和精密单脉冲测向技术，以约2度均方根精度每秒识别多达500个信号。

#-------------------------------------- ECM ---------------------------------------
eu_ET/SLQ-1_ECM=ET/SLQ-1|ET/SLQ-1是巴西海军研究所(IPqM)和Elebra（后并入国防工业）开发的国产电子对抗(ECM)系统，为水面作战舰艇提供主动雷达干扰和防护。通常与ET/SLR-1 "Defensor" ESM接收机配对构成完整的电子战套件，设计用于通过发射干扰信号"致盲"或欺骗来袭威胁来抑制敌方监视和火控雷达。最显著的是作为现代化升级安装在尼泰罗伊级护卫舰和因豪米级轻型护卫舰上，ET/SLQ-1代表了巴西以自主技术替代老化外国系统（如英国Racal Cygnus）的重要一步。


