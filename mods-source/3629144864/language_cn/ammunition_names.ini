ger_HEL=Laser CIWS,莱茵金属高能激光,激光武器,一种舰载高能激光系统，用于对小型快速目标进行近距离防御。它通过持续向视线跟踪目标输送能量来损坏或摧毁传感器、控制面或结构元件，对无人机和小艇最有效。性能严重依赖于大气条件、稳定质量、目标方位和驻留时间。与火控链的集成和精确跟踪对于一致的结果至关重要。
