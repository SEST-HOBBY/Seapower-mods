[AmmunitionNames]
# ------------------ AAM ------------------
usn_aim-9m=AIM-9M,响尾蛇,空对空,AIM-9响尾蛇是美国的一种红外制导空对空导弹。AIM-9M是1982年起生产的AIM-9L的进一步改进型，由于引入了红外反干扰(IRCCM)系统，大大增强了其抗干扰能力。
usaf_aim-120a=AIM-120A,阿姆拉姆,空对空,AIM-120先进中程空对空导弹(AMRAAM)是美国服役的标准超视距导弹。它研发于20世纪80年代，是AIM-7麻雀的后继型号，速度更快、更紧凑、更轻，配备性能强大的雷达导引头和先进的机载电子设备。发射后，AMRAAM通过数据链从发射飞机接收制导，直到进入末段，导弹切断链路并开启机载导引头以获取并命中目标。

eu_am_aspide=阿斯派德,,空对空,Aspide是意大利在先前许可生产的AIM-7E基础上研发的导弹。与麻雀相比，Aspide将连续波导引头替换为逆单脉冲型号，显著提高了精度和电子对抗能力。此外，该导弹还配备了新型战斗部、更强劲的发动机和闭路液压系统，以获得更好的远距离机动性。
eu_am_slyflash=天闪,,空对空,Skyflash是英国研发的AIM-7E改进型。最重要的升级是用逆单脉冲导引头替换了麻雀原先使用的连续波型号，显著提高了精度和电子对抗能力。进一步的改进包括更强劲的发动机、改进的舵面和新型雷达引信。

# ------------------ SAM ------------------
ger_rim-116a=RIM-116,RAM,面对空,RIM-116RAM(RAM)是一种小型、轻型、红外制导的面对空导弹，在德国、日本、希腊、土耳其、韩国、沙特阿拉伯、埃及、墨西哥、阿联酋和美国海军中服役。它最初主要用于作为对抗反舰导弹的点防御武器。顾名思义，RAM在飞行中滚转。导弹必须在飞行中滚转，因为其射频跟踪系统使用双天线干涉仪，只能在一个平面上测量电磁波的相位干涉。滚转的干涉仪使天线能够探测所有平面的入射能量。此外，由于导弹滚转，只需要一对操纵鸭翼。截至2005年，它是唯一以这种方式工作的美国海军导弹。

usn_rim-116a=RIM-116A,RAM Blk 0,面对空,一种早期RAM构型，针对掠海反舰导弹的点防御进行了优化。它在飞行中段主要通过被动射频追踪目标辐射，在末段转换为红外制导。设计上发射后不需要舰载照射器，用于快速内层拦截。
usn_rim-116b=RIM-116B,RAM Blk IA,面对空,一种改进型RAM，新增了纯红外(全红外)制导选项，以应对不辐射或使用低可探测辐射特征的目标，同时保留了早期型号的被动射频/红外能力。1A/HAS软件基线将拦截逻辑扩展到传统反舰导弹之外的其他空中和水面目标。
usn_rim-116c=RIM-116C,RAM Blk II,面对空,一种针对更高压力和更高机动性威胁的运动学和导引头升级。增加了控制段升级（四个鸭翼）、更大的推进段（6.25英寸级发动机）以及改进的被动射频接收器，旨在更好地处理包括低截获概率(LPI)特征在内的现代导引头，提高了末段能量和电子反干扰性能。
usn_rim-116d=RIM-116D,RAM Blk IIA,面对空,Block 2的增量后续型号，侧重于软件/电子改进以提高制导性能和多目标处理能力，同时保留Block 2的硬件特征（增强型控制段、更大的发动机、改进的射频接收器）。旨在提高对抗现代反舰导弹和不对称空中威胁的有效性，而不改变发射装置兼容性。
usn_rim-116e=RIM-116E,RAM Blk IIB,面对空,一种进一步改进的RAM弹，配备更先进的红外导引头和导弹间通信链路，以提高齐射协调性和在复杂多目标/诱饵环境中的性能。建立在Block 2运动学和电子反干扰基线（增强型控制和改进的射频接收器）之上，提高对最新一代威胁的识别和拦截鲁棒性。

usn_rim-161b=RIM-161B,标准3 Blk IA,弹道导弹防御,一种用于宙斯盾弹道导弹防御的大气层外动能杀伤拦截器，在中段拦截弹道导弹。在舰载引导和数据链更新后，第三级分离，动能战斗部使用其红外导引头和转向推进器进行制导以碰撞目标。它不携带爆炸战斗部，也不能用于飞机或巡航导弹。它是第一款进入服役的SM-3型号。
usn_rim-161c=RIM-161C,标准3 Blk IB,弹道导弹防御,一种用于宙斯盾弹道导弹防御的大气层外动能杀伤拦截器，在中段拦截弹道导弹。与早期SM-3型号相比，Block IB通过双色红外导引头和升级的动能战斗部转向与姿态控制系统，提高了末段性能和目标识别能力。在舰载引导和数据链更新后，第三级分离，动能战斗部使用其红外导引头和转向推进器进行制导以碰撞目标。它不携带爆炸战斗部，也不能用于飞机或巡航导弹。
usn_rim-161d=RIM-161D,标准3 Blk IIA,弹道导弹防御,美日联合开发的SM-3改进型，通过更大直径的推进级和更强的动能战斗部扩大了宙斯盾弹道导弹防御覆盖范围，提供更高的燃尽速度和更大的防御范围，应对射程更远、更具挑战性的弹道导弹威胁。与其他SM-3型号一样，它利用舰载和网络引导进行大气层外动能杀伤中段拦截，然后使用红外末段制导和转向推进器进行制导，不配备爆炸战斗部。Block IIA已针对洲际弹道导弹级目标进行了飞行测试，并在弹道导弹防御作战中投入实战使用。它从宙斯盾舰的MK 41垂直发射系统发射，也与陆基宙斯盾配置相关，但不能用于飞机或巡航导弹。

usn_rim-162a=RIM-162A,先进海麻雀 Blk I,面对空/反水面,一种用于点和局部区域防御的半主动雷达制导面对空导弹。它需要在末段由火控雷达提供照射来引导。该导弹对掠海目标和常规飞机具有高敏捷性。集成支持MK 41垂直发射系统中的四联装配置，并与传统作战系统兼容。性能取决于末段几秒钟内照射器的可用性和几何关系。
usn_rim-162b=RIM-162B,先进海麻雀 Blk I,面对空/反水面,一种为非宙斯盾作战系统量身定制的半主动ESSM型号，同时保留了垂直发射系统四联装能力。它比早期点防御导弹提供了更好的机动性，有助于加强舰艇自卫。末段制导依赖舰载照射器。中段指令和自动驾驶仪在支持时减少了照射器占用时间。拦截包线因雷达视界和目标高度而异。
usn_rim-162c=RIM-162C,先进海麻雀 Blk I,面对空/反水面,一种半主动雷达制导ESSM型号，兼容MK 41垂直发射系统以及MK 48和MK 56发射系统。它提供针对掠海导弹、飞机和其他高速威胁的点和局部区域防御。末段制导需要舰载火控照射。该型号支持在标准宙斯盾路径之外的北约兼容垂直发射系统舰艇上灵活集成。性能取决于作战系统支持、照射器可用性和末段制导期间的目标几何关系。
usn_rim-162d=RIM-162D,先进海麻雀 Blk I,面对空/反水面,一种用于MK 29发射装置的导轨发射ESSM版本，没有推力矢量控制。它在没有垂直发射系统的平台上提供短程到中程点防御。制导是半主动的，末段需要火控雷达。与垂直发射型号相比，运动性能有所降低。对于配备传统发射装置的旧舰艇来说，它仍然是一条可行的升级路径。
usn_rim-162f=RIM-162F,先进海麻雀 Blk 1,面对空/反水面,RIM-162F ESSM Block 1是一种半主动雷达制导面对空导弹，适用于朱姆沃尔特级驱逐舰。为在该平台上使用，该导弹依赖作战系统和火控方面的修改，这些修改取代了其他兼容ESSM的舰艇所使用的标准集成路径。它仍然需要末段照射，用于对飞机和掠海导弹的点和局部区域防御。该导弹具有高敏捷性和紧凑的尺寸，适合分层防御。有效性能取决于兼容照射器支持的可用性以及为此构型所做的特定朱姆沃尔特集成修改。
usn_rim-162h=RIM-162H,先进海麻雀 Blk II,面对空/反水面,一种主动雷达导引头型号，减少了对末段照射的依赖。该导弹保留了MK 41四联装兼容性，并提高了末段敏捷性和杂波抑制能力。中段制导由作战系统通过数据链更新提供（在可用时）。它增强了多目标处理能力和局部区域包线内的大离轴角拦截机会。性能受益于三维监视雷达的高质量航迹。
usn_rim-162j=RIM-162J,先进海麻雀 Blk II,面对空/反水面,一种用于非宙斯盾作战系统的主动导引头ESSM集成型号。该导弹在末段制导方面具有更好的自主性，并支持复杂的多目标场景。保留了四联装兼容性以提高弹仓效率。拦截取决于来自作战管理系统的可靠中段引导。与半主动型号相比，它在对抗掠海目标和机动飞机方面性能更优。
usn_rim-162k=RIM-162K,先进海麻雀 Blk II,面对空/反水面,一种主动雷达导引头ESSM Block II型号，兼容MK 41垂直发射系统以及MK 48和MK 56发射系统。该导弹提供针对掠海导弹、飞机和机动威胁的点和局部区域防御，同时减少对持续末段照射的依赖。中段制导和数据链支持通过舰载作战系统提供（在可用时）。主动导引头与早期半主动ESSM型号相比，提高了多目标处理能力、杂波抑制和末段拦截灵活性。性能取决于航迹质量、作战系统集成和可用的中段支持。

usn_rim-156a=RIM-156A,标准2增程 Blk IV,面对空/反水面,RIM-156A标准-2ER导弹是SM-2ER的宙斯盾垂直发射系统版本，是一种高度先进的Block IV型号，配备了晚期Block III SM-2MR的导引头升级，并具有一定程度的反弹道导弹能力。该导弹的有效射程（100海里）显著小于其最大运动学射程，因此请注意，半主动雷达制导照射无法将这些超远程面对空导弹引导到其最大标称射程。

usn_rim-174a=RIM-174A,标准6 Blk I,面对空/反水面,一种用于舰队防空和末段导弹防御的多任务增程导弹。使用惯性制导和双模末段导引头（主动+半主动雷达制导）来拦截飞机、巡航导弹以及处于末段的某些弹道导弹威胁。在作战系统支持时也可用于有限的反水面任务。
usn_rim-174b=RIM-174B,标准6 Blk IAU,面对空/反水面,一种改进型SM-6，增加了GPS辅助制导以扩展超视距反水面和对地攻击能力，同时保留了远程防空和末段防御任务。仍然支持主动和半主动末段制导，既能自主末段寻的，也能进行照射拦截。
usn_rim-174c=RIM-174C,标准6 Blk IB,面对空/反水面,下一代SM-6升级型，核心是一个更大的21英寸第二级火箭发动机和更新的软件，以大幅增加对先进空中和水面目标的运动学射程和末段能量。旨在提供更远程的火力和对快速、高压力目标的更好性能，同时保持与宙斯盾/MK 41生态系统的兼容性。

usn_pac3_mse=PAC-3 MSE,,弹道导弹防御,一种动能杀伤拦截器，设计用于短程到中程的弹道导弹防御和高性能防空。MSE型号使用更大的发动机和舵面来提高射程、高度和末段机动性，优于早期PAC-3导弹。它针对以极高精度拦截战术弹道导弹、巡航导弹和飞机进行了优化。其有效性取决于强大的雷达支持和对抗快速、高角度威胁时的快速反应。

usn_rim-66g=RIM-66G,标准2中程 Blk II,面对空/反水面,一种Block II中程区域防御导弹，针对宙斯盾作战系统和MK 26导弹发射系统双臂发射装置进行了优化。Block II引入了MK 104火箭发动机和改进的破片战斗部，以扩大对更快威胁的拦截包线。制导采用惯性制导加指令中段修正，转入需要舰载照射的末段半主动雷达制导。
usn_rim-66h=RIM-66H,标准2中程 Blk II,面对空/反水面,一种为配备MK 41垂直发射系统的宙斯盾舰艇量身定制的Block II型号。它保留了Block II的运动学和战斗部改进（MK 104发动机、升级的破片战斗部），并使用惯性/指令中段制导来减少照射器对目标的照射时间。末段制导为半主动雷达制导，取决于多目标拦截场景中的照射器几何关系和调度。
usn_rim-66j=RIM-66J,标准2中程 Blk II,面对空/反水面,一种为升级型鞑靼时代舰艇（而非宙斯盾舰）集成新型威胁升级(NTU)系统的Block II导弹。它共享Block II的推进/战斗部提升以获得更长的有效射程，并使用惯性/指令中段更新和需要照射的末段半主动雷达制导。通常用于为NTU舰艇提供真正的区域防御层，受照射器可用性和航迹质量的限制。
usn_rim-66k=RIM-66K,标准2中程 Blk IIIA,面对空/反水面,一种使用半主动雷达制导的中程区域防御导弹。Block IIIA提高了对掠海威胁的低空性能。它依赖舰载照射器进行末段制导。该导弹通常作为分层防空的一部分使用。有效使用取决于多目标场景中的航迹质量和照射器调度。
usn_rim-66l=RIM-66L,标准2中程 Blk IIIA,面对空/反水面,一种使用半主动雷达制导的中程区域防御导弹。Block IIIA提高了对掠海威胁的低空性能。它依赖舰载照射器进行末段制导。该导弹通常作为分层防空的一部分使用。有效使用取决于多目标场景中的航迹质量和照射器调度。
usn_rim-66m-2=RIM-66M-2,标准2中程 Blk IIIA,面对空/反水面,一种使用半主动雷达制导的中程区域防御导弹。Block IIIA提高了对掠海威胁的低空性能。它依赖舰载照射器进行末段制导。该导弹通常作为分层防空的一部分使用。有效使用取决于多目标场景中的航迹质量和照射器调度。
usn_rim-66m-5=RIM-66M-5,标准2中程 Blk IIIB,面对空/反水面,一种较新的SM-2中程迭代型号，具有制导和电子反干扰改进。它增强了在干扰环境中对抗机动飞机和导弹的性能。半主动末段制导需要可靠的照射几何关系。该导弹与现代作战系统集成以实现协同拦截。它仍然是合格平台上区域防空的主力武器。
usn_rim-66n=RIM-66N,标准2中程 Blk IIIAZ,面对空/反水面,RIM-66N标准-2中程 Block IIIAZ是一种中程区域防御导弹，适用于朱姆沃尔特级驱逐舰。为在该平台上使用，它整合了与舰艇作战系统、发射装置布局和末段火控支持相关的集成变更，而非传统宙斯盾舰艇使用的标准配置。该导弹在末段使用半主动雷达制导，旨在加强对抗飞机和反舰导弹的分层防御。Block IIIAZ保留了标准导弹在舰队外层防空中的既定角色，同时将舰艇的拦截选项扩展到点防御武器之外。作战有效性取决于朱姆沃尔特专用制导和照射链改进的可用性。
usn_rim-66p=RIM-66P,标准2中程 Blk IIIC,面对空/反水面,一种来自SM-2系列的中程区域防空导弹。它使用惯性制导加中段更新和末段半主动雷达制导（取决于型号/作战条令）。用于对抗飞机和巡航导弹的舰队防空。

usn_rim-7p=RIM-7P,海麻雀,面对空/反水面,一种从导轨或垂直发射系统发射装置使用的半主动点防御导弹。它提供对抗飞机和较老反舰导弹的短程防空。制导需要火控雷达进行末段照射。库存保留用于某些平台和训练任务。在现代舰艇上正逐渐被ESSM取代。

mbda_aster_15=紫菀 15,,面对空,紫菀 15是一种法国-意大利联合研制的全天候垂直发射面对空导弹。紫菀系列导弹被开发用于拦截和摧毁从高性能战斗机、无人机和直升机到巡航导弹、反辐射导弹甚至掠海超音速反舰导弹的全谱空中威胁。
mbda_aster_30=紫菀 30,Block 0,面对空,紫菀 30是一种法国-意大利联合研制的全天候垂直发射面对空导弹。紫菀系列导弹被开发用于拦截和摧毁从高性能战斗机、无人机和直升机到巡航导弹、反辐射导弹甚至掠海超音速反舰导弹的全谱空中威胁。
mbda_aster_30_blk1=紫菀 30,Block 1,面对空,紫菀 30是一种远程面对空导弹，设计用于对飞机、导弹甚至短程弹道导弹等先进威胁进行扩展区域防御。它采用与紫菀 15类似的二级设计和主动导引头，射程和高度显著增加，使其成为分层防空系统的关键组成部分。
mbda_camm=CAMM,,面对空,通用模块化防空导弹由MBDA英国公司开发，用于先进中程防空任务，取代英国服役中日渐老旧的GWS.26海狼。它基于ASRAAM空对空导弹，但配备了新的软件、翻转包、折叠翼、射频导引头和数据链。其他未直接从ASRAAM采用的组件则复用了海狼Block 2和PAAMS等其他项目的部件，以降低成本和增加通用性。
mbda_camm-er=CAMM-ER,,面对空,通用模块化防空导弹增程型由MBDA英国公司开发，用于先进中程防空任务，取代英国服役中日渐老旧的GWS.26海狼。它基于ASRAAM空对空导弹，但配备了新的软件、翻转包、折叠翼、射频导引头和数据链。其他未直接从ASRAAM采用的组件则复用了海狼Block 2和PAAMS等其他项目的部件，以降低成本和增加通用性。

ger_IDAS=IDAS,,面对空,IDAS（潜艇交互式防御与攻击系统）：一种从潜艇鱼雷管发射的密封式短程导弹系统，用于自卫和有限打击任务。它主要用于对抗反潜直升机和海上巡逻机，也可根据拦截几何条件用于对付小型水面目标。制导和导引头特性针对快速反应的近距离威胁进行了优化。有效使用取决于目标方位、桅杆暴露和战术时机。
ger_IRIS-T_SLM=IRIS-T SLM,,面对空,IRIS-T SLM（中程地面发射型）：一种中程地面发射型防空导弹，衍生自IRIS-T系列，采用成像红外导引头、高敏捷性和数据链支持的中段制导。它针对飞机、直升机、无人机和巡航导弹进行了优化，对机动和低空目标具有强大的末段性能。海军使用受益于被动末段制导和减少的照射需求，但有效性取决于作战系统引导、目标方位、导引头锁定条件和发射装置位置。
ger_IRIS-T_SLX=IRIS-T SLX,,面对空,IRIS-T SLX（增程地面发射型）：一种从IRIS-T系列衍生出的增程地面发射型防空导弹，用于中远程区域防御。它结合了高机动性、数据链支持的中段制导和成像红外末段导引头，允许被动末段寻的，无需连续雷达照射。该导弹旨在以比IRIS-T SLM更远的防区外距离拦截飞机、直升机、无人机、巡航导弹和其他敏捷或低空飞行威胁。海军使用受益于低末段辐射和灵活的作战系统引导，但性能取决于发射几何条件、目标方位、导引头捕获条件和远程或舰载传感器航迹的质量。

fr_mistral=西北风,,面对空,Mistral（法语：Transportable Anti-aerien Leger，意为"便携式轻型防空导弹"），通常称为西北风，是MBDA法国公司制造的一系列法国红外制导多用途短程防空系统。
fr_crotale_vt1=响尾蛇,,面对空,响尾蛇是一种法国短程面对空导弹系统，开发用于拦截空中武器和飞机，从巡航或反舰导弹到直升机、无人机或低空飞行的战斗机。

eu_mm_aspide=阿斯派德,,面对空,Aspide是意大利在先前许可生产的AIM-7E基础上研发的导弹。与麻雀相比，Aspide将连续波导引头替换为逆单脉冲型号，显著提高了精度和电子对抗能力。此外，该导弹还配备了新型战斗部、更强劲的发动机和闭路液压系统，以获得更好的远距离机动性。
eu_mm_mistral=西北风,,面对空

# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------
eu_MTO_85=MTO 85,,反水面,由Saab Bofors Dynamics开发的瑞典RBS 15 MK 2反舰导弹。
js_ssm-1b=SSM-1B,九零式,反水面,90式是三菱重工88式反舰导弹的舰载版本。

usn_rgm-109b1=RGM-109B1,战斧 Blk I,反水面,RGM-109B1战斧反舰导弹(TASM)是一种美国防区外反舰武器。该武器配备主动雷达导引头，在按照预编程路线飞行后激活，并能以欺骗性机动飞行搜索模式。B1改型具有新的助推器以支持垂直发射系统操作和增强型掠海模式。
usn_ugm-109b1=UGM-109B1,战斧 Blk I,反水面,UGM-109B1战斧反舰导弹(TASM)是一种美国防区外反舰武器。该武器配备主动雷达导引头，在按照预编程路线飞行后激活，并能以欺骗性机动飞行搜索模式。B1改型具有新的助推器以支持垂直发射系统操作和增强型掠海模式。此版本为潜射型。
usn_rgm-109e5a=RGM-109E5a,MST Blk Va,反水面,一种远程反舰型战斧，用于在防区外距离攻击水面战舰。它通常通过惯性更新导航到指定搜索区域，然后转换为基于导引头的捕获（主动雷达）以选择和寻的舰船目标。亚音速、低空飞行，它在很大程度上受益于精确的引导（方位/距离/航迹）以最小化末段搜索时间并减少在密集编队中获取错误目标的机会。
usn_ugm-109e5a=UGM-109E5a,MST Blk Va,反水面,一种远程反舰型战斧，用于在防区外距离攻击水面战舰。它通常通过惯性更新导航到指定搜索区域，然后转换为基于导引头的捕获（主动雷达）以选择和寻的舰船目标。亚音速、低空飞行，它在很大程度上受益于精确的引导（方位/距离/航迹）以最小化末段搜索时间并减少在密集编队中获取错误目标的机会。
usn_rgm-109m=RGM-109M,MST Blk Va,反水面,一种远程反舰型战斧，用于在防区外距离攻击水面战舰。它通常通过惯性更新导航到指定搜索区域，然后转换为基于导引头的捕获（主动雷达）以选择和寻的舰船目标。亚音速、低空飞行，它在很大程度上受益于精确的引导（方位/距离/航迹）以最小化末段搜索时间并减少在密集编队中获取错误目标的机会。

usn_ircps=IRCPS,,高超音速滑翔体,中程常规快速打击(IRCPS)武器是一种舰射高超音速滑翔飞行器，旨在为朱姆沃尔特级驱逐舰提供远程常规打击能力。为在该级舰上使用，该武器集成后从舰艇的大型导弹单元而非标准MK 41尺寸单元发射。这一改进使该平台能够使用比常规舰队导弹大得多的助推器和滑翔体。该系统用于对严密防御或时间敏感目标进行快速远程打击。使用取决于朱姆沃尔特改型配置特有的专用发射装置和作战系统支持。
usn_ircps_asm=IRCPS,,高超音速滑翔体,中程常规快速打击(IRCPS)武器是一种舰射高超音速滑翔飞行器，旨在为朱姆沃尔特级驱逐舰提供远程常规打击能力。为在该级舰上使用，该武器集成后从舰艇的大型导弹单元而非标准MK 41尺寸单元发射。这一改进使该平台能够使用比常规舰队导弹大得多的助推器和滑翔体。该系统用于对严密防御或时间敏感目标进行快速远程打击。使用取决于朱姆沃尔特改型配置特有的专用发射装置和作战系统支持。

usn_rgm-84d=RGM-84D,鱼叉 Blk IC,反水面,一种广泛使用的北约亚音速掠海反舰导弹，配备主动雷达末段导引头和可编程预发射航线。Block 1C RGM-84D引入了可选择的末段攻击剖面（如跃升或掠海）和改进的电子反干扰，同时使用JP-10燃料以增加射程。
usn_rgm-84g=RGM-84G,鱼叉 Blk IG,反水面,一种较新的北约亚音速掠海反舰导弹，源自Block 1C鱼叉，配备主动雷达末段导引头和改进的末段恢复逻辑。Block 1G RGM-84G加入了来自已取消的Block 1D项目的重新攻击能力，并进一步改进了电子反干扰，同时保留了RGM-84D的可编程航线和末段攻击选项。
usn_rgm-84l=RGM-84L,鱼叉 Blk II,反水面,一种现代化出口型鱼叉Block II亚音速掠海反舰导弹，配备GPS辅助惯性中段导航和主动雷达末段导引头。RGM-84L提高了精确导航和近岸攻击灵活性，同时仍然基于成熟的鱼叉机身和掠海末段攻击剖面。
usn_rgm-84n=RGM-84N,鱼叉 Blk II+,反水面,一种具备网络能力的鱼叉Block II+亚音速掠海反舰导弹，配备主动雷达末段导引头、更新的GPS制导和飞行中目标更新能力。RGM-84N增加了双向数据链、任务中止选项、改进的目标选择性和增强的电子对抗能力。
usn_rgm-84q=RGM-84Q,鱼叉 Blk II+ ER,反水面,现代化增程型舰射鱼叉，具备网络化中段更新能力。与较老的RGM-84D/G型号相比，-84Q代表了后期鱼叉ER/II+标准，具有更好的GPS辅助导航、更好的近岸/陆上遮蔽识别能力和更远的射程。它主要仍是一种反舰导弹，但在有有效坐标时也可攻击固定沿海或港口目标。末段寻的为主动雷达制导，因此可以攻击移动舰船。真正的机动陆上目标攻击并非其核心任务。

usn_ugm-84d=UGM-84D,鱼叉 Blk IC,反水面,鱼叉是一种美国防区外反舰武器，广泛用于北约各国。该武器配备主动雷达导引头，在按照预编程路线飞行后激活。UGM-84型号为潜射型。Block 1C型号通过更高能量的燃料增加了射程，具有掠海剖面和优化的末段跃升机动，以及更抗干扰的导引头。
usn_ugm-84g=UGM-84G,鱼叉 Blk IG,反水面,一种潜射型北约亚音速掠海反舰导弹，源自Block 1C鱼叉，配备主动雷达末段导引头和改进的末段恢复逻辑。Block 1G UGM-84G加入了来自已取消的Block 1D项目的重新攻击能力，并进一步改进了电子反干扰，同时保留了UGM-84D的可编程航线和末段攻击选项。
usn_ugm-84n=UGM-84N,鱼叉 Blk II+,反水面,一种潜射型具备网络能力的鱼叉Block II+亚音速掠海反舰导弹，配备主动雷达末段导引头、更新的GPS制导和飞行中目标更新能力。UGM-84N增加了双向数据链、任务中止选项、改进的目标选择性和增强的电子对抗能力。

knm_nsm_1a=NSM,Naval Strike Missile Blk IA,反水面,一种低可探测性亚音速反舰和对地攻击导弹，配备成像红外导引头。制导使用地形和场景匹配加航路点进行复杂进近路径规划。掠海飞行和末段机动增强了对现代防御的生存能力。成像红外导引头能够在杂乱的近岸环境中识别目标。在授权时也可攻击选定的陆地目标。
knm_3sm_tyrfing=3SM,Tyrfing,反水面,一种在挪威和德国联合开发中的下一代超音速反舰和对地攻击导弹。它旨在提供远程防区外能力和高末段能量，以及现代导引头和数据链支持以应对复杂目标集。公开的开发目标是马赫数2到3的性能。

swe_rbs15_mk1=RBS15 Mk1,,反水面,一种早期亚音速掠海反舰导弹，配备主动雷达导引头和发射后不管操作。它沿低空航线飞行以减少探测，支持对抗水面目标的基本预编程进近。
swe_rbs15_mk2=RBS15 Mk2,,反水面,一种升级型RBS15，侧重于改进中段和末段制导以及在电子战环境中更好的生存能力。它保留了亚音速掠海战术，配备主动雷达导引头和对水面目标的自主末段寻的。
swe_rbs15_mk3=RBS15 Mk3,,反水面,一种远程亚音速反舰和对地攻击导弹，配备全天候主动雷达导引头和强大的电子防护。任务规划支持多个航路点和协同多角度攻击，同时导弹保持适应海况的掠海飞行以限制被发现。末段飞行可包括规避机动和同步打击的定时控制。
swe_rbs15_mk4=RBS15 Mk4,,反水面,一种RBS15系列的下一代改进型，具有改进的雷达导引头和增强的导航韧性，适用于复杂的对抗环境。它支持来自多平台的协同攻击和适应海况的超低空灵活航线。

fr_sm39=SM.39,飞鱼 Blk 2,反水面,为潜艇设计，此版本为潜射型导弹。原SM39的研究始于1978年，于1985年投入使用。导弹装在一个鱼雷大小的水密舱中，由鱼雷管推进和发射。出水后，舱罩脱落，导弹点火；然后其行为类似于AM39导弹。
fr_mm-40_block3=MM.40,飞鱼 Blk 3C,反水面,MM40 Block 3导弹具有超过180公里的改进射程，并接受GPS制导系统航路点命令，使其能从不同角度攻击海军目标。

eu_mm_otomat_mk2_blk1=奥托马特 MK 2,Block I,反水面,奥托马特是一种在20世纪60年代末开发的亚音速反舰导弹，作为意大利海军的主要反水面导弹。其他知名反舰导弹如鱼叉和飞鱼由火箭发动机推进，而奥托马特由涡扇发动机推进，这是为了获得比其他导弹更远的射程和更大的有效载荷能力。奥托马特MK 1最初的最大拦截距离受限于发射舰的雷达视界，这一缺陷在20世纪70年代末通过引入用于超视距瞄准的数据链，由新型奥托马特MK 2 Block I解决了。
eu_mm_otomat_mk2_blk2=奥托马特 MK 2,Block II,反水面,奥托马特是一种在20世纪60年代末开发的亚音速反舰导弹，作为意大利海军的主要反水面导弹。其他知名反舰导弹如鱼叉和飞鱼由火箭发动机推进，而奥托马特由涡扇发动机推进，这是为了获得比其他导弹更远的射程和更大的有效载荷能力。奥托马特MK 2 Block II是20世纪80年代的导弹升级，引入了折叠翼设计，使存储容器缩小50%，从而使水面战舰能够携带更多导弹。
mm_otomat_mk2_blk4=奥托马特 MK 2,Block IV,反水面,奥托马特是一种在20世纪60年代末开发的亚音速反舰导弹，作为意大利海军的主要反水面导弹。其他知名反舰导弹如鱼叉和飞鱼由火箭发动机推进，而奥托马特由涡扇发动机推进，这是为了获得比其他导弹更远的射程和更大的有效载荷能力。Block IV升级利用了Marte MK 2/S导弹研发的组件，取消了基于直升机的数据链，改用基于舰艇的数据链进行超视距瞄准。此外，它还配备了通过GPS接收航路点、执行自主重新攻击和末段规避机动的能力。
mm_otomat_mk2e=奥托马特 MK 2E,特塞奥进化型,反水面,奥托马特是一种在20世纪60年代末开发的亚音速反舰导弹，作为意大利海军的主要反水面导弹。其他知名反舰导弹如鱼叉和飞鱼由火箭发动机推进，而奥托马特由涡扇发动机推进，这是为了获得比其他导弹更远的射程和更大的有效载荷能力。奥托马特MK 2E"Teseo EVO"是该导弹的最新迭代，射程显著增加，并具有增强的对地攻击模式，为意大利海军提供了以前仅由意大利空军及其风暴阴影导弹拥有的战术打击能力。
eu_mm_marte=马特 MK 2/S,,反水面,Marte是一种中程反舰导弹，由意大利Sistemi Elettronici公司于20世纪70年代中期开发，作为Sea Killer导弹的后继型号。与其前身相比，Marte的射程大大改进，部分原因是放弃了波束制导方式，改用奥托马特导弹的主动雷达导引头。Marte MK 2/S是Marte MK 2的直升机发射版本，于1990年在意大利海军服役。

eu_as34=AS.34,Kormoran,反水面,鸬鹚是一种由法国和德国联合开发的中程反舰导弹，由西德F-104星式战斗机和狂风战斗机携带。联邦国防军最初评估了美国制造的AGM-12小牛和法国AS.30用于反舰任务，但在这两枚导弹未能满足期望后，德国MBB公司和法国宇航公司在20世纪60年代中期合作开发了基于AS.33的新导弹。由于同时开发，鸬鹚在外观和能力上与飞鱼大致相似。

#-----------Land Strike only missiles---------
eu_mm_alfa=阿尔法,,中程弹道导弹,Alfa弹道导弹是意大利在20世纪60年代中期努力发展国产核威慑的结果。最初，意大利试图围绕美国制造的北极星潜射弹道导弹建立其核威慑，由在60年代中后期已经建造了导弹设施的大型水面战舰携带。然而，美国拒绝提供北极星导弹，这导致意大利在20世纪70年代初从头开始开发国产中程弹道导弹。该计划进展顺利，直到1975年意大利批准《核不扩散条约》，结束了所有意大利核计划。

fr_mdcn=MdCN,,对地攻击,海军巡航导弹(MdCN)，意为海军巡航导弹，是一种法国涡喷动力亚音速巡航导弹，用于舰艇和潜艇对地攻击行动。最初被称为SCALP海军型，该计划源于法国国防部对一种更强大的巡航导弹的需求，该导弹能够从超远防区外距离打击战略和军事目标，以补充空射型SCALP-EG。

usn_rgm-109c3=RGM-109C3,TLAM Blk III,对地攻击,战斧对地攻击导弹(TLAM)是一种美国防区外对地攻击导弹。这些武器在发射后按预编程航线飞向目标，无需发射平台输入，使用地形匹配雷达和机载数字地图进行地形轮廓匹配。C3改型增加了GPS制导，允许精确的航路点制导（通过雷达指挥中段制导建模）和扩展射程，以及更高的精度。
usn_rgm-109e=RGM-109E,TLAM Blk IV,对地攻击,一种用于精确打击固定或可重新定位目标的远程对地攻击巡航导弹。它使用惯性/GPS导航组件，配合地形/场景匹配更新和双向数据链，用于飞行中重新瞄准和任务更新。亚音速、低空航线强调通过航线规划而非速度来实现生存能力；在有良好情报监视侦察/目标坐标和解除冲突空域的情况下使用效果最佳。
usn_rgm-109e5=RGM-109E5,TLAM Blk V,对地攻击,一种Block V对地攻击型战斧（RGM-109E系列），从Block IV重新认证，具有导航/通信升级以改善导航性能和更稳健的通信。它保留了远程、低空、亚音速飞行，使用INS/TERCOM/DSMAC/GPS，并通过数据链支持飞行中重新瞄准/徘徊。
usn_rgm-109e5b=RGM-109E5b,TLAM Blk Vb,对地攻击,一种Block Vb对地攻击型战斧（RGM-109E系列），从Block IV重新认证，具有导航/通信升级以改善导航性能和更稳健的通信。它保留了远程、低空、亚音速飞行，使用INS/TERCOM/DSMAC/GPS，并通过数据链支持飞行中重新瞄准/徘徊。Block Vb更新将传统战斗部替换为联合多效应战斗部系统(JMEWS)，以提高对抗加固和更多样化陆地目标的有效性。

usn_ugm-109c3=UGM-109C3,TLAM Blk III,对地攻击,战斧对地攻击导弹(TLAM)是一种美国防区外对地攻击导弹。这些武器在发射后按预编程航线飞向目标，无需发射平台输入，使用地形匹配雷达和机载数字地图进行地形轮廓匹配。C3改型增加了GPS制导，允许精确的航路点制导（通过雷达指挥中段制导建模）和扩展射程，以及更高的精度。此版本为潜射型。
usn_ugm-109e=UGM-109E,TLAM Blk IV,对地攻击,战斧对地攻击导弹(TLAM)是一种美国防区外对地攻击导弹。这些武器在发射后按预编程航线飞向目标，无需发射平台输入，使用地形匹配雷达和机载数字地图进行地形轮廓匹配。战术战斧(RGM-109E)是对原TLAM导弹的重大改造，具有新的机身和重建的制导系统，允许飞行中更新，该导弹是真正的现代对地攻击导弹。此版本为潜射型。
usn_ugm-109e5=UGM-109E5,TLAM Blk V,对地攻击,一种Block V对地攻击型战斧（RGM-109E系列），从Block IV重新认证，具有导航/通信升级以改善导航性能和更稳健的通信。它保留了远程、低空、亚音速飞行，使用INS/TERCOM/DSMAC/GPS，并通过数据链支持飞行中重新瞄准/徘徊。
usn_ugm-109e5b=UGM-109E5b,TLAM Blk Vb,对地攻击,一种Block Vb对地攻击型战斧（RGM-109E系列），从Block IV重新认证，具有导航/通信升级以改善导航性能和更稳健的通信。它保留了远程、低空、亚音速飞行，使用INS/TERCOM/DSMAC/GPS，并通过数据链支持飞行中重新瞄准/徘徊。Block Vb更新将传统战斗部替换为联合多效应战斗部系统(JMEWS)，以提高对抗加固和更多样化陆地目标的有效性。

# ---------- Anti-sub Missilies ----------
eu_mm_milas=奥托马特 米拉斯,,反潜导弹,奥托马特MILAS是一种基于奥托马特反舰导弹的远程反潜防区外导弹。最初由意大利和法国联合开发，MILAS包括一个几乎未改变的奥托马特导弹机身，原计划在其头部携带即将推出的A.290（意大利）和Murene（法国）轻型反潜鱼雷。然而，这两个鱼雷计划在1991年合并，产生了MU90反潜鱼雷，现在也由MILAS携带。自2002年以来，意大利海军是该导弹的唯一用户，因为法国在1998年决定在开发完成后不采购该系统。

usn_rur-5a=RUR-5A,ASROC,反潜,RUR-5阿斯洛克(ASROC，意为反潜火箭)是一种防区外反潜武器。ASROC导弹从发射平台发射后，沿弹道轨迹飞行并投放一枚MK 46 Mod 5 NEARTIP（近期改进计划）反潜鱼雷。

usn_rur-5_mod3=RUR-5,Mod 3 ASROC,反潜,RUR-5阿斯洛克(ASROC，意为反潜火箭)是一种防区外反潜武器。ASROC导弹从发射平台发射后，沿弹道轨迹飞行并投放一枚MK 44反潜鱼雷。
usn_rur-5_mod4=RUR-5,Mod 4 ASROC,反潜,RUR-5阿斯洛克(ASROC，意为反潜火箭)是一种防区外反潜武器。ASROC导弹从发射平台发射后，沿弹道轨迹飞行并投放一枚MK 46 Mod 0反潜鱼雷。
usn_rur-5_mod4_2=RUR-5,Mod 4 ASROC,反潜,RUR-5阿斯洛克(ASROC，意为反潜火箭)是一种防区外反潜武器。ASROC导弹从发射平台发射后，沿弹道轨迹飞行并投放一枚MK 46 Mod 1反潜鱼雷。

usn_rum-139a=RUM-139A,VL-ASROC,反潜,RUM-139A垂直发射阿斯洛克是一种防区外反潜武器。ASROC导弹从发射平台发射后，沿弹道轨迹飞行并投放一枚MK 46 Mod 5反潜鱼雷。垂直发射版本从MK 41垂直发射系统单元发射，射程是其早期对应型号的两倍。
usn_rum-139c=RUM-139C,VL-ASROC,反潜,RUM-139C垂直发射阿斯洛克是一种防区外反潜武器。ASROC导弹从发射平台发射后，沿弹道轨迹飞行并投放一枚MK 54反潜鱼雷。垂直发射版本从MK 41垂直发射系统单元发射，射程是其早期对应型号的两倍。

# ------------------ RBU ------------------
swe_sjunkbomb_m33_DC=Sjunkbomb m/33,,深水炸弹,一种用于近距离反潜攻击的简易深水炸弹武器。它依赖于准确的目标深度/距离估计，对慢速或受限潜艇（例如在狭窄水域）最有效。在游戏性方面，它是一种短程区域效应武器：当接触质量高且潜艇无法快速垂直规避时，优先使用投放模式。
eu_mm_dc=Depth charge
eu_mm_bas=BAS,,深水炸弹迫击炮
eu_mm_bas_sr=BAS (short range),,深水炸弹迫击炮

# ---------- Torpedoes ----------
eu_mu_90_ship=MU90,冲击,反潜鱼雷,一种具有主动和被动声学制导的轻型反潜鱼雷。它设计用于在浅水近岸环境和深海条件下作战。该鱼雷具有反制对抗能力，以应对诱饵和噪声。从324毫米管或由直升机和飞机发射。性能取决于环境条件和目标战术。
eu_mu_90_air=MU90,冲击,反潜鱼雷,一种具有主动和被动声学制导的轻型反潜鱼雷。它设计用于在浅水近岸环境和深海条件下作战。该鱼雷具有反制对抗能力，以应对诱饵和噪声。从324毫米管或由直升机和飞机发射。性能取决于环境条件和目标战术。

ger_g7e=G7e,T IIIa,反水面鱼雷,G7e是德国遗留的二战电动鱼雷，首次于1936年推出。战争结束后，相当数量的该型号库存继续在新成立的联邦海军以及西班牙、丹麦和挪威海军中服役。
ger_mu_90_ship=MU90,冲击,反潜鱼雷,一种具有主动和被动声学制导的轻型反潜鱼雷。它设计用于在浅水近岸环境和深海条件下作战。该鱼雷具有反制对抗能力，以应对诱饵和噪声。从324毫米管或由直升机和飞机发射。性能取决于环境条件和目标战术。
ger_seaspider=海蜘蛛,,反鱼雷鱼雷,一种用于舰船和高价值资产硬杀伤防御的反鱼雷鱼雷。该武器基于机载处理自主拦截来袭鱼雷。它通过提供末段硬杀伤选项来补充软杀伤诱饵。集成需要舰载传感器引导和拦截条令。库存和装载取决于平台和任务优先级。
ger_dm2a4=DM2A4,SeaHake,反潜/反水面鱼雷,一种重型533毫米潜射鱼雷，具有线导和末段主动/被动声学制导。针对远程攻击潜艇和水面舰艇进行了优化，具有强大的反制对抗逻辑。有效性取决于作战条令、水况和目标机动，使用受鱼雷管和再装填周期限制。
ger_dm2a4_er=DM2A4 ER,SeaHake,反潜/反水面鱼雷,基于DM2A4系列的增程型SeaHake mod4衍生型。2012年的一次试射展示了超过140公里的射程，使其成为一种专用的长航时防区外武器，而非标准的德国潜艇鱼雷。确切的速度/射程曲线未公开；游戏中的数值为估计值。
ger_dm2a5=DM2A5,SeaHake,反潜/反水面鱼雷,未来德国-挪威533毫米重型鱼雷，用于212CD型潜艇。公开信息描述了以软件为中心的架构、模块化电池电力推进、光纤数据链和先进的数字声呐，用于多目标和声学复杂的沿海水域作战。确切性能数据未公开；游戏中的数值为估计值。
ita_blackshark=黑鲨,,反潜/反水面鱼雷,一种重型533毫米潜射鱼雷，具有线导和末段主动/被动声学制导。以高战斗部质量和现代搜索与重新攻击行为闻名，对诱饵具有很强的抵抗力。性能取决于战术设置、环境和目标反应，受鱼雷管容量和再装填时间限制。

fr_F21=F21,,反潜/反水面鱼雷,一种重型533毫米潜射鱼雷，具有线导和末段主动/被动声学制导。设计用于深水作战、高速度和精确的末段控制，对抗潜艇和水面舰艇，具有改进的反制对抗处理能力。实际效果取决于作战条令、条件和目标机动，受鱼雷管可用性和再装填程序限制。
fr_mu_90_ship=MU90,冲击,反潜鱼雷,MU90 冲击是一种法国-意大利联合开发的先进轻型反潜鱼雷。它具有主动/被动制导系统，最大深度超过1000米，使其成为对抗敌方潜艇的极其危险的武器。

rn_stingray_mod0_air=黄貂鱼 Mod 0,,反潜鱼雷,黄貂鱼是英国在20世纪60年代中期希望开发国产轻型反潜鱼雷以减少对美国依赖的结果。经过漫长的开发周期和多次对原始设计的更改后，该鱼雷在1976年进行了彻底修改，以避免不得不回头购买美国制造的型号。
rn_stingray_mod0_ship=黄貂鱼 Mod 0,,反潜鱼雷,黄貂鱼是英国在20世纪60年代中期希望开发国产轻型反潜鱼雷以减少对美国依赖的结果。经过漫长的开发周期和多次对原始设计的更改后，该鱼雷在1976年进行了彻底修改，以避免不得不回头购买美国制造的型号。
rn_stingray_mod1_air=黄貂鱼 Mod 1,,反潜鱼雷,黄貂鱼是英国在20世纪60年代中期希望开发国产轻型反潜鱼雷以减少对美国依赖的结果。经过漫长的开发周期和多次对原始设计的更改后，该鱼雷在1976年进行了彻底修改，以避免不得不回头购买美国制造的型号。黄貂鱼mod. 1是该鱼雷的现代化改进型，于2006年投入使用，具有一系列改进，如全新的数字声学导引头、制导计算机和舵面的机电驱动系统。
rn_stingray_mod1_ship=黄貂鱼 Mod 1,,反潜鱼雷,黄貂鱼是英国在20世纪60年代中期希望开发国产轻型反潜鱼雷以减少对美国依赖的结果。经过漫长的开发周期和多次对原始设计的更改后，该鱼雷在1976年进行了彻底修改，以避免不得不回头购买美国制造的型号。黄貂鱼mod. 1是该鱼雷的现代化改进型，于2006年投入使用，具有一系列改进，如全新的数字声学导引头、制导计算机和舵面的机电驱动系统。

swe_torped_45=Torped 45,SLWT,反潜鱼雷,一种瑞典轻型反潜鱼雷，用于短程到中程拦截。它使用主动/被动声学制导，针对底部杂波和混响使探测复杂化的近岸作战进行了优化。在有来自舰壳声呐或拖曳/可变深度声呐的良好初始目标定位后，交由武器导引头进入末段时使用效果最佳。
swe_torped_47=Torped 47,SLWT,反潜鱼雷,一种用于现代浅水反潜的新型瑞典轻型鱼雷。它设计用于在嘈杂的近岸环境中提高性能、更好的反制对抗能力以及在复杂传播条件下更高的可靠性。当您能够从声呐系统提供准确的初始方位/距离时，将其用作主要的近距离反潜武器。

eu_mm_g6e=G6e,,反水面鱼雷,G6e是德国二战G7e电动直航鱼雷的改进版。出于为即将服役的Toti级潜艇装备武器的需要，意大利Whitehead-Motofides公司通过将G7e缩短一米、引入更高能量密度的银锌电池并安装被动声学导引头来修改G7e。由于这是在双用途A.184鱼雷到来之前的权宜之计，到20世纪60年代中期只生产了二十多枚G6e并分配给Toti级潜艇。
eu_mm_a184=A.184 Mod 0,,反潜/反水面鱼雷,A.184是意大利海军的标准重型双用途鱼雷。在1974年引入之前，意大利海军仍装备遗留的二战鱼雷用于反舰作战，并且没有专用的重型反潜鱼雷。这对于在60年代中期建为专用潜艇猎手的Toti级潜艇来说尤其成问题，而当时海军武器库中实际上没有合适的反潜鱼雷。随后开始改进A.182鱼雷，产生了A.184。
eu_mm_a184_mod1=A.184 Mod 1,,反潜/反水面鱼雷,A.184是意大利海军的标准重型双用途鱼雷。从1978年开始，该鱼雷升级了改进的电子制导系统，以增强对抗反制措施的能力并提高可靠性。
eu_mm_a184_mod2=A.184 Mod 2,,反潜/反水面鱼雷,A.184是意大利海军的标准重型双用途鱼雷。mod. 2型号是A.184的拦截包线扩展升级，旨在提高其对抗新一代苏联攻击潜艇的能力，将其能力提升到接近20世纪80年代中期其他北约成员国装备的更快速鱼雷的水平。
eu_mm_si270=S.I. 270/533,,反水面鱼雷,S.I. 270/533X7,2 Tipo I是一种意大利二战湿式加热式直航鱼雷。
eu_mm_a244_ship=A.244,,反潜鱼雷,A.244是一种由意大利Whitehead Alenia公司开发的轻型反潜鱼雷，作为MK 44鱼雷的替代品。它与旧武器共享许多设计相似之处，如单频导引头，但在速度和续航力等关键领域有所改进。
eu_mm_a244_air=A.244,,反潜鱼雷,A.244是一种由意大利Whitehead Alenia公司开发的轻型反潜鱼雷，作为MK 44鱼雷的替代品。它与旧武器共享许多设计相似之处，如单频导引头，但在速度和续航力等关键领域有所改进。
eu_mm_a244s_ship=A.244/S,,反潜鱼雷,A.244/S是A.244轻型反潜鱼雷的改进型号，最初由Whitehead Alenia公司开发作为MK 44鱼雷的替代品。它于1984年推出，与基本型号最显著的区别在于使用了新的CIACIO-S三频导引头，显著增强了武器的探测能力。
eu_mm_a244s_air=A.244/S,,反潜鱼雷,A.244/S是A.244轻型反潜鱼雷的改进型号，最初由Whitehead Alenia公司开发作为MK 44鱼雷的替代品。它于1984年推出，与基本型号最显著的区别在于使用了新的CIACIO-S三频导引头，显著增强了武器的探测能力。
eu_mm_a244s_mod1_ship=A.244/S Mod 1,,反潜鱼雷,A.244/S是A.244轻型反潜鱼雷的改进型号，最初由意大利Whitehead Alenia公司开发作为MK 44鱼雷的替代品。该武器的mod. 1升级引入了一些拦截包线改进，以及一个能够使用多预成形波束的新导引头，波束形状可根据声学条件改变。
eu_mm_a244s_mod1_air=A.244/S Mod 1,,反潜鱼雷,A.244/S是A.244轻型反潜鱼雷的改进型号，最初由意大利Whitehead Alenia公司开发作为MK 44鱼雷的替代品。该武器的mod. 1升级引入了一些拦截包线改进，以及一个能够使用多预成形波束的新导引头，波束形状可根据声学条件改变。
mm_mu_90=MU90,冲击,反潜鱼雷,MU90是一种由名为"EuroTorp"的联合企业生产的法国-意大利轻型反潜鱼雷。它是意大利（A.290）和法国（Murene）两个独立项目的结果，目的是在冷战末期开发一种新的轻型反潜鱼雷。MU90由高速泵喷发动机推进，使用非常先进的双模导引头和先进的抗反制能力。
mm_mu_90_ship=MU90,冲击,反潜鱼雷,MU90是一种由名为"EuroTorp"的联合企业生产的法国-意大利轻型反潜鱼雷。它是意大利（A.290）和法国（Murene）两个独立项目的结果，目的是在冷战末期开发一种新的轻型反潜鱼雷。MU90由高速泵喷发动机推进，使用非常先进的双模导引头和先进的抗反制能力。

usn_mk14=MK 14,,反水面鱼雷,Mark 14是一种在二战前开发的直航重型反舰鱼雷。尽管存在许多缺陷和可靠性问题，它仍投入大规模生产并成为美国海军的标准重型鱼雷，其缺陷在战争期间逐步得到解决。二战后，它与MK 16一起作为主要反舰鱼雷继续在美国服役，直到MK 48的到来。该鱼雷的mod. 3型号配备了更重的战斗部。
usn_mk16_mod8=MK 16 Mod 8,,反水面鱼雷,Mark 16是一种过氧化氢燃料鱼雷，从美国海军二战期间使用的标准Mark 14鱼雷发展而来，融合了许多经过实战检验的改进。由于单位成本高且Mark 14的可靠性问题在战争结束前已得到解决，该鱼雷仅限量生产，但在MK 48到来之前与MK 14一起一直是美国海军的主要反舰鱼雷。该鱼雷的mod. 8型号将MK 16 mod. 0原先较大的战斗部与MK 16 mod. 1的改进射程结合在一起。
usn_mk46_mod0_air=MK 46 Mod 0,,反潜鱼雷,Mark 46 Mod 0鱼雷是多国使用的北约轻型鱼雷标准。设计用于攻击现代苏联高性能潜艇，此型号为空投型。
usn_mk46_mod0_ship=MK 46 Mod 0,,反潜鱼雷,Mark 46 Mod 0鱼雷是多国使用的北约轻型鱼雷标准。设计用于攻击现代苏联高性能潜艇，此型号为空投型。
usn_mk46_mod1_air=MK 46 Mod 1,,反潜鱼雷,Mark 46 Mod 1鱼雷是多国使用的北约轻型鱼雷标准。设计用于攻击现代苏联高性能潜艇，此型号为空投型。Mod 1是升级版，配备了新的液体奥托燃料发动机，增加了武器的射程。
usn_mk46_mod1_ship=MK 46 Mod 1,,反潜鱼雷,Mark 46 Mod 1鱼雷是多国使用的北约轻型鱼雷标准。设计用于攻击现代苏联高性能潜艇，此型号为空投型。Mod 1是升级版，配备了新的液体奥托燃料发动机，增加了武器的射程。
usn_mk46_5_air=MK 46 Mod 5,NEARTIP,反潜/反水面鱼雷,Mark 46 Mod 5鱼雷是多国使用的北约轻型鱼雷标准。Mod 5版本增加了有限效能地攻击水面目标或浮出水面潜艇的能力，改进了燃料和发动机系统以实现更高效的巡航和更快的末段，并提高了导引头对抗反制措施的免疫力。此型号为空投型。
usn_mk46_5_asroc=MK 46 Mod 5,NEARTIP,反潜/反水面鱼雷,Mark 46 Mod 5鱼雷是多国使用的北约轻型鱼雷标准。Mod 5版本增加了有限效能地攻击水面目标或浮出水面潜艇的能力，改进了燃料和发动机系统以实现更高效的巡航和更快的末段，并提高了导引头对抗反制措施的免疫力。此型号为阿斯洛克投放型。
usn_mk46_5_ship=MK 46 Mod 5,NEARTIP,反潜/反水面鱼雷,Mark 46 Mod 5鱼雷是多国使用的北约轻型鱼雷标准。Mod 5版本增加了有限效能地攻击水面目标或浮出水面潜艇的能力，改进了燃料和发动机系统以实现更高效的巡航和更快的末段，并提高了导引头对抗反制措施的免疫力。此型号为阿斯洛克投放型。
usn_mk48_5=MK 48 Mod 5,ADCAP,反潜/反水面鱼雷,Mark 48 Mod 5 ADCAP是一种美国重型鱼雷。这些鱼雷是线导的，能够从发射平台重新瞄准目标。Mod 5 ADCAP（先进能力型）是对Mark 48 Mod 4运动能力的一次全面升级，极大地提高了速度、射程、机动性和深潜性能，同时保留了Mark 48 Mod 4强大的导引头特性。在其时代是真正的顶级鱼雷。
usn_mk48_6=MK 48 Mod 6,ADCAP,反潜/反水面鱼雷,Mark 48 Mod 6 ADCAP是一种美国重型鱼雷。这些鱼雷是线导的，能够从发射平台重新瞄准目标。Mod 6型号主要改进了鱼雷的导引头和推进系统，提高了抗反制能力和可靠性，同时使鱼雷射程显著更远且比其早期对应型号更安静。
usn_mk48_7=MK 48 Mod 7,CBASS,反潜/反水面鱼雷,Mark 48 Mod 7 CBASS是一种美国重型鱼雷。这些鱼雷是线导的，能够从发射平台重新瞄准目标。Mod 7 CBASS型号提高了浅水能力、反制抑制性能和机动性，以应对最新威胁。它还具有比其前身更短的最小射程。
usn_mk48_8=MK 48 Mod 8,TI-1,反潜/反水面鱼雷,MK 48 Mod 8是美国海军标准重型声学制导鱼雷的最新重大硬件升级，旨在对抗现代隐身潜艇和反鱼雷对抗措施，适用于整个潜艇舰队。一项主要进步是改进型发射后通信系统(IPLCS)，它用光纤取代了传统的铜线，为实时声呐数据和目标更新提供大幅增加的带宽。此外，通过技术插入1(TI-1)和APB 6计划，该鱼雷集成了先进的数字信号处理、升级的引信和扩大的声频范围和空间分辨率的改进声呐阵列。在这些升级的数字控制算法引导下，Mod 8对敌方声学诱饵具有卓越的抵抗力，并擅长在复杂的浅水和近岸水域作战。
usn_mk50_air=MK 50,ALWT,反潜鱼雷,Mark 50先进轻型鱼雷是一种下一代反潜武器，旨在赋予较轻平台所需的关键能力以有效对抗最新的深潜潜艇。虽然ALWT计划被取消，但生产了数百枚鱼雷，刚好够整个舰队共享。此型号为空投型。
usn_mk50_ship=MK 50,ALWT,反潜鱼雷,Mark 50先进轻型鱼雷是一种下一代反潜武器，旨在赋予较轻平台所需的关键能力以有效对抗最新的深潜潜艇。虽然ALWT计划被取消，但生产了数百枚鱼雷，刚好够整个舰队共享。此型号为舰射型。
usn_mk50_asroc=MK 50,ALWT,反潜鱼雷,Mark 50先进轻型鱼雷是一种下一代反潜武器，旨在赋予较轻平台所需的关键能力以有效对抗最新的深潜潜艇。虽然ALWT计划被取消，但生产了数百枚鱼雷，刚好够整个舰队共享。此型号为阿斯洛克投放型。
usn_mk54_air=MK 54,LHT,反潜鱼雷,Mark 54轻型混合鱼雷(LHT)是一种经济实惠的新型轻型反潜鱼雷标准，结合了高性能MK 50 ALWT使用的所有导引头技术，同时使用MK 46鱼雷体的适度升级版本。这使得像MK 54这样便宜、通用的鱼雷对大多数目标具有非常高的性能，即使它在对抗超深潜快速潜艇方面可能不如MK 50那样有能力。此型号为空投型。
usn_mk54_ship=MK 54,LHT,反潜鱼雷,Mark 54轻型混合鱼雷(LHT)是一种经济实惠的新型轻型反潜鱼雷标准，结合了高性能MK 50 ALWT使用的所有导引头技术，同时使用MK 46鱼雷体的适度升级版本。这使得像MK 54这样便宜、通用的鱼雷对大多数目标具有非常高的性能，即使它在对抗超深潜快速潜艇方面可能不如MK 50那样有能力。此型号为舰射型。
usn_mk54_asroc=MK 54,LHT,反潜鱼雷,Mark 54轻型混合鱼雷(LHT)是一种经济实惠的新型轻型反潜鱼雷标准，结合了高性能MK 50 ALWT使用的所有导引头技术，同时使用MK 46鱼雷体的适度升级版本。这使得像MK 54这样便宜、通用的鱼雷对大多数目标具有非常高的性能，即使它在对抗超深潜快速潜艇方面可能不如MK 50那样有能力。此型号为阿斯洛克投放型。
usn_mk54_1_air=MK 54 Mod 1,LHT,反潜/反水面鱼雷,MK 54 Mod 1主要改进了早期MK 54武器的声呐阵列、电子设备和信号处理，同时保持大致相似的推进和射程性能。
usn_mk54_1_ship=MK 54 Mod 1,LHT,反潜/反水面鱼雷,MK 54 Mod 1主要改进了早期MK 54武器的声呐阵列、电子设备和信号处理，同时保持大致相似的推进和射程性能。
usn_mk54_1_asroc=MK 54 Mod 1,LHT,反潜/反水面鱼雷,MK 54 Mod 1主要改进了早期MK 54武器的声呐阵列、电子设备和信号处理，同时保持大致相似的推进和射程性能。
usn_mk54_2_air=MK 54 Mod 2,LHT,反潜/反水面鱼雷,估计的近期MK 54 Mod 2空射鱼雷。公开测试报告称Mod 2增加了新的发动机和战斗部，以提高速度、续航力、杀伤力和作战深度。
usn_mk54_2_ship=MK 54 Mod 2,LHT,反潜/反水面鱼雷,估计的近期MK 54 Mod 2空射鱼雷。公开测试报告称Mod 2增加了新的发动机和战斗部，以提高速度、续航力、杀伤力和作战深度。
usn_mk54_2_asroc=MK 54 Mod 2,LHT,反潜/反水面鱼雷,估计的近期MK 54 Mod 2空射鱼雷。公开测试报告称Mod 2增加了新的发动机和战斗部，以提高速度、续航力、杀伤力和作战深度。
usn_mk58_craw=MK 58,CRAW VLWT,反潜/反水面鱼雷,MK 58紧凑型快速攻击武器/超轻型鱼雷。公开信息表明一种紧凑的进攻和防御鱼雷概念，用于增加弹仓深度和反鱼雷任务，但详细速度数据未公开。

wp_53-56va=53-56VA,,尾流自导鱼雷,53-56是一系列苏联重型直航鱼雷。它们是53-38的更新型号。53-56VA是53-56V的改进版，引入了尾流自导导引头，并专门用于出口。
wp_53-65m=53-65M,,尾流自导鱼雷,53-65是一种苏联尾流自导重型鱼雷，设计用于摧毁水面舰艇。53-65M是原53-65的改进型号，具有改进的煤油-过氧化氢涡轮以增加射程。
wp_saet-60=SAET-60,,反水面鱼雷,SAET-60是一种苏联重型反舰鱼雷，于1961年首次推出。由于双用途USET-80的反舰能力有限，SAET-60在苏联服役了很长时间，并进行了几次升级。
wp_saet-60m=SAET-60M,,反水面鱼雷,SAET-60是一种苏联重型反舰鱼雷，于1961年首次推出。由于双用途USET-80的反舰能力有限，SAET-60在苏联服役了很长时间，并进行了几次升级。SAET-60M具有射程改进，仅以最小的速度牺牲为代价。
wp_at-2_early=AT-2,,反潜鱼雷,AT-2是一种苏联电动重型反潜空投鱼雷，具有主动/被动声学制导。AT-2是少数空射重型鱼雷之一，因为大多数空投鱼雷要小得多，重量只有四分之一。
wp_at-2=AT-2M,,反潜鱼雷,AT-2是一种苏联电动重型反潜空投鱼雷，具有主动/被动声学制导。AT-2是少数空射重型鱼雷之一，因为大多数空投鱼雷要小得多，重量只有四分之一。AT-2M是一种改进型号，采用了之前在SET-65M上引入的新型"Sapfir"导引头。
wp_set-40u=SET-40U,,反潜鱼雷,SET-40是一种苏联轻型电动反潜鱼雷。SET-40U升级引入了改进的导引头。
wp_set-53=SET-53,Yenot 1,反潜鱼雷,SET-53是一种苏联重型反潜鱼雷。随着1958年的引入，它成为苏联武器库中第一种专用反潜鱼雷。
wp_set-53m=SET-53M,Yenot 1,反潜鱼雷,SET-53是一种苏联重型反潜鱼雷。SET-53M是SET-53的升级型号，射程增加。
wp_set-65m=SET-65M,Yenot 2,反潜鱼雷,SET-65是一种苏联重型电动反潜鱼雷。SET-65M是SET-65的改进版，于1972年推出，采用了新的"Sapfir"声学导引头。
wp_set-65k=SET-65K,Yenot 2,反潜鱼雷,SET-65是一种苏联重型电动反潜鱼雷。SET-65K是SET-65M的进一步改进版，于1986年推出，现在配备了新开发的"Keramika"导引头，同时在TEST-71MK上引入。
wp_test-71mk=TEST-71MK,,反潜鱼雷,TEST-71是一种苏联重型反潜线导鱼雷。TEST-71MK于1986年推出，配备了新开发的"Keramika"导引头，同时在SET-65K上引入。
wp_test-71m-nk=TEST-71M-NK,,反潜鱼雷,TEST-71是一种苏联重型反潜线导鱼雷。TEST-71M-NK是Test-71MK的通用型号，可从潜艇和水面舰艇发射。
wp_umgt-1m=UMGT-1M,Orlan,反潜鱼雷,UMGT-1是一种苏联空投反潜鱼雷，也用作SS-N-14和SS-N-16反潜导弹的有效载荷。这些轻型鱼雷的威力不如苏联重型鱼雷，但仍然极其危险。UMGT-1M是一种升级版，能够在更大深度攻击目标，并具有攻击水面舰艇的能力。
wp_uset-80k=USET-80K,,反潜/反水面鱼雷,USET-80是苏联海军第一种设计上即为双用途的鱼雷。USET-80K是一种在冷战结束前不久引入苏联海军的升级型号。它用更可靠的"Keramika"声学导引头替换了复杂且故障频发的"Vodopad"导引头，该导引头之前已在SET-65K和TEST-71MK上引入。

# ------------------ Bombs -----------------
usn_gbu-12d=GBU-12D,,制导炸弹
gre_mk_54=MK 54,,深水炸弹,美国制造的深水炸弹，设计用于从飞机投放

eu_am_kb44=KB 44,,反坦克集束子弹药,Kleinbombe 44是西德开发的MW-1弹药布撒器携带的子弹药之一。它具有组合式聚能和破甲战斗部，用于对抗非装甲或轻装甲目标，如装甲运兵车和停放的飞机。

eu_am_stabo=STABO,,反跑道子弹药,Startbahnbombe（"跑道炸弹"）是西德开发的MW-1弹药布撒器携带的子弹药之一。它携带两级聚能装药战斗部，第一级在撞击时引爆以在沥青中形成通道，第二级在地表下爆炸以形成空腔，使其更难修复。

# ---------------- Sonobuoys ---------------
rn_ssq-904=SSQ-904,,声呐浮标,SSQ-904是英国开发的AN/SSQ-41"Jezebel"声呐浮标的F尺寸版本，约为标准A尺寸浮标的三分之一大。这使得反潜平台能够携带三倍数量的声呐浮标有效载荷，但牺牲了电池寿命。
rn_ssq-906=SSQ-906,,声呐浮标,SSQ-906是英国开发的AN/SSQ-53B DIFAR声呐浮标的F尺寸版本，约为标准A尺寸浮标的三分之一大。这使得反潜平台能够携带三倍数量的声呐浮标有效载荷，但牺牲了电池寿命。
rn_ssq-906g=SSQ-906G,,声呐浮标,SSQ-906G是英国开发的F尺寸LOFAR声呐浮标。它通过约为标准A尺寸浮标的三分之一大，使反潜平台能够携带三倍数量的声呐浮标有效载荷，但牺牲了一些电池寿命。
rn_ssq-926=SSQ-926,ALFEA,主动声呐浮标,SSQ-626是一种英国高功率主动声呐浮标，相当于AN/SSQ-101 ADAR。
rn_ssq-954=SSQ-954,,声呐浮标,SSQ-954是英国开发的AN/SSQ-41"Jezebel"声呐浮标的微型化版本。它通过为标准尺寸浮标的一半大小，使反潜直升机能够携带的声呐浮标总有效载荷翻倍，但以电池寿命为代价。
rn_ssq-955=SSQ-955,HIDAR,声呐浮标,SSQ-955是英国开发的F尺寸被动声呐浮标。它大致相当于AN/SSQ-53F。
rn_ssq-955b=SSQ-955B,HIDAR,声呐浮标,SSQ-955B是英国开发的F尺寸被动声呐浮标。它大致相当于AN/SSQ-53G。
rn_ssq-963a=SSQ-963A,CAMBS III,主动声呐浮标,SSQ-963A是一种英国主动声呐浮标，相当于AN/SSQ-62A。
rn_ssq-963b=SSQ-963B,CAMBS IV,主动声呐浮标,SSQ-963B是一种英国主动声呐浮标，相当于AN/SSQ-62B。
rn_ssq-963c=SSQ-963C,CAMBS V,主动声呐浮标,SSQ-963C是一种英国主动声呐浮标，相当于AN/SSQ-62C。
rn_ssq-963d=SSQ-963D,CAMBS VI,主动声呐浮标,SSQ-963D是一种英国主动声呐浮标，相当于AN/SSQ-62E。

usn_ssq-41b=AN/SSQ-41B,LOFAR,声呐浮标,AN/SSQ-41B"Jezebel"是一种低频分析与记录(LOFAR)型声呐浮标。这是最常见的北约被动声呐浮标，无法像后来的DIFAR声呐浮标那样确定方位，但仍然具有良好的灵敏度，可以在任何西方海军的库存中找到大量该型号。
usn_ssq-53b=AN/SSQ-53B,DIFAR,声呐浮标,AN/SSQ-53B是一种定向频率分析与记录(DIFAR)型声呐浮标。这为声呐浮标操作员提供了磁航向信息，相比早期的全向CRT-1是一个巨大的进步。此版本具有进一步改进的水听器，与先前型号相比允许更大的操作灵活性。
usn_ssq-53d=AN/SSQ-53D,DIFAR,声呐浮标,AN/SSQ-53D是一种定向频率分析与记录(DIFAR)型声呐浮标。这为声呐浮标操作员提供了磁航向信息，相比早期的全向CRT-1是一个巨大的进步。此版本具有进一步改进的水听器，与先前型号相比允许更大的操作灵活性。
usn_ssq-53f=AN/SSQ-53F,DIFAR,声呐浮标,AN/SSQ-53F是一种定向频率分析与记录(DIFAR)型声呐浮标。这为声呐浮标操作员提供了磁航向信息，相比早期的全向CRT-1是一个巨大的进步。此版本具有进一步改进的水听器，与先前型号相比允许更大的操作灵活性。
usn_ssq-53g=AN/SSQ-53G,DIFAR,声呐浮标,AN/SSQ-53G是一种定向频率分析与记录(DIFAR)型声呐浮标。这为声呐浮标操作员提供了磁航向信息，相比早期的全向CRT-1是一个巨大的进步。此版本具有进一步改进的水听器，与先前型号相比允许更大的操作灵活性。
usn_ssq-53h=AN/SSQ-53H,DIFAR,声呐浮标,AN/SSQ-53H是一种定向频率分析与记录(DIFAR)型声呐浮标。这为声呐浮标操作员提供了磁航向信息，相比早期的全向CRT-1是一个巨大的进步。此版本具有进一步改进的水听器，与先前型号相比允许更大的操作灵活性。
usn_ssq-62b=AN/SSQ-62B,DICASS,主动声呐浮标,AN/SSQ-62B DICASS是一种主动声呐浮标，用于精确定位先前通过SSQ-53被动声呐浮标定位的水下潜艇。此型号具有显著改进的声呐系统，大大提高了精度和射程，同时增加了声呐浮标可探测的频率，使其在近岸水域具有更好的性能。
usn_ssq-62c=AN/SSQ-62C,DICASS,主动声呐浮标,AN/SSQ-62C DICASS是一种主动声呐浮标，用于精确定位先前通过SSQ-53被动声呐浮标定位的水下潜艇。此型号具有显著改进的声呐系统，大大提高了精度和射程，同时增加了声呐浮标可探测的频率，使其在近岸水域具有更好的性能。
usn_ssq-62e=AN/SSQ-62E,DICASS,主动声呐浮标,AN/SSQ-62E DICASS是一种主动声呐浮标，用于精确定位先前通过SSQ-53被动声呐浮标定位的水下潜艇。此型号具有显著改进的声呐系统，大大提高了精度和射程，同时增加了声呐浮标可探测的频率，使其在近岸水域具有更好的性能。
usn_ssq-62f=AN/SSQ-62F,DICASS,主动声呐浮标,AN/SSQ-62F DICASS是一种主动声呐浮标，用于精确定位先前通过SSQ-53被动声呐浮标定位的水下潜艇。此型号具有显著改进的声呐系统，大大提高了精度和射程，同时增加了声呐浮标可探测的频率，使其在近岸水域具有更好的性能。
usn_ssq-62g=AN/SSQ-62G,DICASS,主动声呐浮标,AN/SSQ-62G DICASS是一种主动声呐浮标，用于精确定位先前通过SSQ-53被动声呐浮标定位的水下潜艇。此型号具有显著改进的声呐系统，大大提高了精度和射程，同时增加了声呐浮标可探测的频率，使其在近岸水域具有更好的性能。
usn_ssq-75=AN/SSQ-75A,ERAPS,主动声呐浮标,AN/SSQ-75 ERAPS（一次性可靠声学路径声呐浮标）是一种远程、定向、指令激活的主动声呐浮标。以其在开阔海洋中对安静潜艇的高性能而闻名，该声呐浮标提供卓越的性能，但不幸的是，其采购量极为有限，因此很少有库存保留下来。
usn_ssq-77b=AN/SSQ-77B,VLAD,声呐浮标,AN/SSQ-77B是一种垂直线列阵DIFAR被动声呐浮标，设计为原DIFAR型被动声呐浮标的代际改进。该浮标具有与DIFAR浮标相似的架构，但集成了极为灵敏的声呐阵列，使声呐浮标具有极远的被动探测距离、对安静深潜目标的高能力，并在杂波和噪声水域表现出良好的性能。\n\n此更高性能的代价是该浮标的重量和成本，意味着这些不是标准探测浮标，且其远距离精度较差，因此它们主要用于水下目标的定位。
usn_ssq-77c=AN/SSQ-77C,VLAD,声呐浮标,AN/SSQ-77C是一种垂直线列阵DIFAR被动声呐浮标，设计为原DIFAR型被动声呐浮标的代际改进。该浮标具有与DIFAR浮标相似的架构，但集成了极为灵敏的声呐阵列，使声呐浮标具有极远的被动探测距离、对安静深潜目标的高能力，并在杂波和噪声水域表现出良好的性能。\n\n此更高性能的代价是该浮标的重量和成本，意味着这些不是标准探测浮标，且其远距离精度较差，因此它们主要用于水下目标的定位。
usn_ssq-101=AN/SSQ-101A,ADAR,主动声呐浮标,AN/SSQ-101A ADAR是一种主动声呐浮标，用于对潜艇等水下目标进行武器级质量跟踪。这是一种高性能的主动声呐浮标，可以有效探测安静或深潜的潜艇目标，并能够对噪声较大的水下目标提供更远的跟踪距离，从而实现有效的远程反潜作战。

