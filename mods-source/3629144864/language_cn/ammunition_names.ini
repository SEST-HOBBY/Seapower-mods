ger_27mm=27mm,,MLG 27,用于近距离防御的MLG 27遥控武器站的高射速27毫米弹药。该系列包括针对水面和有限空中目标的适用弹种。有效使用依赖于稳定的火控和良好的引导。典型任务为警告射击以及在短距离内消灭小艇和无人机。弹仓选择取决于舰艇作战条令和预期威胁。
