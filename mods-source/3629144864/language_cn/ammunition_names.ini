# ----------- Noisemakers/Chaff -----------
ger_MASS_omnitrap=MASS Omni-Trap,,箔条,一种用于MASS发射装置系列的多光谱81毫米诱饵弹。有效载荷可编程以产生射频、红外和光电波段内的遮蔽和诱骗效果。齐射与舰艇机动和电子战条令协调以挫败导弹导引头。当与机载电子对抗措施结合时，该系统支持分层软杀伤。有效性取决于时机、几何关系和威胁导引头类型。
ger_MASS_ATD_noisemaker=MASS ATD,,噪声诱饵,MASS的一种可选反鱼雷能力，可发射一次性声学效应器。这些诱饵用于在舰艇机动时分散或迷惑来袭鱼雷。发射与声呐警报和对抗措施条令协调。该方法将软杀伤保护扩展到水下领域。库存有限，使用受水况和威胁行为限制。
ger_C303S_noisemaker=C303/S,,噪声诱饵,一种通过C303/S对抗措施弹射系统发射的一次性声学噪声诱饵，用于削弱鱼雷寻的。该诱饵增加局部声学杂波，可以掩盖平台的真实方位以延迟或中断导引头分类。与航向和深度变化以及分层对抗措施结合时效果最佳。库存有限，使用取决于声呐警报质量和威胁类型。
usn_mk214_chaff=箔条,,SRBOC,Mark 36 SRBOC（超级快速开花式舷外对抗措施）是美国海军应对新兴反舰导弹威胁的解决方案，同时对抗雷达寻的和红外制导导弹。该系统连接到舰艇的中央武器系统，高度自动化，能够以极短的反应时间部署箔条和红外诱饵对抗措施，非常适合对抗掠海威胁。\n\n该特定系统使用先进的Sea Gnat对抗措施系统，通过MK 214、MK 216箔条诱骗和分散对抗措施以及MK 245 GIANT红外诱饵对抗措施来有效对抗现代反舰导弹。
usn_adc_mk2_noisemaker=噪声诱饵,ADC MK 2,鱼雷诱饵,ADC MK 2 mod 0鱼雷诱饵是一种声学对抗措施，设计用于模仿舰船或潜艇的空化噪声信号，试图将鱼雷诱离舰船。MK 2具有6分钟的续航时间，并且由于其体积较大而具有更大的发射能力。
usn_adc_mk2_mod3_noisemaker=噪声诱饵,ADC MK 2 Mod 3,鱼雷诱饵,ADC MK 2 Mod 3是一种3英寸直径的电池供电一次性声学鱼雷诱饵，针对弗吉尼亚级攻击潜艇进行了优化。它于2007年推出，使用与Mod 0/1基线相同的3英寸声学换能器，在预选深度悬停并发射声学信号以欺骗来袭鱼雷。Mod 3编号反映的是弗吉尼亚级内部发射系统的兼容性，而非相对于早期型号的任何声学能力改进。
usn_adc_mk2_mod4_noisemaker=噪声诱饵,ADC MK 2 Mod 4,鱼雷诱饵,ADC MK 2 Mod 4是一种用于水面舰艇的3英寸直径一次性声学鱼雷诱饵，由驱逐舰和巡洋舰人员手动投掷，作为备用的鱼雷防御层。它代表了比早期Mod 0/1/3型号更新的电子技术代，一旦部署入水后声学上与潜射型Mod 5相同。它作为水面舰艇主要LEAD系统的手动备份。
usn_adc_mk2_mod5_noisemaker=噪声诱饵,ADC MK 2 Mod 5,鱼雷诱饵,ADC MK 2 Mod 5是一种用于潜艇的3英寸直径一次性声学鱼雷诱饵，从内部对抗措施发射器(ICL)（也称为信号弹射器）发射。它在声学上与水面发射的Mod 4相同，共享相同的电子技术代和3英寸发射器。Mod 5编号仅反映ICL发射兼容性，与Mod 4相比没有声学性能差异。
usn_adc_mk2_mod7_noisemaker=噪声诱饵,ADC MK 2 Mod 7,鱼雷诱饵,ADC MK 2 Mod 7是3英寸MK 2系列的最新型号。其相比早期型号的主要改进是引入了热锂电池，取代了海水激活电池，显著延长了工作时间至7分钟。声学输出与所有先前MK 2型号保持相同的3英寸发射器——热锂电池改善的是持续时间，而非欺骗能力。
usn_adc_mk3_mod1_noisemaker=噪声诱饵,ADC MK 3 Mod 1,鱼雷诱饵,ADC MK 3 Mod 1是一种6.25英寸直径的一次性声学鱼雷诱饵，代表了相比整个3英寸MK 2系列的重大能力飞跃。它储存在潜艇耐压壳体和外壳体之间特殊发射容器中，通过气体发生器部署。更大的发射器提供比任何3英寸设备大得多的声学输出，并支持多种模式，包括编程声学噪声、干扰和诱饵信号。2004年具备初始作战能力，在所有美国海军潜艇中积极生产和服役。
usn_adc_mk4_jammer=干扰噪声诱饵,ADC MK 4,鱼雷诱饵,ADC MK 4鱼雷诱饵是一种声学对抗措施，设计用于混淆鱼雷导引头和对方声呐，尽管经验丰富的声呐操作员可以轻松区分虚假接触和真实接触。这是一种极其有效的对抗措施，但仅持续1分钟后电池就会耗尽。
usn_adc_mk5_ngcm_noisemaker=噪声诱饵,ADC MK 5 NGCM,鱼雷诱饵,ADC MK 5是下一代对抗措施(NGCM)，旨在取代美国海军服役中的ADC MK 3。尽管与MK 2系列共享3英寸外形尺寸，它通过自适应对抗措施(ACM)技术引入了全新的能力层级。MK 5通过机载威胁分类器对来袭鱼雷进行分类，并实时调整其声学响应。它既可以作为静态干扰器部署，也可以作为移动诱饵部署，通过全双工声学通信链路以最多六枚的编组协同作战，并接收来自潜艇和水面舰艇的战术更新。2027财年具备初始作战能力。
usn_LEAD_noisemaker=LEAD,,鱼雷诱饵,LEAD（发射型一次性声学诱饵）是一种水面舰艇一次性声学鱼雷诱饵，从标准MK 36 SRBOC迫击炮发射器发射。它于1997年推出，发射后进入水中，使用海水电池在深度悬停并广播宽带声学噪声，以将来袭鱼雷引离舰船。它部署在所有配备MK 36 SRBOC发射器的美国海军水面舰艇上，并作为拖曳式Nixie系统的补充层。
ita_canto-v=噪声诱饵,CANTO-V,噪声诱饵

# ----------------- Decoys ----------------
ger_C303S_MTE=C303/S MTE,Mobile Target Emulator,鱼雷诱饵,一种从C303/S对抗措施弹射系统部署的移动式一次性声学诱饵。它旨在通过呈现令人信服的移动目标信号来诱骗或分散来袭鱼雷，迫使导引头锁定诱饵。使用与规避机动和额外对抗措施协调以打破拦截几何条件。有效性取决于时机、分离和局部水况。
ger_3DDS=3DDS,Decoy Drone
fr_canto=反鱼雷诱饵,Canto,
usn_an_slq_25a_nixie_decoy=AN/SLQ-25A,Nixie-A,诱饵,Nixie（正式名称AN/SLQ-25A）是一种主要由美国海军水面舰艇使用的拖曳式诱饵系统。该系统产生信号，旨在将接近的鱼雷引离载舰平台。SLQ-25A型号具有更强的辐射特性，可以更轻松地欺骗来袭鱼雷。
usn_an_slq_25b_nixie_decoy=AN/SLQ-25B,Nixie-B,诱饵,AN/SLQ-25B是一种升级型Nixie拖曳式诱饵系统，主要用于美国海军航母。在25A的基础上，它增加了对抗主动寻的鱼雷的能力，通过拦截并以接收幅度的2-3倍返回来袭鱼雷的声呐脉冲信号。它还引入了用于鱼雷警报的拖曳阵列传感器和光纤显示局域网。
usn_an_slq_25c_nixie_decoy=AN/SLQ-25C,Nixie-C,诱饵,AN/SLQ-25C是AN/SLQ-25A的通用电子设备升级，于2007年首次采购。它引入了额外的对抗措施模式、更可靠的功率放大、新的商用现货信号发生器和更长的近岸光纤拖缆，以改善浅水性能。它成为整个美国海军水面舰队标准化的Nixie型号。
usn_an_slq_25e_nixie_decoy=AN/SLQ-25E,Nixie-E,诱饵,AN/SLQ-25E是Nixie拖曳式诱饵系列中最强大的型号，专门改进了对抗尾流自导、声学寻的和线导鱼雷的能力。它于2019年投入生产，正在全舰队替换所有先前的Nixie型号，代表了美国海军水面舰艇鱼雷防御的当前标准。


