This text file explained all Dutch radars and Directors prefix menings and roles:


#Prefix	Meaning	Radar 						Role#
-LW		Lucht Waarschuwing	Air Warning		Long-range air search
-DA		Doel Aanwijzing	Target indication 	Medium-range air search
-ZW		Zee Waarneming	Surface search		Surface search/navigation
-WM		Wapen Meet	Fire control			weapon guidance
-VI		Hoogteradar	Height Radar			Height finder(altitude finding)

##### Possible frequency bands (ITU => ECM):
# VHF-Band  => A-Band    100...300MHz
# UHF-Band  => B/C-Band: 300...1000MHz
# L-Band    => D-Band:     1...2GHz
# S-Band    => E/F-Band:   2...4GHz
# C-Band    => G-Band:     4...8GHz
# X-Band    => H/I-Band:   8...10GHz
# Ku-Band   => J-Band:    10...20GHz
# K-Band    => K-Band:    20...30GHz
# Ka-Band   => K-Band:    30...40GHz
#####


[HSA VI SERIES RADARS]
#function description
Receive 2D track from LW radar, couple it with VI radar to gain altitude and make it a 3D pairing
Feed fire control systems with altitude info

#statistics for VI series
Band: S band (Late units might have had L)
Type: Height Finder Radar
Peak power: 500-800 kW
Range: 160-200km

#users VI series (VI-01)
Dutch navy
Argentine navy
Peru navy

#Other naming conventions for VI radars
VI-01:SGR-109/2


[eu_vi01] Hollandse Signaal VI-01
Kind=Radar
Type=Targeting				// Classes can be "Search", "Targeting"
HasDataLink=False			// true means the sensor data will be used for the entire task force via data link, false local use only
Role=Air                  	// Role can be "Surface", "Air", "AirAndSurface"                            
Mode=Illuminate             // Can be "Illuminate", "RadioCommand"                 	                                    
RotationDirection=1         // if applicable number of targets it can track simultaneously                                                         
TargetChannels=6            // if applicable number of weapons (missiles) it can guide simultaneously                          
WeaponChannels=1  			// revolutions per minute
RPM=51                      // min range in km                                      
MinRange=6                  // max range in km                                                                 
MaxRange=150                // min altitude in meters, relevant for air, unused for surface                                                                      
MinAltitude=15              // max altitude in meters, relevant for air, unused for surface                             
MaxAltitude=30000           // defines the minimum range where two targets behind can be recognized as two; in meters                               
RangeResolution=500.0		// defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.2				// defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=39.0                   // gain in dB on the sensor                                                        
Frequency=S-band            // frequency band                                                                
PeakPower=400.0     		// output peak power in kW                                                                       
ModuleType=MediumSensor







