Taskforce1startMessage=The autonomous region of Catalunya declared itself independent after radical separatists took control over the local government in Barcelona and several key strategic military bases in the area. Spanish forces are inbound to take control over the territory again, but at the moment the situation is chaotic. We do not know which units are still operated by friendlies and which ones are taken over by enemies or how many of them there are. Try to establish radio communication with unknown units before engaging. \n\r\n-Identify all units in the area. Engage hostiles, do not engage civilians, and take command over allied units that got cut off when the hostilities started. \r\n-Destroy enough (15) enemy units to force an enemy surrender. You do not have to destroy every unit, so pick your targets wisely.\r\n- “R11 Principe de Asturias” and “L41 Hernan Cortes” must survive\r\n
