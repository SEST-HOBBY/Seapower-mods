Taskforce1startMessage=After the Russian invasion of Ukraine, sanctions tried to prevent the export of Russian oil and gas, as well as the import of high-tech parts that might be used in the conflict. However, these efforts have largely been unsuccessful, mostly due to Russian ships sailing under different flags in order to circumvent such restrictions. These ships compose the so called “shadow fleet”. \r\n\r\nSeveral western nations have finally decided to put an end to this practice within their territorial waters. Norway and Sweden are conducting a joint exercise to inspect all traffic going from the North Sea into the Baltic Sea. \r\n\r\nAny confirmed shadow fleet vessels are to be seized immediately after identification. If a suspected ship is not cooperating, use of weapons is authorised, but discouraged. Try to intimidate non-compliant crew into surrendering their stance before taking actual lethal action. Ultimately, the decision is up to the captain in question and dependant on circumstance. \r\n\r\nWARNING: Be aware of potential hybrid tactics employed by hostile agitators in the area. Russia is known for engaging in asymmetric hostilities, like sabotaging infrastructure and equipment, violating foreign airspaces, and even utilizing trained whales equipped with sensor and radio equipment. Remain cautious. \r\n\r\n- VID all incoming traffic. Seize all confirmed hostile vessels (By force if necessary).\r\n\r\n- Don’t lose Visby or Steil\r\n
Taskforce1startIntel=After the Russian invasion of Ukraine, sanctions tried to prevent the export of Russian oil and gas, as well as the import of high-tech parts that might be used in the conflict. However, these efforts have largely been unsuccessful, mostly due to Russian ships sailing under different flags in order to circumvent such restrictions. These ships compose the so called “shadow fleet”. \r\n\r\nSeveral western nations have finally decided to put an end to this practice within their territorial waters. Norway and Sweden are conducting a joint exercise to inspect all traffic going from the North Sea into the Baltic Sea. \r\n\r\nAny confirmed shadow fleet vessels are to be seized immediately after identification. If a suspected ship is not cooperating, use of weapons is authorised, but discouraged. Try to intimidate non-compliant crew into surrendering their stance before taking actual lethal action. Ultimately, the decision is up to the captain in question and dependant on circumstance. \r\n\r\nWARNING: Be aware of potential hybrid tactics employed by hostile agitators in the area. Russia is known for engaging in asymmetric hostilities, like sabotaging infrastructure and equipment, violating foreign airspaces, and even utilizing trained whales equipped with sensor and radio equipment. Remain cautious. \r\n\r\n- VID all incoming traffic. Seize all confirmed hostile vessels (By force if necessary).\r\n\r\n- Don’t lose Visby or Steil
Taskforce1shadowtankerMessage=MV al Quasim has been confirmed as a Russian shadow fleet tanker. Captain and crew have shown to be largely cooperative with the boarding party. The seized ship can now be brought to Oslo port.\r\n\r\nContinue to investigate the remaining traffic. \r\n
shadowtankerAreaLabel=Oslo
Taskforce1shadowtankerIntel=MV al Quasim has been confirmed as a Russian shadow fleet tanker. Captain and crew have shown to be largely cooperative with the boarding party. The seized ship can now be brought to Oslo port.\r\n\r\nContinue to investigate the remaining traffic. \r\n
Taskforce1ShadowfreighterMessage=MV Song Han has been confirmed as a Russian shadow fleet freighter. The captain is uncooperative and has responded to all radio calls with insults and threats. Meanwhile fast attack boats left the cover of the ship to approach with hostile intent\r\n\r\nConvince the stubborn captain to surrender his ship (sink a motorboat) or sink the vessel itself. \r\n
Taskforce1ShadowfreighterIntel=MV Song Han has been confirmed as a Russian shadow fleet freighter. The captain is uncooperative and has responded to all radio calls with insults and threats. Meanwhile fast attack boats left the cover of the ship to approach with hostile intent\r\n\r\nConvince the stubborn captain to surrender his ship (sink a motorboat) or sink the vessel itself. \r\n
Taskforce1freightersurrenderMessage=Faced with the threat of death and unable to defend himself reliably, the problematic captain finally stands down and surrenders his ship and crew.
Taskforce1freightersurrenderIntel=Faced with the threat of death and unable to defend himself reliably, the problematic captain finally stands down and surrenders his ship and crew.
Taskforce1findwhaleMessage=A trained whale equipped with modern sensor and communication gear just got detected in the vicinity. It is highly likely that it relays the position of allied ships to a nearby aggressor. Proceed with extreme caution.
Taskforce1findwhaleIntel=A trained whale equipped with modern sensor and communication gear just got detected in the vicinity. It is highly likely that it relays the position of allied ships to a nearby aggressor. Proceed with extreme caution.
Taskforce1"drone"Message=An unusually large and very old looking Russian drone has been successfully shot down.
Taskforce1"drone"Intel=An unusually large and very old looking Russian drone has been successfully shot down.
Taskforce1osloeastereggMessage=Wow, you actually reached Oslo with that tanker huh. Impressive, the scenario was supposed to be completed way before that happening. Respect though :P
