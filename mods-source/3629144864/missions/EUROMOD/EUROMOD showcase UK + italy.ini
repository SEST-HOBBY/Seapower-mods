Taskforce1revealIntel=The exercise just got interrupted by an unknown aggressor. Find the culprit and neutralize it.
Taskforce1sideexercisecompleteMessage=SSN Pasadena has been located. Initial exercise complete.
Taskforce1sideexercisecompleteIntel=SSN Pasadena is classified. Initial exercise complete.
Taskforce1ambushMessage=It’s a trap! Another hostile submarine is lying in an ambush position for our ships, ready to intercept if they investigate the initial attack.
