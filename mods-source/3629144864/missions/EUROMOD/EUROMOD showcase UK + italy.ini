Name=EUROMOD showcase UK + italy
Description=conventional showcase of the EUROMOD. British and Italian version
Taskforce1startMessage=Welcome to the british and italian EUROMOD showcase.\r\n\r\nThe year is 2027. Despite rising international tensions NATO is conducting its Dynamic Mongoose exercise in the GIUK gap. You are part of a simulated search for a submarine trying to traverse the gap. SSN Pasadena, acting as the hostile sub, will try to pass from north to south undetected. Find the submarine to complete the exercise. \r\n\r\nDon’t get complacent though just because this is a simulation! In a tense geopolitical environment like this, the fighting might become real sooner than anybody anticipates. \r\n\r\nHMS Dragon and F594 Alpino must survive\r\n\r\n(this scenario pushes the boundaries of what is possible in the current state of the game. To avoid confusion, ENABLE “Hide Unidentified In 3D” in the options menu)\r\n
Taskforce1startIntel=Welcome to the british and italian EUROMOD showcase.\r\n\r\nThe year is 2027. Despite rising international tensions NATO is conducting its Dynamic Mongoose exercise in the GIUK gap. You are part of a simulated search for a submarine trying to traverse the gap. SSN Pasadena, acting as the hostile sub, will try to pass from north to south undetected. Find the submarine to complete the exercise. \r\n\r\nDon’t get complacent though just because this is a simulation! In a tense geopolitical environment like this, the fighting might become real sooner than anybody anticipates. \r\n\r\nHMS Dragon and F594 Alpino must survive\r\n\r\n(this scenario pushes the boundaries of what is possible in the current state of the game. To avoid confusion, ENABLE “Hide Unidentified In 3D” in the options menu)\r\n
