Name=EUROMOD showcase dutch
Description=Arcade-like showcase of the EUROMOD. Dutch version
Taskforce1startMessage=Welcome to the dutch EUROMOD showcase. This scenario is structured like an old arcade game. You have to fight 3 enemies with your ship in order to level up. When you kill one enemy, the next will spawn in. \r\nFor every level up, you will get a new, better ship with full ammo stores, so don’t hold back. There are 4 levels in total with gradually more difficult enemies. The last level is a boss fight. \r\n\r\nGood luck!\r\n
Taskforce1startIntel=Welcome to the dutch EUROMOD showcase. This scenario is structured like an old arcade game. You have to fight 3 enemies with your ship in order to level up. When you kill one enemy, the next will spawn in. \r\nFor every level up, you will get a new, better ship with full ammo stores, so don’t hold back. There are 4 levels in total with gradually more difficult enemies. The last level is a boss fight. \r\n\r\nGood luck!\r\n
Taskforce1lvl1finalMessage=Level up! \r\n\r\nThe difficulty increases: Weather is deteriorating!\r\n
Taskforce1lvl1finalIntel=Level up! \r\n\r\nThe difficulty increases: Weather is deteriorating!\r\n
Taskforce1lvl2thirdkillMessage=Level up! \r\n\r\nThe difficulty increases: civilian units are in the mix now!\r\n
