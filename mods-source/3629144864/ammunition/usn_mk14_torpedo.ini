[General]
Type=Torpedo
TargetType=ASuW                       // CHANGED - Was ASW
SecondaryTargetType=ASW
Mass=1650                              // Mk14 value
AmmoPoints=2000                        // Mk14 value

DefaultCameraDistance=0.3
MinCameraDistanceForeAft=0.15
MinCameraDistanceBroadside=0.15
CameraPivotHeight=0.0

DecalClass=Standard
[SensorData]
IRSignature=VeryTiny
RCS=VerySmall
BaseNoise=125                   // Mk14 value
FlowNoise=0.6                   // Mk14 value
CavitationNoise=2               // Mk14 value
TargetReflectionStrength=1
TransientRCS=-1
TransientVisualIdentificationRange=-1
TransientBaseNoise=180

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=0
Power=60                            // Mk14 value
ImpactSize=Large
Penetration=Heavy

MaxDepth=100                        // Mk14 value (Warhead operational depth)
FuzeProximityDistance=2             // Mk14 value
SmartFuse=False                     // Mk14 value

[---------- Guidance ----------]
[Guidance]
GuidanceType=0
MidCourseCorrection=0
InitialFlightPhaseDuration=3        // Mk14 value

TerminalVelocity=46.0 // Mk14 value (High Speed)
MaxVelocity=46.0                       // maximum speed in knots; kept active for compatibility with SpeedSettings
Acceleration=11.0                   // Mk14 value
MaxTurnRate=3.0                     // Mk14 value

MinLaunchRange=0.1                  // Mk14 value
MaxLaunchRange=4.43 // CHANGED - Extended range
SpeedSettings=30.5,46                    // selectable speeds in knots, lowest to highest
SpeedSettingRanges=4.43,2.22          // full tank range in nautical miles at each speed above
MinLaunchAltitude=100                 // Mk14 value
MaxLaunchAltitude=5000                 // Mk14 value

MaxDepth=100                         // Mk14 value (Guidance running depth)
LaunchReliability=65                // Mk14 value

SeekerFOV=60.0                      // From Mk9 template (effectively unused for straight runner)
SeekerActiveRange=0.48              // From Mk9 template (effectively unused)
SeekerPassiveRange=0.48             // From Mk9 template (effectively unused)
SeekerGain=30.0                     // From Mk9 template (effectively unused)
SeekerOutputPower=235               // From Mk9 template (effectively unused)

SearchMode=0                        // Mk14 value
SearchVelocity=30.0                 // From Mk9 template (effectively unused)
SnakeSearchAngle=30.0               // From Mk9 template (effectively unused)
SnakeSearchTurnCycleTime=6.0        // From Mk9 template (effectively unused)
ReattackMode=0                      // From Mk9 template
ReattackCircleDegreesPerSecond=12.0 // From Mk9 template (effectively unused)
DefaultDepth=15.0                   // Mk14 value
DestructionDepth=300.0              // Mk14 value
SelfDestructDelay=600               // CHANGED - Increased to allow for longer run

