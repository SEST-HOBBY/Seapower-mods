#!alias ammunition/usn_rim-116c.ini

#RIM-116D RAM Block IIA

[---------- Warhead Data ----------]
[WarheadData]
InterceptOutOfAltitudePenalty=0.3
InterceptSizePenaltyMultiplier=0.40					// multiplier to the size penalty, 1.0 is default

[---------- Guidance ----------]
[Guidance]
#========================================= Launch stats ============================================================
MaxAttackVelocity=2000				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
#========================================     Seeker     ===========================================================
#ECCM
AntiCountermeasuresBonus=0.40           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.40                   // This value substracted from probability of being jammed  (0...1)