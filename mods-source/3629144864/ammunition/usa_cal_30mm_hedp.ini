[General]
# HEDP round for M230 chain gun
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW             // can be AAW, ASuW, ASW
SecondaryTargetType=AAW
CanNotAttackTypes=Missile 

Mass=0.56                               // in kg. Used for aircraft
AmmoPoints=0.56                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini

FrontalArea=0.1234
SideArea=2.9
BottomArea=2.9

[Physics]
MuzzleVelocity=805         // meter per second
MaxRange=1800           // in m
CircularErrorProbable=30  // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=1
ImpactSize=Small            // Impact size, can be small, medium, large, verylarge
Penetration=Minor          // can be minor, moderate, heavy, always

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini
TrailEffect=None
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitDefaultExplosionClass=SmallFlakExplosions
HitWaterSplashClass=SmallWaterSplashes