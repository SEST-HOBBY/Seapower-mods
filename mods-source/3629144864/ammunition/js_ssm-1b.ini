[General]
# SSM-1B [Type 90]
# Users:js_ddg_177,js_ddg_179
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=680                              // in kg. Used for aircraft
AmmoPoints=1725                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
#SupplyCategory=Harpoon                 // For Supply System. Makes that presence of such category is required for replenishment of this weapon
CIWSDefenceBonus=5                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.05                     // Less chance to be intercepted by SAM because of anti-interception maneuvers

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=2  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=0.2
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=3  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=10                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = High Explosive
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering
#6 = Fragmentation

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=45
ImpactSize=Medium                      // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3        // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=1  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
#DropDuration=1 
#TerrainFollowFlight=True
RequiresTargetToProceed=False           //Will not change its flight phase unles have a target selected by operator
LocalTerminalOnly=False                 // if true connection with a guiding radar will be severed upon entering terminal approach stage
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=50.0                      // Climb angle for initial loft
MaxLoftAlt=3000                      // in feet. Maximum altitude for lofting
MaxLoftVelocity=600
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=30.0                    // height in feet for sea skimming TODO:make terrain following
SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=30             // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=40.0
FinalFlightPhaseDistToTarget=10.0       // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=5               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalPopUpDist=1.1                    //Pop-up distance in miles
TerminalPopUpHeight=600               //Pop-up height in feet
TerminalPopUpAngle=75                  //Pop-up climb anble in degrees
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=600                      // Maximum speed in knots
Acceleration=7.0                       // Acceleration factor
MaxTurnRate=16.0                       // Maximum turnrate in degrees per second
MinLaunchRange=2.0                    // Minimum launch range in nautical miles
MaxLaunchRange=85.0                   // Maximum launch range in nautical miles
#MinLaunchAltitude=200               // Minimum launch altitude in feet.
#MaxLaunchAltitude=35000               // Maximum launch altitude in feet.
LaunchReliability=99                   // The lower the value, the greater risk of misfire or accident (0...100)
#============================================= Misc ================================================================
#GroupSize=2                            // Indicates that missiles can join into groups
#GroupJoinRange=0.15                      // in miles
#GroupSpacing=0.3                       // in miles. interval between misseles in line
#GroupLeaderAlt=20                    // in feet. altitude of leading missile. Only for FinalFlightPhase
#GroupWingmanAlt=20                  // in feet. altitude of non-leading missile. FinalFlightPhase
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=45                        // Seeker gain in dB
SeekerFOV=135                       // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerActiveRange=5                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=10                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SecondaryPassiveRadarGuidanceType=HomeOnJam // Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
Frequency=Ku-Band                      // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=40                         //Active radar seeker output peak power in kW
#TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#Misc Guidance Properties
RangeGate=2							   // 
SizeGate=10						   //
#ECCM
CounterMeasuresRejection=85            // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=80                      // The lower the value, the greater risk of spoofing by jamming	(0...100)
AntiCountermeasuresBonus=0.85           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.85                    // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SearchMode=1                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
#SearchVelocity=550.0                   // velocity in search mode in knots
#SnakeSearchAngle=15.0                  // going left/right using that angle
#SnakeSearchTurnCycleTime=10.0          // time in seconds it takes for one complete snake cycle (left/right)
#ReattackMode=1                         // 0 = None, 1 = Circle, 2 = Drive-around
#ReattackCircleDegreesPerSecond=10.0    // degrees per second for circle reattack pattern
#LadderParams=0.0,0.0                   // First leg, second leg in yard
#SpiralSearchParams=0.0,0.0             // Ceiling, floor in yard
#SelfDestruct
SelfDestructAfterTargetGone=True      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=ssm_1b
ResourcesMaterialFolder=assets/europack/materials/jmsdf_ssm_1b/
ResourcesMaterial=ssm_1b_mat.ini
ResourcesMeshForLaunch=ssm_1b_launch
ResourcesMeshSwitchTime=1  
############################################################
[Debris]
# Optional debris related stuff
DebrisProbability=95         // probability for debris to happen
ResourcesMeshForDebris=dummy // optional debris mesh after destruction
DebrisPosition=0.05          // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10
DebrisVelocityDampening=0.99
DebrisHeightLossAdd=0.0005   // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/usn_rgm_84_booster
BoosterEffectPosition=0,0,-0.011

InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.012
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.022

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
HitDefaultExplosionClass=MediumMissileExplosions
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.06606571
