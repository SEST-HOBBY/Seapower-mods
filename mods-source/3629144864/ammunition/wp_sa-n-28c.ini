#!alias ammunition/wp_sa-n-28b.ini
# 9M96DM - Poliment-Redut

[General]
Mass=449                              // in kg. Used for aircraft
AmmoPoints=1796                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
IOCDate=2018                          // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)
FOCDate=2019                          // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

[Guidance]
MaxTurnRate=40                        // Maximum turnrate in degrees per second
MaxTurnG=60                           // Maximum G-limit of missile turns
#======================================== Flight Profile ===========================================================
MaxLoftAlt=98425                      // in feet. Maximum altitude for lofting
MaxLoftVelocity=3305                  // Maximum speed in knots for lofting
#=========================================  Kinematics  ============================================================
MaxVelocity=3305                      // Maximum speed in knots
SustainerAccelerationTime=12          // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=15.6              // Acceleration of sustainer burn. -1 if there is no sustainer
DragCoefficient=2.65                   // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
MaxFlightTime=300                     // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MaxLaunchRange=81                     // Maximum launch range in nautical miles

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj,CORRECT_OBJ_ORIENTATION
ResourcesMesh=eu_missile_sa-n-28b
ResourcesMaterialFolder=assets/europack/materials/SA-N-28/
ResourcesMaterial=SA-N-28_mat.ini


[Particles]
BoosterEffectPosition=0,0,-0.041184
InFlightEffectPosition=0,0,-0.041184
SustainerEffectPosition=0,0,-0.041184

[col_main]
Position=0,0,0.000502
