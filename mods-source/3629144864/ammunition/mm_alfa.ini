[General]
# Alfa MRBM
# Users: mm_cg_garibaldi
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All // can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine

CIWSDefenceBonus=5                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers

Mass=8000                              // in kg. Used for aircraft
AmmoPoints=21000                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

SaturationValue=2
DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=12  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance
TransientBaseNoise=240                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = HighExplosive     =  100% damage to structre
#1 = Armor Piercing		TBD
#2 = HEAT				TBD
#3 = Illumination		TBD
#4 = Cluster           =  -50% damage to structre
#5 = Runway Cratering	TBD
#6 = Fragmentation     =  -50% damage to structre
[WarheadData]
WarheadType=0
Power=6200
ImpactSize=VeryLarge            // Impact size, can be small, medium, large, verylarge
Penetration=Always               // can be minor, moderate, heavy, always

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=10.0         // time in seconds where the missile moves straight on without guiding
TerrainFollowFlight=False
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=85.0                      // Climb angle for initial loft
MaxLoftAlt=984252.0                     // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=10.0              // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalDiveDistance=10                 // in N. miles.
SupportsBanking=True                   // if the missile will bank when turning
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=16544.6                     // Maximum speed in knots
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second
AccelerationTime=57                   // Burn time for initial booster burn
Acceleration=2.38                        // Gs of acceleration in initial burn
SustainerAccelerationTime=280           // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=2.615               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=0   					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetVelocity=0
TypicalFiringAlt=0				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=-1               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
#========================================= Launch stats ============================================================
MinLaunchRange=250                     // Minimum launch range in nautical miles
MaxLaunchRange=863.9                   // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=20     // Circular error vs 'Installation' land units
#Homing
#N/A
#ECCM
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_alfa

ResourcesMaterialFolder=assets/europack/materials/mm_alfa/
ResourcesMaterial=eu_alfa_mat.ini

ResourcesMeshForLaunch=eu_missile_alfa
ResourcesMeshCanister=eu_missile_alfa
ResourcesMeshSwitchTime=0.2  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=1

SubModel1=Booster

[Booster]
Type=Afterburner                  //Dot: afterburner is invisible by default and will be turned on only after launch
Mesh=Booster
ResourcesMaterialFolder=assets/models/ammunition/Alfa_missile/textures/
ResourcesMaterial=alfa_mat.ini
Position=0,0,0
Rotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/LargeASMSmokeEmitter
BoosterEffectPosition=0,0,-0.045

InFlightEffect=effects/weapons/emitters/missile_sustainer_large_effect
InFlightEffectPosition=0,0,-0.055
InFlightEffectStartTime=3  // in seconds, after that the Inflight Effect will be played if available

UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.08

HitShipExplosion=effects/explosions/emitters/Ammo_ship_explosion_1
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosion=effects/explosions/emitters/Ammo_ship_explosion_1
HitWaterSplashClass=SmallWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes


[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
#creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.017,0.017,0.14