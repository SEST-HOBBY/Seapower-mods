# MIM-104D Patriot GEM

[General]
Type=Missile                                                            // can be Projectile, Missile, Torpedo
TargetType=AAW                                                          // can be AAW, ASuW, ASW

Mass=907                                                                // in kg. Used for aircraft

IOCDate=1995                                                            // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

FOCDate=1995                                                            // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts                                                   // referenced in effects/decals.ini
AirLaunched=False                                                       // For Encyclopedia. Displays launch altitudes

[SensorData]
#Visual
VisualIdentificationRange=4                                             // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Transient
TransientRCS=Small                                                      // Transient visibility on the radar
TransientVisualIdentificationRange=5                                    // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                                                  // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=25
ImpactSize=SemiSmall                                                    // Impact size, can be small, medium, large, verylarge
Penetration=Always                                                      // can be minor, moderate, heavy, always
FuzeProximityDistance=25.0                                              // for proximity fuze: distance to target in meters. Also indicates that Fuze Type = Proximity Fuze
InterceptSpeedPenaltyMultiplier=0.75                                    // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
InterceptOutOfAltitudePenalty=0.5                                       // base value used for out-of-altitude calculations, 0.20 is excellent, 0.30 is good, 0.40 is average, 0.50 is poor
KillProbability=0.85                                                    // Base chance to hit

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=2
MidCourseCorrection=1                                                   // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
InitialFlightPhaseDuration=0.5                                          // time in seconds where the missile moves straight on without guiding

#======================================== Flight Profile ===========================================================
MaxLoftAngle=45                                                         // Climb angle for initial loft
MaxLoftAlt=45000                                                        // in feet. Maximum altitude for lofting
OptimizeLoftAlt=True
BallisticLoft=False
LoftToSkim=True
TerminalApproachDist=3                                                  // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough

#=========================================  Kinematics  ============================================================
ApplyKinematics=True                                                    // If we should use full kinematics rules. If this is true, we will only use kinematics
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=3000                                                        // Maximum speed in knots
MaxTurnRate=33.0                                                        // Maximum turnrate in degrees per second
MaxTurnG=25                                                             // Maximum G-limit of missile turns
AccelerationTime=11.5                                                   // Burn time for initial booster burn
Acceleration=14                                                         // Gs of acceleration in initial burn
SustainerAccelerationTime=0                                             // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=0                                                 // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=30000                                                  // Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=0                                                    // Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=0                                                      // Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0                                                 // Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=1.75                                                    // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
MaxFlightTime=210                                                       // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TimeLimited=True
LiftFactor=0.005                                                        // default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude

#========================================= Launch stats ============================================================
MinLaunchRange=1.62                                                     // Minimum launch range in nautical miles
MaxLaunchRange=57                                                       // Maximum launch range in nautical miles
MinAttackAltitude=100                                                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=100000                                                // Maximum altitude of target, in feet
MaxAttackVelocity=3000                                                  // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=97                                                    // The lower the value, the greater risk of misfire or accident (0...100)
AutoAttackOutsideAltitudes=False                                        // This weapon will not be auto launched if target is outside altitude brackets

#========================================     Seeker     ===========================================================
SeekerGain=15                                                           // Seeker gain in dB
SeekerFOV=60.0                                                          // Seeker field-of-view in degrees
SeekerActiveRange=0.0                                                   // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=90                                                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SecondaryPassiveRadarGuidanceType=HomeOnJam                             // Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All                                     // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect

#ECCM
AntiCountermeasuresBonus=0.50                                           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.45                                                    // This value substracted from probability of being jammed  (0...1)

#SelfDestruct
SelfDestructDelay=2.0                                                   // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_mim-104
ResourcesMaterialFolder=assets/europack/materials/MIM-104/
ResourcesMaterial=MIM-104_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=0
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.038574
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.038574
InFlightEffectStartTime=2.0                                             // in seconds, after that the Inflight Effect will be played if available
HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.009086,0.009086,0.077148
