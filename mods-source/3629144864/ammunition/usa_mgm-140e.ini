[General]
# MGM-140E Block IA ATACMS-QRU (2002)
# Users: usa_mlrs_m270, usa_mlrs_m142
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=1377                              // in kg. Used for aircraft
AmmoPoints=4131                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

SaturationValue=2
DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=10  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance
TransientBaseNoise=240                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = HighExplosive     =  100% damage to structre
#1 = Armor Piercing		TBD
#2 = HEAT				TBD
#3 = Illumination		TBD
#4 = Cluster           =  -50% damage to structre
#5 = Runway Cratering	TBD
#6 = Fragmentation     =  -50% damage to structre
[WarheadData]
WarheadType=0
Power=46
ImpactSize=Large           // Impact size, can be small, medium, large, verylarge
Penetration=Heavy              // can be minor, moderate, heavy, always

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3.0        // time in seconds where the missile moves straight on without guiding
TerrainFollowFlight=False
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=80.0                      // Climb angle for initial loft
MaxLoftAlt=150000.0                    // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=10.0              // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalDiveDistance=10                // in N. miles.
SupportsBanking=False                  // if the missile will bank when turning
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=2000                       // Maximum speed in knots
MaxTurnRate=15.0                       // Maximum turnrate in degrees per second
AccelerationTime=0.5                   // Burn time for initial booster burn
Acceleration=3.5                       // Gs of acceleration in initial burn
SustainerAccelerationTime=40           // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=3.5              // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=0                     // Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetVelocity=0
TypicalFiringAlt=0                     // Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0                // Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=1.76                   // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
#========================================= Launch stats ============================================================
MinLaunchRange=37.8                    // Minimum launch range in nautical miles
MaxLaunchRange=145.8                   // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=100    // Circular error vs 'Installation' land units in meters
#Homing
#N/A
#ECCM
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/materials/usa_mgm-140/
ResourcesRoot=mgm-140.obj
ResourcesMesh=mgm-140_body

ResourcesMaterialFolder=assets/europack/materials/usa_mgm-140/
ResourcesMaterial=mgm-140e_mat.ini

ResourcesMeshForLaunch=mgm-140_launch
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.0345

#InFlightEffect=effects/weapons/emitters/missile_sustainer_large_effect
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.024
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_large_effect
SustainerEffectPosition=0,0,-0.024
SustainerEffectStartTime=2.0

HitDefaultExplosionClass=LargeGroundHitExplosions
HitShipExplosionClass=LargeShipHitExplosion
#HitAirExplosionClass=LargeShipHitExplosion // Played when bomb explodes at water
HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=LargeGroundHitExplosions

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes


[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
#creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.017,0.017,0.14