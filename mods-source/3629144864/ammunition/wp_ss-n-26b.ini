#!alias ammunition/wp_ss-n-26.ini

# P-800 Oniks-M
Placeholder

[OnBoardSystems]
ECM=SS-N-19_ECM

[Guidance]
MaxLaunchRange=423.0       

#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=25                     // Feet; approximately 15 m above the sea.
SeaSkimmingStartDistToTarget=80         // Nautical miles; game-tuned transition into low-altitude flight.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=16                // Feet; approximately 10 m. Continue descending instead of performing a popup.
FinalFlightPhaseDistToTarget=30         // Nautical miles; game-tuned final low-altitude segment near seeker acquisition.
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=10                 // Nautical miles; slightly inside the configured active seeker range.
TerminalAlt=16.0                        // Feet; approximately 10 m above the sea in terminal approach.
#============================================= Misc ================================================================
GroupLeaderAlt=16.0                     // Feet; unused with GroupSize=1; keeps a future group leader at the final low altitude.
GroupWingmanAlt=16.0                    // Feet; unused with GroupSize=1; matches the final low altitude.

AntiCountermeasuresBonus=0.5           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.50                   // This value substracted from probability of being jammed (0...1)