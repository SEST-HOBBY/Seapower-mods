[General]
Type=Missile            // can be Projectile, Missile, Torpedo
TargetType=ASuW            // can be AAW, ASuW, ASW
SecondaryTargetType=AAW
LandAttackCapability=All     // can be  All, Installation, Mobile, ShoreTargetsOnly

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=GunImpacts          // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
RCS=Tiny

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=2
Power=5
ImpactSize=SemiSmall       // Impact size, can be small, medium, large, verylarge
Penetration=Always       // can be minor, moderate, heavy, always

FuzeProximityDistance=10
KillProbability=0.50       // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[Guidance]
GuidanceType=0
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
#MaxLoftAngle=20.0                      // Climb angle for initial loft
#MaxLoftAlt=5000.0                     // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=1000.0              // in N. miles. Recommended to set this distance slightly less than the seeker range
#========================================= Launch stats ============================================================
MaxVelocity=2000                     // Maximum speed in knots
#EjectVelocity=2000                      // Initial forward speed in knots
VelocityBleed=0.6                     // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
Acceleration=1000.0                      // Acceleration factor
MaxTurnRate=20                         // Maximum turnrate in degrees per second
MinLaunchRange=0                     // Minimum launch range in nautical miles
MaxLaunchRange=38                     // Maximum launch range in nautical miles
LaunchReliability=100                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=0.0              // Circular error radius in meter
AntiCountermeasuresBonus=0.4
AntiJammerBonus=0.4
SelfDestructDelay=10.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_large_shell
HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_small
HitGroundExplosionClass=MediumGroundHitExplosions