[General]
# A.184 Mod 3 (1992)
Type=Torpedo                          // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                       // can be AAW, ASuW, ASW
SecondaryTargetType=ASW

Mass=1315                              // in kg. Used for aircraft
AmmoPoints=3945                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
RCS=VerySmall
# Sonar related
BaseNoise=117                   // base sound level in db at 1m distance
FlowNoise=0.5                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0               // additional noise for cavitation in db
TargetReflectionStrength=1      // in dB for broad side
# Transient
TransientRCS=-1                        // Transient visibility on the radar
TransientVisualIdentificationRange=-1  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=180                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=69
ImpactSize=Large               // Impact size, can be small, medium, large, verylarge
Penetration=Always              // can be minor, moderate, heavy, always

FuzeProximityDistance=10        // for proximity fuze: distance to target in meter
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
#10 = Combined Active&Passive Sonar Homing
[Guidance]
GuidanceType=10
MidCourseCorrection=2                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=5           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
#========================================= Launch stats ============================================================
TerminalVelocity=45                         // Maximum speed in knots
Acceleration=12.0                      // Acceleration factor
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.5                     // Minimum launch range in nautical miles

SpeedSettings=25,45                    // selectable speeds in knots, lowest to highest
SpeedSettingRanges=13.5,10.8           // full tank range in nautical miles at each of the speeds above
WireControlsDepth=True                 // the wire can pass depth orders and target depth data to the torpedo
WireBreakSpeed=16                      // launch platform speed in knots above which the wire breaks (default 20)
MaxSpeedOnWire=45                      // torpedo speed in knots above which it snaps its own wire (default unlimited)
WireMinSeafloorClearance=0             // wire breaks if the launching sub runs closer to the seafloor than this (feet, 0 = disabled)
WireCountermeasureBonus=0.5            // extra countermeasure rejection while on the wire; kept after a break if homing already started (default 0)
MaxDepth=1450                          // Maximum allowed depth in feet.

LaunchReliability=95                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerFOV=60.0                         // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerActiveRange=1.5
SeekerPassiveRange=1.5                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
#TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed /Dot: TBD to more fancy guidance
SeekerGain=40.0                        // Seeker gain in dB
SeekerOutputPower=235                  // Active seeker output power in dB, unused for passive ones

#ECCM
AntiCountermeasuresBonus=0.25          // This value substracted from probability of spoofing by countermeasures (0...1)
MinAfterSpoofEffectTime=5.0            // Min time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
MaxAfterSpoofEffectTime=15.0           // Max time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
FractionOfRangeToActivateSeeker=0.75   // Fraction of seeker range left to target before activation of seeker for wire guided torpedoes

# Torpedo related
SearchMode=1                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
SearchVelocity=25.0                    // velocity in search mode in knots
SnakeSearchAngle=30.0                  // going left/right using that angle
SnakeSearchTurnCycleTime=6.0           // time in seconds it takes for one complete snake cycle (left/right)
ReattackMode=1                         // 0 = None, 1 = Circle
ReattackCircleDegreesPerSecond=10.0    // degrees per second for circle reattack pattern
DefaultDepth=200.0                     // default depth in feet a torpedo is using for submerged targets for bearing only launches

