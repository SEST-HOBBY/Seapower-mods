# HE-VT - High-explosive shell with a proximity fuze.

[General]
LandAttackCapability=All
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=AAW            // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

Mass=6.3                                // in kg. Used for aircraft
AmmoPoints=11                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

FrontalArea=0.1234
SideArea=2.9
BottomArea=2.9
[Physics]
MuzzleVelocity=915         // meter per second
MaxRange=16000             // in meters
GravityFactor=1.25
CircularErrorProbable=35   // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
FuzeMode=Proximity
Power=1.5
ImpactSize=Small       // Impact size, can be small, medium, large, verylarge
Penetration=Minor       // can be minor, moderate, heavy, always
FuzeProximityDistance=6
KillProbability=0.0065       // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_medium_shell
HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_small
HitGroundExplosionClass=MediumGroundHitExplosions
