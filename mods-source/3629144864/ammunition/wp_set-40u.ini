[General]
# SET-40U (1968)
# Users: wp_pt_stenka, wp_skr_petya2, wp_ssgn_charlie2, wp_ssgn_echo2
Type=Torpedo                           // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW

Mass=550                               // in kg. Used for aircraft
AmmoPoints=1100                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related //TODO: Placeholder values! Need to be replaced!
BaseNoise=120                   // base sound level in db at 1m distance
FlowNoise=0.5                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=1               // additional noise for cavitation in db
TargetReflectionStrength=1      // in dB for broad side
# Transient
TransientRCS=-1                        // Transient visibility on the radar
TransientVisualIdentificationRange=-1  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=160                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=36
ImpactSize=Medium               // Impact size, can be small, medium, large, verylarge
Penetration=Heavy               // can be minor, moderate, heavy, always

FuzeProximityDistance=10.0              // for proximity fuze: distance to target in yard

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
#10 = Combined Active&Passive Sonar Homing
[Guidance]
GuidanceType=10
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided 
InitialFlightPhaseDuration=10.0        // time in seconds where the weapon  moves straight on without guiding
#======================================== Flight Profile ===========================================================
#========================================= Launch stats ============================================================
MaxVelocity=29.0                       // Maximum speed in knots
Acceleration=10.0                      // Acceleration factor
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.5                     // Minimum launch range in nautical miles
MaxLaunchRange=4.3                     // Maximum launch range in nautical miles

MaxDepth=650                           // Maximum allowed depth in feet.

LaunchReliability=85                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerFOV=30.0                         // Seeker field-of-view in degrees
SeekerActiveRange=0.43                 // Seeker active range in nautical miles
SeekerPassiveRange=0.43
SeekerGain=15.0                        // Seeker gain in dB
SeekerOutputPower=170                  // Active seeker output power in dB, unused for passive ones
#ECCM
AntiCountermeasuresBonus=0.05          // This value substracted from probability of spoofing by countermeasures (0...1)
MinAfterSpoofEffectTime=8.0            // Min time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
MaxAfterSpoofEffectTime=30.0           // Max time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
# Torpedo related
SearchMode=1                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
SearchVelocity=29.0                    // velocity in search mode in knots
SnakeSearchAngle=30.0                  // going left/right using that angle
SnakeSearchTurnCycleTime=6.0           // time in seconds it takes for one complete snake cycle (left/right)
ReattackMode=1                         // 0 = None, 1 = Circle
ReattackCircleDegreesPerSecond=10.0    // degrees per second for circle reattack pattern
DefaultDepth=200.0                     // default depth in feet a torpedo is using for submerged targets for bearing only launches
DestructionDepth=656.0                 // depth in feet where the torpedo is destructed
#CircleDegreesPerSecond=10.0            // for circle search: degrees per second
#CircleMoveFwdAfterCircleInSeconds=10.0 // time to move forward if one circle is completed
#LadderWidth=0.5                        // width of ladder in nautical miles
#LadderTurnDegreesPerSecond=10.0        // turn speed in degrees per second
#SpiralSearchParams=15,300              // Ceiling, floor in feet
#SpiralSearchRadius=0.25                // search radius in nautical miles
#SpiralSearchAngle=6.0                  // up/down angle for spiral search
#SelfDestruct
SelfDestructDelay=6.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/wp_set-40/
ResourcesRoot=wp_set-40
ResourcesMesh=wp_set-40
ResourcesMaterial=wp_set-40_mat
ResourcesMeshForLaunch=wp_set-40_dummy
ResourcesMeshSwitchTime=0  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfSubModels=2

SubModel1=Propeller_Left
SubModel2=Propeller_Right

[Propeller_Left]
Type=Propulsion
RotationDirection=Left
Mesh=wp_set-40_propl
Rotation=-90,0,0

[Propeller_Right]
Type=Propulsion
RotationDirection=Right
Mesh=wp_set-40_propr
Rotation=-90,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/torpedo_surface_launch //submarine_torpedo_launch
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/aswtorpedo_cavitation_particle
InFlightEffectPosition=0,0,-0.057
InFlightEffectStartTime=0
HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes

############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
PropAudioClip=audio/weapons/torpedo
PropAudioRollOff=Logarithmic
PropAudioDistance=1,20
PropAudioPitch=1.0
PropAudioPosition=0,0,0
PropAudioAudibility=Below
SonarAudioClip=audio/environment/Sonar-MF
SonarAudioPosition=0,0,0
SonarAudioRollOff=Logarithmic
SonarAudioDistance=1,50
SonarAudioPitch=1
SonarAudioVolume=1
SonarAudioAudibility=Below

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,-0.0051,0.0053
Rotation=0,0,0
Scale=0.01,0.01703,0.09293