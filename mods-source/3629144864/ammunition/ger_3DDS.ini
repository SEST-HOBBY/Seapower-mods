#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Rheinmetall 3DDS (3D Drone Swarm)
# Users: F127/MASS Nova
Type=Missile                            // can be Projectile, Missile, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=All  // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=2                                   // in kg. Used for aircraft
AmmoPoints=1000                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.25
MinCameraDistanceForeAft=0.12
MinCameraDistanceBroadside=0.12
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[ECM]
# Chaff -related parameters
SpoofChance=0.6                         // Base chance to spoof missile
DefensiveEffectTime=120                 // Period of defensive effect being active in seconds
ReactionRange=5.0                       // in miles; Distance to missile at which chaff is auto-launched


[SensorData]
#Visual
VisualIdentificationRange=1  // at what range in nm this unit can be visually identified
IRSignature=Tiny
# Radar related (RCS => radar cross section)
RCS=SemiLarge
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=1  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=30                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=1
Power=0
ImpactSize=small                       // Impact size, can be small, medium, large, verylarge
Penetration=moderate                      // can be minor, moderate, heavy, always
#FuzeType=0 

[OnBoardSystems]
ECM=eu_3DDS_ECM

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=1              // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3         // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=True  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
#DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
MaxLoftAngle=90.0                      // Climb angle for initial loft
MaxLoftAlt=300.0                      // in feet. Maximum altitude for lofting
#1st stage of missile flight - high altitude
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=40.0                    // height in feet for sea skimming TODO:make terrain following
SeaSkimmingMaxDescentAngle=5.0        // Dive angle whlie going to sea skimming
SeaSkimmingStartDistToTarget=80      // in N. miles.
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=10.0               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
TerminalAlt=10.0             
TerminalVelocity=30.0             
SupportsBanking=True                   // if the missile will bank when turning

GroupSize=10                            // Indicates that missiles can join into groups
GroupJoinRange=0.2                      // in miles
GroupSpacing=0.01                       // in miles. interval between misseles in line
#GroupLeaderAlt=50.0                    // in feet. altitude of leading missile. Only for FinalFlightPhase
#GroupWingmanAlt=40.0                   // in feet. altitude of non-leading missile. FinalFlightPhase
#============================================= Misc ================================================================
#========================================= Launch stats ============================================================
MaxVelocity=100.0                       // Maximum speed in knots
Acceleration=12.0                       // Acceleration factor
AccelerationTime=3.0
MaxTurnRate=60.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=20.0                       // Maximum turnrate in degrees per second
MinLaunchRange=0.0                     // Minimum launch range in nautical miles
MaxLaunchRange=222.0                     // Maximum launch range in nautical miles
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
#ECCM
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_3DDS
ResourcesMaterialFolder=assets/europack/materials/3DDS/
ResourcesMaterial=3DDS_mat.ini
ResourcesMeshForLaunch=eu_launch_3DDS
ResourcesMeshCanister=eu_launch_3DDS
#ResourcesMeshSwitchTime=3.0  // time in seconds after launch to switch from launch mesh to main mesh
ResourcesMeshSwitchTime=1.5  // time in seconds after launch to switch from launch mesh to main mesh

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]

 #HitShipExplosionClass=LargeShipHitExplosion
 #HitAirExplosionClass=LargeMissileExplosions
 #HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
 #DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=SmallWaterSplashes

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=3
# Front
EngineAudioClip=audio/aircraft/707_Front
EngineAudioPosition=0,0,0
EngineAudioRollOff=Logarithmic
EngineAudioDistance=1,1.5
EngineAudioPitchRange=0.8,2.4
EngineAudioVolumeRange=0.25,1.0
EngineAudioAspectAngle=0
EngineAudioAspectArcHalfRange=120
EngineAudioAudibility=AboveAndBelow  // layer of sound audibility: Above, Below, AboveAndBelow
# Rear
ExhaustAudioClip=audio/aircraft/707_Front
ExhaustAudioPosition=0,0,0
ExhaustAudioRollOff=Logarithmic
ExhaustAudioDistance=1,1.5
ExhaustAudioPitchRange=0.8,1.2
ExhaustAudioVolumeRange=0.8,1.4
ExhaustAudioAspectAngle=180
ExhaustAudioAspectArcHalfRange=180
ExhaustAudioAudibility=AboveAndBelow  // layer of sound audibility: Above, Below, AboveAndBelow
# Far
FarAudioClip=audio/aircraft/707_Front
FarAudioPosition=0,0,0
FarAudioRollOff=Logarithmic
FarAudioDistance=3,20
FarAudioPitch=0.75
FarAudioVolume=1.0
FarAudioFadeRange=0.05,0.25	      // nautical miles min/max
FarAudioAudibility=AboveAndBelow  // layer of sound audibility: Above, Below, AboveAndBelow
# Afterburner
AfterburnerAudioClip=audio/aircraft/707_Front
AfterburnerAudioPosition=0,0,0
AfterburnerAudioRollOff=Logarithmic
AfterburnerAudioDistance=1,20
AfterburnerAudioPitch=0.75
AfterburnerAudioVolume=1.0
AfterburnerAudioAudibility=AboveAndBelow  // layer of sound audibility: Above, Below, AboveAndBelow


[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07