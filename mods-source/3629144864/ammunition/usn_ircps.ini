[General]
# Intermediate-Range Conventional Prompt Strike
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All      // can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode

Mass=13000                              // in kg. Used for aircraft
AmmoPoints=9000                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

CIWSDefenceBonus=35                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.20                     // Less chance to be intercepted by SAM because of anti-interception maneuvers


DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=1  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=SemiSmall                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=1
Power=100
ImpactSize=Large                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

FuzeProximityDistance=30.0             // for proximity fuze: distance to target in yard
KillProbability=4.8                     //Chance to intercept missile
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=12.0         // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=False  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
Retargetable=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=65.0                      // Climb angle for initial loft
MaxLoftAlt=90000.0
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=1000.0              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
#TerminalAlt=70000
#TerminalVerticalTurnRate=30
#TerminalDiveDistance=20                 // in N. miles.
#IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#SupportsBanking=True                  // if the missile will bank when turning
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                    // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=5300.0                      // Maximum speed in knots
MaxTurnRate=50.0                        // Maximum turnrate in degrees per second
LaunchTurnRate=5                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=6.0                    // Burn time for initial booster burn
Acceleration=14.0                       // Gs of acceleration in initial burn
SustainerAccelerationTime=6            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=26                 // Acceleration of sustainer burn. -1 if there is no sustainer
#174kN - 5.0s Boost
#22kN - 55s Sustain
TypicalTargetAlt=200000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0		           		// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0		       		// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=0.2                      // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.6                       // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=1800                       // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#TerminalLoft=True
#TimeLimited=True
#LiftFactor=0.001				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
#========================================= Launch stats ============================================================
MinLaunchRange=50.0                      // Minimum launch range in nautical miles
MaxLaunchRange=1500.0                    // Maximum launch range in nautical miles
LaunchReliability=98                    // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
#ECCM
AntiCountermeasuresBonus=1.0           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=1.0                    // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SearchMode=1                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
#SnakeSearchAngle=30.0                  // going left/right using that angle
#SnakeSearchTurnCycleTime=10.0          // time in seconds it takes for one complete snake cycle (left/right)
#ReattackMode=2                         // 0 = None, 1 = Circle, 2 = Drive-around
#LadderParams=0.0,0.0                   // First leg, second leg in yard
#SpiralSearchParams=0.0,0.0             // Ceiling, floor in yard
WobblingStrength=13.0                   // amplitude of wobbling. Marks that missile performs some wobbling flight
WobblingSpeed=0.5                     // frequency of wobbling
VerticalWobblingStrength=15.0                   // amplitude of wobbling. Marks that missile performs some wobbling flight
VerticalWobblingSpeed=0.5                     // frequency of wobbling
#SelfDestruct
SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_ircps
ResourcesMaterialFolder=assets/europack/materials/IRCPS/
ResourcesMaterial=eu_IRCPS_mat.ini
ResourcesMeshForLaunch=eu_launch_ircps
ResourcesMeshCanister=eu_launch_ircps
ResourcesMeshSwitchTime=11.9  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Launchers ----------]
# References to the launchers are just used for positioning relative to the launcher of the missile
[Launchers]
NumberOfLaunchers=1
Launcher1=eu_lmvls_apm

[eu_lmvls_apm]
LoadedPosition=0,0,0 //0,0,0.058898
UnloadedPosition=0,0,0 //0,0,0.058898
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/s-300_effect
BoosterEffectPosition=0,0,-0.1

InFlightEffect=effects/weapons/emitters/usn_rur-5_separation
InFlightEffectPosition=0,0,0.060
InFlightEffectStartTime=11.9

SustainerEffect=effects/weapons/emitters/sam_medium_effect
SustainerEffectPosition=0,0,-0.033
SustainerEffectStartTime=6.0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.015,0.015,0.07
