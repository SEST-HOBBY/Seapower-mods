# ger_cal_127mm_vulcano_glr_ir
# Vulcano 127 GLR with GPS/IMU and infrared seeker. Round 13 (24 Nov 2026): fired as a missile by the second weapon system on the
# 127/64 LW mount (launcher ger_vulcano127_launcher). Anti-ship round: GPS/IMU to the target, IR homing in the terminal phase,
# fire and forget, follows a manoeuvring ship. No land targets (the IR seeker cannot pick a land target out of the terrain).
# Own model variant with an IR dome (ger_vulcano127_glr_ir). Not tested in game.
[General]
Type=Missile                           // fired from the 127/64 LW mount by the launcher ger_vulcano127_launcher (pattern of the Euromod DART on the 76/62 Strales)
TargetType=ASuW                        // can be AAW, ASuW, ASW
CanNotAttackTypes=Aircraft,Helicopter,Missile,Bomb
IOCDate=2024
FOCDate=2025
Mass=45                                // in kg (as leo_cal_127mm_vulcano_BER)
AmmoPoints=150                         // For Supply System
DefaultCameraDistance=0.06             // camera 4 m behind the 0.86 m round (the DART values put it 40 m away, too far to see the model)
MinCameraDistanceForeAft=0.025
MinCameraDistanceBroadside=0.025
CameraPivotHeight=0.0
DecalClass=GunImpacts                  // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts         // referenced in effects/decals.ini
FrontalArea=0.0064                     // 90 mm flight body
SideArea=0.077
BottomArea=0.077
Volume=0.0168                          // same as the other 127 mm rounds of the 127/64 LW
[SensorData]
VisualIdentificationRange=2
IRSignature=VeryTiny
RCS=0.005
TransientRCS=Meager
TransientVisualIdentificationRange=10

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=0                          // 0 = Blast Fragmentation
Power=5
ImpactSize=SemiSmall                   // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                   // can be minor, moderate, heavy, always
KillProbability=0.90

[---------- Guidance ----------]
############################################################
# Guidance Types: 0 = None (here GPS/IMU to the aim point), 1 = IR Homing, 5 = Laser-Homing
############################################################
[Guidance]
GuidanceType=1                         // IR homing in the terminal phase
MidCourseCorrection=0                  // GPS/IMU, no datalink from the ship
InertialGuidance=True
TargetRequired=False                   // a point on the map can be attacked
Retargetable=No
InitialFlightPhaseDuration=1.0         // straight out of the barrel
PerformsSlightBallisticInitialFlight=False
#======================================== Flight Profile ===========================================================
# Round 20: straight climb along the 45 deg launch angle of the gun, glide at 52,500 ft (16 km), dive at 60 deg.
# With TerminalLoft and kinematics the game builds one loft waypoint (Missile.CreateWaypointConfigs): climb at MaxLoftAngle
# up to MaxLoftAlt, then glide, then descend at FinalFlightPhaseMaxAngle straight onto the target. The dive therefore starts
# MaxLoftAlt / tan(60 deg) = 16 km / 1.73 = 9.3 km (5 nm) before the target. Full profile from about 25 km (13.7 nm) on,
# so always above the minimum range of 15 nm. Before round 20: climb 35, glide 55,000 ft, dive 40 (dive began about 11 nm out).
# ApplyKinematics=True is required: with False the game flies the round as a cruise missile, flat at MaxLoftAlt.
BallisticLoft=False
OptimizeLoftAlt=False
MaxLoftAngle=45.0                      // climb angle in degrees = launch angle of the gun (FixVerticalLaunchAngle=45)
MaxLoftAlt=52500.0                     // feet (16 km): with the 60 deg dive the dive starts 5 nm before the target
LoftToSkim=False
TerminalLoft=True
SeaSkimmingStartDistToTarget=0
FinalFlightPhaseDistToTarget=0
FinalFlightPhaseMaxAngle=60.0          // dive angle in degrees (round 20, was 40)
TerminalApproachDist=12.0              // in N. miles: seeker on from here (round 21; round 19: 8, before: 2.5)
IgnoreHeightDifferenceForTargetDist=True
#=========================================  Kinematics  ============================================================
ApplyKinematics=True
MaxVelocity=2140.0                     // knots, about 1100 m/s at the muzzle
# Round 22: the old pair AccelerationTime=0.01 / Acceleration=25000 was the cause of the overshooting rounds.
# MissileSimulator.CalculateThrustOverTime gives thrust only while (missionElapsedTime - boosterEffectStartTime) is
# shorter than AccelerationTime, and Missile.PerformMoveForward adds it to the speed without a MaxVelocity cap
# (kinematics on). 0.01 s is shorter than one physics step (0.02 s), so each round got a random share of
# 25000 g * 0.01 s = up to about 5,700 kn, depending on when its first step fell. Rounds with the full share flew at
# about 8,000 kn, could not turn (MaxTurnG) and climbed over the target (screenshot 27.11.: 243,568 ft, 8,497 kn).
# Now the boost runs over 1.0 s (50 steps, same as InitialFlightPhaseDuration): thrust 93.5 * 9.81 * 1.944 * 1.2 kn/s
# = about 2,140 kn in total, the step timing changes this by at most 2 %, the motor spread of the game by +-2 %.
AccelerationTime=1.0                   // gun launch: up to MaxVelocity within 1 s, timing independent
Acceleration=93.5                      // g; 93.5 g * 1.0 s = about 2,140 kn with the game's thrust formula
SustainerAccelerationTime=-1           // no motor, the round glides
SustainerAcceleration=-1
DragCoefficient=-1                     // drag from MaxLaunchRange
LiftFactor=0.001                       // canard-controlled glide body, little extra drag at altitude
TypicalTargetAlt=0
TypicalFiringAlt=0
TypicalLaunchVelocity=0
VelocityBleed=0.35
MaxFlightTime=200
TimeLimited=True
MaxTurnRate=10.0                       // degrees per second, canard control
MaxTurnG=20
# Round 22: slight weave in midcourse so the rounds of a salvo do not all come down on the same line
# (the NSM of Euromod uses WobblingStrength=120.5 / WobblingSpeed=1.5 for the same reason).
# WeaponBase.ComputeWobble limits the amplitude to 0.3 * MaxTurnRate / WobblingSpeed = 6 deg and fades it out
# within the last 3.4 km to the target, so the terminal homing is not disturbed.
WobblingStrength=6.0                   // degrees of heading weave
WobblingSpeed=0.5                      // frequency
# Round 21: group flight of round 18 removed. When a group enters the terminal phase the game breaks it up
# (MissileGroup.CashIn, called from TerminalApproach): followers get their seeker, but the leader gets new waypoints
# (Missile.CreateWaypoints), climbs again towards MaxLoftAlt and flies over the target. At 32 rounds/min four rounds hit
# within about 6 s anyway.
#========================================= Launch stats ============================================================
MinLaunchRange=15.0                    // nautical miles (about 28 km), round 16; was 2
MaxLaunchRange=43.0                    // nautical miles, about 80 km
MinAttackAltitude=0
MaxAttackAltitude=1000
MaxAttackVelocity=60                   // knots
LaunchReliability=99
SeekerReliability=0.97
WarheadReliability=0.98
CircularErrorRadius=5                  // meters on coordinates (Leonardo: 5 m or less)
#========================================     Seeker     ===========================================================
SeekerFOV=60.0                         // IR seeker field of view in degrees (round 19, was 30)
SeekerActiveRange=0.0
SeekerPassiveRange=12.0                // IR acquisition of a ship in nautical miles (about 22 km; round 21; round 19: 10, before: 3)
TargetMemory=True
AntiCountermeasuresBonus=0.5           // IR decoys
AntiJammerBonus=0.9
SelfDestructDelay=2.0
