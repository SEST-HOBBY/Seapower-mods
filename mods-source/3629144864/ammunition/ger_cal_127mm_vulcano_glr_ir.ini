[---------- Effects ----------]
[Particles]
# Round 22: the GLR has no rocket motor (unpowered, fin and canard stabilised), so no smoke trail.
# In-flight effect: the transonic shock cone (vapour cone) of the base game fighters (F-15C, F/A-18A:
# ShockCone=effects/aircraft/emitters/shockcone), scaled down to the round. Not tested in game.
InFlightEffect=effects/aircraft/emitters/shockcone
InFlightEffectPosition=0,0,0.02
InFlightEffectScale=0.1,0.1,0.1
InFlightEffectStartTime=0.2            // seconds after launch, i.e. just after leaving the barrel
HitShipExplosion=effects/Particle Emitters/impact_large_shell
HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_medium
HitGroundExplosionClass=MediumGroundHitExplosions

