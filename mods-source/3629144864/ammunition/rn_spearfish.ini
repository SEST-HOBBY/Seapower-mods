SeekerReliability=0.95
WarheadReliability=0.95
SeekerFOV=60.0
SeekerActiveRange=2
SeekerPassiveRange=2
SeekerGain=45.0
SeekerOutputPower=240
AntiCountermeasuresBonus=0.25
MinAfterSpoofEffectTime=5.0
MaxAfterSpoofEffectTime=15.0
FractionOfRangeToActivateSeeker=0.5
SearchMode=1
SearchVelocity=55.0
SnakeSearchAngle=30.0
SnakeSearchTurnCycleTime=6.0
ReattackMode=1
ReattackCircleDegreesPerSecond=10.0
DefaultDepth=200.0
SelfDestructDelay=6

[Models]
