RCS=VerySmall
BaseNoise=118                   // gas-turbine pump-jet: louder than ADCAPs piston engine
FlowNoise=0.5
CavitationNoise=0
TargetReflectionStrength=1
TransientRCS=-1
TransientVisualIdentificationRange=-1
TransientBaseNoise=180

[WarheadData]
