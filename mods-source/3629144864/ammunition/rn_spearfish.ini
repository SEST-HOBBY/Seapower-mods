#==================================================================================================
# Spearfish (Royal Navy 533 mm heavyweight torpedo). Structure and seeker from stock usn_mk48_mod4_adcap;
# speed, range, mass and warhead from published Spearfish figures. Model: openSPproject rn_spearfish.
#==================================================================================================

[General]
Type=Torpedo
TargetType=ASW
SecondaryTargetType=ASuW
Mass=1850                              // in kg
AmmoPoints=5550
IOCDate=1992
FOCDate=1994
DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0
SaturationValue=3
DecalClass=Standard
FrontalArea=0.2231
SideArea=3.26
BottomArea=3.26

[SensorData]
