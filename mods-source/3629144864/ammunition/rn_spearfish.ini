Power=70                        // 300 kg aluminised PBX
ImpactSize=Large
Penetration=Always
FuzeProximityDistance=10
SmartFuse=True

[Guidance]
GuidanceType=10
MidCourseCorrection=2                  // wire guided
VesselAttackGuidanceType=8
InitialFlightPhaseDuration=5
TerminalVelocity=80.0
Acceleration=12.0
MaxTurnRate=12.0
MinLaunchRange=0.5
SpeedSettings=29,45,55,80
SpeedSettingRanges=29.2,22,18,14        // 54 km at 29 kt; about 26 km at sprint
WireControlsDepth=True
