# ger_cal_127mm_vulcano_glr_sal
# Vulcano 127 GLR SAL, GPS/IMU guided sub-calibre round with a semi-active laser seeker for the terminal phase,
# for the Leonardo 127/64 LW (modern configuration).
# Round 10 (23 Nov 2026) gun projectile, own model since round 10b, back in round 15 (25 Nov 2026) as the laser round of the gun:
# fired by the gun itself (F126 WeaponSystem3, magazine WeaponMagazine127), not by the Vulcano launcher, like the CLGP of usn_cgn_alaska.
# Laser guidance as the base game CLGP (usn_cal_203mm_clgp), GuidanceType 5. The gun only fires it when a laser
# designator can light the target, its own (F126: SensorSystem of type LaserDesignator) or one in the task force
# (for example a helicopter). While the target is lit the round steers to where the target will be at impact,
# at most MaxGuidedCorrection away from the aim point predicted at firing.
# The game has no IR seeker for gun projectiles (Projectile.UpdateLaserGuidance is the only projectile guidance),
# The IR variant of the real round is the missile ger_cal_127mm_vulcano_glr_ir.
# Data: range over 80 km, muzzle velocity about 1100 m/s, IR or SAL terminal guidance (Leonardo).
# Not tested in game.
[General]
Type=Projectile                        // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Aircraft,Helicopter,Missile,Bomb

Mass=45                                // in kg. Used for aircraft (as leo_cal_127mm_vulcano_BER)
AmmoPoints=180                         // For Supply System

DecalClass=GunImpacts                  // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts         // referenced in effects/decals.ini

FrontalArea=0.1234
SideArea=2.9
BottomArea=2.9
Volume=0.0168                          // same as the other 127 mm rounds of the 127/64 LW

[Physics]
MuzzleVelocity=1100                    // meter per second
MaxRange=80000                         // in meters
GravityFactor=1.0                      // vacuum range at 45 degrees equals MaxRange, so the longest shot flies the full arc
CircularErrorProbable=5                // radius in meters at max range before the laser correction (GPS/IMU)

[Guidance]
GuidanceType=5                         // LaserHoming, requires a designator painting the target
MaxGuidedCorrection=1000               // max lateral steer in meters around the ballistic aim point (CLGP: 800)

[---------- Warhead Data ----------]
[WarheadData]
Power=5
ImpactSize=SemiSmall                   // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                   // can be minor, moderate, heavy, always

[---------- Mesh definitions----------]
[Models]
# Own 3D model of the sub-calibre round (0.86 m, nose cone, canards, tail fins), no tracer.
# The game loads OBJ models for gun projectiles like the Euromod HEL (ger_HEL.ini) and turns the model along its path.
ResourcesFolder=assets/models/weapons/ger_vulcano127_glr/
ResourcesRoot=ger_vulcano127_glr.obj
ResourcesMesh=ger_vulcano127_glr
ResourcesMaterial=ger_vulcano127_glr_mat.ini

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_large_shell
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_medium
HitGroundExplosionClass=MediumGroundHitExplosions
