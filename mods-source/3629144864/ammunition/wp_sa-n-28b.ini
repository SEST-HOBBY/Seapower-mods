#!alias ammunition/wp_sa-n-28a.ini
# 9M96D - Poliment-Redut

[General]
Mass=420                              // in kg. Used for aircraft
AmmoPoints=1680                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
IOCDate=2014                          // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)
FOCDate=2019                          // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available
SideArea=1.36
BottomArea=1.36

[Guidance]
MaxTurnRate=40                        // Maximum turnrate in degrees per second
MaxTurnG=60                           // Maximum G-limit of missile turns
#======================================== Flight Profile ===========================================================
MaxLoftAlt=82000                      // in feet. Maximum altitude for lofting
MaxLoftVelocity=3110                  // Maximum speed in knots for lofting
TerminalApproachDist=9                // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
#=========================================  Kinematics  ============================================================
MaxVelocity=3110                      // Maximum speed in knots
SustainerAccelerationTime=12          // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=14.9              // Acceleration of sustainer burn. -1 if there is no sustainer
DragCoefficient=2.65                   // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
MaxFlightTime=210                      // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MinLaunchRange=1.35                   // Minimum launch range in nautical miles
MaxLaunchRange=65                     // Maximum launch range in nautical miles
MaxAttackAltitude=98425               // Maximum altitude of target, in feet
MaxAttackVelocity=3888                // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
#========================================     Seeker     ===========================================================
SeekerActiveRange=11                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj,CORRECT_OBJ_ORIENTATION
ResourcesMesh=eu_missile_sa-n-28b
ResourcesMaterialFolder=assets/europack/materials/SA-N-28/
ResourcesMaterial=SA-N-28_mat.ini


[Particles]
BoosterEffectPosition=0,0,-0.041184
InFlightEffectPosition=0,0,-0.041184
SustainerEffectPosition=0,0,-0.041184

[col_main]
Position=0,0,0.000502
Scale=0.008566,0.008566,0.083372
