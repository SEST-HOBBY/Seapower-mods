[General]
# P-800 "Oniks" (SS-N-26 Strobile)

Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation,ShoreTargetsOnly // can be  All, Installation, Mobile, ShoreTargetsOnly

CIWSDefenceBonus=20                     // Game balance estimate for a supersonic sea-skimming missile.
MissileDefenceBonus=0.30                // Game balance estimate; reduced from the armored P-700 template.
# Interception bonuses are gameplay estimates; the P-700 armor bonus is reduced.

Mass=3000                               // Approximate surface-launched missile mass in kg; model dimensions remain P-700 placeholders.
AmmoPoints=9000                         // Supply-system price; game balance estimate using the basegame advanced-ASM mass ratio.
SupplyCategory=SovietAdvancedASM       // For Supply System. Makes that presence of such category is required for replenishment of this weapon

DefaultCameraDistance=0.3
MinCameraDistanceForeAft=0.15
MinCameraDistanceBroadside=0.15
CameraPivotHeight=0.0

SaturationValue=2
DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=0.5                                 
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance
TransientBaseNoise=240                 // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = HighExplosive     =  100% damage to structre
#1 = Armor Piercing		TBD
#2 = HEAT				TBD
#3 = Illumination		TBD
#4 = Cluster           =  -50% damage to structre
#5 = Runway Cratering	TBD
#6 = Fragmentation     =  -50% damage to structre
[WarheadData]
WarheadType=0
Power=46                                
ImpactSize=Large                        // Game impact class for the smaller P-800 warhead.
Penetration=Always               // can be minor, moderate, heavy, always

[OnBoardSystems]
ECM=                                  // No P-700-specific onboard jammer is inherited.

[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=3
LandAttackGuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.5          // Native fallback in seconds; the AC launch controller replaces this straight-flight delay.
PerformsSlightBallisticInitialFlight=False // Use a powered launch; AC tip-over settings are in the separate override.
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=45.0                      // Climb angle for initial loft
MaxLoftAlt=45932                        // Feet; approximately 14000 m for the high-altitude part of the game flight profile.
MaxLoftVelocity=1458                    // Knots; approximately 750 m/s. High-altitude gameplay speed target.
LoftToSkim=True                         // Keep the sea-skimming waypoint after the high-altitude cruise.
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=49.2                     // Feet; approximately 15 m above the sea.
SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=1                    // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=40         // Nautical miles; game-tuned transition into low-altitude flight.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=32.8                // Feet; approximately 10 m. Continue descending instead of performing a popup.
FinalFlightPhaseMaxAngle=25.0
FinalFlightPhaseDistToTarget=25         // Nautical miles; game-tuned final low-altitude segment near seeker acquisition.
SearchForTargetsTime=5                  // Seconds; gameplay delay after seeker activation before terminal guidance.
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=22                 // Nautical miles; slightly inside the configured active seeker range.
TerminalAlt=16.0                        // Feet; approximately 10 m above the sea in terminal approach.
TerminalVelocity=1322                   // Knots; approximately 680 m/s for the low-altitude terminal segment.
TerminalDiveDistance=3                 // in N. miles.
#============================================= Misc ================================================================
GroupSize=12                             // Disable the P-700-specific high-flying group-leader behavior for this initial Oniks configuration.
GroupJoinRange=25                      // in miles
GroupSpacing=0.1                       // in miles. interval between missiles in line
GroupLeaderAlt=16.0                     // Feet; unused with GroupSize=1; keeps a future group leader at the final low altitude.
GroupWingmanAlt=16.0                    // Feet; unused with GroupSize=1; matches the final low altitude.
#RequiresTargetToProceed=True           //Will not change its flight phase unles have a target selected by operator
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=1322                        // Knots; approximately 680 m/s at low altitude; loft speed has its own key.
Acceleration=8.0                        // Native game acceleration factor; tuning estimate, not measured motor performance.
MaxTurnRate=10.0                        // Native turn limit in degrees/second; gameplay estimate.
MinLaunchRange=5.4                      // Nautical miles; approximately 10 km for this gameplay configuration.
MaxLaunchRange=324.0                    // Nautical miles; approximately 600 km. Domestic P-800 gameplay assumption; not the 300 km export Yakhont.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=30      // Metres; game balance estimate for the inherited installation-attack mode.
#Homing
SeekerGain=45.0                         // Game seeker gain in dB; tuning estimate.
SeekerFOV=90                            // Total seeker field of view in degrees; game approximation.
SeekerActiveRange=25                    // Nautical miles; game balance estimate, not a verified detection envelope.
SeekerPassiveRange=0                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=45                           // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
DefaultIgnoredTypes=LandUnit           // Seeker ignores objects of this type while in default mode
UseFinalFlightInLandMode=False         // Skip FinalFlightPhase when in LandAttack mode
#Misc Guidance Properties
SizeGate=10						  	   //
RangeGate=2							   // 
#ECCM
AntiCountermeasuresBonus=0.30           // Game countermeasure resistance on a 0..1 scale; estimate.
AntiJammerBonus=0.20                    // Game jamming resistance on a 0..1 scale; estimate.
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_ss-n-26_stage2
ResourcesMaterialFolder=assets/europack/materials/SS-N-26/
ResourcesMaterial=SS-N-26_mat.ini
ResourcesMeshForLaunch=eu_launch_ss-n-26
ResourcesMeshCanister=eu_capsule_ss-n-26
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/wp_ss-n-19_booster
BoosterEffectPosition=0,0,0

InFlightEffect=effects/weapons/emitters/turbojet_sustainer
InFlightEffectPosition=0,0,-0.072
InFlightEffectStartTime=15.0  // in seconds, after that the Inflight Effect will be played if available

UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.08

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions

HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=VeryLargeGroundHitExplosions

[---------- Colliders ----------]
[Colliders]
#creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.017,0.017,0.14