[General]
Type=Projectile                   // can be Projectile, Missile, Torpedo
TargetType=ASuW                    // can be AAW, ASuW, ASW
LandAttackCapability=All  // can be  All, Installation, Mobile, ShoreTargetsOnly


Mass=45                                // in kg. Used for aircraft
AmmoPoints=75                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts             // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts    // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=1100                // meter per second
MaxRange=60000                    // in meters
GravityFactor=1.25
CircularErrorProbable=80         // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=4.5
FuzeProximityDistance=8
ImpactSize=SemiSmall                   // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                // can be minor, moderate, heavy, always
KillProbability=0.04             // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_large_shell
 #HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_medium	//Bomb_hit_object_small
HitGroundExplosionClass=MediumGroundHitExplosions