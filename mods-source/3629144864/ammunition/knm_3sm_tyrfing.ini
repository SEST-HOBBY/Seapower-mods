#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# 3SM Tyrfing
# Users: F127
Type=Missile
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation      // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=3000                              // in kg. Used for aircraft
AmmoPoints=9000                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
#SupplyCategory=NatoAdvancedASM       // For Supply System. Makes that presence of such category is required for replenishment of this weapon

CIWSDefenceBonus=60                     // added chance to evade CIWS compounded by below factors
MissileDefenceBonus=0.30                     // added chance to evade missile compounded by below factors
#high terminal speed

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.15
CameraPivotHeight=0.0

#SaturationValue=4

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=0.2
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance
TransientBaseNoise=240                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = HighExplosive     =  100% damage to structre
#1 = Armor Piercing		TBD
#2 = HEAT				TBD
#3 = Illumination		TBD
#4 = Cluster           =  -50% damage to structre
#5 = Runway Cratering	TBD
#6 = Fragmentation     =  -50% damage to structre
[WarheadData]
WarheadType=1
LandAttackGuidanceType=1
Power=60
ImpactSize=Large                       // Impact size, can be small, medium, large, verylarge
Penetration=Heavy                       // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=2.0         // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=False  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
TargetRequired=False
Retargetable=True
TerrainFollowFlight=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=45.0                      // Climb angle for initial loft
MaxLoftAlt=65000.0                     // in feet. Maximum altitude for lofting
MaxLoftVelocity=1980.0                 // Maximum speed in knots for lofting
LoftToSkim=False
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=25.0                  // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=30.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=1                    // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=120.0      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=30.0              // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalAlt=8                         // in feet. Weapon will try to get to this altitude at the start of terminal approach
TerminalVelocity=1824                  // Maximum speed in knots when missile is locked on target
TerminalDiveDistance=3                 // in N. miles.
#============================================= Misc ================================================================
GroupSize=24                            // Indicates that missiles can join into groups
GroupJoinRange=20                      // in miles
GroupSpacing=0.3                       // in miles. interval between missiles in line
GroupLeaderAlt=16                    // in feet. altitude of leading missile. Only for FinalFlightPhase
GroupWingmanAlt=16.0                   // in feet. altitude of non-leading missile. FinalFlightPhase
#RequiresTargetToProceed=True           //Will not change its flight phase unles have a target selected by operator
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=1455                     // Maximum speed in knots
Acceleration=8.0                      // Acceleration factor
MaxTurnRate=12.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=50                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MinLaunchRange=3                       // Minimum launch range in nautical miles
MaxLaunchRange=539                     // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)

#Dot: Blocked until fixed
#nstk: causes missile to lose target and re-acquire randomly based on distance, causes horde swarms and isnt very good overall
#WobblingStrength=50.0                  // amplitude of wobbling
#WobblingSpeed=2.5                      // frequency of wobbling
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=53.0                        // Seeker gain in dB
SeekerFOV=85,10                        // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerActiveRange=50.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=50                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
Frequency=Ku-Band                       //Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=40                           //Active radar seeker output peak power in kW
DefaultIgnoredTypes=LandUnit           // Seeker ignores objects of this type while in default mode
UseFinalFlightInLandMode=False         // Skip FinalFlightPhase when in LandAttack mode
#TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#Misc Guidance Properties
WobblingStrength=1.0                   // amplitude of wobbling. Marks that missile performs some wobbling flight
WobblingSpeed=1.0                     // frequency of wobbling
VerticalWobblingStrength=15.0                   // amplitude of wobbling. Marks that missile performs some wobbling flight
VerticalWobblingSpeed=0.5                     // frequency of wobbling
RangeGate=2							   // 
SizeGate=3						   //
CircularErrorRadiusInstallation=1.5    // Circular error vs 'Installation' land units
#ECCM
AntiCountermeasuresBonus=0.6           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.65                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=4.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_3SM_tyrfing
ResourcesMaterialFolder=assets/europack/materials/3SM_tyrfing/
ResourcesMaterial=3SM_tyrfing_mat.ini
ResourcesMeshForLaunch=eu_launch_3SM_tyrfing
ResourcesMeshSwitchTime=1  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=1

SubModel1=Afterburner

[Afterburner]
Type=Afterburner                  //Dot: afterburner is invisible by default and will be turned on only after launch
ResourcesMeshFolder=weapons/wp_ss-n-19/
RootMesh=wp_ss-n-19
Mesh=wp_ss-n-19_afterburner
ResourcesMaterialFolder=aircraft/materials/
Material=afterburner_mat
Position=0,0.0,0.0
Rotation=0,0,0
CastShadows=False

[Debris]
DebrisProbability=95                // probability for debris to happen
ResourcesMeshForDebris=usaf_agm-86c_d // optional debris mesh after destruction
DebrisPosition=0.05                 // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.99
DebrisHeightLossAdd=0.0005          // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/usn_rgm-109_booster
BoosterEffectPosition=0,0,0.0140
InFlightEffect=effects/weapons/emitters/missile_sustainer_small_effect
InFlightEffectPosition=0,0,0
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07

