[General]
# TASM
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

CIWSDefenceBonus=10                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.10                     // Less chance to be intercepted by SAM because of anti-interception maneuvers
#Armored warhead & Deceptive Maneuver

Mass=1450                              // in kg. Used for aircraft
AmmoPoints=4350                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=0.5
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=64
ImpactSize=Large                      // Impact size, can be small, medium, large, verylarge
Penetration=heavy                     // can be minor, moderate, heavy, always

[OnBoardSystems]
ECM=AN/DPW-23

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3.0         // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=True  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
TerrainFollowFlight=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=50.0                      // Climb angle for initial loft
MaxLoftAlt=3000.0                      // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming ---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=50                      // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase ------------------------------------------------------------------------------
#flight phase 4: terminal approach ------------------------------------------------------------------------------------------------------
TerminalApproachDist=8.0               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalPopUpDist=2                    // Pop-up distance in miles
TerminalPopUpHeight=1500               // Pop-up limit in feet. Actual max height depends on missile turn rate
TerminalPopUpAngle=45                  // Pop-up climb anble in degrees
TerminalVerticalTurnRate=25            // Override of vertical turn rate in terminal (intended for Pop-up)
SupportsBanking=False                  // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=550.0                      // Maximum speed in knots
Acceleration=6.0                       // Acceleration factor
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second
MinLaunchRange=20.0                    // Minimum launch range in nautical miles
MaxLaunchRange=250.0                   // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=50.0                        // Seeker gain in dB
SeekerFOV=60,10                        // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SecondaryPassiveRadarGuidanceType=Full // Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
SeekerActiveRange=20.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=100                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
Frequency=Ku-Band                      // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=35                           // Active radar seeker output peak power in kW
#Misc Guidance Properties
RangeGate=2							   //
SizeGate=10						   //
#ECCM
AntiCountermeasuresBonus=0.25          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.25                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
SearchMode=1                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
SearchVelocity=550.0                   // velocity in search mode in knots
SnakeSearchAngle=30.0                  // going left/right using that angle
SnakeSearchTurnCycleTime=30.0          // time in seconds it takes for one complete snake cycle (left/right)
ReattackMode=0                         // 0 = None, 1 = Circle, 2 = Drive-around
LadderParams=0.0,0.0                   // First leg, second leg in yard
SpiralSearchParams=0.0,0.0             // Ceiling, floor in yard
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=1.2                  // delay in seconds for self destruction
