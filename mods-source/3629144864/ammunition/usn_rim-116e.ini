#!alias ammunition/usn_rim-116c.ini

#RIM-116D RAM Block IIB

[---------- Warhead Data ----------]
[WarheadData]
InterceptOutOfAltitudePenalty=0.1
InterceptSpeedPenaltyMultiplier=0.70
InterceptSizePenaltyMultiplier=0.30					// multiplier to the size penalty, 1.0 is default

[---------- Guidance ----------]
[Guidance]
#======================================== Flight Profile ===========================================================
MaxLoftAngle=45.0                           // Climb angle for initial loft
DragCoefficient=3.2  //1.9                           // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
#========================================= Launch stats ============================================================
MaxLaunchRange=10.0                     // Maximum launch range in nautical miles
MaxAttackVelocity=2000				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
#========================================     Seeker     ===========================================================
#ECCM
AntiCountermeasuresBonus=0.50           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.40                   // This value substracted from probability of being jammed  (0...1)