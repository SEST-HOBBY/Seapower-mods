#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================

#!alias ammunition/wp_sa-n-20.ini
# 48N6DMK - Fort-M active-radar extended-range

[General]
IOCDate=                              // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)
FOCDate=                              // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

[Guidance]
MaxLoftAlt=98425                     // in feet. Maximum altitude for lofting
MaxFlightTime=260               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited

GuidanceType=3
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
Retargetable=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=55.0                      // Climb angle for initial loft

MaxVelocity=4860.0                     // Maximum speed in knots
MaxTurnRate=20                       // Maximum turnrate in degrees per second
MaxTurnG=25                       // Maximum G-limit of missile turns
LaunchTurnRate=120                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=1.0                  // Burn time for initial booster burn
Acceleration=10                      // Gs of acceleration in initial burn
SustainerAccelerationTime=14            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=24.5               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=40000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=-1               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.8                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime

#========================================= Launch stats ============================================================
MinLaunchRange=3.5                     // Minimum launch range in nautical miles
MaxLaunchRange=135.0                    // Maximum launch range in nautical miles
MinAttackAltitude=23.0                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=98425.2                // Maximum altitude of target, in feet
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=68.0                        // Seeker gain in dB
SeekerFOV=60.0                          // Seeker field-of-view in degrees
SeekerGimbalFOV=120                     // Seeker gimbal FOV in degrees
SeekerActiveRange=14.0                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=8.0                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#MISC
#ECCM
AntiCountermeasuresBonus=0.70           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.65                    // This value substracted from probability of being jammed (0...1)
#SelfDestruct
SelfDestructDelay=2.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj,CORRECT_OBJ_ORIENTATION
ResourcesMesh=eu_missile_sa-n-20c
ResourcesMaterialFolder=assets/europack/materials/SA-N-20/
ResourcesMaterial=SA-N-20_Blue_Tip_mat.ini
