[General]
# BlaskShark
# Users: Todaro-class
Type=Torpedo                           // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=1370                              // in kg. Used for aircraft
AmmoPoints=4800                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

SaturationValue=3

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
BaseNoise=112                   // base sound level in db at 1m distance
FlowNoise=0.32                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0               // additional noise for cavitation in db
TargetReflectionStrength=1      // in dB for broad side
# Transient
TransientRCS=-1                        // Transient visibility on the radar
TransientVisualIdentificationRange=-1  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=170                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=100
ImpactSize=Large               // Impact size, can be small, medium, large, verylarge
Penetration=Always              // can be minor, moderate, heavy, always

FuzeProximityDistance=8         // for proximity fuze: distance to target in meter
SmartFuse=True                  // Explodes not immediately but when when target start to go away

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
#10 = Combined Active&Passive Sonar Homing
[Guidance]
GuidanceType=10
MidCourseCorrection=2                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
VesselAttackGuidanceType=8                            // 8 = passive sonar vs vessels, 9 = wake homing vs vessels
InitialFlightPhaseDuration=3           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
TerminalVelocity=52.0                         // Maximum speed in knots when torpedo is locked on target
#========================================= Launch stats ============================================================
MaxVelocity=52.0                       // maximum speed in knots; kept active for compatibility with SpeedSettings
Acceleration=13.0                      // Acceleration factor
MaxTurnRate=20.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.2                     // Minimum launch range in nautical miles
MaxLaunchRange=27.0                         // Maximum launch range in nautical miles; matches max SpeedSettingRanges
SpeedSettings=25,40,52                     // selectable speeds in knots, lowest to highest
SpeedSettingRanges=27.0,20.0,14.0               // full-tank range in nautical miles at each speed above
WireControlsDepth=True                         // wire can pass depth orders and target depth data to the torpedo
WireCountermeasureBonus=0.45                         // extra countermeasure rejection while on the wire
WireBreakSpeed=20                           // launch platform speed in knots above which wire breaks
WireMinSeafloorClearance=50                           // wire breaks below this seafloor clearance in feet; 0 = disabled
MinLaunchAltitude=100                  // Minimum launch altitude in feet.
MaxLaunchAltitude=1000                 // Maximum launch altitude in feet.

MaxDepth=2500                          // Maximum allowed depth in feet.

LaunchReliability=95                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerFOV=60.0                         // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerActiveRange=2.5                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=2.5                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
#TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed /Dot: TBD to more fancy guidance
SeekerGain=48.0                        // Seeker gain in dB
SeekerOutputPower=240                  // Active seeker output power in dB, unused for passive ones
#ECCM
AntiCountermeasuresBonus=0.50         // This value substracted from probability of spoofing by countermeasures (0...1)
MinAfterSpoofEffectTime=2            // Min time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
MaxAfterSpoofEffectTime=10.0            // Max time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
FractionOfRangeToActivateSeeker=0.8    // Fraction of seeker range left to target before activation of seeker for wire guided torpedoes
# Torpedo related
SearchMode=1                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
SearchVelocity=45.0                    // velocity in search mode in knots
SnakeSearchAngle=40.0                  // going left/right using that angle
SnakeSearchTurnCycleTime=5.0           // time in seconds it takes for one complete snake cycle (left/right)
ReattackMode=1                         // 0 = None, 1 = Circle
ReattackCircleDegreesPerSecond=10.0    // degrees per second for circle reattack pattern
DefaultDepth=200.0                     // default depth in feet a torpedo is using for submerged targets for bearing only launches
#SelfDestruct
SelfDestructDelay=60                    // For sonobouy it is a time in seconds while its sonar works <- not used here atm TODO: Decide merge or no


[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_torpedo_blackshark
ResourcesMaterialFolder=assets/europack/materials/BlackShark/
ResourcesMaterial=BlackShark_mat.ini
############################################################
NumberOfSubModels=2

SubModel1=eu_torpedo_blackshark_prop_1
SubModel2=eu_torpedo_blackshark_prop_2

[eu_torpedo_blackshark_prop_1]
Type=Propulsion
RotationDirection=Right
Mesh=eu_torpedo_blackshark_prop_1
Rotation=-90,0,0

[eu_torpedo_blackshark_prop_2]
Type=Propulsion
RotationDirection=Left
Mesh=eu_torpedo_blackshark_prop_2
Rotation=-90,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
#ParachuteEffectClass=Parachute
#ParachuteEffectPosition=0,0,-0.02
BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/aswtorpedo_cavitation_particle
InFlightEffectPosition=0,0,-0.04
InFlightEffectStartTime=0

HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes
ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo
############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
PropAudioClip=audio/weapons/torpedo
PropAudioRollOff=Logarithmic
PropAudioDistance=1,20
PropAudioPitch=1.0
PropAudioPosition=0,0,0
PropAudioAudibility=Below
SonarAudioClip=audio/environment/Sonar-MF
SonarAudioPosition=0,0,0
SonarAudioRollOff=Logarithmic
SonarAudioDistance=1,50
SonarAudioPitch=1
SonarAudioVolume=1
SonarAudioAudibility=Below

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# Hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,-0.0051,0.0053
Rotation=0,0,0
Scale=0.01,0.01703,0.09293
