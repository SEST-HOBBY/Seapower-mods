#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================

# 9M317M - Shtil-1

[General]
BottomArea=2.06
SideArea=2.06
FrontalArea=0.1307
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW

// can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=581                  // in kg. Used for aircraft
AmmoPoints=1743                  // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

IOCDate=2016                          // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)
FOCDate=                              // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=24
ImpactSize=Medium                       // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                     // can be minor, moderate, heavy, always

FuzeProximityDistance=25             // for proximity fuze: distance to target in yard
KillProbability=0.9                     //Chance to intercept missile
InterceptSpeedPenaltyMultiplier=0.85                  // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
InterceptOutOfAltitudePenalty=0.3                  // base value used for out-of-altitude calculations, 0.20 is excellent, 0.30 is good, 0.40 is average, 0.50 is poor
InterceptSizePenaltyMultiplier=0.7					// multiplier to the size penalty, 1.0 is default

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=2
MidCourseCorrection=0 //                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.3         // time in seconds where the missile moves straight on without guiding
;Retargetable=False

#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
#MaxLoftAngle=80.0                      // Climb angle for initial loft
MaxLoftAlt=49000                  // in feet. Maximum altitude for lofting
MaxLoftVelocity=3010                  // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=8                 // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
;IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
LocalTerminalOnly=False                 // if true connection with a guiding radar will be severed upon entering terminal approach stage
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=3010                  // Maximum speed in knots
MaxTurnRate=30                       // Maximum turnrate in degrees per second
MaxTurnG=30                       // Maximum G-limit of missile turns
LaunchTurnRate=90                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=3.5                       // Burn time for initial booster burn
Acceleration=22                  // Gs of acceleration in initial burn
SustainerAccelerationTime=16.5            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=11.5                  // Acceleration of sustainer burn. -1 if there is no sustainer
#174kN - 6.0s Boost
#22kN - 44s Sustain
TypicalTargetAlt=0					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=0
TypicalFiringAlt=0		           		// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0		       		// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=-1 //1.45                        // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
MaxFlightTime=100                       // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TerminalLoft=True
TimeLimited=True
LiftFactor=0.0015				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
#========================================= Launch stats ============================================================
MinLaunchRange=1                  // Minimum launch range in nautical miles
MaxLaunchRange=27                  // Maximum launch range in nautical miles
MinAttackAltitude=10                  // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=50000                  // Maximum altitude of target, in feet
MaxAttackVelocity=1600                  // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=0.98                // Chance that engine will start when launching from aircraft
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=0                        // Seeker gain in dB
SeekerFOV=45                          // Seeker field-of-view in degrees
SeekerGimbalFOV=90                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=30                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=0                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#MISC
;RangeGate=2							   // 
;SizeGate=1.1						   //
#ECCM
AntiCountermeasuresBonus=0.65           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.60                    // This value substracted from probability of being jammed (0...1)
#SelfDestruct
SelfDestructDelay=2.0                  // delay in seconds for self destruction

