[General]
Type=Projectile                // can be Projectile, Missile, Torpedo
TargetType=AAW                // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

DecalClass=GunImpacts          // referenced in effects/decals.ini

Mass=0.01                                // in kg. Used for aircraft
AmmoPoints=0.01                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

[Physics]
MuzzleVelocity=20000             // meter per second
MaxRange=7000                 // in meters
GravityFactor=100
CircularErrorProbable=0.001      // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=2
Power=0.0001
ImpactSize=small             // Impact size, can be small, medium, large, verylarge
Penetration=minor             // can be minor, moderate, heavy, always
FuzeType=1
FuzeProximityDistance=4             // for proximity fuze: distance to target in yard
KillProbability=95 
[Guidance]
SelfDestructDelay=0.7                  // delay in seconds for self destruction  
[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_laser
ResourcesMaterialFolder=assets/europack/materials/HEL/
ResourcesMaterial=HEL_mat.ini

[---------- Effects ----------]
[Particles]
TrailEffect=None
#HitWaterSplashClass=SmallWaterSplashes
#HitDefaultExplosionClass=SmallGroundHitExplosions
HitShipExplosion=effects/weapons/emitters/usn_phalanx_burst