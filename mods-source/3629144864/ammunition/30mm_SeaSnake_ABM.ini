DecalClass=GunImpacts      // referenced in effects/decals.ini

Mass=0.36
AmmoPoints=0.40

[Physics]
MuzzleVelocity=1050         // meter per second
MaxRange=3500               // in m
CircularErrorProbable=6     // radius in meters at max range for shells to impact

