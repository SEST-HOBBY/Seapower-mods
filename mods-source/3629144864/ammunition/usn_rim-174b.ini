#!alias ammunition/usn_rim-174a.ini

# RIM-174B SM-6 Block IAU

[General]
AmmoPoints=6200                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

[---------- Warhead Data ----------]
[WarheadData]
KillProbability=0.90                     //Chance to intercept missile
InterceptSpeedPenaltyMultiplier=0.70                  // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
InterceptOutOfAltitudePenalty=0.10                  // base value used for out-of-altitude calculations, 0.20 is excellent, 0.30 is good, 0.40 is average, 0.50 is poor
InterceptSizePenaltyMultiplier=0.30					// multiplier to the size penalty, 1.0 is default

[---------- Guidance ----------]
[Guidance]
#======================================== Flight Profile ===========================================================
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
LocalTerminalOnly=False                 // if true connection with a guiding radar will be severed upon entering terminal approach stage
#========================================= Launch stats ============================================================
MaxAttackAltitude=200000               // Maximum altitude of target, in feet
#========================================     Seeker     ===========================================================
#ECCM
AntiCountermeasuresBonus=0.50           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.60                   // This value substracted from probability of being jammed  (0...1)