[General]
# RBS15 Mk2
Type=Missile
TargetType=ASuW
LandAttackCapability=None

Mass=1450                              // in kg. Used for aircraft
AmmoPoints=1725                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
SupplyCategory=Harpoon                 // For Supply System. Makes that presence of such category is required for replenishment of this weapon

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

DecalClass=Standard

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=0.3
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=0
Power=42
ImpactSize=Large                       // Impact size, can be small, medium, large, verylarge
Penetration=heavy                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
[Guidance]
GuidanceType=3
MidCourseCorrection=0
TargetRequired=False                 
InitialFlightPhaseDuration=2.0
PerformsSlightBallisticInitialFlight=True
TerrainFollowFlight=True
ApplyKinematics=False                        // If we should use full kinematics rules. If this is true, we will only use kinematics 
#======================================== Flight Profile ===========================================================
#flight phase 1: loft -----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=30.0
MaxLoftAlt=200.0              // feet
#flight phase 2: sea skimming ---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=50                      // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=10.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase ------------------------------------------------------------------------------
#flight phase 4: terminal approach ------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=12.0
#TerminalDiveDistance=0.5
TerminalAlt=20                         // in feet. Weapon will try to get to this altitude at the start of terminal approach
SupportsBanking=True
#============================================= Misc ================================================================
AltitudeOverClutter=40
#========================================= Launch stats ============================================================
MaxVelocity=600.0                       // Maximum speed in knots                                                 
Acceleration=5.5                        // Acceleration factor                                                    
MaxTurnRate=16.0                        // Maximum turnrate in degrees per second                                 
MinLaunchRange=3.0                      // Minimum launch range in nautical miles                                 
MaxLaunchRange=38.0                     // Maximum launch range in nautical miles                                 
LaunchReliability=97                    // The lower the value, the greater risk of misfire or accident (0...100) 
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=70.0                        // Seeker gain in dB
SeekerFOV=60                           // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerActiveRange=20.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=0                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
Frequency=Ku-Band
PeakPower=100.0                         // Active radar seeker output peak power in kW
DefaultIgnoredTypes=LandUnit           // Seeker ignores objects of this type while in default mode
UseFinalFlightInLandMode=False         // Skip FinalFlightPhase when in LandAttack mode
TargetMemory=False                      // Always locks on preselected target unless spoofed or jammed
#Misc Guidance Properties
RangeGate=4							   // 
SizeGate=10						   //
#ECCM
AntiCountermeasuresBonus=0.35          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.25                   // This value substracted from probability of being jammed  (0...1)
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=10.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_RBS15
ResourcesMaterialFolder=assets/europack/materials/RBS15/
ResourcesMaterial=RBS15_mat.ini
ResourcesMeshForLaunch=eu_launch_RBS15
#ResourcesMeshCanister=eu_launch_RBS15
ResourcesMeshSwitchTime=1.0 // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[Debris]
DebrisProbability=95                // probability for debris to happen
ResourcesMeshForDebris=usaf_agm-86c_d // optional debris mesh after destruction
DebrisPosition=0.05                 // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.99
DebrisHeightLossAdd=0.0005          // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=effects/weapons/emitters/otomat_launch_effect
BoosterEffectPosition=0,0,-0.012

InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.035
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/wp_ss-n-3_sustainer
SustainerEffectPosition=0,0.0005,0.00
SustainerEffectScale=0.3,0.3,0.3
SustainerEffectStartTime=1.0

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes

DebrisTrail=effects/aircraft/emitters/helicopterfireeffect
HitWaterSplashClass=LargeWaterSplashes
ExplosionOverwaterSplash=False

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
#creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.02
