[General]
# UGM-133A Trident II D5
# Users: United States Navy, Royal Navy
Type=Missile                               // can be Projectile, Missile, Torpedo
TargetType=ASuW                            // can be AAW, ASuW, ASW
LandAttackCapability=All                   // can be All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine,Aircraft,Helicopter,Missile // Target types excluded from attack
Mass=59000                                 // in kg. Used for aircraft
AmmoPoints=120000                          // For Supply System. Ammunition cost
FOCDate=1990                               // Year of full operational capability
DefaultCameraDistance=0.45
MinCameraDistanceForeAft=0.24
MinCameraDistanceBroadside=0.12
CameraPivotHeight=0
DecalClass=SAMImpacts                      // referenced in effects/decals.ini
FrontalArea=3.34
SideArea=27.6
BottomArea=27.6

[SensorData]
#Visual
VisualIdentificationRange=4                // in nautical miles
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=4                                      // Radar cross section
# Transient
TransientRCS=Large                         // Transient visibility on radar
TransientVisualIdentificationRange=15      // in nautical miles
TransientBaseNoise=220                     // in dB

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=100000                                
ImpactSize=VeryLarge                       // can be Small, Medium, Large, VeryLarge
Penetration=Always                         // can be Minor, Moderate, Heavy, Always

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
LandAttackGuidanceType=0
MidCourseCorrection=0                      // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink
InertialGuidance=True
;TargetRequired=True
;Retargetable=False
;RequiresLOS=False
;TerrainFollowFlight=False
;SupportsBanking=False
;PerformsSlightBallisticInitialFlight=False
InitialFlightPhaseDuration=40               // Seconds of initial straight flight; AC Pack replaces this launch phase
#======================================== Flight Profile ===========================================================
#flight phase 1: loft------------------------------------------------------------------------------------------------
MaxLoftAngle=90                            // Maximum climb angle for the native loft profile
MaxLoftAlt=1500000                         // in feet. Requested loft altitude; not a hard height limiter
#flight phase 2: sea skimming----------------------------------------------------------------------------------------
# No sea-skimming segment for this flight profile.
#flight phase 3: final flight phase----------------------------------------------------------------------------------
#flight phase 4: terminal approach----------------------------------------------------------------------------------
TerminalApproachDist=0.1                   // in nautical miles
IgnoreHeightDifferenceForTargetDist=True
#=========================================  Kinematics  ============================================================
# Native propulsion has two acceleration intervals; AC Pack provides three visible motor burns.
# Older releases ignore BallisticLoft and OptimizeLoftAlt and use their native loft planner.
ApplyKinematics=True
MaxVelocity=15667                          // in knots. Reference speed; not a hard cap with full kinematics
MaxTurnRate=8                              // Maximum turn rate in degrees per second
MaxTurnG=5000                              // Maximum G-limit of missile turns
LaunchTurnRate=1                           // Initial turn rate in degrees per second
AccelerationTime=65                        // Initial booster burn time in seconds
Acceleration=2.8                           // Initial burn acceleration in G
SustainerAccelerationTime=115              // Later burn time in seconds; native engine has two acceleration intervals
SustainerAcceleration=4.0                  // Later burn acceleration in G
TypicalTargetAlt=0                         // in feet; 0 for a surface target
TypicalFiringAlt=0                         // in feet; 0 for a surface launch
TypicalLaunchVelocity=0                    // in knots
DragCoefficient=0.15                       // 0 = no drag, 1 = default drag, -1 = derive from maximum range
MaxFlightTime=2400                         // Maximum flight duration in seconds
LiftFactor=0.0001                          // High-altitude / low-speed induced drag factor
OptimizeLoftAlt=False                      // Use the configured loft altitude, matching the native ballistic template
BallisticLoft=True                         // Ballistic loft curve where supported by the game version
TimeLimited=True                           // Apply the maximum flight duration
TerminalLoft=True                          // Continue the loft profile toward the target
#========================================= Launch stats ============================================================
MinLaunchRange=300                         // Minimum launch range in nautical miles; gameplay limit
MaxLaunchRange=4000                        // Maximum launch range in nautical miles
LaunchReliability=98                       // 0..100; lower values increase misfire risk
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=150        // Game dispersion against land installations
#SelfDestruct
SelfDestructDelay=2400                     // in seconds

[---------- Mesh definitions----------]
[Models]
# Internal Resources folder related
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_ugm-133a_stage1
ResourcesMaterialFolder=assets/europack/materials/UGM-133A Trident II D5/
ResourcesMaterial=ugm-133a_mat.ini
ResourcesMeshForLaunch=eu_launch_ugm-133a
ResourcesMeshCanister=eu_launch_ugm-133a
ResourcesMeshSwitchTime=0                  // Seconds after launch to switch from launch mesh to main mesh
NumberOfSubModels=0
############################################################

[---------- Effects ----------]
# Effect paths reference emitters; EffectClass names are resolved through effects/effects.ini.
# Native fallback. AC Pack replaces motor effects with stage-specific emitters.
[Particles]
BoosterEffect=effects/weapons/emitters/s-300_effect
BoosterEffectPosition=0,0,-0.119161
InFlightEffect=
InFlightEffectClass=
SustainerEffect=effects/weapons/emitters/s-300_effect
SustainerEffectPosition=0,0,-0.119161
UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.119161
HitDefaultExplosion=effects/explosions/emitters/ballistic_missile_hit
HitShipExplosion=effects/explosions/emitters/ballistic_missile_hit
HitGroundExplosion=effects/explosions/emitters/ballistic_missile_hit
HitAirExplosionClass=LargeMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.021178
Rotation=0,0,0
Scale=0.030714,0.030714,0.195967           // Full launch-body bounds; collider does not follow visual stage changes
