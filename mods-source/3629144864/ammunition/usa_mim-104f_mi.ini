# MIM-104F Patriot PAC-3

[General]
Type=Missile                                                            // can be Projectile, Missile, Torpedo
TargetType=AAW                                                          // can be AAW, ASuW, ASW

Mass=312                                                                // in kg. Used for aircraft
AmmoPoints=4500                                                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

IOCDate=2001                                                            // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

FOCDate=2002                                                            // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

DecalClass=SAMImpacts                                                   // referenced in effects/decals.ini

FrontalArea=0.051
SideArea=1.326
AirLaunched=False                                                       // For Encyclopedia. Displays launch altitudes

[SensorData]
#Visual
VisualIdentificationRange=4                                             // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Transient
TransientRCS=Small                                                      // Transient visibility on the radar
TransientVisualIdentificationRange=15                                   // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                                                  // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=1
Power=5
ImpactSize=Medium                                                       // Impact size, can be small, medium, large, verylarge
Penetration=Heavy                                                       // can be minor, moderate, heavy, always
FuzeProximityDistance=2                                                 // for proximity fuze: distance to target in meters. Also indicates that Fuze Type = Proximity Fuze
InterceptSpeedPenaltyMultiplier=0.75                                    // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
InterceptOutOfAltitudePenalty=0.15                                      // base value used for out-of-altitude calculations, 0.20 is excellent, 0.30 is good, 0.40 is average, 0.50 is poor
InterceptSizePenaltyMultiplier=0.10                                     // multiplier to the size penalty, 1.0 is default
KillProbability=0.9                                                     // Base chance to hit

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=1                                                   // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
InitialFlightPhaseDuration=0.5                                          // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=False                              // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
Retargetable=True

#======================================== Flight Profile ===========================================================
MaxLoftAngle=45                                                         // Climb angle for initial loft
MaxLoftAlt=55000                                                        // in feet. Maximum altitude for lofting
MaxLoftVelocity=3200                                                    // Maximum speed in knots for lofting
OptimizeLoftAlt=True
BallisticLoft=False
LoftToSkim=True
TerminalApproachDist=3                                                  // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
IgnoreHeightDifferenceForTargetDist=False                               // useful for hight loft alt missiles to ignore the height for distance calculation
LocalTerminalOnly=False                                                 // if true connection with a guiding radar will be severed upon entering terminal approach stage

#=========================================  Kinematics  ============================================================
ApplyKinematics=True                                                    // If we should use full kinematics rules. If this is true, we will only use kinematics
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=3200                                                        // Maximum speed in knots
MaxTurnRate=45                                                          // Maximum turnrate in degrees per second
MaxTurnG=30                                                             // Maximum G-limit of missile turns
LaunchTurnRate=120                                                      // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=4                                                      // Burn time for initial booster burn
Acceleration=25                                                         // Gs of acceleration in initial burn
SustainerAccelerationTime=4                                             // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=14                                                // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=30000                                                  // Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=0                                                    // Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=0                                                      // Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0                                                 // Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=2.1                                                     // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.5                                                       // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=120                                                       // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TerminalLoft=False
TimeLimited=True
LiftFactor=0.005                                                        // default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude

#========================================= Launch stats ============================================================
MinLaunchRange=0.7                                                      // Minimum launch range in nautical miles
MaxLaunchRange=43.2                                                     // Maximum launch range in nautical miles
MinAttackAltitude=100                                                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=80000                                                 // Maximum altitude of target, in feet
MaxAttackVelocity=3800                                                  // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=98                                                    // The lower the value, the greater risk of misfire or accident (0...100)
AutoAttackOutsideAltitudes=False                                        // This weapon will not be auto launched if target is outside altitude brackets

#========================================     Seeker     ===========================================================
SeekerGain=65.0                                                         // Seeker gain in dB
SeekerFOV=60.0                                                          // Seeker field-of-view in degrees
SeekerGimbalFOV=120.0                                                   // Seeker gimbal FOV in degrees
SeekerActiveRange=10                                                    // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
Frequency=Ka-Band                                                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=6.0                                                           // Active radar seeker output peak power in kW
TargetMemory=True                                                       // Always locks on preselected target unless spoofed or jammed

#Misc Guidance Properties
RangeGate=2
SizeGate=1.1

#ECCM
AntiCountermeasuresBonus=0.55                                           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.50                                                    // This value substracted from probability of being jammed  (0...1)

#SelfDestruct
SelfDestructDelay=2.0                                                   // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_PAC-3_CRI
ResourcesMaterialFolder=assets/europack/materials/PAC-3_CRI/
ResourcesMaterial=PAC-3_CRI_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshCanister=
ResourcesMeshSwitchTime=0                                               // time in seconds after launch to switch from launch mesh to main mesh
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
BoosterEffectPosition=0,0,-0.038574
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.038574
InFlightEffectStartTime=0.1                                             // in seconds, after that the Inflight Effect will be played if available
SustainerEffect=effects/weapons/emitters/sam_medium_effect
SustainerEffectPosition=0,0,-0.038574
SustainerEffectStartTime=0.2
HitDefaultExplosionClass=SmallMissileExplosions
HitShipExplosionClass=SmallMissileExplosions
HitAirExplosionClass=SmallMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.000711
Rotation=0,0,0
Scale=0.005258,0.005258,0.075726
