#=========================================================================================================================================================
#                            ADC Mk 2 Mod 5 - Acoustic Device Countermeasure

#   Platform: USN submarines (ICL/Signal Ejector) | Era: ~2015 - present
#=========================================================================================================================================================
[General]
# USN ADC Mk 2 Mod 5 Noisemaker
Type=Noisemaker                       // can be Projectile, Missile, RBU, ASROC, Torpedo, Noisemaker
TargetType=ASW                        // can be AAW, ASuW, ASW

Mass=16                               // in kg. Used for aircraft
AmmoPoints=16                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard                   // referenced in effects/decals.ini

############################################################
# Sensor related characteristics
############################################################

[SensorData]
IRSignature=VeryTiny
# radar related (RCS => radar cross section)
RCS=Small
# sonar related
BaseNoise=200                   // base sound level in db at 1m distance
FlowNoise=0                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0               // additional noise for cavitation in db
TargetReflectionStrength=50     // reflection on active sonar

############################################################
# Noisemaker related characteristics
############################################################
[NoisemakerData]
SinkRate=0  //meters per seconds
LifeTime=360                    // in seconds

############################################################
# ECM System
############################################################
[ECM]
# Same device as Mod 4 - Sub launched version
SpoofChance=0.86                // Base chance to spoof torpedo

############################################################
# Colliders definition
############################################################

[Colliders]
// creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,-0.0051,0.0053
Rotation=0,0,0
Scale=0.01,0.01703,0.09293

############################################################
# Warhead Data
############################################################

[WarheadData]
//Warhead Types:
//-1 = No warhead
//0 = Blast Fragmentation
//1 = Armor Piercing
//2 = HEAT
//3 = Illumination
//4 = Cluster
//5 = Runway Cratering

WarheadType=-1

############################################################
# Models
############################################################

[Models]

############################################################
# AssetBundle related
############################################################

AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################

############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=weapons/usn_adc_mk1/
ResourcesRoot=usn_adc_mk1
ResourcesMesh=usn_adc_mk1
ResourcesMaterial=usn_adc_mk1_mat

NumberOfSubModels=1

SubModel1=Propeller

[Propeller]
Type=Propulsion
RotationDirection=Left
Mesh=usn_adc_mk1_prop
Rotation=-90,0,0

############################################################
# Wake and smoke
############################################################

[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/noisemaker_fx
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=5
HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosionClass=MediumMissileExplosions

############################################################
# Sounds
############################################################

[Sounds]
SoundMode=1
NoisemakerAudioClip=audio/weapons/Noisemaker
NoisemakerAudioPosition=0,0,0
NoisemakerAudioRollOff=Logarithmic
NoisemakerAudioDistance=1,20
NoisemakerAudioPitch=1.0
NoisemakerAudioVolume=1
NoisemakerAudioAudibility=Below