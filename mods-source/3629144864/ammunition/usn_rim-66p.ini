#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#Known problems:
#1) Due to insta-Terminal this missile does not have RC flight stage. Usure what altitude should be used for it. Also seeker range should be changed accordingly
#=========================================================================================================================================================
[General]
# SM-2 Block IIIC with thrust vectoring and ARH
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=ShoreTargetsOnly  // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=707                               // in kg. Used for aircraft
AmmoPoints=2500                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=35
ImpactSize=SemiSmall                        // Impact size, can be small, medium, large, verylarge
Penetration=heavy                      // can be minor, moderate, heavy, always

FuzeProximityDistance=23.0             // for proximity fuze: distance to target in yard
KillProbability=0.95                     //Chance to intercept missile
InterceptSpeedPenaltyMultiplier=0.70                  // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
InterceptOutOfAltitudePenalty=0.10                  // base value used for out-of-altitude calculations, 0.20 is excellent, 0.30 is good, 0.40 is average, 0.50 is poor
InterceptSizePenaltyMultiplier=0.40					// multiplier to the size penalty, 1.0 is default
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
;PerformsSlightBallisticInitialFlight=True  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
InitialFlightPhaseDuration=0.40         // time in seconds where the missile moves straight on without guiding
Retargetable=False
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=75.0                      // Climb angle for initial loft
MaxLoftAlt=100000.0                     // in feet. Maximum altitude for lofting

#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=13                 // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                        // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=2800.0                     // Maximum speed in knots
MaxTurnRate=37.0                       // Maximum turnrate in degrees per second
MaxTurnG=40                       // Maximum G-limit of missile turns
LaunchTurnRate=110                               // Maximum turnrate in degrees per second
AccelerationTime=4                  // Burn time for initial booster burn
Acceleration=17.3                      // Gs of acceleration in initial burn
SustainerAccelerationTime=40            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=1.95               // Acceleration of sustainer burn. -1 if there is no sustainer
#AEROJET Mk.104 Dual-Thrust Rocket Motor
#120kN - 4s Boost
#13kN - 40s Sustain
TypicalTargetAlt=15000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=1.5               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.8                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=185               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TerminalLoft=True
TimeLimited=True
LiftFactor=0.0025				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
#========================================= Launch stats ============================================================
MinLaunchRange=0.5                    // Minimum launch range in nautical miles
MaxLaunchRange=110.0                    // Maximum launch range in nautical miles
MinAttackAltitude=15                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=100000                // Maximum altitude of target, in feet
MaxAttackVelocity=2500				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
;AutoAttackOutsideAltitudes=False
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=68.0                        // Seeker gain in dB
SeekerFOV=60.0                          // Seeker field-of-view in degrees
SeekerGimbalFOV=120                     // Seeker gimbal FOV in degrees
SeekerActiveRange=14.0                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=8.0                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.50           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.55                   // This value substracted from probability of being jammed  (0...1)
#SelfDestruct
SelfDestructDelay=2.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_SM-2P
ResourcesMaterialFolder=assets/europack/materials/RIM-174_ERAM/
ResourcesMaterial=RIM-174A_mat.ini
#ResourcesMeshForLaunch=launch
#ResourcesMeshCanister=launch
; ResourcesMeshSwitchTime=0.25  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
[---------- Launchers ----------]
# References to the launchers are just used for positioning relative to the launcher of the missile
[Launchers]
NumberOfLaunchers=3
Launcher1=MK13
Launcher2=MK22
Launcher3=MK26

[MK13]
LoadedPosition=0,0,0.009
UnloadedPosition=0,0,-0.086
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[MK22]
LoadedPosition=0,0,0.006
UnloadedPosition=0,0,-0.086
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[MK26]
LoadedPosition=0,0,0.006
UnloadedPosition=0,0,-0.086
LoadedRotation=0,0,0
UnloadedRotation=0,0,0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.035
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.035
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/sam_medium_effect //missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.035
SustainerEffectStartTime=4.0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07