#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================

[General]
# 40N6 - S-400 Triumf
Type=Missile                          // can be Projectile, Missile, Torpedo
TargetType=AAW                        // can be AAW, ASuW, ASW

Mass=1893                             // in kg. Used for aircraft
AmmoPoints=7572                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
IOCDate=2018                          // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=                              // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.2
MinCameraDistanceBroadside=0.2
CameraPivotHeight=0

DecalClass=SAMImpacts                 // referenced in effects/decals.ini

FrontalArea=0.217
SideArea=3.23
BottomArea=3.24

[SensorData]
#Visual
VisualIdentificationRange=4           // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=15 // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=45
ImpactSize=Medium                     // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                  // can be minor, moderate, heavy, always

FuzeProximityDistance=25              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.9                   // Base chance to hit
InterceptSpeedPenaltyMultiplier=0.85  // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
InterceptOutOfAltitudePenalty=0.3     // base value used for out-of-altitude calculations, 0.20 is excellent, 0.30 is good, 0.40 is average, 0.50 is poor
InterceptSizePenaltyMultiplier=0.7    // multiplier to the size penalty, 1.0 is default

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=3                 // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
InitialFlightPhaseDuration=0.8        // time in seconds where the missile moves straight on without guiding
Retargetable=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAlt=98425                      // in feet. Maximum altitude for lofting
MaxLoftVelocity=4860                  // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=14               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=True                // if true connection with a guiding radar will be severed upon entering terminal approach stage
SupportsBanking=False                 // if the missile will bank when turning
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                  // If we should use full kinematics rules. If this is true, we will only use kinematics
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=4860                      // Maximum speed in knots
MaxTurnRate=20                        // Maximum turnrate in degrees per second
MaxTurnG=25                           // Maximum G-limit of missile turns
LaunchTurnRate=120                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=1.0                  // Burn time for initial booster burn
Acceleration=10                      // Gs of acceleration in initial burn
SustainerAccelerationTime=20          // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=15.5              // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=32808                // Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=0                  // Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=0                    // Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0               // Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=2.6                    // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
MaxFlightTime=420                     // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
LiftFactor=0.0015                     // default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
TimeLimited=True
TerminalLoft=True
#========================================= Launch stats ============================================================
MinLaunchRange=2.7                    // Minimum launch range in nautical miles
MaxLaunchRange=216                    // Maximum launch range in nautical miles
MinAttackAltitude=33                  // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=98425               // Maximum altitude of target, in feet
MaxAttackVelocity=9330                // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=0.98                // Chance that engine will start when launching from aircraft
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=60                         // Seeker gain in dB
SeekerFOV=60                          // Seeker field-of-view in degrees
SeekerGimbalFOV=120                   // Seeker gimbal FOV in degrees
SeekerActiveRange=16                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=0                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                      // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=5                           // Active radar seeker output peak power in kW
TargetMemory=True                     // Always locks on preselected target unless spoofed or jammed
#Misc Guidance Properties
SizeGate=1.1                          //
RangeGate=2                           //
#ECCM
AntiCountermeasuresBonus=0.70          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.65                  // This value substracted from probability of being jammed  (0...1)
#SelfDestruct
SelfDestructDelay=2                   // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj,CORRECT_OBJ_ORIENTATION
ResourcesMesh=eu_missile_sa-n-21b
ResourcesMaterialFolder=assets/europack/materials/SA-N-20/
ResourcesMaterial=SA-N-20_Blue_Tip_mat.ini
ResourcesMeshForLaunch=
ResourcesMeshSwitchTime=0.5           // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/s-300_effect
BoosterEffectPosition=0,0,-0.045579
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.045579
InFlightEffectStartTime=1.5           // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_large_effect
SustainerEffectPosition=0,0,-0.045579
SustainerEffectStartTime=5

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.008624
Rotation=0,0,0
Scale=0.01093,0.01093,0.10862
