[General]
#RIM-116A RAM Block 0
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW

Mass=74                                // in kg. Used for aircraft
AmmoPoints=126                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=2  // at what range in nm this unit can be visually identified
IRSignature=Tiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=11.3
ImpactSize=Small                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

FuzeProximityDistance=8.0             // for proximity fuze: distance to target in yard
KillProbability=0.70                     //Chance to intercept missile
InterceptOutOfAltitudePenalty=0.5
InterceptSpeedPenaltyMultiplier=0.70
InterceptSizePenaltyMultiplier=0.60					// multiplier to the size penalty, 1.0 is default
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.4         // time in seconds where the missile moves straight on without guiding
;SaturationValue=2
TargetRequired=False
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=25.0                           // Climb angle for initial loft
MaxLoftAlt=5000.0                          // in feet. Maximum altitude for lofting
MaxLoftVelocity=1350.0                      // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
SupportsBanking=False                  // if the missile will bank when turning
AxialRotation=720                      // In degrees per second. Doesnt work when "SupportsBanking" is true
TerminalApproachDist=3              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                        // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=1350.0                          // Maximum speed in knots
MaxTurnRate=25.0                        // Maximum turnrate in degrees per second
MaxTurnG=35                             // Maximum G-limit of missile turns
LaunchTurnRate=40                           // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=5.5                        // Burn time for initial booster burn
Acceleration=14.5                           // Gs of acceleration in initial burn
SustainerAccelerationTime=4.5            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=4.8               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=20					    // Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0		           		    // Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0		       		      // Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=7.5  //1.9                           // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.65                          // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=30                           // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MinLaunchRange=0.2                     // Minimum launch range in nautical miles
MaxLaunchRange=5.0                     // Maximum launch range in nautical miles
MinAttackAltitude=0                    // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=30000                // Maximum altitude of target, in feet
MaxAttackVelocity=1600				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#AutoAttackOutsideAltitudes=False
#========================================     Seeker     ===========================================================
#Homing
IsRearAspectOnly=False                 //Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=120                     //Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=15                          // Seeker field-of-view in degrees
SeekerGimbalFOV=90                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=1.5                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#ECCM
SecondaryPassiveRadarGuidanceType=Full  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All     //Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.25           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.25                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=8.0                  // delay in seconds for self destruction 

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_RIM-116_Blk1
ResourcesMaterialFolder=assets/europack/materials/RIM-116/
ResourcesMaterial=RIM-116_mat.ini

NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_small_effect
BoosterEffectPosition=0,0,-0.020306

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.015
InFlightEffectStartTime=0.5  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/aam_small_effect //missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.015
SustainerEffectStartTime=0.2

HitDefaultExplosionClass=SmallMissileExplosions
HitShipExplosionClass=SmallShipHitExplosion
HitAirExplosionClass=SmallMissileExplosions

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043
