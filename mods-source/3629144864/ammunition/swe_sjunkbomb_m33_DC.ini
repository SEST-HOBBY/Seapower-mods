#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# depth charge
Type=RBU                               // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW

Mass=120                               // in kg. Used for aircraft
AmmoPoints=140                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.3
MinCameraDistanceForeAft=0.15
MinCameraDistanceBroadside=0.15
CameraPivotHeight=0.0

DecalClass=DepthChargeImpacts  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
BaseNoise=100                           // base sound level in db at 1m distance
FlowNoise=1                             // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=1                       // additional noise for cavitation in db
TargetReflectionStrength=14             // in dB for broad side
# Transient
TransientRCS=-1                         // Transient visibility on the radar
TransientVisualIdentificationRange=5    // Transient can be visually detected at this distance in nmi
TransientBaseNoise=190                  // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=100
ImpactSize=Medium                        // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                      // can be minor, moderate, heavy, always

FuzeProximityDistance=3.0              // for proximity fuze: distance to target in meters
SmartFuse=True                  // Explodes not immediately but when when target start to go away
KillProbability=0.1                     //Chance to intercept torpedo

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1.0         // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
SinkRate=2.5                          // sink rate in m/s (for depth charges)
MaxDepth=1300                           // max depth in feet (for depth charges)
#========================================= Launch stats ============================================================
MaxVelocity=15                        // Maximum speed in knots
Acceleration=3                        // Acceleration factor
MaxTurnRate=2.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.01                     // Minimum launch range in nautical miles
MaxLaunchRange=0.09                     // Maximum launch range in nautical miles

LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)

#WobblingStrength=2.2                  // amplitude of wobbling
#WobblingSpeed=1.0                      // frequency of wobbling
#========================================     Seeker     ===========================================================
CircularErrorRadius=15.0                // Circular error radius in meter
#Homing
#ECCM
# Torpedo related
#SelfDestruct
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_depthcharge_slunkbomb_m33
ResourcesMaterialFolder=assets/europack/materials/Slunkbomb_m33/
ResourcesMaterial=Slunkbomb_m33_mat.ini
############################################################
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=None
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/dc_sinking_particle
InFlightEffectPosition=0,0,0
InFlightEffectStartTime=0

HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

############################################################
# Sounds
############################################################
#Not needed here

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.008,0.005,0.005