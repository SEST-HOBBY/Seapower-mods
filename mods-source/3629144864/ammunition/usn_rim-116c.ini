#!alias ammunition/usn_rim-116a.ini

#RIM-116C RAM Block II

[General]
SecondaryTargetType=ASuW

Mass=88                                // in kg. Used for aircraft
AmmoPoints=150                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

[SensorData]
IRSignature=VerySmall

[---------- Warhead Data ----------]
[WarheadData]
FuzeProximityDistance=8.0             // for proximity fuze: distance to target in yard
KillProbability=0.80                     //Chance to intercept missile
InterceptOutOfAltitudePenalty=0.2
InterceptSpeedPenaltyMultiplier=0.70
InterceptSizePenaltyMultiplier=0.50					// multiplier to the size penalty, 1.0 is default

[---------- Guidance ----------]
[Guidance]
InitialFlightPhaseDuration=0.3         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=35.0                           // Climb angle for initial loft
MaxLoftVelocity=1650.0                      // Maximum speed in knots for lofting
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#=========================================  Kinematics  ============================================================
MaxVelocity=1650.0                          // Maximum speed in knots
MaxTurnRate=35.0                        // Maximum turnrate in degrees per second
MaxTurnG=55                             // Maximum G-limit of missile turns
LaunchTurnRate=50                           // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=5.0                        // Burn time for initial booster burn
Acceleration=17.6                           // Gs of acceleration in initial burn
SustainerAccelerationTime=6.5            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=4.2               // Acceleration of sustainer burn. -1 if there is no sustainer
DragCoefficient=4.5  //1.9                           // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
TypicalTargetAlt=1000					    // Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TerminalLoft=True
TimeLimited=True
MaxFlightTime=45                           // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MaxLaunchRange=7.5                     // Maximum launch range in nautical miles
MaxAttackAltitude=50000                // Maximum altitude of target, in feet
MaxAttackVelocity=1800				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
SeekerPassiveRange=10                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#ECCM
AntiCountermeasuresBonus=0.40           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.35                   // This value substracted from probability of being jammed  (0...1)

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/europack/models/
ResourcesRoot=weapons.obj
ResourcesMesh=eu_missile_RIM-116_Blk2
#ResourcesMeshForLaunch=eu_missile_RIM-116_Blk2
ResourcesMaterialFolder=assets/europack/materials/RIM-116/
ResourcesMaterial=RIM-116E_mat.ini

NumberOfSubModels=0
[---------- Effects ----------]
[Particles]
BoosterEffect=effects/weapons/emitters/aam_effect
BoosterEffectPosition=0,0,-0.015  //-0.020306

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.015
InFlightEffectStartTime=0.5  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/aam_effect //missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.015
SustainerEffectStartTime=1