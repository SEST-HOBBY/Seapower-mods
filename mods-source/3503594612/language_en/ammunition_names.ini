su_as-18a_LQS=Kh-59M,,ASM,Tactical Missiles Corporation Kh-59M (AS-18 Kazoo) It is a Russian subsonic air-to-surface/ship missile. Compared with the Kh-59, the M type has a longer range and a higher speed.
#-----------Land Strike only missiles---------
su_as-14_LQS=Kh-29T,,AGM,Vympel Kh-29T（AS-14 Kedge）It is a Soviet television-guided supersonic air-to-ground missile with great power that can be used to destroy ships not exceeding 10,000 tons.
# ---------- Anti-sub  Missilies ----------
wp_as-11a_LQS=Kh-58a,,Anti-surface, active radar-guided anti-ship missile.
su_as-20_LQS=Kh-35,,ASM,Zvezda Kh-35 (AS-20 Kayak) It is a Russian subsonic anti-ship missile. Because its appearance and performance are similar to those of the American Harpoon missile, it is nicknamed "Harpoonski". It is designed to attack ships under 5,000 tons.
su_kh-35_LQS=Kh-35,,AGM,Zvezda Kh-35 (AS-20 Kayak) It is a Russian subsonic anti-ship missile. Because its appearance and performance are similar to those of the American Harpoon missile, it is nicknamed "Harpoonski". It is designed to attack ships under 5,000 tons.It can also be used to attack ground targets.
