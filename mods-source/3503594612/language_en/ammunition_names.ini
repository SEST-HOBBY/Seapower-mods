[AmmunitionNames]
# ------------------ AAM ------------------
su_aa-11_LQS=R-73,,AAM,The Vympel R-73 (AA-11 Archer) is an infrared AAM missile developed by the Soviet Union in the 1970s and 1980s. The R-73 pioneered the use of a vector engine, giving the missile far greater maneuverability than its contemporary missiles. It is considered one of the most threatening AAM missiles.

su_aa-12_1_LQS=R-77-1,,AAM,The Vympel R-77-1（AA-12 Adder）It is Russias active radar-guided medium-range air-to-air missile, an improvement on the R-77 with a longer range.

su_aa-12_pd_LQS=R-77-PD,,AAM,The Vympel R-77-PD（AA-12 Adder）It is Russias active radar-guided long-range air-to-air missile, using a ramjet engine, and its range has been greatly increased compared to the previous model.

su_aa-12_m_LQS=R-77M,,AAM,The Vympel R-77M（AA-12 Adder）It is Russia's active radar-guided long-range air-to-air missile,This missile employs a more powerful active phased array seeker and a dual-pulse engine, resulting in a significant performance improvement.

su_aa-13_LQS=R-37M,,AAM,The Vympel R-37M（AA-13 Axehead）It is Russias active radar-guided ultra-long-range air-to-air missile with high speed and long range, and is used to perform interception missions.

