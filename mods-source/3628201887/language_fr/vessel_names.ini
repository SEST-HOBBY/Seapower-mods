[fra_cv_clemenceau_bra]
Type=CV,Porte avions
Default=Classe Clemenceau (Brésil),Clemenceau
DefaultDescription=Les porte-avions de classe Clemenceau furent les premiers projets de la Marine française d'après-guerre à se concrétiser en deux porte-avions, le Clemenceau et le Foch, qui constituèrent l'épine dorsale de la flotte française de 1961 à 2000. Le Clemenceau fut vendu au Brésil en 2000 et servit jusqu'en 2017 sous le nom de São Paulo, avant que des coûts de maintenance exorbitants, dus à son âge, n'entraînent son retrait du service. Il fut sabordé dans l'océan Atlantique en 2023.
Variant1=NAe São Paulo A12,São Paulo

