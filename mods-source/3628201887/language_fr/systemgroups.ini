#---------------------------------------- Aircraft Radars ----------------------------------------

#---------------------------------------- Radars ----------------------------------------
DRBV-20=DRBV-20A|Le DRBV-20 (Détection Radioélectrique emBarquée de Veille) était un radar de surveillance aérienne à longue portée fonctionnant en bande VHF. Il fut mis en service en 1949 sur les croiseurs antiaériens Colbert et De Grasse de la Marine Nationale. Ce radar resta opérationnel jusqu'au milieu des années 1980.
DRBV-23B=DRBV-23B|Le radar Thomson "Jupiter", ou DRBV-23 / THD-1077 est un dérivé des dernières versions du DRBV-22. Son antenne elliptique stabilisée est équipée d'un émetteur en bande L (D) de puissance supérieure, lui conférant une portée de 300 km.
DRBV-15A=DRBV-15A|Le Sea Tiger (désigné DRBV-15 dans la Marine nationale française et TRS 3004 par son ancien constructeur, Thomson-CSF) est un radar de surveillance aérienne et de surface en bande S, doté d'un système de désignation de cibles. Conçu pour les navires de moyen et grand gabarit, il peut être intégré à des systèmes d'armes. Sa livraison s'est étalée de 1987 à 1999.
DRBV-50=DRBV-50|Le DRBV-50 était un radar maritime de recherche de surface fonctionnant en bande G, qui pouvait également être utilisé contre des cibles aériennes volant à basse altitude. Avec ses dérivés, il était installé sur les porte-avions français Clemenceau et Foch, le porte-hélicoptère Jeanne d’Arc, les escorteurs d'escadre T47 et les croiseurs Colbert et La Galissonnière. Il utilisait ce que l’on appelle une "antenne fromage". Le DRBV-50 fut ensuite remplacé par le radar de recherche DRBV-15A.
DRBI-10=DRBI-10|Le DRBI-10 (DRBI: détection radioélectrique embarquée multifonction) était un radioaltimètre fonctionnant en bande S et équipé d’un scanner Robinson. Les deux porte-avions français de la classe Clemenceau utilisaient chacun deux de ces radars, un pour chaque direction d’approche.

#---------------------------------------- FCRs ----------------------------------------
DRBC-32B=DRBC-32|Le DRBC-32, ou "Castor 2", est une famille de radars de contrôle de tir fonctionnant dans la bande de fréquences X, dont il existe au moins six variantes, désignées par les suffixes A à E et J. Toutes les variantes sont compactes dans une construction légère qui peut être installée aussi bien sur les petits que sur les grands navires. 
DRBC-32C=DRBC-32|Le DRBC-32, ou "Castor 2", est une famille de radars de contrôle de tir fonctionnant dans la bande de fréquences X, dont il existe au moins six variantes, désignées par les suffixes A à E et J. Toutes les variantes sont compactes dans une construction légère qui peut être installée aussi bien sur les petits que sur les grands navires. 

