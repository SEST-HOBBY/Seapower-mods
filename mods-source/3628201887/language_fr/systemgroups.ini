#======================================== France ========================================
#---------------------------------------- Naval Guns ----------------------------------------
GIAT100mm=Canon de 100mm DCN/GIAT|Canon Naval DCN/GIAT 100mm/55|Le canon naval GIAT de 100 mm est une arme automatique à double usage (anti-aérien et anti-surface) de conception française, réputée pour sa cadence de tir élevée. C'est une pièce d'artillerie polyvalente que l'on retrouve sur de nombreux navires de guerre français modernes. Le canon possède un tube de calibre 55 et sa portée maximale est généralement d'environ 17 km, avec une portée pratique de 12 km contre des cibles de surface et de 8 km contre des cibles aériennes.
CrotaleEDIR=Crotale|Crotale EDIR|Le Crotale EDIR (Écartométrie Différentielle InfraRouge) est un missile antiaérien de courte portée, utilisable par tous temps, capable d'intercepter des missiles antinavires et des aéronefs volant à basse altitude. Développé par Thomson CSF, il existe en deux versions : une version mobile terrestre et une version navale.

