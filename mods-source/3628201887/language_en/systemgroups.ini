#---------------------------------------- Aircraft Radars ----------------------------------------

#---------------------------------------- Radars ----------------------------------------
DRBV-20=DRBV-20A|DRBV-20 (Détection Radioélectrique emBarquée de Veille) was a long range air surveillance radar operating in the VHF band. Its first fitting took place in 1949 on the Colbert and De Grasse anti-aircraft cruisers of the French Navy. The radar remained in operation until the mid-1980s.
DRBV-23B=DRBV-23B|The Thomson DRBV-23 / THD-1077, or "Jupiter" radar is derived from the latest versions of the DRBV-22. Its elliptical and stabilized antenna is equipped with a higher power L (D) band transmitter, which gives a range of 300km.
DRBV-15A=DRBV-15A|The Sea Tiger (in French naval service designated DRBV-15, and TRS 3004 by its former manufacturer Thomson-CSF) is an air and surface surveillance and target designation radar operating in the S band. The system is designed for medium to large ships and can be integrated with weapons systems. Years of delivery were 1987 to 1999.
DRBV-50=DRBV-50|The DRBV-50 was a combined air and surface search radar operating in the G band. The radar and its derivatives were mounted on French aircraft carriers Clemenceau and Foch, the Jeanne d’Arc helicopter carrier, the T47-class ASW destroyers and cruisers Colbert and La Galissonnière. This radar used what was called a "cheese antenna" due to its distinctive shape. The DRBV-50 was later replaced by the DRBV-15A search radar.
DRBI-10=DRBI-10|DRBI-10 (DRBI: détection radioélectrique embarquée multifonction) was a height finding radar operating in the S band using a Robinson scanner. The French Clemenceau-class aircraft carrier used two of these radars, one for each approach direction.

#---------------------------------------- FCRs ----------------------------------------
DRBC-32B=DRBC-32|The DRBC-32, or "Castor 2", is a fire-control radar family operating in the X band, of which there are at least six variants (denoted by suffix letters running from A to E, and J). All versions are compact, lightweight, and suitable for installation on both small and large vessels.
DRBC-32C=DRBC-32|The DRBC-32, or "Castor 2", is a fire-control radar family operating in the X band, of which there are at least six variants (denoted by suffix letters running from A to E, and J). All versions are compact, lightweight, and suitable for installation on both small and large vessels.

