#======================================== France ========================================
#---------------------------------------- Naval Guns ----------------------------------------
GIAT100mm=DCN/GIAT 100mm Gun|100mm/5 caliber DCN/GIAT Naval Gun|The GIAT 100mm naval gun is a French-designed, dual-purpose (anti-air and anti-surface) automatic weapon known for its high rate of fire. Its a versatile artillery piece found on many modern French warships. The gun has a 55-caliber (L/55) barrel, and its maximum range is typically around 17km, with a practical range of 12km against surface targets and 8km against aerial targets.
CrotaleEDIR=Crotale|Crotale EDIR SAM|The Crotale EDIR (Ecartométrie Différentielle InfraRouge, "InfraRed Differential Ecartometry") is an all-weather short-range anti-air missile, which can be used to intercept low-flight anti-ship missiles and aircraft. It has been developed by Thomson CSF and exists in two versions, a mobile land-based version and a ship-launched one.

