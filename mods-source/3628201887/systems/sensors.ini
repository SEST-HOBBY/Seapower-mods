[ARBB-33] #ARBB 33 ECM
#Users: suffren + Clemenceau
Kind=ECM
Frequencies=C-Band,X-Band,Ku-Band //radar frequency bands the ECM suite can jam
Type=Universal                         // can be Defensive, Offensive, Universal

PeakPower=150.0                       // output peak power in kW, more power increase effectivness of offensive ECM jammers
MaxRange=100.0                         // max range in km
Gain=15.0                              // Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=30.0                   // For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChannels=2
JamChance=0.3                         // For Defensive and Universal jammers. Base chance to jam the attacking weapon
ModuleType=SmallSensor
CoverRange=20      