[SpawnMissile]
UseLauncherPositionOffsets=True  // optional, if true means that it uses the launcher position offsets from the ammunition file in section [Launchers]
Spawn=True
NumberOfSteps=1
Time1=2115
PositionZ1=0

[MoveMissileDown]
UseReverseLauncherPositionOffsets=True  // optional, if true means that it uses the reverse launcher position offsets from the ammunition file in section [Launchers]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionZ1=0           // can be 0 here as we use the missile specific positions from the ammunition file from section [Launchers]
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1                // time in seconds - here for the end
PositionZ2=0           // can be 0 here as we use the missile specific positions from the ammunition file from section [Launchers]
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as its the last entry

[Crew_Reloading]
NumberOfSteps=3
Step1=5|x,0,z|x,y,z|Linear #Start reloading

Step2=2105|x,0,z|x,y,z|Linear #Finish Reloading
Step3=2105|x,-10,z|x,y,z|Linear 


[Crotale_Main_Turret_Rotation]
NumberOfSteps=6
Step1=0|x,y,z|x,0,z|EaseInOut  #Rotate to +15
Step2=5|x,y,z|x,15,z|EaseInOut 

Step3=1035|x,y,z|x,15,z|EaseInOut  #Rotate to -15 
Step4=1045|x,y,z|x,-15,z|EaseInOut 

Step5=2110|x,y,z|x,-15,z|EaseInOut # Finish reloading
Step6=2115|x,y,z|x,0,z|EaseInOut 

[Crotale_Arms_Rotation]
NumberOfSteps=4
Step1=0|x,y,z|0,y,z|EaseInOut  #Start reloading
Step2=5|x,y,z|-15,y,z|EaseInOut 

Step3=2110|x,y,z|-15,y,z|EaseInOut #Finish reloading
Step4=2115|x,y,z|0,y,z|EaseInOut 


