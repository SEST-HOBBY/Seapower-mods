[h2]📖 About[/h2]
The [b]Clemenceau-class[/b] aircraft carriers — [i]Clemenceau[/i] and [i]Foch[/i] — formed the backbone of French naval aviation throughout the Cold War and into the post–Cold War era.
Designed to operate a wide variety of fixed-wing aircraft and helicopters, these carriers evolved continuously over four decades as naval aviation technology and doctrine advanced.

This mod recreates both ships across multiple service eras, allowing players to experience carrier operations as they existed in the 1960s, 70s, 80s and 90s.

[img]https://i.imgur.com/FyyP37i.png[/img]

[hr][/hr]

[h2]🚀 Features[/h2]
[list]
[*] Fully modeled carriers: Clemenceau (R98) and Foch (R99)
[*] Decade-specific variants with historically accurate layouts
[*] Authentic deck markings, island details and equipment by era
[*] Deck parkings variants
[*] Era-accurate flight deck layouts and equipment
[*] CATOBAR configuration with steam catapults
[*] Supports fighters, strike aircraft, reconnaissance aircraft and helicopters
[/list]

[hr][/hr]

[h2]🛫 Air Wing Operations[/h2]
The Clemenceau-class was designed to operate a diverse and evolving air wing, including:
[list]
[*] Fleet air defense fighters
[*] Strike and attack aircraft
[*] Reconnaissance platforms
[*] Anti-submarine warfare aircraft
[*] Search and rescue and utility helicopters
[/list]

Each decade variant reflects changes in deck layout, operational procedures, and aircraft handling as naval aviation progressed.

[img]https://i.imgur.com/Hhz9tJ4.png[/img]

[hr][/hr]

[h2]⚓ Historical Context[/h2]
Commissioned in the early 1960s, Clemenceau and Foch marked France’s return to full-scale carrier aviation after World War II.
They served worldwide in NATO exercises, Mediterranean patrols, and overseas deployments, remaining operational until the late 1990s.

Their long service life and adaptability made them some of the most enduring non-U.S. aircraft carriers of the jet age.

