# ------------------ AAM ------------------

fr_mica-em=MICA-EM,,AAM, MICA-EM (Missile d’Interception, de Combat et d’Auto-défense) is a French all-weather medium- and short-range air-to-air missile with an active radar homing head (ARH). It was developed by MBDA France as a universal replacement for the outdated Super 530 and Magic II missiles. Adopted in 1996 and integrated into the Rafale, Mirage 2000, as well as export platforms (for example, *Su-30MKI*). It is characterized by high maneuverability (up to 50g), the ability to launch "on the forgotten" principle (fire-and-forget) and the function of intercepting targets in the rear hemisphere. Supports LOAL modes (target capture after launch) and adjustment through Link 16.

fr_mica-ir=MICA-IR,,AAM, MICA-IR is a French all-weather short- and medium-range air-to-air missile with a thermal imaging seeker (IR-homing). Developed by MBDA as part of the MICA (Missile d’Interception, de Combat et d’Auto-défense) family to replace the outdated Matra R550 Magic II missiles. It entered service in 1998 and remains in service due to its high maneuverability and resistance to jamming.

