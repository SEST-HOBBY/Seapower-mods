fr_asmp-a=ASMP-A,,ASMP（中程空对地导弹）是由法国MBDA公司制造的空射巡航导弹。在法国核战略中，它扮演着所谓的“前战略”威慑角色。其目的是在全面使用装备“凯旋”级弹道导弹潜艇的战略核武器之前，发出最终的“警告”。该导弹的研发工作由法国宇航公司（Aérospatiale）的导弹系统部门负责，该部门的资产现已并入MBDA公司。

