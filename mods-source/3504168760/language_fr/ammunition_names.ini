# ------------------ AAM ------------------

fr_meteor=Meteor,,BVRAAM,

fr_mica-em=MICA-EM,,AAM, MICA-EM (Missile d’Interception, de Combat et d’Auto-défense) est un missile air-air français tout temps à moyenne et courte portée, doté d'un autodirecteur radar actif (ARH), a été développé par MBDA France pour remplacer les missiles Super 530 et Magic II, désormais obsolètes. Adopté en 1996, il équipe les Rafale, Mirage 2000 et les plateformes d'exportation (par exemple, le Su-30MKI). Il se caractérise par une grande manœuvrabilité (jusqu'à 50 g), la possibilité de tir « on the forget » (tir et oubli) et l'interception de cibles situées dans l'hémisphère arrière. Il prend en charge les modes LOAL (acquisition de cible après lancement) et le pilotage via Link 16.

fr_mica-ir=MICA-IR,,AAM, Le MICA-IR est un missile air-air français tous temps à courte et moyenne portée, doté d'un autodirecteur infrarouge. Développé par MBDA au sein de la famille MICA (Missile d’Interception, de Combat et d’Autodéfense), il a été conçu pour remplacer les missiles Matra R550 Magic II, désormais obsolètes. Entré en service en 1998, il est toujours opérationnel grâce à sa grande manœuvrabilité et sa résistance au brouillage.


