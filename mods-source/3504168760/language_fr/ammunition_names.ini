# ---------- Anti-ship Missiles ----------
fr_am-39_Block2=AM39 B2,Exocet,ASM,L'AM39 Exocet B2 est un missile antinavire français à longue portée (tir hors de portée des défenses adverses). Il constitue une alternative prisée au Harpoon au sein de l'OTAN ainsi que dans plusieurs autres pays. L'AM39 est la variante lancée depuis un aéronef.
#-----------Land Strike only missiles---------

fr_sbu-38=SBU-38,Hammer,AASM,

fr_sbu-54=SBU-54,Hammer,AASM,

fr_sbu-64=SBU-64,Hammer,AASM,

fr_scalp-eg=SCALP-EG,Storm Shadow,AGM, Le Storm Shadow (SCALP-EG en français) est un missile de croisière aéroporté de haute précision développé conjointement par le Royaume-Uni et la France par MBDA. Il est conçu pour détruire des cibles stratégiques importantes et bien protégées à une portée allant jusqu'à 550 km (les versions d'exportation sont limitées à 250-300 km).

fr_asmp-a=ASMP-A,,ASMP,The Air-sol moyenne portée est un missile de croisière aéroporté français, fabriqué par MBDA France. Dans la doctrine nucléaire française, il remplit un rôle de dissuasion pré-stratégique. Il est conçu comme ultime tir de semonce avant l'emploi à grande échelle des armes nucléaires stratégiques équipant les sous-marins lanceurs d'engins balistiques de la classe Triomphant. Son développement a été mené par la division Systèmes de missiles d'Aérospatiale, dont les actifs font désormais partie de MBDA.

