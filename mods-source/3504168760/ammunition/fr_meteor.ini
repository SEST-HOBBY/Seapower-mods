#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Meteor
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
Mass=190                               // in kg. Used for aircraft
AmmoPoints=1150
DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // 目视识别范围at what range in nm this unit can be visually identified
IRSignature=VeryTiny   // 红外识别范围
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation     // 预制破片弹
#1 = Armor Piercing            // 穿甲弹
#2 = HEAT                           // 破甲弹
#3 = Illumination                 // 照明弹
#4 = Cluster                        // 集束炸弹
#5 = Runway Cratering        // 跑道破坏弹

[WarheadData]
WarheadType=0
Power=10
ImpactSize=Small                       // 影响大小Impact size, can be small, medium, large, verylarge
Penetration=Always                     // 穿深？can be minor, moderate, heavy, always

FuzeProximityDistance=15.0             // 近炸引信for proximity fuze: distance to target in yard
KillProbability=0.85                  // 爆炸概率Chance to intercept missile
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing  //红外
# 2 = Semi-Active Radar Homing  // 半主动雷达寻的
# 3 = Active Radar Homing  // 主动雷达寻的
# 4 = Anti-Radiation Homing  // 反辐射
# 5 = Laser-Homing  // 激光制导
# 6 = TV-Homing  // 电视制导
# 7 = Active Sonar Homing  // 主动声呐
# 8 = Passive Sonar Homing  // 被动声呐
# 9 = Wake Homing  // 尾流自导
[Guidance]
GuidanceType=3
#In reality a SARH correction is used at long range
MidCourseCorrection=1                 // 0 = None, 1 = Radio Command无线电指令, 2 = Wire Guided线导
DropDuration=1                       // 离架自由落体time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=2         // 离架直线运动time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=10                      // 爬升迎角 Climb angle for initial loft
MaxLoftAlt=50000                    // 爬升高度至
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=20                // 目标末端距离in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=True                 // 末端断开半主动寻的 if true connection with a guiding radar will be severed upon entering terminal approach stage
#========================================= Launch stats ============================================================
ApplyKinematics=True                   // 如果我们使用完整的运动学规则。如果这是真的，我们将只使用运动学
MaxVelocity=1600                       // Maximum speed in knots
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
AccelerationTime=1.5                 // 初始助推器燃烧的燃烧时间
Acceleration=30                    // 初始燃烧阶段的加速度Gs
SustainerAccelerationTime=40            // 持续燃烧时间。若无持续燃烧，则记为-1
SustainerAcceleration=0.8              // 持续燃烧加速。若无持续燃烧，则值为-1
#---- Total Δv ≈ / ≈ /

DragCoefficient=-1               // 阻力系数。0表示无阻力，1表示默认阻力，数值越大表示阻力越大。默认值为-1，此时我们会根据导弹的最大射程来计算阻力系数

MaxFlightTime=130               // 基于电池等因素，导弹完全失效前的运行时间作为硬限制。默认值：无限

MaxTurnRate=20.0                      //冲压进气道   // 扭转能力Maximum turnrate in degrees per second
MinLaunchRange=4                       // 最小射程Minimum launch range in nautical miles
MaxLaunchRange=108                    // 最大射程Maximum launch range in nautical miles
MinAttackAltitude=67                  // 最小目标高度Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackVelocity=1800				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=97                   // 发射成功率The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=46.0                        // 导引头增益Seeker gain in dB
SeekerFOV=60                           //angle of attack
SecondaryPassiveRadarGuidanceType=HomeOnJam  //次要被动雷达寻的
PassiveRadarGuidanceFrequencies=All    // 本导弹能够探测的频率Frequences Anti-Radiation and HomeOnJam weapons can detect
SeekerPassiveRange=21       // 导引头被动范围（海里）与红外制导、半主动雷达制导、反辐射制导、电视制导、被动声纳制导和被动声纳制导相关Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=21               // 导引头有效范围（海里）。适用于半主动雷达寻的、主动雷达寻的、激光寻的和主动声纳寻的Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       // 无线电指令波段 Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=10.0                          // 主动雷达功率Active radar seeker output peak power in kW
TargetMemory=True                      // 记忆目标Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.7          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.7                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=4.0                  // 断连后自爆时间delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/meteor/
ResourcesRoot=meteor.obj
ResourcesMesh=meteor
ResourcesMaterial=meteor_mat.ini
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_effect
BoosterEffectPosition=0,0,-0.022
// 发射时拖尾与位置
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=4.0  // 发射时转到飞行时秒数（仅影响拖尾）in seconds, after that the Inflight Effect will be played if available
// 飞行时拖尾与位置
HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
// 爆炸毁伤贴图
[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07