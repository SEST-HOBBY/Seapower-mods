#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Meteor
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation      // can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode

Mass=840                               // in kg. Used for aircraft
AmmoPoints=1150
DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=VeryTiny   // 
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation     // 
#1 = Armor Piercing            // 
#2 = HEAT                           // 
#3 = Illumination                 //
#4 = Cluster                        // 
#5 = Runway Cratering        // 

[WarheadData]
WarheadType=0                          // Blast Fragmentation (nucléaire MIRV)
Power=2000000                          // **x20** : 2 Mt équivalent (destruction massive)
ImpactSize=4000                   // **Max** : Impact nucléaire géant
Penetration=Always                     // Pénétration totale (sous-terrain inclus)
FuzeProximityDistance=500              // Détonation airburst large (500 m rayon)
KillProbability=1.0                    // **100% létal** sur zone d'impact
EMP_Radius=20000                       // Effet EMP étendu (20 km, si supporté)
RadiationDuration=3600             

############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing  
# 2 = Semi-Active Radar Homing  // 
# 3 = Active Radar Homing  // 
# 4 = Anti-Radiation Homing  // 
# 5 = Laser-Homing  // 
# 6 = TV-Homing  // 
# 7 = Active Sonar Homing  // 
# 8 = Passive Sonar Homing  // 
# 9 = Wake Homing  // 
[Guidance]
GuidanceType=3
MidCourseCorrection=1                 // 0 = None, 1 = Radio Command 2 = Wire Guided
DropDuration=0.5                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=2         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=45                      //  Climb angle for initial loft
MaxLoftAlt=60000                    // 
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=8                 // Activation radar actif à ~8 nmi
TerminalDiveDistance=5                 // Plongée finale sur 5 nmi
SupportsBanking=True                   // Virages possibles (manœuvres évasion)
IgnoreHeightDifferenceForTargetDist=True
TerminalDiveAngle=60                   // Plongée à 60° (réaliste supersonique)
#========================================= Launch stats ============================================================
MaxVelocity=1700                       // Maximum speed in knots
VelocityBleed=0.15                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
AccelerationTime=20                   //  Time until start of the velocity bleed, in seconds
Acceleration=12.0                      // Acceleration factor
MaxTurnRate=28.0                      //  Maximum turnrate in degrees per second
MinLaunchRange=4                       // Minimum launch range in nautical miles
MaxLaunchRange=270                   // Maximum launch range in nautical miles
MinAttackAltitude=50000                  // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=45.0                        // Seeker gain in dB
SeekerFOV=50.0                           //angle of attack
SecondaryPassiveRadarGuidanceType=HomeOnJam  //
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
SeekerPassiveRange=25       // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=25               // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       //  Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=12.0                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed

#ECCM
AntiCountermeasuresBonus=0.35          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.20                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=4.0                  // delay in seconds for self destruction

