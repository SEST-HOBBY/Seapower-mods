[---------- Main Systems ----------]
[FlightControls]
# Complete four-panel flying-wing mixer test.
# Every physical panel has exactly one owner: Elevon.
# Pitch component: all four panels move together.
# Roll component: left and right panels move in opposite directions.
#
# The current Seapower assembly reads the Elevon side field using the
# AileronN_Side key (inside initElevons), so those keys are intentional.
# Left-side panels use Right and right-side panels use Left, matching the
# working two-aileron baseline's differential sign convention.

NumberOfAilerons=0
NumberOfElevators=0

NumberOfElevons=4

# Inner left panel: use the same neutral 0 degree base as the outer panels.
Elevon1_Model=elevator_l
Elevon1_MinAngle=-20.0
Elevon1_MaxAngle=20.0
Elevon1_BaseAngle=0.0
Elevon1_RotationAxis=Z
Aileron1_Side=Right

# Inner right panel: use the same neutral 0 degree base as the outer panels.
Elevon2_Model=elevator_r
Elevon2_MinAngle=-20.0
Elevon2_MaxAngle=20.0
Elevon2_BaseAngle=0.0
Elevon2_RotationAxis=Z
Aileron2_Side=Left

# Outer left panel: preserve the working aileron frame and neutral base.
Elevon3_Model=aileron_l
Elevon3_MinAngle=-20.0
Elevon3_MaxAngle=20.0
Elevon3_BaseAngle=0.0
Elevon3_RotationAxis=Z
Aileron3_Side=Right

# Outer right panel: preserve the working aileron frame and neutral base.
Elevon4_Model=aileron_r
Elevon4_MinAngle=-20.0
Elevon4_MaxAngle=20.0
Elevon4_BaseAngle=0.0
Elevon4_RotationAxis=Z
Aileron4_Side=Left

NumberOfRudders=0
AfterBurnerSubModel=afterburner
MaxAfterBurnerIntensity=0.20
AfterBurnerFadeTime=0.5

[---------- Weapon Systems ----------]
# The ammunition definitions and their models remain in the external Dingtools
# Weapon Pack. This aircraft config only defines the RQ-180's ten internal
# stations and references those external ammunition IDs in loadouts.
[WeaponSystems]
NumberOfWeaponSystems=2
AvailableLoadouts=Empty,AirToAir,AirToAirIntercept,StandardAntiShip,HeavyAntiShip,PrecisionStrike,NuclearStrike,AntiSubmarine

[WeaponSystem1] # six-station main internal bay
Type=Hardpoint
SystemName=MainInternalWeaponBay
HideWeaponsInsideSystem=True
OpenSystemAnimation=Bay_Open
CloseSystemAnimation=Bay_Close
AssociatedSensors=SensorSystem2,SensorSystem3,SensorSystem4,SensorSystem5
NumberOfStations=6

# Three-wide by two-row station grid inside the center bay.  Stations 1-3
# are the row used by the three-AGM-183 precision-strike loadout.
# The weapon origins sit above the bay-door plane so the ammunition remains
# inside the internal bay instead of intersecting the belly skin.
Station1=-0.0085,-0.0035,0.0290
Station2=0.0000,-0.0035,0.0290
Station3=0.0085,-0.0035,0.0290
Station4=-0.0085,-0.0035,0.0160
Station5=0.0000,-0.0035,0.0160
Station6=0.0085,-0.0035,0.0160
FiringArcs=-5,5
WorksStandalone=True
ModuleType=Weapon

[WeaponSystem2] # four-station left/right side bays
Type=Hardpoint
SystemName=SideInternalWeaponBays
HideWeaponsInsideSystem=True
OpenSystemAnimation=Bay_Open
CloseSystemAnimation=Bay_Close
AssociatedSensors=SensorSystem2
NumberOfStations=4

# Stations 1-2 are the left side bay; 3-4 are the right side bay.
# The side-bay aperture is lower and shallower than the center bay.  Move
# the origins slightly upward and aft so the forward end of AIM-260 stays
# inside the side-bay aperture instead of protruding through the nose.
Station1=0.0190,-0.0080,0.0270
Station2=0.0250,-0.0080,0.0270
Station3=-0.0190,-0.0080,0.0270
Station4=-0.0250,-0.0080,0.0270
FiringArcs=-5,5
WorksStandalone=True
ModuleType=Weapon

