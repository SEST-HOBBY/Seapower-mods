[---------- General Data ----------]
[General]
UnitType=Aircraft
Size=Large
# Red-line hinge correction: four surfaces use compensated Euler-Z frames.
# Local Z follows each physical leading-edge hinge. Vertices and normals are
# inverse-compensated to preserve the assembled zero-deflection geometry.
# Aircraft motion parameters, including the tested MaxPitchRate, are unchanged.
CarrierCapable=True

DefaultCameraDistance=1.1
MinCameraDistanceForeAft=0.36
MinCameraDistanceBroadside=0.36
CameraPivotHeight=0.0

# Source geometry is approximately 18.5 m long and 40.0 m in span.
# The ground datum follows the lowest deployed wheel in the source animation.
GroundedPitchAngle=0.0
GroundPivot=0,-0.0300,-0.0095
# Use a separate aft logical recovery point. This is the virtual arresting
# reference; no visible arresting-hook mesh is added.
LandingPivot=0,-0.0300,-0.0700
# Keep the naval-aircraft final-approach attitude instead of allowing the
# omitted-field default to level the flying wing before line capture.
LandingPitch=-5
OnDeckPositionOffset=0,0,-0.08

[AI]
Role=SEAD,Bomber

[SensorData]
# F-35 sensor reference values are applied in systems/sensors.ini.  Keep the
# RQ-180's lower airframe RCS rather than copying the F-35 signature.
VisualIdentificationRange=6.0
IRSignature=Small
# Smallest positive numeric aircraft RCS used by this data set; keep it
# positive so the game does not treat the value as an invalid/absent field.
RCS=0.0001

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usaf_rq-180

