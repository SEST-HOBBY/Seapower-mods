[usaf_rq-180]
Type=舰载隐身无人攻击机
Default=RQ-180“白蝙蝠”,RQ-180
DefaultDescription=本 MOD 中的 RQ-180“白蝙蝠”是以公开报道所称高空长航时隐身飞翼为基础设定的架空舰载无人作战衍生型。公开报道通常将现实中尚未得到完整官方确认的 RQ-180 与穿透性情报、监视和侦察任务联系起来，但其最终设计、性能和航电配置仍未公开。本衍生型增加低可探测飞翼布局、内置武器舱和自动舰载回收接口，可执行远程空战、反舰、精确打击、压制防空和反潜任务。架空的 RQ180_APG85 多任务 AESA、RQ180_EOTS 与 RQ180_EODAS 组成雷达、光电/红外和分布式红外感知系统；RQ180_RWR、RQ180_ESM 与 RQ180_DECM 分别提供告警、被动电子支援和防御性电子对抗；RQ180_EPAWSS_OECM 提供进攻性电子战。武器内置以保持低可探测外形。
Squadron1=RQ-180“白蝙蝠”无人攻击分队,RQ-180
Callsigns=Squadron1,蝙蝠,白蝙蝠
