[SystemNames]
RQ180_APG85=RQ-180 AN/APG-85|本 MOD 为 RQ-180 架空整合的多任务 AESA 雷达。其职能参考公开的 F-35 AN/APG-81 资料，支持空对空和空对地搜索跟踪、对海/对地模式、类似 SAR 的精确测绘以及武器支持；现实 RQ-180 的雷达配置尚未公开确认，本名称和游戏参数均属 MOD 设定。
RQ180_EOTS=RQ-180 AN/AAQ-40 EOTS|本 MOD 为 RQ-180 架空整合的光电/红外目标系统，职能参考公开的 F-35 EOTS 资料。系统结合前视红外与红外搜索跟踪能力，用于昼夜目标识别、侦察、跟踪以及激光或 GPS 制导武器支持；安装方式和参数均属 MOD 设定。
RQ180_EOTS_LASER=RQ-180 EOTS 激光通道|EOTS 激光指示通道用于测距和照射目标，为激光制导武器提供支持。本条目是 RQ-180 的架空整合，不与 F-35 共用语言键。
RQ180_EODAS=RQ-180 AN/AAQ-37 EODAS|本 MOD 为 RQ-180 架空整合的分布式红外态势感知系统，参考公开的 F-35 DAS 资料。多个红外传感器提供昼夜环向态势感知、红外搜索跟踪以及导弹或空中威胁提示；具体安装方式属于 MOD 设定。
RQ180_RWR=RQ-180 AN/ASQ-239 RWR|RQ-180 雷达告警通道参考公开的 AN/ASQ-239 职能，用于发现、识别和提示敌方射频辐射源，并把告警信息送入本机电子战态势图；它不是 F-35 的同名本地化条目。
RQ180_ESM=RQ-180 AN/ASQ-239 ESM|被动电子支援通道参考公开的 AN/ASQ-239 职能，在不主动辐射的情况下截获、测向和分类射频辐射源，再将威胁态势提供给 RQ-180 任务系统；这是本 MOD 的架空分系统。
RQ180_DECM=RQ-180 AN/ASQ-239 DECM|防御性电子对抗通道参考公开的 AN/ASQ-239 射频与红外反制职能，为来袭威胁提供快速防御提示和干扰支持；实际游戏行为属于 MOD 设定。
RQ180_EPAWSS_OECM=RQ-180 AN/ALQ-250 EPAWSS OECM|本 MOD 的架空进攻性电子战整合参考 F-15 系列公开的 AN/ALQ-250 EPAWSS 职能，包括全向态势感知、威胁定位和主动射频反制；200 公里干扰距离与 120 度干扰锥是 MOD 参数，不代表公开的 RQ-180 性能资料。
