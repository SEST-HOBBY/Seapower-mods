[Animations]
NumberOfAnimations=4
Animation1=Gear_Extend
Animation2=Gear_Retract
Animation3=Bay_Open
Animation4=Bay_Close

############################################################
# Default OBJ pose is the source animation's fully retracted gear state.
# Gear_Extend is the inverse of the source showcase motion.
############################################################

[Gear_Extend]
NumberOfSequencesToPlay=14
Sequence1=Nose_Gear_Door_Open
Sequence1_Model=gear_door_nose
Sequence2=Nose_Wheel_Down
Sequence2_Model=gear_nose
Sequence3=Left_Gear_Door_Open
Sequence3_Model=gear_door_l
Sequence4=Left_Gear_Down
Sequence4_Model=gear_l
Sequence5=Right_Gear_Door_Open
Sequence5_Model=gear_door_r
Sequence6=Right_Gear_Down
Sequence6_Model=gear_r
Sequence7=Nose_Gear_Down_M1
Sequence7_Model=gear_nose_m1
Sequence8=Nose_Gear_Down_M2
Sequence8_Model=gear_nose_m2
Sequence9=Nose_Gear_Down_M3
Sequence9_Model=gear_nose_m3
Sequence10=Nose_Gear_Down_M6
Sequence10_Model=gear_nose_m6
Sequence11=Left_Gear_Down_M2
Sequence11_Model=gear_l_m2
Sequence12=Left_Gear_Down_M4
Sequence12_Model=gear_l_m4
Sequence13=Right_Gear_Down_M2
Sequence13_Model=gear_r_m2
Sequence14=Right_Gear_Down_M4
Sequence14_Model=gear_r_m4

[Gear_Retract]
NumberOfSequencesToPlay=14
Sequence1=Nose_Wheel_Up
Sequence1_Model=gear_nose
Sequence2=Left_Gear_Up
Sequence2_Model=gear_l
Sequence3=Right_Gear_Up
Sequence3_Model=gear_r
Sequence4=Nose_Gear_Door_Close
Sequence4_Model=gear_door_nose
Sequence5=Left_Gear_Door_Close
Sequence5_Model=gear_door_l
Sequence6=Right_Gear_Door_Close
Sequence6_Model=gear_door_r
Sequence7=Nose_Gear_Up_M1
Sequence7_Model=gear_nose_m1
Sequence8=Nose_Gear_Up_M2
Sequence8_Model=gear_nose_m2
Sequence9=Nose_Gear_Up_M3
Sequence9_Model=gear_nose_m3
Sequence10=Nose_Gear_Up_M6
Sequence10_Model=gear_nose_m6
Sequence11=Left_Gear_Up_M2
Sequence11_Model=gear_l_m2
Sequence12=Left_Gear_Up_M4
Sequence12_Model=gear_l_m4
Sequence13=Right_Gear_Up_M2
Sequence13_Model=gear_r_m2
Sequence14=Right_Gear_Up_M4
Sequence14_Model=gear_r_m4

############################################################
# Each door uses the legacy axis-specific form on purpose: RotationZ is the
# only animated component. The corresponding static Rotation= frame is in
# the aircraft INI and tilts this local Z axis onto the source hinge line.
############################################################

[Nose_Gear_Door_Open]
NumberOfSteps=3
Time1=0
RotationZ1=0
Smoothness1=Linear
Time2=3
RotationZ2=90
Smoothness2=EaseInOut
Time3=8
RotationZ3=90
Smoothness3=EaseInOut

[Nose_Gear_Door_Close]
NumberOfSteps=3
Time1=0
RotationZ1=90
Smoothness1=Linear
Time2=5
RotationZ2=90
Smoothness2=Linear
Time3=8
RotationZ3=0
Smoothness3=EaseInOut

[Nose_Wheel_Down]
NumberOfSteps=3
Step1=0|x,y,z|0,0,0|Linear
Step2=2|x,y,z|0,0,0|Linear
Step3=8|x,y,z|-73,0,0|EaseInOut

[Nose_Wheel_Up]
NumberOfSteps=3
Step1=0|x,y,z|-73,0,0|Linear
Step2=2|x,y,z|-73,0,0|Linear
Step3=8|x,y,z|0,0,0|EaseInOut

[Left_Gear_Door_Open]
NumberOfSteps=3
Time1=0
RotationZ1=0
Smoothness1=Linear
Time2=3
RotationZ2=90
Smoothness2=EaseInOut
Time3=8
RotationZ3=90
Smoothness3=EaseInOut

[Left_Gear_Door_Close]
NumberOfSteps=3
Time1=0
RotationZ1=90
Smoothness1=Linear
Time2=5
RotationZ2=90
Smoothness2=Linear
Time3=8
RotationZ3=0
Smoothness3=EaseInOut

[Left_Gear_Down]
NumberOfSteps=3
Step1=0|x,y,z|0,0,0|Linear
Step2=2|x,y,z|0,0,0|Linear
Step3=8|x,y,z|100,0,0|EaseInOut

[Left_Gear_Up]
NumberOfSteps=3
Step1=0|x,y,z|100,0,0|Linear
Step2=2|x,y,z|100,0,0|Linear
Step3=8|x,y,z|0,0,0|EaseInOut

[Right_Gear_Door_Open]
NumberOfSteps=3
Time1=0
RotationZ1=0
Smoothness1=Linear
Time2=3
RotationZ2=-90
Smoothness2=EaseInOut
Time3=8
RotationZ3=-90
Smoothness3=EaseInOut

[Right_Gear_Door_Close]
NumberOfSteps=3
Time1=0
RotationZ1=-90
Smoothness1=Linear
Time2=5
RotationZ2=-90
Smoothness2=Linear
Time3=8
RotationZ3=0
Smoothness3=EaseInOut

[Right_Gear_Down]
NumberOfSteps=3
Step1=0|x,y,z|0,0,0|Linear
Step2=2|x,y,z|0,0,0|Linear
Step3=8|x,y,z|100,0,0|EaseInOut

[Right_Gear_Up]
NumberOfSteps=3
Step1=0|x,y,z|100,0,0|Linear
Step2=2|x,y,z|100,0,0|Linear
Step3=8|x,y,z|0,0,0|EaseInOut

