# RQ-180 logical sensor suite.
# The RQ180_* sensor IDs below are intentionally unique to this mod. Their
# values are copied from the supplied F-35 sensor
# reference file.  WeaponChannels are sensor guidance capacities only; the
# aircraft keeps its weapon stations in the aircraft INI and only the MK-50
# ammunition definition is local to this follow-on package.

[RQ180_APG85]
# Users: RQ-180 White Bat
Kind=Radar
Type=DirectedSearch
HasDataLink=True
Role=AirAndSurface
CanDetectLandTargets=True
Mode=Illuminate
TargetChannels=45
WeaponChannels=20
ViewArcs=-120,120|-120,120
LookDownMultiplier=0.9
MinRange=0.4
MaxRange=500.5
MinAltitude=15
MaxAltitude=30480
RangeResolution=0.5
BeamWidth=0.8
Gain=67.0
Frequency=X-Band
PeakPower=45.0
RequiresAlignment=True

[RQ180_EOTS]
# F-35C EOTS visual/infrared channel
Kind=Visual
UseIRValues=True
Infrared=True
VIDRangeMultiplier=6.7
MaxRangeMultiplier=6.7
LookDownMultiplier=1.0
NightVisionLevel=1

[RQ180_EODAS]
# F-35C distributed-aperture visual/infrared channel
Kind=Visual
UseIRValues=True
Infrared=True
VIDRangeMultiplier=0.7
MaxRangeMultiplier=17.4
LookDownMultiplier=1.0
NightVisionLevel=1

[RQ180_EOTS_LASER]
# F-35C EOTS laser-designation channel
Kind=LaserDesignator
MaxRange=20.0
NightCapable=True
TargetChannels=4
WeaponChannels=1000
ViewArcs=360.0

[RQ180_ESM]
# F-35-derived electronic support measures suite
Kind=ESM
Gain=40
HasDataLink=True
AngularResolution=3.0
Frequencies=VHF-Band,UHF-Band,L-Band,S-Band,C-Band,X-Band,Ku-Band
OverHorizonMultiplier=0.7

[RQ180_RWR]
# F-35-derived radar warning receiver
Kind=ESM
Type=RWR
Gain=40
HasDataLink=True
AngularResolution=3.0
Frequencies=VHF-Band,UHF-Band,L-Band,S-Band,C-Band,X-Band,Ku-Band

[RQ180_DECM]
# F-35-derived defensive electronic countermeasures
Kind=ECM
Frequencies=L-Band,S-Band,C-Band,X-Band,Ku-Band
Type=Defensive
JamChance=0.77

[RQ180_EPAWSS_OECM]
# F-15EX-shaped offensive ECM envelope; frequency coverage follows the
# supplied F-35 AN/APG-81 OECM reference.
Kind=ECM
Frequencies=All
Type=Offensive
MaxRange=200.0
PeakPower=10.0
Gain=25
JamConeViewArcs=120.0
