[Language_en]
Name=RQ-180 White Bat Airframe
Description=RQ-180 White Bat carrier-capable stealth unmanned attack derivative. Public reporting generally associates the real, still-unconfirmed RQ-180 with high-altitude, long-endurance penetrating ISR; this package is a fictional attack and carrier adaptation of the supplied flying-wing model. This v1.27.4 feedback revision adds game-native three-layer jet audio and improves the local MK-50 air torpedo's search, acquisition, tracking, reattack, and countermeasure resistance. It is based on the stable v1.27.3 package and preserves the one 29-object aircraft OBJ, corrected control-surface hinge frames, four-panel flying-wing mixer, gear and bay animations, subdued livery, tactical-map profile, internal bays, collision boxes, virtual carrier recovery point, unique RQ180_* equipment IDs, and bilingual descriptions. Existing external Dingtools Weapon Pack ammunition remains referenced by the original ten stations, while Anti-Submarine Attack uses six locally packaged MK-50 air torpedoes whose config uses the game's built-in MK-46 model/material. No torpedo model, texture, audio file, or other new external asset is copied into this package.

