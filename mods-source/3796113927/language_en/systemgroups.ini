[SystemNames]
RQ180_APG85=RQ-180 AN/APG-85|A fictional RQ-180 multifunction AESA radar. Its role is based on public descriptions of the F-35 AN/APG-81: air-to-air and air-to-surface search and track, maritime and ground modes, SAR-style mapping, and weapon support. The real RQ-180 radar fit is not publicly confirmed; this designation and its in-game parameters are MOD fiction.
RQ180_EOTS=RQ-180 AN/AAQ-40 EOTS|A fictional RQ-180 electro-optical/infrared targeting system inspired by public descriptions of F-35 EOTS. It combines forward-looking infrared and infrared search-and-track functions for day/night identification, reconnaissance, tracking, and support for laser- or GPS-guided weapons. Its installation and parameters are MOD fiction.
RQ180_EOTS_LASER=RQ-180 EOTS laser channel|The EOTS laser-designation channel provides ranging and target illumination for laser-guided weapons. It is a fictional RQ-180 integration and is not a shared F-35 system entry.
RQ180_EODAS=RQ-180 AN/AAQ-37 EODAS|A fictional distributed infrared awareness system inspired by public descriptions of the F-35 DAS. Its multiple infrared apertures provide day/night spherical situational awareness, infrared search and track, and missile or airborne-threat cueing; the RQ-180 installation is a MOD design choice.
RQ180_RWR=RQ-180 AN/ASQ-239 RWR|The RQ-180 radar-warning channel is inspired by public AN/ASQ-239 functions. It detects, identifies, and cues hostile RF emitters and feeds warning data into the aircraft electronic-warfare picture; it is not the F-35 localization entry.
RQ180_ESM=RQ-180 AN/ASQ-239 ESM|A passive electronic-support channel inspired by public AN/ASQ-239 functions. It intercepts, locates, and classifies RF emitters without transmitting, then supplies the resulting threat picture to the RQ-180 mission system. This is a fictional RQ-180 subsystem.
RQ180_DECM=RQ-180 AN/ASQ-239 DECM|A defensive electronic-countermeasure channel inspired by public AN/ASQ-239 RF and IR countermeasure functions. It provides rapid defensive cueing and jamming support against incoming threats; the in-game behavior is a MOD setting.
RQ180_EPAWSS_OECM=RQ-180 AN/ALQ-250 EPAWSS OECM|A fictional offensive electronic-warfare integration based on public AN/ALQ-250 EPAWSS functions for the F-15 family, including 360-degree awareness, threat geolocation, and active RF countermeasures. The 200 km range and 120-degree cone are MOD parameters, not public RQ-180 performance data.
