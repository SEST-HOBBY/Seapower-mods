DefaultDescription=The RQ-180 “White Bat” in this mod is a fictional carrier-capable unmanned combat derivative of the high-altitude, long-endurance stealth flying-wing aircraft associated with public reporting on the RQ-180 program. Public reporting generally links the real, unconfirmed aircraft to penetrating intelligence, surveillance, and reconnaissance; its final design, performance, and avionics remain undisclosed. This adaptation adds a low-observable flying-wing airframe, internal weapon bays, and automated carrier-recovery interfaces for long-range air-to-air, anti-ship, precision-strike, suppression-of-air-defences, and anti-submarine missions. Its fictional RQ180_APG85 multifunction AESA, RQ180_EOTS, and RQ180_EODAS suite combines radar, electro-optical/infrared, and distributed-infrared sensing; RQ180_RWR, RQ180_ESM, and RQ180_DECM provide warning, passive support, and defensive countermeasures; RQ180_EPAWSS_OECM supplies offensive electronic attack. Internal carriage preserves the low-observable profile.
