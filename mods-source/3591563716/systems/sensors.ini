[EORD-31 EOTS] #EOTS part of EORD-31 EOTS system
#Users: plaaf_j-20a
Kind=Visual
Infrared=True
VIDRangeMultiplier=2.0            // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=3.5            // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.95           // Final VID/Detection range is multiplied by this in case when target observed on surface background
