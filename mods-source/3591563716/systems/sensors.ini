[DECM ECM] #Himalayas ECM Systems
#Users: plaaf_j-20a
Kind=ECM
Frequencies=UHF-Band,L-Band,S-Band,C-Band,X-Band,Ku-Band //radar frequency bands the ECM suite can jam
Type=Universal                      // can be Defensive, Offensive, Universal
PeakPower=54.0                      // output peak power in kW, more power increase effectivness of offensive ECM jammers
MaxRange=81.0                       // max range in km
Gain=10                            // Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=5.0                // For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChance=0.65                       // For Defensive and Universal jammers. Base chance to jam the attacking weapon
CoverRange=8                        // in nmi, If within this range from attacked unit and within weapon seeker cone, jammer will add to combined chance to jam weapon.


