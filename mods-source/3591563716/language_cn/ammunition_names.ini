[AmmunitionNames]

plaaf_pl-10_LQS=PL-10,,空对空,霹雳-10是中国为第四代和第五代战斗机研制的近距红外制导空空导弹。导弹导引头采用多重红外成像制导技术，具有很强的抗干扰能力，支持头盔显示器随动。导弹支持大离轴，大过载发射条件，拥有近距红外格斗弹中较远的射程。


plaaf_pl-15_LQS=PL-15,,空对空,霹雳-15是中国为第四代和第五代战斗机研制的中远程主动雷达制导空空导弹。导弹采用双脉冲固体火箭发动机，有源相控阵主动雷达导引头，具备高末端速度和优异的抗电子干扰能力。

plaaf_pl-16_LQS=PL-16,,空对空,霹雳-16是中国研制的一款中远程主动雷达制导空对空导弹，主要装备歼-20等先进战机，用于超视距（BVR）空战，打击敌方高机动目标。

plaaf_pl-17_LQS=PL-17,,远程空对空,霹雳-17是中国空军装备的远程主动雷达制导空空导弹，主要用于在超远距离上攻击地方辅助和支援飞机目标，包括加油机，预警机，轰炸机等，导弹射程远速度快，但机动性较差，不适合攻击高机动性的目标。


plaaf_ld-8a_LQS=LD-8A,,反辐射,LD-8A反辐射导弹，是一型小型反辐射导弹，该弹系PL-15中距空空导弹基础上修改而成。


plaaf_ls-6_500_LQS=雷石-6（500公斤）,滑翔炸弹,对地攻击,LS-6型500千克GPS精确制导滑翔炸弹由500公斤低阻航空炸弹加装滑翔和制导组件构成，具备防区外精确制导打击能力。

plaaf_tl-20_LQS=TL-20,,对地攻击,天龙-20中国自主研发的一款小型滑翔制导炸弹，装备热成像或毫米波雷达导引头，末端成像识别，CEP可达米级。
