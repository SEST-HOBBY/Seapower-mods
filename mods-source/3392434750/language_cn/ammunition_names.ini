wp_9m96e=9M96E,近程防空导弹,面对空,9M96E是S-400防空导弹系统中的导弹，主要负责打击低空目标
wp_9m96e2=9M96E2,防空导弹,面对空,9M96E2是S-400防空导弹系统中的导弹，主要负责打击单个高机动目标，反导作战
wp_48n6e3=48N6E3,中程防空导弹,面对空,48N6E3是S-400防空导弹系统中的导弹，主要负责打击普通飞机，速度4800米/秒以下的目标
wp_40n6=40N6,远程防空导弹,面对空,40N6是S-400防空导弹系统中的导弹，主要负责打击高空大型飞机，速度4800米/秒以下的目标
