#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# S-300F "Fort"
# Users: wp_rkr_kirov, wp_rkr_slava
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
RequiresWarmUp=False  //False - removes need to reload launcher before first launch

Mass=333

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=30
ImpactSize=SemiSmall                    // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                    // can be minor, moderate, heavy, always

FuzeProximityDistance=10.0              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.9                     // Base chance to hit

InterceptOutOfAltitudePenalty=0.1
InterceptSpeedPenaltyMultiplier=0.6
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.6         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
#Radio-command SAM are going into Terminal stage immediately, so all previous stages are not needed
TerminalApproachDist=1000              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
SupportsBanking=False                  // if the missile will bank when turning
IgnoreHeightDifferenceForTargetDist=True  
#========================================= Launch stats ============================================================
ApplyKinematics=True                   // 如果我们使用完整的运动学规则。如果这是真的，我们将只使用运动学
MaxVelocity=1600                    // Stall at 400 knots   // Maximum speed in knots
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
AccelerationTime=2                  // 初始助推器燃烧的燃烧时间
Acceleration=38.2                   // 初始燃烧阶段的加速度Gs
SustainerAccelerationTime=8            // 持续燃烧时间。若无持续燃烧，则记为-1
SustainerAcceleration=5.7               // 持续燃烧加速。若无持续燃烧，则值为-1
#---- Total Δv ≈ 1200 ≈ 3.53Ma

TypicalLaunchVelocity=0 
TypicalFiringAlt=0                    //SAM的阻力计算应该从0高度开始

DragCoefficient=-1               // 阻力系数。0表示无阻力，1表示默认阻力，数值越大表示阻力越大。默认值为-1，此时我们会根据导弹的最大射程来计算阻力系数

MaxFlightTime=60               // 基于电池等因素，导弹完全失效前的运行时间作为硬限制。默认值：无限


MaxTurnRate=45.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=400                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MinLaunchRange=1.5                     // Minimum launch range in nautical miles
MaxLaunchRange=25.0                   // Maximum launch range in nautical miles
MinAttackAltitude=20                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
AutoAttackOutsideAltitudes=False                   // This weapon will not be auto launched if target is outside altitude brackets
MaxAttackAltitude=18000                // Maximum altitude of target, in feet
MaxAttackVelocity=2600				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=20.0                         // Seeker gain in dB
SeekerFOV=60.0                         // Seeker field-of-view in degrees
SecondaryPassiveRadarGuidanceType=HomeOnJam
PassiveRadarGuidanceFrequencies=All
SeekerActiveRange=12.0                  // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=40.0        // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band 
PeakPower=15.0
TargetMemory=True
#ECCM
CounterMeasuresRejection=85            // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=75                      // The lower the value, the greater risk of spoofing by jamming	(0...100)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=2.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/wp_sa-n-6/
ResourcesRoot=wp_sa-n-6
ResourcesMesh=wp_sa-n-6
ResourcesMaterial=wp_sa-n-6_mat
ResourcesMeshForLaunch=wp_sa-n-6_dummy
ResourcesMeshSwitchTime=0.5 // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/s-300_effect
BoosterEffectPosition=0,0,-0.06
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.06
InFlightEffectStartTime=4.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes


[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043