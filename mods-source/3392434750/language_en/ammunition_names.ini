# ------------------ SAM ------------------
wp_9m96e=9M96E,Short-range SAM,SAM,9M96E is a missile in the SA-21 air defense missile system, mainly responsible for striking low altitude targets
wp_9m96e2=9M96E2,SAM,SAM,9M96E2 is a missile in the SA-21 air defense missile system, mainly responsible for striking single high mobility targets and conducting anti missile operations
wp_48n6e3=48N6E3,Medium-range SAM,SAM,48N6E3 is a missile in the SA-21 air defense missile system, mainly responsible for striking ordinary aircraft and targets with a speed of less than 4800 meters per second
wp_40n6=40N6,Long-range SAM,SAM,40N6 is a missile in the SA-21 air defense missile system, mainly responsible for striking high-altitude large aircraft and targets with speeds below 4800 meters per second
