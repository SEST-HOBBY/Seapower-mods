wp_9m96e=9М96Е,ЗР малой дальности,SAM,9М96Е - ракета в составе зенитно-ракетного комплекса С-400 «Триумф», в основном отвечающая за поражение маловысотных целей.
wp_9m96e2=9M96E2,ЗР,SAM,9M96E2 - ракета зенитно-ракетного комплекса С-400 «Триумф», в основном предназначенная для поражения одиночных высокомобильных целей и проведения противоракетных операций
wp_48n6e3=48N6E3,ЗР средней дальности,SAM,48N6E3 - ракета в составе зенитно-ракетного комплекса С-400 «Триумф», в основном отвечающая за поражение обычных самолетов и целей со скоростью менее 4800 метров в секунду
wp_40n6=40N6,ЗР дальнего действия, SAM,40N6 - ракета в составе зенитно-ракетного комплекса С-400 «Триумф», в основном предназначенная для поражения высотных крупных самолетов и целей.
