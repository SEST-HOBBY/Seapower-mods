[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.04

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.88                     // in meters
Beam=3.38                       // in meters
Range=320                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=6  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=660
Mass=33.5                      // in tons

MaxForwardVelocity=35        // in knots
MaxBackwardVelocity=10         // in knots
Braking=12                     // knots/sec
TurnRate=30                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=6

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=0

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #AdvancedOptics
Type=Visual
SystemName=AdvancedOptics
MountPosition=0,0.04,0


[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=2
AvailableLoadouts=Default,AntiArmor

Default_SubModelsToHide=Milan

[WeaponSystem1]  #Mk_20_Rh-202
Type=CIWS
SystemName=Mk_20_Rh-202
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Barrel
AreContainersRotatable=True
