[WeaponSystem2AntiArmor]  #Milan
Type=Missile
SystemName=Milan_Marder
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
NumberOfContainers=1
Container1=Milan
