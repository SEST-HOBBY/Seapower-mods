[AmmunitionNames]
# ------------------ AAM ------------------
su_aa-11_LQS=R-73,,空对空,闪电机械R-73（AA-11射手）是苏联在1970~80年代研发的一种红外空对空导弹，R-73开创性的使用了矢量发动机，让导弹拥有远超同时期导弹的机动性，被认为是最具威胁的空对空导弹之一。

su_aa-12_1_LQS=R-77-1,,空对空,信号旗R-77-1（AA-12蝰蛇）是俄罗斯的主动雷达制导中程空对空导弹，对R-77进行了改进，拥有更远的射程。

su_aa-12_pd_LQS=R-77-PD,,空对空,信号旗R-77-PD（AA-12蝰蛇）是俄罗斯的主动雷达制导远程空对空导弹，采用冲压发动机，射程相比前型增加甚多。

su_aa-12_m_LQS=R-77M,,空对空,信号旗R-77M（AA-12蝰蛇）是俄罗斯的主动雷达制导远程空对空导弹，该弹采用了更加强大的有源相控阵导引头与双脉冲发动机，性能方面得到了巨大的提升。

# ------------------ SAM ------------------

# ---------- Anti-radar Missiles ---------
su_as-17a_LQS=KH-31P,,反辐射,战术导弹集团Kh-31P（AS-17氪星）是苏联的超音速反辐射导弹，在许多方面与P-270类似，看起来就像是缩小版的P-270，据称有将其改装为远程空对空导弹的计划。
# ---------- Anti-ship Missiles ----------
su_as-18a_LQS=Kh-59M,,反水面,战术导弹集团Kh-59M (AS-18卡祖笛) 是俄罗斯的亚音速空对地/舰导弹，相比Kh-59，M型增加了射程，并速度有所提高。
#-----------Land Strike only missiles---------
su_as-14_LQS=Kh-29T,,空对地,信号旗Kh-29T（AS-14锚）是苏联的电视制导超音速空对地导弹，威力巨大，可以用于摧毁不超过10000吨的船只。

su_kh-38_LQS=Kh-38ME,,空对地,战术导弹集团Kh-38ME是俄罗斯的战术导弹，该导弹属于模块化武器，有多种导引头，ME为主动雷达制导。

su_as-20_LQS=Kh-35,,反水面,红星研究所Kh-35 (AS-20皮划艇) 是俄罗斯的亚音速反舰导弹，因外观与性能和美国鱼叉导弹近似，因此被戏称为“鱼叉斯基”，其设计是用于攻击五千吨以下的舰艇。
su_kh-35_LQS=Kh-35,,空对地,红星研究所Kh-35 (AS-20皮划艇) 是俄罗斯的亚音速反舰导弹，因外观与性能和美国鱼叉导弹近似，因此被戏称为“鱼叉斯基”，其设计是用于攻击五千吨以下的舰艇。也可用于攻击地面目标。
