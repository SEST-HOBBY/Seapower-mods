#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# R.550 Magic 1
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
Mass=105                                // in kg. Used for aircraft
AmmoPoints=153                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=Tiny
# Sonar related


[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=9
ImpactSize=VerySmall                        // Impact size, can be small, medium, large, verylarge
Penetration=Always                      // can be minor, moderate, heavy, always

FuzeProximityDistance=5.0               // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.75                    //Chance to intercept missile
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
InitialFlightPhaseDuration=0.1         // time in seconds where the missile moves straight on without guiding
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=1000              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
SupportsBanking=False                  // if the missile will bank when turning
#========================================= Launch stats ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
MaxVelocity=2915                       // Maximum speed in knots
VelocityBleed=0.7                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
AccelerationTime=5.5                  // Burn time for initial booster burn
Acceleration=13.35                      // Gs of acceleration in initial burn
#SustainerAccelerationTime=-1            // Time of sustainer burn. -1 if there is no sustainer burn
#SustainerAcceleration=-1               // Acceleration of sustainer burn. -1 if there is no sustainer
LaunchTurnRate=90
MaxTurnRate=120.0                       // Maximum turnrate in degrees per second
MinLaunchRange=0.1                     // Minimum launch range in nautical miles
MaxLaunchRange=10.8                     // Maximum launch range in nautical miles
DragCoefficient=2.5               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
LaunchReliability=95                   // The lower the value, the greater risk of misfire or accident (0...100)
MaxFlightTime=20               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================     Seeker     ===========================================================
#Homing
IsRearAspectOnly=False                 // Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=120                     // Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=5                            // Seeker field-of-view in degrees
SeekerGimbalFOV=150                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=7.02                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#ECCM
AntiCountermeasuresBonus=0.35          // This value substracted from probability of spoofing by countermeasures (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=3.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
ResourcesFolder=assets/models/weapon/ammunition/r73/
ResourcesRoot=r-73.obj
ResourcesMesh=body
ResourcesMeshForLaunch=r-73
ResourcesMaterial=wp_aa-11_mat.ini


############################################################
NumberOfSubModels=1

SubModel1=Glas

[Glas]
Mesh=Glas
ResourcesMaterialFolder=aircraft/materials/
Material=cockpit_glass
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_small_effect
BoosterEffectPosition=0,-0.001548,-0.005

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,-0.001548,-0.005
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.03