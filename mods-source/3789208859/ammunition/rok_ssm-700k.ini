[General]
# ROK_SSM-700K
Type=Missile
TargetType=ASuW
SecondaryTargetType=ASuW
LandAttackCapability=All

Mass=1010                              
AmmoPoints=1725                       

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

CIWSDefenceBonus=30                     
MissileDefenceBonus=0.2                    

DecalClass=Standard

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=0.03
# Sonar related
# Transient
TransientRCS=VerySmall                    // Transient visibility on the radar
TransientVisualIdentificationRange=20  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=0
Power=45
ImpactSize=Medium                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
[Guidance]
GuidanceType=3
MidCourseCorrection=0
TargetRequired=False                 
InitialFlightPhaseDuration=3.0
PerformsSlightBallisticInitialFlight=True
TerrainFollowFlight=True
ApplyKinematics=False                        // If we should use full kinematics rules. If this is true, we will only use kinematics 
Retargetable=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft -----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=50.0                      // Climb angle for initial loft
MaxLoftAlt=3000.0                      // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming ---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=15                      // height in feet for sea skimming
SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase ------------------------------------------------------------------------------
FinalFlightPhaseAlt=15.0             // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=40.0
FinalFlightPhaseDistToTarget=30.0       // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach ------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=12.0               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalAlt=15                         // in feet. Weapon will try to get to this altitude at the start of terminal approach
TerminalPopUpDist=1                    // Pop-up distance in miles
TerminalPopUpHeight=1000               // Pop-up height in feet
TerminalPopUpAngle=70                  // Pop-up climb anble in degrees
SelectivePopUp=True                    // If true - pop up works only against submarines and small boats
TerminalVerticalTurnRate=25            // Override of vertical turn rate in terminal (intended for Pop-up)
SupportsBanking=True                  // if the missile will bank when turning
#============================================= Misc ====
HasEndgameWeave=True
EndgameWeaveAmplitude=3.5
EndgameWeaveFrequency=0.18
================================================================
#========================================= Launch stats ============================================================
MaxVelocity=610.0                      // Maximum speed in knots
Acceleration=7.0                       // Acceleration factor
MaxTurnRate=21.0                       // Maximum turnrate in degrees per second
MinLaunchRange=3.5                     // Minimum launch range in nautical miles
MaxLaunchRange=118                     // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=52.0                        // Seeker gain in dB
SeekerFOV=45,10                        // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerActiveRange=20.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=20                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SecondaryPassiveRadarGuidanceType=Full    //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
TargetMemory=True // Always locks on preselected target unless spoofed or jammed
Frequency=Ku-Band                      // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=35.0                         // Active radar seeker output peak power in kW
#ECCM
AntiCountermeasuresBonus=0.46          // This value substracted from probability of spoofing by countermeasures (0...1)
#SelfDestruct
ReattackMode=1                         // 0 = None, 1 = Circle, 2 = Drive-around
AntiJammerBonus=0.40                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/K_weapon/models/
ResourcesRoot=K_weapon.obj
ResourcesMesh=rok_ssm-700k
ResourcesMaterialFolder=assets/K_weapon/materials/rok_ssm-700k/
ResourcesMaterial=rok_ssm-700k_mat.ini
ResourcesMeshForLaunch=rok_ssm-700k_Boosted
ResourcesMeshCanister=rok_ssm-700k_Canister
ResourcesMeshSwitchTime=0.2  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=1

SubModel1=Afterburner

[Afterburner]
Type=Afterburner                  //Dot: afterburner is invisible by default and will be turned on only after launch
Mesh=wp_ss-n-22_afterburner
ResourcesMaterialFolder=aircraft/materials/
Material=afterburner_mat
Position=0,0,0
Rotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]

InFlightEffect=effects/weapons/emitters/turbojet_sustainer
InFlightEffectPosition=0,0,-0.0145
InFlightEffectStartTime=15.0

SustainerEffect=effects/weapons/emitters/sam_medium_effect
SustainerEffectPosition=0,0,-0.0425
SustainerEffectStartTime=10.0

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions

HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=VeryLargeGroundHitExplosions

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=coll_main

[coll_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.066
