[General]
# ROK_SSM-750K
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All      // can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode

Mass=1010                               // in kg. Used for aircraft
AmmoPoints=1725                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

FrontalArea=0.3404
SideArea=2.94
BottomArea=3.71

CIWSDefenceBonus=15                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.15                     // Less chance to be intercepted by SAM because of anti-interception maneuvers
#Armored warhead & Deceptive Maneuver

DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.20
MinCameraDistanceBroadside=0.20
CameraPivotHeight=0.0

DecalClass=Standard                    // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=3  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=0.03
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=4
LandAttackGuidanceType=1
Power=48
ImpactSize=Large                      // Impact size, can be small, medium, large, verylarge
Penetration=heavy                     // can be minor, moderate, heavy, always

FuzeProximityDistance=35         // for proximity fuze: distance to target in meter
SmartFuse=True                   // True = get as close as possible before exploding, False = explode as soon as target in proximity radius

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=1                  // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Link System
InitialFlightPhaseDuration=0.5         // time in seconds where the missile moves straight on without guiding
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
TargetRequired=True                 
TerrainFollowFlight=True
PerformsSlightBallisticInitialFlight=True  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
Retargetable=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft -----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=50.0                      // Climb angle for initial loft
MaxLoftAlt=80.0                      // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#SeaSkimmingAlt=20.0                    // height in feet for sea skimming TODO:make terrain following
#SeaSkimmingAlt=2000.0                    // height in feet for sea skimming
#SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
#SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
#SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#FinalFlightPhaseAlt=3500.0             // in feet. altitude of pop-up
#FinalFlightPhaseMaxAngle=40.0
#FinalFlightPhaseDistToTarget=20.0       // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=12.0               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalAlt=15                         // in feet. Weapon will try to get to this altitude at the start of terminal approach
TerminalPopUpDist=1                    // Pop-up distance in miles
TerminalPopUpHeight=1000               // Pop-up height in feet
TerminalPopUpAngle=70                  // Pop-up climb anble in degrees
SelectivePopUp=True                    // If true - pop up works only against submarines and small boats
TerminalVerticalTurnRate=25            // Override of vertical turn rate in terminal (intended for Pop-up)
SupportsBanking=True                  // if the missile will bank when turning
#============================================= Misc ====
HasEndgameWeave=True
EndgameWeaveAmplitude=3.5
EndgameWeaveFrequency=0.18
#========================================= Launch stats ============================================================
MaxVelocity=610.0                      // Maximum speed in knots
Acceleration=7.0                       // Acceleration factor
MaxTurnRate=21.0                       // Maximum turnrate in degrees per second
MinLaunchRange=5.5                     // Minimum launch range in nautical miles
MaxLaunchRange=155                     // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=20     // Circular error vs 'Installation' land units
#Homing
#N/A
#ECCM
AntiCountermeasuresBonus=0.3           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.3                   // This value substracted from probability of being jammed  (0...1)
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/K_weapon/models/
ResourcesRoot=K_weapon.obj
ResourcesMesh=rok_ssm-750k
ResourcesMaterialFolder=assets/K_weapon/materials/rok_ssm-750k/
ResourcesMaterial=rok_ssm-750k_mat.ini
ResourcesMeshForLaunch=rok_ssm-750k_Boosted
ResourcesMeshCanister=rok_ssm-750k_Canister
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

[Debris]
DebrisProbability=195                // probability for debris to happen
ResourcesMeshForDebris=usn_rgm-109_d // optional debris mesh after destruction
DebrisPosition=0.05                 // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.99
DebrisHeightLossAdd=0.0005          // determines how quickly the debris loses height
NumberOfSubModels=1

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]

InFlightEffect=effects/weapons/emitters/turbojet_sustainer
InFlightEffectPosition=0,0,-0.0145
InFlightEffectStartTime=15.0

SustainerEffect=effects/weapons/emitters/sam_medium_effect
SustainerEffectPosition=0,0,-0.026
SustainerEffectStartTime=10.0

UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.0176

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=coll_main

[coll_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.066