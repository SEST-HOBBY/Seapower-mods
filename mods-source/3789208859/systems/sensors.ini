[ ========================================= General ========================================== ]
[General]
DataLinkUpdateRate=1             // every x seconds there will be an update for the overall sensor image for the minimap
PassiveSensorUpdateRate=1.0        // every x seconds the passive contacts will be re-evaluated
LostPassiveContactTimeToDisable=5  // time in seconds after which a lost passive contact bearing line will be greyed out
LostContactTimeToRemove=30         // time in seconds after which a lost contact will be removed from the map


[======================================== United States ========================================]
[ ------------------------ Visual/Infared ------------------------- ]

[Sea_Owl] #Sea Owl Navigation/targeting detector
Kind=Visual
#Infrared
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=3.0           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=3.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.5             // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.5             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

