[ ---------------------------- Radars ----------------------------- ]
[---------- Surface ships ----------]
[---Air/Air&Surface---]

[SPS_95K]
Kind=Radar
Type=Search            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface     // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=200       // if applicable number of targets it can track simultaneously
WeaponChannels=6       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=19                 // revolutions per minute
MinRange=0.0           // min range in km
MaxRange=220.0         // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=1500.0      // max altitude in meters, relevant for air, unused for surface
RangeResolution=65.0  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.7          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=55.0              // gain in dB on the sensor
Frequency=C-Band       // frequency band
PeakPower=280.0        // output peak power in kW
UseSignature=SurfaceSearchRadar
ModuleType=SmallSensor
CanDetectPeriscope=True

