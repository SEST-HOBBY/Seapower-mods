[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=10.80                     // in meters
Beam=3.60                       // in meters
Range=450                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Heavy
DamagePoints=25  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=1500
Mass=56                      // in tons

MaxForwardVelocity=37.8       // in knots
MaxBackwardVelocity=27       // in knots
Braking=12                     // knots/sec
TurnRate=10                    // in degrees per second

[AI]
UnitScoreValue=2              // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=20

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

