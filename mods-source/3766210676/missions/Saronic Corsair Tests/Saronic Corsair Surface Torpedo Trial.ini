Taskforce1StartMessage=SURFACE TORPEDO TRIAL|Use the Torpedo ASV against the dhow and MAX against the merchant. Enable radar, identify each hostile surface contact, select Corsair Mk 46, then engage the contact directly from 0.5 to 5 nmi. Do not use a bearing-only launch for this surface test. The third Torpedo ASV is reserved for the submarine regression. Inspect the stern waterjet and steer both ways at low speed.|Continue

