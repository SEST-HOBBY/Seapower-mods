[General]
# Package-local AGM-114L Longbow Hellfire for the unofficial Corsair fit.
# The active millimeter-wave seeker is self-contained and does not require a
# launcher radar or radio-command midcourse guidance.
Type=Missile
TargetType=ASuW
CanNotAttackTypes=Missile,Aircraft
Mass=49
AmmoPoints=140
DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0
DecalClass=Standard

[SensorData]
VisualIdentificationRange=2
IRSignature=Tiny
RCS=VerySmall

[WarheadData]
WarheadType=2
Power=21
ImpactSize=Small
Penetration=Always

[Guidance]
GuidanceType=3
MidCourseCorrection=0
InitialFlightPhaseDuration=0.15
DropDuration=0.0
SeaSkimmingAlt=15
SeaSkimmingMaxDescentAngle=45
SeaSkimmingNoseUp=1
SeaSkimmingStartDistToTarget=4.32
TerminalApproachDist=4.25
TerminalAlt=10
SupportsBanking=False
MaxVelocity=850
Acceleration=8
MaxTurnRate=30
MinLaunchRange=0.15
MaxLaunchRange=4.32
MinLaunchAltitude=0
MaxLaunchAltitude=500
LaunchReliability=100
SeekerGain=45
SeekerFOV=70,30
SeekerActiveRange=5
SeekerPassiveRange=0
Frequency=Ka-Band
PeakPower=11
TargetMemory=True
CounterMeasuresRejection=85
SelfDestructDelay=8

[Models]
ResourcesFolder=weapons/usn_corsair_agm-114l/
ResourcesRoot=usn_corsair_agm-114l.obj
ResourcesMesh=usn_corsair_agm-114l
ResourcesMaterialFolder=weapons/usn_corsair_agm-114l/
ResourcesMaterial=usn_corsair_agm-114l_mat.ini

[Particles]
# The launcher already supplies the one-shot launch smoke. A second ammunition
# booster created a duplicate center plume, while the TOW prefab added two
# oversized lateral emitters. Use Sea Power's stock single-axis small-missile
# sustainer and anchor it directly to the modeled aft nozzle.
BoosterEffect=none
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/missile_sustainer_small_effect
InFlightEffectPosition=0,0,-0.0088
InFlightEffectStartTime=0.25
HitDefaultExplosionClass=RocketShipHitExplosion
HitShipExplosionClass=RocketShipHitExplosion
HitAirExplosionClass=RocketShipHitExplosion
HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.0047,0.0047,0.0176
