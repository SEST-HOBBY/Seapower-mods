usn_corsair_contact_charge=Corsair Contact Charge,,ASuW,One-shot contact charge carried by the Classic Corsair.
usn_corsair_agm-114l=AGM-114L,Longbow Hellfire,ASM,Compact U.S. active-radar surface-attack missile for small craft and surface targets. This Corsair installation is an unofficial gameplay fit with two non-reloadable rounds and a 4.32-nautical-mile range.

usn_corsair_mk46_dual_role=Corsair Mk 46,Surface / submarine,Torpedo,Dual-role Corsair gameplay fit with surface ships as its primary target and submarines retained as secondary targets. Select a surface contact when ordering a ship attack. Stock Mk 46 speed and range are retained.
