[usn_asv_saronic_corsair]
Type=ASV,Autonomous Surface Vessel
Default=Saronic Corsair ASV,Corsair ASV
DefaultDescription=American 24-foot autonomous surface vessel in an unofficial one-way strike configuration with a 46-knot gameplay speed cap. Saronic publishes a 1,000+ nautical-mile range, 35+ knot top speed, and 1,000 lb payload. Automatic contact detonation and the stock Mk 83-class game effect are gameplay approximations; the operational warhead yield is not public. It shares task-force contacts through Sea Power's native data link. The compact waterjet is a gameplay adaptation; its steering nozzle follows the native rudder.
Variant1=Saronic Corsair ASV,Corsair ASV

[usn_asv_saronic_corsair_missile]
Type=ASV,Autonomous Surface Vessel
Default=Saronic Corsair Missile ASV,Corsair Missile ASV
DefaultDescription=American 24-foot autonomous surface vessel in an unofficial two-missile anti-surface configuration. This separate variant carries two AGM-114L Longbow Hellfire active-radar surface-attack missiles, cannot reload at sea, and has a 46-knot gameplay speed cap. The launcher fit and weapon configuration are not published Saronic specifications. It shares task-force contacts through Sea Power's native data link. The compact waterjet is a gameplay adaptation; its steering nozzle follows the native rudder.
Variant1=Saronic Corsair Missile ASV,Corsair Missile ASV

[usn_asv_saronic_corsair_scout]
Type=ASV,Autonomous Surface Vessel
Default=Saronic Corsair Scout ASV,Corsair Scout ASV
DefaultDescription=American 24-foot autonomous surface vessel in an unofficial 46-knot scout configuration. It carries enhanced third-generation electro-optical and compact surface-search sensors for finding contacts. Like every Corsair variant, it shares task-force contacts through Sea Power's native data link. The sensor fit is a gameplay approximation of Corsair's published modular and networked mission architecture. The compact waterjet is a gameplay adaptation; its steering nozzle follows the native rudder.
Variant1=Saronic Corsair Scout ASV,Corsair Scout ASV

[usn_asv_saronic_corsair_torpedo]
Type=ASV,Autonomous Surface Vessel
Default=Saronic Corsair Torpedo ASV,Corsair Torpedo ASV
DefaultDescription=American 24-foot autonomous surface vessel in an unofficial 46-knot dual-role torpedo configuration. A fixed transverse cradle carries one Corsair Mk 46 lightweight torpedo for surface ships and submarines with no at-sea reload. The torpedo and launcher are an unofficial gameplay fit, not published Saronic equipment. It shares task-force contacts through Sea Power's native data link. The compact waterjet is a gameplay adaptation; its steering nozzle follows the native rudder.
Variant1=Saronic Corsair Torpedo ASV,Corsair Torpedo ASV

