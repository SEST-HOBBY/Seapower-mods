[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.2                     // in meters
Beam=3.3                       // in meters
Range=227                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=520
Mass=28                        // in tons

MaxForwardVelocity=27          // in knots
MaxBackwardVelocity=5          // in knots
Braking=13                     // knots/sec
TurnRate=30                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_wp_scud_tel

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

#[SensorSystem2]  #Snap_Shot
Type=Radar
SystemName=Snap_Shot
Mount=Radar
ModuleType=Sensor
[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #SA-N-6
Type=Missile
SystemName=SCUD
#Sensors
#Animations
#Mount
Mount=Dummy
IsMountRotatable=False
#Containers
NumberOfContainers=1
NumberOfHatchesPerContainer=5
Container1=launch_base
Container1_Position=0,0.04187,0.002994
Container1_Rotation=0,0,0
Container1_Hatch1=foot
Container1_OpenHatchAnimation=HatchOpenAnim
Container1_CloseHatchAnimation=HatchCloseAnim
AreContainersRotatable=False
#Angles
#Loading
Ammunition=ods_scud
#Effects
#Other
DisplayWeaponsOnSystem=True
VIDIncrease=15  // In miles. Flat base VID increace when firing.

