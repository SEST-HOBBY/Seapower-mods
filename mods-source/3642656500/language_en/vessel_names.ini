[****************************** Norway ******************************]

[knm_cor_skjold]
Type=FS,Corvette
Default=Skjold Class
DefaultDescription=Skjold-class corvettes (skjold means "shield" in Norwegian) are a class of six light, superfast, stealth missile corvettes in service with the Royal Norwegian Navy. The boats were formerly classed as MTBs (motor torpedo boats) but, from 2009, the Royal Norwegian Navy has described them as corvettes (korvett) because their seaworthiness is seen as comparable to corvettes, and because they do not carry torpedoes.
Variant1=Skjold, Skjold
Variant2=Storm, Storm
Variant3=Skudd, Skudd
Variant4=Steil, Steil
Variant5=Glimt, Glimt
Variant6=Gnist, Gnist

[knm_cb90]
Type=FPC,Fast Patrol Craft
Default=Combat Boat 90,CB90
DefaultDescription=A Swedish fast assault craft optimized for troop transport, coastal raiding, and patrol operations in littoral waters. The design emphasizes speed, agility, and shallow draft, combining a bow ramp for rapid deployment with light automatic weapons and a TOW launcher, relying on mobility, surprise, and low profile rather than armor for survivability.
Variant1=CB90,CB90


[****************************** Sweden ******************************]

[swe_fsg_visby_v5]
Type=FSG,Guided Missile Corvette
Default=Visby-class (V5), Visby
DefaultDescription=A Swedish low-observable corvette optimized for littoral warfare. The design emphasizes reduced signatures, high speed, and a multi-role sensor suite for surface and ASW tasks. It combines a 57 mm gun with RBS 15 anti-ship missiles and lightweight ASW weapons, relying on tactics, sensors, and signature management rather than heavy armor for survivability.
Variant1=K31 Visby,Visby
Variant2=K32 Helsingborg,Helsingborg
Variant3=K33 Harnosand,Harnosand
Variant4=K34 Nykoping,Nykoping
Variant5=K35 Karlstad,Karlstad

[swe_fsg_visby_v6]
Type=FSG,Guided Missile Corvette
Default=Visby-class (V6), Visby
DefaultDescription=An updated Visby-class configuration focused on improved mission-system integration and a more modernized sensor/communications baseline. It retains the class strengths - low signatures, agility, and strong littoral situational awareness, while emphasizing better data-sharing and cueing for coordinated engagements against surface and subsurface threats.
Variant1=K31 Visby,Visby
Variant2=K32 Helsingborg,Helsingborg
Variant3=K33 Harnosand,Harnosand
Variant4=K34 Nykoping,Nykoping
Variant5=K35 Karlstad,Karlstad


