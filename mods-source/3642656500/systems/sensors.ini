Type=Search         // Classes can be "Search", "Targeting"
HasDataLink=False      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface     // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=1       // if applicable number of targets it can track simultaneously
WeaponChannels=1       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=0                 // revolutions per minute
MinRange=0.0          // min range in km
MaxRange=56.0          // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=0.1   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.0          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=1.0              // gain in dB on the sensor
Frequency=Ku-Band       // frequency band
PeakPower=1.0        // output peak power in kW
ModuleType=SmallSensor

