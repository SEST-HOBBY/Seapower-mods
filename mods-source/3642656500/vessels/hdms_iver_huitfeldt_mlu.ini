HangarCloseAnimation=HangarCloseAnimRight

SpawnPosition=-0.0000,0.0806,-0.3895
RidePosition=-0.0000,0.0806,-0.3895

SingleVehicle=True
CloseDoorsAfterTaxi=True
RequiresFreeLaunchpoint=True

[LaunchPoint1]
AllowedType=Helicopter
Position=-0.0000,0.0806,-0.8353

[RecoveryPoint1]
