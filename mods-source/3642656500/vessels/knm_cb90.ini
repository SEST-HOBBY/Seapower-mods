[General]
UnitType=Vessel
DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.15
MinCameraDistanceBroadside=0.15
CameraPivotHeight=0.02

Length=5                    // in meters
Beam=2                       // in meters

CompartmentsHeight=0.01       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=13.5                 // in tons
IntegrityOverride=1
HorsePower=1850               // relevant for the acceleration

MaxForwardVelocity=40.0        // sets the max forward velocity
MaxBackwardVelocity=12.0        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=55
MinAccelerationFactor=0.2

RudderTurnRate=14.0            // turn rate of the rudder in degrees per second
RudderForce=10.0                // multiplicator defining how agile the ship can turn

#TiltFactor=-2.0                // defines how strong the tilting will be, negative means it turns into the direction of turning
TiltFactor=-0.2
PitchFactor=-4.0                // defines how strong the pitch will be based on speed and acceleration
LiftFactor=0.1
LiftVelocityInKnots=10,20

MaxSeaStateForPitchAndLift=4

TrimDepth=0.0                  // default trim depth in feet
TrimAngle=-1.0                 // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

CenterOfMass=0,-0.00,0          // center of mass for physics

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=120
# Sonar related
BaseNoise=122                    // base sound level in db at 1m distance
FlowNoise=1.15                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=3.5              // additional noise for cavitation in db
BladesCount=0					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=6 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

MachineryRaftingGeneration=1
PropellerType=Pumpjet
NoiseFrequencies=MF,HF
TonalRPMModifier=100
DistinctiveNoise=False
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset
LowMagneticHull=True

[---------- AI related ----------]
[AI]
UnitCostValue=50              // value for the unit cost for least valuable target checks
UnitScoreValue=0.5            // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=
ASuW_Capability=
ASW_Capability=

#Defence
MissilesToSaturate=1      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD    //Anti-Missile Defence
ATD_Capability=TBD      //Anti-Torpedo Defence

#Special
Role=FAC

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_hull

#Movement Systems
[MainPowerSystem]
Type=None
HorsePower=1

[PropulsionSystems]
NumberOfPropulsionSystems=1

[PropulsionSystem1]
Mount=Dummy

[RudderSystems]
NumberOfRudderSystems=1

[RudderSystem1]
Mount=Dummy

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=3

#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.072,0.019

#---------- Surface only search radars ----------
[SensorSystem2] #NavRadar
Type=Radar
SystemName=Nav_Radar
Mount=Radar
Collider=coll_navradar
#---------- FC radars ----------
#SAM
#ASM

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=2

[WeaponSystem1]  
Type=CIWS
SystemName=M2HB
#Sensors
#Animations
#Mount
Mount=Gunmount
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Gun
AreContainersRotatable=True
#Angles
FiringArcs=0,0
ElevationArc=-35,85
#Loading
AssociatedMagazine=WeaponMagazine50cal
#Effects
#Other
WorksStandalone=True
Collider=coll_ciws

[WeaponSystem2] #Tow launcher
Type=Missile
SystemName=TOW_M2
#Sensors
#Animations
#Mount
Mount=Launcher
IsMountRotatable=True
#Containers
NumberOfContainers=1
Container1=Launcher
#Angles
RestAngles=0,0
LoadAngles=Any
#Loading
AssociatedMagazine=WeaponMagazineTOW
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
VIDIncrease=8  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2  //List of systems

[---------- WeaponMagazines ----------]
############################################################
# Weapon Magazine Systems
############################################################


[WeaponMagazine50cal]
NumberOfAmmunitionTypes=1
Ammunition1_Count=2000
Ammunition1=usn_cal_05in
ModuleType=SmallMagazine

[WeaponMagazineTOW]
NumberOfAmmunitionTypes=1
Ammunition1=usa_bgm-71a
Ammunition1_Count=7
ModuleType=SmallMagazine


