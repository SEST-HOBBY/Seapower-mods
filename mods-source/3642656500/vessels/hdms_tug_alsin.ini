[General]
UnitType=Vessel
DefaultCameraDistance=1.5
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.05

Length=24                     // in meters
Beam=15.3                      // in meters

CompartmentsHeight=0.03       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[Physics]
#all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=140              // in tons

MaxForwardVelocity=11        // sets the max forward velocity
MaxBackwardVelocity=3        // sets the max backward velocity
LinearDrag=0.962                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.28
MinAccelerationFactor=0.1

RudderTurnRate=9.0             // turn rate of the rudder in degrees per second
RudderForce=0.54                // multiplicator defining how agile the ship can turn

TiltFactor=1.2                 // defines how strong the tilting will be
PitchFactor=0.3                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.0                  // default trim depth in 
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Meager
# Radar related (RCS => radar cross section)
RCS=250
# Sonar related
BaseNoise=132                    // base sound level in db at 1m distance
FlowNoise=0.55                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=4                // additional noise for cavitation in db
BladesCount=4					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=4 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

MachineryRaftingGeneration=1
PropellerType=Regular
NoiseFrequencies=LF,MF
TonalRPMModifier=100
DistinctiveNoise=True
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset
LowMagneticHull=False

