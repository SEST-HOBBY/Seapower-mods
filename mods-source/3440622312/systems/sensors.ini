[CEAFAR]
#Users: ran_ffh_anzac
Kind=Radar
Type=DirectedSearch    // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface               // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=20      // if applicable number of targets it can track simultaneously
WeaponChannels=10      // if applicable number of weapons (missiles) it can guide simultaneously
RPM=0                  // revolutions per minute
MinRange=0.1           // min range in km
MaxRange=400.0         // max range in km
MinAltitude=9         // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=30   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.5          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=47.0              // gain in dB on the sensor
Frequency=S-Band       // frequency band
PeakPower=2500.0       // output peak power in kW
ModuleType=BigSensor

