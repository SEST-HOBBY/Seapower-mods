[AmmunitionNames]
RIM-162 ESSM=RIM-162,ESSM Blk II,SAM/ASuW,The RIM-162 Evolved SeaSparrow Missile (ESSM) is a development of the RIM-7 Sea Sparrow missile used to protect ships from attacking missiles and aircraft. ESSM is designed to counter supersonic maneuvering anti-ship missiles. ESSM also has the ability to be "quad-packed" in the Mark 41 Vertical Launch System, allowing up to four ESSMs to be carried in a single cell.
RIM-174B=RIM-174B,SM-6 Block 1a,SAM/ASuW,The RIM-174 Standard Extended Range Active Missile (ERAM) or Standard Missile 6 (SM-6) is designed for extended-range anti-air warfare (ER-AAW) purposes, providing capability against fixed and rotary-wing aircraft, unmanned aerial vehicles, anti-ship cruise missiles in flight, both over sea and land, and terminal ballistic missile defense. It can also be used as a high-speed anti-ship missile.
RGM-184A=RGM-184A,Naval Strike Missile,ASM,The Naval Strike Missile (NSM) is an anti-ship and land-attack missile developed by the Norwegian company Kongsberg Defence & Aerospace (KDA).