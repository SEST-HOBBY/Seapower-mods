usn_agm-65d=AGM-65D,小牛,对地攻击,AGM-65D是美国的红外制导防区外空对地武器，可以在恶劣环境下锁定目标。其使用方式类似于AGM-62，由发射平台的操作员将十字准线对准所需目标进行引导。

usn_agm-88e=AGM-88,哈姆,反辐射,“哈姆”反辐射导弹，美国海军和空军装备的机载空对地高速反辐射导弹。其英文缩写HARM的音译为“哈姆”。用于压制和摧毁敌方地面和舰载防空导弹系统的制导雷达、目标指示雷达和高炮炮瞄雷达。

usn_gbu-12d=GBU-12D,宝石路 II,对地攻击,美国于1970年代对宝石路I系统进行了改进，新的系统拥有可展开的尾翼，使得滑翔距离更远，且更加精准，并且价格更加低廉。改进后的宝石路系统被称为宝石路II。

usaf_gbu-24=GBU-24,宝石路 III,对地攻击,与GBU-10或II型系列相比，GBU-24滑翔距离更远，这是因为采用了更高效的制导技术。然而，III型制导套件更昂贵，这使得GBU-24更适合对付防御严密的高价值目标。

usn_gbu-31_v1=GBU-31(V)1,杰达姆,对地攻击,联合直接攻击弹药,是由波音公司为美国海军和空军联合开发的一种空投炸弹配件，装在由飞机施放的传统炸弹上，将本来无控的传统航空炸弹转变为可控，并能在恶劣气象条件下使用的精确制导武器。

usn_lrasm=AGM-158C,LRASM,反舰,AGM-158C（远程反舰导弹）是AGM-158家族中的智能反舰导弹，集成高机动性，低雷达反射面积，强机动性和电子对抗能力，射程达1000KM以上，呈数量齐射可对大型水面舰队造成毁灭性打击。

usn_agm-88g=AGM-88G,哈姆增程,反辐射,AGM-88G，AAGRM-ER（哈姆增程导弹）弹是美国诺斯罗普-格鲁曼公司研制的最新型空射战术导弹系统，是AGM-88E型的增程型号，主要用于压制敌方陆基、海基防空系统作战 。该导弹在AGM-88E型基础上改进，优化了弹体结构与动力系统，采用新型制导组件和固体火箭发动机，显著提升射程与机动性 。2021年7月首次实弹测试后，2024年形成初始作战能力并装备F-35与F/A-18战斗机
