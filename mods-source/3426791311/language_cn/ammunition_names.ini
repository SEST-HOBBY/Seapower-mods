[AmmunitionNames]
# ------------------ AAM ------------------
usn_aim-9m=AIM-9M,响尾蛇,空对空,AIM-9M响尾蛇是美国的红外制导空对空导弹，M型在L型的基础上增加了抗干扰能力，且采用了低尾焰发动机，不容易在近距离使用时被发现。

usn_aim-9x=AIM-9X,响尾蛇,空对空,AIM-9X响尾蛇是美国的红外制导空对空导弹，X型进行了大幅度的升级，拥有强大的抗干扰能力更远的射程，以及令人印象深刻的越肩发射能力。

usaf_aim-120c=AIM-120C,阿姆拉姆,空对空,AIM-120是美国的的主动雷达制导空对空导弹，用于取代老旧的麻雀半主动雷达制导空对空导弹，其体积小巧。可以被大部分飞机携带。

usn_aim-174b=AIM-174B,神枪手,空对空,AIM-174B是RIM-174B(SM-6 BLOCK1A DUL II)的空射型号，去掉了MK-72一级助推器，并为空中发射设计了全新的火控软件与飞控。其最大射程与最大杀伤拦截距离极其惊人，俄罗斯空天军认为AIM-174B可以在超过450KM的距离上直接越过护航机队击落后方的预警机和加油机等重要空中节点，并很可能保留了标准6在末端对抗弹道导弹和高超音速导弹的能力，这极大扩展了美国航母战斗群的防空火力圈。

usaf_aim-120d-3=AIM-120D-3,AMRAAM,空对空,AIM-120D-3是RTX公司为AIM-120家族进行的最终升级，主要集中在飞控与软件升级上，通过增强的作战与控制芯片来优化导弹发动机的燃油利用率，并使导弹的舵面能在更高的高空与更稀薄的大气中保持正常运行，这使得AIM-120导弹的射程在不进行硬件升级的情况下大幅提升。与标准6类似的反导特化战斗软件使得AIM-120也能具备一定的反导作战能力，并且该能力已在红海的作战中得到检验。
