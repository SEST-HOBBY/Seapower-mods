[usn_fa-18f_blk3]
Type=战斗机
Default=F/A-18F Block3,F/A-18F Block3
DefaultDescription=超级大黄蜂Block3是波音公司自2021年开始为美国海军交付的F/A-18E/F战斗机的最终改进型，美国海军采购78架新生产的超级大黄蜂Block3型，而现有的Block2型会在进行增寿改进后全部达到Block3的标准。Block3型号主要对座舱，机体强度，雷达，电子设备，发动机，航程等进行了大幅度的升级，包括增推型F414-GE-400引擎，APG-79(v)雷达,数字化大屏幕座舱，可达15000小时总飞行寿命的强化机体，以及低阻力保形油箱，强化的被动电子战能力则增强了大黄蜂的生存能力，使其在未来战场保持竞争力。
