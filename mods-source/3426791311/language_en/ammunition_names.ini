usn_agm-65d=AGM-65D,Maverick,AGM,The AGM-65D is a US infrared-guided standoff air-to-ground weapon that can lock onto targets in adverse environments. It is used in a similar manner to the AGM-62, with the operator at the launch platform directing the crosshairs toward the desired target for guidance.

usn_agm-88e=AGM-88,HARM,ARM,AGM-88 is an airborne high-speed anti-radiation missile equipped by the U.S. Navy and Air Force. Its English abbreviation HARM is used to suppress and destroy the guidance radar, target indication radar and anti-aircraft gun aiming radar of enemy ground and ship-based air defense missile systems.

usn_gbu-12d=GBU-12D,Paveway II,AGM,The United States improved the Paveway I system in the 1970s. The new system had a deployable tail, which made the glide farther, more accurate, and cheaper. The improved Paveway system was called Paveway II.

usaf_gbu-24=GBU-24,Paveway III,AGM,The GBU-24 has a longer glide range than the GBU-10 or Type II series due to the use of more efficient guidance technology. However, the Type III guidance kit is more expensive, making the GBU-24 more suitable for engaging heavily defended high-value targets.

usn_gbu-31_v1=GBU-31(V)1,JDAM,Land Strike,The Joint Direct Attack Munition is an air-dropped bomb accessory developed jointly by Boeing for the U.S. Navy and Air Force. It is installed on traditional bombs dropped by aircraft to transform the originally uncontrolled traditional aerial bombs into controllable precision-guided weapons that can be used in severe weather conditions.

usn_agm-88g=AGM-88G,AAGRM-ER,ARM,The AGM-88G, AAGRM-ER (Hamm Extended Range Missile) missile is the latest air launched tactical missile system developed by the American company Northrop Grumman. It is an extended range model of the AGM-88E and is mainly used to suppress enemy land-based and sea based air defense systems. The missile has been improved based on the AGM-88E model, with optimized body structure and power system. It adopts new guidance components and solid rocket engines, significantly improving range and maneuverability. After the first live fire test in July 2021, the initial combat capability will be formed and equipped with F-35 and F/A-18 fighter jets by 2024

usn_lrasm=AGM-158C,LRASM,ASM,AGM-158C (Long Range Anti Ship Missile) is an intelligent anti-ship missile in the AGM-158 family, integrating high maneuverability, low radar reflection area, strong maneuverability, and electronic countermeasures capabilities. It has a range of over 1000KM and can cause devastating strikes to large surface fleets in a salvo fire.
