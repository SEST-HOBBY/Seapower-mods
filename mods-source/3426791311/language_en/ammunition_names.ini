[AmmunitionNames]
# ------------------ AAM ------------------
usn_aim-9m=AIM-9M,Sidewinder,AAM,The AIM-9M Sidewinder is an American infrared-guided air-to-air missile. The M model has increased anti-interference capability based on the L model, and uses a low-tail flame engine, making it difficult to be detected when used at close range.

usn_aim-9x=AIM-9X,Sidewinder,AAM,The AIM-9X Sidewinder is an American infrared-guided air-to-air missile. The X-model has been significantly upgraded, with strong anti-jam capabilities, a longer range, and an impressive backwards firing capability.

usaf_aim-120c=AIM-120C,AMRAAM,AAM,AIM-120 is an active radar-guided air-to-air missile of the United States, used to replace the old Sparrow semi-active radar-guided air-to-air missile. It is relatively small and can be carried by most aircraft.

usaf_aim-120d-3=AIM-120D-3,AMRAAM,AAM,The AIM-120D-3 is the final upgrade carried out by RTX for the AIM-120 family, mainly focusing on flight control and software upgrades. It optimizes the fuel efficiency of missile engines through enhanced combat and control chips, and enables the missile's control surface to operate normally at higher altitudes and thinner atmospheres. This greatly increases the range of the AIM-120 missile without hardware upgrades. The specialized anti missile combat software similar to Standard 6 enables the AIM-120 to have certain anti missile combat capabilities, and this capability has been tested in operations in the Red Sea.

usn_aim-174b=AIM-174B,Gunslinger,AAM,The AIM-174B Gunslinger air-to-air missile is a long-range air-to-air missile developed by the US defense contractor Raytheon for the US Navy. The US Navy describes the AIM-174B as an "air-launched version" of the SM-6. Currently, only the F/A-18E/F Super Hornet fighter jet is capable of carrying and launching the AIM-174B.
