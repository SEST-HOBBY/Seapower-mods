[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.6
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.2

Length=95                      // in meters
Beam=14.2                      // in meters

CompartmentsHeight=0.1         // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_eoss_stab_thermal
DefaultView=binocular_7x50

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=2400              // in tons

MaxForwardVelocity=24.0        // sets the max forward velocity
MaxBackwardVelocity=9.0        // sets the max backward velocity
LinearDrag=0.90                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.98
MinAccelerationFactor=0.12

RudderTurnRate=4.2             // turn rate of the rudder in degrees per second
RudderForce=0.80               // multiplicator defining how agile the ship can turn

TiltFactor=2.0                 // defines how strong the tilting will be
PitchFactor=0.5                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0                    // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=9.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=130                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=4					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_ita_fs_ppx

[---------- AI related ----------]
[AI]
UnitCostValue=4000            // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=3
ASuW_Capability=2
ASW_Capability=3

#Defence
MissilesToSaturate=3      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=2     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD    //Anti-Missile Defence
ATD_Capability=TBD      //Anti-Torpedo Defence

#Special
Role=AAW,ASW,ASuW

