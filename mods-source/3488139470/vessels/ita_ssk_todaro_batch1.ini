[General]
UnitType=Submarine
DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.8
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.0

Length=56.00                      // in meters
Beam=6.80                         // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1830               // in tons

MaxForwardVelocity=20.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=12.0
MaxBackwardVelocitySurfaced=5.0
MaxBackwardVelocity=5.0        // sets the max backward velocity
TelegraphVelocities=-5,0,5,7,9,14,20

BowUnderWater=16.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=27.0            // depth in feet, from where the sail is under water
LinearDrag=0.85                // this is for velocity damping (linear drag)
MaxAccelerationFactor=6.0
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.6                // multiplicator defining how agile the ship can turn

MaxPitchAngle=12        //20.0
PitchChangeRate=2.0
MaxRollAngle=12.0       //15.0
RollChangeRate=5.0

BallastTankChangeRate=0.0005  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=8.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=0     //-3.5	//5.5                 // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0        //0.1251 //-0.0551           //-0.0551            // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=34         //34.3            // in feet
CrushDepth=2296              // in feet

CavitationParameters=18		   // defines the speed in knots at 100m depth that the submarine will cavitate at

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
LowMagneticHull=True
# Sonar related
BaseNoise=85                   // base sound level in db at 1m distance
FlowNoise=0.5                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10              // additional noise for cavitation in db
TargetReflectionStrength=10     // in dB for broad side
BladesCount=7                   //number of blades on vessel's propulsion systems
ElectricFrequency=50            //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
PropellerType=Skewback
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset
MachineryRaftingGeneration=5
MinNoiseClassificationTreshold=7
NoiseFrequencies=LF,MF
TonalRPMModifier=100
DistinctiveNoise=False
LaunchTransientMitigation=12

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_type_212a

[---------- AI related ----------]
[AI]
UnitCostValue=10000            // value for the unit cost for least valuable target checks
UnitScoreValue=6              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=6
ASW_Capability=6

#Defence
#Special
Role=SSK

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=2923
AdditionalNoise=16        //Added to current noise level when running on this power
Collider=coll_engineroom

[SnorkelMastSystem]
MaxForwardVelocity=9
Collider=coll_snorkel_mast
Mount=Snorkel
OpenSystemAnimation=RaiseSnorkel
CloseSystemAnimation=LowerSnorkel
ModuleType=Inert

[AuxPowerSystem]
Type=AIP
HorsePower=2923
;MaxForwardVelocity=5
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
Capacity=68000
DischargeRate=0.95      //Rate of discharging batteries. Lower values provide more range on low underwater speed on batteries
RechargeRate=1.4        //Capacity per second when charging batteries. When a unit goes at Standard telegraph setting or slower, the charge rate doubles
Collider=coll_battery_1,coll_battery_2

# 20 kn ˜ 67 nm
# 9 kn ˜ 335 nm
# 5 kn ˜ 1115 nm


[PropulsionSystems]
############################################################
# Propulsion Systems
############################################################
