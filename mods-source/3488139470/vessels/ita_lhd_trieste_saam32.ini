[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=5.0
MinCameraDistanceForeAft=3.0
MinCameraDistanceBroadside=1.2
CameraPivotHeight=0.3

Length=245                    // in meters
Beam=47                       // in meters

CompartmentsHeight=0.2        // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_eoss_stab_thermal
DefaultView=binocular_7x50


[---------- FlightDeck Definitions ----------]
# Flugdeck nach dem Muster der Canberra (ran_lhd-cv_canberra.ini), angepasst an die Trieste (01.11.2026)
