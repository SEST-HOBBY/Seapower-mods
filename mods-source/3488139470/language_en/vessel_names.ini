[ -------------- Frigates --------------- ]
[ita_ffg_fremm]
Type=FFG,Guided Missile Frigate
Default=Bergamini class (GP),Bergamini
DefaultDescription=The FREMM (European Multi-Mission Frigate) is a family of modern guided missile frigates collaboratively designed by Italy and France in the early 2000s to replace their aging classes of cold war frigates. The Italian Navy ordered their set of FREMMs as the Bergamini class in 2006 to personalized designs, splitting them into one group of general purpose frigates and another group geared towards anti-submarine warfare respectively. The majority of the class would consist of the 'General Purpose' version, featuring a heavier gun armament while omitting the variable depth sonar.
Variant1=(F 590) Carlo Bergamini,Carlo Bergamini
Variant2=(F 595) Luigi Rizzo,Luigi Rizzo
