[ -------------- Destroyers --------------- ]
[ita_ddg_orizzonte]
Type=DDG,Destroyer
Default=Andrea Doria class,Andrea Doria
DefaultDescription=The Andrea Doria class is the Italian version of the advanced Franco-Italian Horizon guided missile destroyer family. Developed as a next-generation air-defense frigate to replace the aging AAW classes of France, Italy and the UK in the 1990s the class featured modern and powerful sensors and was to carry the new and advanced PAAMS integrated anit-air missile system. After the UK dropped out of the project in 1999 due to diverging requirements Italy and France would continue on their own, with the respective versions of the class for each nation featuring slightly different sensors and weapons. While Italy originally planned to accquire six ships of the type to replace the Andrea Doria class cruisers and Audace class destroyers this would drop to two ships by the turn of the century.
Variant1=(D 553) Andrea Doria,Andrea Doria
Variant2=(D 554) Caio Duilio,Caio Duilio

