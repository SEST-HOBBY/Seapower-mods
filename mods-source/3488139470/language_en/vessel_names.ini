[ita_ffg_ppa]
Type=FFG,Guided Missile Frigate
Default=Thaon di Revel class,Thaon di Revel
DefaultDescription=The Thaon di Revel class is a highly modular class of multipurpose offshore patrol ships developed for the Italian Navy. These vessels are distinguished by their "double-bow" hull design, which improves hydrodynamic efficiency and increases maximum speed in rough sea states. The class is built on a "plug-and-fight" architecture, allowing the ship to be configured into three distinct variants: Light, Light+ and Full, which is the current configuration. 
Variant1=(P 430) Paolo Thaon di Revel,Thaon di Revel
Variant2=(P 431) Francesco Morosini,Francesco Morosini
Variant3=(P 432) Raimondo Montecuccoli,Montecuccoli
Variant4=(P 434) Giovanni delle Bande Nere,Bande Nere
Variant5=(P 436) Domenico Millelire,Domenico Millelire

[ita_ffg_ppa_evo]
Type=FFG,Guided Missile Frigate
Default=Thaon di Revel EVO Class,Thaon di Revel
DefaultDescription=The Thaon di Revel class is a highly modular class of multipurpose offshore patrol ships developed for the Italian Navy. These vessels are distinguished by their "double-bow" hull design, which improves hydrodynamic efficiency and increases maximum speed in rough sea states. The class is built on a "plug-and-fight" architecture, allowing the ship to be configured into three distinct variants: Light, Light+ and Full, which is the current configuration. The modernized EVO version carries 64 VLS cells, replacing the modular section midship, and a new pair of 30 mm CIWS in place of the 25 mm light cannons.
Variant1=(P 433) Marcantonio Colonna,Marcantonio Colonna
Variant2=(P 435) Ruggiero di Lauria,Ruggiero di Lauria

[ -------------- Submarines --------------- ]
[ita_ssk_todaro_batch1]
Type=SSK,Attack Submarine
Default=Todaro class (Batch I),Todaro
DefaultDescription=The Todaro is the Italian variant of the German Type 212A. Designed as a modern air-independent propulsion (AIP) attack submarine the Todaro-class emphasizes stealth, endurance, and ambush capability in both littoral and open-ocean environments. A low-signature hull, quiet electric drive, and fuel-cell AIP enable prolonged submerged operations at very low acoustic output, supporting covert patrols and patient target prosecution. The combat system integrates a comprehensive sonar suite, including flank and intercept sensors plus a towed array for improved long-range detection - allowing the boat to build a high-quality underwater picture while minimizing emissions. Primary lethality is delivered through heavyweight wire-guided torpedoes for anti-submarine and anti-surface warfare, complemented by layered soft-kill countermeasures to break torpedo engagements and regain separation. Overall: a highly survivable, intelligence-capable hunter optimized for covert presence and decisive underwater strikes rather than high-speed pursuit.
Variant1=(S 526) Salvatore Todaro,Salvatore Todaro
Variant2=(S 527) Scire,Scire
Variant3=(S 528) Pietro Venuti,Pietro Venuti
Variant4=(S 529) Romeo Romei,Romeo Romei