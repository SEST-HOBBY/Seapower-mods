[Language_en]
Name=Flight Deck Ops
Description=Formerly, the FDO was known as the Air deck operations upgrade. Generally, the mod activates all elevators and allows simultaneous launch/recovery. Besides that, the mod changes many other things like taxi and landing paths, crew that appears by the catapults when a plane is about to launch, etc.

[h1]Clear the deck extension[/h1]
The [u][url="https://steamcommunity.com/sharedfiles/filedetails/?id=3466015602"]FDO - CTD[/url][/u] extension allows for the use of on-deck aircraft and restricts certain plane types on CV/CVN to using only 3 (US) or 2 (Soviet) cats. Other planes initially use 3/2 cats, but after the bow deck is cleared, they utilize all 4/3. The core logic of the FDO - CTD is the same as in the base FDO mod.

[h1]FDO features[/h1] 
Some features have been incorporated into the base game [u][url="https://steamcommunity.com/app/1286220/eventcomments/507318376365854762?snr=2_9_100000_"]patch 0.1.1.2[/url][/u]. These are:
[list]
[*]Simultainous movment of elevators and hangar doors
[*]Initial waypoint for taking-off helos (rally point)
[*]New holding and landing patterns for planes
[*]Introduced holding and landing patterns for helos
[*]Increased landing intensity of planes and helos
[/list]

Below are features that are still only in the FDO:
[h3]CV and CVN[/h3]
[list]
[*][b]Simultaneous launch/recovery[/b].
[*][b]Take-off intensity is closer to reality[/b]. IRL on US carriers it's 2 planes per circa 40 sec in daytime and 1 plane per circa 60 sec in nighttime. In the FDO it is averaged to 2 planes per circa 60 sec all the time.
[*][b]All elevators are utilized but not simultaneously[/b]. To see the whole launching cycle a few planes must be ordered to go at once.
[*][b]Better positions on elevators[/b]. Big planes (RA-5C, A-3B) take an angled position, S-3A and FA-18A are positioned more in the middle.
[*][b]Hiding hangar railings[/b].
[*][b]No taxi collisions[/b]. If a taxiway is blocked by a taking-off aircraft, the next aircraft will wait until the path is clear.
[*][b]Smart crew[/b]. Crew appears near the catapults when the plane is about to launch or near the STOL launching spot of the Harrier and Yak-38. For each type of the aircraft there is slightly different arrangement of the cat crew. 2 blue shirts appear near each elevator when it is in use.
[*][b]Sectional deflectors[/b]. The deflector's segmentation was designed to adjust the deflector width to different aircraft types. In practice, the crew usually chooses the simplest variant - all up. The segmentation is mainly helpful during maintenance.
[*][b]No cat collisions[/b]. Simultainously 2 cats are used in pairs: 1-2; 1-3; 1-4. These limitations are introduced not only to achieve desired launching efficiency. Note, on US carriers runway catapults are slightly angled towards and very close to each other. It limits its simultaneous usage due to risk of planes ramming each other and risk of air flow disturbance caused by jet engine of previous plane. Waist cats endings are very or too close to port bow cat and deflector, so some planes can't avoid wingtips collision or deflector ramming when it is in up position.
[*][b]Limitations on bow cats (1-2)[/b]. Not every pair of planes is possible. Only the Forrestal class hasn't got restrictions. The Nimitz and Orel classes are the most restrictive.
[*][b]Limitations on port elevator on the Forrestal class[/b]. During take-off, when waist cats are in use, it lifts only 1 plane up. Generally, runway elevator was designed to serve landing planes too but it turned out, it extends intervals between touchdowns. That's why very often port elevator wasn't used. In the FDO it is used.
[*][b]Different holding and landing patterns[/b]. Depending on vessel - nighttime/instrument or daytime/visual or mixed.
[*][b]Various time gap between touchdowns[/b]. 50 - 80 seconds depending on vessel.
[*][b]2 elevators serve landing planes[/b]. Some types of planes use only 1 elevator (E2 or E4) and some use both.
[*][b]More typical positions of helo launching spots[/b].
[*][b]2 helos can land Simultaneously[/b].
[*][b]Harriers/Yak-38s usage[/b]. Planes take-off in short or vertical manner depending on vessel. In the late 70's AV-8A Harriers were embarked aboard the USS Franklin D. Roosevelt (CV-42), to prove the concept of integrating Harrier into catapult and barrier configured carrier's air wing. It was successful but the concept wasn't developed further because both USN and USMC considered it as contradictory to their interests - Navy feared of losing funds for catapults and Marine feared of losing funds for dedicated helicopter carriers.
[*][b]New details[/b]. Forklifts, ordnance trolleys, hydraulic ground handling wheels, hook runners, white shirts.
[*][b]4 DC teams instead of 3[/b].
[/list]

[h3]Tarawa (landing ship)[/h3]
Adjusted from CV and CVN logic with:
[list]
[*][b]No simultaneous launch/recovery[/b].
[*][b]Separated plane/heli ops[/b].
[*][b]Simultaneous vertical landing of 2 planes[/b].
[/list]

[h3]Kiev (reclassified as an aircraft cruiser)[/h3]
Adjusted from Tarawa logic with:
[list]
[*][b]Limited Yak-38 flight deck ops[/b]. IRL, vertical take-offs generally were restricted to spots 3, 4, 5 due to problems with airflow and formations composed of 3 planes. Spots 1, 2, 6 were used very very rare.
[*][b]Utilization of 7 launch spots by helis[/b].
[/list]

[h3]Moskva (reclassified as a helicopter cruiser)[/h3]
Adjusted from Kiev logic with with:
[list]
[*][b]Cleand up take-off procedure[/b]. It doesn't allow to lift helos up when all launching spots are occupied. Rear elevator is blocked when spots 3, 4 are busy. Elevators don't work simultaneously to make launching ops more orderly.
[/list]

[h1]Compatibility[/h1]
[list]
[*][u][url=https://steamcommunity.com/sharedfiles/filedetails/?id=3411771040]Flight Deck Ops - cruisers, destroyers, frigates[/url][/u]. Fully compatible. Load order doesn't matter.
[*][u][url=https://steamcommunity.com/sharedfiles/filedetails/?id=3411771040]Flight Deck Ops - Clear the deck[/url][/u]. Fully compatible. Load above the FDO.
[/list]

