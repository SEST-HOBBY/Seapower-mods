[---------- General Data ----------]
[General]
UnitType=Vessel
Role=Carrier
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=2.7
MinCameraDistanceBroadside=0.9
CameraPivotHeight=0.25

Length=273                    // in meters
Beam=31                       // in meters

CompartmentsHeight=0.2       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None
NumberOfDCTeams=4

[OpticalView]
Views=binocular_8x50,binocular_12x50,bridge_binocular_20x120_stab_soviet
DefaultView=binocular_8x50

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=41370            // in tons

MaxForwardVelocity=32.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.97                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.41
MinAccelerationFactor=0.1

#These values work out to about 820 yards turning circle at full speed which is in line with Iowa
RudderTurnRate=1.5             // turn rate of the rudder in degrees per second
RudderForce=0.35               // multiplicator defining how agile the ship can turn

TiltFactor=7.0                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=4		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=15.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge
# Sonar related
BaseNoise=165                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10               // additional noise for cavitation in db
#TargetReflectionStrength=25     // in dB for broad side
BladesCount=4                   //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=5
#NumberOfAnimationReferences=6	//CTD
AnimationFile_1=animations_wp_takr_kiev
AnimationFile_2=animations_rails-launcher
AnimationFile_3=animations_sa-n-4
AnimationFile_4=animations_rbu-6000
AnimationFile_5=animations_wp_takr_kiev_fdo
#AnimationFile_6=animations_wp_takr_kiev_fdo_udp	//CTD

[---------- AI related ----------]
[AI]
UnitCostValue=8000            // value for the unit cost for least valuable target checks
UnitScoreValue=10             // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=6
ASuW_Capability=9
ASW_Capability=6

#Defence
MissilesToSaturate=12       //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=5       //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD          //Anti-Missile Defence
ATD_Capability=TBD          //Anti-Torpedo Defence
