[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=100000              // in tons

MaxForwardVelocity=32.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.97                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.29
MinAccelerationFactor=0.1

#These values work out to about 820 yards turning circle at full speed which is in line with Iowa
RudderTurnRate=1.5             // turn rate of the rudder in degrees per second
RudderForce=0.4               // multiplicator defining how agile the ship can turn

TiltFactor=7.0                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line
CavitationSpeed=4		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[SensorData]
#Visual
VisualIdentificationRange=15.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge
# Sonar related
BaseNoise=170                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
Prairie=True					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=2
#NumberOfAnimationReferences=4	//CTD
AnimationFile_1=animations_usn_cvn_nimitz
AnimationFile_2=animations_usn_cvn_nimitz_fdo
#AnimationFile_3=animations_usn_cvn_nimitz_fdo_udp	//CTD
