UnitCostValue=10000            // value for the unit cost for least valuable target checks
UnitScoreValue=15              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=2
ASuW_Capability=2
