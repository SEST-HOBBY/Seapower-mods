; Existing CPI-based entries are purchasing-power estimates, not current quotes.
; Model estimates are author comparisons, NOT published prices for that aircraft.
; No loaded weapons, spares, training or lifetime operating costs.
; Blank means unknown. Inline [General] values take precedence by default.
; Extend this file with #!extend systems/aircraftcosts.ini.
; See AIRCRAFT-PRICE-SOURCES.md. Restart after editing.

