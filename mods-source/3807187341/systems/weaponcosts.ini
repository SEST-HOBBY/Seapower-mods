; Additional missing-price estimates: PRICE-GAPS-20260924.md (no new inflation calculation).
; Shared settings and weapon category visibility: systems/combatcosts/config.ini
; Inline [General] prices/categories win by default; missing keys fall back to this list.
; [Costs] OverrideInline=True makes this entire list take precedence.
; Per entry: OverrideInline=True/False; OverrideWeaponCosts=True/False; OverrideCurrentYearCost=True/False.
; Per entry: OverrideCategory=True/False selects the Category source independently.
; Specific field > entry > list > default False. Preferred blank/invalid prices remain unknown.
; Weapon Costs 0.2.0 - USD per launched round. All populated prices are estimates.
; Rounded IOC-era values, using family proxies where necessary. See PRICE-SOURCES.md.
; Blank = unknown, never free. CurrentYearCost is an independent USD value.
; Prefer comparable recent purchase prices; otherwise use a documented estimate or CPI fallback.
; Existing CPI-based entries are purchasing-power estimates, not current quotes.
; Other mods: #!extend systems/weaponcosts.ini, then override [ammunition_reference].

[Costs]
OverrideInline=False

