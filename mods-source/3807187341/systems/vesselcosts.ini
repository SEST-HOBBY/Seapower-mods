; Capital-ship review: CAPITAL-SHIP-PRICE-REVIEW.md (2026-09-24); no automatic inflation added.
; Additional missing-price estimates: PRICE-GAPS-20260924.md (no new inflation calculation).
; Inline [General] prices/categories win by default; missing keys fall back to this list.
; [Costs] OverrideInline=True makes this entire list take precedence.
; Per entry: OverrideInline=True/False; OverrideVesselCosts=True/False; OverrideCurrentYearCost=True/False.
; Per entry: OverrideCategory=True/False selects the Category source independently.
; Specific field > entry > list > default False. Preferred blank/invalid prices remain unknown.
# Weapon Costs 0.3.0 - vessel values in USD.
# Fitted ship only: do not add loaded ammunition or embarked aircraft to VesselCosts.
# Shared price toggle: systems/combatcosts/config.ini [Costs] UseCurrentYearCosts.
# VesselCosts = rounded first-service/reference-year USD estimate.
# CurrentYearCost = independent current USD value. Prefer comparable recent purchase prices; otherwise use a documented estimate or CPI fallback.
# Existing CPI-based entries are purchasing-power estimates, not current quotes.
# Blank = unknown, never free. Inline [General] values take precedence by default.
# Inline [General]: VesselCosts=, CurrentYearCost=, VesselCostCategory=DDG
# Other mods: #!extend systems/vesselcosts.ini
# Sources, estimate scope and family proxies: VESSEL-PRICE-SOURCES.md
# model estimate = author comparison, not a published price for that class.
# Family price years approximate first service; concept ships use a donor/reference year.
# Category is editable here; language files are not read for classification at runtime.

[Costs]
OverrideInline=False

[Categories]
Order=CVN,CV,CVL,CVS,CVH,BB,BC,CGN,CG,CL,DDG,DD,DDH,DDE,FFG,FF,DE,FS,FSG,SSBN,SSGN,SSN,SSK,SSG,SS,LPH,LHA,LHD,LPD,LSD,LST,AOE,AO,AE,AG,MSC,MSO,MCM,FAC,OPV,PC,PG,PT,PB,Merchant,Fishing,Other

