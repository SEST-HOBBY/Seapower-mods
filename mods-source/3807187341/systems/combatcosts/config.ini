; Combat Cost Tracker configuration. English labels; all stored prices and GDP values are USD.
; Other mods: #!extend systems/combatcosts/config.ini
; Currency and country changes in the panel last for this session. Edit this file for defaults.

[Costs]
UseCurrentYearCosts=False
CurrentYear=2026-08

[Overlay]
ToggleKey=F11
VisibleOnStart=True
BackgroundAlpha=0.38
Top=110
Right=16
Scale=1.5
ShowRatios=True

[WeaponCategories]
Order=SAM,ASM,AAM,ARM,Land Attack,ASW,Ballistic,ICBM,ATGM,Torpedo,Bomb,Rocket //SAM,ASM,AAM,ARM,Land Attack,ASW,Ballistic,ICBM,ATGM,Torpedo,Bomb,Rocket,Gun,Decoy,Other
AlwaysShow=SAM,ASM

[Display]
; The panel has currency, economy and year dropdowns plus a mode button.
Mode=Currency
Currency=USD
Economy=USA
; Economy mode divides the selected USD cost basis directly by GDP.
ReferenceYear=Auto
; Auto: freeze latest initial unit service-entry year <=2050 after loading; nearest year, ties up.
; Reinforcements never change Auto. The Year dropdown permits manual changes.
; Currencies and economies use this same year. No extrapolation beyond the data endpoints.
ReferenceYears=1960,1970,1980,1990,2000,2010,2020,2025

