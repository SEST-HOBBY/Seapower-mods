; Misc comparison units. PriceYYYY is nominal USD per ONE displayed unit, using a decimal point.
; Extend with: #!extend systems/combatcosts/misc.ini
; The selected Year reads its exact PriceYYYY key. No interpolation, inflation or online updates.
; Repeat a price in every year to make a fixed comparison available in all periods (e.g. RTX 5090).
; Such fixed comparisons are intentionally available before the product existed.
; DecimalPlaces=0 displays complete purchasable units (floor); positive fractions below one show <1.
; DecimalPlaces=1..8 allows fractional units. Blank/zero/negative PriceYYYY is unavailable.
; Configure [Display] Misc=BTC (or another ID) in config.ini to select a default; blank selects Currency.
; Use [Misc_UNIQUE_ID] with Name, ShortName, Unit, DecimalPlaces, Basis and PriceYYYY keys.
; Sources and benchmark assumptions: MISC-SOURCES.md in the mod folder.

[Misc_BTC]
; Coin Metrics daily PriceUSD on December 31 of each year. Not a live quote. Years before available Bitcoin observations remain blank.
; Source: https://github.com/coinmetrics/data
Name=BTC Bitcoin
ShortName=BTC
Unit=BTC
DecimalPlaces=0
Basis=year-end snapshot
Price1960=
Price1970=
Price1980=
Price1990=
Price2000=
Price2010=0.30
Price2020=29022.67
Price2025=87516.98

