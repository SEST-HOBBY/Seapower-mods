5p26m=Позитив-M|Позитив-M, также известный как 5P-26M, представляет собой активный трехмерный многолучевой радиолокатор воздушного и наземного поиска.
5p27m_Furke2=Фуркэ-2|5Р-27М "Фуркэ-2" - это радиолокатор воздушного и надводного поиска, поставляемый на вооружение корветов пр. 20380 ВМФ России с 2006 года. Поворотная антенна радиолокатора установлена на самой высокой точке носовой мачты и защищена куполом.
5p27_Furke4=Фуркэ-4|5Р-27 "Фурке-4" - это радиолокатор воздушного и надводного поиска, поставляемый на вооружение фрегатов пр. 22350 ВМФ России с 2018 года.
mr760_Fregat_m2m=Фрегат М2М|Радиолокатор воздушного и надводного поиска "Фрегат М2М"
Zaslon=Заслон|"Заслон" - это современный многофункциональный радар с активной фазированной антенной решеткой (АФАР), разработанный для корветов проектов 20385 и 20386. Радар предназначен для обеспечения наземного и воздушного наблюдения, обнаружения целей, сопровождения целей и управления огнем, включая целеуказание и управление корабельными орудийными установками.
5p20k_Poliment=5П-20К Полимент|РЛС с активной фазированной антенной решеткой 5П-20К "Полимент" представляет собой четырехстороннюю РЛС с активной фазированной антенной решеткой, разработанную для фрегатов пр. 22350 ВМФ России в составе системы противовоздушной обороны "Полимент-Редут". 

#---Surface only---
5p20k-a=Монумент-А|РЛС 5П-20К-А, также известная как "Монумент-А", представляет собой радиолокационную станцию с активной фазированной антенной решеткой, разработанную для корветов пр. 20380 ВМФ России.
34k1_Monolit=34К1 Монолит|Радиолокатор дальнего поиска поверхности, разработанный для кораблей класса фрегат.
pal_n=Пал-Н|"Пал-Н" - навигационный радар.
mr-231-2=МР-231-2|"МР-231-2" - навигационный радар.


