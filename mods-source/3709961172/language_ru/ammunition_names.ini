usaf_gbu-53=GBU-53,StormBreaker,Land Strike,GBU-53 - это высокоточная планирующая бомба воздушного базирования. Бомба была разработана компанией Raytheon. В ходе первоначальных торгов команда Boeing и Lockheed Martin выиграла контракт на разработку бомбы, но он был отложен на несколько лет из-за дела о коррупции Дарлин Дрюин и не был повторно предложен до сентября 2005 года.

