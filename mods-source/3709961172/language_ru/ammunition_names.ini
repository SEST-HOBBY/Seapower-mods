[AmmunitionNames]
wp_sa-n-11=9M311K,Кортик,ЗРК,SA-N-11 Grison (9M311K) - это военно-морская версия SA-19 Grison (2K22 "Тунгуска"/9M311), устанавливаемая на комбинированную систему вооружения "Кортик" ЗРАК. Эта ракета маневренна, быстра и точна вплоть до уровня моря и сохраняет высокую эффективность против маневрирующих целей, таких как "Гарпун", за счет своего чрезвычайно малого веса и малой дальности стрельбы. Это настоящий перехватчик точечной защиты.

wp_sa-n-20=48Н6,С-300ФМ,ЗРК/ПЛО,SA-N-20 Gargoyle (С-300ФМ) - это морская версия ракетного комплекса класса "земля-воздух" наземного базирования SA-10 (С-300ПМ1). Эта мощная система дальнего радиуса действия устанавливалась на советских ракетных крейсерах и по своим характеристикам сравнима с SM-2.

wp_sa-n-20b=48Н6Д,С-300ФМ-1,ЗРК/ПРО,SA-N-20 Gargoyle (С-300ФМ1) - это морская версия зенитно-ракетного комплекса наземного базирования SA-21 (С-400). Эта мощная система дальнего действия устанавливалась на советских ракетных крейсерах и по своим характеристикам сравнима с SM-2ER. Улучшенные характеристики на малых высотах, увеличенная дальность полета и более высокая максимальная скорость - настоящий зенитный ракетный комплекс.

wp_sa-n-28a=9M96,Редут,ЗРК/ПРО,SA-N-28A Growler (9К96 "Полимент-Редут") - это морская версия ракетного комплекса SA-28 Growler (С-350 "Витязь"/С-400 "Триумф"). Первоначально разработанная как легкая, высокоманевренная система противоракетной обороны и платформа для борьбы с крылатыми ракетами, 9М96 представляет собой мощную ракету-перехватчик, отличающуюся исключительной маневренностью и высокой скоростью, а также высокой способностью поражать как быстрые, так и медленные, высокие и низкорамные цели. Отчасти это связано с его активной радиолокационной головкой самонаведения, но также и с расположением двигателя сбоку, что позволяет ему сохранять высокую эффективность в борьбе со всеми типами угроз. Единственным недостатком является то, что эффективная дальность стрельбы составляет всего 50 км, поэтому это ЗРК средней дальности.

wp_sa-n-28b=9M96ДМ,Редут,ЗРК/ПРО,SA-N-28N Growler (9К96 "Полимент-Редут") - это морская версия ракетного комплекса SA-28 Growler (С-350 "Витязь"/С-400 "Триумф"). Первоначально разработанная как легкая, высокоманевренная система противоракетной обороны и платформа для борьбы с крылатыми ракетами, 9М96 представляет собой мощную ракету-перехватчик, отличающуюся исключительной маневренностью и высокой скоростью, а также высокой способностью поражать как быстрые, так и медленные, высокие и низкорамные цели. Отчасти это связано с его активной радиолокационной головкой самонаведения, но также и с расположением двигателя сбоку, что позволяет ему сохранять высокую эффективность в борьбе со всеми типами угроз. Это модернизированная модель 9М96 с увеличенной дальностью действия, с утроенной дальностью действия благодаря значительно увеличенному корпусу самолета и гораздо более высокой максимальной скорости, что делает ее по-настоящему зенитно-ракетным комплексом большой дальности.

wp_ss-n-26a=P-800,Оникс,ПКР,SS-N-26 Strobile (3М55 "Оникс") - советское высокоэффективное сверхзвуковое противокорабельное оружие. Концептуально схожая с ракетами 3М82 "Москит" и 3М45 "Гранит", "Оникс" представляет собой облегченную модель пары противокорабельных ракет нового поколения. Благодаря уменьшенным габаритам, позволяющим использовать ракету Oniks на небольших платформах, таких как самолеты, ракетные катера и старые корабли /подводные лодки, она является чрезвычайно мощной для своих размеров ракетой, использующей головку самонаведения Granit-Elektron, разработанную на базе П-700 "Гранит" и уменьшенную до размеров "Оникс", и обладает чрезвычайно быстрым профилем полета на высоких скоростях. На высоте и на уровне моря. Все это, в сочетании с системой постановки ложных помех нового поколения, терминальными маневрами и вспомогательными возможностями наземной атаки, делает "Оникс" поистине устрашающим оружием.

wp_ss-n-27a=3M54K,Калибр,ПКР,SS-N-27A ("Калибр 3М54К") - российская противокорабельная крылатая ракета, обладающая дозвуковой скоростью и большой дальностью полета, а также чрезвычайно высокоскоростной боевой частью типа "дротик", максимальная скорость которой достигает 3,0 М. Это представляет серьезную угрозу даже для современных систем ПВО и может привести к будет рассматриваться как одна из самых опасных угроз для противокорабельных ракет, если вы позволите ей достичь своей конечной фазы. За пределами конечной фазы эта ракета обладает характеристиками, идентичными характеристикам других дозвуковых крылатых ракет, и представляет собой легкую цель, если ее вовремя обнаружить и привести в действие.

wp_ugst-1=УГСТ,Физик,Торпеда,Торпеда УГСТ «Физик» - это тяжелая торпеда двойного назначения, разработанная на основе неудачных торпедных программ УСЕТ-80 и частично ТЕСТ-71, которые легли в основу противолодочных торпед советского подводного флота. По сравнению с предыдущими торпедами, это новое поколение торпед с улучшенными характеристиками, в основном в кинематике и самонаведении. Активное/пассивное наведение в сочетании с самонаведением в кильватерном следе для атакующих надводных кораблей, все это с использованием высокоразвитого модуля наведения и чрезвычайно сложных возможностей устранения помех/контрмер.

wp_ss-26=9K720,Искандер,ОТР,ОТР "Искандер" - это боевая тактическая ракета, разработанная и использующаяся Россией. Ракета "Искандер" представляет собой одноступенчатую твердотопливную полностью управляемую ракету общей длиной 7,2 метра, максимальным диаметром 0,95 метра, весом более 4500 килограммов и максимальной дальностью полета 480 километров. Ракета запускается с помощью ракетных комплексов, каждый из которых оснащен двумя ракетами. Точность попадания составляет в пределах 30 метров, что обеспечивает высокую точность поражения.

