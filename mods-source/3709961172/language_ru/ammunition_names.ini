usn_rim_66k=RIM-66K,SM-2MR Blk III,SAM,The RIM-66K Standard Missile 2 is the Tartar version of the Block III series. The Block III SM-2MR is developed to increase low altitude performance considerably, and therefore should be considered an exceptional anti-seaskimming SAM for defending against the latest threats. 
usn_rim_66m=RIM-66M,SM-2MR Blk III,SAM,The RIM-66M Standard Missile 2 is the AEGIS VLS version of the Block III series. The Block III SM-2MR is developed to increase low altitude performance considerably, and therefore should be considered an exceptional anti-seaskimming SAM for defending against the latest threats. 
usn_rim_66k_rail=RIM-66K,SM-2MR Blk III,SAM,The RIM-66K Standard Missile 2 is the Tartar version of the Block III series. The Block III SM-2MR is developed to increase low altitude performance considerably, and therefore should be considered an exceptional anti-seaskimming SAM for defending against the latest threats. 
usn_rim_66m_rail=RIM-66M,SM-2MR Blk III,SAM,The RIM-66M Standard Missile 2 is the AEGIS VLS version of the Block III series. The Block III SM-2MR is developed to increase low altitude performance considerably, and therefore should be considered an exceptional anti-seaskimming SAM for defending against the latest threats. 
usn_rim_66m5=RIM-66M-5,SM-2MR Blk IIIB,SAM,The RIM-66M Standard Missile 2 is the AEGIS VLS version of the Block III series. The Block III SM-2MR is developed to increase low altitude performance considerably, and therefore should be considered an exceptional anti-seaskimming SAM for defending against the latest threats. 
usn_rim_66m6=RIM-66P,SM-2MR Blk IIIC,SAM,The RIM-66P Standard Missile 2 is the AEGIS VLS version of the Block III series. The Block III SM-2MR is developed to increase low altitude performance considerably, and therefore should be considered an exceptional anti-seaskimming SAM for defending against the latest threats. 
usn_rim_156a=RIM-156A,SM-2ER Blk IV,SAM,The RIM-156A Standard Missile 2 ER is the AEGIS VLS version of SM-2ER, and is a highly advanced Block IV variant with the seeker upgrades of a late Block III SM-2MR, and also boasts some level of anti-ballistic-missile capability.
usn_rim_174a=RIM-174A,SM-6 Blk I,SAM,The RIM-174A Standard Missile 6 is an active-radar homing derivative of the Block IV SM-2ER (RIM-156A) using an enlarged AIM-120C AMRAAM seeker, and has much longer effective range (no longer constrained by a ship's FCRs) and higher effectiveness against very high, very fast, and very low targets alike, including ballistic missiles of most varieties.
usn_rim_174b=RIM-174B,SM-6 Blk IA,SAM,The RIM-174B, also known as the Standard Missile 6 (SM-6) Block IA, is an advanced surface-to-air missile produced by Raytheon for the U.S. Navy. It builds on the RIM-174A (SM-6) with enhanced capabilities, including GPS guidance for precise strikes against surface targets like ships and land installations.
usn_rim_174c=RIM-174C,SM-6 Blk IB,SAM,The RIM-174C, also known as the Standard Missile 6 (SM-6) Block IB, is an advanced surface-to-air missile produced by Raytheon for the U.S. Navy. 
usn_rim_116a=RIM-116A,RAM Blk 0,SAM,The RIM-116A RAM (Rolling Airframe Missile) is a short-range point-defense interceptor missile developed by the US, to provide adequate close-in defense against the latest generation of supersonic sea-skimming anti ship missiles, primarily considering littoral environments. Derived from the Sidewinder airframe, it uses both passive radar and infrared homing, allowing it to track targets regardless of speed or altitude, in all weather conditions. While it has an unimpressive range, the high accuracy and large readily available missile count allows for even one launcher to counter an entire incoming missile salvo.\n\nThe Block 0 (RIM-116A) model is the earliest to see service, and can only be used against incoming missiles, and CANNOT BE USED against aircraft.
usn_rim_116b=RIM-116B,RAM Blk 1,SAM,The RIM-116B RAM (Rolling Airframe Missile) is a short-range point-defense interceptor missile developed by the US, to provide adequate close-in defense against the latest generation of supersonic sea-skimming anti ship missiles, primarily considering littoral environments. Derived from the Sidewinder airframe, it uses both passive radar and infrared homing, allowing it to track targets regardless of speed or altitude, in all weather conditions. While it has an unimpressive range, the high accuracy and large readily available missile count allows for even one launcher to counter an entire incoming missile salvo.\n\nThe Block 1 (RIM-116B HAS) model is an upgrade to the block 0, by including an infrared-only mode, and by the request of the German government, an included 'HAS' mode to engage Helicopters, Aircraft, and Surface targets via a software upgrade.
usn_rim_116c=RIM-116C,RAM Blk 2,SAM,The RIM-116C RAM (Rolling Airframe Missile) is a short-range point-defense interceptor missile developed by the US, to provide adequate close-in defense against the latest generation of supersonic sea-skimming anti ship missiles, primarily considering littoral environments. Derived from the Sidewinder airframe, it uses both passive radar and infrared homing, allowing it to track targets regardless of speed or altitude, in all weather conditions. While it has an unimpressive range, the high accuracy and large readily available missile count allows for even one launcher to counter an entire incoming missile salvo.\n\nThe Block 2 (RIM-116C) model is an upgrade to the Block 1, by including an enhanced radio frequency receiver for detecting low probability of intercept radars and improved infrared seeker components, and by incorporating a larger-diameter rocket motor for extended range along with a four-axis control actuator system for superior maneuverability against high-threat targets.
usn_rim_162a=RIM-162A,ESSM,SAM,The RIM-162 Evolved SeaSparrow Missile (ESSM) is a development of the RIM-7 Sea Sparrow missile used to protect ships from attacking missiles and aircraft. ESSM is designed to counter supersonic maneuvering anti-ship missiles. The RIM-162A is designed for the Mk 41 Vertical Launch System (VLS) on ships equipped with the Aegis combat system.
usn_rim_162d=RIM-162D,ESSM,SAM,The RIM-162 Evolved SeaSparrow Missile (ESSM) is a development of the RIM-7 Sea Sparrow missile used to protect ships from attacking missiles and aircraft. ESSM is designed to counter supersonic maneuvering anti-ship missiles. The RIM-162D is designed for the Mk 29 Guided Missile Launching System (GMLS).
usn_rim_7p=RIM-7P,Sea Sparrow,SAM,The RIM-7P Sea Sparrow is a short-range air-defence system fitted to numerous USN and NATO vessels. The system is primarily intended to provide a self defence capability. This version is an upgrade of the M version, with a much lower altitude floor and a lofting flight profile for increased range, alongside better countermeasure resistance.
usn_rim_7vl=RIM-7VL,Sea Sparrow,SAM,The RIM-7P/VL Sea Sparrow is a short-range air-defence system fitted to numerous USN and NATO vessels. The system is primarily intended to provide a self defence capability. This version is an additional module for the improved performance RIM-7P, thrust vectoring vanes for VLS launch and high agility immediately after launch.

usa_mim_104a=MIM-104A,Patriot,SAM,The original Patriot missile, introduced into U.S. Army service in the early 1980s. It was built primarily for air defense against aircraft and cruise missiles, reflecting Cold War priorities. The missile relied on command guidance with midcourse updates from the AN/MPQ-53 radar, carrying a large high-explosive fragmentation warhead to maximize kill probability against maneuvering aircraft. Although highly advanced for its day, it lacked the ability to reliably engage tactical ballistic missiles, which would later drive major upgrades.
usa_mim_104b=MIM-104B,PAC-1,SAM,Developed as an anti-radiation/anti-jammer missile in the late 1980s, the MIM-104B was also called the Anti-Stand-Off Jammer (ASOJ) variant. It introduced a passive home-on-jam seeker, allowing it to autonomously lock onto and home in on enemy aircraft attempting to jam the Patriot radar. This made the Patriot system much more resilient against electronic warfare (EW) threats, as adversary aircraft trying to blind the radar became targets themselves. While the MIM-104B retained the same basic airframe and warhead as the MIM-104A, its improved seeker filled a critical gap in the system’s defenses.
usa_mim_104c=MIM-104C,PAC-2,SAM,The Patriot Advanced Capability-2 (PAC-2) was a major redesign introduced in the late 1980s and deployed during the 1991 Gulf War. It featured an enlarged blast-fragmentation warhead and software improvements, enabling Patriot to engage short-range ballistic missiles (SRBMs) as well as aircraft. While its effectiveness against Iraqi Scud missiles was mixed (in part due to Scud breakup behavior), it marked the first time Patriot was used in an anti-ballistic missile role, setting the stage for further development.
usa_mim_104d=MIM-104D,PAC-2/GEM,SAM,The Guidance Enhanced Missile (GEM) was an improved version of the PAC-2, introduced in the mid-1990s. It incorporated a new proximity fuze and updated seeker electronics, giving the missile better sensitivity against low radar cross-section (RCS) targets such as drones, stealthy aircraft, and ballistic missile warheads. The GEM upgrade significantly increased Patriot’s effectiveness in more cluttered electromagnetic environments, ensuring that older PAC-2 stocks could remain relevant.
usa_mim_104e_c=MIM-104E,PAC-2/GEM-C,SAM,The GEM-C (Cruise) variant was developed in the late 1990s to counter the growing threat of advanced cruise missiles and UAVs. It further refined the seeker and signal-processing algorithms, enabling the system to better detect and engage low-flying, maneuverable, and low-RCS threats in ground clutter. By keeping the same missile body and warhead as the PAC-2, GEM-C offered a cost-effective upgrade path while extending Patriot’s role beyond ballistic missile defense into robust cruise missile defense.
usa_mim_104e_t=MIM-104E,PAC-2/GEM-T,SAM,The GEM-T (Tactical Ballistic Missile) is another branch of the GEM upgrades, optimized for intercepting short-range ballistic missiles with higher accuracy. It uses an improved seeker and fuze optimized for closing speeds typical of ballistic missile engagements, while still retaining the capability to engage aircraft. Together, GEM-C and GEM-T gave commanders flexibility in tailoring Patriot batteries for specific threat environments—either heavy on cruise missile defense or ballistic missile defense.
usa_mim_104f_cri=MIM-104F,PAC-3/CRI,SAM,The Patriot Advanced Capability-3 (PAC-3) represented the single biggest leap in Patriot’s history. Officially designated MIM-104F, it entered service in 2001. Unlike earlier blast-fragmentation designs, the PAC-3 is a hit-to-kill interceptor designed to physically collide with ballistic missile warheads at high speeds. It is smaller than previous Patriot missiles, allowing 16 missiles per launcher instead of 4. The Cost Reduction Initiative (CRI) version is the standard production model, providing far greater accuracy and lethality against ballistic missile threats, while retaining some capability against cruise missiles and aircraft.
usa_mim_104f_mse=MIM-104F,PAC-3/MSE,SAM,The Missile Segment Enhancement (MSE) is the most advanced Patriot interceptor in service today. It builds on the PAC-3 CRI design but adds a dual-pulse solid rocket motor, larger fins for greater maneuverability, and enhanced guidance and control systems. These changes provide a significant boost in both range and engagement altitude, making it more capable against modern and emerging ballistic missile threats, including more sophisticated maneuvering reentry vehicles. The MSE also improves effectiveness against advanced cruise missiles and air-breathing threats, ensuring Patriot remains a central component of layered air and missile defense well into the 21st century.

plan_hq_7=HHQ-7,Red Banner-7,SAM,The HHQ-7 is a derivative of the French Crotale short-range surface-to-air missile system developed to intercept airborne ranged weapons and aircraft, from cruise or anti-ship missiles to helicopters, UAVs or low-flying high-performance fighter aircraft.
plan_hq16=HQ-16,Red Banner-16,SAM/ASuW,The HQ-16 ('Red Banner-16') is a medium-range surface-to-air missile from the People's Republic of China. It is derived from earlier versions of the Russian Buk missile system.
plan_hq16c=HQ-16C,Red Banner-16,SAM/ASuW,The HQ-16 ('Red Banner-16') is a medium-range surface-to-air missile from the People's Republic of China. It is derived from earlier versions of the Russian Buk missile system.
plan_hq16fe=HQ-16FE,Red Banner-16,SAM/ASuW,The HQ-16 ('Red Banner-16') is a medium-range surface-to-air missile from the People's Republic of China. It is derived from earlier versions of the Russian Buk missile system.
plan_hq10=HQ-10,Red Banner-10,SAM,The HQ-10 ('Red Banner-10') is a short range surface-to-air missile designed by China Aerospace Science and Technology Corporation, currently in service as a point defense missile system aboard PLA Navy warships.
plan_hq15=HQ-15,Red Banner-15,SAM,Chinese variant of the S-300PMU-1.
plan_hhq_9a=HHQ-9A,Red Banner-9,SAM,The HHQ-9A is the first truly modern Chinese long-range SAM, and is one of the very few active-radar-homing SAMs in service. Developed from the passive homing FD-2000, and also incorporating design elements from S-300, HHQ-9 is unique in that it incorporates the kinematic performance (high speed, long range) of S-300, but also adds an active radar seeker instead of TVM guidance. This allows HHQ-9 to attack targets the radar may not be able to see, or attack jamming targets, and otherwise dramatically improves long-range performance.\n\nThis is the original early 00's HHQ-9A, first debuted on Type 052C, and has respectable performance, although it isn't excellent against sea-skimming targets and has only 125km range.
plan_hhq_9b=HHQ-9B,Red Banner-9,SAM/ASuW,The HHQ-9B is the first truly modern Chinese long-range SAM, and is one of the very few active-radar-homing SAMs in service. Developed from the passive homing FD-2000, and also incorporating design elements from S-300, HQ-9 is unique in that it incorporates the kinematic performance (high speed, long range) of S-300, but also adds an active radar seeker instead of TVM guidance. This allows HQ-9 to attack targets the radar may not be able to see, or attack jamming targets, and otherwise dramatically improves long-range performance.\n\nThis is the improved HHQ-9B version from the late 2010s, and features much greater range (300km), faster flight speed, adept performance at engaging sea-skimming supersonic targets, and greater countermeasure resistance.

wp_sa_n_4b=SA-N-4B,Gecko,SAM,The SA-N-4B Gekko (Osa MA-2) is the naval version of the SA-8 Gecko (note the different spelling) with two missiles on a retractable rotating launcher. It has been installed on a significant number of Soviet platforms to fulfil the short-range air defence role. The MA-2 variant is a new completely digital weapons system including an upgraded 9M33M5 missile with an altitude floor to sea level, with the radar system having an altitude floor of 5 meters.
wp_sa_n_9a=SA-N-9A,Gauntlet,SAM/ASuW,The SA-N-9A Gauntlet (9M331 Kinzhal) is the naval version of the SA-15 Gauntlet (9K331 Tor) missile system. It utilises the same missile as the SA-15 and is fitted on a significant number of Soviet major surface combatants. This version has an improved fuze for greater performance against low altitude and high speed targets, alongside slightly better agility.
wp_sa_n_11=SA-N-11,Grison,SAM,The SA-N-11 Grison (9M311K) is the naval version of the SA-19 Grison (2K22 Tunguska/9M311) mounted to the Kortik CIWS combined weapon system. This missile is agile, fast, and accurate all the way down to sea level, and maintains good effectiveness against maneuvering sea-skimming targets like Harpoon, at the cost of being extremely lightweight and short ranged. A proper point-defense interceptor.
wp_sa_n_12=SA-N-12,Grizzly,SAM,Naval version of the 9M317 (SA-17). The Buk is a family of self-propelled, medium-range surface-to-air missile systems developed by the Soviet Union and its successor state, the Russian Federation, and designed to counter cruise missiles, smart bombs and rotary-wing aircraft, and unmanned aerial vehicles.
wp_sa_n_12b=SA-N-12B,Grizzly,SAM,Naval version of the 9M317M (SA-17). The Buk is a family of self-propelled, medium-range surface-to-air missile systems developed by the Soviet Union and its successor state, the Russian Federation, and designed to counter cruise missiles, smart bombs and rotary-wing aircraft, and unmanned aerial vehicles.
wp_sa_n_20=SA-N-20,Gargoyle,SAM/ASuW,The SA-N-20 Gargoyle (S-300FM) is the naval version of the SA-10 (S-300PM) land-based surface-to-air missile system. This powerful long-range system is fitted in Soviet missile-cruiser classes, and offers performance comparable to that of the SM-2. 
wp_sa_n_20b=SA-N-20B,Gargoyle,SAM/ASuW,The SA-N-20 Gargoyle (S-300FM1) is the naval version of the SA-21 (S-400) land-based surface-to-air missile system. This powerful long-range system is fitted in Soviet missile-cruiser classes, and offers performance comparable to that of the SM-2ER. Improved low-altitude performance, improved range, and a higher top speed to boot, a true air defense missile system.
wp_sa_n_28a=SA-N-28A,Growler,SAM/ABM,The SA-N-28A Growler or 9M96 (9K96 Poliment-Redut) is the naval version of the SA-28 Growler (S-350 Vityaz/S-400 Triumf) missile system. Developed originally as a lightweight, highly agile anti-ballistic missile system and anti cruise-missile platform, the 9M96 is a fierce interceptor missile emphasizing extreme agility and high speed, alongside a high capability against targets both fast and slow, high and low. Part of this is due to its active-radar seeker, but also due to its lateral thruster arrangement, that allows it to maintain high performance against all types of threats. It's only downside is that it only has an effective range of 50km, therefore is only a medium-range SAM system.
wp_sa_n_28n=SA-N-28N,Growler,SAM/ABM,The SA-N-28N Growler or 9M96M2 (9K96 Poliment-Redut) is the naval version of the SA-28 Growler (S-350 Vityaz/S-400 Triumf) missile system. Developed originally as a lightweight, highly agile anti-ballistic missile system and anti cruise-missile platform, the 9M96 is a fierce interceptor missile emphasizing extreme agility and high speed, alongside a high capability against targets both fast and slow, high and low. Part of this is due to its active-radar seeker, but also due to its lateral thruster arrangement, that allows it to maintain high performance against all types of threats. This is the upgraded, extended range model of 9M96, with tripled range due to a significantly larger airframe and much higher top speed, making this a true long-range area defense SAM system.
wp_sa_21=SA-21,Growler,SAM/ASuW,The S-400 Triumf (NATO reporting name: SA-21 Growler), previously known as the S-300 PMU-3, is a mobile surface-to-air missile (SAM) system developed in the 1990s by Russia's NPO Almaz as an upgrade to the S-300 family of missiles. The S-400 was approved for service on 28 April 2007 and the first battalion of the systems assumed combat duty on 6 August 2007. The system is complemented by its successor, the S-500.
wp_sa_20a=SA-20A,Gargoyle,SAM/ASuW,S-300PMU-1.
wp_sa_20b=SA-20B,Gargoyle,SAM/ASuW,S-300PMU-2.

# ------------------ AAM ------------------
usn_aim_7p=AIM-7P,Sparrow,AAM,The AIM-7P Sparrow is an American semi-active radar-homing air-to-air missile. P model has greatly improved low-altitude capabilities for engaging sea-skimming targets, and greater clutter rejection alongside a lofted flight profile for enhanced range and higher performance against high-altitude targets.
usn_aim_9m=AIM-9M,Sidewinder,AAM,The AIM-9M Sidewinder is an American infrared homing air-to-air missile. The Mike variant is a Lima variant with enhanced maneuverability and infrared counter-countermeasures, so the seeker isn't easily as fooled by flares.
usn_aim_9x=AIM-9X,Sidewinder,AAM,The AIM-9X Sidewinder is an American infrared homing air-to-air missile. The X-ray variant features an infrared sensor system with near 360 degree viewing angles.  A longer duration burn time with thrust vectoring delivers extended range and maneuverability.
usn_aim_9x_ground=AIM-9X,Sidewinder,AAM,The AIM-9X Sidewinder is an American infrared homing air-to-air missile. The X-ray variant features an infrared sensor system with near 360 degree viewing angles.  A longer duration burn time with thrust vectoring delivers extended range and maneuverability.
usn_aim_54c=AIM-54C,Phoenix,AAM,The AIM-54C Phoenix is an American active radar-homing air-to-air missile. This is the longest range air-to-air missile in the US inventory and is unique to the F-14. Integrated with the advanced AWG-9 radar it provides the F-14 with the ability to engage 6 targets with 1 missile each simultaneously. To achieve this, the missiles fly on autopilot while the computers aboard the plane sample the track-while-scan radar data into track files, which are then used to transmit guidance updates to the missiles while in the midcourse phase, guiding them into a 'basket' where the missile's own active radar homing acquires the target for the terminal phase.
usn_aim_260=AIM-260,JATM,AAM,The AIM-260 Joint Advanced Tactical Missile (JATM) is a beyond-visual-range air-to-air missile (BVRAAM) deployed by the U.S. Air Force and manufactured by Lockheed Martin to replace the aging AIM-120 AMRAAM. Fielded specifically to counter advanced threats like the Chinese PL-15, it delivers superior range, enhanced speed, and improved countermeasure resistance while maintaining compatibility with existing fighter aircraft weapons bays.
usn_aim_174b=AIM-174B,Gunslinger,AAM,The AIM-174B is a long-range air-to-air missile developed by U.S. defense contractor Raytheon and used by the United States Navy. The AIM-174B is a derivative of the RIM-174B Standard Extended Range Active Missile (ERAM, Standard Missile-6, or SM-6) surface-to-air missile, a member of the extended Standard Missile family, with the USN describing the AIM-174B as the "Air-Launched Configuration" of the SM-6.
usn_aim_120b=AIM-120B,AMRAAM,AAM,The AIM-120B AMRAAM is an American active radar-homing air-to-air missile. This is the most advanced air to air missile in the US arsenal so far, and is a lighter and much more capable successor to the semi-active Sparrow missile. The AMRAAM achieves its high performance in all remarks via a datalink and active radar seeker, high performance rocket motor for very high flight speed, and a lofting trajectory for maximum kinematic performance to engage both maneuvering and fast flying air targets. The 'B' variant has a more modern software interface allowing for updating the logic of the missile without replacing any hardware, allowing the missile to be reprogrammed for evolving threats despite still having older hardware.
usn_aim_120c=AIM-120C-7,AMRAAM,AAM,The AIM-120C-7 AMRAAM is an American active radar-homing air-to-air missile. This is the most advanced air to air missile in the US arsenal so far, and is a lighter and much more capable successor to the semi-active Sparrow missile. The AMRAAM achieves its high performance in all remarks via a datalink and active radar seeker, high performance rocket motor for very high flight speed, and a lofting trajectory for maximum kinematic performance to engage both maneuvering and fast flying air targets. The 'C-7' variant has an improved fuze, improved seeker, and significantly longer range, and is effective against the latest fighter aircraft.
usn_aim_120c_ground=AIM-120C-7,AMRAAM,AAM,The AIM-120C-7 AMRAAM is an American active radar-homing air-to-air missile. This is the most advanced air to air missile in the US arsenal so far, and is a lighter and much more capable successor to the semi-active Sparrow missile. The AMRAAM achieves its high performance in all remarks via a datalink and active radar seeker, high performance rocket motor for very high flight speed, and a lofting trajectory for maximum kinematic performance to engage both maneuvering and fast flying air targets. The 'C-7' variant has an improved fuze, improved seeker, and significantly longer range, and is effective against the latest fighter aircraft.
usn_aim_120d=AIM-120D-3,AMRAAM,AAM,The AIM-120D-3 AMRAAM is an American active radar-homing air-to-air missile. This is the most advanced air to air missile in the US arsenal so far, and is a lighter and much more capable successor to the semi-active Sparrow missile. The AMRAAM achieves its high performance in all remarks via a datalink and active radar seeker, high performance rocket motor for very high flight speed, and a lofting trajectory for maximum kinematic performance to engage both maneuvering and fast flying air targets. The 'D-3' variant utilizes an extended rocket motor and longer duration battery to achieve even longer range, with minimal other changes.

plan_pl_8b=PL-8B,Thunderbolt-8,AAM,The PL-8B is a Chinese all-aspect infrared homing air-to-air missile. It is a version of the Israeli Python-3 missile, except with all-domestic components and the inclusion of infrared counter-countermeasures in the form of a digital crossed array seeker. Overall an excellent infrared air to air missile, and lacks very little compared to other foreign competitors except in off-boresight engagements.
plan_pl9=PL-9,Thunderbolt-9,AAM,The PL-9 is a short-range, infrared-homing air-to-air missile developed by the People's Republic of China.
plan_pl12a=PL-12A,Thunderbolt-12,AAM,The PL-12 (NATO reporting name: CH-AA-7 Adze) is an active radar-guided beyond-visual-range air-to-air missile developed by the People's Republic of China. It is considered comparable to the US AIM-120 AMRAAM and the Russian R-77.
plan_pl15=PL-15,Thunderbolt-15,AAM,The PL-15 (NATO reporting name: CH-AA-10 Abaddon) is an active radar-guided long-range air-to-air missile developed by the People's Republic of China.
plan_pl21=PL-21,Thunderbolt-21,AAM,The PL-21 is an active radar-guided beyond-visual-range air-to-air missile developed by the People's Republic of China.

wp_aa_8b=AA-8B,Aphid-B,AAM,The AA-8 Aphid (Vympel R-60) is a Soviet short-range infrared homing air-to-air missile.
wp_aa_9=AA-9,Amos,AAM,The R-33 (NATO reporting name: AA-9 Amos) is a long-range air-to-air missile developed by Vympel. It is the primary armament of the MiG-31 interceptor, intended to attack large high-speed targets such as the SR-71 Blackbird, the B-1 Lancer bomber, and the B-52 Stratofortress.
wp_aa_11m=AA-11,Archer,AAM,The AA-11 Archer (Vympel R-73A) is a Soviet medium-range infrared homing air-to-air missile. This is the top performing SRAAM that the East will develop during the Cold War, and is the first of its kind to completely beat its US counterpart in every metric conceivable. Utilizing thrust-vectoring for unparalleled agility for the time, a high-performance cooled seeker for long-range all-aspect engagement, and a crossed array seeker for very good countermeasure immunity, all while maintaining a compact form factor.
wp_aa_12=AA-12,Adder,AAM,The AA-12 Adder, officially known as the R-77 or RVV-AE, is a Russian medium-to-long-range, active radar-guided air-to-air missile developed by Vympel NPO. Often compared to the American AIM-120 AMRAAM, it features a "fire-and-forget" capability, allowing it to autonomously track targets after launch. With a range of up to 110 km (for the R-77-1 variant), it is designed to engage a variety of aerial threats, including fighter jets, bombers, and cruise missiles, using inertial guidance with mid-course updates and a terminal active radar phase. Its distinctive design includes narrow-span wings and four rectangular rear control surfaces, enhancing maneuverability.

# ---------- Anti-ship Missiles ----------
usn_rgm_84d=RGM-84D,Harpoon IC,ASM,The Harpoon is an American standoff anti-ship weapon used widely throughout NATO. The weapon has an active radar seeker that is activated after following a pre-programmed route. The RGM-84 variant is surface launched. The Block 1C variant has improved range via more energetic fuel, both a sea-skim profile and an optimized terminal pop-up maneuver, and a more interference-resistant seeker head.
usn_rgm_84l=RGM-84L,Harpoon Block II,ASM,The Harpoon is an American standoff anti-ship weapon used widely throughout NATO. The weapon has an active radar seeker that is activated after following a pre-programmed route. The RGM-84 variant is surface launched.
usn_rgm_109b3=RGM-109B,TASM Block III,ASM,The RGM-109B Tomahawk Anti-Ship Missile (TASM) is an American standoff anti-ship weapon. The weapon has an active radar seeker that is activated after following a pre-programmed route, and is capable of flying a search pattern with deceptive manuevers. The Block 3 modification adds GPS guidance, allowing for accurate waypoint guidance (modeled via RC midcourse guidance), extended range, alongside higher accuracy and a a terrain mapping radar (TERCOM).
usn_rgm_184a=RGM-184A,NSM,ASM,The RGM-184A Naval Strike Missile (NSM) is a stealthy, anti-ship and land-attack cruise missile developed by Norway’s Kongsberg Defence & Aerospace. It features a 400 kg (880 lb) weight, a range of over 185 km (115 miles), and sea-skimming flight for evasion.
usn_rgm_110b=RGM-110B,Tempest,ASM,The RGM-110B Tempest Hypersonic Anti-Ship Missile (THASM) is an American standoff hypersonic anti-ship weapon. The weapon has an active radar seeker that is activated after following a pre-programmed route, and is capable of flying a search pattern with deceptive manuevers.
usn_rgm_110l=RGM-110L,Tempest,ASM,The RGM-110L Tempest Hypersonic Anti-Ship Missile (THASM) is an American standoff hypersonic anti-ship weapon. The RGM-110L is an enlarged variant of the RGM-110B Tempest, the larger size also provides a dramatic increase in range and speed.
usn_rgm_158c=RGM-158C,LRASM,ASM,The RGM-158C LRASM (Long Range Anti-Ship Missile) is a stealth air launch anti-ship cruise missile developed for the United States Air Force and United States Navy by the Defense Advanced Research Projects Agency (DARPA). Derived from the AGM-158B JASSM-ER, the LRASM was intended to pioneer more sophisticated autonomous targeting capabilities than the U.S. Navy's current Harpoon anti-ship missile, which has been in service since 1977.

usn_agm_84d=AGM-84D,Harpoon IC,ASM,The Harpoon is an American standoff anti-ship weapon used widely throughout NATO. The weapon has an active radar seeker that is activated after following a pre-programmed route. The RGM-84 variant is surface launched. The Block 1C variant has improved range via more energetic fuel, both a sea-skim profile and an optimized terminal pop-up maneuver, and a more interference-resistant seeker head.
usn_agm_84n=AGM-84N,Harpoon Block II+,ASM,The AGM-84N Harpoon Block II+ is an advanced, air-launched anti-ship missile developed by Boeing as an upgrade to the Harpoon family. Introduced to the U.S. Navy in 2017, it builds on the Block II variant with an improved GPS guidance kit, a two-way data-link for in-flight targeting updates and enhanced electronic countermeasure resistance.
usn_agm_109b=AGM-109B,Tomahawk,ASM,RGM-109B,Tomahawk,ASM,The RGM-109B Tomahawk Anti-Ship Missile (TASM) is an American standoff anti-ship weapon. The weapon has an active radar seeker that is activated after following a pre-programmed route, and is capable of flying a search pattern with deceptive manuevers.
usn_agm_110l=AGM-110L,Tempest,ASM,The AGM-110L Tempest Hypersonic Anti-Ship Missile (THASM) is an American standoff hypersonic anti-ship weapon. The AGM-110L is the air launched variant of the RGM-110L Tempest
usn_agm_158c=AGM-158C,LRASM,ASM,The AGM-158C LRASM (Long Range Anti-Ship Missile) is a stealth air launch anti-ship cruise missile developed for the United States Air Force and United States Navy by the Defense Advanced Research Projects Agency (DARPA). Derived from the AGM-158B JASSM-ER, the LRASM was intended to pioneer more sophisticated autonomous targeting capabilities than the U.S. Navy's current Harpoon anti-ship missile, which has been in service since 1977.
knm_penguin_mk3=AGM-119,Penguin Mk3,ASM,The AGM-119 Penguin is a small air-launched and surface-launched anti-ship missile developed in collaboration between the US and Norway. The Penguin Mk3 has a extended range of 55+ kilometers.

usn_ugm_84d=UGM-84D,Harpoon IC,ASM,The Harpoon is an American standoff anti-ship weapon used widely throughout NATO. The weapon has an active radar seeker that is activated after following a pre-programmed route. The UGM-84 variant is submarine launched. The Block 1C variant has improved range via more energetic fuel, both a sea-skim profile and an optimized terminal pop-up maneuver, and a more interference-resistant seeker head.

plan_yj12_land=YJ-12B,Eagle Strike 12,ASM,Ground-launched variant. The YJ-12 is a Chinese supersonic anti-ship cruise missile developed by China Aerospace Science and Industry Corporation (CASIC).
plan_yj12_ship=YJ-12A,Eagle Strike 12,ASM,Ship-launched variant. The YJ-12 is a Chinese supersonic anti-ship cruise missile developed by China Aerospace Science and Industry Corporation (CASIC).
plan_yj12_air=YJ-12,Eagle Strike 12,ASM,Air-launched variant. The YJ-12 is a Chinese supersonic anti-ship cruise missile developed by China Aerospace Science and Industry Corporation (CASIC).
plan_yj83k=YJ-83K,Eagle Strike 83,ASM,The YJ-83 is a Chinese anti-ship cruise missile. It is manufactured by the China Aerospace Science and Industry Corporation Third Academy. Air-launched variant.
plan_yj83kh=YJ-83KH,Eagle Strike 83,ASM,The YJ-83 is a Chinese anti-ship cruise missile. It is manufactured by the China Aerospace Science and Industry Corporation Third Academy. Air-launched variant with imaging-infrared seeker and 230 km range.
plan_yj83a=YJ-83A,Eagle Strike 83,ASM,The YJ-83 is a Chinese anti-ship cruise missile. It is manufactured by the China Aerospace Science and Industry Corporation Third Academy.
plan_yj61=YJ-61,Eagle Strike 61,ASM,The YJ-61 is a improved variant of the YJ-6 anti-ship cruise missile.
plan_yj18=YJ-18,Eagle Strike 18,ASM,The YJ-18 is a long-range anti-ship cruise missile developed by China utilizing technology derived from the Russian 3M54E "Klub" cruise missile. It exists in two variants: the YJ-18 submarine-launched version and the YJ-18A ship-based vertical launch version. The YJ-18A is compatible with the HT-1 naval universal vertical launch system and is deployed aboard the People's Liberation Army Navy's Type 052D and Type 055 guided-missile destroyers. The missile follows a sea-skimming flight trajectory at ultra-low altitude, employing a composite flight profile with subsonic cruise and supersonic terminal dash phases. This design gives it both long range and high penetration capability through enemy air defences.
plan_yj18_sub=YJ-18,Eagle Strike 18,ASM,The YJ-18 is a long-range anti-ship cruise missile developed by China utilizing technology derived from the Russian 3M54E "Klub" cruise missile. It exists in two variants: the YJ-18 submarine-launched version and the YJ-18A ship-based vertical launch version. The YJ-18A is compatible with the HT-1 naval universal vertical launch system and is deployed aboard the People's Liberation Army Navy's Type 052D and Type 055 guided-missile destroyers. The missile follows a sea-skimming flight trajectory at ultra-low altitude, employing a composite flight profile with subsonic cruise and supersonic terminal dash phases. This design gives it both long range and high penetration capability through enemy air defences.
plan_yj_62=YJ-62,Eagle Strike 62,ASM/Land Attack, The YJ-62 is a subsonic, long-range anti-ship cruise missile independently developed by China. Designed by the China Aerospace Science and Industry Corporation (CASIC), it entered service in the mid-2000s and is primarily deployed on Type 052C guided missile destroyers, H-6G/K bombers, and coastal defense units. The missile utilizes Oblique launch methods. The mid-course guidance is provided by Inertial Navigation System (INS) + GPS correction, while in the terminal phase it is guided by an active radar homing seeker. The missile keeps a sea-skimming profile throughout the whole flight. As the PLAN's first heavy anti-ship weapon with beyond-visual-range precision strike capability, this missile represents a major milestone in China's naval strike capabilities, enabling effective engagement of hostile surface combatants at extended ranges.
plan_yj21=YJ-21,Eagle Strike 21,ASM,The YJ-21 is a Chinese hypersonic anti-ship ballistic missile.
plan_c_802=C-802,Eagle Strike 82,ASM,The C-802 (Yingji-82 or YJ-82) is a Chinese subsonic anti-ship cruise missile developed by the China Haiying Electro-Mechanical Technology Academy, unveiled in 1989. It features a turbojet engine, extending its range to 120 km compared to its predecessor, the YJ-8 (C-801). With a 165 kg semi-armor-piercing warhead, it uses inertial navigation and active radar guidance for a low-altitude, sea-skimming flight path (5-7 meters), making it hard to intercept.
plan_3m_80mbe=3M-80MBE,Moskit,ASM,The 3M-80MBE is an advanced export variant of the Russian P-270 Moskit (NATO: SS-N-22 Sunburn) anti-ship cruise missile, used by the Chinese Navy on Sovremenny-class destroyers. It features a supersonic speed of up to Mach 2.5, a range of over 220 km (up to 240 km), and a 300 kg high-explosive or semi-armor-piercing warhead. Designed for engaging large naval targets like aircraft carriers, it employs a ramjet engine and a sea-skimming flight profile for enhanced survivability and lethality.
plan_yj_7=YJ-7,Eagle Strike 7,ASM,The YJ-7 (Eagle Strike 7) is a Chinese subsonic anti-ship missile developed by the China Aerospace Science and Industry Corporation (CASIC) Third Academy. Its export version, the C-701, is radar-guided and was showcased in 2004. The missile is designed for precision strikes against naval targets and has been associated with Iranian military exercises.
plan_yj_82=YJ-82,Sardine,ASM,The YJ-82 is a Chinese anti-ship missile resembling, and roughly equivalent to, the French Exocet missile. After launch the missile climbs to 20-30 meters and descends to attack at 5-7 meters in a sea-skimming profile.\n\nThis is the submarine-launch version (not to be confused with the sub-launched YJ-8, with fixed fins launched from the 033G1 Wuhan-class SSG) fired from torpedo tubes, and can be fired while submerged, but takes a mild range penalty as a result of its launch profile.
plan_yj_17=YJ-17,Eagle Strike 17,ASBM,
plan_yj_20=YJ-20,Eagle Strike 20,ASBM,

wp_as_20=AS-20,Kayak,ASM,The AS-20 Kayak (Kh-35) is a Soviet sea-skimming jet-powered anti shipping missile with performance very similar to the American Harpoon missile, thus being affectionately dubbed the 'Harpoonski'.
wp_ss_n_12b=SS-N-12B,Sandbox,ASM,The SS-N-12 Sandbox Mod 2 (P-1000 Vulkan) is a Soviet surface launched supersonic standoff anti-ship missile made to be a major modernization to the earlier P-500 missile, boasting greater speed and range. Nearly every aspect has been improved, the structure is more resistant to CIWS rounds, the electronic warfare suite is more capable at deceptive jamming, the range has been improved to the point of outranging almost any other surface launched anti-ship missile in the Soviet arsenal, and the cruise altitude is further reduced to enhance survivability.
wp_ss_n_19a=SS-N-19A,Shipwreck,ASM,The SS-N-19 Shipwreck Mod. (P-700 Granit-M) is a Soviet surface launched supersonic standoff anti-ship missile with numerous countermeasures both active and passive, and incredible range. The modernized Granit version has much greater speed, range, and primarily improved electronics, and can evade effectively against even the latest air defense systems.
wp_ss_n_22a=SS-N-22A,Sunburn,ASM,The SS-N-22 Sunburn (3M82 Moskit-M) is a Soviet surface launched supersonic standoff anti-ship weapon. It flies a HI-LO profile with a supersonic sea-skimming terminal phase, during which the missile performs evasive snaking manuevers to increase survivability against air defences. Doubled range from the high altitude profile, and greater terminal speed and survivability due to the extremely low altitude flight profile.
wp_ss_n_25=SS-N-25,Switchblade,ASM,The SS-N-25 Switchblade (Kh-35) is a Soviet sea-skimming jet-powered anti shipping missile with performance very similar to the American Harpoon missile, thus being affectionately dubbed the 'Harpoonski'.
wp_ss_n_26a=SS-N-26,Strobile,ASM/Land Attack,The SS-N-26 Strobile (3M55 Oniks) is a Soviet high performance supersonic standoff anti-ship weapon. Similar to the 3M82 Moskit and 3M45 Granit missiles in concept, Oniks is the lightweight model of a pair of new generation anti ship missiles. Utilizing its reduced footprint to allow carriage on smaller platforms like aircraft or missile boats and older ships/subs, Oniks is an extremely potent missile for its size, using the Granit-Elektron seeker developed from P-700 Granit and miniaturized to fit inside of Oniks, and has an extremely fast flight profile at high altitude and at sea level. All of this, combined with a new generation deceptive jammer, terminal maneuvers, and auxillary land attack capability, makes Oniks a truly terrifying weapon.
wp_ss_n_27=SS-N-27,Sizzler,ASM,The SS-N-27 (Kalibr 3M54T) is a Soviet anti ship cruise missile, with subsonic speed and long range. This model trades the extremely high speed penetrating dart terminal stage for a conventional subsonic terminal phase with a larger warhead, and is generally more useful against lesser defended vessels given its powerful warhead.
wp_r_360_neptune=R-360,Neptune,ASM,The R-360 Neptune is a Ukrainian subsonic cruise missile with all-weather capabilities, developed by the Luch Design Bureau in Kyiv as an anti-ship missile, with a later variant for land attack. Neptune's design is based on the Soviet Kh-35 subsonic anti-ship missile, with substantially improved range, targeting, and electronics equipment. It has a range of over 200 kilometers. The R-360 famously sank the Russian cruiser Moskva (Slava) on 13 April 2022.

ir_kowsar=Kowsar,Eagle Strike-7,ASM,The Kowsar is a short-range anti-ship cruise missile developed by Iran, derived from the Chinese C-701 and TL-10A. It features advanced radar and optical guidance for accuracy and jamming resistance. With a range of 38 km and a 29-120 kg warhead, it targets small to medium-sized naval vessels. Used in the 2006 Lebanon War, it is produced by Iran's Aerospace Industries Organization.
ir_nasir=Nasir,,ASM,
ir_cm_90=CM-90,,ASM,The CM-90 is an export model of the Nasir.

# ---------- Anti-sub  Missilies ----------
usn_rum125a=RUM-125A,Sea Lance,ASW/Nuclear,The RUM-125 Sea Lance is a long-range, supersonic anti-submarine weapon. This variant is equipped with the W89 thermonuclear depth-charge warhead. The W89 when exploded underwater has a lethal range of 5 nautical miles or 10 kilometers.
usn_rum125b=RUM-125B,Sea Lance,ASW,The RUM-125 Sea Lance is a long-range, supersonic anti-submarine weapon. This variant is equipped with the Mk 50 Advanced Lightweight Torpedo (ALWT).
usn_rum_139a=RUM-139A,VL-ASROC,ASW,The RUM-139A VL-ASROC is a standoff anti-submarine weapon. The ASROC missile is launched from the shooting platform and deploys a Mk 46 Mod 5 ASW torpedo after flying a ballistic trajectory. The VL version is launched from a Mk-41 VLS cell, and has double the range of its earlier counterpart.
usn_rum_139c=RUM-139C,VL-ASROC,ASW,The RUM-139C VL-ASROC is a standoff anti-submarine weapon. The ASROC missile is launched from the shooting platform and deploys a Mk 54 lightweight torpedo after flying a ballistic trajectory. The VL version is launched from a Mk-41 VLS cell, and has double the range of its earlier counterpart.
usn_haawc=HAAWC,,ASW,HAAWC is a guided glide/retardation kit that attaches to an air-dropped lightweight torpedo (typically the Mk-54). It gives patrol aircraft (most notably the P-8 Poseidon) the ability to release torpedoes from high altitude and at standoff distances, using wings/control surfaces and an onboard guidance unit (GPS/INS) to fly the torpedo to a pre-programmed release point before the torpedo separates and enters the water.

jmsdf_type07=Type 07,VL-ASROC,ASW,The Type 07 is a Japanese ship-launched anti-submarine missile, fired from Mark 41 vertical launch systems. It reaches supersonic speeds, uses inertial guidance with thrust vectoring, and delivers a lightweight torpedo to engage submarines at ranges over 30 kilometers.

plan_cy5=CY-5,Swordfish 5,ASW,CY-5 is the vertically launched version of CY-4 with folding control surfaces to fit into VLS.

wp_ss_n_14b=SS-N-14B,Silex-B,ASW/ASuW,The SS-N-14 Silex-B (Rastrub) is a Soviet dual-purpose anti-submarine and anti-surface standoff weapon. Similar to the Australian Ikara these weapons carry an torpedo below a small cruise-missile airframe.
wp_ss_n_14c=SS-N-14C,Silex-C,ASW/ASuW,The SS-N-14C Silex-C (Rastrub-M) is a Soviet dual-purpose anti-submarine and anti-surface standoff weapon. Similar to the Australian Ikara these weapons carry an torpedo below a small cruise-missile airframe.\n\nThis is an upgraded version of the missile, with significantly greater range and a better seeker to engage surface targets, and improving the ASW firepower with the UMGT-1M lightweight torpedo.

# --------------- Torpedoes ---------------
usn_mk46_neartip_air=MK-46 Mod 5,NEARTIP,ASW Torpedo,The Mark 46 Mod 5 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. The Mod 5 version allows for the ability to engage surface targets or surfaced submarines with limited effectiveness, improves the fuel and motor system for more efficient cruising and faster terminal phase, and increases the immunity of the seeker against countermeasures. This variant is air dropped.
usn_mk46_neartip_ship=MK-46 Mod 5,NEARTIP,ASW Torpedo,The Mark 46 Mod 5 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. The Mod 5 version allows for the ability to engage surface targets or surfaced submarines with limited effectiveness, improves the fuel and motor system for more efficient cruising and faster terminal phase, and increases the immunity of the seeker against countermeasures. This variant is ship launched.
usn_mk46_neartip_asroc=MK-46 Mod 5,NEARTIP,ASW Torpedo,The Mark 46 Mod 5 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. The Mod 5 version allows for the ability to engage surface targets or surfaced submarines with limited effectiveness, improves the fuel and motor system for more efficient cruising and faster terminal phase, and increases the immunity of the seeker against countermeasures. This variant is ASROC deployed
usn_mk_50_air=MK-50,ALWT,ASW Torpedo,The Mark 50 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. Designed to attack modern Soviet high-performance submarines this variant is air dropped.
usn_mk_50_ship=MK-50,ALWT,ASW Torpedo,The Mark 50 torpedo is the NATO standard for lightweight torpedoes used across multiple nations. Designed to attack modern Soviet high-performance submarines this variant is ship launched.
usn_mk54_air=MK-54,LHT,ASW Torpedo,The Mark 54 Lightweight Hybrid Torpedo (LHT) is a 12.75-inch (324 mm) anti-submarine warfare (ASW) torpedo used by the U.S. Navy and allied navies. Developed by Raytheon and the U.S. Navy, it combines the advanced sonar homing system of the Mk 50 with the warhead and propulsion of the Mk 46, optimized for shallow-water and littoral environments. This variant is air dropped.
usn_mk54_ship=MK-54,LHT,ASW Torpedo,The Mark 54 Lightweight Hybrid Torpedo (LHT) is a 12.75-inch (324 mm) anti-submarine warfare (ASW) torpedo used by the U.S. Navy and allied navies. Developed by Raytheon and the U.S. Navy, it combines the advanced sonar homing system of the Mk 50 with the warhead and propulsion of the Mk 46, optimized for shallow-water and littoral environments. This variant is ship launched.
usn_mk54_haawc=MK-54,LHT,ASW Torpedo,The Mark 54 Lightweight Hybrid Torpedo (LHT) is a 12.75-inch (324 mm) anti-submarine warfare (ASW) torpedo used by the U.S. Navy and allied navies. Developed by Raytheon and the U.S. Navy, it combines the advanced sonar homing system of the Mk 50 with the warhead and propulsion of the Mk 46, optimized for shallow-water and littoral environments. This variant is air dropped.
usn_mk48_6_adcap=Mk-48 Mod 6,ADCAP,Torpedo,The Mark 48 Mod 6 ADCAP is an American heavyweight torpedo. These torpedoes are wire guided and capable of being retargeted from the launch platform. The Mod 6 variant primarily improves the seeker on the torpedo, increasing countermeasure resistance and reliability, while also making the torpedo significantly quieter than its earlier counterparts.

plan_yu_3c=Yu-3C,Fish 3,Torpedo,The Yu-3C (Fish Type-3IIIG) is a Chinese active/passive heavyweight wire-guided dual purpose torpedo. A seeker upgrade of the Yu-3B, this torpedo includes Wake-Homing surface-attack abilities, making for a rather adept anti-submarine and anti-ship torpedo, and features improved countermeasure resistance, alongside an upgraded motor/battery for greater range and speed.
plan_yu6=Yu-6,Fish 6,ASW Torpedo,The Yu-6 (Fish Type-6) is a Chinese active/passive heavyweight wire-guided dual purpose torpedo. A major upgrade from the previous torpedoes, this is a modern, high-speed Otto-fueled (thermal propulsion) torpedo with an added wake-homing capability against surface targets. Overall, an extremely deadly modern torpedo, although limited to be used by only the highest tier of PLAN submarines (modern SSNs and SSKs) due to fire control limitations.

plan_yu_7c_air=Yu-7C,Fish 7,ASW Torpedo,The Yu-7C is a light-weight ASW torpedo developed by China based on licensed production of the American Mk46 Mod 2 torpedo. In 1978, Chinese militia recovered a US Mk46 Mod 1 Phase 2 torpedo in the South China Sea, which was subsequently studied and reverse-engineered by Chinese defense research institutions. In 1985, China and the United States reached an agreement, under which the US provided complete technical documentation, production equipment, and testing facilities to enable licensed production of the Mk46 Mod 2 torpedo in China. Through this technology transfer, China established its own RnD and production system for lightweight ASW torpedoes. The domestically produced version was designated as the Yu-7 torpedo. The Yu-7C represents an improved variant featuring enhanced propulsion efficiency and upgraded homing system performance, with capabilities roughly equivalent to the Mk46 Mod 5.
plan_yu_7c_ship=Yu-7C,Fish 7,ASW Torpedo,The Yu-7C is a light-weight ASW torpedo developed by China based on licensed production of the American Mk46 Mod 2 torpedo. In 1978, Chinese militia recovered a US Mk46 Mod 1 Phase 2 torpedo in the South China Sea, which was subsequently studied and reverse-engineered by Chinese defense research institutions. In 1985, China and the United States reached an agreement, under which the US provided complete technical documentation, production equipment, and testing facilities to enable licensed production of the Mk46 Mod 2 torpedo in China. Through this technology transfer, China established its own RnD and production system for lightweight ASW torpedoes. The domestically produced version was designated as the Yu-7 torpedo. The Yu-7C represents an improved variant featuring enhanced propulsion efficiency and upgraded homing system performance, with capabilities roughly equivalent to the Mk46 Mod 5.

plan_yu_12_air=Yu-12,Fish 12,ASW,The Yu-12 is China's latest generation of universal lightweight anti-submarine torpedo. It can be launched from shipborne torpedo launchers, anti-submarine helicopters, fixed-wing maritime patrol aircraft, and anti-submarine missiles. The torpedo employs a thermal-powered pump-jet propulsion system and is equipped with a new-generation active/passive acoustic homing seeker. Characterized by extended range, high speed, strong countermeasure resistance, and excellent platform adaptability, it represents a significant advancement in China's anti-submarine warfare capabilities. 
plan_yu_12_ship=Yu-12,Fish 12,ASW,The Yu-12 is China's latest generation of universal lightweight anti-submarine torpedo. It can be launched from shipborne torpedo launchers, anti-submarine helicopters, fixed-wing maritime patrol aircraft, and anti-submarine missiles. The torpedo employs a thermal-powered pump-jet propulsion system and is equipped with a new-generation active/passive acoustic homing seeker. Characterized by extended range, high speed, strong countermeasure resistance, and excellent platform adaptability, it represents a significant advancement in China's anti-submarine warfare capabilities.

jmsdf_type_89=Type 89,,Torpedo,The Type 89 torpedo (development name G-RX2) is a Japanese submarine-launched homing torpedo produced by Mitsubishi Heavy Industries. It replaced the unguided Type 72 torpedo.
jmsdf_type97_air=Type 97,,ASW Torpedo,The Type 97 lightweight torpedo (G-RX4) is a 324mm anti-submarine warfare (ASW) torpedo developed by Mitsubishi Heavy Industries for the Japanese Maritime Self-Defense Force. Introduced in the 1990s to replace the Mk 46. This variant is air dropped.
jmsdf_type97_ship=Type 97,,ASW Torpedo,Torpedo,The Type 97 lightweight torpedo (G-RX4) is a 324mm anti-submarine warfare (ASW) torpedo developed by Mitsubishi Heavy Industries for the Japanese Maritime Self-Defense Force. Introduced in the 1990s to replace the Mk 46. This variant is ship launched.

wp_ugst_1=UGST,Fizik,Torpedo,The UGST Fizik torpedo is a dual-purpose heavyweight torpedo that was developed from the failed USET-80 and limited TEST-71 torpedo programs, both of which formed the backline of ASW torpedoes in the Soviet sub-surface fleet. Compared to previous torpedoes, this is a generational leap in performance, mostly in kinematic and seeker performance. Active/Passive guidance combined with wake homing for attacking surface vessels, all utilizing a highly advanced guidance module and extremely sophisticated clutter/countermeasure rejection capabilities.
wp_test_71mk=TEST-71MK,,Torpedo,The TEST-71MK is a Soviet heavyweight dual purpose torpedo, albeit with limited anti-surface capabilities. Rushed into service as an alternative to the USET-80, the TEST-71MK has a limited anti-ship role, and improves on the prior model with a seeker more resistant to countermeasures.
wp_uset_80k=USET-80K,,ASW Torpedo,Torpedo,The USET-80K is an improved variant of the USET-80, a 533mm electrically powered heavyweight torpedo used by the Russian Navy. Introduced in 1989, it features the advanced "Keramika" acoustic sensor for enhanced passive and active acoustic homing against submarines and surface ships, with wake-homing capability for the latter. It has a maximum speed of 45–48 knots, a range of about 18,000 meters, a depth capability of up to 1,000 meters, and a 200–300 kg warhead.
wp_apr_3=APR-3,,ASW,The APR-3 is a Soviet air-dropped anti-submarine torpedo, built off the prior APR-2 lightweight ASW torpedo. This weapon is of a radically new design, and includes a highly sophisticated seeker and an extraordinarily powerful engine allowing for peak speeds of 100 knots, with a cruise speed of 60 knots. This culminates into a deep-diving extremely fast ASW torpedo that can catch unaware sailors by surprise, and isn't easily fooled by noisemakers.
wp_umgt_1m=UMGT-1M,,ASW Torpedo,The UMGT-1M is a Soviet air dropped anti-submarine torpedo which also serves as the payload for the SS-N-14 and SS-N-16 ASW missiles. These lightweight torpedoes pack less of a punch than Soviet heavyweight torpedoes but are still extremely dangerous. The M version has the ability to engage surface targets, faster speed, longer range, and a more advanced seeker.

# ---------------- Sonobuoys ---------------
wp_rgb_16m=RGB-16M,,Passive Sonobuoy,The RGB-16 a passive-only omnidirectional sonobuoy used as part of the Baku suite by the Soviet Union.
wp_rgb_16=RGB-16,Zarechye,Passive Basic Search,The RGB-16 a passive omnidirectional (range-only) 'basic search' sonobuoy used as part of the Korshun suite by the Soviet Union.\nHigher performance compared to previous (RGB-1, RGB-15) sonobuoys, and has an easier time detecting quiet US submarines.\n\nAs with many range-only sonobuoys, multiple are required to get an accurate location of an enemy submarine, using triangulation to determine position and bearing.
wp_rgb_26=RGB-26,Zarechye,Passive Refined Search,The RGB-26 is a passive directional (range & bearing) 'refined search' DIFAR type sonobuoy used by the Soviet Union.
wp_rgb_36=RGB-36,Zarechye,Active/Passive Sonobuoy,The RGB-36 is a hybrid active/passive sonobuoy with a short lifespan, but high accuracy and range.

usn_ssq_53f=AN/SSQ-53F,DIFAR,Sonobuoy,The SSQ-53F is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1. This version has a further improved hydrophone and allows for greater operational flexibility compared to prior models.
usn_ssq_62e=AN/SSQ-62E,DICASS,Active Sonobuoy,The AN/SSQ-62E DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys. This model has a significantly improved sonar system for greatly increased accuracy and range, alongside increasing the available frequencies the sonobuoy can detect, allowing for greater performance in littoral waters.
usn_ssq_77c=AN/SSQ-77C,VLAD,Sonobuoy,The SSQ-77C is a Vertical Line Array DIFAR passive sonobuoy, designed to be a generational improvement for the original DIFAR type passive sonobuoy. This buoy has a similar architecture to the DIFAR buoy, but incorporates an extremely sensitive sonar array that allows for extremely long passive range for a sonobuoy, high capability against quiet, deep-diving targets and exhibits good performance operating in cluttered, noisy waters.
usn_ssq_101=AN/SSQ-101A,ADAR,Active Sonobuoy,The AN/SSQ-101A ADAR is an active sonobuoy used for weapons-quality tracking of undersea targets like submarines. This is a highly capable active sonobuoy that can detect quiet or deep-diving submarine targets effectively, and can provide longer-range tracks on noisier submerged targets, allowing for effective long-range ASW operations.

# ---------- Anti-radar Missiles ---------
usn_agm_78d=AGM-78D,STARM,ARM,The AGM-78D Standard ARM was developed as a long-range anti-radiation missile to attack Soviet long-range SAM and radar sites. This complements the short-range AGM-45 Shrike as the high end ARM for the US, and has an advanced seeker to match
usn_agm_88a=AGM-88A,HARM,,The AGM-88A HARM was developed as a long-range anti-radiation missile to attack Soviet SAM and radar sites of all types. This missile is a complete replacement for earlier AGM-45 and AGM-78 missiles, doing the job of both without being too heavy or expensive. High speed and long range make this a potent weapon against emitting radar sites, and target memory prevents radar operators from being perfectly safe after intermittently shutting off their radars.
usn_agm_88g=AGM-88G,AARGM-ER,ARM,The AGM-88G Advanced Anti-Radiation Guided Missile-Extended Range (AARGM-ER) is a supersonic, air-launched tactical missile developed by Northrop Grumman for the U.S. Navy. It enhances the AGM-88E AARGM with a redesigned control section, an 11.5-inch diameter dual-pulse solid rocket motor, and aerodynamic strakes, doubling its range and speed. Designed to suppress and destroy enemy air defenses, it targets radar systems and is compatible with aircraft like the F-14E, A-6G, EA-6B, F/A-18E/F, EA-18G, and F-35A/C.
usn_agm_122=AGM-122,Sidearm,ARM,The AGM-122 Sidearm is a compact, lightweight anti-radiation missile currently in service with the U.S. military. Designed to suppress enemy air defenses, it homes in on radar emissions, effectively targeting and neutralizing surface-to-air missile sites and radar installations. With its agile performance and cost-effective design, the Sidearm is deployed on a variety of aircraft, providing pilots with a reliable tool to counter threats in contested airspace.
usn_agm_188=AGM-188A,LHARM,ARM,The AGM-188A LHARM (Long-range Hypersonic Anti-Radiation Missile) is an air-launched missile designed to home in on enemy radar emissions. Developed by Texas Instruments as a potential replacement for the AGM-78 and AGM-88, it uses a modified SM-2ER airframe to achieve hypersonic speeds and extended range. However, due to its high cost and heavy weight, it was not adopted as a general-purpose ARM and instead serves as a specialized weapon for targeting high-value or heavily defended radar sites.

plan_ld_10=LD-10,LaiDen-10,ARM,The Laiden-10 (LD-10) is a small - scale anti-radiation missile of the Chinese People's Liberation Army , which is a modified version of the Lightning-10 ( SD-10 ) medium-range air -to- air missile.

wp_as_11b=Х-58У,Kilter,ПКР,Х-58У - советская противорадиационная ракета, разработанная для оснащения штурмовиков Су-24М. Увеличенная дальность полета по сравнению с предыдущей версией за счет более мощного импульсного двигателя.

#-----------Land Strike only missiles---------
usn_agm_65e=AGM-65E,Maverick,Land Attack,Maverick E uses a laser designator guidance system optimized for fortified installations using a delayed fuse combined with a heavier penetrating blast-fragmentation warhead (140 kg (300 lb) vs. 57 kg (125 lb) in older models) that perforates a target with its kinetic energy before detonation.
usn_agm_65f=AGM-65F,Maverick,Land Attack,The AGM-65F is an American infrared-guided air-to-ground standoff weapon. This is the Navy's version of the Maverick, and utilizes the same airframe and heavy semi-armor-piercing warhead as the USMC AGM-65E, just with the Air Force's infrared-guided AGM-65D seeker. This seeker allows for longer range fire-and-forget operation day and night, and is more reliable against countermeasures.
usn_agm_84k=AGM-84K,SLAM-ER,Land Attack,The AGM-84K SLAM-ER (Standoff Land Attack Missile - Expanded Response) is a precision-guided, air-launched cruise missile developed by Boeing for the U.S. Navy. It’s an advanced derivative of the Harpoon missile, designed for long-range strikes against high-value land targets. With a range of over 270 kilometers (approximately 167 miles), it features a GPS-aided inertial navigation system, an imaging infrared seeker for terminal guidance, and a 360-kilogram (800-pound) warhead.
usa_agm_114r=AGM-114R,Hellfire II,Land Attack,The AGM-114 Hellfire is an American heliborne anti tank missile. In comparison to the earlier TOW it uses a semi active laser guidance.

usa_bgm_71f=BGM-71F,TOW-2B,Land Attack,The BGM-71 TOW is an American wire-guided anti-tank missile. The weapon is used from both helicopters and armoured vehicles.
usn_rgm_109c=RGM-109C,TLAM-C Block II,Land Attack,The Tomahawk Land Attack Missile (TLAM) is an American standoff land attack missile. These weapons fly a pre-programmed route to a target with no input from the launch platform after launch, using terrain contour matching using a terrain mapping radar and onboard digital maps.
usn_rgm_109c3=RGM-109C,TLAM-C Block III,Land Attack,The Tomahawk Land Attack Missile (TLAM) is an American standoff land attack missile. These weapons fly a pre-programmed route to a target with no input from the launch platform after launch, using terrain contour matching using a terrain mapping radar and onboard digital maps.
usn_rgm_109e=RGM-109M,MST Block Va,ASM/Land Attack,The RGM-109M Tomahawk Land Attack Missile (TLAM-E) Block Va, also known as the Maritime Strike Tomahawk (MST), is an advanced variant of the Tomahawk cruise missile designed for the U.S. Navy. It features enhanced anti-ship capabilities, integrating a new seeker for engaging moving maritime targets at ranges exceeding 1,000 miles.
usn_ugm_109e=UGM-109M,MST Block Va,ASM/Land Attack,The RGM-109M Tomahawk Land Attack Missile (TLAM-E) Block Va, also known as the Maritime Strike Tomahawk (MST), is an advanced variant of the Tomahawk cruise missile designed for the U.S. Navy. It features enhanced anti-ship capabilities, integrating a new seeker for engaging moving maritime targets at ranges exceeding 1,000 miles. This version is submarine launched.
usn_rgm_109e5=RGM-109E-5,TLAM-E Block Va,Land Attack,The Tomahawk Land Attack Missile (TLAM) is an American standoff land attack missile. These weapons fly a pre-programmed route to a target with no input from the launch platform after launch, using terrain contour matching using a terrain mapping radar and onboard digital maps.
usn_rgm_109e_tactical=RGM-109E,TLAM-E Block IV,Land Attack,The Tomahawk Land Attack Missile (TLAM) is an American standoff land attack missile. These weapons fly a pre-programmed route to a target with no input from the launch platform after launch, using terrain contour matching using a terrain mapping radar and onboard digital maps. The Tactical Tomahawk (RGM-109E) is a major rework of the original TLAM missile, with a new airframe and rebuilt guidance system allowing for mid-flight updates, this missile is truly a modern land-attack missile.
usn_ugm_109e_tactical=UGM-109E,TLAM-E Block IV,Land Attack,The Tomahawk Land Attack Missile (TLAM) is an American standoff land attack missile. These weapons fly a pre-programmed route to a target with no input from the launch platform after launch, using terrain contour matching using a terrain mapping radar and onboard digital maps. The Tactical Tomahawk (RGM-109E) is a major rework of the original TLAM missile, with a new airframe and rebuilt guidance system allowing for mid-flight updates, this missile is truly a modern land-attack missile. This version is submarine launched.
usn_cps=CPS,,Land Attack,The Conventional Prompt Strike (CPS) is the U.S. Navy's operational hypersonic boost-glide weapon system, utilizing a two-stage solid rocket motor to propel a Common Hypersonic Glide Body (C-HGB) equipped with a kinetic energy projectile for precision strikes. The system achieves velocities exceeding Mach 5 during the glide phase, enabling maneuverable trajectories that evade integrated air and missile defenses while delivering non-nuclear payloads over intercontinental ranges in under an hour. 

plan_cj_10a=CJ-10A,Long Sword 10,Land Attack,The CJ-10 is a long-range land-attack cruise missile developed by China. Compatible with the HT-1 naval vertical launch system, it is deployed aboard the PLAN's Type 052D and Type 055 guided-missile destroyers. The missile features extended range and high precision, capable of ultra-low-altitude flight, deep penetration, and sequential strikes. It serves as a critical component of the PLAN's long-range ground strike capabilities.
plan_cj10k=CJ-10K,Long Sword 10,Land Attack,The CJ-10 is a long-range land-attack cruise missile developed by China. Compatible with the HT-1 naval vertical launch system, it is deployed aboard the PLAN's Type 052D and Type 055 guided-missile destroyers. The missile features extended range and high precision, capable of ultra-low-altitude flight, deep penetration, and sequential strikes. It serves as a critical component of the PLAN's long-range ground strike capabilities.
wp_ss_n_30a=Р-30,Sizzler,Land Attack,Версия "Калибра" для наземных ударов.

wp_as_18=Х-59M,Kazoo,ПЛО,AS-18 Kazoo, также известная как Х-59M "Овод-М", представляет собой российскую крылатую ракету класса "воздух-поверхность", предназначенную в первую очередь для нанесения ударов по суше. Он оснащен турбореактивным двигателем, обеспечивающим дальность действия до 285 км, и несет боеголовку большего размера — либо 320-килограммовую осколочно—фугасную, либо 280-килограммовую кассетную - по сравнению со своим предшественником, Х-59.

