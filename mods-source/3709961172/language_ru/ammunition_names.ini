usn_aim-9m=AIM-9M,Sidewinder,УРВВ,AIM-9M Sidewinder - американская ракета класса "воздух-воздух" с инфракрасным наведением. Модель M обладает улучшенными помехозащищенными возможностями по сравнению с моделью L и использует двигатель с низким расположением хвостового оперения, что затрудняет ее обнаружение на близком расстоянии.

usn_aim-9x=AIM-9X,Sidewinder,УРВВ,AIM-9X Sidewinder - американская ракета класса "воздух-воздух" с инфракрасным наведением. Модель X была значительно модернизирована, получила мощные средства защиты от помех, увеличенную дальность полета и впечатляющую возможность стрельбы в обратном направлении.

usaf_aim-120c7=AIM-120C-7,СУРВВ,УРВВ,AIM-120 - это американская ракета класса "воздух-воздух" с активным радиолокационным наведением, используемая для замены старой полуактивной ракеты класса "воздух-воздух" Sparrow с радиолокационным наведением. Она относительно небольшая и может перевозиться большинством самолетов.

