su_as-17a=X-31П,,ARM,Тактическое ракетное вооружение корпорации Kh-31P (AS-17 "Криптон") - советская сверхзвуковая противорадиационная ракета, во многом похожая на Р-270. Она выглядит как уменьшенная версия Р-270. Сообщается, что есть планы переоборудовать его в ракету класса "воздух-воздух" большой дальности.

# ---------- Anti-ship Missiles ----------

su_as-17=X-31A,,ASM,Тактическое ракетное вооружение корпорации Kh-31A (AS-17 "Криптон") - советская сверхзвуковая противорадиационная ракета, во многом похожая на Р-270. Она выглядит как уменьшенная версия Р-270. Сообщается, что есть планы переоборудовать его в ракету класса "воздух-воздух" большой дальности.

su_as-18=X-59M,,ASM,Ракета Х-59М корпорации "Тактическое ракетное вооружение" (AS-18 Kazoo) Это российская дозвуковая ракета класса "воздух-поверхность"/корабль. По сравнению с Х-59, ракета типа "М" имеет большую дальность полета и более высокую скорость.

su_as-20=X-35,,ASM,"Звезда" Х-35 (AS-20 "Каяк") Это российская дозвуковая противокорабельная ракета. Поскольку ее внешний вид и характеристики аналогичны характеристикам американской ракеты "Гарпун", ее прозвали "Гарпунской". Он предназначен для атаки судов водоизмещением менее 5000 тонн.

#-----------Land Strike only missiles---------

su_as-14=X-29T,,AGM,"Вымпел" Х-29Т (AS-14 Kedge)Это советская сверхзвуковая ракета класса "воздух-земля" с телевизионным наведением, обладающая большой мощностью, которая может быть использована для уничтожения кораблей водоизмещением не более 10 000 тонн.

su_kab-1500kr=-КАБ-1500KR,,AGM,КАБ-1500КР корпорации "Тактическое ракетное вооружение" - это российская бомба с телевизионным наведением, аналогичная американской управляемой бомбе GBU-8/15, но КАБ-1500КР обладает лучшими характеристиками.

su_kh-35=X-35,,AGM,"Звезда" Х-35 (AS-20 "Каяк") Это российская дозвуковая противокорабельная ракета. Поскольку ее внешний вид и характеристики аналогичны характеристикам американской ракеты "Гарпун", ее прозвали "Гарпунской". Он предназначен для поражения кораблей водоизмещением менее 5000 тонн.Его также можно использовать для атаки наземных целей.

su_kh-38=Х-38МАЭ,,AGM,Х-38МАЭ корпорации "Тактическое ракетное вооружение" - российская тактическая ракета. Ракета представляет собой модульное оружие с несколькими головками наведения. МЕ имеет активное радиолокационное наведение.
