wp_test_71mk=ТЕСТ-71МК,,Торпеда,"ТЕСТ-71МК" - это советская тяжелая торпеда двойного назначения, хотя и с ограниченными противолодочными возможностями. Принятый на вооружение в качестве альтернативы "УСЕТ-80", "ТЕСТ-71MK" выполняет ограниченную противокорабельную функцию и является улучшением предыдущей модели за счет самонаведения и большей стойкости к противодействию.
wp_ugst_1=UGST,Fizik,Torpedo,Торпеда УГСТ "Физик" - это тяжелая торпеда двойного назначения, разработанная на основе неудачных торпедных программ "УСЕТ-80" и ограниченной серии "ЕСТ-71", которые легли в основу противолодочных торпед советского подводного флота. По сравнению с предыдущими торпедами, это новое поколение торпед с улучшенными характеристиками, в основном в кинематике и самонаведении. Активное/пассивное наведение в сочетании с самонаведением в кильватерном следе для атакующих надводных кораблей, все это с использованием высокоразвитого модуля наведения и чрезвычайно сложных возможностей устранения помех/контрмер.

