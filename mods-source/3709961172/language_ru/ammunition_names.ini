su_aa-10a=Р-27Р,,AAM,,Р-27Р "Вымпел" (AA-10A "Аламо") - советская полуактивная ракета класса "воздух-воздух" средней дальности с радиолокационным наведением, в которой для повышения маневренности ракеты инновационно использовано перевернутое трапециевидное крыло.

su_aa-10b=Р-27T,,AAM,,Р-27Т "Вымпел" (AA-10B "Аламо") - советская полуактивная ракета класса "воздух-воздух" средней дальности с инфракрасной головкой самонаведения и меньшей дальностью полета, чем у Р-27Р.

su_aa-10c=Р-27ЭР,,AAM,,Р-27ЭР "Вымпел" (AA-10C "Аламо") - вариант с полуактивной РГС увеличенной дальности. На 0,7 м длиннее и немного шире. Дальность пуска 0,5-95 км. На вооружении в СССР с 1990 года.

su_aa-10d=Р-27ЭТ,,AAM,,Р-27ЭТ "Вымпел" (AA-10D "Аламо") - вариант с ИК ГСН и увеличенной дальностью пуска. Масса — 343 кг. Дальность пуска 90 км. На вооружении в СССР с 1990 года.

su_aa-11=Р-73,,AAM,Р-73 "Вымпел" (AA-11 "Лучник") - это инфракрасная зенитно-ракетная установка, разработанная Советским Союзом в 1970-х и 1980-х годах. В ракете R-73 впервые был использован векторный двигатель, что придало ракете гораздо большую маневренность, чем в современных ракетах. Она считается одной из самых опасных противоракет.

su_aa-12=Р-77,,AAM,Р-77 "Вымпел" ("Сумматор" АА-12)Это российская ракета класса "воздух-воздух" средней дальности с активным радиолокационным наведением. Научно-исследовательские и опытно-конструкторские работы начались еще в советское время, но были завершены только после распада Советского Союза. В ракете используется уникальная аэродинамическая схема с решетчатым крылом, которая обеспечивает ракете отличные скоростные характеристики, но также увеличивает сопротивление на низкой скорости.

su_aa-12_1=Р-77-1,,AAM,Р-77-1 "Вымпел" (сумматор AA-12)Это российская ракета класса "воздух-воздух" средней дальности с активным радиолокационным наведением, усовершенствованная по сравнению с Р-77 и обладающая большей дальностью действия.

su_aa-12_pd=Р-77-ПД,,AAM,Р-77-ПД "Вымпел" (сумматор АА-12)Это российская ракета класса "воздух-воздух" большой дальности с активным радиолокационным наведением, оснащенная прямоточным воздушно-реактивным двигателем, дальность действия которой значительно увеличена по сравнению с предыдущей моделью.

su_aa-13=Р-37М,,AAM,Ракета Р-37М "Вымпел" (AA-13 Axehead)Это российская ракета класса "воздух-воздух" с активным радиолокационным наведением сверхдальней дальности, обладающая высокой скоростью и дальнобойностью полета и используемая для выполнения задач по перехвату.
