# ------------------ Guns -----------------
ger_27mm=27mm,,MLG 27,High-rate 27 mm ammunition for the MLG 27 remote mount used in close-in defense. The family includes suitable natures for surface and limited air targets. Effective employment relies on stabilized fire control and good cueing. Typical roles are warning fire and the defeat of small boats and UAVs at short range. Magazine selection depends on ship doctrine and expected threats.
30mm_SeaSnake_ABM=30mm ABM,,SeaSnake
30mm_SeaSnake_AP=30mm AP,,SeaSnake

leo_cal_127mm_HE-PFF=127m HE-PFF
leo_cal_127mm_vulcano_BER=127mm Vulcano BER
# ------------------ CIWS -----------------
ger_HEL=HEL,Rheinmetall High Energy Laser,Laser Weapon,A shipborne high-energy laser system intended for close-in defense against small, fast targets. It engages by delivering sustained energy on a line-of-sight track to damage or disable sensors, control surfaces, or structural elements, and is most effective against UAVs and small boats. Performance is strongly dependent on atmospheric conditions, stabilization quality, target aspect, and dwell time. Integration with the fire-control chain and precise tracking is critical for consistent results.
ger_cal_762=7.62mm AP
# ----------- Noisemakers/Chaff -----------
ger_MASS_omnitrap=MASS Omni-Trap,,Chaff,A multispectral 81 mm decoy round for the MASS launcher family. Payloads can be programmed to create screening and seduction effects in RF, IR, and EO bands. Salvos are coordinated with ship maneuvers and EW doctrine to defeat missile seekers. The system supports layered soft-kill when combined with onboard ECM. Effectiveness depends on timing, geometry, and the threat seeker type.
ger_MASS_ATD_noisemaker=MASS ATD,,Noisemaker,An optional anti-torpedo capability for MASS that launches expendable acoustic effectors. The decoys are used to distract or confuse incoming torpedoes while the ship maneuvers. Firing is coordinated with sonar warnings and countermeasure doctrine. The approach extends soft-kill protection into the underwater domain. Inventory is limited and employment is conditioned by water conditions and threat behavior.
ger_C303S_noisemaker=C303/S Noisemaker,,Noisemaker,An expendable acoustic noisemaker launched via the C303/S countermeasure ejector system to degrade torpedo homing. The decoy increases local acoustic clutter and can mask the platform’s true bearing to delay or disrupt seeker classification. Best results are achieved when combined with course and depth changes and layered countermeasures. Inventory is limited and employment depends on sonar warning quality and threat type.
# ----------------- Decoys ----------------
ger_C303S_MTE=C303/S MTE,Mobile Target Emulator,Torpedo Decoy,A mobile expendable acoustic decoy deployed from the C303/S countermeasure ejector system. It is intended to seduce or distract incoming torpedoes by presenting a convincing moving target signature and forcing the seeker to commit to the decoy. Use is coordinated with evasive maneuvers and additional countermeasures to break the engagement geometry. Effectiveness depends on timing, separation, and local water conditions.
