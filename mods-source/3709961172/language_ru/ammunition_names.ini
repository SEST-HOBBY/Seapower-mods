usaf_gbu-31_v1=GBU-31(V)1,УМПК,Land Strike,Joint Direct Attack Munition - это вспомогательное оборудование для авиабомб, разработанное компанией Boeing совместно для ВМС и ВВС США. Оно устанавливается на традиционные авиабомбы, сбрасываемые с самолетов, для преобразования изначально неуправляемых традиционных авиабомб в управляемое высокоточное оружие, которое может использоваться в суровых погодных условиях.

