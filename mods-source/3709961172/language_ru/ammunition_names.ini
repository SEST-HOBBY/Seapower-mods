# ------------------ SAM ------------------
usn_rim-161c=RIM-161C,SM-3 Blk IB,BMD,An exo-atmospheric hit-to-kill interceptor for Aegis BMD that engages ballistic missiles in the midcourse phase. Compared to earlier SM-3 variants, Block IB improves endgame performance and target discrimination with a two-color infrared seeker and an upgraded divert and attitude control system on the kinetic warhead. After shipboard cueing and datalink updates, the third stage separates and the kinetic warhead homes using its IR seeker and divert thrusters to collide with the target. It carries no explosive warhead and is not intended for aircraft or cruise missiles.usn_rim-161d=RIM-161D,SM-3 Blk IIA,BMD,An extended-reach evolution of SM-3 with a larger booster and enhanced kill vehicle. The concept aimed at higher-velocity intercepts and expanded midcourse coverage. It remained a development concept and did not enter service. In databases it should be treated as not fielded and unavailable for loadouts. Any performance data is speculative and should not drive gameplay balance.
usn_rim-161d=RIM-161D,SM-3 Blk IIA,BMD,A US-Japan co-developed evolution of SM-3 that expands Aegis BMD coverage with larger diameter propulsion stages and a more capable kinetic warhead, delivering higher burnout velocity and a larger defended footprint against longer-range and more stressing ballistic missile threats. Like other SM-3 variants it performs exo-atmospheric hit-to-kill midcourse intercepts using ship and network cueing, then terminal infrared homing with divert thrusters, without an explosive warhead. Block IIA has been flight tested against an ICBM-class target and has seen operational combat use for ballistic missile defense. It is launched from Mk 41 VLS on Aegis ships and is also associated with Aegis Ashore configurations, but it is not intended for aircraft or cruise missiles.
usn_rim-116b=RIM-116B,RAM Blk IB,SAM,A short-range CIWS-class missile combining passive RF homing with an imaging IR seeker. It is optimized to defeat sea-skimming anti-ship missiles and can also engage small UAVs and fast craft. Dual-mode guidance allows handover to IR if the target stops emitting. The system is ship-agnostic and uses a self-contained launcher with minimal ship-side support. Effective use depends on reliable cueing and doctrine for salvo timing.
usn_rim-116e=RIM-116E,RAM Blk IIB,SAM,An improved RAM variant with higher kinematics and upgraded guidance for maneuvering threats and complex endgames. The missile enhances counter-UAS and anti-missile performance while retaining the same launcher interface. Software and seeker updates provide better clutter rejection and raid handling. It remains a short-range defensive effector for the inner layer. Magazine depth and firing doctrine are critical to effectiveness.
usn_rim-162a=RIM-162A,ESSM Blk I,SAM,A semi-active radar homing surface-to-air missile for point and local area defense. It requires terminal illumination from a fire-control radar to guide in the endgame. The missile offers high agility against sea-skimmers and conventional aircraft. Integration supports quad-pack in Mk 41 VLS and interfaces with legacy combat systems. Performance depends on illuminator availability and geometry during the final seconds.
usn_rim-162b=RIM-162B,ESSM Blk I,SAM,A semi-active ESSM variant tailored for non-Aegis combat systems while retaining VLS quad-pack capability. It provides improved maneuverability over earlier point-defense missiles and helps thicken ship self-defense. Guidance depends on shipboard illuminators for terminal homing. Midcourse command and autopilot reduce illuminator time where supported. Engagement envelopes vary with radar horizon and target altitude.
usn_rim-162d=RIM-162D,ESSM Blk I,SAM,A rail-launched ESSM version for Mk 29 launchers without thrust-vector control. It provides short-to-medium range point defense on platforms without VLS. Guidance is semi-active and requires a fire-control radar in the terminal phase. Kinematics are reduced compared to the VLS variant. It remains a viable upgrade path for older ships with legacy launchers.
usn_rim-162h=RIM-162H,ESSM Blk II,SAM,An active radar seeker variant that reduces reliance on terminal illumination. The missile retains Mk 41 quad-pack compatibility and improves endgame agility and clutter rejection. Midcourse guidance is provided via the combat system with datalink updates where available. It enhances raid handling and off-boresight opportunities within the local area envelope. Performance benefits from good quality tracks from 3D surveillance radars.
usn_rim-162j=RIM-162J,ESSM Blk II,SAM,An active seeker ESSM integration for non-Aegis combat systems. The missile offers better autonomy in terminal guidance and supports complex multi-target scenarios. Quad-pack compatibility is retained for magazine efficiency. Engagements depend on reliable midcourse cueing from the CMS. It improves performance against sea-skimmers and maneuvering aircraft compared to semi-active variants.
usn_rim-174a=RIM-174A,SM-6 Blk IA,SAM,A long-range multi-mission missile supporting air defense, anti-surface strike, and terminal BMD roles. Guidance combines active terminal homing with networked midcourse support through the combat system. The weapon extends defended footprints for ships with suitable sensors and doctrine. It can engage high-value airborne threats at extended ranges when cued. Use is governed by rules of engagement due to its reach and kinematics.
usn_rim-174b=RIM-174B,SM-6 Blk IAU,SAM,An improved SM-6 baseline with updated seeker processing and software enhancements. Changes support better raid handling and more robust performance in cluttered environments. Engagement envelopes may expand depending on ship sensors and doctrine. The missile remains compatible with Mk 41 VLS and existing interfaces. It continues to serve across AAW and selected terminal defense missions.
usn_rim-66m-2=RIM-66M-2,SM-2MR Blk IIIA,SAM,A medium-range area defense missile using semi-active radar homing. Block 3A improved low-altitude performance against sea-skimming threats. It relies on shipboard illuminators for the final guidance phase. The missile is typically employed as part of layered air defense. Effective use depends on track quality and illuminator scheduling in multi-target scenarios.
usn_rim-66m-5=RIM-66M-5,SM-2MR Blk IIIB,SAM,A newer SM-2 medium-range iteration with guidance and ECCM improvements. It enhances performance against maneuvering aircraft and missiles in jamming environments. Semi-active terminal homing requires reliable illumination geometry. The missile integrates with modern combat systems for coordinated engagements. It remains a backbone effector for area air defense on qualified platforms.
usn_rim-66p=RIM-66P,SM-2MR Blk IIIC,SAM,A medium-range area air-defense missile from the SM-2 family. It uses inertial guidance with mid-course updates and terminal semi-active radar homing (depending on variant/doctrine). Employed for fleet air defense against aircraft and cruise missiles.
usn_rim-7p=RIM-7P,,SAM,A legacy semi-active point-defense missile used from rail or VLS launchers. It provides short-range air defense against aircraft and older anti-ship missiles. Guidance requires a fire-control radar for terminal illumination. Inventory is retained for certain platforms and training roles. It is gradually superseded by ESSM on modern ships.
ger_IDAS=IDAS,,SAM,IDAS (Interactive Defence and Attack System for Submarines): An encapsulated short-range missile system launched from a submarine torpedo tube for self-defense and limited strike options. It is primarily intended to engage ASW helicopters and maritime patrol aircraft, and can also be used against small surface targets depending on engagement geometry. Guidance and seeker behavior are optimized for fast-reacting, close-in threats. Effective employment depends on target aspect, mast exposure, and tactical timing.
# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------
knm_nsm_1a=NSM,Naval Strike Missile Blk IA,ASM,A low-observable subsonic anti-ship and land-attack missile with an imaging infrared seeker. The guidance uses terrain and scene matching plus waypointing for complex approach paths. Sea-skimming and terminal maneuvers enhance survivability against modern defenses. The IIR seeker enables discrimination of targets in cluttered littorals. It can also strike selected land targets when authorized.
knm_3sm_tyrfing=3SM,Tyrfing,ASM
swe_rbs15_mk3=RBS15 Mk3,,ASM,A long-range subsonic anti-ship and land-attack missile with an active radar seeker. Mission planning supports waypointing and flexible approach profiles at low altitude. The missile maintains sea-skimming flight to limit detection and reaction time. Guidance and ECCM are designed for contested littoral environments. Selected variants support limited land-attack missions where permitted.

#-----------Land Strike only missiles---------

# ---------- Anti-sub  Missilies ----------

# ------------------ RBU ------------------

# ---------- Torpedoes ----------
ger_mu_90_ship=MU 90,,ASW Torpedo,A lightweight anti-submarine torpedo with active and passive acoustic homing. It is designed to perform in both shallow littoral waters and deep ocean conditions. The torpedo incorporates counter-countermeasure features to cope with decoys and noise. Launch is from 324 mm tubes or by helicopter and aircraft. Performance depends on environmental conditions and target tactics.
ger_seaspider=SeaSpider,,Anti-Torpedo Torpedo,An anti-torpedo torpedo intended for hard-kill defense of ships and high-value assets. The effector autonomously intercepts incoming torpedoes based on onboard processing. It complements soft-kill decoys by providing a terminal hard-kill option. Integration requires cueing from ship sensors and engagement doctrine. Inventory and loadout depend on platform and mission priorities.
ger_dm2a4=DM2A4,SeaHake,Torpedo,A heavyweight submarine-launched torpedo with wire-guidance and terminal active/passive acoustic homing. Designed for long-range engagements against submarines and surface ships with strong counter-countermeasure capability against decoys and noise. Attack performance depends on doctrine, environmental conditions, and target maneuvers. Loadout and employment are constrained by tube availability and reload procedures.
