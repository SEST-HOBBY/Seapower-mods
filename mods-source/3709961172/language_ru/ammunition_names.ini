rfn_kh35=Х-35,Х‑35 «Уран»,ПКР,Х-35 - это дозвуковая противокорабельная ракета большой дальности, способная скользить по морю. Она оснащена твердотопливным ускорителем, турбореактивной силовой установкой, высокоточным радиовысотомером и активной радиолокационной системой наведения на конечном этапе полета. Ракета Х-35 является советским аналогом американской ракеты Harpoon.
rfn_kh35u=Х-35У,Х‑35 «Уран»,ПКР,Х-35 - это дозвуковая противокорабельная ракета большой дальности, способная скользить по морю. Она оснащена твердотопливным ускорителем, турбореактивной силовой установкой, высокоточным радиовысотомером и активной радиолокационной системой наведения на конечном этапе полета. Ракета Х-35 является советским аналогом американской ракеты Harpoon. Ракета Х-35У оснащена усовершенствованной двигательной установкой, которая удваивает эффективную дальность полета крылатой ракеты со 130 км до 260 км.
