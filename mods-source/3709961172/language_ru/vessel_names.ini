DefaultDescription=The Kansas-class is a class of guided-missile cruisers developed under the Cruiser Baseline (CGBL) program. Based on an expanded Arleigh Burke hull, they were designed to carry the combat systems and capabilities of the Ticonderoga-class in a more modern, survivable platform. Equipped with the Aegis Combat System, AN/SPY-1 radar, and a 122-cell Vertical Launch System, they provide extensive anti-air, anti-surface, and strike capabilities. Two helicopter hangars support SH-60 Seahawks for extended anti-submarine warfare operations. Built with increased displacement, improved damage control systems, and upgraded power generation, the Kansas-class offers greater endurance and combat resilience than previous cruiser designs.
