[ger_ssk_type_212a_batch1_upgraded]
Type=ДЭПЛ,Ударная субмарина
Default=Тип 212A (Партия 1 Улучшенная),Тип 212A
DefaultDescription=Для операций, запланированных на 2030 год, два дополнения расширяют возможности системы ПВО: IDAS предоставляет возможность ближней противовоздушной обороны с подводных лодок от вертолетов противолодочной обороны и патрульных самолетов, в то время как SeaSpider предлагает противоторпедную систему с жестким поражением, позволяющую уничтожать приближающиеся угрозы на близком расстоянии, когда одного только мягкого поражения недостаточно. Основная смертоносность по-прежнему сосредоточена на тяжелых торпедах с проводным наведением для противолодочной и надводной борьбы, которые дополняются многоуровневыми контрмерами и тщательным маневрированием для прекращения боевых действий и восстановления разделения. В целом: охотник с высокой живучестью и разведывательными способностями, оптимизированный для скрытого присутствия и нанесения решающих подводных ударов, теперь с усиленной защитой от воздушных и торпедных угроз.
Variant1=S181 U31,U31
Variant2=S182 U32,U32
Variant3=S183 U33,U33
Variant4=S184 U34,U34

[ger_ssk_type_212a_batch1]
Type=ДЭПЛ,Ударная субмарина
Default=Тип 212A (Партия 1),Тип 212A
DefaultDescription=Разработанная как современная ударная подводная лодка с воздухонезависимым двигателем (AIP) для ВМС Германии, модель 212A отличается скрытностью, выносливостью и возможностью устраивать засады как на побережье, так и в открытом океане. Малозаметный корпус, бесшумный электропривод и система AIP на топливных элементах позволяют проводить длительные подводные операции при очень низкой акустической мощности, обеспечивая скрытое патрулирование и тщательное преследование целей. Боевая система объединяет в себе полный набор гидролокаторов, включая боковые датчики и датчики перехвата, а также буксируемую систему для улучшения дальности обнаружения, что позволяет лодке получать высококачественную подводную картинку при минимальном уровне выбросов. Основная смертоносность обеспечивается тяжелыми торпедами с проводным наведением для борьбы с подводными лодками и надводными кораблями, которые дополняются многоуровневыми контрмерами "мягкого поражения" для прекращения торпедного боя и восстановления разделения. В целом: охотник с высокой живучестью и разведывательными способностями, оптимизированный для скрытого присутствия и нанесения решающих подводных ударов, а не для преследования на высокой скорости.
Variant1=S181 U31,U31
Variant2=S182 U32,U32
Variant3=S183 U33,U33
Variant4=S184 U34,U34

