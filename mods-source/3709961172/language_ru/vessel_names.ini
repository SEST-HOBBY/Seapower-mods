[jmsdf_ddh_fuso]
Type=DDH,Aircraft Carrier
Default=Fusō-class (Fictional),Fusō
DefaultDescription=The Fusō-class Helicopter Destroyer (DDH) is a vital asset in the Japan Maritime Self-Defense Force (JMSDF), designed with a primary role in anti-submarine warfare (ASW). It features the advanced OPS-50 radar system for robust air and surface tracking, ensuring comprehensive situational awareness. The ship is equipped with MK41 Vertical Launch Systems (VLS), housing RGM-109C Tomahawk Land Attack Missiles (TLAMs) for precision strikes and Type 07 vertical-launch anti-submarine rockets for ASW operations. Its expansive flight deck and hangar support the AV-8BJ Hayabusa, a Japanese variant of the AV-8B Plus, for rapid air support, alongside a complement of HSS-3J helicopters dedicated to ASW missions. Enhanced by a bow-mounted SQS-53 sonar, the Fusō-class excels in detecting and neutralizing submarine threats, making it an essential component of the JMSDF.
