Default=Nathanael Greene-class (Fictional),Nathanael Greene
DefaultDescription=The Nathanael Greene-class AEM (Missile Ammunition Auxiliary) is a United States missile-armed warship colloquially known as an 'Arsenal Ship' from the program of the same name. In the 1980's, the USN had determined that with the introduction of Mark 41 VLS and the Tomahawk missile, the fleet could easily expend hundreds of missiles in a single week, so studies were made to plan a new generation of VLS-armed warships, and the concept of a very large warship carrying 384 VLS cells alone became attractive. The Nathanael Greene-class replaced the earlier Nathan Hale-class (which used modified conventional bulk-carrier conversions to keep costs low) and is the dedicated purpose-built design developed from the 1995 LMMS Marine Systems concept, featuring a specialized double-hull layout optimized for maximum VLS capacity, stealth, and low manning, with VLS and other systems providing only a minimum amount of self-defense.
