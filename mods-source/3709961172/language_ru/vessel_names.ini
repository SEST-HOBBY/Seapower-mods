DefaultDescription=Проект 1144.4 "Орлан", или "Киров II", вторая партия линейных крейсеров класса "Киров" с управляемыми ракетами, представляет собой модернизированный атомный военный корабль, состоящий на вооружении ВМФ России, водоизмещением 24 300-28 000 тонн. Эта мощная платформа заменила устаревшие радары Top Sail и Top Steer на современный комплект датчиков, включая плоские панели "Марс Пассат", установленные вокруг надстройки для наблюдения за воздухом на 360 градусов, радар МР-850 "Форум" чрезвычайно большой дальности, созданный на базе "Подберезовик" предназначен для раннего обнаружения угроз, а радар "Фрегат-МА" - для слежения на средней дальности за движущимися в море целями. Его противовоздушная оборона усилена ЗРК большой дальности 3С90М "Штиль" и ракетным комплексом малой дальности 9К331 "Кинжал", обеспечивающими надежную многоуровневую защиту. Точечная оборона усилена ЗАК "Кортик", объединяющими 30-мм поворотные пушки и ракеты 9M311K для перехвата угроз на близком расстоянии. Первоначальные 20 ракет P-700 "Гранит" были заменены на 128 батарей УВП УКСК, которые несут 64 противокорабельные ракеты "Калибр 3М54Т" с дальностью действия до 660 км и 64 противокорабельные ракеты 3М55 "Оникс" - сверхзвуковые противокорабельные ракеты с дальностью действия около 600 км, повышающие его противокорабельные и ударные возможности. Это переоснащение в сочетании с передовыми датчиками и комплексной защитой гарантирует, что "Киров II" остается доминирующей многоцелевой платформой в современной морской войне.
