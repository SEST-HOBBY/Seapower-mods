DefaultDescription=The Hollywood-class is a derivative of the Seawolf-class that incorporates a vertical launch system to expand its missile capability. Each submarine is fitted with 12 Mk 36 bow VLS cells, in addition to the standard eight torpedo tubes capable of deploying up to 50 torpedoes or missiles. Retaining the speed, quieting, and reactor design of the Seawolf, they are optimized for anti-submarine, strike, and surveillance missions. Vessels of the class are named after prominent figures in film, giving the group a distinctive identity within the U.S. Navy.
