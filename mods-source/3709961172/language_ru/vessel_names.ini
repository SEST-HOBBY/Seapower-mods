DefaultDescription=Усовершенствованная подводная лодка пр. 636.3 «Варшавянка» - это усовершенствованная дизель-электрическая ударная подводная лодка российской разработки, являющаяся модернизацией оригинальной подводной лодки класса "Кило" (проект 877). Построенный на Адмиралтейских верфях в Санкт-Петербурге, он отличается повышенной скрытностью, улучшенными датчиками и модернизированными боевыми системами. При водоизмещении около 3950 тонн в подводном положении он несет 18 торпед, крылатые ракеты противокорабельного и наземного базирования (например, "Калибр") и усовершенствованный гидролокатор. Его воздушно-независимая двигательная установка увеличивает срок службы под водой, что делает его идеальным для прибрежных операций и операций на открытой воде.
