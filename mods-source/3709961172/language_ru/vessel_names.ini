[usn_aem_nathan_hale]
Type=AEM,Fleet Auxiliary
Default=Nathan Hale-class (Fictional),Nathan Hale
DefaultDescription=The Nathan Hale-class AEM (Missile Ammunition Auxillary) is a very large United States missile-armed warship colloquially known as an 'Arsenal Ship' from the program of the same name. In the 1980's, the USN had determined that with the introduction of Mark 41 VLS and the Tomahawk missile, the fleet could easily expend hundreds of missiles in a single week, so studies were made to plan a new generation of VLS armed warships, and the concept of a very large warship carrying 500+ missiles alone become attractive. However, such a purpose-built warship would be exorbitantly expensive, so the Nathan Hale-class uses a modified conventional Bulk Carrier layout, with VLS and other systems to provide a minimum amount of self defense.
