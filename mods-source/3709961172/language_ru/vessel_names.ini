DefaultDescription=The Virginia-class nuclear-powered guided-missile cruisers received a Vertical Launch System refit to enhance their strike and air defense capabilities. The modernization replaced the existing twin-arm launchers with Mk 41 VLS modules, allowing the ships to carry a larger and more versatile mix of Standard Missiles, Tomahawk cruise missiles, and ASROC anti-submarine weapons. Upgraded combat systems and fire control software improved target tracking and engagement speed, while the ships retained their nuclear propulsion, granting unlimited range and high sustained speeds. The refit extended the operational relevance of the class, enabling them to counter evolving air, surface, and subsurface threats with greater flexibility.
