[usn_ssn_seawolf_rsa]
Type=SSN,Attack Submarine
Default=Seawolf-class,Seawolf
DefaultDescription=The Seawolf-class submarines are nuclear-powered fast attack submarines built as advanced successors to the Los Angeles-class. Only three were constructed: USS Seawolf (SSN-21), USS Connecticut (SSN-22), and USS Jimmy Carter (SSN-23). They are faster, quieter, and more heavily armed, powered by the S6W nuclear reactor driving a pump-jet propulsor. Designed for missions including anti-submarine warfare, intelligence gathering, special operations, and precision strike, they carry eight torpedo tubes with capacity for up to 50 weapons, including Mk 48 torpedoes, Harpoon anti-ship missiles, and Tomahawk cruise missiles.
Variant1=Seawolf SSN-21,Seawolf
Variant2=Connecticut SSN-22,Connecticut

[usn_ssn_seawolf_carter_rsa]
Type=SSN,Attack Submarine
Default=Seawolf-class (Jimmy Carter),Seawolf
DefaultDescription=The Jimmy Carter subclass consists of the modified USS Jimmy Carter (SSN-23), adapted for specialized missions. A Multi-Mission Platform (MMP) was added, extending the hull to provide space for unmanned vehicles, special operations craft, and covert deployment of Navy SEAL teams. Retaining the S6W reactor and full armament of the Seawolf design, it specializes in surveillance, subsea intervention, and intelligence collection, making it one of the most versatile submarines in service.
Variant1=Jimmy Carter SSN-23,Jimmy Carter

