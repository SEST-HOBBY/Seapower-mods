[wp_tavkr_leningrad_98]
Type=ТАВКР,Авианосец
Default=Орел II-класс (1998—Альтернативный),Орел II
DefaultDescription=Проект 1160.4 Eagle или проект 1160.4 Орел II - это вторая серия авианосцев класса Орел, которая заменяет старые радары Top Sail и Top Steer на новый набор очень современных систем воздушного поиска, в частности, плоские панели РЛС с ПЭМ («Марс-Пассат»), расположенные вокруг надстройки, чрезвычайно дальнобойные радары дальнего действия. Радарная установка "Форум", созданная на базе "Подберезовика", и, конечно же, радарная установка РЛС ("Фрегат-МА") для слежения на средней дальности и обнаружения целей, скользящих по морю. Наряду с комплексной модернизацией средств противовоздушной обороны корабля были добавлены ЗРК средней дальности 3С90М "Штиль" и ракетный комплекс малой дальности 9К331 "Кинжал". Наряду с этим, точечная оборона корабля также была значительно улучшена за счет внедрения комбинированной системы ЗАК "Кортик", использующей 30-мм поворотные пушки, и ракет 9M311K.
Variant1=ТАВКР Архангельск,Архангельск
Variant2=ТАВКР Калининград,Калининград
Variant3=ТАВКР Ленинград,Ленинград
Variant4=ТАВКР Кронштадт,Кронштадт
Variant5=ТАВКР Волгоград,Волгоград

[wp_rkr_varyag_95]
Type=ТАВКР,РКР
Default=Киров II-класс (1995—Альтернативный),Киров II
DefaultDescription=Проект 1144.4 "Орлан", или "Киров II", вторая партия линейных крейсеров класса "Киров" с управляемыми ракетами, представляет собой модернизированный атомный военный корабль, который в настоящее время состоит на вооружении ВМФ России, водоизмещением 24 300-28 000 тонн. Эта мощная платформа заменила устаревшие радары Top Sail и Top Steer на современный комплект датчиков, включая плоские панели "Марс Пассат", установленные вокруг надстройки для наблюдения за воздухом на 360 градусов, радар МР-850 "Форум" чрезвычайно большой дальности, созданный на базе "Подберезовик" предназначен для раннего обнаружения угроз, а радар "Фрегат-МА" - для слежения на средней дальности за движущимися в море целями. Его противовоздушная оборона была значительно усилена с помощью ЗРК большой дальности 3С90М "Штиль" и ракетного комплекса малой дальности 9К331 "Кинжал", что обеспечивает надежную многоуровневую защиту. Точечная оборона усилена ЗАК "Кортик", объединяющими 30-мм поворотные пушки и ракеты 9M311K для перехвата угроз на близком расстоянии. Сохранив свое первоначальное вооружение из 20 сверхзвуковых противокорабельных ракет P-700 "Гранит", "Киров II" остается универсальным и мощным вооружением, способным доминировать на современных морских полях сражений благодаря своим передовым датчикам и комплексным оборонительным и наступательным системам.
Variant1=Варяг РКР-100,Варяг
Variant2=Грозный РКР-108,Грозный

[wp_rkr_varyag_08]
Type=ТАВКР,РКР
