Type=ФГ,Фрегат с управляемым ракетным вооружением
Default=F127-класс, F127
DefaultDescription=Задуманный как немецкий большой фрегат нового поколения, оптимизированный для противовоздушной и противоракетной обороны, он оснащен современным радиолокатором объемного поиска AESA и большой батареей Mk 41, которые обеспечивают эшелонированную зональную оборону с помощью SM-2/SM-6 и плотное локальное покрытие с помощью четырехстворчатой ESSM. Для решения задач противоракетной обороны SM-3 обеспечивает дальность действия за пределами атмосферы, в то время как ударная роль поддерживается противокорабельными ракетами большой дальности/наземного базирования (например, концепциями класса Tyrfing) наряду со стандартным наземным вооружением. Защита ближнего боя сочетает в себе оружие и ракеты с сильным поражением, ложные цели с мягким поражением и электрооптические средства наведения для точного наведения терминала. Противолодочный комплекс включает в себя корпусный гидролокатор средней частоты и низкочастотный гидролокатор переменной глубины/буксируемую антенную установку для улучшения обнаружения в сложных прибрежных и глубоководных условиях, позволяя кораблю преследовать подводные лодки с помощью корабельных торпед и вертолетной поддержки. В целом: флотская платформа противовоздушной обороны и сопровождения высокого класса, которая сочетает функции, ориентированные на патрулирование, с досягаемостью датчиков, глубиной залегания ракет и устойчивой многослойной защитой.
Variant1=F232
Variant2=F233
Variant3=F234
Variant4=F235
Variant5=F236
Variant6=F237
Variant7=F238
Variant8=F239


[ger_ffg_f123_1994]
Type=ФГ,Фрегат с управляемым ракетным вооружением
Default=F123 Brandenburg-класс, F123
DefaultDescription=Поступивший на вооружение в начале 1990-х годов, этот класс имеет четкую противолодочную направленность: среднечастотный корпусной гидролокатор Atlas Elektronik DSQS-23BZ используется для преследования подводных лодок и предупреждения о торпедировании. Для противовоздушной обороны корабли оснащаются полуактивной системой точечной защиты RIM-7P, управляемой радаром управления огнем Thales STIR 180 и электронно-оптическим прицелом Atlas MSP 600. В наземных боях широко распространенный в то время MM38 Exocet представляет собой консервативный, но проверенный вариант; легкие 20-мм крепления защищают от угроз ближнего боя. Двухмерный радиолокатор воздушного поиска Thales (Signaal) LW08 обеспечивает раннее оповещение и подачу сигналов, в то время как за точное наведение отвечает директор/EO. Пусковые установки мягкого поражения (например, SCLAR/TKWA) обеспечивают многоспектральную защиту от морских скиммеров и датчиков. В целом: основная задача - противолодочная оборона, дополненная точечным наведением и надежной, хотя и устаревшей, противокорабельной защитой.
Variant1=F215 Brandenburg 
Variant2=F216 Schleswig-Holstein
Variant3=F217 Bayern
Variant4=F218 Mecklenburg-Vorpommern

[ger_ffg_f123_2007]
Type=ФГ,Фрегат с управляемым ракетным вооружением
Default=F123 Brandenburg-класс, F123
DefaultDescription=Модернизация, произведенная в середине 2000-х годов, усиливает внутренний защитный слой: стабилизированный дистанционный пулемет Rheinmetall MLG 27 заменяет ручные 20-мм установки и обеспечивает точный огонь в море и во время маневров. Rheinmetall MASS представляет программируемые мультиспектральные приманки (RF/IR/EO), которые заменяют устаревшие средства мягкого поражения и обладают большей гибкостью в борьбе с различными типами самонаведений. Сенсорная основа Thales (Signaal) LW08, Thales STIR 180 и Atlas MSP 600 остается неизменной, обеспечивая надежное наблюдение и управление огнем. В противолодочной обороне DSQS-23BZ продолжает оставаться основным бортовым датчиком и информирует о доктрине противоракетной обороны. В MM38 Exocet сохраняется эффект "поверхности", хотя он уже не является ультрасовременным. Общий эффект: заметно улучшены средства самозащиты и РЭБ без изменения целей.
Variant1=F215 Brandenburg 
Variant2=F216 Schleswig-Holstein
Variant3=F217 Bayern
Variant4=F218 Mecklenburg-Vorpommern

[ger_ffg_f123_2012_MVP]
Type=ФГ,Фрегат с управляемым ракетным вооружением
Default=F123 Brandenburg-класс MVP, F123 MVP
DefaultDescription=Marine-Versuchs-Projekt (военно-морской испытательный объект) для интеграции RIM-162B на платформе F123. В качестве пробной конфигурации Raytheon ESSM Block 1 (RIM-162B) интегрирован для повышения производительности AAW без существенных изменений деки. Благодаря полуактивному самонаведению терминала Thales STIR 180 остается незаменимым осветителем; поддержка в середине хода облегчает нагрузку на терминал и улучшает качество игры в конце. Зарекомендовавшая себя система противолодочной обороны (DSQS-23BZ плюс корабельный вертолет) остается основной задачей и косвенно выигрывает от повышения устойчивости в воздухе. Rheinmetall MASS по-прежнему обеспечивает маневренность, а Rheinmetall MLG 27 сохраняет летальность в ближнем бою. Конструктивные изменения незначительны — выигрыш достигнут за счет программного обеспечения, логики управления огнем и доктрины. Фрегат стал заметно более устойчивым к атакам, сохранив при этом свой характерный силуэт.
Variant1=F218 Mecklenburg-Vorpommern

[ger_ffg_f123_2015_essm]
Type=ФГ,Фрегат с управляемым ракетным вооружением
Default=F123 Brandenburg-класс, F123
DefaultDescription=С добавлением ESSM Block 1 этот класс переходит на локальную противовоздушную оборону. ESSM Block 1 отличается улучшенным планированием залпа и доступностью; Thales STIR 180 по-прежнему управляет конечной фазой. В наземных боевых действиях Boeing Harpoon RGM-84D заменяет устаревший Exocet, обеспечивая более гибкие схемы захода на посадку. Система противолодочной обороны (DSQS-23BZ, десантный вертолет и средства противодействия) остается неотъемлемой частью, и ей способствует более четкая воздушная картина. Rheinmetall MASS и MLG 27 поддерживают внутренний слой в рабочем состоянии. Результатом является значительно более широкий набор возможностей и привычные процедуры эксплуатации и технического обслуживания.
Variant1=F215 Brandenburg 
Variant2=F216 Schleswig-Holstein
Variant3=F217 Bayern
Variant4=F218 Mecklenburg-Vorpommern

[ger_ffg_f123_2025_mlu]
Type=ФГ,Фрегат с управляемым ракетным вооружением
Default=F123B Brandenburg-класс, F123B
DefaultDescription=Обновление в середине срока службы обеспечивает заметный скачок в работе сенсоров: Saab Sea Giraffe 1X и Saab Sea Giraffe 4A (AESA) повышают качество отслеживания, частоту обновления и производительность на побережье. ESSM Block 2 с активной головкой самонаведения снижает зависимость от освещенности терминала и улучшает управление несколькими целями и надежность CCM. Комплекс средств РЭБ (например, семейства KORA) модернизирован, что усиливает координацию систем ESM/ECM и мягкого поражения; Rheinmetall MASS остается масштабируемым эффективным средством. Для противолодочной обороны DSQS-23BZ по-прежнему остается базовым судовым датчиком, поддерживаемым вертолетной и мелководной доктриной. В надводных боях Saab/Diehl RBS15 Mk3 обеспечивает большую дальность действия и надежную навигацию при ограниченном ударе с суши. В целом, корабль превращается в настоящего многоцелевого бойца с более короткими цепочками поражения и более надежной системой самообороны.
Variant1=F215 Brandenburg 
Variant2=F216 Schleswig-Holstein
Variant3=F217 Bayern
Variant4=F218 Mecklenburg-Vorpommern

[ger_ffg_f123_2030_mlu_high]
Type=ФГ,Фрегат с управляемым ракетным вооружением
Default=F123B Brandenburg-класс (вымышленный), F123B
DefaultDescription=В этом вымышленном пиковом состоянии мощность VLS возрастает до 4Х8 ячеек, удваивая глубину ESSM Block 2, что значительно повышает плотность огня и стойкость при налетах с насыщением. Saab Sea Giraffe 1X/4A (AESA) обеспечивает высокое качество изображения, необходимое для сложных многоцелевых боев, в то время как современный комплекс РЭБ обеспечивает живучесть в групповом бою. Saab/Diehl RBS15 Mk3 поддерживает современные средства противоракетной обороны при ограниченном ударе с суши. Система противоракетной обороны сохраняется и выигрывает от усиления прикрытия с воздуха и средств РЭБ. Примечание: Переход на 4Х8 Мк 41 позволяет использовать первоначальные преимущества этого класса для роста — с самого начала планировались пространство/вес/обслуживание и фундаменты для двух дополнительных позиций с 8 ячейками - с дополнительным усилением конструкции там, где это необходимо. Пакет представляет собой высококачественный эскорт AAW / ASuW, обладающий заметной выносливостью.
Variant1=F215 Brandenburg 
Variant2=F216 Schleswig-Holstein
Variant3=F217 Bayern
Variant4=F218 Mecklenburg-Vorpommern



[ger_fsg_k130_batch1_early]
Type=КР,Корвет с управляемым ракетным вооружением
Default=K130 Braunschweig-класс Партия 1 ранняя, K130
DefaultDescription=Созданный для прибрежных операций, корвет сочетает в себе компактные ударные характеристики и надежную самооборону. Для Saab/Diehl RBS15 Mk3 в качестве боекомплекта используются две сдвоенные кассеты, в то время как OTO Melara 76/62 Compact и стабилизированный Rheinmetall MLG 27 покрывают оружейный слой. Точечная противовоздушная оборона обеспечивается двумя 21-элементными пусковыми установками RAM Mk 49, оптимизированными для борьбы с угрозами со стороны моря. Наблюдение осуществляется с помощью вращающегося 3D-радара C-диапазона (TRS-3D), управляемого MIRADOR EO director; пассивный ESM-пакет поддерживает классификацию и тактику EMCON. В конструкции отсутствуют корпусной гидролокатор и система AAW дальнего действия в пользу дальности действия, работы в режиме RHIB и поддержки малочисленного экипажа в перегруженных прибрежных водах. Мультиспектральные приманки дополняют доктрину "мягкого уничтожения" и подчеркивают живучесть вблизи берега.
Variant1=F260 Braunschweig 
Variant2=F261 Magdeburg
Variant3=F262 Erfurt
Variant4=F263 Oldenburg
Variant5=F264 Ludwighafen am Rhein

