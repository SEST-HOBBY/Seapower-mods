DefaultDescription=Корветы класса "Скьолд" (в переводе с норвежского "skjold" означает "щит") - это класс из шести легких, сверхбыстрых, малозаметных ракетных корветов-невидимок, находящихся на вооружении Королевского военно-морского флота Норвегии. Ранее эти лодки классифицировались как MTB (моторные торпедные катера), но с 2009 года Королевские ВМС Норвегии назвали их корветами (korvett), поскольку их мореходные качества считаются сопоставимыми с корветами, а также потому, что они не несут торпед.
