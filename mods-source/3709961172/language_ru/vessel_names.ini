Default=K130 Braunschweig-класс Партия 2, K130
DefaultDescription=В пакете 2 представлен модернизированный комплекс датчиков/средств РЭБ, построенный на базе вращающегося AESA HENSOLDT TRS-4D и улучшенного EO-директора MIRADOR Mk 2 для более быстрого наведения на цель и лучшего управления малоразмерными целями. Компоновка вооружения остается проверенной: RBS15 Mk3 для дальних наземных атак, два RAM Mk 49 для точечной наводки, а также 76/62 Super Rapid и MLG 27 для ближнего боя - теперь они выигрывают от более высокого качества стрельбы и автоматизации учений. В результате получился более собранный, быстро реагирующий corvette с таким же компактным ударом и заметно более прочной защитой.
Variant1=F265 Koeln
Variant2=F266 Emden
