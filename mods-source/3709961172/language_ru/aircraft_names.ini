[se_jas-39]
Type=Истребитель
Default=JAS-39 Грипен,Грипен
DefaultDescription=Истребитель JAS-39 под кодовым названием JAS-39 - это шведский реактивный истребитель, принадлежащий к четвертому поколению реактивных истребителей. Истребитель JAS-39 используется для замены реактивного истребителя Saab-37. Его аббревиатура "JAS" является сокращением от "Jakt" (воздушный бой), "Attack" (наземная атака) и "Spaning" (разведка) в переводе со шведского. Это многоцелевой истребитель (Multirole Aircraft), который сочетает в себе боевые, ударные и разведывательные функции. Истребитель JAS-39 был разработан шведской компанией Saab (СААБ) (Svenska Aeroplan AB) в качестве центрального. Впервые он поднялся в воздух в 1988 году и позже был представлен на мировом рынке. Он состоит на вооружении военно-воздушных сил Швеции, Чехии, Венгрии и других стран, и в настоящее время формируется в военно-воздушные силы Южной Африки. В октябре 2007 года парламент Таиланда также одобрил поставку первой партии из шести истребителей JAS-39. Благодаря компромиссу в дальности полета, простоте замены и использования, а также высокой эффективности и низкой цене JAS-39 сегодня является одним из самых популярных и продаваемых истребителей в мире. Он позиционируется так же, как истребитель FC-1, совместно разработанный Китаем и Пакистаном, и также является крупнейшим конкурентом истребителя FC-1 Xiaolong в мире.
Squadron1=JAS-39 Грипен,Грипен

