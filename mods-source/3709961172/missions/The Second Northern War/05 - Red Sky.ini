[Language_en]
Name=05 - Red Sky
MissionBriefingAssetsDirectory=missions\Baltica1\missions\The Second Northern War\SNW_briefing\Briefing Screen - 05
Taskforce2ВступлениеMessage=Comrade Admiral, we have arrived in Baltiysk. The ammunition is already being unloaded, and our ships are being replenished. It will take some time, and it would be foolish to expect that the enemy will miss the moment when almost the entire fleet is assembled in one port. Intelligence reports a multitude of aerial contacts approaching from almost all directions. \r\n\r\nCurrently, the water area is guarded by ground-based air defense systems, a fighter aviation regiment and several ships patrolling the perimeter. This should be enough to repel the first attacks, but in the future we will bring other ships into battle.\r\n\r\nWe can't lose a single major warship, so no matter how hard it is, civilian vessels will have to be ignored. If the enemy targets them, it will give us the necessary time. In general, the decision is yours. Good luck.\n\n________________________!!!!!!!!!!!!!!(Off-game note)!!!!!!!!!!__________________________________\nI couldn't make the ships standing at the pier not react to the shelling in any way and at the same time were not subordinate to the player. Therefore, their radars and weapons are completely disabled. It's a game convention. \n\nThey will join the battle gradually, you will receive a message about it. But until then, I ask you not to use them in any way, so as not to violate the idea of the mission. Thanks:)
Taskforce2ФиналMessage=Comrade Admiral, the ships are refueled and ready to leave. The commander-in-chief orders to transfer the entire fleet to St. Petersburg, here we will not be able to protect it from constant attacks, much less constantly supply it. \n\nDon't worry, the army will protect the city, and we will definitely return to it soon, but for now we need to leave.
Taskforce21Message=Comrade Admiral, Ryanyy is ready for battle. Leaves the port.
Taskforce22Message=Both Nanuchka-class a ready for battle!
Taskforce23Message=Nastoychivyy and Zeleny Dol are ready for battle, Comrade Admiral!
Taskforce24Message=Sovershennyy, Boykiy, Stoykiy are fueled and ready, and we can begin relocating.
Taskforce2СШАMessage=Comrade Admiral, intelligence reports two American destroyers passing close to us. They are on the trajectory of the enemy's strike, but they do not participate in the attack themselves. Be ready.
[Language_cn]
Name=Восход над Нарвой
[Language_ru]
Name=05 - Красное небо
MissionBriefingAssetsDirectory=missions\Baltica1\missions\The Second Northern War\SNW_briefing\Briefing Screen - 05
Taskforce2ВступлениеMessage=Товарищ адмирал, мы прибыли в Балтийск. Боеприпасы уже разгружают, а наши корабли встали на пополнение. Это займет какое-то время, и глупо было бы ожидать, что противник упустит момент, когда практически весь флот собран в одном порту. Разведка сообщает о множестве воздушных контактов, приближающихся практически со всех сторон. \r\n\r\nСейчас акваторию охраняют наземные системы ПВО, истребительный авиаполк и несколько кораблей, патрулирующих периметр. Этого должно хватить для отражения первых налетов, однако в дальнейшем мы введем в бой и другие корабли.\r\n\r\nМы не можем потерять ни один крупный военный корабль, так что, как бы тяжело это ни было, гражданские суда придется оставить без внимания. Если противник будет выцеливать их, это даст нам необходимое время. В общем, решение за вами. Удачи.\n\n__________________________!!!!!!!!!!!!!!(Вне игровое примечание)!!!!!!!!!!_______________________\nЯ не смог сделать, чтобы корабли стоящие у пирса никак не реагировали на обстрелы и при этом не были в подчинении у игрока. Поэтому у них полностью отключенны радары и вооружение. Это игровая условность. \n\nОни будут вступать в бой постепенно, вы получите сообщение об этом. Но до этого момента, прошу никак не использовать их, чтобы не нарушать задумку миссии. Спасибо:)
Taskforce2ФиналMessage=Товарищ адмирал, корабли заправлены и готовы к выходу. Главкомат приказывает перевести весь флот в Санкт-Петербург, здесь мы не сможем защитить его от постоянных атак, а уж тем более постоянно снабжать. \n\nНе переживайте, сухопутчики защитят город, а мы точно скоро вернемся в него, но пока нам надо уходить.
Taskforce21Message=Товарищ адмирал, Рьяный к бою готов. Выходит из порта.
Taskforce22Message=Оба Овода готовы, можем задействовать их в обороне!
Taskforce23Message=Настойчивый и Зеленый Дол готовы к бою, товарищ адмирал!
Taskforce24Message=Совершенный, Бойкий и Стойкий заправлены и готовы, мы можем начать передислокацию.
Taskforce2СШАMessage=Товарищ адмирал, разведка докладывает о двух американских эсминцах, проходящих недалеко от нас. Они находятся на траектории удара противника, но сами в атаке не участвуют. Будьте готовы.
