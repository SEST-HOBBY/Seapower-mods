
[Debug]
DisableEnemyAIPlayer=True
[Language_en]
Name=04 - Breakthrough to Kaliningrad
MissionBriefingAssetsDirectory=missions\Baltica1\missions\The Second Northern War\SNW_briefing\Briefing Screen - 04
Trigger6Condition_Условие1AreaLabel=SOS signal area
Taskforce2ВступлениеMessage=Comrade Admiral, we have been assigned to escort the first convoy to besieged Kaliningrad. Although the ground forces are already making their way through the Suwalki corridor, our troops need a constant flow of ammunition and equipment to hold the exclave until the establishment of the land corridor.\r\n\r\nThe commander-in-chief was able to allocate quite limited forces to us, since many ships are currently undergoing repairs and replenishment in Kronstadt, therefore it is necessary to act carefully. Our main problem is the small number of air defense systems, use missiles very sparingly, otherwise we will not be able to repel enemy missile attacks. Intelligence also reported that several German 212s had left their ports and were most likely already close to our route. If we don't miss their attacks, then the RBU and other anti-torpedo weapons should be able to cope. Get ready for NATO patrols as well, no large forces were seen, but the Poles definitely won't let us in just like that, and I think the Swedes will show something. Good luck.\nThe Kalibr missile is the deadliest weapon available to us. Use it to destroy the enemy's radar and the location of the Patriots' positions. However, keep in mind that we have very few of them, and after the attack is over, the missile carriers will go to Kronstadt to recharge.\n\nThe window for the strike will be from 04:00 to 07:00, after that the second stage begins immediately, so be vigilant. Good luck!
Taskforce2ПольшаMessage=Congratulations, Comrade Captain, these were the last ships of the Polish Navy. Now only the Swedes and the Germans and the Danes are against us.
Taskforce2СОСMessage=Comrade Admiral, we are receiving an SOS signal from our civilian vessel, not far from our position. They report that they were hit by a torpedo, and the crew abandons the ship. We can help the crew and neutralize the threat to our ships.
Taskforce2СигналMessage=The surviving crew has been boarded, and we can continue our journey to Kaliningrad. Excellent work, Comrade Admiral!
[Language_cn]
Name=Восход над Нарвой
[Language_ru]
Name=04 - Прорыв в Калининград
MissionBriefingAssetsDirectory=missions\Baltica1\missions\The Second Northern War\SNW_briefing\Briefing Screen - 04
Trigger2Condition_Условие1AreaLabel=Балтийск
Trigger6Condition_Условие1AreaLabel=Зона сигнала СОС
Taskforce2ВступлениеMessage=Товарищ адмирал, нам поручено сопровождать первый конвой в осажденный Калининград. Хоть сухопутчики уже пробиваются через Сувалкский коридор, нашим войскам нужен постоянный поток боеприпасов и техники, чтобы держать оборону в эксклаве до момента установления сухопутного коридора.\r\n\r\nГлавкомат смог выделить нам достаточно ограниченные силы, так как многие корабли сейчас стоят на ремонте и пополнении в Кронштадте, поэтому действовать необходимо аккуратно. Главной нашей проблемой является малое количество средств ПВО, расходуйте ракеты крайне экономно, иначе мы не сможем отражать ракетные атаки противника. Так же разведка сообщила, что несколько немецких 212-х покинули свои порты и, скорее всего, уже находятся рядом с нашим маршрутом. Если не пропустим их атаки, то РБУ и другое противоторпедное вооружение должно справиться. Готовьтесь так же к патрулям НАТОвцев, крупных сил замечено не было, но поляки точно не пустят нас просто так, да и думаю шведы что-то покажут. Удачи.
Taskforce2ПольшаMessage=Поздравляю товарищ капитан, это были последние корабли ВМС Польши. Теперь против нас стоят только шведы и немцы с датчанами.
Taskforce2СОСMessage=Товарищ адмирал, мы принимаем сигнал SOS с нашего гражданского судна, недалеко от нашей позиции. Они сообщают, что их поразили торпедой, и экипаж покидает корабль. Мы можем помочь экипажу и нейтрализовать угрозу для наших кораблей.
Taskforce2СигналMessage=Выживший экипаж поднят на борт, мы можем продолжить путь в Калининград. Отличная работа, товарищ адмирал!
