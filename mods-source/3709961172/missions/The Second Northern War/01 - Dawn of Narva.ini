Taskforce2ВступлениеMessage=Здравия желаю, товарищ адмирал. Эскадра вышла на Большой фарватер и движется в заданный район. Ориентировочно, мы достигнем его к 21:40, за 20 минут до начала атаки.\n\nПакет с перечнем целей приказано вскрыть ровно в 22:00, сразу после принятия сигнала: "Рассвет". После этого мы получаем свободу в применении вооружений и выборе целей для них, однако приоритет остаётся за целями первой очереди — портами, аэродромами, станциями РЛС. Точнее узнаете на месте.\n\nНапоминаю, что по легенде операции наша эскадра направляется в Балтийск, на соединение с основными силами флота для проведения учений в нейтральных водах. Натовцы, естественно, поднимут дежурную авиацию, но мы готовы к подобному развитию событий.\n\nВ ваше распоряжение передана авиабаза Кресты в Пскове. За последние два месяца Командование сосредоточило на ней крупную авиационную группировку, которая будет задействована в основном во второй части операции, однако также примет участие в первом ударе.\n\nТакже военный округ выделил нам два дивизиона "Искандеров" и порядка сотни "Гераней". Используйте их, чтобы пробить ПВО эстонцев, предоставив окно нашей авиации и крылатым ракетам.\n\nКР "Калибр" — самое смертоносное оружие, доступное нам. Используйте его для поражения РЛС противника и расположения позиций "Пэтриотов". Однако учитывайте, что их у нас крайне мало, и после окончания атаки ракетоносцы уйдут на перезарядку в Кронштадт.\n\nОкно для удара будет с 22:00 до 05:00, после этого сразу начинается второй этап, поэтому будьте бдительны. Удачи!
Taskforce2ЗонапускаMessage=Товарищ адмирал, мы вышли на точку начала атаки. Разрешается вскрыть пакет с целями для удара.\n\n_________________________________________________________________________________________\nОт: Главное командование Военно-Морского флота\nКому: Оперативной ударной группе "Кронштадт"\n\nВ соответствии с приказом Верховного Главнокомандующего от 13.05.2027 г. №344/32-1, в ответ на систематические попытки эскалации политической ситуации, блокирование стратегических транспортных маршрутов и систематическое увеличение группировки войск вдоль государственной границы, Вооруженным силам Российской Федерации приказано нанести упреждающий удар по странам Прибалтики, с целью деблокирования Калининградской области и устранения угрозы Российской Федерации. \n\nБалтийскому флоту отводится решающая роль в нанесении первичного удара и обеспечении успешного выполнения задачи сухопутных войск.\n\nНачало операции "Восход над Нарвой" назначено на 26.05.2027 г., в 21:00.\n\nЦелями первой очереди являются:\n\n1) РЛС ВС Эстонии и НАТО\n\n1.1 РЛС "Сагади" -  Широта: 59.53451, долгота: 26.050193\n1.2 РЛС "Киикла" - Широта: 59.241758, долгота: 27.130737\n1.3 РЛС "Тарту" - Широта: 58.378186, долгота: 26.817627\n\nИх уничтожение практически полностью ослепит ПВО Эстонии, после чего мы сможем массово задействовать авиацию.\n\n2) База ВС Эстонии и НАТО "Тапа" - Широта: 59.239581, долгота: 25.951509\n\nКрупнейшая военная база в стране, где размещена 1-я пехотная бригада ВС Эстонии и батальон передового присутсвия НАТО.\n\n3) Авиабаза "Эмари" - Широта: 59.257222, долгота: 24.204769\n\nПередовая база ВВС НАТО, на которой расквартированы многонациональные силы в рамках миссии по воздушному патрулированию Финского залива. \nУделите ей особое внимание, именно отсюда взлетают F-35 и F-16.\n\n4) Порты Таллина и Мууги - Широта: 59.457236, долгота: 24.763870\n\nВ порту Таллина разгружаются два ролкера - по данным разведки, они доставили новое снаряжение и бронетехнику для 15-ой Егерской бригады ВС Эстонии. Сухопутчики крайне просят оставить эстонцев без снаряжения. Но будьте осторожны, между нами и целями находится рейдовая стоянка гражданских судов. Не допустите попадания по гражданским.\n\n5) Позиции систем ПВО "Patriot" и "NASAMS" - развернуты в районах других объектов для их прикрытия.\n\n\nОстальные цели являются второстепенными и мы можем сами решать, стоит ли тратить на них БК. На этом все, можем начинать по вашему приказу.
Taskforce2ГРУуходитMessage=Товарищ адмирал, группы ГРУ сворачиваются и покидают позиции. Аэроразведка больше недоступна.
Taskforce2РассветMessage=От: КП "Дворец"\nКому: ОУГ "Кронштадт"\n\n- Рассвет.\nПовтор\n- Рассвет.
