Taskforce2ВступлениеMessage=Greetings, Comrade Admiral. The squadron has reached a Large Fairway and is moving to a given area. Approximately, we will reach it by 21:40, 20 minutes before the start of the attack.\n\nThe package with the list of targets was ordered to be opened at exactly 04:00, immediately after receiving the signal: "Rassvet." After that, we get freedom in the use of weapons and the choice of targets for them, but the priority remains for the targets of the first stage — ports, airfields, radar stations. You'll find out more precisely on the spot.\n\nI remind you that according to the legend of the operation, our squadron is heading to Baltiysk, to join the main forces of the fleet for exercises in neutral waters. NATO, of course, will raise the aircraft on duty, but we are ready for such a development.\n\nThe Kresty airbase in Pskov has been placed at your disposal. Over the past two months, the Command has concentrated a large aviation group on it, which will be involved mainly in the second part of the operation, but will also take part in the first strike.\n\nThe military district also allocated us two divisions of Iskanders and about a hundred Geraniums. Use them to break through the Estonian air defenses, giving a window to our aircraft and cruise missiles.\n\nThe Kalibr missile is the deadliest weapon available to us. Use it to destroy the enemy's radar and the location of the Patriots' positions. However, keep in mind that we have very few of them, and after the attack is over, the missile carriers will go to Kronstadt to recharge.\n\nThe window for the strike will be from 22:00 to 05:00, after that the second stage begins immediately, so be vigilant. Good luck!
Taskforce2ЗонапускаMessage=Comrade Admiral, we have reached the starting point of the attack. It is allowed to open the package with the targets for the strike.\n\n_________________________________________________________________________________________\nFrom: The Main Command of the Navy\nTo: Kronshtadt Operational Strike Group\n\nIn accordance with Order No. 344/32-1 of the Supreme Commander-in-Chief dated 05/13/2027, in response to systematic attempts to escalate the political situation, block strategic transport routes and systematically increase the grouping of troops along the state border, the Armed Forces of the Russian Federation were ordered to launch a preemptive strike against the Baltic countries in order to unblock the Kaliningrad region and eliminate the threat to the Russian Federation. \n\nThe Baltic Fleet has a crucial role to play in delivering the initial strike and ensuring the successful completion of the task of the ground forces.\n\nThe start of Operation Sunrise over Narva is scheduled for 05.26.2027, at 21:00.\n\nThe objectives of the first stage are:\n\n1) Radar stations of the Armed Forces of Estonia and NATO\n\n1.1 Sagadi radar - Latitude: 59.53451, longitude: 05.260193\n1.2 Kiikla radar - Latitude: 59.241758, longitude: 27.130737\n1.3 RADAR station "Tartu" - Latitude: 58.378186, longitude: 26.817627\n\nTheir destruction will almost completely blind Estonia's air defenses, after which we will be able to massively deploy aviation.\n\n2) The Tapa base of the Estonian and NATO Armed Forces - Latitude: 59.239581, longitude: 25.951509\n\nIt is the largest military base in the country, hosting the 1st Infantry Brigade of the Estonian Armed Forces and the NATO Forward Presence Battalion.\n\n3) Emari Air Base - Latitude: 59.257222, longitude: 24.204769\n\nAn advanced NATO Air Force base where multinational forces are stationed as part of the Gulf of Finland air patrol mission. \nPay special attention to it, it is from here that the F-35 and F-16 take off.\n\n4) Ports of Tallinn and Muuga - Latitude: 59.457236, longitude: 24.763870\n\nTwo Ro-Ro ship are unloading at the port of Tallinn. According to intelligence data, they have delivered new equipment and armored vehicles for the 15th Jaeger Brigade of the Estonian Armed Forces. The landsmen are urgently asking to leave the Estonians without equipment. But be careful, there is a civilian ship parking area between us and the targets. Don't let civilians get hit.\n\n5) The positions of the Patriot and NASAMS air defense systems are deployed in areas of other facilities to cover them.\n\n\nThe remaining targets are secondary and we can decide for ourselves whether it is worth spending ammunition on them, that's all, we can start on your order.
Taskforce2ГРУуходитMessage=Comrade Admiral, the GRU groups are leaving their positions. Aerial reconnaissance is no longer available.
Taskforce2РассветMessage=From: KP "Palace"\nTo: OG "Kronshtadt"\n\n"Rassvet."\nReplay\n"Rassvet."
