
[Language_en]
Name=05 - Reckoning for Moonsund
MissionBriefingAssetsDirectory=missions\Baltica1\missions\The Second Northern War\SNW_briefing\Briefing Screen - 06
Taskforce2ВступлениеMessage=Comrade Admiral, this moment has come. Almost the entire Baltic Fleet has been transferred to your command. Three German flotillas, as well as Danish and Swedish groups, advanced against us. Almost all NATO Navies are in the Baltic. \r\nWe will join the battle near the Moonsund archipelago and have no right to disgrace the memory of the ancestors who gave their lives in these waters. It's either us or us today... Good luck.
[Language_cn]
Name=05 - Reckoning for Moonsund
[Language_ru]
Name=05 - Расплата за Моонзунд
MissionBriefingAssetsDirectory=missions\Baltica1\missions\The Second Northern War\SNW_briefing\Briefing Screen - 06
Taskforce2ВступлениеMessage=Товарищ адмирал, этот момент настал. Вам в подчинение передан практически весь Балтийский флот. Против нас выдвинулись три немецкие флотилии, а также датская и шведская группы. Практически все ВМС НАТО на Балтике. \r\nМы вступим в сражение рядом с Моонзундским архипелагом и не имеем права опозорить память предков, отдавших свою жизнь в этих водах. Сегодня либо мы, либо нас... Удачи.
[Language_de]
Name=05 - Reckoning for Moonsund
