
[Language_en]
Name=03 - Hunting in the Straits
MissionBriefingAssetsDirectory=missions\Baltica1\missions\The Second Northern War\SNW_briefing\Briefing Screen - 03
Trigger2Condition_Условие1AreaLabel=NATO anti-ship Missile Cover Zone
Taskforce2ВступлениеMessage=Comrade Admiral, greetings. We have been assigned the task of clearing the Gulf of Riga from NATO supply vessels that are urgently leaving the vicinity of Riga, trying to break into the Baltic Sea. The situation is complicated by the numerous civilian vessels also moving to sea. We will have to initialize the targets very precisely and choose the right moment to attack in order to avoid unnecessary casualties.\r\n\r\nAlso, according to radio interception reports, there are several enemy patrol ships in the bay and at least one German submarine, which the comrades drove into the straits. The command is planning to send a large convoy in the near future, we must not allow her to jump out of the trap and attack him.\r\n\r\nIn general, this is all, if additional information becomes available, I will inform you. Good luck.
Taskforce2СШАMessage=There is a large group of aerial targets on the radar, moving from Riga. Most likely, these are American transports transporting personnel who were in the Baltic States. The United States has not yet shown its participation in the conflict, so the Commander-in-Chief orders not to touch them. Let them go west.
[Language_cn]
Name=Восход над Нарвой
[Language_ru]
Name=03 - Охота в проливах
MissionBriefingAssetsDirectory=missions\Baltica1\missions\The Second Northern War\SNW_briefing\Briefing Screen - 03
Trigger2Condition_Условие1AreaLabel=Зона прикрытия ПКР НАТО
Taskforce2ВступлениеMessage=Товарищ адмирал, приветствую. Нам поручена задача по зачистке Рижского залива от судов снабжения НАТО, которые экстренно покидают окрестности Риги, пытаясь прорваться в Балтийское море. Ситуацию усложняют многочисленные гражданские суда, также двигающиеся к выходу в море. Нам придется крайне точно инициализировать цели и подгадать правильный момент для атаки, чтобы избежать ненужных жертв.\r\n\r\nТак же, по сообщениям радиоперехвата, в заливе находятся несколько патрульных кораблей противника и, как минимум, одна немецкая подлодка, которую товарищи загнали в проливы. Командование планирует отправку крупного конвоя в ближайшее время, нельзя допустить, чтобы она выскачила из ловушки и нападала на него.\r\n\r\nВ целом это все, если появится дополнительная информация, я сообщу. Удачи.
Taskforce2СШАMessage=На радаре крупная группа воздушных целей, двигается со стороны Риги. Скорее всего это американские транспорты, вывозящие персонал находившийся в Прибалтике. США пока не проявили свое участие в конфлике, так что Главкомат приказывает их не трогать. Пусть уходят на запад.
