Taskforce2ВступлениеMessage=Товарищ адмирал, время 05:00. Мы начинаем вторую фазу операции. Десантные корабли уже подошли, и мы двигаемся к рубежу начала высадки.\r\n\r\nМы ожидаем, что противник уже развернул силы 15-й бригады в пригородах и самом городе, а также поднял по тревоге оставшиеся силы ВМФ. Наши корабли наверняка попадут под обстрел береговых батарей, когда приблизятся, поэтому для подавления первых рубежей командование выделяет вам в помощь штурмовую авиацию. Большая ее часть задействована для поддержки сухопутных сил, так что действуйте с умом, самолетов у нас немного.\r\n\r\nКомандование выделяет четыре пляжа, куда мы должны будем высаживаться, каждый из них уже занят противником, так что мы можем использовать корабельную артиллерию для поддержки наступления. Наша задача будет выполнена, как только мы сломим сопротивление 15-й бригады и займем окрестности города. После чего морпехи будут дожидаться подхода сухопутных частей.
