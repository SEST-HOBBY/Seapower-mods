Taskforce2ВступлениеMessage=Comrade Admiral, the time is 05:00. We are starting the second phase of the operation. The landing ships have already arrived, and we are moving towards the start of the landing.\r\n\r\nWe expect that the enemy has already deployed the forces of the 15th Brigade in the suburbs and the city itself, as well as alerted the remaining naval forces. Our ships will surely come under fire from coastal batteries when they approach, so to suppress the first lines, the command allocates attack aircraft to help you. Most of it is used to support the ground forces, so act wisely, we don't have many planes.\r\n\r\nThe command identifies four beaches where we will have to land, each of them is already occupied by the enemy, so we can use naval artillery to support the offensive. Our task will be completed as soon as we break the resistance of the 15th brigade and occupy the outskirts of the city. After that, the Marines will wait for the approach of the ground units.
