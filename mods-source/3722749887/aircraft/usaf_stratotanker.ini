[---------- General Data ----------]
[General]
UnitType=Aircraft
Size=VeryLarge

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.0

#Taxi values
