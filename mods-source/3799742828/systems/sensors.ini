[Zaslon]
Kind=Radar                           // radar sensor
Type=DirectedSearch                  // broad track-while-scan search component
HasDataLink=True                     // shares sensor data with the task force
Role=Air                             // target role: Surface, Air, or AirAndSurface
Mode=Illuminate                      // guidance mode: Illuminate or RadioCommand
TargetChannels=10                    // simultaneous target tracks
WeaponChannels=4                     // simultaneous guided weapons
ViewArcs=-70,70|-60,70               // horizontal|vertical scan arcs in degrees
LookDownMultiplier=0.85              // detection multiplier against surface-background targets
MinRange=0.2                         // minimum detection range in km
MaxRange=200                         // maximum detection range in km
MinAltitude=0                        // minimum relevant target altitude in metres
MaxAltitude=30000                    // maximum relevant target altitude in metres
RangeResolution=100                  // minimum separation of two same-bearing targets, in metres
BeamWidth=2.5                        // radar beam width in degrees
Gain=62                              // sensor gain in dB
Frequency=X-Band                     // radar frequency band; affects ECM interaction
PeakPower=30                         // radar output peak power in kW

[Zaslon_Targeting]
Kind=Radar
Type=Targeting
HasDataLink=True
Role=Air
Mode=Illuminate
TargetChannels=10
WeaponChannels=4
ViewArcs=-70,70|-60,70
LookDownMultiplier=0.85
MinRange=0.2
MaxRange=200
MinAltitude=0
MaxAltitude=30000
RangeResolution=100
BeamWidth=2.5
Gain=62
Frequency=X-Band
PeakPower=30

