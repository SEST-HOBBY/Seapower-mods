# Combat systems for the MiG-31 family (Sea Power 0.8.3). The radars already share contacts (HasDataLink=True);
# these make each aircraft a small datalink hub: APD-518 links a 4-ship flight's radar picture and ground control.
# Deliberately below a real AEW (stock RLDN_P42 120/3, ATDS_E2 250/3).

[MU_APD518_Zaslon]
# MiG-31 / MiG-31K: Zaslon (10 tracks) + APD-518 group datalink, Soviet-era link tier
ReactionTime=10                  // seconds; same as the game's default for aircraft (Fast = 15 s would slow an interceptor down)
DatalinkTier=4
DatalinkSource=True
SignalProcessingBonus=0
CICSlots=10
EvaluationSlots=2

[MU_APD518_ZaslonM]
# MiG-31BM: Zaslon-M (24 tracks) with modernised datalink
ReactionTime=10                  // seconds; same as the game's default for aircraft (Fast = 15 s would slow an interceptor down)
DatalinkTier=5
DatalinkSource=True
SignalProcessingBonus=0
CICSlots=24
EvaluationSlots=3
