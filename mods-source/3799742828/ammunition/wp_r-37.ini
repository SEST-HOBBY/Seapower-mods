[General]
Type=Missile                         // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                       // can be AAW, ASuW, ASW
Mass=510                             // in kg; used by aircraft stores handling
AmmoPoints=510                       // supply-system cost/availability value
AirLaunched=True                     // encyclopedia displays launch-altitude data
DefaultCameraDistance=0.6            // default external camera distance
MinCameraDistanceForeAft=0.29        // closest fore/aft camera distance
MinCameraDistanceBroadside=0.29      // closest broadside camera distance
CameraPivotHeight=0.0                // camera pivot vertical offset
DecalClass=SAMImpacts                // decal class in effects/decals.ini

[SensorData]
VisualIdentificationRange=4          // visual identification range in nmi
IRSignature=VeryTiny                 // IR signature class from systems/sensors.ini
RCS=VerySmall                        // radar-cross-section class from systems/sensors.ini

[WarheadData]
WarheadType=0                         // 0=blast fragmentation, 1=AP, 2=HEAT, 3=illumination, 4=cluster, 5=runway cratering
Power=24
ImpactSize=Small                     // impact visual size: small, medium, large, verylarge
Penetration=Always                   // penetration class: minor, moderate, heavy, always
FuzeProximityDistance=15             // proximity-fuze distance in yards
KillProbability=0.85                 // base chance to hit

[Guidance]
GuidanceType=3                        // 0=none, 1=IR, 2=semi-active radar, 3=active radar, 4=anti-radiation, 5=laser, 6=TV, 7=active sonar, 8=passive sonar, 9=wake homing
MidCourseCorrection=3                // 0=none, 1=radio command, 2=wire guided, 3=datalink midcourse
DropDuration=1.0                     // seconds the missile falls unpowered after release
InitialFlightPhaseDuration=3.0       // seconds it flies straight before guidance begins
MaxLoftAngle=20                      // maximum climb angle for the initial loft, in degrees
MaxLoftAlt=100000                     // maximum loft altitude in feet; can also be Maintain, Target, or Launcher
TerminalApproachDist=12
ApplyKinematics=True                 // use the full missile kinematics model
MaxVelocity=3560.0                     // Maximum speed in knots
MaxTurnRate=16.0                       // Maximum turnrate in degrees per second
MaxTurnG=25                       // Maximum G-limit of missile turns
AccelerationTime=0.01                  // Burn time for initial booster burn
Acceleration=0                      // Gs of acceleration in initial burn
SustainerAccelerationTime=18            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=5               // Acceleration of sustainer burn. -1 if there is no sustainer
DragCoefficient=1               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
TypicalTargetAlt=40000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=750						// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=40000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=750				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
VelocityBleed=0.8                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=240               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TerminalLoft=True
TimeLimited=True
LiftFactor=0.001				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
MinLaunchRange=2                     // minimum launch range in nautical miles
MaxLaunchRange=165                   // Maximum launch range in nautical miles
MinLaunchAltitude=200                // minimum launch altitude in feet
MaxLaunchAltitude=82000              // maximum launch altitude in feet
MinAttackAltitude=50                 // minimum target altitude in feet; error increases outside the attack limits
MaxAttackAltitude=91860              // maximum target altitude in feet
MaxAttackVelocity=1998               // target speed in knots above which hit chance degrades
LaunchReliability=95                 // launch reliability from 0 to 100
SeekerGain=40                        // seeker gain in dB
SeekerFOV=60                         // seeker field of view in degrees
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
SeekerPassiveRange=25                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=18.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=12.0                         // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
AntiCountermeasuresBonus=0.3           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.25                    // This value substracted from probability of being jammed  (0...1)
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[Particles]
InFlightEffectClass=DefaultMissileInflightEffect                 // cruise/in-flight effect class
InFlightEffectPosition=0,0,-0.029548889                         // local XYZ position for the in-flight effect
InFlightEffectStartTime=2.0                                     // seconds after launch before the in-flight effect begins
SustainerEffect=effects/weapons/emitters/missile_sustainer_large_effect // direct emitter for the sustainer plume
SustainerEffectPosition=0,0,-0.029548889                       // local XYZ position for the sustainer effect
SustainerEffectStartTime=0.0                                    // seconds after launch before the sustainer effect begins
HitShipExplosionClass=MediumMissileExplosions                   // ship-impact explosion effect class
HitAirExplosionClass=LargeMissileExplosions                     // air-intercept explosion effect class
HitDefaultExplosionClass=MediumMissileExplosions                // fallback impact explosion effect class
HitWaterSplashClass=SmallWaterSplashes                          // water-impact splash effect class

[Models]
ResourcesFolder=assets/models/weapon/ammunition/wp_r-37/        // folder containing the model assets
ResourcesRoot=wp_r-37.obj                                       // source resource/OBJ file
ResourcesMesh=wp_r-37                                           // main in-flight mesh name
ResourcesMeshForLaunch=wp_r-37_dummy                            // folded/carriage mesh before the switch
ResourcesMaterialFolder=assets/models/weapon/ammunition/wp_r-37/ // folder containing the material definition
ResourcesMaterial=wp_r-37_mat.ini                               // material definition file
ResourcesMeshSwitchTime=3.0                                    // seconds after launch to switch to the main mesh
NumberOfSubModels=0                                             // additional authored submodels

[Colliders]
Collider=col_main                                                // name of the primary collider section

[col_main]
Collider=Box                                                     // collider primitive type
Position=0,0,0                                                   // local XYZ collider position
Rotation=0,0,0                                                   // local XYZ collider rotation in degrees
Scale=0.005531319,0.005531319,0.059097777                       // local XYZ collider half-extents
