[General]
// R-77M / K-77M (Izdeliye 180) — Modernized medium-to-long-range AAM for MiG-31BM.
// Features active electronically scanned array (AESA) seeker and dual-pulse motor.
Type=Missile                         // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                       // can be AAW, ASuW, ASW
Mass=190                             // in kg; used by aircraft stores handling
AmmoPoints=190                       // supply-system cost/availability value
AirLaunched=True                     // encyclopedia displays launch-altitude data
DefaultCameraDistance=0.5            // default external camera distance
MinCameraDistanceForeAft=0.24        // closest fore/aft camera distance
MinCameraDistanceBroadside=0.24      // closest broadside camera distance
CameraPivotHeight=0.0                // camera pivot vertical offset
DecalClass=SAMImpacts                // decal class in effects/decals.ini

FrontalArea=0.0314                   // frontal signature/area value
SideArea=0.742                       // side signature/area value
BottomArea=0.742                     // bottom signature/area value

[SensorData]
VisualIdentificationRange=4          // visual identification range in nmi
IRSignature=VeryTiny                 // IR signature class from systems/sensors.ini
RCS=VerySmall                        // radar-cross-section class from systems/sensors.ini

[WarheadData]
WarheadType=0                        // 0=blast fragmentation, 1=AP, 2=HEAT, 3=illumination, 4=cluster, 5=runway cratering
Power=22                             // expanding rod / micro-fragmentation warhead
ImpactSize=Small                     // impact visual size: small, medium, large, verylarge
Penetration=Always                   // penetration class: minor, moderate, heavy, always
FuzeProximityDistance=15             // proximity-fuze distance in yards (laser proximity fuze)
InterceptSpeedPenaltyMultiplier=0.65 // high-speed agile AAM intercept performance
KillProbability=0.88                 // base chance to hit

[Guidance]
GuidanceType=3                       // 0=none, 1=IR, 2=semi-active radar, 3=active radar, 4=anti-radiation, 5=laser, 6=TV, 7=active sonar, 8=passive sonar, 9=wake homing
MidCourseCorrection=3               // 0=none, 1=radio command, 2=wire guided, 3=datalink midcourse
DropDuration=1.0                    // seconds the missile falls unpowered after release
InitialFlightPhaseDuration=2.0      // seconds it flies straight before guidance begins
MaxLoftAngle=20                     // maximum climb angle for the initial loft, in degrees
MaxLoftAlt=85000                    // maximum loft altitude in feet; can also be Maintain, Target, or Launcher
TerminalApproachDist=12             // terminal seeker handoff distance in nmi
ApplyKinematics=True                // use the full missile kinematics model
MaxVelocity=3000.0                  // Maximum speed in knots (Mach 5.0)
MaxTurnRate=32.0                    // Maximum turnrate in degrees per second
MaxTurnG=40                         // Maximum G-limit of missile turns (high agility)
AccelerationTime=0.01               // Burn time for initial booster burn
Acceleration=0                     // Gs of acceleration in initial burn
SustainerAccelerationTime=15        // Time of sustainer burn (dual-pulse motor energy)
SustainerAcceleration=6.5           // Acceleration of sustainer burn
DragCoefficient=-1                  // calculate drag based on missile max range
TypicalTargetAlt=40000              // Sets the estimated target altitude (in feet)
TypicalTargetSpeed=750              // Sets the estimated target speed (in knots)
TypicalFiringAlt=40000              // Sets the estimated firing altitude (in feet)
TypicalLaunchVelocity=750           // Sets the estimated firing speed (in knots)
VelocityBleed=0.8                   // Missile will eventually slowdown to MaxVelocity*VelocityBleed
MaxFlightTime=180                   // How long until missile entirely fails, in seconds
TerminalLoft=True
TimeLimited=True
LiftFactor=0.001                    // defines extra drag at high altitudes/low speeds
MinLaunchRange=1.5                  // minimum launch range in nautical miles
MaxLaunchRange=105.0                // Maximum launch range in nautical miles (~195 km)
MinLaunchAltitude=200               // minimum launch altitude in feet
MaxLaunchAltitude=75000             // maximum launch altitude in feet
MinAttackAltitude=50                // minimum target altitude in feet
MaxAttackAltitude=85000             // maximum target altitude in feet
MaxAttackVelocity=2200              // target speed in knots above which hit chance degrades
LaunchReliability=95                // launch reliability from 0 to 100
SeekerGain=42                       // seeker gain in dB (AESA array)
SeekerFOV=70                        // seeker field of view in degrees (AESA electronic scan)
SecondaryPassiveRadarGuidanceType=HomeOnJam // home on jammers prior to active lock
PassiveRadarGuidanceFrequencies=All // frequencies HomeOnJam can detect
SeekerPassiveRange=20               // Seeker passive range in nautical miles
SeekerActiveRange=16.0              // Active AESA seeker acquisition range in nmi
Frequency=X-Band                    // Active radar seeker frequency
PeakPower=10.0                      // Active radar seeker output peak power in kW
TargetMemory=True                   // Always locks on preselected target unless spoofed or jammed
AntiCountermeasuresBonus=0.35       // Subtracted from probability of spoofing by countermeasures
AntiJammerBonus=0.35                // Subtracted from probability of being jammed (AESA digital filtering)
SelfDestructDelay=5.0               // delay in seconds for self destruction

[Particles]
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.027002000
InFlightEffectStartTime=2.0
SustainerEffect=effects/weapons/emitters/missile_sustainer_large_effect
SustainerEffectPosition=0,0,-0.027002000
SustainerEffectStartTime=0.0
HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[Models]
ResourcesFolder=assets/models/weapon/ammunition/wp_r-77m/
ResourcesRoot=wp_r-77m.obj
ResourcesMesh=wp_r-77m
ResourcesMeshForLaunch=wp_r-77m_dummy
ResourcesMaterialFolder=assets/models/weapon/ammunition/wp_r-77m/
ResourcesMaterial=wp_r-77m_mat.ini
ResourcesMeshSwitchTime=1.0
NumberOfSubModels=0

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.002623000,0.002623000,0.054004000
