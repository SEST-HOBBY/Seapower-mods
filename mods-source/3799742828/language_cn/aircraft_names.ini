[wp_mig-31]
Type=拦截机
Default=米格-31,米格-31
NatoDefault=米格-31,米格-31
DefaultDescription=米格-31由米格-25发展而来，是一种双座全天候远程拦截机，于1981年列装苏联国土防空军。其“屏障”无源相控阵雷达是世界上第一种装备作战飞机的同类雷达，可同时跟踪并攻击多个目标。米格-31凭借高速、远航程和R-33导弹，负责在苏联北部和东部辽阔空域拦截轰炸机及巡航导弹。
Squadron1=米格-31第764歼击航空团,米格-31

[wp_mig-31bm]
Type=拦截机
Default=米格-31BM,米格-31BM
NatoDefault=米格-31BM,米格-31BM
DefaultDescription=米格-31BM是对现役米格-31B和米格-31BS机队的全面现代化改进型。升级后的“屏障-AM”雷达、现代化座舱显示器和任务系统增强了多目标交战能力，并可使用R-37M超远程空对空导弹和R-73近程空对空导弹。该型保留了米格-31出色的高速、远航程以及与其他拦截机和地面防空部队协同作战的能力。
Squadron1=米格-31BM第712近卫歼击航空团,米格-31BM
Squadron2=米格-31BM第317独立混成航空团,米格-31BM

[wp_mig-31k]
Type=轰炸机
Default=米格-31K,米格-31K
NatoDefault=米格-31K,米格-31K
DefaultDescription=米格-31K是由高速米格-31拦截机改装而成的专用打击平台。它作为Kh-47M2“匕首”空射弹道导弹的助推和发射载机，使该武器能够远程攻击重要的陆地及海上目标。“匕首”系统于2017年12月开始试验性战斗值班。
Squadron1=米格-31K第712近卫歼击航空团,米格-31K
