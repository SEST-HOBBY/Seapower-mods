[wp_mig-31]
Type=Перехватчик
Default=МиГ-31,МиГ-31
DefaultDescription=МиГ-31 создан на базе МиГ-25 и представляет собой двухместный всепогодный дальний перехватчик, принятый на вооружение авиации ПВО СССР в 1981 году. Его РЛС «Заслон» с пассивной фазированной антенной решёткой стала первой системой такого типа на серийном боевом самолёте и позволяет одновременно сопровождать и атаковать несколько целей. Высокая скорость, большая дальность полёта и ракеты Р-33 предназначены прежде всего для защиты обширных северных и восточных рубежей от бомбардировщиков и крылатых ракет.
Squadron1=МиГ-31 764-й ИАП,МиГ-31

[wp_mig-31bm]
Type=Перехватчик
Default=МиГ-31БМ,МиГ-31БМ
DefaultDescription=МиГ-31БМ представляет собой глубокую модернизацию парка перехватчиков МиГ-31Б и МиГ-31БС. Обновлённая РЛС «Заслон-АМ», современные индикаторы в кабинах и доработанный комплекс бортового оборудования расширяют возможности одновременной борьбы с несколькими целями и применения новых ракет, включая сверхдальнюю Р-37М и ближнюю Р-73. Самолёт сохраняет характерные для МиГ-31 высокую скорость, большую дальность и возможность совместной работы с другими перехватчиками и наземными средствами ПВО.
Squadron1=МиГ-31БМ 712-й гв. ИАП,МиГ-31БМ
Squadron2=МиГ-31БМ 317-й ОСАП,МиГ-31БМ

[wp_mig-31k]
Type=Бомбардировщик
Default=МиГ-31К,МиГ-31К
DefaultDescription=МиГ-31К является специализированной ударной модификацией скоростного перехватчика МиГ-31. Самолёт разгоняет и выводит к точке пуска авиационную аэробаллистическую ракету Х-47М2 «Кинжал», предназначенную для поражения важных наземных и надводных целей на большой дальности. Комплекс «Кинжал» заступил на опытно-боевое дежурство в декабре 2017 года.
Squadron1=МиГ-31К 712-й гв. ИАП,МиГ-31К
