DefaultDescription=Developed from the MiG-25, the MiG-31 is a two-seat, all-weather long-range interceptor that entered Soviet service in 1981. Its Zaslon passive electronically scanned array radar was the first of its kind fitted to an operational fighter and allows the aircraft to track and engage several targets at once. The MiG-31 combines high speed, long endurance and R-33 missiles to defend the vast northern and eastern approaches against bombers and cruise missiles.
