DefaultDescription=The MiG-31K is a specialized strike conversion of the high-speed MiG-31 interceptor. It acts as the boost and launch platform for the Kh-47M2 Kinzhal air-launched aeroballistic missile, allowing the weapon to attack important land and naval targets at long range. The Kinzhal system began experimental combat duty in December 2017.
