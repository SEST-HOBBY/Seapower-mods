DefaultDescription=The MiG-31BM is a comprehensive modernization of the MiG-31B and MiG-31BS interceptor fleet. An upgraded Zaslon-AM radar, modern cockpit displays and revised mission systems improve its ability to engage multiple targets and support new weapons, including the very-long-range R-37M and short-range R-73. It retains the MiG-31's exceptional speed, range and ability to cooperate with other interceptors and ground-based air defence forces.
