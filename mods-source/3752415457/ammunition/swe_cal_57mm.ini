[General]
Type=Projectile                        // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=2.4                               // in kg. Used for aircraft
AmmoPoints=2.4                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts                  // referenced in effects/decals.ini

FrontalArea=0.1234
SideArea=2.9
BottomArea=2.9
[Physics]
MuzzleVelocity=1030                    // meter per second
MaxRange=7600                          // in meters
GravityFactor=4
CircularErrorProbable=35               // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=0.6
ImpactSize=Tiny                        // Impact size, can be small, medium, large, verylarge
Penetration=Minor                      // can be minor, moderate, heavy, always
FuzeProximityDistance=15               // In meters
KillProbability=0.0012                 // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_small_shell
HitAirExplosionClass=SmallFlakExplosions
HitDefaultExplosion=effects/Particle Emitters/impact_small_shell
HitWaterSplashClass=SmallWaterSplashes
