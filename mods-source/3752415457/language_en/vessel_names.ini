DefaultDescription=Del Pilar-class offshore patrol vessels originally served as US Coast Guard Hamilton-class cutters, built in the 1960s for long-range global deployments. Transferred to the Philippines between 2011 and 2016, these rugged ships were extensively refitted to become the primary backbone of the nation's territorial defense 
Variant1=BRP Gregorio del Pilar,Gregorio del Pilar
Variant2=BRP Ramon Alcaraz,Ramon Alcaraz
Variant3=BRP Andres Bonifacio,Andres Bonifacio

[phl_lpd_tarlac]
Type=LPD,Landing Ship
Default=Tarlac-class,Tarlac
DefaultDescription=The Tarlac class are landing platform docks of the Philippine Navy meant for amphibious operations and transport duties in support of the Armed Forces of the Philippines. The class was initially called the "Strategic Sealift Vessel" before being formally named. The ships will also double as a support platform for Humanitarian and Disaster Relief (HADR) and Search & Rescue (SAR) operations.
Variant1=BRP Tarlac,Tarlac
Variant2=BRP Davao del Sur,Davao del Sur