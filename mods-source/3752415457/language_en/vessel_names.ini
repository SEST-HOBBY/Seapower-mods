[phl_fs_pohang]
Type=FS,Corvette
Default=Pohang-class,Pohang
DefaultDescription=The Pohang-class corvette represents a monumental leap in firepower for the Philippine Navy, introducing its first true anti-submarine warfare (ASW) capability in decades. Originally built for the Republic of Korea Navy during the Cold War, the 1,200-ton warship BRP Conrado Yap (PS-30) was donated by South Korea and commissioned into Filipino service in 2019.
Variant1=BRP Conrado Yap 30,Conrado Yap


[phl_ff_cannon]
Type=FF,Frigate
Default=Cannon Class,Cannon
DefaultDescription=Emerging from the smoke of World War II, the Cannon-class destroyer escorts became the ultimate endurance runners of the Philippine Navy. Cheap to run, heavily armed with deck guns, and built to survive, these diesel-electric workhorses protected thousands of miles of coastline for over half a century. 
Variant1=BRP Datu Kalantiaw 76,Datu Kalantiaw
Variant2=BRP Datu Sikatuna 05,Datu Sikatuna
Variant3=BRP Rajah Humabon 11,Rajah Humabon

[phl_ff_hamilton]
