[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.0
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.14

Length=88.7                    // in meters
Beam=12.8                       // in meters

CompartmentsHeight=0.06       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=3950              // in tons

MaxForwardVelocity=13.0        // sets the max forward velocity
MaxBackwardVelocity=5.0        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=2.0             // turn rate of the rudder in degrees per second
RudderForce=0.36                // multiplicator defining how agile the ship can turn

TiltFactor=2.8                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepthEmpty=-8              // default trim depth in feet for when cargo is fully unloaded
TrimDepth=0.4                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=9.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium
# Sonar related
BaseNoise=180                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=3					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=3 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=3
AnimationFile_1=animations_rails-launcher
AnimationFile_2=animations_armed_partizan_styxspam
AnimationFile_3=animations_yj-8

[---------- AI related ----------]
[AI]
UnitCostValue=5000            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score

#Sensors
Radar_Capability=TBD

#Offence
AAW_Capability=2
ASuW_Capability=5
ASW_Capability=0

#Defence
MissilesToSaturate=2      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

#Special
Role=Spy,ASuW_Gun,ASuW
DisguisedAs=civ_ms_yuniy_partizan

