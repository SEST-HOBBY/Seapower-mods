[---------- Surface ships ----------]
[FishFinderSonar]
#Generic low capability sonar. I used a Simrad SY50 as a reference point for some stats.
Kind=Sonar
HasDataLink=False                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=1.0                // TODO in degrees
RangeResolution=30.0                 // TODO defines the minimum range where two targets behind can be recognized as two; in meters
ActiveRange=2                        // in km
PassiveRange=4                       // in km
ActiveGain=10                        // in db, gain of the active sensor
Gain=10                              // in db, gain of the sensor
OutputPower=210                      // Active sensor output power in dB, unused for passive ones
Type=Hull                            //Hull: hull mounted sonar, Towed: towed passive sonar, VDS: variable depth active sonar, Dipping: dipping sonar
SonarFrequency=LF                    // TODO ????
ModuleType=SonarSensor

[NavSonar]
#Generic low capability sonar. Reminds me of Cold Waters Navigation Sonar.
Kind=Sonar
HasDataLink=False                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=1.0                // TODO in degrees
RangeResolution=30.0                 // TODO defines the minimum range where two targets behind can be recognized as two; in meters
ActiveRange=2                        // in km
PassiveRange=3                       // in km
ActiveGain=10                        // in db, gain of the active sensor
Gain=10                              // in db, gain of the sensor
OutputPower=210                      // Active sensor output power in dB, unused for passive ones
Type=Hull                            //Hull: hull mounted sonar, Towed: towed passive sonar, VDS: variable depth active sonar, Dipping: dipping sonar
SonarFrequency=MF                    // TODO ????
ModuleType=SonarSensor

[MineDetectorSonar]
#Generic low capability sonar. Meant to go on minesweepers or smth.
Kind=Sonar
HasDataLink=False                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=1.0                // TODO in degrees
RangeResolution=30.0                 // TODO defines the minimum range where two targets behind can be recognized as two; in meters
ActiveRange=2                        // in km
PassiveRange=2                       // in km
ActiveGain=10                       // in db, gain of the active sensor
Gain=10                              // in db, gain of the sensor
OutputPower=210                      // Active sensor output power in dB, unused for passive ones
Type=Hull                            //Hull: hull mounted sonar, Towed: towed passive sonar, VDS: variable depth active sonar, Dipping: dipping sonar
SonarFrequency=HF                    // TODO ????
ModuleType=SonarSensor

