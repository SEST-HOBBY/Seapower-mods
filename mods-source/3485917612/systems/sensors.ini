############################################################
# RCS values
############################################################


##### Possible frequency bands (ITU => ECM):
# VHF-Band  => A-Band    100...300MHz
# UHF-Band  => B/C-Band: 300...1000MHz
# L-Band    => D-Band:     1...2GHz
# S-Band    => E/F-Band:   2...4GHz
# C-Band    => G-Band:     4...8GHz
# X-Band    => H/I-Band:   8...10GHz
# Ku-Band   => J-Band:    10...20GHz
# K-Band    => K-Band:    20...30GHz
# Ka-Band   => K-Band:    30...40GHz
#####

#Range Resolution = Rres = c/(2*PRF) where C = 3x10E8 and PRF = Pulse repetition frequency

