#=========================================================================================================================================================
#                                                 REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Shahed-136 «Geran-2»
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly.
Mass=200                               // in kg. Used for aircraft

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=0.5
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=0.3
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=3  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=150                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=18
ImpactSize=Small                      // Impact size, can be small, medium, large, verylarge
Penetration=moderate                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=8.0         // time in seconds where the missile moves straight on without guiding
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
PerformsSlightBallisticInitialFlight=False  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
TerrainFollowFlight=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=50                      // Climb angle for initial loft
MaxLoftAlt=300                      // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
FinalFlightPhaseAlt=300.0             // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=40.0
FinalFlightPhaseDistToTarget=0.0       // in N. miles. Recommended to set this distance equal to the seeker range
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=2.5              // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalDiveDistance=0.5                 // in N. miles.
SupportsBanking=True                     // if the missile will bank when turning

#========================================= Launch stats ============================================================
MaxVelocity=100.0                      // Maximum speed in knots
Acceleration=0.5                       // Acceleration factor
MaxTurnRate=75.0                        // Maximum turnrate in degrees per second
MinLaunchRange=5.0                     // Minimum launch range in nautical miles
MaxLaunchRange=800.0                    // Maximum launch range in nautical miles
LaunchReliability=85                   // The lower the value, the greater risk of misfire or accident (0...100)

#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=150     // Circular error vs 'Installation' land units
#Homing
IsRearAspectOnly=False                 // Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=0                     // Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=0                         // Seeker field-of-view in degrees
SeekerGimbalFOV=0                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=0                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True    
#ECCM
AntiCountermeasuresBonus=0.05           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.1                    // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/shahed_136/
ResourcesRoot=shahed_136.obj
ResourcesMesh=missile
ResourcesMeshSwitchTime=5  // time in seconds after launch to switch from launch mesh to main mesh
ResourcesMaterialFolder=assets/models/weapon/shahed_136/textures/
ResourcesMaterial=shahed_white_mat.ini
############################################################
NumberOfSubModels=1

SubModel1=propeller

[propeller]
ResourcesMeshFolder=assets/models/weapon/shahed_136/
RootMesh=shahed_136.obj
Type=Propulsion
RotationDirection=Right
Mesh=propeller
Rotation=0,0,0


#[-Debris]
DebrisProbability=101              // in %, probability for debris to happen
ResourcesMeshFolder=assets/models/weapon/shahed_136
RootMesh=shahed_136.obj
ResourcesMeshForDebris=missile  // optional debris mesh after destruction
#DebrisPosition=0.05                // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.9
DebrisHeightLossAdd=0.0005   // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=effects/weapons/emitters/usn_rgm_84_booster
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes
############################################################
# Sounds
############################################################
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=3
BoosterAudioClip=audio/aircraft/TurboPropP3-COrion
BoosterAudioPosition=0,0,0
BoosterAudioRollOff=Logarithmic
BoosterAudioDistance=1,20
BoosterAudioPitchRange=1,1
BoosterAudioVolumeRange=3,3
SustainerAudioClip=audio/aircraft/TurboPropP3-COrion
SustainerAudioPosition=0,0,0
SustainerAudioRollOff=Logarithmic
SustainerAudioDistance=1,20
SustainerAudioPitchRange=1,1
SustainerAudioVolumeRange=3,3
InflightAudioClip=audio/aircraft/TurboPropP3-COrion
InflightAudioPosition=0,0,0
InflightAudioDistance=1,20
InflightAudioPitchRange=1,1
InflightAudioVolumeRange=3,3

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
Collider=coll_main

[coll_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.066