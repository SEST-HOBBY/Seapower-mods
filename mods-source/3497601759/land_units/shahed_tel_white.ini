PreloadAmmunition=True
ForceMoveToLoadPosition=True
#Effects
#Other
MaxReactiontime=15
DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
Integrity=4
VIDIncrease=10  // In miles.

