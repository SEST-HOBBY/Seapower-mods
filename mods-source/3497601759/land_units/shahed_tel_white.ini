[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=11                     // in meters
Beam=2.5                      // in meters
Range=525.0                     // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=520
Mass=20                        // in tons

MaxForwardVelocity=48          // in knots
MaxBackwardVelocity=5          // in knots
Braking=10                     // knots/sec
TurnRate=25                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=ASuW,LandAttack

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_shahed_tel

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1]
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

#[SensorSystem2]  #Snap_Shot
Type=Radar
SystemName=Snap_Shot
Mount=Radar
ModuleType=Sensor
[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #Shahed-136
Type=Missile
SystemName=Shahed-136
#Sensors
#Animations
Mount=launcherbase
MountRotatable=False
#Containers
NumberOfContainers=1
#NumberOfHatchesPerContainer=2
Container1=launcherbase
#Container1_Hatch1=launcherbase
#Container1_OpenHatchAnimation=HatchOpenAnim
#Container1_CloseHatchAnimation=HatchCloseAnim
