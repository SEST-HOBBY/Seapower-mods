#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Shahed-136 «Geran-2»
# Users: shahed_tel_white
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All // can be  All, Installation, Mobile, ShoreTargetsOnly
RequiresWarmUp=False  //False - removes need to reload launcher before first launch


CIWSDefenceBonus=4                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers

Mass=500                              // in kg. Used for aircraft
AmmoPoints=40000                       // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
SupplyCategory=IranBallisticHBM       // For Supply System. Makes that presence of such category is required for replenishment of this weapon

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=10  // at what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=medium
# Sonar related
# Transient
TransientRCS=VeryTiny                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=270               // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster 
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=50
ImpactSize=Large                  // Impact size, can be small, medium, large, verylarge
Penetration=Always                   // can be minor, moderate, heavy, always


[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=12        // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=20.0                      // Climb angle for initial loft
MaxLoftAlt=10000.0                     // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
FinalFlightPhaseVelocity=
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalMaxAlt=11000
TerminalMinAlt=9000
TerminalVelocity=750
TerminalApproachDist=1360             // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalDiveDistance=2                 // in N. miles.
SupportsBanking=True                   // if the missile will bank when turning
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation

#========================================= Launch stats ============================================================
MaxVelocity=150                      // Maximum speed in knots                    
Acceleration=5                      // Acceleration factor
AccelerationTime=5.0                  // Time until start of the velocity bleed, in seconds
MaxTurnRate=360                       // Maximum turnrate in degrees per second                 
MinLaunchRange=5.0                     // Minimum launch range in nautical miles
MaxLaunchRange=1369                    // Maximum launch range in nautical miles
LaunchReliability=90                   // The lower the value, the greater risk of misfire or accident (0...100)
WobblingStrength=50                   // amplitude of wobbling. Marks that missile performs some wobbling flight
WobblingSpeed=2                     // frequency of wobbling
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=0.15    // Circular error vs 'Installation' land units
#Homing
#ECCM
CounterMeasuresRejection=70            // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=70                     // The lower the value, the greater risk of spoofing by jamming	(0...100)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=200.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/shahed_136/
ResourcesRoot=shahed_136.obj
ResourcesMesh=output
ResourcesMaterialFolder=assets/models/weapon/shahed_136/textures/
ResourcesMaterial=shahed_white_mat.ini
############################################################
NumberOfSubModel=0


#[-Debris]
DebrisProbability=101              // in %, probability for debris to happen
ResourcesMeshFolder=assets/models/weapon/shahed_136
RootMesh=shahed_136.obj
ResourcesMeshForDebris=output  // optional debris mesh after destruction
#DebrisPosition=0.05                // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.9
DebrisHeightLossAdd=0.0005   // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=effects/weapons/emitters/usn_rgm-109_booster
BoosterEffectPosition=0,0,0
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,0
InFlightEffectStartTime=4.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosion=effects/explosions/emitters/missile_hit_ship_large
HitShipExplosionRotation=0,25,0
HitAirExplosion=effects/explosions/emitters/missile_hit_air
HitAirExplosionRotation=0,25,0
HitWaterSplash=effects/splashes/emitters/splash_large
HitWaterSplashRotation=0,25,0
HitDefaultExplosion=effects/explosions/emitters/bomb_hit_ground_large
HitDefaultExplosionRotation=0,25,0
HitGroundExplosion=effects/explosions/emitters/bomb_hit_ground_large
HitGroundExplosionRotation=0,25,0
############################################################
# Sounds
############################################################
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=3
# Front
EngineAudioClip=audio/aircraft/TurboPropP3-COrion
EngineAudioPosition=0,0,0
EngineAudioRollOff=Logarithmic
EngineAudioDistance=1,20
EngineAudioPitchRange=10,6
EngineAudioVolumeRange=6,12
EngineAudioAspectAngle=0
EngineAudioAspectArcHalfRange=180
EngineAudioAudibility=AboveAndBelow  // layer of sound audibility: Above, Below, AboveAndBelow
# Rear
ExhaustAudioClip=audio/aircraft/turboprop_far
ExhaustAudioPosition=0,0,0
ExhaustAudioRollOff=Logarithmic
ExhaustAudioDistance=1,20
ExhaustAudioPitchRange=10,6
ExhaustAudioVolumeRange=6,12
ExhaustAudioAspectAngle=180
ExhaustAudioAspectArcHalfRange=180
ExhaustAudioAudibility=AboveAndBelow  // layer of sound audibility: Above, Below, AboveAndBelow
# Far
FarAudioClip=audio/aircraft/turboprop_far
FarAudioPosition=0,0,0
FarAudioRollOff=Logarithmic
FarAudioDistance=3,20
FarAudioPitch=1.4
FarAudioVolume=1.0
FarAudioFadeRange=0.05,0.25	      // nautical miles min/max
FarAudioAudibility=AboveAndBelow  // layer of sound audibility: Above, Below, AboveAndBelow
[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.0324
Rotation=0,0,0
Scale=0.009963,0.010919,0.111335
