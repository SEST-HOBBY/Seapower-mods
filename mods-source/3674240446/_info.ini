Name=Shahed-136
Description= The Shahed-136 munition is designed to attack ground targets from a distance. The drone is typically fired in multiples from a launch rack. "The HESA Shahed 136, also known by its Russian designation Geran-2, is an Iranian-designed one-way attack drone, also referred to as a kamikaze drone or suicide drone, in the form of an autonomous pusher-propelled drone."