shahed_136_white=Shahed-136,,ASuW,Shahed meaning ‘Witness’ in Farsi—are a family of OWA UAVs originally designed and manufactured by Shahed Aviation Industries, an Iranian aerospace company. The Shahed-131 is a smaller munition with a range of 700–900 km, while the larger Shahed-136 has a range of at least 2,000 km. The munitions are precision-guided, flying along manually-inputted geocoordinates before diving onto their targets and exploding. Investigations into the drones’ technical components found a variety of western-made commercial technology used in their assembly.
