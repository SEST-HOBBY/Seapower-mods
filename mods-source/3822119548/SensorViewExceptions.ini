; Sensor View exceptions - per-radar / weapon / unit switches, for us and for any other mod.
;
; Any mod can ship its own file named SensorViewExceptions.ini in its folder (next to its _info.ini): Sensor View reads the one in
; every ticked mod at each mission start. A mod's setting wins over this file; between mods, the one listed first in the load order
; wins (as the game does). Code mods can call SensorView.SensorViewApi.SetException(kind, name, key, value) instead.
;
; Format: one section per thing, [Kind:Name], with the name as the game's data has it (case does not matter):
;   Radar  - the sensors.ini section name (what a unit's SensorSystem has as SystemName), e.g. Top_Dome, SPG-62
;   Weapon - the ammunition file name, e.g. wp_sa-n-6        (no keys yet)
;   Unit   - the unit's ini name, e.g. wp_rkr_slava
; then key = value lines. ';', '#' and '//' at the start of a line or after a space start a comment; a value in "quotes" keeps them.
;
; Keys:
;   Radar  TrackViaMissile = true   the radar also tracks the missiles it guides: a beam from it to each of its missiles in flight (the
;                                   missiles holding one of its weapon channels), as the real 3R41 Volna (Top Dome) does. Drawing only -
;                                   the game itself does not make the radar track a datalink / semi-active missile.
;   Radar  CommandLink = true       the system is a guidance pod / command link, not a radar that lights up the target: no beam on
;                                   the target while it steers its missile (the link to the missile stays). On its own for every
;                                   Mode=RadioCommand system on an aircraft (pods, AN/ARW-77, GPS / Link-16 receivers); ships are
;                                   left as they are. = true marks a ship's link (e.g. a GPS receiver), = false gives an aircraft's
;                                   real command radar its target beam back.
;   Radar  BeamStart = x,y,z          (to-do 46) where this radar's beams start, exactly - no shape reading: metres in the unit's own
;                                   axes (x right, y up, z forward, from the unit's origin). BeamRadius = metres: the beam's width at
;                                   its start (default 1.5). For one ship only: [Unit:<ini>] <RadarName>.BeamStart / .BeamRadius.
;                                   For mod authors in their own SensorViewExceptions.ini; [Display] ShapeRules = false turns all
;                                   shape reading off.
;   Unit   RadarPosition = Chin       aircraft only: where its radar sits, for the radar beams' start. Default Nose: found from the
;                                   model's shape for every aircraft (behind the nose radome). Chin / Belly / Top: the biggest bulge
;                                   under the front 40 % / under the front 70 % / on top of the middle of the body (e.g. a rotodome).
;                                   Intake: nose-intake fighters (radar in the intake's centre cone) - the nose rule, beam start
;                                   ~45 % of the intake's width.
;                                   Our file sets base-game aircraft only; a mod sets its own (e.g. a chin-radome helicopter).
;
; Rules - new label lines and shapes without code, one section each: [Rule:any_name]
;   Weapon = ammunition file name (* and ? allowed)   or   Unit = unit ini name     which things it is for
;   When   = condition, optional:  PATH  |  !PATH  |  PATH == value  (also != > < >= <=; numbers, enum names, text)
;   Label  = text added to the label; {PATH} puts a value in
;   Draw   = ring R  |  cone L H  |  line PATH  |  dashed PATH      (R, L in nm; H half-angle in degrees; PATH: target, or a
;            field holding a position, a unit or a GeoPosition)
;   Color  = white red orange yellow green cyan blue purple grey radar sonar seeker datalink warning, or r,g,b
;            (no '#': it starts a comment here)
;   Opacity = 0..1     FairMode = true  (also for other sides' things in fair mode; default: own side / Show all units only)
; Label changes (any of these; When applies to them too):
;   Rename = text            the name line ({PATH} allowed)
;   Hide = kind, kind        remove every line of these kinds
;   Replace.KIND = text      new text for the first line of that kind ({PATH} allowed)
;   Color.KIND = colour      recolour every line of that kind;   LabelColor = colour   the whole label
;   Position = top | bottom | after KIND     where the Label = line goes (default bottom; top = after the name row)
;   Kinds = the layout field a line starts with (SensorViewLayout.template.ini lists them per label type): name lost detected
;          destroyed speed relspeed noise emission visible depth altitude damage activesonar cavitating impact phase seekeron guidance
;          spoofed failure wire fuel ... (mods' lines: mod). To change where things go, use a layout (SensorViewLayout.ini) instead.
; PATH: self.field.field (the weapon or unit itself, private fields too), target.field (its commanded target), or a static member
;   of any loaded type, Namespace.Type.Member.field - a table on the way that is keyed by the thing (a mod's per-missile
;   ConditionalWeakTable or Dictionary) is looked up for it automatically, e.g.
;   ResoluteUpgrade.Combat.PikeAfterburner71.States.Powered . A path that does not resolve (mod not ticked, or renamed in an
;   update) just makes the rule not apply; a rule that errors is switched off with a line in LogOutput.log.
; Code mods can add logic of their own: SensorViewApi.RegisterExtension (see EXTENSIONS.md next to Sensor View's source).
; The options menu's Mods tab switch ("Mod extensions") turns all of it off.
;
; Example (base game; remove the ';' to try it): while an SS-N-12 climbs, its flight stage under the label and a 2 nm ring (When applies to both)
; [Rule:example_ssn12]
; Weapon = wp_ss-n-12
; Label  = stage {self._flightStage}
; Draw   = ring 2
; When   = self._flightStage == MoveToLoftAlt
; Color  = cyan

[Radar:Top_Dome]
TrackViaMissile = true

; Tu-16K (base game): its YeN radar, which command-guides the AS-2 Kipper, sits in the chin radome under the glazed nose
[Unit:wp_tu-16k]
RadarPosition = Chin

; MiG-21 and J-7 (base game): the radar sits in the intake's centre cone, smaller than the intake ring the nose rule measures
[Unit:wp_mig-21]
RadarPosition = Intake

[Unit:pla_j-7c]
RadarPosition = Intake
