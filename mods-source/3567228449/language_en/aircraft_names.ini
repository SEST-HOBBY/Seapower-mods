DefaultDescription=Developed in the late 1990s by Airbus Helicopters as the most advanced military evolution of the Super Puma/Cougar family, the Caracal was shaped by lessons from combat operations and long-range CSAR requirements, prioritizing survivability, endurance, and mission flexibility. It features a reinforced long fuselage, uprated Makila engines for hot-and-high performance, a modern glass cockpit with mission management systems, and provisions for in-flight refueling to support deep-penetration operations. Designed from the outset for hostile environments, the H225M integrates a comprehensive defensive aids suite (RWR, MAWS, LWS and chaff/flare) and supports special operations, combat search and rescue, tactical transport, and maritime missions, making it the pinnacle of the Super Puma lineage.
