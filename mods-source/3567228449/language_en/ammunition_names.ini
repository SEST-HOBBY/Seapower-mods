fr_a244s_mod1=A244/S Mod1,,ASW,The A244/S is an Italian lightweight, fire-and-forget torpedo employed for anti-submarine warfare. It can be launched from surface vessels or aircraft and locates the target using an acoustic seeker. The torpedo body conforms to the NATO 12.75-inch (323.8 mm) standard and is compatible with USN Mark 32 torpedo tubes.

fr_mu_90_air= MU 90,,ASW Torpido, The MU90 Impact is a Franco-Italian advanced lightweight anti-submarine torpedo of the third generation[3] developed for the French and Italian navies

it_mu_90_air= MU 90,,ASW Torpido, The MU90 Impact is a Franco-Italian advanced lightweight anti-submarine torpedo of the third generation[3] developed for the French and Italian navies

fr_f17_mod1=F-17,,Torpedo,The F-17 is a French heavyweight torpedo. These torpedoes are wire guided and have a passive sonar for terminal attack. Entered service in the 70s.

