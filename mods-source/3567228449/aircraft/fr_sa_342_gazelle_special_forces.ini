[General]
#wiki
UnitType=Helicopter

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.33
MinCameraDistanceBroadside=0.33
CameraPivotHeight=0.0

GroundedPitchAngle=0  // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.017,0

ForwardsTaxiVelocity=10
BackwardsTaxiVelocity=0

[AI]
Role=ASuW

[---------- Physics and Control ----------]
[Physics]
############################################################
# Physics definition
############################################################
MaxPitchRate=17.0                  // in degrees per second
MaxRollRate=32.0                   // in degrees per second
MaxYawRate=62.0                    // in degrees per second
MaxPitchAngle=30
MaxRollAngleHovering=30
MaxRollAngleForwardFlight=60
TargetPitchForForwardFlight=0   // angle in degrees the helicopter stays in when moving forward when releasing controls

// hovering movements
HoverStrength=0.5                  // determines how strong the hover movements are
MinVelocityForNoHoverMovement=40   // in knots, above this value there won't be additional hover movements
MaxHoverRadius=5                   // radius in meter the heli is allowed to do hover movements

MaxSpeedAtSeaLevel=124            // in knots
MaxBackwardSpeed=20                // in knots
MaxSidewardSpeed=30                // in knots
Ceiling=13000                    // ceiling in feet
Altitudes=20,200,500,1000,3000,5000,10000,15000,20000  // in feet
ClimbRate=33.17                    // feet per second

EmptyMass=1200                    // in kg
MaxFuel=700                        // in kg
MaxRange=670                       // in n miles
HoveringFuelConsumption=0.54       // Minimum fuel consumption when hovering.

MainThrustAccelerationFactor=6   // determines the engine thrust acceleration factor (as multiplicator of v=a*t)
LinearDrag=0.9995                  // this is for velocity damping (linear drag)
CurveDragFactor=2.0                // determines how quickly the helicopter loses velocity (dependend on steepness of curve)
GravityDragFactor=1.0              // determines the gravity factor (1.0 means here standard 9.81m/s²)

MousePitchFactor=0.3
MouseYawFactor=0.3

EngineWarmUpTime=30
RotorsSpinUpTime=40

[SensorData]
#Visual
VisualIdentificationRange=6       // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related

[FlightControls]
RotorConfiguration=SingleMain      // can be singlemain, coaxial, tandem
SwashplateMaxAngle=2.5
NumberOfRotors=2
