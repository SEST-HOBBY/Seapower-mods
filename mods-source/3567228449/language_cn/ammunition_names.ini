# --------------- 鱼雷 ---------------

fr_a244s_mod1=A244/S Mod1,,反潜鱼雷,A244/S是一种意大利制造的轻型、“发射后不管”鱼雷，用于反潜作战。它可由水面舰艇或飞机发射，并利用声学导引头定位目标。鱼雷弹体符合北约12.75英寸（323.8毫米）标准，并与美国海军Mark 32鱼雷发射管兼容。

fr_mu_90_air= MU 90,,反潜鱼雷, MU 90是一种为法国和意大利海军开发的、第三代先进轻型反潜鱼雷。

fr_f17_mod1=F-17,,鱼雷,F-17是一种法国重型鱼雷。该型鱼雷为线导，并拥有用于终端攻击的被动声呐。于20世纪70年代进入服役。

