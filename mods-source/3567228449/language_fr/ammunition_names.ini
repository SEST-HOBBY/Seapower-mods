fr_a244s_mod1=A244/S Mod1,,ASW,L'A244/S est une torpille italienne légère de type « tire et oublie », utilisée pour la lutte anti-sous-marine. Lançable depuis des navires de surface ou des aéronefs, elle localise sa cible grâce à un autodirecteur acoustique. Son corps est conforme à la norme OTAN de 323,8 mm (12,75 pouces) et compatible avec les tubes lance-torpilles Mark 32 de l'US Navy.

fr_mu_90_air= MU 90,,ASW Torpido,La MU90 Impact est une torpille anti-sous-marine légère avancée de troisième générationfranco-italienne développée pour les marines française et italienne.

fr_f17_mod1=F-17,,Torpedo,La F-17 est une torpille lourde française. Filoguidée, elle est équipée d'un sonar passif pour l'attaque terminale. Elle est entrée en service dans les années 1970.


