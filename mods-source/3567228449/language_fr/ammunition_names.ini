eu_pars_3_lr=PARS 3 LR,,ATGM,Le PARS 3 LR en service dans l'armée allemande, également connu sous le nom de TRIGAT-LR (antichar de troisième génération à longue portée).

usa_agm-114K=AGM 114 K,L'AGM-114K (Hellfire II) est un missile air-sol léger, doté d'un fuselage plus court, d'une portée de 8 km, d'une sécurité électronique et d'un armement défensif. Il utilise des ogives HEAT en tandem pour engager des cibles blindées.

