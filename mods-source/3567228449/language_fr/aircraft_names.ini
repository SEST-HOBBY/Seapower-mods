Callsigns=Squadron3,PUMA

[fr_as_532L2]
Type=Medium Lift Helicopter
Default=AS532L2 Cougar,Cougar
DefaultDescription=Développée à la fin des années 1970 par Aérospatiale comme une évolution plus grande et à plus longue autonomie du Puma, la famille Super Puma a été conçue comme un hélicoptère bimoteur de transport moyen privilégiant la charge utile, l'endurance, les capacités tous temps et les opérations maritimes. Elle a ensuite évolué à travers des variantes militarisées Cougar et poursuit sa lignée au sein d'Airbus Helicopters, avec une utilisation militaire et civile répandue dans le monde entier. Le Super Puma est une version utilitaire améliorée à fuselage long, dérivée de la famille Cougar militarisée. Construite sur la plateforme AS532, elle offre un espace cabine agrandi, une cellule et des systèmes de mission renforcés, et peut transporter jusqu'à environ 29 soldats ou du fret sur une longue distance. Elle est conçue pour accueillir des capteurs de champ de bataille et des équipements d'autoprotection optionnels pour le transport tactique, la surveillance et les missions de soutien dans des environnements à haut risque.
Squadron1=AS532L2 Cougar 4e RHFS/ALAT (French Special Forces Helicopter Regiment),Cougar
Squadron2=AS532L2 Cougar 300 Sqn/DHC (Wildcats),Cougar
Squadron3=AS532L2 Cougar 300 Sqn/DHC (Wildcats),Cougar

[fr_as_332F]
Type=Medium Lift Helicopter
Default=AS332F Super Puma,Super Puma
DefaultDescription=Développée à la fin des années 1970 par Aérospatiale comme une évolution plus grande et à plus long rayon d'action du Puma, la famille Super Puma a été conçue comme un hélicoptère bimoteur de transport moyen privilégiant la charge utile, l'autonomie, les capacités tous temps et les opérations maritimes. Elle a ensuite évolué à travers des variantes militarisées Cougar et poursuit sa lignée au sein d'Airbus Helicopters, avec une utilisation militaire et civile répandue dans le monde entier. La variante navale du Super Puma, développée pour les opérations maritimes, est dotée d'une protection contre la corrosion, d'une structure renforcée, d'une compatibilité avec les navires et de systèmes de mission pour la lutte anti-sous-marine, la surveillance de surface et le transport naval, optimisée pour des opérations soutenues depuis des frégates et des plateformes offshore dans des environnements maritimes exigeants.
Squadron1=AS332F Super Puma Flottille 31F (Fictional),Super Puma
Squadron2=AS332F Super Puma HA-1/Armada de Chile (Escuadrón de Helicópteros de Ataque Nº1),Super Puma
Squadron3=AS332F Super Puma 2º Esquadrão de Helicópteros de Emprego Geral – HU-2 (2nd Utility Helicopter Squadron),Super Puma

[fr_as_532SC]
Type=Medium Lift Helicopter
Default=AS532SC Cougar,Cougar
DefaultDescription=Développée à la fin des années 1970 par Aérospatiale comme une évolution plus grande et à plus longue autonomie du Puma, la famille Super Puma a été conçue comme un hélicoptère bimoteur de transport moyen privilégiant la charge utile, l'endurance, les capacités tous temps et les opérations maritimes. Elle a ensuite évolué à travers des variantes militarisées Cougar et poursuit sa lignée au sein d'Airbus Helicopters, avec une utilisation militaire et civile répandue dans le monde entier. La variante navale et opérationnelle de la famille Cougar, développée par Aérospatiale, est dotée d'une cellule renforcée, d'une protection contre la corrosion maritime, d'équipements d'exploitation embarqués, de capteurs navals avancés et d'une suite complète d'autoprotection. Elle est optimisée pour la lutte anti-sous-marine (ASM), la lutte anti-navire (ASuW), la surveillance et les opérations navales multirôles depuis des frégates et autres bâtiments de combat de surface.
Squadron1=AS532SC Cougar HA-1/Armada de Chile (Escuadrón de Helicópteros de Ataque Nº1),Cougar

[fr_ec_725]
Type=Medium Lift Helicopter
Default=H225M(EC725) Caracal,Caracal
DefaultDescription=Développé à la fin des années 1990 par Airbus Helicopters comme l'évolution militaire la plus aboutie de la famille Super Puma/Cougar, le Caracal a été conçu en tirant les leçons des opérations de combat et des exigences des missions CSAR à longue portée, en privilégiant la survivabilité, l'autonomie et la polyvalence. Il est doté d'un fuselage long et renforcé, de moteurs Makila optimisés pour les hautes et basses températures, d'un cockpit tout écran moderne avec systèmes de gestion de mission et d'un système de ravitaillement en vol pour les opérations en profondeur. Conçu dès le départ pour les environnements hostiles, le H225M intègre un ensemble complet d'aides défensives (RWR, MAWS, LWS et leurres) et prend en charge les opérations spéciales, la recherche et le sauvetage au combat, le transport tactique et les missions maritimes, ce qui en fait le fleuron de la lignée Super Puma.
Squadron1=H225M(EC725) Caracal Escadron d’Hélicoptères 1/67 (“Pyrénées”)(Helicopter Squadron 1/67),Caracal
Squadron2=H225M(EC725) Caracal 2º Esquadrão de Helicópteros de Emprego Geral – HU-2 (“Pegasus”)(2nd Utility Helicopter Squadron),Caracal
Squadron3=H225M(EC725) Caracal 300 Sqn/DHC (Wildcats),Caracal

[fr_sa-319]
Type=Utility Helicopter
Default=SA.316/319 Alouette III,Alouette III
DefaultDescription=L'Aérospatiale Alouette III est un hélicoptère utilitaire léger monomoteur largement utilisé par les forces armées pour les missions de recherche et de sauvetage (SAR), de lutte anti-sous-marine (ASM) et d'appui aérien rapproché léger. Apprécié pour sa fiabilité et ses capacités embarquées, il effectue des opérations de treuillage, d'évacuation sanitaire et de récupération depuis des navires et des sites isolés. En ASM, il opère principalement en tant qu'hélicoptère équipé d'un système de détection d'objets mobiles (MAD), augmentant ainsi la portée de détection d'un navire de guerre plutôt que d'embarquer un sonar sous treuil ou des bouées acoustiques. Enfin, pour les missions d'appui aérien rapproché et d'armement, il peut être équipé de mitrailleuses, de lance-roquettes ou de missiles antichars (ATGM), ainsi que d'un radar de recherche de surface pour la surveillance maritime et le ciblage des menaces navales de surface.
