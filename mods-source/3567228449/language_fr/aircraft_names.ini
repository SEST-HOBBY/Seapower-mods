[fr_as_332B]
Type=Medium Lift Helicopter
Default=AS332B Super Puma,Super Puma
DefaultDescription=Développée à la fin des années 1970 par Aérospatiale comme une évolution plus grande et à plus longue autonomie du Puma, la famille Super Puma a été conçue comme un hélicoptère bimoteur de transport moyen privilégiant la charge utile, l'endurance, les capacités tous temps et les opérations maritimes. Elle a ensuite évolué à travers des variantes militarisées Cougar et poursuit sa lignée au sein d'Airbus Helicopters, avec une utilisation militaire et civile répandue dans le monde entier. La variante à fuselage court de la famille Super Puma est un hélicoptère bimoteur de transport moyen conçu pour une longue autonomie, une charge utile élevée, une compatibilité avec les navires et des opérations tous temps. Elle est principalement employée pour le transport, la recherche et le sauvetage (SAR) et des missions utilitaires générales, fonctionnant dans une configuration de base non militarisée sans système d'alerte radar (RWR) ni contre-mesures intégrés.
Squadron1=AS332B Super Puma EH 1/44 – Armée de l’Air (Escadron d’Hélicoptères 01.044),Super Puma
Squadron2=AS332B Super Puma 801 Escuadrón/Ala 49 (801 Escuadrón de Fuerzas Aéreas – Ala 49),Super Puma
Squadron3=AS332B Super Puma 802 Escuadrón/Ala 46 (802 Escuadrón de Fuerzas Aéreas – Ala 46),Super Puma
Squadron4=AS332B Super Puma 803 Escuadrón/Ala 48 (803 Escuadrón de Fuerzas Aéreas – Ala 48),Super Puma
Squadron5=AS332B Super Puma BHELMA IV/FAMET (Batallón de Helicópteros de Maniobra IV – Ejército de Tierra),Super Puma
Squadron6=AS332B Super Puma BHELMA VI/FAMET (Batallón de Helicópteros de Maniobra VI – Ejército de Tierra),Super Puma
Callsigns=Squadron5,CORZO|Squadron6,DRAGO

[fr_as_532C]
Type=Medium Lift Helicopter
Default=AS532C Cougar,Cougar
DefaultDescription=Développée à la fin des années 1970 par Aérospatiale comme une évolution plus grande et à plus longue autonomie du Puma, la famille Super Puma a été conçue comme un hélicoptère bimoteur de transport moyen privilégiant la charge utile, l'endurance, les capacités tous temps et les opérations maritimes. Elle a ensuite évolué à travers des variantes militarisées Cougar et poursuit sa lignée au sein d'Airbus Helicopters, avec une utilisation militaire et civile répandue dans le monde entier. La variante à fuselage court du Cougar, branche militarisée de la famille Super Puma, a été développée pour les missions tactiques et de soutien au combat. Elle combine les performances d'un hélicoptère de transport moyen avec une structure renforcée, une avionique militaire et une suite complète d'aides défensives comprenant un détecteur d'alerte radar (RWR) et des contre-mesures de leurres/leurres pour une meilleure survie dans des environnements à haut risque.
