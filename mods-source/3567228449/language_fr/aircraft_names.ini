[fr_as_532L]
Type=Medium Lift Helicopter
Default=AS532L Cougar,Cougar
DefaultDescription=Développée à la fin des années 1970 par Aérospatiale comme une évolution plus grande et à plus longue autonomie du Puma, la famille Super Puma a été conçue comme un hélicoptère bimoteur de transport moyen privilégiant la charge utile, l'autonomie, les capacités tous temps et les opérations maritimes. Elle a ensuite évolué à travers des variantes militarisées Cougar et poursuit sa lignée au sein d'Airbus Helicopters, avec une utilisation militaire et civile mondiale répandue. La variante militarisée à fuselage long de la famille Cougar, dérivée de la lignée Super Puma, offre une capacité de transport de troupes et une autonomie accrues. Elle intègre une cellule renforcée, une avionique militaire et une suite complète d'aides défensives (détecteur d'alerte radar et contre-mesures) pour des missions de transport tactique et de soutien au combat soutenues dans des environnements à haut risque.
Squadron1=AS532L Cougar 4e RHFS/ALAT (French Special Forces Helicopter Regiment),Cougar
