[fr_as_332M]
Type=Medium Lift Helicopter
Default=AS332M Super Puma,Super Puma
DefaultDescription=Développée à la fin des années 1970 par Aérospatiale comme une évolution plus grande et à plus longue autonomie du Puma, la famille Super Puma a été conçue comme un hélicoptère bimoteur de transport moyen privilégiant la charge utile, l'endurance, les capacités tous temps et les opérations maritimes. Elle a ensuite évolué à travers des variantes militarisées Cougar et poursuit sa lignée au sein d'Airbus Helicopters, avec une utilisation militaire et civile répandue dans le monde entier. La version à fuselage long de la famille Super Puma, un hélicoptère bimoteur de transport moyen développé pour augmenter le volume interne, la charge utile et l'autonomie par rapport aux modèles courts, est optimisée pour le transport de troupes à longue distance, les opérations maritimes et la recherche et le sauvetage. Elle est généralement déployée avec une autoprotection limitée ou optionnelle selon les besoins de l'opérateur.
