AN/APY-10=AN/APY-10|The AN/APY-10 is an American multifunction radar developed for the U.S. Navy's Boeing P-8 Poseidon maritime patrol and surveillance aircraft. AN/APY-10 is the latest descendant of a radar family originally developed by Texas Instruments, and now Raytheon after it acquired the radar business of TI, for Lockheed P-3 Orion, the predecessor of P-8.