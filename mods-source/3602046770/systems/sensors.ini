[AN/APY-10]
Kind=Radar
Type=Search            // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface     // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
CanDetectLandTargets=True  // True means the radar can see ground objects
CanDetectPeriscope=True
TargetChannels=0       // if applicable number of targets it can track simultaneously
WeaponChannels=0       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-120,120|-60,15      // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=1.1    // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0.2           // min range in km
MaxRange=470.0         // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=35000      // max altitude in meters, relevant for air, unused for surface
RangeResolution=110.0  // defines the minimum range where two targets behind can be recognized as two; in meters
Gain=61                // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=1300.0       // output peak power in kW