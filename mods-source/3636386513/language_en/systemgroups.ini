[SystemNames]
AN/APG-82(V)1=AN/APG-82(V)1|The AN/APG-82(V)1, developed by RTX (formerly Raytheon), is the standard active electronically scanned array (AESA) fire control radar for the F-15E Strike Eagle and F-15EX Eagle II.It can detect large aerial targets beyond 450 km, simultaneously track 26 targets and engage 4 of them.
AN/ALQ-250_EPAWSS(ECM)=AN/ALQ-250 EPAWSS(ECM)|The AN/ALQ-250 Eagle Passive Active Warning Survivability System (EPAWSS), developed by BAE Systems, is an all-digital integrated electronic warfare suite for the F-15 series.The system provides 360° RF situational awareness, precise geo-location, active electronic countermeasures (ECM), and enhanced chaff/flare dispensing capabilities, enabling it to detect, identify, locate, and neutralize surface-to-air and air-to-air threats in signal-dense, highly contested environments. 
AN/ALQ-250_EPAWSS(ESM)=AN/ALQ-250 EPAWSS(ESM)|The AN/ALQ-250 Eagle Passive Active Warning Survivability System (EPAWSS), developed by BAE Systems, is an all-digital integrated electronic warfare suite for the F-15 series.The system provides 360° RF situational awareness, precise geo-location, active electronic countermeasures (ECM), and enhanced chaff/flare dispensing capabilities, enabling it to detect, identify, locate, and neutralize surface-to-air and air-to-air threats in signal-dense, highly contested environments. 
