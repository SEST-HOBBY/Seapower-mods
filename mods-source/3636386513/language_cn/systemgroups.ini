AN/APG-82(V)1=AN/APG-82(V)1|AN/APG-82(V)1由RTX公司（前雷神公司）研制，是F-15E攻击鹰和F-15EX鹰II的标准有源电子扫描阵列（AESA）火控雷达。它能探测450公里以外的大型空中目标，可同时跟踪26个目标，并能打击其中4个目标
AN/ALQ-250_EPAWSS(ECM)=AN/ALQ-250 EPAWSS|AN/ALQ-250鹰式被动主动预警生存系统（EPAWSS）是F-15系列的全数字集成电子战套件。该系统提供360°射频态势感知、精确地理定位、主动电子对抗（ECM）以及增强的箔条/干扰弹投放能力，使其能在信号密集、高度对抗的环境中探测、识别、定位和压制地对空及空对空威胁
