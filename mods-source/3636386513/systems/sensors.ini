MinRange=0.1           // min range in km
MaxRange=400           // max range in km
MinAltitude=9          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30480     // max altitude in meters, relevant for air, unused for surface
RangeResolution=1.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=2.5         // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=67.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=10           // output peak power in kW

