[AmmunitionNames]
usaf_agm-86b=AGM-86B,ALCM,ASM,The Air Launched Cruise Missile (CALCM) is an American air-launched standoff land attack missile with a W80 thermonuclear warhead and the primary standoff weapon of the B-52. These weapons fly a pre-programmed route to a target with no input from the launch platform after launch, using terrain contour matching using a terrain mapping radar and onboard digital maps.

usaf_agm-86e=AGM-86E,CALASM,ASM,Anti Ship CALCM with TASM Radar Sensors.

usaf_agm-86e_nuclear=AGM-86E(W80),ALASM,ASM,Anti Ship ALCM with a W80 thermonuclear warhead.