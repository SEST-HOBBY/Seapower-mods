[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=14                     // in meters
Beam=3.0                       // in meters
Range=525.0                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=520
Mass=30                        // in tons

MaxForwardVelocity=20          // in knots
MaxBackwardVelocity=4          // in knots
Braking=13                     // knots/sec
TurnRate=20                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=ASuW,ASM

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_jp12

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

#[SensorSystem2]  #Snap_Shot
Type=Radar
SystemName=Snap_Shot
Mount=Radar
ModuleType=Sensor
[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #Type-12-SSM-ER
Type=Missile
SystemName=Type-12-SSM-ER
#Sensors
#Animations
#Mount
Mount=launchpad
MountRotatable=False
#Containers
NumberOfContainers=1
#NumberOfHatchesPerContainer=1
Container1=launchpad
#Container1_Hatch1=launchpad
#Container1_OpenHatchAnimation=HatchOpenAnim1
#Container1_CloseHatchAnimation=HatchCloseAnim1
AreContainersRotatable=True
#Angles
FixVerticalLaunchAngle=116         // 58*2=116
FiringArcs=-180,180
ElevationArc=-91,91
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
ForceMoveToLoadPosition=True
#Effects
#Other
MaxReactiontime=15          //最大随机反应时间
DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
Integrity=4
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=jp_12ssm
Ammunition1_Count=12
ModuleType=WeaponMagazine

[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=assets/models/land_units/jp12ht/
ResourcesRoot=jp12ht.obj
ResourcesMesh=main
ResourcesMaterialFolder=assets/models/land_units/jp12ht/textures/
ResourcesMaterial=jp12ht_mat.ini
############################################################

[Submodels]
Submodel1=body
Submodel2=launchpad
Submodel3=support1

[body]
ResourcesMeshFolder=assets/models/land_units/jp12ht/
RootMesh=jp12ht.obj
Mesh=body
Position=0,0,0
Rotation=0,0,0
ResourcesMaterialFolder=assets/models/land_units/jp12ht/textures/
Material=jp12ht_mat.ini

[launchpad]
ResourcesMeshFolder=assets/models/land_units/jp12ht/
RootMesh=jp12ht.obj
Mesh=launchpad
Parent=body
Position=-0.002787,0.032467,-0.091583
Rotation=0,0,0
ResourcesMaterialFolder=assets/models/land_units/jp12ht/textures/
Material=jp12ht_mat.ini

[support1]
ResourcesMeshFolder=assets/models/land_units/jp12ht/
RootMesh=jp12ht.obj
Mesh=support1
Parent=body
Position=0,0,0
Rotation=0,0,0
ResourcesMaterialFolder=assets/models/land_units/jp12ht/textures/
Material=jp12ht_mat.ini

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.01742,-0.0023
Rotation=0,0,0
Scale=0.04,0.035,0.07
Layer=Default

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default