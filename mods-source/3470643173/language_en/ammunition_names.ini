jp_12ssm=Type-12-SSM-ER,,ASM,The Type 12 anti-ship missile was developed by Mitsubishi Heavy Industries, based on a modified Type 88 missile, and entered service in 2015. It has an initial length of 5 meters, a projectile weight of 700 kg, subsonic speed (Mach 0.9) and a maximum range of 200 km. Improved version has a range of 900 kilometers (to be test-fired in 2024). Stealthy aerodynamic design (folding wings, X-shaped tail) and surface absorbing coatings, radar reflective cross-sectional area significantly reduced.