#=========================================================================================================================================================
#                                                  Shahed-238 loitering munition
#=========================================================================================================================================================
[General]
# Shahed-238
# Users: shahed_tel
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly
RequiresWarmUp=False                   //False - removes need to reload launcher before first launch

CIWSDefenceBonus=3                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.05

Mass=350                               // in kg. Used for aircraft
AmmoPoints=600                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
SupplyCategory=IranDroneSquad       // For Supply System. Makes that presence of such category is required for replenishment of this weapon
AirLaunched=True

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard                  // referenced in effects/decals.ini

[SensorData] 
#Visual 
VisualIdentificationRange=4 // at what range in nm this unit can be visually identified 
IRSignature=SemiSmall 
# Radar related (RCS => radar cross section) 
RCS=1.5 
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster 
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=18
ImpactSize=Medium                       // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
LandAttackGuidanceType=0
MidCourseCorrection=0                 // 0 = None, 1 = Radio Command, 2 = Wire Guided
TargetRequired=False                    // Cannot be launched to bearing
InitialFlightPhaseDuration=10         // time in seconds where the missile moves straight on without guiding
DropDuration=0.5
TerrainFollowFlight=True

#======================================== Flight Profile ===========================================================
#flight phase 1: Climb-----------------------------------------------------------------------------------------------------------------
MaxLoftAngle=10.0                      // Climb angle for initial loft
MaxLoftAlt=1500.0                     // in feet. Maximum altitude for lofting
#flight phase 2: cruise---------------------------------------------------------------------------------------------------------
SeaSkimmingAlt=1200
SeaSkimmingMaxDescentAngle=20.0
SeaSkimmingNoseUp=1.5
SeaSkimmingStartDistToTarget=40

#flight phase 3: final approach
FinalFlightPhaseDistToTarget=8.0
FinalFlightPhaseAlt=600

#flight phase 4: terminal dive
TerminalApproachDist=2.0
TerminalAlt=50

SupportsBanking=True
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation

#========================================= Launch stats ============================================================
MaxVelocity=480                        // Maximum speed in knots                    
Acceleration=4.0                        // Acceleration factor
MaxTurnRate=15                         // Maximum turnrate in degrees per second
                 
MinLaunchRange=2.0                      // Minimum launch range in nautical miles
MaxLaunchRange=600                     // Maximum launch range in nautical miles

MinLaunchAltitude=0
MaxLaunchAltitude=12000

LaunchReliability=85                     // The lower the value, the greater risk of misfire or accident (0...100)

#========================================     Seeker     ===========================================================
SeekerGain=30.0
SeekerFOV=60,6
SeekerActiveRange=6
SeekerPassiveRange=10

SecondaryPassiveRadarGuidanceType=HomeOnJam
PassiveRadarGuidanceFrequencies=All

Frequency=X-Band
PeakPower=5.0
TargetMemory=True

AntiCountermeasuresBonus=0.05
AntiJammerBonus=0.05

SelfDestructDelay=5.0

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/shahed238/
ResourcesRoot=shahed238.obj
ResourcesMesh=Missile
ResourcesMaterialFolder=assets/textures/shahed238/
ResourcesMaterial=shahed238_mat.ini
ResourcesMeshForLaunch=Missile
ResourcesMeshCanister=Missile
ResourcesMeshSwitchTime=4  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

NumberOfSubModels=1

SubModel1=Afterburner

[Afterburner]
Type=Afterburner                  //Dot: afterburner is invisible by default and will be turned on only after launch
Mesh=afterburner
ResourcesMaterialFolder=aircraft/materials/
Material=afterburner_mat
Position=0,0,0
Rotation=0,0,0

#[-Debris]
DebrisProbability=95         // probability for debris to happen
ResourcesMeshForDebris=usn_ugm_84_d // optional debris mesh after destruction
DebrisPosition=0.05          // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.99
DebrisHeightLossAdd=0.0005   // determines how quickly the debris loses height


[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=effects/weapons/emitters/seakiller_launch_effect	//sam_small_airlaunch_effect
BoosterEffectPosition=0,-0.02,-0.085
InFlightEffect=effects/weapons/emitters/missile_sustainer_small_effect
InFlightEffectPosition=0,-0.02,-0.085
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available
UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,-0.02,-0.085


HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosionClass=MediumMissileExplosions
#DebrisTrailClass=DefaultMissileFire
DebrisTrail=effects/aircraft/emitters/helicopterfireeffect
DebrisSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/bomb_hit_ground_large
HitDefaultExplosionRotation=0,25,0
HitGroundExplosion=effects/explosions/emitters/bomb_hit_ground_large
HitGroundExplosionRotation=0,25,0
############################################################

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.0324
Rotation=0,0,0
Scale=0.009963,0.010919,0.111335
