MESA=Multi-Role Electronically Scanned Array (MESA)|The radar is capable of simultaneous air and sea search, fighter control and area search, with a maximum range of over 600 km (look-up mode). The MESA radar is fixed, unlike the hydraulically-rotated AN/APY-1/2 of the E-3 Sentry. Despite this, the radar is still able to offer 360-degree azimuth scan using two broadside (side-emitting) electronic manifold arrays, each covering two 120° sectors to starboard and port, and an end-fire array housed within the top hat that covers a 60° front and aft of the aircraft.
MESA - ELINT=Multi-Role Electronically Scanned Array - ELINT|The radar antenna array serves as an ELINT array, with a maximum range of over 850 km at 9,000 metres (30,000 ft) altitude.