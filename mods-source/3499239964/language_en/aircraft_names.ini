DefaultDescription=The Boeing E-7 Wedgetail, also marketed as the Boeing 737 AEW&C, is a twin-engine airborne early warning and control aircraft based on the Boeing 737 Next Generation design. It has a fixed, active electronically scanned array radar antenna instead of a rotating one as with the 707-based Boeing E-3 Sentry. The dorsal fin on top of the fuselage serves as a Multi-role Electronically Scanned Array for AEW and surveillance radar, capable of simultaneous air/sea search, fighter control, area search, and the antenna also serves as an ELINT array.
