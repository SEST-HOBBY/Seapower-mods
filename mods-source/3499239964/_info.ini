Name=E-7A Wedgetail
Description=The E-7A Wedgetail is an airborne early warning and control (AEW&C) aircraft operated by the Royal Australian Air Force (RAAF). It is based on the Boeing 737 Next Generation design and features a distinctive Multi-Role Electronically Scanned Array (MESA) radar. The Wedgetail provides situational awareness and command and control capabilities, allowing it to track airborne and maritime targets and direct other aircraft.

THIS MOD IS STILL WIP, updates will come particularly to the landing gear. For now enjoy this new mod and I hope it helps you modern War Fighters maintain air and combat superiority.

