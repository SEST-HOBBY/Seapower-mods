[General]
UnitType=Submarine
DefaultCameraDistance=1.0
MinCameraDistanceForeAft=1.0
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.0

Length=86                      // in meters
Beam=10.4                      // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=6000               // in tons

MaxForwardVelocity=32.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=15.0
MaxBackwardVelocitySurfaced=3.0
MaxBackwardVelocity=7.0        // sets the max backward velocity
TelegraphVelocities=-7,0,5,10,15,20,32

BowUnderWater=16.0              // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=37.0            // depth in feet, from where the sail is under water
LinearDrag=0.97                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.74
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.8                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=5                    // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=-0.068        // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=47.0            // in feet
CrushDepth=2200                // in feet

CavitationParameters=20,-100


#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=112                   // base sound level in db at 1m distance
FlowNoise=0.58                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
TargetReflectionStrength=10     // in dB for broad side
BladesCount=15                  //number of blades on vessel's propulsion systems
ElectricFrequency=60            //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

MachineryRaftingGeneration=5
PropellerType=PumpJet

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_rn_ssn_warspite

