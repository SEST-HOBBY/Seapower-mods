[Animations]
NumberOfAnimations=8
Animation1=MoveDownElevator1
Animation2=MoveDownElevator2
Animation3=MoveUpElevator1
Animation4=MoveUpElevator2
Animation5=OpenDoor1
Animation6=CloseDoor1
Animation7=OpenDoor2
Animation8=CloseDoor2
#-----------------------------------------------------------
[MoveDownElevator1]
NumberOfSequencesToPlay=4
Sequence1=ElevatorMoveDownSequence
Sequence1_Model=Elevators_Walls_Front
Sequence2=ElevatorMoveDownSequence
Sequence2_Model=ElevatorsDeck_Front
Sequence3=ElevatorMoveDownSequence
Sequence3_Model=Elevators_Undersides_Front
Sequence4=RailingsUp
Sequence4_Model=Elevators_Railings_Front

[MoveDownElevator2]
NumberOfSequencesToPlay=4
Sequence1=ElevatorMoveDownSequence
Sequence1_Model=Elevators_Walls_Back
Sequence2=ElevatorMoveDownSequence
Sequence2_Model=ElevatorsDeck_Back
Sequence3=ElevatorMoveDownSequence
Sequence3_Model=Elevators_Undersides_Back
Sequence4=RailingsUp
Sequence4_Model=Elevators_Railings_Back


[MoveUpElevator1]
NumberOfSequencesToPlay=4
Sequence1=ElevatorMoveUpSequence
Sequence1_Model=Elevators_Walls_Front
Sequence2=ElevatorMoveUpSequence
Sequence2_Model=ElevatorsDeck_Front
Sequence3=ElevatorMoveUpSequence
Sequence3_Model=Elevators_Undersides_Front
Sequence4=RailingsDown
Sequence4_Model=Elevators_Railings_Front

[MoveUpElevator2]
NumberOfSequencesToPlay=4
Sequence1=ElevatorMoveUpSequence
Sequence1_Model=Elevators_Walls_Back
Sequence2=ElevatorMoveUpSequence
Sequence2_Model=ElevatorsDeck_Back
Sequence3=ElevatorMoveUpSequence
Sequence3_Model=Elevators_Undersides_Back
Sequence4=RailingsDown
Sequence4_Model=Elevators_Railings_Back

[OpenDoor1]
NumberOfSequencesToPlay=2
Sequence1=RotateZ100
Sequence1_Model=DoorBack1
Sequence2=RotationZ180B
Sequence2_Model=DoorBack2

[CloseDoor1]
NumberOfSequencesToPlay=2
Sequence1=UnRotationZ100
Sequence1_Model=DoorBack1
Sequence2=UnRotationZ180B
Sequence2_Model=DoorBack2

[OpenDoor2]
NumberOfSequencesToPlay=3
Sequence1=RotateZ100
Sequence1_Model=DoorSide1
Sequence2=RotationZ180A
Sequence2_Model=DoorSide2
Sequence3=RotationZ180B
Sequence3_Model=DoorSide3

[CloseDoor2]
NumberOfSequencesToPlay=3
Sequence1=UnRotationZ100
Sequence1_Model=DoorSide1
Sequence2=UnRotationZ180A
Sequence2_Model=DoorSide2
Sequence3=UnRotationZ180B
Sequence3_Model=DoorSide3

[------------------------------ Sequences ------------------------------]
#----------------------------------------------------------------------------------

[ElevatorMoveDownSequence]
NumberOfSteps=2
Time1=2                // time in seconds for the start
PositionY1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=12                // time in seconds - here for the end
PositionY2=-0.1423
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as its the last entry

[ElevatorMoveUpSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionY1=-0.1423
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=10                // time in seconds - here for the end
PositionY2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as its the last entry

#----------------------------------------------------------------------------------

[RailingsUp]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionY1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=2                // time in seconds - here for the end
PositionY2=0.017518 
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as its the last entry

[RailingsDown]
NumberOfSteps=2
Time1=10                // time in seconds for the start
PositionY1=0.017518 
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=12               // time in seconds - here for the end
PositionY2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as its the last entry

#----------------------------------------------------------------------------------

[RotateZ100] #Rotate to +100 on real Y
NumberOfSteps=2
Step1=0|x,y,z|x,y,0|EaseInOut  
Step2=20|x,y,z|x,y,-100|EaseInOut 


[RotationZ180A] #Rotate to +180 on real Y
NumberOfSteps=2
Step1=10|x,y,z|x,y,0|EaseInOut  
Step2=30|x,y,z|x,y,-180|EaseInOut 

[RotationZ180B] #Rotate to +180 on real Y
NumberOfSteps=2
Step1=10|x,y,z|x,y,0|EaseInOut  
Step2=30|x,y,z|x,y,180|EaseInOut 


[UnRotationZ180B] #UnRotate to +180 on real Y
NumberOfSteps=2
Step1=0|x,y,z|x,y,180|EaseInOut  
Step2=20|x,y,z|x,y,0|EaseInOut 

[UnRotationZ180A] #UnRotate to +180 on real Y
NumberOfSteps=2
Step1=0|x,y,z|x,y,-180|EaseInOut  
Step2=20|x,y,z|x,y,0|EaseInOut 


[UnRotationZ100] #UnRotate to +100 on real Y
NumberOfSteps=2
Step1=20|x,y,z|x,y,-100|EaseInOut  
Step2=30|x,y,z|x,y,0|EaseInOut 