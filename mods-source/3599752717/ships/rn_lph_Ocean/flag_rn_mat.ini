[Shader]
; Baseado no shader extraído da MADFINGER
Path=MADFINGER/Environment/Lightmap + Wind

[Properties]
; _Color no dump estava como (1, 1, 1, 1). 
; No seu padrão, usamos hexadecimal (RGBA).
_Color=Color,ffffffff

; Parâmetros de Vento (Wind)
; O dump mostrava X=0.01, Y=0, Z=0, W=0
_Wind=Vector,0,0,0,0

; Valores de flutuação da borda (Flutter)
_WindEdgeFlutter=Float,0.5
_WindEdgeFlutterFreqScale=Float,0.5

; Propriedades de renderização (opcional, se seu motor ler)
_Cutoff=Float,0.5
_ZWrite=Float,1.0

[Textures]
_MainTex=ships/materials/textures/Bandeira_do_Cruzeiro.png
