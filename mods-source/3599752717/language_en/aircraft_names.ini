[ -------------- ASW Helicopters --------------- ]
[rn_sea_lynx_has3]
Type=ASW Helicopter
Default=Sea Lynx HAS.3,Sea Lynx
DefaultDescription=The Westland Lynx is a multipurpose helicopter originally designed for the British Armed Forces but operated by several other nations. First entering service in 1977 the Lynx is a very fast and manoeuvrable aircraft.The HAS.3 naval variant for the Royal Navy is capable of both ASW and anti surface operations depending on the weapon loadout. Initially armed with the U.S. made Mk. 46 torpedo these were replaced by the British Sting Ray lightweight torpedo in the mid 1980’s. Against surface targets the Lynx is equipped with the radar guided Sea Skua missile.
Squadron1=Sea Lynx HAS.3 815 NAS,Sea Lynx
Squadron2=Sea Lynx HAS.3 829 NAS,Sea Lynx
Callsigns=Squadron1,Rascal,Scandal|Squadron2,Kingfisher,Tungsten,Mohawk

[rn_sea_lynx_mk8]
Type=ASW Helicopter
Default=Sea Lynx HMA.8,Sea Lynx
DefaultDescription=The Westland Lynx is a multipurpose helicopter originally designed for the British Armed Forces but operated by several other nations. First entering service in 1977 the Lynx is a very fast and manoeuvrable aircraft. The HMA.8 (Helicopter Maritime Attack, Mark 8) is the naval variant for the Royal Navy. It is capable of both ASW and anti surface operations depending on the weapon loadout. Considered the last of the classic Lynx generation, it entered service in the early 1990s and was officially retired in March 2017, replaced by the modern AgustaWestland AW159 Wildcat.
Squadron1=Sea Lynx HMA.8 815 NAS,Sea Lynx
Callsigns=Squadron1,Rascal,Scandal

