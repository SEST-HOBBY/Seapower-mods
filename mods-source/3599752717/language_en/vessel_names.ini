[ -------------- Helicopter carriers --------------- ]
[rn_lph_ocean]
Type=LPH,Helicopter Carrier
Default=Ocean class,Ocean
DefaultDescription=The HMS Ocean was the former flagship of the British Royal Navy, serving as a dedicated Landing Platform Helicopter (LPH). Commissioned in 1998, she was designed to provide a rapid amphibious assault capability, projecting power through a versatile fleet of helicopters and Royal Marines. After two decades of frontline service across the globe, she was sold to Brazil in 2018, where she continues her legacy as the NAM Atlântico.
