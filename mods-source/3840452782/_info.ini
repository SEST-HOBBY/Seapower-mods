Name=Swedish Army Air Defence - Giraffe 4A
Description=Saab Giraffe 4A multifunction radar for Sweden, from 2020: S-band AESA with a rotating antenna (60 rpm) in a 20 ft container on a Volvo FMX 4-axle truck, dark olive green. Air and surface search to 400 km, about 160 km against a small fighter, up to 70 deg elevation. Shares its tracks by datalink with units in the same group, for example the IRIS-T SLM launcher. Resistant to jamming. Static unit, no weapons. The Volvo is a stand-in for the Swedish carrier vehicle. Truck: "Volvo FMX Day Cab Chassis Truck 4-axle 2022" by niev, Sketchfab, CC BY 4.0 (https://sketchfab.com/3d-models/volvo-fmx-day-cab-chassis-truck-4-axle-2022-7e314e16c92d485f863525e8d8be3cbf), via the Tridon 57 mod. Radar module: own Meshy AI model (CC BY 4.0, credit: Meshy). No other mods required. Version 1.0.
