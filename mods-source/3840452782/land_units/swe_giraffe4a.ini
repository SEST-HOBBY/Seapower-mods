# Saab Giraffe 4A multifunction radar in a 20 ft container on a Volvo FMX 4-axle truck, deployed (jacks down, antenna raised).
# Version 1.0, 15 Nov 2026.
# Layout taken from swe_unde23 (rotating Giraffe on a truck) and swe_tridon57 (same Volvo, static submodel with its own material).
[General]
UnitType=LandUnit
LandUnitSubType=MissileSite
#IsMobile=True                  // left off: outrigger jacks are modelled lowered and the antenna raised

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.7                      // in meters (Volvo FMX 4-axle chassis)
Beam=2.55                       // in meters
Range=300                       // in miles

ArmorType=None
DamagePoints=3

FrontalArea=11
SideArea=36
BottomArea=24

[Tacview]
Name=Giraffe 4A
Tag=Ground+Radar

[Physics]
HorsePower=460                 // Volvo FMX D13
Mass=26                        // in tons: 4-axle chassis + radar container with power plant (estimate)
MaxForwardVelocity=40          // in knots
MaxBackwardVelocity=5.5
Braking=10
TurnRate=10

[AI]
UnitScoreValue=1
Role=ASuW                      // as UndE 23 and ArtE 740

[Animations]
NumberOfAnimationReferences=0

[ControlSystem]
Collider=coll_hitbox
Integrity=4

[SensorData]
VisualIdentificationRange=3
IRSignature=Small
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3

[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.03,0.04
ModuleType=Bridge
Integrity=0

[SensorSystem2] #Giraffe 4A - the working radar
# Mounted on a dummy point at the centre of the antenna, 6.2 m above ground on the rotation axis.
Type=Radar
SystemName=swe_giraffe4a_radar    // defined in this mod: systems/swe_giraffe4a_sensors.ini
Mount=Dummy
MountPosition=0.00009,0.09144,-0.02186
Collider=coll_radar

[SensorSystem3] #Antenna rotation only (cosmetic)
# Turns the visible antenna. Practically no range or power.
Type=Radar
SystemName=swe_giraffe4a_rotor    // defined in this mod: systems/swe_giraffe4a_sensors.ini
Mount=g4a_antenna
Collider=coll_radar

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=0

[--------------------------- Mesh definitions ---------------------------]
# Truck: "Volvo FMX Day Cab Chassis Truck 4-axle 2022" by niev (Sketchfab, CC BY 4.0), from the Tridon 57 mod:
# equipment box behind the cab removed, flatbed and lowered outrigger jacks kept, repainted dark olive green (#3E442C).
# Radar: Meshy AI "Giraffe 4A Radar Module" (CC BY 4.0, credit: Meshy), scaled so the container is 6.06 m long (20 ft),
# standing on the flatbed 1.50 m up with the fan end to the rear. Antenna top 7.57 m above ground.
# Real carrier: the Saab brochure shows a MAN-type 6x6; the Swedish radar has been photographed on an RMMV HX2 (FMV trials). The Volvo is a stand-in.
# 1 game unit = 68 m. 81,700 triangles, no LODs.
[Models]
ResourcesFolder=assets/swe_giraffe4a/models/
ResourcesRoot=swe_giraffe4a.obj
ResourcesMesh=g4a_body
ResourcesMaterialFolder=assets/swe_giraffe4a/materials/
ResourcesMaterial=g4a_truck_mat.ini

[Submodels]
Sensors_1=g4a_module
Sensors_2=g4a_antenna

[g4a_module]
# container, power plant and the raised antenna arm (fixed). Vertices in vehicle coordinates.
ResourcesMeshFolder=assets/swe_giraffe4a/models/
RootMesh=swe_giraffe4a.obj
ResourcesMaterialFolder=assets/swe_giraffe4a/materials/
Material=g4a_module_mat.ini
Mesh=g4a_module
Position=0,0,0
Rotation=0,0,0

[g4a_antenna]
# AESA antenna with its turntable head, 2.3 m wide and 2.7 m high, leaning back 8 deg. Vertices are local to the rotation axis.
ResourcesMeshFolder=assets/swe_giraffe4a/models/
RootMesh=swe_giraffe4a.obj
ResourcesMaterialFolder=assets/swe_giraffe4a/materials/
Material=g4a_module_mat.ini
Mesh=g4a_antenna
Parent=g4a_module
Position=0.00009,0.07150,-0.02186     // turntable on top of the arm, 4.86 m above ground, 1.49 m behind the model centre
Rotation=0,0,0
Scale=1,1,1

[---------- Effects ----------]
[Sounds]
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=3

Collider1=coll_hitbox
Collider2=coll_collider
Collider3=coll_radar

[coll_hitbox]
# truck, cab and container with the arm (0-4.9 m)
Collider=Box
Position=0,0.0359,0
Rotation=0,0,0
Scale=0.0375,0.0718,0.1419       // 2.55 x 4.9 x 9.65 m

[coll_collider]
Collider=Box
Position=0,0.0028,0
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default

[coll_radar]
# around the antenna (covers it at any rotation), 4.9-7.6 m above ground
Collider=Box
Position=0.00009,0.09144,-0.02186
Rotation=0,0,0
Scale=0.0360,0.0400,0.0360
