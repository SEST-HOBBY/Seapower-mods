#!extend systems/sensors.ini

[ ========================================= Sweden - Giraffe 4A ========================================== ]

[swe_giraffe4a_radar] # Saab Giraffe 4A - S-band AESA multifunction radar, rotating antenna
#Users: swe_giraffe4a.
#Saab brochure (June 2014, ver 2): stacked beam 3D radar, AESA with digital beam forming, S (E/F) band, GaN,
#elevation coverage > 70 deg, 30 or 60 rpm, 360 deg or sector 40-120 deg, instrumented range 280 km (air surveillance)
#and 100 km (weapon locating), > 1000 air tracks. Saab's product page today gives "up to 400 km";
#Shephard (Dec 2020): up to 400 km air surveillance, up to 280 km for tracking air targets, 100 km mortar detection.
#Layout taken from swe_giraffe_amb_land (UndE 23, rotating search radar with datalink).
#Gain / PeakPower set on the same basis as swe_giraffe8a_land (Gain 47.5, 2800 kW, S-band = about 390 km vs a 10 m2 fighter;
#range goes with (PeakPower x Gain^2 x RCS)^1/4): about 280 km vs a fighter (10 m2), 160 km vs 1 m2, 90 km vs 0.1 m2.
#Brochure coverage chart, measured (spec audit 14 Nov 2026): fighter about 205 km, small fighter about 155 km, small UAS about 88 km,
#coverage drawn up to 40 km altitude. The game's RCS^1/4 law fits small fighter = 1 m2 and small UAS = 0.1 m2 (and fighter = 3 m2);
#a 10 m2 target is then seen further than the chart's fighter line. Kept that way (Thomas, 14 Nov). +1 dB Gain = about +12 % range.
Kind=Radar
Type=Search                        // Classes can be "Search", "Targeting"
HasDataLink=True                   // shares tracks with the group - IRIS-T SLM launchers fire on these tracks
Role=AirAndSurface                 // brochure: air and sea surveillance
Mode=Illuminate                    // Can be "Illuminate", "RadioCommand"
RotationDirection=1                // -1 means left, 1 means right
TargetChannels=1000                // brochure: > 1000 tracks (UndE 23: 800)
WeaponChannels=0                   // surveillance radar, does not guide missiles (IRIS-T SLM is set up fire-and-forget)
RPM=60                             // brochure: 30 or 60 rpm; Saab: revisit time a little over one second
ViewArcs=-181,181|-5,70            // 360 deg, elevation coverage up to 70 deg
MinRange=0.5                       // min range in km
MaxRange=400.0                     // instrumented range in km (Saab product page; 2014 brochure: 280)
MinAltitude=0                      // min altitude in meters
MaxAltitude=40000                  // brochure coverage chart is drawn up to 40 km
RangeResolution=10.0               // in meters; not published - estimate (UndE 23: 2, Giraffe 8A: 30)
BeamWidth=3.0                      // about 70 x wavelength / 2.3 m antenna width at S-band
SubClutterVisibility=53            // modern AESA pulse-Doppler (UndE 23: 47, Giraffe 8A: 55) - estimate
Gain=47.0                          // see note above
Frequency=S-Band                   // 2-4 GHz (E/F)
PeakPower=1000.0                   // game value in kW, see note above
JamResistance=0.95                 // 0-1, taken off a jammer's effect on this radar (stock radars: 0; 1.0 = jammers have no effect).
#                                     AESA with digital beam forming; no published figure - gameplay value. Tests 15 Nov 2026: 1.00 confirmed
#                                     in game (no range loss with two jamming JAS 39E); 0.95 itself not measured, estimated burn-through about 8 nm.
ModuleType=MediumSensor
FCSolutionGainRate=1.75
FCMinSolution=0.65
FCTracksRounds=False

[swe_giraffe4a_rotor] # cosmetic - only turns the visible antenna; the working radar sits on a dummy mount at the antenna centre
Kind=Radar
Type=Search
HasDataLink=False
Role=AirAndSurface
Mode=Illuminate
RotationDirection=1
TargetChannels=1
WeaponChannels=0
RPM=60                             // same speed as the working radar
ViewArcs=-181,181|-2,30
MinRange=0.01
MaxRange=0.05                      // 50 m - detects nothing useful
MinAltitude=0
MaxAltitude=10
RangeResolution=25.0
BeamWidth=3.0
SubClutterVisibility=0
Gain=1.0
Frequency=S-Band
PeakPower=0.001
ModuleType=MediumSensor
FCSolutionGainRate=1.5
FCMinSolution=0.6
FCTracksRounds=False
