# ------------------ SAM ------------------
rfn_9m96=9M96,,SAM,The 9M96 missile can hit airborne targets at ranges of up to 50 kilometers and flying at 20,000 meters of altitude.
rfn_9m96dm=9M96DM,,SAM,The 9M96DM missile can hit airborne targets at ranges of up to 150 kilometers and flying at 30,000 meters of altitude.
rfn_40n6=40N6,S-400,SAM,The 40N6 missile can hit airborne targets at ranges of up to 380 kilometers and flying at 30,000 meters of altitude
rfn_9m100=9M100,,SAM,A short-range CIWS-class missile
rfn_9m311=9M311,Kortik,SAM,The 9M311 is the naval version of the SA-19 Grison (2K22 Tunguska/9M311) mounted to the Kortik CIWS combined weapon system. This missile is agile, fast, and accurate all the way down to sea level, and maintains good effectiveness against maneuvering sea-skimming targets like Harpoon, at the cost of being extremely lightweight and short ranged. A proper point-defense interceptor.
rfn_9m311m=9M311M,Kortik-M,SAM,The 9M311M is the naval version of the SA-19 Grison (2K22 Tunguska/9M311) mounted to the Kortik CIWS combined weapon system. This missile is agile, fast, and accurate all the way down to sea level, and maintains good effectiveness against maneuvering sea-skimming targets like Harpoon, at the cost of being extremely lightweight and short ranged. A proper point-defense interceptor. The M upgrade improves range as well interception ability.
rfn_9m336=9M336,Verba,SAM,Verba short range IR missile
rfn_9m337=9M337,Sosna-R,SAM,Sosna-R 
rfn_9m317m=9M317M,Shtil-1,SAM,The 9M317M missile can hit airborne targets at ranges of up to 70 kilometers and flying at 35,000 meters of altitude.
rfn_48n6m=48N6M,S-300FM-1,SAM,The SA-N-20 Gargoyle (S-300FM1) is the naval version of the SA-21 (S-400) land-based surface-to-air missile system. This powerful long-range system is fitted in Soviet missile-cruiser classes, and offers performance comparable to that of the SM-2ER. Improved low-altitude performance, improved range, and a higher top speed to boot, a true air defense missile system.
# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------
rfn_3m24=KH-35 Uran,ss-n-25,ASM,The Kh-35 is a subsonic, long range, sea-skimming anti-ship missile. It features a solid fuel booster, a turbojet powerplant, a high-precision radio-altimeter, and an active radar guidance system in the terminal phase of the flight. The Kh-35 is the Soviet counterpart to the US Harpoon missile.
rfn_3m24ud=KH-35U Uran,ss-n-25,ASM,The Kh-35 is a subsonic, long range, sea-skimming anti-ship missile. It features a solid fuel booster, a turbojet powerplant, a high-precision radio-altimeter, and an active radar guidance system in the terminal phase of the flight. The Kh-35 is the Soviet counterpart to the US Harpoon missile. The Kh-35U features an improved propulsion system which doubles the effective range of the cruise missile from 130 km to up to 260 km.
rfn_3m54=3M54,Kalibr ss-n-27,ASM,Kalibr anti-ship cruise missile with supersonic terminal speed
rfn_3m55=3M55,Oniks-m ss-n-26,ASM,Oniks-m supersonic anti-ship cruise missile
rfn_3m22=3M22,Zirkon ss-n-33,ASM,Zircon hypersonic missile

