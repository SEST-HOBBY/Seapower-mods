#---------- Surface ships ----------]
#---Air/Air&Surface---
rfn_5p26=Pozitiv-M1|The Pozitiv-M1, also known as 5P-26, is a X-band 3D multi-beam air and surface search radar that can detect targets at a distance of up to 150 kilometers flying at altitude of up to 30,000 meters. The radar is able to track between three and five targets simultaneously. It can detect a fighter sized target at 110 kilometers and an anti-ship missile flying at 15 meters of altitude at ranges of 15 kilometers.
rfn_5p26m=Positiv M-1.2|The Positiv M-1.2, is a X-band 3D multi-beam air and surface search radar that can detect targets at a distance of up to 80 kilometers flying at altitude of up to 20,000 meters. The radar is able to track up to 40 targets simultaneously. It can detect a fighter sized target at 50 kilometers and an anti-ship missile flying at 15 meters of altitude at ranges of 15 kilometers. It Normally is paired with 3K87 Kortik, 3K89 PALASH/PALMA, and Pantsir-M as their search radar.
rfn_5p27m=Furke 2|The 5P-27M Furke-2, is an air and surface search radar provided to the Russian Navy Project 20380 class corvettes since 2006. The rotary radar antenna is mounted at the highest spot on the bow mast and is protected by a dome.
rfn_5p27=Furke 4|The 5P-27 Furke-4, is an air and surface search radar provided to the Russian Navy Project 22350 class frigates since 2018
rfn_mr750=Fregat MA radar|The Fregat MA radar system is intended for small displacement ships. It is an E-band single channel radar with a maximum instrumented range of 300 kilometers and a maximum vertical detection range of 30 km. Fregat MA can detect a fighter aircraft at a maximum range of 125 km or a missile at a maximum range of 27 km.
rfn_mr760=Fregat M2M radar|Fregat M2M, The Fregat M2M radar system is intended for medium and large displacement ships. It is an E-band two-channel radar with a maximum instrumented range of 300 kilometers and a maximum vertical detection range of 30 km. Fregat M2M can detect a fighter aircraft at a maximum range of 230 km and/or a missile at a maximum range of 50 km.
rfn_mf_rlk=MF RLK Zaslon|Zaslon is a state-of-the-art, multi-functional active phased array (AESA) radar developed for the Project 20385 and 20386 class corvettes. The radar is intended to provide surface and air surveillance, target detection, target tracking and fire control including target designation and control of shipboard gun mounts. This is the Active Search Radar Component.
rfn_5p20k-a=Monument-A|The 5P-20K-A Monument-A, is a single-face active phased array radar developed for the Russian Navy's Project 20380 class corvettes as part of the Poliment-Redut air defense system. The 5P-20K-A active phased array system serves as the fire control radar guiding the surface-to-air missiles to their intended targets. This is the Active Search Radar Mode.
rfn_5p20k=5P20K Poliment|The 5P-20K, also known as Poliment, is a four-faced active phased array radar developed for the Russian Navy's Project 22350 class frigates as part of the Poliment-Redut air defense system. The 5P-20K radar system supports searching of airborne targets, tracking and fire control functions guiding the surface-to-air missiles to their intended targets. Compared with the 5P-20K-A, this new variant has a greater area and can handle a higher number of surface and air targets simultaneously. This is the Active Search Radar Mode.

rfn_mr350=MR-350|MR-350 Podkat specialized radar for detecting low-flying targets


