#SAM
rfn_mf_rlk_FCR=MF RLK Zaslon FCR|Zaslon is a state-of-the-art, multi-functional active phased array (AESA) radar developed for the Project 20385 and 20386 class corvettes. The radar is intended to provide surface and air surveillance, target detection, target tracking and fire control including target designation and control of shipboard gun mounts. This is the Fire Control Radar Component.
rfn_5p20k-a_FCR=5P20K-A Monument-A FCR|The 5P-20K-A Monument-A, is a single-face active phased array radar developed for the Russian Navy's Project 20380 class corvettes as part of the Poliment-Redut air defense system. The 5P-20K-A active phased array system serves as the fire control radar guiding the surface-to-air missiles to their intended targets. This is the Fire Control Radar Mode.
rfn_5p20k_FCR=5P20K Poliment FCR|5P-20K Poliment FCR, is a four-faced active phased array radar developed for the Russian Navy's Project 22350 class frigates as part of the Poliment-Redut air defense system. This is the Fire Control Radar of the system.
rfn_30n6e2=30N6E2|30N6E2 (NATO Reporting name: Tomb Stone) is a fire control radar for the S-300PMU-2/S-300FM SAM systems.  It can track up to 24 targets in some configurations, though its primary engagement limit is six and engage them with up to 2 missiles each at 300km.
rfn_92n6e=92N6E|92N6E (NATO Reporting name: Grave Stone) is a multi-role fire control radar intended to provide missile guidance for the S-400 missile system. It enables the S-400 air defense system to engage up to 36 targets simultaneously at 400km.
rfn_3r90m=3R90M Ezh|3R90M "Ezh" (NATO Reporting name: Front Dome B)is a fire control radar for the SA-N-12 area defence SAM system. It relies on the MR-750 Top Steer for target acquisition, and Front Dome handles the tracking and engagement. Each director can engage two targets with one missile each, and allows for timesharing illuminators like NATO SM-2 warships.


#ASM
rfn_34k1_FCR=34K1 Monolit FCR|"Monolit" (NATO Reporting name: Band Stand) is an over-the-horizon fire control radar.  This is the System's Fire Control Radar mode.


#Guns
rfn_5p10=5P10 Puma|T5P-10, also known as Puma, is an advanced fire control radar designed to support naval artillery cannons ranging from 30mm to 130mm caliber.
rfn_mr123-02=MR-123-02 Vympel-M|MR123-02 is a updated fire control radar designed to support naval artillery cannons ranging from 30mm to 100mm caliber. It features radar, television, and laser tracking to engage aerial targets.  Provides high-jamming immunity, automated tracking, and can control two guns simultaneously.


#CIWS
rfn_3r87=3R87 Kortik|3R87 "Kortik" (NATO Reporting name: Hot Flash) is a fire control radar for the Kortik CADS-N-1 point defence weapon system.
rfn_3r87m=3R87M Kortik|3R87M "Kortik-M" (NATO Reporting name: Hot Flash) is a fire control radar for the Kortik-M point defence weapon system. Has Improved range.
rfn_3r89=3R89 Palash/Palma|3R89 "Palash/Palma" is the Electronic Optical Fire Control System for the Palash and Palma point defence weapon systems.


