#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# 91r1
Type=Missile                             // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW

Mass=2150                              // in kg. Used for aircraft
AmmoPoints=3000                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
[WarheadData]
#No need to specify anything since its warhead is never used

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=4.5         // time in seconds where the missile moves straight on without guiding
DropDuration=10.0                       // time in seconds where the missile just falls unpropelled
PerformsSlightBallisticInitialFlight=True
#======================================== Flight Profile ===========================================================
# Flight profile for ASROK type is hardcoded
# sure

#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=30                      // Climb angle for initial loft
MaxLoftAlt=5000.0                      // in feet. Maximum altitude for lofting
MaxLoftVelocity=1670
LoftToSkim=True
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=50.0                    // height in feet for sea skimming
SeaSkimmingSubAlt=2000                 // height in feet for sea skimming while using submunition
SeaSkimmingMaxDescentAngle=60.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=0.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=100     // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=2000.0             // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=40.0
FinalFlightPhaseDistToTarget=8.1       // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=6.0              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
SupportsBanking=True                   // if the missile will bank when turning
#TerminalDiveDistance=1


#========================================= Launch stats ============================================================
MaxVelocity=1670.0                      // Maximum speed in knots
VelocityBleed=0.45
AccelerationTime=4
Acceleration=7.0                      // Acceleration factor
MaxTurnRate=20                       // Maximum turnrate in degrees per second
MinLaunchRange=2.7                     // Minimum launch range in nautical miles
MaxLaunchRange=27                     // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=0.0                // Circular error radius in meter
#Homing
#ECCM
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=6.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
[Models]
############################################################
# AssetBundle related
############################################################
# TODO
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/ammunition/91r1/
ResourcesRoot=91r1.obj
ResourcesMesh=91r1
ResourcesMaterial=91r1_mat.ini
ResourcesMeshForLaunch=91r1launch
ResourcesMeshCanister=91r1launch
ResourcesMeshSwitchTime=4.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

# optional entry below, allows to switch to a second type of ammunition
# e.g. used for ASROC where a MK46 torpedo is spawned
[Submunition]
Ammunition=rfn_mpt1m
Offset=0,0,0.0    // offset of submunition to have it perfectly aligned with the "host"
SpawnTime=3

# References to the launchers are just used for positioning relative to the launcher of the missile
[Launchers]
NumberOfLaunchers=3
Launcher1=MK10
Launcher2=MK26
Launcher3=MK13

[MK10]
LoadedPosition=0,0,0.005
UnloadedPosition=0,0,-0.09
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[MK26]
LoadedPosition=0,0,0.02
UnloadedPosition=0,0,-0.07
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[MK13]
LoadedPosition=0,0,0.02
UnloadedPosition=0,0,-0.07
LoadedRotation=0,0,0
UnloadedRotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/s-300_effect
BoosterEffectPosition=0,0,-0.052552
InFlightEffect=
InFlightEffectPosition=0,0,0
InFlightEffectStartTime=4
UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.022
HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.003
Rotation=0,0,0
Scale=0.005,0.005,0.045