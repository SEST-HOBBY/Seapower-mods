#=========================================================================================================================================================
#                                                 kh35
#=========================================================================================================================================================
[General]
# kh35 ss-n-25 «Harpoonski»
Type=Missile
TargetType=ASuW

Mass=670                              
AmmoPoints=1725                       

CIWSDefenceBonus=30                     // added chance to evade CIWS compounded by below factors
MissileDefenceBonus=0.10                // added chance to evade missile compounded by below factors
#weaving terminal maneuver

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard

[SensorData]
VisualIdentificationRange=4
IRSignature=Small
RCS=VerySmall
TransientRCS=Meager
TransientVisualIdentificationRange=15
TransientBaseNoise=220

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=0
Power=45
ImpactSize=Medium
Penetration=Always

[---------- Guidance ----------]
[Guidance]
GuidanceType=3
MidCourseCorrection=0                 
InitialFlightPhaseDuration=1
PerformsSlightBallisticInitialFlight=True

# flight phase 1: loft
MaxLoftAngle=50.0
MaxLoftAlt=3000.0              # feet

# flight phase 2: sea skimming
SeaSkimmingAlt=32.0
SeaSkimmingMaxDescentAngle=45.0
SeaSkimmingNoseUp=2.0
SeaSkimmingStartDistToTarget=150

# flight phase 3: (optional terminal popup) -- enabled
FinalFlightPhaseAlt=13                 
FinalFlightPhaseMaxAngle=15.0
FinalFlightPhaseDistToTarget=17.0     

# flight phase 4: terminal approach
TerminalApproachDist=8.0              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalAlt=10
SupportsBanking=True                  // if the missile will bank when turning

# Launch stats
MaxVelocity=560.0                      // Maximum speed in knots
Acceleration=6.0                       // Acceleration factor
MaxTurnRate=20.0                       // Maximum turnrate in degrees per second
MinLaunchRange=3.0                     // Minimum launch range in nautical miles
MaxLaunchRange=70.0                    // Maximum launch range in nautical miles
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)

# Seeker (Active Radar)
SeekerGain=50.0
SeekerFOV=90,30
SeekerActiveRange=10.7
SeekerPassiveRange=10.7
Frequency=X-Band  
PeakPower=30.0 
AntiCountermeasuresBonus=0.55
AntiJammerBonus=0.5
SelfDestructDelay=5.0

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/ammunition/kh35/
ResourcesRoot=kh35.obj
ResourcesMesh=kh35
ResourcesMaterialFolder=assets/ammunition/kh35/
ResourcesMaterial=kh35_mat.ini
#ResourcesMeshForLaunch=usn_rim-66c_dummy
#ResourcesMeshForLaunch=usn_rim-66c_dummy
ResourcesMeshSwitchTime=0.0 // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=effects/weapons/emitters/usn_rgm_84_booster
BoosterEffectPosition=0,0,0


InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.035
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=LargeWaterSplashes

DebrisTrail=effects/aircraft/emitters/helicopterfireeffect
HitWaterSplashClass=LargeWaterSplashes
ExplosionOverwaterSplash=False

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
#creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.02
