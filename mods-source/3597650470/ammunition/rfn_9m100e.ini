[General]
#9m100
Type=Missile                          // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                        // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=ShoreTargetsOnly  // can be  All, Installation, Mobile, ShoreTargetsOnly
RequiresWarmUp=False                   //False - removes need to reload launcher before first launch

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=2  // at what range in nm this unit can be visually identified
IRSignature=Tiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=11.3
ImpactSize=Small                      // Impact size, can be small, medium, large, verylarge
Penetration=Always                    // can be minor, moderate, heavy, always

FuzeProximityDistance=6.0             // for proximity fuze: distance to target in yard
KillProbability=0.95                  //Chance to intercept missile
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
Retargetable=False
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=25.0                      // Climb angle for initial loft
MaxLoftAlt=2000                        // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
#Radio-command SAM are going into Terminal stage immediately, so all previous stages are not needed
TerminalApproachDist=9.3               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#TerminalLoft=True
#========================================= Launch stats ============================================================
MaxVelocity=2150                       // Maximum speed in knots
VelocityBleed=0.55                     // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
AccelerationTime=5.0                   // Time until start of the velocity bleed, in seconds
Acceleration=20.0                      // Acceleration factor
SustainerAcceleration=15.0             // Acceleration of sustainer burn. -1 if there is no sustainer
SustainerAccelerationTime=5.0          // Time of sustainer burn. -1 if there is no sustainer burn
MaxTurnG=60                            // Maximum G-limit of missile turns
MaxTurnRate=90.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=360  
MinLaunchRange=0.5                     // Minimum launch range in nautical miles
MaxLaunchRange=9.32                    // Maximum launch range in nautical miles
MinAttackAltitude=0                    // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=27000                // Maximum altitude of target, in feet
LaunchReliability=98
#========================================     Seeker     ===========================================================
SeekerFOV=5.0                          // Seeker field-of-view in degrees
SeekerGimbalFOV=120                    // Seeker gimbal FOV in degrees
IsRearAspectOnly=False                 //Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=120                     //Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerPassiveRange=12.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#ECCM
AntiCountermeasuresBonus=0.85          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=1.0                    // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=2.0 

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
ResourcesFolder=assets/ammunition/9m100/
ResourcesRoot=9m100.obj
ResourcesMesh=9m100
ResourcesMeshForLaunch=9m100
ResourcesMaterialFolder=assets/ammunition/9m100/
ResourcesMaterial=9m100_mat.ini
#ResourcesMeshForLaunch=usn_rim-66c_dummy
#ResourcesMeshForLaunch=usn_rim-66c_dummy
ResourcesMeshSwitchTime=1.0  // time in seconds after launch to switch from launch mesh to main mesh

NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_small_effect
BoosterEffectPosition=0,0,-0.020306

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.015
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043
