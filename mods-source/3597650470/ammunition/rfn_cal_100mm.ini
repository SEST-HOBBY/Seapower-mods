[General]
Type=Projectile                   // can be Projectile, Missile, Torpedo
TargetType=AAW                    // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=16                                // in kg. Used for aircraft
AmmoPoints=16                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts             // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts    // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=880                // meter per second
MaxRange=21000                    // in meters
CircularErrorProbable=70         // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=4
ImpactSize=Small                  // Impact size, can be small, medium, large, verylarge
Penetration=Minor                 // can be minor, moderate, heavy, always
FuzeProximityDistance=15
KillProbability=0.06             // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_medium_shell
HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_small	//Bomb_hit_object_small
HitGroundExplosionClass=SmallGroundHitExplosions
