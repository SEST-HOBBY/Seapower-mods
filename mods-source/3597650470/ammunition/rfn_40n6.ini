#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# 40n6e
# Users: wp_rkr_andropov
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=ShoreTargetsOnly // can be  All, Installation, Mobile, ShoreTargetsOnly
RequiresWarmUp=False  //False - removes need to reload launcher before first launch

Mass=1800                              // in kg. Used for aircraft
AmmoPoints=5400                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

CIWSDefenceBonus=50                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.25                     // Less chance to be intercepted by SAM because of anti-interception maneuvers
#hypersonic SAM

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=34
ImpactSize=SemiSmall                        // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                    // can be minor, moderate, heavy, always

FuzeProximityDistance=25.0              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.97                     //Chance to intercept missile
InterceptOutOfAltitudePenalty=0.15                  
InterceptSpeedPenaltyMultiplier=0.3                  
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
Retargetable=False
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=35.0                      // Climb angle for initial loft
MaxLoftAlt=100000.0                    // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
#Radio-command SAM are going into Terminal stage immediately, so all previous stages are not needed
TerminalApproachDist=40.0              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
TerminalDiveDistance=30.0              // in N. miles.
TerminalAlt=10000                      // in feet. Weapon will try to get to this altitude at the start of terminal approach
IgnoreHeightDifferenceForTargetDist=True  // useful for height loft alt missiles to ignore the height for distance calculation
LocalTerminalOnly=False                // if true connection with a guiding radar will be severed upon entering terminal approach stage
#=========================================  Kinematics  ============================================================
#TerminalLoft=True
#========================================= Launch stats ============================================================
MaxVelocity=6001                       // Maximum speed in knots
VelocityBleed=0.8                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
Acceleration=20.0                      // Acceleration factor
AccelerationTime=3.0                   // Burn time for initial booster burn
SustainerAcceleration=20.0             // Acceleration of sustainer burn. -1 if there is no sustainer
SustainerAccelerationTime=10           // Time of sustainer burn. -1 if there is no sustainer burn
MaxTurnRate=25.0                       // Maximum turnrate in degrees per second
MaxTurnG=25                            // Maximum G-limit of missile turns
LaunchTurnRate=50.0                    // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
MinLaunchRange=3.0                     // Minimum launch range in nautical miles
MaxLaunchRange=216.0                   // Maximum launch range in nautical miles
MinAttackAltitude=33                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=606955               // Maximum altitude of target, in feet
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#CircularErrorRadius=2.5
#Homing
SeekerGain=80.0                         // Seeker gain in dB
SeekerFOV=90.0                          // Seeker field-of-view in degrees
SeekerGimbalFOV=180                     // Seeker gimbal FOV in degrees
SecondaryPassiveRadarGuidanceType=HomeOnJam
PassiveRadarGuidanceFrequencies=All
SeekerActiveRange=90.0
SeekerPassiveRange=90.0
Frequency=X-Band
PeakPower=50.0
TargetMemory=True
#ECCM
AntiCountermeasuresBonus=0.80          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.80                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=2.0               // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/ammunition/40n6/
ResourcesRoot=40n6.obj
ResourcesMesh=40n6
ResourcesMaterialFolder=assets/ammunition/40n6/
ResourcesMaterial=40n6_mat.ini
ResourcesMeshForLaunch=40n6launch
ResourcesMeshSwitchTime=0.6  // time in seconds after launch to switch from launch mesh to main mesh

############################################################

NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/s-300_effect
BoosterEffectPosition=0,0,-0.06
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.06
InFlightEffectStartTime=1.5  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_large_effect
SustainerEffectPosition=0,0,-0.045
SustainerEffectStartTime=1.5

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=LargeWaterSplashes


[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043