[General]
Type=Projectile                   // can be Projectile, Missile, Torpedo
TargetType=ASuW                   // can be AAW, ASuW, ASW
SecondaryTargetType=AAW

Mass=33.4                                // in kg. Used for aircraft
AmmoPoints=33.4                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts             // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts    // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=880                // meter per second
MaxRange=25540                    // in meters
CircularErrorProbable=30          // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=6
ImpactSize=SemiSmall              // Impact size, can be small, medium, large, verylarge
Penetration=Moderate              // can be minor, moderate, heavy, always
FuzeProximityDistance=18
KillProbability=0.07              // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_medium_shell
HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_small	//Bomb_hit_object_small
HitGroundExplosionClass=SmallGroundHitExplosions
