[General]
# 9m96e2-1
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=ShoreTargetsOnly  // can be  All, Installation, Mobile, ShoreTargetsOnly

CIWSDefenceBonus=30                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.2                     // Less chance to be intercepted by SAM because of anti-interception maneuvers

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Tiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=21
ImpactSize=Small                       // Impact size, can be small, medium, large, verylarge
Penetration=Moderate                     // can be minor, moderate, heavy, always

FuzeProximityDistance=8.0             // for proximity fuze: distance to target in yard
KillProbability=0.95                     //Chance to intercept missile
InterceptOutOfAltitudePenalty=0.15                
InterceptSpeedPenaltyMultiplier=0.3         
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
    #RequiresIllumination=true
MidCourseCorrection=1
InitialFlightPhaseDuration=1.0
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=60.0
MaxLoftAlt=75000.0
MaxLoftVelocity=4082                // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=12              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
TerminalDiveDistance=12                 // in N. miles.
LocalTerminalOnly=False   
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#========================================= Launch stats ============================================================
MaxVelocity=4082
VelocityBleed=0.55
Acceleration=23.0
AccelerationTime=20.0
MaxTurnRate=45.0
LaunchTurnRate=120
MinLaunchRange=2.5                     // Minimum launch range in nautical miles
MaxLaunchRange=93                    // Maximum launch range in nautical miles
MinAttackAltitude=15                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=98425              // Maximum altitude of target, in feet
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=2.5
#Homing
SeekerGain=60.0                         // Seeker gain in dB
SeekerFOV=60.0
SeekerGimbalFOV=120 
SecondaryPassiveRadarGuidanceType=HomeOnJam
PassiveRadarGuidanceFrequencies=All
SeekerActiveRange=12.0
SeekerPassiveRange=12.0
Frequency=X-Band 
PeakPower=20.0  
TargetMemory=True 
#ECCM
AntiCountermeasuresBonus=0.65          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.70                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=2.0

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/ammunition/9m96md/
ResourcesRoot=9m96md.obj
ResourcesMesh=9m96md
ResourcesMaterialFolder=assets/ammunition/9m96md/
ResourcesMaterial=9m96md_mat.ini
ResourcesMeshForLaunch=9m96mdlaunch
ResourcesMeshSwitchTime=1.0  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
Rotation=0,0,0
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/s-300_effect
BoosterEffectPosition=0,0,-0.022			///-0.022

InFlightEffectClass=DefaultMissileInflightEffect
BoosterEffectPosition=0,0,-0.022			///-0.022
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.05
