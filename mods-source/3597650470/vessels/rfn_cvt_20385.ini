[General]
UnitType=Vessel
DefaultCameraDistance=2.0
MinCameraDistanceForeAft=1.3
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.18

Length=106.3                    // in meters
Beam=13                       // in meters

CompartmentsHeight=0.05       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None
NumberOfDCTeams=2

[---------- FlightDeck Definitions ----------]
[AirGroup]
wp_ka-27=Default,1

[FlightDeck]
AircraftCapacity=1
NumberOfElevators=1
NumberOfLaunchPoints=1
NumberOfRecoveryPoints=1
NumberOfTaxiPaths=2
AircraftSupported=wp_ka-27
LaunchDelay=6


HoldStackSeparation=200 //In feet
HoldSpeed=200           //In knots. Landing is permitted once speed was lower than this

SystemGroup=SG_Hangar
Collider=hangar_coll

[Elevator1]
AssociatedLaunchPoints=1

HangarOpenAnimation=HangarOpenAnim
HangarCloseAnimation=HangarCloseAnim

SpawnPosition=0,0.056936,-0.3
RidePosition=0,0.056936,-0.3

SingleVehicle=True
CloseDoorsAfterTaxi=True
RequiresFreeLaunchpoint=True

[LaunchPoint1]
AllowedType=Helicopter
Position=0,0.056,-0.67

[RecoveryPoint1]    
AllowedType=Helicopter
AssociatedElevators=1
Position=0,0.056,-0.67
Rotation=0    // in degrees
CircuitWaypoints=0,100,-0.4

[TaxiPath1]
From=Elevator1
To=LaunchPoint1
IsBackwards=True
Waypoints=0,0.056,-0.67|0,0.056,-0.67

[TaxiPath2]
From=RecoveryPoint1
To=Elevator1
Waypoints=0,0.056,-0.67|0,0.056,-0.67


[Physics]
#all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=2430             // in tons

MaxForwardVelocity=27        // sets the max forward velocity
MaxBackwardVelocity=7        // sets the max backward velocity
LinearDrag=0.98                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=6             // turn rate of the rudder in degrees per second
RudderForce=0.6                // multiplicator defining how agile the ship can turn

TiltFactor=2.0                 // defines how strong the tilting will be
PitchFactor=1.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-1.0                  // default trim depth in feets
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.03,0          // center of mass for physics

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=8.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium
# Sonar related
BaseNoise=120                    // base sound level in db at 1m distance
FlowNoise=1                      // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5                // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

############################################################
