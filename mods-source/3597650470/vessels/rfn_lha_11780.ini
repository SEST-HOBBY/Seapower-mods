[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=2.7
MinCameraDistanceBroadside=0.9
CameraPivotHeight=0.25

Length=230                     // in meters
Beam=43                      // in meters

CompartmentsHeight=0.05       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None
NumberOfDCTeams=2


[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=29000              // in tons

MaxForwardVelocity=30.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.991                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.5
MinAccelerationFactor=0.1

RudderTurnRate=1.5             // turn rate of the rudder in degrees per second
RudderForce=0.35                // multiplicator defining how agile the ship can turn

TiltFactor=5.0                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.03,0          // center of mass for physics

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=9.0   // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium
# Sonar related
BaseNoise=170                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_11780

[---------- AI related ----------]
[AI]
UnitCostValue=5000            // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=6
ASuW_Capability=1
ASW_Capability=3

#Defence
MissilesToSaturate=12      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=2     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD    //Anti-Missile Defence
ATD_Capability=TBD      //Anti-Torpedo Defence

#Special
Role=ASW

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
Collider=ss1coll
ModuleType=CIC

[MainPowerSystem]
############################################################
# Main Power System (engine room, boiler, reactor)
############################################################
Type=GasTurbine
HorsePower=65400
Collider=coll_engineroom

[PropulsionSystems]
