[AmmunitionNames]
js_type23_asam=23式舰空导弹,中SAM改,面对空,23式舰空导弹（原称A-SAM）是日本海上自卫队以03式中程地空导弹改进型为基础发展的舰载防空导弹，由Mk 41垂直发射系统发射。其可分离助推器借鉴07式垂直发射反潜火箭技术以增加射程，中段采用数据链制导，末段采用主动雷达寻的。
js_type17_ssm2=17式舰舰导弹,SSM-2,反水面,17式舰舰导弹是日本海上自卫队的舰载隐身反舰巡航导弹，由甲板发射箱借助可分离助推器发射。其多面体低可探测弹体在发射后展开弹翼，以掠海高度巡航，末段由主动雷达导引头完成攻击。
js_type07_asroc=07式垂直发射反潜火箭,07式VLA,反潜火箭,07式垂直发射反潜火箭是日本海上自卫队从Mk 41垂直发射系统发射的反潜火箭，携带12式鱼雷飞抵目标海域。
js_type12_asroc=12式鱼雷,12式,鱼雷,12式鱼雷是日本海上自卫队的324毫米轻型反潜鱼雷，作为07式VLA的战斗部。
js_type12_ship=12式鱼雷,12式,鱼雷,12式鱼雷是日本海上自卫队的324毫米轻型反潜鱼雷，此处由舰上的HOS-303三联装鱼雷发射管发射。
mu_cal_30mm_mk266=30毫米高爆燃烧曳光弹
