DefaultDescription=新型FFM（06FFM）是日本海上自卫队继最上级（30FFM）之后的护卫舰。舰长142米，标准排水量4880吨，舰体具有低可探测性，装有集成改进型OPY-2多功能雷达的一体化桅杆、32单元Mk41垂直发射系统、一门127毫米舰炮、SeaRAM近防导弹系统、反舰导弹发射装置、鱼雷发射管以及可容纳一架直升机的机库。日本计划建造12艘；2025年澳大利亚为其通用护卫舰项目选定了该设计。
