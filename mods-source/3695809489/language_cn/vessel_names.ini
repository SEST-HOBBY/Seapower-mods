[jmsdf_cg_asev]
Type=CG,导弹巡洋舰
Default=宙斯盾系统搭载舰,ASEV
DefaultDescription=宙斯盾系统搭载舰（ASEV）是日本为取代已取消的陆基宙斯盾而订购的两艘大型宙斯盾舰。舰长约190米，宽25米，标准排水量12000吨，在四面金字塔形上层建筑上装有SPY-7(V)1雷达，配备128单元Mk41垂直发射系统（可装填标准3 IIA型、标准6和标准2导弹）、一门127毫米舰炮、两座密集阵近防炮、两门30毫米机炮和一架直升机，计划于2028年和2029年服役。
Variant1=宙斯盾系统搭载舰1号舰（CG-191）,ASEV-1
Variant2=宙斯盾系统搭载舰2号舰（CG-192）,ASEV-2

[jmsdf_ffg_mogami]
Type=FFG,护卫舰
Default=最上级,最上
DefaultDescription=最上级（30FFM）是日本海上自卫队的多用途护卫舰。舰长133米，舰体紧凑且具有低可探测性，装有集成OPY-2多功能雷达的一体化桅杆、一门127毫米舰炮、SeaRAM近防导弹系统、两座四联装17式反舰导弹发射装置、Mk41垂直发射系统、鱼雷发射管、可容纳一架直升机的机库以及反水雷装备，舰员约90人。
