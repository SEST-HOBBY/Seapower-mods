[SystemNames]

#---------------------------------------- Dipping Sonar ----------------------------------------

HQS-103=HQS-103|The HQS-103 is a helicopter-borne, medium-frequency, active/passive dipping sonar used to locate, identify, and track submarines. 

HQS-104=HQS-104|The HQS-104 Airborne Low Frequency Sonar (ALFS) is a helicopter-borne, low-frequency, active/passive dipping sonar used to locate, identify, and track submarines. 

#-------------------------------------- Sonobuoys --------------------------------------

OPY-2=OPY-2|The OPY-2 is the X-band multi-function radar of the JMSDF's Mogami-class frigates, combining air and surface search with missile fire control in the ship's integrated mast.
OPY-2_FCR=OPY-2 FCR|The fire-control channels of the OPY-2 multi-function radar, providing midcourse and terminal guidance for ship-launched missiles.
MU_Mk46_Mod2=Mk 46 Mod 2|The Mk 46 Mod 2 Gun Weapon System is a stabilised 30 mm mount built around the Mk 44 Bushmaster II cannon, aimed by an on-mount electro-optical director.
