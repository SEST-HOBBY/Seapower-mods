[AmmunitionNames]
js_type23_asam=Type 23 Chu-SAM Kai,Chu-SAM Kai,SAM,The Type 23 ship-to-air missile (Chu-SAM Kai, formerly A-SAM) is the JMSDF's shipborne version of the Type 03 Chu-SAM Kai, fired vertically from the Mk 41 VLS. An ejectable launch booster derived from the Type 07 VL-ASROC extends its range, and a datalink provides midcourse guidance before an active radar seeker takes over for the terminal phase.
js_type17_ssm2=Type 17 SSM,Type 17,ASM,The Type 17 is the JMSDF's ship-launched stealth anti-ship cruise missile, fired from deck canisters with a jettisoned launch booster. Its faceted low-observable airframe unfolds its wings after launch and cruises at sea-skimming height before an active radar seeker takes over for the terminal attack.
js_type07_asroc=Type 07 VL-ASROC,Type 07,ASROC,The Type 07 vertical-launch anti-submarine rocket is the JMSDF's Mk 41 VLS-launched ASROC. A rocket carries a Type 12 lightweight torpedo to the target area, where the torpedo parachutes into the water and begins its search.
js_type12_asroc=Type 12 Torpedo,Type 12,Torpedo,The Type 12 is the JMSDF's 324 mm lightweight anti-submarine torpedo, carried as the warhead of the Type 07 VL-ASROC.
js_type12_ship=Type 12 Torpedo,Type 12,Torpedo,The Type 12 is the JMSDF's 324 mm lightweight anti-submarine torpedo, fired here from the ship's HOS-303 triple torpedo tubes.
mu_cal_30mm_mk266=30mm HEI-T
