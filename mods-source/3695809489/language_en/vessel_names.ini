[jmsdf_ffg_mogami_improved]
Type=FFG,Frigate
Default=Upgraded Mogami-class,New FFM
DefaultDescription=The upgraded Mogami-class (06FFM, the New FFM) follows the JMSDF's 30FFM Mogami-class: a 142 m, 4,880-ton (standard) low-signature hull with an improved OPY-2 multi-function radar on a unified mast, 32 Mk 41 VLS cells, a 5 in gun, SeaRAM, anti-ship missile launchers, torpedo tubes and a hangar for one helicopter. Twelve are planned for Japan; in 2025 Australia chose the design for its general purpose frigate programme.
