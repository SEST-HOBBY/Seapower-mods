[jmsdf_cg_asev]
Type=CG,Missile Cruiser
Default=ASEV-class,ASEV
DefaultDescription=The Aegis System Equipped Vessel (ASEV) is a pair of large Aegis ships ordered by Japan in place of the cancelled Aegis Ashore sites. About 190 m long with a 25 m beam and 12,000 t standard displacement, each carries the SPY-7(V)1 radar on a four-faced pyramid, 128 Mk 41 cells for SM-3 Block IIA, SM-6 and SM-2, a 5 in gun, two Phalanx, two 30 mm guns and a helicopter. Commissioning is planned for 2028 and 2029.
Variant1=ASEV-1 CG-191,ASEV-1
Variant2=ASEV-2 CG-192,ASEV-2

[jmsdf_ffg_mogami]
Type=FFG,Frigate
Default=Mogami-class,Mogami
DefaultDescription=The Mogami-class (30FFM) is the JMSDF's multi-mission frigate: a compact, low-signature 133 m hull with an integrated OPY-2 multi-function radar and unified mast, a 5 in gun, SeaRAM, two quad Type 17 anti-ship missile launchers, Mk 41 VLS, torpedo tubes, a hangar for one helicopter and mine-warfare equipment, run by a crew of about 90.
