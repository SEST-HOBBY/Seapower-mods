[AmmunitionNames]
js_type23_asam=23式艦対空誘導弾,中SAM改,SAM,23式艦対空誘導弾（旧称A-SAM）は、03式中距離地対空誘導弾（改善型）を基に開発された海上自衛隊の艦載型対空ミサイルで、Mk 41 VLSから垂直発射される。07式垂直発射魚雷投射ロケットの技術を応用した分離式ブースターで射程を延伸し、中間誘導はデータリンク、終末誘導はアクティブ・レーダー・ホーミングで行う。
js_type17_ssm2=17式艦対艦誘導弾,SSM-2,ASM,17式艦対艦誘導弾は海上自衛隊の艦載型ステルス対艦巡航ミサイルで、甲板上のキャニスターから分離式ブースターで発射される。多面体形状の低観測性機体は発射後に主翼を展開し、シースキミング高度を巡航したのち、終末段階はアクティブ・レーダー・シーカーで目標を攻撃する。
js_type07_asroc=07式垂直発射魚雷投射ロケット,07式VLA,ASROC,07式垂直発射魚雷投射ロケットは、Mk 41 VLSから発射される海上自衛隊の対潜ロケットで、12式魚雷を目標海域へ運ぶ。
js_type12_asroc=12式魚雷,12式,魚雷,12式魚雷は海上自衛隊の324mm短魚雷で、07式VLAの弾頭として運ばれる。
js_type12_ship=12式魚雷,12式,魚雷,12式魚雷は海上自衛隊の324mm短魚雷で、ここでは艦のHOS-303 3連装短魚雷発射管から発射される。
mu_cal_30mm_mk266=30mm HEI-T弾
