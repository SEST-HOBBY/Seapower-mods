[jmsdf_cg_asev]
Type=CG,ミサイル巡洋艦
Default=イージス・システム搭載艦,ASEV
DefaultDescription=イージス・システム搭載艦（ASEV）は、計画が中止されたイージス・アショアに代えて日本が発注した大型イージス艦2隻である。全長約190m、幅25m、基準排水量12,000トンで、四面ピラミッド型の上部構造物にSPY-7(V)1レーダーを装備し、SM-3ブロックIIA、SM-6、SM-2を運用するMk 41 VLS 128セル、127mm砲、ファランクスCIWS 2基、30mm機関砲2基、ヘリコプター1機を搭載する。2028年と2029年の就役が予定されている。
Variant1=イージス・システム搭載艦1番艦 CG-191,ASEV-1
Variant2=イージス・システム搭載艦2番艦 CG-192,ASEV-2

[jmsdf_ffg_mogami]
Type=FFG,フリゲート
Default=もがみ型,Mogami
DefaultDescription=もがみ型（30FFM）は海上自衛隊の多機能護衛艦である。全長133mのコンパクトで低被探知性の船体に、OPY-2多機能レーダーを組み込んだ統合マスト、127mm砲、SeaRAM、17式艦対艦誘導弾の4連装発射筒2基、Mk 41 VLS、魚雷発射管、ヘリコプター1機分の格納庫および対機雷戦装備を備え、乗員は約90名である。
Variant1=もがみ FFM-1,Mogami
Variant2=くまの FFM-2,Kumano
