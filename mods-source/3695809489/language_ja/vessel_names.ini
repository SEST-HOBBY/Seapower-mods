DefaultDescription=新型FFM（06FFM）は、もがみ型（30FFM）に続く海上自衛隊の護衛艦である。全長142m、基準排水量4,880トンの低被探知性の船体に、能力向上型OPY-2多機能レーダーを組み込んだ統合マスト、Mk 41 VLS 32セル、127mm砲、SeaRAM、艦対艦誘導弾発射筒、魚雷発射管、ヘリコプター1機分の格納庫を備える。日本向けに12隻が計画され、2025年にはオーストラリアが汎用フリゲート計画にこの設計を選定した。
