[OPY-2]
#Users:jmsdf_ffg_mogami
Kind=Radar
Type=DirectedSearch    // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface               // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=250      // if applicable number of targets it can track simultaneously
WeaponChannels=24      // if applicable number of weapons (missiles) it can guide simultaneously
RPM=0                  // revolutions per minute
MinRange=0.5           // min range in km
MaxRange=320.0         // max range in km
MinAltitude=10         // min altitude in meters, relevant for air, unused for surface
MaxAltitude=60960      // max altitude in meters, relevant for air, unused for surface
RangeResolution=60.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.5          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=45.0              // gain in dB on the sensor
Frequency=C-Band       // frequency band
PeakPower=2000.0       // output peak power in kW
ModuleType=BigSensor
FCSolutionGainRate=2
FCMinSolution=1
FCTracksRounds=True
