# FH-901 game adaptation for the existing Sea Power native TV missile class.
# Includes FH901_Body and the ten exported animated visual submodels.
# Numerical gameplay values below are provisional game balance, NOT verified
# real FH-901 mass, guidance, range, warhead, flight performance or reliability.
# Native reference syntax: Jiutian_Local/Mod/ammunition/JT_KD88.ini.
# No KD-88 mass, high speed, rocket smoke or large explosion is inherited.

[General]
Type=Missile
TargetType=ASuW
SecondaryTargetType=AAW
LandAttackCapability=All
CanNotAttackTypes=Missile
Mass=10
AmmoPoints=40
AirLaunched=True
DefaultCameraDistance=0.12
MinCameraDistanceForeAft=0.10
MinCameraDistanceBroadside=0.10
CameraPivotHeight=0
DecalClass=Standard

[SensorData]
VisualIdentificationRange=0.2
IRSignature=VeryTiny
RCS=VeryTiny

[WarheadData]
WarheadType=2
# Native damage points, not kilograms of explosive or TNT equivalent.
Power=5
# Native Small damage diameter is 15 m (7.5 m radius); no global damage override.
ImpactSize=Small
Penetration=Always
# Explicitly preserve the native default contact detonation, including gliding hits.
FuzeMode=Impact

[Guidance]
GuidanceType=6
MidCourseCorrection=1
SharedSensorLink=True
CompatibleGuidanceSystems=GuidancePod,GuidancePodNoAlignment
# Authored Deploy_Run: all wings/fins/blades are deployed by clip time 3.0 s;
# clip 3.0-6.0 s contains only propeller rotation. The visual clip continues
# during native guided flight, so unpowered drop is 0.6 s clearance + 3.0 s.
DropDuration=3.6
InitialFlightPhaseDuration=4
TerrainFollowFlight=False
MaxLoftAngle=60
MaxLoftAlt=Maintain
TerminalApproachDist=1.079914
TerminalAlt=100
TerminalDiveDistance=1.079914
SupportsBanking=True
LocalTerminalOnly=False
ApplyKinematics=False
MaxVelocity=155.50756
Acceleration=0.2
MaxTurnRate=25
MinLaunchRange=0.5
# Nominal sea-level lifetime envelope in nautical miles; runtime adjusts for height/time.
MaxLaunchRange=54.125270
MinLaunchAltitude=1000
MaxLaunchAltitude=50000
LaunchReliability=97
NightVisionLevel=1
Zoom=1
SeekerFOV=60
AntiCountermeasuresBonus=0.85
TargetMemory=True
# Runtime disables control/motor at 3600 s; 4200 s is a native cleanup fallback after the fall.
SelfDestructDelay=4200
MaxFlightTime=4200

[Particles]
BoosterEffect=FALSE
InFlightEffect=FALSE
HitShipExplosionClass=SmallShipHitExplosion
HitAirExplosionClass=SmallMissileExplosions
HitDefaultExplosionClass=SmallMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
# Native render units are metres/75; narrow body hit box rather than deployed wings.
Scale=0.0018,0.0018,0.01333333

; Merge into the FH901 ammunition definition's launcher list.
; Preserve any existing launchers and increment its NumberOfLaunchers.
; The example below assumes this is the only launcher.
[Launchers]
NumberOfLaunchers=1
Launcher1=JT_Hive128

[JT_Hive128]
OnRailWarmup=0

[Models]
ResourcesFolder=assets/models/ammunition/JT_FH901/
ResourcesRoot=fh901.obj
ResourcesMesh=FH901_Body
ResourcesMaterial=fh901_mat.ini
ResourcesMaterialFolder=assets/models/ammunition/JT_FH901/
NumberOfSubModels=10
SubModel1=FH901_AftWing_L
SubModel2=FH901_AftWing_R
SubModel3=FH901_Camera
