[General]
# DATA_POLICY_NO_PLACEHOLDERS
# TY-90 helicopter-launched short-range air-to-air missile
Type=Missile
TargetType=AAW
Mass=20
AirLaunched=True

DefaultCameraDistance=0.25
MinCameraDistanceForeAft=0.12
MinCameraDistanceBroadside=0.12
CameraPivotHeight=0.0
