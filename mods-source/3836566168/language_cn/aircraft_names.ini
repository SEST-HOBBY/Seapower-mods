Default=无侦-7,WZ-7
Squadron1=无侦-7 侦察型,WZ-7
DefaultDescription=无侦-7“翔龙”是中国航空工业研制的高空长航时无人侦察机。其前后机翼相连，构成辨识度很高的联翼布局，适合长时间执行监视与情报侦察任务。2021年，无侦-7以中国空军装备身份在中国航展公开亮相；同年官方报道披露了该型机开展实战化训练、快速规划航线和获取目标信息的情况。所采用的公开官方资料未确认其具体首飞日期。

[plaaf_wz-10]
Type=UAV 无人机
Default=WZ-10,WZ-10
Squadron1=WZ-10,WZ-10
DefaultDescription=无侦-10是与中国航空工业成都翼龙-10系列具有技术渊源的喷气式无人电子侦察机，采用背负式进气道和外倾双垂尾布局。2022年11月，中国空军在中国航展首次公开展示无侦-10，展板说明其主要承担敌方雷达信号侦收与定位任务。翼龙-10系列也用于气象观测，2020年8月执行过大型无人机台风探测飞行。本模组保留翼龙-10系列察打构型外形，扩展的作战挂载属于游戏虚构适配（Fictional）。

[plaaf_yl-2]
Type=UAV 无人机
Default=翼龙-2,YL-2
Squadron1=翼龙-2,YL-2
DefaultDescription=翼龙Ⅱ是中国航空工业成都飞机设计研究所研制的中空长航时察打一体无人机，采用尾置推进螺旋桨和大展弦比机翼，配备光电侦察转塔及多个翼下挂点。该型机于2016年中国航展公开亮相，2017年2月27日在中国西北地区完成首飞。翼龙Ⅱ系列面向长时间侦察监视和精确打击需求发展，也衍生出应急通信、抢险救灾等用途。本模组增设的反潜及电子战组合属于游戏虚构适配（Fictional）。

[plaaf_jiutian]
Type=UAV 无人机
Default=九天,九天
Squadron1=九天,九天
DefaultDescription=“九天”是陕西无人装备科技有限责任公司委托中国航空工业第一飞机设计研究院设计的大型模块化无人机，于2025年12月11日在陕西蒲城完成首飞。该平台采用“通用平台＋模块化任务载荷”设计，公开指标包括25米翼展、16吨最大起飞重量和6吨载荷能力，可根据任务换装载荷，用于重型物资运输、应急通信和测绘等场景。游戏内，蜂巢挂载以机腹可重复使用的发射单元携带FH-901：发射时开启对应底部小舱盖，向下弹出，离舱后展开弹翼飞行。上述释放方式及320枚容量属于游戏虚构实现（Fictional）。

