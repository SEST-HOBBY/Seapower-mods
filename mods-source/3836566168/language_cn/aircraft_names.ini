DefaultDescription=2025年9月3日北京阅兵空中无人作战方队展示了一架机身编号为53536的无尾喷气式无人机，可见两侧进气口和单个尾喷口。公开资料尚未确认其正式型号、实机内埋武器种类和数量。WJ-25 CCA为本模组使用的代号，独立顶部挂架、内置投放方式及其挂载属于游戏虚构适配（Fictional）。
