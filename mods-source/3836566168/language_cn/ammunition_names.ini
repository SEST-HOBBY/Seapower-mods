JT_FH901=FH-901,,Loitering munition,Fictional（虚构游戏设定）：折叠式小型巡飞弹，通过九天蜂巢发射系统执行侦察、目标搜索和打击；以下是本包功能设定，不是实装性能说明。挂载兼容性与性能数值仅用于Sea Power模组，不代表现实认证。 昼夜折叠巡飞弹。可指定地点发射侦察，也可手动指定攻击目标；原生电视寻的器发现接触后通过数据链回传。地图图标右键可选择离地30–300 ft或恢复自动，远程避障；锁定地面目标后末段直扑，手动高度暂停末段俯冲。取消20公里动力限制，总寿命60分钟；相对母机向下脱离10米/秒，巡飞28、浅下降滑翔最高45、动力冲刺最高80、对舰俯冲最高120米/秒。自动先利用高度接近目标，距目标2公里内进入末段；目标毁伤后回升至离地300米搜寻。失联后继续对已知敌对舰艇、地面载具和建筑均衡分配；空中目标仅手动指定；位置记忆120秒，不无条件点亮。聚能破甲；伤害5；Small；Always；触发引信。VeryTiny雷达/红外；抗诱饵0.85；仍受有效干扰和故障影响。纯蜂巢320枚，CJ-20混合100枚，64通道。以上为游戏适配。
