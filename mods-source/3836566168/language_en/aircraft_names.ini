DefaultDescription=A tailless jet bearing the number 53536 appeared in the unmanned aircraft formation at the Beijing parade on 3 September 2025. It has side intakes and a single exhaust. Its official type designation and internal weapon inventory have not been publicly confirmed. WJ-25 CCA is the designation used in this game. The individual overhead racks, internal release system and loadouts are fictional adaptations (Fictional).
