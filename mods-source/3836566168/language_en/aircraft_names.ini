Default=WZ-7 Soaring Dragon,WZ-7
Squadron1=WZ-7 ISR,WZ-7
DefaultDescription=The WZ-7 Soaring Dragon is a Chinese high-altitude, long-endurance reconnaissance UAV developed within AVIC. Its distinctive joined-wing layout combines forward and rear wing surfaces to form a large, rigid lifting system. Designed for persistent surveillance and intelligence collection, it became one of the PLA Air Force's publicly displayed unmanned reconnaissance types at Airshow China in 2021. Official reporting later that year described its participation in operational training, including route planning and target acquisition. Its exact maiden-flight date has not been officially confirmed in the sources used here.

[plaaf_wz-10]
Type=UAV
Default=WZ-10,WZ-10
Squadron1=WZ-10,WZ-10
DefaultDescription=The WZ-10 is a jet-powered unmanned electronic-reconnaissance aircraft associated with AVIC Chengdu's Wing Loong-10 family. Its airframe uses a dorsal intake and outward-canted twin tails. The PLA Air Force first publicly displayed the WZ-10 at Airshow China in November 2022, where its stated task was to intercept and locate hostile radar emissions. Related Wing Loong-10 aircraft have also carried atmospheric-observation equipment: a large-UAV typhoon observation flight was conducted in August 2020. This mod retains the Wing Loong-10-derived armed airframe; its expanded combat loadouts are fictional game adaptations.

[plaaf_yl-2]
Type=UAV
Default=Wing Loong II,YL-2
Squadron1=Wing Loong II,YL-2
DefaultDescription=Wing Loong II is a medium-altitude, long-endurance reconnaissance and strike UAV developed by AVIC's Chengdu aircraft design organization. It uses a rear-mounted pusher propeller and a long-span wing, with an electro-optical turret and multiple external weapon stations. Following its public presentation at Airshow China in 2016, it made its maiden flight on 27 February 2017 in northwestern China. The family was developed for persistent surveillance and precision strike and has also been adapted for emergency communications and disaster response. The additional anti-submarine and electronic-warfare fits in this mod are fictional game adaptations.

[plaaf_jiutian]
Type=UAV
Default=Jiutian,Jiutian
Squadron1=Jiutian,Jiutian
DefaultDescription=Jiutian is a large modular unmanned aircraft commissioned by Shaanxi Unmanned Equipment Technology Co., Ltd. and designed by AVIC's First Aircraft Institute. Its maiden flight took place at Pucheng, Shaanxi, on 11 December 2025. The platform combines a common airframe with interchangeable mission payloads; published figures include a 25 m span, 16 t maximum take-off weight and 6 t payload capacity. Intended applications include heavy logistics, emergency communications and surveying. In this game, the hive loadout carries FH-901 rounds in reusable ventral launch cells: an individual bottom hatch opens, a round ejects downward, and its wings unfold for flight. This release system and its 320-round capacity are fictional game implementations (Fictional).

