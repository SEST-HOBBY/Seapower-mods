JT_FH901=FH-901,,Loitering munition,Fictional game adaptation: A compact folding loitering munition launched from the Jiutian hive system for reconnaissance; target search and attack; the following describes mod functions; not verified operational capabilities. Carriage compatibility and performance values are for this Sea Power mod; not real-world certification. Day/night folding loitering munition. Native point/area reconnaissance launch and manual object attack; TV seeker contacts shared over the datalink. Map-icon context menu: manual 30–300 ft AGL or automatic; terrain avoidance en route; direct terminal attack on locked ground targets; manual altitude suspends terminal dive. No 20 km motor cutoff; 60-minute total life. Relative downward release 10 m/s; loiter 28; shallow glide up to 45; powered dash up to 80; anti-ship dive up to 120. Automatic altitude trade; terminal entry within 2 km; 300 m AGL search after target loss/destruction. Autonomous balanced known-hostile surface/land allocation survives carrier/link loss; air targets manual only; track memory 120 seconds. HEAT damage 5; Small; Always penetration; impact fuze. VeryTiny radar/IR; decoy resistance 0.85; valid jamming/failures remain. Hive-only 320; CJ-20 mixed 100; 64 channels. Game adaptation.
