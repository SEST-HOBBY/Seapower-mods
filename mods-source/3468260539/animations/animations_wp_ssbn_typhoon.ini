[HatchOpenAnimSequence_L]
# even/starboard hatches (Missile_Hatch_2,4,6...). Pure rotation, mirror of port.
# Sign FLIPPED 2026-07-13: after the X=0 asset mirror the hatches opened DOWN
# into the silo; a mirror reverses the sense of a RotationZ, so negate to open out.
NumberOfSteps=2
Time1=0
RotationZ1=0
Smoothness1=EaseInOut
Time2=2.5
RotationZ2=105
Smoothness2=EaseInOut

[HatchOpenAnimSequence_R]
# odd/port hatches (Missile_Hatch_1,3,5...). Pure rotation about the hinge
# (pivot already at the hinge); donor PositionX/Y removed 2026-07-12 - those
# absolute offsets were flinging the hatch to the wrong side (the "L/R flip").
# Sign FLIPPED 2026-07-13 (X=0 mirror reversed the RotationZ sense).
NumberOfSteps=2
Time1=0
RotationZ1=0
Smoothness1=EaseInOut
Time2=2.5
RotationZ2=-105
Smoothness2=EaseInOut

[DoorCloseAnimSequence_L]
NumberOfSteps=2
Time1=0
RotationZ1=-105
PositionX1=0.08
PositionY1=0.103
Smoothness1=EaseInOut
Time2=5
RotationZ2=-5
PositionX2=0.07
PositionY2=0.114
Smoothness2=EaseInOut

[DoorCloseAnimSequence_R]
NumberOfSteps=2
Time1=0
RotationZ1=105
PositionX1=-0.08
PositionY1=0.103
Smoothness1=EaseInOut
Time2=5
RotationZ2=5
PositionX2=-0.07
PositionY2=0.114
Smoothness2=EaseInOut

[HatchCloseAnimSequence_L]
# start angle FLIPPED 2026-07-13 to match the mirrored open (was -105).
NumberOfSteps=2
Time1=0
RotationZ1=105
Smoothness1=EaseInOut
Time2=3
RotationZ2=0
Smoothness2=EaseInOut

[HatchCloseAnimSequence_R]
# start angle FLIPPED 2026-07-13 to match the mirrored open (was 105).
NumberOfSteps=2
Time1=0
RotationZ1=-105
Smoothness1=EaseInOut
Time2=3
RotationZ2=0
Smoothness2=EaseInOut

[TubeOpenSequence_L]
# 2026-07-14: ALL 6 tube doors now FLIP DOWN/BACKWARDS into the tube - 90 deg
# about the LOWER-EDGE hinge (RotationX = lateral/pitch axis; was RotationZ
# 180 inward-fold). Same motion + sign for both columns (an X-mirror does NOT
# flip RotationX). If a door pitches OUT/forward instead of down into the tube,
# change -90 -> +90 in all four Tube*Sequence blocks.
NumberOfSteps=2
Time1=0
RotationX1=0
Smoothness1=EaseInOut
Time2=3
RotationX2=-90
Smoothness2=EaseInOut

