[BowplanesRetract]
# RETRACT (reverse of EXTEND): aft doors re-open 0-2s, bowplanes fold in 2-5s,
# then ALL doors close 5-7s. Fwd doors hold open 0-5s then close; the aft doors
# do the same open-hold-close as on extend (they only open to let the plane pass).
NumberOfSequencesToPlay=6
Sequence1=BowplanesRetractSequenceL
Sequence1_Model=Bowplane_Left
Sequence2=BowplanesRetractSequenceR
Sequence2_Model=Bowplane_Right
Sequence3=BowPlaneDoorFwdCloseSequence_Port
Sequence3_Model=BowPlaneDoorFwd_Port
Sequence4=BowPlaneDoorFwdCloseSequence_Stbd
Sequence4_Model=BowPlaneDoorFwd_Stbd
Sequence5=BowPlaneDoorOpenCloseSequence_Port
Sequence5_Model=BowPlaneDoor_Port
Sequence6=BowPlaneDoorOpenCloseSequence_Stbd
Sequence6_Model=BowPlaneDoor_Stbd

[BowplanesExtend]
# EXTEND: both door sets open 0-2s, bowplanes extend 2-5s, then the AFT doors
# close again 5-7s to reseal most of the aperture (acoustics). Fwd doors stay open.
NumberOfSequencesToPlay=6
Sequence1=BowplanesExtendSequenceL
Sequence1_Model=Bowplane_Left
Sequence2=BowplanesExtendSequenceR
Sequence2_Model=Bowplane_Right
Sequence3=BowPlaneDoorOpenSequence_Port
Sequence3_Model=BowPlaneDoorFwd_Port
Sequence4=BowPlaneDoorOpenSequence_Stbd
Sequence4_Model=BowPlaneDoorFwd_Stbd
Sequence5=BowPlaneDoorExtendOpenCloseSequence_Port
Sequence5_Model=BowPlaneDoor_Port
Sequence6=BowPlaneDoorExtendOpenCloseSequence_Stbd
Sequence6_Model=BowPlaneDoor_Stbd

