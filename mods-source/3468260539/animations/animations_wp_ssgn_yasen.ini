// Torpedo tube doors — per-door open/close. Each door swings 30 deg on
// RotationY and slides 0.012 inward on PositionX over 3s. Time1 = door's base
// (closed) pose (absolute local-frame); close is the exact inverse. Starboard
// (odd tubes): RotationY +30, PositionX -0.012. Port (even) mirrors the signs.

[Tube1_OpenSequence]
NumberOfSteps=2
Time1=0
PositionX1=0.07768
RotationY1=86.2
Smoothness1=EaseInOut
Time2=3
PositionX2=0.06568
RotationY2=116.2
Smoothness2=EaseInOut

