wp_fizik-2=物理学家-2,匣子,鱼雷,“匣子”（物理学家-2）是俄罗斯的深水自导鱼雷，2017年起在俄罗斯海军服役，接替UGST（物理学家-1）。“匣子”采用线导，最高航速约50节，最大工作深度超过500米。

