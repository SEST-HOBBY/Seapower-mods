wp_fizik-2=Fizik-2,Futlyar,Torpedo,The Futlyar (Fizik-2) is a Russian deep-water homing torpedo that entered service with the Russian Navy in 2017, replacing the UGST (Fizik-1). Futlyar is a wire-guided torpedo with a top speed about 50 knots and a maximum depth capability of more than 500 m (1,600 ft).

