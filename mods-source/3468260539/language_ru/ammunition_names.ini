wp_fizik-2=Физик-2,Футляр,Универсальная торпеда,«Футляр» («Физик-2») — российская глубоководная самонаводящаяся торпеда, принятая на вооружение ВМФ России в 2017 году на смену УГСТ («Физик-1»). Телеуправляемая по проводу, развивает скорость около 50 узлов и действует на глубинах более 500 м.

