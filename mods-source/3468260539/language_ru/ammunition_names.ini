wp_ss-n-26a=П-800,Оникс,ПКР,П-800 «Оникс» (3М55, по классификации НАТО — SS-N-26 Strobile) — высокоэффективная сверхзвуковая противокорабельная ракета. По концепции схожая с 3М82 «Москит» и 3М45 «Гранит», она является облегчённой ракетой нового поколения. Небольшие габариты позволяют размещать её на самолётах, ракетных катерах, а также на старых кораблях и подводных лодках. Для своих размеров «Оникс» исключительно эффективен: ГСН создана на основе миниатюризированной аппаратуры «Гранит-Электрон» ракеты П-700, а профиль полёта обеспечивает высокую скорость как на большой высоте, так и у поверхности моря. В сочетании с новой станцией помех, манёвром на конечном участке и возможностью ударов по наземным целям это делает «Оникс» по-настоящему грозным оружием.

wp_ss-n-27a=3М54К,Калибр,ПКР,3М54К «Калибр» (SS-N-27A) — российская противокорабельная крылатая ракета большой дальности с дозвуковой маршевой скоростью и отделяемой боевой ступенью, разгоняющейся на конечном участке почти до М=3. Это серьёзная угроза даже для современных систем ПВО: дойдя до конечного участка, ракета становится одной из самых опасных противокорабельных угроз. До этого момента её характеристики не отличаются от других дозвуковых крылатых ракет, и при своевременном обнаружении она является лёгкой целью.


#-----------Land Strike only missiles---------
wp_rsm-56=Р-30,Булава,БРПЛ,Р-30 «Булава» (РСМ-56, по классификации НАТО — SS-N-30/SS-NX-32) — баллистическая ракета подводных лодок, разработанная для ВМФ России и принятая на вооружение новых подводных крейсеров проекта 955 «Борей».

wp_r-39=Р-39,РСМ-52,БРПЛ,Р-39 (РСМ-52, по классификации НАТО — SS-N-20 Sturgeon) — советская баллистическая ракета подводных лодок проекта 941 «Акула». Крупная трёхступенчатая твердотопливная ракета с разделяющейся головной частью индивидуального наведения.

