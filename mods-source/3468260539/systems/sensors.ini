[ ========================================= General ========================================== ]
[General]
DataLinkUpdateRate=1             // every x seconds there will be an update for the overall sensor image for the minimap
PassiveSensorUpdateRate=1.0        // every x seconds the passive contacts will be re-evaluated
LostPassiveContactTimeToDisable=5  // time in seconds after which a lost passive contact bearing line will be greyed out
LostContactTimeToRemove=30         // time in seconds after which a lost contact will be removed from the map

[ ---------------------------- Sonars ----------------------------- ]
[MGK-600] #MGK-600 Irtush-Amfora
#Users: wp_ssn_yasen
Kind=Sonar
HasDataLink=False       // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=5.0   // TODO in degrees
RangeResolution=130.0   // TODO defines the minimum range where two targets behind can be recognized as two; in meters
ActiveRange=25          // in km
PassiveRange=27         // in km
ActiveGain=40
Gain=43                 // in db, gain of the sensor
OutputPower=230         // Active sensor output power in dB, unused for passive ones
Type=Hull				//Hull: hull mounted sonar, Towed: towed passive sonar, VDS: variable depth active sonar, Dipping: dipping sonar
SonarFrequency=LF
IsTowedSonar=False
ModuleType=SonarSensor

