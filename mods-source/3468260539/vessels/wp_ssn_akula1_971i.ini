[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.14

Length=110.3                     // in meters
Beam=13.6                      // in meters
FrontalArea=182
SideArea=1431
BottomArea=1324

# Hull armor: None, Minor, Moderate, Heavy
