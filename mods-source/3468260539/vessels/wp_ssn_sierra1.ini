[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.14

Length=107                     // in meters
Beam=12.3                      // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=8300              // in tons

MaxForwardVelocity=34.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=10.0
MaxBackwardVelocity=5.0        // sets the max backward velocity
MaxBackwardVelocitySurfaced=3.0
TelegraphVelocities=-5,0,5,10,15,20,32
BowUnderWater=20.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=40.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
CavitationParameters=20,-100
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.9               // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=5                 // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.068         // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=50.0            // in feet
CrushDepth=3000.0              // in feet

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
LowMagneticHull=false
# Sonar related
BaseNoise=125                  // base sound level in db at 1m distance
FlowNoise=1                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=20             // additional noise for cavitation in db
TargetReflectionStrength=17    // in dB for broad side
BladesCount=7                  //number of blades on vessel's propulsion systems
ElectricFrequency=50           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=2
AnimationFile_1=animations_wp_ssn_sierra1

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=5              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
AAW_Capability=0
ASuW_Capability=5
ASW_Capability=7

#Defence
MissilesToSaturate=2      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=2     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

#Special
Role=SSN

