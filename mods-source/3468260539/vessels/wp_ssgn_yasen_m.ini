[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.12

Length=130                    // in meters
Beam=13                        // in meters
FrontalArea=154
SideArea=1414
BottomArea=1317

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[OpticalView]
Views=standard_periscope_soviet,bridge_binocular_20x120_stab_soviet
DefaultView=bridge_binocular_20x120_stab_soviet

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=13800              // in tons

MaxForwardVelocity=35.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=20.0
MaxBackwardVelocity=7.0        // sets the max backward velocity
MaxBackwardVelocitySurfaced=3.0
TelegraphVelocities=-7,0,8,15,20,28,35

CavitationParameters=23
BowUnderWater=19.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=40.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=1.2                // multiplicator defining how agile the ship can turn

MaxPitchAngle=30.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=4                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.10611           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=50.0            // in feet
CrushDepth=2160.0              // in feet

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
LowMagneticHull=True
# Sonar related
BaseNoise=98                  // base sound level in db at 1m distance
FlowNoise=0.75                 // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5             // additional noise for cavitation in db
TargetReflectionStrength=20    // in dB for broad side
BladesCount=7                  //number of blades on vessel's propulsion systems
ElectricFrequency=50           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
PropellerType=Skewback
MachineryRaftingGeneration=5

[Animations]
