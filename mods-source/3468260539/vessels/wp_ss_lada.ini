[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=0.9
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.15

Length=66.8                    // in meters
Beam=7.1                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

MaxGuidanceWires=2

FrontalArea=45
SideArea=587
BottomArea=537
Volume=2700
[OpticalView]
Views=standard_periscope_soviet,bridge_binocular_20x120_stab_soviet
DefaultView=bridge_binocular_20x120_stab_soviet

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=2700              // in tons

MaxForwardVelocity=21.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=10.0
MaxBackwardVelocity=5.0        // sets the max backward velocity
MaxBackwardVelocitySurfaced=3.0
TelegraphVelocities=-5,0,3,5,10,15,21 // Overrides default telegraph values

BowUnderWater=17.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=33.0            // depth in feet, from where the sail is under water
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.47
MinAccelerationFactor=0.1

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.75                // multiplicator defining how agile the ship can turn

MaxPitchAngle=30.0
PitchChangeRate=2.0
MaxRollAngle=10.0
RollChangeRate=2.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=4                    // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.05184           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=41.0            // in feet
CrushDepth=1230                // in feet
CavitationParameters=15

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=105                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5              // additional noise for cavitation in db
TargetReflectionStrength=12     // in dB for broad side
BladesCount=7                   //number of blades on vessel's propulsion systems
ElectricFrequency=50            //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
MachineryRaftingGeneration=5
PropellerType=Skewback
TonalRPMModifier=85

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_wp_ss_lada

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=6
ASW_Capability=6

#Defence
#Special
Role=SS

############################################################
# Control System (CIC)
############################################################
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=2000
BaseNoise=145             // radiated noise while running on this plant (replaces [SensorData] BaseNoise)
Collider=coll_engineroom

#-----------------v  Mockup v -----------------
[SnorkelMastSystem]
MaxForwardVelocity=9
Collider=coll_snorkel_mast
Mount=Snorkel
OpenSystemAnimation=RaiseSnorkel
CloseSystemAnimation=LowerSnorkel
ModuleType=Inert

[AuxPowerSystem]
Type=Electric
HorsePower=5500
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
Capacity=20500      //Range 20.5 miles at top underwater speed (18 knots)
DischargeRate=1.475 //Rate of discharging batteries. Lower values provide more range on low underwater speed on batteries
RechargeRate=1.2    //Capacity per second when charging batteries. When a unit goes at Standard telegraph setting or slower, the charge rate doubles
Collider=coll_battery_1,coll_battery_2

#Rudder Systems
[RudderSystems]
NumberOfRudderSystems=2

[RudderSystem1]
Mount=Rudder_Upper
Collider=coll_rudder_sys

[RudderSystem2]
Mount=Rudder_Lower
Collider=coll_rudder_sys

[DepthRudderSystems]
NumberOfDepthRudderSystems=2

[DepthRudderSystem1]
NumberOfPlanes=2
Plane1=Sail_Plane_Port
Plane2=Sail_Plane_Starboard
MaxAngle=25.0
Direction=1.0
Collider=coll_rudder_sys

[DepthRudderSystem2]
NumberOfPlanes=2
Plane1=Stern_Plane_Port
Plane2=Stern_Plane_Starboard
MaxAngle=30.0
Direction=-1.0
Collider=coll_rudder_sys

[PropulsionSystems]
NumberOfPropulsionSystems=1

[PropulsionSystem1]
Mount=Propeller
RotationDirection=Right
Collider=coll_prop

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=7

#---------- Visual ----------
[SensorSystem1] #Tower_Watch
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.16492,0.1623
ModuleType=Inert

[SensorSystem2] #Periscope
Type=Periscope
SystemName=AdvancedOptics
Mount=Periscope
NightVisionLevel=0.25 //the portion of full daylight added to the visibility level where 1 is roughly a mid-day
OpenSystemAnimation=RaisePeriscope
CloseSystemAnimation=LowerPeriscope

#---------- Surface only search radars ----------
[SensorSystem3] #Radar
Type=Radar
SystemName=Snoop_Tray
Mount=Radar
OpenSystemAnimation=RaiseRadar
CloseSystemAnimation=LowerRadar
RadarOffset=18     // in feet. Radar height over mount position

#---------- Sonar ----------
[SensorSystem4]
Type=Sonar
SystemName=MGK-540_mw
Mount=Dummy
MountPosition=0,0.01158,0.43617

[SensorSystem5] #ESM mast
Type=ESM
SystemName=Submarine_ESM
Mount=ESM
OpenSystemAnimation=RaiseESM
CloseSystemAnimation=LowerESM

[SensorSystem6] #Acoustic Intercept
Type=Sonar
SystemName=ActiveIntercept_Late
Mount=Dummy
MountPosition=0,0.01158,0

[SensorSystem7] #Towed Sonar
Type=Sonar
SystemName=MGK-540_TA_mw
Mount=Dummy
CablePart=effects/ships/emitters/Towed_Array_Line  //prefab object to be used as part of cable. Also indicates that it is a towed sonar
AttachmentPointPosition=0,0.07555,-0.42737             //position of a local point where the cable is attached to host vessel
CableAttachmentOffset=0.0 // offset to the cable end for the sensor
CableLength=300                                    //length of cable in meters
Depth=100                                          //depth in feets to keep on the cable end when the vessel is on surface
CableRetractRate=3.0 //retract rate for the towed array cable
CableSinkRate=0.001 //sink rate for the towed array cable
MinDeploySpeed=5.0 //the minimal speed in knots to deploy a towed system
MaxDeploySpeed=25.0 //max deploy speed in knots to deploy a towed system

