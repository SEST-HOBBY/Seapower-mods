[---------- General Data ----------]
[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.2
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.14

Length=110.62                     // in meters
Beam=12.28                      // in meters
FrontalArea=123
SideArea=1207
BottomArea=1302

