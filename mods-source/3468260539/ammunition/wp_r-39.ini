#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# R-39 / SS-N-20 Sturgeon
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation      // can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine     // Seeker ignores objects of this type while in default mode

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=10000
ImpactSize=5000                      // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=90.0                      // Climb angle for initial loft
MaxLoftAlt=200000                          // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#SeaSkimmingAlt=20.0                    // height in feet for sea skimming TODO:make terrain following
#SeaSkimmingAlt=2000.0                    // height in feet for sea skimming
#SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
#SeaSkimmingNoseUp=2.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
#SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#FinalFlightPhaseAlt=3500.0             // in feet. altitude of pop-up
#FinalFlightPhaseMaxAngle=40.0
#FinalFlightPhaseDistToTarget=20.0       // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
TerminalApproachDist=25
TerminalDiveDistance=20
IgnoreHeightDifferenceForTargetDist=True
#========================================= Launch stats ============================================================
MaxVelocity=12000.0                      // Maximum speed in knots
Acceleration=15.0                       // Acceleration factor
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second
MinLaunchRange=100.0                    // Minimum launch range in nautical miles
MaxLaunchRange=5200.0                   // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=150     // Circular error vs 'Installation' land units
#Homing
#N/A
#ECCM
#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# Internal Resources folder related
# Note: no AssetBundle fallback here (unlike the old wp_ss-n-19-borrowed
# version) - this is our own mod-native mesh, and leaving a stale
# AssetBundleMesh=usn_rim-7 fallback in place would risk the engine
# rendering the base game's RIM-7 instead of our R-39 if the AssetBundle
# lookup takes priority over ResourcesFolder.
#
# wp_r-39_slbm.obj is a single combined export containing two named
# objects - "wp_r-39_slbm" (main flight body) and "wp_r-39_cannister"
# (underwater launch mesh) - same one-file/two-named-objects pattern as
# the 3P mods' YJ-18.obj (yj-18 + launch). ResourcesRoot is the file
# name (needs the .obj extension for a raw mod mesh); ResourcesMesh/
# ResourcesMeshForLaunch/ResourcesMeshCanister select which named object
# inside that file to show - they are NOT separate files.
############################################################
ResourcesFolder=weapons/wp_r-39/
ResourcesRoot=wp_r-39_slbm.obj
ResourcesMesh=wp_r-39_slbm
# OWN baked material (2026-07-12): missile + canister were UV-unwrapped into a
# shared AtlasUV and baked to MainTex/SpecTex; one wp_r-39_mat.ini covers both
# meshes. Custom material -> reference WITH the .ini extension (bundle borrows
# omit it). Replaces the old dummy wp_ss-n-19 borrow (which had no UVs to map).
ResourcesMaterialFolder=weapons/wp_r-39/
ResourcesMaterial=wp_r-39_mat.ini
ResourcesMeshForLaunch=wp_r-39_cannister
ResourcesMeshCanister=wp_r-39_cannister
ResourcesMeshSwitchTime=3  // time in seconds after launch to switch from launch mesh to main mesh - matches an encapsulated ejection + surface-breach transit (see UGM-109's canister timing)
############################################################
NumberOfSubModels=1

SubModel1=Afterburner

[Afterburner]
Type=Afterburner                  //Dot: afterburner is invisible by default and will be turned on only after launch
Mesh=wp_ss-n-19_afterburner
ResourcesMaterialFolder=aircraft/materials/
Material=afterburner_mat
Position=0,0,0
Rotation=0,0,0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/wp_ss-n-19_booster
BoosterEffectPosition=0,0,-0.01

InFlightEffect=effects/weapons/emitters/turbojet_sustainer
InFlightEffectPosition=0,0,-0.072
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosion=effects/explosions/emitters/nuclear_underwater_surface_part
HitGroundExplosion=effects/explosions/emitters/nuclear_underwater_surface_part
HitShipExplosionClass=effects/explosions/emitters/nuclear_underwater_surface_part
HitAirExplosionClass=effects/explosions/emitters/nuclear_underwater_surface_part
HitDefaultExplosionClass=effects/explosions/emitters/nuclear_underwater_surface_part
HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=VeryLargeGroundHitExplosions

ExplosionOverwaterSplash=effects/explosions/emitters/nuclear_underwater_surface_part
UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.08

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
#creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.017,0.017,0.14
