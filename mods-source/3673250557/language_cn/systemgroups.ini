[SystemNames]
Erieye_ER=Erieye ER|Erieye ER 是萨博 “全球眼” 的核心预警雷达，采用氮化镓收发组件与 10 米长平衡木式天线布局，实现 300° 方位覆盖，仅在机头、机尾方向各留有约 30° 盲区。其对典型战斗机类目标的最大探测距离超过 470 千米，可同时跟踪 300 余个空中、水面目标，为指挥决策提供关键空情态势感知。

Seaspray_7500E=Seaspray 7500E|Seaspray 7500E 是安装于 “全球眼” 机腹下方的 X 波段 AESA 雷达，专为广域海面与地面监视设计，其最大探测距离可达 590 千米，可精准识别潜望镜、小型快艇、车辆等低可探测目标，甚至能对海面油污、水下潜航器活动迹象进行探测。X 波段的高分辨率特性使其能生成清晰的目标图像，结合 AESA 的快速扫描能力，可在短时间内完成大面积海域或陆地的搜索与目标分类，有效补充主预警雷达的任务盲区。

Safire_380_HD=Safire 380 HD|Star Safire 380 HD 是安装于 “全球眼” 前机身下方的多光谱光电转塔，集成高清昼间摄像机、中波红外热像仪、激光测距仪与激光指示器，支持 360° 全景监视与自动目标跟踪。