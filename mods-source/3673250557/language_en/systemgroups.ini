[SystemNames]
Erieye_ER=Erieye ER|Erieye ER is the core early warning radar of the Saab GlobalEye. It uses gallium nitride (GaN) transceiver modules and a 10-meter-long balance-beam antenna layout, achieving 300° azimuth coverage with approximately 30° blind spots at the nose and tail directions respectively. Its maximum detection range against typical fighter-sized targets exceeds 470 kilometers, and it can simultaneously track more than 300 aerial and surface targets, providing critical air situation awareness for command and decision-making.

Seaspray_7500E=Seaspray 7500E|Seaspray 7500E is an X-band AESA radar installed under the fuselage of the GlobalEye, specifically designed for wide-area maritime and ground surveillance. It has a maximum detection range of up to 590 kilometers, enabling precise identification of low-observable targets such as periscopes, small speedboats, and vehicles, and can even detect oil slicks on the sea surface and signs of underwater submersible activity. The high-resolution nature of the X-band allows it to generate clear target imagery, and combined with the rapid scanning capability of AESA, it can complete large-area sea or land searches and target classification in a short time, effectively supplementing the mission blind spots of the main early warning radar.

Safire_380_HD=Safire 380 HD|Star Safire 380 HD is a multispectral electro-optical turret installed under the forward fuselage of the GlobalEye. It integrates a high-definition daytime camera, a mid-wave infrared thermal imager, a laser rangefinder, and a laser designator, supporting 360° panoramic surveillance and automatic target tracking.