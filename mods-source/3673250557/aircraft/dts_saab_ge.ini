AnimationFile_1=animations_dts_saab_ge

[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=1.48             //Pi* r * r where r is engine radius, in meters

[FlightModel]
PitchGain=0.8                         // Vertical manuverability
VelocityGain=0.1136                   // Acceleration
HeadingGain=2                         // Horizontal manuverability
YawRateLimit=130                      // in degrees per second

BankGain=0.8                          // Roll change speed
MaxRollForHeading=45.0                // bank limit in normal flight
MaxRollRate=60.0                      // in degrees per second

ThrustGain=0.325                      // Thrust change speed
SpeedBrakeFractionGain=10            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

[Performance]
#Dimensions
WingSpan=28.60                           //meters
#Parameters
MaxG=5                                // Mostly for horizontal turns

MaxClimbRate=20.0                     //Meters per second
EmptyMass=23691                       // in kg
MaxFuel=20434                         // in kg

PerEngineMaxThrust=65600              //Newtons
EngineCount=2

Ceiling=35000.0                       // ceiling in feet
CruiseAltitude=30000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.5,0.6,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=430                //in knots, Defines max speed at altitude curve
StallSpeed=110.0                      //in knots
MachLimit=0.8                         //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.24,0.4        // Landing
SpeedAndRange_Loiter=0.5,0.6          // Loiter
SpeedAndRange_Cruise=0.64,6200        // Cruise
SpeedAndRange_Max=0.8,0.8             // Attack/Fast/High/Max without AB


Altitudes=1000,3000,6000,10000,20000,35000  // in feet

