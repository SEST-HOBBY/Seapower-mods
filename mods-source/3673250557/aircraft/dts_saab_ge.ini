LandingPitch=-5

[AI]
Role=AEW

[SensorData]
#Visual
VisualIdentificationRange=6.0  // at what range in nm this unit can be visually identified
IRSignature=Meager
# Radar related (RCS => radar cross section)
RCS=Meager

[Animations]
