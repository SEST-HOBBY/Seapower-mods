MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.0

#Taxi values
GroundedPitchAngle=0.0    // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.0408,0   // defines the relative location of the landing gear
