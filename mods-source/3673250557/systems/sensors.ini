[Safire_380_HD] # FLIR detector pod
Kind=Visual
#Infrared
NightCapable=True                   // is the designator can be used in low-visibility conditions
VIDRangeMultiplier=6.2        // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=6.5          // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.8          // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.95                   // Field of View of the designator
ViewArcs=-120,120|-270,10


[Erieye_ER]
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface           // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True  // True means the radar can see ground objects
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
MinRange=0.6           // min range in km
MaxRange=550.0          // max range in km
LookDownMultiplier=0.8     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=1.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1	           // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=62.0              // gain in dB on the sensor
Frequency=S-Band      // frequency band
PeakPower=5.0          // output peak power in kW	


[Seaspray_7500E]
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface           // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True  // True means the radar can see ground objects
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
MinRange=0.6           // min range in km
MaxRange=490.0          // max range in km
LookDownMultiplier=1     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
RangeResolution=2.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1	           // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=68.0              // gain in dB on the sensor
Frequency=X-Band      // frequency band
PeakPower=2.0          // output peak power in kW	
