#!extend systems/sensors.ini

[ ========================================= Sweden - land radars ========================================== ]

[swe_giraffe_amb_land] # Giraffe AMB (land-based, mast-mounted)
#Saab Giraffe AMB 3D multi-beam surveillance radar, ground based
#Users: swe_unde23 (UndE 23). Name kept from the first release; ArtE 740 uses its own swe_arte740_radar.
#Based on eu_SeaGiraffe_AMB_3D (Euromod), changed to land Giraffe AMB values:
#C-band 5.4-5.9 GHz, 60 rpm, 120 km instrumented range, 20 000 m, >70 deg elevation
Kind=Radar
Type=Search                        // Classes can be "Search", "Targeting"
HasDataLink=True                   // shares tracks with the whole group/task force - RBS 15 KA launchers rely on this
Role=AirAndSurface                 // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate                    // Can be "Illuminate", "RadioCommand"
RotationDirection=1                // -1 means left, 1 means right
TargetChannels=800                 // if applicable number of targets it can track simultaneously
WeaponChannels=0                   // surveillance radar, does not guide missiles (RBS 15 is fire-and-forget)
RPM=60                             // 1 s revisit time (Saab: 60 rpm)
ViewArcs=-181,181|-5,70            // 360 deg, elevation coverage up to 70 deg
MinRange=0.1                       // min range in km
MaxRange=120.0                     // instrumented range in km (Saab brochure)
MinAltitude=0                      // min altitude in meters
MaxAltitude=20000                  // altitude coverage in meters
RangeResolution=2.0                // in meters
BeamWidth=2.0                      // in degrees
SubClutterVisibility=47            // pulse-Doppler; Euromod: 47 = intermediate tier, 50 = maximum
Gain=43.0                          // gain in dB on the sensor
Frequency=C-Band                   // 5.4-5.9 GHz
PeakPower=250.0                    // output peak power in kW (kept from Euromod AMB 3D)
ModuleType=MediumSensor
FCSolutionGainRate=1.5
FCMinSolution=0.6
FCTracksRounds=False

[swe_unde23_rotor] # cosmetic - only turns the visible antenna head; the working radar sits on a dummy mount at 13.2 m
Kind=Radar
Type=Search
HasDataLink=False
Role=AirAndSurface
Mode=Illuminate
RotationDirection=1
TargetChannels=1
WeaponChannels=0
RPM=60                             // same speed as the working radar
ViewArcs=-181,181|-2,30
MinRange=0.01
MaxRange=0.05                      // 50 m - detects nothing useful
MinAltitude=0
MaxAltitude=10
RangeResolution=25.0
BeamWidth=2.0
SubClutterVisibility=0
Gain=1.0
Frequency=C-Band
PeakPower=0.001
ModuleType=MediumSensor
FCSolutionGainRate=1.5
FCMinSolution=0.6
FCTracksRounds=False
