[General]
UnitType=LandUnit
LandUnitSubType=MissileSite
#IsMobile=True                  // commented out in the vanilla Rubezh too - try enabling it if you want the unit to drive

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=10.4                     // in meters (MAN HX77 8x8)
Beam=2.6                        // in meters
Range=270                       // in miles

ArmorType=None
DamagePoints=3

FrontalArea=8.5
SideArea=25
BottomArea=25

[Tacview]
Name=UndE 23
Tag=Ground+Radar

[Physics]
HorsePower=360
Mass=32                        // in tons

MaxForwardVelocity=40          // in knots (~75 km/h on road)
MaxBackwardVelocity=5.5
Braking=10
TurnRate=10

[AI]
UnitScoreValue=0.2
Role=ASuW

[Animations]
NumberOfAnimationReferences=0

[ControlSystem]
Collider=coll_hitbox
Integrity=4

[SensorData]
VisualIdentificationRange=3
IRSignature=Small
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3

[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.03,0.04
ModuleType=Bridge
Integrity=0

[SensorSystem2] #Giraffe AMB - the working radar
# Mounted on a dummy point 13.2 m above ground over the mast axis, so the radar horizon is right.
# The visible antenna turns on top of the modelled mast at 11.24 m.
Type=Radar
SystemName=swe_giraffe_amb_land   // defined in this mod: systems/swe_unde23_sensors.ini
Mount=Dummy
MountPosition=0.00008,0.19412,-0.02161   // 13.2 m above ground
Collider=coll_radar

[SensorSystem3] #Antenna rotation only (cosmetic)
# Turns the visible antenna head. Practically no range or power.
Type=Radar
SystemName=swe_unde23_rotor       // defined in this mod: systems/swe_unde23_sensors.ini
Mount=ue_antenna
Collider=coll_radar

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=0

[--------------------------- Mesh definitions ---------------------------]
[Models]
ResourcesFolder=assets/swe_unde23/models/
ResourcesRoot=swe_unde23.obj
ResourcesMesh=ue_body
ResourcesMaterialFolder=assets/swe_unde23/materials/
ResourcesMaterial=ue_body_mat.ini

[Submodels]
Sensors_1=ue_antenna

[ue_antenna]
# Giraffe AMB antenna head from "Sky Sabre (TADS)" by KojfDiscord (Sketchfab, CC BY 4.0). Mast is part of ue_body (erected).
ResourcesMeshFolder=assets/swe_unde23/models/
RootMesh=swe_unde23.obj
ResourcesMaterialFolder=assets/swe_unde23/materials/
Mesh=ue_antenna
Material=ue_body_mat.ini
Position=0.00008,0.16527,-0.02161     // rotation axis of the antenna, top of the mast 11.24 m above ground
Rotation=0,0,0
Scale=1,1,1

