[General]
# A.182
Type=Torpedo                           // can be Projectile, Missile, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=1652                              // in kg. Used for aircraft
AmmoPoints=4956                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=TorpedoImpacts  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
BaseNoise=117                   // base sound level in db at 1m distance
FlowNoise=0.5                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0               // additional noise for cavitation in db
TargetReflectionStrength=1      // in dB for broad side
#Transient
TransientRCS=-1                        // Transient visibility on the radar
TransientVisualIdentificationRange=-1  // Transient can be visually detected at this distance
TransientBaseNoise=180                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=75
ImpactSize=Large               // Impact size, can be small, medium, large, verylarge
Penetration=Always              // can be minor, moderate, heavy, always

FuzeProximityDistance=0         // for proximity fuze: distance to target in meter
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing

[Guidance]
GuidanceType=8
MidCourseCorrection=2                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=5           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
#========================================= Launch stats ============================================================
MaxVelocity=30                         // Maximum speed in knots
Acceleration=10.0                      // Acceleration factor
MaxTurnRate=10                         // Maximum turnrate in degrees per second

MinLaunchRange=0.5                     // Minimum launch range in nautical miles
MaxLaunchRange=6.2                     // Maximum launch range in nautical miles

WireControlsDepth=True                 // the wire can pass depth orders and target depth data to the torpedo
WireBreakSpeed=15                      // launch platform speed in knots above which the wire breaks (default 20)
WireCountermeasureBonus=0.2            // extra countermeasure rejection while on the wire; kept after a break if homing already started (default 0)
MaxDepth=450                           // Maximum allowed depth in feet.

LaunchReliability=85                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerFOV=60.0                         // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerPassiveRange=0.27                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
SeekerGain=30.0                        // Seeker gain in dB
#ECCM
AntiCountermeasuresBonus=0.1           // This value substracted from probability of spoofing by countermeasures (0...1)
MinAfterSpoofEffectTime=10.0           // Min time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
MaxAfterSpoofEffectTime=25.0           // Max time in seconds a torpedo will be still spoofed after loosing contact with a noisemaker/decoy, actual value is random between min/max
#ECCM
# Torpedo related
SearchMode=0                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
ReattackMode=0                         // 0 = None, 1 = Circle, 2 = Drive-around
DefaultDepth=20                        // default depth in feet a torpedo is using for submerged targets for bearing only launches
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=weapons/mm_a182/
ResourcesRoot=mm_a182.obj
ResourcesMesh=Body
ResourcesMaterial=mm_a182_mat.ini
# optional below
ResourcesMeshForLaunch=mm_a182_dummy
ResourcesMeshSwitchTime=0.5              // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=2

SubModel1=Propeller_left
SubModel2=Propeller_right

[Propeller_left]
Type=Propulsion
RotationDirection=Left
Mesh=Propeller_left
Position=0,0,-0.0465
Rotation=-90,0,0

[Propeller_right]
Type=Propulsion
RotationDirection=Right
Mesh=Propeller_right
Position=0,0,-0.0447
Rotation=-90,0,0

# Optional debris related stuff
#[Debris]
#DebrisProbability=95               // probability for debris to happen
#ResourcesMeshForDebris=wp_ss-n-3_d // optional debris mesh after destruction
#DebrisPosition=0.05                // moves it in front of the warhead to have the trailing effect at correct position
#DebrisLifeTime=10.0
#DebrisVelocityDampening=0.99
#DebrisHeightLossAdd=0.0005   // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
BoosterEffectPosition=0,0,0

InFlightEffect=effects/weapons/emitters/aswtorpedo_cavitation_particle
InFlightEffectPosition=0,0,-0.057
InFlightEffectStartTime=0

HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes
ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo

############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
PropAudioClip=audio/weapons/torpedo
PropAudioRollOff=Logarithmic
PropAudioDistance=1,20
PropAudioPitch=1.0
PropAudioPosition=0,0,0
PropAudioAudibility=Below

[---------- Colliders ----------]
[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,-0.0051,0.0053
Rotation=0,0,0
Scale=0.01,0.01703,0.09293
