[General]
# MK 14 Mod 3
Type=Torpedo                           // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=1388                              // in kg. Used for aircraft
AmmoPoints=4164                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
BaseNoise=120                   // base sound level in db at 1m distance
FlowNoise=0.5                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=0               // additional noise for cavitation in db
TargetReflectionStrength=1      // in dB for broad side
# Transient
TransientRCS=-1                        // Transient visibility on the radar
TransientVisualIdentificationRange=-1  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=180                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=82
ImpactSize=VeryLarge                // Impact size, can be small, medium, large, verylarge
Penetration=Always              // can be minor, moderate, heavy, always

FuzeProximityDistance=10         // for proximity fuze: distance to target in meter
SmartFuse=True                  // Explodes not immediately but when when target start to go away
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=2           // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
TerminalVelocity=46                    // Maximum speed in knots
#========================================= Launch stats ============================================================
MaxVelocity=46                         // Maximum speed in knots
Acceleration=12.0                      // Acceleration factor
MaxTurnRate=10.0                       // Maximum turnrate in degrees per second

MinLaunchRange=0.5                     // Minimum launch range in nautical miles

SpeedSettings=30.5,31,46               // selectable speeds in knots, lowest to highest
SpeedSettingRanges=4.4,4.4,2.2         // full tank range in nautical miles at each of the speeds above

MaxDepth=200                           // Maximum allowed depth in feet.

LaunchReliability=85                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
# Torpedo related
SearchMode=0                           // 0 = None, 1 = Snake, 2 = Circle, 3 = Spiral, 4 = Ladder
ReattackMode=0                         // 0 = None, 1 = Circle, 2 = Drive-around
DefaultDepth=15                         // default depth in feet a torpedo is using for submerged targets for bearing only launches

[---------- Mesh definitions----------]
[Models]
LODLevels=1
LOD1Distance=5.0  // nautical miles
NumberOfSubModels=2

############################################################
# AssetBundle related (Using Mk9 template structure here for testing, paths may not be correct for torpedo)
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_mk48
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_mk48_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=ammunition/usn_mk14_torpedo/
ResourcesRoot=usn_mk14_torpedo.obj
ResourcesMesh=Torpedobody
ResourcesMaterialFolder=ammunition/usn_mk14_torpedo/
ResourcesMaterial=mk14_mat.ini
############################################################

