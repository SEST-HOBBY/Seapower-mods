ResourcesFolder=assets/models/weapon/ammunition/si-270/
ResourcesRoot=mm_si270.obj
ResourcesMesh=Body
ResourcesMaterial=mm_si270_mat.ini
# optional below
ResourcesMeshForLaunch=mm_a184_dummy
ResourcesMeshSwitchTime=0.5              // time in seconds after launch to switch from launch mesh to main mesh
############################################################
