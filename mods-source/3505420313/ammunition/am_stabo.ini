#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# Rockeye
Type=Bomb                              // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=25.2                              // in kg. Used for aircraft
AmmoPoints=25.2                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

############################################################
# Sensor related characteristics
############################################################

[SensorData]
#Visual
VisualIdentificationRange=1       // Biggest range in nm at which this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=5
Power=32
ImpactSize=VeryLarge           // Impact size, can be small, medium, large, verylarge
Penetration=heavy              // can be minor, moderate, heavy, always
BombletsEjectAltitude=80      // in feet. MUST be lower than MinLaunchAltitude

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.5         // Time in seconds before colliders are enabled
#======================================== Flight Profile ===========================================================
#========================================= Launch stats ============================================================
EjectVelocity=20                       // Initial forward speed in knots

MinLaunchRange=0                       // Minimum launch range in nautical miles
MaxLaunchRange=100.0                   // Maximum launch range in nautical miles
MinLaunchAltitude=100                 // Minimum launch altitude in feet.
MaxLaunchAltitude=400               // Maximum launch altitude in feet.

MaxTurnRate=1.0                        // Maximum turnrate in degrees per second
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=20.0                // Circular error radius in meters

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
#AttachmentPosition=0,0,-0.001
#AttachmentPosition=0,0,-0.001
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_mk-82
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_mk-82_mat
AssetBundleMeshHullCollider=usn_mk-82_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/kb44/
ResourcesRoot=kb44.obj
ResourcesMesh=Body

ResourcesMaterialFolder=weapons/usn_ssq-53/
ResourcesMaterial=usn_ssq-53_mat
ResourcesMeshForLaunch=usn_ssq-53_dummy
############################################################


[---------- Effects ----------]
[Particles]
#For Cluster bombs both BoosterEffect and InFlightEffect = canister open and bomblets ejection
#BoosterEffect - stays in place
#InFlightEffect - moves with invisible bomb
#Both can be used simultaneously
BoosterEffect=effects/weapons/emitters/rockeye_release
BoosterEffectPosition=0,0,0
#InFlightEffectClass=LargeMissileExplosions
#InFlightEffectPosition=0,0,0


#HitShipExplosionClass=LargeShipHitExplosion
#HitAirExplosionClass=SmallGroundHitExplosions
#HitDefaultExplosionClass=SmallGroundHitExplosions	//MediumMissileExplosions
#HitWaterSplashClass=SmallWaterSplashes

HitShipExplosionClass=ClusterGroundHitExplosions
HitAirExplosionClass=ClusterGroundHitExplosions
HitDefaultExplosionClass=ClusterGroundHitExplosions
HitGroundExplosionClass=ClusterGroundHitExplosions
HitWaterSplashClass=SmallWaterSplashes

#ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb
#ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo

############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
BoosterAudioClip=
BoosterAudioRollOff=Logarithmic
BoosterAudioDistance=1,20
BoosterAudioPitchRange=0.4,1
SustainerAudioClip=
SustainerAudioRollOff=Logarithmic
SustainerAudioDistance=1,20
SustainerAudioPitchRange=0.1,0.6
InflightAudioClip=audio/weapons/TorpedoEngine
InflightAudioRollOff=Logarithmic
InflightAudioDistance=1,20
InflightAudioPitchRange=0.1,0.6

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637