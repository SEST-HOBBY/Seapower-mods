[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=12.34                               // in kg. Used for aircraft
AmmoPoints=12.34                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=850         // meter per second
MaxRange=18400             // in meters
GravityFactor=1.5
CircularErrorProbable=65  // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=2
ImpactSize=Small       // Impact size, can be small, medium, large, verylarge
Penetration=Minor       // can be minor, moderate, heavy, always
FuzeProximityDistance=5
KillProbability=0.05       // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_small
ResourcesMaterial=shell_mat_red

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_medium_shell
HitAirExplosionClass=MediumFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
HitDefaultExplosion=effects/explosions/emitters/shell_hit_ground_small
HitGroundExplosionClass=SmallGroundHitExplosions
