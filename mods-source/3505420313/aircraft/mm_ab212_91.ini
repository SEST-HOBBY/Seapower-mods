[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=5

[SensorSystem1]
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0,0
ModuleType=Sensor

[SensorSystem2] #Dipping Sonar
Type=Sonar
SystemName=AQS-13E
Mount=AQS-13E
CableLength=153                                        //length of cable in meters
Depth=500                                              //depth in feets to keep on the cable end when the vessel is on surface
CablePart=effects/ships/emitters/Towed_Array_Line_Thin //prefab object to be used as part of cable
AttachmentPointPosition=-0.008,0.007,0.015               //position of a local point where the cable is attached to host vessel
CableAttachmentOffset=0.005                           // offset to the cable end for the sensor

TowedBodyDrag=0.01           //drag coefficient for towed object
TowedBodyBuoyancy=-4
CableRetractRate=2.0         //retract rate for the towed array cable
CableSinkRate=0.01           //sink rate for the towed array cable
CableUnderwaterDrag=0.004

MinDeploySpeed=0.0           //minimal speed in knots to deploy a towed system
MaxDeploySpeed=0.0           //max speed in knots to deploy a towed system
MaxDeployAltitude=45.0       //maximal altitude where a cable can be deployed, in feet, should be somewhat higher than helicopter's Low altitude
SystemGroup=SG_Dipping_Sonar
ModuleType=Sensor

[SensorSystem3]
Type=Radar
SystemName=Seaspray
Mount=Dummy
ModuleType=Sensor

#---------- ESM ----------
