[MoveMissileDown]
UseReverseLauncherPositionOffsets=True  // optional, if true means that it uses the reverse launcher position offsets from the ammunition file in section [Launchers]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionZ1=0           // can be 0 here as we use the missile specific positions from the ammunition file from section [Launchers]
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=1                // time in seconds - here for the end
PositionZ2=0           // can be 0 here as we use the missile specific positions from the ammunition file from section [Launchers]
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry
