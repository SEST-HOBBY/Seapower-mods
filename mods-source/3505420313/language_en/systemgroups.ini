#---------------------------------------- Land Guns ----------------------------------------

#---------------------------------------- Naval Guns ----------------------------------------
OTO135=OTO-Ansaldo 135|135mm/45 OTO-Ansaldo|The OTO-Ansaldo 135mm guns are part of the last generation of a handfull of guns in this caliber range designed and produced during the cold war. Being a further development of the WWII 135mm caliber used by Italy this new gun is fed by a fully automatic loading system and controlled by a modern radar-based fire control system, enabling it to function as a lethal dual-purpose weapon. The only ship to carry these guns would be the converted guided missile cruiser Guiseppe Garibaldi.
OTO127=OTO-Melara Compact|127mm/54 OTO-Melara Compact|The OTO-Melara Compact is an Italian dual-purpose mount and one of the most wide-spread naval guns in the world. Developed in the 1970s the OTO-Melara Compact is a modern system with a fully automatic loading mechanism and controlled remotely from a central console and by a single crew member. 
OTO76=Allargato|76.2mm/62 Allargato|The Allargato was developed in the 1960s as the first dual-purpose mount in line of the now famous Italian 76.2mm naval guns, laying the groundwork for wide-spread use of later models among countless navies across the globe. It is fed by a fully automatic loading system for a very high rate of fire and controlled remotely from the ship's CIC.
OTO76_SR=OTO-Melara SR|76.2mm/62 OTO-Melara Super Rapido|The OTO-Melara Super Rapido is an improved, faster-firing version of OTO-Melaras 76.2mm Compact turret designed specifically for close-in missile defense. Thanks to lightened moving parts, a heavily optimized loading system and improved ammunition the Super Rapido is capable of achieving an even higher fire-rate 120 round per minute. Due to this it is considered an even more effective missile defense weapon than OTO-Melaras own DARDO system.

Breda_Twin_40mm_L/70=Breda Type 106|40mm/70 Breda Type 106|
CALIBRO50=M2 Browning|The legendary Ma Deuce is one of the longest serving machine guns in existence, which is a testament to the greatness of its design.

#---------------------------------------- CIWS ----------------------------------------
Dardo=Dardo|40mm/70 OTO-Melara Compact|The OTO-Melara Compact is the actual weapon component of the Dardo close-in weapon system complex. Utilizing two fast-firing OTO-Breda 40mm guns developed from the famous 40mm Bofors AA gun it is the primary CIWS of the Marina Militare and a number of export customers.

#---------------------------------------- Aircraft Guns ----------------------------------------
BK-27=Mauser BK-27