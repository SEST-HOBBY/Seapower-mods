Aspide=Albatros|Albatros launcher|The Albatros is an Italian surface-to-air missile system based on the US Navy's Mk. 29 Sea Sparrow system. It launches the Aspide missile, a domestically produced and significantly improved version of the RIM-7 Sea Sparrow. Unlike the Mk. 29 the Albatros launcher features its very own automatic loading system, marking a giant leap in capability compared to the manual loading required by its American relative.

