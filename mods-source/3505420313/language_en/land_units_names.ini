[ei_aaa_sidam]
Type=SPAAG
Default=SIDAM 25,SIDAM 25
DefaultDescription=The SIDAM (Italian Mobile Air Defense System) is a SPAAG based on the M113 chassis similarly to the M163, but featuring four Oerlikon KBA 25 mm guns. The system tracks target with a laser rangefinder, a thermal camera and a digital computer, but the lack of a radar makes operations in adverse climate difficult. It was planned to have one SIDAM for every four-tank platoon, way more than other contemporary european armies. The project likely killed the OTOMATIC.
Variant1=SIDAM 25,SIDAM 25

