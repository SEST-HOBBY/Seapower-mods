[mm_ssbn_archimede]
Type=SSBN,Ballistic Missile Submarine
Default=Archimede-class,Archimede
DefaultDescription=Alongside the 1962 project for a nuclear attack submarine the Italian navy considered the establishment of a domestic nuclear deterrence capability. The resulting design for an SSBN manifested as a lengthened version of the contemporary Marconi class SSN (itself based on the American Skipjack class SSN). Due to this heritage the SSBN project appeared somewhat similar in looks to the George Washington class SSBNs in service with the US navy. The class was intended to carry the indigenous ALFA ballistic missile which was also intended for the converted guided missile cruiser Guiseppe Garibaldi. The project was cancelled well into its design process due to the US refusing to share key technologies (chief among which was the provision of the nuclear reactor) with the Italian navy and the signing of the Treaty on the Non-Proliferation of Nuclear Weapons by Italy in 1968.
Variant1=(S 530) Archimede,Archimede
Variant2=(S 531) Galileo Galilei,Galileo Galilei 
Variant3=(S 532) Leonardo da Vinci,Leonardo da Vinci
Variant4=(S 533) Galileo Ferraris,Galileo Ferraris