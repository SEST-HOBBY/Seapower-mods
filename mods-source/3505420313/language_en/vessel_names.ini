[ -------------- Cruisers --------------- ]
[mm_cg_garibaldi]
Type=CG,Missile Cruiser
Default=Duca degil Abruzzi-class,Duca degil Abruzzi
DefaultDescription=The Duca degil Abruzzi class is a class of two light cruisers built for the Regia Marina in the mid 1930s. Both ships survived WWII and went on to enter service with the new Republic's Marina Militare. The second ship in class, Giuseppe Garibaldi, was selected for a major refit in the late 1950s to become the first guided missile cruiser in service with a European navy. From 1959 to 1961 she was modified with an entirely new superstructure, magazine area and a launcher for the American RIM-2 Terrier missile and a modern sensor suit geared towards long-range airspace surveillance. Uppon re-entering service Giuseppe Garibaldi became the flagship of the Marina Militare and served as a long-range area-defense asset.
Variant1=(C 551) Giuseppe Garibaldi,Garibaldi

[mm_cgh_andrea_doria]
Type=CGH,Missile Cruiser
Default=Andrea Doria-class,Andrea Doria
DefaultDescription=The Andrea Doria class is the first class of large surface combatants designed and built domestically by Italy following WWII, entering service in the mid 1960s. They are large anti-submarine and anti-air area defense platforms, carrying four medium-weight ASW helicopters in a large hangar and the US-made RIM-2 Terrier surface-to-air missile system. Another stand-out feature of the class is the large number of 76mm guns, a design choice taken in 1958 after the Italian navy determined that only guns of this caliber were adequate for point blank air defence. In service the Andrea Dorias would serve as cores of ASW task forces patrolling the Mediterranean Sea to locate and destroy Soviet and Yugoslav submarines. The class was modernized in the late 1970s, receiving electronic warfare equipment and an upgraded radar suit. Additionally their Terrier SAMs were replaced with the SM-1ER.
Variant1=(C 553) Andrea Doria,Andrea Doria
Variant2=(C 554) Caio Duilio,Caio Duilio

[mm_cgh_vittorio_veneto_69]
Type=CGH,Missile Cruiser
Default=Vittorio Veneto-class,Vittorio Veneto
DefaultDescription=The Vittorio Veneto is the sole ship of her class built in the mid 1960s and entering service in 1969. Following their experience with the Andrea Doria class the Marina Militare determined that a larger platform was needed to fulfill the required roles, leading to the construction of the Vittorio Veneto. Compared to her predecessors the Veneto has significantly increased displacement to acommodate a below-deck hangar with an elevator and an enlarged magazine for the MK 10 launcher. Originally the Marina Militare planned to build two Vittorio Venetos, but the second ship of the class (to be called 'Italia') was cancelled.
Variant1=(C 550) Vittorio Veneto,Vittorio Veneto

[mm_cgh_vittorio_veneto]
Type=CGH,Missile Cruiser
Default=Vittorio Veneto-class,Vittorio Veneto
DefaultDescription=The Vittorio Veneto is the sole ship of her class built in the mid 1960s and entering service in 1969. Following their experience with the Andrea Doria class the Marina Militare determined that a larger platform was needed to fulfill the required roles, leading to the construction of the Vittorio Veneto. Compared to her predecessors the Veneto has significantly increased displacement to acommodate a below-deck hangar with an elevator and an enlarged magazine for the MK 10 launcher. Originally the Marina Militare planned to build two Vittorio Venetos, but the second ship of the class (to be called 'Italia') was cancelled. Between 1981 and 1984 Vittorio Veneto underwent a modernization which saw her being fitted with three Dardo CIWS turrets and launchers for Otomat missiles. Additionally her Terrier SAMs were replaced with the SM-1ER.
Variant1=(C 550) Vittorio Veneto,Vittorio Veneto

[mm_cgh_vittorio_veneto_91]
Type=CGH,Missile Cruiser
Default=Vittorio Veneto-class,Vittorio Veneto
DefaultDescription=The Vittorio Veneto is the sole ship of her class built in the mid 1960s and entering service in 1969. Following their experience with the Andrea Doria class the Marina Militare determined that a larger platform was needed to fulfill the required roles, leading to the construction of the Vittorio Veneto. Compared to her predecessors the Veneto has significantly increased displacement to acommodate a below-deck hangar with an elevator and an enlarged magazine for the MK 10 launcher. Originally the Marina Militare planned to build two Vittorio Venetos, but the second ship of the class (to be called 'Italia') was cancelled. Starting in 1991 Vittorio Veneto carried ASH-3Ds which had been upgraded with the Seaspray 2000 radar and Marte Mk. 2/S missiles.
Variant1=(C 550) Vittorio Veneto,Vittorio Veneto

[ -------------- Destroyers --------------- ]
[mm_ddg_audace]
Type=DDG,Destroyer
Default=Audace-class,Audace
DefaultDescription=The Audace-class destroyers were two guided missile destroyers built for the Italian Navy during the Cold War. An improvement of the Impavido class, these ships were designed for area air defence and also had a heavy gun armament. They hull was more capable to resist high sea conditions, incorporating an aft superstructure used to accommodating two AB-212 anti-submarine warfare (ASW) helicopters. This gave the vessels an ASW capability, with improved sonars and torpedo tubes.In order to perform ASW tasks, the Marina Militare opted for A.184 wired torpedoes instead of the ASROC missile. There was not a real CIWS system on board, relating only to the massive firepower of artilleries, which still left a blindspot in the aft section.
Variant1=(D 550) Ardito,Ardito
Variant2=(D 551) Audace,Audace

[mm_ddg_audace_88]
Type=DDG,Destroyer
Default=Audace-class,Audace
DefaultDescription=The Audace-class destroyers were two guided missile destroyers built for the Italian Navy during the Cold War. An improvement of the Impavido class, these ships were designed for area air defence and also had a heavy gun armament. They hull was more capable to resist high sea conditions, incorporating an aft superstructure used to accommodating two AB-212 anti-submarine warfare (ASW) helicopters. This gave the vessels an ASW capability, with improved sonars and torpedo tubes.In order to perform ASW tasks, the Marina Militare opted for A.184 wired torpedoes instead of the ASROC missile. There was not a real CIWS system on board, relating only to the massive firepower of artilleries, which still left a blindspot in the aft section. In 1988-1989 they underwent extensive modernisations: it included the replacement of one 127 mm gun turrets and also the A.184 torpedoes with new weapons: a Teseo SSM system and an eight-cell Albatros Aspide SAM launcher (directly replacing the 127mm turret). The four 76/62 mm guns remained, but the Compact model was replaced by 76/62 Super Rapido.
Variant1=(D 550) Ardito,Ardito
Variant2=(D 551) Audace,Audace

[mm_ddgh_durand_de_la_penne]
Type=DDG,Destroyer
Default=Luigi Durand de la Penne-class,Luigi Durand de la Penne
DefaultDescription=The Luigi Durand de la Penne-class started construction very late into the cold war, entering service in the early 1990s to replace the aging Impavido class destroyers. It improves even further on the multi-purpose destroyer profile previously embodied by the Audace class by carrying a large number of anti-ship missiles by design and featuring enlarged and separated hangar facilities for their helicopters. Furthermore the arrangement of the OTO-Melara 76mm guns was revised to prevent deadzones as on the Audace class. The class takes its name from Luigi Durand de la Penne, an Italian admiral and naval diver who led a group of six frogmen into the port of Alexandria in 1941, sinking two British battleships and damaging a destroyer and a tanker.
Variant1=(D 560) Luigi Durand de la Penne,Luigi Durand de la Penne
Variant2=(D 561) Francesco Mimbelli,Francesco Mimbelli

[mm_ddgh_durand_de_la_penne_02]
Type=DDG,Destroyer
Default=Luigi Durand de la Penne-class,Luigi Durand de la Penne
DefaultDescription=The Luigi Durand de la Penne-class started construction very late into the cold war, entering service in the early 1990s to replace the aging Impavido class destroyers. It improves even further on the multi-purpose destroyer profile previously embodied by the Audace class by carrying a large number of anti-ship missiles by design and featuring enlarged and separated hangar facilities for their helicopters. Furthermore the arrangement of the OTO-Melara 76mm guns was revised to prevent deadzones as on the Audace class. The class takes its name from Luigi Durand de la Penne, an Italian admiral and naval diver who led a group of six frogmen into the port of Alexandria in 1941, sinking two British battleships and damaging a destroyer and a tanker.
Variant1=(D 560) Luigi Durand de la Penne,Luigi Durand de la Penne
Variant2=(D 561) Francesco Mimbelli,Francesco Mimbelli

[ -------------- Frigates --------------- ]
[mm_ff_canopo_50]
Type=FF,Frigate
Default=Centauro-class,Centauro
DefaultDescription=The Centauro class was the first series of ships designed and built domestically by Italy following WWII. While originally being classified as destroyers intended for escort duties with a focus on anti-submarine warfare and AA defense with their sophisticated, yet troublesome, autoloading dual-purpose turrets, they would be reclassified as frigates in the 1960s. Construction of Centauro and Canopo was delayed significantly due to a lack of funding, which led to Cigno and Castore being paid for by the United States under the Mutual Defense Assistance Program.
Variant1=(D 570) Canopo,Canopo
Variant2=(D 571) Centauro,Centauro
Variant3=(D 572) Cigno,Cigno
Variant4=(D 573) Castore,Castore

[mm_ff_bergamini_60]
Type=FF,Frigate
Default=Bergamini-class,Bergamini
DefaultDescription=The Bergamini-class comprised four ships designed for ASW operations and all got their names through notable Italian naval officers. Apart from their anti-submarine weaponry, they were the first escort ships to embark a helicopter, signifying the desire to modernize the fleet of the time. While initially carrying the small AB.47J helicopter, which provided limited ASW capabilites, the ships were later converted to carry the AB.204 by enlarging the flight deck, removing the aft 76.2mm gun.
Variant1=(F 593) Carlo Bergamini,Carlo Bergamini
Variant2=(F 594) Virginio Fasan,Virginio Fasan
Variant3=(F 595) Carlo Margottini,Carlo Margottini
Variant4=(F 596) Luigi Rizzo,Luigi Rizzo

[mm_ff_alpino]
Type=FF,Frigate
Default=Alpino-class,Alpino
DefaultDescription=The Alpino class frigates are a pair of advanced ASW ships built for the Italian Navy during the late 1960s. They were originally designed as prototypes for a larger class of ASW vessels and featured several innovative technologies for their time such as a CODOG propulsion system, making them among some of the first frigates in the world to use such a configuration. Though only two ships of the type were built the class would serve as important testbeds for a number of experimental systems in the 1990s before being decommissioned in the mid-2000s.
Variant1=(F 580) Alpino,Alpino
Variant2=(F 581) Carabiniere,Carabiniere

[mm_ff_alpino_85]
Type=FF,Frigate
Default=Alpino-class,Alpino
DefaultDescription=The Alpino class frigates are a pair of advanced ASW ships built for the Italian Navy during the late 1960s. They were originally designed as prototypes for a larger class of ASW vessels and featured several innovative technologies for their time such as a CODOG propulsion system, making them among some of the first frigates in the world to use such a configuration. Though only two ships of the type were built the class would serve as important testbeds for a number of experimental systems in the 1990s before being decommissioned in the mid-2000s. Between 1984 and 1985 the class underwent a modernization which saw their AN/SQA-10 variable depth sonars being deactivated and the modern Newton electronic warfare suite being installed.
Variant1=(F 580) Alpino,Alpino
Variant2=(F 581) Carabiniere,Carabiniere

[mm_ffg_lupo]
Type=FFG,Guided Missile Frigate
Default=Lupo-class,Lupo
DefaultDescription=The Lupo class is a multi-purpose frigate built in the mid 1970s as part of a naval expansion program intended to bolster the Italian navy in the face of increasing Soviet naval presence in the Mediterranean Sea. They are equipped with a modern sensor suit and carry a large number of Otomat anti-ship missiles, even though they are intended to primarily serve as escorts.
Variant1=(F 564) Lupo,Lupo
Variant2=(F 565) Sagittario,Sagittario
Variant3=(F 566) Perseo,Perseo
Variant4=(F 567) Orsa,Orsa

[mm_ffg_maestrale]
Type=FFG,Guided Missile Frigate
Default=Maestrale-class,Maestrale
DefaultDescription=The Maestrale class is an enlarged relative of the Lupo class built in the late 1970s. Like its predecessor the Maestrale is designed as multi-purpose frigate with an emphasis on anti-submarine warfare. Thanks to her increased displacement she is able to accommodate more ASW systems, being equipped with a varial-depth sonar, two launchers for heavyweight torpedoes and a larger hangar for two helicopters. The launchers for the heavyweight torpedoes were removed later in the classes service life.
Variant1=(F 570) Maestrale,Maestrale
Variant2=(F 571) Grecale,Grecale
Variant3=(F 572) Libeccio,Libeccio
Variant4=(F 573) Scirocco,Scirocco
Variant5=(F 574) Aliseo,Aliseo
Variant6=(F 575) Euro,Euro
Variant7=(F 576) Espero,Espero
Variant8=(F 577) Zeffiro,Zeffiro

[ -------------- Missile boats --------------- ]
[mm_phm_sparviero]
Type=PTG,Missile Boat
Default=Sparviero-class,Sparviero
DefaultDescription=The Sparviero class is a hydrofoil missile boat designed collaboratively by Boeing, the Italian government's naval research branch and the Italian commercial hydrofoil builder Carlo Rodriquez in the late 1960s. They were planned to serve as fast patrol vessels and interceptors, carrying out quick strikes against enemy forces in and around Italy's territorial waters. After Sparviero herself was built as a trials unit based on Boeing's Tucumcari hydrofoil the Italian navy planned to order an additional four ships and two US-made Pegasus class hydrofoils. Following the abandonment of the NATO-wide standardisation of the Pegasus class however this plan was scrapped, so when further orders were finally placed in 1977 it consisted of exclusively six Sparvieros instead.
Variant1=(P 420) Sparviero,Sparviero
Variant2=(P 421) Nibbio,Nibbio
Variant3=(P 422) Falcone,Falcone
Variant4=(P 423) Astore,Astore
Variant5=(P 424) Grifone,Grifone
Variant6=(P 425) Gheppio,Gheppio
Variant7=(P 426) Condor,Condor

[ -------------- Aircraft carriers --------------- ]
[mm_lha_garibaldi]
Type=CVL,Aircraft Carrier
Default=Giuseppe Garibaldi-class,Garibaldi
DefaultDescription=The Giuseppe Garibaldi is the first through-deck aircraft carrier in service with the Italian navy and the fourth ship to be named after the Italian national hero. Originally designed as a "Sea Control Ship" in the mid 1970s she was planned to be a flat-top helicopter carrier to replace the two aging Andrea Doria class cruisers while also providing a command and control platform for NATO forces. In the late 1970s however her design was modified to include a ski-jump ramp as the navy considered operating V/STOL aircraft later in the carriers' life.
Variant1=(C 551) Giuseppe Garibaldi,Garibaldi

[mm_lha_garibaldi_91]
Type=CVL,Aircraft Carrier
Default=Giuseppe Garibaldi-class,Garibaldi
DefaultDescription=The Giuseppe Garibaldi is the first through-deck aircraft carrier in service with the Italian navy and the fourth ship to be named after the Italian national hero. Originally designed as a "Sea Control Ship" in the mid 1970s she was planned to be a flat-top helicopter carrier to replace the two aging Andrea Doria class cruisers while also providing a command and control platform for NATO forces. In the late 1970s however her design was modified to include a ski-jump ramp as the navy considered operating V/STOL aircraft later in the carriers' life. In 1991 the Italian navy modernized its fleet of ASH-3D helicopters with the Seaspray 2000 surface-search radar and the Marte 2/S anti-ship missile, basing them off of their large helicopter carrying surface combatants such as the Garibaldi.
Variant1=(C 551) Giuseppe Garibaldi,Garibaldi

[mm_lha_garibaldi_94]
Type=CVL,Aircraft Carrier
Default=Giuseppe Garibaldi-class,Garibaldi
DefaultDescription=The Giuseppe Garibaldi is the first through-deck aircraft carrier in service with the Italian navy and the fourth ship to be named after the Italian national hero. Originally designed as a "Sea Control Ship" in the mid 1970s she was planned to be a flat-top helicopter carrier to replace the two aging Andrea Doria class cruisers while also providing a command and control platform for NATO forces. In the late 1970s however her design was modified to include a ski-jump ramp as the navy considered operating V/STOL aircraft later in the carriers' life. In 1989 Italy lifted a long-standing law that permitted only the Italian Air Force to operate fixed-wing aircraft, allowing the Marina Militare to acquire the US-made AV-8B+ Harrier II for Garibaldi in 1994, providing the navy with carrier-borne fixed-wing capabilities for the first time in its history.
Variant1=(C 551) Giuseppe Garibaldi,Garibaldi

[ -------------- Submarines --------------- ]
[mm_ss_lwt_23]
Type=SS,Midget Submarine
Default=LWT 23-4-class,LWT 23-4
DefaultDescription=The LWT 23-4 is an midget submarine designed by the small firm Maritalia based on a new construction method conceived by Italian inventor Giunio Santi in the 1970s. Santi envisioned a submarine built out of lengths of pipe welded togeher like a series of donuts. These would store oxygen, which could be used to run a diesel engine while the submarine was underwater. Combined with filtering and storing the exhaust gases in the same tubular hull, this allowed true Air Independant Propulsion (AIP) with no exhaust emissions at all. Based on this idea Maritalia designed the GST100 class of midget submarines for export in the mid to late 1980s, including the LWT 23-4 and LWT 27 designs. Being extremely quiet and having an extreme submerged range for their size these submarines were intended for covert special operations and ambushes. However, the end of the Cold War combined with commercial factors consigned these designs to the drawing board.
Variant1=(S 540) Alluminio,Alluminio
Variant2=(S 541) Amianto,Amianto
Variant3=(S 542) Bario,Bario
Variant4=(S 543) Cadmio,Cadmio
Variant5=(S 544) Cromo,Cromo
Variant6=(S 545) Ferro,Ferro
Variant7=(S 546) Fosforo,Fosforo
Variant8=(S 547) Iridio,Iridio

[mm_ss_longobardo]
Type=SS,Patrol Submarine
Default=Longobardo-class,Longobardo
DefaultDescription=The GUPPY III conversion was the ultimate evolution of the Greater Underwater Propulsion Power Program for WWII-era fleet submarines. Undertaken in the early 1960s, this modernization added a 15-foot hull extension forward of the control room to house advanced sonar processing equipment (PUFFS passive ranging sonar) and additional crew facilities. This, along with the previous GUPPY upgrades like a snorkel, streamlined sail and hull, and significantly larger battery capacity, created the most capable diesel-electric submarines in the US Navy until the arrival of the Barbel-class. These boats served as potent anti-submarine warfare assets well into the 1970s.
Variant1=(S 501) Primo Longobardo,Longobardo
Variant2=(S 502) Gianfranco Gazzana Priaroggia,Priaroggia

[mm_ss_toti]
Type=SS,Patrol Submarine
Default=Toti-class,Toti
DefaultDescription=The Toti class submarines were the first domestically designed and constructed Italian submarines following WWII. They are primarily intended as nimble "hunter-killer" submarines to counter Soviet submarines operating in the Mediterranean Sea in the latter half of the 1960s, using their small size to stay hidden while tracking the enemy and launching ambushes. While performing quite well overall they were greatly limited in their intended capabilities early on in their service life, due to the Marina Militare lacking a dedicated anti-submarine torpedo until arrival of the modern dual-purpose A.184 torpedo in 1974.
Variant1=(S 505) Attilio Bagnolini,Bagnolini
Variant2=(S 506) Enrico Toti,Toti
Variant3=(S 513) Enrico Dandolo,Dandolo
Variant4=(S 514) Lazzaro Mocenigo,Mocenigo

[mm_ss_sauro]
Type=SS,Patrol Submarine
Default=Sauro-class (Batch I & II),Sauro
DefaultDescription=The Sauro class is the second generation of Italian diesel-electric attack submarines complementing the Toti class in the early 1970s. They are equipped with modern integrated sensor systems and carry the new A.184 dual-purpose torpedo, making them an immense jump in capability over the Totis. The class was built in four batches, with the first two consisting of almost identical submarines built between 1974 and 1980.
Variant1=(S 518) Nazario Sauro,Sauro
Variant2=(S 519) Carlo Freccia di Cossato,Cossato
Variant3=(S 520) Leonardo da Vinci,da Vinci
Variant4=(S 521) Guglielmo Marconi,Marconi

[mm_ssn_marconi]
Type=SSN,Attack Submarine
Default=Marconi-class,Marconi
DefaultDescription=Starting in 1962 the Italian navy considered accquiring a nuclear attack submarine for their fleet. Subsequently design work started on the soon to be named "Marconi" SSN, inspired by the American Skipjack class of nuclear attack submarines. The Marconi was designed with the same iconic tear-drop shaped hull and was intended to utilize the same S5W reactor as the Skipjack. A stand-out feature of the Marconi is a large special operations bay located in the place of the upper bow sonar array on the Skipjack, capable of hosting a team of divers and their scooters. The project was cancelled well into its design process due to the US refusing to share key technologies (chief among which was the provision of the nuclear reactor) with the Italian navy and the signing of the Treaty on the Non-Proliferation of Nuclear Weapons by Italy in 1968.
Variant1=(S 501) Guglielmo Marconi,Marconi
Variant2=(S 502) Reginaldo Giuliani,Giuliani
Variant3=(S 515) Agostino Barbarigo,Barbarigo
Variant4=(S 516) Alessandro Malaspina,Malaspina

