[AmmunitionNames]
# ------------------ AAM ------------------
usaf_aim-120a=AIM-120A,AAMRAM,AAM,The AIM-120 AAMRAM is the standard beyond-visual-range missile in service with the United States. Developed in the 1980s it is the follow-on to the AIM-7 Sparrow, being a faster, more compact and lighter missile with a very capable radar seeker and advanced on-board electronics. After being launched the AAMRAM receives guidance via datalink from the launching aircraft until entering its terminal phase, upon which the missile severs the link and turns on its on-board seeker to acquire and hit its target.

it_aspide_1=Aspide Mk. 1A,,SAM,The Aspide missile is an Italian medium range surface-to-air missile, derived from the American Sparrow missile. Derived from the AIM-7E, this missile features an improved motor, which increases range and speed, and also features a vastly improved monopulse seeker head, which allows for low-altitude firing and advances in ECCM performance.
am_aspide_1_air=Aspide Mk. 1A,,AAM,The Aspide missile is an Italian medium range surface-to-air missile, derived from the American Sparrow missile. Derived from the AIM-7E, this missile features an improved motor, which increases range and speed, and also features a vastly improved monopulse seeker head, which allows for low-altitude firing and advances in ECCM performance.
am_slyflash=Skyflash,,AAM,The Skyflash is an improved variant of the AIM-7E developed in Great Britain. The most significant upgrade is an inverse monopulse seeker replacing the original continuous-wave model used on the Sparrow, significantly increasing accuarcy and ECM resistance. Further changes include a more powerful engine, adapted control surfaces and a new radar fuze.

# ------------------ SAM ------------------
mm_aspide=Aspide 2000,,SAM,The Aspide is an Italian development of the AIM-7E previously produced under license. Compared to the Sparrow the Aspide replaces the continuous-wave seeker with a inverse monopulse model, significantly increasing accuarcy and ECM resistance. Furthermore the missile features a new warhead, more powerful engine and closed-loop hydraulics for better down-range maneuverability.
mm_mistral=Mistral,,SAM

# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------
mm_otomat_mk2_blk1=Otomat MK 2,Block I,ASM,The Otomat is a subsonic anti-ship missile developed in the late 1960s as the primary ASM for the Italian navy. While other well-known anti-ship missiles such as the Harpoon and the Exocet are powered by a rocket motor the Otomat is powered by a turbofan, a decision taken to allow for a higher range and a larger payload capacity compared to other missiles. The Otomat Mk. 1 was originally limited in its maximum engagement range by the radar horizon of the launching ship, a shortcoming which the new Ototmat Mk. 2 Block I solved in the late 1970s with the introduction of a datalink for over-the-horizon targeting.
mm_otomat_mk2_blk2=Otomat MK 2,Block II,ASM,The Otomat is a subsonic anti-ship missile developed in the late 1960s as the primary ASM for the Italian navy. While other well-known anti-ship missiles such as the Harpoon and the Exocet are powered by a rocket motor the Otomat is powered by a turbofan, a decision taken to allow for a higher range and a larger payload capacity compared to other missiles. The Otomat Mk. 2 Block II is a 1980s upgrade of the missile which introduces folding wings to the design, enabling storage in 50% smaller containers and therefore allowing surface combatants to carry more missiles.
mm_marte=Marte MK 2/S,,ASM,The Marte is a medium range anti-ship missile developed in the mid 1970s by Sistemi Elettronici in Italy as the successor of the Sea Killer missile. Compared to its predecessor the Marte has a much improved range, partially thanks to dropping the beam-riding guidance method in favor of using the active radar seeker of the Otomat missile. The Marte Mk. 2/S is the helicopter-launched version of the Marte Mk. 2 which entered service with the Marina Militare in 1990.
am_as34=AS.34,Kormoran,ASM,The Kormoran is a medium range anti-ship missile developed jointly by France and Germany and carried by West German F-104 Starfighters and Panavia Tornados. The Bundeswehr originally evaluated the US made AGM-12 Bullpup and the French AS.30 for use in the anti-shipping role, but after both missiles failed to meet expectations the German firm of MBB and French Aérospatiale cooperated to develop a new missile based on the AS.33 in the mid 1960s. The Kormoran is broadly similar to the Exocet in looks and capabilities due to being developed at the same time.

#-----------Land Strike only missiles---------
mm_alfa=Alfa,,MRBM,The Alfa ballistic missile is the result of Italian efforts to develop a domestic nuclear detterence in the mid 1960s. Originally Italy sought to base its nuclear deterrence around the US-made Polaris SLBM, which would be carried by large surface combatants which had already been built with facilities for the missiles in the mid and late 1960s. However, the United States refused to provide the Polaris missile, which caused Italy to start development of a domestic medium-range ballistic missile from the ground up in the early 1970s. The program was progressing well until the ratification of the Treaty on the Non-Proliferation of Nuclear Weapons by Italy in 1975 put an end to all Italian nuclear programs.

usn_agm-65d=AGM-65D,Maverick,AGM

# ---------- Anti-sub  Missilies ----------
mm_milas=Otomat MILAS,,ASW Missile,The Otomat MILAS is a long-range anti-submarine stand-off missile based on the Otomat anti-ship missile. Originally developed jointly by Italy and France MILAS consists of an almost unchanged fuselage of the Otomat missile which was supposed to carry the upcoming A.290 (for Italy) and Murene (for France) light-weight ASW torpedos in its nose. The two torpedo programs were merged in 1991 however, producing the MU90 ASW torpedo which would now also be carried by the MILAS. The Marina Militare is the only user of the missile since 2002, as France decided in 1998 that it would not procure the system once development concluded.

