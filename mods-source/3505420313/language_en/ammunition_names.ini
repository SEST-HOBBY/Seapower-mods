# --------------- Torpedoes ---------------
mm_g6e=G6e,,ASuW Torpedo,The G6e is a modified version of the German WWII G7e electrical straight running torpedo. Motivated by the need to arm the upcoming Toti class submarines the Italian company Whitehead-Motofides modified the G7e by shortening it by a meter, introducing more power-dense silver-zinc batteries and mounting a passive acoustic seeker. Due to being a stop-gap solution pending the arrival of the dual-purpose A.184 torpedo only two-dozen G6e were produced until the mid 1960s and distributed among the Toti class submarines.
mm_a182=A.182,,ASW Torpedo,The A.182 is Italies first domestically designed and produced wire-guided heavyweight ASW torpedo. Originally intended to use the three-dimensional P3 acoustic seeker produced by Atlas Werke in Germany it would enter service with the two-dimensional P2 seeker instead, requiring the weapon to be steered to its target depth by an operator with a joystick. It was used exclusively on the Centauro class frigates, being launched via two trays at midships from which crewmembers would push the weapons overboard into the water.
mm_a184=A.184,,ASuW/ASW Torpedo,The A.184 is the standard heavyweight dual-purpose torpedo of the Italian navy. Until its introduction in 1974 the Italian navy was still armed with legacy WWII torpedoes for anti-ship warfare and possessed no dedicated heavyweight ASW torpedo. This was a problem especially for the new Toti class submarines which had been built as dedicated submarine hunters in the mid 1960s, without there actually being a suitable ASW torpedo in the navies arsenal. Subsequently work started on an improvement of the A.182 torpedo, resulting in the A.184.
mm_a184_mod1=A.184 Mod.1,,ASuW/ASW Torpedo,The A.184 is the standard heavyweight dual-purpose torpedo of the Italian navy. Starting in 1978 the torpedo was upgraded with an improved electronic guidance system to increase resistance against countermeasures and improve reliability.
mm_a184_mod2=A.184 Mod.2,,ASuW/ASW Torpedo,The A.184 is the standard heavyweight dual-purpose torpedo of the Italian navy. The Mod.2 variant is an engagement envelope expansion upgrade for the A.184 which aims to improve its ability to combat the new generation of Soviet attack submarines, elevating its capabilities closer to newer and faster torpedoes fielded by other NATO members in the mid 1980s.
mm_a184_mod3=A.184 Mod.3,,ASuW/ASW Torpedo,The A.184 is the standard heavyweight dual-purpose torpedo of the Italian navy. The Mod.3 variant of this torpedo utilizes a new and advanced all-digital fire-control system and seeker capable of multi-target tracking and with enhanced anti-countermeasure capabilities. Additionally it features a new digital two-way datalink.
mm_si270_tipo_i=S.I. 270/533,,ASuW Torpedo,The S.I. 270/533X7,2 Tipo I is an Italian WWII wet-heater straight running torpedo.
mm_a244_ship=A.244,,ASW Torpedo,The A.244 is a lightweight anti-submarine torpedo developed by Whitehead Alenia in Italy as a replacement for the Mk. 44 torpedo. It shares many design similarities with the older weapon such as the mono-frequency seeker, but improves in key areas such as speed and endurance.
mm_a244_air=A.244,,ASW Torpedo,The A.244 is a lightweight anti-submarine torpedo developed by Whitehead Alenia in Italy as a replacement for the Mk. 44 torpedo. It shares many design similarities with the older weapon such as the mono-frequency seeker, but improves in key areas such as speed and endurance.
mm_a244s_ship=A.244/S,,ASW Torpedo,The A.244/S is an improved variant of the A.244 lightweight anti-submarine torpedo originally developed by Whitehead Alenia as a replacement for the Mk. 44 torpedo. It was introduced in 1984 and most notably differs from the base model by using the new CIACIO-S triple frequency seeker, significantly enhancing the weapons detection capabilities.
mm_a244s_air=A.244/S,,ASW Torpedo,The A.244/S is an improved variant of the A.244 lightweight anti-submarine torpedo originally developed by Whitehead Alenia as a replacement for the Mk. 44 torpedo. It was introduced in 1984 and most notably differs from the base model by using the new CIACIO-S triple frequency seeker, significantly enhancing the weapons detection capabilities.
mm_a244s_mod1_ship=A.244/S Mod.1,,ASW Torpedo,The A.244/S is an improved variant of the A.244 lightweight anti-submarine torpedo originally developed by Whitehead Alenia in Italy as a replacement for the Mk. 44 torpedo. The mod. 1 upgrade of the weapon introduces a few engagement envelope improvements as well as a new seeker capable of using multiple pre-formed beams, the shape of which can be changed to suit acoustic conditions.
mm_a244s_mod1_air=A.244/S Mod.1,,ASW Torpedo,The A.244/S is an improved variant of the A.244 lightweight anti-submarine torpedo originally developed by Whitehead Alenia in Italy as a replacement for the Mk. 44 torpedo. The mod. 1 upgrade of the weapon introduces a few engagement envelope improvements as well as a new seeker capable of using multiple pre-formed beams, the shape of which can be changed to suit acoustic conditions.
mm_mu_90=MU90,Impact,ASW Torpedo,The MU90 is a Franco-Italian lightweight ASW torpedo produced by a consortium called "EuroTorp". It is the result of two separate projects from Italy (the A.290) and France (the Murène) to develop a new light ASW torpedo towards the end of the cold war. The MU90 is powered by a high-speed pump-jet engine and uses a very sophisticated dual-mode seeker with advanced anti-countermeasure capabilities.
mm_mu_90_ship=MU90,Impact,ASW Torpedo,The MU90 is a Franco-Italian lightweight ASW torpedo produced by a consortium called "EuroTorp". It is the result of two separate projects from Italy (the A.290) and France (the Murène) to develop a new light ASW torpedo towards the end of the cold war. The MU90 is powered by a high-speed pump-jet engine and uses a very sophisticated dual-mode seeker with advanced anti-countermeasure capabilities.

usn_mk14=MK 14 Mod 3,,ASuW Torpedo, The Mark 14 is a straight running heavyweight anti-ship torpedo which was developed before WWII. Although plagued with numerous flaws and reliabilty issues it entered mass production and became the standard heavyweight torpedo of the US Navy, with its kinks being gradually ironed out throughout the war. After WWII it remained in US service as the primary anti-ship torpedo beside the Mk. 16 until the arrival of the Mk. 48. The mod. 3 variant of the torpedo features a heavier warhead.
usn_mk16_mod8=MK 16 Mod 8,,ASuW Torpedo,The Mark 16 is a hydrogen-peroxide fueled torpedo developed from the US Navy's standard Mark 14 torpedo in use during WWII, incorporating a number of war-tested improvements. Due to high unit cost and the Mark 14's reliability issues being solved before the end of the war the torpedo was only produced in limited numbers, but remained the primary anti-ship torpedo of the US Navy alongside the Mk. 14 until the arrival of the Mk. 48. The mod. 8 variant of the torpedo combines the originally larger warhead of the Mk. 16 mod. 0 with the improved range of the Mk. 16 mod. 1.

# ------------------ Bombs -----------------
usn_gbu-12d=GBU-12D,,Guided Bomb
gre_mk_54=Mk. 54,,Depth Charge,US Made depth charge designed to be dropped from aircraft
am_kb44=KB 44,,Anti-Tank Cluster Bomblet,The Kleinbombe 44 is one of the submunitions carried by the MW-1 munitions dispenser developed in West Germany. It has a combined cluster and HEAT warhead intended to be used against unarmored or lightly armored targets such as APCs and parked aircraft.
am_stabo=STABO,,Anti-Runway Bomblet,The Startbahnbombe ("Runway bomb") is one of the submunitions carried by the MW-1 munitions dispenser developed in West Germany. It carries a two-stage shaped charge warhead of which the first charge detonates on impact to create a channel into the asphalt and the second explodes beneath the surface to create a cavity, making it much harder to repair.

