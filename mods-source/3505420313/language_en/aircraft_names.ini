DefaultDescription=The F-104 Starfighter is a supersonic interceptor manufactured in the United States as part of the "Century Series" of fighter aircraft and one of the most recognizable jets in aviation history. Built in the 1960s it was designed with an airframe as small and simple as possible while acheiving the maximum possible altitude and climb performance. The F-104S.ASA (Aggiornamento Sistemi d'Arma – "Weapon Systems Update") was developed by Italy in the early 1980s and is one of the very last variants of the Starfighter ever produced. Compared to its predecessor the F-104S.ASA is further upgraded with an on-board ECM system and the advanced NASARR R-21G/M1 radar, making it compatible with Italy's domestic Aspide SARH missile and the all-aspect AIM-9L Sidewinder.
