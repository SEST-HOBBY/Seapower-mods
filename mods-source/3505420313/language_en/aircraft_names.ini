[mm_av-8b_plus]
Type=Fighter
Default=AV-8B+ Harrier II,AV-8B+
DefaultDescription=The AV-8B+ Harrier II is the definitive version of the originally British Harrier V/STOL jet fighter. Shortly after the Night Attack program for the AV-8B (which resulted into the AV-8B (NA)) the Harrier II was further modified in the late 1980s to enhance its air-to-air combat capabilities. The AN/ASB-19 FLIR targeting system introduced on the AV-8B (NA) is replaced with the AN/APG-65 radar which was previously fitted to older F/A-18 Hornets, enabling the Harrier to carry advanced air-to-air missiles as well as search, identify and attack enemy aircraft completely independently for the first time in its service history. The resulting variant was designated AV-8B Plus and remains in service with the US Marine Corps and export customers such as Spain and Italy to this day.
Squadron1=AV-8B+ Gruppo Aerei Imbarcati,AV-8B+
Callsigns=Squadron1,Lupo

[am_tornado_ids]
Type=Attack
Default=Tornado IDS,Tornado IDS
DefaultDescription=The Panavia Tornado is a multirole strike aircraft developed by a tri-national collaboration between the Uinted Kingdom, West Germany and Italy under the Panavia consortium in the 1970s. Intended to replace aging strike aircraft like the F-104G and fill capability gaps such as the ones present in the Royal Airforce the Tornado manifested as a high performance, variable geometry strike aircraft capable of operating at exceptionally low altitude. The Tornado IDS is the main variant of the Tornado and features an advanced terrain-following radar and the ability to carry a wide range of conventional and precision-guided munitions, making it a formidable deep strike platform.
Squadron1=Tornado IDS 5° Stormo,Tornado IDS
Squadron2=Tornado IDS 36° Stormo,Tornado IDS
Callsigns=Squadron1,Veltro,Lampo,Luce,Laser|Squadron5,Lince,Strale

[am_tornado_adv]
Type=Fighter
Default=Tornado ADV,Tornado ADV
DefaultDescription=The Panavia Tornado is a multirole strike aircraft developed by a tri-national collaboration between the Uinted Kingdom, West Germany and Italy under the Panavia consortium in the 1970s. Intended to replace aging strike aircraft like the F-104G and fill capability gaps such as the ones present in the Royal Airforce the Tornado manifested as a high performance, variable geometry strike aircraft capable of operating at exceptionally low altitude. The Tornado ADV is the interceptor variant of the Tornado developed at the request of the United Kingdom, featuring recesses for the Skyflash SARH missile in its lower fuselage and a longer nose to house an advanced air-interception radar. Beside the Royal Airforce originally being the sole operator of the type the Italian airforce would lease 24 aircraft in 1993 as an interim solution to replace the retiring F-104S until the expected introduction of the Eurofighter Typhoon in the 2000s.
Squadron1=Tornado ADV 5° Stormo,Tornado ADV
Squadron2=Tornado ADV 36° Stormo,Tornado ADV
Callsigns=Squadron1,Veltro,Lampo,Luce,Laser|Squadron5,Lince,Strale

[am_f104g]
Type=Fighter
Default=F-104G,F-104G
DefaultDescription=The F-104 Starfighter is a supersonic interceptor manufactured in the United States as part of the "Century Series" of fighter aircraft and one of the most recognizable jets in aviation history. Built in the 1960s it was designed with an airframe as small and simple as possible while acheiving the maximum possible altitude and climb performance. The F-104G is an improved fighter-bomber variant of the Starfighter developed at the request of a number of foreign operators, featuring a strengthened fuselage and wings, the new NASARR F-15A radar and a Litton LN-3 inertial navigation system (the first on a production fighter). It is the most produced variant of the F-104 and the most common used by European operators such as Italy and West Germany.
