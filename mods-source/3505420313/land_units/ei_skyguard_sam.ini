[General]
UnitType=LandUnit
LandUnitSubType=AAA //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

AutoFlatten=False
MaskVegetation=True

Length=3.15                    // in meters
Beam=1.2                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=4  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=AAA
Tag=Ground+Vehicle+AntiAircraft

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=AAW

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Tiny

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0

[SensorSystem2] #FCR
Type=Radar
SystemName=RTN-30X
Mount=Dummy

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]
Type=Missile
SystemName=Skyguard_sam
#Sensors
AssociatedSensors=SensorSystem2
#Mount
Mount=body
IsMountRotatable=True
#Containers
ContainerBase=launcher
NumberOfContainers=1
Container1=launcher
AreContainersRotatable=True
#Angles
FiringArcs=-180,180
EngageOnlyInsideArc=True
ElevationArc=0,85
RestAngles=0,-15
LoadAngles=0,-15
#Loading
AssociatedMagazine=WeaponMagazine_Aspide
PreloadAmmunition=True
#Effects
#Other
Collider=coll_hitbox

[---------- WeaponMagazines ----------]
[WeaponMagazine_Aspide]
NumberOfAmmunitionTypes=1
Ammunition1=mm_aspide
Ammunition1_Count=12
Collider=Dummy
ModuleType=SmallMagazine

#Enemy units will use this local coordinates to aim their attacks to
[TargetingData]
NumberOfTargetPoints=1
TargetPointPosition1=0.0021,0.0226,-0.0059
TargetPointAssociatedSystems1=WeaponSystem1
TargetPointPriority1=High

