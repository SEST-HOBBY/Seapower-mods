############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
EngineAudioClip=audio/ships/Ship-Turbine-Small
EngineAudioPosition=0,0,0
EngineAudioRollOff=Logarithmic
EngineAudioDistance=1,20
EngineAudioPitchRange=0.4,1
EngineAudioVolume=1
EngineAudioAudibility=AboveAndBelow

