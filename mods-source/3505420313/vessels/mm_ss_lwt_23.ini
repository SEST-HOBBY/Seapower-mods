[General]
UnitType=Submarine
DefaultCameraDistance=0.7
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.0

Length=23.26                      // in meters
Beam=3.34                         // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[OpticalView]
Views=standard_periscope
DefaultView=standard_periscope

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=136               // in tons

MaxForwardVelocity=18.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=11.0
MaxBackwardVelocitySurfaced=4.0
MaxBackwardVelocity=6.0        // sets the max backward velocity
TelegraphVelocities=-6,0,3,5,10,15,18

BowUnderWater=2.5              // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=11.5            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.6                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=15.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=-1	//5.5                 // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=-0.055        // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=15.5            // in feet
CrushDepth=600                 // in feet

CavitationParameters=20,-100


#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=3.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
BaseNoise=94                    // base sound level in db at 1m distance
FlowNoise=0.8                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=20              // additional noise for cavitation in db
TargetReflectionStrength=8      // in dB for broad side
BladesCount=7                   //number of blades on vessel's propulsion systems
ElectricFrequency=60            //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

MachineryRaftingGeneration=4
PropellerType=Skewback

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_mm_ss_lwt_23

[---------- AI related ----------]
[AI]
UnitCostValue=3000            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=3
ASW_Capability=3

#Defence
#Special
Role=SS

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=420
AdditionalNoise=12        //Added to current noise level when running on this power
Collider=coll_engineroom

[AuxPowerSystem]
Type=Electric
HorsePower=420
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
Capacity=130000      //Range 20 miles at top underwater speed (17 knots)
DischargeRate=0.85    //Rate of discharging batteries. Lower values provide more range on low underwater speed on batteries
RechargeRate=1.2     //Capacity per second when charging batteries. When a unit goes at Standard telegraph setting or slower, the charge rate doubles
Collider=coll_battery_1

[PropulsionSystems]
############################################################
