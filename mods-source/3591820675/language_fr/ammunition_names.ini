[AmmunitionNames]
fr_r530=R.530,Matra R.530,AAM,Un missile air-air à autodirecteur radar semi-actif (SARH) de moyenne portée développé par la France. Utilisé sur des avions comme le F-8E(FN) pour des engagements hors de portée visuelle grâce au guidage radar. Ses performances et sa fiabilité étaient médiocres, avec un taux d’échec de 65 %, et la Marine nationale l’a retiré du service opérationnel en 1980.
fr_r530e=R.530E,Matra R.530E,AAM,Le Matra R.530E était la version à autodirecteur infrarouge (IR) du R.530.
usn_agm-12b=AGM-12B,Bullpup,AGM,L’AGM-12B est un missile air-surface à guidage radio fabriqué aux États-Unis, parmi les premiers de son genre. Il était guidé visuellement à l’aide d’un petit joystick. La variante B introduisit une plus grande charge militaire.
usn_aim-9c=AIM-9C,Sidewinder,AAM,Le AIM-9C Sidewinder est un missile air-air américain à autodirecteur radar semi-actif. La version Charlie est une particularité de la série, puisqu’il s’agit de la version à autodirecteur radar du modèle Delta, offrant ainsi une capacité d’engagement tous azimuts. Malheureusement, il s’agit toujours d’un missile des années 1960 doté d’un petit autodirecteur, donc la résistance au brouillage et la capacité de filtrage des parasites sont assez médiocres.
usn_aim-9g=AIM-9G,Sidewinder,AAM,Le AIM-9G Sidewinder est un missile air-air américain à guidage infrarouge. La version Golf possède un autodirecteur légèrement amélioré et de nouveaux modes d'acquisition.
fr_r550-2=R.550-2,Magic-2,AAM, Le R.550 Magic 2 est un missile air-air à guidage infrarouge français conçu par Matra (désormais MBDA). C'est une mise à jour de l'ancien missile R.550. Il entra en service en 1985 et fut utilisé de manière conséquente dans les années 1990 et 2000 avant d'être remplacé par le MICA-IR et l'ASRAAM.
