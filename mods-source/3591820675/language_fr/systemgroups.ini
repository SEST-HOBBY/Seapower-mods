[SystemNames]
AN/APG-30A=AN/APG-30A|Le AN/APG-30A était un radar de télémétrie simple utilisé par les avions à réaction militaires américains. Il s’agissait d’une version améliorée du AN/APG-30, employée sur des appareils comme le F-86A Sabre.
AN/APS-67=AN/APS-67|Le AN/APS-67 était un radar de recherche et de conduite de tir pour les Vought F-8B et F-8C Crusader, introduisant leurs premières capacités tout temps.
AN/APQ-83=AN/APQ-83|Le AN/APQ-83 était un radar de recherche et de conduite de tir pour le Vought F-8D Crusader.
AN/APQ-94=AN/APQ-94|Le AN/APQ-94 était un radar de recherche et de conduite de tir initialement utilisé par le Vought F-8E Crusader puis adapté au F-8D.
AN/APQ-104=AN/APQ-104|Le AN/APQ-104 était un radar de recherche et de conduite de tir conçu spécialement pour le F-8E(FN) Crusader. C’est une version améliorée du AN/APQ-94 capable de guider les missiles air-air Matra R.530.
AN/APQ-124A=AN/APQ-124A|Le AN/APQ-124A était un radar de recherche et de conduite de tir utilisé par le Vought F-8H Crusader, une amélioration du AN/APQ-83.
AN/APQ-149=AN/APQ-149|Le AN/APQ-149 était un radar de recherche et de conduite de tir utilisé par le Vought F-8J Crusader, une amélioration du AN/APQ-94.
Sherloc_RWR=Thomson-CSF TMV-011 Sherloc|Le Sherloc était un détecteur radar (RWR) développé par Thomson-CSF dans les années 1980. Il était considéré comme avancé pour son époque, doté d’un traitement numérique du signal, d’une bibliothèque de menaces et de la capacité de localiser les émetteurs tout en offrant au pilote une vision de l’environnement électromagnétique. Avec le pod brouilleur Barracuda et les lance-leurres Alkan, il faisait partie du système de guerre électronique intégré du Super Étendard Modernisé à partir du Standard 4.
Sherloc=Thomson-CSF TMV-011 Sherloc|Le Sherloc était un détecteur de radar (RWR) développé par Thomson-CSF dans les années 1980. Il était considéré comme avancé pour son époque, doté d’un traitement numérique du signal, d’une bibliothèque de menaces et de la capacité de localiser les émetteurs tout en offrant au pilote une vision de l’environnement électromagnétique. Avec le pod ECM Barracuda et les lance-leurres Alkan, il faisait partie du système de guerre électronique intégré du Super Étendard Modernisé à partir du Standard 4.
AN/APR-27=AN/APR-27|Le AN/APR-27 était un détecteur de radar (RWR) développé par Magnavox, principalement utilisé sur les avions de la marine américaine tels que les F-4 Phantom II, F-14A Tomcat, A-7 Corsair II, A-6E Intruder et RA-5C Vigilante. Sa fonction principale était de détecter et de signaler par alerte sonore les lancements de missiles sol-air (SAM).
AN/ALQ-51=AN/ALQ-51|Le AN/ALQ-51 était un brouilleur de poursuite destiné à contrer les radars de conduite de tir en bande S utilisant la mesure d’impulsion, la modulation de fréquence et le balayage conique. Il était également conçu pour provoquer l’échec ou la détonation prématurée des fusées de proximité des missiles SA-2.

Colt_Mk12=Colt Mk12|20mm Colt Mk12 Cannon|Le Colt Mk 12 était un canon automatique de 20 mm utilisé principalement sur les chasseurs de la marine américaine comme le F-8 Crusader et le A-4 Skyhawk. Il offrait une cadence de tir plus élevée que les modèles Hispano précédents, mais souffrait de problèmes d’enrayement et de fiabilité.