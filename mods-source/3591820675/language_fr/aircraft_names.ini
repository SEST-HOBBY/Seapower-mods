[fr_f-8efn_early]
Type=Avion de chasse
Default=F-8E(FN),F-8E
DefaultDescription=Le F-8E(FN) était un chasseur supersonique embarqué utilisé par la Marine Nationale. Il fut choisi en raison de sa taille plus réduite comparée au F-4 Phantom II, ce qui le rendait adapté aux porte-avions français Clemenceau et Foch. Le F-8E(FN) français comportait plusieurs modifications pour les opérations navales, notamment une incidence d’aile plus élevée, des stabilisateurs horizontaux agrandis et des volets soufflés sur les ailes principales. 42 appareils furent livrés en 1964. Il conserva les quatre canons de 20 mm caractéristiques, et son radar fut adapté pour guider la version à guidage radar semi-actif du missile Matra R.530.
Squadron1=F-8E Flottille 12F,F-8E
Squadron2=F-8E Flottille 14F,F-8E
Callsigns=Squadron1,Lascar|Squadron2,Négus

[fr_f-8efn]
Type=Avion de chasse
Default=F-8E(FN) (1973),F-8E
DefaultDescription=Le F-8E(FN) était un chasseur supersonique embarqué utilisé par la Marine Nationale. Il fut choisi en raison de sa taille plus réduite comparée au F-4 Phantom II, ce qui le rendait adapté aux porte-avions français Clemenceau et Foch. Le F-8E(FN) français comportait plusieurs modifications pour les opérations navales, notamment une incidence d’aile plus élevée, des stabilisateurs agrandis et des volets soufflés sur les ailes principales. 42 appareils furent livrés en 1964. Cette version introduit le missile IR Magic 1, un remplaçant national performant pour le AIM-9B Sidewinder vieillissant.
Squadron1=F-8E Flottille 12F,F-8E
Squadron2=F-8E Flottille 14F,F-8E
Callsigns=Squadron1,Lascar|Squadron2,Négus

[fr_f-8p]	
Type=Avion de chasse
Default=F-8P,F-8P
DefaultDescription=Le F-8P Crusader était la version modernisée française du F-8E(FN) Crusader, lui-même une variante française du F-8E américain. Le P signifie « Prolongé ». Modernisé à partir des cellules existantes de F-8E(FN), le F-8P disposait d’avioniques améliorées (notamment le système d’alerte Sherloc) et d’un nouveau siège éjectable zéro-zéro. Bien que l’acquisition de F/A-18 Hornet ait été envisagée un temps par la Marine Nationale, le programme de modernisation fut lancé en 1993 comme mesure temporaire en attendant l’entrée en service du Rafale M. 18 appareils furent modernisés.
Squadron1=F-8P Flottille 12F,F-8P
Squadron2=F-8P Flottille 14F,F-8P
Callsigns=Squadron1,Lascar|Squadron2,Négus

[usn_f-8a]
Type=Avion de chasse
Default=F-8A,F-8A
DefaultDescription=Le F-8A Crusader (initialement F8U-1) était la première version de série du chasseur supersonique embarqué de Vought, développé dans les années 1950. Propulsé par un moteur à postcombustion J57-P-4 et armé de quatre canons de 20 mm, il était doté d'une aile à incidence variable distinctive qui améliorait ses performances sur porte-avions. En service au sein de l'US Navy et du Corps des Marines des États-Unis, il a servi de base aux versions ultérieures du Crusader.
Squadron1=F8U-1 VF-11 'Red Rippers',VF-11
Squadron2=F8U-1 VF-32 'Swordsmen',VF-32
Squadron3=F8U-1 VF-32 'Swordsmen',VF-32
Squadron4=F8U-1 VF-103 'Sluggers',VF-103
Squadron5=F8U-1 VF-142 'Fighting Falcons',VF-142
Squadron6=F8U-1 VF-142 'Fighting Falcons',VF-142
Callsigns=Squadron1,Ripper|Squadron2,Gipsy|Squadron3,Gipsy|Squadron4,Clubleaf

[usn_f-8b]
Type=Avion de chasse
Default=F-8B,F-8B
DefaultDescription=Le F-8B Crusader (initialement désigné F8U-1E) était un chasseur embarqué de l'US Navy développé par Vought comme une version améliorée et tous temps du F-8A. Il était doté d'un cône de nez plus long abritant le radar AN/APS-67 pour des capacités de ciblage et de navigation améliorées.
Squadron1=F8U-1E Crusader VF-32 'Swordsmen',VF-32
Callsigns=Squadron1,Gipsy

[usn_f-8c]
Type=Avion de chasse
Default=F-8C,F-8C
DefaultDescription=Le F-8C Crusader (initialement F8U-2) était une évolution du chasseur supersonique embarqué de Vought, doté du moteur J57-P-16 à postcombustion et de nouvelles dérives ventrales améliorant la stabilité en lacet. Cette version introduisait un double pylône permettant d'emporter des missiles AIM-9 Sidewinder ou des lance-roquettes doubles Zuni. Il resta en service au sein de quelques escadrilles déployées pendant la guerre du Viêt Nam.
Squadron1=F8U-2 VF-84 'Vagabonds',VF-84
Squadron2=F8U-2 VF-91 'Red Lightnings',VF-91
Squadron3=F8U-2 VF-91 'Red Lightnings',VF-91
Squadron4=F8U-2 VF-103 'Sluggers',VF-103
Callsigns=Squadron1,Victory|Squadron4,Clubleaf

[usn_f-8d]
Type=Avion de chasse
Default=F-8D,F-8D
DefaultDescription=Le F-8D Crusader (initialement F8U-2N) était un chasseur embarqué tout temps développé par Vought. Il était équipé d'un radar AN/APQ-94 amélioré, d'un système d'approche automatique, d'un moteur J57-P-20 optimisé et d'un système IRST (recherche et poursuite infrarouge) pour la détection de cibles par rayonnement thermique. Il fut engagé au début de la guerre du Viêt Nam, avant d'être remplacé par des versions ultérieures.
Squadron1=F8U-2N VF-32 'Swordsmen',VF-32
Squadron2=F8U-2N VMF(AW)-451 'Warlords',VMF(AW)-451
Callsigns=Squadron1,Gipsy

[usn_f-8e]
Type=Avion de chasse
Default=F-8E,F-8E
DefaultDescription=Le F-8E Crusader (initialement F8U-2NE) était un chasseur supersonique embarqué de l'US Navy, développé par Vought dans les années 1950. Version la plus répandue du F-8, il était équipé du radar AN/APQ-94 amélioré, logé dans un cône de nez arrondi plus grand, d'un moteur J57-P-20A et pouvait emporter des missiles AGM-12 Bullpup, ce qui lui conférait une bosse caractéristique sur le fuselage supérieur. Surnommé le « Dernier des chasseurs à canon », il excellait en combat aérien rapproché et en opérations embarquées. Il fut largement utilisé par l'US Navy et le Corps des Marines, ainsi que dans des versions étrangères comme le F-8E(FN) français. L'USMC, en particulier, l'employa intensivement comme chasseur-bombardier, opérant depuis la base aérienne de Da Nang pour frapper des cibles au sol.
Squadron1=F8U-2NE VF-103 'Sluggers',VF-103
Callsigns=Squadron1,Clubleaf

[usn_rf-8a]
Type=Reconnaissance
Default=RF-8A,RF-8A
DefaultDescription=Le RF-8A Crusader (initialement F8U-1P) était la version de reconnaissance du F-8A de Vought, conçu pour les missions photographiques embarquées. Il remplaçait l’armement par plusieurs caméras installées dans le nez, tout en conservant le moteur J57 et les performances supersoniques. Le RF-8A servit dans l’U.S. Navy et le Corps des Marines, assurant une reconnaissance tactique essentielle à la fin des années 1950 et 1960, notamment lors de la crise des missiles de Cuba et de la guerre du Viêt Nam.
Squadron1=F8U-1P VFP-62 Det.41 'Hawkeyes',VFP-62
Squadron2=F8U-1P VFP-62 Det.41 'Hawkeyes',VFP-62
Squadron3=F8U-1P VFP-62 Det.42 'Hawkeyes',VFP-62
Squadron4=F8U-1P VFP-62 Det.42 'Hawkeyes',VFP-62
Squadron5=F8U-1P VFP-62 Det.43 'Hawkeyes',VFP-62
Squadron6=RF-8A VFP-62 Det.59 'Hawkeyes',VFP-62
Squadron7=RF-8A VFP-62 Det.60 'Hawkeyes',VFP-62
Squadron8=F8U-1P VFP-62 Det.60 'Hawkeyes',VFP-62
Squadron9=F8U-1P VFP-62 Det.62 'Hawkeyes',VFP-62
Squadron10=F8U-1P VFP-63 'Eyes of the Fleet',VFP-63
Squadron11=RF-8A VFP-63 Det. M 'Eyes of the Fleet',VFP-63
Callsigns=

[usn_rf-8g]
Type=Reconnaissance
Default=RF-8G,RF-8G
DefaultDescription=Le RF-8G Crusader était une version de reconnaissance modernisée du chasseur F-8 de Vought, reconstruite à partir de cellules de RF-8A plus anciennes. Il reçut des dérives ventrales similaires à celles des versions ultérieures du F-8, ainsi que des systèmes de contre-mesures ECM du programme Shoehorn. Utilisé depuis des porte-avions et des bases terrestres, le RF-8G assura la reconnaissance tactique de la marine américaine jusqu’en 1987.
Squadron1=RF-8G VFP-206 'Hawkeyes',VFP-206
Squadron2=RF-8G VFP-306 'Peeping Toms',VFP-306
Squadron3=RF-8G VFP-206 'Hawkeyes',VFP-206
Squadron4=RF-8G VFP-306 'Peeping Toms',VFP-306
Callsigns=

[usn_f-8k]
Type=Avion de chasse
Default=F-8K,F-8K
DefaultDescription=Le F-8K était une version améliorée du F-8C, dotée de la capacité d'emporter des missiles AGM-12 Bullpup, d'un moteur J57-P-420 de dernière génération et de systèmes de guerre électronique Shoehorn. Il fut principalement utilisé par la Réserve aéronavale de l'U.S. Navy et des Marines, remplaçant le F-8L plus ancien jusqu'à l'arrivée du F-4.
Squadron1=F-8K VMF-321 'Hell's Angels',VMF-321
Squadron2=F-8K VMF-351,VMF-351
Callsigns=

[usn_f-8h]
Type=Avion de chasse
Default=F-8H,F-8H
DefaultDescription=Le F-8H était une version améliorée du F-8D, dotée du moteur J57-P-420, d'une cellule renforcée, d'un radar perfectionné et de la capacité d'emporter des munitions sous les ailes. Il reçut également le système de guerre électronique Shoehorn et participa aux combats durant les dernières années de la guerre du Vietnam.
Squadron1=F-8H VF-111 'Sundowners',VF-111
Callsigns=

[ph_f-8h]
Type=Avion de chasse
Default=F-8H,F-8H
DefaultDescription=À la fin des années 1970, le gouvernement philippin acquit 35 F-8H Crusader pour son armée de l'air, où ils furent affectés au commandement de la défense aérienne. Au sein de la 7ème Escadrille de Chasse philippine, ils interceptèrent les avions soviétiques et chinois violant l'espace aérien national jusqu'en 1988, date à laquelle le manque de pièces détachées et de moyens de maintenance entraîna leur immobilisation au sol pour une durée indéterminée.
Squadron1=F-8H 7th TFS 'Bulldogs',F-8H
Callsigns=

[usn_f-8j]
Type=Avion de chasse
Default=F-8J,F-8J
DefaultDescription=Le F-8J était une version améliorée du F-8E, bénéficiant d'améliorations similaires à celles du F-8E(FN) français, comme une aile redessinée avec des volets soufflés et la possibilité d'emporter des réservoirs de carburant externes sous les ailes. Il intégrait également le système de guerre électronique Shoehorn et fut engagé au combat durant les dernières années de la guerre du Vietnam.
Squadron1=F-8J VF-162 'Hunters',VF-162
Callsigns=

[usn_f-8l]
Type=Avion de chasse
Default=F-8L,F-8L
DefaultDescription=Le F-8L était un F-8B doté de dérives ventrales et de la capacité d'emporter des munitions sous les ailes. Sa cellule ne permettant pas l'installation de moteurs plus récents, il conservait l'ancien J57-P-4. Jusqu'au début des années 1970, il fut principalement utilisé par la Réserve aérienne des Marines ou comme avion utilitaire au sein de l'US Navy, et son déploiement hors des États-Unis fut limité.
Squadron1=F-8L VMF-321 'Hell's Angels',VMF-321
Callsigns=Squadron1,Angel
