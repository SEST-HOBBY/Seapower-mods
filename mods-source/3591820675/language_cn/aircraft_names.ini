DefaultDescription=F-8E(FN)是法国海军使用的超音速舰载战斗机。因其尺寸比F-4鬼怪II更小而被选中，适合在法国克莱蒙梭号和福煦号航空母舰上运作。法国F-8E(FN)为舰载操作进行了改装，包括增大机翼迎角、扩大全动平尾和主翼吹气襟翼。42架飞机于1964年交付。保留标志性的四门20毫米机炮，其雷达适配了马特拉R.530导弹的半主动雷达制导型。
