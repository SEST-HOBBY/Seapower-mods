[fr_f-8p]
Type=战斗机
Default=F-8P 十字军战士,F-8P
DefaultDescription=F-8P十字军战士是法国海军F-8E(FN)十字军战士的现代化版本，后者本身是美国F-8E的法国改型。P代表"延长寿命"。从现有F-8E(FN)机体升级而来，F-8P配备改进航电（含Sherloc威胁警告系统）和新的零零弹射座椅。虽然法国海军短期内考虑从美国采购F/A-18大黄蜂，但现代化计划于1993年启动作为阵风M服役前的过渡措施。共18架飞机完成现代化改造。
Squadron1=F-8P 第12F舰队,F-8P
Squadron2=F-8P 第14F舰队,F-8P
Callsigns=Squadron1,拉斯卡|Squadron2,内古斯

