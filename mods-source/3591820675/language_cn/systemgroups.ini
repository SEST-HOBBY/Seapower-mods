Sherloc_RWR=汤姆逊-CSF TMV-011 夏洛克|夏洛克是汤姆逊CSF于1980年代开发的雷达告警接收机。各方面都被认为是当时先进的系统，具有数字信号处理、威胁库和定位发射源能力，并为飞行员提供电磁环境态势图。与巴拉克达电子对抗吊舱和阿尔坎诱饵发射器一起，构成超级军旗现代化改型的集成电子战套件。
Sherloc=汤姆逊-CSF TMV-011 夏洛克|夏洛克是汤姆逊CSF于1980年代开发的雷达告警接收机。各方面都被认为是当时先进的系统，具有数字信号处理、威胁库和定位发射源能力，并为飞行员提供电磁环境态势图。与巴拉克达电子对抗吊舱和阿尔坎诱饵发射器一起，构成超级军旗现代化改型的集成电子战套件。
AN/APR-27=AN/APR-27|AN/APR-27是马格纳沃克斯公司开发的雷达告警接收系统，主要供美国海军飞机使用，如F-4鬼怪II、F-14A雄猫、A-7海盗II、A-6E入侵者和RA-5C警戒者。其主要功能是探测地对空导弹发射并提供音频告警。
AN/ALQ-51=AN/ALQ-51|AN/ALQ-51是欺骗性跟踪中断器，用于对抗采用脉冲测距、调频载波脉冲和圆锥扫描的S波段火控雷达。它还设计用于使SA-2地对空导弹的近炸引信失效或提前引爆。
Colt_Mk12=柯尔特Mk12|20毫米柯尔特Mk12机炮|柯尔特Mk12是20毫米自动机炮，主要装备美国海军战斗机如F-8十字军战士和A-4天鹰，比早期的伊斯帕诺设计射速更高，但以卡弹和可靠性问题闻名。