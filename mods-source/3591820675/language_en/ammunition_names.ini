[AmmunitionNames]
fr_r530=R.530,Matra R.530,AAM,A medium-range semi-active radar homing (SARH) air-to-air missile developed by France. Used on aircraft like the F-8E(FN) for beyond-visual-range engagements using radar guidance. Its performance and reliability was mediocre, with a 65% failure rate, and the French Navy retired it from operational use in 1980.
fr_r530e=R.530E,Matra R.530E,AAM,The Matra R.530E was the infrared (IR) homing version of the R.530.
usn_agm-12b=AGM-12B,Bullpup,AGM,The AGM-12B is an US-made radio-guided anti surface missile, among the first of its kind. It was guided visually, with a small joystick. The B variant introduced a larger warhead.
usn_aim-9c=AIM-9C,Sidewinder,AAM,The AIM-9C Sidewinder is an American semi-active radar homing air-to-air missile. The Charlie variant is a peculiarity among the series, as it's the radar homing version of the Delta model, and has all-aspect capabilities as a result of this. Unfortunately, this is still a 1960's missile with a small seeker, so clutter rejection and especially anti-jamming performance are rather poor.
usn_aim-9g=AIM-9G,Sidewinder,AAM,The AIM-9G Sidewinder is an American infrared homing air-to-air missile. The Golf variant has a somewhat improved seeker and expanded acquisition modes.
fr_r550-2=R.550-2,Magic-2,AAM, R.550 Magic 2 is a French short-range, heat-seeking, air-to-air guided missile developed by Matra (now MBDA) as an upgrade to the original R.550 Magic. It entered service in 1985 and was widely used in the 1980s and 2000s before being replaced by MICA-IR and ASRAAM.
