[fr_f-8efn_early]
Type=Fighter
Default=F-8E(FN),F-8E
DefaultDescription=The F-8E(FN) was a supersonic, carrier-based fighter jet used by the French Navy. It was chosen due to its smaller size compared to the F-4 Phantom II, making it suitable for the French aircraft carriers Clemenceau and Foch. The French F-8E(FN) featured modifications for carrier operations, including a higher wing incidence, larger stabilators, and blown flaps on the main wings. 42 aircraft were delivered in 1964. It retained the signature four 20mm cannons and its radar was adapted to guide the semi-active radar homing version of the Matra R.530 missile. 
Squadron1=F-8E Flottille 12F,F-8E
Squadron2=F-8E Flottille 14F,F-8E
Callsigns=Squadron1,Lascar|Squadron2,Négus

[fr_f-8efn]
Type=Fighter
Default=F-8E(FN) (1973),F-8E
DefaultDescription=The F-8E(FN) was a supersonic, carrier-based fighter jet used by the French Navy. It was chosen due to its smaller size compared to the F-4 Phantom II, making it suitable for the French aircraft carriers Clemenceau and Foch. The French F-8E(FN) featured modifications for carrier operations, including a higher wing incidence, larger stabilators, and blown flaps on the main wings. 42 aircraft were delivered in 1964. This version introduces the Magic 1 IR missile, a capable domestic replacement for the aging AIM-9B Sidewinder.
Squadron1=F-8E Flottille 12F,F-8E
Squadron2=F-8E Flottille 14F,F-8E
Callsigns=Squadron1,Lascar|Squadron2,Négus

[fr_f-8p]
Type=Fighter
Default=F-8P,F-8P
DefaultDescription=The F-8P Crusader was the modernized French Navy version of the F-8E(FN) Crusader, itself a French-built variant of the U.S. F-8E. The P stands for 'Prolongé' (Extended). Upgraded from existing F-8E(FN) airframes, the F-8P featured improved avionics (including the Sherloc threat warning system) and a new zero-zero ejection seat. While an acquisition of F/A-18 Hornets from the U.S. was considered by the French Navy for a short time, the modernization program was launched in 1993 as a stop-gap measure while waiting for the Rafale M to enter service. 18 aircraft were modernized.
Squadron1=F-8P Flottille 12F,F-8P
Squadron2=F-8P Flottille 14F,F-8P
Callsigns=Squadron1,Lascar|Squadron2,Négus

[usn_f-8a]
Type=Fighter
Default=F-8A,F-8A
DefaultDescription=The F-8A Crusader (originally F8U-1) was the original production variant of Vought's supersonic, carrier-based fighter developed in the 1950s. Powered by a J57-P-4 afterburning engine and armed with four 20 mm cannons, it introduced a distinctive variable-incidence wing that improved carrier performance. Serving with the U.S. Navy and Marine Corps, it established the foundation for later Crusader variants.
Squadron1=F8U-1 VF-11 'Red Rippers',VF-11
Squadron2=F8U-1 VF-32 'Swordsmen',VF-32
Squadron3=F8U-1 VF-32 'Swordsmen',VF-32
Squadron4=F8U-1 VF-103 'Sluggers',VF-103
Squadron5=F8U-1 VF-142 'Fighting Falcons',VF-142
Squadron6=F8U-1 VF-142 'Fighting Falcons',VF-142
Callsigns=Squadron1,Ripper|Squadron2,Gipsy|Squadron3,Gipsy|Squadron4,Clubleaf

[usn_f-8b]
Type=Fighter
Default=F-8B,F-8B
DefaultDescription=The F-8B Crusader (originally designated F8U-1E) was a U.S. Navy carrier-based fighter developed by Vought as an improved, all-weather version of the F-8A. It featured a longer nose cone housing the AN/APS-67 radar for enhanced targeting and navigation capability.
Squadron1=F8U-1E Crusader VF-32 'Swordsmen',VF-32
Callsigns=Squadron1,Gipsy

[usn_f-8c]
Type=Fighter
Default=F-8C,F-8C
DefaultDescription=The F-8C Crusader (originally F8U-2) was a further development of Vought's supersonic, carrier-based fighter, featuring the afterburning J57-P-16 engine and new ventral fins for enhanced yaw stability. With this variant, the double-pylon was introduced in order to carry AIM-9 Sidewinder missiles or Zuni double-rocket pods. It was still in service with a couple squadrons which were deployed during the Vietnam War.
Squadron1=F8U-2 VF-84 'Vagabonds',VF-84
Squadron2=F8U-2 VF-91 'Red Lightnings',VF-91
Squadron3=F-8C VF-91 'Red Lightnings',VF-91
Squadron4=F-8C VF-103 'Sluggers',VF-103
Callsigns=Squadron1,Victory|Squadron4,Clubleaf

[usn_f-8d]
Type=Fighter
Default=F-8D,F-8D
DefaultDescription=The F-8D Crusader (originally F8U-2N) was an advanced all-weather, carrier-based fighter developed by Vought. It featured an upgraded AN/APQ-94 radar, an automatic landing approach system, an uprated J57-P-20 engine, and an IRST (infrared search-and-track) system for heat-based target detection. It saw service during the early years of the Vietnam War, until it was replaced by later variants.
Squadron1=F-8D VF-32 'Swordsmen',VF-32
Squadron2=F-8D VMF(AW)-451 'Warlords',VMF(AW)-451
Callsigns=Squadron1,Gipsy

[usn_f-8e]
Type=Fighter
Default=F-8E,F-8E
DefaultDescription=The F-8E Crusader (originally F8U-2NE) was a U.S. Navy supersonic, carrier-based fighter developed by Vought in the 1950s. The most common F-8 variant, it featured the improved AN/APQ-94 radar housed in a larger, rounded nose cone, a J57-P-20A engine, and provisions for the use of AGM-12 Bullpup missiles which gave it a distinctive "hump" on the upper fuselage. Known as the "Last of the Gunfighters", it excelled in dogfighting and carrier operations and saw extensive service with the U.S. Navy and Marine Corps, as well as in foreign variants like the French F-8E(FN). The USMC in particular used it extensively as a fighter-bomber, flying from Da Nang Air Base to strike ground targets.
Squadron1=F-8E VF-103 'Sluggers',VF-103
Squadron2=F-8E VMF(AW)-232 'Red Devils',VMF(AW)-232
Squadron3=F-8E VMF(AW)-235 'Death Angels',VMF(AW)-235
Squadron4=F-8E VMF(AW)-312 'Checkerboards',VMF(AW)-312
Callsigns=Squadron1,Clubleaf

