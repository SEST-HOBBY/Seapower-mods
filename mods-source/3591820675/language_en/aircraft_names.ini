[usn_f-8h]
Type=Fighter
Default=F-8H,F-8H
DefaultDescription=The F-8H was an upgraded F-8D with the J57-P-420 engine, a strengthened airframe, improved radar and the ability to carry ordnance on underwing pylons. It also received the Shoehorn ECM systems, and saw combat during the later years of the Vietnam War.
Squadron1=F-8H VF-111 'Sundowners',VF-111
Callsigns=

[ph_f-8h]
Type=Fighter
Default=F-8H,F-8H
DefaultDescription=In the late 1970s, 35 F-8H Crusaders were purchased by the Philippine government for use in the Philippine Air Force, where they served in the country's Air Defense Command. During their service in the 7th Tactical Fighter Squadron, they intercepted Soviet and Chinese aircraft violating the country's airspace until 1988, where the lack of spare parts and overhauls for the airframes meant indefinite grounding.
Squadron1=F-8H 7th TFS 'Bulldogs',F-8H
Callsigns=

[usn_f-8j]
Type=Fighter
Default=F-8J,F-8J
DefaultDescription=The F-8J was an upgraded F-8E, featuring similar upgrades to the ones featured on the French F-8E(FN) like an upgraded wing design featuring blown flaps, as well as the capability to carry external fuel tanks underneath the wings. It also incorporated the Shoehorn ECM systems, and saw combat during the later years of the Vietnam War.
Squadron1=F-8J VF-162 'Hunters',VF-162
Callsigns=

[usn_f-8l]
Type=Fighter
Default=F-8L,F-8L
DefaultDescription=The F-8L was an F-8B which received the aerodynamic ventral fins and the ability to carry ordnance underneath the wings. Since its airframe could not fit anything newer, its engine was still the old J57-P-4. Up to the early 1970s it was mostly used by the Marine Air Reserve or as an utility aircraft in the USN, and did not serve much outside of the United States due to its limited status.
Squadron1=F-8L VMF-321 'Hell's Angels',VMF-321
Callsigns=Squadron1,Angel