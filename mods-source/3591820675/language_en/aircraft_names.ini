[usn_f-8k]
Type=Fighter
Default=F-8K,F-8K
DefaultDescription=The F-8K was an upgrade of the F-8C, introducing AGM-12 Bullpup capability, retrofitting its engine to the latest J57-P-420 as well as Shoehorn ECM enhancements. It was flown mostly by the Naval and Marine Air Reserve, replacing the older F-8L until the F-4 became available.
Squadron1=F-8K VMF-321 'Hell's Angels',VMF-321
Squadron2=F-8K VMF-351,VMF-351
