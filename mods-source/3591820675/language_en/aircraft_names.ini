[usn_rf-8g]
Type=Recon
Default=RF-8G,RF-8G
DefaultDescription=The RF-8G Crusader was a modernized reconnaissance variant of Vought's F-8 fighter, rebuilt from earlier RF-8A airframes. It received ventral fins like on the later F-8 variants, and also ECM systems from the Shoehorn program. Operating from carriers and ground bases, the RF-8G continued providing tactical reconnaissance for the U.S. Navy until 1987, when it was retired from the Naval Air Reserve.
