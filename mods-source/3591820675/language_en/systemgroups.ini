[SystemNames]
AN/APG-30A=AN/APG-30A|The AN/APG-30A was a simple ranging radar used by US jet aircraft. It is an upgraded version of the AN/APG-30, used on aircraft like the F-86A Sabre.
AN/APS-67=AN/APS-67|The AN/APS-67 was a search and fire control radar for the Vought F-8B and F-8C Crusader, which introduced its first all-weather capabilities.
AN/APQ-83=AN/APQ-83|The AN/APQ-83 was a search and fire control radar for the Vought F-8D Crusader.
AN/APQ-94=AN/APQ-94|The AN/APQ-94 was a search and fire control radar originally used by Vought F-8E Crusader and later retrofitted to the F-8D.
AN/APQ-104=AN/APQ-104|The AN/APQ-104 was a search and fire control radar designed especially for the F-8E(FN) Crusader. It is an upgraded version of the AN/APQ-94 and can guide the Matra R.530 air-to-air missiles.
AN/APQ-124A=AN/APQ-124A|The AN/APQ-124A was a search and fire control radar used by Vought F-8H Crusader, an upgrade of the AN/APQ-83.
AN/APQ-149=AN/APQ-149|The AN/APQ-149 was a search and fire control radar used by Vought F-8J and F-8L Crusader, an upgrade of the AN/APQ-94.
Sherloc_RWR=Thomson-CSF TMV-011 Sherloc|The Sherloc was a RWR developed by Thomson CSF in the 1980s. By all accounts it was considred advanced for its time, with digital signal processing, threat library and abiliy to locate emitters as well as giving the pilot a picture of the electromagnetic environnement. Along with Barracuda ECM pod and Alkan decoy dispensers, it was part of an integrated electronic warfare suite fitted to the Super Etendard Modernisé from the aircraft's standard 4.
Sherloc=Thomson-CSF TMV-011 Sherloc|The Sherloc was a RWR developed by Thomson CSF in the 1980s. By all accounts it was considered advanced for its time, with digital signal processing, threat library and abiliy to locate emitters as well as giving the pilot a picture of the electromagnetic environnement. Along with Barracuda ECM pod and Alkan decoy dispensers, it was part of an integrated electronic warfare suite fitted to the Super Etendard Modernisé from the aircraft's standard 4.
AN/APR-27=AN/APR-27|The AN/APR-27 was a radar warning receiver (RWR) system developed by Magnavox, primarily used by U.S. Navy aircraft such as the F-4 Phantom II, F-14A Tomcat, A-7 Corsair II, A-6E Intruder, and RA-5C Vigilante. Its main function is to detect and provide audible alerts for surface-to-air missile (SAM) launches.
AN/ALQ-51=AN/ALQ-51|The AN/ALQ-51 was a deceptive track breaker to counter S-band fire control radars which employ pulse ranging, frequency modulating carrier wave pulse, and conical scan. It is also designed to cause proximity fuses on the SA-2 SAMs to fail to detonate, or detonate prematurely.

Colt_Mk12=Colt Mk12|20mm Colt Mk12 Cannon|The Colt Mk 12 was a 20 mm aircraft autocannon used primarily on U.S. Navy fighters like the F-8 Crusader and A-4 Skyhawk, offering higher rate of fire than earlier Hispano designs but known for jamming and reliability issues.