[ ------------------------ TWR / ESM ------------------------- ]

[Sherloc_RWR] #Thomson-CSF TMV-011 Sherloc
#automatic radar threat warner, had threat library, range and azimuth capabilities. Wide frequency range. https://www.archives.gov/files/declassification/iscap/pdf/2014-033-doc01.pdf
Kind=ESM
Type=RWR
Gain=10                              //gain of sensor in dB
HasDataLink=False                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=12.5              // in degrees
Frequencies=L-Band,S-Band,C-Band,X-Band,Ku-Band                     //Frequencies that current ESM system can detect
ModuleType=SmallSensor

[Sherloc] #Thomson-CSF TMV-011 Sherloc
#automatic radar threat warner, had threat library, range and azimuth capabilities. Wide frequency range. https://www.archives.gov/files/declassification/iscap/pdf/2014-033-doc01.pdf
Kind=ESM
Gain=10                              //gain of sensor in dB
HasDataLink=False                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=12.5              // in degrees
Frequencies=L-Band,S-Band,C-Band,X-Band,Ku-Band                     //Frequencies that current ESM system can detect
OverHorizonMultiplier=0.7           // The multiplier for ESM horizon for over horison (OTH) passive detection capability
IdentificationRate=0.2
ModuleType=SmallSensor

