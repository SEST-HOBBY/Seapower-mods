[plaaf_j-11b]
Type=Fighter
Default=J-11B,J-11B
DefaultDescription=Starting in 2000, China utilized domestic technology to upgrade the Su-27 airframe, achieving full localization of the airframe, engines, avionics, and weapons. The J-11B incorporates new composite materials to improve airframe design, reduce structural weight, and extend service life. It is powered by the domestically produced WS-10B 'Taihang' turbofan engine. The avionics and sensors were upgraded with a domestic digital integrated avionics system, featuring a glass cockpit, a quadruplex digital fly-by-wire system, and the Type 1493 planar array fire-control radar. The J-11B's primary air-to-air weapons are the PL-12 active radar-homing missile and the PL-8B infrared-homing missile, with the addition of precision-guided ground attack munitions.
Squadron1=J-11B (16th AB, PLAAF, 'Lions of Helan'),J-11B
