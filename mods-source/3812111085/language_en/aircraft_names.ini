[plaaf_j-16d]
Type=EW Aircraft
Default=J-16D,J-16D
DefaultDescription=The J-16D is a dedicated electronic warfare aircraft derived from the J-16 twin-seat fighter-bomber, with the cannon and IRST removed, wingtip electronic intelligence pods installed, and electronic jamming pods carried under the wings. It performs escort jamming, SEAD, and standoff jamming missions, forming a key component of PLAAF electronic warfare capability.
Squadron1=J-16D,J-16D

[plaaf_j-16]
Type=Fighter-Bomber
Default=J-16,J-16
DefaultDescription=The J-16 is a twin-seat heavy multi-role fighter-bomber developed by China, evolved from the J-11BS platform. It features an AESA radar and WS-10B 'Taihang' engines, providing formidable air-to-air, air-to-ground, and anti-ship precision strike capability. It can carry PL-17, PL-15 and PL-10 air-to-air missiles along with various precision-guided ground attack and anti-ship munitions, serving as the backbone heavy multi-role fighter of the PLAAF.
Squadron1=J-16,J-16


[plaaf_h-6k_early]
Type=Bomber
Default=H-6K (Early),H-6K
DefaultDescription=The H-6 is a medium bomber operated by the PLAAF and PLANAF. It traces its origin to the Soviet Tupolev Tu-16 medium bomber imported by China in the 1960s. Over more than six decades, its numerous variants have performed medium-to-long range conventional tactical strikes, strategic nuclear deterrence, long-range maritime reconnaissance and anti-ship missions, serving as the backbone of China’s long-range aerial fire projection capabilities. The H-6K is a comprehensively upgraded variant introduced in the early 2010s. It features partial airframe redesign, domestically developed advanced avionics and sensors, and Chinese WS-18 turbofan engines. It can carry China’s new-generation long-range air-launched cruise missiles, air-to-surface ballistic missiles and long-range anti-ship missiles, greatly enhancing its standoff strike capability.
Squadron1=H-6K,H-6K

[plaaf_h-6k_late]
Type=Bomber
Default=H-6K (Late),H-6K
DefaultDescription=The H-6 is a medium bomber operated by the PLAAF and PLANAF. It traces its origin to the Soviet Tupolev Tu-16 medium bomber imported by China in the 1960s. Over more than six decades, its numerous variants have performed medium-to-long range conventional tactical strikes, strategic nuclear deterrence, long-range maritime reconnaissance and anti-ship missions, serving as the backbone of China’s long-range aerial fire projection capabilities. The H-6K is a comprehensively upgraded variant introduced in the early 2010s. It features partial airframe redesign, domestically developed advanced avionics and sensors, and Chinese WS-18 turbofan engines. It can carry China’s new-generation long-range air-launched cruise missiles, air-to-surface ballistic missiles and long-range anti-ship missiles, greatly enhancing its standoff strike capability.
Squadron1=H-6K,H-6K

[plaaf_h-6j]
Type=Bomber
Default=H-6J,H-6J
DefaultDescription=The H-6 is a medium bomber operated by the PLAAF and PLANAF. It traces its origin to the Soviet Tupolev Tu-16 medium bomber imported by China in the 1960s. Over more than six decades, its numerous variants have performed medium-to-long range conventional tactical strikes, strategic nuclear deterrence, long-range maritime reconnaissance and anti-ship missions, serving as the backbone of China’s long-range aerial fire projection capabilities. The H-6J is an upgraded variant entering service in 2018, primarily fielded by the PLANAF for far-seas reconnaissance and anti-ship duties. Based on the H-6K design, the H-6J has upgraded avionics and an AESA radar. It can carry long-range passive electronic reconnaissance pods to launch anti-ship attacks by locating electronic emissions from enemy vessels.
Squadron1=H-6J,H-6J

[plaaf_h-6n]
Type=Bomber,Strategic Bomber
Default=H-6N,H-6N
DefaultDescription=The H-6 is a medium bomber operated by the PLAAF and PLANAF. It traces its origin to the Soviet Tupolev Tu-16 medium bomber imported by China in the 1960s. Over more than six decades, its numerous variants have performed medium-to-long range conventional tactical strikes, strategic nuclear deterrence, long-range maritime reconnaissance and anti-ship missions, serving as the backbone of China’s long-range aerial fire projection capabilities. Entering service in 2018, the H-6N is an upgraded variant tasked mainly with strategic nuclear deterrence and air-launched nuclear strike duties. Based on the H-6K, the H-6N is fitted with upgraded avionics, an AESA radar and aerial refueling capability, and can carry the JL-1 air-launched nuclear ballistic missile. While retaining the capacity to carry various long-range guided munitions, it can also deploy the WZ-8 supersonic reconnaissance UAV for long-range high-speed surveillance missions.
Squadron1=H-6N,H-6N
