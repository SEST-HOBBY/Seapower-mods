[plaaf_j-7ii]
Type=Fighter
Default=J-7II,J-7II
DefaultDescription=The J-7 is a second-generation supersonic jet fighter manufactured by China. In 1961, China introduced the MiG-21F-13 fighter from the USSR. Following the deterioration of Sino-Soviet relations and the subsequent withdrawal of all technical assistance by the Soviet Union, China successfully developed a domestically produced version of the MiG-21F-13 in 1966, which was subsequently designated as the J-7. In 1968, the Chengdu Aircraft Corporation began to modify the J-7 fighter jet, and in 1975 the J-7I was adopted, featuring an improved air intake and dual 30mm cannons. In 1979, the J-7II, equipped with a new ejection seat, the WP-7B turbojet engine, and increased internal fuel, was finalized and put into mass production.
Squadron1=J-7II (1st AD),J-7II
Squadron2=J-7II (2nd AD),J-7II
Squadron3=J-7II (8th AD, PLANAF),J-7II
Callsigns=Squadron1,Eagle|Squadron2,Lion|Squadron3,Hero

[plaaf_j-7iiia]
Type=Fighter
Default=J-7IIIA,J-7IIIA
DefaultDescription=The J-7 is a second-generation supersonic jet fighter manufactured by China. In 1961, China introduced the MiG-21F-13 fighter from the USSR. Following the deterioration of Sino-Soviet relations and the subsequent withdrawal of all technical assistance by the Soviet Union, China successfully developed a domestically produced version of the MiG-21F-13 in 1966, which was subsequently designated as the J-7. In 1978, referring to the Soviet MiG-21MF all-weather fighter, China began developing the J-7III (also known as J-7C), which was equipped with search and fire-control radar, enabling it to operate in all weather conditions. The aircraft made its maiden flight in 1984. In 1995, the J-7IIIA (also known as J-7D), featuring an upgraded WP-13F1 engine with increased thrust and improved avionics, was put into production. However, by the time the J-7III/IIIA was finalized, its performance was already considered outdated, and only 50 airframes were manufactured.
Squadron1=J-7IIIA (9th AD),J-7IIIA
Callsigns=Squadron1,Eagle

[plaaf_j-7e]
Type=Fighter
Default=J-7E,J-7E
DefaultDescription=The J-7 is a second-generation supersonic jet fighter manufactured by China. In 1961, China introduced the MiG-21F-13 fighter from the USSR. Following the deterioration of Sino-Soviet relations and the subsequent withdrawal of all technical assistance by the Soviet Union, China successfully developed a domestically produced version of the MiG-21F-13 in 1966, which was subsequently designated as the J-7. In 1986, the Chengdu Aircraft Corporation collaborated with Northwestern Polytechnical University to upgrade the J-7II fighter. The aircraft was redesigned with a double-delta wing configuration paired with leading-edge manoeuvring flaps, significantly enhancing its subsonic and transonic manoeuvrability at medium and low altitudes. The aircraft was also equipped with the WP-13F1 engine and advanced avionics. This upgraded model was finalized in 1993 as the J-7E, with a total of 260 airframes produced.
Squadron1=J-7E (1st AD),J-7E
Squadron2=J-7EH (3rd AD, PLANAF),J-7EH
Callsigns=Squadron1,Eagle|Squadron2,Lion

