########### Visual/IR #####################
JZ-8_POD_EO=EO Reconnaissance Pod|Electro-optical reconnaissance pod

OLS-27=OLS-27 IRST|The OLS-27 is an infrared/electro-optical targeting system fitted to the Su-27 fighter. It can search for aerial targets using infrared signatures and provide fire control parameters for R-27ET and R-73 missiles. This is a passive detection sensor with relatively short range.

J-16_IRST=IRST|Infrared electro-optical targeting system that can search for aerial targets using infrared signatures and supply fire control parameters for missiles. Derived from the Russian OLS-27 series infrared electro-optical targeting system, it is a passive detection sensor with relatively short range.

YINGS-IIIA=YINGS-IIIA Targeting Pod|The YINGS-IIIA is a general-purpose composite targeting pod with infrared, TV and laser channels operated by the PLAAF. It supports day/night/IR observation and weapon guidance.

YINGS-IIIA_Designator=YINGS-IIIA Laser Designator|Laser designator for the YINGS-IIIA targeting pod

########### Radar #####################
JL-7A=JL-7A Radar|The JL-7 radar is a monopulse fire control radar used by the J-7III fighter, housed inside the nose shock cone with a parabolic antenna. Its technology originated from wreckage of the R-14A radar recovered from a downed F-105D fighter-bomber during the Vietnam War. After reverse engineering it became the Type 317 radar, first deployed as a maritime search radar on the Q-5B torpedo attack aircraft before being adapted as an airborne fire control radar. The radar only delivers basic search and track capability with short range and no look-down/shoot-down capability. It can provide off-boresight launch fire control parameters for PL-5 and PL-8 IR missiles.

JL-7AG=JL-7AG Radar|The JL-7 radar is a monopulse fire control radar used by the J-7III fighter, housed inside the nose shock cone with a parabolic antenna. Its technology originated from wreckage of the R-14A radar recovered from a downed F-105D fighter-bomber during the Vietnam War. After reverse engineering it became the Type 317 radar, first deployed as a maritime search radar on the Q-5B torpedo attack aircraft before being adapted as an airborne fire control radar. The radar only delivers basic search and track capability with short range and no look-down/shoot-down capability. It can provide off-boresight fire control parameters for PL-5 and PL-8 missiles. This improved variant was fitted to the J-8E fighter.

SL-5A=SL-5A Radar|The SL-5A radar is the first airborne fire control radar fielded by the PLAAF, an upgraded derivative of the SL-4 radar (also known as Type 204 radar), installed on the J-8B fighter. Still using monopulse principle, it added a continuous wave illuminator on the basis of SL-4 to provide fire control illumination for the planned PL-4 semi-active radar homing air-to-air missile. However, the radar still lacked look-down/shoot-down capability and had short detection range. Since the PL-4 missile program was ultimately cancelled, the J-8B fighter retained no medium-range intercept capability. The radar can only perform basic search or supply off-boresight launch fire control parameters for PL-5 and PL-8 missiles.

Type_266=Type 266 Radar Rangefinder|The Type 266 radar rangefinder is a simple ranging device on the J-7 fighter for infrared missile and cannon aiming. It has no search or track functions.

KLJ-92B=KLJ-92B Radar|The KLJ-92 radar (also designated Type 1492 radar) is the first full-waveform digital pulse-Doppler fighter radar operated by the PLAAF. It is primarily fitted to the J-8F and J-8DF fighters. Paired with domestically developed PL-12 active radar homing medium-range air-to-air missiles, it granted the J-8II fighter series its first true beyond-visual-range air combat capability. This radar uses a planar array antenna, features excellent look-down/shoot-down performance, and can process and track multiple targets simultaneously.

JZ-8_Pod_SAR_L=SAR Pod (Left-facing)|Synthetic Aperture Radar Pod (Left-facing)

JZ-8_Pod_SAR_R=SAR Pod (Right-facing)|Synthetic Aperture Radar Pod (Right-facing)

KLJ-73=KLJ-73 Radar|The KLJ-73 radar (also designated Type 1473 radar) is a digital pulse-Doppler radar operated by the PLAAF, installed on the J-10A fighter. Its performance is roughly comparable to the APG-68(V) radar fitted on US F-16C/D fighters.

KLJ-10A=KLJ-10A Radar|The KLJ-10A radar is the airborne radar for the J-10C fighter. It adopts an active electronically scanned array (AESA) antenna, with performance roughly comparable to the APG-81 radar of the US F-35 fighter.

N001=N001 Radar|The N001 radar is a mechanically scanned pulse-Doppler airborne fire control radar developed by the Soviet Union for the Su-27 fighter family. It uses a mechanically scanned inverted Cassegrain antenna. The radar has an approximate detection range of 100 km against fighter-sized targets and supports air-to-air search plus guidance for semi-active radar homing and infrared missiles.

KLJ-93=KLJ-93 Radar|The KLJ-93 radar (also designated Type 1493 radar) is a full-waveform digital pulse-Doppler radar fitted to the PLAAF J-11B/BS fighter series. Its performance is roughly comparable to the APG-63 radar on US F-15C fighters.

KLJ-11A=KLJ-11A Radar|The KLJ-11A radar is the airborne radar for the J-11BG fighter. It adopts an active electronically scanned array (AESA) antenna. Its enhanced detection range and information processing capability allows the J-11BG to employ 3rd-generation Chinese  air-to-air missiles represented by the PL-15 and PL-10.

KLJ-16=KLJ-16 Radar|The KLJ-16 radar is the airborne radar for the J-16 fighter. It adopts an active electronically scanned array (AESA) antenna, delivering strong long-range detection and target processing capabilities.

KLC-6=KLC-6 Radar|The KLC-6 Radar is the airborne radar fitted on the H-6K bomber. It uses a mechanically scanned planar array antenna, mainly for long-range surface search and supplying fire control parameters for cruise missiles, capable of detecting and tracking ground targets.

KLC-6A=KLC-6A Radar|The KLC-6A Radar is the airborne radar for H-6J/N bombers. It adopts an Active Electronically Scanned Array (AESA) architecture, delivering longer detection range and enhanced target processing capability.


WZ-8_Datalink=UAV Datalink|Remote control and data feed datalink for the WZ-8 UAV.

