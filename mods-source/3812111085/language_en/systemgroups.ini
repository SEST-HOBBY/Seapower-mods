########### ECM #####################
RKZ-16_ECM=RKZ-16 Self-Defense EW System|Self-defense jamming component integrated the built-in comprehensive airborne electronic warfare system of the J-16 fighter.

RKZ-930_ECM=RKZ-930 Integrated EW Pod|The RKZ-930 is an integrated airborne electronic warfare pod operated by the PLAAF. It can conduct offensive electronic jamming and locate and suppress enemy radar sensors and air defense systems.

RKL-700A_ECM=RKL-700A Tactical Self-Defense EW Pod|New-generation tactical self-defense electronic warfare pod operated by the PLAAF. It can locate and suppress hostile radars and air defense systems and perform self-protection electronic jamming.

RKZ-6_ECM=RKZ-6 Self-Defense EW System|Self-defense jamming component integrated the built-in comprehensive airborne electronic warfare system of the H-6K bomber.

RKZ-6A_ECM=RKZ-6A Self-Defense EW System|Self-defense jamming component integrated the built-in comprehensive airborne electronic warfare system of the H-6J/N bomber.

