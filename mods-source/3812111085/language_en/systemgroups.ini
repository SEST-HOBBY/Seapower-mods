RKL-600_Pod_ESM=RKL-600 ESM Pod|The RKL-600 ESM Pod is a long-range passive electronic reconnaissance device carried by the H-6J. It can detect and track radar emissions from enemy vessels at long ranges and supply fire control parameters for anti-ship missiles.


