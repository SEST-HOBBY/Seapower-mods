plaaf_kd-88_pod=KD-88 Data-link Pod,,Data-link Pod,The KD-88 data-link pod is a command transmission pod developed for the KD-88 air-to-ground missile, establishing two-way data-link communication between the launch aircraft and the missile for mid-course command updates and target data revision, enhancing precision strike capability against ground targets.

plaaf_rkl-700a=RKL-700A EW Pod,,EW Pod,The RKL-700A is an electronic warfare pod operated by the PLAAF for reconnaissance, jamming, and suppression of enemy radar and communication systems, enhancing aircraft survivability and mission flexibility.

plaaf_h-6j_esm_pod=RKL-600电子侦察吊舱,,电子侦察吊舱,RKL-600电子侦察吊舱是轰-6J搭载的远程被动电子侦察设备，可远距离探测并跟踪敌方舰艇雷达辐射并为反舰导弹提供火控参数。

