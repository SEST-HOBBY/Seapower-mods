#----------------- UAV ----------------
plaaf_wz-8=WZ-8 Reconnaissance Drone,,Surface Reconnaissance,The WZ-8 is a rocket-powered high-altitude high-speed reconnaissance drone. It can be carried and launched by H-6M and H-6N bombers, and may be equipped with radar or infrared electro-optical reconnaissance sensors. Controlled via datalink from the host aircraft, it performs high-altitude high-speed reconnaissance missions. Its cruising altitude exceeds 30 km and maximum speed surpasses Mach 3.0.
