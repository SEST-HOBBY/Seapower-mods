plaaf_hf-14=HF-14,,Rocket Pod,Four-tube 130mm rocket pod.

plaaf_hf-6=HF-6,,Rocket Pod,Seven-tube 90mm rocket pod.

wp_ub-32-57=UB-32-57,,Rocket Pod,The UB-32-57 is a Soviet 57mm 32-tube aircraft rocket pod compatible with various fixed-wing aircraft, primarily used for ground attack and suppressive fire missions.

plaaf_130-Ⅱ_rocket=130-2 FFAR,HE,AGM,This is an air-to-ground rocket developed and fielded by China, manufactured by China North Industries Group Corporation.

plaaf_90-Ⅰ_rocket=90-1 FFAR,HEAT,AGM,This is an air-to-ground rocket developed and fielded by China, manufactured by China North Industries Group Corporation.

