# ------------------ Bombs -----------------

plaaf_gb-500=GB-500,,LGB,The GB-500 is a Chinese 500kg laser-guided bomb converted from a 500kg low-drag general-purpose bomb with a laser seeker kit, offering high accuracy against ground targets.

plaaf_500-Ⅲ=500-Ⅲ,,unguided bomb,Chinese 500kg Type III low-drag aerial bomb.

plaaf_250-Ⅲ=250-Ⅲ,,unguided bomb,Chinese 250kg Type III low-drag aerial bomb.

plaaf_ls-6_250=LS-6 (250kg),Glide Bomb,AGM,The LS-6 250kg is a GPS-guided precision glide bomb consisting of a 250kg low-drag bomb with added glide and guidance kits, providing standoff precision strike capability.

plaaf_ls-6_500=LS-6 (500kg),Glide Bomb,AGM,The LS-6 500kg is a GPS-guided precision glide bomb consisting of a 500kg low-drag bomb with added glide and guidance kits, providing standoff precision strike capability.

plaaf_ls-6_500_zc=LS-6 500kg (ER),Glide Bomb,AGM,The LS-6 Extended Range is a modified 500kg general-purpose bomb equipped with a glide kit and turbojet engine, GPS-guided, primarily for striking fixed ground targets.

plaaf_gb-3=GB-3,,LGB,250kg satellite-positioning retrofit kit laser-guided bomb.

plaaf_gb-250=GB-250,,LGB,250kg free-fall laser-guided bomb.

plaaf_gb-500=GB-500,,LGB,500kg free-fall laser-guided bomb.

plaaf_gb-1000=GB-1000,,LGB,1000kg free-fall laser-guided bomb.

plaaf_bbm2=BBM2,,Guided Glide Bomb,The CS/BBM2 is a 100kg-class light precision-guided glide bomb developed by China North Industries Group, typically using satellite navigation (GPS/BeiDou). It is designed for efficiently striking hangars, light armored vehicles, and similar targets.

plaaf_kab-1500kr=KAB-1500Kr,,Guided Bomb,The KAB-1500Kr is a Russian 1500kg TV-guided bomb equipped with a television seeker and aerodynamic control surfaces, designed for precision strikes against high-value ground targets.

plaaf_mer_ls-6_250_6=LS-6 (250kg),Glide Bomb,AGM,The LS-6 250kg is a GPS-guided precision glide bomb consisting of a 250kg low-drag bomb with added glide and guidance kits, providing standoff precision strike capability.

plaaf_mer_ls-6_500_4l=LS-6 (500kg),Glide Bomb,AGM,The LS-6 500kg is a GPS-guided precision glide bomb consisting of a 500kg low-drag bomb with added glide and guidance kits, providing standoff precision strike capability.

plaaf_mer_ls-6_500_4r=LS-6 (500kg),Glide Bomb,AGM,The LS-6 500kg is a GPS-guided precision glide bomb consisting of a 500kg low-drag bomb with added glide and guidance kits, providing standoff precision strike capability.

