[AmmunitionNames]
#WIKI
# ------------------ AAM ------------------

plaaf_pl-2=PL-2,,AAM,The PL-2 missile is a Chinese short-range air-to-air IR missile based on the Soviet K-13 missile. It was adopted and put into production in 1972.

plaaf_aspide-1a=Aspide-1A,,AAM,The Aspide missile is a semi-active radar-guided medium-range air-to-air missile developed by Italy's Selenia. Based on the US AIM-7 Sparrow design with improvements, it provides all-weather capability for medium-range interception.

plaaf_pl-5b=PL-5B,,AAM,The PL-5 is a short-range infrared-homing air-to-air missile used by Chinese fighters. Based on Soviet R-3S missile, it is similar to the AIM-9C Sidewinder in performance.

plaaf_pl-5c=PL-5C,,AAM,The PL-5 is a short-range IR air-to-air missile used by Chinese fighters. Based on Soviet R-3S missile. It is similar to the AIM-9D Sidewinder in performance. The C variant features a nitrogen-cooled InSb seeker with all-aspect attack capability.

plaaf_pl-8=PL-8,,AAM,The PL-8 is a short-range IR dogfight air-to-air missile developed by China based on the Israeli Python-3 missile.

plaaf_pl-8b=PL-8B,,AAM,The PL-8 is a short-range IR dogfight air-to-air missile developed by China based on the Israeli Python-3 missile. The PL-8B features improved ECCM capability.

plaaf_pl-10=PL-10,,AAM,The PL-10 is a short-range IR-guided air-to-air missile developed for 4th and 5th generation Chinese fighters. It features multi-band IR imaging guidance, strong ECCM, helmet-mounted display cueing, high off-boresight capability, and extended range for a short-range IR missile.

plaaf_pl-12=PL-12,,AAM,The PL-12 is a medium-range air-to-air missile used by the PLAAF and Pakistani Air Force. It is the first avtive radar-homing missile of the PLAAF, deployed on the J-8II, J-10, JF-17, and J-11B. Export version is designated "SD-10".

plaaf_pl-12a=PL-12A,,AAM,The PL-12 is a Chinese medium-range active radar-guided AAM equipping domestic 3rd and 4th generation fighters. The PL-12A is an improved variant with overall performance roughly equivalent to the AIM-120C-5.

plaaf_pl-15=PL-15,,AAM,The PL-15 is a medium-to-long-range active radar-guided AAM developed for 4th and 5th generation Chinese fighters. It features a dual-pulse solid rocket motor and AESA radar seeker, offering high terminal speed and excellent ECCM capabilities.

plaaf_pl-15_s=PL-15,,AAM,The PL-15 is a medium-to-long-range active radar-guided AAM developed for 4th and 5th generation Chinese fighters. It features a dual-pulse solid rocket motor and AESA radar seeker, offering high terminal speed and excellent ECCM capabilities.

plaaf_pl-17=PL-17,,Long-range AAM,The PL-17 is a long-range active radar-guided air-to-air missile of the PLAAF, primarily designed to engage supporting aircraft at extended ranges, including tankers, AWACS, and bombers. It has long range and high speed but poor maneuverability, making it unsuitable against highly agile targets.

wp_aa-12=R-77,,AAM,The R-77 is a Russian active radar-guided all-weather beyond-visual-range air-to-air missile (MRAAM) with fire-and-forget capability. It equips various Russian and upgraded fighter aircraft as the backbone of Russian medium-range air combat capability.

# ------------------ SAM ------------------

# ---------- Anti-radar Missiles ---------
plaaf_akf-98a=AKF-98A,,Anti-radiation CM,The AKF-98A is a stealth-configured anti-radiation cruise missile of the PLAAF, capable of penetrating enemy air defenses using its low-observable radar signature to precisely strike low-altitude missile sites and radar installations.

plaaf_yj-91_l111=YJ-91,L111,Anti-radiation,The YJ-91 is a Chinese built Russian Kh-31P anti-radiation missile produced under license, L111 seeker is optimized for X-Band radar frequencies.

plaaf_yj-91_l112=YJ-91,L112,Anti-radiation,The YJ-91 is a Chinese built Russian Kh-31P anti-radiation missile produced under license, L112 seeker is optimized for L-Band and S-Band radar frequencies.

plaaf_yj-91_l113=YJ-91,L113,Anti-radiation,The YJ-91 is a Chinese built Russian Kh-31P anti-radiation missile produced under license, L111 seeker is optimized for C-Band and X-Band radar frequencies.

plaaf_yj-91a=YJ-91A,,Anti-radiation,The YJ-91A is an improved  variant of YJ-91, featuring enhanced jamming resistance and precision strike capability against radar targets. It also has a broad band mode which means that it can home on common search and fire control radar frequencies.

plaaf_ld-8a=LD-8A,,Anti-radiation,The LD-8A is a multi-role anti-radiation missile derived from the PL-15 air-to-air missile airframe.

plaaf_ld-8a_s=LD-8A,,Anti-radiation,The LD-8A is a multi-role anti-radiation missile derived from the PL-15 air-to-air missile airframe.

plaaf_ld-10=LD-10,,Anti-radiation,The LD-10 is a Chinese anti-radiation missile developed from the PL-12 air-to-air missile, equipped with a passive radar seeker for suppressing and destroying enemy ground-based radar targets.

# ---------- Anti-ship Missiles ----------
plan_yj-83kh=YJ-83KH,,AShM,The YJ-83KH is a subsonic anti-ship cruise missile operated by the PLAAF and PLANAF, derived from the naval YJ-83. It employs a sea-skimming flight profile and an imaging infrared (IIR) seeker for excellent penetration and jamming resistance.

plan_yj-15=YJ-15,,AShM,The YJ-15 is a supersonic anti-ship cruise missile of the PLANAF, using a ramjet engine and sea-skimming flight profile, featuring long range, large warhead, and high speed.

plaaf_yj-12=YJ-12,,AShM,YJ-12 is a supersonic long-range anti-ship cruise missile developed by China. It adopts a dual-speed regime: low speed for low-altitude cruise, and high speed (Mach 4) for terminal penetration. Equipped with composite guidance, it can perform evasive maneuvers against air defense fire at the terminal stage and features strong ECCM capability.

plaaf_yj-21=YJ-21,,hypersonic ASBM,YJ-21 is a new-generation air-launched hypersonic anti-ship missile operated by the PLAAF. Adopting a double-cone configuration and flying along a hypersonic glide trajectory, it features long range, heavy warhead power and exceptional penetration capability against air defence. It serves as a key weapon for building the maritime area denial capabilities of the PLA.

plaaf_yj-98=YJ-98,,ASM,The YJ-98 is a stealth-configured anti-ship cruise missile of the PLAAF, capable of penetrating enemy air defenses using its low-observable radar signature to precisely strike vessels.
#-----------Land Strike only missiles---------
plaaf_kd-88=KD-88,,AGM,The KD-88 is a multi-role air-to-ground missile used by the PLAAF and PLANAF, derived from the air-launched YJ-81 with a TV seeker.

plaaf_kd-88a=KD-88,,AGM,The KD-88A is a multi-role air-to-ground missile used by the PLAAF and PLANAF, derived from the air-launched YJ-81 with an imaging infrared seeker.

plaaf_akf-98=AKF-98,,Cluster Dispenser,The AKF-98 is a stealth-configured anti-runway cluster munition dispenser of the PLAAF, capable of penetrating enemy air defenses using its low-observable signature to precisely strike airfield runways and similar targets.

plaaf_kh-29te=Kh-29TE,,AGM,The Kh-29TE is a Soviet/Russian TV-guided air-to-ground missile with a robust airframe and large warhead, primarily used against hardened ground and armored targets.

plaaf_jl-1=JL-1,,Nuclear BM,JL-1 is an air-launched nuclear ballistic missile carried by the H-6N bomber.

plaaf_kd-63=KD-63,,AGM,The KD-63 is a medium-to-long range land attack cruise missile developed from the YJ-6 anti-ship missile. It uses man-in-the-loop TV guidance and is powered by a jet engine, being the first medium-to-long range precision guided weapon fielded by the PLAAF.

plaaf_kd-63b=KD-63B,,AGM,The KD-63B is a medium-to-long range land attack cruise missile derived from the YJ-6 anti-ship missile. Upgraded from the KD-63, it adopts active radar guidance and features all-weather strike capability.

plaaf_kd-63c=KD-63C,,AGM,The KD-63C is a medium-to-long range land attack cruise missile derived from the YJ-6 anti-ship missile. Based on KD-63, it is fitted with an imaging infrared (IIR) seeker and delivers all-weather strike capability.

plaaf_cj-20=CJ-20,,AGM,The CJ-20 is a new-generation multi-service long-range land attack cruise missile developed by China. Featuring long range and high accuracy, it can fly at ultra-low altitude for stealth penetration and successive strikes, serving as a vital asset for the PLAAF’s long-range land attack missions.


