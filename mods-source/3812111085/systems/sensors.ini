[ ------------------------ Visual/Infared ------------------------- ]
[JZ-8_POD_EO]
#Infrared recon pod
#User: JZ-8F
Kind=Visual
VIDRangeMultiplier=3.0         // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=4         // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.8            // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.9             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day
Recon=True                       // Indicates that this system can photograph stationary land targets and after aircraft carrying this system lands, a bonus against those targets will be applied.

[OLS-27]
#EO aiming system
#User: Su-27SK, J-11, J-11A
Kind=Visual
VIDRangeMultiplier=0.8           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=1.1           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.7             // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.9             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day



[J-16_IRST] 
#EO aiming system
#User: J-16
Kind=Visual
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=3.5           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=3.8           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=1             // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1            // the portion of full daylight added to the visibility level where 1 is roughly a mid-day


[YINGS-IIIA]
#EO/IR pod 
#Users:J-10C, J-11BG, J-15T, J-16
Kind=Visual
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=1.5           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=3.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=1             // Final VID/Detection range is multiplied by this in case when target observed on surface background
Recon=True                       // Indicates that this system can photograph stationary land targets and after aircraft carrying this system lands, a bonus against those targets will be applied.

[YINGS-IIIA_Designator] #Laser Designator
#Users:J-10C, J-11BG, J-15T, J-16
Kind=LaserDesignator
MaxRange=15.0                       // max distance in nm
NightCapable=True                   // is the designator can be used in low-visibility conditions
TargetChannels=1                    // number of targets that can be tracked at once
WeaponChannels=1000                 // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                           // Field of View of the designator




[------------------------- Radar ---------------------------]

[---Air/Air&Surface---]
[JL-7A]
#Users: J-7D
Kind=Radar
Type=DirectedSearch    // 雷达类型
HasDataLink=False      // 数据链
Role=Air             // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=1       // 如果适用，它可以同时跟踪的目标数量
WeaponChannels=0       // 火力通道，如果武器（导弹）数量合适，它可以同时制导
ViewArcs=-30,30|-12,12     // 左：水平左右视场，右：垂直视场
LookDownMultiplier=0.35     // 多径地形杂波系数，当目标投影到地形/海洋背景上时，应用于最大雷达距离的乘数，默认值为1.0
MinRange=0.1           // 最小距离
MaxRange=30           // 最大距离
MinAltitude=2296          // 最低海拔高度，不适用于对地
MaxAltitude=30480      // 最大高度
RangeResolution=30   // 识别间距，定义了后方两个目标可以被识别为两个的最小范围；单位为米
BeamWidth=1.3          // 定义承载分辨率>=2*Dist*sin（波束宽度/2）的波束宽度（度）
Gain=30.0              // 传感器上的增益（dB）
Frequency=Ku-Band       // 波段
PeakPower=8.0         // 功率 in kW

