plaaf_hf-14=HF-14,,火箭弹吊舱,四管130mm火箭巢

plaaf_hf-6=HF-6,,火箭弹吊舱,七管90mm火箭巢

wp_ub-32-57=UB-32-57,,火箭弹吊舱,UB-32-57是苏联研制的57毫米口径32管航空火箭弹吊舱，可挂载于各类固定翼战机，主要用于对地攻击和火力压制任务。

plaaf_130-Ⅱ_rocket=130-2型航空火箭,高爆,对地攻击,该弹是中国自行研制并装备部队使用的空地火箭弹，由中国北方工业集团总公司制造。

plaaf_90-Ⅰ_rocket=90-1型航空火箭,破甲,对地攻击,该弹是中国自行研制并装备部队使用的空地火箭弹，由中国北方工业集团总公司制造。

