plaaf_kd-88_pod=KD-88数据链吊舱,,数据链吊舱,KD-88数据链吊舱是中国空军为KD-88空地导弹配套研制的指令传输吊舱，用于在载机与导弹之间建立双向数据链通信，实现中段指令修正和目标数据更新，提升导弹对地面目标的精确打击能力。

plaaf_rkl-700a=RKL-700A电子战吊舱,,电子战吊舱,RKL-700A电子战吊舱是中国空军装备的电子对抗吊舱，用于对敌方雷达和通信系统进行侦察、干扰和压制，提升载机的战场生存能力和任务灵活性。

plaaf_h-6j_esm_pod=RKL-600电子侦察吊舱,,电子侦察吊舱,RKL-600电子侦察吊舱是轰-6J搭载的远程被动电子侦察设备，可远距离探测并跟踪敌方舰艇雷达辐射并为反舰导弹提供火控参数。

