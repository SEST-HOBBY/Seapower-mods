[AmmunitionNames]
#WIKI
# ------------------ AAM ------------------

plaaf_pl-2=PL-2,,空对空,霹雳-2导弹是中国的一种近程空对空导弹，仿制自苏联引进的K-13导弹，于1972年定型生产,仅具备尾后攻击能力。

plaaf_aspide-1a=阿斯派德-1A,,空对空,阿斯派德（Aspide）导弹是一种半主动雷达制导的中程空空导弹，由意大利塞莱尼亚公司研制。该导弹基于美国AIM-7"麻雀"导弹的设计，但在性能和技术上进行了改进和优化。阿斯派德导弹具备全天候作战能力，主要用于中程空对空拦截任务。

plaaf_pl-5b=PL-5B,,空对空,霹雳-5乙空对空导弹是中国战斗机使用的一种短程红外寻的导弹。它基于苏联R-13导弹技术，性能接近于AIM-9C响尾蛇。

plaaf_pl-5c=PL-5C,,空对空,霹雳-5空对空导弹是中国战斗机使用的一种短程红外空空导弹。它基于苏联R-13导弹技术，类似于AIM-9C响尾蛇。C型是利用霹雳-8导弹上的成熟技术对霹雳-5B进行改进的产品，采用氮气制冷锑化铟导引头，具备全向攻击能力‌。

plaaf_pl-8=PL-8,,空对空,霹雳-8近距空空导弹是中国研制的红外格斗空空导弹，由西安东方机械厂生产，仿制自以色列怪蛇3导弹，具备射程远机动性强的特点。

plaaf_pl-8b=PL-8B,,空对空,霹雳-8近距空空导弹是中国研制的红外格斗空空导弹，由西安东方机械厂大批生产，仿制自以色列怪蛇3导弹，具备射程远机动性强的特点。B型提升了导引头抗干扰能力。

plaaf_pl-10=PL-10,,空对空,霹雳-10是中国为第四代和第五代战斗机研制的近距红外制导空空导弹。导弹导引头采用多重红外成像制导技术，具有很强的抗干扰能力，支持头盔显示器随动。导弹支持大离轴，大过载发射条件，拥有近距红外格斗弹中较远的射程。

plaaf_pl-12=PL-12,,空对空,霹雳-12是中国人民解放军空军与巴基斯坦空军使用的中程超视距空对空导弹，也是目前解放军服役中仅次于霹雳-15的最新型空战用导弹。已装备在歼-8II，歼-10，枭龙战机和歼-11上。外销版本称"闪电-10"。

plaaf_pl-12a=PL-12A,,空对空,霹雳-12是中国空军装备的中程主动雷达制导空空导弹，装备国产第三代和第四代战斗机。霹雳-12A是其改进型，总体性能约相当于AIM-120C-5空空导弹。

plaaf_pl-15=PL-15,,空对空,霹雳-15是中国为第四代和第五代战斗机研制的中远程主动雷达制导空空导弹。导弹采用双脉冲固体火箭发动机，有源相控阵主动雷达导引头，具备高末端速度和优异的抗电子干扰能力。

plaaf_pl-15_s=PL-15,,空对空,霹雳-15是中国为第四代和第五代战斗机研制的中远程主动雷达制导空空导弹。导弹采用双脉冲固体火箭发动机，有源相控阵主动雷达导引头，具备高末端速度和优异的抗电子干扰能力。

plaaf_pl-17=PL-17,,远程空对空,霹雳-17是中国空军装备的远程主动雷达制导空空导弹，主要用于在超远距离上攻击辅助和支援飞机目标，包括加油机，预警机，轰炸机等，导弹射程远速度快，但机动性较差，不适合攻击高机动性的目标。

wp_aa-12=R-77,,空对空,R-77空空导弹是苏联/俄罗斯一型主动雷达制导全向全天候中距空空导弹（MRAAM），具备发射后不管能力，可装备于多种俄制及改进型战机，是俄罗斯空军的主力中距空战武器。

# ------------------ SAM ------------------

# ---------- Anti-radar Missiles ---------
plaaf_akf-98a=AKF-98A,,反辐射巡航导弹,AKF-98A是中国空军装备的隐身构型反辐射巡航导弹，可利用其雷达低可视特性穿透地方防空网络，对低空导弹阵地和各类雷达阵地目标发动精确打击。

plaaf_yj-91_l111=YJ-91,L111,反辐射,鹰击-91是中国仿制俄罗斯KH-31的反辐射导弹，目标波段为X波段

plaaf_yj-91_l112=YJ-91,L112,反辐射,鹰击-91是中国仿制俄罗斯KH-31的反辐射导弹，目标波段为L波段和S波段

plaaf_yj-91_l113=YJ-91,L113,反辐射,鹰击-91是中国仿制俄罗斯KH-31的反辐射导弹，目标波段为C波段和X波段

plaaf_yj-91a=YJ-91A,,反辐射,鹰击-91A是中国在鹰击-91反辐射导弹基础上改进的电子对抗型导弹，具备更强的抗干扰能力和对宽频雷达目标的精确打击能力。

plaaf_ld-8a=LD-8A,,反辐射,雷电-8A反辐射导弹是利用霹雳-15空空导弹构型改进而来的通用反辐射导弹。

plaaf_ld-8a_s=LD-8A,,反辐射,雷电-8A反辐射导弹是利用霹雳-15空空导弹构型改进而来的通用反辐射导弹。

plaaf_ld-10=LD-10,,反辐射,LD-10反辐射导弹是中国在霹雳-12空空导弹基础上改进研制的反辐射导弹，采用被动雷达导引头，主要用于压制和摧毁敌方地面雷达目标。

# ---------- Anti-ship Missiles ----------
plan_yj-83kh=YJ-83KH,,反舰导弹,鹰击-83KH是中国空军和中国海军航空兵装备的亚音速反舰巡航导弹，其自舰载型鹰击-83反舰导弹发展而来，采用低空掠海飞行剖面和红外成像（IIR）导引头，具备优秀的突防和抗干扰能力。

plan_yj-15=YJ-15,,超音速巡航导弹,鹰击-15是中国海军航空兵装备的超音速反舰巡航导弹，采用冲压发动机和低空掠海飞行剖面，具备射程远，威力大，速度快的特点。

plaaf_yj-12=YJ-12,,反舰导弹,鹰击-12是中国自主研发的超音速远程反舰巡航导弹, 采用双速制，较低速度用于低空巡航，末端突防采用高速（4马赫）。采用复合制导，末端可进行机动规避防空火力，抗干扰能力强。

plaaf_yj-21=YJ-21,,高超音速反舰导弹,鹰击-21是中国空军装备的新一代空射高超音速反舰导弹，导弹采用双锥体构型，以高超音速滑翔弹道飞行，具有射程远，威力大，突防能力极强的特点，是构建海上区域拒止作战体系的重要武器。

plaaf_yj-98=YJ-98,,反舰导弹,鹰击-98是中国空军装备的隐身构型反舰巡航导弹，可利用其雷达低可视特性穿透防空网络，对舰船发动精确打击。
#-----------Land Strike only missiles---------
plaaf_kd-88=KD-88,,空对地,空地-88导弹是中国空军和海军航空兵装备的多用途空对地导弹，自空射型鹰击-81导弹发展而来，采用电视导引头。

plaaf_kd-88a=KD-88A,,空对地,空地-88A导弹是中国空军和海军航空兵装备的多用途空对地导弹，自空射型鹰击-81导弹发展而来，采用红外成像导引头。

plaaf_akf-98=AKF-98,,子母弹布撒器,AKF-98是中国空军装备的隐身构型反跑道子母弹布撒器，可利用其雷达低可视特性穿透敌方防空网络，对机场跑道等目标发动精确打击。

plaaf_kh-29te=Kh-29TE,,空对地,Kh-29TE是苏联/俄罗斯研制的电视制导空对地导弹，弹体坚固、战斗部威力大，主要用于攻击敌方坚固地面目标和装甲目标。

plaaf_jl-1=JL-1,,空对地,惊雷-1是一种远程空射高超音速核导弹，由轰-6N轰炸机搭载。

plaaf_kd-63=KD-63,,空对地,空地-63导弹是由鹰击-6反舰导弹发展而来的中远程对地巡航导弹，采用人在回路电视制导，喷气发动机提供动力，是中国空军装备的第一款中远程精确制导武器。

plaaf_kd-63b=KD-63B,,空对地,空地-63B导弹是由鹰击-6反舰导弹发展而来的中远程对地巡航导弹，在空地-63导弹的基础上改用主动雷达制导，具备全天候打击能力。

plaaf_kd-63c=KD-63C,,空对地,空地-63C导弹是由鹰击-6反舰导弹发展而来的中远程对地巡航导弹，在空地-63导弹的基础上改用红外图像（IIR）导引头，具备全天候打击能力。


