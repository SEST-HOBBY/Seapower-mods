plaaf_gb-500=GB-500,,激光制导炸弹,GB-500是中国空军装备的500千克级激光制导炸弹，由500千克低阻航空炸弹加装激光导引头改装而成，具备较高的命中精度。

plaaf_500-Ⅲ=500-Ⅲ,低阻炸弹,对地攻击,中国500千克Ⅲ型航空低阻炸弹

plaaf_250-Ⅲ=250-Ⅲ,低阻炸弹,对地攻击,中国250千克Ⅲ型航空低阻炸弹

plaaf_ls-6_250=LS-6（250公斤）,滑翔炸弹,对地攻击,LS-6型250千克GPS精确制导滑翔炸弹由250公斤低阻航空炸弹加装滑翔和制导组件构成，具备防区外精确制导打击能力。

plaaf_ls-6_500=LS-6（500公斤）,滑翔炸弹,对地攻击,LS-6型500千克GPS精确制导滑翔炸弹由500公斤低阻航空炸弹加装滑翔和制导组件构成，具备防区外精确制导打击能力。

plaaf_ls-6_500_zc=LS-6（500公斤增程）,增程型,滑翔炸弹,雷石-6增程型是使用滑翔套件并加装涡轮喷气发动机改装的500公斤通用航空炸弹，GPS制导，主要用于打击固定地面目标。

plaaf_gb-3=GB-3,,激光制导炸弹,250千克卫星定位改装套件激光制导炸弹。

plaaf_gb-250=GB-250,,激光制导炸弹,250千克自由落体激光制导炸弹。

plaaf_gb-500=GB-500,,激光制导炸弹,500千克自由落体激光制导炸弹。

plaaf_gb-1000=GB-1000,,激光制导炸弹,1000千克自由落体激光制导炸弹。

plaaf_bbm2=BBM2,,制导滑翔炸弹,CS/BBM2是一种由中国兵器工业集团研发的100公斤级轻型精准制导滑翔炸弹，通常采用卫星导航（GPS/北斗）制导。该炸弹主要用于高效率打击机库、轻型装甲车辆等目标。

plaaf_kab-1500kr=KAB-1500Kr,,制导炸弹,KAB-1500Kr是俄罗斯研制的1500千克级电视制导炸弹，配备电视导引头和气动控制面，主要用于精确打击敌方高价值地面目标。

plaaf_mer_ls-6_250_6=LS-6（250公斤）,滑翔炸弹,对地攻击,LS-6型250千克GPS精确制导滑翔炸弹由250公斤低阻航空炸弹加装滑翔和制导组件构成，具备防区外精确制导打击能力。

plaaf_mer_ls-6_500_4l=LS-6（500公斤）,滑翔炸弹,对地攻击,LS-6型500千克GPS精确制导滑翔炸弹由500公斤低阻航空炸弹加装滑翔和制导组件构成，具备防区外精确制导打击能力。

plaaf_mer_ls-6_500_4r=LS-6（500公斤）,滑翔炸弹,对地攻击,LS-6型500千克GPS精确制导滑翔炸弹由500公斤低阻航空炸弹加装滑翔和制导组件构成，具备防区外精确制导打击能力。

