plaaf_wz-8=无侦-8无人侦察机,,对面侦察,无侦-8是一种火箭动力高空高速侦察机，其可由轰-6M和轰-6N轰炸机挂载和发射，可搭载雷达或红外光电侦察设备。该机通过母机数据链操控并实施高空高速侦察，巡航高度超过30公里，最大速度超过3马赫。