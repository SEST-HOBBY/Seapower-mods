[plaaf_j-16d]
Type=电战机
Default=歼-16D,歼-16D
DefaultDescription=歼-16D是基于歼-16双座战斗轰炸机发展而来的专用电子战飞机，拆除了机炮和红外搜索跟踪系统，在翼尖安装电子情报吊舱，并在机翼下挂载电子干扰吊舱。该机可执行伴随电子干扰、防空压制和防区外电子攻击任务，是中国空军电子战能力的重要组成。
Squadron1=歼-16D,歼-16D

[plaaf_j-16]
Type=战斗轰炸机
Default=歼-16,歼-16
DefaultDescription=歼-16是中国自主研制的双座双发重型多用途战斗轰炸机，基于歼-11BS平台深度改进而来。该机换装有源相控阵（AESA）雷达和国产涡扇-10B"太行"发动机，具备强大的对空、对地和对海精确打击能力，可挂载霹雳-15、霹雳-10空空导弹以及各类精确制导对地/反舰弹药，是中国空军现役主力重型多用途战机。
Squadron1=歼-16,歼-16

[plaaf_h-6k]
Type=轰炸机
Default=轰-6K,轰-6K
DefaultDescription=轰-6是中国空军和海军航空兵装备的中型轰炸机，其源自1960年代中国自苏联引进的图-16中型轰炸机。其各种改进版本在60余年的时间中承担了中国空军和海军航空兵的中远程常规战术打击，战略核威慑，和远程海上侦察和反舰任务，是中国远程空中火力投送的绝对主力。轰-6K是2010年代初诞生的全面升级型号，部分机体结构重新设计，换装国产先进航电和传感器设备，换装国产涡扇-18发动机，可以挂载中国新一代远程空地巡航导弹、空地弹道导弹和远程反舰导弹，进一步加强了其防区外打击能力。
Squadron1=轰-6K,轰-6K

[plaaf_h-6k_early]
Type=轰炸机
Default=轰-6K（早期型）,轰-6K
DefaultDescription=轰-6是中国空军和海军航空兵装备的中型轰炸机，其源自1960年代中国自苏联引进的图-16中型轰炸机。其各种改进版本在60余年的时间中承担了中国空军和海军航空兵的中远程常规战术打击，战略核威慑，和远程海上侦察和反舰任务，是中国远程空中火力投送的绝对主力。轰-6K是2010年代初诞生的全面升级型号，部分机体结构重新设计，换装国产先进航电和传感器设备，换装国产涡扇-18发动机，可以挂载中国新一代远程空地巡航导弹、空地弹道导弹和远程反舰导弹，进一步加强了其防区外打击能力。
Squadron1=轰-6K,轰-6K

[plaaf_h-6k_late]
