[plaaf_j-7ii]
Type=战斗机
Default=歼-7II,歼-7II
DefaultDescription=歼-7战斗机是由中国制造的第二代超音速喷气式战斗机。1961年，中国引进苏联米格-21F-13战斗机，此后在中苏交恶，苏联撤走全部技术协助的情况下于1966年成功试制国产化的米格-21战斗机，并定型为歼-7战斗机。1968年，中国航空工业成都飞机公司开始改进歼-7战斗机，并于1975年推出改进进气口，加装机炮的歼-7I战斗机。1979年，装新型弹射座椅，换装涡喷-7乙发动机，加大航程的歼-7II战斗机定型量产。
Squadron1=歼-7II（空1师）,歼-7II
Squadron2=歼-7II（空2师）,歼-7II
Squadron3=歼-7II（海航8师）,歼-7II
Callsigns=Squadron1,雄鹰|Squadron2,雄狮|Squadron3,英雄

[plaaf_j-7iiia]
Type=战斗机
Default=歼-7IIIA,歼-7IIIA
DefaultDescription=歼-7战斗机是由中国制造的第二代超音速喷气式战斗机。1961年，中国引进苏联米格-21F-13战斗机，此后在中苏交恶，苏联撤走全部技术协助的情况下于1966年成功试制国产化的米格-21战斗机，并定型为歼-7战斗机。1978年起，参照苏联米格-21MF全天候战斗机，中国开始研制具有全天候作战能力，装备机载搜索和火控雷达的歼-7III（歼-7C）战斗机，并于1984年成功首飞。1995年装备加大推力的涡喷-13F1发动机和改进机载武器航电设备的歼-7IIIA（歼-7D）定型生产。由于歼-7III/IIIA飞机定型时性能已经落后，仅生产了50架。
Squadron1=歼-7IIIA（空9师）,歼-7IIIA
Callsigns=Squadron1,雄鹰

[plaaf_j-7e]
Type=战斗机
Default=歼-7E,歼-7E
DefaultDescription=歼-7战斗机是由中国制造的第二代超音速喷气式战斗机。1961年，中国引进苏联米格-21F-13战斗机，此后在中苏交恶，苏联撤走全部技术协助的情况下于1966年成功试制国产化的米格-21战斗机，并定型为歼-7战斗机。1986年，中国航空工业成都飞机公司与西北工业大学合作改进歼-7II飞机，大翼采用双三角翼搭配前缘机动襟翼构型，极大提升了中低空亚音速和跨音速机动性，换装涡喷-13F1发动机，并改装更先进的航电设备。该机于1993年定型为歼-7E，共生产260架。
Squadron1=歼-7E（空1师）,歼-7E
Squadron2=歼-7EH（海航3师）,歼-7EH
Callsigns=Squadron1,雄鹰|Squadron2,雄狮

