[plaaf_h-6n]
Type=轰炸机,战略轰炸机
Default=轰-6N,轰-6N
DefaultDescription=轰-6是中国空军和海军航空兵装备的中型轰炸机，其源自1960年代中国自苏联引进的图-16中型轰炸机。其各种改进版本在60余年的时间中承担了中国空军和海军航空兵的中远程常规战术打击，战略核威慑，和远程海上侦察和反舰任务，是中国远程空中火力投送的绝对主力。轰-6N是2018年服役的改进型号，主要承担战略核威慑和空基核打击职责。轰-6N在轰-6K的基础上升级航电设备，换装有源相控阵雷达，增加空中受油能力，可挂载惊雷-1空基战略弹道导弹。在保留各种远程制导弹药挂载能力的基础上，该机还可携带无侦-8超音速无人侦察机执行远程高速侦察任务。
Squadron1=轰-6N,轰-6N