DefaultDescription=轰-6是中国空军和海军航空兵装备的中型轰炸机，其源自1960年代中国自苏联引进的图-16中型轰炸机。其各种改进版本在60余年的时间中承担了中国空军和海军航空兵的中远程常规战术打击，战略核威慑，和远程海上侦察和反舰任务，是中国远程空中火力投送的绝对主力。轰-6K是2010年代初诞生的全面升级型号，部分机体结构重新设计，换装国产先进航电和传感器设备，换装国产涡扇-18发动机，可以挂载中国新一代远程空地巡航导弹、空地弹道导弹和远程反舰导弹，进一步加强了其防区外打击能力。
Squadron1=轰-6K,轰-6K

[plaaf_h-6j]
Type=轰炸机
Default=轰-6J,轰-6J
DefaultDescription=轰-6是中国空军和海军航空兵装备的中型轰炸机，其源自1960年代中国自苏联引进的图-16中型轰炸机。其各种改进版本在60余年的时间中承担了中国空军和海军航空兵的中远程常规战术打击，战略核威慑，和远程海上侦察和反舰任务，是中国远程空中火力投送的绝对主力。轰-6J是2018年服役的改进型号，主要装备海军航空兵，承担远海侦察和反舰打击任务。轰-6J在轰-6K的基础上升级航电设备，换装有源相控阵雷达，可携带远程被动电子侦察吊舱，通过定位敌方舰船电子辐射发动反舰打击。
