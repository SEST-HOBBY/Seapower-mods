[plaaf_j-11b]
Type=战斗机
Default=歼-11B,歼-11B
DefaultDescription=2000年起，在吸收苏-27SK战斗机生产技术的基础上，中国利用本国技术升级改造苏-27的机体，推出的本土化改型，实现机体、材料、发动机、航电系统和武器的全面国产化。歼-11B应用国产符合材料技术改进机体设计，减轻结构重量，增加机体使用寿命；换装国产涡扇-10B"太行"涡轮风扇发动机。在航电和传感器方面，歼-11B换装了国产数字综合航电武器系统，采用全玻璃化座舱、四余度数字式电传操纵系统、国产1493型平板缝隙天线火控雷达。歼-11B的主要对空武器是霹雳-12主动雷达制导空空导弹和霹雳-8B红外空空导弹，此外还可挂载精确制导对地弹药。
Squadron1=歼-11B（空16旅"贺兰雄狮"）,歼-11B
Squadron2=歼-11B（辽东雄鹰）,歼-11B
Squadron3=歼-11B（空1旅）,歼-11B
Callsigns=Squadron1,雄狮|Squadron2,雄鹰

[plaaf_j-11bh]
Type=战斗机
Default=歼-11BH,歼-11BH
DefaultDescription=2000年起，在吸收苏-27SK战斗机生产技术的基础上，中国利用本国技术升级改造苏-27的机体，推出的本土化改型，实现机体、材料、发动机、航电系统和武器的全面国产化。歼-11B应用国产符合材料技术改进机体设计，减轻结构重量，增加机体使用寿命；换装国产涡扇-10B"太行"涡轮风扇发动机。在航电和传感器方面，歼-11B换装了国产数字综合航电武器系统，采用全玻璃化座舱、四余度数字式电传操纵系统、国产1493型平板缝隙天线火控雷达。歼-11B的主要对空武器是霹雳-12主动雷达制导空空导弹和霹雳-8B红外空空导弹，此外还可挂载精确制导对地弹药，H代表海军航空兵
Squadron1=歼-11BH,歼-11BH
Callsigns=Squadron1,雄狮|Squadron2,雄鹰

