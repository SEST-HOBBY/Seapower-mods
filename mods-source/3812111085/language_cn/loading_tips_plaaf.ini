[LoadingTips]
Count=11
Header=中国空军MOD提示
Tip001=想要在超视距空战里取得优势？那就让你的战机爬得更高飞的更快！
Tip002=空对空导弹的射程取决于载机的速度与高度，当然也与目标的姿态挂钩。
Tip003=高空空气稀薄，空气阻力小，能够使导弹拥有更远的射程。
Tip004=霹雳-17为光杆弹设计，可用过载相对于中距弹更小，攻击高机动目标容易脱靶。
Tip005=霹雳-12A使用了与霹雳-15相同的近炸引信，使其战斗部的大小缩短了将近三分之一，这使霹雳-12A的动力段比霹雳-12更长，同时优化了飞控，射程更远。
Tip006=躲避导弹最好方法是让导弹追不上你，而不是试图欺骗导引头。
Tip007=雷达扫描低处的目标会被多径杂波影响，有效距离会缩短。
Tip008=发射导弹后最好不要对着目标飞，这会让对方导弹的相对射程也延长。
Tip009=敌机的姿态会影响红外导引头的作用距离，尾追最大迎头最小。
Tip010=LD-10是一种非常轻的反辐射导弹，由霹雳-12改造，允许挂载霹雳-12的挂架都有挂载LD-10的能力。
Tip011=中国空军只购买了85发阿斯派德-1A。
