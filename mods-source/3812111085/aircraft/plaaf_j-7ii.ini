#Parameters
MaxG=8.2                                // Mostly for horizontal turns

MaxClimbRate=175                      //Meters per second
EmptyMass=5275                    // in kg
MaxFuel=2080                       // in kg, internal tanks only

PerEngineMaxThrust=39000              //Newtons
PerEngineMaxAfterburnerThrust=56300  //Newtons
EngineCount=1
EngineWarmUp=15

Ceiling=60000.0                       // ceiling in feet
CruiseAltitude= ????                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
