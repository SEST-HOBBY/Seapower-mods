[General]
# Copperhead-100M released from the MV-75: the same lightweight-class autonomous undersea munition as the
# ship and drone launched version, fitted with a parachute for release from the air.
# Published: 12.75 in (324 mm) diameter, 106 in (2.69 m) length, over 30 knots, about 100 lb payload, electric.
# Weight, range, depth and warhead yield are not published; values below match the ship and drone version.
# Release values (minimum range, launch altitudes, parachute) follow the stock air-dropped Mk 46 Mod 5.
Type=Torpedo
TargetType=ASuW
SecondaryTargetType=ASW
Mass=230
AmmoPoints=690
IOCDate=2025
FOCDate=2026
SupplyCategory=AirTorpedo
AirLaunched=True
DefaultCameraDistance=0.5
MinCameraDistanceForeAft=0.1
MinCameraDistanceBroadside=0.1
CameraPivotHeight=0.0
SaturationValue=3
DecalClass=Standard
FrontalArea=0.0824
SideArea=0.84
BottomArea=0.84

[SensorData]
IRSignature=VeryTiny
RCS=VerySmall
BaseNoise=105
FlowNoise=0.5
CavitationNoise=0
TargetReflectionStrength=0
TransientRCS=-1
TransientVisualIdentificationRange=-1
TransientBaseNoise=145

[Physics]
ParachuteSlowDown=0.99
ParachuteEndVelocity=100.0
MaxAngleWithParachute=80.0

[WarheadData]
WarheadType=0
Power=27
ImpactSize=Medium
Penetration=Always
FuzeProximityDistance=8

[Guidance]
# Combined active and passive sonar homing with onboard target selection. No link to the aircraft after release.
GuidanceType=10
MidCourseCorrection=0
InitialFlightPhaseDuration=3
TerminalVelocity=32.0
Acceleration=8.0
MaxTurnRate=18.0
# Speed settings in knots and full-charge range in nautical miles at each speed (estimates).
SpeedSettings=8,15,32
SpeedSettingRanges=30,15,5
MinLaunchRange=0.5
MinLaunchAltitude=100
MaxLaunchAltitude=1000
MaxDepth=2000
DefaultDepth=40
SeekerReliability=0.95
WarheadReliability=0.95
SeekerFOV=80.0
SeekerActiveRange=1.0
SeekerPassiveRange=1.0
SeekerGain=36.0
SeekerOutputPower=215
AntiCountermeasuresBonus=0.35
MinAfterSpoofEffectTime=3.0
MaxAfterSpoofEffectTime=10.0
AllowedSearchModes=0,1,2,4
SearchMode=2
SearchVelocity=15.0
SnakeSearchAngle=30.0
SnakeSearchTurnCycleTime=6.0
ReattackMode=1
ReattackCircleDegreesPerSecond=14.0
CircleDegreesPerSecond=12.0
CircleMoveFwdAfterCircleInSeconds=8.0

[Models]
ResourcesFolder=weapons/usa_v280_copperhead_100m/
ResourcesRoot=usa_v280_copperhead_100m.obj
ResourcesMesh=hull
ResourcesMaterialFolder=weapons/usa_v280_copperhead_100m/
ResourcesMaterial=copperhead_mat.ini
NumberOfSubModels=4
SubModel1=Recess
SubModel2=Propeller
SubModel3=Bands
SubModel4=Band

[Recess]
Mesh=hull_c100_recess
ResourcesMaterialFolder=weapons/usa_v280_copperhead_100m/
Material=copperhead_recess_mat.ini

[Propeller]
# Torpedo propellers spin about their local up axis: this copy is stored upright and turned back here.
Type=Propulsion
RotationDirection=Left
Mesh=usn_uuv_copperhead_100_propeller_y
Position=0,0,-0.0203866
Rotation=90,0,0
ResourcesMaterialFolder=weapons/usa_v280_copperhead_100m/
Material=copperhead_metal_mat.ini

[Bands]
# Two steel suspension bands for carriage on the MV-75 torpedo hangers, centred under the hangers at 0.355 m
# either side of the station.
Mesh=hull_c100_air_band
ResourcesMaterialFolder=weapons/usa_v280_copperhead_100m/
Material=copperhead_strap_mat.ini

# Orange-yellow munition band just forward of the first section ring, as on the Copperhead-100M product image.
[Band]
Mesh=hull_c100m_yellow_band
ResourcesMaterialFolder=weapons/usa_v280_copperhead_100m/
Material=copperhead_band_mat.ini

[Particles]
DudExplosionClass=SmallFlakExplosions
ParachuteEffect=effects/weapons/emitters/parachute_square
ParachuteEffectPosition=0,0,-0.02
BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
BoosterEffectPosition=0,0,0
InFlightEffect=effects/weapons/emitters/aswtorpedo_cavitation_particle
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0
HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes
ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[Sounds]
