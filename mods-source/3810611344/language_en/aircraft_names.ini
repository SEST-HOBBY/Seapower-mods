Default=MV-75 Cheyenne II Army,MV-75A
DefaultDescription=The MV-75 Cheyenne II is the US Army's Future Long Range Assault Aircraft, developed from Bell's V-280 Valor tiltrotor, which first flew on December 18, 2017. The Army chose Bell's design in December 2022, designated it MV-75 in 2025 and named it Cheyenne II in April 2026, honoring the Cheyenne and Arapaho Tribes and the Northern Cheyenne Tribe. Its rotors tilt forward to cruise like an airplane and upright to land like a helicopter.\nThis Army version carries eight passengers and two M134 door miniguns, and can be armed with eight AGM-114L Hellfires or an anti-submarine fit.
Callsigns=Default,Cheyenne
