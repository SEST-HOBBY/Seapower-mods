[usa_v280_systems_fixture]
Type=Naval Tiltrotor
Default=MV-75 Cheyenne II Navy,MV-75N
DefaultDescription=The MV-75 Cheyenne II is the US Army's Future Long Range Assault Aircraft, developed from Bell's V-280 Valor tiltrotor, which first flew on December 18, 2017. The Army chose Bell's design in December 2022, designated it MV-75 in 2025 and named it Cheyenne II in April 2026, honoring the Cheyenne and Arapaho Tribes and the Northern Cheyenne Tribe. Its rotors tilt forward to cruise like an airplane and upright to land like a helicopter.\nThis naval version imagines the Cheyenne II at sea, flying from carriers and amphibious ships. For anti-submarine work it carries a dipping sonar, twelve sonobuoys and two Mk 46 or Copperhead-100M torpedoes, and for surface strike eight AGM-114L Hellfires. Two M134 miniguns cover the cabin doors, and in the transport role it carries eight passengers.
Callsigns=Default,Cheyenne

[usa_mv75_army]
