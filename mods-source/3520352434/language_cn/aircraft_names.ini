[se_jas-39]
Type=战斗机
Default=JAS-39 鹰狮,鹰狮
DefaultDescription=JAS-39战斗机，英文代号：JAS-39，，是瑞典一型战斗机，在世代上属于第四代战斗机。JAS-39战斗机用以取代Saab-37战斗机，其“JAS”缩写为瑞典文中的“Jakt”（对空战斗）“Attack”（对地攻击）“Spaning”（侦察）的缩写，其为一战斗、攻击、侦察兼具的多功能战斗机（Multirole Aircraft）。JAS-39战斗机由瑞典萨博公司（SAAB）（Svenska Aeroplan AB）为中心所研制，首飞于1988年，之后向全世界推销，已服役于瑞典、捷克、匈牙利等国空军，并正于南非空军中成军。2007年10月，泰国国会也已批准首批六架JAS-39战斗机订单。JAS-39在续航距离的妥协、汰换运用上的容易性与高效能低价位的实现使得其成为当今世界最具关注度、最畅销的战斗机之一，且和中国与巴基斯坦共同研制的FC-1战斗机定位相同，亦为FC-1枭龙战斗机在国际上最大的竞争对手。
Squadron1=JAS-39 鹰狮,鹰狮


