usn_aim-9x_LQS=AIM-9X,响尾蛇,空对空,AIM-9X响尾蛇是美国的红外制导空对空导弹，X型进行了大幅度的升级，拥有强大的抗干扰能力更远的射程，以及令人印象深刻的越肩发射能力。

usaf_aim-120c7_LQS=AIM-120C-7,阿姆拉姆,空对空,AIM-120是美国的的主动雷达制导空对空导弹，用于取代老旧的麻雀半主动雷达制导空对空导弹，其体积小巧。可以被大部分飞机携带。

