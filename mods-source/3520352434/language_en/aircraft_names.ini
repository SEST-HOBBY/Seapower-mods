DefaultDescription=The JAS-39 fighter, codenamed JAS-39, is a Swedish fighter jet, belonging to the fourth generation of fighter jets. The JAS-39 fighter jet is used to replace the Saab-37 fighter jet. Its "JAS" abbreviation is the abbreviation of "Jakt" (air combat), "Attack" (ground attack), and "Spaning" (reconnaissance) in Swedish. It is a multi-role fighter aircraft (Multirole Aircraft) that combines combat, attack, and reconnaissance. The JAS-39 fighter jet was developed by the Swedish Saab Company (SAAB) (Svenska Aeroplan AB) as the center. It first flew in 1988 and was later marketed to the world. It has been in service with the air forces of Sweden, the Czech Republic, Hungary and other countries, and is being formed into a military in the South African Air Force. In October 2007, the Thai Parliament also approved the first batch of six JAS-39 fighter jets. The JAS-39's compromise in range, ease of replacement and use, and high efficiency and low price make it one of the most watched and best-selling fighter jets in the world today. It has the same positioning as the FC-1 fighter jet jointly developed by China and Pakistan, and is also the FC-1 Xiaolong fighter's biggest competitor in the world.
