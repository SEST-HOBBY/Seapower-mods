#=========================================================================================================================================================
#                           RBS-15 
#=========================================================================================================================================================
[General]
# RBS15 F 
Type=Missile
TargetType=ASuW
LandAttackCapability=Installation,ShoreTargetsOnly

AmmoPoints=2350 

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

MissileDefenceBonus=0.1                     // added chance to evade missile compounded by below factors
CIWSDefenceBonus=5                     // added chance to evade CIWS compounded by below factors


DecalClass=Standard

[SensorData]
VisualIdentificationRange=2
IRSignature=Small
RCS=VerySmall
TransientRCS=Meager
TransientVisualIdentificationRange=15
TransientBaseNoise=220

[---------- Warhead Data ----------]
[WarheadData]
WarheadType=1
Power=42
ImpactSize=Large
Penetration=Heavy

[---------- Guidance ----------]
[Guidance]
GuidanceType=3
MidCourseCorrection=0
TargetRequired=False                 
InitialFlightPhaseDuration=3
PerformsSlightBallisticInitialFlight=True
TerrainFollowFlight=True
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
#======================================== Flight Profile ===========================================================
# flight phase 1: loft
MaxLoftAngle=30.0
MaxLoftAlt=300.0              # feet

# flight phase 2: sea skimming
SeaSkimmingAlt=30.0
SeaSkimmingMaxDescentAngle=35.0
SeaSkimmingNoseUp=1.0
SeaSkimmingStartDistToTarget=50

# flight phase 3: (optional terminal popup) -- enabled
# flight phase 4: terminal approach
TerminalApproachDist=25.0
TerminalDiveDistance=0.5
TerminalAlt=10.0
SupportsBanking=True

GroupSize=4                            // Indicates that missiles can join into groups
GroupJoinRange=20                      // in miles
GroupSpacing=0.3                       // in miles. interval between misseles in line
#============================================= Misc ================================================================
HasEndgameWeave=True
EndgameWeaveAmplitude=20.0
EndgameWeaveFrequency=1.0
AltitudeOverClutter=40

#========================================= Launch stats ============================================================
MaxVelocity=529.0
Acceleration=5.5
MaxTurnRate=13.0
MinLaunchRange=3.0
MaxLaunchRange=80.0
LaunchReliability=98

#========================================     Seeker     ===========================================================
SeekerGain=45.0
SeekerFOV=120
SeekerActiveRange=15.0
SeekerPassiveRange=0.0
SecondaryPassiveRadarGuidanceType=HomeOnJam
PassiveRadarGuidanceFrequencies=X-Band,Ku-Band
NightVisionLevel=0.0
Zoom=3
TargetMemory=True
Frequency=Ku-Band
PeakPower=40.0
AntiCountermeasuresBonus=0.45
AntiJammerBonus=0.35
ReattackMode=1                         // 0 = None, 1 = Circle, 2 = Drive-around

WobblingStrength=1.7                  // amplitude of wobbling
WobblingSpeed=1.0                      // frequency of wobbling

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/RBS15F/
ResourcesRoot=RBS15F.obj
ResourcesMesh=RBS15
ResourcesMaterialFolder=assets/models/ammunition/RBS15F/
ResourcesMaterial=RBS15F_mat.ini
#ResourcesMeshForLaunch=usn_rim-66c_dummy
#ResourcesMeshForLaunch=wp_sa-n-1_dummy
ResourcesMeshSwitchTime=0.0 // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=None

InFlightEffect=effects/weapons/emitters/turbojet_sustainer_small
InFlightEffectPosition=0,0,-0.035
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=LargeWaterSplashes

DebrisTrail=effects/aircraft/emitters/helicopterfireeffect
HitWaterSplashClass=LargeWaterSplashes
ExplosionOverwaterSplash=False

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
#creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.02
