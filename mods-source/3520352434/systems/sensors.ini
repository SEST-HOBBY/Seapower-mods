[ ------------------------ Visual/Infared ------------------------- ]

[Damoncles]
Kind=Visual
VIDRangeMultiplier=2.4          // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=5.8           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.95            // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

[Skyward-G]
Kind=Visual
VIDRangeMultiplier=1.9          // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=2.3           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.6            // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

[---------------------------------------- Laser Designator ---------------------------]

[SPK-39 Pod] 
Kind=LaserDesignator
MaxRange=9.3                       // max distance in nm
NightCapable=True                   // is the designator can be used in low-visibility conditions
TargetChannels=2                    // number of targets that can be tracked at once
WeaponChannels=1000                 // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                           // Field of View of the designator

[------------------------- Radar ---------------------------]

[---Air/Air&Surface---]

[PS-05/A Mk4 AESA]
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface              // Role can be "Surface", "Air", "AirAndSurface"
Mode=RadioCommand        // Can be "Illuminate", "RadioCommand"
TargetChannels=20       // if applicable number of targets it can track simultaneously
WeaponChannels=8     // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-90,90|-90,90      // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=0.9     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0.6           // min range in km
MaxRange=222.2           // max range in km
MinAltitude=25          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=50480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=20.5   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.05          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=55.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=27.0         // output peak power in kW
RequiresAlignment=True
