[plaaf_j-8b]
Type=战斗机
Default=歼-8B,歼-8B
DefaultDescription=歼-8B是歼-8II系列飞机的首个改型，于1988年开始研制，1995年服役。该机换装涡喷-13A发动机，装备衍射屏显，大气数据计算机，SL-5A单脉冲火控雷达。主要对空武器是自意大利引进的阿斯派德（Aspide）半主动雷达制导空空导弹，后改为国产的霹雳-11导弹，是中国首款初步具备超视距空战能力的战斗机，但并不具备下视下射能力。该机还可挂载霹雳-5和霹雳-8红外空空导弹和无制导对地弹药。
Squadron1=歼-8B（空1师）,歼-8B
Squadron2=歼-8B（海航9师）,歼-8B
Squadron3=歼-8B（81192）,歼-8B
Callsigns=Squadron1,雄鹰|Squadron2,雄狮|Squadron3,雄鹰

[plaaf_j-8e]
Type=战斗机
Default=歼-8E,歼-8E
DefaultDescription=1980年最初服役时，由于配套机载火控雷达研制进度滞后，无法按时装机，初期生产型的歼-8只能定型为“歼-8白天型”，不具备全天候作战能力。1985年装备中国第一型自主研发的机载火控雷达SL-4雷达的歼-8A型飞机定型生产，但由于SL-4雷达性能落后，飞机配套的霹雳-2乙红外空空导弹早已停产，歼-8A仅生产了31架。1992年，改装JL-7A雷达，新型火控计算机和导弹离轴发射控制装置，装备霹雳-5红外空空导弹的歼-8E首飞，这是歼-8基本型号的最后一个改型，也是作战能力最完备的改型。
Squadron1=歼-8E（空24师）,歼-8E
Callsigns=Squadron1,雄鹰

[plaaf_j-8f]
Type=战斗机
Default=歼-8F,歼-8F
DefaultDescription=1985年，中美达成合作协议（美方称“和平珍珠”项目，中方称“八二工程”），由中方出资，委托诺斯罗普·格鲁曼公司提供综合航电和雷达火控系统，对歼-8II飞机进行技术升级。1989年合作协议中止，格鲁曼公司依照合同于1992年交付中方两架改造完成的“八二工程”原型机。基于“八二工程”的技术合作成果，中国于1997年开始研制装备国产先进综合航电和脉冲多普勒雷达的歼-8F，并搭配国产的新一代主动雷达制导中程空空导弹。歼-8F于2000年首飞，2002年交付部队。该机换装涡喷-13B发动机，安装国产1492型脉冲多普勒机载雷达和数字综合火控设备，挂载霹雳-12主动雷达制导中程空空导弹，具备多目标超视距攻击能力，还可挂载精确对地制导武器用于对地攻击。
Squadron1=歼-8F（空1师）,歼-8F
Squadron2=歼-8F（空9师）,歼-8F
Callsigns=Squadron1,利剑|Squadron2,雄狮

[plaaf_jz-8f]
Type=战斗机,侦察机
Default=歼侦-8F,歼侦-8F
DefaultDescription=歼侦-8F是基于歼-8F发展出的战术侦察机。该机拆除了航炮，安装数字光学侦察照相设备，可在机腹挂载红外相机及合成孔径雷达吊舱。该机还可安装电子情报和信号情报侦察吊舱，使飞机具有一定的战略情报搜集功能。除执行侦察任务外，歼侦-8F飞机也可携带空空导弹，并可在夜间和复杂气象条件下执行侦察任务。歼侦-8F于2006年首飞，是中国人民解放军空军主要使用的高空高速战术侦察机。
Squadron1=歼侦-8F（空29师）,歼侦-8F
Callsigns=Squadron1,千里眼

