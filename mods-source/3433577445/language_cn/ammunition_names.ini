plaaf_aspide-1a=阿斯派德-1A,,空对空,阿斯派德（Aspide）导弹是一种半主动雷达制导的中程空空导弹，由意大利塞莱尼亚公司研制。该导弹基于美国AIM-7“麻雀”导弹的设计，但在性能和技术上进行了改进和优化。阿斯派德导弹具备全天候作战能力，主要用于中程空对空拦截任务。

plaaf_pl-5c=PL-5C,,空对空,霹雳-5空对空导弹是中国战斗机使用的一种短程红外空空导弹。它基于苏联R-13导弹技术，类似于 AIM-9 响尾蛇。C型是利用霹雳-8导弹上的成熟技术对霹雳-5B进行改进的产品，采用氮气制冷锑化铟导引头，具备全向攻击能力‌。

plaaf_pl-8b=PL-8B,,空对空,霹雳-8近距空空导弹是中国研制的红外格斗空空导弹，由西安东方机械厂大批生产，仿制自以色列怪蛇3导弹。

plaaf_pl-12=PL-12,,空对空,霹雳-12（PL-12）是中国自主研发的第四代主动雷达制导中程空空导弹，该导弹是中国空军首款具备超视距（BVR）空战能力的主动雷达制导导弹，导弹使用惯性导航和数据链中段制导，主动雷达导引头基于引进自俄罗斯的9B-1103M导引头设计，具备良好的下视下射，多目标攻击和抗电子干扰能力，导弹整体性能接近AIM-120C导弹。

