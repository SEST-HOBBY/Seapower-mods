[plaaf_j-8b]
Type=Fighter
Default=J-8B,J-8B
DefaultDescription=The J-8B, as the first variant of the J-8II series, began development in 1988 and entered service in 1995. It was equipped with the WP-13A engine, a heads-up display (HUD), an air data computer, and the SL-5A single-pulse fire-control radar. Its most potent air-to-air weapon was the Italian Aspide semi-active radar-guided missile, later replaced by the domestically produced PL-11 missile. This made the J-8B China's first fighter with initial beyond-visual-range (BVR) combat capabilities, though it lacked look-down/shoot-down capabilities. The aircraft could also carry PL-5 and PL-8 infrared air-to-air missiles and unguided ground attack munitions.
Squadron1=1st AD PLAAF,J-8B
Squadron2=9th AD PLANAF,J-8B
Squadron3=No.81192 PLANAF,J-8B
Callsigns=Squadron1,Eagle|Squadron2,Lion

[plaaf_j-8e]
Type=Fighter
Default=J-8E,J-8E
DefaultDescription=When the J-8 initially entered service in 1980, the development of its fire-control radar lagged behind schedule. As a result, the early production models were designated as "J-8 Day Fighter," lacking all-weather combat capabilities. In 1985, the J-8A, equipped with China's first domestically developed fire-control radar, the SL-4 radar, was adopted for production. However, due to the SL-4 radar's outdated performance and the discontinuation of the PL-2B IR missile production, only 31 J-8A air frames were manufactured. In 1992, the J-8E, featuring the JL-7A radar, a new fire-control computer, and an off-axis missile launch control system, equipped with the PL-5 infrared air-to-air missile, made its first flight. This marked the final and most combat-capable variant of the basic J-8 series.
Squadron1=24th AD PLAAF,J-8E
Callsigns=Squadron1,Eagle|Squadron2,Lion

[plaaf_j-8f]
Type=Fighter
Default=J-8F,J-8F
DefaultDescription=In 1985, China and the United States reached a cooperation agreement (known as the "Peace Pearl" program by the U.S. and "Project 82" by China). Under this agreement, China funded Northrop Grumman to provide advanced avionics and radar systems for upgrading the J-8II. The cooperation was suspended in 1989, and Grumman delivered two modified "Project 82" prototypes to China in 1992 as per the contract. Building on the achievements from the technological cooperation of "Project 82". China began developing the J-8F in 1997, equipped with domestically produced digital integrated avionics and a pulse-doppler radar, paired with a new generation of Chinese active radar-guided medium-range air-to-air missiles. The J-8F made its maiden flight in 2000 and entered service in 2002. It featured the WP-13B engine, the domestically developed Type 1492 pulse-doppler radar, and digital integrated fire-control systems. The aircraft was capable of carrying the PL-12 active radar-guided medium-range missile for multi-target BVR engagements. It could also carry precision-guided munitions for ground attack.
Squadron1=1st AD PLAAF,J-8F
Squadron2=9th AD PLAAF,J-8F
Callsigns=Squadron1,Eagle|Squadron2,Lion

[plaaf_jz-8f]
Type=Fighter,Recon
Default=JZ-8F,JZ-8F
DefaultDescription=The JZ-8F is a tactical reconnaissance aircraft developed from the J-8F. It removed the cannon in the fuselage and installed digital optical reconnaissance equipment, with the ability to carry extra infrared cameras and synthetic aperture radar (SAR) pods under its fuselage. The aircraft could also be equipped with electronic intelligence (ELINT) and signals intelligence (SIGINT) pods, giving it some strategic intelligence-gathering capabilities. In addition to reconnaissance missions, the JZ-8F could also carry air-to-air missiles and perform reconnaissance tasks under night and complex weather conditions. The JZ-8F made its first flight in 2006 and became a primary high-altitude, high-speed tactical reconnaissance aircraft for the PLAAF.
Squadron1=29th AD PLAAF,JZ-8F
Callsigns=Squadron1,Telescope

