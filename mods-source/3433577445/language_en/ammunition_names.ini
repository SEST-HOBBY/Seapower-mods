# ------------------ AAM ------------------

plaaf_aspide-1a=Aspide-1A,,AAM,The Aspide missile is a semi-active radar-guided medium-range air-to-air missile developed by the Italian company Selenia (now part of the European missile consortium MBDA). Based on the design of the American AIM-7 Sparrow missile, the Aspide incorporates improvements and optimizations in performance and technology. It is capable of all-weather operations and is primarily used for medium-range air-to-air interception missions.


plaaf_pl-5c=PL-5C,,AAMThe PL-5 is a short-range, Infrared homing missile used by Chinese fighters. It is based on Soviet R-13 missile technology and resembles the AIM-9 Sidewinder.‌The C type is a product that utilizes technology from the PL-8 missile to improve the PL-5B. It adopts a nitrogen cooled indium antimonide seeker and has all-aspect launch capability.

plaaf_pl-8b=PL-8B,,AAM,The PL-8 is a Chinese air-to-air missile (AAM) originated from the Israeli Python-3 AAM.

plaaf_pl-12=PL-12,,AAM,The PL-12 is China's fourth-generation, domestically developed active radar-guided medium-range air-to-air missile. It is the first active radar-guided missile of PLAAF capable of beyond-visual-range (BVR) air combat. The missile utilizes INS navigation and mid-course correction via data link, while its active radar seeker is based on the design of the Russian 9B-1103M seeker. It features excellent look-down/shoot-down and multi-target engagement capabilities, and good resistance to ECM. The overall performance of the PL-12 is comparable to that of the AIM-120C missile.

