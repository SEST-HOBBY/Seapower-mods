MaxAltitude=30480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=32   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.2          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=42.4              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=10.0         // output peak power in kW

