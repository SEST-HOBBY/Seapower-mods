[General]
UnitType=LandUnit
LandUnitSubType=SAM
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=7.68                    // in meters
Beam=3.27                      // in meters
Range=297                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=820
Mass=47.5                      // in tons

MaxForwardVelocity=35        // in knots
MaxBackwardVelocity=12        // in knots
Braking=12                     // knots/sec
TurnRate=23                    // in degrees per second

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[AI]
UnitScoreValue=2              // value for calculation of mission score
Role=Gun,AAW

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
