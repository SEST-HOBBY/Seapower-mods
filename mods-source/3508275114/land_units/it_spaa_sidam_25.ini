[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=5                     // in meters
Beam=2.7                       // in meters
Range=310                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SIDAM AAA
Tag=Ground+Vehicle

[Physics]
HorsePower=215
Mass=12.5                     // in tons

MaxForwardVelocity=34.5        // in knots
MaxBackwardVelocity=10         // in knots
Braking=15                     // knots/sec
TurnRate=36                    // in degrees per second

[AI]
UnitScoreValue=0.2             // value for calculation of mission score
Role=Gun,SAM,AAW

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.8 // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need Collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=5
AvailableLoadouts=Default,AirToAir

Default_SubModelsToHide=Launcher

[WeaponSystem1]  #Oerlikon KBA
Type=CIWS
SystemName=Oerlikon_KBA
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Barrel1
AreContainersRotatable=True
#Angles
ElevationArc=-5,87
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
VIDIncrease=5  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2,WeaponSystem3,WeaponSystem4

[WeaponSystem2]  #Oerlikon KBA
Type=CIWS
SystemName=Oerlikon_KBA
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Barrel2
AreContainersRotatable=True
#Angles
ElevationArc=-5,87
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
VIDIncrease=5  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1,WeaponSystem3,WeaponSystem4

[WeaponSystem3]  #Oerlikon KBA
Type=CIWS
SystemName=Oerlikon_KBA
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Barrel3
AreContainersRotatable=True
#Angles
ElevationArc=-5,87
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
VIDIncrease=5  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1,WeaponSystem2,WeaponSystem4

[WeaponSystem4]  #Oerlikon KBA
Type=CIWS
SystemName=Oerlikon_KBA
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Barrel4
AreContainersRotatable=True
#Angles
ElevationArc=-5,87
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineCIWS
#Effects
#Other
VIDIncrease=5  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1,WeaponSystem2,WeaponSystem3

[WeaponSystem5AirToAir]  #Missile
Type=Missile
SystemName=SIDAM_Mistral
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfContainers=1
Container1=Launcher
AreContainersRotatable=True
#Angles
FixVerticalLaunchAngle=False
AdditionalFixVerticalLaunchAngle=2
ElevationArc=-5,87
RestAngles=Any
LoadAngles=Any
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
DisplayWeaponsOnSystem=True
VIDIncrease=4  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1,WeaponSystem2,WeaponSystem3,WeaponSystem4


[---------- WeaponMagazines ----------]
[WeaponMagazineCIWS]
NumberOfAmmunitionTypes=1
Ammunition1_Count=800
Ammunition1=usn_cal_25mm_adats
ModuleType=SmallMagazine

[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=fr_mistral_ground
Ammunition1_Count=8
ModuleType=SmallMagazine
