[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=4.6                     // in meters
Beam=2.2                       // in meters
Range=350                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=2  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=170
Mass=2.7                       // in tons

MaxForwardVelocity=55          // in knots
MaxBackwardVelocity=5          // in knots
Braking=13                     // knots/sec
TurnRate=40                    // in degrees per second

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=AAW,SAM,Radar

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=2

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[SensorSystem2]  #Sarch_Radar
Type=Radar
SystemName=AN/MPQ-64A3
Mount=Radar
#Animations
ModuleType=Sensor


[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=0


[--------------------------- Mesh definitions ---------------------------]
[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=assets/models/land_units/slm/
ResourcesRoot=slm.obj
ResourcesMesh=usa_tads_hmmwv
ResourcesMaterialFolder=ground objects/usa_hmmwv/
ResourcesMaterial=usa_hmmwv_mat
############################################################

[Submodels]
Wheels=Wheels
Radar=Radar

[Wheels]
Mesh=usa_tads_hmmwv_wheels
ResourcesMaterialFolder=ground objects/usa_m923/
Material=usa_m923_mat

[Radar]
Mesh=radar
ResourcesMaterialFolder=ground objects/usa_hmmwv/
Material=usa_hmmwv_mat
Position=0,0.026536,-0.07641


[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.01742,-0.0023
Rotation=0,0,0
Scale=0.04,0.035,0.07
Layer=Default

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default