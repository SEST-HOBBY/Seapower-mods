[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=4.6                     // in meters
Beam=2.2                       // in meters
Range=350                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=2  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=170
Mass=2.7                       // in tons

MaxForwardVelocity=55          // in knots
MaxBackwardVelocity=5          // in knots
Braking=13                     // knots/sec
TurnRate=40                    // in degrees per second

[AI]
UnitScoreValue=0.5             // value for calculation of mission score
Role=AAW,SAM

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=2

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need collider because we do not want unit to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=2

[WeaponSystem1]  #Missile
Type=Missile
SystemName=SLAMMRAAM_AIM120
#Sensors
ExternalGuidingSystems=AN/MPQ-64A3
ExternalGuidingSystemSearchRadius=2     // in nmi
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfContainers=1
Container1=Gun
AreContainersRotatable=True
#Angles
ElevationArc=0,60
RestAngles=Any
LoadAngles=Any
#Loading
Ammunition=usa_aim-120c-5_ground
#AssociatedMagazine=WeaponMagazineAIM120
#PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
EngageOnlyInsideArc=True
DisplayWeaponsOnSystem=True
VIDIncrease=7  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2
AutoEnableSensor=True

[WeaponSystem2]  #Missile
Type=Missile
SystemName=SLAMMRAAM_AIM9
#Sensors
ExternalGuidingSystems=AN/MPQ-64A3
ExternalGuidingSystemSearchRadius=2     // in nmi
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfContainers=1
Container1=Gun
AreContainersRotatable=True
#Angles
ElevationArc=0,60
RestAngles=Any
LoadAngles=Any
#Loading
Ammunition=usa_aim-9x_ground
#AssociatedMagazine=WeaponMagazineAIM9
#PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
EngageOnlyInsideArc=True
DisplayWeaponsOnSystem=True
VIDIncrease=7  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1
AutoEnableSensor=True

[---------- WeaponMagazines ----------]
[WeaponMagazineAIM9]
NumberOfAmmunitionTypes=1
Ammunition1=usa_aim-9x_ground
Ammunition1_Count=2
ModuleType=SmallMagazine

[WeaponMagazineAIM120]
NumberOfAmmunitionTypes=1
Ammunition1=usa_aim-120c-5_ground
Ammunition1_Count=4
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=assets/models/land_units/slm/
ResourcesRoot=slm.obj
ResourcesMesh=usa_slm_hmmwv
ResourcesMaterialFolder=ground objects/usa_hmmwv/
ResourcesMaterial=usa_hmmwv_mat
############################################################

[Submodels]
Wheels=Wheels
Turret=Turret
Gun=Gun

[Wheels]
Mesh=usa_hmmwv_wheels
ResourcesMaterialFolder=ground objects/usa_m923/
Material=usa_m923_mat

[Turret]
Mesh=mount
ResourcesMaterialFolder=ground objects/usa_hmmwv/
Material=usa_hmmwv_mat
Position=0,0,-0.023606

[Gun]
Mesh=pyl
ResourcesMaterialFolder=ground objects/usa_hmmwv/
Material=usa_hmmwv_mat
Parent=Turret
Position=0,0.023394,-0.000519

[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.01742,-0.0023
Rotation=0,0,0
Scale=0.04,0.035,0.07
Layer=Default

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default