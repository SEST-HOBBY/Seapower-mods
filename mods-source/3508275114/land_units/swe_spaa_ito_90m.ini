[General]
UnitType=LandUnit
LandUnitSubType=SAM
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=7.13                     // in meters
Beam=3.24                      // in meters
Range=260                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=600
Mass=32.5                      // in tons

MaxForwardVelocity=40.5        // in knots
MaxBackwardVelocity=40.5        // in knots
Braking=12                     // knots/sec
TurnRate=20                    // in degrees per second

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=SAM,AAW

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_swe_spaa_ito_90m

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3
