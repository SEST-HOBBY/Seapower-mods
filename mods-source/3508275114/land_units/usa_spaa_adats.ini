[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.04

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.5                     // in meters
Beam=3.2                       // in meters
Range=243                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=500
Mass=22.8                      // in tons

MaxForwardVelocity=35.6        // in knots
MaxBackwardVelocity=7          // in knots
Braking=12                     // knots/sec
TurnRate=25                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Gun,AAW,SAM

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usa_spaa_adats

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #AdvancedOptics
Type=Visual
SystemName=AdvancedOptics
MountPosition=0,0.04,0

[SensorSystem2]
Type=Infrared
#FLIR system
SystemName=ADATS_Visual
ModuleType=Sensor

[SensorSystem3]  #ADATS_Radar
Type=Radar
SystemName=ADATS_Radar
Mount=Radar
#Animations
OpenSystemAnimation=Search_On
CloseSystemAnimation=Search_Off
ModuleType=Sensor


[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=2

[WeaponSystem1]  #MIM-146
Type=Missile
SystemName=MIM-146
#Sensors
AssociatedSensors=SensorSystem2
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
AreContainersRotatable=True
ContainerBase=Launcher
NumberOfContainers=1
Container1=Launcher
#Angles
FixVerticalLaunchAngle=False
AdditionalFixVerticalLaunchAngle=2
ElevationArc=-10,75
RestAngles=0,0
LoadAngles=Any
#Loading
Ammunition=usa_mim-146
#AssociatedMagazine=WeaponMagazineTOW
#PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
EngageOnlyInsideArc=True
VIDIncrease=8  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2  //List of systems

[WeaponSystem2]  #M242
Type=CIWS
SystemName=M242_Fast
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-10,60
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
EngageOnlyInsideArc=True
MaxVelocityToFire=8
VIDIncrease=4  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem1

[---------- WeaponMagazines ----------]
[WeaponMagazineTOW]
NumberOfAmmunitionTypes=1
Ammunition1=usa_mim-146
Ammunition1_Count=8
ModuleType=SmallMagazine

[WeaponMagazineGun]
NumberOfAmmunitionTypes=1
Ammunition1=usn_cal_25mm_adats
Ammunition1_Count=600
ModuleType=SmallMagazine

