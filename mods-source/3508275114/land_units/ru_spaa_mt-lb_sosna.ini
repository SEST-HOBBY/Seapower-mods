[General]
UnitType=LandUnit
LandUnitSubType=SAM
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.5                     // in meters
Beam=2.85                      // in meters
Range=270                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=240
Mass=12.3                      // in tons

MaxForwardVelocity=32.9        // in knots
MaxBackwardVelocity=2.7        // in knots
Braking=12                     // knots/sec
TurnRate=20                    // in degrees per second

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=SAM,AAW

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.022,0.02
ModuleType=Bridge
Integrity=0

[SensorSystem2]
Type=Infrared
#FLIR system
SystemName=Sosna_Visual
ModuleType=Sensor

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #9M340
Type=Missile
SystemName=9M340
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
AreContainersRotatable=True
ContainerBase=Launcher
NumberOfContainers=2
Container1=Launcher1
Container2=Launcher2
#Angles
FixVerticalLaunchAngle=False
AdditionalFixVerticalLaunchAngle=2
ElevationArc=-10,75
RestAngles=0,0
LoadAngles=Any
#Loading
AssociatedMagazine=WeaponMagazineTOW
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
EngageOnlyInsideArc=True
VIDIncrease=8  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2  //List of systems

[---------- WeaponMagazines ----------]
[WeaponMagazineTOW]
NumberOfAmmunitionTypes=1
Ammunition1=ru_9m340e
Ammunition1_Count=12
ModuleType=SmallMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]

ResourcesFolder=assets/models/land_units/mtlb/
ResourcesRoot=mtlb_sosna.obj
ResourcesMesh=hull
ResourcesMaterialFolder=ground objects/wp_sa-13_gopher/
ResourcesMaterial=wp_sa-13_gopher_mat

[Submodels]
Turret=Turret
Launcher=Launcher
Weapon1=Launcher1
Weapon2=Launcher2

[Turret]
Mesh=mount
ResourcesMaterialFolder=ground objects/wp_sa-13_gopher/
Material=wp_sa-13_gopher_mat
Position=0,0,-0.020232

[Launcher]
Parent=Turret
Position=0,0.035193,-0.004388

[Launcher1]
Mesh=launcher1
Parent=Launcher
ResourcesMaterialFolder=ground objects/wp_sa-13_gopher/
Material=wp_sa-13_gopher_mat
Position=0.012523,0,0

[Launcher2]
Mesh=launcher2
Parent=Launcher
ResourcesMaterialFolder=ground objects/wp_sa-13_gopher/
Material=wp_sa-13_gopher_mat
Position=-0.012523,0,0

[---------- Effects ----------]
[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.026,0
Rotation=0,0,0
Scale=0.04,0.05,0.1

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default
