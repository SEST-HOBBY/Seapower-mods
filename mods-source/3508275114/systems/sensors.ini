Type=Search         // Classes can be "Search", "Targeting"
HasDataLink=False      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Air               // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate       // Can be "Illuminate", "RadioCommand"
TargetChannels=144      // if applicable number of targets it can track simultaneously
WeaponChannels=0      // if applicable number of weapons (missiles) it can guide simultaneously
RPM=6                 // TODO revolutions per minute
MinRange=0.4           // min range in km
MaxRange=20          // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=4000      // max altitude in meters, relevant for air, unused for surface
RangeResolution=12.0  // TODO ! defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.6          // TODO ! defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=37.0              // gain in dB on the sensor
Frequency=Ku-Band       // frequency band
PeakPower=8         // TODO output peak power in kW
MinDetectableReturnPower=0.00001 //minimal detectable radar echo power, in kW
ModuleType=SmallSensor