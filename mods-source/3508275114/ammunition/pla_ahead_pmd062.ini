[General]
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=AAW             // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=1.6                              // in kg. Used for aircraft
AmmoPoints=14                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts      // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=1240         // meter per second
MaxRange=5000               // in m
GravityFactor=10
CircularErrorProbable=8    // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=1.2
ImpactSize=medium           // Impact size, can be small, medium, large, verylarge
Penetration=Minor          // can be minor, moderate, heavy, always
FuzeProximityDistance=5    // In meters
KillProbability=0.2    // Chance to intercept missile. Relevant for Guns, irrelevant for CIWS

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_tiny
ResourcesMaterial=shell_mat_yellow

[---------- Effects ----------]
[Particles]
TrailEffect=
HitDefaultExplosionClass=SmallFlakExplosions
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitWaterSplashClass=TinyWaterSplashes