[General]
Type=Projectile                       // can be Projectile, Missile, Torpedo
TargetType=AAW                        // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=0.86                               // in kg. Used for aircraft
AmmoPoints=8.5                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpactsSmall            // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=1100                    // meter per second
MaxRange=4700                         // in m
GravityFactor=4
CircularErrorProbable=21              // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=1.4
ImpactSize=medium                       // Impact size, can be small, medium, large, verylarge
Penetration=minor                     // can be minor, moderate, heavy, always
FuzeProximityDistance=6	//25               //In meters
KillProbability=0.04	//0.0002                //Chance to intercept missile

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_tiny
ResourcesMaterial=shell_mat_yellow

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_small_shell
