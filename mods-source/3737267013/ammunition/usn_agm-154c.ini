#=========================================================================================================================================================
# RAAF AGM-154C JSOW (Block II)
# Joint Stand-Off Weapon used by RAAF F/A-18F Super Hornet.
# Unpowered winged glide weapon for fixed land targets; GPS/INS midcourse navigation with terminal imaging-IR seeker.
# Approx. 483 kg launch mass; published maximum range approx. 70 nm from a high-altitude release.
#=========================================================================================================================================================

[General]
# AGM-154C JSOW
# NOTE: Type=Missile is intentional. In current Sea Power builds, Type=Bomb uses the bomb-drop envelope calculation and can restrict long-range glide
# weapons well below their configured MaxLaunchRange. Missile kinematics allows the JSOW's winged glide to be represented over its full envelope.
Type=Missile                           // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation      // can be All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Vessel,Submarine     // AGM-154C is represented here as the fixed-target variant; C-1 adds moving maritime target capability

Mass=483                               // in kg. Used for aircraft
AmmoPoints=2400                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
#IOCDate=2011                           // Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=2012                            // Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

DefaultCameraDistance=0.45
MinCameraDistanceForeAft=0.22
MinCameraDistanceBroadside=0.22
CameraPivotHeight=0.0

DecalClass=Standard                    // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=3            // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
# BROACH multi-stage 500-lb-class penetrator / blast-fragmentation warhead
WarheadType=0
Power=32
ImpactSize=Large                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
# Real weapon uses autonomous GPS/INS navigation before terminal imaging-IR aimpoint refinement.
GuidanceType=1
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink
DropDuration=1.5                       // time in seconds after release before normal missile/glide behaviour begins
InitialFlightPhaseDuration=2.0         // time in seconds where the missile moves straight on without guiding
InertialGuidance=True                  // if true it runs to a preset point before activating terminal guidance

#======================================== Flight Profile ===========================================================
# Current Sea Power missile kinematics are used to emulate an unpowered winged glide vehicle.
ApplyKinematics=True                   // if True, full missile kinematics parameters below are used
MaxVelocity=1000                       // Maximum speed in knots; high enough not to clamp a fast aircraft release
# For an unpowered glide weapon, very low acceleration is used only to keep the kinematic model stable rather than to represent an engine.
AccelerationTime=999                   // time in seconds before the acceleration phase ends
Acceleration=0.02                      // acceleration in G; near-zero value used to represent an unpowered glide weapon
SustainerAccelerationTime=-1           // sustainer burn time; -1 means no sustainer
SustainerAcceleration=-1               // sustainer acceleration; -1 means no sustainer

TypicalTargetVelocity=0                // knots; fixed land target
TypicalTargetAlt=0                     // feet; used by kinematic range/drag calculations

DragCoefficient=0.35                   // kinematic drag factor; increase if JSOW glides too far, decrease if it falls short
LiftFactor=1.0                         // missile lift multiplier added in current game builds; increase if it loses altitude too quickly
MaxFlightTime=650                      // seconds; hard lifetime limit, sufficient for a long high-altitude glide to ~70 nm

TerminalApproachDist=8                 // in N. miles. At this distance seeker will be turned on.
SupportsBanking=True                   // if the missile will bank when turning

#========================================= Launch stats ============================================================
MaxTurnRate=4                          // Maximum turnrate in degrees per second
MinLaunchRange=3                       // Minimum launch range in nautical miles
MaxLaunchRange=70                      // Maximum launch range in nautical miles; published high-altitude JSOW envelope
MinLaunchAltitude=500                  // Minimum launch altitude in feet.
MaxLaunchAltitude=60000                // Maximum launch altitude in feet.
SeekerReliability=0.98                 // Chance that seeker will activate properly and will be able to track targets
WarheadReliability=0.98                // Chance that warhead will detonate upon hit

#========================================     Seeker     ===========================================================
#CircularErrorRadius=0  //20.0          // Circular error radius in meters
#Homing
SeekerGain=0.0                         // Seeker gain in dB
SeekerFOV=45.0                         // Seeker field-of-view in degrees
SeekerActiveRange=0.0
SeekerPassiveRange=8.0                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
NightVisionLevel=1.0
Zoom=3
TargetMemory=True
#ECCM
AntiCountermeasuresBonus=0.7           // This value substracted from probability of spoofing by countermeasures (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructAfterTargetGone=False
SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/models/ammunition/agm-154c/
ResourcesRoot=JSOW.obj
ResourcesMesh=JSOW_Open
ResourcesMeshForLaunch=JSOW_Folded
ResourcesMaterialFolder=assets/models/ammunition/agm-154c/
ResourcesMaterial=agm-154c_mat.ini
ResourcesMeshSwitchTime=0.5            // time in seconds after launch to switch from launch mesh to main mesh
Rotation=0,0,0
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
DudExplosionClass=SmallFlakExplosions
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

BoosterEffect=None                     // JSOW has no rocket booster
InFlightEffect=None                    // JSOW is entirely unpowered after release

HitDefaultExplosionClass=LargeGroundHitExplosions
HitShipExplosionClass=MediumShipHitExplosion
#HitAirExplosionClass=MediumMissileExplosions // Played when weapon explodes in air
HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=LargeGroundHitExplosions

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.0099
Rotation=0,0,0
Scale=0.003,0.003,0.042
