#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# AIM-7P Sparrow
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
Mass=231                               // in kg. Used for aircraft
AmmoPoints=462                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=19
ImpactSize=8                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

FuzeProximityDistance=20.0             // for proximity fuze: distance to target in yard
KillProbability=0.8                    // Base chance to hit
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=2
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
DropDuration=0.5                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=3.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=10.0                      // Climb angle for initial loft
MaxLoftAlt=40000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=1000              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=1600.0                     // Maximum speed in knots
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
MaxTurnG=25                       // Maximum G-limit of missile turns
AccelerationTime=4.5                  // Burn time for initial booster burn
Acceleration=11.9                      // Gs of acceleration in initial burn
SustainerAccelerationTime=11            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=2.8               // Acceleration of sustainer burn. -1 if there is no sustainer
DragCoefficient=-1               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
TypicalTargetAlt=40000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=600						// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=40000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=600				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
VelocityBleed=0.8                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=90               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MinLaunchRange=0.8                     // Minimum launch range in nautical miles
MaxLaunchRange=40                      // Maximum launch range in nautical miles
MinLaunchAltitude=80                  // Minimum launch altitude in feet.
MaxLaunchAltitude=70000                // Maximum launch altitude in feet.
MinAttackAltitude=25                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=90000                // Maximum altitude of target, in feet
MaxAttackVelocity=1400				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=0.0                         // Seeker gain in dB
SeekerFOV=45.0                         // Seeker field-of-view in degrees
SeekerGimbalFOV=110                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=70                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
#Misc Guidance Properties
#InsDrift=30							   // In degrees per minute of unguided flight. Shifts the weapon's nose by this amount per minute whenever the missile is not being actively guided (RC, Wire, tracking a target with its seeker)
# cass: meant for making missiles drift when they lose their target, blocked for now due to unresolved issues
#ECCM
AntiCountermeasuresBonus=0.35           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.15                     // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=4.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/aim-7/
ResourcesRoot=aim-7.obj
ResourcesMesh=aim-7
ResourcesMaterial=aim-7p_mat.ini
ResourcesMeshForLaunch=aim-7
ResourcesMeshSwitchTime=0.2  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
Rotation=0,0,45
NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_effect
BoosterEffectPosition=0,0,-0.015

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.02 
SustainerEffectStartTime=2.0

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.05
