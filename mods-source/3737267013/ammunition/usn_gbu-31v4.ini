#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# GBU-31 Ver.4 JDAM 907kg(2000lb) GPS guibed bomb.
Type=Bomb                               // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
LandAttackCapability=Installation             // can be  All, Installation, Mobile, ShoreTargetsOnly
AirLaunched=True

Mass=907                                // in kg. Used for aircraft
AmmoPoints=1700    

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=1  // at what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=62
ImpactSize=Large                // Impact size, can be small, medium, large, verylarge
Penetration=Always       		// can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3         // time in seconds where the missile moves straight on without guiding
DropDuration=4.0 
#========================================= Launch stats ============================================================
ApplyKinematics=True                   // 如果我们使用完整的运动学规则。如果这是真的，我们将只使用运动学
MaxVelocity=1000                       // Maximum speed in knots
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
AccelerationTime=0                 // 初始助推器燃烧的燃烧时间
Acceleration=0                   // 初始燃烧阶段的加速度Gs
SustainerAccelerationTime=-1            // 持续燃烧时间。若无持续燃烧，则记为-1
SustainerAcceleration=-1             // 持续燃烧加速。若无持续燃烧，则值为-1
#---- Total Δv ≈ 982 ≈ 2.89Ma

TypicalTargetVelocity=0 
TypicalTargetAlt=0                    //ASM的阻力计算应该让目标0高度0速度

DragCoefficient=1.4               // 阻力系数。0表示无阻力，1表示默认阻力，数值越大表示阻力越大。默认值为-1，此时我们会根据导弹的最大射程来计算阻力系数

MaxTurnRate=3                          // Maximum turnrate in degrees per second
MinLaunchRange=1.5                      // Minimum launch range in nautical miles
MaxLaunchRange=17                      // Maximum launch range in nautical miles
MinLaunchAltitude=500                  // Minimum launch altitude in feet.
MaxLaunchAltitude=60000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#CircularErrorRadius=0.1  //20.0               // Circular error radius in meters
#Homing
SeekerGain=0                         // Seeker gain in dB
SeekerFOV=1                        // Seeker field-of-view in degrees
SeekerActiveRange=0.0
SeekerPassiveRange=1              // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True
#ECCM
#Search params for torpedoes
#SelfDestruct
SelfDestructAfterTargetGone=False
SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
AttachmentPosition=0,0,-0.001
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/weapons
AssetBundleMaterials=/AssetBundles/StandaloneWindows/weapons
AssetBundleMesh=usn_gbu-12
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_gbu-12_mat
AssetBundleMeshHullCollider=usn_gbu-12_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/gbu-31/
ResourcesRoot=gbu-31.obj
ResourcesMesh=JDAM
ResourcesMaterialFolder=assets/models/ammunition/gbu-31/
ResourcesMaterial=usn_gbu-31v4_mat.ini

############################################################

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

[Particles]
BoosterEffect=FALSE
InFlightEffect=FALSE
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosionClass=LargeShipHitExplosion
#HitAirExplosionClass=SmallGroundHitExplosions 
HitGroundExplosionClass=LargeGroundHitExplosions
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637