#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#Known problems:
#1) Due to insta-Terminal this missile does not have RC flight stage. Usure what altitude should be used for it. Also seeker range should be changed accordingly
#=========================================================================================================================================================
[General]
# AIM-174B
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
Mass=860                               // in kg. Used for aircraft
AmmoPoints=2500

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Small                    // Transient visibility on the radar
TransientVisualIdentificationRange=5  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=200                // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=50
ImpactSize=20                        // Impact size, can be small, medium, large, verylarge
Penetration=Always                      // can be minor, moderate, heavy, always

FuzeProximityDistance=15.0              // for proximity fuze: distance to target in meters. Also indicates that Fuze Type = Proximity Fuze
KillProbability=0.9                     //Chance to intercept missile
InterceptSpeedPenaltyMultiplier=0.5                  // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=3                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=2.2         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=18.0                      // Climb angle for initial loft
MaxLoftAlt=110000                       // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=6.5                // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=True                 // if true connection with a guiding radar will be severed upon entering terminal approach stage
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=1600                     // Maximum speed in knots
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
MaxTurnG=30                       // Maximum G-limit of missile turns
AccelerationTime=2                  // Burn time for initial booster burn
Acceleration=22                      // Gs of acceleration in initial burn
#SustainerAccelerationTime=28            // Time of sustainer burn. -1 if there is no sustainer burn
#SustainerAcceleration=6               // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=40000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=750						// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=40000				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=750				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=-1               // 阻力系数。0表示无阻力，1表示默认阻力，数值越大表示阻力越大。默认值为-1，此时我们会根据导弹的最大射程来计算阻力系数
VelocityBleed=0.5                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=240               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TerminalLoft=True
TimeLimited=True
LiftFactor=0.001				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude
#========================================= Launch stats ============================================================
MinLaunchRange=20.0                     // Minimum launch range in nautical miles
MaxLaunchRange=180                    // Maximum launch range in nautical miles
MinLaunchVelocity=600				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
MinLaunchAltitude=35000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=65000                // Maximum launch altitude in feet.
MaxAttackVelocity=3200				   // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
MinAttackAltitude=20                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=5.00                // Circular error radius in meters (fuse 40 with CEP 106 = 20%)
CircularErrorRadiusLarge=2.5         // Circular error vs 'Large' aircraft (fuse 40 with CEP 10.51 = 85%)
#Homing
SeekerGain=48.0                        // Seeker gain in dB
SeekerFOV=180.0                         // Seeker field-of-view in degrees
SecondaryPassiveRadarGuidanceType=HomeOnJam  //Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation and HomeOnJam weapons can detect
SeekerPassiveRange=80                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=65.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=100.0                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
CounterMeasuresRejection=110           // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=110                     // The lower the value, the greater risk of spoofing by jamming	(0...100)
AntiCountermeasuresBonus=110
AntiJammerBonus=110
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-66c
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_aim_174_mat.ini
AssetBundleMeshHullCollider=usn_rim-66c_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/aim-174/
ResourcesRoot=aim-174b.obj
ResourcesMesh=aim-174
ResourcesMaterial=aim-174b_mat.ini
############################################################
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,-0.025
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.025
InFlightEffectStartTime=3.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.015 
SustainerEffectStartTime=3.0

HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07