# ---------------- V-22 BFWS wing stow ----------------
# Tiny 0.2-degree marker lets the DLL see the fold command before the actual wing sweep begins.
# v2.8.1 timing. The DLL owns 2 rotor-index + 6 pitch + 6 hinge pivots.
# Fold order: rotor index -> blade pitch -> hinge fold -> wing/nacelle parent fold.
[V22_Wing_Fold]
# v2.8.1 exact stage order:
# 0.00 -> 0.25 s : tiny DLL trigger marker
# 0.25 -> 9.25 s : hold wing while DLL indexes rotors (2s), pitches roots (3s), folds hinges (4s)
# 9.25 -> 17.25 s: wing 0.2 -> 90 while DLL slaves nacelles 0 -> 90
NumberOfSteps=4
Time1=0
RotationY1=0
Smoothness1=EaseInOut
Time2=0.25
RotationY2=0.2
Smoothness2=EaseInOut
Time3=9.25
RotationY3=0.2
Smoothness3=EaseInOut
Time4=17.25
RotationY4=90
Smoothness4=EaseInOut

[V22_Wing_Unfold]
# v2.8.1 reverse sequence:
# 0 -> 8 s      : folded -> semifolded (wing and nacelles together)
# 8 -> 17 s     : hold wing while hinges open (4s), pitch returns (3s), rotors de-index (2s)
# 17 -> 17.25 s : remove the 0.2-degree trigger marker
NumberOfSteps=4
Time1=0
RotationY1=90
Smoothness1=EaseInOut
Time2=8.0
RotationY2=0.2
Smoothness2=EaseInOut
Time3=17.0
RotationY3=0.2
Smoothness3=EaseInOut
Time4=17.25
RotationY4=0
Smoothness4=EaseInOut

