# V-22 v2.8.1 Pivot BFWS + whole-proprotor indexing animation file.
# Nacelle conversion is owned by V22Tiltrotor.dll.
# Sea Power calls Wings_Fold/Wings_Extend natively for helicopter deck/hangar handling.
# The wing animation provides the trigger; V22Tiltrotor.dll v2.8.1 owns nacelle X rotation,
# 2 whole-proprotor index pivots, 6 blade pitch pivots, 6 hinge pivots, and rotor handover.
#
