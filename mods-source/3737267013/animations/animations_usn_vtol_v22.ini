# ---------------- V-22 landing gear ----------------
# Absolute local rotations for the current OBJ export; INI pivot positions stay fixed.
# Main gear: flight X=-25, down X=90. Nose gear: flight X=25, down X=-90.
# 0-2 s: open doors; 2-5 s: move gear; 5-7 s: close forward main doors.
# Side main doors and nose doors remain open with gear down; all close after retraction.
# Use full rotations at every key so no X/Z rotation can leak from an earlier state.

[V22_Main_Door_Left_Extend]
NumberOfSteps=4
Time1=0
Rotation1=0,0,0
Smoothness1=EaseInOut
Time2=2
Rotation2=0,0,-130
Smoothness2=EaseInOut
Time3=5
Rotation3=0,0,-130
Smoothness3=EaseInOut
Time4=7
Rotation4=0,0,-130
Smoothness4=EaseInOut

