[ ------------------------ Visual/Infared ------------------------- ]

[2nd_Gen_FLIR] #generic 2nd gen FLIR
Kind=Visual
#Infrared
#2nd Gen Infrared
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=2.0           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=2.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=1     

[3rd_Gen_FLIR]
Kind=Visual
#user: MH-60R
#Infrared
#3nd Gen Infrared
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=3.0           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=3.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=1             // Final VID/Detection range is multiplied by this in case when target observed on surface background

[AdvancedOptics_FLIR]
#Optics with electronic enhancement.
#80s/90s 2nd gen FLIR like Mk46 OSS
Kind=Visual
#Infrared
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=1.5           // Target VID range multiplied by this for identification check
MaxRangeMultiplier=1.5           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.9          // Final VID/Detection range is multiplied by this in case when target observed on surface background

[AN/AAQ-33(V)] # FLIR detector pod
Kind=Visual
#Infrared
NightCapable=True                   // is the designator can be used in low-visibility conditions
VIDRangeMultiplier=6.0        // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=6.8          // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.8          // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1

