# ---------- 反舰导弹 ----------

usn_agm-62e=AGM-62E,Walleye II ERDL,AGM,AGM-62E Walleye II ERDL（增程数据链），也称为 Mk 23，是一种无动力、电视制导滑翔炸弹，具有双向数据链，允许发射飞机在释放后锁定目标。

usa_agm-114b_zz=AGM-114B,地狱火,空对面,AGM-114地狱火导弹（AGM-114 Hellfire）是一种多平台、多目标的美国制导弹，AGM意为“空对地”，即后来的空对面导弹。主要用于反战车，但后期型号也被用于无人机攻击，精确打击高价值目标等。AGM-114具备多任务、多目标精确打击的能力，重约为45公斤（100磅），可以从海陆空多种不同载台发射，后期型号也具备一定的地对地和地对空打击能力。

usa_agm-114k_hh=AGM-114K,地狱火II,空对面,轻型AGM-114F，机身较短，射程8公里，电子保险箱和布防装置。使用AGM-114F串联HEAT弹头用于打击装甲目标。

usa_agm-114l_mm=AGM-114L,长弓地狱火,空对面,长弓地狱火，配备毫米波（MMW）主动雷达寻的，发射后不需要进一步的制导——甚至能够在发射后锁定目标——并且可以在发射器或其他友方单位不在目标视线内的情况下击中目标。
usn_agm-119_air=AGM-119,企鹅Mk2,反水面,AGM-119企鹅是美国与挪威合作研制的空中和水面发射反舰导弹。

usn_agm-158c-3=AGM-158C-3,LRASM-ER,反水面,AGM-158C-3是洛克希德·马丁公司AGM-158C远程反舰导弹(LRASM)的最新改型, 为美国空军和海军研发。具有更远的射程、增强的协同交战能力和改进的隐身突防能力。可从B-1B、F/A-18E/F和F-15EX等平台发射。

usn_jsm=JSM,,反水面,联合打击导弹(JSM)是一种多用途空射巡航导弹, 由挪威康斯伯格防务与航空航天公司和美国雷神导弹与防务公司联合研发。

#-----------对地打击导弹---------
usn_agm-65d=AGM-65D,小牛,对地攻击,AGM-65D小牛是美国红外制导防区外空对地武器, 可在恶劣环境中锁定目标。使用方法与AGM-62类似, 由发射平台的操作员将十字准星对准目标进行制导。

usn_agm-65e=AGM-65E,小牛,对地攻击,小牛E型采用激光指示器制导系统, 针对加固设施进行了优化, 使用延迟引信与更重的穿透式爆破杀伤战斗部(140公斤(300磅)对比老型号的57公斤(125磅)), 利用动能穿透目标后引爆。

usn_agm-65f=AGM-65F,小牛,对地攻击,AGM-65F小牛是美国红外制导防区外空对地武器, 使用更重的战斗部, 主要由美国海军使用。

usn_agm-88e=AGM-88,哈姆,反辐射,AGM-88哈姆是美国海军和空军装备的机载高速反辐射导弹。其英文缩写HARM(High-speed Anti-Radiation Missile)用于压制和摧毁敌方地面和舰载防空导弹系统的制导雷达、目标指示雷达和高炮瞄准雷达。

usn_agm-88g=AGM-88G,AARGM-ER,反辐射,AGM-88G AARGM-ER(增程型先进反辐射导弹)是美国诺斯罗普·格鲁曼公司开发的最新空射战术导弹系统。是AGM-88E的增程型号, 主要用于压制敌方陆基和海基防空系统。该导弹在AGM-88E基础上进行了改进, 优化了弹体结构和动力系统, 采用新型制导组件和固体火箭发动机, 显著提升了射程和机动性。2021年7月首次实弹测试后, 将于2024年形成初始作战能力并装备F-35和F/A-18战斗机。

usn_agm-158b-2=AGM-158B-2,JASSM-ER,对地攻击,由洛克希德·马丁公司开发, AGM-158B-2 JASSM-ER(增程型联合防区外空对地导弹)是一种隐身增程巡航导弹, 由涡扇发动机提供动力, 射程超过1,900公里。配备惯性导航+GPS+红外成像末端制导和454公斤战斗部, 升级了GPS接收器和抗干扰软件, 能够对高价值目标进行防区外打击, 兼容多种战斗机。

usn_adm-160b=ADM-160B,MALD,诱饵,ADM-160B微型空射诱饵（MALD）是一种低成本、可消耗的空射可编程诱饵弹药，由雷神公司开发。旨在复制美国及盟国飞机的战斗飞行剖面和雷达特征，从而迷惑和压制敌方综合防空系统（IADS）。

usn_jsm_land=JSM,,对地攻击,联合打击导弹(JSM)是一种多用途空射巡航导弹, 由挪威康斯伯格防务与航空航天公司和美国雷神导弹与防务公司联合研发。


