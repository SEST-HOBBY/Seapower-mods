[AmmunitionNames]
# ------------------ 空空导弹 ------------------
usa_aim-92=AIM-92,毒刺,空对空,FIM-92毒刺便携式防空导弹是一种小型单兵防空导弹, 采用红外制导热跟踪和紫外目标跟踪技术。由美国研制, 供美军各军种使用。自1981年起服役。在美国及其他29个国家, 主要由雷神公司制造, 并由德国EADS和土耳其ROKETSAN授权生产。已生产超过70,000枚导弹。

usn_aim-9m=AIM-9M,响尾蛇,空对空,AIM-9M响尾蛇是美国红外制导空空导弹。M型在L型基础上增强了抗干扰能力, 并采用低尾焰发动机, 使其在近距离使用时难以被探测。

usn_aim-9x=AIM-9X,响尾蛇,空对空,AIM-9X响尾蛇是美国红外制导空空导弹。X型经过重大升级, 具备强大的抗干扰能力、更远的射程以及出色的后射能力。

usn_aim-120a=AIM-120A,阿姆拉姆,空对空,AIM-120A先进中程空空导弹(阿姆拉姆)是美国主动雷达制导空空导弹。这是迄今为止美国武库中最先进的空空导弹, 是半主动雷达制导麻雀导弹的更轻且性能更强的后继型号。阿姆拉姆通过数据链和主动雷达导引头、实现极高飞行速度的高性能火箭发动机以及高抛弹道, 在各方面实现卓越性能, 以最大动能对抗机动目标和高速飞行的空中目标。

usn_aim-120c=AIM-120C,阿姆拉姆,空对空,AIM-120是美国主动雷达制导空空导弹, 用于替代老式麻雀半主动雷达制导空空导弹。体积相对较小, 可由大多数飞机携带。

usn_aim-120c7=AIM-120C-7,阿姆拉姆,空对空,AIM-120是美国主动雷达制导空空导弹, 用于替代老式麻雀半主动雷达制导空空导弹。体积相对较小, 可由大多数飞机携带。

usn_aim-120d=AIM-120D,阿姆拉姆,空对空,AIM-120是美国主动雷达制导空空导弹, 用于替代老式麻雀半主动雷达制导空空导弹。体积相对较小, 可由大多数飞机携带。

usn_aim-120d3=AIM-120D3,阿姆拉姆,空对空,AIM-120D-3是RTX为AIM-120系列进行的最终升级, 主要集中于飞行控制和软件升级。通过增强的战斗与控制芯片优化了导弹发动机的燃料效率, 并使导弹的操纵面能够在更高海拔和更稀薄大气中正常工作。这在不进行硬件升级的情况下大幅增加了AIM-120导弹的射程。类似标准6的专用反导作战软件使AIM-120具备一定的反导作战能力, 该能力已在红海行动中得到验证。

usn_aim-174b=AIM-174B,神枪手,空对空,AIM-174B 神枪手空空导弹是美国国防承包商雷神公司为美国海军研发的远程空空导弹。美国海军将AIM-174B描述为SM-6的"空射版本"。目前, 仅F/A-18E/F超级大黄蜂战斗机能够携带和发射AIM-174B。

