# ------------------ 炸弹 -----------------
usn_gbu-12d=GBU-12D,铺路II,对地攻击,美国在20世纪70年代改进了宝石路I系统。新系统具备可展开尾翼, 使滑翔距离更远、更精确且成本更低。改进后的宝石路系统被称为宝石路II。

usn_gbu-24=GBU-24,铺路III,对地攻击,由于采用更高效的制导技术, GBU-24的滑翔距离比GBU-10或宝石路II系列更远。然而, III型制导套件成本更高, 使GBU-24更适合打击重兵防守的高价值目标。

usn_gbu-31v1=GBU-31(V)1,JDAM,对地攻击,联合直接攻击弹药(JDAM)是波音公司为美国海军和空军联合开发的空投炸弹制导套件。安装在飞机投放的传统炸弹上, 将原本无控的传统航空炸弹转变为可在恶劣天气条件下使用的可控精确制导武器。

usn_gbu-31v4=GBU-31(V)4,JDAM,对地攻击,2,000磅级联合直接攻击弹药(JDAM)改型, 仅供美国海军和美国海军陆战队使用。

usn_gbu-32v2=GBU-32v2,JDAM,制导炸弹,GBU-32是美国1,000磅GPS制导炸弹。

usn_gbu-39=GBU-39,SDB,制导炸弹,小直径炸弹(SDB)是一种250磅(110-122公斤)精确制导滑翔炸弹, 由波音公司开发, 于2006年进入美军服役。配备GPS/INS制导系统和可展开弹翼, 可从投放点滑翔超过60海里(111公里), 为载机提供防区外打击能力。

usn_gbu-39_quad=GBU‑39 Quad,SDB,制导炸弹,由BRU-61/A智能挂架系统发射, 这是一种四联装发射器, 能够以流线型紧凑配置容纳四枚炸弹。每枚弹药安装在挂架内的独立舱位, 配有独立的电源和数据链接口以实现独立瞄准。BRU-61/A采用气动弹射, 以最小化信号特征并提高高G机动条件下的可靠性。

usn_gbu-53=GBU-53,风暴破坏者,对地攻击,GBU-53风暴破坏者(SDB II)是一种空射精确制导滑翔炸弹。由雷神公司开发。在最初竞标中, 波音和洛克希德·马丁团队赢得了该炸弹的合同, 但因达琳·德鲁因(Darlene Druyun)腐败案被搁置数年, 直到2005年9月才重新招标。

usn_gbu-75_jdam_lr=GBU-75 JDAM-LR,,制导炸弹,GBU-75 JDAM-LR是波音公司为美国海军开发的一种远程动力防区外打击武器, 将标准重力炸弹转变为喷气推进的精确弹药。

# ---------------- Sonobuoys ---------------
usn_ssq-53d=AN/SSQ-53D,DIFAR,被动声呐浮标,AN/SSQ-53是定向频率分析和记录（DIFAR）型声呐浮标，可为操作员提供磁航向信息，与早期的全向CRT-1相比进步巨大。

usn_ssq-53f=AN/SSQ-53F,DIFAR,被动声呐浮标,AN/SSQ-53是定向频率分析和记录（DIFAR）型声呐浮标，可为操作员提供磁航向信息，与早期的全向CRT-1相比进步巨大。

usn_ssq-62c=AN/SSQ-62C,DICASS,主动声呐浮标,AN/SSQ-62定向指令主动声呐浮标系统（DICASS）是主动声呐浮标，可进一步定位之前被SSQ-53被动声呐浮标发现的水下潜艇。

usn_ssq-62e=AN/SSQ-62E,DICASS,主动声呐浮标,AN/SSQ-62定向指令主动声呐浮标系统（DICASS）是主动声呐浮标，可进一步定位之前被SSQ-53被动声呐浮标发现的水下潜艇。
