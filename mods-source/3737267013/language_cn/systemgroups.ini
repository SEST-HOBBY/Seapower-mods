[SystemNames]
#---------------------------------------- Visual ----------------------------------------
2nd_Gen_FLIR=FLIR红外光电|第二代机载光电和红外传感器
3rd_Gen_FLIR=FLIR红外光电|第三代机载光电和红外传感器

#---------------------------------------- ESM ----------------------------------------
ALQ-142=AN/ALQ-142 ESM|AN/ALQ-142 系统能够探测雷达信号、确定其发射地点并推测其可能的来源。该系统旨在确保即使目标位于远距离，单次扫描也能实现高概率的截获。它采用了 SLQ-32(V) 舰载系电子战统中的技术，包括安装在直升机前后部的四个 90° 罗特曼透镜阵列。

ALQ-210=AN/ALQ-210 ESM|AN/ALQ-210电子战系统能在战场复杂电磁环境中提供态势感知和威胁预警能力，并具备电子情报（ELINT）级别的测量精度。

ALQ-142_RWR=AN/ALQ-142 RWR|AN/ALQ-142 系统能够探测雷达信号、确定其发射地点并推测其可能的来源。该系统旨在确保即使目标位于远距离，单次扫描也能实现高概率的截获。它采用了 SLQ-32(V) 舰载系电子战统中的技术，包括安装在直升机前后部的四个 90° 罗特曼透镜阵列和雷达告警接收器。

ALQ-210_RWR=AN/ALQ-210 RWR|AN/ALQ-210电子战系统能在战场复杂电磁环境中提供态势感知和威胁预警能力，并具备电子情报（ELINT）级别的测量精度。系统包含雷达告警功能。


