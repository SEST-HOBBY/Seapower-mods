[SystemNames]
#---------------------------------------- Visual ----------------------------------------
2nd_Gen_FLIR=FLIR | FLIR 第二代机载光电/红外传感器

3rd_Gen_FLIR=FLIR | FLIR 第三代机载光电/红外传感器

AdvancedOptics_FLIR=AdvancedOptics_FLIR | 第二代 FLIR 热成像设备，即便在黑暗或恶劣天气条件下，也能在远距离内提升对极小物体的可见度。

AN/AAQ-33(V)=AN/AAQ-33(V)“狙击手”（Sniper）是一系列由洛克希德·马丁公司制造的军用航空瞄准吊舱，能够在较远的防区外距离上实现目标确认、自主跟踪、GPS坐标生成以及精确制导弹药的引导。

AN/AAS-44 EOFLIR=AN/AAS-44光电/前视红外（EO/FLIR）系统：AAS-44系统是一款远程多用途热成像传感器及激光指示器。它能够为AGM-114“海尔法”（Hellfire）导弹及其他激光制导弹药提供远程跟踪、监视、目标指示和测距功能。AAS-44(V)型装备于美国海军的SH-60B和HH-60H直升机上；AN/AAS-44(C)型则集成在美国海军的MH-60S和MH-60R直升机上。.

MX-20HD=MX-20HD | “海神”（Poseidon）所搭载的 MX-20HD 数字式光电/红外（EO/IR）多光谱传感器转塔，由位于安大略省伯灵顿市的 L3Harris Wescam 公司提供。MX-20HD 采用陀螺稳定系统，最多可集成七种传感器，包括红外传感器、CCD 电视摄像机、图像增强器、激光测距仪以及激光照明器。

AN/ASQ-228 ATFLIR IRIS=AN/ASQ-228 ATFLIR系统——AN/ASQ-228“先进瞄准前视红外”（ATFLIR）系统是一款由雷神公司（Raytheon）研发并制造的多传感器光电瞄准吊舱。该系统集成了热成像摄像机、微光电视摄像机、激光测距仪/激光指示器以及激光光斑跟踪器。它能够为军用航空器在恶劣天气条件下提供导航与瞄准支持，并辅助使用激光制导炸弹等精确制导武器。

AN/AAQ-40 EOTS=AN/AAQ-40 EOTS | F-35战斗机的光电瞄准系统（EOTS）是一款高性能、轻量化的多功能系统，能够在红外波段提供精确的空对空及空对地瞄准能力。它是首个将前视红外（FLIR）与红外搜索与跟踪（IRST）功能融为一体的传感器系统；EOTS的配备提升了F-35飞行员的态势感知能力，使机组人员能够识别重点区域、执行侦察任务，并精确投放激光制导及GPS制导武器。

AN/AAQ-37 EODAS=AN/AAQ-37 EODAS | AN/AAQ-37 分布式孔径系统（DAS）由六个高分辨率红外传感器组成，安装在 F-35 战机的机身周围。该系统能够提供全方位、无遮挡的 360° 覆盖，且无需飞行员进行任何输入或瞄准操作即可自动发挥作用。DAS 可同时在各个方向上实现三类基本功能：导弹探测与跟踪（包括探测导弹发射点并提供对抗措施提示）、飞行器探测与跟踪（用于态势感知、红外搜索与跟踪（IRST）以及空对空导弹引导），以及为座舱显示器和飞行员夜视系统提供红外图像。

Litening=Litening | AN/AAQ-28 Litening吊舱是一种集成式瞄准吊舱，可外挂于飞行器上。该吊舱内置高分辨率前视红外（FLIR）传感器，能向机组人员呈现目标的红外图像；它具备宽视场搜索能力，以及针对战场规模目标的窄视场捕获/瞄准能力。吊舱内还配有一台CCD摄像机，用于获取可见光波段的目标影像。安装在万向架上的惯性导航传感器可确定视线方向，并实现自动轴线校准（自动校轴）功能。

OR-236=OR-236|ES-3A Shadow 上安装了具有 3 倍变焦功能的前视红外 (FLIR) 摄像机，ES-3A Shadow 是 S-3 Viking 的罕见 ELINT 版本。

#---------------------------------------- ESM ----------------------------------------
ALQ-142=AN/ALQ-142 ESM|AN/ALQ-142系统能够探测雷达信号，确定其来源方位，并推断其可能的信号源。该系统旨在实现极高的单次扫描截获概率，即便目标处于远距离，也能有效捕捉信号。它采用了SLQ-32(V)系统中应用的相关技术，包括安装在直升机前后部位的四组90度罗特曼透镜（Rotman-lens）阵列。 

ALQ-210=AN/ALQ-210 ESM|多任务AN/ALQ-210电子支援措施（ESM）系统能够在复杂且密集的电子战场环境中，提供可靠的情境感知与威胁告警，并具备电子情报（ELINT）级别的测量精度。

ALQ-142_RWR=AN/ALQ-142 RWR|AN/ALQ-142系统能够探测雷达信号，确定其来源方位，并推断其可能的信号源。该系统旨在实现极高的单次扫描截获概率，即便目标处于远距离，也能有效捕捉信号。它采用了SLQ-32(V)系统中应用的相关技术，包括安装在直升机前后部位的四组90度罗特曼透镜（Rotman-lens）阵列。

ALQ-210_RWR=AN/ALQ-210 RWR|多任务AN/ALQ-210电子支援措施（ESM）系统能够在复杂且密集的电子战场环境中，提供可靠的情境感知与威胁告警，并具备电子情报（ELINT）级别的测量精度。

AN/ALR-94=AN/ALR-94|AN/ALR-94数字式电子战系统能够通过在远距离上探测敌方雷达来定位潜在威胁，这使得F-22“猛禽”战斗机能够限制自身的雷达辐射，从而在敌方空域行动时更好地隐蔽自身位置。该系统集雷达告警、目标指示支持和对抗措施于一体，凭借全向、宽带的雷达告警与地理定位能力，提供全方位的态势感知，实现对战场环境的360度覆盖，即便在信号密集的复杂环境中，也能助力任务取得成功。

AN/ALQ-240=AN/ALQ-240|AN/ALQ-240(V)1 是一款由诺斯罗普·格鲁曼公司（Northrop Grumman）为美国海军 P-8A“海神”巡逻机研制的先进电子支援措施（ESM）系统。该系统能够探测、分类并定位敌方雷达及各类电子威胁，从而提供高级预警与态势感知能力，增强了该机型及其周边舰船的防御水平。

AN/ALQ-218=AN/ALQ-218|AN/ALQ-218 是一款机载无源雷达预警接收器，可提供电子战支持措施、电子信号情报 (RWR/ESM/ELINT)，专为机载态势感知和信号情报收集而设计。它安装在 EA-6B 和 EA-18G 飞机上。

AN/ASQ-239A ESM=AN/ASQ-239A ESM|BAE系统公司的AN/ASQ-239“梭鱼”（Barracuda）是一套集成式360度电子战（EW）系统，涵盖电子与红外对抗手段，并为F-35战机提供远程威胁告警（RWR）、自卫防护以及电子支援措施（ESM）支持。

AN/ASQ-239A RWR=AN/ASQ-239A RWR|BAE系统公司的AN/ASQ-239“梭鱼”（Barracuda）是一套集成式360度电子战（EW）系统，涵盖电子与红外对抗手段，并为F-35战机提供远程威胁告警（RWR）、自卫防护以及电子支援措施（ESM）支持。

AN/ALR-44=AN/ALR-44|安装在EP-3E“白羊座II”型飞机上的电子情报（ELINT）系统。

AN/ALR-60=AN/ALR-60|AN/ALR-60 是一种用于追踪和识别军舰的计算机化通信截获与分析系统。该系统装备在美国海军的 EP-3E 电子情报（ELINT）飞机上。ALR-60 是一套大型系统，设有多个操作席位和显示终端，操作人员可通过这些终端随时调取原始数据或经过处理的数据。

AN/ALR-52=AN/ALR-52|AN/ALR-52 是一种多频段瞬时频率测量（IFM）接收机，装备于美国海军的 EP-3E 电子情报（ELINT）飞机上。ALR-52 的典型工作频率范围为 0.5 至 18 GHz，其采用的接收模块可覆盖倍频程带宽。该系统的其他功能还包括频段选择、消隐、雷达参数测量，以及对连续波和脉冲信号的分析。

AN/ALR-81=AN/ALR-81|一种由康多尔（Condor）公司制造，并应用于EP-3E及ES-3A机型的ESM/ELINT系统。

AN/ALR-82=AN/ALR-82|AN/ALR-82：一种用于ES-3A和EP-3E飞机上的信号截获与分类接收机装置。


#---------------------------------------- ECM ----------------------------------------
AN/ALQ-144=AN/ALQ-144|AN/ALQ-144 是一款美国红外防空导弹对抗装置（IRCM）。它由桑德斯联合公司（Sanders Associates）于 20 世纪 70 年代研发，旨在应对诸如 9K32“箭-2”（Strela-2）这类红外制导地对空导弹所构成的威胁。

AN/ALQ-254 NGEW=AN/ALQ-254 NGEW|AN/ALQ-254“蝰蛇盾”（Viper Shield）新一代电子战系统采用了先进的数字雷达告警接收机（DRWR）技术，能够与F-16战机上新型APG-83有源相控阵（AESA）雷达无缝集成，从而提供更强的态势感知能力。该系统基于数字射频存储（DRFM）技术，具备更强的对抗先进威胁的能力。

LRASM_ECM=LRASM_ECM|LRASM的导引头与制导系统集成了抗干扰GPS/INS（全球定位系统/惯性导航系统）、具备自动场景/目标匹配识别功能的成像红外（IIR）导引头、数据链，以及被动式电子支援措施（ESM）和雷达告警接收机（RWR）传感器。

AN/ALQ-249=AN/ALQ-249|用于机载电子战系统的“下一代干扰机”（NGJ）吊舱，旨在取代EA-18G“咆哮者”和EA-6B“徘徊者”电子攻击机上所装备的AN/ALQ-99系统。其中，低频段“下一代干扰机”（NGJ-LB）的工作频段预计为0.1–2 GHz（波长299.79–14.99厘米），高频段“下一代干扰机”（NGJ-HB）的工作频段预计为6–18 GHz（波长5.00–1.67厘米）；它们与据称工作频段为2–6 GHz（波长14.99–5.00厘米）的中频段“下一代干扰机”（NGJ-MB）形成互补。

AN/ALQ-239A DECM=AN/ALQ-239A DECM|BAE系统公司的AN/ASQ-239“梭鱼”（Barracuda）是一套集成化的360度电子战（EW）系统，具备电子和红外对抗能力，可为F-35战机提供远程威胁告警（RWR）、自卫防护以及电子支援措施（ESM）支持。该系统的自卫干扰功能采用了AN/ALE-70拖曳式诱饵。 

AN/APG-81 OECM=AN/APG-81 OECM|APG-81雷达通过利用有源相控阵（AESA）的多功能阵列（MFA），充当电子战（EW）孔径，从而增强了F-35执行多任务的能力。借助电子防护（EP）、电子攻击（EA）和电子支援措施（ESM），该系统使F-35具备了压制并摧毁敌方先进防空系统的能力。

AN/ALQ-164=AN/ALQ-164|AN/ALQ-164 是一款由 BAE 系统公司（最初由桑德斯公司/Sanders 研发）制造的干扰吊舱，它整合了 AN/ALQ-126 和 AN/ALQ-162 电子对抗（ECM）系统。ALQ-164 主要应用于 AV-8B 垂直/短距起降（V/STOL）飞机。

AN/ALQ-126B=AN/ALQ-126B|AN/ALQ-126 是一款专为 F/A-18“大黄蜂”战斗机及其改型机设计的防御性电子对抗（DECM）系统。该系统具备多模式、功率可控及可重编程的特点。通过与机载雷达告警接收机（RWR）相连，ALQ-126 能够接收并处理 2–18 GHz（波长 15.0–1.7 厘米）频段内的射频（RF）信号。在完成信号处理后，系统会选择最有效的对抗手段，并以每通道最高 1 千瓦的功率发射干扰信号，从而对威胁目标实施干扰。该系统可采用多种干扰技术，包括反向圆锥扫描（ICS）、距离门拖引（RGPO）、速度门拖引（VGPO）、扫频方波（SSW）以及主瓣消隐（MLB）等。


#---------------------------------------- MAD ----------------------------------------
ASQ-81V2=AN/ASQ-81V2 MAD|AN/ASQ-81V2 能够探测局部磁场强度的变化，从而指示潜艇艇体的存在。


#---------------------------------------- Laser Designator ---------------------------
MH-60_laser=激光指示器 | 与FLIR安装座集成的激光指示器 

AN/AAQ-14=AN/AAQ-14 LANTIRN|这是一种美国红外激光瞄准吊舱，全称为“低空导航与夜间红外瞄准系统”（Low Altitude Navigation and Targeting Infrared for Night），简称“LANTIRN”。该系统由马丁·玛丽埃塔（Martin Marietta）公司开发，集导航吊舱与红外瞄准吊舱于一体。装备了LANTIRN的战斗机能够在夜间及各种天气条件下执行飞行任务。

AN/AAS-38A=AN/AAS-38A|洛克希德·马丁公司的 AN/AAS-38“夜鹰”（Nite Hawk）吊舱系统集成了高分辨率前视红外（FLIR）传感器、激光指示器和激光跟踪器，专为配合激光制导武器使用而设计。美国海军曾将该系统装备于 F/A-18C/D“大黄蜂”战斗机上。其设计旨在赋予攻击机全天候（包括昼夜及恶劣天气条件）的作战能力。该系统能够定位并捕获目标，进行自动跟踪，并将精确的目标数据传输至机载任务计算机；同时，它还能向飞行员提供视频显示。

AN/AAQ-28=AN/AAQ-28|AN/AAQ-28“利特宁”（Litening）吊舱是一种挂载于飞行器外部的综合瞄准吊舱。该吊舱内置高分辨率前视红外（FLIR）传感器，能够向机组人员呈现目标的红外图像；它既具备宽视场搜索能力，也具备针对战场规模目标的窄视场捕获与瞄准能力。吊舱内还配有一台CCD摄像机，用于获取可见光波段的目标影像。吊舱云台上的惯性导航传感器可确定视线指向，并实现自动轴线校准（自动校轴）功能。

AN/ASQ-228 ATFLIR Laser=AN/ASQ-228 ATFLIR Laser|AN/ASQ-228“先进瞄准前视红外系统”（ATFLIR）是一种多传感器光电瞄准吊舱，集成了热成像摄像机、微光电视摄像机、目标激光测距仪/激光指示器以及激光光斑跟踪器。

AN/AAQ-40 EOTS Laser=AN/AAQ-40 EOTS Laser|F-35的光电瞄准系统（EOTS）是一款高性能、轻量化的多功能系统，能够在红外波段提供精确的空对空及空对地瞄准能力。它是首个将前视红外（FLIR）与红外搜索与跟踪（IRST）功能融为一体的传感器系统；通过该系统，F-35飞行员的态势感知能力得以增强，机组人员能够识别目标区域、执行侦察任务，并精确投放激光制导及GPS制导武器。

MIRLS=MIRLS | AN/AAQ-28“闪电”（Litening）吊舱是一种集成式瞄准吊舱，可外挂于飞行器上。该吊舱内置高分辨率前视红外（FLIR）传感器，能向机组人员呈现目标的红外图像；它既具备大视场搜索能力，也具备针对战场尺度目标的小视场捕获与瞄准能力。吊舱内还配有一台CCD摄像机，用于获取可见光波段的目标影像。吊舱云台上集成的惯性导航传感器可建立视轴基准，并实现自动轴线校准（自动校轴）功能。


#---------------------------------------- Radar ----------------------------------------
APS-124=AN/APS-124|AN/APS-124型海面搜索雷达安装在“海鹰”（Sea Hawk）直升机驾驶舱下方的一个扁平雷达罩内，其低剖面线性阵列天线可实现360度全方位覆盖。该雷达采用独特的高速扫描天线和先进的数字扫描转换器，能够进行精确的“扫描间积分”（scan-to-scan integration），从而在包括恶劣天气在内的各种环境下，实现对海面目标的最佳探测。其主要特点包括发射能量高，且能够在高海况下探测到小型海面目标。 

APS-147=AN/APS-147水面搜索雷达安装在“海鹰”直升机驾驶舱下方的一个扁平雷达罩内，其低剖面线性阵列天线可提供360度全方位覆盖。该雷达采用独特的高速扫描天线和先进的数字扫描转换器，能够实现精确的“扫描间积分”（scan-to-scan integration），从而在恶劣天气条件下也能对水面目标进行有效探测。其主要特点包括发射能量高，且能够在高海况下探测到小型水面目标。 

AN/APY-10=AN/APY-10 是一款美国多功能雷达，专为美国海军的波音 P-8“海神”（P-8 Poseidon）海上巡逻与监视飞机而研制。AN/APY-10 是一个雷达系列的最新型号；该系列最初由德州仪器（Texas Instruments）公司开发，用于洛克希德 P-3“猎户座”（P-3 Orion）飞机（即 P-8 的前身）。在德州仪器将其雷达业务出售给雷神（Raytheon）公司后，该系列雷达现由雷神公司负责。

AN/APS-153(V) AIR=AN/APS-153(V) 机载雷达——该雷达应用于美国海军的MH-60R多任务直升机，是全球顶尖的海上监视雷达。它集成了敌我识别系统（IFF）、自动雷达潜望镜探测与识别功能（ARPDD），并具备远程高分辨率成像（ISAR）能力。

AN/APS-153(V) ISAR=AN/APS-153(V) ISAR | 该系统应用于美国海军的MH-60R多任务直升机，是全球顶尖的海上监视雷达。它集成了敌我识别（IFF）系统、自动雷达潜望镜探测与识别（ARPDD）功能，并具备远程高分辨率成像（ISAR）能力。

AN/APY-9=AN/APY-9雷达专为E-2D“先进鹰眼”（Advanced Hawkeye）预警机上的机载预警与控制（AEW&C）任务而设计，用于引导美国海军的水面舰队及空中作战力量。该雷达旨在探测、跟踪并识别远洋、近岸及陆地环境中的空中和水面目标；此外，它还能通过数据链，引导由其他舰船或航空器发射的武器弹药。该雷达系统具备多种工作模式：既可通过机械扫描方式实现360°全方位目标跟踪，也能利用其有源相控阵（AESA）能力，在90°扇区内提供增强型跟踪。该系统具备全天候作战能力，并可运用“空时自适应处理”（STAP）架构来抑制干扰、杂波及其他各类电磁干扰源。

AN/APG-73=AN/APG-73雷达是20世纪80年代末在APG-65雷达基础上进行的升级版本，具备更高的数据吞吐量、更大的存储容量、更高的可靠性以及更便捷的维护性。当配备运动感知子系统、扩展波形发生器及专用测试设备时，APG-73能够生成高分辨率地面测绘图像，并利用“先进”的图像相关算法来提高武器目标指示的精度。自1992年起，APG-73雷达便已装备于美国海军及海军陆战队的F/A-18C/D“大黄蜂”战机，以及美国海军早期型号的F/A-18E/F“超级大黄蜂”战机上。

AN/APG-79=AN/APG-79|AN/APG-79 是为美国海军的 F/A-18E/F 超级大黄蜂和 EA-18G 咆哮者飞机开发的有源电子扫描阵列 (AESA) 雷达。 AESA 技术可快速更新多个目标，其固态天线结构使其比传统雷达系统更加可靠且更具成本效益。该雷达的射程可达 150 公里（81 海里；93 英里），可同时跟踪多个目标。

AN/APG-73(V)=AN/APG-73(V) | 这是 AN/APG-79 的另一种型号名称。AN/APG-79 是一款有源电子扫描阵列（AESA）雷达，专为美国海军的 F/A-18E/F“超级大黄蜂”和 EA-18G“咆哮者”战机而研发。AESA 技术能够快速更新多个目标的信息；其固态天线结构不仅提升了可靠性，还使其比传统雷达系统更具成本效益。该雷达的探测距离可达 150 公里（81 海里；93 英里），并能同时跟踪多个目标。

AN/APG-81=AN/APG-81 | F-35 战机所配备的 AN/APG-81 有源相控阵（AESA）雷达具备空对空模式，以及先进的空对地模式；后者涵盖合成孔径雷达（SAR）高分辨率测绘、多地面移动目标指示与跟踪、作战识别、电子战，以及超高带宽通信等功能。

AN/APG-85=AN/APG-85 | AN/APG-85有源相控阵（AESA）雷达是F-35战机所装备的AN/APG-81雷达的升级版本，其功能范围得到了进一步扩展。该雷达具备空对空模式，以及多种先进的空对地模式，包括合成孔径雷达（SAR）高分辨率测绘、多地面运动目标指示与跟踪、作战识别、电子战，以及超高带宽通信能力。

AN/APG-65(V1)=AN/APG-65(V1) | 这是为 AV-8B“鹞 II Plus”（Harrier II Plus）设计的 AN/APG-65 改型。受雷达罩尺寸限制，其天线较小，导致性能下降了 10%。

AN/APS-137=AN/APS-137雷达系统用于反水面作战和反潜作战。它能够执行远程水面搜索与目标跟踪、潜望镜探测，并利用逆合成孔径雷达（ISAR）技术对舰船进行成像与分类。其合成孔径雷达（SAR）功能则用于对陆监视、目标指示及地面测绘。美国海军的S-3飞机装备有APS-137雷达；先进的P-3“猎户座”海上巡逻机配备的是APS-137(V)5型雷达；而由波音公司牵头的团队所研发的P-8“多任务海上飞机”（P-8 MMA）则采用了APS-137D(V)5型雷达。


