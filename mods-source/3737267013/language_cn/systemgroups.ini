#---------------------------------------- MAD ----------------------------------------
ASQ-81V2=AN/ASQ-81V2 MAD|AN/ASQ-81V2能够探测水域内局部磁场强度的变化，并借此判断水下是否有潜艇。

#---------------------------------------- Laser Designator ---------------------------
MH-60_laser=激光器|红外光电转塔集成的激光器。

AN/AAQ-14=AN/AAQ-14 LANTIRN|这是一种美国红外激光瞄准吊舱, 全称为“低空夜间导航与红外瞄准”(Low Altitude Navigation and Targeting Infrared for Night), 缩写为LANTIRN。由马丁·玛丽埃塔公司开发, 是一种集导航与红外瞄准吊舱于一体的系统。装备LANTIRN的战斗机可在夜间和任何天气条件下执行飞行任务。

#---------------------------------------- Radar ----------------------------------------
APS-124=AN/APS-124|AN/APS-124水面搜索雷达安装在“海鹰”直升机驾驶舱下方的扁平雷达罩内，配备低轮廓线性阵列天线，可提供360度覆盖。其独特的快速扫描天线和先进的数字扫描转换器，有助于实现精确的扫描间整合，从而在恶劣天气条件下也能对水面目标进行最佳探测。主要特点包括高发射功率以及在高海况下探测微小水面目标的能力。

APS-147=AN/APS-147|AN/APS-147水面搜索雷达安装在“海鹰”直升机驾驶舱下方的扁平雷达罩内，配备低轮廓线性阵列天线，可提供360度覆盖。其独特的快速扫描天线和先进的数字扫描转换器，有助于实现精确的扫描间整合，从而在恶劣天气条件下也能对水面目标进行最佳探测。主要特点包括高发射功率以及在高海况下探测微小水面目标的能力。

AQS-13F=AQS-13F|AQS-13F是一种机载中频主动/被动吊放声呐，用于探测、识别和跟踪潜艇。 
AQS-22F=AQS-22F|AQS-13F是一种机载低频主动/被动吊放声呐，用于探测、识别和跟踪潜艇。

#-------------------------------------- Sonobuoys --------------------------------------
SSQ-53D_Sonar=被动声呐浮标|AN/SSQ-53 DIFAR 是一种被动式定向 LOFAR 声呐浮标，用于对水下潜艇进行初步探测。
SSQ-53F_Sonar=被动声呐浮标|AN/SSQ-53 DIFAR 是一种被动式定向 LOFAR 声呐浮标，用于对水下潜艇进行初步探测。
SSQ-62C_Sonar=主动声呐浮标|AN/SSQ-62 DICASS 是一种主动声呐浮标，用于锁定先前已通过 SSQ-53 被动声呐浮标定位的潜艇。
SSQ-62E_Sonar=主动声呐浮标|AN/SSQ-62 DICASS 是一种主动声呐浮标，用于锁定先前已通过 SSQ-53 被动声呐浮标定位的潜艇。
SSQ-77B_Sonar=垂直线列声呐浮标|SSQ-77B VLAD（垂直线阵列DIFAR）是一种采用DIFAR（定向频率与记录）技术的“A”型被动搜索声呐浮标。