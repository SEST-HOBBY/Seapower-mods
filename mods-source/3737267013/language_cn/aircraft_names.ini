[usmc_uh-1y]
Type=通用直升机
Default=UH-1Y 毒液,UH-1Y
DefaultDescription=贝尔UH-1Y“毒液”（又称“超级休伊”）是一款双引擎、四桨叶的中型通用直升机，由贝尔德事隆公司在为美国海军陆战队执行的H-1升级计划下制造。UH-1Y是庞大的“休伊”家族的最新成员之一，因其型号字母在北约音标字母表中的读音又被称为“扬基”。贝尔原本计划通过改装UH-1N来生产UH-1Y，但最终采用了全新制造的机体。2008年，UH-1Y进入海军陆战队服役，并开始全速生产。这款新型UH-1取代了海军陆战队1970年代初列装的UH-1N“双休伊”轻型通用直升机。该机及相关的贝尔AH-1Z“蝰蛇”已获捷克共和国订购，并在2020年代初仍在生产。从外观上看，Y型与早期N型的区别包括略长的座舱和更大的双发动机排气口。
