#[usmc_ah-1z]
Type=攻击直升机
Default=AH-1Z 蝰蛇,AH-1Z
DefaultDescription=贝尔AH-1Z“蝰蛇”是一款双引擎攻击直升机，基于AH-1W“超级眼镜蛇”发展而来，由美国航空航天制造商贝尔直升机公司设计生产。它是庞大的贝尔“休伊”家族的最新成员之一，因其型号字母在军用音标字母表中的读音而常被称为“祖鲁眼镜蛇”。AH-1Z是1990年代至2000年代为美国海军陆战队(USMC)执行的H-1升级计划的一部分而研制的。它本质上是对现役AH-1W的现代化改造，最初本打算作为改装项目，后来则改为订购全新制造的直升机。AH-1Z与贝尔UH-1Y“毒液”通用直升机共享尾梁、发动机、旋翼系统、传动系统、航电架构、软件、操控和显示器，超过84%的部件相同。它采用四桨叶、无轴承复合材料主旋翼系统，升级了传动装置，并配备了新型目标瞄准系统等多项改进。
