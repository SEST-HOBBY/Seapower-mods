[---------- General Data ----------]
[General]
UnitType=Helicopter
CarrierCapable=True
# Experimental V-22 helicopter-base build.
# Sea Power now owns helicopter launch/recovery, hover physics and native rotor spin-up.
# V22Tiltrotor.dll v2.2 controls nacelle conversion plus BFWS nacelle/blade visuals; Sea Power still owns native rotor RPM.

DefaultCameraDistance=1
MinCameraDistanceForeAft=0.33
MinCameraDistanceBroadside=0.33
CameraPivotHeight=0.0

#Taxi values
GroundedPitchAngle=0   // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.0253,-0.0152
OnDeckPositionOffset=0,0.005,-0.07
ForwardsTaxiVelocity=25
BackwardsTaxiVelocity=-5

TransportCapacity=24

[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[AI]
Role=ASW,Attack,SAR,Transport

[SensorData]
#Visual
VisualIdentificationRange=5.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usn_vtol_v22

[---------- Helicopter Physics ----------]
[Physics]
# Initial experimental V-22 values.  The schema is taken from the CH-46 helicopter base.
MaxPitchRate=12.0
MaxRollRate=25.0
MaxYawRate=45.0
MaxPitchAngle=05
#MaxPitchAngle=30
MaxRollAngleHovering=25
MaxRollAngleForwardFlight=60
TargetPitchForForwardFlight=7.5

# Hover behaviour
HoverStrength=0.35
MinVelocityForNoHoverMovement=40
MaxHoverRadius=3

# Forward-flight envelope - test values for the MV-22 helicopter-base experiment
MaxSpeedAtSeaLevel=280
MaxBackwardSpeed=20
MaxSidewardSpeed=40
Ceiling=25000.0
Altitudes=20,200,500,1000,3000,6000,10000,15000,20000,25000
ClimbRate=53.3

# Approximate V-22 mass/fuel/range values for this test build
EmptyMass=15875
MaxFuel=5307
MaxRange=879
HoveringFuelConsumption=0.61
TransportCapacity=24

# Native helicopter motion tuning
MainThrustAccelerationFactor=5.0
LinearDrag=0.9995
CurveDragFactor=2.0
GravityDragFactor=1.0
MousePitchFactor=0.3
MouseYawFactor=0.3

# Native helicopter engine/rotor startup
EngineWarmUpTime=20
RotorsSpinUpTime=25

[---------- Main Systems ----------]

[FlightControls]
# Sea Power has no transverse-rotor type; Tandem is the closest native two-main-rotor mode.
# Both V-22 proprotors are therefore treated as MAIN rotors.
