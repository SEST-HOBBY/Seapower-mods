# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------

usn_agm-62e=AGM-62E,Walleye II ERDL,AGM,The AGM-62E Walleye II ERDL (Extended Range Data Link), also known as the Mk 23, is an unpowered, TV-guided glide bomb featuring a two-way datalink that allows the launch aircraft to lock onto targets after release.

usa_agm-114b_zz=AGM-114B,Hellfire,ASM,The AGM-114 Hellfire is an American multi-platform, multi-target guided missile. Primarily developed for anti-armor missions, later variants are also deployed on unmanned aerial vehicles for precision strikes against high-value targets. Capable of multi-mission and multi-target precision engagement, the missile weighs around 45 kilograms (100 pounds) and can be launched from air, land and sea platforms; upgraded versions possess limited surface-to-surface and surface-to-air strike capabilities.

usa_agm-114k_hh=AGM-114K,Hellfire II,ASM,A lightweight derivative of AGM-114F with shortened airframe. It has an effective range of 8 kilometers, plus electronic safety and arming devices. It adopts the AGM-114F tandem HEAT warhead to engage armored vehicles.

usa_agm-114l_mm=AGM-114L,Longbow Hellfire,ASM,The Longbow Hellfire features active millimeter-wave (MMW) radar homing. It requires no post-launch guidance and supports lock-on-after-launch; targets can be eliminated even when the launcher or friendly units lack direct line-of-sight to the target.

usn_agm-119_air=AGM-119,Penguin Mk2,ASM,The AGM-119 Penguin is a small air-launched and surface-launched anti-ship missile developed in collaboration between the US and Norway.

usn_agm-158c-3=AGM-158C-3,LRASM-ER,ASM,The AGM-158C-3 is the latest variant of Lockheed Martin’s AGM-158C Long Range Anti-Ship Missile (LRASM), developed for the U.S. Air Force and Navy. It features extended range, enhanced cooperative engagement capabilities, and improved stealth penetration. it can be launched from platforms including the B-1B, F/A-18E/F, and F-15EX. 

usn_jsm=JSM,,Anti Ship,The Joint Strike Missile (JSM) is a multi-role, air-launched cruise missile under development by the Norwegian company Kongsberg Defence & Aerospace and American company Raytheon Missiles & Defense.

#-----------Land Strike only missiles---------

usn_agm-65d=AGM-65D,Maverick,AGM,The AGM-65D is a US infrared-guided standoff air-to-ground weapon that can lock onto targets in adverse environments. It is used in a similar manner to the AGM-62, with the operator at the launch platform directing the crosshairs toward the desired target for guidance.

usn_agm-65e=AGM-65E,Maverick,Land Attack,Maverick E uses a laser designator guidance system optimized for fortified installations using a delayed fuse combined with a heavier penetrating blast-fragmentation warhead (140 kg (300 lb) vs. 57 kg (125 lb) in older models) that perforates a target with its kinetic energy before detonation.

usn_agm-65f=AGM-65F,Maverick,AGM,The AGM-65F is an American infrared-guided standoff air-to-ground weapon that uses a heavier warhead and is primarily used by the U.S Navy.

usn_agm-88e=AGM-88E,HARM,ARM,AGM-88 is an airborne high-speed anti-radiation missile equipped by the U.S. Navy and Air Force. Its English abbreviation HARM is used to suppress and destroy the guidance radar, target indication radar and anti-aircraft gun aiming radar of enemy ground and ship-based air defense missile systems.

usn_agm-88g=AGM-88G,AARGM-ER,ARM,The AGM-88G, AARGM-ER (Hamm Extended Range Missile) missile is the latest air launched tactical missile system developed by the American company Northrop Grumman. It is an extended range model of the AGM-88E and is mainly used to suppress enemy land-based and sea based air defense systems. The missile has been improved based on the AGM-88E model, with optimized body structure and power system. It adopts new guidance components and solid rocket engines, significantly improving range and maneuverability. After the first live fire test in July 2021, the initial combat capability will be formed and equipped with F-35 and F/A-18 fighter jets by 2024

usn_agm-158b-2=AGM-158B-2,JASSM-ER,Land Attack,Developed by Lockheed Martin, The AGM-158B-2 JASSW-ER is a stealthy extended-range cruise missile powered by a turbofan engine with a range exceeding 1,900km. Equipped with inertial navigation+GPS+infrared imaging terminal guidance and a 454kg warhead, it features an upgraded GPS receiver and anti-jamming software, enabling standoff strikes against high-value targets and compatible with multiple fighters.

usn_jsm_land=JSM,Land Strike,The Joint Strike Missile (JSM) is a multi-role, air-launched cruise missile under development by the Norwegian company Kongsberg Defence & Aerospace and American company Raytheon Missiles & Defense.

# ---------- Anti-sub  Missilies ----------

# ------------------ RBU ------------------

# --------------- Torpedoes ---------------

usn_mk50_air=MK 50,ALWT,ASW Torpedo,The Mark 50 Advanced Lightweight Torpedo is a next-generation anti-submarine weapon designed to give lighter-weight platforms the extreme capability required to effectively counter the latest deep-diving submarines. While the ALWT program was cancelled, several hundred torpedoes were produced, allowing for just enough for the entire fleet to share. This variant is air dropped.


usn_mk54_air=MK 54,LHT,ASW Torpedo,The Mark 54 Lightweight Hybrid Torpedo (LHT) is an affordable new standard of lightweight ASW torpedo combining all of the seeker technologies used from the high-performance MK 50 ALWT, while using a modestly upgraded version of the MK 46 torpedo body. This lets a cheap, common torpedo like MK 54 have very high performance against most targets, even if it may not be as capable against ultra-deep-diving fast submarines. This variant is air dropped.
usn_mk54_ship=MK 54,LHT,ASW Torpedo,The Mark 54 Lightweight Hybrid Torpedo (LHT) is an affordable new standard of lightweight ASW torpedo combining all of the seeker technologies used from the high-performance MK 50 ALWT, while using a modestly upgraded version of the MK 46 torpedo body. This lets a cheap, common torpedo like MK 54 have very high performance against most targets, even if it may not be as capable against ultra-deep-diving fast submarines. This variant is ship launched.

# ------------------ Bombs -----------------

usn_gbu-12d=GBU-12D,Paveway II,Guided Bomb,The United States improved the Paveway I system in the 1970s. The new system had a deployable tail, which made the glide farther, more accurate, and cheaper. The improved Paveway system was called Paveway II.

usn_gbu-24=GBU-24,Paveway III,Guided Bomb,The GBU-24 has a longer glide range than the GBU-10 or Type II series due to the use of more efficient guidance technology. However, the Type III guidance kit is more expensive, making the GBU-24 more suitable for engaging heavily defended high-value targets.

usn_gbu-31v1=GBU-31(V)1,JDAM,Land Strike,The Joint Direct Attack Munition is an air-dropped bomb accessory developed jointly by Boeing for the U.S. Navy and Air Force. It is installed on traditional bombs dropped by aircraft to transform the originally uncontrolled traditional aerial bombs into controllable precision-guided weapons that can be used in severe weather conditions.

usn_gbu-31v4=GBU-31(V)4,JDAM,Land Strike,2,000-pound class Joint Direct Attack Munition (JDAM) variant used exclusively by the U.S. Navy and U.S. Marine Corps.

usn_gbu-32v2=GBU-32(V)2,JDAM,Guided Bomb,The GBU-32 is an American 1000lb GPS-guided Bomb.

usn_gbu-39=GBU-39,SDB, is a 250-pound (110–122 kg) precision-guided glide bomb developed by Boeing that entered U.S. service in 2006.  It features a GPS/INS guidance system and deployable wings that allow it to glide over 60 nautical miles (111 km) from the release point, providing stand-off capability for aircraft.

usn_gbu-39_quad=GBU‑39 Quad,SDB, is launched from the BRU-61/A smart carriage system, a quad-pack launcher capable of holding four bombs in a streamlined, compact configuration. Each munition is mounted in an individual bay within the rack, with separate power and datalink interfaces for independent targeting. The BRU-61/A uses pneumatic ejection to minimize signature and improve reliability under high-G maneuvering conditions.

usn_gbu-53=GBU-53,StormBreaker,Land Strike,Guided Bomb,The GBU-53 is an air-launched precision-guided glide bomb. The bomb was developed by Raytheon. In the initial bidding, the team of Boeing and Lockheed Martin won the contract for the bomb, but it was shelved for several years due to the Darlene Drewyn corruption case and was not re-bid until September 2005.

usn_gbu-75_jdam_lr=GBU-75,JDAM-LR,Guided Bomb,GBU-75 is a long-range powered standoff strike weapon developed by Boeing for the U.S. Navy. Transforming standard gravity bombs into jet-propelled precision munitions.

usn_bsu-49=BSU-49,A high-drag bomb developed based on the MK-82, which is more accurate than the MK-82.

# ---------------- Sonobuoys ---------------
usn_ssq-53d=AN/SSQ-53D,DIFAR,Passive Sonobuoy,The SSQ-53 is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1.

usn_ssq-53f=AN/SSQ-53F,DIFAR,Passive Sonobuoy,The SSQ-53 is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy. This gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1.

usn_ssq-62c=AN/SSQ-62C,DICASS,Active Sonobuoy,The AN/SSQ-62 DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys.

usn_ssq-62e=AN/SSQ-62E,DICASS,Active Sonobuoy,The AN/SSQ-62 DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys.

