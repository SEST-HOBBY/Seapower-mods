usn_adm-160b=ADM-160B,MALD, Miniature Air-Launched Decoy is a low-cost, expendable, air-launched programmable decoy munition developed by Raytheon.  It is designed to duplicate the combat flight profiles and radar signatures of US and allied aircraft, thereby confusing and overwhelming enemy Integrated Air Defense Systems (IADS)

