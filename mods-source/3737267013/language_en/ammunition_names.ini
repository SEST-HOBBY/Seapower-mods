[AmmunitionNames]
# ---------- Air To Air Missile ---------

usa_aim-92=AIM-92,Stinger,AAM,The FIM-92 Stinger MANPADS is a small portable air defense missile that uses infrared-guided heat tracking and ultraviolet object tracking. It was developed by the United States and used by all U.S. military forces. It has been in service since 1981. In the United States and 29 other countries, it is mainly manufactured by Raytheon, and authorized to produce missiles by EADS in Germany and ROKETSAN in Turkey. More than 70,000 missiles have been produced.

usn_aim-7p=AIM-7P,Sparrow,AAM,The AIM-7M Sparrow is an American semi-active radar-homing air-to-air missile. It is very similar to the AIM-7M in many aspects and represents an upgrade to the existing M-series missiles. The improvements are primarily in the software, enhancing low-altitude performance. Subsequent upgrades also added the ability to switch targets in mid-course.

usn_aim-9m=AIM-9M,Sidewinder,AAM,The AIM-9M Sidewinder is an American infrared-guided air-to-air missile. The M model has increased anti-interference capability based on the L model, and uses a low-tail flame engine, making it difficult to be detected when used at close range.

usn_aim-9x=AIM-9X,Sidewinder,AAM,The AIM-9X Sidewinder is an American infrared-guided air-to-air missile. The X-model has been significantly upgraded, with strong anti-jam capabilities, a longer range, and an impressive backwards firing capability.

usn_aim-120a=AIM-120A,AMRAAM,AAM,The AIM-120A AMRAAM is an American active radar-homing air-to-air missile. This is the most advanced air to air missile in the US arsenal so far, and is a lighter and much more capable successor to the semi-active Sparrow missile. The AMRAAM achieves its high performance in all remarks via a datalink and active radar seeker, high performance rocket motor for very high flight speed, and a lofting trajectory for maximum kinematic performance to engage both maneuvering and fast flying air targets.

usn_aim-120c=AIM-120C,AMRAAM,AAM,AIM-120 is an active radar-guided air-to-air missile of the United States, used to replace the old Sparrow semi-active radar-guided air-to-air missile. It is relatively small and can be carried by most aircraft.

usn_aim-120c7=AIM-120C7,AMRAAM,AAM,AIM-120 is an active radar-guided air-to-air missile of the United States, used to replace the old Sparrow semi-active radar-guided air-to-air missile. It is relatively small and can be carried by most aircraft.

usn_aim-120d=AIM-120D,AMRAAM,AAM,AIM-120 is an active radar-guided air-to-air missile of the United States, used to replace the old Sparrow semi-active radar-guided air-to-air missile. It is relatively small and can be carried by most aircraft.

usn_aim-120d3=AIM-120D3,AMRAAM,AAM,The AIM-120D-3 is the final upgrade carried out by RTX for the AIM-120 family, mainly focusing on flight control and software upgrades. It optimizes the fuel efficiency of missile engines through enhanced combat and control chips, and enables the missile's control surface to operate normally at higher altitudes and thinner atmospheres. This greatly increases the range of the AIM-120 missile without hardware upgrades. The specialized anti missile combat software similar to Standard 6 enables the AIM-120 to have certain anti missile combat capabilities, and this capability has been tested in operations in the Red Sea.

usn_aim-174b=AIM-174B,Gunslinger,AAM,The AIM-174B Gunslinger air-to-air missile is a long-range air-to-air missile developed by the US defense contractor Raytheon for the US Navy. The US Navy describes the AIM-174B as an "air-launched version" of the SM-6. Currently, only the F/A-18E/F Super Hornet fighter jet is capable of carrying and launching the AIM-174B.

usn_aim-424=AIM-424,,AAM,The AIM-424 Malice Long Range Air to Air Missile (LRAAM), a next-generation missile intended to strengthen fleet defense and maintain a decisive air domain overmatch against advanced threats.

