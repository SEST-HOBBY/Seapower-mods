DefaultDescription=The Bell AH-1Z Viper is a twin-engine attack helicopter, based on the AH-1W SuperCobra, designed and produced by the American aerospace manufacturer Bell Helicopter. It is one of the latest members of the prolific Bell Huey family. It is often called "Zulu Cobra", based on the military phonetic alphabet pronunciation of its variant letter.The AH-1Z was developed in the 1990s and 2000s as a part of the H-1 upgrade program on behalf of the United States Marine Corps (USMC). It is essentially a modernisation of the service's existing AH-1Ws, and was originally intended to be a rebuild program before subsequent orders were made for new-build helicopters instead. The AH-1Z and Bell UH-1Y Venom utility helicopter share a common tailboom, engines, rotor system, drivetrain, avionics architecture, software, controls and displays for over 84% identical components. It features a four-blade, bearingless, composite main rotor system, uprated transmission, and a new target sighting system amongst other improvements.

