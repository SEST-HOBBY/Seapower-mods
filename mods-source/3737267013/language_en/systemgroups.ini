[SystemNames]
#---------------------------------------- Visual ----------------------------------------
2nd_Gen_FLIR=FLIR|FLIR 2nd generation airbone EO and IR sensor

3rd_Gen_FLIR=FLIR|FLIR 3rd generation airbone EO and IR sensor

AdvancedOptics_FLIR=AdvancedOptics_FLIR|A 2nd Gen FLIR thermal imaging device which provies increased target visibility over a long range for the smallest of objects, even in dark or adverse weather conditions.

AN/AAQ-33(V)=AN/AAQ-33(V)|The Sniper is a family of targeting pods for military aircraft manufactured by Lockheed Martin providing positive target identification, autonomous tracking, GPS coordinate generation, and precise munition guidance from extended standoff ranges.

AN/AAS-44 EOFLIR=AN/AAS-44 EOFLIR|The AAS-44 set is a long range multipurpose thermal image sensor and laser designator. It provides long range tracking, surveillance, designation and rangefinding for AGM-114 Hellfire missiles and other laser-guided munitions. The AAS-44(V) is deployed on US Navy SH-60B and HH-60H helicopters. The AN/AAS-44(C) is integrated onto the US Navy's MH-60S and MH-60R helicopters.

MX-20HD=MX-20HD|The Poseidon’s MX-20HD digital electro-optical and infrared (EO/IR) multi-spectral sensor turrets come from L3Harris Wescam in Burlington, Ontario. The MX-20HD is gyro-stabilized and can have as many as seven sensors, including infrared, CCDTV, image intensifier, laser rangefinder, and laser illuminator.

AN/ASQ-228 ATFLIR IRIS=AN/ASQ-228 ATFLIR IRIS|The AN/ASQ-228 Advanced Targeting Forward-Looking Infrared (ATFLIR) is a multi-sensor, electro-optical targeting pod incorporating thermographic camera, low-light television camera, target laser rangefinder/laser designator, and laser spot tracker developed and manufactured by Raytheon. It is used to provide navigation and targeting for military aircraft in adverse weather and using precision-guided munitions such as laser-guided bombs.

AN/AAQ-40 EOTS=AN/AAQ-40 EOTS|The F-35's Electro-Optical Targeting System (EOTS)is a high-performance, lightweight, multi-function system that provides precision air-to-air and air-to-surface targeting capability in the IR spectrum. It is the first sensor to combine forward-looking infrared and infrared search and track functionality, and as such EOTS enhances F-35 pilots’ situational awareness and allows aircrews to identify areas of interest, perform reconnaissance and precisely deliver laser and GPS-guided weapons.

AN/AAQ-37 EODAS=AN/AAQ-37 EODAS|The AN/AAQ-37 Distributed Aperture System (DAS) consists of six high-resolution infrared sensors mounted around the F-35's airframe in such a way as to provide unobstructed 360° coverage and functions around the aircraft without any pilot input or aiming required.DAS provides three basic categories of functions in every direction simultaneously: Missile detection and tracking (including launch point detection and countermeasure cueing), Aircraft detection and tracking (situational awareness, infrared search and track (IRST) and air-to-air missile cueing) and IR Imagery for cockpit displays and pilot night vision.

Litening=Litening|The AN/AAQ-28 Litening Pod is an integrated targeting pod that mounts externally to the aircraft. The pod contains a high-resolution, forward-looking infrared (FLIR) sensor that displays an infrared image of the target to the aircrew; it has a wide field of view search capability and a narrow field of view acquisition/targeting capability of battlefield-sized targets. The pod also contains a CCD camera used to obtain target imagery in the visible portion of the electromagnetic spectrum. An on-gimbal inertial navigation sensor establishes line-of-sight and automatic boresighting capability.

OR-236=OR-236|A Forward Looking infrared (FLIR) camera with 3× zoom fitted to the ES-3A Shadow, a rare ELINT version of the S-3 Viking.

#---------------------------------------- ESM ----------------------------------------
ALQ-142=AN/ALQ-142 ESM|The AN/ALQ-142 detects radar signals, identifies their point of origin, and estimates their probable source. The system was designed to provide a high probability of intercept on a single scan even when targets are at long range. It incorporates technologies used in the SLQ-32(V), including four 90° Rotman-lens arrays located fore and aft on the helicopter. 

ALQ-210=AN/ALQ-210 ESM|The multi-mission AN/ALQ-210 Electronic Support Measures (ESM) system provides proven situational awareness and threat warning with Electronics Intelligence (ELINT) quality measurement accuracy in complex and dense electronic battlefield scenarios. 

ALQ-142_RWR=AN/ALQ-142 RWR|The AN/ALQ-142 detects radar signals, identifies their point of origin, and estimates their probable source. The system was designed to provide a high probability of intercept on a single scan even when targets are at long range. It incorporates technologies used in the SLQ-32(V), including four 90° Rotman-lens arrays located fore and aft on the helicopter.

ALQ-210_RWR=AN/ALQ-210 RWR|The multi-mission AN/ALQ-210 Electronic Support Measures (ESM) system provides proven situational awareness and threat warning with Electronics Intelligence (ELINT) quality measurement accuracy in complex and dense electronic battlefield scenarios.

AN/ALR-94=AN/ALR-94|The AN/ALR-94 digital electronic warfare system geolocates potential threats by detecting adversary radars at significant ranges, allowing the F-22 Raptor to limit its own radar emissions, enabling it to better conceal its location when operating in hostile territory. It Integrates radar warning, targeting support, and countermeasures in one system, providing enhanced situational awareness through all-aspect, broadband radar warning and geolocation capabilities giving a 360º view of the battlespace, promoting mission success even in signal dense environments

AN/ALQ-240=AN/ALQ-240|The AN/ALQ-240(V)1 is a sophisticated Electronic Support Measures (ESM) system by Northrop Grumman for the U.S. Navy's P-8A Poseidon aircraft, providing advanced early warning and situational awareness by detecting, classifying, and geolocating enemy radar and electronic threats, enhancing defense for both the aircraft and nearby ships.

AN/ALQ-218=AN/ALQ-218|The AN/ALQ-218 is an airborne passive radar warning receiver which provides electronic warfare support measures, electronic signals intelligence (RWR/ESM/ELINT) and is designed for airborne situational awareness and signal intelligence gathering. It is fitted to the EA-6B and EA-18G aircraft.

AN/ASQ-239A ESM=AN/ASQ-239A ESM|BAE Systems AN/ASQ-239 Barracuda is an integrated 360° electronic warfare (EW) suite electronic and infrared countermeasures system with long-range threat warning RWR, self-protection, and ESM support for the F-35.

AN/ASQ-239A RWR=AN/ASQ-239A RWR|BAE Systems AN/ASQ-239 Barracuda is an integrated 360° electronic warfare (EW) suite electronic and infrared countermeasures system with long-range threat warning RWR, self-protection, and ESM support for the F-35.

AN/ALR-44=AN/ALR-44|An Electronic Intelligence (ELINT) system fitted to the EP-3E Aries II.

AN/ALR-60=AN/ALR-60|The AN/ALR-60 is a computerized communications intercept and analysis system for tracking and identifying warships. The ALR-60 is carried in the U.S. Navy's EP-3E electronic intelligence (ELINT) aircraft. The ALR-60 is a large system that has multiple operator positions and video terminals where operators can randomly access raw or processed data. 

AN/ALR-52=AN/ALR-52|The AN/ALR-52 is a multi-band instantaneous frequency measurement (IFM) receiver used in the U.S. Navy EP-3E electronic intelligence (ELINT) aircraft. Typical coverage of the ALR-52 is from 0.5 to 18 GHz using receiver modules that cover octave bandwidths. Additional features of the system are frequency band selection, blanking, measurement of radar parameters, and analysis of continuous wave in addition to pulsed signals.

AN/ALR-81=AN/ALR-81|An ESM/ELINT System, manufactured by Condor and used in EP-3E & ES-3A.

AN/ALR-82=AN/ALR-82|AN/ALR-82 A signal-intercept and classification receiver set which is used in ES-3A and EP-3E.


#---------------------------------------- ECM ----------------------------------------
AN/ALQ-144=AN/ALQ-144|The AN/ALQ-144 is a US infrared anti-aircraft missile countermeasure devices (IRCM). It was developed by Sanders Associates in the 1970s to counter the threat of infrared guided surface-to-air missiles like the 9K32 Strela-2.

AN/ALQ-254 NGEW=AN/ALQ-254 NGEW|The AN/ALQ-254 Viper Shield Next Generation Electronic WArfare system has advanced digital radar warning receiver (DRWR) technology which integrates seamlessly with the F-16's new APG-83 active electronically scanned array (AESA) radar to deliver greater situational awareness. The digital radio frequency memory (DRFM)-based jamming system provides enhanced capability against advanced threats.

LRASM_ECM=LRASM_ECM|The LRASM's seeker and guidance system integrates a jam-resistant GPS/INS, an imaging infrared (IIR infrared homing) seeker with automatic scene/target matching recognition, a data-link, and both passive electronic support measures (ESM) and radar warning receiver (ECM) sensors.

AN/ALQ-249=AN/ALQ-249|The Next Generation Jammer (NGJ) pod for airborne electronic warfare systems was designed as a replacement for the AN/ALQ-99 found on the EA-18G Growler and EA-6B Prowler electronic attack aircraft. The NGJ low-band (NGJ-LB) is expected to operate from 0.1–2 GHz (299.79–14.99 cm) and high-band (NGJ-HB) is expected to operate from 6–18 GHz (5.00–1.67 cm) complementing the NGJ-MB which reportedly operates from 2–6 GHz (14.99–5.00 cm).

AN/ALQ-239A DECM=AN/ALQ-239A DECM|BAE Systems AN/ASQ-239 Barracuda is an integrated 360° electronic warfare (EW) suite electronic and infrared countermeasures system with long-range threat warning RWR, self-protection, and ESM support for the F-35. It uses the AN/ALE-70 towed decoy for its self defence jamming system. 

AN/APG-81 OECM=AN/APG-81 OECM|The APG-81 enhances the F-35's multirole mission requirement operating as an electronic warfare (EW) aperture utilizing the AESA's multifunction array (MFA). Using electronic protection (EP), electronic attack (EA) and electronic support measures (ESM), it enables the F-35's capability to suppress and destroy advanced enemy air defenses.

AN/ALQ-164=AN/ALQ-164|The AN/ALQ-164 is a jamming pod manufactured by BAE Systems, originally by Sanders, that combines the AN/ALQ-126 and the AN/ALQ-162 Electronic Countermeasure (ECM) sets. ALQ-164 main application is the AV-8B V/STOL aircraft.

AN/ALQ-126B=AN/ALQ-126B|AN/ALQ-126 is a multimode power managed reprogrammable defensive electronic countermeasures (DECM) system for the F/A-18 Hornet aircraft and its variants. Interfaced with the aircraft's radar warning receiver (RWR), the ALQ-126 is capable of receiving and processing radio frequency (RF) signals in the 2–18 GHz (15.0–1.7 cm) range. Once processed, it selects the most effective countermeasures technique, and transmits that jamming signal at up to 1 kW per channel to disrupt threats. The system has various jamming techniques at its disposal including inverse conical scanning (ICS), range gate pull-off (RGPO), velocity gate pull-off (VGPO), swept square wave (SSW). and main lobe blanking (MLB).


