#---------------------------------------- Laser Designator ---------------------------
MH-60_laser=Laser Designator|Laser designator integrated with the FLIR mount 

AN/AAQ-14=AN/AAQ-14 LANTIRN|It is an American infrared laser targeting pod, the full name of which is Low Altitude Navigation and Targeting Infrared for Night, abbreviated as LANTIRN. It was developed by Martin Marietta and is a system that combines navigation and infrared targeting pods. Fighter aircraft equipped with LANTIRN can perform flight operations at night and in any weather.

#---------------------------------------- Radar ----------------------------------------
APS-124=AN/APS-124|The AN/APS-124 surface search radar is housed in a flat radome under the Sea Hawk’s cockpit, with a low-profile linear-array antenna providing 360-degree coverage. The unique fast-scan antenna and advanced digital scan converter facilitate accurate scan-to-scan integration optimum detection of surface targets, even in heavy weather. Principal features include high transmitenergy and small-surface target detection in high sea states. 

APS-147=AN/APS-147|AN/APS-147 surface search radar is housed in a flat radome under the Sea Hawk’s cockpit, with a low-profile linear-array antenna providing 360-degree coverage. The unique fast-scan antenna and advanced digital scan converter facilitate accurate scan-to-scan integration optimum detection of surface targets, even in heavy weather. Principal features include high transmitenergy and small-surface target detection in high sea states. 

AQS-13F=AQS-13F|The AQS-13F is a helicopter-borne, medium-frequency, active/passive dipping sonar used to locate, identify, and track submarines. 
AQS-22F=AQS-22F|The AQS-22 Airborne Low Frequency Sonar (ALFS) is a helicopter-borne, low-frequency, active/passive dipping sonar used to locate, identify, and track submarines. 

#-------------------------------------- Sonobuoys --------------------------------------
SSQ-53D_Sonar=DIFAR Sonobuoy|The AN/SSQ-53 DIFAR is a passive directional LOFAR sonobouy used for initial detection of submerged submarines.
SSQ-53F_Sonar=DIFAR Sonobuoy|The AN/SSQ-53 DIFAR is a passive directional LOFAR sonobouy used for initial detection of submerged submarines.
SSQ-62C_Sonar=DICASS Sonobouy|The AN/SSQ-62 DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys.
SSQ-62E_Sonar=DICASS Sonobouy|The AN/SSQ-62 DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys.
SSQ-77B_Sonar=VLAD Sonobouy|The SSQ-77B VLAD (Vertical Line Array DIFAR) is an "A"-sized passive search sonobuoy that uses DIFAR (directional frequency and recording) technology.