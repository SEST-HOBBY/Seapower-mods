MH-60_laser=Laser Designator|Laser designator integrated with the FLIR mount 

AN/AAQ-14=AN/AAQ-14 LANTIRN|It is an American infrared laser targeting pod, the full name of which is Low Altitude Navigation and Targeting Infrared for Night, abbreviated as LANTIRN. It was developed by Martin Marietta and is a system that combines navigation and infrared targeting pods. Fighter aircraft equipped with LANTIRN can perform flight operations at night and in any weather.

AN/AAS-38A=AN/AAS-38A|The Lockheed Martin AN/AAS-38 Nite Hawk is a high-resolution FLIR, laser designator, and laser tracker pod system for use with laser-guided munitions. The US Navy used the AAS-38 on the F/A-18C/D Hornet. It was designed to provide the attack aircraft with day/night and adverse weather capabilities. The system can locate and acquire a target, automatically tracking it and feeding precise target data to the aircraft mission computer. It also provides a video display to the pilot of the aircraft.

AN/AAQ-28=AN/AAQ-28|The AN/AAQ-28 Litening Pod is an integrated targeting pod that mounts externally to the aircraft. The pod contains a high-resolution, forward-looking infrared (FLIR) sensor that displays an infrared image of the target to the aircrew; it has a wide field of view search capability and a narrow field of view acquisition/targeting capability of battlefield-sized targets. The pod also contains a CCD camera used to obtain target imagery in the visible portion of the electromagnetic spectrum. An on-gimbal inertial navigation sensor establishes line-of-sight and automatic boresighting capability.

AN/ASQ-228 ATFLIR Laser=AN/ASQ-228 ATFLIR Laser|The AN/ASQ-228 Advanced Targeting Forward-Looking Infrared (ATFLIR) is a multi-sensor, electro-optical targeting pod incorporating thermographic camera, low-light television camera, target laser rangefinder/laser designator, and laser spot tracker 

AN/AAQ-40 EOTS Laser=AN/AAQ-40 EOTS Laser|The F-35's Electro-Optical Targeting System (EOTS)is a high-performance, lightweight, multi-function system that provides precision air-to-air and air-to-surface targeting capability in the IR spectrum. It is the first sensor to combine forward-looking infrared and infrared search and track functionality, and as such EOTS enhances F-35 pilots’ situational awareness and allows aircrews to identify areas of interest, perform reconnaissance and precisely deliver laser and GPS-guided weapons.

MIRLS=MIRLS|The AN/AAQ-28 Litening Pod is an integrated targeting pod that mounts externally to the aircraft. The pod contains a high-resolution, forward-looking infrared (FLIR) sensor that displays an infrared image of the target to the aircrew; it has a wide field of view search capability and a narrow field of view acquisition/targeting capability of battlefield-sized targets. The pod also contains a CCD camera used to obtain target imagery in the visible portion of the electromagnetic spectrum. An on-gimbal inertial navigation sensor establishes line-of-sight and automatic boresighting capability.


#---------------------------------------- Radar ----------------------------------------
APS-124=AN/APS-124|The AN/APS-124 surface search radar is housed in a flat radome under the Sea Hawk’s cockpit, with a low-profile linear-array antenna providing 360-degree coverage. The unique fast-scan antenna and advanced digital scan converter facilitate accurate scan-to-scan integration optimum detection of surface targets, even in heavy weather. Principal features include high transmitenergy and small-surface target detection in high sea states. 

APS-147=AN/APS-147|AN/APS-147 surface search radar is housed in a flat radome under the Sea Hawk’s cockpit, with a low-profile linear-array antenna providing 360-degree coverage. The unique fast-scan antenna and advanced digital scan converter facilitate accurate scan-to-scan integration optimum detection of surface targets, even in heavy weather. Principal features include high transmitenergy and small-surface target detection in high sea states. 

AN/APY-10=AN/APY-10|The AN/APY-10 is an American multifunction radar developed for the U.S. Navy's Boeing P-8 Poseidon maritime patrol and surveillance aircraft. AN/APY-10 is the latest descendant of a radar family originally developed by Texas Instruments, and now Raytheon after it acquired the radar business of TI, for Lockheed P-3 Orion, the predecessor of P-8.

AN/APS-153(V) AIR=AN/APS-153(V) AIR|The U.S. Navy's MH‑60R multi-mission helicopter, AN/APS‑153(V) is the world’s premier maritime surveillance radar. Equipped with integrated Identification Friend or Foe ("IFF"), Automatic Radar Periscope Detection Discrimination ("ARPDD") and long-range/high-resolution imaging (ISAR).

AN/APS-153(V) ISAR=AN/APS-153(V) ISAR|The U.S. Navy's MH‑60R multi-mission helicopter, AN/APS‑153(V) is the world’s premier maritime surveillance radar. Equipped with integrated Identification Friend or Foe ("IFF"), Automatic Radar Periscope Detection Discrimination ("ARPDD") and long-range/high-resolution imaging (ISAR).

AN/APY-9=AN/APY-9|The AN/APY-9 Radar is designed for Airborne Early Warning and Control (AEW&C) operations onboard the E-2D 'Advanced Hawkeye', guiding both surface fleet and airborne assets of the United States Navy. It was designed to detect, track, and identify air and surface targets in blue-water, littoral, and overland environments, and is capable of guiding munitions launched by other ships and aircraft through datalink. The radar system is capable of operating in multiple modes to track different classes of target in a 360° environment using mechanical scanning modes, or providing augmented tracking in 90° sectors by utilizing its AESA capabilities. The system is all-weather, and can utilize its 'Space-Time Adaptive Processing (STAP)' architecture to suppress jamming, clutter or other sources of electromagnetic interference

AN/APG-73=AN/APG-73|The APG-73 is a late 1980s "upgrade of the APG-65 that provides higher throughputs, greater memory capacity, improved reliability, and easier maintenance". When fitted with a motion-sensing subsystem and stretch waveform generator and special test equipment, the APG-73 can generate high resolution ground maps and make use of 'advanced' image correlation algorithms to enhance weapon designation accuracy. Since 1992, the APG-73 has been operational in U.S. Navy and Marine Corps F/A-18C/D Hornet aircraft and early models of the U.S. Navy F/A-18E/F Super Hornet.

AN/APG-79=AN/APG-79|The AN/APG-79 is an active electronically scanned array (AESA) radar developed for the F/A-18E/F Super Hornet and EA-18G Growler aircraft of the United States Navy. AESA technology provides quick updates on multiple targets, and its solid-state antenna construction makes it more reliable and cost-effective than traditional radar systems. The radar has a range of up to 150 km (81 nmi; 93 mi) tracking multiple targets simultaneously.

AN/APG-73(V)=AN/APG-73(V)|An aletrnate designation of the AN/APG-79 which is an active electronically scanned array (AESA) radar developed for the F/A-18E/F Super Hornet and EA-18G Growler aircraft of the United States Navy. AESA technology provides quick updates on multiple targets, and its solid-state antenna construction makes it more reliable and cost-effective than traditional radar systems. The radar has a range of up to 150 km (81 nmi; 93 mi) tracking multiple targets simultaneously.

AN/APG-81=AN/APG-81|The AN/APG-81 AESA radar fitted to the F-35 includes air-to-air modes, plus advanced air-to-ground modes, including synthetic aperture radar high resolution mapping, multiple ground moving target indication and track, combat identification, electronic warfare, and ultra high bandwidth communications.

AN/APG-85=AN/APG-85|The AN/APG-85 AESA radar is an upgrade to the existing AN/APG-81 fitted to the F-35 which improves range of functions. It has air-to-air modes, plus advanced air-to-ground modes, including synthetic aperture radar high resolution mapping, multiple ground moving target indication and track, combat identification, electronic warfare, and ultra high bandwidth communications.

AN/APG-65(V1)=AN/APG-65(V1)|A modified version of the AN/APG-65 designed for AV-8B Harrier II Plus. Has smaller antenna due to the radome sizes, which results in 10% lower performance.

AN/APS-137=AN/APS-137|The APS-137 is used for anti-surface warfare and anti-submarine warfare. It performs long range surface search and target tracking, periscope detection, ship imaging and classification using ISAR. The SAR capability is used for overland surveillance, targeting and ground mapping. The US Navy S-3s are equipped with APS-137s, advanced P-3 Orion marine patrol aircraft are equipped with APS-137(V)5 and the P-8 MMA developed by a Boeing-led team uses the APS-137D(V)5 radar.


#-------------------------------------- Dipping Sonar --------------------------------------
AQS-13F=AQS-13F|The AQS-13F is a helicopter-borne, medium-frequency, active/passive dipping sonar used to locate, identify, and track submarines. 

AQS-22F=AQS-22F|The AQS-22 Airborne Low Frequency Sonar (ALFS) is a helicopter-borne, low-frequency, active/passive dipping sonar used to locate, identify, and track submarines.


