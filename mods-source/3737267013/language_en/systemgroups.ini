#---------------------------------------- ESM ----------------------------------------
ALQ-142=AN/ALQ-142 ESM|The AN/ALQ-142 detects radar signals, identifies their point of origin, and estimates their probable source. The system was designed to provide a high probability of intercept on a single scan even when targets are at long range. It incorporates technologies used in the SLQ-32(V), including four 90° Rotman-lens arrays located fore and aft on the helicopter. 

ALQ-210=AN/ALQ-210 ESM|The multi-mission AN/ALQ-210 Electronic Support Measures (ESM) system provides proven situational awareness and threat warning with Electronics Intelligence (ELINT) quality measurement accuracy in complex and dense electronic battlefield scenarios. 

ALQ-142_RWR=AN/ALQ-142 RWR|The AN/ALQ-142 detects radar signals, identifies their point of origin, and estimates their probable source. The system was designed to provide a high probability of intercept on a single scan even when targets are at long range. It incorporates technologies used in the SLQ-32(V), including four 90° Rotman-lens arrays located fore and aft on the helicopter.

ALQ-210_RWR=AN/ALQ-210 RWR|The multi-mission AN/ALQ-210 Electronic Support Measures (ESM) system provides proven situational awareness and threat warning with Electronics Intelligence (ELINT) quality measurement accuracy in complex and dense electronic battlefield scenarios. 


