[ATLIS]
Kind=LaserDesignator
MaxRange=12.0                       // max distance in nm
NightCapable=True                   // is the designator can be used in low-visibility conditions
TargetChannels=2                    // number of targets that can be tracked at once
WeaponChannels=1000                 // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                           // Field of View of the designator

[ATLIS_Optics]
Kind=Visual
#Infrared
VIDRangeMultiplier=2.8          // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=4.5           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=3.8            // Final VID/Detection range is multiplied by this in case when target observed on surface background

[CER10PR] #Generic Recon Camera
Kind=Visual
VIDRangeMultiplier=2.0           // Target VID range multiplied by this for identification check
MaxRangeMultiplier=2.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.75          // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.35            // the portion of full daylight added to the visibility level where 1 is roughly a mid-day
Recon=True                        // Indicates that this system can photograph stationary land targets and after aircraft carrying this system lands, a bonus against those targets will be applied.

[ ------------------------ TWR / ESM ------------------------- ]

[Type_BF] #Thomson-CSF BF radar warning receiver (RWR)
#rather simple RWR with wide frequency range. source : https://www.archives.gov/files/declassification/iscap/pdf/2014-033-doc01.pdf
Kind=ESM
Type=RWR
Gain=5                              // gain of sensor in dB
HasDataLink=False                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=25.0              // in degrees
Frequencies=S-Band,C-Band,X-Band,Ku-Band 

[Sherloc_RWR] #Thomson-CSF TMV-011 Sherloc
#automatic radar threat warner, had threat library, range and azimuth capabilities. Wide frequency range. https://www.archives.gov/files/declassification/iscap/pdf/2014-033-doc01.pdf
Kind=ESM
Type=RWR
Gain=10                              //gain of sensor in dB
HasDataLink=False                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=12.5              // in degrees
Frequencies=L-Band,S-Band,C-Band,X-Band,Ku-Band                     //Frequencies that current ESM system can detect
ModuleType=SmallSensor

[Sherloc] #Thomson-CSF TMV-011 Sherloc
#automatic radar threat warner, had threat library, range and azimuth capabilities. Wide frequency range. https://www.archives.gov/files/declassification/iscap/pdf/2014-033-doc01.pdf
Kind=ESM
Gain=10                              //gain of sensor in dB
HasDataLink=False                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=12.5              // in degrees
Frequencies=L-Band,S-Band,C-Band,X-Band,Ku-Band                     //Frequencies that current ESM system can detect
OverHorizonMultiplier=0.7           // The multiplier for ESM horizon for over horison (OTH) passive detection capability
IdentificationRate=0.2
ModuleType=SmallSensor

[ ------------------------ ECM ------------------------- ]

[Barracuda] #Barracuda ECM
#Users: Super Etendard, Mirage F1
Kind=ECM
Frequencies=X-Band,Ku-Band   //radar frequency bands the ECM suite can jam
Type=Universal                         // can be Defensive, Offensive, Universal

PeakPower=2.5                         // output peak power in kW, more power increase effectivness of offensive ECM jammers
MaxRange=80.0                         // max range in km
Gain=4.0                               // Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=17.5                   // For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChannels=3                         // number of jamming channels. Defensive or Universal ECM need at least 1 free channel to protect the base platform
JamChance=0.4                         // For Defensive and Universal jammers. Base chance to jam the attacking weapon
CoverRange=20                          // in nmi, If within this range from attacked unit and within weapon seeker cone, jammer will add to combined chance to jam weapon.
ModuleType=SmallSensor

[BarracudaNG] #Barracuda NG ECM
#Users: Super Etendard Modernisé, Mirage F1
Kind=ECM
Frequencies=X-Band,Ku-Band   //radar frequency bands the ECM suite can jam
Type=Universal                         // can be Defensive, Offensive, Universal

PeakPower=3.5                       // output peak power in kW, more power increase effectivness of offensive ECM jammers
MaxRange=120.0                         // max range in km
Gain=6.0                               // Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=25                 // For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChannels=3                         // number of jamming channels. Defensive or Universal ECM need at least 1 free channel to protect the base platform
JamChance=0.6                         // For Defensive and Universal jammers. Base chance to jam the attacking weapon
CoverRange=30                          // in nmi, If within this range from attacked unit and within weapon seeker cone, jammer will add to combined chance to jam weapon.
ModuleType=SmallSensor
