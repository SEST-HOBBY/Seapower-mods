[SystemNames]
Anemone=Anemone|L'Anemone (Appareil Numérisé pour l’Exploitation des Mouvements d’Objectifs Navals Éloignés) fonctionne dans la bande X en mode radar aéroporté multi-mode. Ce radar utilise une méthode de saut de fréquence et possède également la capacité de suivre une cible de manière discontinue. Anemone fournit au système d’armes toutes les données nécessaires pour le tir des missiles air-mer AM39 « Exocet », ainsi que celles requises pour le contrôle de tir air-sol. Il peut aussi être utilisé pour l’autoprotection de l’appareil, puisqu’il gère le contrôle de tir des armes air-air.

Agave=Agave|L'Agave fonctionnait dans la bande X comme radar multi-mode, avec des capacités de navigation et de combat aérien, mais était optimisé pour le guidage des missiles air-mer AM39 « Exocet ». Il était utilisé par le chasseur-bombardier léger Fiat G91. Sur les avions français de type Super Étendard (Dassault-Breguet), il fut remplacé par le radar Anemone en 1990.

Aida=Aida-7|Le radar de nez Aida est un radar de contrôle de tir et de navigation à balayage conique fonctionnant dans la bande X. Il fut l’un des prédécesseurs du radar Cyrano et fut utilisé sur les chasseurs Dassault Mirage F1AZ et Étendard IV M au milieu des années 1950.

CER10PR=Assemblage photographique CER 10PR|Le CER 10PR est une nacelle de reconnaissance ventrale amovible utilisée sur l’Étendard IVP, équipée de caméras OMERA 31 F600 capables de capturer jusqu’à 230 photos aériennes au format moyen avec un champ de vision de 30°. Il permettait des missions de reconnaissance avancée à haute résolution pour la Marine Nationale.

DEFA_553=Canon DEFA 30 mm|Canon automatique DEFA 30 mm|Le canon DEFA (Direction des Études et Fabrications d’Armement) est une famille de canons-révolvers français largement utilisés, tirant des munitions OTAN de calibre 30 mm. Le DEFA 552 équipait l’Étendard IVM tandis que le DEFA 553 équipait le Super Étendard.

Type_BF=Thomson CSF BF RWR|Le Thomson CSF BF est un détecteur de radar (RWR) basique fonctionnant des bandes S à Ku. Il peut discriminer les radars de recherche et de contrôle de tir et fournit uniquement des informations élémentaires au pilote, ainsi qu’une alarme sonore en cas de détection de menace. Il fut installé sur de nombreux avions construits en France et fut remplacé par la suite par le Sherloc RwR plus avancé.

Sherloc_RWR=Thomson-CSF TMV-011 Sherloc|Le Sherloc est un détecteur de radar (RWR) développé par Thomson CSF dans les années 1980. Il était considéré comme avancé pour son époque, doté d’un traitement numérique du signal, d’une bibliothèque de menaces et de la capacité à localiser les émetteurs tout en offrant au pilote une représentation de l’environnement électromagnétique. Associé au pod ECM Barracuda et aux distributeurs de leurres Alkan, il faisait partie d’un ensemble de guerre électronique intégré équipant le Super Étendard Modernisé à partir du Standard 4.

Sherloc=Thomson-CSF TMV-011 Sherloc|Le Sherloc est un détecteur de radar (RWR) développé par Thomson CSF dans les années 1980. Il était considéré comme avancé pour son époque, doté d’un traitement numérique du signal, d’une bibliothèque de menaces et de la capacité à localiser les émetteurs tout en offrant au pilote une représentation de l’environnement électromagnétique. Associé au pod ECM Barracuda et aux distributeurs de leurres Alkan, il faisait partie d’un ensemble de guerre électronique intégré équipant le Super Étendard Modernisé à partir du Standard 4.

Barracuda=Pod DECM Thomson-CSF Barracuda|Cette nacelle de guerre électronique fut introduise dans les forces françaises à la fin des années 1980 et monté sur les Super Étendard et Super Étendard Modernisé. Il s’agit d’une évolution du pod Remora DECM qui avait été acquis par l’Irak auprès de la France pendant la guerre Iran-Irak. En service irakien, le Remora démontra son efficacité pour contrer les radars des F-4 Phantom iraniens et les autodirecteurs de missiles semi-actifs tels que l’AIM-7 Sparrow.

BarracudaNG=Pod DECM Thomson-CSF Barracuda NG|Cette nacelle de guerre électronique est la dernière variante du pod Barracuda DECM. Il fut introduit à la fin des années 1990 et équipa le Super Étendard Modernisé après la mise à niveau du Standard 4.
