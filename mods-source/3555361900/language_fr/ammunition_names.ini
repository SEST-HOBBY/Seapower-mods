rn_2inch=2-Inch RP,RP-2,FFAR,The 2-Inch Rocket was a replacement for the SNEB in royal navy service for concerns that radars onboard ships would set off the SNEB rockets.
fr_r550-2=R.550-2,Magic-2,AAM, Le R.550 Magic 2 est un missile air-air à guidage infrarouge français conçu par Matra (désormais MBDA). C'est une mise à jour de l'ancien missile R.550. Il entra en service en 1985 et fut utilisé de manière conséquente dans les années 1990 et 2000 avant d'être remplacé par le MICA-IR et l'ASRAAM.
