[AmmunitionNames]

fr_as30=AS-30,AS-30,Attaque au sol,L'AS-30 était un missile air-sol filoguidé développé par Aérospatiale. Entré en service en 1960, il était doté d'une ogive semi-perforante de 240 kg à haut pouvoir explosif, conçue pour détruire les navires et les fortifications lourdes. Son guidage s'effectuait à vue, à l'aide d'une petite manette, depuis l'avion tireur.
fr_as-30l=AS-30L,AS-30L,Attaque au sol,L'AS-30L est un missile air-sol français de haute précision, à guidage laser semi-actif. Développé par Aérospatiale (aujourd'hui MBDA) comme une version améliorée du missile AS-30, il remplace le guidage par radiocommande (MCLOS) par un système de ciblage laser moderne. Adopté en 1988, il reste en service grâce à sa grande précision (jusqu'à 1 m CEP) et sa polyvalence.

