[AmmunitionNames]

fr_as30=AS-30,,AGM,The AS-30 was a wire-guided air-to-ground missile developed by Aérospatiale. Entering service in 1960, it featured a 240kg semi-armor piercing high-explosive warhead designed to destroy ships and heavy fortifications. It had to be guided by sight with a small joystick from the firing aircraft.
fr_as-30l=AS-30L,,AGM,AS-30L is a French high-precision air-to-ground semi-active laser-guided air-launched missile. Developed by Aérospatiale (now MBDA) as an upgrade of the AS-30 missile, replacing the radio command guidance (MCLOS) with modern laser targeting. Adopted in 1988 and remains in service due to its high accuracy (up to 1 m CEP) and versatility.

