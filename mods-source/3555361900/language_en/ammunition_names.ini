rn_2inch=2-Inch RP,RP-2,FFAR,The 2-Inch Rocket was a replacement for the SNEB in royal navy service for concerns that radars onboard ships would set off the SNEB rockets.
fr_r550-2=R.550-2,Magic-2,AAM, R.550 Magic 2 is a French short-range, heat-seeking, air-to-air guided missile developed by Matra (now MBDA) as an upgrade to the original R.550 Magic. It entered service in 1985 and was widely used in the 1980s and 2000s before being replaced by MICA-IR and ASRAAM.

