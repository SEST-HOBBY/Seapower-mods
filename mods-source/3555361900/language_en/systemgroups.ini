[SystemNames]
Anemone=Anemone|Anemone (Appareil Numérisé pour l’Exploitation des Mouvements d’Objectifs Navals Éloignés), is operating in the X band multi-mode airborne radar. The radar uses a frequency hopping method and also has the ability to track a target discontinuously. Anemone provides the weapon system with all the data required for firing air-to-sea AM39 “Exocet” missiles, and the data needed for air-to-ground fire control. It can also be used for aircraft self-protection, as it can handle the fire control of air-to-air weapons.
Agave=Agave|Agave was operating in X band multi-mode radar, with navigation and air combat capabilities, but optimized for guiding the air-to-sea AM39 “Exocet” missiles. It was used by the light fighter-bomber Fiat G91. In the French aircraft of the type Super Étendard (by Dassault-Breguet, it was replaced by the Anemone radar in 1990.
Aida=Aida-7|The Aida nose radar is a conical scan fire control and navigation radar operating in X band. It was one of the predecessors of the Cyrano radar and was used in the Dassault Mirage F1AZ and Étendard IV M fighters in the mid-1950s.
CER10PR=CER 10PR photographic assembly|The CER 10PR is a removable under-fuselage reconnaissance pod used on the Étendard IVP, equipped with OMERA 31 F600 cameras capable of capturing up to 230 medium-format aerial photos with a 30° field of view. It enabled high-resolution, forward reconnaissance missions for the French Navy.
DEFA_553=30mm DEFA|DEFA 30mm Autocannon|The DEFA cannon (Direction des Études et Fabrications d'Armement) is a family of widely used French-made aircraft revolver cannon firing 30 mm caliber NATO standard rounds. The DEFA 552 equipped the Etendard IVM while the DEFA 553 equipped the Super Etendard.
Type_BF=Thomson CSF BF RWR|The Thomson CSF BF is a basic Radar Warning Receiver working from S to Ku radar bands. It is able to discriminate between search and fire control radars and gives only basic informations to the pilot as well as an audio alarm if a threat is detected. It was fitted to a range of french built aircrafts and was replaced in subsequent years by the more advanced Sherloc RwR.
Sherloc_RWR=Thomson-CSF TMV-011 Sherloc|The Sherloc is a RWR developed by Thomson CSF in the 1980s. By all accounts it was considred advanced for its time, with digital signal processing, threat library and abiliy to locate emitters as well as giving the pilot a picture of the electromagnetic environnement. Along with Barracuda ECM pod and Alkan decoy dispensers, it was part of an integrated electronic warfare suite fitted to the Super Etendard Modernisé from the aircraft's standard 4.
Sherloc=Thomson-CSF TMV-011 Sherloc|The Sherloc is a RWR developed by Thomson CSF in the 1980s. By all accounts it was considered advanced for its time, with digital signal processing, threat library and abiliy to locate emitters as well as giving the pilot a picture of the electromagnetic environnement. Along with Barracuda ECM pod and Alkan decoy dispensers, it was part of an integrated electronic warfare suite fitted to the Super Etendard Modernisé from the aircraft's standard 4.
Barracuda=Thomson-CSF Barracuda DECM pod|This DECM pod was introduced in french service in the late 1980s and fitted to Super Etendard and Super Etendard Modernisé. It is a development of the Remora DECM pod that was procured from France by Iraq during the Iran-Iraq war. In Iraqi service, Remora demonstrated it's effectiveness into countering Iran's F4 Phantoms radars and semi-active missile seekers such as AIM-7 Sparrow. 
BarracudaNG=Thomson-CSF Barracuda NG DECM pod|This DECM pod is the lastest variant of the Barracuda DECM pod. It was introduced in the late 1990s and equipped Super Etenard Modernisé after standard 4 update. 
