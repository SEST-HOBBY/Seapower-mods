[AmmunitionNames]

# ===================== 空对地导弹 =====================
fr_as30=AS-30,,空对地导弹,AS-30激光制导导弹（重520公斤）配备240公斤半穿甲战斗部，射程11公里，速度1.7马赫。采用MCLOS指令制导（1985年升级为激光制导），可穿透2米钢筋混凝土，曾装备法国超级军旗战机参与1991年沙漠风暴行动。

# ===================== 电子对抗系统 =====================
fr_barracuda_ecmpod=梭鱼电子对抗吊舱,,电子战吊舱,法国泰雷兹研发的先进自卫系统，覆盖D-K波段（1-40GHz），采用数字射频存储（DRFM）技术，可同时干扰8个目标。响应延迟<0.5秒，集成于阵风M舰载机翼尖挂架。

fr_phimat_chaffpod=菲玛特箔条投放器,,干扰弹系统,法国达索标配箔条发射系统，可发射RR-170型镀铝玻璃纤维箔条（有效反射面积≥1,000㎡），散开时间<0.3秒，专用于对抗8-20GHz雷达制导导弹。

fr_alkan_chaffpod=阿尔坎干扰弹系统,,双模对抗系统,土耳其Aselsan研制的模块化系统：前舱装30枚箔条弹（雷达干扰），后舱装20枚红外弹（热诱饵），支持编程投放序列对抗复合制导威胁。

# ===================== 航空火箭弹 =====================
rn_2inch=RP-2,航空火箭,火箭弹,RP-2是英国皇家海军专用折叠翼火箭（弹径51mm/长1.83m），替换SNEB火箭解决电磁兼容问题。采用钝感炸药（IMX-104）与电磁安全引信，配用弹种：MK24反潜深弹（射程2km）/MK17燃烧弹（覆盖200㎡）。

