Anemone=Anemone|Anemone（Appareil Numérisé pour l’Exploitation des Mouvements d’Objectifs Navals Éloignés）是一部工作在 X 波段的多模机载雷达，采用频率捷变技术，具备非连续目标跟踪能力。它为武器系统提供发射 AM39“飞鱼”空对舰导弹所需的全部数据，也可用于空对地火力控制与机载自卫空战火力控制。  

Agave=Agave|Agave 是一部 X 波段多模雷达，兼具导航与空战功能，但专门针对 AM39“飞鱼”反舰导弹的制导进行优化。曾被轻型战斗轰炸机菲亚特 G91 使用；在法国达索-布雷盖的“超级军旗”上，该雷达于 1990 年被 Anemone 取代。  

Aida=Aida|Aida 机头雷达是一部 X 波段圆锥扫描火控与导航雷达，是 Cyrano 雷达的先驱之一，1950 年代中期装备达索“幻影”F1AZ 与“军旗”IV M 战斗机。  

CER10PR=CER 10PR 照相吊舱|CER 10PR 是用于“军旗”IVP 的可拆卸机腹侦察吊舱，内置 OMERA 31 F600 相机，一次可拍摄 230 张中等格式航空照片，视场 30°，为法国海军提供高分辨率前向侦察能力。



