[ ------------------------ Visual/Infared ------------------------- ]

[3rd_Gen_FLIR] #generic 3rd gen FLIR
Kind=Visual
#Infrared
#3nd Gen Infrared
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=3.0           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=3.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=1             // Final VID/Detection range is multiplied by this in case when target observed on surface background

[------------------------- Radar ---------------------------]

[---Air/Air&Surface---]

[KLC-500]
#Users: KJ-500
Kind=Radar
Type=Search                            // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True                       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface                     // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True 			   // True means the radar can see ground objects
Mode=Illuminate                        // Can be "Illuminate", "RadioCommand"
TargetChannels=200                       // if applicable number of targets it can track simultaneously
WeaponChannels=60                       // if applicable number of weapons (missiles) it can guide simultaneously
RotationDirection=1                    // -1 means left, 1 means right
MinRange=0.1                           // min range in km
MaxRange=770                         // max range in km
MinAltitude=0                          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=300000                      // max altitude in meters, relevant for air, unused for surface
RangeResolution=30.0                   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.0                          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=55.0                              // gain in dB on the sensor
Frequency=S-Band                     // frequency band
PeakPower=1200.0                       // output peak power in kW

