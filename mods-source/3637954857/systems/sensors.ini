[---------------------------------------- ECM ----------------------------------------]


[RKZ-500_ECM]
#2010s Era
Kind=ECM
Frequencies=All //radar frequency bands the ECM suite can jam
Type=Defensive      // Can be Defensive, Offensive, Universal
JamChance=0.3       // For Defensive and Universal jammers. Base chance to jam the attacking weapon

[RKZ-1000_ECM]
#Users: Y-9LG
Kind=ECM
Frequencies=All                         //radar frequency bands the ECM suite can jam
Type=Offensive                         // can be Defensive, Offensive, Universal
JamChannels=4                          // number of jamming channels. Defensive or Universal ECM need at least 1 free channel to protect the base platform
PeakPower=20.0                         // output peak power in kW, more power increase effectivness of offensive ECM jammers
MaxRange=500.0                         // max range in km
Gain=6.0                               // Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=30.0                   // For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChance=0.7                          // For Defensive and Universal jammers. Base chance to jam the attacking weapon
CoverRange=30                          // in nmi, If within this range from attacked unit and within weapon seeker cone, jammer will add to combined chance to jam weapon.

