
[plaaf_kj-500]
Type=预警机
Default=空警-500,空警-500
DefaultDescription=空警500是中国自主研制的新一代中型预警指挥机。它以运-9运输机为平台，搭载世界领先的数字阵列有源相控阵雷达，具备强大的远程探测和多功能指挥能力。该机可同时跟踪、识别上百个空中及海上目标，并引导多批次战斗机协同作战，大幅提升了中国空军的体系化作战效能。空警500以其出色的信息化水平和空中指挥枢纽作用，成为中国空中力量战略转型的关键装备。
Squadron1=空警-500（中国空军）,空警-500
Squadron2=空警-500（中国海军航空兵）,空警-500
Callsigns=Squadron1,天眼|Squadron2,哪吒

[plaaf_y-9jz]
Type=侦察机
Default=运-9JZ,运-9JZ
DefaultDescription=运-9JZ是中国人民解放军海军航空兵列装的一款专用电子情报侦察机，以运-9中型运输机为平台改装而成。其机载电子侦察系统可对广泛频段的雷达、通信等电磁信号进行截获、识别、定位和分析，具备强大的远海态势感知与信息对抗支援能力。该机显著提升了海军在复杂电磁环境下的情报保障水平，是维护国家海洋权益、遂行远海作战任务的重要空中信息节点。
Squadron1=运-9JZ（中国海军）,运-9JZ
Callsigns=Squadron1,海鸥

[plaaf_y-9dz]
Type=侦察机
Default=运-9DZ,运-9DZ
DefaultDescription=运-9DZ是中国人民解放军空军装备的一型专用电子侦察机，基于成熟可靠的运-9中型运输机平台研制。该机最显著的外部特征是集成了大型共形阵天线、合成孔径雷达和光电吊舱等先进传感器系统。其核心是高性能的电子侦察与对地观测系统，能够对广泛频段的电磁信号进行远程截收与分析，并对地面目标实施高分辨率侦察。其主要使命是为空军提供全天候、全时段的情报支援，在战略侦察、战场监控、电子对抗与目标指示中发挥关键作用，是人民空军构建信息化作战体系、提升远程态势感知与精确打击能力的重要装备。
Squadron1=运-9DZ,运-9DZ
Callsigns=Squadron1,凤凰

[plaaf_y-9lg]
Type=电战机
Default=运-9LG,运-9LG
DefaultDescription=运-9LG是中国人民解放军空军装备的一型专用电子战和雷达干扰机，基于运-9中型运输机平台研制。该机采用类似空警-200预警机的平衡木天线，但将有源相控阵天线用于大功率电子干扰设备，同时装备大型共形阵电子支援天线，能对敌方地面和空中雷达信号进行侦测、分析和强力压制，有效干扰多种频段的防空与预警雷达。该机具备航程远、续航时间长、干扰功率强等特点，可伴随作战机群执行任务，在突防中开辟电磁安全通道，显著提升空中编队的生存能力和作战效能，是中国空军体系化电子战力量的重要组成部分。
Squadron1=运-9LG,运-9LG
Callsigns=Squadron1,雷电

[plan_y-8fq]
Type=海上巡逻机
Default=运-8FQ,运-8FQ
DefaultDescription=运-8反潜巡逻机是中国在运-8运输机基础上研制的大型固定翼岸基反潜巡逻机，也是中国海军航空兵列装的第一型岸基反潜巡逻机，于2011年首飞。该机配备先进的对海搜索雷达、磁异探测仪、声呐浮标及电子侦察系统，具备长时间、大范围的空中巡逻能力。可挂载反潜鱼雷、深水炸弹等武器，能够执行海上巡逻监视、潜艇探测与攻击、海上搜救及电子侦察等多重任务。作为中国海军航空反潜体系的重要一环，运-8反潜巡逻机有效延伸了海上反潜作战半径，显著提升了远海反潜与海域控制能力。
Squadron1=运-8FQ,运-8FQ
Callsigns=Squadron1,鱼叉

[plan_y-9fq]
Type=海上巡逻机
Default=运-9FQ,运-9FQ
DefaultDescription=
运-9反潜巡逻机是中国在运-8FQ基础上研制的第二代岸基大型反潜巡逻机，2020年前后首飞。该机配备先进的对海搜索雷达、磁异探测仪、声呐浮标及电子侦察系统，具备长时间、大范围的空中巡逻能力。可挂载反潜鱼雷、深水炸弹等武器，能够执行海上巡逻监视、潜艇探测与攻击、海上搜救及电子侦察等多重任务。在运-8FQ的基础上，该机升级航电设备，改善飞行品质，增大航程，装备有源相控阵多功能搜索雷达和新一代声呐浮标。
Squadron1=运-9FQ,运-9FQ
Callsigns=Squadron1,海雕











