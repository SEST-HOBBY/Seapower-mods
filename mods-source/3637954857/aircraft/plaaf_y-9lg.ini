MaxClimbRate=15.0                     //Meters per second
EmptyMass=58000.0                       // in kg
MaxFuel=17000.0                         // in kg

PerEngineMaxThrust=3800000              //Newtons
EngineCount=4

Ceiling=30000.0                       // ceiling in feet
CruiseAltitude=25000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
