[plaaf_y-9jz]
Type=Recon
Default=Y-9JZ,Y-9JZ
DefaultDescription=The Y-9JZ is a dedicated electronic intelligence reconnaissance (ELINT) aircraft operated by the Aviation Force of the People's Liberation Army Navy, modified from the Y-9 medium transport aircraft. Its onboard electronic reconnaissance system is capable of intercepting, identifying, locating, and analyzing electromagnetic signals across a wide frequency spectrum, including radar and communications. It possesses robust long-range maritime situational awareness and electronic warfare support capabilities. This aircraft significantly enhances the navy's intelligence support level in complex electromagnetic environments and serves as a crucial airborne information node for safeguarding national maritime rights and interests and executing far-sea combat missions.
Squadron1=Y-9JZ (PLANAF),Y-9JZ
Callsigns=Squadron1,Sea Gull

[plaaf_y-9dz]
Type=Recon
Default=Y-9DZ,Y-9DZ
DefaultDescription=The Y-9DZ is a dedicated electronic reconnaissance aircraft operated by the People's Liberation Army Air Force, developed based on the Y-9 medium transport platform. The most distinctive external features of this aircraft are the integration of advanced sensor systems, including large conformal array antennas, synthetic aperture radar, and electro-optical pods. At its core is a high-performance electronic reconnaissance and ground surveillance system, capable of long-range interception and analysis of electromagnetic signals across a wide frequency spectrum, as well as conducting high-resolution reconnaissance of ground targets. Its primary mission is to provide all-weather, around-the-clock intelligence support for the air force, playing a crucial role in strategic reconnaissance, battlefield surveillance, electronic warfare, and target designation. It is a key asset in the People's Air Force's efforts to build an informationized combat system and enhance long-range situational awareness and precision strike capabilities.
Squadron1=Y-9DZ,Y-9DZ
Callsigns=Squadron1,Phonenix

[plaaf_y-9lg]
Type=EW plane
Default=Y-9LG,Y-9LG
DefaultDescription=The Y-9LG is a dedicated electronic warfare and radar jamming aircraft of the PLAAF. The aircraft features a "balance beam" antenna, integrated with active phased array for high-power electronic jamming equipment. It is capable of detecting, analyzing, and suppressing enemy ground and airborne radar signals, effectively jamming air defense and early warning radars across multiple frequency bands. With characteristics such as long range, extended endurance, and strong jamming capabilities, the Y-9LG can accompany combat formations on offensive missions, carve out electromagnetic safe corridors during penetration operations.
Squadron1=Y-9LG,Y-9LG
Callsigns=Squadron1,Thunderer

[plan_y-8fq]
Type=ASW Plane,Maritime Patrol
Default=Y-8FQ,Y-8FQ
DefaultDescription=The Y-8FQ is a four-engine, fixed-wing, shore-based anti-submarine patrol platform. It is also the first shore-based MPA aircraft commissioned by the Naval Aviation Force of the People's Liberation Army Navy, with its maiden flight conducted in 2011. Equipped with advanced maritime search radar, magnetic anomaly detector, sonobuoys and electronic reconnaissance systems, the aircraft boasts long-endurance and wide-area aerial patrol capabilities. It can carry ASW torpedoes, depth charges and other ordnance, enabling it to perform multiple missions such as maritime patrol and surveillance, submarine detection and attack, maritime search and rescue, and electronic reconnaissance. As a critical component of the PLAN's aviation ASW framework, the Y-8FQ effectively extends the operational radius of maritime ASW operations and significantly enhances the capability of blue-water anti-submarine warfare and maritime domain control.
Squadron1=Y-8FQ,Y-8FQ
Callsigns=Squadron1,Harpoon

[plan_y-9fq]
Type=ASW Plane,Maritime Patrol
Default=Y-9FQ,Y-9FQ
DefaultDescription=The Y-9FQ is the second-generation large shore-based ASW patrol platform developed by China on the basis of the Y-8FQ. It conducted its maiden flight around 2020. Equipped with advanced maritime search radar, magnetic anomaly detector, sonobuoys and electronic reconnaissance systems, the aircraft boasts long-endurance and wide-area aerial patrol capabilities. It can carry ASW torpedoes, depth charges and other ordnance, enabling it to perform multiple missions such as maritime patrol and surveillance, submarine detection and attack, maritime search and rescue, and electronic reconnaissance.Building on the Y-8FQ, the Y-9FQ has upgraded its avionics suite, improved flight performance, extended its operational range, and is outfitted with an AESA multi-function search radar as well as a new generation of sonobuoys.
Squadron1=Y-9FQ,Y-9FQ
Callsigns=Squadron1,Bald Eagle

