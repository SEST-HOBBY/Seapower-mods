[jmsdf_ddh_hyuga]
Type=DDH,Destroyer
Default=Hyūga-class,Hyūga
DefaultDescription=The Hyūga class comprises two Japan Maritime Self-Defense Force helicopter destroyers: Hyūga (DDH-181), commissioned in 2009, and Ise (DDH-182), commissioned in 2011. Their full-length flight decks, internal hangars and two aircraft elevators support helicopter operations, anti-submarine warfare, command duties and disaster relief.\n\nThis mod represents both ships under one Hyūga-class unit type. Its equipment fit includes 16 VLS cells carrying 16 ESSM in four quad-packed cells and 12 VL-ASROC in twelve single cells, two Phalanx CIWS mounts, two triple 324 mm torpedo launchers, FCS-3 and OPS-20 radars, OQQ-21 sonar, and SH-60J/SH-60K helicopters. Both variants share the same gameplay fit. Sensor performance follows the Euromod Asahi baseline and does not represent verified real-world detection ranges. The displayed 13,950-tonne displacement is the published standard displacement.
Variant1=Hyūga DDH-181,Hyūga
Variant2=Ise DDH-182,Ise
