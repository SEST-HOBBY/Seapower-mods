# Hyuga / Ise local radar profiles. Borrowed gameplay values, NOT verified real performance.
# FCS3 and main OPS20C: Euromod Asahi eu_OPY-1 / eu_OPS-20. Auxiliary: stock Nav_Radar behavior with Asahi OPS-20 min/max ranges.

[hyuga_FCS3_Search]
Kind=Radar
Type=DirectedSearch    // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface     // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=300     // if applicable number of targets it can track simultaneously
WeaponChannels=0       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=0                  // revolutions per minute
MinRange=0.5           // min range in km
MaxRange=347.0         // max range in km; 0.75x SPY-1A basegame 463 km
MinAltitude=10         // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30000      // max altitude in meters, relevant for air, unused for surface
RangeResolution=0.3    // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.8          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=45                // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=2000.0       // output peak power in kW
ModuleType=BigSensor
CanDetectPeriscope=False


[hyuga_OPS20C_Main]
Kind=Radar
Type=Search            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface           // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=50      // if applicable number of targets it can track simultaneously
WeaponChannels=0       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=19                 // revolutions per minute
MinRange=0.3           // min range in km
MaxRange=46.3          // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=500.0      // max altitude in meters, relevant for air, unused for surface
RangeResolution=150.0  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.5          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=45.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=280.0        // output peak power in kW
UseSignature=SurfaceSearchRadar
ModuleType=SmallSensor
CanDetectPeriscope=True


[hyuga_OPS20C_Aux]  #Need setup
Kind=Radar
Type=Search            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface           // TODO Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=1       // if applicable number of targets it can track simultaneously
WeaponChannels=1       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=20                 // revolutions per minute
MinRange=0.3 // km; Asahi OPS-20 range baseline
MaxRange=46.3 // km; Asahi OPS-20 range baseline
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=0          // max altitude in meters, relevant for air, unused for surface
RangeResolution=130.0  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.1          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=40                // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=10           // output peak power in kW
UseSignature=SurfaceSearchRadar
ModuleType=SmallSensor


# Hyuga OQQ-21 gameplay proxy: unchanged Euromod Asahi OQQ-24 parameters, not verified real-world specifications.
[hyuga_OQQ21_Hull]
# taken from AN/SQS-53C
Kind=Sonar
HasDataLink=True                        // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=2.0                   // TODO in degrees
RangeResolution=60.0                    // TODO defines the minimum range where two targets behind can be recognized as two; in meters
ActiveRange=60                          // in km
PassiveRange=70                         // in Km
ActiveGain=40                           // in db, gain of the active sensor
Gain=46                                 // in db, gain of the sensor
OutputPower=230                         // Active sensor output power in dB, unused for passive ones
Type=Hull                               // Hull: hull mounted sonar, Towed: towed passive sonar, VDS: variable depth active sonar, Dipping: dipping sonar
SonarFrequency=LF
MaxConvergenceZones=1
SignalProcessing=7
NarrowBandCapable=True                  // resolves propeller/machinery tonals
ModuleType=SonarSensor

