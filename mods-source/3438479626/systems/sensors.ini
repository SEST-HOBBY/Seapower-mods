[Sky_Watch]
#Source: Mars-Passat ("Sky Watch") passive phased array, air and surface target detection complex of the Project 1143.4/1143.5 carriers; no performance figures published, the numeric envelope is unchanged (ru.wikipedia, Baku and Kuznetsov articles)
Kind=Radar
Type=DirectedSearch    // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface     // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=12      // if applicable number of targets it can track simultaneously
WeaponChannels=24      // if applicable number of weapons (missiles) it can guide simultaneously
RPM=0                  // revolutions per minute
MinRange=0.5           // min range in km
MaxRange=444.0         // max range in km
MinAltitude=10         // min altitude in meters, relevant for air, unused for surface
MaxAltitude=60960      // max altitude in meters, relevant for air, unused for surface
RangeResolution=93.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.7          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
SubClutterVisibility=50   // clutter rejection against sea return in dB, 0 means no MTI
Gain=42.0              // gain in dB on the sensor
Frequency=S-Band       // frequency band
PeakPower=6000.0       // output peak power in kW
ModuleType=BigSensor
FCSolutionGainRate=2.0
FCMinSolution=1
FCTracksRounds=True

[N001VE_Early]
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
