Gain=48.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=10.0        // output peak power in kW

[oeps-27k]
Kind=Visual
UseIRValues=True
VIDRangeMultiplier=1             // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=1.7          // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.5           // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.9

