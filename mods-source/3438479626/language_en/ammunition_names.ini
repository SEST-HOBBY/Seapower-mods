[AmmunitionNames]
su_aa-10a=R-27R,,AAM,The R-27R is a semi-active radar-guided medium-range AAM missile developed by the Soviet Union. The R-27 pioneered the use of a very special inverted trapezoidal wing, which effectively enhanced the maneuverability of the missile.

su_aa-10c_navy=R-27EM,,AAM,The R-27EM is a Soviet semi-active radar-guided medium-range AAM missile, the Navy's improved version of the R-27ER, which is equipped with a more advanced seeker, further improving the missile's long-range strike capability.

su_aa-11=R-73,,AAM,The R-73 is an infrared AAM missile developed by the Soviet Union in the 1970s and 1980s. The R-73 pioneered the use of a vector engine, giving the missile far greater maneuverability than its contemporary missiles. It is considered one of the most threatening AAM missiles.
# ------------------ SAM ------------------

su_sa-n-11=SA-N-11,Grison,SAM,The 2K22 Tunguska (Russian: 2К22 "Тунгуска") is a Soviet tracked self-propelled anti-aircraft gun armed with a surface-to-air gun and missile system. It is designed to provide day and night protection for infantry and tank regiments against low-flying aircraft, helicopters, and cruise missiles in all weather conditions. The NATO reporting name for the missile used by the weapon system is SA-19 "Grison"
# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------

su_ss-n-22_air=P-270,Sunburn,ASM,The SS-N-22 Sunburn (P-270 Moskit) is a Soviet surface launched supersonic standoff anti-ship weapon. It flies a LO-LO profile with a supersonic sea-skimming terminal phase, during which the missile performs evasive snaking manuevers to increase survivability against air defences.

