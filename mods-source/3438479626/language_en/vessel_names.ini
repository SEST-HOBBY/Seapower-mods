Type=TAVKR,Aircraft Carrier
Default=1143.5 Kuznetsov,1143.5
DefaultDescription=The Object 1143.5 aircraft carrier was built by the Nikolayev Shipyard, with the participation of experts from about 800 disciplines in the Soviet Union, and more than 7,000 factories provided materials and equipment. It was a masterpiece of Soviet scientific and technological development at the time. The 1143.5 aircraft carrier is the world's largest ski-jump take-off and conventionally powered aircraft carrier, with both an angled deck and a ski-jump take-off deck; it is not equipped with a catapult, but can take off and land heavy fixed-wing fighters. The birth of this class of ships made the ski-jump take-off and arrested landing, a novel aircraft carrier take-off and landing method, appear in the world's navy for the first time. In addition, the ship is also equipped with supersonic anti-ship missiles and a series of anti-aircraft artillery, with many unique and distinctive designs.
