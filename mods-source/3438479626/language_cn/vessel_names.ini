[ru_cv_kuznetsov]
Type=TAVKR,航空母舰
Default=1143.5型库兹涅佐夫,1143.5型
DefaultDescription=1143.5型航空母舰由尼古拉耶夫造船厂建造，吸收了苏联约800个学科的专家参加，有7000多家工厂提供了材料和设备，是集当时苏联科技发展大成之作。1143.5型航空母舰是世界上最大的滑跃式起飞和常规动力航母，同时拥有斜角甲板和滑跃起飞甲板；没有装备弹射器，却可以起降重型固定翼战斗机。本级舰的诞生使世界海军中首次出现了滑跃起飞、拦阻降落这一新颖的航母起降方式。此外，舰上还装有超音速反舰导弹及一系列防空弹炮，具备很多别树一帜颇具特色的设计。
Variant1=库兹涅佐夫(1991),TAVKR-113库兹涅佐夫
Variant2=库兹涅佐夫(2016),TAVKR-063库兹涅佐夫

