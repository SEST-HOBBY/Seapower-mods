#!extend language_en/aircraft_names.ini
[sov_be12]
Type=Maritime Patrol,MPA
Default=Be-12,Be-12
DefaultDescription=Beriev Be-12 Chayka (NATO: Mail), Soviet twin-turboprop amphibian for anti-submarine patrol, accepted into service in 1965. Gull wing with two AI-20D engines, boat hull with a retractable tailwheel undercarriage, twin fins and a magnetometer boom. Initsiativa-2B search radar in the nose, sonobuoys, and a bomb bay behind the hull step for AT-1 torpedoes or depth bombs, plus four underwing pylons. Crew of four.
Squadron1=Be-12 Soviet Naval Aviation,Be-12
Squadron2=Be-12 Vietnam People's Air Force 933rd Regiment,Be-12

[sov_be12n]
Type=Maritime Patrol,MPA
Default=Be-12N,Be-12N
DefaultDescription=Beriev Be-12N, the Be-12 refitted with the Nartsiss-12 search and attack system from the early 1970s: Initsiativa-2BN radar, APM-73S magnetometer and RGB-NM-1 sonobuoys; 27 aircraft were converted. Same airframe and bomb bay as the Be-12, here with the heavier AT-2 torpedo as the standard weapon.
Squadron1=Be-12N Soviet Naval Aviation,Be-12N
