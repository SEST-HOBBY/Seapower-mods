Name=Soviet Naval Aviation - Beriev Be-12 Chayka (Mail)
Description=Be-12 and Be-12N, the Soviet twin-turboprop anti-submarine amphibian. Gull wing with two AI-20D engines, boat hull, folding tailwheel undercarriage, bomb bay with two hatches and four underwing pylons. Search radar, magnetometer, sonobuoys, AT-1 / AT-2 torpedoes and PLAB-100 depth bombs from the base game, in nine loadouts. Soviet Union, Be-12 from 1965 and Be-12N from 1972; Vietnamese Be-12 (green camouflage) from 1981. Version 1.1.
