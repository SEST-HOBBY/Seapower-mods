# Beriev Be-12 Chayka (NATO: Mail), Soviet Naval Aviation, in service from 1965. Model built from scratch from drawings and reference pictures (see CREDITS.txt). Version 1.0, 17 Nov 2026.
# Unity axes: +Z forward, +Y up, +X right; 68 m per game unit. Origin 3.0 m above the keel, 12.3 m aft of the radome tip.
# Structure follows the stock wp_il-38 (turboprop patrol aircraft with bomb bay, MAD and sonobuoys).
