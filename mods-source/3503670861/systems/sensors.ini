################################################# U S A #################################################

[AN/APY-8]
Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=False      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface               // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True  // True means the radar can see ground objects
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=10       // if applicable number of targets it can track simultaneously
WeaponChannels=8       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-60,60|-60,60      // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=0.87     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0.6           // min range in km
MaxRange=83.3           // max range in km
MinAltitude=9          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=30.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.1          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=53.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=10.0         // output peak power in kW

[AN/AAS-52] 
Kind=LaserDesignator
MaxRange=15.0                       // max distance in nm
NightCapable=True                   // is the designator can be used in low-visibility conditions
TargetChannels=2                    // number of targets that can be tracked at once
WeaponChannels=1000                 // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                           // Field of View of the designator

[---------------------------------------- Laser Designator ---------------------------]

[ ------------------------ Visual/Infared ------------------------- ]
[AN/AAS-52_Visual]
Kind=Visual
#Infrared
VIDRangeMultiplier=12.5           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=7.5           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.8             // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

