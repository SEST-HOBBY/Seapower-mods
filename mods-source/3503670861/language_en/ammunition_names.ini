# ------------------ AAM ------------------
uav_aim-9x=AIM-9X,Sidewinder,AAM,The AIM-9X Sidewinder is an American infrared-guided air-to-air missile. The X-model has been significantly upgraded, with strong anti-jam capabilities, a longer range, and an impressive backwards firing capability.

uav_aim-92=AIM-92,Stinger,AAM,The FIM-92 Stinger MANPADS is a small portable air defense missile that uses infrared-guided heat tracking and ultraviolet object tracking. It was developed by the United States and used by all U.S. military forces. It has been in service since 1981. In the United States and 29 other countries, it is mainly manufactured by Raytheon, and authorized to produce missiles by EADS in Germany and ROKETSAN in Turkey. More than 70,000 missiles have been produced.

