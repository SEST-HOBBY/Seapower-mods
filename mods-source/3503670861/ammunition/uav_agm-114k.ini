#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# AGM114
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly
Mass=45.7                                // in kg. Used for aircraft
AmmoPoints=55                          // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=2  // at what range in nm this unit can be visually identified
IRSignature=Tiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=2
Power=18
ImpactSize=Small                      // Impact size, can be small, medium, large, verylarge
Penetration=always	               // can be minor, moderate, heavy, always

FuzeProximityDistance=0.2              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[WarheadData]
WarheadType=2
Power=18
ImpactSize=Small                      // Impact size, can be small, medium, large, verylarge
Penetration=always	               // can be minor, moderate, heavy, always

FuzeProximityDistance=0.2              // for proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze
[Guidance]
GuidanceType=5
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=2           // time in seconds where the missile moves straight on without guiding
DropDuration=0.0                       // time in seconds where the missile just falls unpropelled
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=35.0                      // Climb angle for initial loft
MaxLoftAlt=3000                    // Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=2              // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalDiveDistance=1.2                 // in N. miles.
IgnoreHeightDifferenceForTargetDist=True
SupportsBanking=False                  // if the missile will bank when turning
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // 如果我们使用完整的运动学规则。如果这是真的，我们将只使用运动学
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=608.4                     // Maximum speed in knots
MaxTurnRate=4.0                       // Maximum turnrate in degrees per second
AccelerationTime=3                  // 初始助推器燃烧的燃烧时间
Acceleration=12.85                      // 初始燃烧阶段的加速度Gs
SustainerAccelerationTime=35            // 持续燃烧时间。若无持续燃烧，则记为-1
SustainerAcceleration=0.825               // 持续燃烧加速。若无持续燃烧，则值为-1
TypicalTargetAlt=0					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0				// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=-1               // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.8                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=180               // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
WobblingStrength=5                   // amplitude of wobbling. Marks that missile performs some wobbling flight
WobblingSpeed=2                      // frequency of wobbling
#========================================= Launch stats ============================================================
MinLaunchRange=0.45                    // Minimum launch range in nautical miles
#MaxLaunchRange=2                       // Maximum launch range in nautical miles
MaxLaunchRange=4.32                     // Maximum launch range in nautical miles
MinLaunchAltitude=0                   // Minimum launch altitude in feet.
MaxLaunchAltitude=12000                 // Maximum launch altitude in feet.
LaunchReliability=95                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=0.0                        // Seeker gain in dB
SeekerFOV=90.0                         // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerActiveRange=0.0
SeekerPassiveRange=10.0                // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#ECCM
AntiCountermeasuresBonus=0.050          // This value substracted from probability of spoofing by countermeasures (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usa_bgm-71a
AssetBundleDamagedMesh=
AssetBundleMaterial=ships/materials/modular_parts
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/weapon/ammunition/agm-114/
ResourcesRoot=agm-114k.obj
ResourcesMesh=agm-114
ResourcesMaterialFolder=assets/models/weapon/ammunition/agm-114/textures/
ResourcesMaterial=agm-114k_mat.ini
############################################################
NumberOfSubModels=1

SubModel1=Glas

[Glas]
Mesh=Glas
ResourcesMaterialFolder=aircraft/materials/
Material=cockpit_glass

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/missile_sustainer_small_effect
BoosterEffectPosition=0,0,-0.008

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.008
InFlightEffectStartTime=2.0  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.008 
SustainerEffectStartTime=2.0

HitDefaultExplosionClass=MediumMissileExplosions
HitShipExplosionClass=MediumShipHitExplosion
HitAirExplosionClass=MediumMissileExplosions

HitWaterSplashClass=LargeWaterSplashes
HitGroundExplosionClass=MediumGroundHitExplosions

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.0015,0.0015,0.012
