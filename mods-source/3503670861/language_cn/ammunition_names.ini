[AmmunitionNames]
# ------------------ AAM ------------------
uav_aim-9x=AIM-9X,响尾蛇,空对空,AIM-9X响尾蛇是美国的红外制导空对空导弹，X型进行了大幅度的升级，拥有强大的抗干扰能力更远的射程，以及令人印象深刻的越肩发射能力。

uav_aim-92=AIM-92,毒刺,空对空,FIM-92毒刺便携式防空导弹，为小型便携式防空导弹，采用红外线制导热追踪以及紫外线物体追踪，由美国研发并使用于所有美军部队，1981年服役至今。在美国和其他29个国家中。主要由雷神公司制造，授权德国的EADS和土耳其的ROKETSAN生产导弹，已经生产超过70,000枚导弹。

