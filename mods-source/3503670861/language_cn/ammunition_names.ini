uav_agm-114k=AGM-114K,地狱火,空对地,AGM-114地狱火导弹是一种多平台、多目标的美国制导弹。主要用于反战车，但后期型号也被用于无人机攻击，精确打击高价值目标等。

uav_gbu-12d=GBU-12D,宝石路 II,对地攻击,美国于1970年代对宝石路I系统进行了改进，新的系统拥有可展开的尾翼，使得滑翔距离更远，且更加精准，并且价格更加低廉。改进后的宝石路系统被称为宝石路II。

uav_gbu-49=GBU-49,宝石路 IV,对地攻击,宝石路IV由旧式的GBU-12宝石路II升级而来，拥有了卫星制导与激光制导双制导模式，使其更为可靠。
