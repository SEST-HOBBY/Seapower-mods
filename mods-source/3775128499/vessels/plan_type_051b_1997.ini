[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.3
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.15

Length=153.5                    // in meters
Beam=16.5                       // in meters

CompartmentsHeight=0.11       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=6600              // in tons

MaxForwardVelocity=33.0        // sets the max forward velocity
MaxBackwardVelocity=8.0        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=1.15
MinAccelerationFactor=0.2

#These values yield a turning circle of 300m for Knox class as per sources´
RudderTurnRate=3.5             // turn rate of the rudder in degrees per second
RudderForce=0.6                // multiplicator defining how agile the ship can turn

TiltFactor=1.0                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=-1                 // default trim depth in feets
TrimAngle=0.5                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=5		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line
[SensorData]
#Visual
VisualIdentificationRange=13.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Large
# Radar related (RCS => radar cross section)
RCS=Large
# Sonar related
BaseNoise=150                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessels propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset
MachineryRaftingGeneration=1


[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_plan_type_051b_1997
[---------- AI related ----------]
[AI]
UnitCostValue=3200            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score
