[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.8
MinCameraDistanceBroadside=0.9
CameraPivotHeight=0.25

Length=180                    // in meters
Beam=20                      // in meters

CompartmentsHeight=0.11       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_12x50,bridge_eo_20-50_morden_stab
DefaultView=binocular_7x50

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=11000             // in tons

MaxForwardVelocity=35.0        // sets the max forward velocity
MaxBackwardVelocity=10.0        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=1.30
MinAccelerationFactor=0.15

#Kara: Turning circle 5.8 shiplengths (1100 yards) with max roll of 10°
RudderTurnRate=3.5             // turn rate of the rudder in degrees per second
RudderForce=0.6                // multiplicator defining how agile the ship can turn
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration
TiltFactor=1.0                 // defines how strong the tilting will be

TrimDepth=-0.5                 // default trim depth in feet
TrimAngle=0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.062599           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=5		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.470                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=23.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=15.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiLarge
# Radar related (RCS => radar cross section)
RCS=SemiLarge
# Sonar related
BaseNoise=138                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessels propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
Prairie=True					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset
MachineryRaftingGeneration=4
PropellerType=Skewback

