[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.3
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.18

Length=112                     // in meters
Beam=12.4                      // in meters

CompartmentsHeight=0.05       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None
[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=2400              // in tons

MaxForwardVelocity=28.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.90                // this is for velocity damping (linear drag)
MaxAccelerationFactor=1.00
MinAccelerationFactor=0.15

#Krivak: Turning circle 7.5 shiplengths (869 yards) with max roll of 10°
RudderTurnRate=3.5             // turn rate of the rudder in degrees per second
RudderForce=0.7                // multiplicator defining how agile the ship can turn

TiltFactor=1.0                // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.03,0          // center of mass for physics
CavitationSpeed=5		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=8.0   // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium
# Sonar related
BaseNoise=138                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
Prairie=True					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset
MachineryRaftingGeneration=4
PropellerType=Skewback

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations__type_056a
[---------- AI related ----------]
[AI]
UnitCostValue=3000            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=1
ASuW_Capability=4
ASW_Capability=1

#Defence
MissilesToSaturate=1      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD    //Anti-Missile Defence
ATD_Capability=TBD      //Anti-Torpedo Defence

#Special
Role=AAW,ASW,ASuW

[ControlSystem]
Collider=coll_cic
ModuleType=CIC

[MainPowerSystem]
Type=Diesel
HorsePower=32300
Collider=coll_engineroom

