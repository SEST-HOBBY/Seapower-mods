[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=0.9
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.05

Length=74.9                    // in meters
Beam=8.6                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

[OpticalView]
Views=standard_morden_periscope
DefaultView=standard_morden_periscope

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=3600              // in tons

MaxForwardVelocity=22.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=13
MaxBackwardVelocity=5.0        // sets the max backward velocity
MaxBackwardVelocitySurfaced=3.0
TelegraphVelocities=-5,0,3,5,10,14,17 // Overrides default telegraph values

BowUnderWater=12.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=30.5            // depth in feet, from where the sail is under water
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.52
MinAccelerationFactor=0.12

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.75                // multiplicator defining how agile the ship can turn

MaxPitchAngle=30.0
PitchChangeRate=2.0
MaxRollAngle=10.0
RollChangeRate=2.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=-3                   // default trim depth in feet
TrimAngle=-1.8                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=35.0            // in feet
CrushDepth=1300.0              // in feet
CavitationParameters=20		   // defines the speed in knots at 100m depth that the submarine will cavitate at

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=105                   // base sound level in db at 1m distance
FlowNoise=0.85                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5              // additional noise for cavitation in db
TargetReflectionStrength=10     // in dB for broad side
BladesCount=7                   //number of blades on vessel's propulsion systems
ElectricFrequency=50            //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
MachineryRaftingGeneration=5
PropellerType=Skewback

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_plan_ss_type_039

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=6
Silent_Capability=6

#Defence
#Special
Role=SS

############################################################
# Control System (CIC)
############################################################
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=2000
AdditionalNoise=18        //Added to current noise level when running on this power
Collider=coll_engineroom

#-----------------v  Mockup v -----------------
[SnorkelMastSystem]
MaxForwardVelocity=9
Collider=coll_snorkel_mast
Mount=Snorkel
OpenSystemAnimation=RaiseSnorkel
CloseSystemAnimation=LowerSnorkel
ModuleType=Inert

[AuxPowerSystem]
Type=Electric
HorsePower=5500
UseBattery=BatterySystem
Collider=coll_engineroom

[BatterySystem]
Capacity=20500      //Range 20.5 miles at top underwater speed (20 knots)
DischargeRate=1.75  //Rate of discharging batteries. Lower values provide more range on low underwater speed on batteries
RechargeRate=1.2    //Capacity per second when charging batteries. When a unit goes at Standard telegraph setting or slower, the charge rate doubles
Collider=coll_battery_1,coll_battery_2

#Rudder Systems
[RudderSystems]
NumberOfRudderSystems=1

[RudderSystem1]
Mount=Rudder
#Collider=coll_rudder_sys

