[General]
#USN Mark 54 depth bomb - https://www.bulletpicker.com/bomb_-300-lb-depth_-an-mk-54.html
Type=AirDepthCharge                    // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=115                              // in kg. Used for aircraft
AmmoPoints=140                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard                    // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=1            // Biggest range in nm at which this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
#Explosive:42kg
WarheadType=0
Power=20
ImpactSize=Medium               // Impact size, can be small, medium, large, verylarge
Penetration=Always              // can be minor, moderate, heavy, always

FuzeProximityDistance=10        // for proximity fuze: distance to target in meter
SmartFuse=True                  // Explodes not immediately but when when target start to go away
[---------- Guidance ----------]
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=7
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
SinkRate=20                            // sink rate in m/s (for depth charges)
MaxDepth=1640                          // max depth in feet (for depth charges)
TerminalApproachDist=0.01              // in N. miles. At this distance seeker will be turned on.
#========================================= Launch stats ============================================================
MinLaunchRange=0.01                    // Minimum launch range in nautical miles
MaxLaunchRange=10.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=200                  // Minimum launch altitude in feet.
MaxLaunchAltitude=3000                 // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=20                 // Circular error radius in meters
#Homing
SeekerFOV=60.0                         // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerActiveRange=1                    // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
#SeekerPassiveRange=1                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Wake Homing (1, 2, 4, 6, 8 and 9)
SeekerGain=11.0                        // Seeker gain in dB
SeekerOutputPower=220                  // Active seeker output power in dB, unused for passive ones
#ECCM
AntiCountermeasuresBonus=0.3          // This value substracted from probability of spoofing by countermeasures (0...1)
#ECCM
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/models/ammunition/ksb-2/
ResourcesRoot=ksb-2.obj
ResourcesMesh=ksb-2
ResourcesMaterial=ksb-2_mat.ini
ResourcesMeshForLaunch=ksb-2
ResourcesMeshSwitchTime=0.4 // time in seconds after launch to switch from launch mesh to main mesh
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
InFlightEffect=None
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0

HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=UnderwaterExplosions
HitDefaultExplosionClass=UnderwaterExplosions
HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=MediumGroundHitExplosions

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637
