#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# TASM
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
Mass=2500                              // in kg. Used for aircraft
AmmoPoints=8000                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

CIWSDefenceBonus=12                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.16                     // Less chance to be intercepted by SAM because of anti-interception maneuvers
#low RCS low altitude

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=4  // at what range in nm this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=0.65
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=90
ImpactSize=Large                      // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=3
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=5.0         // time in seconds where the missile moves straight on without guiding
PerformsSlightBallisticInitialFlight=True  // flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
TerrainFollowFlight=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=30.0                      // Climb angle for initial loft
MaxLoftAlt=20000.0                      // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
SeaSkimmingAlt=492                   // height in feet for sea skimming TODO:make terrain following
SeaSkimmingMaxDescentAngle=40.0        // Dive angle whlie going to sea skimming
SeaSkimmingNoseUp=1.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
SeaSkimmingStartDistToTarget=100      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
FinalFlightPhaseAlt=22.0             // in feet. altitude of pop-up
FinalFlightPhaseMaxAngle=40.0
FinalFlightPhaseDistToTarget=40.0       // in N. miles. Recommended to set this distance equal to the seeker range
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=21.0               // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalVelocity=2511                  // Maximum speed in knots when missile is locked on target
TerminalAlt=16.4                         // in feet. Weapon will try to get to this altitude at the start of terminal approach
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=1156.7                      // Maximum speed in knots
Acceleration=20.0                       // Acceleration factor
MaxTurnRate=30.0                       // Maximum turnrate in degrees per second
MinLaunchRange=8.0                    // Minimum launch range in nautical miles
MaxLaunchRange=270.0                   // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=40.0                        // Seeker gain in dB
SeekerFOV=60,10                        // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SecondaryPassiveRadarGuidanceType=Full // Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
SeekerActiveRange=22.0                 // Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
SeekerPassiveRange=22                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
PassiveRadarGuidanceFrequencies=All    // Frequences Anti-Radiation, HomeOnJam and secondary Passive Radar Guidance weapons can detect
Frequency=Ku-Band                      // Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=35                           // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.4           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.5                    // This value substracted from probability of being jammed  (0...1)

#SelfDestruct
SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=5.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################

############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/
ResourcesRoot=yj12_ammo.obj
ResourcesMesh=yj12_ammo
ResourcesMaterial=yj12_mat.ini
ResourcesMeshForLaunch=yj12_ammo
ResourcesMeshCanister=yj12_ammo
ResourcesMeshSwitchTime=0.5  // time in seconds after launch to switch from launch mesh to main mesh
############################################################

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/usn_rgm-109_booster
BoosterEffectPosition=0,0,0.0025

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.072
InFlightEffectStartTime=3  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.03
SustainerEffectStartTime=3

HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=LargeMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
DebrisTrailClass=MissileDebrisFire
DebrisSplashClass=MediumWaterSplashes

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.008,0.007,0.08