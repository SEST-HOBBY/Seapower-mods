LJG-316=H/LJG-316 FCR|H/LJG-316（虚构代号）是中国基于俄罗斯MR-90火控雷达改进而来的舰空导弹火控雷达，是红旗-16舰空导弹系统的制导雷达，单台雷达可同时引导2发导弹攻击1个目标。

LJG-316A=H/LJG-316A FCR|H/LJG-316A（虚构代号）是红旗-16舰空导弹系统使用的新一代X波段有源相控阵（AESA）火控雷达，装备后期型054A导弹护卫舰，单个阵面可同时引导6发导弹攻击3个目标。

