LJQ-366=H/LJQ-366 radar|H/LJQ-366雷达是一种水面搜索雷达，衍生自90年代自俄罗斯引进的'矿石-ME'雷达。该雷达具备主动和被动工作模式，能够在5个不同的波段工作，在利用大气波导效应时具备一定的超视距探测能力。在054A型护卫舰上该雷达主要用于为鹰击-83反舰导弹提供目标参数，并通过双向数据链与其他作战单位共享。

LJQ-366_Passive_ESM=ESM for Type366 radar|H/LJQ-366雷达是一种水面搜索雷达，衍生自90年代自俄罗斯引进的'矿石-ME'雷达。该雷达具备主动和被动工作模式，能够在5个不同的波段工作，在利用大气波导效应时具备一定的超视距探测能力。在052C型驱逐舰上该雷达主要用于为鹰击-62反舰导弹提供目标参数，并通过双向数据链与其他作战单位共享。

