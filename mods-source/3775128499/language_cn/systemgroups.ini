RJZ-751_ESM=H/RJZ-751 ESM|H/RJZ-751舰载有源电子战系统是人民海军装备的第二代舰载电子战系统，装备054A型导弹护卫舰，包括电子支援设备（ESM），雷达告警设备（RWR），主被动有源电子干扰设备（ECM）和无源电子干扰发射器。系统能够根据作战指挥系统传递的威胁目标信息全自动分配干扰频段和干扰类型，有效干扰来袭目标的传感器设备。

