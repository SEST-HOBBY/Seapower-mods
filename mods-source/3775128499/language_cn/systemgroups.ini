LJQ-381A=H/LJQ-381A|H/LJQ-381A雷达是中国自主研制的三坐标远程对空搜索雷达，在中国第一型对空三坐标雷达LJQ-381雷达基础上改进而来。

LJQ-382=H/LJQ-382 radar|H/LJQ-382雷达是中国在俄罗斯MR-750MA雷达基础上改进的三坐标对空搜索雷达，是中国海军护卫舰和大型水面舰艇的主要对空搜索警戒雷达。雷达采用相控阵天线和机械扫描相结合的运作方式，探测和跟踪能力满足区域防空需求，能够有效抑制海杂波及电子干扰，并能快速为舰载防空系统提供精确目标指示。

LJQ-362=H/LJQ-362 radar|H/LJQ-362雷达是一种2D超低空搜索/水面搜索雷达，工作在X波段。该雷达是人民海军第一款超低空快速反应雷达，原名347S搜索雷达，与PJ-76A双联37毫米自动舰炮的火控雷达347G雷达一同组成347低空快速反应雷达系统。该雷达可有效探测超低空突防目标和掠海反舰巡航导弹，并为近防武器系统提供火控参数，但作用距离较短。

LJQ-364=H/LJQ-364 radar|H/LJQ-364雷达是一种2D双波段超低空搜索/水面搜索雷达，工作在X波段（超低空搜索）和I波段（水面搜索）。该雷达广泛装备于人民海军的中大型水面舰艇，在054A型护卫舰上主要用于填补H/LJQ-382雷达在近距离探测超低空掠海目标时产生的盲区。该雷达也可为近防武器系统提供目标参数。

LJQ-360=H/LJQ-360 radar|H/LJQ-360雷达是中国制造的一种2D对空/对面多用途搜索雷达，是上世纪80年代中国引进法国汤姆森-TSF TSR 3004 "海虎"雷达后进行国产化的版本。该雷达主要装备于上世纪90年代和00年代人民海军导弹驱逐舰，负责中近距离对空和对面搜索，并为海红旗-7/海响尾蛇舰空导弹系统提供目标指引

LJQ-361A=H/LJQ-361A|H/LJQ-361A雷达是一种2D对海/对空搜索雷达，主要装备056A型护卫舰等小型水面舰艇。

LJQ-517A=H/LJQ-517A|H/LJQ-517A雷达是一种2D远程对空搜索雷达，工作在VHF波段，主要承担中高空远程警戒任务，可接入作战指挥系统，具有干扰分析自适应频率捷变能力。

LJQ-518=H/LJQ-518|H/LJQ-518雷达是一种2D远程对空警戒雷达，工作在L波段。由于LJQ-381三坐标远程对空警戒雷达性能差强人意，海军选择利用现有的陆基远程警戒雷达改进为舰载雷达装备052型导弹驱逐舰，LJQ-518雷达应运而生。相较于当时人民海军装备的米波对空警戒雷达，该雷达探测在保证探测距离的同时提升了探测精度，可通过舰载作战指挥系统和数据链传递空情信息，但该雷达由于天线尺寸较大，作用距离也仅能勉强满足需求，仅作为过渡方案装备了两艘052型导弹驱逐舰。

LJQ-517B=H/LJQ-517B|H/LJQ-517B雷达是一种双坐标远程对空搜索雷达，工作在VHF波段，主要承担中高空远程警戒任务，可接入作战指挥系统，具有干扰分析自适应频率捷变能力。052C驱逐舰的517B雷达主要用于在346雷达主阵面低功率运行时提供远程空中目标的预警信息

LJQ-520=H/LJQ-520|H/LJQ-520雷达是一种三坐标远程对空搜索雷达，工作在VHF波段，主要承担中高空远程警戒任务。相较于传统米波雷达，该雷达采用超分辨率技术，拥有较高的探测精度。

LJG-346=H/LJG-346|H/LJG-346'海之星'雷达是中国海军装备的第一种大型双波段主动有源相控阵（AESA）雷达，工作在S波段（搜索/跟踪）和C波段（制导）。052C型驱逐舰上共安装有4个雷达阵面，由静压通风冷却，单个雷达阵面由中央的S波段阵面和上下两侧的长条形C波段阵面组成，单个S波段阵面T/R组件数量超过5000个，最大搜索距离约450公里。配合H/ZKJ-5数字化自动指挥控制系统，雷达能够同时跟踪上百个空中目标，自动识别和判断威胁等级并给出攻击指令，引导海红旗-9B舰空导弹攻击威胁等级最高的目标。

LJQ-368=H/LJQ-368|H/LJQ-368雷达是有源相控阵体制的超低空搜索/水面搜索雷达，装备人民海军大中型水面舰艇，有效提升了针对超低空掠海目标的发现距离，缩短了舰载防空系统传感器反应时间。

LJQ-36X=H/LJQ-36X radar|H/LJQ-36X雷达是一种采用AESA体制的新型双波段超低空搜索/水面搜索雷达，工作在X波段（超低空搜索）和I波段（水面搜索）。主要用于填补H/LJG-346A雷达在近距离探测超低空掠海目标时产生的盲区，安装于综合射频桅杆内，该雷达也可为近防武器系统提供目标参数。

LJG-346A=H/LJG-346A|H/LJG-346'海之星'雷达是中国海军装备的第一种大型双波段主动有源相控阵（AESA）雷达，工作在S波段（搜索/跟踪）和C波段（制导）。H/LJG-346A型雷达是提升探测能力，加强散热性能的改进型。系统共有4个雷达阵面，由液冷管路冷却，单个雷达阵面由中央的S波段阵面和上下两侧的长条形C波段阵面组成，单个S波段阵面T/R组件数量超过5000个，最大搜索距离大于500公里。配合新一代数字化自动指挥控制系统，雷达能够同时跟踪上百个空中目标，自动识别和判断威胁等级并给出攻击指令，引导海红旗-9系列舰空导弹攻击威胁等级最高的目标。

