[General]
DefaultSquadronShortName=N/A

[plan_ka-28]
Type=反潜直升机
Default=卡-28,卡-28
DefaultDescription=卡-28舰载反潜直升机是苏联卡-27PL直升机的出口版本，中国海军在上世纪90年代初将卡-28作为“现代”级导弹驱逐舰的舰载机一同引进，至今仍在服役。除四艘引俄“现代”级驱逐舰外，该机还曾部署于052B，052C型导弹驱逐舰和054型导弹护卫舰。中国海军装备的卡-28直升机依然装备俄制原装搜索雷达，吊放声呐，声呐浮标和轻型反潜鱼雷，没有经过升级改造。在1990年代和2000年代初期曾一度因其具备搜潜和攻潜一体的能力成为人民海军的主力舰载反潜直升机，但随着直-9C和直-9F加入作战序列，以及机载设备老化，性能逐渐落后，如今仅承担海上搜索和救援任务。
Squadron1=卡-28,卡-28
Callsigns=Squadron1,海螺

[plan_ka-31]
Type=海上警戒直升机
Default=卡-31,卡-31
DefaultDescription=‌卡-31直升机是俄罗斯海军装备的海上警戒直升机。该机在卡-29基础上改进而成，由卡莫夫设计局联合股份公司研制，装备俄罗斯库兹涅佐夫号航母。除用作航母舰载机外，该机也可搭载在巡洋舰、驱逐舰、护卫舰上，或作为岸基预警机使用。中国海军于2010年代早期引进卡-31直升机，主要搭载在052C型导弹驱逐舰和引俄现代级导弹驱逐舰上，为反舰巡航导弹承担超视距搜索和引导任务，也承担舰队低空警戒任务。
Squadron1=卡-31,卡-31
Callsigns=Squadron1,海螺

[plan_z-9c]
Type=反潜直升机
Default=直-9C,直-9C
DefaultDescription=直-9C直升机是上世纪80年代参照引进自法国的"黑豹"直升机（AS.565）设计，并采用国产机载设备研制的一款舰载轻型反潜直升机。该机是人民海军装备的第二代舰载通用反潜直升机，装备水面搜索雷达和机载吊放声呐。由于机体尺寸和最大起飞重量限制，该机没有装备声呐浮标。同样由于重量限制，该机不能同时携带吊放声呐和反潜鱼雷，搜潜和攻潜作业必须由2架直升机分别挂载吊放声呐和反潜鱼雷合作完成。
Squadron1=直-9C,直-9C
Callsigns=Squadron1,蜻蜓

[plan_z-9d]
Type=通用直升机
Default=直-9D,直-9D
DefaultDescription=直-9D是中国海军航空兵部队装备的轻型多用途舰载直升机，可承担侦查，反舰，运输和搜救任务。直-9D是直-9直升机的反舰加强改型，主要承担水面搜索，反舰打击和舰载反舰导弹中继制导任务。
Squadron1=直-9D,直-9D
Squadron2=直-9D 航校,直-9D
Squadron3=直-9D 救援,直-9D
Callsigns=Squadron1,蜻蜓|Squadron2,蜻蜓|Squadron3,蜻蜓

[plan_z-9f]
Type=反潜直升机
Default=直-9F,直-9F
DefaultDescription=直-9F是中国海军航空兵部队装备的轻型多用途舰载直升机，可承担反潜，反舰，运输和搜救任务。直-9F是由直-9D发展而来的轻型反潜直升机，装备有源相控阵水面搜索雷达。在换装发动机，使用轻量化机体设计后，直-9F解决了上一代舰载反潜直升机直-9C的限制，能够同时携带吊放声呐和轻型反潜鱼雷，实现了搜潜和攻潜作业一体，无需双机协同。但是由于直-9最大起飞重量限制，仅能携带1枚反潜鱼雷。
Squadron1=直-9F,直-9F
Callsigns=Squadron1,蜻蜓

[plan_z-20f]
Type=反潜直升机
Default=直-20F,直-20F
DefaultDescription=‌直-20F是中国基于直-20通用直升机平台改进，自主研发的新一代‌10吨级舰载反潜直升机，即将成为人民海军第四代通用舰载反潜直升机。相较于4吨级的直-9直升机，直-20F具备航程远，滞空时间长，挂载能力强的特点。该机装备对海搜索雷达，综合光电观测设备，吊放声呐和25发声呐浮标，同时可挂载反潜鱼雷，自导深弹和轻型反舰导弹，在具备极强的通用性的同时极大地扩展了水面舰艇编队区域反潜的范围。
Squadron1=直-20F,直-20F
Callsigns=Squadron1,海雕

[plan_z-9f_(2020)]
Type=反潜直升机
Default=直-9F(2025),直-9F
DefaultDescription=直-9F是中国海军航空兵部队装备的轻型多用途舰载直升机，可承担反潜，反舰，运输和搜救任务。直-9F是由直-9D发展而来的轻型反潜直升机，装备有源相控阵水面搜索雷达。在换装发动机，使用轻量化机体设计后，直-9F解决了上一代舰载反潜直升机直-9C的限制，能够同时携带吊放声呐和轻型反潜鱼雷，实现了搜潜和攻潜作业一体，无需双机协同。但是由于直-9最大起飞重量限制，仅能携带1枚反潜鱼雷。
Squadron1=直-9F,直-9F
Callsigns=Squadron1,蜻蜓

[plaaf_kj-500]
Type=预警机
Default=空警-500,空警-500
DefaultDescription=空警500是中国自主研制的新一代中型预警指挥机。它以运-9运输机为平台，搭载世界领先的数字阵列有源相控阵雷达，具备强大的远程探测和多功能指挥能力。该机可同时跟踪、识别上百个空中及海上目标，并引导多批次战斗机协同作战，大幅提升了中国空军的体系化作战效能。空警500以其出色的信息化水平和空中指挥枢纽作用，成为中国空中力量战略转型的关键装备。
Squadron1=空警-500（中国空军）,空警-500
Squadron2=空警-500（中国海军航空兵）,空警-500
Callsigns=Squadron1,天眼|Squadron2,哪吒

[plaaf_y-9jz]
Type=侦察机
Default=运-9JZ,运-9JZ
DefaultDescription=运-9JZ是中国人民解放军海军航空兵列装的一款专用电子情报侦察机，以运-9中型运输机为平台改装而成。其机载电子侦察系统可对广泛频段的雷达、通信等电磁信号进行截获、识别、定位和分析，具备强大的远海态势感知与信息对抗支援能力。该机显著提升了海军在复杂电磁环境下的情报保障水平，是维护国家海洋权益、遂行远海作战任务的重要空中信息节点。
Squadron1=运-9JZ（中国海军）,运-9JZ
Callsigns=Squadron1,海鸥

[plaaf_y-9dz]
Type=侦察机
Default=运-9DZ,运-9DZ
DefaultDescription=运-9DZ是中国人民解放军空军装备的一型专用电子侦察机，基于成熟可靠的运-9中型运输机平台研制。该机最显著的外部特征是集成了大型共形阵天线、合成孔径雷达和光电吊舱等先进传感器系统。其核心是高性能的电子侦察与对地观测系统，能够对广泛频段的电磁信号进行远程截收与分析，并对地面目标实施高分辨率侦察。其主要使命是为空军提供全天候、全时段的情报支援，在战略侦察、战场监控、电子对抗与目标指示中发挥关键作用，是人民空军构建信息化作战体系、提升远程态势感知与精确打击能力的重要装备。
Squadron1=运-9DZ,运-9DZ
Callsigns=Squadron1,凤凰

[plaaf_y-9lg]
Type=电战机
Default=运-9LG,运-9LG
DefaultDescription=运-9LG是中国人民解放军空军装备的一型专用电子战和雷达干扰机，基于运-9中型运输机平台研制。该机采用类似空警-200预警机的平衡木天线，但将有源相控阵天线用于大功率电子干扰设备，同时装备大型共形阵电子支援天线，能对敌方地面和空中雷达信号进行侦测、分析和强力压制，有效干扰多种频段的防空与预警雷达。该机具备航程远、续航时间长、干扰功率强等特点，可伴随作战机群执行任务，在突防中开辟电磁安全通道，显著提升空中编队的生存能力和作战效能，是中国空军体系化电子战力量的重要组成部分。
Squadron1=运-9LG,运-9LG
Callsigns=Squadron1,雷电

[plan_y-8fq]
Type=海上巡逻机
Default=运-8FQ,运-8FQ
DefaultDescription=运-8反潜巡逻机是中国在运-8运输机基础上研制的大型固定翼岸基反潜巡逻机，也是中国海军航空兵列装的第一型岸基反潜巡逻机，于2011年首飞。该机配备先进的对海搜索雷达、磁异探测仪、声呐浮标及电子侦察系统，具备长时间、大范围的空中巡逻能力。可挂载反潜鱼雷、深水炸弹等武器，能够执行海上巡逻监视、潜艇探测与攻击、海上搜救及电子侦察等多重任务。作为中国海军航空反潜体系的重要一环，运-8反潜巡逻机有效延伸了海上反潜作战半径，显著提升了远海反潜与海域控制能力。
Squadron1=运-8FQ,运-8FQ
Callsigns=Squadron1,鱼叉

[plan_y-9fq]
Type=海上巡逻机
Default=运-9FQ,运-9FQ
DefaultDescription=
运-9反潜巡逻机是中国在运-8FQ基础上研制的第二代岸基大型反潜巡逻机，2020年前后首飞。该机配备先进的对海搜索雷达、磁异探测仪、声呐浮标及电子侦察系统，具备长时间、大范围的空中巡逻能力。可挂载反潜鱼雷、深水炸弹等武器，能够执行海上巡逻监视、潜艇探测与攻击、海上搜救及电子侦察等多重任务。在运-8FQ的基础上，该机升级航电设备，改善飞行品质，增大航程，装备有源相控阵多功能搜索雷达和新一代声呐浮标。
Squadron1=运-9FQ,运-9FQ
Callsigns=Squadron1,海雕

[plan_z-8j]
Type=搜救直升机
Default=直-8J,直-8J
DefaultDescription=直-8J型直升机是以法国SA321直升机（“超黄蜂”）为基础, 由中国直升机设计研究所与昌河飞机工业公司共同仿制改进的13吨级多用途直升机，直-8J是中国海军航空兵装备的舰载运输改型，具备可折叠旋翼和尾梁，主要用于垂直补给和人员运输作业。
Squadron1=直-8J,直-8J
Callsigns=Squadron1,鹈鹕

[plan_z-18fa]
Type=反潜直升机
Default=直-18FA,直-18FA
DefaultDescription=直-18是中国在直-8基础上研制的大型多用途舰载直升机。该机采用三台国产涡轴发动机，升级航电系统并采用复合材料旋翼。直-18FA是其反潜改型，主要部署于航空母舰、两栖攻击舰等大型水面舰艇，配备水面搜索雷达，先进吊放声呐系统和声呐浮标。
Squadron1=直-18FA,直-18FA
Callsigns=Squadron1,猎鹰

[plan_z-18y]
Type=搜救直升机
Default=直-18Y,直-18Y
DefaultDescription=直-18是中国在直-8基础上研制的大型多用途舰载直升机。该机采用三台国产涡轴发动机，升级航电系统并采用复合材料旋翼。直-18Y是其舰载人员运输改型。
Squadron1=直-18Y,直-18Y
Callsigns=Squadron1,鹈鹕

[plan_z-18ja]
Type=海上警戒直升机
Default=直-18JA,直-18JA
DefaultDescription=直-18是中国在直-8基础上研制的大型多用途舰载直升机。该机采用三台国产涡轴发动机，升级航电系统并采用复合材料旋翼。直-18JA是其海上警戒改型，装备可收放的相控阵搜索雷达，可为水面舰艇编队提供水面、低空和超低空目标的早期预警，并引导我方航母舰载机和舰空导弹拦截来袭目标。
Squadron1=直-18JA,直-18JA
Callsigns=Squadron1,海蝠

[plan_kj-600]
Type=预警机
Default=空警-600,空警-600
DefaultDescription=空警-600预警机是中国自主研制的舰载固定翼预警机, 主要用于搜索、监视空中、海上、地面目标, 指挥引导我方舰载战斗机和舰空导弹系统抗击来袭空中目标。该机装备机械扫描有源相控阵雷达，雷达可以在低频模式工作并能有效探测250公里范围内的隐身目标。
Squadron1=空警-600,空警-600
Callsigns=Squadron1,哪吒

[plan_j-15t]
Type=战斗机
Default=歼-15T,歼-15T
DefaultDescription=歼-15T是中国在歼-15基础上研制的弹射型舰载战斗机。该机同时兼容弹射型航母和滑跃型航母，机体结构加强，航电设备全面升级，配备新一代有源相控阵机载雷达和航电系统，可挂载霹雳-17，霹雳-15，霹雳-10等新一代空空导弹，还可挂载鹰击-15超音速反舰导弹。
Squadron1=歼-15T,歼-15T
Callsigns=Squadron1,飞鲨

[plan_j-15dt]
Type=电战机
Default=歼-15DT,歼-15DT
DefaultDescription=歼-15DT是中国研发的舰载电子战飞机，由歼-15T改进而来。该机装备新一代电子战设备和大型电子干扰吊舱，主要承担空中和水面作战电子对抗与反辐射打击任务。
Squadron1=歼-15DT,歼-15DT
Callsigns=Squadron1,噬电鲨

[plan_j-35]
Type=战斗机
Default=歼-35,歼-35
DefaultDescription=歼-35是中国研制的第五代隐身舰载战斗机。该机由FC-31战斗机发展而来，装备新一代航电系统和机载武器。
Squadron1=歼-35,歼-35
Callsigns=Squadron1,蓝鲨