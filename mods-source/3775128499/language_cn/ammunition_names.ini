# ------------------ SAM ------------------
plan_hhq-7=海红旗-7,,舰空导弹,海红旗-7舰空导弹是中国制造的一型短程半主动雷达制导舰空导弹，是引进自法国的汤姆森-TSF"海响尾蛇"舰空导弹的国产化版本。导弹使用8联装H/AJK-02发射器发射，由LJP-345火控雷达提供制导，可较为有效对抗掠海目标，但射程较短，且不具备抗饱和打击能力。H/AJK-02发射器可通过自动装填系统进行1轮再装填。

plan_hq-16=红旗-16,,舰空导弹,红旗-16舰空导弹是中国研制的中程区域防空导弹系统。导弹主要搭配H/AJK-16舰载垂直发射系统，装备人民海军054A型导弹护卫舰和部分改造后的导弹驱逐舰。导弹采用垂直热发射方式，半主动雷达制导，可有效拦截各类飞机、巡航导弹及掠海反舰导弹等目标，构成水面舰艇编队的中层防空屏障，与海红旗-9远程舰空导弹一起撑起远洋舰艇编队立体区域防空与自卫能力。

plan_hq-16c=红旗-16C,,舰空导弹,红旗-16C舰空导弹是中国研制的中程区域防空导弹系统。导弹主要搭配H/AJK-16舰载垂直发射系统，装备人民海军054A型导弹护卫舰和部分改造后的导弹驱逐舰。导弹采用垂直热发射方式，末端主动雷达制导，可有效拦截各类飞机、巡航导弹及掠海反舰导弹等目标，构成水面舰艇编队的中层防空屏障，与海红旗-9远程舰空导弹一起撑起远洋舰艇编队立体区域防空与自卫能力。

plan_hhq-9b=海红旗-9B,,舰空导弹,海红旗-9B舰空导弹是中国自主研制的远程舰空导弹，是陆基红旗-9地空导弹的舰载改型，装备人民海军052C、052D、055型导弹驱逐舰，是遂行舰队区域防空任务的重要装备。导弹采用垂直冷发射，具备矢量推进能力。飞行中段采用无线电指令/捷联惯导制导，末端采用主动雷达导引头制导，具备优异的抗电子干扰能力和抗饱和打击能力，能够有效杀伤超音速掠海威胁目标，具备有限的弹道导弹拦截能力。

plan_hhq-9c=海红旗-9C,,舰空导弹,海红旗-9C是中国自主研制的新一代中远程舰空导弹，装备人民海军052D和055型导弹驱逐舰，是舰队中远程区域反导的中坚力量，同时兼顾区域防空能力。在红旗-9B/海红旗-9B的基础上，海红旗-9C缩小弹径，加装固体火箭助推器和火箭姿态控制发动机，可有效拦截各型巡航导弹和弹道导弹目标。导弹兼容海通-1型垂直发射系统，采取一坑二弹布置方式，有效提升舰队抗饱和打击能力。

plan_hq-10=红旗-10,,舰空导弹,红旗-10是中国自主研制的近程点防空导弹系统，与近防炮一起构成水面舰艇近防武器系统，装备人民海军054A、056A型导弹护卫舰，052D、055型导弹驱逐舰等主力水面作战舰艇。导弹采用射频搜索加红外制导的复合制导模式，发射间隔短，反应速度快，能有效拦截各类低空掠海目标。导弹采用模块化设计，支持海上重装填，具备良好的持续抗打击能力。

plan_hq-10a=红旗-10A,,舰空导弹,红旗-10A是中国自主研制的近程点防空导弹系统，与近防炮一起构成水面舰艇近防武器系统，装备人民海军054A、056A型导弹护卫舰，052D、055型导弹驱逐舰等主力水面作战舰艇。导弹采用射频搜索加红外制导的复合制导模式，发射间隔短，反应速度快，能有效拦截各类低空掠海目标。导弹采用模块化设计，支持海上重装填，具备良好的持续抗打击能力。红旗-10A导弹系统是红旗-10导弹系统的改进型。

plan_9m38=9M38,,舰空导弹,9M38舰空导弹是9K37“山毛榉”地空导弹的海军版，是“无风”（也称“施基利”）舰空导弹系统的一部分，装备现代级导弹驱逐舰；导弹具备基础的区域防空能力，采用单悬臂发射架发射，可抗击飞机和导弹目标，但对掠海目标抗击能力不足。

plan_9m317=9M317,,舰空导弹,9M317是9M38舰空导弹的改进型号，在加大射程的同时能够抗击速度更快的来袭目标，对掠海目标的抗击效率有显著提升。

plan_48n6e1=48N6E1,,舰空导弹,48N6E1舰空导弹是俄罗斯"里夫-M"舰空导弹系统的组成部分，其自S-300F舰空导弹系统的5V55R拦截弹改进而来，最大射程和最小射高均有提升。该导弹为中远程舰空导弹，由舰载的30N6E1相控阵火控雷达提供目标指示，采用TVM制导，可较为有效对掠海目标实施拦截，具备一定拦截战术弹道导弹的能力。
# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------

plan_yj-9=鹰击-9,,空对面,鹰击-9是中国自主研发的一款轻型空射反舰导弹，主要用于舰载直升机挂载，执行近距离反舰任务。导弹采用采用末端主动雷达制导，可有效打击小型水面舰艇，如导弹快艇、巡逻艇等目标。

plan_yj-12a=鹰击-12A,,反舰导弹,鹰击12是中国自主研发的超音速远程反舰巡航导弹, 采用双速制，较低速度用于低空巡航，末端突防采用高速（4马赫）。采用复合制导，末端可进行机动规避防空火力，抗干扰能力强。

plan_yj-62=鹰击-62,,反舰导弹,鹰击-62导弹是中国自主研发的亚音速远程反舰巡航导弹，由中国航天科工集团（CASIC）研制，2000年代中期服役，主要装备于052C型导弹驱逐舰、轰-6G/K轰炸机及岸基反舰导弹部队。该导弹是中国海军首型具备超视距精确打击能力的重型反舰武器，显著提升了中国海军的远程制海作战能力。导弹采用倾斜发射，飞行中段采用惯导/GPS制导，末端采用主动雷达导引头制导。导弹飞行全程采用超低空掠海飞行剖面。

plan_yj-17=鹰击-17,,高超音速反舰导弹,鹰击-17是中国自主研制的新一代高超音速反舰导弹，兼容海通-1型舰载垂直发射系统，装备人民海军052D、055型导弹驱逐舰。导弹采用助推-滑翔乘波体构型，垂直发射，以高超音速滑翔弹道飞行，具有射程远，机动性强，突防能力强的特点，是构建海上区域拒止作战体系的重要武器。

plan_yj-18=鹰击-18,,反舰导弹,鹰击-18反舰导弹是中国运用引进自俄罗斯的3M54E"口径"巡航导弹技术研制的远程反舰巡航导弹，分为鹰击-18潜射型和鹰击-18A舰载垂直发射型两个型号。鹰击-18是人民海军潜艇部队的通用鱼雷管潜射导弹，装备引俄636型潜艇、039A/B型常规动力潜艇和093型攻击型核潜艇。导弹采用超低空掠海飞行弹道，亚音速巡航加超音速突防的复合飞行模式，兼具射程远和突防能力强的特点。

plan_yj-18a=鹰击-18A,,反舰导弹,鹰击-18反舰导弹是中国运用引进自俄罗斯的3M54E"口径"巡航导弹技术研制的远程反舰巡航导弹，分为鹰击-18潜射型和鹰击-18A舰载垂直发射型两个型号。鹰击-18A兼容海通-1型舰载垂直发射系统，装备人民海军052D、055型导弹驱逐舰。导弹采用超低空掠海飞行弹道，亚音速巡航加超音速突防的复合飞行模式，兼具射程远和突防能力强的特点。

plan_yj-18c=鹰击-18C,,对地攻击,鹰击-18C巡航导弹是中国研制的舰载远程巡航导弹。导弹采用隐身设计，主要用于打击地面固定目标，可由舰载通用垂直发射系统搭载和发射。

plan_yj-19=鹰击-19,,高超音速反舰导弹,鹰击-19反舰导弹是中国自主研制的新一代潜射反舰导弹，推测为鱼雷管发射，取代鹰击-18导弹。导弹采用吸气式超燃冲压发动机，具备高空高速持续机动能力。在不具备垂直发射系统的条件下，常规潜艇也可借助鹰击-19获得强大的远程反舰突防打击能力。

plan_yj-20=鹰击-20,,高超音速反舰导弹,鹰击-20是中国自主研制的新一代高超音速反舰导弹，兼容海通-1型舰载垂直发射系统，装备人民海军052D、055型导弹驱逐舰。导弹采用双锥体构型，垂直发射，以高超音速滑翔弹道飞行，具有射程远，威力大，突防能力极强的特点，是构建海上区域拒止作战体系的重要武器。

plan_yj-62=鹰击-62,,反舰导弹,鹰击-62导弹是中国自主研发的亚音速远程反舰巡航导弹，由中国航天科工集团（CASIC）研制，2000年代中期服役，主要装备于052C型导弹驱逐舰、轰-6G/K轰炸机及岸基反舰导弹部队。该导弹是中国海军首型具备超视距精确打击能力的重型反舰武器，显著提升了中国海军的远程制海作战能力。导弹采用倾斜发射，飞行中段采用惯导/GPS制导，末端采用主动雷达导引头制导。导弹飞行全程采用超低空掠海飞行剖面。

plan_yj-83=鹰击-83,,反舰导弹,鹰击-83反舰导弹是中国研制的亚音速反舰巡航导弹。它采用涡喷发动机与弹翼折叠设计，可在舰艇、飞机及岸基载具上灵活部署。导弹末段采用主动雷达制导，超低空掠海突防，打击精度高、抗干扰能力强，是海军中近程对海打击的重要装备。

plan_yj-83a=鹰击-83A,,反舰导弹,鹰击-83A反舰导弹是中国研制的亚音速反舰巡航导弹。它采用涡喷发动机与弹翼折叠设计，可在舰艇、飞机及岸基载具上灵活部署。导弹采用红外图像和雷达双模制导，超低空掠海突防，打击精度高、抗干扰能力强，是海军中近程对海打击的重要装备
#-----------Land Strike only missiles---------
plan_cj-10=长剑-10,,对地攻击,长剑-10是中国自主研制的远程陆攻巡航导弹，兼容海通-1型舰载垂直发射系统，装备人民海军052D、055型导弹驱逐舰。导弹具有航程远、精度高的特点，可超低空飞行、隐蔽突防、连续突击，是人民海军远程对地打击的重要手段。

plan_cj-20=长剑-20,,对地攻击,长剑-20是中国自主研制的新一代三军通用远程陆攻巡航导弹，兼容海通-1型舰载垂直发射系统、地面发射车，也可由轰-6轰炸机挂载，装备人民海军052D、055型导弹驱逐舰。导弹具有航程远、精度高的特点，可超低空飞行、隐蔽突防、连续突击，是人民海军远程对地打击的重要手段。

# ---------- Anti-sub  Missilies ----------
plan_yu-8=鱼-8,,反潜火箭助飞鱼雷,鱼-8是中国自主研制的反潜火箭助飞鱼雷，兼容H/AJK-16舰载垂直发射系统和海通-1型舰载垂直发射系统，装备人民海军054A型导弹护卫舰，052D、055型导弹驱逐舰。采用火箭垂直发射加末端轻型鱼雷自主打击构型，战斗部为一发鱼-7C型轻型反潜鱼雷。武器具有反应速度快，射程远的特点，是远海舰队反潜的中坚力量。

plan_yu-11=鱼-11,,反潜火箭助飞鱼雷,鱼-11是中国研制的反潜火箭助飞鱼雷，与鹰击-83反舰导弹共架倾斜发射，主要装备056A型导弹护卫舰。武器采用火箭发射，巡航导弹低空飞行加末端轻型鱼雷自主打击构型，战斗部为一枚鱼-7轻型反潜鱼雷。武器具有反应速度快，射程远的特点。

plan_yu-15=鱼-15,,反潜火箭助飞鱼雷,鱼-15是中国自主研制的新一代反潜火箭助飞鱼雷，兼容H/AJK-16舰载垂直发射系统和海通-1型舰载垂直发射系统，装备人民海军054A型导弹护卫舰，052D、055型导弹驱逐舰。武器采用火箭发射，巡航导弹低空飞行加末端轻型鱼雷自主打击构型，战斗部为一枚鱼-12轻型反潜鱼雷。武器具有反应速度快，射程远的特点，是远海舰队反潜的中坚力量。

# ------------------ RBU ------------------
plan_rgb-81=FQF-3200,,火箭深弹,FQF-3200火箭深弹系统是中国研制的舰载反潜武器系统。该系统采用模块化设计，主要由H/WHH-003火箭深弹发射器，81式火箭深弹和反潜火控系统组成。可以联动舰艇水声对抗系统打击近距离水下目标和来袭鱼雷武器。

plan_rbu2000=FQF-2000,,火箭深弹,RJZ-726-4多功能发射器可发射173毫米口径的火箭深弹，配合水声对抗系统杀伤水下潜艇或鱼雷目标。
# --------------- Torpedoes ---------------

plan_yu-6=鱼-6,热动力,多用途鱼雷,鱼-6鱼雷是中国自行研制的第一款热动力泵喷推进重型鱼雷，具有大速度，大深度，大航程，双速制特点，采用OTTO II复合燃料，斜盘活塞发动机和泵喷推进技术，采用线导和声自导复合制导，能有效打击水面和水下的各种目标。鱼-6性能大致相当于美国海军Mk.48 mod 5鱼雷。

plan_yu-6a=鱼-6A,热动力,多用途鱼雷,鱼-6A鱼雷是中国研制的热动力重型鱼雷，在鱼-6的基础上提升导引头作用效果，使用光纤线导，采用28节低噪音巡航模式。

plan_yu-6b=鱼-6B,热动力,多用途鱼雷,鱼-6B是中国研制的热动力重型鱼雷，在鱼-6的基础上提升导引头作用效果，使用光纤线导，采用OTTO加HAP氧化添加剂复合燃料，具备强化航速和射程性能。

plan_yu-7_air=鱼-7,,反潜鱼雷,鱼-7轻型反潜鱼雷是中国基于授权制造的美国Mk.46 Mod 2鱼雷发展而来的通用轻型反潜鱼雷。1978年中国民兵于中国南海打捞一发美制Mk.46 Mod 1 Phase 2反潜鱼雷，并交由国防科研单位研究测绘。1985年中美达成协议，由美国向中国提供全套技术资料，生产和测试设备，用以在中国生产Mk.46 Mod 2鱼雷。中国基于获得的技术资料和授权生产的样雷建立了轻型反潜鱼雷研制和生产体系，并将授权生产的Mk.46 Mod 2鱼雷定型为鱼-7轻型反潜鱼雷。

plan_yu-7c_air=鱼-7C,,反潜鱼雷,鱼-7C轻型反潜鱼雷是中国基于授权制造的美国Mk.46 Mod 2鱼雷发展而来的通用轻型反潜鱼雷。1978年中国民兵于中国南海打捞一发美制Mk.46 Mod 1 Phase 2反潜鱼雷，并交由国防科研单位研究测绘。1985年中美达成协议，由美国向中国提供全套技术资料，生产和测试设备，用以在中国生产Mk.46 Mod 2鱼雷。中国基于获得的技术资料和授权生产的样雷建立了轻型反潜鱼雷研制和生产体系，并将授权生产的Mk.46 Mod 2鱼雷定型为鱼-7轻型反潜鱼雷。鱼-7C是增强鱼雷推进效率，提升导引头性能的改进型，性能与Mk.46 Mod 5(SW)大致相当，可由水面舰艇或反潜直升机，海上巡逻机投放。 

plan_yu-7_ship=鱼-7,,反潜鱼雷,鱼-7轻型反潜鱼雷是中国基于授权制造的美国Mk.46 Mod 2鱼雷发展而来的通用轻型反潜鱼雷。1978年中国民兵于中国南海打捞一发美制Mk.46 Mod 1 Phase 2反潜鱼雷，并交由国防科研单位研究测绘。1985年中美达成协议，由美国向中国提供全套技术资料，生产和测试设备，用以在中国生产Mk.46 Mod 2鱼雷。中国基于获得的技术资料和授权生产的样雷建立了轻型反潜鱼雷研制和生产体系，并将授权生产的Mk.46 Mod 2鱼雷定型为鱼-7轻型反潜鱼雷。

plan_yu-7c_ship=鱼-7C,,反潜鱼雷,鱼-7C轻型反潜鱼雷是中国基于授权制造的美国Mk.46 Mod 2鱼雷发展而来的通用轻型反潜鱼雷。1978年中国民兵于中国南海打捞一发美制Mk.46 Mod 1 Phase 2反潜鱼雷，并交由国防科研单位研究测绘。1985年中美达成协议，由美国向中国提供全套技术资料，生产和测试设备，用以在中国生产Mk.46 Mod 2鱼雷。中国基于获得的技术资料和授权生产的样雷建立了轻型反潜鱼雷研制和生产体系，并将授权生产的Mk.46 Mod 2鱼雷定型为鱼-7轻型反潜鱼雷。鱼-7C是增强鱼雷推进效率，提升导引头性能的改进型，性能与Mk.46 Mod 5(SW)大致相当，可由水面舰艇或反潜直升机，海上巡逻机投放。

plan_yu-7c_yu-8=鱼-7C,,反潜鱼雷,鱼-7C轻型反潜鱼雷是中国基于授权制造的美国Mk.46 Mod 2鱼雷发展而来的通用轻型反潜鱼雷。1978年中国民兵于中国南海打捞一发美制Mk.46 Mod 1 Phase 2反潜鱼雷，并交由国防科研单位研究测绘。1985年中美达成协议，由美国向中国提供全套技术资料，生产和测试设备，用以在中国生产Mk.46 Mod 2鱼雷。中国基于获得的技术资料和授权生产的样雷建立了轻型反潜鱼雷研制和生产体系，并将授权生产的Mk.46 Mod 2鱼雷定型为鱼-7轻型反潜鱼雷。鱼-7C是增强鱼雷推进效率，提升导引头性能的改进型，性能与Mk.46 Mod 5(SW)大致相当，可由水面舰艇或反潜直升机，海上巡逻机投放。

plan_yu-9=鱼-9,电动,多用途鱼雷,鱼-9鱼雷是中国自行研制的电动多用途重型鱼雷，采用无空泡螺旋桨推进，隔振降噪措施，双速制设计。鱼雷具备低噪声发射能力，在巡航速度（25节）时静音性能极佳，噪音水平接近海洋背景噪音，在末端时则采用高速（42节）接近目标。搭配线导和声自导复合制导模式，能够实现隐身打击效果。

plan_yu-10=鱼-10,电动,多用途鱼雷,鱼-10鱼雷是中国自行研制的新一代多用途重型鱼雷，采用新一代隔振降噪技术，静音螺旋桨推进，兼具大航程、高航速和低噪音特点。鱼雷具备低噪声发射能力，在全速度段具备静音航行能力，制导精度和抗干扰能力全面提升，是先发制人的打击利器。

plan_yu-12_ship=鱼-12,,轻型反潜鱼雷,鱼-12是中国自主研制的新一代通用反潜轻型鱼雷，可由舰载鱼雷发射器，舰载反潜直升机，固定翼海上巡逻机和反潜助飞鱼雷搭载发射，鱼雷采用热动力泵喷推进，装备新一代主被动声自导导引头。鱼雷具有射程远，速度快，抗干扰能力强，通用性好的特点。

plan_yu-12_air=鱼-12,,轻型反潜鱼雷,鱼-12是中国自主研制的新一代通用反潜轻型鱼雷，可由舰载鱼雷发射器，舰载反潜直升机，固定翼海上巡逻机和反潜助飞鱼雷搭载发射，鱼雷采用热动力泵喷推进，装备新一代主被动声自导导引头。鱼雷具有射程远，速度快，抗干扰能力强，通用性好的特点。

plan_mss-01=MSS-01,,自航声诱饵,MSS-01是中国研制的自航式潜艇声诱饵，可在多个频段模拟潜艇噪声特征，干扰敌方水声传感器和鱼雷导引头。采用线控制导和低噪声发射设计，使潜艇可对敌方反潜力量实施主动欺骗干扰。


