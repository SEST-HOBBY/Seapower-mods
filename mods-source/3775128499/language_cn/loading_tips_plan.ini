[LoadingTips]
Count=16
Header=中国海军舰艇MOD提示
Tip001=现代盾舰防空火力极强，仅使用少量掠海反舰导弹几乎无法突防。
Tip002=现代作战单位普遍有高精度ESM（电子支援措施），在非必要的情况下不要打开雷达，这会被范围内的ESM侦测并定位。
Tip003=中国海军包内近几年的武器性能多靠猜测，如果你有不涉密资料证实可以联系mod开发人员。
Tip004=054A第五批次将照射器升级为固定的相控阵雷达，同时携带红旗-16C主动导引头防空导弹，极大地提升了抗击大量目标的能力。
Tip005=052C型驱逐舰使用海红旗-9B主动导引头防空导弹，在有其他单位侦查的情况下可以超地平线拦截掠海目标。
Tip006=056A通常搭载两发鱼-11与两发鹰击-83执行近海反潜任务。
Tip007=054A型护卫舰最高航速只有28节。
Tip008=海红旗-9C防空导弹能够在HT-1型垂发内“一坑两弹”，目前装备在052D型与055型的后期改型上。
Tip009=052型、053H3型、054型仅装备海红旗-7防空导弹，这使得它们只有最基础的点防空能力。
Tip010=直-9C由于载重限制，只能同时挂载两颗鱼雷或只搭载吊放声呐
Tip011=直-9F在直-9C的基础上略微提升了载重，使其能同时搭载吊放声呐与一颗鱼-7C反潜鱼雷
Tip012=055型驱逐舰有整整112个HT-1垂发单元，同时搭载346A型相控阵雷达，是中国海军单舰综合能力最强的舰艇
Tip013=052C型驱逐舰的垂发每一个发射单元都能开盖射击，但是依旧拥有旋转结构，因为装填时只打开一个盖子吊装发射筒
Tip014=052C型以及更早有机库的船均有搭载卡-28与卡-31的能力
Tip015=052D型拥有64个HT-1垂发单元，兼容防空、反舰、反潜弹药，是中国海军第一型真正意义上的通用驱逐舰
Tip016=052D的64个垂发里，有48个是7米深的，只有16个9米深的能够携带反舰导弹，而055的112个垂发所有的是9米深的！





