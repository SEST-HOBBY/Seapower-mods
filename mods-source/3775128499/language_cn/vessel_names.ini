DefaultDescription=052B型导弹驱逐舰是中国人民解放军海军于2000年代初装备的导弹驱逐舰，该型舰是中国海军引进俄罗斯“现代”级导弹驱逐舰后运用俄制舰载传感器和“无风”舰空导弹系统自行设计建造现代化驱逐舰的尝试。该型舰共建造2艘，全部在2004年入役并部署于南海舰队，分别是168“广州”舰和169“武汉”舰；两舰服役后与两艘052C型驱逐舰共同构成了所谓“江南四杰”。该型舰定位是利用引俄装备解决新世纪中国海军区域防空能力不足的问题，也是中国海军第一型自行设计建造的，具备区域防空能力的驱逐舰。该舰为后续052C/D型驱逐舰的发展验证了舰体、和动力设计，是国产第三代驱逐舰的开山之作。
Variant1=广州（168）,052B
Variant2=武汉（169）,052B

