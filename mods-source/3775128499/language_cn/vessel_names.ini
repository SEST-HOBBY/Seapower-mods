[plan_ss_type_039a]
Type=SS,巡逻潜艇
Default=039A型,039A型
DefaultDescription=039A/B型潜艇是中国第二代常规动力潜艇，2006年服役，也是中国首款搭载AIP系统的常规动力潜艇。该艇采用双壳体水滴形设计，水下排水量 3600 吨，通过第三代消声瓦、七叶大侧斜螺旋桨等技术，水下噪声低于120分贝，隐身性能达全球先进水平。潜艇搭载国产斯特林发动机，支持水下连续潜航数周。潜艇搭载国产大基阵数字综合声呐和舷侧低频被动声呐阵列，艇首 6 具 533 毫米鱼雷发射管可发射各种重型鱼雷和潜射巡航导弹。该艇航程约5000海里，水下最大航速22节，可执行近海隐蔽巡逻与远海反潜和拒止打击任务，是中国海军潜艇部队主力装备。

Variant1=长城330,039A
