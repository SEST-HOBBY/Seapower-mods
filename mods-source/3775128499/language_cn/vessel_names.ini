[plan_type_051c]
Type=DD,驱逐舰
Default=051C型,051C
DefaultDescription=051C型导弹驱逐舰是中国人民解放军海军于2000年代装备的一型防空导弹驱逐舰，其以051B型驱逐舰舰体和动力系统设计为基础，搭载进口自俄罗斯的“里夫-M”舰空导弹系统，以填补当时人民海军水面舰艇编队中远程区域防空任务的空白。该型舰共建造两艘，分别是2006年服役的115沈阳舰和2007年服役的116石家庄舰。该级舰艇的建造计划是为当时还在试制阶段的052C型导弹驱逐舰及海红旗-9舰空导弹系统做备份，万一052C型和自研舰空导弹系统进展不顺，将由这两艘051C型驱逐舰担负其作战使命。
Variant1=沈阳（115）,051C
Variant2=石家庄（116）,051C

[plan_type_051b_1997]
Type=DD,驱逐舰
Default=051B型,051B
DefaultDescription=051B型导弹驱逐舰是中国人民解放军海军于上世纪90年代末装备的一型导弹驱逐舰。该舰是人民海军继052型导弹驱逐舰后自行设计建造现代化大型驱逐舰的又一次尝试。由于当时国家施行军队装备更新让步于社会经济发展的才财政政策，051B型驱逐舰最初以051型驱逐舰改型立项，虽沿用051型的代号，但除动力系统外几乎与051型导弹驱逐舰毫无关系。由于90年代西方对华技术封锁和自行研制舰用燃气轮机进展不顺，051B型依然采用蒸汽轮机作为动力装置。051B大胆采用简洁流畅的隐身设计外观，各武器系统和电子系统大量采用052型驱逐舰上的成熟装备。051B型仅建造一艘，于1999年服役，命名为深圳舰，舷号167。深圳舰很长一段时间内是人民海军吨位最大的水面战斗舰艇，承担了大量国际出访和演训任务，被称为“中华第一舰”。
Variant1=深圳（167）,051B

[plan_type_051b_2017]
Type=DD,驱逐舰
Default=051B型,051B
DefaultDescription=051B型导弹驱逐舰是中国人民解放军海军于上世纪90年代末装备的一型导弹驱逐舰。该舰是人民海军继052型导弹驱逐舰后自行设计建造现代化大型驱逐舰的又一次尝试。由于当时国家施行军队装备更新让步于社会经济发展的才财政政策，051B型驱逐舰最初以051型驱逐舰改型立项，虽沿用051型的代号，但除动力系统外几乎与051型导弹驱逐舰毫无关系。由于90年代西方对华技术封锁和自行研制舰用燃气轮机进展不顺，051B型依然采用蒸汽轮机作为动力装置。051B大胆采用简洁流畅的隐身设计外观，各武器系统和电子系统大量采用052型驱逐舰上的成熟装备。051B型仅建造一艘，于1999年服役，命名为深圳舰，舷号167。深圳舰很长一段时间内是人民海军吨位最大的水面战斗舰艇，承担了大量国际出访和演训任务，被称为“中华第一舰”。2017年该舰接受中期升级改造，大幅提升态势感知能力，并换装红旗-16舰空导弹系统和鹰击-12反舰导弹。
Variant1=深圳（167）,051B

[plan_type_052_2004]
Type=导弹驱逐舰,驱逐舰
Default=052型,052
DefaultDescription=052型导弹驱逐舰是中国于1980年代设计建造的第二代导弹驱逐舰，也是人民海军第一型具备基本防空，反舰和反潜综合作战能力的现代化驱逐舰。由于该舰的动力、通信、水声等子系统大量使用进口设备，该舰仅建造两艘，分别为112哈尔滨舰和113青岛舰。052型导弹驱逐舰是中国海军借助进口先进设备建造现代化大型水面作战舰艇的尝试，全舰传感器和武器装备首次接入综合作战指挥系统，指挥控制实现基本数字化，大幅提高了舰艇态势感知和编队协同作战能力。052型导弹驱逐舰是人民海军走向现代化、信息化海军的关键转折，该舰的设计建造和服役积累的经验是人民海军新一代具备远海综合作战能力水面舰艇的起点。
Variant1=哈尔滨（112）,052
Variant2=青岛（113）,052

