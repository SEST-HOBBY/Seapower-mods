#---------------------------------------- Sonar ----------------------------------------
DE-1160=DE-1160|The DE-1160 Digital Integrated Sonar System is an export variant of the U.S. AN/SQS-56 Integrated Sonar System, primarily installed on Oliver Hazard Perry-class guided-missile frigates in the U.S. Navy. In the early 1980s, China imported two sets of this sonar system from Italy, which were installed on the Type 052 guided-missile destroyer PLANS Harbin and the Type 051G guided-missile destroyer PLANS Zhuhai. This marked the first time the PLAN had acquired a digital integrated hull sonar system.

SJD-7=H/SJD-7|The H/SJD-7 sonar is China’s first digital mid-frequency hull-mounted sonar; it was primarily deployed on the PLA Navy’s large surface combatants in the late 1990s and early 2000s.

SJD-9=H/SJD-9|The H/SJD-9 sonar is a medium-to-low frequency integrated hull-mounted sonar system serving as the primary sonar equipment for the PLAN's destroyers and frigates. Utilizing an all-digital signal processing structure, this versatile sonar system features the capability to share sensor data with other units through the combat command system and datalinks. Because this sonar was designed for versatility—it must be compatible with a range of ship sizes, from light frigates to guided-missile destroyers—the size of the sonar array is limited, resulting in a less-than-optimal detection range.


DE-1164=DE-1164 VDS|The DE-1164 towed variable-depth sonar is compatible with the DE-1160 integrated sonar system. It operates in both active and passive modes and is capable of detecting underwater targets below the thermal layer. China imported this type of sonar from Italy in the early 1980s, and it is deployed on Type 052 missile destroyers and the Type 051G missile destroyer.

SJG-206=H/SJG-206|The H/SJG-206 represents the PLAN's second-generation passive towed array sonar system.


SJG-311=H/SJG-311|H/SJG-311 is the concurrent universal variable depth sonar (VDS) system employed by the PLAN.

SJD-XX=H/SJD-XX|The H/SJD-XX is a new-generation universal medium-to-low frequency integrated hull-mounted sonar system of the People's Liberation Army Navy. It employs an all-digital signal processing architecture, and its sensor data can be shared with other units via the combat command system and data links.

# ------------------ Guns -----------------
PJ-17A=H/PJ-17A Gun|30mm|The H/PJ-17A single-barrel, 30mm naval gun is a lightweight self-defense weapon mounted on various fleet auxiliary vessels, coast guard cutters, and light frigates, and is primarily used for self-defense, counterterrorism and law enforcement operations.

PJ-26=H/PJ-26 Gun|76mm|The H/PJ-26 single-barrel 76mm naval gun is a medium-caliber shipborne main gun developed by China based on the Russian AK-176M naval gun. It is a versatile artillery system widely equipped on PLAN frigates, featuring a high degree of automation and a rapid rate of fire. Compatible with various types of ammunition, it can effectively perform missions such as air defense and anti-missile operations, surface engagement and shore bombardment support.

PJ-87=H/PJ-87 Gun|100mm|The H/PJ-87 100mm naval gun represents China's domestically adapted version of the French T100C 100mm Compact Gun. China initially acquired prototype models of this weapon system from France in the early 1980s, with the Type 053H1Q frigate PLANS Siping serving as the test platform for evaluation. Chinese engineers enhanced the original design's reliability while modifying its electrical systems and digital control architecture to integrate with indigenous naval electronics. The final production version incorporated a redesigned stealth-optimized casing before entering service as the H/PJ-87. This fully automated dual-purpose naval gun system maintains engagement capability against both aerial and surface targets, achieving a maximum rate of fire of 90 rounds per minute. Following its introduction, the H/PJ-87 became operational across multiple classes of Chinese surface combatants, including Type 052B destroyers, Type 051C destroyers, and Type 054 frigates.

PJ-87_051C=H/PJ-87 Gun|100mm|The H/PJ-87 100mm naval gun represents China's domestically adapted version of the French T100C 100mm Compact Gun. China initially acquired prototype models of this weapon system from France in the early 1980s, with the Type 053H1Q frigate PLANS Siping serving as the test platform for evaluation. Chinese engineers enhanced the original design's reliability while modifying its electrical systems and digital control architecture to integrate with indigenous naval electronics. The final production version incorporated a redesigned stealth-optimized casing before entering service as the H/PJ-87. This fully automated dual-purpose naval gun system maintains engagement capability against both aerial and surface targets, achieving a maximum rate of fire of 90 rounds per minute. Following its introduction, the H/PJ-87 became operational across multiple classes of Chinese surface combatants, including Type 052B destroyers, Type 051C destroyers, and Type 054 frigates.

PJ-33B=H/PJ-33B Gun|100mm|The H/PJ-33B is a twin-barrelled 100 mm automatic naval gun developed by China. It is upgraded from the Type 79 twin-barrelled 100 mm naval gun, featuring a stealth casing, fully automatic feeding and digital control, which significantly enhance its reliability and firing accuracy; however, the gun has a relatively slow rate of fire and is not particularly effective against aerial targets.

PJ-45=H/PJ-45 Gun|130mm|The H/PJ-45 130mm naval gun is the new-generation universal automatic gun system for the PLAN's destroyers. Its modified variant is deployed aboard Type 052D and Type 055 guided-missile destroyers. The H/PJ-45 system installed on Type 055 destroyers features fully automated operation and dual-path ammunition feed, characterized by high rate of fire, short reaction time, significant destructive power, and excellent ammunition versatility.

PJ-45A=H/PJ-45A Gun|130mm|The H/PJ-45A 130mm naval gun is a general-purpose naval gun for the PLAN’s new generation of destroyers and is deployed on Type 052D missile destroyers. To reduce its size and weight, the PJ-45A naval gun has omitted the dual-feed mechanism, which is presented on PJ-45 gun mounted on Type 055 destroyers.

# ------------------ CIWS -----------------
PJ-13A=H/PJ-13A CIWS|H/PJ-13A|The PJ-13A Close-In Weapon System (CIWS) is a domestically produced CIWS developed by the PLAN following the introduction of the Russian AK-630 six-barrel 30-millimeter CIWS. It features a stealth casing and incorporates Chinese fire control radar and sighting systems.

PJ-13B=H/PJ-13B CIWS|H/PJ-13B|The PJ-13B Close-In Weapon System (CIWS) is a domestically produced CIWS developed by the PLAN following the introduction of the Russian AK-630 six-barrel 30-millimeter CIWS. It features a stealth casing and incorporates Chinese fire control radar and sighting systems. The PJ-13B features an upgraded belt-fed ammunition system—inherited from the AK630—that has been modified to a drum-fed system, enhancing reliability while increasing ammunition capacity.

Type_730=Type 730 CIWS|H/PJ-12|The H/PJ-12 is a seven-barrel 30mm Close-In Weapon System (CIWS) deployed across the PLAN's major surface combatants. This fully autonomous system features a Gatling-style rotary cannon firing APFSDS rounds at 5,800 rpm, with an 80-degree/second traverse capability. Equipped with integrated electro-optical sensors, laser rangefinder, and dedicated H/LJP-349 fire control radar, it provides terminal defense against supersonic anti-ship missiles while maintaining secondary capability against aircraft and small surface targets. The system's high rate of fire and advanced tracking make it a critical last-line defense component in the PLAN's layered protection network.

Type_730_H=Type 730 CIWS|H/PJ-12|The H/PJ-12 is a seven-barrel 30mm Close-In Weapon System (CIWS) deployed across the PLAN's major surface combatants. This fully autonomous system features a Gatling-style rotary cannon firing APFSDS rounds at 5,800 rpm, with an 80-degree/second traverse capability. Equipped with integrated electro-optical sensors, laser rangefinder, and dedicated H/LJP-349 fire control radar, it provides terminal defense against supersonic anti-ship missiles while maintaining secondary capability against aircraft and small surface targets. The system's high rate of fire and advanced tracking make it a critical last-line defense component in the PLAN's layered protection network.

Type_1130_L=Type 1130 CIWS|H/PJ-11|The H/PJ-11 is deployed aboard the People's Liberation Army Navy's major surface combatants as a universal close-in weapon system (CIWS). Its core component is an 11-barrel 30mm rotary cannon firing Armor-Piercing Fin-Stabilized Discarding Sabot (APFSDS) ammunition at a rate of approximately 10,000 rounds per minute. The turret can traverse at speeds up to 90 degrees per second, and is equipped with independent infrared/electro-optical sensors and a laser rangefinder. Each turret is supported by a dedicated H/LJP-349 fire-control radar for targeting solutions. The system is capable of effectively engaging incoming supersonic sea-skimming missiles, as well as fixed-wing and rotary-wing aircraft, surface vessels and small boats, coastal targets, and floating mines.

Type_1130=Type 1130 CIWS|H/PJ-11|The H/PJ-11 is deployed aboard the People's Liberation Army Navy's major surface combatants as a universal close-in weapon system (CIWS). Its core component is an 11-barrel 30mm rotary cannon firing Armor-Piercing Fin-Stabilized Discarding Sabot (APFSDS) ammunition at a rate of approximately 10,000 rounds per minute. The turret can traverse at speeds up to 90 degrees per second, and is equipped with independent infrared/electro-optical sensors and a laser rangefinder. Each turret is supported by a dedicated H/LJP-349 fire-control radar for targeting solutions. The system is capable of effectively engaging incoming supersonic sea-skimming missiles, as well as fixed-wing and rotary-wing aircraft, surface vessels and small boats, coastal targets, and floating mines.

PJ-76A=H/PJ-76A AAA|37mm|The H/PJ-76A is a fully automatic rapid-fire naval gun developed by China in the 1970s based on the Type 76 twin-barrelled 37 mm naval gun. This gun eliminates the  crew station, utilising automatic ammunition feeding and computer-controlled technology. As its technical foundation remains the 37 mm anti-aircraft gun from the Second World War, this weapon system is only capable of engaging low-flying aircraft and has no significant intercept capability against various missile targets.

