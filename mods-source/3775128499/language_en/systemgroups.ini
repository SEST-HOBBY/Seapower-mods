LJP-344=H/LJP-344 FCR|The H/LJP-344 is a naval gun fire control radar developed in China. It is primarily fitted to various types of destroyers built since the 1990s and serves as the fire control radar for naval guns such as the H/PJ-87, H/PJ-33 and H/PJ-45.

LJP-344A=H/LJP-344A|Fire control radar for the main gun.

LJP-345=H/LJP-345 FCR|The H/LJP-345 is the fire-control radar for the HHQ-7 SAM system; it is a domestically produced variant developed following China’s introduction of the French Castor-II integrated fire-control radar. The radar is equipped with coaxial infrared and television sighting equipment and is capable of simultaneously guiding 2 missiles to engage a single target.

