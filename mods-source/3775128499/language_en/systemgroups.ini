E-801E=E-801E|The E-801E radar was developed by the Nizhny Novgorod Radio Engineering Institute. The radar has an antenna area of 6 square meters and employs a passive phased-array configuration. It can be folded into the belly of a Ka-31 helicopter. The radar has 360° search capability and can detect small fighter-sized targets  at a distance of up to 110 kilometers. Its detection range for surface ships is typically 100–200 kilometers. The radar is capable of simultaneously tracking 40 targets.

