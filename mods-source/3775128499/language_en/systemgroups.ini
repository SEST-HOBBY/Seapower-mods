KLC-1=H/KLC-1|The KLC-1 radar is a surface search radar installed on the Z-9C helicopter. It is capable of searching for and tracking surface vessel targets and providing mid-course guidance for anti-ship missiles via data link. It is installed on the Z-9C helicopter.

KLC-3B=H/KLC-3B|The KLC-3B radar is a new-generation X-band multi-purpose helicopter-borne search radar with excellent surface/low-altitude search and reconnaissance capabilities. It can transmit the detected surface tactical situation and target information to ground or shipborne command posts via airborne data links. It features strong medium/short-range detection capabilities and excellent anti-jamming performance.

KLC-3C=H/KLC-3C|The KLC-3C radar is an AESA multi-purpose helicopter search radar with excellent surface/low-altitude search and reconnaissance capabilities. It has long operation range and high resoluation, and can relay situational awareness info to other units via data link. It is equipped with Z-9F helicopter.

