LJG-316=H/LJG-316 FCR|The H/LJG-346 (fictional designation) is a Chinese ship-to-air missile fire control radar developed from the Russian MR-90 fire control radar. It serves as the illuminator for the HQ-16 SAM system. A single radar unit can simultaneously guide two missiles to engage one target.

LJG-316A=H/LJG-316A FCR|The H/LJG-316A (fictional designation) is the new generation FCR of the HQ-16 SAM system equipped with late production Type 054A FFG. It utilizes four fixed AESA arrays, and each array can simultaneously guide 6 missiles to engage 3 targets.

