#---Air/Air&Surface---
LJQ-381A=H/LJQ-381A|The H/LJQ-381A radar is a 3D long-range air-search radar independently developed by China, based on the LJQ-381 radar—China’s first 3D air-search radar.

LJQ-382=H/LJQ-382 radar|The H/LJQ-382 radar is a Chinese 3D air search radar developed from the Russian MR-750MA radar. It serves as the primary air search and early warning radar for PLAN frigates and large surface combatants. The radar combines a phased array antenna with mechanical scanning, enabling both detection and tracking capabilities that meet aerial air defense requirements. It can effectively suppress sea clutter and electronic interference while providing precise target indication data to shipborne air defense systems.

LJQ-361A=H/LJQ-361A|The H/LJQ-361A radar is a 2D surface/air search radar primarily deployed on small surface vessels such as the Type 056A frigate.

LJQ-362=H/LJQ-362 radar|The H/LJQ-362 radar is a 2D low-altitude search/surface search radar operating in the X-band. It is the PLAN's first low-altitude rapid-response radar. Originally known as the 347S search radar, it forms part of the Type 347 low-altitude rapid-response radar system alongside the H/LJG-347G fire-control radar for the PJ-76A twin 37mm automatic naval gun. The radar can effectively detect ultra-low-altitude targets and sea-skimming anti-ship cruise missiles, and provides fire control parameters for close-in weapon systems, though its effective range is relatively short.

LJQ-364=H/LJQ-364 radar|The H/LJQ-364 is a dual-band 2D radar system designed for low-altitude and surface search, operating in X-band (for ultra-low altitude detection) and I-band (for surface search). This radar is widely deployed across medium and large surface combatants of the PLAN. On Type 054A frigates, the H/LJQ-364 primarily serves to compensate for the close-range blind zones of the ship's primary H/LJQ-382 phased array radar when tracking sea-skimming targets. Installed atop the main mast, the system also provides targeting parameters to close-in weapon systems.

LJQ-368=H/LJQ-368|The H/LJQ-368 radar is an active phased-array ultra-low-altitude search/surface search radar deployed on PLAN’s large and medium-sized surface vessels. It has effectively increased the detection range for ultra-low-altitude sea-skimming targets and reduced the sensor response time of shipborne air defense systems.

LJQ-360=H/LJQ-360 radar|The H/LJQ-360 radar is a Chinese-made 2D multi-purpose air and surface search radar, developed as a domestically produced variant following China’s introduction of the French Thomson-TSF TSR 3004 ‘Sea Tiger’ radar in the 1980s. This radar was primarily deployed on PLAN destroyers built during the 1990s and 2000s, responsible for medium- and short-range air and surface search, and providing target cue for the HHQ-7 and Crotale SAM systems.

LJQ-517A=H/LJQ-517A|The H/LJQ-517A is a 2D long-range air search radar operating in the VHF band. Primarily tasked with medium-to-high altitude early warning duties, it can be integrated into combat systems and features adaptive frequency agility capabilities for interference analysis.

LJQ-517B=H/LJQ-517B|The H/LJQ-517B is a 2D long-range air search radar operating in the VHF band. Primarily tasked with medium-to-high altitude early warning duties, it can be integrated into combat systems and features adaptive frequency agility capabilities for interference analysis. On the Type 052C destroyer, the 517B radar primarily serves to provide early warning information on long-range aerial targets when the ship's primary H/LJG-346 radar arrays are operating at reduced power.

LJQ-518=H/LJQ-518|The H/LJQ-518 radar is a 2D long-range air surveillance radar operating in the L-band. Due to the underwhelming performance of the LJQ-381 radar, the PLAN opted to modify existing land-based long-range surveillance radars for use on Type 052 guided-missile destroyers, leading to the development of the LJQ-518 radar. Compared to the meter-wave air surveillance radars then in service with the PLAN, this radar improved detection accuracy while maintaining detection range and could transmit air situation data via the ship’s combat command system and data links. However, due to its large antenna size, and its effective range barely met requirements, LJQ-518 was only installed on two Type 052 guided-missile destroyers as a transitional solution.

LJQ-520=H/LJQ-520|The H/LJQ-520 radar is a 3D long-range air-search radar operating in the VHF band, primarily tasked with long-range surveillance of medium- and high-altitude airspace. Compared to traditional meter-wave radars, this radar employs super-resolution technology and offers higher detection accuracy.

LJG-346=H/LJG-346|The H/LJG-346 "Sea Star" is a large dual-band active electronically scanned array (AESA) radar system that operates in S-band for search and tracking functions, while utilizing C-band for missile guidance purposes. Installed on the Type 052C destroyer, this sophisticated system comprises four radar arrays, each employing a hydrostatic ventilation cooling mechanism. Each array consists of a central S-band panel flanked by C-band panels positioned above and below, with the S-band array alone containing more than 5,000 transmit/receive modules. The system has an impressive maximum detection range of approximately 450 kilometers. When integrated with the H/ZKJ-5 digital automatic command and control system, the radar demonstrates advanced operational capabilities. It can simultaneously track more than 100 aerial targets while automatically evaluating and prioritizing threats. The system then generates engagement commands, directing HHQ-9B surface-to-air missiles to intercept the most critical threats.

LJQ-36X=H/LJQ-36X radar|The H/LJQ-36X radar is a new dual-band, ultra-low-altitude/surface search radar employing an Active Electronically Scanned Array (AESA) array. It operates in the X-band (for ultra-low altitude search) and I-band (for surface search). Primarily designed to address the blind zones of the H/LJG-346A radar in detecting close-range, sea-skimming targets, it is integrated with the integrated mast system. This radar can also provide target parameters to close-in weapon systems (CIWS).

LJG-346A=H/LJG-346A|The H/LJG-346 "Sea Star" radar is the first large dual-band active electronically scanned array (AESA) radar system deployed by the Chinese Navy, operating in S-band (for search/tracking) and C-band (for guidance). The upgraded H/LJG-346A variant features enhanced detection capabilities and improved thermal management. The system comprises four radar arrays cooled by liquid cooling circuits. Each array consists of a central S-band panel flanked by elongated C-band panels above and below. A single S-band array contains over 5,000 transmit/receive (T/R) modules, with a maximum detection range exceeding 500 kilometers. Integrated with a new-generation digital automated command-and-control system, the radar can simultaneously track hundreds of aerial targets, automatically identify and assess threat levels, assign engagement priorities, and guide HHQ-9 series surface-to-air missiles to engage the highest-priority threats.

