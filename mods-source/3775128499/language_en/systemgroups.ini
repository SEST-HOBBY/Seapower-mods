LJQ-366=H/LJQ-366 radar|The H/LJQ-366 is a surface search radar derived from the Russian "Mineral-ME" radar system acquired in the 1990s. This versatile radar features both active and passive operational modes, capable of functioning across five distinct frequency bands. When utilizing atmospheric ducting effects, it possesses over-the-horizon detection capabilities. On Type 054A frigates, the H/LJQ-366 primarily serves to provide targeting parameters for YJ-83 anti-ship missiles, and data can be shared via datalink to other combat units.

LJQ-366=H/LJQ-366 radar|The H/LJQ-366 is a surface search radar derived from the Russian "Mineral-ME" radar system acquired in the 1990s. This versatile radar features both active and passive operational modes, capable of functioning across five distinct frequency bands. When utilizing atmospheric ducting effects, it possesses over-the-horizon detection capabilities. On Type 052C destroyers, the H/LJQ-366 primarily serves to provide targeting parameters for YJ-62 anti-ship missiles, and data can be shared via datalink to other combat units.

LJQ-366_Passive_ESM=ESM for Type366 radar|The H/LJQ-366 is a surface search radar derived from the Russian "Mineral-ME" radar system acquired in the 1990s. This versatile radar features both active and passive operational modes, capable of functioning across five distinct frequency bands. When utilizing atmospheric ducting effects, it possesses over-the-horizon detection capabilities. On Type 052C destroyers, the H/LJQ-366 primarily serves to provide targeting parameters for YJ-62 anti-ship missiles, and data can be shared via datalink to other combat units.

LJQ-3XX=H/LJQ-3XX radar|The H/LJQ-3XX is a new-generation L-band surface search radar capable of operating in both active and passive modes, providing target indication for ship-launched anti-ship missiles.

