[plan_type_051c]
Type=DDG,Destroyer
Default=Type 051C,Type 051C
DefaultDescription=The Type 051C guided-missile destroyer is a class of air defence destroyers commissioned by the PLA Navy in the 2000s. Based on the hull and propulsion system design of the Type 051B destroyer, it is equipped with the Russian-made Rif-M surface-to-air missile system to fill the gap of fleet area air defence capabilities. A total of two vessels of this class were built: the 115 Shenyang, commissioned in 2006, and the 116 Shi Jiazhuang, commissioned in 2007. The construction plan for this class of vessels was intended to serve as a backup for the Type 052C guided-missile destroyer and the HHQ-9 SAM system, which were still under trials at the time. In the event that the development of the Type 052C encountered setbacks, these two Type 051C destroyers would assume their operational roles.
Variant1=Shenyang (115),051C
Variant2=Shijiazhuang (116),051C

[plan_type_051b_1997]
Type=DDG,Destroyer
Default=Type 051B,Type 051B
DefaultDescription=The Type 051B is a guided-missile destroyer commissioned by the PLAN in the late 1990s. This vessel represented another attempt by the PLAN to independently design and construct a modern large destroyer following the Type 052 destroyer. Due to the fiscal policy at the time, which prioritised socio-economic development over the modernisation of the military, the Type 051B destroyer was initially approved as a modernization programme of the Type 051 destroyer. Although it retained the Type 051 designation, it bore almost no resemblance to the Type 051, with the exception of the propulsion system. Due to western technology embargoes against China in the 1990s and setbacks in the independent development of naval gas turbines, the Type 051B continued to use steam turbines as its propulsion system. The Type 051B boldly adopted a sleek, streamlined stealth design, with its weapon and electronic systems largely incorporating proven equipment from the Type 052 destroyers. Only one Type 051B was built; it entered service in 1999 and was named PLANS Shenzhen, hull number 167. For a considerable amount of time, the Shenzhen was the PLAN's largest surface combatant by displacement. It embarked on numerous international visits and military exercises, earning the title of ‘China's Premier Warship’.
Variant1=Shenzhen (167),051B

[plan_type_051b_2017]
Type=DDG,Destroyer
Default=Type 051B,Type 051B
DefaultDescription=The Type 051B is a guided-missile destroyer commissioned by the PLAN in the late 1990s. This vessel represented another attempt by the PLAN to independently design and construct a modern large destroyer following the Type 052 destroyer. Due to the fiscal policy at the time, which prioritised socio-economic development over the modernisation of the military, the Type 051B destroyer was initially approved as a modernization programme of the Type 051 destroyer. Although it retained the Type 051 designation, it bore almost no resemblance to the Type 051, with the exception of the propulsion system. Due to western technology embargoes against China in the 1990s and setbacks in the independent development of naval gas turbines, the Type 051B continued to use steam turbines as its propulsion system. The Type 051B boldly adopted a sleek, streamlined stealth design, with its weapon and electronic systems largely incorporating proven equipment from the Type 052 destroyers. Only one Type 051B was built; it entered service in 1999 and was named PLANS Shenzhen, hull number 167. For a considerable period, the Shenzhen was the PLAN's largest surface combatant by displacement. It embarked on numerous international visits and military exercises, earning the title of ‘China's Premier Warship’. In 2017 the vessel undergone its MLU, with massive upgrades to its sensor suite for enhanced situational awareness, received 32-cell HQ-16 SAM system, and YJ-12A anti-ship missiles.
Variant1=Shenzhen (167),051B

[plan_type_052b_2004]
Type=DDG,Destroyer
Default=Type 052B,Type 052B
DefaultDescription=The Type 052B guided-missile destroyer is a class of guided-missile destroyers commissioned by the People's Liberation Army Navy in the early 2000s. This class represents the PLAN’s attempt to independently design and build modern destroyers using Russian-origined shipborne sensors and the “Shtil” surface-to-air missile system, following the introduction of Russian Sovremenny-class guided-missile destroyers. A total of two ships of this class were built by the Jiangnan Shipyard in Shanghai, both commissioned in 2004 and deployed to the South Sea Fleet: the 168 Guangzhou and the 169 Wuhan. After entering service, these two ships, together with two Type 052C destroyers, formed the so-called “Four Greats of Jiangnan.” This class was intended to address the PLAN’s lack of areial air defense capabilities in the new century by utilizing Russian-sourced equipment; it was also the PLAN’s first independently designed and constructed destroyer capable of areial air defense. The class validated the hull and propulsion designs for subsequent Type 052C/D destroyers and served as the pioneering model for China’s third-generation domestically produced destroyer designs.
Variant1=Guangzhou (168),052B
Variant2=Wuhan (169),052B

[plan_type_052b_2019]
