Default=Type 052B,Type 052B
DefaultDescription=The Type 052B guided-missile destroyer is a class of guided-missile destroyers commissioned by the People's Liberation Army Navy in the early 2000s. This class represents the PLAN’s attempt to independently design and build modern destroyers using Russian-origined shipborne sensors and the “Shtil” surface-to-air missile system, following the introduction of Russian Sovremenny-class guided-missile destroyers. A total of two ships of this class were built by the Jiangnan Shipyard in Shanghai, both commissioned in 2004 and deployed to the South Sea Fleet: the 168 Guangzhou and the 169 Wuhan. After entering service, these two ships, together with two Type 052C destroyers, formed the so-called “Four Greats of Jiangnan.” This class was intended to address the PLAN’s lack of areial air defense capabilities in the new century by utilizing Russian-sourced equipment; it was also the PLAN’s first independently designed and constructed destroyer capable of areial air defense. The class validated the hull and propulsion designs for subsequent Type 052C/D destroyers and served as the pioneering model for China’s third-generation domestically produced destroyer designs. Both Type 052B destroyers have undergone their MLU and have received 32-cell H/AJK-16 VLS system with HQ-16 SAM, coupled with AESA illuminators that have significantly boosted their AAW capabilities.
Variant1=Guangzhou (168),052B
