[plan_type_052_2004]
Type=DDG,Destroyer
Default=Type 052,Type 052
DefaultDescription=The Type 052 guided-missile destroyer is a second-generation missile destroyer designed and built by China in the 1980s. It is also the PLAN’s first modern destroyer equipped with basic integrated air defense, anti-ship, and anti-submarine warfare capabilities. Because the ship’s propulsion, communications, and acoustic subsystems relied heavily on imported equipment, only two vessels were constructed: the 112 Harbin and the 113 Qingdao. The Type 052 guided-missile destroyer represented the PLAN’s first attempt to build modern, large-scale surface combatants using advanced imported equipment. For the first time, the ship’s sensors and weapon systems were integrated into a comprehensive combat command system, enabling basic digital command and control and significantly enhancing the vessel’s situational awareness and fleet coordination capabilities. The Type 052 guided-missile destroyer marked a pivotal turning point in the PLAN’s transition toward a modern, information-based navy. The experience gained from the design, construction, and commissioning of these ships served as the foundation for the PLAN’s next generation of surface vessels capable of comprehensive operations in the far seas.
Variant1=Haerbin (112),052
Variant2=Qingdao (113),052

