DefaultDescription=The Type 056A light missile frigate is a multipurpose light frigate commissioned by the PLAN in the 2010s. Developed from the Type 056 frigate, it is primarily intended to replace the Type 056 frigates, Type 053 frigates, and Type 037 ASW corvettes, undertaking coastal patrol and anti-submarine missions. This class of ship is equipped with a low-frequency passive towed sonar and an active/passive variable-depth towed sonar (VDS). It can carry Yu-11 long-range rocket-assisted torpedoes and possesses anti-submarine warfare capabilities comparable to those of large and medium-sized surface combatants.
