Type=SS,Patrol Submarine
Default=Type 039A,Type 039A
DefaultDescription=The Type 039A/B submarines are China’s second-generation conventional-powered submarines commissioned in 2006. They are also the country’s first conventional submarines equipped with AIP system. Adopting a double-hull teardrop design with an underwater displacement of 3,600 tons, they feature third-generation anechoic tiles, seven-bladed skewed propellers and other technologies, resulting in an underwater noise level below 120 dB. Powered by domestic Stirling engines, the submarines can conduct continuous underwater cruising for weeks. They are equipped with a domestic digital integrated hull sonar and a large apeture LF passive flank array, along with six 533mm bow torpedo tubes capable of launching various heavyweight torpedoes and submarine-launched cruise missiles. With a range of approximately 5,000 nautical miles and a maximum underwater speed of 22 knots, the Type 039A/B can perform coastal patrols and deep-ocean ASW/ADA2 missions, serving as the mainstay of PLAN submarine force.
