[AmmunitionNames]

# ------------------ AAM ------------------

# ------------------ SAM ------------------
plan_hhq-7=HHQ-7,SAM,AAW,The HHQ-7 is a Chinese short-range semi-active radar-guided surface-to-air missile, and is a domestically produced version of the French Thomson-TSF ‘Crotale’ SAM. The missile is launched from an 8-cell H/AJK-02 launcher and guided by the LJP-345 fire-control radar. It is relatively effective against sea-skimming targets, but has a short range and lacks the capability to withstand saturation attacks. The H/AJK-02 launcher can be reloaded once via an automatic reloading system.

plan_hq-10=HQ-10,,SAM,The HQ-10 is a short-range point air defense missile system developed by China. Together with close-in weapon systems (CIWS), it forms the inner-layer defense network of surface vessels. Deployed aboard the PLAN's major surface combatants such as the Type 054A and Type 056A guided-missile frigates, as well as the Type 052D and Type 055 guided-missile destroyers, the missile employs a composite guidance system combining radio frequency (RF) seeker and infrared (IR) homing. With short launch intervals and rapid reaction capabilities, it can effectively intercept various low-altitude sea-skimming threats. The system features a modular design that supports at-sea reloading, ensuring sustained defensive performance against continuous attacks.

plan_hq-10a=HQ-10A,,SAM,The HQ-10 is a short-range point air defense missile system developed by China. Together with close-in weapon systems (CIWS), it forms the inner-layer defense network of surface vessels. Deployed aboard the People's Liberation Army Navy's major surface combatants such as the Type 054A and Type 056A guided-missile frigates, as well as the Type 052D and Type 055 guided-missile destroyers, the missile employs a composite guidance system combining radio frequency (RF) seeker and infrared (IR) homing. With short launch intervals and rapid reaction capabilities, it can effectively intercept various low-altitude sea-skimming threats. The system features a modular design that supports at-sea reloading, ensuring sustained defensive performance against continuous attacks. The HQ-10A is the latest improved variant.

plan_hq-16=HQ-16,SAM,AAW,The HQ-16 is a Chinese medium-range SAM system, typically integrated with the H/AJK-16 vertical launch system (VLS). The HQ-16 is mainly equipped with PLAN Type 054A frigates and older generation destroyers after MLU. The missile utilizes a vertical hot-launch method and semi-active radar guidance. It can effectively intercept aircraft, cruise missiles, and sea-skimming anti-ship missiles, forming the medium-range air defense layer with surface task forces. Together with the long-range HHQ-9 SAM system, it provides layered fleet air defense and self-protection for blue-water operations.

plan_hq-16c=HQ-16C,SAM,AAW,The HQ-16C is a Chinese medium-range SAM system, typically integrated with the H/AJK-16 vertical launch system (VLS). The HQ-16C is mainly equipped with PLAN Type 054A frigates and older generation destroyers after MLU. The missile utilizes a vertical hot-launch method and active radar guidance in terminal phase. It can effectively intercept aircraft, cruise missiles, and sea-skimming anti-ship missiles, forming the medium-range air defense layer with surface task forces. Together with the long-range HHQ-9 SAM system, it provides layered fleet air defense and self-protection for blue-water operations.

plan_hhq-9b=HHQ-9B,SAM,AAW, The HHQ-9B is a long-range naval surface-to-air missile (SAM) independently developed by China. As a shipborne variant of the land-based HQ-9 missile, it equips the People's Liberation Army Navy (PLAN)'s Type 052C, Type 052D, and Type 055 guided-missile destroyers, serving as a critical asset for fleet area air defense missions. The missile employs a cold-launch vertical firing system with thrust-vectoring capability. During mid-course in flight, it utilizes radio-command/ strapdown inertial guidance, while terminal guidance is achieved via an active radar seeker. The HHQ-9B features superior electronic counter-countermeasures (ECCM) performance and anti-saturation strike capability, enabling effective engagement of supersonic sea-skimming threats. Additionally, it possesses limited ballistic missile defense capability.

plan_hhq-9c=HHQ-9C,SAM,AAW/BMD, The HHQ-9C is a new-generation medium-to-long-range naval surface-to-air missile developed by China. Deployed aboard PLAN's Type 052D and Type 055 guided-missile destroyers, it serves as a core component of the fleet's medium-to-long-range aera anti-missile defense. The HHQ-9C features a reduced size in diameter and is equipped with a solid rocket booster and rocket attitude control engines(RCS), enabling it to effectively intercept various types of cruise missiles and ballistic missile targets. The missile is compatible with the HT-1 universal vertical launch system and employs a "one-cell-two-missiles" configuration, significantly enhancing the fleet's capability to withstand saturation attacks.
plan_9m38=9M38,SAM,AAW,The 9M38 missile is the naval variant of the 9K37 “Buk” SAM and forms part of the “Shitil” SAM system, which is deployed on Sovremenny-class guided-missile destroyers. The missile provides basic area air defense capabilities and is launched from a arm launcher; it is capable of engaging aircraft and missile targets, but lacks sufficient capability to counter sea-skimming targets.
plan_9m317=9M317,SAM,AAW,The 9M317 is an upgraded version of the 9M38 missile; it offers increased range while being capable of engaging faster incoming targets, and its effectiveness against sea-skimming targets has been significantly improved.
plan_48n6e1=48N6E1,SAM,AAW,The 48N6E1 surface-to-air missile forms part of Russia’s ‘Rif-M’ SAM system; it is an upgraded version of the 5V55R interceptor from the S-300F surface-to-air missile system, with improvements to both maximum range and minimum engagement altitude. This medium-to-long-range SAM is guided by the ship-mounted 30N6E1 phased-array fire-control radar using TVM guidance. It is capable of effectively intercepting sea-skimming targets and possesses limited capability to intercept tactical ballistic missiles.

# ---------- Anti-radar Missiles ---------

# ---------- Anti-ship Missiles ----------

plan_yj-9=YJ-9,,AGM, The YJ-9 is a lightweight air-launched anti-ship missile developed by China, primarily designed for shipborne helicopter to carry out close-range anti-ship missions. The missile employs terminal active radar homing, enabling it to effectively engage small surface vessels such as missile boats and patrol craft.

plan_yj-12a=YJ-12A,Cruise Missile,ASuW,The YJ-12 is a supersonic, long-range anti-ship cruise missile developed by China. It employs a two-speed system, with a lower speed for low-altitude cruise and a high speed (Mach 4) for terminal breakthrough. It utilizes a composite guidance system and can perform evasive maneuvers to avoid air defense fire during the terminal phase, offering strong resistance to jamming.

plan_yj-62=YJ-62,Cruise Missile,ASuW, The YJ-62 is a subsonic, long-range anti-ship cruise missile independently developed by China. Designed by the China Aerospace Science and Industry Corporation (CASIC), it entered service in the mid-2000s and is primarily deployed on Type 052C guided missile destroyers, H-6G/K bombers, and coastal defense units. The missile utilizes Oblique launch methods. The mid-course guidance is provided by Inertial Navigation System (INS) + GPS correction, while in the terminal phase it is guided by an active radar homing seeker. The missile keeps a sea-skimming profile throughout the whole flight. As the PLAN's first heavy anti-ship weapon with beyond-visual-range precision strike capability, this missile represents a major milestone in China's naval strike capabilities, enabling effective engagement of hostile surface combatants at extended ranges.

plan_yj-83=YJ-83,Cruise Missile,ASuW,The YJ-83 is a subsonic anti-ship cruise missile developed by China. It features a turbojet engine and foldable wings, allowing flexible deployment from surface vessels, aircraft, and coastal launchers. The missile employs active radar guidance in its terminal phase and performs sea-skimming maneavor at ultra-low altitudes. With high strike accuracy and strong ECCM capabilities, it serves as a key asset for the PLAN's medium-to-short-range ASuW operations.

plan_yj-83a=YJ-83A,Cruise Missile,ASuW,The YJ-83A is a subsonic anti-ship cruise missile developed by China. It features a turbojet engine and foldable wings, allowing flexible deployment from surface vessels, aircraft, and coastal launchers. The missile employs active radar & IR-imaging dual-mode guidance in its terminal phase and performs sea-skimming maneavor at ultra-low altitudes. With high strike accuracy and strong ECCM capabilities, it serves as a key asset for the PLAN's medium-to-short-range ASuW operations.

plan_yj-18=YJ-18,Cruise Missile,ASuW,The YJ-18 is a long-range anti-ship cruise missile developed by China utilizing technology derived from the Russian 3M54E "Klub" cruise missile. It exists in two variants: the YJ-18 submarine-launched version and the YJ-18A ship-based vertical launch version. The YJ-18 is the standard torpedo tube missile for PLAN submarine force， equipped by the Type 039A/B SSK and Type 093 SSN. The missile follows a sea-skimming flight trajectory at ultra-low altitude, employing a composite flight profile with subsonic cruise and supersonic terminal dash phases. This design gives it both long range and high penetration capability through enemy air defences.

plan_yj-18a=YJ-18A,Cruise Missile,ASuW,The YJ-18 is a long-range anti-ship cruise missile developed by China utilizing technology derived from the Russian 3M54E "Klub" cruise missile. It exists in two variants: the YJ-18 submarine-launched version and the YJ-18A ship-based vertical launch version. The YJ-18A is compatible with the HT-1 naval universal vertical launch system and is deployed aboard the People's Liberation Army Navy's Type 052D and Type 055 guided-missile destroyers. The missile follows a sea-skimming flight trajectory at ultra-low altitude, employing a composite flight profile with subsonic cruise and supersonic terminal dash phases. This design gives it both long range and high penetration capability through enemy air defences.

plan_yj-18c=YJ-18C,Cruise Missile,Land Attack,The YJ-18C cruise missile is a long-range cruise missile developed by China. The missile features a stealth design and is primarily used to strike fixed ground targets; it can be loaded and launched from a ship-based universal vertical launch system.

plan_yj-19=YJ-19,HCM,ASuW,The YJ-19 is the new generation submarine-launched anti-ship missile developed by China. It is speculated to be launched from torpedo tubes, replacing the YJ-18 missile. The missile is equipped with an air-breathing scramjet engine, which provides it with sustained high-altitude, high-speed maneuverability. Even without a vertical launch system, conventional submarines can rely on the YJ-19 to gain powerful long-range areial-denial and anti-ship capabilities.

plan_yj-20=YJ-20,ASBM,ASuW,The YJ-20 is a new-generation hypersonic anti-ship missile developed by China. Compatible with the HT-1 (naval vertical launch system, it is deployed aboard the PLAN's Type 052D and Type 055 guided-missile destroyers. The missile features a biconic vehicle design and is vertically launched, following a hypersonic glide trajectory. Characterized by its very long range, potent destructive power, and exceptional penetration capability through enemy air defences, it serves as a critical weapon system in establishing maritime anti-access/area denial (A2/AD) operational capabilities.

plan_yj-17=YJ-17,ASBM,ASuW,The YJ-17 is a new-generation hypersonic anti-ship missile developed by China. Compatible with the HT-1 naval vertical launch system, it is deployed aboard the PLAN's Type 052D and Type 055 guided-missile destroyers. The missile employs a boost-glide waverider configuration, is vertically launched, and follows a hypersonic glide trajectory. Characterized by its very long range, high maneuverability, and exceptional penetration capability through enemy air defences, it is a critical weapon system for establishing maritime anti-access/area denial (A2/AD) operational capabilities.

#-----------Land Strike only missiles---------
plan_cj-10=CJ-10,Cruise Missile,Land Attack,The CJ-10 is a long-range land-attack cruise missile developed by China. Compatible with the HT-1 naval vertical launch system, it is deployed aboard the PLAN's Type 052D and Type 055 guided-missile destroyers. The missile features extended range and high precision, capable of ultra-low-altitude flight, deep penetration, and sequential strikes. It serves as a critical component of the PLAN's long-range ground strike capabilities.

plan_cj-20=CJ-20,Cruise Missile,Land Attack,The CJ-20 is a new-generation universal long-range land-attack cruise missile developed by China. The weapon is compatible with the HT-1 naval vertical launch system and ground-based transporter-erector-launchers (TELs), it can also be carried by H-6 bombers. Deployed aboard the PLAN's Type 052D and Type 055 guided-missile destroyers, the missile features extended range and high precision, with capabilities for ultra-low-altitude flight, deep penetration, and sequential strikes. It is a key component of the Navy's long-range ground strike arsenal.

# ---------- Anti-sub Missiles ----------
plan_yu-8=Yu-8,,ASWCM,Yu-8 is China's independently developed rocket-assisted torpedo (also classified as an anti-submarine missile). It is compatible with both the H/AJK-16 and HT-1 naval vertical launch systems, and is deployed aboard the PLA Navy's Type 054A guided-missile frigates, as well as Type 052D and Type 055 guided-missile destroyers. The system employs a vertical launch rocket booster that delivers a Yu-7C lightweight anti-submarine torpedo as its warhead for terminal autonomous engagement. Characterized by rapid reaction capability and extended range, it serves as a core component of the navy's blue-water anti-submarine warfare capabilities.

plan_yu-11=Yu-11,,ASWCM,The Yu-11 is a Chinese-developed rocket-assisted anti-submarine torpedo that shares the same tilted launchers as the YJ-83 anti-ship missile; it is primarily deployed on Type 056A missile frigates. The weapon employs a solid rocket booster, a cruise missile carrier that flies at low altitude, and followed by a lightweight torpedo that conducts autonomous strike in the terminal phase; its warhead consists of a single Yu-7 lightweight anti-submarine torpedo. The weapon is characterized by its rapid response time and long range.

plan_yu-15=Yu-15,,ASWCM,The Yu-15 is the latest generation of rocket-assisted anti-submarine missile (also classified as an advanced anti-submarine warfare system) equipped by the PLAN. It is compatible with the HT-1 naval vertical launch systems, and is deployed aboard the PLAN's Type 052D and Type 055 guided-missile destroyers. The system employs vertical launch capability and follows a low-altitude cruise missile-like flight profile before deploying a Yu-12 lightweight anti-submarine torpedo as its warhead for terminal autonomous engagement. Characterized by rapid reaction capability and extended operational range, it serves as a core component of the navy's blue-water anti-submarine warfare capabilities.

# ------------------ RBU ------------------
plan_rgb-81=FQF-3200,RBU,ASW/ASuW,The FQF-3200 is a rocket depth charge (RBU) system developed by China. The system primarily consists of the H/WHH-003 launcher, Type 81 rocket depth charge, and acoustic fire control system. It can be integrated with the ship's acoustic countermeasure system to engage close-range underwater targets and incoming torpedoes.
plan_rbu2000=FQF-2000,RBU,ASW/ASuW,The RJZ-726-4 Multifunction Launcher can fire 173mm-caliber rocket depth charges and, in conjunction with an acoustic countermeasures system, engage underwater submarines or torpedo targets.
# --------------- Torpedoes ---------------

plan_yu-6=Yu-6,Thermal,Dual-use,The Yu-6 is China's first heavyweight torpedo with thermal power and pump-jet propulsion. It features high speed, deep-water, and long-range capability. The weapon utilizes a dual-speed system, adopting OTTO II composite fuel, a swashplate piston engine and pump-jet propulsion. Equipped with combined wire-guided and acoustic homing guidance, it can effectively strike various surface and underwater targets. The performance of the Yu-6 is roughly equivalent to that of the U.S. Navy's Mk.48 Mod 5 torpedo.

plan_yu-6a=Yu-6A,Thermal,Dual-use,The Yu-6A torpedo is a thermal heavyweight torpedo developed by China. Based on the Yu-6, it features enhanced seeker performance, adopts fiber optic wire guidance, and incorporates a 28-knot low-noise cruising mode.

plan_yu-6b=Yu-6B,Thermal,Dual-use,The Yu-6B torpedo is a thermal heavyweight torpedo developed by China. Based on the Yu-6, it features enhanced seeker performance and adopts fiber optic wire guidance. The torpedo is powered by a composite fuel with OTTO II and HAP additives, which enables extended range and enhanced speed performance.


plan_yu-7c_air=Y-7C,,ASW, Yu-7C is a lightweight ASW torpedo developed by China based on licensed production of the American Mk46 Mod 2 torpedo. In 1978, Chinese militia recovered a US Mk46 Mod 1 Phase 2 torpedo in the South China Sea, which was subsequently studied and reverse-engineered by Chinese defense research institutions. In 1985, China and the United States reached an agreement, under which the US provided complete technical documentation, production equipment, and testing facilities to enable licensed production of the Mk46 Mod 2 torpedo in China. Through this technology transfer, China established its own RnD and production system for lightweight ASW torpedoes. The domestically produced version was designated as the Yu-7 torpedo. The Yu-7C represents an improved variant featuring enhanced propulsion efficiency and upgraded homing system performance, with capabilities roughly equivalent to the Mk46 Mod 5(SW).

plan_yu-7_ship=Yu-7,Torpedo,ASW,The Yu-7 is a light-weight ASW torpedo developed by China based on licensed production of the American Mk46 Mod 2 torpedo. In 1978, Chinese militia recovered a US Mk46 Mod 1 Phase 2 torpedo in the South China Sea, which was subsequently studied and reverse-engineered by Chinese defense research institutions. In 1985, China and the United States reached an agreement, under which the US provided complete technical documentation, production equipment, and testing facilities to enable licensed production of the Mk46 Mod 2 torpedo in China. Through this technology transfer, China established its own RnD and production system for lightweight ASW torpedoes. The domestically produced version was designated as the Yu-7 torpedo.

plan_yu-7c_ship=Yu-7C,Torpedo,ASW,The Yu-7C is a light-weight ASW torpedo developed by China based on licensed production of the American Mk46 Mod 2 torpedo. In 1978, Chinese militia recovered a US Mk46 Mod 1 Phase 2 torpedo in the South China Sea, which was subsequently studied and reverse-engineered by Chinese defense research institutions. In 1985, China and the United States reached an agreement, under which the US provided complete technical documentation, production equipment, and testing facilities to enable licensed production of the Mk46 Mod 2 torpedo in China. Through this technology transfer, China established its own RnD and production system for lightweight ASW torpedoes. The domestically produced version was designated as the Yu-7 torpedo. The Yu-7C represents an improved variant featuring enhanced propulsion efficiency and upgraded homing system performance, with capabilities roughly equivalent to the Mk46 Mod 5(SW).

plan_yu-7c_yu-8=Yu-7C,,ASW,The Yu-7C is a light-weight ASW torpedo developed by China based on licensed production of the American Mk46 Mod 2 torpedo. In 1978, Chinese militia recovered a US Mk46 Mod 1 Phase 2 torpedo in the South China Sea, which was subsequently studied and reverse-engineered by Chinese defense research institutions. In 1985, China and the United States reached an agreement, under which the US provided complete technical documentation, production equipment, and testing facilities to enable licensed production of the Mk46 Mod 2 torpedo in China. Through this technology transfer, China established its own RnD and production system for lightweight ASW torpedoes. The domestically produced version was designated as the Yu-7 torpedo. The Yu-7C represents an improved variant featuring enhanced propulsion efficiency and upgraded homing system performance, with capabilities roughly equivalent to the Mk46 Mod 5(SW).

plan_yu-9=Yu-9,Electric,Dual-use,The Yu-9 is an electric heavyweight torpedo developed by China, featuring non-cavitation propellers, vibration/noise reduction, and dual-speed operation. At 25 knots (cruise), it offers a very low noise signiture close to ocean background noise; terminal phase acceleration to 42 knots enhances target interception. With combined wire and acoustic homing guidance, it enables effective stealth attack capabilities.​

plan_yu-10=Yu-10,Thermal,Dual-use,The Yu-10 is a new-generation dual-use heavyweight torpedo independently developed by China. It adopts advanced vibration isolation and noise reduction technologies, paired with a specifically designed propeller for ultra-quiet propulsion, integrating long range, high speed and low noise features. The torpedo is capable of maintaining quiet operation across all speed ranges, with comprehensively improved guidance accuracy and anti-jamming performance, making it a powerful weapon for pre-emptive stealth strikes. The torpedo is also capable of quiet launching.

plan_yu-12_ship=Yu-12,Torpedo,ASW,The Yu-12 is China's latest generation of universal lightweight anti-submarine torpedo. It can be launched from shipborne torpedo launchers, anti-submarine helicopters, fixed-wing maritime patrol aircraft, and anti-submarine missiles. The torpedo employs a thermal-powered pump-jet propulsion system and is equipped with a new-generation active/passive acoustic homing seeker. Characterized by extended range, high speed, strong countermeasure resistance, and excellent platform adaptability, it represents a significant advancement in China's anti-submarine warfare capabilities.

plan_yu-12_air=Yu-12,Torpedo,ASW,The Yu-12 is China's latest generation of universal lightweight anti-submarine torpedo. It can be launched from shipborne torpedo launchers, anti-submarine helicopters, fixed-wing maritime patrol aircraft, and anti-submarine missiles. The torpedo employs a thermal-powered pump-jet propulsion system and is equipped with a new-generation active/passive acoustic homing seeker. Characterized by extended range, high speed, strong countermeasure resistance, and excellent platform adaptability, it represents a significant advancement in China's anti-submarine warfare capabilities.

plan_mss-01=MSS-01,MOSS,Acoustic Decoy,The MSS-01 is a self-propelled submarine acoustic decoy developed by China. It can simulate submarine acoustic characteristics across multiple frequency bands, jamming enemy underwater acoustic sensors and torpedo seekers. Featuring wire-guided control and a low-noise launch design, it enables submarines to conduct deceptive tactics against enemy ASW forces.


