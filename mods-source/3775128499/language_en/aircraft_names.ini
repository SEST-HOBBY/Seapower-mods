[plan_ka-28]
Type=ASW Helicopter
Default=Ka-28,Ka-28
DefaultDescription=The Ka-28 ASW helicopter is an export variant of the Soviet Ka-27PL helicopter. The PLAN introduced the Ka-28 in the early 1990s as shipborne helicopter complement for its Sovremenny-class guided-missile destroyers, and it remains in service to this day. In addition to the four Sovremenny-class destroyers acquired from Russia, this helicopter has also been deployed on Type 052B and Type 052C guided-missile destroyers, as well as Type 054 guided-missile frigates. The Ka-28 helicopters in service with the PLAN are still equipped with original Russian-made search radars, dipping sonars, sonobuoys, and light ASW torpedoes, and have not undergone any upgrades or modifications. In the 1990s and early 2000s, it was once the PLAN’s main ship-borne ASW helicopter due to its integrated search and attack capabilities. However, with the introduction of the Z-9C and Z-9F, as well as the aging of its onboard equipment, its performance has gradually become outdated. Today, it is used solely for maritime search and rescue missions.
Squadron1=Ka-28,Ka-28
Callsigns=Squadron1,Sea Conch

[plan_ka-31]
Type=AEW Helicopter
Default=Ka-31,Ka-31
DefaultDescription=The Ka-31 helicopter is a maritime AEW helicopter in service with the Russian Navy. Developed by Kamov Design Bureau Joint Stock Company as an improvement over the Ka-29, it is deployed aboard the Russian aircraft carrier Kuznetsov. In addition to serving as a carrier-based aircraft, the helicopter can also be deployed on cruisers, destroyers, and frigates, or used as a shore-based early warning platform. The PLAN introduced the Ka-31 helicopter in the early 2010s. It is primarily deployed on Type 052C missile destroyers and Russian-built Sovremenny-class missile destroyers, where it performs beyond-line-of-sight search and guidance missions for anti-ship cruise missiles, as well as low-altitude surveillance duties.
Squadron1=Ka-31,Ka-31
Callsigns=Squadron1,Sea Conch

[plan_z-9f_(2020)]
Type=ASW Helicopter
Default=Z-9F (2025),Z-9F
DefaultDescription=The Z-9F is a light multi-purpose shipborne helicopter operated by the PLANAF, capable of performing anti-submarine, anti-ship, transport, and search-and-rescue (SAR) missions. The Z-9F is a light anti-submarine helicopter developed from the Z-9D and equipped with an active phased-array surface search radar. With a new engine and a lightweight airframe design, the Z-9F overcomes the limitations of its predecessor, the Z-9C anti-submarine helicopter. It can simultaneously carry a dipping sonar and a lightweight ASW torpedo, enabling integrated submarine search and attack operations without the need for a two-ship coordination. However, due to the Z-9’s maximum takeoff weight limitation, it can carry only one ASW torpedo.
Squadron1=Z-9F,Z-9F
Callsigns=Squadron1,Dragonfly

[plan_z-9c]
Type=ASW Helicopter
Default=Z-9C,Z-9C
DefaultDescription=The Z-9C helicopter is a light ship-based ASW helicopter developed in the 1980s based on the design of the French “Panther” helicopter (AS.565) and equipped with domestically produced avionics. It is the second-generation ASW helicopter in service with the PLAN and is equipped with surface search radar and an dipping sonar. Due to limitations in airframe size and maximum takeoff weight, the helicopter is not equipped with sonobuoys. Also due to weight restrictions, it cannot carry both dipping sonar and ASW torpedoes simultaneously; therefore, ASW search and attack operations must be carried out cooperatively by two helicopters, one carrying the dipping sonar and the other carrying the ASW torpedoes.
Squadron1=Z-9C,Z-9C
Callsigns=Squadron1,Dragonfly

[plan_z-9d]
Type=Utility Helicopter
Default=Z-9D,Z-9D
DefaultDescription=The Z-9D is a light multi-purpose shipborne helicopter operated by the PLANAF, capable of performing recon, anti-ship, transport, and search-and-rescue (SAR) missions. The Z-9D is an anti-ship variant of the Z-9 helicopter, primarily tasked with surface search, anti-ship strikes, and mid-course guidance for ship-launched anti-ship missiles.
Squadron1=Z-9D,Z-9D
Squadron2=Z-9D PLANAF College,Z-9D
Squadron3=Z-9D SAR,Z-9D
Callsigns=Squadron1,Dragonfly|Squadron2,Dragonfly|Squadron3,Dragonfly

[plan_z-9f]
Type=ASW Helicopter
Default=Z-9F,Z-9F
DefaultDescription=The Z-9F is a light multi-purpose shipborne helicopter operated by the PLANAF, capable of performing anti-submarine, anti-ship, transport, and search-and-rescue (SAR) missions. The Z-9F is a light anti-submarine helicopter developed from the Z-9D and equipped with an active phased-array surface search radar. With a new engine and a lightweight airframe design, the Z-9F overcomes the limitations of its predecessor, the Z-9C anti-submarine helicopter. It can simultaneously carry a dipping sonar and a lightweight ASW torpedo, enabling integrated submarine search and attack operations without the need for a two-ship coordination. However, due to the Z-9’s maximum takeoff weight limitation, it can carry only one ASW torpedo.
Squadron1=Z-9F,Z-9F
Callsigns=Squadron1,Dragonfly

[plan_z-20f]
Type=ASW Helicopter
Default=Z-20F,Z-20F
DefaultDescription=The Z-20F is a new-generation, 10-ton shipborne anti-submarine helicopter developed by China based on the Z-20 multipurpose helicopter platform; it is set to become PLAN’s fourth-generation shipborne ASW helicopter. Compared to the 4-ton Z-9 helicopter, the Z-20F features a longer range, longer endurance, and greater payload capacity. The helicopter is equipped with a surface search radar, integrated electro-optical observation systems, a dipping sonar, and 25 sonobuoys. It can also carry ASW torpedoes, guided depth charges, and light anti-ship missiles. While offering exceptional versatility, it significantly expands the range of area ASW operations for surface taskforces.
Squadron1=Z-20F,Z-20F
Callsigns=Squadron1,Sea Eagle

[plaaf_kj-500]
Type=AEW&C
Default=KJ-500,KJ-500
DefaultDescription=The KJ-500 is a medium AEW aircraft of the PLAAF. It integrates a digital active electronically scanned array (AESA) radar system, providing robust long-range detection and versatile command capabilities. The aircraft is capable of simultaneously tracking and identifying hundreds of air and sea targets while directing multiple fighter units in coordinated operations.
Squadron1=KJ-500 (PLAAF),KJ-500
Squadron2=KJ-500 (PLANAF),KJ-500
Callsigns=Squadron1,SkyNet|Squadron2,Nezha

[plaaf_y-9jz]
Type=Recon
Default=Y-9JZ,Y-9JZ
DefaultDescription=The Y-9JZ is a dedicated electronic intelligence reconnaissance (ELINT) aircraft operated by the Aviation Force of the People's Liberation Army Navy, modified from the Y-9 medium transport aircraft. Its onboard electronic reconnaissance system is capable of intercepting, identifying, locating, and analyzing electromagnetic signals across a wide frequency spectrum, including radar and communications. It possesses robust long-range maritime situational awareness and electronic warfare support capabilities. This aircraft significantly enhances the navy's intelligence support level in complex electromagnetic environments and serves as a crucial airborne information node for safeguarding national maritime rights and interests and executing far-sea combat missions.
Squadron1=Y-9JZ (PLANAF),Y-9JZ
Callsigns=Squadron1,Sea Gull

[plaaf_y-9dz]
Type=Recon
Default=Y-9DZ,Y-9DZ
DefaultDescription=The Y-9DZ is a dedicated electronic reconnaissance aircraft operated by the People's Liberation Army Air Force, developed based on the Y-9 medium transport platform. The most distinctive external features of this aircraft are the integration of advanced sensor systems, including large conformal array antennas, synthetic aperture radar, and electro-optical pods. At its core is a high-performance electronic reconnaissance and ground surveillance system, capable of long-range interception and analysis of electromagnetic signals across a wide frequency spectrum, as well as conducting high-resolution reconnaissance of ground targets. Its primary mission is to provide all-weather, around-the-clock intelligence support for the air force, playing a crucial role in strategic reconnaissance, battlefield surveillance, electronic warfare, and target designation. It is a key asset in the People's Air Force's efforts to build an informationized combat system and enhance long-range situational awareness and precision strike capabilities.
Squadron1=Y-9DZ,Y-9DZ
Callsigns=Squadron1,Phonenix

[plaaf_y-9lg]
Type=EW plane
Default=Y-9LG,Y-9LG
DefaultDescription=The Y-9LG is a dedicated electronic warfare and radar jamming aircraft of the PLAAF. The aircraft features a "balance beam" antenna, integrated with active phased array for high-power electronic jamming equipment. It is capable of detecting, analyzing, and suppressing enemy ground and airborne radar signals, effectively jamming air defense and early warning radars across multiple frequency bands. With characteristics such as long range, extended endurance, and strong jamming capabilities, the Y-9LG can accompany combat formations on offensive missions, carve out electromagnetic safe corridors during penetration operations.
Squadron1=Y-9LG,Y-9LG
Callsigns=Squadron1,Thunderer

[plan_y-8fq]
Type=Maritime Patrol,MPA
Default=Y-8FQ,Y-8FQ
DefaultDescription=The Y-8FQ is a four-engine, fixed-wing, shore-based anti-submarine patrol platform. It is also the first shore-based MPA aircraft commissioned by the Naval Aviation Force of the People's Liberation Army Navy, with its maiden flight conducted in 2011. Equipped with advanced maritime search radar, magnetic anomaly detector, sonobuoys and electronic reconnaissance systems, the aircraft boasts long-endurance and wide-area aerial patrol capabilities. It can carry ASW torpedoes, depth charges and other ordnance, enabling it to perform multiple missions such as maritime patrol and surveillance, submarine detection and attack, maritime search and rescue, and electronic reconnaissance. As a critical component of the PLAN's aviation ASW framework, the Y-8FQ effectively extends the operational radius of maritime ASW operations and significantly enhances the capability of blue-water anti-submarine warfare and maritime domain control.
Squadron1=Y-8FQ,Y-8FQ
Callsigns=Squadron1,Harpoon

[plan_y-9fq]
Type=Maritime Patrol,MPA
Default=Y-9FQ,Y-9FQ
DefaultDescription=The Y-9FQ is the second-generation large shore-based ASW patrol platform developed by China on the basis of the Y-8FQ. It conducted its maiden flight around 2020. Equipped with advanced maritime search radar, magnetic anomaly detector, sonobuoys and electronic reconnaissance systems, the aircraft boasts long-endurance and wide-area aerial patrol capabilities. It can carry ASW torpedoes, depth charges and other ordnance, enabling it to perform multiple missions such as maritime patrol and surveillance, submarine detection and attack, maritime search and rescue, and electronic reconnaissance.Building on the Y-8FQ, the Y-9FQ has upgraded its avionics suite, improved flight performance, extended its operational range, and is outfitted with an AESA multi-function search radar as well as a new generation of sonobuoys.
Squadron1=Y-9FQ,Y-9FQ
Callsigns=Squadron1,Bald Eagle

