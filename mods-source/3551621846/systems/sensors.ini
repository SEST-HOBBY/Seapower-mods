[ ========================================= General ========================================== ]
[General]
DataLinkUpdateRate=1             // every x seconds there will be an update for the overall sensor image for the minimap
PassiveSensorUpdateRate=1.0        // every x seconds the passive contacts will be re-evaluated
LostPassiveContactTimeToDisable=5  // time in seconds after which a lost passive contact bearing line will be greyed out
LostContactTimeToRemove=30         // time in seconds after which a lost contact will be removed from the map




[Nebo-U]
#Nebou 3D radar 
#Users: wp_nebou
Kind=Radar
Type=Search            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Air               // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=100       // if applicable number of targets it can track simultaneously
WeaponChannels=1       // if applicable number of weapons (missiles) it can guide simultaneously
RotationDirection=1    // -1 means left, 1 means right
RPM=6                  // revolutions per minute
MinRange=1.1           // min range in km
MaxRange=600.0         // max range in km
MinAltitude=500        // min altitude in meters, relevant for air, unused for surface
MaxAltitude=67000    // max altitude in meters, relevant for air, unused for surface
RangeResolution=500 // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=4.0          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=60.0              // gain in dB on the sensor
Frequency=VHF-Band     // frequency band
PeakPower=500.0        // output peak power in kW

 


