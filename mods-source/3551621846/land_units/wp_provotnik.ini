#59N6E Protivnik-GE 3D L-band surveillance radar (custom OBJ model, export scale 0.01455610275)
[General]
UnitType=LandUnit
LandUnitSubType=Radar //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port

DefaultCameraDistance=1.5
MinCameraDistanceForeAft=0.8
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.1

AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=3  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

# Areas in m2 measured from the model (antenna 5.5 x 8.5 m, trailer 17.4 x 3.0 m, open side panels)
FrontalArea=59
SideArea=66
BottomArea=105
[Tacview]
Name=59N6E Protivnik-GE
Tag=Ground+AntiAircraft

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Radar

[SensorData]
#Visual
VisualIdentificationRange=8  // Camouflaged  (x0.5)
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #Optics
# Optics. Does not need сollider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.0590,-0.0509
ModuleType=Bridge

[SensorSystem2] #Main radar (placeholder system kept from the original file)
Type=Radar
SystemName=59H6E
Mount=Radar
Integrity=3
Collider=coll_radar,coll_radar_base

[SensorSystem3] #ESM
#IFF Interrogator
Type=ESM
SystemName=VesselESM
Mount=Dummy
MountPosition=0,0.08,0
[Models]
LODLevels=0
LOD1Distance=2  // nautical miles
LOD2Distance=4  // nautical miles
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=radar_models/provotnik/
ResourcesRoot=pge_59n6e.obj
ResourcesMesh=Trailer
ResourcesMaterialFolder=radar_models/provotnik/
ResourcesMaterial=pge_59n6e_mat.ini
############################################################

[Submodels]
Radar=Radar

[Radar]
# Rotating radar head. Modelled in place; it spins about the model origin (= real antenna azimuth axis)
ResourcesMeshFolder=radar_models/provotnik/
RootMesh=pge_59n6e.obj
Mesh=Radar
Position=0,0,0
Rotation=0,0,0
ResourcesMaterialFolder=radar_models/provotnik/
Material=pge_59n6e_mat.ini

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition (game units, export scale 0.01455610275)
############################################################
[Colliders]
NumberOfMeshColliders=0
NumberOfColliders=2
UseKinematicCollision=False

Collider1=coll_radar_base
Collider2=coll_radar

[coll_radar_base]
# trailer + cabin: 3.0 x 4.3 x 17.4 m
Collider=Box
Position=0,0.0313,0.0354
Rotation=0,0,0
Scale=0.0440,0.0626,0.2528

[coll_radar]
# antenna head: 5.5 m wide, ~9.2 m tall, centred 8.8 m above ground
Collider=Box
Position=0,0.1281,0
Rotation=0,0,0
Scale=0.0801,0.1339,0.0801
