wp_ss-26=SS-26,Iskander,TBM,The Iskander TBM is a combat tactical missile developed and equipped by Russia. The Iskander missile is a single-stage, solid fuel, fully guided missile with a total length of 7.2 meters, a maximum diameter of 0.95 meters, a weight of over 4500 kilograms, and a maximum range of 480 kilometers. The missile is launched using launch vehicles, each equipped with two missiles. The hit accuracy is within 30 meters (CEP), with strong precision strike capability.