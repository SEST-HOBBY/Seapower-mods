[ ------------------------ Aircraft Radars ------------------------- ]	
[AN/APQ-65]
Kind=Radar
#Users: fr_aquilon_202
Type=Search            // Classes can be "Search", "Targeting"
HasDataLink=False       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface           // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=40       // if applicable number of targets it can track simultaneously
WeaponChannels=1      // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-106.5,106.5|-13,13      // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=0.2        // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0; 0 - cant see targets on the background
RPM=30                 // revolutions per minute
MinRange=0.25           // min range in km
MaxRange=44.5         // max range in km
MinAltitude=0          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=20000.0          // max altitude in meters, relevant for air, unused for surface
RangeResolution=150.0  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=2.5          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=48.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=90.0         // output peak power in kW
