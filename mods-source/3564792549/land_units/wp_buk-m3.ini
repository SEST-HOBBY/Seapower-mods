[General]
UnitType=LandUnit
LandUnitSubType=SAM
#IsMobile=True //Dot: Until deploy/undeply mechanics is a thing

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=6  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SA-11 Launcher
Tag=Ground+Vehicle+SAM

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=7  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.023,0.034
ModuleType=Bridge
Integrity=0

[SensorSystem2]  #FCR Launcher 1
Type=Radar
SystemName=9C36
Mount=WHOLETURRET

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #SA-11
Type=Missile
SystemName=SA-26
#Sensors
AssociatedSensors=SensorSystem2
#Animations
#Mount
Mount=WHOLETURRET
IsMountRotatable=True
#Containers
ContainerBase=Rails 
NumberOfContainers=1
Container1=Dummy
Container1_Position=0.010,0.005,0.033

#Angles
ElevationArc=0,0
RestAngles=0,0
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
ForceMoveToLoadPosition=True
#Effects
#Other
DisplayWeaponsOnSystem=False
Collider=coll_hitbox
AutoEnableSensor=True
WaitWhileSensorIsGuiding=True
VIDIncrease=15  // In miles. Flat base VID increace when firing.
Integrity=6

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=wp_9m317ma
Ammunition1_Count=12
ModuleType=WeaponMagazine

