[****************************** Miscellaneous ******************************]
[plan_cv_fujian]
Type=CV,航空母舰
Default=003型福建级,福建
DefaultDescription=003型福建级是中国第一艘采用弹射起飞的国产航空母舰，旨在作为001型、002型航母与未来核动力航母之间的过渡。福建级配备电磁飞机弹射系统（EMALS）、双波段有源相控阵雷达，以及扩大的飞行甲板等设计特点。
Variant1=福建（18）,福建

[plan_cvn_004]
