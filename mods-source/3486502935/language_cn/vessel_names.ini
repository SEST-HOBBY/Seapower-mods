Default=004型浙江级,浙江
DefaultDescription=004型浙江级是中国第一级核动力航空母舰。浙江级配备电磁飞机弹射系统（EMALS）、双波段有源相控阵雷达，以及扩大的飞行甲板等设计特点。
Variant1=浙江（19）,浙江
Variant2=广东（20）,广东
Variant3=江苏（21）,江苏
Variant4=陕西（22）,陕西
