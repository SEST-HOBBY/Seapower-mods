DefaultDescription=003型福建级航母是中国首艘国产航母，旨在作为001型和002型航母与未来核动力航母之间的桥梁。福建级航母配备了电磁弹射系统（EMALS）、双波段有源相控阵雷达，以及扩大的飞行甲板等其他设计特点。
