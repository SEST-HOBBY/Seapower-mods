[AmmunitionNames]
# ------------------ AAM ------------------
plaaf_pl-10=PL-10,,空对空,PL-10配备先进的红外成像传感器，使其具备全方位瞄准能力。该导弹能够发射后锁定，使其能够在飞行过程中使用数据链更新目标数据。多元件IIR导引头能够实现+/-90度的偏轴角，并可从由头盔显示器瞄准发射。
plaaf_pl-12=PL-12,,空对空,霹雳-12是中华人民共和国研制的主动雷达制导超视距空对空导弹，被认为可与美国AIM-120先进中程空空导弹和俄罗斯R-77导弹相媲美。
plaaf_pl-15=霹雳-15,,空对空,PL-15是中华人民共和国研制的主动雷达制导远程空对空导弹。

# ------------------ SAM ------------------
pla_hq-10=红旗-10,,面对空/反水面,红旗-10是中国近程防空系统。

# ------------------ Anti-Ship ------------------
plaaf_yj-91a=鹰击-91A,,反舰,鹰击-91A是YJ-91反辐射导弹的反舰型号，鹰击-91反辐射导弹是中国授权生产的Kh-31P反辐射导弹。
pla_yj-83=鹰击-83,,反辐射,鹰击83系列反舰导弹是一种通用导弹，可由空中、舰艇、陆地和潜艇发射，现被中国海军的大多数水面战舰装备。

#-----------Land Strike only missiles---------
pla_kd-88=KD-88,,对地攻击,空地-88是中国研制的一种防区外陆攻导弹，由YJ-83反舰导弹衍生而来，但配备了CCD/TV导引头。KD-88A型则使用成像红外（IIR）导引头进行末端红外制导。

# ---------- Anti-radar Missiles ---------
plaaf_yj-91=鹰击-91,,反辐射,鹰击-91反辐射导弹是中国授权生产的Kh-31P反辐射导弹。

# ------------------ Bombs -----------------
plaaf_500-Ⅱ=500-Ⅱ,,炸弹,中国500公斤II型航空高阻力炸弹
plaaf_500-Ⅲ=500-Ⅲ,,炸弹,中国500公斤III型航空低阻力炸弹
pla_ls-6_500=LS-6(500公斤),滑翔炸弹,集束炸弹,LS-6 500公斤GPS制导滑翔炸弹由一枚500公斤低阻力通用炸弹加装滑翔和制导组件构成，具备防区外精确打击能力。

# ------------------ FFAR -----------------
plaaf_hf-14=HF-14,,火箭弹巢,
plaaf_hf-6=HF-6,,火箭弹巢,
plaaf_130-Ⅱ_rocket=130-Ⅱ,火箭弹巢,该导弹是中国研制并装备的空地火箭，由中国北方工业集团公司制造。
plaaf_90-Ⅰ_rocket=90-Ⅰ,,火箭弹巢,该导弹是中国研制并装备的空地火箭，由中国北方工业集团公司制造。

# --------------- Torpedoes ---------------
pla_yu-11_air=鱼-11,,反潜鱼雷,鱼-11是一种轻型鱼雷, 于2010年代服役, 是中国人民解放军海军主要战舰的主力反潜武器。 与其前身鱼-7相比, 鱼-11配备泵喷推进, 噪音更低, 潜深可达600米以上。

# ------------------ CIWS -----------------
pla_cal_30mm=30mm