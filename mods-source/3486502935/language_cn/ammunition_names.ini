[AmmunitionNames]
# ------------------ AAM ------------------
plaaf_pl-10=霹雳-10,,红外空对空,霹雳-10配备先进的红外成像导引头，具备全向攻击能力。该弹具备发射后锁定（LOAL）能力，飞行中可通过数据链更新目标数据。多元红外成像导引头的离轴角可达±90度，并可与头盔显示器交联。
plaaf_pl-12=霹雳-12,,主动空对空,霹雳-12是中华人民共和国研制的主动雷达制导超视距空对空导弹，被认为可与美国AIM-120和俄罗斯R-77导弹相媲美。
plaaf_pl-15=霹雳-15,,主动空对空,霹雳-15是中华人民共和国研制的主动雷达制导远程空对空导弹。

# ------------------ SAM ------------------
pla_hq-10=红旗-10,,面对空,红旗-10是中国的近程面对空导弹。

# ------------------ Anti-Ship ------------------
plaaf_yj-91a=鹰击-91A,,反水面,鹰击-91A是鹰击-91反辐射导弹的反舰型。鹰击-91是中国授权生产的Kh-31P反辐射导弹。
pla_yj-83=鹰击-83,,反水面,鹰击-83是中程反舰巡航导弹，大量装备于中国人民解放军的舰艇、潜艇和飞机。它以亚音速低空巡航，末段以1.4马赫的超音速攻击。

#-----------Land Strike only missiles---------
pla_kd-88=空地-88,,对地攻击,空地-88是中国以鹰击-83反舰导弹为基础研制的防区外对地攻击导弹，采用CCD电视导引头。空地-88A型则采用红外成像导引头进行末段制导。

# ---------- Anti-radar Missiles ---------
plaaf_yj-91=鹰击-91,,反辐射,鹰击-91是中国以Kh-31P为基础、换装国产导引头研制的反辐射导弹。

# ------------------ Bombs -----------------
plaaf_500-Ⅱ=500-Ⅱ,,炸弹,中国500千克II型航空高阻炸弹。
plaaf_500-Ⅲ=500-Ⅲ,,炸弹,中国500千克III型航空低阻炸弹。
pla_ls-6_500=雷石-6（500千克）,,制导炸弹,雷石-6 500千克GPS制导滑翔炸弹由一枚500千克低阻通用炸弹加装滑翔和制导组件构成，具备防区外精确打击能力。

# ------------------ FFAR -----------------
plaaf_hf-14=HF-14,,折叠翼航空火箭,
plaaf_hf-6=HF-6,,折叠翼航空火箭,
plaaf_130-Ⅱ_rocket=130-Ⅱ,,折叠翼航空火箭,该火箭是中国研制并装备的空地火箭，由中国北方工业集团公司制造。
plaaf_90-Ⅰ_rocket=90-Ⅰ,,折叠翼航空火箭,该火箭是中国研制并装备的空地火箭，由中国北方工业集团公司制造。

# ---------- Torpedos ---------
pla_yu-11_air=鱼-11,,反潜鱼雷,鱼-11是中国的轻型鱼雷，于2010年代服役，是中国人民解放军海军主要战舰的主力反潜武器。与前代鱼-7相比，鱼-11采用泵喷推进，噪声更低，潜深可能超过600米。

# ------------------ CIWS -----------------
pla_cal_30mm=30毫米
