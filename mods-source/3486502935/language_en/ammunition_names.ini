[AmmunitionNames]
# ------------------ AAM ------------------
plaaf_pl-10=PL-10,Thunderbolt-10,AAM,The PL-10 is fitted with an advanced imaging infrared (IIR) sensor that gives it all-aspect targeting capability. The missile is capable of lock-on after launch (LOAL), giving it ability to update target data using datalink while in flight. The multi-element IIR seeker is capable of +/-90 degree off boresight angles and can be slaved to a helmet-mounted display (HMD).
plaaf_pl-12=PL-12,Thunderbolt-12,AAM,The PL-12 is an active radar-guided beyond-visual-range air-to-air missile developed by the People's Republic of China. It is considered comparable to the US AIM-120 AMRAAM and the Russian R-77.
plaaf_pl-15=PL-15,Thunderbolt-15,AAM,The PL-15 is an active radar-guided long-range air-to-air missile developed by the People's Republic of China.

# ------------------ SAM ------------------
pla_hq-10=HQ-10,,SAM,The HQ-10 is a Chinese short-range SAM.

# ------------------ Anti-Ship ------------------
plaaf_yj-91a=YJ-91A,,ASM,The YJ-91A is the anti-ship variant of the YJ-91 anti-radiation missile, which is a Chinese license-made of the Zvezda-Strela Kh-31P anti-radiation missile.
pla_yj-83=YJ-83,Eagle Strike,ASM,The YJ-83 is a medium-range anti-ship cruise missile, equipping large numbers of vessels, submarines, and aircraft of the PLA. It features a low subsonic cruise altitude with Mach 1.4 supersonic terminal attack velocity.

#-----------Land Strike only missiles---------
pla_kd-88=KD-88,,Land Attack,The KD-88 is a Chinese standoff land attack missile derived from the YJ-83 anti-ship missile but with a CCD/TV-seeker. The KD-88A variant uses an imaging infrared (IIR) seeker for terminal infrared homing.

# ---------- Anti-radar Missiles ---------
plaaf_yj-91=YJ-91,,ARM,The YJ-91 is a Chinese anti-radiation missile developed from the Zvezda-Strela Kh-31P with a new Chinese seeker.

# ------------------ Bombs -----------------
plaaf_500-Ⅱ=500-Ⅱ,,Land Attack,Chinese 500kg Type II aviation high resistance bomb
plaaf_500-Ⅲ=500-Ⅲ,,Land Attack,Chinese 500kg Type III aviation low resistance bomb
pla_ls-6_500=LS-6(500kg),Glide Bomb,Land Attack,The LS-6 500-kilogram GPS-guided glide bomb is composed of a 500-kilogram low-drag general-purpose bomb equipped with glide and guidance components, providing stand-off precision strike capabilities.

# ------------------ FFAR -----------------
plaaf_hf-14=HF-14,,FFAR,
plaaf_hf-6=HF-6,,FFAR,
plaaf_130-Ⅱ_rocket=130-Ⅱ,,FFAR,Land Attack,This missile is an air ground rocket developed and equipped by China for military use, manufactured by China North Industries Group Corporation.
plaaf_90-Ⅰ_rocket=90-Ⅰ,,FFAR,This missile is an air ground rocket developed and equipped by China for military use, manufactured by China North Industries Group Corporation.

# ---------- Torpedos ---------
pla_yu-11_air=Yu-11,,ASW Torpedo,The Yu-11 is a Chinese lightweight torpedo that entered service in the 2010s as the principal anti-submarine weapon of major People's Liberation Army Navy (PLAN) warships. Compared to its predecessor Yu-7, the Yu-11 has a pump-jet propulsor, is quieter and may potentially operate at depths greater than 600m.

