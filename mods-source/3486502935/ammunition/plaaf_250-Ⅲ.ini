#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
#
Type=Bomb                               // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
Mass=250                               // in kg. Used for aircraft

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=1       // Biggest range in nm at which this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
#Explosive: 100kg
WarheadType=0
Power=67
ImpactSize=Large               // Impact size, can be small, medium, large, verylarge
Penetration=Always              // can be minor, moderate, heavy, always

FuzeType=0
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=1.0         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================

#========================================= Launch stats ============================================================
MinLaunchRange=0.01                    // Minimum launch range in nautical miles
MaxLaunchRange=10.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=150                  // Minimum launch altitude in feet.
MaxLaunchAltitude=60000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=20                // Circular error radius in meters
#Homing
#ECCM
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction
[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
AttachmentPosition=0,0,-0.001

############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/UB-32-57/
ResourcesRoot=250-3.obj
ResourcesMesh=250-3
assets/ammunition/materials/
ResourcesMaterial=500-3_mat.ini
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

InFlightEffect=None
InFlightEffectPosition=0,0,-0.02
InFlightEffectStartTime=0

HitShipExplosionClass=LargeShipHitExplosion
#HitAirExplosionClass=MediumGroundHitExplosions
HitGroundExplosionClass=MediumGroundHitExplosions
HitDefaultExplosionClass=MediumGroundHitExplosions
HitWaterSplashClass=SmallWaterSplashes

ExplosionOverwaterSplash=effects/splashes/emitters/splash_bomb
#ExplosionOverwaterSplash=effects/splashes/emitters/splash_torpedo

############################################################
# Sounds
############################################################
[Sounds]
SoundMode=1
BoosterAudioClip=
BoosterAudioRollOff=Logarithmic
BoosterAudioDistance=1,20
BoosterAudioPitchRange=0.4,1
SustainerAudioClip=
SustainerAudioRollOff=Logarithmic
SustainerAudioDistance=1,20
SustainerAudioPitchRange=0.1,0.6
InflightAudioClip=audio/weapons/TorpedoEngine
InflightAudioRollOff=Logarithmic
InflightAudioDistance=1,20
InflightAudioPitchRange=0.1,0.6

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.04291637
