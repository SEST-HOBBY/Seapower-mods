# ---------- Anti-radar Missiles ---------

plaaf_yj-91=YJ-91,,ARM,The YJ‑91 is an anti‑radiation missile (ARM) in service with the People’s Liberation Army Air Force (PLAAF), and is the domestic Chinese variant of the Russian Kh‑31P anti‑radiation missile.
plaaf_akf-98a=AKF-98A,,ARM,The AKF‑98A is a stealthy anti‑radiation cruise missile fielded by the People’s Liberation Army Air Force (PLAAF).Taking advantage of its low radar observability, it can penetrate hostile air defense networks and conduct precision strikes against SAM sites and various radar installations.
plaaf_cm401=CM-401,,ASBM, CM-401, made its debut at the 2018 Zhuhai Air Show and has developed multiple models including ship launched and air launched. It was once used as a candidate for the 055 anti-ship ballistic missile.
plaaf_cm-400akg=CM-400AKG,,SRBM,The CM-400AKG short-range ballistic missile is a multi-purpose missile developed by the Chinese Air Force and sold to Pakistan
