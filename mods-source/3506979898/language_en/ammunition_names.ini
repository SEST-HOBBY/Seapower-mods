# ------------------ AAM ------------------
plaaf_pl-10=PL-10,,AAM,The PL-10 is a short-range infrared-guided air-to-air missile developed by China for fourth and fifth-generation fighter aircraft. The missile's seeker utilizes advanced multi-element imaging infrared (IIR) guidance technology, providing strong resistance to countermeasures and compatibility with helmet-mounted display systems. It supports high off-bore and high-G launch conditions, and possess a relatively long range among short-range infrared missiles.

plaaf_pl-15=PL-15,,AAM,The PL-15 is a medium-to-long-range active radar-guided air-to-air missile developed by China for fourth and fifth-generation fighter aircraft. The missile features a dual-pulse solid rocket motor and an active electronically scanned array (AESA) radar seeker, providing high terminal speed and excellent resistance to electronic countermeasures.

plaaf_pl-17=PL-17,,AAM,The PL-17 is a long-range active radar homing air-to-air missile fielded by the People's Liberation Army Air Force. It is primarily used against hostile auxiliary and support aircraft at very long standoff ranges, that include tankers, AWACSs, and bombers. The missile possesses a very long range and high terminal speed, but it suffers from inferior maneuverability, making it unsuitable for engaging very maneuverable targets.
