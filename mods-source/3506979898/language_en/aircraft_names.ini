DefaultDescription=The J-16D is an improved version of the J-16A Block 3 and focuses on electronic warfare, where D stands for Electronic Warfare. On September 24, 2021, the Chinese Air Force announced that the J-16D was included in the lineup of the 13th China Air Show and participated in the show for the first time.
