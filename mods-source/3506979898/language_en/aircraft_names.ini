[General]

[plaf_j16a]
Type=Fighter
Default=J-16A Block 1, J-16A Block 1
DefaultDescription=The J-16 is a fourth and a half generation twin seat twin engine multi-purpose fighter developed by Shenyang Aircraft Corporation of China based on the J-11 fighter jet. The appearance of the aircraft is based on the Russian Su-30MKK attack aircraft. The J-16 is equipped with an active electronically scanned phased array radar, which can simultaneously identify and attack multiple targets, possessing long-range beyond visual range air combat capabilities and powerful ground and sea strike capabilities. Compared with the J-7, the J-16 has a larger body, with a maximum payload of 12 tons, and can launch YJ-62 and YJ-83 air to ship missiles. The aircraft is equipped with a Chinese made WS-10 Taihang engine, which has performance similar to the modified F-15E S8 from the United States.
Squadron1=J-16A(NanBaTian）,J-16A

