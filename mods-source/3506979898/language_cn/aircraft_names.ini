DefaultDescription=歼-16是中国沈阳飞机公司在歼-11战斗机基础上发展研制的三代半双座双发多用途战斗机。该机外形参考俄式苏-30MKK攻击机。歼-16装备主动电子扫描相控阵雷达，可同时识别攻击多个目标，具备远距离超视距空战能力和强大的对地、对海打击能力。与歼轰-7比较歼-16的机体更大，最大载弹量12吨，可以发射鹰击62和鹰击83空对舰导弹。该机装备中国产的涡扇-10“太行”发动机，其性能与美国F-15E S8改型相近。
Squadron1=歼-16A 南霸天,歼-16A

