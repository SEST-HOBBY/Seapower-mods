[General]
# Type 07 VL-ASROC (JMSDF): rocket-boosted payload delivery for the Mk 41 VLS. Replaces the RUR-5 / RUM-139 on the Mogami.
# Artwork: Blender/openSPproject/weapons/js_type07_asroc. Flight group js_type07_asroc, stowed group js_type07_asroc_launch.
# Stats are the stock RUR-5 / RUM-139 values scaled for the heavier 6.5 m round, except range (over 30 km, per the user); estimates.
Type=ASROC                             // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW                         // can be AAW, ASuW, ASW

Mass=900                               // in kg. Used for aircraft (estimate)
AmmoPoints=2250                        // For Supply System (RUM-139 ratio, 2.5 x mass)

FOCDate=2012                           // Year, shows in Unit Reference

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

[SensorData]
VisualIdentificationRange=4
IRSignature=Small
RCS=VerySmall
TransientRCS=Small
TransientVisualIdentificationRange=5
TransientBaseNoise=200

[WarheadData]
#No need to specify anything since its warhead is never used

[Guidance]
GuidanceType=0
MidCourseCorrection=0
InitialFlightPhaseDuration=4.5         // must cover ResourcesMeshSwitchTime
DropDuration=1.0                       // time in seconds where the missile just falls unpropelled
#Flight profile for the ASROC type is hardcoded
MaxVelocity=600.0
Acceleration=16.0
MaxTurnRate=10.0
MinLaunchRange=1.0
MaxLaunchRange=17.0                    // nmi, about 31.5 km (user 2026-11-07: over 30 km)
CircularErrorRadius=0.0
SelfDestructDelay=6.0

[Models]
ResourcesFolder=assets/models/weapons/js_type07_asroc/
ResourcesRoot=js_type07_asroc.obj
ResourcesMesh=js_type07_asroc
ResourcesMaterial=js_type07_asroc_mat.ini
ResourcesMeshForLaunch=js_type07_asroc_launch
ResourcesMeshSwitchTime=4.0            // = the stock booster effect's ejection (4.0 s): boosted dummy (launch mesh) -> separated capsule (main mesh)
NumberOfSubModels=0

# the payload: a Type 12 torpedo is spawned after the rocket's flight
[Submunition]
Ammunition=js_type12_asroc
Offset=0,0,0.0
SpawnTime=6

[Launchers]
NumberOfLaunchers=2
Launcher1=MK41_VLS
Launcher2=MK41

[MK41_VLS]
OnRailWarmup=0

[MK41]
OnRailWarmup=0

[Particles]
# stock booster effect: motor flame for 4.0 s, then the booster ejection (smoke, sparks, flash, falling booster) at 4.0 s.
# Origin set so the effect's stock RUR-5 booster mesh (fins z -0.0462..-0.0405, tip r 0.0059) sits inside the dummy's own booster
# (fins z -0.0466..-0.0368, tip r 0.0070, same X layout) for its 4 s burn; offsets -0.0008..+0.0004 all hide it, middle used.
BoosterEffect=effects/weapons/emitters/usn_rur-5_booster
BoosterEffectPosition=0,0,-0.0002
# no usn_rur-5_separation: that effect drops the old RUR-5's own nose halves
UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.0473
HitShipExplosionClass=UnderwaterExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.00519,0.00519,0.04731
