# ---------- Anti-ship Missiles ----------
usn_rgm-84d=RGM-84D,Harpoon,ASM,The Harpoon is an American standoff anti-ship weapon used widely throughout NATO. The weapon has an active radar seeker that is activated after following a pre-programmed route. The RGM-84D variant has improved range of 120nm.

