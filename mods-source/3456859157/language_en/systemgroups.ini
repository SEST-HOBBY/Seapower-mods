[SystemNames]
OPY-2_mw=OPY-2|The OPY-2 is the X-band multi-function radar of the JMSDF's Mogami-class frigates, combining air and surface search with missile fire control in the ship's integrated mast.
OPY-2_FCR_mw=OPY-2 FCR|The fire-control channels of the OPY-2 multi-function radar, providing midcourse and terminal guidance for ship-launched missiles.
