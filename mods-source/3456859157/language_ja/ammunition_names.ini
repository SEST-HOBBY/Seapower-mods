[AmmunitionNames]
# ---------- this mod's own rounds (the rest come from the stock locale file) ----------
usn_rim-116=RIM-116,RAM,SAM,RIM-116 RAM（ローリング・エアフレーム・ミサイル）は、パッシブ・レーダーと赤外線の複合誘導を用いる短距離防空ミサイルであり、Mk 49近接防空ミサイルシステムの一部として運用される。
usn_rim-66h=RIM-66H,SM-2MR Blk II,SAM,RIM-66H スタンダード・ミサイル2は、SM-2ブロックIIシリーズのイージス艦VLS用の型であり、Mk 26発射機用の型とほぼ同一である。改良型ロケットモーターによりミサイルの性能が全般に向上しており、とくに速度が増して最大有効射程は2倍以上に延び、高高度・低高度での性能も向上している。
usn_rim-162=RIM-162,ESSM,SAM,RIM-162 発展型シースパロー（ESSM）はRIM-7シースパローを発展させた艦対空ミサイルで、対艦ミサイルや航空機から艦艇を防護する。超音速で機動する対艦ミサイルへの対処を目的に設計されており、Mk 41 VLSの1セルに最大4発を「クアッドパック」で搭載できる。
usn_rgm-84d=RGM-84D,Harpoon,ASM,ハープーンはNATO諸国で広く使用されているアメリカ製のスタンドオフ対艦兵器である。あらかじめプログラムされた航路を飛行した後に作動するアクティブ・レーダー・シーカーを備える。RGM-84D型は射程が120海里に延伸されている。
js_type17_ssm2=17式艦対艦誘導弾,SSM-2,ASM,17式艦対艦誘導弾は海上自衛隊の艦載型ステルス対艦巡航ミサイルで、甲板上のキャニスターから分離式ブースターで発射される。多面体形状の低観測性機体は発射後に主翼を展開し、シースキミング高度を巡航したのち、終末段階はアクティブ・レーダー・シーカーで目標を攻撃する。
js_type07_asroc=07式垂直発射魚雷投射ロケット,07式VLA,ASROC,07式垂直発射魚雷投射ロケットは、Mk 41 VLSから発射される海上自衛隊の対潜ロケットで、12式魚雷を目標海域へ運ぶ。
js_type12_asroc=12式魚雷,12式,魚雷,12式魚雷は海上自衛隊の324mm短魚雷で、07式VLAの弾頭として運ばれる。
js_type12_ship=12式魚雷,12式,魚雷,12式魚雷は海上自衛隊の324mm短魚雷で、ここでは艦のHOS-303 3連装短魚雷発射管から発射される。
js_type23_asam=23式艦対空誘導弾,中SAM改,SAM,23式艦対空誘導弾（旧称A-SAM）は、03式中距離地対空誘導弾（改善型）を基に開発された海上自衛隊の艦載型対空ミサイルで、Mk 41 VLSから垂直発射される。07式垂直発射魚雷投射ロケットの技術を応用した分離式ブースターで射程を延伸し、中間誘導はデータリンク、終末誘導はアクティブ・レーダー・ホーミングで行う。
