BeamWidth=2.2          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=50.0              // gain in dB on the sensor
Frequency=L-Band       // frequency band
PeakPower=150.0     // output peak power in kW
ModuleType=MediumSensor

