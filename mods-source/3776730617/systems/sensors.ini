#---------------------------------------- Visual ----------------------------------------
#---------------------------------------- Radar ----------------------------------------
SurfaceSearchRadar=SurfaceSearchRadar
#---------- Surface ships ----------
#---Air/Air&Surface---
[Type277Q]
Kind=Radar
Type=Targeting            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface               // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=1       // if applicable number of targets it can track simultaneously
WeaponChannels=1       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=15                  // revolutions per minute
MinRange=1.5           // min range in km
MaxRange=46            // max range in km
MinAltitude=500        // min altitude in meters, relevant for air, unused for surface ???
MaxAltitude=20000      // max altitude in meters, relevant for air, unused for surface ???
RangeResolution=110.0 // defines the minimum range where two targets behind can be recognized as two; in meters ???
BeamWidth=4.5          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2) ???
Gain=21.8              // gain in dB on the sensor
Frequency=S-Band       // frequency band
PeakPower=400.0        // output peak power in kW
ModuleType=MediumSensor

[SPS-49A(V)1]
# AN/SPS-49A(V)1 - Improved 2D Long-Range Air Search Radar
# Introduced: Mid-1990s; improved Doppler detection, clutter rejection
Kind=Radar
Type=Search            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Air               // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=4       // if applicable number of targets it can track simultaneously
WeaponChannels=1       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=12                 // revolutions per minute
MinRange=0.5           // min range in km
MaxRange=470.0         // max range in km
MinAltitude=0         // min altitude in meters, relevant for air, unused for surface
MaxAltitude=45000      // max altitude in meters, relevant for air, unused for surface
RangeResolution=200.0  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=3.0          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=44.5              // gain in dB on the sensor
Frequency=UHF-Band     // frequency band
PeakPower=360.0        // output peak power in kW
ModuleType=SmallSensor

