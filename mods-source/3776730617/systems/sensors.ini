[ ------------------------------ ECM ------------------------------ ]
[EA-2118_ECM] 
#Users: 
Kind=ECM
Frequencies=C-Band,X-Band,Ku-Band //radar frequency bands the ECM suite can jam
Type=Defensive                         // can be Defensive, Offensive, Universal
PeakPower=150.0                       // output peak power in kW, more power increase effectivness of offensive ECM jammers
MaxRange=170.0                         // max range in km
Gain=7.0                              // Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=100.0                   // For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChance=0.58                         // For Defensive and Universal jammers. Base chance to jam the attacking weapon
ModuleType=SmallSensor
CoverRange=5.5                          // in nmi, If within this range from attacked unit and within weapon seeker cone, jammer will add to combined chance to jam weapon.

