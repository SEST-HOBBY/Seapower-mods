rn_sea_skua=Sea Skua,,ASM,The Sea Skua is a British lightweight short range air to surface missile.
ch_mm-40=MM40,Block II,ASM, As the successor of the MM38, the main advantage of the MM40 over the MM38 is its superior range (70Km) . The Chilean Navy initially integrated the 'Block II'variant.
