[AmmunitionNames]
# ------------------ AAM ------------------
is_python3=Python 3,,AAM,Python 3 is Israel's infrared-guided air-to-air combat missile with a longer range than other combat missiles.
is_python4=Python 4,,AAM,The Python 4 is a highly agile short-range infrared air-to-air missile developed by Israel, designed to engage enemy aircraft in close-in combat. It features an advanced all-aspect seeker with strong resistance to countermeasures, allowing reliable target acquisition from any angle. Equipped with high off-boresight capability and extreme maneuverability, the Python 4 enables modern dogfight tactics, including helmet-mounted sight cueing for rapid target engagement.
is_derby=Derby,,AAM,Derby is Israel's active radar-guided air-to-air missile, developed from the Python 4/5 air-to-air missile, so its range is much shorter than other active radar-guided air-to-air missiles.
# ------------------ SAM ------------------
ch_barak=Barak I,Barak I,SAM, The 'Barak 1' is an Israeli point-defense SAM developed by the companies Rafael and IAI. It is designed to take down sea-skimming threats, enemy planes, and aeven UAVs that enter into its coverage area.
eu_seawolf_GWS26=GWS.26,Sea Wolf VLS,SAM,VLS variant of the GWS25. Provided with a booster that allows the missile to perform their initial flight phase alowing 360° cover. Thus eliminating the need for the traditional sixtuple launcher.
