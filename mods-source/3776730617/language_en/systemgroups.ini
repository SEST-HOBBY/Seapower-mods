Type_1002=Type 1002|The Type 1002 is an X-band submarine navigation radar.
Type_1003=Type 1003|The Type 1003 is an improved version of the Type 1002 X-band submarine navigation radar.
ZW06=ZW06|A surface search and navigation radar operating in the X band with a range of 22km.
eu_smart-smk2=SMART-S Mk. 2|The SMART-S (Signaal Multibeam Acquisition Radar for Targeting) is an all-weather 3-D target indication and surveillance radar system intended for all types of naval vessels from fast patrol boats upwards. The SMART system operates in F band

