# --------------- Torpedoes ---------------
MTLS=MTLS|324mm Magazine torpedo launch system| The Magazine Torpedo Launch System is a lightweight torpedo launch system commonly used in the Type 23 frigates. The system employs a modular, internally installed design that protects the tubes and crew within the hull, and deploys the ejectors through pneumatic doors only at the moment of firing. The tubes are integrated directly into the ship's torpedo magazine.
MK32_Md9=MK32-Mod9|Mod9 324mm torpedo tubes| The MK32 Mod9 Torpedo Launch System is a lightweight torpedo launch system. The system employs a modular, internally installed design that protects the tubes and crew within the hull.
