Type_M44=Type M44|The Hollandse Signaalapparaten M-44 is a naval fire control system and radar/optical director developed in the Netherlands during the Cold War. This equipment was specifically designed to automate, guide, and control the firing of short-range anti-aircraft missiles and anti-aircraft guns.

