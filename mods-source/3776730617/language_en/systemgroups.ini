[SystemNames]

#---------- Surface ships ----------
#---Air/Air&Surface---
Type277Q=Type 277Q|The Type 277 was a surface search and secondary aircraft early warning radar used by the Royal Navy and allies during World War II and the post-war era. It was a major update of the earlier Type 271 radar, offering much more power, better signal processing, new displays, and new antennas with greatly improved performance and much simpler mounting requirements.

#---------------------------------------- ESM ----------------------------------------
NS-9003_ESM=Elisra NS-9003|The Elisra NS-9003 is an advanced naval Electronic Support Measures (ESM) and Radar Warning Receiver (RWR) system. Its primary mission is to detect, intercept, classify, and precisely locate enemy radar emissions before the host ship is targeted or compromised.
C-Pearl_ESM=C-Pearl-DV|The Rafael C-Pearl-DV is a modern digital electronic support measures (ESM) suite providing wideband detection, accurate emitter classification, and high-precision bearing data. Fully integrated into the ship’s combat system and data links, replacing legacy SLQ-32(V) systems during FFG upgrades.
EW-1017=Loral EW-1017 Yellow Gate|The Loral EW-1017 "Yellow Gate" system is a classic and historic Electronic Support Measures (ESM) system that played a crucial role in the British Air Force (RAF). At its core, the Yellow Gate used the architecture and processors of a Radar Warning Receiver (RWR), but the software and libraries were extensively reprogrammed to convert it into a broadband tactical ESM search system.


