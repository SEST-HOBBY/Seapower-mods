SA-Radar=SA-Radar|The SA Radar is a World war 2 early radar used for basic surface and air detection.
LW08=LW08|The JUPITER/LW 08 2D-early warning radar performs long-range air surveillance on board medium and heavy-tonnage ships. JUPITER/LW 08 operates in D-Band, and is available with a cost-effective fully solid-state transmitter. The antenna is mounted on a lightweight hydraulically stabilised platform (roll and pitch).
DA-05=DA-05|The DA-05 is Dutch 2D-early warning radar able to spot Air and Surface targets up to a range of 237 kilometers,it operates in the S-Band
LW-02=LW-02|The LW-02 is a long range air surveillance radar operating in the L band.
Type277Q=Type 277Q|The Type 277 was a surface search and secondary aircraft early warning radar used by the Royal Navy and allies during World War II and the post-war era. It was a major update of the earlier Type 271 radar, offering much more power, better signal processing, new displays, and new antennas with greatly improved performance and much simpler mounting requirements.
Type 1022=Type 1022|The Type 1022 is a long-range frequency synthesiser-driven Traveling-wave tube (TWT) radar with pulse-to-pulse coherence. It was developed as a replacement for the Royal Navy’s Type 965 surveillance radar. Long-range performance is aided by the use of a high mean-power TWT in the transmitter.
Type_965=Type 965|The Type 965 was a VHF band long-range early warning suveillance radar, designed primarily to be fitted in destroyers and frigates. Type 965 used the AKE-2 “double-bedstead” antenna.
Type 978=Type 978|Type 978 was operating in X band surface warning and navigation radar for British destroyers and frigates. This radar replaced the earlier Type 277Q. Later it was also replaced by Type 1006.
Type_993=Type 993|Type 993 is a short-range, general-purpose radar fitted in several older frigate classes. The Type 993 is used for air and surface search, and for target designation. Its antenna is a "quarter cheese," a shape that resembles a quarter of a cheese wheel; this configuration prevents the feed horn from obstructing the main radar beam. 
Type 984=Type 984|Type 984 radar was a British radar system introduced in the mid-1950s. It was a rotating mechanically stabilized 3D S band radar, measuring longitudinal position, latitudinal position, as well as target altitude
SA-Radar=SA-Radar|The SA Radar is a World war 2 early radar used for basic surface and air detection.
LW08=LW08|The JUPITER/LW 08 2D-early warning radar performs long-rangeair surveillance on board medium and heavy-tonnage ships. JUPITER/LW 08 operates in D band, and is available with a cost-effective fully solid-state transmitter. The antenna is mounted on a lightweight hydraulically stabilised platform (roll and pitch).
DA-05=DA-05|The DA-05 is Dutch 2D-early warning radar able to spot Air and Surface targets up to a range of 237 kilometers,it operates in the S-Band
ELM-2228S_AMDR=ELTA ELM-2228S AMDR|The ELTA ELM-2228S AMDR (Automatic Missile Detection Radar) is designed to detect sea-skimming missiles, generate automatic threat alerts and provide an automatic, track-while-scan (more than 100 targets simultaneously) air and surface surveillance capability. It operates in S-Band and X-Band.
SPS-49(V)5=SPS-49(V)5|A late Cold War upgrade of the baseline SPS-49, this version provided enhanced range performance and reliability over earlier models. Used widely by U.S. and allied navies in the 1980s and early 1990s as a key 2D long-range air search radar.
SPS-49A(V)1=SPS-49A(V)1|An enhanced mid-1990s variant of the long-range 2D air search radar. It introduced Doppler-based target velocity tracking and improved clutter rejection, offering better performance against sea-skimming and low-RCS threats. Commonly fitted during NTU upgrades to legacy ships.
