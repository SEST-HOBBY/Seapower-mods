#======================================== Frigates ========================================
[ch_ffg_type22b2_barak]
Type=FF,Frigate
Default=Almirante Williams-class,Almirante Williams
DefaultDescription=In 2008, the FF-19 Williams underwent an extensive mid-life update (MLU). Key upgrades included the decommissioning of the Seawolf missile system in favor of the Barak 1 point-defense system, along with the integration of ELTA EL/M-2221 fire-control radars, new RGM-84 Harpoon missiles and the installation of an Oto 76 Super Rapid.
Variant1=(FF-19) Almirante Williams,Almirante Williams

[ch_ffg_jacob_van_heemskerck]
Type=FFG,Guided Missile Frigate
Default=Capitán Prat-class,Capitán Prat
DefaultDescription=The Jacob van Heemskerck-class frigate was acquired to the Netherlands during the early 2000´s.They were designed to be an air defence version of the Kortenaer class with the helipad and rear superstructure replaced by a Standard medium range surface-to-air missile system and associated radars. During Chilean service the Two ships were designated as FFG-11 Capitán Prat and FFG-14 Almirante Latorre.
Variant1=(FFG-11) Capitán Prat,Capitán Prat
Variant2=(FFG-14) Almirante Latorre,Almirante Latorre

[ch_ffg_karel_doorman]
Type=FFG,Guided Missile Frigate
Default=Blanco Encalada-class,Blanco Encalada
DefaultDescription=The Karel Doorman Class or also know as the M-Class are a series of eight multi-purpose vessels built for the Royal Netherlands Navy from the 1980´s to the 1990´s. The ships were designed as multi-purpose frigates that could perform a wide range of missions. Their armament reflects this by incorporating many features, such as the ability to engage submarines, aircraft and surface vessels. Two of these frigates were acquired by the Chilean navy between 2004 and 2006, and were commissioned in 2005 and 2007 respectively.
Variant1=(FFG-15) Blanco Encalada,Blanco Encalada
Variant2=(FFG-18) Almirante Riveros,Riveros

[ch_ffg_type23]
Type=FFG,Guided Missile Frigate
Default=Almirante Cochrane-class,Almirante Cochrane
DefaultDescription=The Type 23 frigate, is a class of frigates built for the United Kingdom's Royal Navy. Commonly known as the Duke class. They were designed as an anti-submarine warfare (ASW) platform, performing excellently in this role. Although they are also highly capable in multi-role missions. They form the core of the frigate forces of both the Royal Navy and the Chilean Navy. The class comprises 16 ships, three of which were sold to Chile in 2006. The class has undergone several modernizations in both navies and is still in service.
Variant1=(FFG-05) Almirante Cochrane,Cochrane
Variant2=(FFG-06) Almirante Condell,Condell
Variant3=(FFG-07) Almirante Lynch,Lynch

[ch_ffg_type23_pida]
Type=FFG,Guided Missile Frigate
Default=Almirante Cochrane-class,Almirante Cochrane
DefaultDescription=The Chilean Type 23 frigates underwent a mid-life refit under the PIDAA project "Proyecto Integrado de Defensa Anti-Aerea"(Anti-Air Defense Integration Project). A joint project between Lockheed Martin Canada and the Chilean companies SISDEF and ASMAR, consisting of the replacement of the combat management system, the decommissioning of the 996 radar with the addition of the TRS-4D radar, the decommissioning of the GWS 26 system with the addition of the CAMM Sea-Ceptor, and lastly the replacement of the Harpoon missiles with the MM40 Block 3c.
Variant1=(FFG-05) Almirante Cochrane,Cochrane
Variant2=(FFG-06) Almirante Condell,Condell
Variant3=(FFG-07) Almirante Lynch,Lynch

[ch_ffg_adelaide_longhull]
Type=FFG,Guided Missile Frigate
Default=Capitán Prat-class,Capitán Prat
DefaultDescription=By 2017, the Chilean L-class frigates began their decommissioning process and a dedicated air defense unit was required to replace these vessels. The Australian Adelaide-class was the winning candidate. In late 2019 HMAS “Newcastle” (FFG Prat) and HMAS “Melbourne” (FFG Latorre) were incorporated into the service of the Chilean Navy. By March 2020 both ships would arrive in Chile and were taken to the ASMAR shipyards for a structural and armament refit. The Adelaide-class introduced the generational leap towards SM-2 and ESSM for the Chilean navy.
Variant1=(FFG-11) Capitán Prat,Capitán Prat
Variant2=(FFG-14) Almirante Latorre,Almirante Latorre

#======================================== Submarines ========================================
[ch_ss_thomson_mlu]
Type=SS,Patrol Submarine
Default=Thomson-class,Thomson
DefaultDescription=German Type 209-1400 Class submarines,2 units were purchased by Chile in the 1980's to support the Oberon Class submarines. All submarines came with an increase hull length thanks to its extensive sensor suite upgrade both in passive and active sonars.For its era the submarine boasted a respectable armament for its size and a big range able to support operations anywhere through the long Chilean coasts.The 2 ships acquired are still in service and with modernised weaponry.
Variant1=(SS-20) Thomson,Thomson
Variant2=(SS-21) Simpson,Simpson

[ch_ss_scorpene]
Type=SS,Patrol Submarine
Default=O´Higgins-class,O´Higgins
DefaultDescription=The Scorpène class is an advanced diesel-electric attack submarine, jointly developed by the French DCNS and the Spanish company Navantia. The Scorpène takes advantage of what was learned during the design of the Rubis-class and its subsequent Ametysthe upgrade, it thus combined cutting-edge technology and proven solutions. These are considered 5th gen submarines. The Chilean Navy was the first customer to acquire this class, ordering two Scorpène-class boats, which replaced the two Oberon-class submarines retired by the Chilean Navy. The Chilean Scorpène-class O'Higgins and Carrera were commissioned in 2005 and 2006, respectively. 
Variant1=(SS-22) Carrera,Carrera
Variant2=(SS-23) O´Higgins,O´Higgins
