DefaultDescription=The M113 was designed to replace the older M59, and with over 80,000 produced, the M113 is one of if not the most widely used APCs in history. Although lightly armoured, it is highly versatile and can be modified to serve almost any role, from ATGM carriers to firefighting vehicles. It has been exported to every continent and is still the primary armoured vehicle of many nations, meaning this vehicle is sure to appear in virtually any conflict.
