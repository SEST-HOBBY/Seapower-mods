#!extend language_en/ammunition_names.ini

[AmmunitionNames]
swe_rbs15ka_mk2=RBS15 Mk2 (KA),,ASM,Coastal battery version for the RBS 15 KA truck launcher. An upgraded RBS15 variant focused on improved midcourse and terminal guidance and better survivability in electronic warfare environments. It retains subsonic sea skimming tactics with an active radar seeker and autonomous terminal homing against surface targets.
swe_rbs15ka_mk3=RBS15 Mk3 (KA),,ASM,Coastal battery version for the RBS 15 KA truck launcher. A long range subsonic anti-ship and land-attack missile with an all weather active radar seeker and robust electronic protection. Mission planning supports multiple waypoints and coordinated multi angle attacks while the missile maintains sea state adapted sea skimming to limit detection. Terminal flight can include evasive maneuvers and timing control for synchronized strikes.
