# RBS 15 KA canister pack: front and rear hatch on each tube, both hinged at their top edge.
# Closed = -20 deg (the pack elevation). Front opens up and forward (-120), rear opens up and back (+80).
[Animations]
NumberOfAnimations=8
Animation1=DoorOpen_1
Animation2=DoorOpen_2
Animation3=DoorOpen_3
Animation4=DoorOpen_4
Animation5=DoorClose_1
Animation6=DoorClose_2
Animation7=DoorClose_3
Animation8=DoorClose_4

[DoorOpen_1]
NumberOfSequencesToPlay=2
Sequence1=FrontOpenSequence
Sequence1_Model=ka_twin_door_1
Sequence2=RearOpenSequence
Sequence2_Model=ka_twin_rdoor_1

[DoorClose_1]
NumberOfSequencesToPlay=2
Sequence1=FrontCloseSequence
Sequence1_Model=ka_twin_door_1
Sequence2=RearCloseSequence
Sequence2_Model=ka_twin_rdoor_1

[DoorOpen_2]
NumberOfSequencesToPlay=2
Sequence1=FrontOpenSequence
Sequence1_Model=ka_twin_door_2
Sequence2=RearOpenSequence
Sequence2_Model=ka_twin_rdoor_2

[DoorClose_2]
NumberOfSequencesToPlay=2
Sequence1=FrontCloseSequence
Sequence1_Model=ka_twin_door_2
Sequence2=RearCloseSequence
Sequence2_Model=ka_twin_rdoor_2

[DoorOpen_3]
NumberOfSequencesToPlay=2
Sequence1=FrontOpenSequence
Sequence1_Model=ka_twin_door_3
Sequence2=RearOpenSequence
Sequence2_Model=ka_twin_rdoor_3

[DoorClose_3]
NumberOfSequencesToPlay=2
Sequence1=FrontCloseSequence
Sequence1_Model=ka_twin_door_3
Sequence2=RearCloseSequence
Sequence2_Model=ka_twin_rdoor_3

[DoorOpen_4]
NumberOfSequencesToPlay=2
Sequence1=FrontOpenSequence
Sequence1_Model=ka_twin_door_4
Sequence2=RearOpenSequence
Sequence2_Model=ka_twin_rdoor_4

[DoorClose_4]
NumberOfSequencesToPlay=2
Sequence1=FrontCloseSequence
Sequence1_Model=ka_twin_door_4
Sequence2=RearCloseSequence
Sequence2_Model=ka_twin_rdoor_4

[------------------------------ Sequences ------------------------------]
[FrontOpenSequence]
NumberOfSteps=2
#Step<i>=Time|Position|Rotation|SmoothnessType
Step1=0|x,y,z|-20,0,0|EaseInOut
Step2=2|x,y,z|-120,0,0|EaseInOut

[FrontCloseSequence]
NumberOfSteps=2
Step1=0|x,y,z|-120,0,0|EaseInOut
Step2=2|x,y,z|-20,0,0|EaseInOut

[RearOpenSequence]
NumberOfSteps=2
Step1=0|x,y,z|-20,0,0|EaseInOut
Step2=2|x,y,z|80,0,0|EaseInOut

[RearCloseSequence]
NumberOfSteps=2
Step1=0|x,y,z|80,0,0|EaseInOut
Step2=2|x,y,z|-20,0,0|EaseInOut
