[General]
UnitType=LandUnit
LandUnitSubType=MissileSite
#IsMobile=True                  // commented out in the vanilla Rubezh too - try enabling it if you want the unit to drive

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.7                      // in meters (Volvo FMX 8x8 with the canister pack)
Beam=2.55                       // in meters
Range=270                       // in miles

ArmorType=None
DamagePoints=3

FrontalArea=8.5
SideArea=25
BottomArea=25

[Tacview]
Name=RBS 15 KA Mk2
Tag=Ground+AntiShip

[Physics]
HorsePower=500                  // Volvo FMX
Mass=30                        // in tons: truck + launcher with four RBS 15 (estimate)

MaxForwardVelocity=40          // in knots (~75 km/h on road)
MaxBackwardVelocity=5.5
Braking=10
TurnRate=10

[AI]
UnitScoreValue=0.3
Role=ASuW,ASM

[ControlSystem]
Collider=coll_hitbox
Integrity=4

[SensorData]
VisualIdentificationRange=2.5
IRSignature=Small
RCS=Small

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_swe_rbs15ka_box    // front doors on the launch tubes

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=1
# The real RBS15KA launch vehicle had no radar of its own; targets come from the Giraffe vehicle / battery.
[SensorSystem1] #Optics
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.03,0.04
ModuleType=Bridge
Integrity=0

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #RBS15 quad launcher
Type=Missile
SystemName=YJ-8
#Mount - fixed canisters on the truck bed, like the Stockholm
Mount=Dummy
#Containers - invisible launch points at the four canister mouths
NumberOfContainers=4
NumberOfHatchesPerContainer=2   // front and rear door on each tube
Container1=ka_scania_launch_1
Container1_Hatch1=ka_scania_door_1
Container1_Hatch2=ka_scania_rdoor_1
Container1_OpenHatchAnimation=DoorOpen_1
Container1_CloseHatchAnimation=DoorClose_1
Container2=ka_scania_launch_2
Container2_Hatch1=ka_scania_door_2
Container2_Hatch2=ka_scania_rdoor_2
Container2_OpenHatchAnimation=DoorOpen_2
Container2_CloseHatchAnimation=DoorClose_2
Container3=ka_scania_launch_3
Container3_Hatch1=ka_scania_door_3
Container3_Hatch2=ka_scania_rdoor_3
Container3_OpenHatchAnimation=DoorOpen_3
Container3_CloseHatchAnimation=DoorClose_3
Container4=ka_scania_launch_4
Container4_Hatch1=ka_scania_door_4
Container4_Hatch2=ka_scania_rdoor_4
Container4_OpenHatchAnimation=DoorOpen_4
Container4_CloseHatchAnimation=DoorClose_4
#Angles
FiringArcs=-120,120          // RBS15 turns onto course after launch; widen/narrow to taste
#Loading
Ammunition=swe_rbs15ka_mk2     // one RBS15 Mk2 per canister, no reload
#Other
Collider=coll_launcher

[--------------------------- Mesh definitions ---------------------------]
# Truck: Volvo FMX 8x8 from the Tridon 57 mod (model by niev, CC BY 4.0). Box launcher: cut from the full-detail version of Thomas's own Meshy AI Scania 8x8 model (50,000 triangles), on the flatbed, raised about 20 degrees; missiles climb out over the cab. 1 game unit = 68 m.
[Models]
ResourcesFolder=assets/swe_rbs15ka/models/
ResourcesRoot=swe_rbs15ka_volvo.obj
ResourcesMesh=ka_volvo
ResourcesMaterialFolder=assets/swe_rbs15ka/materials/
ResourcesMaterial=ka_volvo_mat.ini

