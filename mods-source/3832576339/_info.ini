[Language_en]
Name=RBS 15 KA - Swedish Coastal Missile Battery
Description=RBS 15 KA truck-mounted coastal anti-ship missile launchers on a Volvo 8x8, as used by the Swedish coastal artillery and amphibious corps. RBS 15 KA Mk2 (1998-2016): four-tube box launcher in JA 37 splinter camouflage with RBS15 Mk2 missiles. RBS 15 KA Mk3 (from 2016): dark green 2x2 canister pack with RBS15 Mk3 missiles, also able to strike targets on shore. Animated front and rear hatches on every tube. The launchers have no search radar of their own; pair them with the PS-902 (Giraffe 75) radar mod or another unit that shares targets by datalink. REQUIRES Euromod - Main Pack (missile model). Truck: Volvo FMX by niev (CC BY 4.0), via the Tridon 57 mod. Missile model: Euromod team. Launchers: Thomas, made with Meshy AI.

