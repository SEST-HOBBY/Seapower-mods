[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.6
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.23

Length=190.0                   // in meters
Beam=24.6                      // in meters

CompartmentsHeight=0.14        // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None
NumberOfDCTeams=3

[---------- FlightDeck Definitions ----------]
[---------- Physics and Control ----------]
############################################################
# Physics definition
############################################################
[Physics]
// all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=15995            // in tons

MaxForwardVelocity=32.0        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.72                // this is for velocity damping (linear drag)
MaxAccelerationFactor=3.5
MinAccelerationFactor=0.2

RudderTurnRate=7.0             // turn rate of the rudder in degrees per second
RudderForce=2.0                // multiplicator defining how agile the ship can turn

TiltFactor=0.0               // defines how strong the tilting will be
PitchFactor=0.0               // defines how strong the pitch will be based on speed and acceleration

TrimDepth=2.0                  // default trim depth in feets
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=-0.105           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                  // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=20.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=20.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=25.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Meager
# Radar related (RCS => radar cross section)
RCS=Meager
# Sonar related
BaseNoise=100                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=4               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

############################################################
# Animation references (optional)
############################################################
[Animations]
NumberOfAnimationReferences=2
AnimationFile_1=eu_animations_mk57
AnimationFile_2=eu_animations_LMVLS

[---------- AI related ----------]
[AI]
UnitCostValue=1840            // value for the unit cost for least valuable target checks
UnitScoreValue=4              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=6
ASuW_Capability=10
ASW_Capability=5

#Defence
MissilesToSaturate=8        //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=4       //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD          //Anti-Missile Defence
ATD_Capability=TBD          //Anti-Torpedo Defence
HasChaff=True

#Special
Role=AAW,ASuW

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
Collider=coll_ss1
ModuleType=CIC

[MainPowerSystem]
############################################################
# Main Power System (engine room, boiler, reactor)
############################################################
