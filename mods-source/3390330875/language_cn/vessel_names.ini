--------  Arleigh Burke Flight 1 and Flight 2's  ---------

[usn_ddg_burke_f1_1996]
Type=DDG,驱逐舰
Default=阿利·伯克级 Flight I,伯克
DefaultDescription=阿利·伯克级导弹驱逐舰是首款配备AEGIS的导弹驱逐舰，是美国海军进步的标志性见证。阿利·伯克级DDG被选为第一种全新设计的舰艇，融合了大量造船和作战系统方面的进步，打造出迄今为止最强大的驱逐舰级舰艇。通过采用雷达截面缩减措施、红外信号缩减、革命性的模块化造船设计和先进材料以提高生存能力，伯克级与以往的驱逐舰相比在所有领域都极为强大，并具备显著的多任务能力而无需妥协。Flight I型伯克级是首批生产批次，采用SPY-1D雷达搭配AEGIS和UQQ-89反潜作战系统，但该级舰完全缺乏容纳多用途直升机的机库，且未配备SLQ-32(V)3电子对抗模块，因为巡洋舰和航母优先获得了这些装备。在00年代初期，许多Flight I型伯克级获得了武器升级，例如改进型战术战斧巡航导弹、RIM-66M-5、Mark 54鱼雷、Block 1G鱼叉导弹以及改进的箔条/诱饵对抗措施。
