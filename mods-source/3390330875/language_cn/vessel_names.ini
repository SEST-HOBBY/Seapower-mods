Default=洛杉矶级 Flight 2,洛杉矶 Flt2
DefaultDescription=洛杉矶级是一种大型且强大的核攻击潜艇，设计用于为航母战斗群提供反潜护航。这些潜艇安静且配备了复杂的数字火控和跟踪系统，从一开始就设计用于搭载BQQ-5数字声纳和TB-16拖曳阵列。Flight 2升级在艏部压载水舱中增加了12单元战斧/反舰战斧VLS发射装置，改进了反应堆以获得更高输出功率，并增加了额外的静音措施，使其成为出类拔萃的多用途潜艇。
