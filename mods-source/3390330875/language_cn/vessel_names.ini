Default=朱姆沃尔特级（CPS）,朱姆沃尔特
DefaultDescription=朱姆沃尔特级采用倾斜船体、封闭式甲板室和极低雷达信号特征，是一款激进且极具辨识度的设计，作为一款以隐身为主的多任务驱逐舰，围绕先进自动化、综合电力和强大的对陆攻击能力而开发。在其现代化配置中，该级舰进一步向远程精确打击转变，以安装在新型大型导弹发射模块中的常规快速打击武器取代了原先以舰炮火力支援为重点的配置。此配置反映了该级舰经过CPS改装后的状态，并强调其作为高端打击平台的角色。
