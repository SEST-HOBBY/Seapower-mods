Type=SSN,攻击核潜艇
Default=洛杉矶级 Flight 3,洛杉矶 Flt3
DefaultDescription=洛杉矶级是一种大型且强大的核攻击潜艇，设计用于为航母战斗群提供反潜护航。这些潜艇安静且配备了复杂的数字火控和跟踪系统，从一开始就设计用于搭载BQQ-5数字声纳和TB-16拖曳阵列。688I（改进型洛杉矶级）或Flight 3型洛杉矶级潜艇是对原始1970年代设计的全面现代化改造，融合了为海狼计划开发的火控、传感器和静音措施。主要改进包括：保留VLS、将围壳上的水平舵移至艇体并改为可伸缩式以提高声学特征和破冰能力，以及重新设计尾部以容纳AN/BSY-1作战系统及其相关的BQQ-5D、TB-16B和TB-23A。由于结构变化，艇体比之前型号更薄，因此安全操作深度有所降低。
