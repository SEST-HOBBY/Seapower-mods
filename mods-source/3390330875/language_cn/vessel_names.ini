DefaultDescription=朱姆沃尔特级采用倾斜船体、封闭式甲板室和极低雷达信号特征，是一款激进且极具辨识度的设计，作为一款以隐身为主的多任务驱逐舰，围绕先进自动化、综合电力和强大的对陆攻击能力而开发。在其原始配置中，该级舰结合了远程打击武器、先进传感器和重型舰炮武器，与早期美国驱逐舰相比，异常强调海军水面火力支援。此建成配置反映了该级舰在进行大规模以打击为主的CPS改装之前的状态，并保留了其原始的任务平衡。
Variant1=DDG-1000 朱姆沃尔特,朱姆沃尔特
Variant2=DDG-1001 迈克尔·蒙苏尔,蒙苏尔

