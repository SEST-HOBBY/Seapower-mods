[AmmunitionNames]

# ---------- Rockets ----------

usn_lau-3a_apache=LAU-3A is an American 19-tube launcher pod for 2.75-inch (70 mm) Folding-Fin Aerial Rockets (FFAR, the precursor to the HYDRA-70), widely used by U.S. and allied aircraft from the late 1950s through the Vietnam War.

# ------------------ Guns -----------------

usn_cal_03in=7.62mm # OV-10D Gun #

usn_cal_30mm_hedp=30mm HEDP,30mm HEDP (High Explosive Dual Purpose) ammunition is the M789 cartridge, which is the main tactical round for the M230 chain gun mounted on the AH-64 Apache attack helicopter.

#-----------鱼雷---------

usn_mk48_mod8_adcap=MK 48 Mod 8 ADCAP,TI-1、反潜/反舰鱼雷——MK 48 Mod 8 是对 MK 48 ADCAP 重型鱼雷的计划升级版本，采用了 APB 6（先进处理器架构 6）软件和 TI-1（技术植入 1）硬件改进。 


# ------- 声纳浮标-------

usn_ssq-62=AN/SSQ-62A,DICASS,主动声纳浮标——AN/SSQ-62A DICASS 是一种主动声纳浮标，用于精确定位此前已由 SSQ-53 被动声纳浮标探测到的水下潜艇。