[usn_es-3a]
Type=偵察兵
Default=ES-3A,ES-3A
DefaultDescription=在1980年代，老舊的EA-3/EKA-3機隊的問題不容忽視，因此啟動了一項計劃，對少量現役的S-3A反潛飛機進行改裝，以彌補這一能力缺口。 ES-3A配備了極為先進的電子支援措施（ESM）、電子情報（ELINT）、信號情報（SIGINT）和通訊情報（COMINT）系統，只需兩架飛機即可收集整個作戰區域內所有發射訊號的資料。這也賦予了ES-3A極高的辨識能力，這意味著兩架ES-3A編隊作戰時，無需發射任何訊號，即可從遠距離精確定位敵方具體兵力部署。這次改裝的代價是，ES-3A失去了武器作戰能力和反潛感測器能力，不過新型APS-137雷達支援合成孔徑雷達/運動目標指示（SAR/MTI）地面測繪模式，使其具備出色的空對地作戰能力。
