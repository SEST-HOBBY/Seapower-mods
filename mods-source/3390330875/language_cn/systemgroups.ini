[SystemNames]

#======================================== United States ========================================
#-------------------------------------- Visual ---------------------------------------
eu_AN/BVS-1=AN/BVS-1|AN/BVS-1 是一种非穿透式光电桅杆系统, 主要用于美国海军 Virginia 级潜艇, 取代传统光学潜望镜。它集成了高分辨率摄像机, 微光增强系统和红外传感器, 提供全天候可见光, 红外和电视成像。由于不穿透耐压壳体, 它显著增强了潜艇的隐身性能和内部设计灵活性, 通过光纤电缆将数字数据直接传输到指挥中心。

eu_AN/BVS-1(V)=AN/BVS-1(V)|AN/BVS-1(V) 是进一步升级的非穿透式光电桅杆系统, 主要用于较新型的美国海军 Virginia 级潜艇, 取代传统光学潜望镜。它集成了高分辨率摄像机, 微光增强系统和红外传感器, 提供全天候可见光, 红外和电视成像。由于不穿透耐压壳体, 它显著增强了潜艇的隐身性能和内部设计灵活性, 通过光纤电缆将数字数据直接传输到指挥中心。

#-------------------------------------- Radar ---------------------------------------


#--------- Submarines ----------
eu_AN_BPS-16=AN/BPS-16|AN/BPS-16 是一种低功率对海搜索与导航雷达, 工作在 X band (IEEE 指定) 或 I band (NATO 指定), 装备于美国核动力潜艇。它是 AN/BPS-15 的演进型号, 与其共享大部分技术参数。主要区别在于其桅杆结构具有改进的稳定性。

eu_AN_BPS-17=AN/BPS-17|AN/BPS-17 是一种固态对海搜索与导航雷达系统, 部署于美国海军 Virginia 级 BLK IV 潜艇。该雷达旨在支持安全导航, 常规对海搜索和防撞, 具有低截获概率 (LPI) 能力, 帮助潜艇避免被敌方电子支援措施 (ESM) 探测。

#-------------------------------------- Sonar ---------------------------------------


#--------- Submarines ----------

eu_BQQ-10-ARCI=AN/BQQ-10 (ARCI)|AN/BQQ-10 ARCI (Acoustic Rapid Commercial Off-The-Shelf Insertion, 声学快速商业现货技术插入) 是美国海军的潜艇声纳系统。它用商用计算硬件和开放式架构取代了昂贵的专有传统处理器。这使得海军能够利用现代软件算法和计算能力持续升级其潜艇舰队。ARCI AN/BQQ-10 系统主要由 Lockheed Martin 开发, 部署于整个现役美国海军潜艇舰队 (包括升级的 Los Angeles, Seawolf, Ohio 和 Virginia 级潜艇) 以及多个盟国海军。

eu_BQQ-10-LAB=AN/BQQ-10 (LAB)|AN/BQQ-10 LAB 是美国海军最新的标准潜艇声纳套件。其大孔径艏 (LAB) 阵列是一个大型的水背式共形声纳面板, 安装在潜艇前部。该阵列于 Virginia 级 Block III 潜艇引入, 取代了传统的, 占用空间大的球形声纳阵。

eu_LWWAA=LWWAA|Light Weight Wide Aperture Array (LWWAA, 轻型宽孔径阵列) 是一种尖端的光纤被动舷侧声纳系统, 主要用于美国海军 Virginia 级潜艇。它安装在艇体面板中, 利用激光和光纤技术探测, 识别和跟踪敌方声学特征。

eu_LWWAA_R=LWWAA|Light Weight Wide Aperture Array (LWWAA, 轻型宽孔径阵列) 是一种尖端的光纤被动舷侧声纳系统, 主要用于美国海军 Virginia 级潜艇。它安装在艇体面板中, 利用激光和光纤技术探测, 识别和跟踪敌方声学特征。

eu_LWWAA_L=LWWAA|Light Weight Wide Aperture Array (LWWAA, 轻型宽孔径阵列) 是一种尖端的光纤被动舷侧声纳系统, 主要用于美国海军 Virginia 级潜艇。它安装在艇体面板中, 利用激光和光纤技术探测, 识别和跟踪敌方声学特征。
#-------------------------------------- ESM ---------------------------------------

eu_AN/BLQ-10=AN/BLQ-10|AN/BLQ-10 是美国海军的潜艇电子战支援 (ESM) 系统。由 Lockheed Martin 开发, 它可自动探测, 识别和定位敌方, 友方和中立方的雷达及通信信号, 为潜艇指挥官提供实时态势感知和威胁预警。

eu_AN/WLY-1=AN/WLY-1|AN/WLY-1 是一种先进的水声对抗系统, 装备于美国海军的 Virginia 级核动力攻击潜艇。该防御套件由 Northrop Grumman 开发, 可自动探测, 分类并部署实时声学诱饵以击败来袭敌方鱼雷。
#-------------------------------------Towed Sonar -------------------------------------

eu_TB-16B=TB-16B|TB-16B 是一种升级的"粗线"被动声学拖曳阵列, 主要由美国海军部署于 Los Angeles, Seawolf 和 Virginia BLK I/II 级潜艇。在现代海军作战背景下, 其声学数据直接馈入 AI 驱动的声纳处理器 (如 AN/BQQ-10), 以自动探测, 分类和跟踪水下威胁。

eu_TB-23=TB-23|TB-23 是一种细线被动声学拖曳阵列, 主要由美国海军部署于冷战后期及现代潜艇, 包括 Los Angeles, Ohio 和 Virginia (BLK I) 级。作为可收放系统, 其声学数据馈入声纳处理器以滤除海洋噪声, 校正拖缆弯曲曲线, 并隔离来自远距离水下威胁的低频机械特征。其主要局限是约 5 节的严格速度上限以防止遮蔽性流噪声和机械应力, 以及固有的左右方位模糊性, 需要潜艇转向以确认目标的真实位置。

eu_TB-29A=TB-29A|TB-29A 是一种先进的细线被动声学传感器, 由美国海军潜艇拖曳, 包括 Los Angeles (最新升级), Seawolf 和 Virginia (Block II 起) 级。配备商用现货 (COTS) 遥测技术, 它显著扩展了对安静型柴电潜艇和核潜艇在远洋及浅海沿岸 (濒海) 环境中的探测距离。

eu_TB-34A=TB-34A|TB-34 (具体为 TB-34A) 是一种先进的下一代"粗线"拖曳声纳阵列, 由美国海军使用。部署于最新升级的 Los Angeles 级, Seawolf 级和 Virginia 级 (Block III 起) 潜艇后方, 它将水听器传感器拖曳在远离艇体的位置以避开潜艇自身噪声, 显著提高了潜艇探测和规避接触的能力。
