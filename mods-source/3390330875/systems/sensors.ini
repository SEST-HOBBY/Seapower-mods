[---------------------PRIVATE USN Mod (2025 NIMITZ) - Sensors--------------------- ]  
#
# Custom sensor definitions for the PRIVATE US Navy Expanded Mod (2025 NIMITZ)
# All sensors are calibrated for 2025-era Nimitz class CVN fits
# Vanilla SPS-48E and SPS-49V5 are referenced directly from base sensors.ini
#

[ ========================== RADARS ========================== ]

[ ---------- Surface/Navigation Search ---------- ]

[SPS-67V]
# AN/SPS-67(V)3 Surface Search Radar
# Upgraded variant of SPS-67 with improved MTI, digital processing, and better
# low-altitude/sea-skimmer detection. G-Band (C-Band by ITU). 2025 Nimitz fit.
# Replaces vanilla SPS-67 which represents the early 1980s baseline.
# Sources: Globalsecurity, naval-technology.com, Jane's Fighting Ships
Kind=Radar
Type=Search
HasDataLink=True
Role=Surface
Mode=Illuminate
RotationDirection=1
TargetChannels=1
WeaponChannels=1
RPM=20                         // increased from vanilla 19rpm — later variants run faster scan rate
MinRange=0.4                   // km
MaxRange=111.0                 // km — improved from vanilla 104km; (V)3 quoted ~60nmi surface/low air
MinAltitude=0
MaxAltitude=600.0              // slightly extended low-altitude coverage vs vanilla
RangeResolution=100.0          // improved from vanilla 150m — digital processing improvement
BeamWidth=1.3                  // tightened from vanilla 1.5 — improved antenna
Gain=42.0                      // up from vanilla 40dB — upgraded receiver sensitivity
Frequency=C-Band               // G-Band/C-Band, unchanged from baseline
PeakPower=300.0                // up from vanilla 280kW — later variant transmitter
UseSignature=SurfaceSearchRadar
ModuleType=SmallSensor
CanDetectPeriscope=True        // retained from vanilla SPS-67

[ ---------- Horizon Search / Target Acquisition ---------- ]


[ ---------- Air Traffic Control Radars ---------- ]

[SPN-43C]
# AN/SPN-43C Carrier Air Traffic Control Radar
# 2D ATC marshalling radar. Primary sensor for Carrier Air Traffic Control (CATC).
# C variant adds dual TX/RX sets for immediate hot standby redundancy, coherent
# MTI/MTD digital processing via COTS VME chassis, and improved clutter rejection
# in littoral environments. Replaces vanilla SPN-43 (baseline/B variant).
# Sources: FAS man.fas.org/an-spn-43.htm, Jane's Avionics
Kind=Radar
Type=Search
HasDataLink=False              // local use only — CATC function, not fleet datalink
Role=Air
Mode=Illuminate
RotationDirection=1
TargetChannels=2               // dual system allows simultaneous control of multiple aircraft
WeaponChannels=1
RPM=15                         // unchanged from baseline
MinRange=0.22                  // km
MaxRange=150.0                 // km — SPN-43C extended from vanilla 129km; ~80nmi documented
MinAltitude=100                // marshalling radar; min altitude for aircraft in pattern
MaxAltitude=30480
RangeResolution=40.0           // improved from vanilla 50m — MTD processing upgrade
BeamWidth=1.3                  // slightly tightened from vanilla 1.5
Gain=35.0                      // up from vanilla 32dB — upgraded receiver
Frequency=S-Band               // S-Band, unchanged
PeakPower=1200.0               // up from vanilla 1000kW — dual TX gives higher effective power
ModuleType=SmallSensor

[SPN-46]
# AN/SPN-46 Automatic Carrier Landing System (ACLS)
# Ka-band and X-band monopulse Doppler Precision Approach Landing System (PALS).
# Guides aircraft on final approach via the Automatic Carrier Landing System.
# 2ft precision at 10nm range. Replaced AN/SPN-42. Not in vanilla (post-1985 system).
# Multiple variants: (V)1 shipboard, (V)3 upgraded reliability (2021 still in service).
# Sources: Wikipedia/AN/SPN-46, tpub.com NAVAIR technical manuals
Kind=Radar
Type=Search
HasDataLink=False              // local precision landing aid only
Role=Air
Mode=Illuminate
RotationDirection=1
TargetChannels=2               // guides up to 2 aircraft simultaneously on approach
WeaponChannels=1
RPM=0                          // non-rotating; tracks individual aircraft on approach path
MinRange=0.1                   // km
MaxRange=18.5                  // km — 10nm documented approach range
MinAltitude=0
MaxAltitude=5000               // precision approach only; relevant altitude band
RangeResolution=15.0           // 2ft (~0.6m) precision documented; very fine resolution
BeamWidth=0.5                  // extremely narrow monopulse beam for precision guidance
Gain=44.0                      // high gain Ka/X monopulse system
Frequency=Ka-Band              // Ka and X-Band monopulse Doppler (primary Ka-Band)
PeakPower=50.0                 // 50kW peak documented
ModuleType=SmallSensor

[SPN-41]
# AN/SPN-41 Landing Aid Radar
# X-Band landing aid providing azimuth/glide slope guidance to pilots on final approach.
# Works in conjunction with SPN-46 ACLS. Provides ILS-equivalent guidance.
# Not in vanilla sensors.ini — post-1985 Nimitz fit.
# Sources: Jane's Fighting Ships, naval-technology.com Nimitz class sensors listing
Kind=Radar
Type=Search
HasDataLink=False              // local landing aid only
Role=Air
Mode=Illuminate
RotationDirection=1
TargetChannels=2
WeaponChannels=1
RPM=0                          // fixed beam landing aid — non-rotating
MinRange=0.1
MaxRange=9.3                   // km — ~5nm approach aid range
MinAltitude=0
MaxAltitude=2000
RangeResolution=25.0
BeamWidth=0.8                  // narrow beam for approach guidance
Gain=38.0
Frequency=X-Band               // X-Band landing aid
PeakPower=25.0
ModuleType=SmallSensor

[ ========================== ESM ========================== ]

[SLQ-32A_V4_ESM]
# AN/SLQ-32A(V)4 Electronic Warfare Suite — ESM Component
# The (V)4 is the carrier-specific variant of the SLQ-32, combining both ESM and ECM
# functions in a single integrated suite. Replaces separate WLR-1 (ESM) and SLQ-17 (ECM)
# entries from the vanilla 1985 Nimitz fit. (V)4 covers the full radar threat spectrum
# from L-Band through Ka-Band — significantly broader than vanilla WLR-1 (VHF→X only).
# Higher gain and IdentificationRate than WLR-1 reflecting 1990s-2000s digital upgrades.
# Sources: FAS man.fas.org/an-slq-32.htm, globalsecurity.org/an-slq-32, Wikipedia SLQ-32
Kind=ESM
Gain=22                        // up from WLR-1s 15dB — (V)4 upgraded antenna/receiver suite
HasDataLink=True
AngularResolution=5.0          // improved from WLR-1s 10 degrees — better DF accuracy
Frequencies=L-Band,S-Band,C-Band,X-Band,Ku-Band,Ka-Band   // (V)4 covers wider spectrum than WLR-1
OverHorizonMultiplier=2.0      // carrier island height gives some OTH ESM capability
IdentificationRate=1.5         // much faster than WLR-1 (0.15) — digital library vs manual
ModuleType=SmallSensor

[ ========================== ECM ========================== ]

[SLQ-32A_V4_ECM]
# AN/SLQ-32A(V)4 Electronic Warfare Suite — ECM Component
# Active jamming/deception component of the integrated (V)4 EW suite on CVNs.
# Replaces vanilla AN/SLQ-17 (JamChance 0.30, X+Ku only).
# (V)4 provides broader frequency jamming and higher effectiveness than SLQ-17.
# Interfaces with Mk 36 SRBOC for combined soft-kill coordination.
# Sources: globalsecurity.org/an-slq-32, FAS, Jane's Electronic Mission Aircraft
Kind=ECM
Frequencies=S-Band,C-Band,X-Band,Ku-Band   // broader than SLQ-17 (X+Ku only)
Type=Defensive
JamChance=0.45                 // up from SLQ-17s 0.30 — (V)4 is significantly more capable
ModuleType=SmallSensor

