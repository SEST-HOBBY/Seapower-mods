Plane1=Sail_Planes
MaxAngle=30.0
Direction=1.0
Collider=coll_sail_planes

[DepthRudderSystem2]
NumberOfPlanes=1
Plane1=Stern_Planes
MaxAngle=30.0
Direction=-1.0
Collider=coll_planes

