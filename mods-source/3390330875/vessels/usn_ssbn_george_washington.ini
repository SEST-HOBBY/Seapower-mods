[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.3
MinCameraDistanceBroadside=0.9
CameraPivotHeight=0.15

Length=116                     // in meters
Beam=10                        // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None

TransitVelocity=5 //kts
PatrolVelocity=10 //kts
PatrolDuration=5184000 //seconds

MaxGuidanceWires=2

[OpticalView]
Views=standard_periscope
DefaultView=standard_periscope

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=6700              // in tons

MaxForwardVelocity=22.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=16.0
MaxBackwardVelocitySurfaced=3.0
MaxBackwardVelocity=7.0        // sets the max backward velocity
TelegraphVelocities=-7,0,5,10,15,18,22

BowUnderWater=19.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=20.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.5                // multiplicator defining how agile the ship can turn

MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=0			           // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=50.0            // in feet
CrushDepth=1050.0              // in feet

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.45                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=135                  // base sound level in db at 1m distance
FlowNoise=1.0                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=20             // additional noise for cavitation in db
TargetReflectionStrength=20    // in dB for broad side
BladesCount=7                  //number of blades on vessel's propulsion systems
ElectricFrequency=60           //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usn_ssbn_george_washington

[---------- AI related ----------]
[AI]
UnitCostValue=10000           // value for the unit cost for least valuable target checks
UnitScoreValue=10             // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
AAW_Capability=0
ASuW_Capability=3
ASW_Capability=3

#Defence
#Special
Role=SSBN

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_cic
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=Nuclear
HorsePower=15000
Collider=coll_engineroom

[PropulsionSystems]
############################################################
# Propulsion Systems
############################################################
NumberOfPropulsionSystems=1

[PropulsionSystem1]
Mount=Propeller
RotationDirection=Right
Collider=coll_prop

#Rudder Systems
[RudderSystems]
############################################################
# Rudder Systems
############################################################
NumberOfRudderSystems=1

[RudderSystem1]
Mount=Rudder
Collider=coll_rudder

[DepthRudderSystems]
NumberOfDepthRudderSystems=2

[DepthRudderSystem1]
