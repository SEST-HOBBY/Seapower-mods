[SystemNames]

#======================================== United States ========================================
#-------------------------------------- Visual ---------------------------------------
eu_AN/BVS-1=AN/BVS-1|The AN/BVS-1 is a non-hull-penetrating photonics mast system utilized primarily on U.S. Navy Virginia-class submarines, replacing traditional optical periscopes. It integrates high-resolution cameras, light-intensification systems, and infrared sensors to provide all-weather visual, IR, and TV imaging. Because it does not penetrate the pressure hull, it significantly increases submarine stealth and interior design flexibility, routing digital data directly to the command center via fiber-optic cables.

eu_AN/BVS-1(V)=AN/BVS-1(V)|The AN/BVS-1(V) is a further upgraded non-hull-penetrating photonics mast system utilized primarily on newer U.S. Navy Virginia-class submarines, replacing traditional optical periscopes. It integrates high-resolution cameras, light-intensification systems, and infrared sensors to provide all-weather visual, IR, and TV imaging. Because it does not penetrate the pressure hull, it significantly increases submarine stealth and interior design flexibility, routing digital data directly to the command center via fiber-optic cables.

#-------------------------------------- Radar ---------------------------------------


#--------- Submarines ----------
eu_AN_BPS-16=AN/BPS-16|The AN/BPS-16 is a low-power surface search and navigation radar operating in the X band (as designated by IEEE) or in the I band (as designated by NATO) for U.S. nuclear-powered submarines. It is an evolution of the AN/BPS-15 and shares the most technical parameters with it. The main distinction is the improved stability of its mast construction.

eu_AN_BPS-17=AN/BPS-17|The AN/BPS-17 is a solid-state surface search and navigation radar system deployed on U.S. Navy Virginia-class BLK IV submarines. Designed to support safe navigation, routine surface search, and collision avoidance, the radar features low-probability-of-intercept (LPI) capabilities to help the submarine avoid detection by enemy electronic support measures (ESM).

#-------------------------------------- Sonar ---------------------------------------


#--------- Submarines ----------

eu_BQQ-10-ARCI=AN/BQQ-10 (ARCI)|The AN/BQQ-10 ARCI (Acoustic Rapid Commercial Off-The-Shelf Insertion) is the U.S. Navy’s submarine sonar system. It replaces expensive, proprietary legacy processors with commercial computing hardware and an open architecture. This allows the Navy to continuously upgrade its submarine fleet with modern software algorithms and processing power. Developed primarily by Lockheed Martin, the ARCI AN/BQQ-10 system is deployed across the entire active U.S. Navy submarine fleet (including upgraded Los Angeles, Seawolf, Ohio, and Virginia-class boats) and several allied navies.

eu_BQQ-10-LAB=AN/BQQ-10 (LAB)|The AN/BQQ-10 LAB is the U.S. Navy’s newest standard submarine sonar suite. Its Large Aperture Bow (LAB) array is a massive, water-backed conformal sonar panel located on the front of the submarine. Introduced on Block III Virginia-class submarines, it replaces the legacy, space-consuming spherical sonar spheres.

eu_LWWAA=LWWAA|The Light Weight Wide Aperture Array (LWWAA) is a cutting-edge fiber-optic passive flank sonar system used primarily on U.S. Navy Virginia class submarines. Mounted in panels on the hull, it uses laser and fiber-optic technologies to detect, identify, and track enemy acoustic signatures. 

eu_LWWAA_R=LWWAA|The Light Weight Wide Aperture Array (LWWAA) is a cutting-edge fiber-optic passive flank sonar system used primarily on U.S. Navy Virginia class submarines. Mounted in panels on the hull, it uses laser and fiber-optic technologies to detect, identify, and track enemy acoustic signatures. 

eu_LWWAA_L=LWWAA|The Light Weight Wide Aperture Array (LWWAA) is a cutting-edge fiber-optic passive flank sonar system used primarily on U.S. Navy Virginia class submarines. Mounted in panels on the hull, it uses laser and fiber-optic technologies to detect, identify, and track enemy acoustic signatures. 
#-------------------------------------- ESM ---------------------------------------

eu_AN/BLQ-10=AN/BLQ-10|The AN/BLQ-10 is the U.S. Navy's submarine Electronic Warfare Support (ESM) system. Developed by Lockheed Martin, it automatically detects, identifies, and localizes hostile, friendly, and neutral radar and communications signals to give submarine commanders real-time situational awareness and threat warnings.

eu_AN/WLY-1=AN/WLY-1|The AN/WLY-1 is an advanced acoustic countermeasures system equipping the US Navy's Virginia-class nuclear-powered attack submarines. Developed by Northrop Grumman, this defensive suite automatically detects, classifies, and deploys real-time acoustic decoys to defeat incoming enemy torpedoes.
#-------------------------------------Towed Sonar -------------------------------------

eu_TB-16B=TB-16B|The TB-16B is an upgraded, "fat-line" passive acoustic towed array predominantly deployed by the U.S. Navy on Los Angeles, Seawolf and Virgina BLK I/II class submarines. In modern naval contexts, its acoustic data feed directly into AI-driven sonar processors (such as the AN/BQQ-10) to automatically detect, classify, and track underwater threats. 

eu_TB-23=TB-23|The TB-23 is a thin-line, passive acoustic towed array predominantly deployed by the U.S. Navy on late-Cold War and modern submarines, including the Los Angeles, Ohio, and Virginia (BLK I) classes. Functioning as a reelable system, its acoustic data feeds into sonar processors to filter ocean noise, correct for cable trailing curves, and isolate low-frequency machinery signatures from distant underwater threats. Its main limitations are a strict speed cap of around 5 knots to prevent blinding flow noise and mechanical stress, combined with an inherent left-right bearing ambiguity that requires the submarine to turn to confirm a target's true position.

eu_TB-29A=TB-29A|The TB-29A is an advanced, thin-line passive acoustic sensor towed by U.S. Navy submarines, including Los Angeles (latest upgrades), Seawolf, and Virginia (from Block II onwards) classes. Equipped with Commercial-Off-The-Shelf (COTS) telemetry, it significantly extends detection ranges against quiet diesel and nuclear submarines in both blue-water and shallow coastal (littoral) environments.

eu_TB-34A=TB-34A|The TB-34 (specifically the TB-34A) is an advanced Next-Generation "fat line" towed sonar array used by the U.S. Navy. Deployed behind latest upgraded Los Angeles-, Seawolf-, and Virginia-class (Block III onwards) submarines, it drags hydrophone sensors far behind the vessel to dodge the submarine's own noise, significantly improving submarine detection and contact avoidance.

