DefaultDescription=A large and powerful class of nuclear attack submarines, the Los Angeles-class were designed to provide anti-submarine escorts to carrier groups. These submarines are quiet and fitted with complex digital fire control and tracking systems, and designed from the outset to carry the BQQ-5 digital sonar and TB-16 towed array. The 688I (Improved Los Angeles) or Flight 3 LA class submarine is a comprehensive modernization of the original 1970's design, incorporating fire control, sensors, and quieting measures developed for the Seawolf program. Primarily, the VLS has been retained, the dive planes on the mast have been moved to the hull and are retractable for improved signature and ice-breaking capabilities, and the stern has been redesigned to accomodate the AN/BSY-1 combat system, alongside its associated BQQ-5D, TB-16B and TB-23A. As a consequence of the structural changes, the hull is thinner than previous vessels, so the safe operating depth is somewhat reduced as a result.
