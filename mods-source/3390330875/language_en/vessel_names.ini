
--------  Zumwalt Class  ---------
[usn_ddg-1000]
Type=DDG,Destroyer
Default=Zumwalt-class,Zumwalt
DefaultDescription=A radical and instantly recognisable design with its tumblehome hull, enclosed deckhouse, and very low radar signature the Zumwalt-class was developed as a stealth-focused multi-mission destroyer built around advanced automation, integrated electric power, and a powerful land attack capability. In its original configuration the class combined long-range strike weapons with advanced sensors and heavy gun armament, giving it an unusual emphasis on naval surface fire support compared to earlier US destroyers. This as-built outfit reflects the class before the large strike-focused CPS conversion and retains its original mission balance.
Variant1=DDG-1000 Zumwalt,Zumwalt
Variant2=DDG-1001 Michael Monsoor,Michael Monsoor

[usn_ddg-1000_cps]
Type=DDG,Destroyer
Default=Zumwalt-class (CPS),Zumwalt
DefaultDescription=A radical and instantly recognisable design with its tumblehome hull, enclosed deckhouse, and very low radar signature the Zumwalt-class was developed as a stealth-focused multi-mission destroyer built around advanced automation, integrated electric power, and a powerful land attack capability. In its modernised configuration the class shifts further toward long-range precision strike, replacing its original gun-based fire support focus with Conventional Prompt Strike weapons housed in new large missile launch modules. This outfit reflects the class after its CPS conversion and emphasises its role as a high-end strike platform.
Variant1=DDG-1000 Zumwalt,Zumwalt
