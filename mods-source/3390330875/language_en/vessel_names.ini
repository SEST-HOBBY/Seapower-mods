DefaultDescription=The Arleigh-Burke class DDG is the first guided missile destroyer with AEGIS, and an iconic testament to US naval advancements. The Arleigh Burke class DDG was selected as the first new-build design to incorporate a large number of advancements in shipbuilding and combat systems to make the most potent destroyer-class vessel to date. Utilizing radar-cross section reduction measures, infrared signature reduction, a revolutionary design of modular shipbuilding and advanced materials to improve survivability, the Burke is extremely potent in all domains compared to previous destroyers, and touts a significant degree of multirole capabilities without compromise. The Flight I Burkes are the initial production batch, and utilize the SPY-1D radar with AEGIS and UQQ-89 ASW combat system, although the class completely lacks a hangar for keeping multirole helicopters, and did not receive the SLQ-32(V)3 ECM module as cruisers and carriers were prioritized for this. In the early 00's many Flight I Burkes received weapons upgrades such as improved Tactical Tomahawk TLAM, RIM-66M-5, the Mark 54 torpedo, Block 1G harpoon, and improved chaff/flare countermeasures.
