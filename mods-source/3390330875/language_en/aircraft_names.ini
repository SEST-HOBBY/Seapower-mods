DefaultDescription=In the 80's, the age of the obsolescent EA-3/EKA-3 fleet was not able to be ignored, so a program to retrofit a handful of fleet-service S-3A ASW aircraft was commenced to fulfill this gap in capability. The ES-3A utilizes an extremely advanced array of ESM, ELINT, SIGINT and COMINT intelligence gathering systems, allowing for a single pair to collect data on all of the emitted signals of an entire operating area. This also provides a high degree of identification capability, meaning ES-3As operating in groups of two can accurately pinpoint exact enemy compositions from great range, all without emitting anything whatsoever. The cost of this retrofit is that there is zero weapons capability, and no ASW sensor capability either, although the new APS-137 radar does support SAR/MTI ground mapping modes for excellent air to surface operation.
