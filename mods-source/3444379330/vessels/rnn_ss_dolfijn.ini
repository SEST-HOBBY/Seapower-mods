[General]
UnitType=Submarine
DefaultCameraDistance=1.1
MinCameraDistanceForeAft=1
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.0

Length=79.5                    // in meters
Beam=7.8                       // in meters

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=1826              // in tons

MaxForwardVelocity=17.0        // sets the max forward velocity
MaxForwardVelocitySurfaced=14.5
MaxBackwardVelocity=5.0        // sets the max backward velocity
MaxBackwardVelocitySurfaced=3.0
TelegraphVelocities=-5,0,4,7,10,14.5,17 // Overrides default telegraph values

BowUnderWater=17.0             // depth in feet, when bow is under water and submerged speeds are used
SailUnderWater=37.0            // depth in feet, from where the sail is under water
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
DepthRudderTurnRate=5.0        // turn rate of the depth rudders in degrees per second
RudderForce=0.75                // multiplicator defining how agile the ship can turn

MaxPitchAngle=30.0
PitchChangeRate=2.0
MaxRollAngle=15.0
RollChangeRate=5.0

BallastTankChangeRate=0.00025  // just a multiplicator how quickly the sub reaches max dive rate
MaxDepthChangeUsingTanks=5.0   // in feet per second using ballast tanks only (no propulsion)

TrimDepth=5                    // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

PeriscopeDepth=38.0            // in feet
CrushDepth=660.0              // in feet

CavitationParameters=20,-100

#Cavitation table
#10kts @ 150ft
#15kts @ 200ft
#20kts @ 300ft
#25kts @ 400ft

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=6.0   // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=25
# Sonar related
BaseNoise=94                    // base sound level in db at 1m distance
FlowNoise=0.45                  // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=7               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=7 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
MachineryRaftingGeneration=4
PropellerType=Skewback
NoiseFrequencies=LF,MF
TonalRPMModifier=100
DistinctiveNoise=False
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_rnn_ss_dolfijn

[---------- AI related ----------]
[AI]
UnitCostValue=6000            // value for the unit cost for least valuable target checks
UnitScoreValue=3              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD

#Offence
ASuW_Capability=6
ASW_Capability=6

#Defence
#Special
Role=SS

