[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.6
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.2

Length=82.3                     // in meters
Beam=17                        // in meters

CompartmentsHeight=0.1         // Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=2800              // in tons

MaxForwardVelocity=15.3        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.90                // this is for velocity damping (linear drag)
MaxAccelerationFactor=3.0
MinAccelerationFactor=2.0

RudderTurnRate=2.9             // turn rate of the rudder in degrees per second
RudderForce=0.80                // multiplicator defining how agile the ship can turn

TiltFactor=1.1               // defines how strong the tilting will be
PitchFactor=0.5               // defines how strong the pitch will be based on speed and acceleration

TrimDepth=1                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=8.0   // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=280
# Sonar related
BaseNoise=102                   // base sound level in db at 1m distance
FlowNoise=0.5                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=6               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=7 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
MachineryRaftingGeneration=5
PropellerType=Regular
NoiseFrequencies=LF,MF
TonalRPMModifier=100
DistinctiveNoise=False
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset

[Animations]
NumberOfAnimationReferences=0
#AnimationFile_1=

[---------- AI related ----------]
[AI]
UnitCostValue=2000            // value for the unit cost for least valuable target checks
UnitScoreValue=2              // value for calculation of mission score

