[General]
UnitType=Vessel
DefaultCameraDistance=1.5
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.05

Length=12                    // in meters
Beam=3.26                       // in meters

CompartmentsHeight=0.03        //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None
NumberOfDCTeams=0

[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=16              // in tons

MaxForwardVelocity=33.0        // sets the max forward velocity
MaxBackwardVelocity=2.0        // sets the max backward velocity
LinearDrag=0.86                // this is for velocity damping (linear drag)
MaxAccelerationFactor=6.2
MinAccelerationFactor=0.1

RudderTurnRate=19.6             // turn rate of the rudder in degrees per second
RudderForce=3.20                // multiplicator defining how agile the ship can turn

TiltFactor=0.1               // defines how strong the tilting will be
PitchFactor=10.0               // defines how strong the pitch will be based on speed and acceleration

TrimDepth=2.5                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=5.0   // Biggest range in nm at which this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=7
# Sonar related
BaseNoise=106                   // base sound level in db at 1m distance
FlowNoise=0.7                   // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=9               // additional noise for cavitation in db
BladesCount=4					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=6 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN
MachineryRaftingGeneration=5
PropellerType=Regular
NoiseFrequencies=MF,HF
TonalRPMModifier=100
DistinctiveNoise=False
Prairie=False					 // True/False, determines if this unit has the "Prairie" screw-mounted bubble-making system for narrowband deception, operates at all speeds until cavitation onset

[---------- AI related ----------]
[AI]
UnitCostValue=50            // value for the unit cost for least valuable target checks
UnitScoreValue=1              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
#Offence
#Defence
MissilesToSaturate=1      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

#Special
Role=ASW


[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_CIC
ModuleType=CIC

#Movement Systems
[MainPowerSystem]
Type=GasTurbine
HorsePower=600
Collider=coll_engineroom

[PropulsionSystems]
NumberOfPropulsionSystems=2

[PropulsionSystem1]
Mount=Dummy
RotationDirection=Left

[PropulsionSystem2]
Mount=Dummy
RotationDirection=Right

#Rudder Systems
[RudderSystems]
NumberOfRudderSystems=1

[RudderSystem1]
Mount=Dummy


[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=4

[SensorSystem1]  #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=AdvancedOptics
Mount=Dummy
MountPosition=0,0.22,0.48

[SensorSystem2] #Leonardo DSS IRST
Type=Radar
SystemName=eu_leonardo_dss
Mount=Dummy
MountPosition=0,0.285,0.34
Collider=coll_irst

[SensorSystem3] #Nav Radar
Type=Radar
SystemName=Nav_Radar
Mount=Dummy
MountPosition=0,0.115,0.107
Collider=coll_navradar

[SensorSystem4] #Dipping Sonar
Type=Sonar
SystemName=eu_FLASH
Mount=Dummy
CableLength=153                                        //length of cable in meters
Depth=750                                              //depth in feets to keep on the cable end when the vessel is on surface
CablePart=effects/ships/emitters/Towed_Array_Line_Thin //prefab object to be used as part of cable
AttachmentPointPosition=0,0.015,-0.0032                //position of a local point where the cable is attached to host vessel
CableAttachmentOffset=0.005                           // offset to the cable end for the sensor

TowedBodyDrag=0.01           //drag coefficient for towed object
TowedBodyBuoyancy=-4
CableRetractRate=2.0         //retract rate for the towed array cable
CableSinkRate=0.01           //sink rate for the towed array cable
CableUnderwaterDrag=0.004

MinDeploySpeed=0.0           //minimal speed in knots to deploy a towed system
MaxDeploySpeed=0.0           //max speed in knots to deploy a towed system
MaxDeployAltitude=45.0       //maximal altitude where a cable can be deployed, in feet, should be somewhat higher than helicopter's Low altitude
SystemGroup=SG_Dipping_Sonar
ModuleType=Sensor

