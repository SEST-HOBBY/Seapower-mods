DefaultDescription=071型综合登陆舰（北约代号：玉昭级）是中国人民解放军海军的大型多功能两栖船坞登陆舰。该型舰拥有宽大的直升机起降甲板和巨大的坞舱，能够搭载多艘726型气垫登陆艇（LCAC）以及多架大型运输直升机，具备极其强悍的超视距立体抢滩登陆作战能力。作为中国海军远洋两栖投送力量的中坚，它彻底颠覆了传统的抵滩登陆模式，是跨海突击与兵力投送的绝对核心。

