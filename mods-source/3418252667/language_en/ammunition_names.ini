# ------------------ AAM ------------------
usn_aim-9m_misaka=AIM-9M,Sidewinder,AAM,The AIM-9 Sidewinder is a short-range air-to-air missile. Entering service with the United States Navy in 1956 and the Air Force in 1964, the AIM-9 is one of the oldest, cheapest, and most successful air-to-air missiles.

usa_aim-9x_blk2_air=AIM-9X,Sidewinder,AAM,The AIM-9 Sidewinder is a short-range air-to-air missile. Entering service with the United States Navy in 1956 and the Air Force in 1964, the AIM-9 is one of the oldest, cheapest, and most successful air-to-air missiles.

usn_aim-120c_misaka=AIM-120C,AMRAAM,AAM,The AIM-120 Advanced Medium-Range Air-to-Air Missile (AMRAAM) (/æmræm/ AM-ram) is an American beyond-visual-range air-to-air missile capable of all-weather day-and-night operations. It uses active transmit-receive radar guidance instead of semi-active receive-only radar guidance. When an AMRAAM missile is launched, NATO pilots use the brevity code "Fox Three".

usn_aim-120c-5_air=AIM-120C-5,AMRAAM,AAM,The AIM-120 Advanced Medium-Range Air-to-Air Missile (AMRAAM) (/æmræm/ AM-ram) is an American beyond-visual-range air-to-air missile capable of all-weather day-and-night operations. It uses active transmit-receive radar guidance instead of semi-active receive-only radar guidance. When an AMRAAM missile is launched, NATO pilots use the brevity code "Fox Three".

usn_aim-120d-3=AIM-120D-3,AMRAAM,AAM,The AIM-120 Advanced Medium-Range Air-to-Air Missile (AMRAAM) (/æmræm/ AM-ram) is an American beyond-visual-range air-to-air missile capable of all-weather day-and-night operations. It uses active transmit-receive radar guidance instead of semi-active receive-only radar guidance. When an AMRAAM missile is launched, NATO pilots use the brevity code "Fox Three".

usn_aim-260a=AIM-260A,JATM,AAM,The AIM-260 Joint Advanced Tactical Missile (JATM) is an American beyond-visual-range air-to-air missile (BVRAAM) being developed and produced by Lockheed Martin.

