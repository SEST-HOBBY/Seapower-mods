usn_agm-88g=AGM-88G,AARGM-ER,ARM,The Navy's FY 2016 budget included funding for an AARGM-Extended Range (ER) that uses the existing guidance system and warhead of the AGM-88E with a dual-pulse solid rocket motor to double the range.

