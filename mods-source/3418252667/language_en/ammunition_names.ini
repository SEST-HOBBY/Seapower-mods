usn_siaw=SIAW,,AGM,The Stand-in Attack Weapon (SiAW) is a tactical air-to-surface missile under development for the United States Air Force (USAF) by Northrop Grumman
It is primarily designed to attack air-defences and high-value targets such as command-and-control sites, surface-to-surface missile launchers, anti-satellite systems, and GPS jamming systems.The design leverages work on the United States Navy's AGM-88G Advanced Anti-Radiation Guided Missile - Extended Range (AARGM-ER).

