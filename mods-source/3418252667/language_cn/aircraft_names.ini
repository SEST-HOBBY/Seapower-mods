[usaf_f-22]
Type=战斗机
Default=F-22A,F-22A
DefaultDescription=F-22“猛禽”（英语：Lockheed Martin F-22 Raptor）是世界上第一款量产的第五代隐形战斗机，采单座双引擎设计。主要担任确保战区制空权的制空战斗机，额外任务包括对地攻击、电子战和信号情报[7]。F-22自2005年进入美国空军服役，用以取代上一代的主力F-15战斗机。洛克希德·马丁为主承包商，负责大部分机身设计、武器系统和F-22的最终组装。计划合作伙伴波音国防太空安全则提供机翼、后机身、航空电子综合系统和培训系统。
Squadron1=F-22A,F-22A
Callsigns=Squadron1,猛禽

