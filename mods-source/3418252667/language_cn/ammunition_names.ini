# ------------------ AAM ------------------
usn_aim-9m_misaka=AIM-9M,响尾蛇,空对空,AIM-9响尾蛇是一种短程空对空导弹。AIM-9于1956年和1964年分别在美国海军和空军服役，是最古老、最便宜、最成功的空对空导弹之一。

usa_aim-9x_blk2_air=AIM-9X,响尾蛇,空对空,AIM-9响尾蛇是一种短程空对空导弹。AIM-9于1956年和1964年分别在美国海军和空军服役，是最古老、最便宜、最成功的空对空导弹之一。

usn_aim-120c_misaka=AIM-120C,阿姆拉姆,空对空,

usn_aim-120c-5_air=AIM-120C-5,阿姆拉姆,空对空,AIM-120先进中程空空导弹（AMRAAM）（/æmræm/AM ram）是一种美国超视距空空导弹，能够全天候昼夜作战。它使用主动发射接收雷达制导，而不是半主动仅接收雷达制导。当AMRAAM导弹发射时，北约飞行员使用简洁的代码“Fox Three”。

usn_aim-120d-3=AIM-120D-3,阿姆拉姆,空对空,AIM-120先进中程空空导弹（AMRAAM）（/æmræm/AM ram）是一种美国超视距空空导弹，能够全天候昼夜作战。它使用主动发射接收雷达制导，而不是半主动仅接收雷达制导。当AMRAAM导弹发射时，北约飞行员使用简洁的代码“Fox Three”。

usn_aim-260a=AIM-260A,JATM,空对空,AIM-260联合先进战术导弹（JATM）是由洛克希德·马丁公司开发和生产的美国超视距空对空导弹（BVRAAM）。



