usn_siaw=SIAW,,对地攻击,替代攻击武器（SiAW）是诺斯罗普·格鲁曼公司为美国空军（USAF）开发的一种战术空对地导弹
它主要用于攻击防空系统和高价值目标，如指挥和控制基地、地对地导弹发射器、反卫星系统和GPS干扰系统。该设计利用了美国海军AGM-88G先进反辐射导弹增程（AARGM-ER）的工作。

