usn_agm-88g=AGM-88G,AARGM-ER,反辐射,海军2016财年的预算包括为AARGM增程（ER）提供资金，该增程使用AGM-88E的现有制导系统和弹头，并配备双脉冲固体火箭发动机，使射程加倍。

