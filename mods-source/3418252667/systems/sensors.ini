[---Air/Air&Surface---]

[AN/APG-77]
#Users: usaf_f-22
Kind=Radar
Type=DirectedSearch    // 雷达类型
HasDataLink=True      // 数据链
Role=AirAndSurface             // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True  // True means the radar can see ground objects
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=30       // 如果适用，它可以同时跟踪的目标数量
WeaponChannels=6       // 火力通道，如果武器（导弹）数量合适，它可以同时制导
ViewArcs=-60,60|-60,60     // 左：水平左右视场，右：垂直视场
LookDownMultiplier=0.7     // 多径地形杂波系数，当目标投影到地形/海洋背景上时，应用于最大雷达距离的乘数，默认值为1.0
MinRange=0.4           // 最小距离
MaxRange=257.5           // 最大距离
MinAltitude=35          // 最低海拔高度，不适用于对地
MaxAltitude=30480      // 最大高度
RangeResolution=18.5   // 识别间距，定义了后方两个目标可以被识别为两个的最小范围；单位为米
BeamWidth=0.8          // 定义承载分辨率>=2*Dist*sin（波束宽度/2）的波束宽度（度）
Gain=58.0              // 传感器上的增益（dB）
Frequency=X-Band       // 波段
PeakPower=20.0         // 功率 in kW
RequiresAlignment=True// 对于飞机。允许飞机制导武器的同时不飞向目标

