[General]
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=Installation    // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=14700                             // in kg. Used for aircraft
AmmoPoints=11050                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

CIWSDefenceBonus=42                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
#low RCS low altitude
DecalClass=Standard          // referenced in effects/decals.ini

SaturationValue=8
DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related
# Transient
TransientRCS=Meager                    // Transient visibility on the radar
TransientVisualIdentificationRange=15  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=220                 // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=142                          // low warhead but high kinetic energy
ImpactSize=Large            // low warhead but high kinetic energy
Penetration=Always              // can be minor, moderate, heavy, always

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
#Guidance Types:
#0 = None
#1 = IR Homing
#2 = Semi-Active Radar Homing
#3 = Active Radar Homing
#4 = Anti-Radiation Homing
#5 = Laser-Homing
#6 = TV-Homing
#7 = Active Sonar Homing
#8 = Passive Sonar Homing
#9 = Wake Homing
[Guidance]
GuidanceType=3                            //Should be TV homing irl?
LandAttackGuidanceType=0
MidCourseCorrection=0                 // 0 = None, 1 = Radio Command, 2 = Wire Guided
TargetRequired=True                    // Cannot be launched to bearing
InitialFlightPhaseDuration=55        // time in seconds where the missile moves straight on without guiding
TerrainFollowFlight=False
PerformsSlightBallisticInitialFlight=False

#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=65.0                      // Climb angle for initial loft
MaxLoftAlt=660000           //120km          // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
#TerminalDelay=0                        // Overrides standart terminal delay
TerminalApproachDist=75              // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalAlt=200000
TerminalDiveDistance=18                // in N. miles.
SupportsBanking=True                   // if the missile will bank when turning
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
LocalTerminalOnly=True
#========================================= Launch stats ============================================================
ApplyKinematics=True                   // 如果我们使用完整的运动学规则。如果这是真的，我们将只使用运动学
MaxVelocity=6600                    // Stall at 500 knots   // Maximum speed in knots
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
AccelerationTime=50                  // 初始助推器燃烧的燃烧时间
Acceleration=7.5                   // 初始燃烧阶段的加速度Gs
SustainerAccelerationTime=15            // 持续燃烧时间。若无持续燃烧，则记为-1
SustainerAcceleration=3.5               // 持续燃烧加速。若无持续燃烧，则值为-1
#---- Total Δv ≈ 3961 ≈ 13Ma
LiftFactor=0.0045				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude

TypicalLaunchVelocity=0 
TypicalFiringAlt=0                    //SAM的阻力计算应该从0高度开始
TypicalTargetVelocity=30 
TypicalTargetAlt=0                    //ASM的阻力计算应该让目标0高度0速度
//It should have significant drag at low altitudes

DragCoefficient=5.1            // 阻力系数。0表示无阻力，1表示默认阻力，数值越大表示阻力越大。默认值为-1，此时我们会根据导弹的最大射程来计算阻力系数

MaxFlightTime=900              // 基于电池等因素，导弹完全失效前的运行时间作为硬限制。默认值：无限

MaxTurnRate=12                         // Maximum turnrate in degrees per second
MinLaunchRange=270                     // Minimum launch range in nautical miles
MaxLaunchRange=864                    // Maximum launch range in nautical miles
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=20     // Circular error vs 'Installation' land units
CircularErrorProbable=20    // radius in meters at max range for shells to impact
#Homing
SeekerGain=50                          // Seeker gain in dB
SeekerFOV=45                           // Seeker total field-of-view in degrees. I.e SeekerFOV=60 means "+-30" degrees each side
SeekerActiveRange=26             // Seeker active range in nautical miles. Relevant for  Active Radar Homing, Laser-Homing and Active Sonar Homing (3, 5 and 7)
SeekerPassiveRange=0                   // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
Frequency=X-Band                       //Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=25                          // Active radar seeker output peak power in kW
TargetMemory=True                      // Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.750          // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.6                   // This value substracted from probability of being jammed  (0...1)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=20.0                 // delay in seconds for self destruction

[---------- Mesh definitions----------]
