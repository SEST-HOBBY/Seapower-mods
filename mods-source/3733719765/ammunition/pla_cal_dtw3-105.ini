[General]
IOCDate=1985			// 初始作战能力年份：首批服役，数量有限
FOCDate=1995			// 全面作战能力年份：大批量列装，可正常选择
Type=Projectile            // can be Projectile, Missile, Torpedo
TargetType=ASuW            // can be AAW, ASuW, ASW

DecalClass=GunImpacts      // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts            // referenced in effects/decals.ini

FrontalArea=0.1234
SideArea=2.9
BottomArea=2.9
Volume=0.0168
[Physics]
MuzzleVelocity=1550        // meter per second
MaxRange=2800              // in meters
GravityFactor=14.5
CircularErrorProbable=3.1    // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = HighExplosive     =  100% damage to structre
#1 = Armor Piercing		TBD
#2 = HEAT              =  200% damage to mobile land units
#3 = Illumination		TBD
#4 = Cluster           =  -50% damage to structre
#5 = Runway Cratering	TBD
#6 = Fragmentation     =  -50% damage to structre
[WarheadData]
WarheadType=1
Power=13
ImpactSize=Small       // Impact size, can be small, medium, large, verylarge
Penetration=Heavy        // can be minor, moderate, heavy, always

[---------- Guidance ----------]
[Guidance]
RequiresLOS=True

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shell
ResourcesMesh=shell_tracer
ResourcesMaterial=shell_mat

[---------- Effects ----------]
[Particles]
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitDefaultExplosionClass=SmallFlakExplosions
HitWaterSplashClass=SmallWaterSplashes
