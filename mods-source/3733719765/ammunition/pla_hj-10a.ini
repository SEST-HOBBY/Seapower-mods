[General]
# HJ-10 ER
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
#SecondaryTargetType=AAW      // No hrut
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly
#CanNotAttackTypes=Aircraft,Missile 

Mass=76                                // in kg. Used for aircraft
AmmoPoints=50                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=2  // at what range in nm this unit can be visually identified
IRSignature=Tiny
# Radar related (RCS => radar cross section)
RCS=VerySmall
# Sonar related

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=2
Power=21
ImpactSize=Small                       // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always
[---------- Guidance ----------]
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
MidCourseCorrection=2                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=2         // time in seconds where the missile moves straight on without guiding
TerrainFollowFlight=True
RequiresLOS=False
TargetRequired=False                    // Cannot be launched to bearing
#FuzeProximityDistance=1             // for proximity fuze: distance to target in yard
#KillProbability=3       //Unless the maneuver cannot keep up
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=30                      // Climb angle for initial loft
MaxLoftAlt=930
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#SeaSkimmingMaxDescentAngle=45.0        // Dive angle whlie going to sea skimming
#SeaSkimmingNoseUp=1.0                  // "nose up" angle in degrees for sea skimming, reflecting the aerodynamics
#SeaSkimmingStartDistToTarget=1000      // in N. miles.
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=2              // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM must be slightly more than max range
TerminalDiveDistance=0.6                // in N. miles.
TerminalVelocity=484

SupportsBanking=False                  // if the missile will bank when turning
#=========================================  Launch Stats  ============================================================
MaxVelocity=330.0                     // Maximum speed in knots
MaxTurnRate=8                       // Maximum turnrate in degrees per second
Acceleration=17                     // Gs of acceleration in initial burn
MinLaunchRange=0.3                    // Minimum launch range in nautical miles
#MaxLaunchRange=2                       // Maximum launch range in nautical miles
MaxLaunchRange=13.5                   // Maximum launch range in nautical miles
LaunchReliability=95                   // The lower the value, the greater risk of misfire or accident (0...100)

#========================================     Seeker     ===========================================================
#Homing
IsRearAspectOnly=False                 // Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=70                     // Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=20                          // Seeker field-of-view in degrees
SeekerGimbalFOV=50                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=5                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True                      // 记忆目标Always locks on preselected target unless spoofed or jammed
#ECCM
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/models/ammunition/hj-10/
ResourcesRoot=hj-10.obj
ResourcesMesh=hj-10
ResourcesMeshForLaunch=launch
ResourcesMeshSwitchTime=0.1  // time in seconds after launch to switch from launch mesh to main mesh
ResourcesMaterial=hj-10_mat.ini

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/TOW_inflight_effect
BoosterEffectPosition=0,0,-0.006
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.006
InFlightEffectStartTime=0

HitDefaultExplosionClass=RocketShipHitExplosion
HitShipExplosionClass=RocketShipHitExplosion
HitAirExplosionClass=RocketShipHitExplosion

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.0015,0.0015,0.012
