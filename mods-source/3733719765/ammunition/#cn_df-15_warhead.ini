#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# DF-15B
# Users: 
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
LandAttackCapability=All // can be  All, Installation, Mobile, ShoreTargetsOnly
RequiresWarmUp=False  //False - removes need to reload launcher before first launch

CIWSDefenceBonus=8                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=7  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=22  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=300               // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=5800
ImpactSize=verylarge                   // Impact size, can be small, medium, large, verylarge
Penetration=always                   // can be minor, moderate, heavy, always

FuzeType=0
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=10         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=75.0                      // Climb angle for initial loft
MaxLoftAlt=99000.0                     // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=12.0              // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalDiveDistance=12                 // in N. miles.
SupportsBanking=True                   // if the missile will bank when turning
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation

#========================================= Launch stats ============================================================
MaxVelocity=3040                       // Maximum speed in knots                    
Acceleration=8.0                      // Acceleration factor
AccelerationTime=35.7                  // Time until start of the velocity bleed, in seconds
MaxTurnRate=5.0                       // Maximum turnrate in degrees per second                 
MinLaunchRange=35.0                     // Minimum launch range in nautical miles
MaxLaunchRange=300                    // Maximum launch range in nautical miles
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=30    // Circular error vs 'Installation' land units
#Homing
#ECCM
CounterMeasuresRejection=85            // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=85                     // The lower the value, the greater risk of spoofing by jamming	(0...100)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=2.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/df-15b/
ResourcesRoot=df-15b.obj
ResourcesMesh=warhead
ResourcesMaterialFolder=assets/models/land_units/df-15_tel_late/textures/
ResourcesMaterial=df-15_mat.ini
############################################################

NumberOfSubModels=0
[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=none
BoosterEffectPosition=0,0,0
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,0.05
InFlightEffectStartTime=4.0  // in seconds, after that the Inflight Effect will be played if available

HitShipExplosion=effects/explosions/emitters/Ammo_ship_explosion_1
HitShipExplosionRotation=0,25,0
HitAirExplosionClass=LargeMissileExplosions
HitAirExplosionRotation=0,25,0
HitWaterSplashClass=effects/explosions/emitters/Ammo_ship_explosion_1
HitWaterSplashRotation=0,25,0
HitDefaultExplosion=effects/explosions/emitters/Ammo_ship_explosion_1
HitDefaultExplosionRotation=0,25,0
HitGroundExplosionClass=effects/explosions/emitters/Ammo_ship_explosion_1losions/emitters/missile_hit_ship_3
HitGroundExplosionRotation=0,25,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043