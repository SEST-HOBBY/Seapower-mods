#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# DF-15B
# Users: 
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=ASuW                         // can be AAW, ASuW, ASW
LandAttackCapability=All // can be  All, Installation, Mobile, ShoreTargetsOnly
RequiresWarmUp=False  //False - removes need to reload launcher before first launch

Mass=6170

CIWSDefenceBonus=8                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=7  // at what range in nm this unit can be visually identified
IRSignature=SemiSmall
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related
# Transient
TransientRCS=Medium                    // Transient visibility on the radar
TransientVisualIdentificationRange=22  // Transient can be visually detected at this distance in nmi
TransientBaseNoise=300               // In db

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types: 0 = Impact Fuze, 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=125
ImpactSize=VeryLarge                  // Impact size, can be small, medium, large, verylarge
Penetration=Always                   // can be minor, moderate, heavy, always

FuzeType=0


[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=0
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=50         // time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=65.0                      // Climb angle for initial loft
MaxLoftAlt=245000.0                     // in feet. Maximum altitude for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=30.0              // in N. miles. Recommended to set this distance slightly less than the seeker range
TerminalAlt=120000
TerminalDiveDistance=10                // in N. miles.
SupportsBanking=True                   // if the missile will bank when turning
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation

#========================================= Launch stats ============================================================
ApplyKinematics=True                   // 如果我们使用完整的运动学规则。如果这是真的，我们将只使用运动学
MaxVelocity=2000                    // Stall at 500 knots   // Maximum speed in knots
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
AccelerationTime=18                  // 初始助推器燃烧的燃烧时间
Acceleration=12.4                    // 初始燃烧阶段的加速度Gs
SustainerAccelerationTime=35            // 持续燃烧时间。若无持续燃烧，则记为-1
SustainerAcceleration=2.8               // 持续燃烧加速。若无持续燃烧，则值为-1
#---- Total Δv ≈ 2042 ≈ 6Ma
LiftFactor=0.0001				// default is 0.005, defines the extra drag at high altitudes/low speeds due to the increase AOA from lift loss, lower values improve lift characteristics and are less impacted by altitude

TypicalLaunchVelocity=0 
TypicalFiringAlt=0                    //SAM的阻力计算应该从0高度开始
TypicalTargetVelocity=0 
TypicalTargetAlt=0                     //ASM的阻力计算应该让目标0高度0速度
//It should have significant drag at low altitudes
//I can only shoot this way by setting it up


DragCoefficient=3               // 阻力系数。0表示无阻力，1表示默认阻力，数值越大表示阻力越大。默认值为-1，此时我们会根据导弹的最大射程来计算阻力系数

MaxTurnRate=12                       // Maximum turnrate in degrees per second                 
MinLaunchRange=75.0                     // Minimum launch range in nautical miles
MaxLaunchRange=432.4                    // Maximum launch range in nautical miles
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=33    // Circular error vs 'Installation' land units
#Homing
#ECCM
CounterMeasuresRejection=85            // The lower the value, the greater risk of spoofing by countermeasures (0...100)
NoiseRejection=85                     // The lower the value, the greater risk of spoofing by jamming	(0...100)
#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=2.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/df-15b/
ResourcesRoot=df-15b.obj
ResourcesMesh=warhead
ResourcesMeshForLaunch=missile
ResourcesMeshSwitchTime=30  // time in seconds after launch to switch from launch mesh to main mesh
ResourcesMaterialFolder=assets/models/land_units/df-15_tel_late/textures/
ResourcesMaterial=df-15_mat.ini
############################################################

NumberOfSubModels=0

#[-Debris]
DebrisProbability=101              // in %, probability for debris to happen
ResourcesMeshFolder=assets/models/ammunition/df-15b/
RootMesh=df-15b.obj
ResourcesMeshForDebris=body  // optional debris mesh after destruction
#DebrisPosition=0.05                // moves it in front of the warhead to have the trailing effect at correct position
DebrisLifeTime=10.0
DebrisVelocityDampening=0.9
DebrisHeightLossAdd=0.0005   // determines how quickly the debris loses height

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/sam_medium_effect
BoosterEffectPosition=0,0,0
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,0
InFlightEffectStartTime=15  // in seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/sam_medium_effect
SustainerEffectPosition=0,0,-0.033
SustainerEffectStartTime=4.0

HitShipExplosion=VeryLargeGroundHitExplosions
HitShipExplosionRotation=0,25,0
HitAirExplosionClass=LargeMissileExplosions
HitAirExplosionRotation=0,25,0
HitWaterSplashClass=VeryLargeGroundHitExplosions
HitWaterSplashRotation=0,25,0
HitDefaultExplosion=VeryLargeGroundHitExplosions
HitDefaultExplosionRotation=0,25,0
HitGroundExplosionClass=VeryLargeGroundHitExplosions
HitGroundExplosionRotation=0,25,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit boxes for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043