#globalmil
Kind=Radar
Type=Search            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Air               // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=0      // if applicable number of targets it can track simultaneously
WeaponChannels=0      // if applicable number of weapons (missiles) it can guide simultaneously
RotationDirection=1    // -1 means left, 1 means right
RPM=10                 // revolutions per minute
MinRange=3           // min range in km
MaxRange=490        // max range in km
MinAltitude=50         // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30500   // max altitude in meters, relevant for air, unused for surface
RangeResolution=29  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.8          // defáines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=50.0              // gain in dB on the sensor
Frequency=S-Band       // frequency banWd
PeakPower=1000      //with a peak power output on 1MW (average 60 kW)
// output peak power in kW

