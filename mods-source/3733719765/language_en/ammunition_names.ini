pla_hq-64=HQ-64,,SAM,The HQ-64 is an improved version of the HQ-61, incorporating experience and technologies gained from the LY-60 project. When paired with a command vehicle, the system is called HQ-6D air defense system. The firepower is doubled by increasing the number of missiles for each truck mounted launcher from two to four, and by replacing the launching rails with container box launchers, the reliability is also increased.

