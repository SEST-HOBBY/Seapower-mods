pla_hq-9=HQ-9,,SAM,HQ-9 air defense missile system is China's first third-generation mid to high altitude medium to long range air defense missile.

pla_hq-7b=HQ-7B,,SAM,The HQ-7 (NATO reporting name: CH-SA-4) is a short-range surface-to-air missile (SAM) from the People's Republic of China. It was reverse-engineered by the Changfeng Electromechanical Technology Design Institute from the French R-440 Crotale SAM. It entered service in the early 1980s.

pla_hq-9b=HQ-9B,,SAM,HQ-9B air defense missile system is a new generation of independently developed long-range air defense missile system. It is a derivative model of the Hongqi 9 air defense missile. Has strong regional air defense capabilities.

pla_hq-9c=HQ-9C,,SAM,HQ-9C has reduced its projectile size and added side push rockets to the rear of the warhead, equipped with a total of 8 small diameter launch tubes to increase the firepower density of the ground air defense battalion. The launch vehicle chassis used by Hongqi-9C and Hongqi-9B are completely interchangeable, and the missile launch tube has the words "ADK-9C", which means "the third improved version of Air Force Surface to Air Missile No. 9".

