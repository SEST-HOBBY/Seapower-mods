pla_cj-10=CJ-10,Cruise Missile,Land Attack,The CJ-10 is a long-range land-attack cruise missile developed by China.It serves as a critical component of the PLAN's long-range ground strike capabilities.

pla_cj-100=CJ-100,Cruise Missile,Land Attack, launchable from land-based vehicles, specifically designed to strike military facilities and sea-air nodes, spends most of its flight at high altitude and high speed, with terminal velocity reaching 4 Mach

pla_df-10a=DF-10A,,Cruise Missile,Land Attack,considered an upgraded variant of the CJ-10 missile

pla_yj-62=YJ-62,,ASM,The improved version of the YJ-62 can be used for both sea and land attack with mid-flight course correction capabilities.

pla_yj-12b=YJ-12B-High-trajectory,,ASM,served between 2015 and 2019, with a maximum range of 500 kilometers. It operates at low speeds for low-altitude cruising and reaches high speed (4-5 Mach) for terminal breakthrough. It uses composite guidance and can perform maneuverable evasion of air defense fire at the terminal stage, with strong anti-jamming capabilities.


