pla_df-15b=DF-15B,,TBM,The DF-15B ballistic missile is an improved version of the Chinese DF-15 missile, which is a two-stage, solid fuel, short-range tactical ballistic missile. This type of missile has the capabilities of rapid strike, continuous assault, and efficient destruction

