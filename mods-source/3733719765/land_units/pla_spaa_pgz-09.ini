[General]
UnitType=LandUnit
LandUnitSubType=SAM
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=6.7                     // in meters
Beam=3.2                      // in meters
Range=270                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=800
Mass=35                      // in tons

MaxForwardVelocity=29.7        // in knots
MaxBackwardVelocity=8.5        // in knots
Braking=12                     // knots/sec
TurnRate=23                    // in degrees per second

TurretBlowOffChance=0.5      // Chance to blow off "Turret" submodel.

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[AI]
UnitScoreValue=3              // value for calculation of mission score
Role=Gun,AAW

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

