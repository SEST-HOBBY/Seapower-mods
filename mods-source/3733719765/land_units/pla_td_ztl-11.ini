[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.04

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=8                    // in meters
Beam=3                       // in meters
Range=375                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=8  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=450
Mass=23                      // in tons

MaxForwardVelocity=54        // in knots
MaxBackwardVelocity=17          // in knots
Braking=12                     // knots/sec
TurnRate=15                    // in degrees per second

TurretBlowOffChance=0.5      // Chance to blow off "Turret" submodel.

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=8

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usa_ifv_bradley

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #AdvancedOptics
Type=Visual
SystemName=AdvancedOptics
MountPosition=0,0.04,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.03,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=3

[WeaponSystem1]  #2A70
Type=Gun
SystemName=ZPL98A
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
ElevationArc=-6,60
RestAngles=0
LoadAngles=0,-5
EngageOnlyInsideArc=True
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxVelocityToFire=10
VIDIncrease=8  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2

[WeaponSystem2]  
Type=Missile
SystemName=ZPL98A_Missile
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfContainers=1
Container1=Barrel
AreContainersRotatable=True
#Angles
FixVerticalLaunchAngle=5
ElevationArc=-6,60              // Min,Max
RestAngles=0                   //Horizontal, Vertical   or  Horizontal only definitions
LoadAngles=0,-5
#Loading
AssociatedMagazine=WeaponMagazine9M119
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
MaxVelocityToFire=10
SharesMountWith=WeaponSystem1
VIDIncrease=6  // In miles. Flat base VID increace when firing.

[WeaponSystem3] #Chaff
Type=Chaff
SystemName=Smoke
#Sensors
#Animations
#Mount
Mount=Dummy
MountPosition=0,0,0.4
#Containers
ContainerBase=Dummy
#Angles
#Loading
Ammunition=wp_aircraft_chaff
#Effects
NumberOfEffects=2
DelayBetweenLaunches=0.1
EffectOffset=0,0,30
#Other
WorksStandalone=True

[---------- WeaponMagazines ----------]
[WeaponMagazine9M119]
NumberOfAmmunitionTypes=1
Ammunition1=pla_gp105
Ammunition1_Count=3

[WeaponMagazineGun]
NumberOfAmmunitionTypes=3
Ammunition1=pla_cal_dtw3-105
Ammunition1_Count=15
Ammunition2=pla_cal_type-83
Ammunition2_Count=13
Ammunition3=pla_cal_dtb-1
Ammunition3_Count=12
ModuleType=SmallMagazine

