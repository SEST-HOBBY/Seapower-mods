[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.04

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=8                    // in meters
Beam=3                       // in meters
Range=375                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=8  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=450
Mass=20                      // in tons

MaxForwardVelocity=54        // in knots
MaxBackwardVelocity=17          // in knots
Braking=12                     // knots/sec
TurnRate=15                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=8

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usa_ifv_bradley

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #AdvancedOptics
Type=Visual
SystemName=AdvancedOptics
MountPosition=0,0.04,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.03,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=3

[WeaponSystem1] 
Type=CIWS
SystemName=ZPT99
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
Gun=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-6,50
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxVelocityToFire=10
VIDIncrease=4  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem2,WeaponSystem3

[WeaponSystem2]  
Type=Missile
SystemName=ZBL-08_Missile
#Sensors
NumberOfWires=1  // Default = 1;  Limits how many wire-guided weapons can be launched simultaneously from this system.
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Launcher
NumberOfContainers=1
Container1=Launcher
AreContainersRotatable=True
#Angles
FixVerticalLaunchAngle=5
ElevationArc=-6,60              // Min,Max
#Loading
AssociatedMagazine=WeaponMagazine9M119
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
SharesMountWith=WeaponSystem1
VIDIncrease=6  // In miles. Flat base VID increace when firing.
DisplayWeaponsOnSystem=True

[WeaponSystem3] #Chaff
Type=Chaff
SystemName=Smoke
#Sensors
#Animations
#Mount
Mount=Dummy
MountPosition=0,0,0.4
#Containers
ContainerBase=Dummy
#Angles
#Loading
Ammunition=wp_aircraft_chaff
#Effects
NumberOfEffects=2
DelayBetweenLaunches=0.1
EffectOffset=0,0,30
#Other
WorksStandalone=True

[---------- WeaponMagazines ----------]
[WeaponMagazine9M119]
NumberOfAmmunitionTypes=1
Ammunition1=pla_hj-73e
Ammunition1_Count=4

[WeaponMagazineGun]
NumberOfAmmunitionTypes=2
Ammunition1=pla_dtc10-30
Ammunition1_Count=110
Ammunition2=pla_dty02-30
Ammunition2_Count=190
ModuleType=SmallMagazine


[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/land_units/zbl-08/
ResourcesRoot=zbl-08.obj
ResourcesMesh=hull
ResourcesMaterial=zbl-08_mat.ini
############################################################

[Submodels]
Turret=Turret
Gun=Gun
Launcher=Launcher

[Turret]
Mesh=turret
Material=zbl-08_mat.ini
Position=0,0.030642,-0.019204

[Gun]
Mesh=gun
Material=zbl-08_mat.ini
Parent=Turret
Position=0,0.005696,0.01034
Rotation=0,0,0

[Launcher]
Mesh=launcher
Material=zbl-08_mat.ini
Parent=Turret
Position=0,0.00492,-0.009544
Rotation=0,0,0


[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/miscellaneous/MachineNoise1_short
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=0.4
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=VehicleSmokes
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=VehicleSmokes
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=VehicleSmokes
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

SecondaryPopPrefab=effects/land units/emitters/secondary_pop
TurretCookOffEffect=effects/land units/emitters/turret_cook-off
TurretFireEffect=effects/land units/emitters/turret_fire
TurretFireEffectPosition=0,0.025,0

