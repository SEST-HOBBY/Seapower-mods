[General]
UnitType=LandUnit
LandUnitSubType=SAM

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.026,0
ModuleType=Bridge

[---------- Weapon Systems ----------]
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1] #HQ-6A
Type=Missile
SystemName=HQ-64
#Sensors
ExternalGuidingSystems=HQ-64_FCR
ExternalGuidingSystemSearchRadius=0.8     // in nmi
#Animations
#Mount
Mount=Mount
IsMountRotatable=True
#Containers
NumberOfContainers=1
ContainerBase=Launcher
NumberOfContainers=1
Container1=Launcher
AreContainersRotatable=True
#Angles
FixVerticalLaunchAngle=False
AdditionalFixVerticalLaunchAngle=5
RestAngles=0,0
LoadAngles=0,0
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
ModuleType=Weapon
WorksStandalone=False
AutoEnableSensor=True
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=pla_hq-64
Ammunition1_Count=12 // 4 at launcher and usually 8 per launcher at loading trucks
ModuleType=WeaponMagazine

[Models]
ResourcesFolder=assets/models/land_units/ld-2000/
ResourcesRoot=hq-6a_tel.obj
ResourcesMesh=hull
ResourcesMaterialFolder=assets/models/land_units/ld-2000/
ResourcesMaterial=hq-9_tel_mat.ini
############################################################

[Submodels]
Mount=Mount
Launcher=Launcher

[Mount]
Mesh=mount
ResourcesMaterialFolder=assets/models/land_units/ld-2000/
Material=hq-9_tel_mat.ini
Position=0,0.025854,0.009837

[Launcher]
Mesh=launcher
ResourcesMaterialFolder=assets/models/land_units/ld-2000/
Material=hq-9_tel_mat.ini
Parent=Mount
Position=0,0.0094,-0.0152
Rotation=-35,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=ModerateShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
NumberOfColliders=1
NumberOfMeshColliders=0
UseKinematicCollision=False

Collider1=coll_hitbox

[coll_hitbox]
Collider=Box
Position=0,0.0316,-0.0041
Rotation=0,0,0
Scale=0.04,0.063,0.2
