[General]
UnitType=LandUnit
LandUnitSubType=SAM

DefaultCameraDistance=4
MinCameraDistanceForeAft=1.3
MinCameraDistanceBroadside=1.3
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=True
MaskVegetation=False //True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=25  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=SA-11 SAM Site Small
Tag=Ground+Vehicle+SAM

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=10  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
