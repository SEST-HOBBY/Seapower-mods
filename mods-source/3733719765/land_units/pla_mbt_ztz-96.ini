[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=10.65                     // in meters
Beam=3.4                       // in meters
Range=375                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=14  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Name=ZTZ-96
Tag=Ground+Vehicle+Armor+Tank

[Physics]
HorsePower=730
Mass=42                      // in tons

MaxForwardVelocity=31.66       // in knots
MaxBackwardVelocity=8       // in knots
Braking=10                     // knots/sec
TurnRate=18                    // in degrees per second

TurretBlowOffChance=0.8       // Chance to blow off "Turret" submodel.

[AI]
UnitScoreValue=2              // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=14
ArmorType=Moderate
IsCoveredByMainArmor=True

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

