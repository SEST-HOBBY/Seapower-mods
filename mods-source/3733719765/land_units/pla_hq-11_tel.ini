[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit
IsMobile=True

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=7.5                     // in meters
Beam=3.3                       // in meters
Range=227                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=829
Mass=34                       // in tons

MaxForwardVelocity=35.1          // in knots
MaxBackwardVelocity=5          // in knots
Braking=13                     // knots/sec
TurnRate=30                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=AAW,SAM

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[SensorData]
#Visual
VisualIdentificationRange=3  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small


[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_pla_hq-11_tel

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.04,0
ModuleType=Bridge
Integrity=0

[SensorSystem2]  #Sarch_Radar
Type=Radar
SystemName=HQ-11_Radar
Mount=Radar_Mount
#Animations
OpenSystemAnimation=Search_On
CloseSystemAnimation=Search_Off
MaxDeploySpeed=0
MaxOpenSpeed=0
ModuleType=Sensor

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  
Type=Missile
SystemName=HQ-11
#Sensors
AssociatedSensors=SensorSystem2
#Animations
#Mount
Mount=Dummy
IsMountRotatable=False
#Containers
ContainerBase=Launcher
NumberOfContainers=1
Container1=Dummy
AreContainersRotatable=False
#Angles
ElevationArc=-10,85               // Min,Max
RestAngles=0                   //Horizontal, Vertical   or  Horizontal only definitions
#Loading
AssociatedMagazine=WeaponMagazine_SAM
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
DisplayWeaponsOnSystem=True
AutoEnableSensor=True
[---------- WeaponMagazines ----------]

[WeaponMagazine_SAM]
NumberOfAmmunitionTypes=1
Ammunition1=pla_hq-11
Ammunition1_Count=16
Collider=coll_mag_sparrow
ModuleType=SmallMagazine

[Models]
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/land_units/hq-11/
ResourcesRoot=hq-11.obj
ResourcesMesh=hull
ResourcesMaterial=hq-11_tel_mat.ini


[Submodels]
Launcher=Launcher
Radar1=Radar1
Radar2=Radar2
Radar3=Radar3
Radar4=Radar_Mount
Radar5=Radar
Yeya=Yeya

