[AmmunitionNames]
pla_hq-9=红旗-9,,面对空导弹,红旗-9防空导弹系统是第一种国产第三代中高空中远程防空导弹，与同在阅兵式上公开亮相的红旗-22和红旗-12A中高空中远程防空导弹等，构成了代际接续、有效衔接、互补增强的防空火力配系。

pla_hq-7b=红旗-7B,,面对空导弹,红旗七号导弹是中国人民解放军制的短程防空导弹，引进自泰雷兹集团的海响尾蛇导弹（Crotale EDIR）。1980年代自法国购入后开始研制，1988年定型，是解放军第二代地空导弹武器系统，能够对付低空快速突防目标。

pla_hq-9b=红旗-9B,,面对空导弹,红旗-9B防空导弹系统是自主研制的新一代远程防空导弹系统。 是红旗9防空导弹的衍生型号。 具有较强的区域防空能力。

pla_hq-9c=红旗-9C,,面对空导弹,红旗-9C缩小了弹体，战斗部后方增加侧推火箭，总共配备8具小直径发射筒，提高地面防空营火力密度。红旗-9C与红旗-9B使用的发射车底盘完全通用，导弹发射筒上有“ADK-9C”的字样，意思是“空军地空导弹9号第三种改进型”。

pla_cal_apfsds_30mm=30mm尾稳脱穿,,,

pla_hq-64=红旗-64,,面对空导弹,红旗-64是红旗-61的改进版本，融合了从LY-60项目中获得的经验和技术。当与指挥车配对时，该系统称为 HQ-6D 防空系统。通过将每个车载发射器的导弹数量从 2 枚增加到 4 枚，火力翻了一倍，并且用集装箱发射器替换了发射轨道，可靠性也得到了提高。

