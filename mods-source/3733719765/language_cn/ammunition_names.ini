pla_df-15b=东风-15乙,,战术弹道导弹,东风-15B弹道导弹，是中国东风-15导弹的改进型，是一种两级、固体燃料、近程战术弹道导弹。这型导弹具有快速打击、连续突击、高效毁伤能力

