[---Fire Control---] + search radars linked to FC radars
[EL/M-2084]
#EL/M-2084: S-band 3D AESA surveillance radar—airspace monitoring, early warning, and target acquisition // تغییر کند
#users: elm_2084_radar
Kind=Radar
Type=Search            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface	     // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
TargetChannels=1100       // if applicable number of targets it can track simultaneously
WeaponChannels=48       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=6                 // revolutions per minute
MinRange=0.5           // min range in km
MaxRange=600            // max range in km
MinAltitude=30         // min altitude in meters, relevant for air, unused for surface
MaxAltitude=100000    // max altitude in meters, relevant for air, unused for surface
RangeResolution=30.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.25         // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=70.0              // gain in dB on the sensor
Frequency=S-Band       // frequency band
PeakPower=4000.0        // output peak power in kW
ModuleType=BigSensor

[IDF/DSWS-FCR]
#DSWS-FCR: Fire Control Radar, illumination and missile guidance
#users: idf_dsws_fcr
Kind=Radar
Type=Targeting            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Air               // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=256       // if applicable number of targets it can track simultaneously
WeaponChannels=24       // if applicable number of weapons (missiles) it can guide simultaneously
RotationDirection=1    // -1 means left, 1 means right
RPM=15                 // revolutions per minute
MinRange=0.5           // min range in km
MaxRange=300           // max range in km
MinAltitude=10          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=80000     // max altitude in meters, relevant for air, unused for surface
RangeResolution=15.0  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.2          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=60.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=1000.0        // output peak power in kW

