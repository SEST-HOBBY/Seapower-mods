#David Sling launcher
[General]
UnitType=LandUnit
LandUnitSubType=SAM

DefaultCameraDistance=1.0
MinCameraDistanceForeAft=0.7
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.05

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=None
DamagePoints=5  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=AAW,SAM

[SensorData]
#Visual
VisualIdentificationRange=7  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small


[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=5

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.036,0
ModuleType=Bridge

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=1

[WeaponSystem1]  #SIM-X
Type=Missile
SystemName=SIM-X
#Sensors
ExternalGuidingSystems=IDF/DSWS-FCR
ExternalGuidingSystemSearchRadius=1.5     // in nmi
#Animations
#Mount
Mount=point
IsMountRotatable=False
#Containers
NumberOfContainers=12
Container1=Dummy
Container1_Position=-0.015579,-0.017481,0.036378
Container2=Dummy
Container2_Position=-0.015579,-0.024122,0.036378
Container3=Dummy
Container3_Position=-0.015579,-0.030763,0.036378
Container4=Dummy
Container4_Position=-0.007409,-0.017481,0.036378
Container5=Dummy
Container5_Position=-0.007409,-0.024122,0.036378
Container6=Dummy
Container6_Position=-0.007409,-0.030763,0.036378
Container7=Dummy
Container7_Position=0.007409,-0.017481,0.036378
Container8=Dummy
Container8_Position=0.007409,-0.024122,0.036378
Container9=Dummy
Container9_Position=0.007409,-0.030763,0.036378
Container10=Dummy
Container10_Position=0.015579,-0.017481,0.036378
Container11=Dummy
Container11_Position=0.015579,-0.024122,0.036378
Container12=Dummy
Container12_Position=0.015579,-0.030763,0.036378
AreContainersRotatable=False
#Angles
#Loading
AssociatedMagazine=WeaponMagazineMissile
PreloadAmmunition=True
#Effects
#Other
DisplayWeaponsOnSystem=True
ModuleType=Weapon
Collider=coll_hitbox
VIDIncrease=15  // In miles. Flat base VID increace when firing.

[---------- WeaponMagazines ----------]
[WeaponMagazineMissile]
NumberOfAmmunitionTypes=1
Ammunition1=idf_stunner
Ammunition1_Count=24 // 12 at launcher and usually 12 per launcher at loading trucks
ModuleType=WeaponMagazine

[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=assets/models/vechicle/idf_dsws/
ResourcesRoot=idf_dsws.obj
ResourcesMesh=launcher
ResourcesMaterial=idf_dsws_mat.ini
############################################################

[Submodels]
Submodel1=point
[point]
Mesh=point
Position=0,0.012378,-0.004683
Rotation=-90,0,0
ResourcesMaterialFolder=assets/models/vechicle/idf_dsws/
Material=idf_dsws_mat.ini

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=ModerateShipFire
SevereFireEffectPosition=0,0,0
