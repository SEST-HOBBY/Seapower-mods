[ ------------------------ Visual/Infared ------------------------- ]

[OEPS29]
Kind=Visual
#Infrared
VIDRangeMultiplier=0.8           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=1           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=0.4             // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.9             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day


[------------------------- Radar ---------------------------]

[---Air/Air&Surface---]

[NO-193]
#Users: wp_mig-29a
Kind=Radar
Type=DirectedSearch    // 雷达类型
HasDataLink=False      // 数据链
Role=Air             // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=1       // 如果适用，它可以同时跟踪的目标数量
WeaponChannels=2       // 火力通道，如果武器（导弹）数量合适，它可以同时制导
ViewArcs=-45,45|-15,45     // 左：水平左右视场，右：垂直视场
LookDownMultiplier=0.6     // 多径地形杂波系数，当目标投影到地形/海洋背景上时，应用于最大雷达距离的乘数，默认值为1.0
MinRange=0.4           // 最小距离
MaxRange=80           // 最大距离
MinAltitude=70          // 最低海拔高度，不适用于对地
MaxAltitude=30480      // 最大高度
RangeResolution=27.0   // 识别间距，定义了后方两个目标可以被识别为两个的最小范围；单位为米
BeamWidth=1          // 定义承载分辨率>=2*Dist*sin（波束宽度/2）的波束宽度（度）
Gain=49.0              // 传感器上的增益（dB）
Frequency=X-Band       // 波段
PeakPower=12.0         // 功率 in kW
RequiresAlignment=True// 对于飞机。允许飞机制导武器的同时不飞向目标

[AN/APG-66]

Kind=Radar
Type=DirectedSearch    // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=False      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface               // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=1       // if applicable number of targets it can track simultaneously
WeaponChannels=2       // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-60,60|-60,60      // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=0.87     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0.4           // min range in km
MaxRange=148           // max range in km
MinAltitude=9          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=28.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.1          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=53.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=10.0         // output peak power in kW
