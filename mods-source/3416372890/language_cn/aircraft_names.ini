[wp_mig-29a]
Type=战斗机
Default=米格-29A,米格-29
DefaultDescription=米格-29是米高扬设计局研制生产的一款双发动机中型战斗机，北约代号："Fulcrum"米格-29战斗机诞生于20世纪60年代末，是米高扬设计局研制生产的轻中型双发、前线空中优势战斗机。该机源于苏联军队应对美国“FX计划”(即后来的F-15战斗机)威胁的“轻型前线战斗机计划”。苏联空军对研制该机的能力定位是夺取前线制空权，即在任意气象条件和苛刻的电子干扰环境中，在全高度范围内摧毁距其200米到60千米的空中目标。由于属于轻型战斗机，设计航程有限，因而作战用途主要是承担战术类的护航和对地攻击任务。
Squadron1=米格-29A(第120近卫航空团),米格-29
Squadron2=米格-29A(第1521空军基地),米格-29
Squadron3=米格-29A(东德空军),米格-29
Squadron4=米格-29G(德国空军),米格-29
Squadron5=米格-29A(朝鲜空军),米格-29

Callsigns=Squadron1,梦想|Squadron2,黄蜂


