[AN/APY-2]
#Users: usaf_e-3a
Kind=Radar
Type=Search            // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface     // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
RotationDirection=1    // -1 means left, 1 means right
RPM=6                 // revolutions per minute
MinRange=0.2           // min range in km
MaxRange=550.0         // max range in km
MinAltitude=5          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30480      // max altitude in meters, relevant for air, unused for surface
RangeResolution=50.0  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=3.0          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=100                // gain in dB on the sensor
Frequency=S-Band       // frequency band
PeakPower=1500.0       // output peak power in kW
TargetChannels=600 // if applicable number of targets it can track simultaneously
