[wp_a-50u]
Type=ДРЛОиУ
Default=А-50У,А-50У
DefaultDescription=Вариант модернизации серийных самолётов А-50. Установлен новый радиотехнический комплекс с улучшенными параметрами по обнаружению низколетящих и малозаметных воздушных целей (в том числе сверхзвуковых и вертолётов, в условиях применения средств РЭП) построен с применением элементной базы Intel, снижена масса аппаратуры, за счёт этого увеличен запас топлива. Все ЭЛТ-дисплеи заменены на ЖКИ. Оборудованы комнаты отдыха и кухня. Первый самолёт передан ВВС 31.10.2011 г. 7 марта 2017 года передан Российским ВКС четвёртый модернизированный самолёт с бортовым номером 41 и собственным названием «Таганрог». 6 декабря 2018 года передан Российским ВКС очередной модернизированный самолёт с бортовым номером 45 «Красный».
Squadron1=Ивановский полк ДРЛО,А-50У
Callsigns=Эскадрилья 1,Северная звезда,Всевидящий

