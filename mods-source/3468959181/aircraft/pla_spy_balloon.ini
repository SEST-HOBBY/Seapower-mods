[---------- General Data ----------]
[General]
UnitType=Aircraft
CarrierCapable=True

DefaultCameraDistance=2
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=1
CameraPivotHeight=0.0

GroundedPitchAngle=0  // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.021,-0.0156 // defines the relative location of the landing gear

[AI]
Role=Bomber,Recon,ESM

[SensorData]
#Visual
VisualIdentificationRange=7       // Biggest range in nm at which this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=VerySmall

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usaf_mq-9

[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=1.94      // Propellor diameter value used

[FlightModel]
PitchGain=0.8                         // Vertical manuverability
VelocityGain=0.1036                   // Acceleration
HeadingGain=2                         // Horizontal manuverability
YawRateLimit=130                      // in degrees per second

BankGain=0.8                          // Roll change speed
MaxRollForHeading=35.0                // bank limit in normal flight
MaxRollRate=80.0                      // in degrees per second

ThrustGain=0.325                      // Thrust change speed
SpeedBrakeFractionGain=0.2            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

[Performance]
#Dimensions
WingSpan=20                        //meters
#Parameters
MaxG=2.5                              // Mostly for horizontal turns

MaxClimbRate=9.9                     //Meters per second
EmptyMass=3000.0                     // in kg
MaxFuel=200000.0                      // in kg

PerEngineMaxPower=84582             // Power in Watts. Also indicates Turboprop engine type
EngineCount=1

Ceiling=70000.0                       // ceiling in feet
CruiseAltitude=60000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.5,0.5,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=150                //in knots, Defines max speed at altitude curve
StallSpeed=60.0                      //in knots
MachLimit=0.3                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.2,0.4         // Landing
SpeedAndRange_Loiter=0.35,0.6         // Loiter
SpeedAndRange_Cruise=0.612,1150       // Cruise
SpeedAndRange_Max=0.785,0.8          // Attack/Fast/High/Max without AB

Altitudes=50,300,1000,3000,6000,10000,20000  // in feet

[---------- Main Systems ----------]
[PropulsionSystems]
NumberOfPropulsionSystems=1

[PropulsionSystem1]
Mount=Prop
RotationDirection=Left

