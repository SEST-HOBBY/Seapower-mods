[---------- General Data ----------]
[General]
UnitType=Aircraft
CarrierCapable=True

DefaultCameraDistance=0.7
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.0

#Taxi values
GroundedPitchAngle=-5  // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.0272,-0.0156 // defines the relative location of the landing gear

Pilot1=usaf_pilot_f-15c
Pilot1Positions=0,0.0042,0.0729
EjectChance=0.6

[AI]
Role=Bomber,Recon,ESM

[SensorData]
#Visual
VisualIdentificationRange=7       // Biggest range in nm at which this unit can be visually identified
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=SemiSmall

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usaf_u-2

[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=1.94      // Propellor diameter value used

[FlightModel]
PitchGain=0.8                         // Vertical manuverability
VelocityGain=0.1136                   // Acceleration
HeadingGain=2                         // Horizontal manuverability
YawRateLimit=130                      // in degrees per second

BankGain=0.8                            // Roll change speed
MaxRollForHeading=45.0                // bank limit in normal flight
MaxRollRate=80.0                     // in degrees per second

ThrustGain=0.325                      // Thrust change speed
SpeedBrakeFractionGain=10            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.0885

[Performance]
#Dimensions
WingSpan=34                        //meters
#Parameters
MaxG=5.0                              // Mostly for horizontal turns

MaxClimbRate=26                       //Meters per second
EmptyMass=7250.0                     // in kg
MaxFuel=10750.0                      // in kg

PerEngineMaxThrust=85000              //Newtons
PerEngineMaxAfterburnerThrust=85000       //Newtons
EngineCount=1
EngineWarmUp=15

Ceiling=72000.0                       // ceiling in feet
CruiseAltitude=50000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.5,0.5,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=434                //in knots, Defines max speed at altitude curve
StallSpeed=90.0                      //in knots
MachLimit=0.85                        //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.24,0.4        // Landing
SpeedAndRange_Loiter=0.36,0.6         // Loiter
SpeedAndRange_Cruise=0.57,4833        // Cruise
SpeedAndRange_Max=0.71,0.8            // Attack/Fast/High/Max without AB

Altitudes=50,1000,5000,15000,30000,50000,70000  // in feet

