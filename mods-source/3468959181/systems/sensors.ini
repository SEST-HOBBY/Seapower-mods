[ ------------------------------ ESM ------------------------------ ]
[Senior_Glass]
#Users:
Kind=ESM
Gain=10                             // gain of sensor in dB
HasDataLink=True                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=5.0               // in degrees
OverHorizonMultiplier=3.0           // The multiplier for ESM horizon for over horison (OTH) passive detection capability
Frequencies=L-Band,S-Band,C-Band,X-Band,Ku-Band,K-Band    //Frequencies that current ESM system can detect
ModuleType=SmallSensor

[SYERS] Senior Year Electro-Optical Reconnaissance
Kind=Visual
VIDRangeMultiplier=5.0           // Target VID range multiplied by this for identification check
MaxRangeMultiplier=6.0           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=1.0          // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=0.8             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

[ASARS-2] #Advanced Synthetic Aperture Radar System-2
#Users: usaf_u-2
Kind=Radar
Type=DirectedSearch        // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True           // true means the sensor data will be used for the entire task force via data link, false local use only
Role=Surface               // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True  // True means the radar can see ground objects
Mode=Illuminate            // Can be "Illuminate", "RadioCommand"
TargetChannels=1           // if applicable number of targets it can track simultaneously
WeaponChannels=1           // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                  // Field of View of the radar
MinRange=0               // min range in km
MaxRange=500                // max range in km
MinAltitude=0              // min altitude in meters, relevant for air, unused for surface
MaxAltitude=30480          // max altitude in meters, relevant for air, unused for surface
RangeResolution=30.0       // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.0              // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=50.0                  // gain in dB on the sensor
Frequency=X-Band           // frequency band
PeakPower=200.0            // output peak power in kW
