[ ========================================= General ========================================== ]
[General]
DataLinkUpdateRate=1             // every x seconds there will be an update for the overall sensor image for the minimap
PassiveSensorUpdateRate=1.0        // every x seconds the passive contacts will be re-evaluated
LostPassiveContactTimeToDisable=5  // time in seconds after which a lost passive contact bearing line will be greyed out
LostContactTimeToRemove=30         // time in seconds after which a lost contact will be removed from the map

[Sonar]
# AboveLayerShadowingAngle: This angle determines the "ray" from the sensor to the layer. The smaller this angle is
#                           the flatter that ray is and the later it reaches the layer. A small value means that
#                           the shadow zone starts further away
# BelowLayerShadowingAngle: This angle determines how the "ray" continues when crossing the layer. Everything above
#                           that ray but below the layer will be considered in the shadow zone
AboveLayerShadowingAngle=3.0 //2.5 or 3.0 provides the best variants so far
BelowLayerShadowingAngle=5.0 //5.0 is the best variant so far
DebugSonarLineColor=64,224,208,255
DebugSonarLineShadowZoneColor=208,224,64,160
DebugSonarLineThickness=2.0


[AN/APG-83]
Kind=Radar
Type=DirectedSearch     // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface                // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate         // Can be "Illuminate", "RadioCommand"
CanDetectLandTargets=True
TargetChannels=20        // if applicable number of targets it can track simultaneously
WeaponChannels=8        // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-60,60|-60,60       // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=0.98     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0.4           // min range in km
MaxRange=240           // max range in km
MinAltitude=9          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=35000       // max altitude in meters, relevant for air, unused for surface
RangeResolution=15.0   // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.8          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=60.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=15.0         // output peak power in kW

