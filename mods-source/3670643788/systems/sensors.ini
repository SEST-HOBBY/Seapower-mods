[ ------------------------------ ECM ------------------------------ ]

[RKZ-50] #Himalayas ECM Systems
#Users: plan_j-50
Kind=ECM
Frequencies=L-Band,S-Band,C-Band,X-Band,Ku-Band,K-Band,Ka-Band // radar frequency bands the ECM suite can jam
Type=Defensive                         // can be Defensive, Offensive, Universal
JamChance=0.7                          // For Defensive and Universal jammers. Base chance to jam the attacking weapon
CoverRange=10                           // in nmi, If within this range from attacked unit and within weapon seeker cone, jammer will add to combined chance to jam weapon.


