[ ------------------------ Visual/Infared ------------------------- ]

[EORD-50 EOTS] #EOTS part of EORD-50 EOTS system
#Users: plan_j-50
Kind=Visual
Infrared=True
VIDRangeMultiplier=4.0            // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=6.3            // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=1.4           // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=1.0              // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

[------------------------- Radar ---------------------------]

[---Air/Air&Surface---]

[KLJ-50]  #Byelka AESA Radar Complex System.
#Users: plan_j-50
Kind=Radar
Type=DirectedSearch         // Classes can be "DirectedSearch", "Search", "Targeting"
HasDataLink=True            // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface          // Role can be "Surface", "Air", "AirAndSurface"
CanDetectLandTargets=True   // True means the radar can see ground objects
Mode=Illuminate             // Can be "Illuminate", "RadioCommand"
TargetChannels=64           // if applicable number of targets it can track simultaneously
WeaponChannels=16           // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=-90,90|-85,75         // pair of values left to | is horisontal left-right angles of vision, second pair is down-up vertical angles
LookDownMultiplier=1     // multiplier that applies to max radar range when target is projected on terrain/sea background, default is 1.0
MinRange=0.2                // min range in km
MaxRange=382.4                // max range in km
MinAltitude=0               // min altitude in meters, relevant for air, unused for surface
MaxAltitude=60960           // max altitude in meters, relevant for air, unused for surface
RangeResolution=8          // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=1.2               // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=55.0                   // gain in dB on the sensor
Frequency=X-Band            // frequency band
PeakPower=105.0             // output peak power in kW
RequiresAlignment=True      // For aircraft. Allows guide weapon without flying towards target

