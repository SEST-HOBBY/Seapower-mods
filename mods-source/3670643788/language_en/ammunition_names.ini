[AmmunitionNames]
plaaf_pl-10_LQS=PL-10,,AAM,The PL-10 is a short-range infrared-guided air-to-air missile developed by China for fourth and fifth-generation fighter aircraft. The missile seeker utilizes advanced multi-element imaging infrared (IIR) guidance technology, providing strong resistance to countermeasures and compatibility with helmet-mounted display systems. It supports high off-bore and high-G launch conditions, and possess a relatively long range among short-range infrared missiles.


plaaf_pl-15_S_LQS=PL-15,,AAM,The PL-15 is a medium-to-long-range active radar-guided air-to-air missile developed by China for fourth and fifth-generation fighter aircraft. The missile features a dual-pulse solid rocket motor and an active electronically scanned array (AESA) radar seeker, providing high terminal speed and excellent resistance to electronic countermeasures.

plaaf_pl-16_LQS=PL-16,,AAM,The PL-16 is a medium to long range active radar guided air-to-air missile developed by China, mainly equipped with advanced fighter jets such as J-20, used for beyond visual range (BVR) air combat to strike enemy high mobility targets.

plaaf_pl-17_LQS=PL-17,,AAM,The PL-17 is a long-range active radar homing air-to-air missile fielded by the People s Liberation Army Air Force. It is primarily used against hostile auxiliary and support aircraft at very long standoff ranges, that include tankers, AWACSs, and bombers. The missile possesses a very long range and high terminal speed, but it suffers from inferior maneuverability, making it unsuitable for engaging very maneuverable targets.
 
plaaf_ld-8a_LQS=LD-8A,,ARM,The LD-8A anti radiation missile is a small anti radiation missile modified from the PL-15 medium range air-to-air missile.

plan_yj-15=YJ-15,Cruise Missile,ASuW,The YJ-15 is a supersonic anti-ship cruise missile fielded by the People s Liberation Army Naval Air Force (PLANAF).Powered by a ramjet engine and utilizing a low-altitude sea-skimming flight profile, it features long range, large warhead power, and high speed.

plaaf_ls-6_500_LQS=LS-6(500kg),Glide Bomb,Land Attack,The LS-6 500-kilogram GPS-guided glide bomb is composed of a 500-kilogram low-drag general-purpose bomb equipped with glide and guidance components, providing stand-off precision strike capabilities.

plaaf_tl-20_LQS=TL-20,,Land Attack,The TL-20 is a small gliding guided bomb independently developed by China, equipped with thermal imaging or millimeter wave radar guidance heads, end imaging recognition, and CEP up to meters.

plaaf_bbm2=BBM2,,Glide Bomb,The CS/BBM2 is a 100kg lightweight precision-guided glide bomb developed by China North Industries Group Corporation Limited (NORINCO Group). It typically employs satellite navigation (GPS/BeiDou) guidance and is mainly designed for the efficient engagement of targets such as aircraft hangars and light armored vehicles.

plaaf_yj-21_LQS=YJ-21,ASBM,ASuW,Air-launched hypersonic anti-ship missile.