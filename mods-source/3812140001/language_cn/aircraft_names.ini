DefaultDescription=巴基斯坦空军F-7PG是在成都歼-7的基础上升级的中国制造的拦截机。它配备了意大利FIAR Grifo-7雷达，改进了航空电子设备，并与PL-9导弹兼容。针对防空进行了优化，与早期的F-7变体相比，它提供了更好的雷达范围、机动性和全方位交战能力。
