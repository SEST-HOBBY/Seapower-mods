# ------------------ AAM ------------------
plaaf_pl-5eii=PL-5EII,,空对空,

plaaf_pl-9=PL-9,,A空对空,PL-9是中国为近距离作战开发的短程红外制导空对空导弹。它具有更好的机动性、全方位的目标捕获和更好的对抗能力。与F-7等战斗机兼容，它以更高的灵活性和可靠的近炸引信杀伤力增强了空战性能。

plaaf_pl-10e=PL-10E,,空对空,

plaaf_sd-10a=SD-10A,,空对空,

plaaf_pl-15e=PL-15E,,空对空,


# ------------------ SAM ------------------
plan_ly-80n=LY-80N,,舰空导弹,红旗-16舰空导弹是中国研制的中程区域防空导弹系统。导弹主要搭配H/AJK-16舰载垂直发射系统，装备人民海军054A型导弹护卫舰和部分改造后的导弹驱逐舰。导弹采用垂直热发射方式，半主动雷达制导，可有效拦截各类飞机、巡航导弹及掠海反舰导弹等目标，构成水面舰艇编队的中层防空屏障，与海红旗-9远程舰空导弹一起撑起远洋舰艇编队立体区域防空与自卫能力。

pla_hq-9be=红旗-9BE,,面对空导弹,红旗-9B防空导弹系统是自主研制的新一代远程防空导弹系统。 是红旗9防空导弹的衍生型号。 具有较强的区域防空能力。

pla_hq-16ae=红旗-16AE,,面对空导弹,
# ---------- Anti-radar Missiles ---------

plaaf_cm-400akg_arm=CM-400AKG,,反辐射

# ---------- Anti-ship Missiles ----------
plan_cm-302=CM-302,,反舰导弹,鹰击12是中国自主研发的超音速远程反舰巡航导弹, 2015-2019年间开始服役，最大射程500公里，较低速度用于低空巡航，末端突防采用高速（4马赫）。采用复合制导，末端可进行机动规避防空火力，抗干扰能力强。

pla_c-602=C-602,,面对面,鹰击62的改进型，具备对海对地攻击能力，飞行途中可进行修正。

plaaf_c-802ak=C-802AK,,反舰导弹,

plan_yj-18e=鹰击-18E,,反舰导弹,鹰击-18反舰导弹是中国运用引进自俄罗斯的3M54E"口径"巡航导弹技术研制的远程反舰巡航导弹，分为鹰击-18潜射型和鹰击-18A舰载垂直发射型两个型号。鹰击-18是人民海军潜艇部队的通用鱼雷管潜射导弹，装备引俄636型潜艇、039A/B型常规动力潜艇和093型攻击型核潜艇。导弹采用超低空掠海飞行弹道，亚音速巡航加超音速突防的复合飞行模式，兼具射程远和突防能力强的特点。

plaaf_cm-400akg=CM-400AKG,,反舰导弹

#-----------Land Strike only missiles---------

plaaf_cm-802akg=CM-802AKG,,对地攻击,

# ---------- Anti-sub  Missilies ----------
plan_et-80=ET-80,,反潜火箭助飞鱼雷,鱼-8是中国自主研制的反潜火箭助飞鱼雷，兼容H/AJK-16舰载垂直发射系统和海通-1型舰载垂直发射系统，装备人民海军054A型导弹护卫舰，052D、055型导弹驱逐舰。采用火箭垂直发射加末端轻型鱼雷自主打击构型，战斗部为一发鱼-7C型轻型反潜鱼雷。武器具有反应速度快，射程远的特点，是远海舰队反潜的中坚力量。
# ------------------ Torpedo ------------------

plan_et-38=ET-38,热动力,多用途鱼雷,鱼-6鱼雷是中国自行研制的第一款热动力泵喷推进重型鱼雷，具有大速度，大深度，大航程，双速制特点，采用OTTO II复合燃料，斜盘活塞发动机和泵喷推进技术，采用线导和声自导复合制导，能有效打击水面和水下的各种目标。鱼-6性能大致相当于美国海军Mk.48 mod 5鱼雷。

plan_et-39=ET-39,热动力,多用途鱼雷,鱼-6A鱼雷是中国研制的热动力重型鱼雷，在鱼-6的基础上提升导引头作用效果，使用光纤线导，采用28节低噪音巡航模式。

plan_et-40=ET-40,电动,多用途鱼雷,鱼-9鱼雷是中国自行研制的电动多用途重型鱼雷，采用无空泡螺旋桨推进，隔振降噪措施，双速制设计。鱼雷具备低噪声发射能力，在巡航速度（25节）时静音性能极佳，噪音水平接近海洋背景噪音，在末端时则采用高速（42节）接近目标。搭配线导和声自导复合制导模式，能够实现隐身打击效果。










