Grifo_M3=Grifo M3|这是一种X波段多模机载雷达，专为空中搜索、单目标跟踪和有限的俯视/击落能力而设计，与上一代脉冲雷达相比，具有更高的探测性能、适中的地面测绘功能和更强的抗杂波能力。


