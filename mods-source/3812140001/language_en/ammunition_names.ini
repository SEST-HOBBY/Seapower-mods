# ---------- Anti-ship Missiles ----------
plan_cm-302=CM-302,,ASM,The YJ-12 is a supersonic long-range anti-ship cruise missile independently developed by China. It entered service between 2015 and 2019. Its maximum range is 500 km. It uses lower speed for low-altitude cruise and high speed (Mach 4) for terminal penetration. It uses composite guidance, and in the terminal phase can maneuver to evade air defense fire; it has strong anti-jamming capability.

pla_c-602=C-602,,ASM,The improved version of the YJ-62, with anti-ship and land-attack capabilities, and it can be corrected in flight.

plaaf_c-802ak=C-802AK,,ASM,

plan_yj-18e=YJ-18E,,ASM,The YJ-18 anti-ship missile is a long-range anti-ship cruise missile developed by China using technology introduced from Russia's 3M54E Klub cruise missile. It is divided into two models: the YJ-18 submarine-launched type and the YJ-18A shipborne vertical launch type. The YJ-18 is a general torpedo-tube submarine-launched missile for the PLA Navy submarine force, equipping Russian-built Project 636 submarines, Type 039A/B conventionally powered submarines, and Type 093 nuclear-powered attack submarines. The missile uses an ultra-low-altitude sea-skimming flight profile, with a composite flight mode of subsonic cruise plus supersonic terminal penetration, combining long range and strong penetration capability.

plaaf_cm-400akg=CM-400AKG,,ASM

