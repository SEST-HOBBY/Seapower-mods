# ---------- Anti-sub Missilies ----------
plan_et-80=ET-80,,Torpedo,The Yu-8 is an anti-submarine rocket-assisted torpedo independently developed by China. It is compatible with the H/AJK-16 shipborne vertical launch system and the Haitong-1 shipborne vertical launch system. It equips the PLA Navy's Type 054A guided missile frigates and Type 052D and Type 055 guided missile destroyers. It uses a rocket vertical launch plus terminal lightweight torpedo autonomous attack configuration. The warhead is a Yu-7C lightweight anti-submarine torpedo. The weapon has the characteristics of fast reaction speed and long range, and is the backbone of anti-submarine warfare for open-ocean fleets.
# ------------------ Torpedo ------------------

plan_et-38=ET-38,,Torpedo,The Yu-6 torpedo is the first thermal-powered pump-jet-propelled heavy torpedo independently developed by China. It has the characteristics of high speed, large depth, long range, and dual-speed modes. It uses OTTO II composite fuel, a swashplate piston engine, and pump-jet propulsion technology. It uses wire guidance and acoustic homing composite guidance, and can effectively strike various surface and underwater targets. The performance of the Yu-6 is roughly equivalent to the U.S. Navy Mk.48 Mod 5 torpedo.

plan_et-39=ET-39,,Torpedo,The Yu-6A torpedo is a thermal-powered heavy torpedo developed by China. On the basis of the Yu-6, it improves the seeker effect, uses fiber-optic wire guidance, and adopts a 28-knot low-noise cruise mode.

plan_et-40=ET-40,,Torpedo,The Yu-9 torpedo is an electric multi-purpose heavy torpedo independently developed by China. It uses a cavitation-free propeller for propulsion, vibration isolation and noise reduction measures, and a dual-speed design. The torpedo has low-noise launch capability. At cruise speed (25 knots), its quietness is excellent, with noise level close to ocean background noise. In the terminal phase, it approaches the target at high speed (42 knots). With wire guidance and acoustic homing composite guidance modes, it can achieve stealthy strike effects.