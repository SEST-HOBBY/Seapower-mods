plaaf_pl-9=PL-9,,AAM,PL-9 is a short-range infrared-guided air-to-air missile developed by China for close-range combat. It has better maneuverability, all-aspect target acquisition, and better countermeasure resistance. Compatible with fighters such as the F-7, it enhances air combat performance with greater agility and reliable proximity-fuzed lethality.

