# ------------------ SAM ------------------
plan_ly-80n=LY-80N,,SAM,The HQ-16 ship-to-air missile is a medium-range area air defense missile system developed by China. The missile is mainly used with the H/AJK-16 shipborne vertical launch system and equips the PLA Navy's Type 054A guided missile frigates and some modified guided missile destroyers. The missile uses vertical hot launch and semi-active radar guidance, and can effectively intercept various aircraft, cruise missiles, sea-skimming anti-ship missiles, and other targets. It forms the mid-tier air defense barrier of surface ship formations, and together with the HHQ-9 long-range ship-to-air missile, supports the layered area air defense and self-defense capability of ocean-going ship formations.

pla_hq-9be=HQ-9BE,,SAM,The HQ-9B air defense missile system is a new-generation long-range air defense missile system independently developed. It is a derivative of the HQ-9 air defense missile. It has strong area air defense capability.

pla_hq-16ae=HQ-16AE,,SAM,
