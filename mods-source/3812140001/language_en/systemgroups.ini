#---------------------------------------- Radar ----------------------------------------
Grifo_M3=Grifo M3|This is an X-band multimode airborne radar designed for air search, single-target tracking, and limited look-down/shoot-down capability. Compared with previous-generation pulse radars, it has higher detection performance, moderate ground mapping, and improved clutter resistance.


Grifo-7=The FIAR Grifo-7|FIAR Grifo-7 is an X-band pulse Doppler radar that provides look-down capability, multi-target tracking, and improved air interception performance.