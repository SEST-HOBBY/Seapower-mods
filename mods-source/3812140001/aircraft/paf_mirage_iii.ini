[---------- Flight Model ----------]
[Engine]
EngineIntakeArea=0.81

[FlightModel]
PitchGain=1                           // Vertical manuverability
VelocityGain=0.13                   // Acceleration
HeadingGain=3                         // Horizontal manuverability
YawRateLimit=130                      // in degrees per second

BankGain=1.7                            // Roll change speed
MaxRollForHeading=55.0                // bank limit in normal flight
MaxRollRate=150.0                     // in degrees per second
MaxPitchRate=15

ThrustGain=0.35                      // Thrust change speed
SpeedBrakeFractionGain=10            // Speed brakes deploy speed

SpeedDeltaPerAltitudeChange=0.09

[Performance]
#Dimensions
WingSpan=8.4                         //meters
#Parameters
MaxG=6.7                              // Mostly for horizontal turns

MaxClimbRate=76.2                     //Meters per second
EmptyMass=7400.0                      // in kg, dry empty weight
MaxFuel=3500.0                        // in kg, internal

PerEngineMaxThrust=49030.0            		//in Newtons
PerEngineMaxAfterburnerThrust=70600.0      //in Newtons
EngineCount=1

Ceiling=66000.0                       // ceiling in feet
CruiseAltitude=36000                  //in feet
#"Engine" efficiency at 0ft, 37000 ft, 65000 ft. Always 1 for cruise altitude
AltitudeEfficiency=0.7,0.9,0.25       // Defines fuel consumption with altitude

#Governing of max speed
MaxSpeedAtSeaLevel=601                //in knots, Defines max speed at altitude curve
StallSpeed=105                        //in knots
MachLimit=2.2                         //for 37000ft, Defines max speed at altitude curve

#SpeedAndRange   MachNumbers or knots, Specified units or multiplier (except Cruise range)
RangeUnits=Miles                      // Can be: Km. Any other value = nmi. Defines measurment units of ranges of SpeedAndRange values

SpeedAndRange_Landing=0.21,0.4        // Landing
SpeedAndRange_Loiter=0.45,0.6         // Loiter
SpeedAndRange_Cruise=0.75,900         // Cruise
SpeedAndRange_Max=1.4,0.3             // Attack/Fast/High/Max without AB
SpeedAndRange_Afterburner=2.2,0.2     // AB max

Altitudes=50,300,1000,3000,6000,10000,20000  // in feet

MaxClimbPitch=70.0
MaxDescentPitch=-70.0
