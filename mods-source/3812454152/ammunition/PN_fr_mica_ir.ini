#=========================================================================================================================================================
#                                                  REQUIRES STATS REVISION
#=========================================================================================================================================================
[General]
# VL MICA-EM
Type=Missile                           // can be Projectile, Missile, Torpedo
TargetType=AAW                         // can be AAW, ASuW, ASW
SecondaryTargetType=ASuW
LandAttackCapability=ShoreTargetsOnly  // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=112                               // in kg. Used for aircraft
AmmoPoints=740                        // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=6  // 目视识别范围at what range in nm this unit can be visually identified
IRSignature=VeryTiny   // 红外识别范围
# Radar related (RCS => radar cross section)
RCS=Small
# Sonar related

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation     // 预制破片弹
#1 = Armor Piercing            // 穿甲弹
#2 = HEAT                           // 破甲弹
#3 = Illumination                 // 照明弹
#4 = Cluster                        // 集束炸弹
#5 = Runway Cratering        // 跑道破坏弹

[WarheadData]
WarheadType=0
Power=9
ImpactSize=Small                       // 影响大小Impact size, can be small, medium, large, verylarge
Penetration=Always                     // 穿深？can be minor, moderate, heavy, always

FuzeProximityDistance=15.0             // 近炸引信for proximity fuze: distance to target in yard
KillProbability=0.85                  // 爆炸概率Chance to intercept missile
[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing  //红外
# 2 = Semi-Active Radar Homing  // 半主动雷达寻的
# 3 = Active Radar Homing  // 主动雷达寻的
# 4 = Anti-Radiation Homing  // 反辐射
# 5 = Laser-Homing  // 激光制导
# 6 = TV-Homing  // 电视制导
# 7 = Active Sonar Homing  // 主动声呐
# 8 = Passive Sonar Homing  // 被动声呐
# 9 = Wake Homing  // 尾流自导
[Guidance]
GuidanceType=1
#In reality a SARH correction is used at long range
MidCourseCorrection=1                 // 0 = None, 1 = Radio Command无线电指令, 2 = Wire Guided线导
DropDuration=0.1                      // 离架自由落体time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0.3         // 离架直线运动time in seconds where the missile moves straight on without guiding
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=40.0                      // Climb angle for initial loft
MaxLoftAlt=60000.0                     // in feet. Maximum altitude for lofting
MaxLoftVelocity=2700.0                 // Maximum speed in knots for lofting
#flight phase 2: sea skimming---------------------------------------------------------------------------------------------------------
#2nd stage of missile flight - low altitude
#flight phase 3: final flight phase (e.g. terminal popup)------------------------------------------------------------------------------
#Pop-Up. Missile climbs to higher altitude before activating the seeker. Or in some cases going even lower
#flight phase 4: terminal approach------------------------------------------------------------------------------------------------------
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=5                 // in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
IgnoreHeightDifferenceForTargetDist=True  // useful for hight loft alt missiles to ignore the height for distance calculation
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   // If we should use full kinematics rules. If this is true, we will only use kinematics 
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=2700.0                     // Maximum speed in knots
MaxTurnRate=35.0                       // Maximum turnrate in degrees per second
LaunchTurnRate=120                     // Missiles like S-300 rapidly orient themselves after launch. in degrees per second
AccelerationTime=3.2                       // Burn time for initial booster burn
Acceleration=23.13                      // Gs of acceleration in initial burn
SustainerAccelerationTime=6.8            // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=9.8               // Acceleration of sustainer burn. -1 if there is no sustainer
#80kN - 3.2s Boost
#30kN - 6.8s Sustain
TypicalTargetAlt=25000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=0		           		// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=0		       		// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
DragCoefficient=1.5                        // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.6                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=100                       // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MinLaunchRange=0.25                     // Minimum launch range in nautical miles
MaxLaunchRange=11.0                    // Maximum launch range in nautical miles
MinAttackAltitude=15                   // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=120000               // Maximum altitude of target, in feet
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
IsRearAspectOnly=False                 // Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=120                     // Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=2                          // Seeker field-of-view in degrees
SeekerGimbalFOV=130                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=12                  // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True                      // 记忆目标Always locks on preselected target unless spoofed or jammed
#ECCM
AntiCountermeasuresBonus=0.95           // This value substracted from probability of spoofing by countermeasures (0...1)

#Search params for torpedoes
#SelfDestruct
SelfDestructDelay=5.0                  // 断连后自爆时间delay in seconds for self destruction

[---------- Mesh definitions----------]
############################################################
# Main Model with collider
############################################################
[Models]
############################################################
# AssetBundle related
############################################################
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=usn_rim-7
AssetBundleDamagedMesh=
AssetBundleMaterial=usn_rim-7_mat
AssetBundleMeshHullCollider=usn_rim-7_coll
############################################################
############################################################
# Internal Resources folder related
############################################################
ResourcesFolder=assets/models/ammunition/mica/
ResourcesRoot=MICA.obj
ResourcesMesh=mica-ir
ResourcesMaterial=mica_mat.ini
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
BoosterEffect=effects/weapons/emitters/aam_effect
BoosterEffectPosition=0,0,-0.022
// 发射时拖尾与位置
InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=4.0  // 发射时转到飞行时秒数（仅影响拖尾）in seconds, after that the Inflight Effect will be played if available
// 飞行时拖尾与位置
HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=LargeMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes
// 爆炸毁伤贴图
[---------- Colliders ----------]
############################################################
# Colliders definition
############################################################
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0.012
Rotation=0,0,0
Scale=0.005,0.005,0.07