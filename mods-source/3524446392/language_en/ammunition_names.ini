wp_9m96e=9M96E,,SAM,The 9M96E is a medium range missile part of the S-400 and S-350 Vityaz SAM systems.
wp_9m96e2=9M96E2,,SAM,The 9M96E2 is an upgrade from the 9M96E increasing it's operational range and capabilities.
wp_9m100=9m100,,SAM,The 9M100 is a point defense missile of the S-350 Vityaz SAM system, it is meant as a SHORAD system with similar performance to the Tor SAM system.
