[Language_en]
Name=Group Manager
Description=Movable, resizable squad panel with adaptive member tiles, counts and ship/submarine/aircraft/helicopter icon filters. Persistent settings and collapsed formations. When zooming out on the map, air units are collapsed into lead units; panel hover marks map positions. Native orders, menus and drag/drop retained. Requires Anchor Chain. Version 0.2.17; source ZIP included.

[Language_ru]
Name=Менеджер групп
Description=Перемещаемая панель групп с изменяемым размером, адаптивными плитками, счётчиками и фильтрами кораблей, подлодок, самолётов и вертолётов. Настройки сохраняются. При отдалении масштаба карты авиация сворачивается до лидеров; наведение показывает позиции юнитов. Штатные приказы, меню и перетаскивание сохранены. Требуется Anchor Chain. Версия 0.2.17; исходники включены.

