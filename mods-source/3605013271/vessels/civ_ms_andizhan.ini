#MaxAmmoPoints=9999999             // Ammunition with ammo points cost over this values will not be replenished
AmmoLoadSpeed=9999999              // Ammo points per second
AmmoCapacity=2625000             // Ammo points. Can be numerical value or "Unlimited"
SupplyRange=1.5               // In miles
MaxTargets=2                  // Number of targets that can be simultaniously replenished (same speed per target)#
MaxOwnVelocity=10              // In knots. Above this velocity replenishment is impossible
MaxTargetVelocity=10          // In knots. Above this velocity replenishment is impossible
TargetTypes=Vessel          // What unit types can be replenished by this system
UpdateDelay=1                 // Delay between replenishment calculations. (Really should leave it as it is)



