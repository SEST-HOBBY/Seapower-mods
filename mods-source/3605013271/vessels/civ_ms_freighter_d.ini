[---------- General Data ----------]
[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.13

Length=157                    // in meters
Beam=23                       // in meters

CompartmentsHeight=0.09       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=20000              // in tons

MaxForwardVelocity=18.5        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.24
MinAccelerationFactor=0.1

RudderTurnRate=2.5             // turn rate of the rudder in degrees per second
RudderForce=0.41                // multiplicator defining how agile the ship can turn

TiltFactor=1.8                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=0.0                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=2		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=11.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiLarge
# Radar related (RCS => radar cross section)
RCS=SemiLarge
# Sonar related
BaseNoise=170                   // base sound level in db at 1m distance
FlowNoise=1.6                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10               // additional noise for cavitation in db
BladesCount=5					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=3 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[---------- AI related ----------]
[AI]
UnitCostValue=5000            // value for the unit cost for least valuable target checks
UnitScoreValue=6              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
#Offence
#Defence
MissilesToSaturate=3      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=2     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

#Special
Role=Merchant

