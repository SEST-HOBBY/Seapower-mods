[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.3
MinCameraDistanceBroadside=0.6
CameraPivotHeight=0.18

Length=153                    // in meters
Beam=21                       // in meters

CompartmentsHeight=0.09       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[OpticalView]
Views=binocular_7x50,binocular_10x50
DefaultView=binocular_7x50

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=20000              // in tons

MaxForwardVelocity=17        // sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.96                // this is for velocity damping (linear drag)
MaxAccelerationFactor=0.24
MinAccelerationFactor=0.1

RudderTurnRate=2.5             // turn rate of the rudder in degrees per second
RudderForce=0.36                // multiplicator defining how agile the ship can turn

TiltFactor=2.5                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=1.5                  // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units
CavitationSpeed=2		 	  // defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0            // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=25.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=SemiLarge
# Radar related (RCS => radar cross section)
RCS=SemiLarge
# Sonar related
BaseNoise=170                   // base sound level in db at 1m distance
FlowNoise=1.6                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=10               // additional noise for cavitation in db
BladesCount=4					 //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=3 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=60             //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[---------- AI related ----------]
[AI]
UnitCostValue=5000            // value for the unit cost for least valuable target checks
UnitScoreValue=6              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
#Offence
#Defence
MissilesToSaturate=4      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=2     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

#Special
Role=Merchant

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_ph1,coll_ph2

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=15000
Collider=coll_engineroom

[PropulsionSystems]
NumberOfPropulsionSystems=1
[PropulsionSystem1]
Mount=Propeller
RotationDirection=Left
Collider=coll_prop

#Rudder Systems
[RudderSystems]
NumberOfRudderSystems=1
[RudderSystem1]
Mount=Rudder
Collider=coll_rudder

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.23,-0.28
#---------- Surface only search radars ----------
[SensorSystem2] #Nav_Radar
Type=Radar
SystemName=Nav_Radar
Mount=Nav_Radar_1
Collider=coll_navradar_1

[SensorSystem3] #Nav_Radar
Type=Radar
SystemName=Nav_Radar
Mount=Nav_Radar_2
Collider=coll_navradar_2


[---------- Supply Systems ----------]
[SupplySystem1]
SystemName=TruckSupplySystem
#MaxAmmoPoints=9999999             // Ammunition with ammo points cost over this values will not be replenished
AmmoLoadSpeed=9999999              // Ammo points per second
AmmoCapacity=12000000             // Ammo points. Can be numerical value or "Unlimited"
SupplyRange=1.5               // In miles
MaxTargets=2                  // Number of targets that can be simultaniously replenished (same speed per target)#
MaxOwnVelocity=10              // In knots. Above this velocity replenishment is impossible
MaxTargetVelocity=10          // In knots. Above this velocity replenishment is impossible
TargetTypes=Vessel          // What unit types can be replenished by this system
UpdateDelay=1                 // Delay between replenishment calculations. (Really should leave it as it is)


[---------- Cargoholds ----------]
