[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.6
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.2

Length=145.5                    // in meters
Beam=19.2                       // in meters

CompartmentsHeight=0.06       //Governs bouyancy compartment height and also missile aimpoint
ArmorType=None

[---------- AI related ----------]
############################################################
# AI related values
############################################################
[AI]
UnitCostValue=5000            // value for the unit cost for least valuable target checks
UnitScoreValue=4              // value for calculation of mission score

#Sensors
Radar_Capability=TBD
Sonar_Capability=TBD
AirRecon_Capability=TBD

#Offence
AAW_Capability=0
ASW_Capability=0
ASuW_Capability=0

#Defence
MissilesToSaturate=5      //AI will try to shoot missiles with this SaturationValue combined to kill this target
TorpedoesToSaturate=1     //AI will try to shoot torpedoes with this SaturationValue combined to kill this target

AMD_Capability=TBD    //Anti-Missile Defence
ATD_Capability=TBD      //Anti-Torpedo Defence

#Special
Role=RAS

[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=16250              // in tons

MaxForwardVelocity=14        	// sets the max forward velocity
MaxBackwardVelocity=7.0        // sets the max backward velocity
LinearDrag=0.92                // this is for velocity damping (linear drag)
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2

RudderTurnRate=5.0             // turn rate of the rudder in degrees per second
RudderForce=1.0                // multiplicator defining how agile the ship can turn

TiltFactor=0.8                 // defines how strong the tilting will be
PitchFactor=0.0                // defines how strong the pitch will be based on speed and acceleration

TrimDepth=6                    // default trim depth in feet
TrimAngle=0.0                  // default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0           // distance from the center of the mesh to the keel in Unity units

[Buoyancy]
Density=0.5                    // density of water is 1. Density < 1 means it will swim
OutOfWaterDrag=25.0             // drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0             // drag for the water physics in case the vessel is below the water line

[SensorData]
#Visual
VisualIdentificationRange=9.0  // Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Medium
# Sonar related
BaseNoise=170                   // base sound level in db at 1m distance
FlowNoise=1                     // additional flow noise per knot in db (20kn would be +20db)
CavitationNoise=5               // additional noise for cavitation in db
BladesCount=4                   //number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=3 //in dBs, the minimal value of noise on sonar system to begin classification/identification process of this vessel
ElectricFrequency=50            //in Hz, typical values 50 or 60, 400 for Soviet Alfa class SSN

[---------- Main Systems ----------]
#Control System
[ControlSystem]
Collider=coll_bridge

#Movement Systems
[MainPowerSystem]
Type=Diesel
HorsePower=4000
Collider=coll_engineroom

[PropulsionSystems]
NumberOfPropulsionSystems=1
[PropulsionSystem1]
Mount=Propeller
RotationDirection=Right
Collider=coll_prop

#Rudder Systems
[RudderSystems]
NumberOfRudderSystems=1
[RudderSystem1]
Mount=Rudder
Collider=coll_rudder

[---------- Sensor Systems ----------]
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.27,0.3
#---------- Surface only search radars ----------
[SensorSystem2] #Nav_Radar
Type=Radar
SystemName=Nav_Radar
Mount=Nav_Radar_1
Collider=coll_navradar

[---------- Supply Systems ----------]
[SupplySystem1]
SystemName=TruckSupplySystem
#MaxAmmoPoints=200             // Ammunition with ammo points cost over this values will not be replenished
AmmoLoadSpeed=9999999              // Ammo points per second 
AmmoCapacity=9750000             // Ammo points. Can be numerical value or "Unlimited"
SupplyRange=1.5               // In miles
MaxTargets=1                  // Number of targets that can be simultaniously replenished (same speed per target)#
MaxOwnVelocity=10              // In knots. Above this velocity replenishment is impossible
MaxTargetVelocity=10          // In knots. Above this velocity replenishment is impossible
TargetTypes=Vessel          // What unit types can be replenished by this system


[---------- Cargoholds ----------]
[Cargo]
AvailableLoadouts=Oil
#---------------------------------------
NumberOfCargoHolds=1
Hold1_Collider=coll_cargohold_1


[Cargo_Oil]
HoldType=FlammableCarg

[Compartments] #Needs Setup
Compartment1FirePosition=0,0.066,0.52
Compartment2FirePosition=0,0.0.064,-0.21
Compartment3FirePosition=0,0.157,-0.67
