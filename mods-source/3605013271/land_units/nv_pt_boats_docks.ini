Collider=coll_buildings_center_right
Integrity=50 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone6]
SystemName=Buildings4
Collider=coll_buildings_right
Integrity=80 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone7]
SystemName=Dock1
Collider=coll_dock
Integrity=100 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone8]
SystemName=Dock2
Collider=coll_dock_2
Integrity=100 //the number of hit points substracted from the overall damage points count when the system is destroyed


