[General]
UnitType=LandUnit
LandUnitSubType=Port //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=0.8
MinCameraDistanceBroadside=0.8
CameraPivotHeight=0.2

EncyclopediaGeoPos=31.5215,26.4201,10
EncyclopediaHeading=4

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=400  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=10               // value for calculation of mission score
Role=Target

[SensorData]
#Visual
VisualIdentificationRange=12  // Camouflaged  (x0.5)
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=SemiSmall

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.375,0
ModuleType=Bridge
Collider=coll_cic
Integrity=20

[---------- Supply Systems ----------]
[SupplySystem1]
SystemName=TruckSupplySystem
#MaxAmmoPoints=200             // Ammunition with ammo points cost over this values will not be replenished
AmmoLoadSpeed=9999999              // Ammo points per second
AmmoCapacity=9999999999             // Ammo points. Can be numerical value or "Unlimited"
SupplyRange=3               // In miles
MaxTargets=6                  // Number of targets that can be simultaniously replenished (same speed per target)#
MaxOwnVelocity=5              // In knots. Above this velocity replenishment is impossible
MaxTargetVelocity=10          // In knots. Above this velocity replenishment is impossible
TargetTypes=Vessel          // What unit types can be replenished by this system

[---------- HitZones ----------]
[HitZones]
NumberOfHitZones=8
[HitZone1]
SystemName=Warehouse
Collider=coll_warehouse
Integrity=100 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone3]
