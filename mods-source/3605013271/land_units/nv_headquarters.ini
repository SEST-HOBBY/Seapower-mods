[General]
UnitType=LandUnit
LandUnitSubType=Installation //Supported values: Airbase,SAM,Installation,MobileUnit,Radar,Port
DefaultCameraDistance=12.0
MinCameraDistanceForeAft=5.8
MinCameraDistanceBroadside=5.8
CameraPivotHeight=0.3
Length=352.1

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=350  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Tacview]
Tag=Ground+Vehicle

[AI]
UnitScoreValue=10              // value for calculation of mission score
Role=Target

[SensorData]
#Visual
VisualIdentificationRange=10  // Camouflaged  (x0.5)
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=1
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.375,0
ModuleType=Bridge
Collider=coll_headquarters
Integrity=20
[---------- HitZones ----------]
[HitZones]
NumberOfHitZones=6
[HitZone1]
SystemName=Headquarters
Collider=coll_headquarters
Integrity=100 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone2]
SystemName=Barracks
Collider=coll_barracks
Integrity=80 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone3]
SystemName=Storage
Collider=coll_storage
Integrity=100 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone4]
SystemName=Storage
Collider=coll_storage_2
Integrity=80 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone5]
SystemName=Vehicles_Depot
Collider=coll_vehicles_depot
Integrity=80 //the number of hit points substracted from the overall damage points count when the system is destroyed

[HitZone6]
SystemName=Barracks_2
Collider=coll_barracks_3
Integrity=80 //the number of hit points substracted from the overall damage points count when the system is destroyed

[---------- Supply Systems ----------]
[SupplySystem1]
SystemName=TruckSupplySystem
#MaxAmmoPoints=200             // Ammunition with ammo points cost over this values will not be replenished
AmmoLoadSpeed=9999999              // Ammo points per second
AmmoCapacity=9999999999           // Ammo points. Can be numerical value or "Unlimited"
SupplyRange=2               // In miles
MaxTargets=15                 // Number of targets that can be simultaniously replenished (same speed per target)#
#MaxTargets=Unlimited          // Number of targets that can be simultaniously replenished (same speed per target)
MaxOwnVelocity=5              // In knots. Above this velocity replenishment is impossible
MaxTargetVelocity=10          // In knots. Above this velocity replenishment is impossible
TargetTypes=LandUnit          // What unit types can be replenished by this system
UpdateDelay=1                 // Delay between replenishment calculations. (Really should leave it as it is)


[--------------------------- Target Points definitions ---------------------------]
[TargetingData]
NumberOfTargetPoints=6

#Headquaters with flag
TargetPointPosition1=-0.165,0.05,-0.199
TargetPointAssociatedSystems1=HitZone1
TargetPointPriority1=Medium
#Barracks by flagpole
TargetPointPosition2=1.316,0.041,0.286
TargetPointAssociatedSystems2=HitZone2
TargetPointPriority2=Low
#Storage building 1
TargetPointPosition3=-0.074,-0.026,2.838
TargetPointAssociatedSystems3=HitZone3
TargetPointPriority3=High
#Storage building 2
TargetPointPosition4=-1.82,0.052,0.694
TargetPointAssociatedSystems4=HitZone4
TargetPointPriority4=Medium
#Twin hangar
TargetPointPosition5=-1.453,0.052,-1.1
TargetPointAssociatedSystems5=HitZone5
TargetPointPriority5=Medium
#Barracks forther out
TargetPointPosition6=1.973,0.052,-4.601
TargetPointAssociatedSystems6=TODO
TargetPointPriority6=Medium
[--------------------------- Mesh definitions ---------------------------]
[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=ground objects/nv_headquarters/
ResourcesRoot=nv_headquarters
ResourcesMesh=nv_headquarters
ResourcesDamagedMesh=nv_headquarters_d
ResourcesMaterialFolder=scenery/materials/
ResourcesMaterial=industrial_buildings_old	#concrete_bm
############################################################

[Submodels]

SubModel1=Cargo
SubModel2=Fences
SubModel3=Flags
SubModel4=Posts
SubModel5=Trucks


[Cargo]
Mesh=nv_headquarters_cargo
ResourcesMaterialFolder=scenery/materials/
Material=ms_cargoatlas
HideWithActiveDamageModel=False

[Fences]
Mesh=nv_headquarters_fences
ResourcesMaterialFolder=scenery/materials/
Material=airbase_fence
HideWithActiveDamageModel=False

[Flags]
Mesh=nv_headquarters_flags
ResourcesMaterialFolder=ships/materials/
Material=flag_vietnam
HideWithActiveDamageModel=True

[Posts]
Mesh=nv_headquarters_posts
ResourcesMaterialFolder=scenery/materials/
Material=industrial_buildings_ne_us_1
HideWithActiveDamageModel=False

[Trucks]
Mesh=nv_headquarters_trucks
ResourcesMaterialFolder=ships/materials/
Material=wp_deck_equipment
HideWithActiveDamageModel=False

#[Boat_Hangars_Flags]
#Mesh=nv_headquarters_boat_hangars_flags
#ResourcesMaterialFolder=ships/materials/
#Material=flag_vietnam
#HideWithActiveDamageModel=True

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Medium
AmbientAudioPosition=0,0,-0.35
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=0.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=SmallShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SmallShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

