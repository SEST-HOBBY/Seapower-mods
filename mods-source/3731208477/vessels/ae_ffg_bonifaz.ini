# ae_ffg_bonifaz.ini
# ver. 20260824
#
[General]
UnitType=Vessel
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=0.7
CameraPivotHeight=0.20

Length=145								// In meters
Beam=18.6								// In meters

CompartmentsHeight=0.18					// Governs buoyancy compartment height and also missile aimpoint
ArmorType=Minor

[OpticalView]
Views=binocular_7x50,binocular_10x50,bridge_binocular_20x120_stab
DefaultView=binocular_7x50

[---------- Physics and Control ----------]
[Physics]
# all damping values can go from 0 (max damping) up to 1 (no damping)
Displacement=6300						// In tons
MaxForwardVelocity=26					// Sets the max forward velocity
MaxBackwardVelocity=7.0					// Sets the max backward velocity
LinearDrag=0.96							// This is for velocity damping (linear drag)
MaxAccelerationFactor=1.06
MinAccelerationFactor=0.1
RudderTurnRate=3.2						// Turn rate of the rudder in degrees per second
RudderForce=0.55						// Multiplicator defining how agile the ship can turn
TiltFactor=1.3							// Defines how strong the tilting will be
PitchFactor=0.0							// Defines how strong the pitch will be based on speed and acceleration
TrimDepth=2.0							// Default trim depth in feet
TrimAngle=0.0							// Default base trim angle (x-axis, so pitch)
CenterToKeelDist=0.0					// Distance from the center of the mesh to the keel in Unity units
CenterOfMass=0,0.03,0					// Center of mass for physics
CavitationSpeed=5						// Defines the telegraph that, after exceeding it, the boat will begin to cavitate

[Buoyancy]
Density=0.45							// Density of water is 1. Density < 1 means it will float
OutOfWaterDrag=25.0						// Drag for the water physics in case the vessel is above the water line
SubmergedDrag=25.0						// Drag for the water physics in case the vessel is below the water line

[SensorData]
# Visual
VisualIdentificationRange=12.0			// Biggest range in nm at which this unit can be visually identified
IRSignature=Medium
# Radar related (RCS => radar cross section)
RCS=SemiSmall
# Sonar related
BaseNoise=135							// Base sound level in dB at 1m distance (145 as OHP ref)
FlowNoise=1								// Additional flow noise per knot in dB (20 kn would be +20 dB)
CavitationNoise=5						// Additional noise for cavitation in dB
BladesCount=5							// Number of blades on vessel's propulsion systems
MinNoiseClassificationTreshold=5		// In dB, minimal value of noise to begin classification/identification
ElectricFrequency=60					// In Hz

[Animations]
NumberOfAnimationReferences=3
AnimationFile_1=eu_animations_mk41_v2
AnimationFile_2=eu_animations_NSM
AnimationFile_3=animations_ae_ffg_bonifaz

[---------- AI related ----------]
[AI]
UnitCostValue=9500						// Value for least valuable target checks
UnitScoreValue=7						// Value for calculation of mission score
# Sensors
Radar_Capability=10
Sonar_Capability=5
AirRecon_Capability=TBD
# Offence
AAW_Capability=6
ASuW_Capability=9
ASW_Capability=8
# Defence
MissilesToSaturate=8
TorpedoesToSaturate=4

AMD_Capability=10						// Anti-Missile Defence
ATD_Capability=5						// Anti-Torpedo Defence
HasChaff=True
# Special
Role=AAW,ASuW,ASW

[ControlSystem]
############################################################
# Control System (CIC)
############################################################
IsCoveredByMainArmor=True
Collider=coll_cic
ModuleType=CIC

[MainPowerSystem]
############################################################
# Main Power System (engine room)
############################################################
Type=GasTurbine							// CODOG (LM2500 + Diesel); using GasTurbine type for compatibility
HorsePower=46648						// 46648 (gas) + 16300 (diesel) - No se suman directamente
ArmorType=Minor
IsCoveredByMainArmor=True
Collider=coll_engineroom

[PropulsionSystems]
############################################################
# Propulsion Systems
############################################################
NumberOfPropulsionSystems=2
[PropulsionSystem1]
Mount=Propeller_1
RotationDirection=Left
Collider=coll_prop_l					// Using shared collider as per OHP template
[PropulsionSystem2]
Mount=Propeller_2
RotationDirection=Right
Collider=coll_prop_r					// Using shared collider as per OHP template

[RudderSystems]
############################################################
# Rudder Systems
############################################################
NumberOfRudderSystems=2
[RudderSystem1]
Mount=Rudder_1
Collider=coll_rudder_l					// Using shared collider as per OHP template
[RudderSystem2]
Mount=Rudder_2
Collider=coll_rudder_r					// Using shared collider as per OHP template

