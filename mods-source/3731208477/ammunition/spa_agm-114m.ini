# AGM-114M Hellfire
# Users:spa_sh60b_block1
# ver. 20260515
#
[General]
Type=Missile                           	// Can be Projectile, Missile, RBU, Torpedo
TargetType=ASuW                        	// Can be AAW, ASuW, ASW
LandAttackCapability=All               	// Can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=48                              	// In kg. Used for aircraft
AmmoPoints=150                         	// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       	// For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  					// Referenced in effects/decals.ini

[SensorData]
VisualIdentificationRange=2  		   	// At what range in nm this unit can be visually identified - 2 if low vis
IRSignature=Tiny
RCS=VerySmall

[WarheadData]
WarheadType=0							// Blast Fragmentation
Power=19
ImpactSize=Small                       	// Impact size, can be small, medium, large, verylarge
Penetration=Moderate                   	// Can be minor, moderate, heavy, always

[Guidance]
GuidanceType=5							// Laser-Homing
MidCourseCorrection=0                   // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=0.5         	// Time in seconds where the missile moves straight on without guiding

DropDuration=0.0                       	// Time in seconds where the missile just falls unpropelled

# TerrainFollowFlight=True
# SeaSkimmingAlt=20                      // height in feet for sea skimming

MaxLoftAngle=19.0                      	// Climb angle for initial loft
MaxLoftAlt=2460  						// Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch,

TerminalApproachDist=3.0            	// In N. miles. Recommended to set this distance slightly less than the seeker range

ApplyKinematics=True
MaxVelocity=860.0                      	// Maximum speed in knots
MaxTurnRate=19.0                        // Maximum turnrate in degrees per second
AccelerationTime=1.0                  	// Burn time for initial booster burn
Acceleration=23.13                     	// Gs of acceleration in initial burn
SustainerAccelerationTime=2.0           // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=23.13             // Acceleration of sustainer burn. -1 if there is no sustainer
TypicalTargetAlt=0						// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalFiringAlt=1000					// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=150				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000

DragCoefficient=-1                    	// Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
VelocityBleed=0.85                      // Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=60                      	// How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TimeLimited=True

MinLaunchRange=0.27                     // Minimum launch range in nautical miles
MaxLaunchRange=5.94                    	// Maximum launch range in nautical miles
MinLaunchAltitude=50                    // Minimum launch altitude in feet.
MaxLaunchAltitude=25000                 // Maximum launch altitude in feet.
LaunchReliability=95                   	// The lower the value, the greater risk of misfire or accident (0...100)

#Homing
SeekerGain=0.0                         	// Seeker gain in dB
SeekerFOV=90.0                         	// Seeker field-of-view in degrees
# SeekerActiveRange=0.0
SeekerPassiveRange=3                    // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SelfDestructDelay=4.0                   // Delay in seconds for self destruction

#ECCM
AntiCountermeasuresBonus=0.80          	// This value substracted from probability of spoofing by countermeasures (0...1)

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=ammunition/spa_hellfire/
ResourcesRoot=spa_hellfire.obj
ResourcesMesh=spa_hellfire
ResourcesMaterialFolder=ammunition/spa_hellfire/
ResourcesMaterial=spa_hellfire_mat.ini
ResourcesMeshForLaunch=spa_hellfire
ResourcesMeshSwitchTime=0.2  			// Time in seconds after launch to switch from launch mesh to main mesh

[Particles]
BoosterEffect=effects/weapons/emitters/rbu_effect
BoosterEffectPosition=0,-0.002,-0.010

SustainerEffect=None
SustainerEffectPosition=0,-0.002,-0.010
SustainerEffectStartTime=0

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,-0.002,-0.010
InFlightEffectStartTime=3

HitDefaultExplosionClass=RocketShipHitExplosion
HitShipExplosionClass=RocketShipHitExplosion
HitAirExplosionClass=RocketShipHitExplosion

HitWaterSplashClass=SmallWaterSplashes
HitGroundExplosionClass=RocketGroundHitExplosion

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.0015,0.0015,0.012
