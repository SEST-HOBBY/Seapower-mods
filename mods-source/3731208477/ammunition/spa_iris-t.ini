# spa_iris-t
# Basado en fichero R-73A (1977) aka AA-11 Archer
# Users: spa_fa-18a,spa_ef2000
# ver. 20260821
#

[General]
# IRIS-T (InfraRed Imaging System Tail/Thrust Vector-Controlled)
# Operado por el Ejército del Aire y del Espacio (EF-18M / Eurofighter)
Type=Missile                           	// Can be Projectile, Missile, Torpedo
TargetType=AAW                         	// Can be AAW, ASuW, ASW

Mass=87.4                              	// In kg. Used for aircraft
AmmoPoints=300                      	// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       	// For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts  					// Referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=2  			// At what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall

[---------- Warhead Data ----------]
############################################################
# Warhead Data
############################################################
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze
[WarheadData]
WarheadType=0
Power=9
ImpactSize=VerySmall					// Impact size, can be small, medium, large, verylarge
Penetration=Always                      // Can be minor, moderate, heavy, always

FuzeProximityDistance=5.0               // For proximity fuze: distance to target in meter. Also indicates that Fuze Type = Proximity Fuze (radar/laser)
KillProbability=0.90                    // Base chance to hit - Misil 5ª Generación

[---------- Guidance ----------]
############################################################
# Guidance System
############################################################
# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing
[Guidance]
GuidanceType=1
InitialFlightPhaseDuration=0.1         	// Time in seconds where the missile moves straight on without guiding
MidCourseCorrection=0                  	// 0 = None, 1 = Radio Command, 2 = Wire Guided
#======================================== Flight Profile ===========================================================
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=7              	// In N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   	// If we should use full kinematics rules. If this is true, we will only use kinematics
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=1980.0                     	// Maximum speed in knots - Mach 3
MaxTurnRate=60.0                       	// Maximum turnrate in degrees per second
MaxTurnG=50                       		// Maximum G-limit of missile turns
AccelerationTime=0.01                  	// Burn time for initial booster burn
Acceleration=0                      	// Gs of acceleration in initial burn
SustainerAccelerationTime=3.0           // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=26.6              // Acceleration of sustainer burn. -1 if there is no sustainer
DragCoefficient=-1               		// Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
TypicalTargetAlt=35000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=500					// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=35000					// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=600				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
MaxFlightTime=60               			// How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
#========================================= Launch stats ============================================================
MinLaunchRange=0.15                     // Minimum launch range in nautical miles
MaxLaunchRange=13.5                     // Maximum launch range in nautical miles
MinLaunchAltitude=0                     // Minimum launch altitude in feet.
MaxLaunchAltitude=65000                 // Maximum launch altitude in feet.
MinAttackAltitude=0                     // Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=80000                 // Maximum altitude of target, in feet
MaxAttackVelocity=2000				    // Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed
LaunchReliability=99                    // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
IsRearAspectOnly=False                  // Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=200                      // Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=5                            	// Seeker field-of-view in degrees
SeekerGimbalFOV=180                    	// Seeker gimbal FOV in degrees
SeekerPassiveRange=6.0                	// Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
#Misc Guidance Properties
#InsDrift=120							// In degrees per minute of unguided flight. Shifts the weapon's nose by this amount per minute whenever the missile is not being actively guided (RC, Wire, tracking a target with its seeker)
# cass: meant for making missiles drift when they lose their target, blocked for now due to unresolved issues
#ECCM
AntiCountermeasuresBonus=0.45          	// This value substracted from probability of spoofing by countermeasures (0...1)
#SelfDestruct
SelfDestructDelay=2.0                  	// Delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
# AssetBundle related
AssetBundleMeshes=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMaterials=/AssetBundles/StandaloneWindows/aircraft
AssetBundleMesh=spa_iris-t
AssetBundleDamagedMesh=
AssetBundleMaterial=spa_iris-t_mat
AssetBundleMeshHullCollider=spa_iris-t_coll

# Internal Resources folder related
ResourcesFolder=ammunition/spa_iris-t/
ResourcesRoot=spa_iris-t.obj
ResourcesMesh=iris-t
ResourcesMaterialFolder=ammunition/spa_iris-t/
ResourcesMaterial=spa_iris-t_mat.ini

#NumberOfSubModels=0

[---------- Effects ----------]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  	// This will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion
[Particles]
# BoosterEffect=effects/weapons/emitters/missile_sustainer_small_effect
# BoosterEffectPosition=0,0,-0.020

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.022
InFlightEffectStartTime=1.0				// In seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.020
SustainerEffectStartTime=0.1

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.043