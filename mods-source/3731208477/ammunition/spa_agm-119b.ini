#!alias ammunition/knm_penguin_mk2.ini
# Penguin AGM-119B
# Users:spa_sh-60b_block1
# ver. 20260915
#
[General]
Type=Missile							// Can be Projectile, Missile, Torpedo
Mass=392								// In kg. Used for aircraft

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
IOCDate=1993							// Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=1994							// Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

[Guidance]
TerrainFollowFlight=True

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=ammunition/spa_penguin/
ResourcesRoot=spa_penguin.obj
ResourcesMesh=spa_penguin_flying
ResourcesMaterialFolder=weapons/knm_penguin_mk2/
ResourcesMaterial=knm_penguin_mk2_mat

ResourcesMeshForLaunch=spa_penguin
ResourcesMeshSwitchTime=0				// Time in seconds after launch to switch from launch mesh to main mesh
