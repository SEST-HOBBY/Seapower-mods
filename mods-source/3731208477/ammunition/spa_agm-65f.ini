#!alias ammunition/usn_agm-65b.ini
## https://alojados.revistanaval.com/armada/flotaero/maverick.htm
## https://aeronavesmilitaresespanolas.com/floan-armamento/
# ver. 20260908
#
[General]
# AGM-65F Maverick
Type=Missile							// Can be Projectile, Missile, RBU, Torpedo
TargetType=ASuW							// Can be AAW, ASuW, ASW
LandAttackCapability=All				// Can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=304								// In kg. Used for aircraft
AmmoPoints=650							// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

MissileDefenceBonus=0.1					// Small missile

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
IOCDate=1989							// Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=1991							// Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available


[SensorData]
VisualIdentificationRange=3				// At what range in nm this unit can be visually identified - 3 if low vis

[WarheadData]
WarheadType=1							// Armor Piercing
Power=42
ImpactSize=Medium						// Impact size, can be small, medium, large, verylarge
Penetration=Always						// Can be minor, moderate, heavy, always

[Guidance]
GuidanceType=1							// IR Homing

TerminalApproachDist=7.0				// In N. miles. Recommended to set this distance slightly less than the seeker range

MaxVelocity=600.0						// Maximum speed in knots
MaxTurnRate=14.0						// Maximum turnrate in degrees per second

AccelerationTime=0.5					// Burn time for initial booster burn
Acceleration=21.3						// Gs of acceleration in initial burn
SustainerAccelerationTime=3.0			// Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=6.90				// Acceleration of sustainer burn. -1 if there is no sustainer

DragCoefficient=-1						// Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
MaxFlightTime=100						// How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited

MinLaunchRange=2.1						// Minimum launch range in nautical miles
MaxLaunchRange=17.0						// Maximum launch range in nautical miles
MinLaunchAltitude=200                   // Minimum launch altitude in feet.
LaunchReliability=98					// The lower the value, the greater risk of misfire or accident (0...100)

SeekerFOV=2.5							// Seeker field-of-view in degrees
SeekerGimbalFOV=80						// Seeker gimbal FOV in degrees
SeekerPassiveRange=9					// Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
NightVisionLevel=						// IR sensor version
Zoom=									// IR sensor version
TargetMemory=True

#ECCM
AntiCountermeasuresBonus=0.35			// This value substracted from probability of spoofing by countermeasures (0...1)

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/usn_agm-65/
ResourcesRoot=usn_agm-65
ResourcesMesh=usn_agm-65
ResourcesMaterialFolder=ammunition/spa_agm-65f/
ResourcesMaterial=spa_agm-65f_mat.ini
ResourcesMeshForLaunch=usn_agm-65
ResourcesMeshSwitchTime=0.2				// Time in seconds after launch to switch from launch mesh to main mesh

Rotation=0,0,0

[Particles]
InFlightEffectStartTime=0.8				// In seconds, after that the Inflight Effect will be played if available
SustainerEffectStartTime=0.8
HitShipExplosionClass=LargeShipHitExplosion

[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,-0.0099
Rotation=0,0,0
Scale=0.003,0.003,0.045
