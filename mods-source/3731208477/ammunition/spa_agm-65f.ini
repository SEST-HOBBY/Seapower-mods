[General]
# AGM-65F Maverick
Type=Missile                           // can be Projectile, Missile, RBU, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW
LandAttackCapability=All               // can be  All, Installation, Mobile, ShoreTargetsOnly

Mass=301.5                             // in kg. Used for aircraft
AmmoPoints=650                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

[SensorData]
VisualIdentificationRange=4  		   // at what range in nm this unit can be visually identified - 2 if low vis
IRSignature=Tiny

[WarheadData]
WarheadType=1
Power=42
ImpactSize=Medium                      // Impact size, can be small, medium, large, verylarge
Penetration=Always                     // can be minor, moderate, heavy, always

[Guidance]
GuidanceType=1
MaxVelocity=780.0                      // Maximum speed in knots
MaxTurnRate=22.0                       // Maximum turnrate in degrees per second
DragCoefficient=4.0                    // Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
MaxFlightTime=140                      // How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited

MaxLaunchRange=13.0                    // Maximum launch range in nautical miles
LaunchReliability=98                   // The lower the value, the greater risk of misfire or accident (0...100)

SeekerFOV=5.0                          // Seeker field-of-view in degrees
SeekerGimbalFOV=60                     // Seeker gimbal FOV in degrees
SeekerPassiveRange=7.5                 // Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)

#ECCM
AntiCountermeasuresBonus=0.70          // This value substracted from probability of spoofing by countermeasures (0...1)

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/usn_agm-65/
ResourcesRoot=usn_agm-65
ResourcesMesh=usn_agm-65
ResourcesMaterialFolder=ammunition/spa_agm-65f/
ResourcesMaterial=spa_agm-65f_mat.ini
ResourcesMeshForLaunch=usn_agm-65
ResourcesMeshSwitchTime=0.2  // time in seconds after launch to switch from launch mesh to main mesh
############################################################
Rotation=0,0,0

[Particles]
InFlightEffectStartTime=0.8            // in seconds, after that the Inflight Effect will be played if available
SustainerEffectStartTime=0.8
HitShipExplosionClass=LargeShipHitExplosion

[Colliders]

[col_main]
Collider=Box
Position=0,0,-0.0099
Rotation=0,0,0
Scale=0.003,0.003,0.045