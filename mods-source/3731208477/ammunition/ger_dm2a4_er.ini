#!alias ammunition/ger_dm2a4.ini
# DM2A4 SeeHake Mod 4 ER
# Users:ae_ssk_s80
# ver. 20260901
#
[General]
Type=Torpedo							// Can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASW							// Can be AAW, ASuW, ASW
SecondaryTargetType=ASuW

Mass=1800								// In kg. Used for aircraft
AmmoPoints=6000							// For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

#Determines if this weapon has "early service" with low availability, must be earlier than 'FOCDate' and is usually the first production year (LRIP) or first year this weapon was deployed in service, specify ONLY this date in the case of prototype systems that never became fully operable
IOCDate=2012							// Year, shows in Unit Reference. If set, defines if the weapon is able to be used in combat before it is fully operational (before FOCDate)

#Specifies the first year this weapon is widely deployed, and when it becomes fully operational without serious availability/operability concerns
FOCDate=2015							// Year, shows in Unit Reference, defines first year this weapon is commonly available to be selected. Default/unset: always available

[Guidance]
GuidanceType=10							// Combined Active&Passive Sonar Homing
MidCourseCorrection=2					// 0 = None, 1 = Radio Command, 2 = Wire Guided

TerminalVelocity=50.0					// Maximum speed in knots when torpedo is locked on target
MaxVelocity=35.0						// Maximum speed in knots

MinLaunchRange=0.2						// Minimum launch range in nautical miles
MaxLaunchRange=75						// Maximum launch range in nautical miles
										// 140 km - Record distancia torpedo pesado.

[Sounds]
SonarAudioClip=audio/environment/Sonar-MF
