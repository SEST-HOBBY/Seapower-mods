# AIM-120B AMRAAM - Kinematics model
# Users: spa_av-8b_plus,spa_fa-18a,spa_f-18m,spa_ef2000
# ver. 20260821
#
[General]

Type=Missile                           // Can be Projectile, Missile, RBU, Torpedo
TargetType=AAW                         // Can be AAW, ASuW, ASW

Mass=152                               // In kg. Used for aircraft
AmmoPoints=658                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
#SupplyCategory=AMRAAM                 // For Supply System. Makes that presence of such category is required for replenishment of this weapon
AirLaunched=True                       // For Encyclopedia. Displays launch altitudes

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=SAMImpacts					// Referenced in effects/decals.ini

[SensorData]
VisualIdentificationRange=4  			// At what range in nm this unit can be visually identified
IRSignature=VeryTiny
# Radar related (RCS => radar cross section)
RCS=VerySmall

[---------- Warhead Data ----------]

#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=16
ImpactSize=Small                       	// Impact size, can be small, medium, large, verylarge
Penetration=Always                     	// Can be minor, moderate, heavy, always

FuzeProximityDistance=12.0             	// For proximity fuze: distance to target in yard
InterceptSpeedPenaltyMultiplier=0.75    // Multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
KillProbability=0.85                    // Base chance to hit

[---------- Guidance ----------]

# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing

[Guidance]
GuidanceType=3
MidCourseCorrection=1					// 0 = None, 1 = Radio Command, 2 = Wire Guided, 3 = Datalink midcourse (used with SARH or ARH)
DropDuration=0.5                       	// Time in seconds where the missile just falls unpropelled
InitialFlightPhaseDuration=0.8         	// Time in seconds where the missile moves straight on without guiding

#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=25.0                      	// Climb angle for initial loft
MaxLoftAlt=65000                       	// Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch.
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=6.0               	// In N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=True                  // If true connection with a guiding radar will be severed upon entering terminal approach stage
#=========================================  Kinematics  ============================================================
ApplyKinematics=True                   	// If we should use full kinematics rules. If this is true, we will only use kinematics
#for acceleration, instead of calculating acceleration time based on the max velocity. MaxVelocity is still used, since missile stalls at 1/4 max velocity or 500 knots, whichever is less
MaxVelocity=2300.0                     	// Maximum speed in knots
MaxTurnRate=35.0                       	// Maximum turnrate in degrees per second
MaxTurnG=30                       		// Maximum G-limit of missile turns
AccelerationTime=2.0                    // Burn time for initial booster burn
Acceleration=23.48                      // Gs of acceleration in initial burn
SustainerAccelerationTime=5.7           // Time of sustainer burn. -1 if there is no sustainer burn
SustainerAcceleration=4.96              // Acceleration of sustainer burn. -1 if there is no sustainer
DragCoefficient=-1						// Drag coefficient. 0 for no drag, 1 for default drag, more for more drag. Defaults to -1, where we calculate it based on missile max range
TypicalTargetAlt=40000					// Sets the estimated target altitude (in feet) at which the missile will reach maximum firing range. Use 0 if the target is a surface unit. Default: 50000
TypicalTargetSpeed=600					// Sets the estimated target speed (in knots) at which the missile will reach maximum firing range. Default: 0
TypicalFiringAlt=40000					// Sets the estimated firing altitude (in feet) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 50000
TypicalLaunchVelocity=600				// Sets the estimated firing speed (in knots) at which the missile will reach maximum firing range. Use 0 for a surface launch missile. Default: 1000
VelocityBleed=0.8						// Missile will eventually slowdown to MaxVelocity*VelocityBleed at the end of its lifetime
MaxFlightTime=100              			// How long until missile entirely fails, acts as a hard limit based on batteries, etc. Default: unlimited
TimeLimited=True
#========================================= Launch stats ============================================================
MinLaunchRange=0.5                     	// Minimum launch range in nautical miles
MaxLaunchRange=40                      	// Maximum launch range in nautical miles
MinLaunchAltitude=80                  	// Minimum launch altitude in feet.
MaxLaunchAltitude=80000                 // Maximum launch altitude in feet.

MinAttackAltitude=50                   	// Minimum altitude of a target, in feet. Outside Min/Max altitude missile deviation is greatly increaced
MaxAttackAltitude=90000                	// Maximum altitude of target, in feet
MaxAttackVelocity=1600				   	// Maximum velocity of target, in knots. Above this velocity, hit chance is degraded proportional to the target velocity above this speed

LaunchReliability=97                   	// The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
#Homing
SeekerGain=46.0                        	// Seeker gain in dB
SeekerFOV=25.0                         	// Seeker field-of-view in degrees
SecondaryPassiveRadarGuidanceType=HomeOnJam  // Used with Active or SemiActive radar seeker. Used to detect emitting targets and home on them prior getting active target lock. Supported values: Full for both radar and ECM emissions and HomeOnJam if can home on jammers only
PassiveRadarGuidanceFrequencies=All    	// Frequences Anti-Radiation and HomeOnJam weapons can detect
SeekerPassiveRange=11					// Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
SeekerActiveRange=11.0					// Seeker active range in nautical miles. Relevant for Semi-Active Radar Homing, Active Radar Homing, Laser-Homing and Active Sonar Homing (2, 3, 5 and 7)
Frequency=X-Band                       	// Active radar seeker frequency, used to determine the jamming efficiency, jammer should support the same band
PeakPower=3								// Active radar seeker output peak power in kW
TargetMemory=True                      	// Always locks on preselected target unless spoofed or jammed

#ECCM
AntiCountermeasuresBonus=0.35           // This value substracted from probability of spoofing by countermeasures (0...1)
AntiJammerBonus=0.45                    // This value substracted from probability of being jammed  (0...1)

SelfDestructDelay=5.0                  	// Delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=ammunition/spa_aim-120b/
ResourcesRoot=spa_aim-120b.obj
ResourcesMesh=aim120b
ResourcesMaterialFolder=ammunition/spa_aim-120b/
ResourcesMaterial=spa_aim-120b_mat.ini

ResourcesMeshSwitchTime=0.2  			// Time in seconds after launch to switch from launch mesh to main mesh

[---------- Effects ----------]
[Particles]
BoosterEffect=effects/weapons/emitters/aam_effect
BoosterEffectPosition=0,0,-0.018

InFlightEffectClass=DefaultMissileInflightEffect
InFlightEffectPosition=0,0,-0.020
InFlightEffectStartTime=2.0  			// In seconds, after that the Inflight Effect will be played if available

SustainerEffect=effects/weapons/emitters/missile_sustainer_small_effect
SustainerEffectPosition=0,0,-0.018
SustainerEffectStartTime=2.0

HitShipExplosionClass=MediumMissileExplosions
HitAirExplosionClass=MediumMissileExplosions
HitDefaultExplosionClass=MediumMissileExplosions
HitWaterSplashClass=SmallWaterSplashes

[---------- Colliders ----------]
[Colliders]
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.15, 0.15, 1.2
# Scale=0.005,0.005,0.05