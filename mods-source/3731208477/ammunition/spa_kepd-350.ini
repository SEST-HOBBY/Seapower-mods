# ver. 20260521
# Taurus KEPD-350
#
[General]
Type=Missile                           	// Can be Projectile, Missile, RBU, Torpedo
TargetType=ASuW                        	// Can be AAW, ASuW, ASW
LandAttackCapability=All		      	// Can be  All, Installation, Mobile, ShoreTargetsOnly
CanNotAttackTypes=Submarine     		// Seeker ignores objects of this type while in default mode

CIWSDefenceBonus=10                     // Less chance to be intercepted by CIWS because of anti-interception maneuvers
MissileDefenceBonus=0.10                // Less chance to be intercepted by SAM because of anti-interception maneuvers

Mass=1230                               // In kg. Used for aircraft
AmmoPoints=5000                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability
AirLaunched=True                       	// For Encyclopedia. Displays launch altitudes
#SupplyCategory=Taurus                  // For Supply System. Makes that presence of such category is required for replenishment of this weapon

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  					// Referenced in effects/decals.ini

[SensorData]
VisualIdentificationRange=5  			// At what range in nm this unit can be visually identified
IRSignature=VerySmall
# Radar related (RCS => radar cross section)
RCS=0.05

[---------- Warhead Data ----------]

#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

[WarheadData]
WarheadType=0
Power=300
ImpactSize=Large                       	// Impact size, can be small, medium, large, verylarge
Penetration=Always                     	// can be minor, moderate, heavy, always

FuzeProximityDistance=12.0             	// for proximity fuze: distance to target in yard
InterceptSpeedPenaltyMultiplier=0.75    // multiplier to the severity of the speed penalty, 0.75 for good, 1.0 for average, 1.25 for poor
KillProbability=0.90                    // Base chance to hit

[---------- Guidance ----------]

# Guidance Types:
# 0 = None
# 1 = IR Homing
# 2 = Semi-Active Radar Homing
# 3 = Active Radar Homing
# 4 = Anti-Radiation Homing
# 5 = Laser-Homing
# 6 = TV-Homing
# 7 = Active Sonar Homing
# 8 = Passive Sonar Homing
# 9 = Wake Homing

[Guidance]
GuidanceType=1
MidCourseCorrection=0                  	// 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3         	// Time in seconds where the missile moves straight on without guiding
DropDuration=2.0                       	// Time in seconds where the missile just falls unpropelled
PerformsSlightBallisticInitialFlight=True  // Flag if the missile performs a slight ballistic flight curve during the initial phase (e.g. vessel launched harpoon)
TerrainFollowFlight=True
#======================================== Flight Profile ===========================================================
#flight phase 1: loft-----------------------------------------------------------------------------------------------------------------
#1st stage of missile flight - high altitude
MaxLoftAngle=50.0                      	// Climb angle for initial loft
MaxLoftAlt=80                       	// Maximum altitude for lofting, apart of number in feet can be: Maintain - maintain altitude that missile had at lofting phase start, Target - go to altitude target had at the moment of the launch, Launcher - go to altitude launch platform had at the moment of the launch.
#Last stage - missile activates seeker and locks on target
TerminalApproachDist=3               	// in N. miles. Recommended to set this distance slightly less than the seeker range. For SAM better set it to max value, 1000 miles is enough
LocalTerminalOnly=True                  // if true connection with a guiding radar will be severed upon entering terminal approach stage

TerminalPopUpDist=2                    // Pop-up distance in miles
TerminalPopUpHeight=3500               // Pop-up limit in feet. Actual max height depends on missile turn rate
TerminalPopUpAngle=75                  // Pop-up climb anble in degrees
TerminalVerticalTurnRate=75            // Override of vertical turn rate in terminal (intended for Pop-up)
SupportsBanking=True                   // if the missile will bank when turning
#========================================= Launch stats ============================================================
MaxVelocity=650.0                     	// Maximum speed in knots
Acceleration=6.0                       	// Acceleration factor
MaxTurnRate=30                       	// Maximum turnrate in degrees per second

MinLaunchRange=22                    	// Minimum launch range in nautical miles
MaxLaunchRange=270                   	// Maximum launch range in nautical miles

LaunchReliability=98                   	// The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadiusInstallation=5	    // Circular error vs 'Installation' land units

IsRearAspectOnly=False                 	// Rear aspect ammunition can lock on targets from their rear cone only
TargetRearCone=120                    	// Horizontal and vertical cone width in degrees applied to targets of rear aspect only weapons. Ignored for all aspect weapons
SeekerFOV=5                         	// Seeker field-of-view in degrees
SeekerGimbalFOV=50                     	// Seeker gimbal FOV in degrees
SeekerPassiveRange=10                  	// Seeker passive range in nautical miles. Relevant for IR Homing, Semi-Active Radar Homing, Anti-Radiation Homing, TV-Homing, Passive Sonar Homing and Passive Sonar Homing (1, 2, 4, 6, 8 and 9)
TargetMemory=True                     	// Always locks on preselected target unless spoofed or jammed

AntiCountermeasuresBonus=0.95           // This value substracted from probability of spoofing by countermeasures (0...1)

SelfDestructAfterTargetGone=False      // in case the target is destroyed and therefor lost, shall the missile be destroyed too?
SelfDestructDelay=5.0                  // delay in seconds for self destruction

