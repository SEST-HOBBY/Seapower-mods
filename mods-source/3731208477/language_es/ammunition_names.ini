[AmmunitionNames]
ger_dm2a4_er=DM2A4_ER,SeeHake,Torpedo,El DM2A4 ER (Extended Range), conocido internacionalmente como SeaHake mod 4, es un torpedo pesado de última generación fabricado por la empresa alemana Atlas Elektronik.\n\nEste armamento constituye el vector de ataque principal de los nuevos submarinos de la clase S-80 de la Armada Española.\n\nVersión de rango extendido con un alcance de hasta 140 kilómetros.
ger_dm2a5==DM2A5,SeaHake,ASuW/ASW Torpedo,Futuro torpedo pesado germano-noruego de 533 mm diseñado para la clase Tipo 212CD. La información pública describe una arquitectura centrada en software, propulsión modular eléctrica a batería, enlace de datos por fibra óptica y sonar digital avanzado para combates contra múltiples objetivos y en aguas costeras con acústica compleja. Los datos exactos de rendimiento no son públicos; los valores mostrados en el juego son estimados.

spa_agm-114m=AGM-114M,Hellfire M,ASM,El AGM-114M Hellfire II es una variante especializada de la famosa familia de misiles tácticos aire-superficie de precisión, operada en España principalmente por la Flotilla de Aeronaves (FLOAN) de la Armada Española.\n\nA diferencia de las variantes Hellfire estándar (diseñadas con cargas huecas HEAT para perforar blindaje pesado), el AGM-114M está específicamente diseñado para misiones multipropósito y litorales, optimizado contra objetivos sin blindaje grueso o estructuras reforzadas.
spa_agm-119b=AGM-119B,Penguin,ASM,El AGM-119B Penguin (específicamente la versión Mk 2 Mod 7) es un misil antibuque de corto a medio alcance operado en España por la Flotilla de Aeronaves (FLOAN) de la Armada Española.\n\nEs el arma principal de ataque contra buques de superficie desplegada desde los helicópteros Sikorsky SH-60B Seahawk de la 10ª Escuadrilla.
spa_agm-65f=AGM-65F,Maverick,ASM,El AGM-65F es un misil aire-superficie especializado, guiado por infrarrojos y optimizado para la guerra naval, ampliamente utilizado por la Novena Escuadrilla de la Armada española en sus cazas EAV-8B Harrier II Plus.

spa_aim-120b=AIM-120B,AMRAAM,AAM,El AIM-120B AMRAAM (Misil Aire-Aire de Alcance Medio Avanzado) es un misil para todo tipo de clima, de alcance más allá del alcance visual (BVR), utilizado por Estados Unidos y sus aliados.\n\nComo arma de "dispara y olvida", utiliza guiado inercial con un buscador de radar activo para interceptar objetivos, y se emplea habitualmente en combate aire-aire a distancias medias y largas.
spa_aim-120c=AIM-120C,AMRAAM,AAM,El AIM-120C AMRAAM (Misil Aire-Aire de Alcance Medio Avanzado) es una variante mejorada con alas y aletas recortadas para su transporte interno en cazas furtivos.\n\nEste misil, apto para todo tipo de clima y de alcance más allá del alcance visual (BVR), emplea un buscador de radar activo mejorado y tecnología de "dispara y olvida", lo que proporciona mayor letalidad y precisión contra las amenazas aéreas modernas.
spa_iris-t=IRIS-T,IRIS-T,AAM,El IRIS-T es un misil aire-aire guiado de corto alcance, de última generación y desarrollado en Europa, diseñado para una alta maniobrabilidad y combate aire-aire.\n\nEs fabricado por un consorcio liderado por la empresa alemana Diehl Defense.\n\nEn España, el Ejército del Aire lo equipa en los aviones EF-18M (C.15M) y Eurofighter Typhoon (C.16).
spa_meteor=METEOR,METEOR,AAM,El misil Meteor es el arma aire-aire de largo alcance más avanzada utilizada por el Ejército del Aire y del Espacio de España, operando como el vector principal de superioridad aérea en su flota de cazas Eurofighter Typhoon.

spa_kepd-350=KEPD-350,Taurus,Ataque Terrestre,El Taurus KEPD 350 es un misil de crucero de largo alcance y alta precisión lanzado desde el aire, operado en España en exclusividad por el Ejército del Aire y del Espacio como su arma principal de penetración estratégica y ataque quirúrgico a larga distancia.

spa_jsm-sl=JSM-SL,Joint Strike Missile,ASM,El JSM-SL es una variante para lanzamiento desde submarinos del misil sigiloso noruego Joint Strike Missile (JSM), desarrollado por Kongsberg. Disparado desde tubos de torpedos estándar de 533 mm dentro de una cápsula de lanzamiento protectora, el misil cuenta con un buscador infrarrojo por imagen (IIR) avanzado, sensores pasivos y navegación por GPS/INS. Diseñado tanto para misiones antibuque como de ataque a tierra, combina una sección eficaz de radar extremadamente baja con perfiles de vuelo a ras del agua (sea-skimming) para penetrar las defensas aéreas navales modernas.

spa_saes_mine=SAES MINEA,Mina SAES,Mina,La empresa pública española SAES Electronics Submarina es la responsable del suministro de la última generación de minas  inteligentes multi-influencia MINEA para los nuevos submarinos de la clase S-80 de la Armada española.\n\nEstas armas sustituyen a los modelos MCC-23D anteriores (que eran incompatibles con los tubos lanzatorpedos de la nueva serie S-80).\n\nTienen una autonomía de 5 días.

usn_adc_mk2_mod4_noisemaker=Noisemaker,ADC MK 2 Mod 4,Torpedo Decoy,El ADC MK 2 Mod 4 es un señuelo acústico desechable de 7,6 cm de diámetro para buques de superficie, lanzado manualmente desde destructores y cruceros como sistema de defensa antitorpedos de reserva. Representa una generación electrónica más reciente que las variantes Mod 0/1/3 anteriores y, una vez desplegado en el agua, es acústicamente idéntico al Mod 5 lanzado desde submarinos. Sirve como respaldo manual del sistema LEAD principal en buques de superficie.
usn_adc_mk2_mod7_noisemaker=Noisemaker,ADC MK 2 Mod 7,Torpedo Decoy,El ADC MK 2 Mod 7 es la variante más reciente de la familia MK 2 de 3 pulgadas. Su principal mejora con respecto a las versiones anteriores es la incorporación de una batería de litio térmica en lugar de la batería activada por agua de mar, lo que extiende significativamente la duración operativa a 7 minutos. La salida acústica sigue siendo la misma que la de todos los proyectores MK 2 anteriores de 3 pulgadas; la batería de litio térmica mejora la duración, no la capacidad de suplantación de identidad.
usn_an_slq_25a_nixie_decoy=AN/SLQ-25A,Nixie-A,Decoy,El Nixie (anteriormente AN/SLQ-25A) es un sistema de señuelos remolcados utilizado principalmente por los buques de superficie de la Armada de los Estados Unidos. El sistema genera señales diseñadas para desviar los torpedos que se aproximan, alejándolos de la plataforma que lo alberga. El modelo SLQ-25A posee características de radiación superiores y puede engañar a los torpedos entrantes con mayor facilidad.

usn_mk182_chaff=Chaff,,SRBOC,El Mark 36 SRBOC (Super Rapid Bloom Offboard Countermeasures) es la solución de la Armada de los EE. UU. ante la creciente amenaza de misiles antibuque, tanto guiados por radar como por infrarrojos. Este sistema está conectado al sistema central de armas del buque, es altamente automatizado y puede desplegar contramedidas de chaff y bengalas con un tiempo de reacción muy corto, lo que lo hace ideal contra amenazas de misiles que vuelan a baja altitud sobre el mar.\n\nEste sistema en particular utiliza las Mk 182 (chaff mejoradas) y Mk 186 TORCH (bengalas) para contrarrestar la creciente amenaza de misiles antibuque avanzados que se está desarrollando en la década de los 80.
usn_mk214_chaff=Chaff,,SRBOC,El Mark 36 SRBOC (Super Rapid Bloom Offboard Countermeasures) es la solución de la Armada de los EE. UU. a la creciente amenaza de misiles antibuque, tanto contra misiles guiados por radar como por infrarrojos. Este sistema está conectado al sistema central de armas de un buque, es altamente automatizado y puede desplegar contramedidas de chaff y bengalas con un tiempo de reacción muy corto, lo que resulta ideal contra amenazas de vuelo rasante.\n\nEste sistema en particular utiliza el avanzado sistema de contramedidas Sea Gnat para contrarrestar eficazmente los misiles antibuque modernos con las contramedidas de seducción y distracción de chaff Mk 214 y Mk 216, y la contramedida de bengalas gigantes Mk 245.

usn_ssq-53=AN/SSQ-53,DIFAR,Sonoboya pasiva,La SSQ-53 es una sonoboya de tipo Análisis y Registro de Frecuencia Direccional (DIFAR).\n\nEsto le da al operador de la sonoboya información de rumbo magnético, lo cual es una gran mejora con respecto a la CRT-1 omnidireccional anterior.\n\nVersión actualizada con 4 horas de tiempo de vida y rango de emisión de datlink de 50 millas.
usn_ssq-62=AN/SSQ-62,DICASS,Sonoboya activa,La AN/SSQ-62 DICASS es una sonoboya activa utilizada para fijar un submarino sumergido que ha sido previamente localizado con las sonoboyas pasivas SSQ-53.\n\nVersión actualizada con 4 horas de tiempo de vida y rango de emisión de datlink de 50 millas.

