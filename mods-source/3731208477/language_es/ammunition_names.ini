nac_ger_dm2a4=DM2A4,SeaHake,ASuW/ASW Torpedo,Torpedo pesado de 533 mm lanzado desde submarino, con guiado por cable y sistema de guiado acústico activo/pasivo terminal. Optimizado para ataques de largo alcance contra submarinos y buques de superficie, con una sólida lógica de contramedidas. Su efectividad depende de la doctrina, las condiciones del agua y las maniobras del objetivo, y su empleo está limitado por los ciclos de recarga y del tubo.
