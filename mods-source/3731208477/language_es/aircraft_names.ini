[spa_av-8b]
Type=Caza
Default=AV-8B,AV-8B Harrier II
DefaultDescription=El EAV-8B "Harrier II" representa la evolución del concepto V/STOL de la Armada Española.\n\nEstas aeronaves suponen un gran avance respecto al AV-8S "Cobra" original, con un ala compuesta de mayor tamaño y una cabina rediseñada.\n\nOperando desde el portaaviones Príncipe de Asturias, el Harrier II español proporciona a la flota una potente capacidad de ataque a tierra y defensa naval, duplicando la autonomía de misión y la carga útil de armamento de la generación anterior.
Squadron1=AV-8B 9ª Escuadrilla,AV-8B
Callsigns=Squadron1,Cobra

[spa_av-8b_plus]
Type=Caza
Default=AV-8B+,AV-8B Harrier II Plus
DefaultDescription=El EAV-8B Plus representa la máxima evolución de la flota "Matador" de la Armada Española.\n\nDistinguido por su morro alargado que alberga el radar AN/APG-65, esta versión transforma al Harrier de un avión de ataque exclusivamente visual en un auténtico caza polivalente.\n\nOperando desde el portaaviones Príncipe de Asturias y el buque de asalto anfibio Juan Carlos I, el "Plus" otorga a la Armada la capacidad de realizar operaciones en cualquier condición meteorológica y desplegar misiles de largo alcance, garantizando así la eficacia de la defensa aérea de la flota en la era moderna.
Squadron1=AV-8B+ 9ª Escuadrilla,AV-8B+
Callsigns=Squadron1,Cobra

[spa_ef2000]
Type=Caza
Default=C.16 Typhoon,Eurofighter EF-2000
DefaultDescription=El C.16 Typhoon es la punta de lanza de la defensa aérea del Ejército del Aire y del Espacio de España.\n\nConocidos por su agilidad extrema y su alta relación empuje-peso, los Eurofighters españoles han evolucionado de ser interceptores puros a potentes plataformas polivalentes de tipo swing-role.\n\nEquipado con el radar CAPTOR y el sistema de búsqueda y seguimiento por infrarrojos (IRST) PIRATE, el C.16 destaca en el combate más allá del alcance visual (BVR). Integrado con misiles de largo alcance Meteor y misiles de corto alcance Iris-T vinculados a visores montados en el casco, proporciona a España una ventaja tecnológica decisiva, garantizando la superioridad aérea frente a cualquier amenaza moderna en el teatro de operaciones.
Squadron1=C.16 Ala 11 Escuadrón 111,EF-2000
Squadron2=C.16 Ala 11 Escuadrón 113,EF-2000
Squadron3=C.16 Ala 14 Escuadrón 141,EF-2000
Squadron4=C.16 Ala 14 Escuadrón 142,EF-2000
Callsigns=Squadron1,Dardo|Squadron2,Gallo|Squadron3,Lanza|Squadron4,Tigre

[spa_f-18a]
Type=Caza
Default=C.15 (F/A-18A),F/A-18A Hornet
DefaultDescription=El C.15 "Hornet" es el principal caza polivalente del Ejército del Aire español, adquirido bajo el programa FACA para modernizar la defensa aérea de España.\n\nRepresentando un salto tecnológico masivo sobre el F-4 Phantom y el Mirage III, el Hornet español cuenta con una cabina altamente automatizada, el avanzado radar AN/APG-65 y la capacidad de emplear misiles tanto semiactivos como infrarrojos.\n\nOperando desde Gando, Zaragoza y Torrejón, el C.15 dota al Ejército del Aire de un robusto interceptor todo tiempo y una plataforma de ataque capaz de defender el espacio aéreo nacional y realizar misiones de ataque marítimo de largo alcance.
Squadron1=C.15 Ala 12 Escuadrón 121,F/A-18A
Squadron2=C.15 Ala 12 Escuadrón 122,F/A-18A
Squadron3=C.15 Ala 15 Escuadrón 151,F/A-18A
Squadron4=C.15 Ala 15 Escuadrón 152,F/A-18A
Squadron5=C.15 Ala 46 Escuadrón 462,F/A-18A
Callsigns=Squadron1,Poker|Squadron2,Tenis|Squadron3,Toro|Squadron4,Marte|Squadron5,Alcon

[spa_f-18m]
Type=Caza
Default=C.15M (EF-18M),EF-18M Hornet
DefaultDescription=El C.15M es la versión modernizada "Mid-Life Update" (MLU) del Hornet español, transformada en una plataforma digital de última generación por el CLAEX e Indra.\n\nEsta actualización presenta una cabina completamente renovada con pantallas multifunción en color, computadores de misión avanzados y la integración de Link-16 para el intercambio de datos tácticos en tiempo real.\n\nEl C.15M introduce capacidades estratégicas en el Ejército del Aire, incluyendo el pod Litening, el misil de crucero Taurus KEPD 350 y el misil aire-aire Iris-T guiado por visor de casco, convirtiéndolo en uno de los activos polivalentes más versátiles y letales del teatro mediterráneo.
Squadron1=C.15 Ala 12 Escuadrón 121,F/A-18A
Squadron2=C.15 Ala 12 Escuadrón 122,F/A-18A
Squadron3=C.15 Ala 15 Escuadrón 151,F/A-18A
Squadron4=C.15 Ala 15 Escuadrón 152,F/A-18A
Callsigns=Squadron1,Poker|Squadron2,Tenis|Squadron3,Toro|Squadron4,Marte

[spa_sh-60b]
Type=Helicóptero ASW
Default=SH-60B LAMPS III,SH-60B
DefaultDescription=El SH-60B Seahawk es el helicóptero de guerra naval referente de la Armada Española.\n\nIntegrado en la 10.ª Escuadrilla, este helicóptero actúa como los ojos y oídos extendidos de las fragatas españolas.\n\nEquipado con el radar de búsqueda de superficie APS-124, el detector de anomalías magnéticas (MAD) y sonoboyas, es una plataforma especializada de ataque y destrucción.\n\nEn servicio en la Armada Española, el SH-60B destaca por su perfecta integración con el sistema de combate Aegis, proporcionando una defensa letal contra amenazas submarinas y de superficie en el Mediterráneo y el Atlántico.
Squadron1=10ª Escuadrilla
Callsigns=Squadron1,Ansar

