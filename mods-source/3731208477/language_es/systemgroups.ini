[SystemNames]
#---Visual---
AN/ASB-19=AN/ASB-19|El sistema de bombardeo de velocidad angular (ARBS) Hughes AN/ASB-19 es un sistema de bombardeo de precisión diseñado para los aviones de ataque del Cuerpo de Marines de EE. UU. (A-4M Skyhawk, AV-8B Harrier II) para mejorar la precisión diurna y nocturna de las armas no guiadas.\n\nCon un peso inferior a 63 kg, cuenta con un rastreador de modo dual (DMT) montado en el morro para el seguimiento de puntos láser y el seguimiento por televisión, lo que mejora la precisión del apoyo aéreo cercano.
AN/AAS-44=AN/AAS-44|El AN/AAS-44 es un sistema optrónico de detección térmica y designación láser de largo alcance, fabricado por Raytheon para helicópteros SH-60B Sea Hawk.\n\nUsados por la Armada Española en sus Sea Hawk Block 1.
AN/AAS-44_Laser=AN/AAS-44_Laser|El AN/AAS-44 es un sistema optrónico de detección térmica y designación láser de largo alcance, fabricado por Raytheon para helicópteros SH-60B Sea Hawk.\n\nUsados por la Armada Española en sus Sea Hawk Block 1.
eu_AN/AAQ-28=Litening (visual)|El Litening es un pod de designación de objetivos para todoclima utilizado por aviones de ataque, que emplea un sistema FLIR y un láser para designar objetivos para bombas guiadas por láser.\n\nMódulo FLIR.
OMS-200=Hensoldt OMS-200|El Hensoldt OMS-200 (Sistema de Mástil Optrónico) es un sistema de mástil optrónico compacto y de bajo perfil diseñado para cumplir con las restricciones operativas y de sigilo de los submarinos convencionales y nucleares modernos.\n\nDebido a que no penetra el casco, transmite datos visuales electrónicamente a la sala de control a través de cables de fibra óptica en lugar de utilizar un tubo óptico de visión directa.
PIRATE=PIRATE| Un sensor pasivo situado frente a la cabina.\n\nDetecta y rastrea aviones por su firma de calor sin emitir señales de radar, lo que permite al Typhoon localizar enemigos de forma sigilosa a largas distancias.
Sentinel_2.0_sensor=Sentinel 2.0|Incluye una cámara de infrarrojos de tercera generación, cámara diurna (CCD) y un telémetro láser (LRF) asociado para hacer puntería.
Sentinel_30_sensor=Sentinel 30|Incluye una cámara de infrarrojos de tercera generación, cámara diurna (CCD) y un telémetro láser (LRF) asociado para hacer puntería.

#---Laser---
eu_Litening=Litening (laser)|El Litening es un pod de designación de objetivos para todoclima utilizado por aviones de ataque, que emplea un sistema FLIR y un láser para designar objetivos para bombas guiadas por láser.\n\nMódulo láser.

#---Radar---
eu_SPY-1D=SPY-1D|El AN/SPY-1D es la evolución del radar de matriz de fase Aegis para buques de combate del tamaño de una fragata.\n\nOptimizado para los requisitos multifuncionales de la clase F-100, proporciona vigilancia continua de 360 ​​grados y capacidad de seguimiento durante el escaneo.\n\nSu avanzado procesamiento de señales ofrece un rendimiento superior en entornos litorales y escenarios con alta interferencia, en comparación con el SPY-1A anterior.
eu_SPY-1D(V)=SPY-1D(V)|El AN/SPY-1D(V) es la evolución "Litoral" del radar Aegis, que incorpora tecnología avanzada de barrido de doble haz.\n\nOfrece un procesamiento de señal significativamente mejorado para entornos costeros con alta interferencia y una búsqueda volumétrica optimizada para la detección de misiles de crucero de baja altitud.\n\nEsta variante proporciona una discriminación de objetivos y una tasa de actualización de seguimiento superiores en comparación con el SPY-1D estándar.
eu_SPS-67(V3)=SPS-67(v3)|El AN/SPS-67(V)3 es un radar de búsqueda y navegación de superficie de corto a medio alcance y alta fiabilidad.\n\nOpera en la banda C y esta variante específica incorpora procesamiento digital de señales y detección automática de objetivos, lo que le confiere una gran eficacia para detectar embarcaciones pequeñas y misiles de vuelo rasante en entornos con alta interferencia marina.\n\nSirve como sensor principal de vigilancia de superficie para las clases F-100 y Arleigh Burke.
spa_ARIES_NAV=ARIES Nav|El radar Aries (o Aries SAAS/Nav) de Indra es un sistema de vigilancia y navegación de alta resolución en banda X (8-12.5 GHz), diseñado para uso naval.\n\nEs conocido por su baja probabilidad de interceptación (LPI), lo que lo hace difícil de detectar por sistemas ESM, ideal para la detección de blancos pequeños en superficie y baja cota, con alcances de hasta 250 millas náuticas.
spa_ARIES_SAAS=ARIES SAAS|Radar bidimensional de exploración combinada aérea y de superficie de corto y medio alcance.\n\nDesarrollado por Indra, utiliza tecnología de onda continua modulada en frecuencia (FMCW), lo que le otorga una Baja Probabilidad de Interceptación (LPI) frente a sistemas de guerra electrónica enemigos.\n\nEn el L61 Juan Carlos I, actúa como sensor secundario de alerta temprana contra misiles a baja cota y como el sistema principal para el control, aproximación y gestión de aeronaves en las inmediaciones del buque.
spa_ARIES_SCH=ARIES SCH|El Aries SAAS-SCH es un sistema de radar naval de alto rendimiento diseñado específicamente para la exploración de superficie y el control de helicópteros (SCH: Surface and Helicopter Control) en buques de guerra.\n\nDesarrollado por la empresa española Indra, es un componente esencial de los sistemas de combate de la Armada Española, integrado en plataformas como las F100.
spa_ARIES_PAR=ARIES PAR|Radar de aproximación de precisión sectorial de corto alcance, especializado en el guiado ciego de aeronaves.\n\nEmplea tecnología FMCW de muy baja potencia (LPI) y genera un haz hiperestrecho de alta resolución en la Banda X.\n\nSu función exclusiva en el portaeronaves es proporcionar a los controladores de vuelo datos críticos y exactos de rumbo y senda de planeo para dirigir de forma segura a cazas (AV-8B / F-35B) y helicópteros hasta la cubierta de vuelo, especialmente bajo condiciones meteorológicas adversas o visibilidad nula.
spa_LANZA-N=LANZA-N|El Indra LANZA-N es un radar tridimensional (3D) de barrido electrónico activo (AESA) que opera en la Banda L (Banda D de la OTAN).\n\nDiseñado específicamente para el ámbito naval, proporciona funciones avanzadas de alerta temprana, vigilancia aérea y de superficie de largo alcance, y designación de blancos.\n\nGracias a su tecnología de estado sólido, ofrece una gran resistencia a las contramedidas electrónicas (ECCM) y un excelente rendimiento en entornos con alta interferencia o clutter marino, siendo el sensor principal de vigilancia del buque insignia de la Armada Española, el L-61 Juan Carlos I.
spa_PRISMA_25X=PRISMA 25X|El PRISMA 25X es un radar naval polivalente de banda X desarrollado por Indra, que utiliza tecnología AESA de cuatro facetas fijas. Está diseñado para la vigilancia de superficie y la detección precisa de blancos de baja cota y bajo perfil en las fragatas F-110.
spa_sperry_visionmaster_ft=Sperry Marine VisionMaster FT|Radar de navegación naval y comercial en banda X de alta resolución, utilizado en buques principales como el Juan Carlos I (L-61) para seguridad náutica, tránsito costero y conciencia situacional a corta distancia.\n\nGracias a su avanzado sistema de supresión de olas, ofrece una detección excepcional de amenazas de superficie con baja firma de radar, periscopios y embarcaciones menores dentro del horizonte de radar.

#---Sonar---
DE1160LF=DE 1160LF|El DE 1160LF es una evolución avanzada del modelo estándar DE-1160 (SQS-56), específicamente modificado para operar en baja frecuencia (LF).\n\nAl operar en frecuencias acústicas más bajas, logra un mayor alcance de detección y una mejor penetración en capas térmicas en comparación con su predecesor.\n\nEsta variante incorpora un procesamiento digital modernizado para una discriminación de objetivos mejorada en entornos litorales complejos.
CAS_S80=CAS Activo Pasivo|Sónar de proa con capacidad activa y pasiva.
FASLPRS=Flank Array|Sónar de casco.
FASLPRS_L=FASLPRS|Sónar de casco (lado izquierdo).
FASLPRS_R=FASLPRS|Sónar de casco (lado derecho).
SOLARSUB_S-80_DTAS=Towed Array|Sónar remolcado, funcionamiento en modo pasivo exclusivamente.
AIS_S80=Active Intercept|Sónar activo de interceptación.
MODS_S80=Mine/Obstacle Detection|Sónar para detección de minas y obstáculos, a corta distancia.

#---------------------------------------- Aircraft Radar ----------------------------------------
APS-124=APS-124|El AN/APS-124 es un radar de vigilancia aerotransportado de banda X diseñado para aplicaciones marítimas, utilizado principalmente para la búsqueda en superficie y la detección de periscopios submarinos.\n\nEs un componente clave del sistema LAMPS Mk-III (Sistema Aerotransportado Multiusos Ligero) instalado en los helicópteros Sikorsky SH-60B Seahawk y Kaman YSH-2E Seasprite.
Captor-E=Captor-E|Radar de barrido electrónico activo (AESA) con más de 1.000 módulos de transmisión y recepción.\n\nEstá montado sobre un reposicionador móvil que permite inclinar la antena, proporcionando un campo de visión de 200 grados, un 50% superior al de radares AESA fijos convencionales.
Captor-M=Captor-M|Radar Doppler de impulsos en banda X multimodo.\n\nUtiliza una antena mecánica de gran tamaño con una alta velocidad de barrido (hasta 330° por segundo) y tres canales de procesamiento: uno para búsqueda, otro para seguimiento/identificación y un tercero dedicado a ECCM (contramedidas electrónicas) y mapeo de interferencias.

#---------------------------------------- ECM ----------------------------------------
ALDEBARAN_EW=Aldebaran ECM|Indra SLQ-380A Aldebaran es un sistema de contramedidas electrónicas (ECM) de alta potencia capaz de interferir simultáneamente múltiples amenazas.\n\nOptimizado para la clase F-100, utiliza técnicas avanzadas de memoria de radiofrecuencia digital (DRFM) para engañar a los buscadores de radar activos entrantes y a los sensores de vigilancia de largo alcance, proporcionando una capa crítica de defensa de neutralización suave.
RIGEL_RECM=Rigel RECM|El sistema de defensa electrónica RIGEL es una solución avanzada de contramedidas electrónicas (ECM) desarrollada por la multinacional española Indra.\n\nEste sistema está diseñado para proteger plataformas navales mediante la detección, el análisis y la neutralización de amenazas en entornos electromagnéticos complejos.

AN/ALQ-126B=AN/ALQ-126B|Sistema integrado de contramedidas electrónicas defensivas que combina el sistema de banda ancha AN/ALQ-126B con el inhibidor de onda continua AN/ALQ-162, proporcionando una mayor cobertura y protección contra amenazas guiadas por radar tanto de pulso como de onda continua.
DASS_Praetorian_ECM=Praetorian ECM|Un potente conjunto integrado de contramedidas electrónicas.\n\nUtiliza tecnología DRFM (Memoria Digital de Radiofrecuencia) para capturar, manipular y retransmitir las señales de radar enemigas.\n\nEsto permite crear blancos fantasma, ocultar la posición real del avión o saturar los buscadores enemigos con interferencias.

#---------------------------------------- ESM ----------------------------------------
ALDEBARAN_ESM=Aldebaran ESM|El sistema Aldebaran ESM es un precursor fundamental de la actual suite Rigel de Indra.\n\nSe trata de un sistema de medidas de apoyo electrónico (ESM) de alto rendimiento que ha sido el estándar de guerra electrónica para los buques de combate más avanzados de la Armada Española durante décadas.
RIGEL_RESM=Rigel RESM|El sistema Rigel ESM (o RESM por Radar Electronic Support Measures) de Indra Group es la vertiente pasiva de la suite Rigel, dedicada a la vigilancia del espectro electromagnético.\n\nSu función principal es detectar, analizar, clasificar e identificar señales de radar en tiempo real para proporcionar conciencia situacional y alerta temprana al buque.

ALQ-142=ALQ-142|The AN/ALQ-142 es un sistema de medidas de apoyo electrónico (ESM, por sus siglas en inglés) utilizado en los helicópteros SH-60B Seahawk para el Sistema Aerotransportado Multipropósito Ligero (LAMPS) Mk III.\n\nDetecta, identifica y localiza emisiones de radar hostiles, proporcionando una cobertura de 360 ​​grados en las bandas E/F, G/H, I/J y K para ayudar en la guerra antisubmarina y de superficie.
ALQ-142I=ALQ-142(I)|El AN/ALQ-142I (Mejorado) es un sistema de medidas de apoyo electrónico (ESM, por sus siglas en inglés) utilizado en los helicópteros SH-60B Seahawk para el Sistema Aerotransportado Multipropósito Ligero (LAMPS) Mk III.\n\nDetecta, identifica y localiza emisiones de radar hostiles, proporcionando una cobertura de 360 ​​grados en las bandas E/F, G/H, I/J y K para ayudar en la guerra antisubmarina y de superficie.
DASS_Praetorian_ESM=Praetorian ESM|El sistema de Medidas de Apoyo Electrónico (ESM) emplea receptores digitales y superheterodinos para detectar radares enemigos en un amplio espectro de frecuencias.\n\nSus antenas, integradas en los pods de las puntas de las alas, ofrecen una cobertura esférica de 360 grados para identificar objetivos y sus zonas de letalidad.

#---------- RWR ----------
ALQ-142_RWR=ALQ-142 RWR|Alerta de radar y localización de amenazas navales (especialmente submarinos que usan radar).
ALQ-142I_RWR=ALQ-142(I) RWR|Alerta de radar y localización de amenazas navales (especialmente submarinos que usan radar).
AN/ALR-67=AN/ALR-67|El AN/ALR-67 es un receptor digital de alerta de radar (RWR) diseñado por Raytheon, que sirve como sistema estándar y ligero de detección de amenazas para los aviones F/A-18 Hornet, EAV-8B y EAV-8B Plus.\n\nDetecta, identifica y localiza amenazas hostiles guiadas por radar, proporcionando a las tripulaciones información sobre la dirección y el nivel de amenaza, lo que mejora el conocimiento de la situación y la capacidad de supervivencia frente a los sistemas de misiles modernos.
DASS_Praetorian_RWR=Praetorian RWR|La funcionalidad RWR del Praetorian es parte integral del conjunto ESM, proporcionando detección de alta sensibilidad y cobertura de 360°.\n\nUtiliza receptores digitales avanzados para identificar el tipo específico de radar, su modo de operación (búsqueda, seguimiento o blocaje) y su demora precisa, mostrándolo en las pantallas multifunción (MHDD) de la cabina.

#--------- CIC ----------
spa_SCOMBA_v1=SCOMBA|SCOMBA es el sistema de gestión de combate desarrollado por Navantia que integra sensores, enlaces tácticos y armamento en los buques de la Armada Española. Actúa como el núcleo operativo del barco para procesar amenazas en tiempo real y coordinar la respuesta táctica.

