[spa_av-8b]
Type=Fighter
Default=AV-8B,AV-8B Harrier II
DefaultDescription=The EAV-8B "Harrier II is the Spanish Navy's evolution of the V/STOL concept.\n\nThese aircraft represent a major leap over the original AV-8S "Cobra," featuring a larger composite wing and a redesigned cockpit.\n\nOperating from the aircraft carrier Príncipe de Asturias, the Spanish Harrier II provides the fleet with a potent ground-attack and fleet-defense capability, doubling the mission endurance and weapons payload of the previous generation.
Squadron1=AV-8B 9ª Escuadrilla,AV-8B
Callsigns=Squadron1,Cobra

[spa_av-8b_plus]
Type=Fighter
Default=AV-8B+,AV-8B Harrier II Plus
DefaultDescription=The EAV-8B Plus is the ultimate evolution of the Spanish Navy's "Matador" fleet.\n\nDistinguished by its extended nose housing the AN/APG-65 radar, this version transforms the Harrier from a visual-only attacker into a true multi-role fighter.\n\nOperating from the aircraft carrier Príncipe de Asturias and the amphibious assault ship Juan Carlos I, the "Plus" grants the Armada the ability to conduct all-weather operations and deploy beyond-visual-range missiles, ensuring the fleet's air defense remains potent well into the modern era.
Squadron1=AV-8B+ 9ª Escuadrilla,AV-8B+
Callsigns=Squadron1,Cobra

[spa_ef2000]
Type=Fighter
Default=C.16 Typhoon,Eurofighter EF-2000
DefaultDescription=The C.16 Typhoon is the spearhead of the Spanish Air and Space Force's air defense.\n\nKnown for its extreme agility and high thrust-to-weight ratio, the Spanish Eurofighters have evolved from pure interceptors into potent multi-role swing-role platforms.\n\nEquipped with the CAPTOR radar and the PIRATE infrared search and track (IRST) system, the C.16 excels in beyond-visual-range (BVR) combat. Integrated with Meteor long-range missiles and Iris-T short-range missiles paired with helmet-mounted sights, it provides Spain with a decisive technological edge, ensuring air superiority against any modern threat in the theater.
Squadron1=C.16 Ala 11 111st Squadron,EF-2000
Squadron2=C.16 Ala 11 113th Squadron,EF-2000
Squadron3=C.16 Ala 14 141st Squadron,EF-2000
Squadron4=C.16 Ala 14 142nd Squadron,EF-2000
Callsigns=Squadron1,Dardo|Squadron2,Gallo|Squadron3,Lanza|Squadron4,Tigre

[spa_f-18a]
Type=Fighter
Default=C.15 (F/A-18A),F/A-18A Hornet
DefaultDescription=The C.15 "Hornet" is the Spanish Air Force's premier multi-role fighter, acquired under the FACA program to modernize Spain's air defense.\n\nRepresenting a massive technological leap over the F-4 Phantom and Mirage III, the Spanish Hornet features a highly automated cockpit, advanced AN/APG-65 radar, and the ability to deploy both semi-active and infrared missiles.\n\nOperating from Gando, Zaragoza and Torrejón, the C.15 provides the Spanish Air Force with a robust all-weather interceptor and strike platform capable of defending the national airspace and conducting long-range maritime attacks.
Squadron1=C.15 Ala 12 121st Squadron,F/A-18A
Squadron2=C.15 Ala 12 122nd Squadron,F/A-18A
Squadron3=C.15 Ala 15 151st Squadron,F/A-18A
Squadron4=C.15 Ala 15 152nd Squadron,F/A-18A
Squadron5=C.15 Ala 46 462nd Squadron,F/A-18A
Callsigns=Squadron1,Poker|Squadron2,Tenis|Squadron3,Toro|Squadron4,Marte|Squadron5,Alcon

[spa_f-18m]
Type=Fighter
Default=C.15M (EF-18M),EF-18M Hornet
DefaultDescription=The C.15M is the modernized "Mid-Life Update" (MLU) version of the Spanish Hornet, transformed into a state-of-the-art digital platform by CLAEX and Indra.\n\nThis upgrade features a completely overhauled cockpit with color multi-function displays, advanced mission computers, and the integration of Link-16 for real-time tactical data exchange.\n\nThe C.15M introduces strategic capabilities to the Spanish Air Force, including the Litening pod, Taurus KEPD 350 cruise missile and the Iris-T air-to-air missile guided by helmet-mounted displays, making it one of the most versatile and lethal multi-role assets in the Mediterranean theater.
Squadron1=C.15 Ala 12 121st Squadron,F/A-18A
Squadron2=C.15 Ala 12 122nd Squadron,F/A-18A
Squadron3=C.15 Ala 15 151st Squadron,F/A-18A
Squadron4=C.15 Ala 15 152nd Squadron,F/A-18A
Callsigns=Squadron1,Poker|Squadron2,Tenis|Squadron3,Toro|Squadron4,Marte

[spa_sh-60b]
Type=ASW Helicopter
Default=SH-60B LAMPS III,SH-60B
DefaultDescription=The SH-60B Seahawk is the premier maritime warfare helicopter of the Spanish Navy. Integrated into the 10ª Escuadrilla, these 'Bravos' serve as the extended eyes and ears of Spanish frigates.\n\nEquipped with the APS-124 surface search radar, MAD (Magnetic Anomaly Detector), and sonobuoys, it is a specialized hunter-killer platform.\n\nIn Spanish service, the SH-60B is renowned for its seamless integration with the Aegis combat system, providing a lethal defense against sub-surface and surface threats across the Mediterranean and Atlantic.
Squadron1=10ª Escuadrilla
Callsigns=Squadron1,Ansar

