[ae_ffg_alvaro_bazan]
Type=FFG,Frigate
Default=Alvaro de Bazan-class (Early),F-100
DefaultDescription=The F-100 class is the first European vessel to utilize the Aegis Combat System.\n\nDesigned as a powerful multi-role platform, its primary strength lies in its advanced anti-air warfare capabilities provided by the SPY-1D radar and VLS cells.\n\nThese Spanish-built frigates offer a formidable area defense for carrier strike groups while maintaining robust ASW and anti-surface lethality.\n\nBased at Ferrol.
Variant1=F101 Alvaro de Bazan,F101 Bazan
Variant2=F102 Almirante Juan de Borbon,F102 Borbon
Variant3=F103 Blas de Lezo,F103 Lezo
Variant4=F104 Mendez Nuñez,F104 Nuñez

[ae_ffg_bonifaz]
Type=FFG,Frigate
Default=Bonifaz-class,F-110
DefaultDescription=The F-110 Bonifaz-class frigate is a next-generation multi-mission platform optimized for anti-submarine warfare (ASW) and operations in high-intensity environments.\n\nIt features an advanced integrated mast housing active electronically scanned array (AESA) radars, a flexible multi-mission bay for deploying unmanned systems, and a domestic SCOMBA combat system integrated with the US Aegis suite.\n\nBased at Ferrol.
Variant1=F111 Bonifaz,F111 Bonifaz
Variant2=F112 Roger de Lauria,F112 Lauria
Variant3=F113 Menendez de Aviles,F113 Aviles
Variant4=F114 Luis de Cordova,F114 Cordova
Variant5=F115 Barcelo,F115 Barcelo

[ae_ffg_cristobal_colon]
Type=FFG,Frigate
Default=Alvaro de Bazan-class (Late),F-105
DefaultDescription=The F-105 Cristobal Colon features upgraded LM2500+G4 engines for increased power and an improved Aegis Baseline 7 system.\n\nIt also integrates a redesigned heavy mast for better stealth and a new command bridge to enhance fleet coordination compared to the earlier F-101 to F-104 units.\n\nBased at Ferrol.
Variant1=F105 Cristobal Colon,F105 Colon

[ae_lhd_juan_carlos]
Type=LHD,Landing Ship
Default=Juan Carlos I-class,Juan Carlos I
DefaultDescription=Designed as a multi-purpose amphibious assault ship and aircraft carrier to project power and provide air support for the Spanish Navy.\n\nFeatures a continuous flight deck with a 12-degree ski-jump, optimized for STOVL operations like the AV-8B Harrier II and F-35B, alongside a large helicopter capacity. It also boasts a floodable well deck capable of deploying landing craft and mechanized equipment.\n\nEquipped with extensive medical facilities and command centers, the vessel is highly versatile, able to act as an alternative capital ship, support humanitarian aid, and lead multinational task forces.\n\nBased at Rota.
Variant1=L61 Juan Carlos I,Juan Carlos I

[ae_lpd_galicia]
Type=LPD,Landing Ship
Default=Galicia-class,Galicia
DefaultDescription=Originally started as a national project by the Netherlands. In 1990 the ATS was seen as a possible solution to fulfil the spanish requirements for a new LPD.\n\nAble to transport a fully equipped battalion of marines providing a built-in dock for landing craft and a helicopter flight deck for debarkation in offshore conditions.\n\nCastilla has improved command and control facilities with two operations centres, one for amphibious and one for a combat group.Alternatively can also be used for a general logistic support for both military and civil operations, including environmental and disaster relief tasks.\n\nBased at Rota.
Variant1=L51 Galicia,Galicia
Variant2=L52 Castilla,Castilla

[ae_opv_meteoro]
Type=OPV,Offshore Patrol Vessel
Default=Meteoro-class,BAM
DefaultDescription=Developed by Navantia as a highly versatile and cost-effective solution for maritime action. Designed for low-intensity conflict, counter-piracy, and humanitarian operations in open waters.\n\nFeatures a high degree of automation that allows for a drastically reduced crew size. Equipped with a helicopter flight deck and hangar capable of operating an NH90, plus quick-launch ramps for two rigid-hulled inflatable boats for rapid interception.\n\nOptimized for long-endurance ocean patrols, environmental protection, and search and rescue missions. Can be easily adapted with modular mission containers for specialized logistics and medical support.\n\nBased at Las Palmas and Cartagena.
Variant1=P41 Meteoro,Meteoro
Variant2=P42 Rayo,Rayo
Variant3=P43 Relámpago,Relámpago
Variant4=P44 Tornado,Tornado
Variant5=P45 Audaz,Audaz
Variant6=P46 Furor,Furor

[ae_ssk_s80]
Type=SSK,Patrol Submarine
Default=S80-class,S80
DefaultDescription=The baseline S-80 design represents the early operational units built with the modified 80.8-meter hull but fitted without the active AIP module, remaining 'AIP-ready' for future overhauls.\n\nWhile sharing the same extended displacement, stealth characteristics, and automated combat systems as the Plus variant, it relies strictly on conventional diesel-electric propulsion, requiring standard snorkeling cycles to recharge batteries.\n\nBased at Cartagena.
Variant1=S81 Isaac Peral (Early),S81 Peral				// 2023-2034
Variant2=S82 Narciso Monturiol (Early),S82 Monturiol	// 2026-2035

[ae_ssk_s80_plus]
Type=SSK,Patrol Submarine
Default=S80 Plus-class,S80 Plus
DefaultDescription=The S-80 Plus class (Isaac Peral class) is an advanced ocean-going conventional attack submarine built by Navantia for the Spanish Navy.\n\nLocated within the original hull extension of the design, the class integrates the AIP-BEST (Bio-Ethanol Stealth Technology) system for up to three weeks of continuous submerged endurance. Highly automated, it carries advanced sensors and optics, DM2A4 heavy torpedoes, and launch capabilities for anti-ship and strike weapons such as the NSM-SL.\n\nBased at Cartagena.
Variant1=S81 Isaac Peral (Late),S81 Peral				// 2035-2050
Variant2=S82 Narciso Monturiol (Late),S82 Monturiol		// 2036-2050
Variant3=S83 Cosme Garcia,S83 C.García					// 2029-2050
Variant4=S84 Mateo Garcia de los Reyes,S84 M.García 	// 2034-2050