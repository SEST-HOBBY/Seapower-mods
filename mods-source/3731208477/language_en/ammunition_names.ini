[AmmunitionNames]
ger_dm2a4_er=DM2A4_ER,SeeHake,Torpedo,The DM2A4 ER (Extended Range), commercially designated as the SeaHake mod 4, is a state-of-the-art heavyweight torpedo developed by Atlas Elektronik.\n\nIt serves as the primary offensive and defensive weapon system for the Spanish Navy’s new S-80 class submarines. Range 140 km.

spa_agm-114m=AGM-114M,Hellfire,ASM,The AGM-114M Hellfire II is a specialized variant of the renowned family of precision air-to-surface tactical missiles, operated in Spain primarily by the Spanish Navy's Air Arm (FLOAN).\n\nUnlike standard Hellfire variants (designed with HEAT shaped charges to penetrate heavy armor), the AGM-114M is specifically designed for multipurpose and littoral missions, optimized against targets without heavy armor or reinforced structures.
spa_agm-119b=AGM-119B,Penguin,ASM,The AGM-119B Penguin (specifically the Mk 2 Mod 7 variant) is a helicopter-launched, short-to-medium-range anti-ship missile developed by Norway's Kongsberg Defence and Aerospace and integrated into the Spanish Navy's Aircraft Flotilla (FLOAN).
spa_agm-65f=AGM-65F,Maverick,ASM,The AGM-65F is a specialized infrared-guided air-to-surface missile optimized for naval warfare, extensively used by the Spanish Navy's 9th Squadron (Novena Escuadrilla) on their EAV-8B Harrier II Plus fighters.

spa_aim-120b=AIM-120B,AMRAAM,AAM,The AIM-120B AMRAAM (Advanced Medium-Range Air-to-Air Missile) is an all-weather, Beyond-Visual-Range (BVR) missile utilized by the U.S. and allied forces.\n\nAs a "fire-and-forget" weapon, it uses inertial guidance with an active radar seeker to intercept targets, typically employed in air-to-air combat at medium to long ranges.
spa_aim-120c=AIM-120C,AMRAAM,AAM,The AIM-120C AMRAAM (Advanced Medium-Range Air-to-Air Missile) is an upgraded variant featuring clipped wings and fins for internal carriage on stealth fighters.\n\nThis all-weather, Beyond-Visual-Range (BVR) missile employs an improved active radar seeker and "fire-and-forget" technology, providing enhanced lethality and precision against modern aerial threats.
spa_iris-t=IRIS-T,IRIS-T,AAM,The IRIS-T (Infra Red Imaging System Tail/Thrust Vector Controlled) is a state-of-the-art, European-developed, short-range air-to-air guided missile, designed for high maneuverability and air-to-air combat.\n\nIt is manufactured by a consortium led by the German company Diehl Defence. Operated in Spain by the Air Force in the EF-18M (C.15M) and Eurofighter Typhoon (C.16).
spa_meteor=METEOR,METEOR,AAM,The Meteor is a next-generation Beyond-Visual-Range Air-to-Air Missile (BVRAAM) manufactured by MBDA, serving as the benchmark for air superiority within the Spanish Air and Space Force.\n\nIt is used by the C.16 (Eurofighter Typhoon).

spa_kepd-350=KEPD-350,Taurus,Land Attack,The Taurus KEPD 350 is a long-range, high-precision air-launched cruise missile, operated in Spain exclusively by the Air Force and Space Force as its main weapon for strategic penetration and long-range surgical strike.

spa_jsm-sl=JSM-SL,Joint Strike Missile,ASM,The JSM-SL is a submarine-launched variant of the Norwegian stealthy Joint Strike Missile (JSM), developed by Kongsberg. Discharged from standard 533mm torpedo tubes inside a protective launch capsule, the missile features an advanced Imaging Infrared (IIR) seeker, passive sensors, and GPS/INS navigation. Designed for both anti-ship and land-attack missions, it combines an extremely low radar cross-section with sea-skimming flight profiles to penetrate modern naval air defenses.

spa_saes_mine=SAES MINEA,SAES Mine,Mine,The Spanish state-owned company SAES Electronics Submarina is responsible for supplying the latest generation of multi-influence MINEA smart mines for the Spanish Navy's new S-80 class submarines.\n\nThese weapons replace the older MCC-23D models (which were incompatible with the torpedo tubes of the new S-80 series).\n\nThey have an autonomy of 5 days.

usn_mk182_chaff=Chaff,,SRBOC,The Mark 36 SRBOC (Super Rapid Bloom Offboard Countermeasures) is the US Navy's solution to an emerging antiship missile threat, both against radar-homing and infrared-guided missiles.\n\nThis system is connected to the central weapons system of a ship, is highly automated, and can deploy both chaff and flare countermeasures with a very short reaction time, proving ideal against sea-skimming threats.\n\nThis particular system uses the improved Mk 182 chaff and Mk 186 TORCH flare rounds to counter the emerging advanced antiship missile threat that is developing in the 80s.
usn_mk214_chaff=Chaff,,SRBOC,The Mark 36 SRBOC (Super Rapid Bloom Offboard Countermeasures) is the US Navy's solution to an emerging antiship missile threat, both against radar-homing and infrared-guided missiles.\n\nThis system is connected to the central weapons system of a ship, is highly automated, and can deploy both chaff and flare countermeasures with a very short reaction time, proving ideal against sea-skimming threats.\n\nThis particular system uses the advanced Sea Gnat countermeasure system to effectively counter modern anti-ship missiles with the Mk 214, Mk 216 chaff seduction and distraction countermeasures, and the Mk 245 GIANT flare type countermeasure.

spa_ssq-53=AN/SSQ-53,DIFAR,Passive Sonobuoy,The SSQ-53 is a Directional Frequency Analysis and Recording (DIFAR) type sonobouy.\n\nThis gives the sonobuoy operator magnetic heading information which is a huge improvement over the earlier omnidirectional CRT-1.\n\nUpdated version with 4 hours of battery life and a 50-mile datalink transmission range.
spa_ssq-62=AN/SSQ-62,DICASS,Active Sonobuoy,The AN/SSQ-62 DICASS is an active sonobouy used for fixing a submerged submarine that has previously been located with the SSQ-53 passive sonobouys.\n\nUpdated version with 4 hours of battery life and a 50-mile datalink transmission range.

