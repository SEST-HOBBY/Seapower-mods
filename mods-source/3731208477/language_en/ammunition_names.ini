nac_ger_dm2a4=DM2A4,SeaHake,ASuW/ASW Torpedo,A heavyweight 533 mm submarine-launched torpedo with wire guidance and terminal active/passive acoustic homing. Optimized for long-range attacks against submarines and surface ships with robust counter-countermeasure logic. Effectiveness depends on doctrine, water conditions, and target maneuvers, and employment is limited by tube and reload cycles.
nac_ger_dm2a5==DM2A5,SeaHake,ASuW/ASW Torpedo,Future German-Norwegian 533 mm heavyweight torpedo intended for the Type 212CD class. Public information describes a software-centred architecture, modular battery-electric propulsion, fibre-optic datalink and advanced digital sonar for multi-target and acoustically complex coastal-water engagements. Exact performance data are not public; the in-game values are estimated.
nac_usn_adc_mk2_mod4_noisemaker=Noisemaker,ADC MK 2 Mod 4,Torpedo Decoy,The ADC MK 2 Mod 4 is a 3-inch diameter expendable acoustic torpedo decoy for surface vessels, launched manually by hand from DDGs and CGs as a backup torpedo defense layer. It represents a newer electronics generation than earlier Mod 0/1/3 variants and is acoustically identical to the submarine-launched Mod 5 once deployed in the water. It serves as a manual backup to the primary LEAD system on surface ships.
nac_usn_adc_mk2_mod7_noisemaker=Noisemaker,ADC MK 2 Mod 7,Torpedo Decoy,The ADC MK 2 Mod 7 is the newest variant of the 3-inch MK 2 family. Its primary improvement over earlier variants is the introduction of a thermal lithium battery in place of the seawater-activated battery, significantly extending operational lifetime to 7 minutes. Acoustic output remains the same 3-inch projector as all prior MK 2 variants — the thermal lithium battery improves duration, not spoofing capability.
nac_usn_an_slq_25a_nixie_decoy=AN/SLQ-25A,Nixie-A,Decoy,The Nixie (formally the AN/SLQ-25A) is a towed decoy system utilised primarily by the surface ships of the USN. The System generates signals designed to lure approaching torpedoes away from the host platform. The SLQ-25A model has greater radiating characteristics, and can fool incoming torpedoes with greater ease.