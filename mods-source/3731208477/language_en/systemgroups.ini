[SystemNames]
#---Visual---
AN/ASB-19=AN/ASB-19|The Hughes AN/ASB-19 Angle Rate Bombing System (ARBS) is a precision bombing system designed for US Marine Corps attack aircraft (A-4M Skyhawk, AV-8B Harrier II) to enhance day/night accuracy for unguided weapons.\n\nWeighing under 63 kg, it features a nose-mounted Dual Mode Tracker (DMT) for laser spot tracking and TV tracking, improving close air support accuracy
AN/AAS-44=AN/AAS-44|The AN/AAS-44 is a long-range laser designator and thermal imaging optronic system manufactured by Raytheon for SH-60B Sea Hawk helicopters.\n\nIt is used by the Spanish Armada on its Sea Hawk Block 1 helicopters.
AN/AAS-44_Laser=AN/AAS-44_Laser|The AN/AAS-44 is a long-range laser designator and thermal imaging optronic system manufactured by Raytheon for SH-60B Sea Hawk helicopters.\n\nIt is used by the Spanish Armada on its Sea Hawk Block 1 helicopters.
eu_AN/AAQ-28=Litening (visual)|The Litening is an all-weather targeting pod used by attack aircraft, using FLIR and a laser to designate targets for laser-guided bombs.\n\nFLIR module.
OMS-200=Hensoldt OMS-200|The Hensoldt OMS-200 (Optronic Mast System) is a compact, low-profile optronic mast system designed to meet the stealth and operational constraints of modern conventional and nuclear submarines.\n\nBecause it is non-hull-penetrating, it transmits visual data electronically to the control room via fiber-optic cables rather than utilizing a direct-view optical tube.
PIRATE=PIRATE|A passive sensor located in front of the cockpit.\n\nIt detects and tracks aircraft based on their heat signature without emitting any signals, allowing the Typhoon to see enemies stealthily at long ranges.
Sentinel_2.0_sensor=Sentinel 2.0|It includes a third-generation infrared camera, a daytime camera (CCD), and an associated laser rangefinder (LRF) for aiming.
Sentinel_30_sensor=Sentinel 30|It includes a third-generation infrared camera, a daytime camera (CCD), and an associated laser rangefinder (LRF) for aiming.

#---Laser---
eu_Litening=Litening (laser)|The Litening is an all-weather targeting pod used by attack aircraft, using FLIR and a laser to designate targets for laser-guided bombs.\n\nLaser module.

#---Radar---
eu_SPY-1D=SPY-1D|The AN/SPY-1D is the evolution of the Aegis phased array radar for frigate-sized combatants.\n\nOptimized for the multi-role requirements of the F-100 class, it provides continuous 360-degree surveillance and track-while-scan capabilities.\n\nIts advanced signal processing offers superior performance in littoral environments and high-clutter scenarios compared to the earlier SPY-1A.
eu_SPY-1D(V)=SPY-1D(V)|The AN/SPY-1D(V) is the "Littoral" evolution of the Aegis radar, featuring advanced Dual-Beam sweep technology.\n\nIt introduces significantly improved signal processing for high-clutter coastal environments and enhanced "Volume Search" for detecting low-flying cruise missiles.\n\nThis variant provides superior target discrimination and track-refresh rates compared to the standard SPY-1D.
eu_SPS-67(V3)=SPS-67(v3)|The AN/SPS-67(V)3 is a high-reliability, short-to-medium range surface search and navigation radar.\n\nOperating in the C-band, this specific variant features digital signal processing and automatic target detection, making it highly effective at spotting small craft and sea-skimming missiles in heavy sea clutter.\n\nIt serves as the primary surface surveillance sensor for the F-100 and Arleigh Burke classes.
spa_ARIES_NAV=ARIES Nav|The Indra Aries radar (or Aries SAAS/Nav) is a high-resolution X-band (8-12.5 GHz) surveillance and navigation system designed for naval use.\n\nIt is known for its low probability of interception (LPI), making it difficult to detect by ESM systems, and is ideal for detecting small, low-altitude surface targets, with a range of up to 250 nautical miles.
spa_ARIES_SAAS=ARIES SAAS|A short-to-medium range combined surface and air surveillance 2D radar.\n\nDeveloped by Indra, it utilizes Frequency Modulated Continuous Wave (FMCW) technology, providing a Low Probability of Intercept (LPI) against enemy electronic warfare systems.\n\nAboard the L61 Juan Carlos I, it acts as a secondary early-warning sensor against sea-skimming missiles and serves as the primary system for aircraft control, approach, and marshalling operations near the ship.
spa_ARIES_SCH=ARIES SCH|The Aries SAAS-SCH is a high-performance naval radar system specifically designed for surface and helicopter control (SCH) on warships.\n\nDeveloped by the Spanish company Indra, it is an essential component of the Spanish Navy's combat systems, integrated into platforms such as the F100 frigate.
spa_ARIES_PAR=ARIES PAR|A short-range, sectorial precision approach radar designed for blind aircraft landing guidance.\n\nIt employs low-power FMCW technology (LPI) and generates a hyper-narrow, high-resolution X-band beam.\n\nIts sole purpose on the aircraft carrier is to provide flight controllers with critical, highly accurate azimuth and glide-slope data to safely guide STOVL fighters (AV-8B / F-35B) and helicopters to the flight deck, especially under adverse weather conditions or zero-visibility environments.
spa_LANZA-N=LANZA-N|The Indra LANZA-N is a 3D Active Electronically Scanned Array (AESA) radar operating in the L-Band (NATO D-Band).\n\nSpecially tailored for naval applications, it provides long-range early warning, air and surface surveillance, and tactical target designation.\n\nUtilizing distributed solid-state technology, it features high electronic counter-countermeasures (ECCM) capabilities and outstanding performance in heavy clutter and jamming environments, serving as the primary surveillance sensor for the Spanish Navy's flagship, the L-61 Juan Carlos I.
spa_PRISMA_25X=PRISMA 25X|The PRISMA 25X is a multi-function X-band naval radar developed by Indra, utilizing four-faced fixed-panel AESA technology. It is optimized for surface surveillance and high-precision detection of low-altitude, low-observable targets on F-110 frigates.
spa_sperry_visionmaster_ft=Sperry Marine VisionMaster FT|A high-resolution X-band commercial and naval navigation radar utilized on major combatants like the Juan Carlos I (L-61) for safe pilotage, coastal transit, and close-range situational awareness.\n\nFeaturing advanced sea-clutter suppression, it provides exceptional detection of low-RCS surface threats, periscopes, and small craft within the radar horizon.

#---Sonar---
DE1160LF=DE 1160LF|Description=The DE 1160LF is an advanced evolution of the standard DE-1160 (SQS-56), specifically modified for Low Frequency (LF) operations.\n\nBy shifting to lower acoustic frequencies, it achieves superior detection ranges and better penetration of thermal layers compared to its predecessor.\n\nThis variant features modernized digital processing for enhanced target discrimination in complex littoral environments.
CAS_S80=Active Passive CAS|Active and Passive bow sonar.
FASLPRS=Flank Array|Flank Array sonar.
FASLPRS_L=FASLPRS|Flank Array sonar (left side).
FASLPRS_R=FASLPRS|Flank Array sonar (right side).
SOLARSUB_S-80_DTAS=Towed Array|Towed Array
AIS_S80=Active Intercept|Active Intercept sonar.
MODS_S80=Mine/Obstacle Detection|Mine and obstacle detection sonar.

#---------------------------------------- Aircraft Radar ----------------------------------------
APS-124=APS-124|The AN/APS-124 is an X-band airborne surveillance radar designed for maritime applications, primarily used for surface search and submarine periscope detection.\n\nIt is a key component of the LAMPS Mk-III (Light Airborne Multipurpose System) on the Sikorsky SH-60B Seahawk and Kaman YSH-2E Seasprite helicopters.
Captor-E=Captor-E|An Active Electronically Scanned Array (AESA) radar utilizing over 1,000 Transmit and Receive Modules (TRMs).\n\nIt is mounted on a swashplate repositioner, which allows the antenna to tilt, granting a massive 200-degree field of regard—50% wider than most fixed-plate AESA radars.
Captor-M=Captor-M|A multi-mode X-band Pulse Doppler radar.\n\nIt features a large mechanical antenna with a high scan rate (up to 330° per second) and three distinct processing channels: one for target search, one for tracking/identification, and a dedicated third channel for ECCM (electronic counter-countermeasures) and jammer mapping.

#---------------------------------------- ECM ----------------------------------------
ALDEBARAN_EW=Aldebaran ECM Suite|Indra SLQ-380A Aldebaran is a high-power Electronic Countermeasures (ECM) system capable of simultaneous multi-threat jamming.\n\nOptimized for the F-100 class, it utilizes advanced Digital Radio Frequency Memory (DRFM) techniques to deceive incoming active radar seekers and long-range surveillance sensors, providing a critical layer of soft-kill defense.
RIGEL_RECM=Rigel RECM Suite|The RIGEL electronic defense system is an advanced electronic countermeasures (ECM) solution developed by the Spanish multinational Indra.\n\nThis system is designed to protect naval platforms by detecting, analyzing, and neutralizing threats in complex electromagnetic environments.

AN/ALQ-126B=AN/ALQ-126B|Integrated defensive ECM suite combining the wide-band AN/ALQ-126B with the AN/ALQ-162 continuous-wave jammer, providing expanded coverage and protection against both pulse and CW radar-guided threats.
DASS_Praetorian_ECM=Praetorian ECM|A powerful integrated Electronic Countermeasures (ECM) suite.\n\nIt uses Digital Radio Frequency Memory (DRFM) technology to capture, manipulate, and retransmit enemy radar signals.\n\nThis allows it to create ghost targets, mask the aircraft's true position, or saturate enemy seekers with noise.

#---------------------------------------- ESM ----------------------------------------
ALDEBARAN_ESM=Aldebaran ESM|The Aldebaran ESM system is a key precursor to Indra's current Rigel suite.\n\nIt is a high-performance electronic support measures (ESM) system that has been the electronic warfare standard for the Spanish Navy's most advanced combat ships for decades.
RIGEL_RESM=Rigel RESM|The Rigel ESM (or RESM, for Radar Electronic Support Measures) system from Indra Group is the passive component of the Rigel suite, dedicated to electromagnetic spectrum monitoring.\n\nIts main function is to detect, analyze, classify, and identify radar signals in real time to provide situational awareness and early warning to the vessel.

ALQ-142=ALQ-142|The AN/ALQ-142 is an Electronic Support Measures (ESM) system used on U.S. Navy SH-60B/S-70B Seahawk helicopters for the Light Airborne Multipurpose System (LAMPS) Mk III.\n\nIt detects, identifies, and locates hostile radar emissions, providing 360-degree coverage of E/F, G/H, I/J, and K-bands to aid in anti-submarine and surface warfare.
ALQ-142I=ALQ-142(I)|The AN/ALQ-142I (Improved) is an Electronic Support Measures (ESM) system used on U.S. Navy SH-60B/S-70B Seahawk helicopters for the Light Airborne Multipurpose System (LAMPS) Mk III.\n\nIt detects, identifies, and locates hostile radar emissions, providing 360-degree coverage of E/F, G/H, I/J, and K-bands to aid in anti-submarine and surface warfare.
DASS_Praetorian_ESM=Praetorian ESM|The Electronic Support Measures (ESM) system uses super-heterodyne and digital receivers to detect threat radars across a broad frequency range.\n\nIts antennas are integrated into the wingtip pods, providing 360-degree spherical coverage to identify targets and their potential lethality zones.

#---------- RWR ----------
ALQ-142_RWR=ALQ-142 RWR|Radar warning and tracking of maritime threats (particularly surfaced or snorkeling submarines emitting radar).
ALQ-142I_RWR=ALQ-142(I) RWR|Radar warning and tracking of maritime threats (particularly surfaced or snorkeling submarines emitting radar).
AN/ALR-67=AN/ALR-67|The AN/ALR-67 is a digital Radar Warning Receiver (RWR) designed by Raytheon, serving as the standard, lightweight threat detection system for U.S. Navy F/A-18 Hornet/Super Hornet and F-14 Tomcat aircraft.\n\nIt detects, identifies, and locates hostile radar-guided threats, providing aircrews with bearing and threat level information, improving situational awareness and survivability against modern missile systems.
DASS_Praetorian_RWR=Praetorian RWR|The Praetorian RWR functionality is an integral part of the ESM suite, providing high-sensitivity detection and 360° coverage.\n\nIt utilizes advanced digital receivers to identify the specific type of radar, its operating mode (search, track, or lock), and its precise bearing, displaying it on the cockpit’s Multi-function Head Down Displays (MHDD).

#---------- CIC ----------
spa_SCOMBA_v1=SCOMBA|SCOMBA is the combat management system developed by Navantia that integrates sensors, tactical data links, and weapons across Spanish Navy vessels. It acts as the ship's operational brain to process real-time threats and coordinate tactical responses.

