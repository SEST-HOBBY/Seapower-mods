[ ------------------------ Visual/Infared ------------------------- ]
[------------------------- Radar ---------------------------]

[---Air/Air&Surface---]


[GPS_Receiver] 
Kind=Radar
Type=Targeting                         // Classes can be "Search", "Targeting"
HasDataLink=False                      // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface                     // Role can be "Surface", "Air", "AirAndSurface"
Mode=RadioCommand                      // Can be "Illuminate", "RadioCommand"
RotationDirection=1                    // -1 means left, 1 means right
TargetChannels=5000                      // if applicable number of targets it can track simultaneously
WeaponChannels=5000                       // if applicable number of weapons (missiles) it can guide simultaneously
RPM=60                               // revolutions per minute
MinRange=0.003                           // min range in km
MaxRange=45000.0                         // max range in km
MinAltitude=0                          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=3000000                      // max altitude in meters, relevant for air, unused for surface
RangeResolution=0.003                    // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=0.0001                          // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=50000.0                            // gain in dB on the sensor
Frequency=L-Band                       // frequency band
PeakPower=0.001                         // output peak power in kW
ModuleType=SmallSensor



[DJvisual]
#Users: raf_jaguar
Kind=Visual
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=8           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=8           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=8             // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=4             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

[ForpostRvisual]
#Users: raf_jaguar
Kind=Visual
UseIRValues=True                 // Affects only Encyclopedia. For correct type display
VIDRangeMultiplier=8           // Target VID range multiplied by this for identification check. 0 means it cannot identify
MaxRangeMultiplier=8           // Target VID range multiplied by this for detection check. Can not be less then VID multiplier
LookDownMultiplier=8             // Final VID/Detection range is multiplied by this in case when target observed on surface background
NightVisionLevel=4             // the portion of full daylight added to the visibility level where 1 is roughly a mid-day

[ForpostResm]
Kind=ESM
Gain=5                              // gain of sensor in dB
HasDataLink=True                    // true means the sensor data will be used for the entire task force via data link, false local use only
AngularResolution=360.0              // in degrees
Frequencies=All                     // Frequencies that current ESM system can detect
ModuleType=SmallSensor

[ForpostRecm]
Kind=ECM
Frequencies=All //radar frequency bands the ECM suite can jam
Type=Offensive                      // can be Defensive, Offensive, Universal
PeakPower=5.0                      // output peak power in kW, more power increase effectivness of offensive ECM jammers
MaxRange=16.0                       // max range in km
Gain=5.0                            // Offensive ECM jammer gain in db, more -> better
JamConeViewArcs=90.0                // For offensive and universal systems. Defines the cone along axis between a radar and the ECM system. Targets inside this cone is "covered" by jamming
JamChance=0.3                       // For Defensive and Universal jammers. Base chance to jam the attacking weapon

[ForpostRlaser]
Kind=LaserDesignator
MaxRange=4.0                       // max distance in nm
NightCapable=True                   // is the designator can be used in low-visibility conditions
TargetChannels=2                    // number of targets that can be tracked at once
WeaponChannels=5                 // if applicable number of weapons (missiles) it can guide simultaneously
ViewArcs=360.0                           // Field of View of the designator

[ForpostRradersearch]
Kind=Radar
Type=DirectedSearch            // Classes can be "Search", "Targeting"
HasDataLink=True       // true means the sensor data will be used for the entire task force via data link, false local use only
Role=AirAndSurface           // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=1       // if applicable number of targets it can track simultaneously
WeaponChannels=1       // if applicable number of weapons (missiles) it can guide simultaneously
RotationDirection=1    // -1 means left, 1 means right
RPM=10                 // revolutions per minute
MinRange=0.2           // min range in km
MaxRange=10.0          // max range in km
MinAltitude=20          // min altitude in meters, relevant for air, unused for surface
MaxAltitude=9000          // max altitude in meters, relevant for air, unused for surface
RangeResolution=30.0  // defines the minimum range where two targets behind can be recognized as two; in meters
BeamWidth=3            // defines the beam width in degrees for BearingResolution >= 2*Dist*sin(BeamWidth/2)
Gain=4.0              // gain in dB on the sensor
Frequency=X-Band       // frequency band
PeakPower=5.0         // output peak power in kW
ModuleType=SmallSensor

