[General]
#wiki
UnitType=Helicopter

DefaultCameraDistance=0.50
MinCameraDistanceForeAft=0.3
MinCameraDistanceBroadside=0.3
CameraPivotHeight=0.0

GroundedPitchAngle=0  // this angle is the pitch (x) angle at ground with gears down
GroundPivot=0,-0.014,0

ForwardsTaxiVelocity=10
BackwardsTaxiVelocity=0

[AI]
Role=Recon

[---------- Physics and Control ----------]
[Physics]
############################################################
# Physics definition
############################################################
MaxPitchRate=60.0                  // in degrees per second
MaxRollRate=70.0                   // in degrees per second
MaxYawRate=70.0                    // in degrees per second
MaxPitchAngle=45
MaxRollAngleHovering=45
MaxRollAngleForwardFlight=70
TargetPitchForForwardFlight=0   // angle in degrees the helicopter stays in when moving forward when releasing controls

// hovering movements
HoverStrength=0.5                  // determines how strong the hover movements are
MinVelocityForNoHoverMovement=40   // in knots, above this value there wont be additional hover movements
MaxHoverRadius=5                   // radius in meter the heli is allowed to do hover movements

MaxSpeedAtSeaLevel=9             // in knots
MaxBackwardSpeed=9                // in knots
MaxSidewardSpeed=9                // in knots
Ceiling=3000                    // ceiling in feet
Altitudes=2,20,100,1000,2500  // in feet
ClimbRate=3.0                    // feet per second

EmptyMass=1                     // in kg
MaxFuel=0.9                        // in kg
MaxRange=6                       // in n miles
HoveringFuelConsumption=0.00001       // Minimum fuel consumption when hovering.

MainThrustAccelerationFactor=6   // determines the engine thrust acceleration factor (as multiplicator of v=a*t)
LinearDrag=0.9995                  // this is for velocity damping (linear drag)
CurveDragFactor=2.0                // determines how quickly the helicopter loses velocity (dependend on steepness of curve)
GravityDragFactor=1.0              // determines the gravity factor (1.0 means here standard 9.81m/s²)

MousePitchFactor=0.3
MouseYawFactor=0.3

EngineWarmUpTime=1
RotorsSpinUpTime=1

[SensorData]
#Visual
VisualIdentificationRange=0.0005       // Biggest range in nm at which this unit can be visually identified
IRSignature=0.0001
# Radar related (RCS => radar cross section)
RCS=0.0001
# Sonar related

[FlightControls]
RotorConfiguration=tandem      // can be singlemain, coaxial, tandem
SwashplateMaxAngle=0
NumberOfRotors=4
Rotor1_Model=Prop1
Rotor1_DiscModel=Prop_Disc1
Rotor1_SwashplateModel=Prop_Disc1
Rotor1_Direction=0.0
Rotor1_RotationAxis=Z
