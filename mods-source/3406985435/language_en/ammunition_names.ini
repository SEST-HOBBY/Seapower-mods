wp_sa-n-11=9M311K,Kortik,SAM,The SA-N-11 Grison (9M311K) is the naval version of the SA-19 Grison (2K22 Tunguska/9M311) mounted to the Kortik CIWS combined weapon system. This missile is agile, fast, and accurate all the way down to sea level, and maintains good effectiveness against maneuvering sea-skimming targets like Harpoon, at the cost of being extremely lightweight and short ranged. A proper point-defense interceptor.
wp_sa-n-20=48N6,S-300FM,SAM/ASuW,The SA-N-20 Gargoyle (S-300FM) is the naval version of the SA-10 (S-300PM1) land-based surface-to-air missile system. This powerful long-range system is fitted in Soviet missile-cruiser classes, and offers performance comparable to that of the SM-2. 
