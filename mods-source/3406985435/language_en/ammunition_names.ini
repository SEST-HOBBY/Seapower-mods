wp_ss-n-26=SS-N-26,Oniks,ASM,The P-800 Oniks (NATO designation SS-N-26 Strobile) is a Russian supersonic anti-ship cruise missile. It is reportedly a replacement for the P-270 Moskit, and possibly also of the P-700 Granit.

