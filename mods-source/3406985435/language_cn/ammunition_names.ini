wp_sa-n-11=9M311K,短剑,面对空,9M311K（SA-N-11）是2K22通古斯卡（SA-19）所用9M311导弹的海军版，用于短剑弹炮合一近防系统。该弹灵活、快速、精确，直至海平面仍能保持良好效能，可有效对付鱼叉等机动掠海目标，代价是重量极轻、射程极短。是一款名副其实的点防御拦截弹。
wp_sa-n-20=48N6,S-300FM堡垒-M,面对空/反水面,S-300FM堡垒-M（SA-N-20）是S-300PM1（SA-10）陆基面对空导弹系统的海军版。这一强大的远程系统装备于苏联导弹巡洋舰，性能与标准2导弹相当。
