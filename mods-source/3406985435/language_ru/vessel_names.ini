Default=Пр.11442 «Орлан»,Орлан (модерн.)
DefaultDescription=Модернизированные тяжёлые атомные ракетные крейсера проекта 1144 «Орлан» с усиленной ПВО. По размерам сопоставимые с линкорами Второй мировой войны, они относятся к самым мощным надводным кораблям из когда-либо построенных; с 1980 года построено два корабля, ещё два находятся в постройке. Большие размеры обусловлены необходимостью разместить мощную батарею противокорабельных ракет, ЗРК зональной обороны и несколько комплексов ближней обороны.\n\nНесмотря на современную ГАС и противолодочное оружие дальнего действия, эти корабли обычно действуют как флагманы корабельных ударных групп под прикрытием специализированных противолодочных кораблей.
Variant1=Фрунзе,Фрунзе
