wp_ss-n-26=П-800,Оникс,ПКР,П-800 «Оникс» (по классификации НАТО — SS-N-26 Strobile) — российская сверхзвуковая противокорабельная крылатая ракета. По имеющимся данным, призвана заменить П-270 «Москит» и, возможно, П-700 «Гранит».

