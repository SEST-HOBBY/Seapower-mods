wp_sa-n-11=9М311К,Кортик,ЗУР,9М311К — корабельный вариант ракеты 9М311 сухопутного комплекса 2К22 «Тунгуска» в составе зенитного ракетно-артиллерийского комплекса «Кортик». Манёвренная, быстрая и точная вплоть до уровня моря, ракета эффективна против маневрирующих низколетящих целей вроде «Гарпуна», хотя очень лёгкая и имеет малую дальность. Настоящее средство ближней обороны.
wp_sa-n-20=48Н6,Форт-М,ЗУР/ПКР,С-300ФМ «Форт-М» — корабельный вариант зенитного ракетного комплекса С-300ПМ1. Эта мощная система большой дальности устанавливается на советских ракетных крейсерах и по возможностям сопоставима с SM-2.
