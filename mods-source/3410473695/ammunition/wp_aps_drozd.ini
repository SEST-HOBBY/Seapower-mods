[General]
Type=Projectile             // can be Projectile, Missile, Torpedo
TargetType=AAW              // can be AAW, ASuW, ASW
CanNotAttackTypes=Aircraft,Helicopter


DecalClass=GunImpacts       // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=1800          // meter per second
MaxRange=800               // in m
CircularErrorProbable=38    // radius in meters at max range for shells to impact

[---------- Warhead Data ----------]
[WarheadData]
Power=0.1
ImpactSize=Tiny             // Impact size, can be small, medium, large, verylarge
Penetration=Minor           // can be minor, moderate, heavy, always

[---------- Effects ----------]
[Particles]
TrailEffect=
HitShipExplosion=effects/Particle Emitters/impact_small_shell_multi
HitAirExplosionClass=SmallFlakExplosions
HitWaterSplashClass=TinyWaterSplashes