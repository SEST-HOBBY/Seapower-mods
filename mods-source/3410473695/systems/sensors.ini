[ ========================================= General ========================================== ]

[---Air/Air&Surface---]

[Drozd_Radar]
#Users: wp_mbt_t-55amd-1
Kind=Radar
Type=Search    // 雷达类型
HasDataLink=False      // 数据链
Role=Air             // Role can be "Surface", "Air", "AirAndSurface"
Mode=Illuminate        // Can be "Illuminate", "RadioCommand"
TargetChannels=2       // 如果适用，它可以同时跟踪的目标数量
WeaponChannels=2       // 火力通道，如果武器（导弹）数量合适，它可以同时制导
RotationDirection=1    // -1 means left, 1 means right
RPM=100    
LookDownMultiplier=1     // 多径地形杂波系数，当目标投影到地形/海洋背景上时，应用于最大雷达距离的乘数，默认值为1.0
MinRange=0.002           // 最小距离
MaxRange=0.7           // 最大距离
MinAltitude=0          // 最低海拔高度，不适用于对地
MaxAltitude=10000     // 最大高度
RangeResolution=1.5.0   // 识别间距，定义了后方两个目标可以被识别为两个的最小范围；单位为米
BeamWidth=0.3          // 定义承载分辨率>=2*Dist*sin（波束宽度/2）的波束宽度（度）
Gain=55.0              // 传感器上的增益（dB）
Frequency=Ka-Band       // 波段
PeakPower=10.0         // 功率 in kW
RequiresAlignment=True// 对于飞机。允许飞机制导武器的同时不飞向目标

[---Fire Control---] + search radars linked to FC radars




