[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=11.56                     // in meters
Beam=3.51                     // in meters
Range=280                     // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Heavy
DamagePoints=14  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=1200
Mass=70                        // in tons

MaxForwardVelocity=30.27          // in knots
MaxBackwardVelocity=8        // in knots

#Acceleration=3.33              // knots/sec
Braking=9                      // knots/sec

TurnRate=21                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=14

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.036,0
ModuleType=Bridge
Integrity=0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.03,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=2

[WeaponSystem1]  #L11A5
Type=Gun
SystemName=L11A5
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
FiringArcs=-135,135
ElevationArc=-10,20
RestAngles=0
EngageOnlyInsideArc=True
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxVelocityToFire=10
MaxReactiontime=2.5
VIDIncrease=5  // In miles. Flat base VID increace when firing.

[WeaponSystem2] #Chaff
Type=Chaff
SystemName=Smoke
#Sensors
#Animations
#Mount
Mount=Dummy
MountPosition=0,0,0.4
#Containers
ContainerBase=Dummy
#Angles
#Loading
Ammunition=wp_aircraft_chaff
#Effects
NumberOfEffects=2
DelayBetweenLaunches=0.1
EffectOffset=0,0,30
#Other
MaxReactiontime=2.5
WorksStandalone=True

[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=3
Ammunition1=uk_cal_l26
Ammunition1_Count=30
Ammunition2=uk_cal_l31a7
Ammunition2_Count=34
ModuleType=MediumMagazine

[--------------------------- Mesh definitions ---------------------------]
[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=assets/models/land_units/fv4030/
ResourcesRoot=fv4030.obj
ResourcesMesh=hull
ResourcesMaterial=fv4030_mat.ini
############################################################

[Submodels]
Turret=Turret
Gun=Gun
Barrel=Barrel


[Turret]
Mesh=turret
Position=0,0,0.007834
Material=fv4030_mat.ini

[Gun]
Mesh=gun
Material=fv4030_mat.ini
Parent=Turret
Position=0.000107,0.027132,0.010765

[Barrel]
Mesh=barrel
Material=fv4030_mat.ini
Parent=Gun
Position=0,0,0

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

#experimental dust Effects TODO
#BowWave=ships/particles/bowwave_small
#BowWavePosition=0,0,-0.01
#PropWash=ships/particles/bowwave_small
#PropWashPosition=0,0,-0.01
#FunnelSmoke=ships/particles/wp_rk_osa1_smokeemitter

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.0174,0
Rotation=0,0,0
Scale=0.055,0.035,0.1

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default




