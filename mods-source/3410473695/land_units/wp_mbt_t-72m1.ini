[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.5                     // in meters
Beam=3.6                       // in meters
Range=243                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Moderate
DamagePoints=13  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=780
Mass=41.5                      // in tons

MaxForwardVelocity=32.4        // in knots
MaxBackwardVelocity=2.7        // in knots
Braking=10                     // knots/sec
TurnRate=20                    // in degrees per second

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=15

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #AdvancedOptics
Type=Visual
SystemName=AdvancedOptics
MountPosition=0,0.03,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.03,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=3

[WeaponSystem1]  #2A46
Type=Gun
SystemName=2A46
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-4,15
RestAngles=0
EngageOnlyInsideArc=True
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxReactiontime=2.5
MaxVelocityToFire=10
VIDIncrease=5  // In miles. Flat base VID increace when firing.

[WeaponSystem2]  #Kord
Type=CIWS
SystemName=Kord
#Sensors
#Animations
#Mount
Mount=gun
IsMountRotatable=True
#Containers
ContainerBase=gun
Gun=gun
AreContainersRotatable=True
#Angles
ElevationArc=-5,75
RestAngles=0,-20
#Loading
AssociatedMagazine=WeaponMagazineKord
#Effects
#Other
MaxReactiontime=2.5
MaxVelocityToFire=50
WorksStandalone=True
VIDIncrease=2.5  // In miles. Flat base VID increace when firing.
TargetAcquisitionTime=0.7

[WeaponSystem3] #Chaff
Type=Chaff
SystemName=Smoke
#Sensors
#Animations
#Mount
Mount=Dummy
MountPosition=0,0,0.4
#Containers
ContainerBase=Dummy
#Angles
#Loading
Ammunition=wp_aircraft_chaff
#Effects
NumberOfEffects=2
DelayBetweenLaunches=0.1
EffectOffset=0,0,30
#Other
MaxReactiontime=2.5
WorksStandalone=True

[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=2
Ammunition1=wp_cal_3bm22
Ammunition1_Count=25
Ammunition2=wp_cal_3of26
Ammunition2_Count=15

[WeaponMagazineKord]
NumberOfAmmunitionTypes=1
Ammunition1=wp_cal_12.7mm
Ammunition1_Count=500
ModuleType=SmallMagazine

[Models]
############################################################
# Internal Resources folder related
############################################################
LODLevels=1
LOD1Distance=0.2 // nautical miles

ResourcesFolder=ground objects/wp_t72/
ResourcesRoot=wp_t72
ResourcesMesh=wp_t72_hull
ResourcesMaterial=wp_t72_mat
############################################################

[Submodels]
Turret=Turret
Gun=Gun
Gun2=gun

[Turret]
Mesh=wp_t72_turret
Material=wp_t72_mat
Position=0,0,-0.0086

[Gun]
Mesh=wp_t72_barrel
Material=wp_t72_mat
Parent=Turret
Position=0,0.0231,0.013

[gun]
ResourcesMeshFolder=assets/models/land_units/t72b1989/
RootMesh=t72b1989.obj
Mesh=wp_t72_dshk_gun
Material=wp_t72_mat
Parent=Turret
Position=0.008108,0.0271,-0.001246

[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

