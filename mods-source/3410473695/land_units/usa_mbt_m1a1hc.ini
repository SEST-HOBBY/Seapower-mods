[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.8                     // in meters
Beam=3.66                      // in meters
Range=124                     // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Heavy
DamagePoints=15  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=1500
Mass=54                        // in tons

MaxForwardVelocity=45          // in knots
MaxBackwardVelocity=2.7        // in knots

#Acceleration=3.33              // knots/sec
Braking=9                      // knots/sec

TurnRate=25                    // in degrees per second

[AI]
UnitScoreValue=1               // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=15

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=2
#---------- Visual ----------
[SensorSystem1] #Bridge
# Bridge. Does not need SystemGroup and Collider because we do not want ship to loose ability to VID targets
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.036,0
ModuleType=Bridge
Integrity=0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.03,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=3

[WeaponSystem1]  #M256A1
Type=Gun
SystemName=M256A1
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-10,20
RestAngles=0
EngageOnlyInsideArc=True
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxReactiontime=2.5
MaxVelocityToFire=15
VIDIncrease=5  // In miles. Flat base VID increace when firing.


[WeaponSystem2]  #M2
Type=CIWS
SystemName=M2
#Sensors
#Animations
#Mount
Mount=Turret2
IsMountRotatable=True
#Containers
ContainerBase=gun
Gun=gun
AreContainersRotatable=True
#Angles
ElevationArc=-5,60
RestAngles=0
#Loading
AssociatedMagazine=WeaponMagazineM2
#Effects
#Other
MaxReactiontime=2.5
MaxVelocityToFire=50
WorksStandalone=True
VIDIncrease=2.5  // In miles. Flat base VID increace when firing.
TargetAcquisitionTime=0.7

[WeaponSystem3] #Chaff
Type=Chaff
SystemName=Smoke
#Sensors
#Animations
#Mount
Mount=Dummy
MountPosition=0,0,0.4
#Containers
ContainerBase=Dummy
#Angles
#Loading
Ammunition=wp_aircraft_chaff
#Effects
NumberOfEffects=2
DelayBetweenLaunches=0.1
EffectOffset=0,0,30
#Other
MaxReactiontime=2.5
WorksStandalone=True

[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=3
Ammunition1=usn_cal_m829a2
Ammunition1_Count=25
Ammunition2=usn_cal_m830a1
Ammunition2_Count=15
ModuleType=MediumMagazine

[WeaponMagazineM2]
NumberOfAmmunitionTypes=1
Ammunition1=usn_cal_05in_land
Ammunition1_Count=600
ModuleType=SmallMagazine
