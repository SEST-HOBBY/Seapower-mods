[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.5                     // in meters
Beam=3.6                       // in meters
Range=243                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Heavy
DamagePoints=14  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=1300
Mass=44.5                      // in tons

MaxForwardVelocity=41.25        // in knots
MaxBackwardVelocity=2.5        // in knots
Braking=10                     // knots/sec
TurnRate=20                    // in degrees per second

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=15

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #AdvancedOptics
Type=Visual
SystemName=AdvancedOptics
MountPosition=0,0.03,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.03,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=3

[WeaponSystem1]  #2A46
Type=Gun
SystemName=2A46
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Gun
AreContainersRotatable=True
#Angles
ElevationArc=-4,15
RestAngles=0
EngageOnlyInsideArc=True
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxReactiontime=2.5
MaxVelocityToFire=10
VIDIncrease=5  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem3

[WeaponSystem2]  #Kord
Type=CIWS
SystemName=Kord
#Sensors
#Animations
#Mount
Mount=Turret2
IsMountRotatable=True
#Containers
ContainerBase=gun
Gun=gun
AreContainersRotatable=True
#Angles
ElevationArc=-5,75
RestAngles=0,-20
#Loading
AssociatedMagazine=WeaponMagazineKord
#Effects
#Other
MaxVelocityToFire=50
WorksStandalone=True
MaxReactiontime=2.5
VIDIncrease=2.5  // In miles. Flat base VID increace when firing.
TargetAcquisitionTime=0.7

[WeaponSystem4]  
Type=Missile
SystemName=2A46_9M119
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfContainers=1
Container1=Gun
AreContainersRotatable=True
#Angles
FixVerticalLaunchAngle=5
ElevationArc=-4,15              // Min,Max
RestAngles=0                   //Horizontal, Vertical   or  Horizontal only definitions
#Loading
Ammunition=wp_9m119
#AssociatedMagazine=WeaponMagazine9M119
#PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
MaxVelocityToFire=15
MaxReactiontime=2.5
SharesMountWith=WeaponSystem1
VIDIncrease=6  // In miles. Flat base VID increace when firing.

[WeaponSystem3] #Chaff
Type=Chaff
SystemName=Smoke
#Sensors
#Animations
#Mount
Mount=Dummy
MountPosition=0,0,0.4
#Containers
ContainerBase=Dummy
#Angles
#Loading
Ammunition=wp_aircraft_chaff
#Effects
NumberOfEffects=2
DelayBetweenLaunches=0.1
EffectOffset=0,0,30
#Other
MaxReactiontime=2.5
WorksStandalone=True

[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=2
Ammunition1=wp_cal_3bm46
Ammunition1_Count=20
Ammunition2=wp_cal_3of26
Ammunition2_Count=15

[WeaponMagazine9M119]
NumberOfAmmunitionTypes=1
