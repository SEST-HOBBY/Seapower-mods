[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=0.8
MinCameraDistanceForeAft=0.5
MinCameraDistanceBroadside=0.5
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.77                     // in meters
Beam=3.15                       // in meters
Range=220                      // in miles

# Hull armor: None, Minor, Moderate, Heavy
ArmorType=Minor
DamagePoints=8  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=510
Mass=18                      // in tons

MaxForwardVelocity=37.83       // in knots
MaxBackwardVelocity=2.5        // in knots
Braking=10                     // knots/sec
TurnRate=20                    // in degrees per second

[AI]
UnitScoreValue=1              // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=8

[SensorData]
#Visual
VisualIdentificationRange=2.4  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

[---------- Sensor Systems ----------]
############################################################
# Sensor Systems
############################################################
[SensorSystems]
NumberOfSensorSystems=3
#---------- Visual ----------
[SensorSystem1] #AdvancedOptics
Type=Visual
SystemName=AdvancedOptics
MountPosition=0,0.03,0

[SensorSystem2] #IRSight
Type=Infrared
SystemName=IRSight
MountPosition=0,0.03,0

[---------- Weapon Systems ----------]
############################################################
# Weapon Systems
############################################################
[WeaponSystems]
NumberOfWeaponSystems=4

[WeaponSystem1]  #2A45
Type=Gun
SystemName=2A45
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfGuns=1
Gun1=Barrel
AreContainersRotatable=True
#Angles
ElevationArc=-5,15
RestAngles=0
EngageOnlyInsideArc=True
#Loading
AssociatedMagazine=WeaponMagazineGun
#Effects
#Other
MaxReactiontime=2.5
MaxVelocityToFire=10
VIDIncrease=5  // In miles. Flat base VID increace when firing.
SharesMountWith=WeaponSystem3

[WeaponSystem2]  
Type=Missile
SystemName=2A45_9M119
#Sensors
#Animations
#Mount
Mount=Turret
IsMountRotatable=True
#Containers
ContainerBase=Gun
NumberOfContainers=1
Container1=Gun
AreContainersRotatable=True
#Angles
FixVerticalLaunchAngle=5
ElevationArc=-5,15              // Min,Max
RestAngles=0                   //Horizontal, Vertical   or  Horizontal only definitions
#Loading
AssociatedMagazine=WeaponMagazine9M119
PreloadAmmunition=True           // REQUIRED!!! for non-unloading launchers with magazine, like MK29 and ASROC
#Effects
#Other
MaxReactiontime=2.5
MaxVelocityToFire=15
SharesMountWith=WeaponSystem1
VIDIncrease=6  // In miles. Flat base VID increace when firing.

[WeaponSystem3] #Chaff
Type=Chaff
SystemName=Smoke
#Sensors
#Animations
#Mount
Mount=Dummy
MountPosition=0,0,0.4
#Containers
ContainerBase=Dummy
#Angles
#Loading
Ammunition=wp_aircraft_chaff
#Effects
NumberOfEffects=2
DelayBetweenLaunches=0.1
EffectOffset=0,0,30
#Other
MaxReactiontime=2.5
WorksStandalone=True

[---------- WeaponMagazines ----------]
[WeaponMagazineGun]
NumberOfAmmunitionTypes=2
Ammunition1=wp_cal_3bm46
Ammunition1_Count=15
Ammunition2=wp_cal_3of26
Ammunition2_Count=12

[WeaponMagazine9M119]
NumberOfAmmunitionTypes=1
Ammunition1=wp_9m119
Ammunition1_Count=3


[Models]
############################################################
# Internal Resources folder related
############################################################

ResourcesFolder=assets/models/land_units/2s25/
ResourcesRoot=2s25.obj
ResourcesMesh=hull
ResourcesMaterial=2s25_mat.ini
############################################################

[Submodels]
Turret1=Turret
Gun=Gun
Barrel=Barrel

[Turret]
Mesh=turret
Material=2s25_mat.ini
Position=0,0.029302,0.002319

[Gun]
Mesh=gun
Material=2s25_mat.ini
Parent=Turret
Position=0,0.000391,0.015915

[Barrel]
Mesh=barrel
Material=2s25_mat.ini
Parent=Gun
Position=0,0,0


[Sounds]
# possible sound modes:
# 1: simple
# 2: near/far
# 3: near/far with aspect
SoundMode=1
AmbientAudioClip=audio/ships/Ship-Turbine-Small
AmbientAudioPosition=0,0,0
AmbientAudioRollOff=Logarithmic
AmbientAudioDistance=1,20
AmbientAudioPitchRange=1.0,1.6
AmbientAudioVolume=1.0
AmbientAudioAudibility=Above  // layer of sound audibility: Above, Below, AboveAndBelow

[Particles]
SmallFireEffectClass=SmallShipFire
SmallFireEffectPosition=0,0,0
ModerateFireEffectClass=ModerateShipFire
ModerateFireEffectPosition=0,0,0
SevereFireEffectClass=SevereShipFire
SevereFireEffectPosition=0,0,0
SecondaryExplosionEffect=effects/explosions/emitters/missile_hit_ship
SecondaryExplosionEffectPosition=0,0,0

DustEffect=effects/land units/emitters/vehicle_movement_dust
DustEffectPosition=0,0,0

[---------- Colliders ----------]
[Colliders]
UseKinematicCollision=False
NumberOfMeshColliders=0
NumberOfColliders=2

Collider1=coll_hitbox
Collider2=coll_collider

[coll_hitbox]
Collider=Box
Position=0,0.0152,-0.01
Rotation=0,0,0
Scale=0.045,0.03,0.09

[coll_collider]
Collider=Box
Position=0,0.0028,-0.0023
Rotation=0,0,0
Scale=0.03,0.005,0.05
Layer=Default
