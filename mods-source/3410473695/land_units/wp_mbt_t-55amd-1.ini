[General]
UnitType=LandUnit
LandUnitSubType=MobileUnit

DefaultCameraDistance=1.5
MinCameraDistanceForeAft=0.4
MinCameraDistanceBroadside=0.4
CameraPivotHeight=0.03

GroundOffset=0
AutoFlatten=False
MaskVegetation=True

Length=9.0                     // in meters
Beam=3.37                       // in meters
Range=202                      // in miles

