ArmorType=Moderate
DamagePoints=11  //systems damage contribution substracted from this when systems destroyed, when becomes less than zero, the whole unit is considered being destroyed

[Physics]
HorsePower=780
Mass=36.2                      // in tons

MaxForwardVelocity=32.4        // in knots
MaxBackwardVelocity=2.7        // in knots
Braking=10                     // knots/sec
TurnRate=20                    // in degrees per second

[AI]

MissilesToSaturate=1

UnitScoreValue=1              // value for calculation of mission score
Role=Gun

[ControlSystem]
Collider=coll_hitbox  // makes unit destroyable
Integrity=12

[SensorData]
#Visual
VisualIdentificationRange=2.5  // Camouflaged  (x0.5)
IRSignature=Small
# Radar related (RCS => radar cross section)
RCS=Small

