[usn_ssn_virginia_blk4]
Type=SSN,Attack Submarine
Default=Virginia-class (Block IV),Virginia Blk IV
DefaultDescription=Block IV Virginia-class attack submarines, led by USS Vermont (SSN-792), commissioned in 2020. They keep the Block III exterior, with two six-round Virginia Payload Tubes in the bow and four 533 mm torpedo tubes, and add maintenance and life-cycle changes that cut one depot period and allow more deployments per hull.
