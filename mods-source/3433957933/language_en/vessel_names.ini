[usn_ssn_seawolf_carter]
Type=SSN,Attack Submarine
Default=Seawolf-class (Carter),Seawolf
DefaultDescription=The USS Jimmy Carter is the third and final Seawolf-class submarine that is extensively modified from the original Seawolf design. Her hull was extended 100 feet (30 m) to create a 2,500-ton supplementary middle section which is fitted with an ocean interface for divers, remotely operated vehicles (ROVs), and special operation equipment.
Variant1=Jimmy Carter SSN-23,Jimmy Carter

[usn_ssbn_ohio]
Type=SSBN,Ballistic Missile Submarine
Default=Ohio-class,Ohio
DefaultDescription=The Ohio class are the US Navy's ballistic missile submarines, the sea-based leg of the nuclear triad since 1981. Each carries 24 Trident missile tubes in two rows behind the sail and four 533 mm torpedo tubes, and spends long deterrent patrols submerged. Eighteen were built; fourteen remain SSBNs armed with the Trident II D5.
