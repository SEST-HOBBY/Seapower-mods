[usn_ssn_virginia_blk5]
Type=SSN,Attack Submarine
Default=Virginia-class (Block V),Virginia Blk V
DefaultDescription=USS Oklahoma (SSN-802) is the Block V Virginia-class attack submarine built at the standard length, without the Virginia Payload Module. She carries the Block III and IV weapon fit: two six-round Virginia Payload Tubes for Tomahawk and four 533 mm torpedo tubes. Service date projected.
Variant1=Oklahoma SSN-802,Oklahoma

[usn_ssgn_virginia_blk5_ext]
Type=SSGN,Cruise Missile Submarine
Default=Virginia-class (Block V VPM),Virginia Blk V VPM
DefaultDescription=Block V Virginia-class boats with the Virginia Payload Module, led by Arizona (SSGN-803), the first extended hull. A 25.7 m midbody section adds four large payload tubes of seven Tomahawks each, raising the strike load from 12 to 40 missiles. The Navy reclassified VPM-equipped boats as SSGNs in 2026. Service date projected.
Variant1=Arizona SSGN-803,Arizona
Variant2=Barb SSGN-804,Barb
Variant3=Tang SSGN-805,Tang
Variant4=Wahoo SSGN-806,Wahoo
Variant5=Silversides SSGN-807,Silversides
Variant6=John H. Dalton SSGN-808,John H. Dalton

[usn_ssbn_columbia]
Type=SSBN,Ballistic Missile Submarine
Default=Columbia-class,Columbia
DefaultDescription=The Columbia class replaces the Ohio class as the sea-based leg of the US nuclear triad. A life-of-ship reactor, turbo-electric drive with no reduction gear, a pump-jet and an X-shaped stern make it quieter than the boats it replaces. Sixteen Trident II D5 tubes sit in four-tube Common Missile Compartment modules behind the sail.
Variant1=District of Columbia SSBN-826,District of Columbia
Variant2=Wisconsin SSBN-827,Wisconsin
Variant3=Groton SSBN-828,Groton

