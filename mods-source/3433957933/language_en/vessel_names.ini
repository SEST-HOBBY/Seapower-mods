[usn_ssgn_ohio]
Type=SSGN,Cruise Missile Submarine
Default=Ohio-class,Ohio
DefaultDescription=Ohio, Michigan, Florida and Georgia, the first four Ohio-class boats, were converted from ballistic missile submarines to guided missile submarines between 2002 and 2008. Twenty-two of the 24 missile tubes hold seven Tomahawk cruise missiles each, 154 in all; the two forward tubes became lockout chambers for special forces.
Variant1=Ohio SSGN-726,Ohio
Variant2=Michigan SSGN-727,Michigan
Variant3=Florida SSGN-728,Florida
Variant4=Georgia SSGN-729,Georgia

[usn_ssn_virginia_blk3]
Type=SSN,Attack Submarine
Default=Virginia-class (Block III),Virginia Blk III
DefaultDescription=Block III Virginia-class attack submarines, led by USS North Dakota (SSN-784), commissioned in 2014. The redesigned bow replaces the twelve single launch tubes with two large Virginia Payload Tubes of six Tomahawks each, and the spherical sonar with the water-backed Large Aperture Bow array.
