usn_ugm-84d=UGM-84D,Harpoon,ASM,The Harpoon is an American standoff anti-ship weapon used widely throughout NATO. The weapon has an active radar seeker that is activated after following a pre-programmed route. The RGM-84D variant has improved range of 120nm.


#-----------Land Strike only missiles---------
usn_trident=UGM-133A, Trident II,ASM,The UGM-133A Trident II, or Trident D5, is a submarine-launched ballistic missile (SLBM) deployed with the United States and Royal Navy.
