# --------------- Torpedoes ---------------
usn_mk48_7_mw=Mk-48 Mod 7,CBASS,Torpedo,The Mark 48 Mod 7 CBASS is an American heavyweight torpedo. These torpedoes are wire guided and capable of being retargeted from the launch platform. The Mod 7 CBASS variant improves shallow-water capability, countermeasure rejection performance, and maneuverability to face the latest threats. It also features a shorter minimum range than its predecessors.

wp_fizik-2_mw=Fizik-2,Futlyar,Torpedo,The Futlyar (Fizik-2) is a Russian deep-water homing torpedo that entered service with the Russian Navy in 2017, replacing the UGST (Fizik-1). Futlyar is a wire-guided torpedo with a top speed about 50 knots and a maximum depth capability of more than 500 m (1,600 ft).

