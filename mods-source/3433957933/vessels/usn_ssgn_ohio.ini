#==================================================================================================
# Ohio class (SSGN conversion, 22 MAC tubes and 2 lockout chambers). The SSBN's model and hit colliders (ships/usn_ssbn_ohio) with its own textures (usn_ssgn_ohio_mat) and a plug in each MAC tube.
# Weapons, sensors, loads and handling are the ones this unit already carried; only the model-bound parts are new.
#==================================================================================================

[General]
UnitType=Submarine
DefaultCameraDistance=3.0
MinCameraDistanceForeAft=1.5
MinCameraDistanceBroadside=0.9
CameraPivotHeight=0.15
Length=170.7                    // in meters, 560 ft (Navy)
Beam=12.8                      // in meters, 42 ft (Navy)
FrontalArea=173
SideArea=2226
BottomArea=2021
ArmorType=None

[OpticalView]
Views=standard_periscope,bridge_binocular_eoss_stab_thermal
DefaultView=bridge_binocular_eoss_stab_thermal

[Physics]
Displacement=18750              // in tons
MaxForwardVelocity=25.0
MaxForwardVelocitySurfaced=12.0
MaxBackwardVelocitySurfaced=3.0
MaxBackwardVelocity=7.0
TelegraphVelocities=-7,0,5,9,12,18,25
CavitationParameters=20             // cavitation speed kt at 100 m: propeller 18 (user-approved noise calibration 2026-11-18)
BowUnderWater=18             // depth in feet, bow under water: submerged speeds
SailUnderWater=46            // depth in feet, from where the sail is under water
LinearDrag=0.92
MaxAccelerationFactor=2.4
MinAccelerationFactor=0.2
RudderTurnRate=5.0
DepthRudderTurnRate=5.0
RudderForce=0.7
MaxPitchAngle=20.0
PitchChangeRate=2.0
MaxRollAngle=30.0
RollChangeRate=5.0
BallastTankChangeRate=0.00025
MaxDepthChangeUsingTanks=5.0
TrimDepth=8                  // origin on the hull axis (user 2026-11-14, axis origin; was -4); default 8 2026-11-15 (sits too high at 0)
TrimAngle=0
CenterToKeelDist=0.093159        // origin (hull axis) to keel, game units
PeriscopeDepth=51            // in feet: sail roof 1.63 m under, radar mast 0.6 m clear
CrushDepth=1600.0              // in feet

[Buoyancy]
Density=0.45
OutOfWaterDrag=25.0
SubmergedDrag=25.0

[SensorData]
VisualIdentificationRange=6.0
IRSignature=SemiSmall
RCS=SemiSmall
BaseNoise=118                  // base sound level in db at 1m; user-approved noise calibration 2026-11-18; was 120
FlowNoise=0.8
CavitationNoise=10
TargetReflectionStrength=20
BladesCount=7                  // the model's 7-blade propeller
ElectricFrequency=60
PropellerType=Skewback
MachineryRaftingGeneration=5

[Animations]
NumberOfAnimationReferences=1
AnimationFile_1=animations_usn_ssgn_ohio

[AI]
UnitCostValue=6000
UnitScoreValue=5
Radar_Capability=TBD
Sonar_Capability=TBD
AAW_Capability=0
ASuW_Capability=7
ASW_Capability=7
Role=SSGN

[ControlSystem]
Collider=coll_cic
ModuleType=CIC

[MainPowerSystem]
Type=Nuclear
HorsePower=30000
Collider=coll_engineroom

[PropulsionSystems]
NumberOfPropulsionSystems=1

[PropulsionSystem1]
Mount=Propeller
RotationDirection=Right
Collider=coll_prop

[RudderSystems]
NumberOfRudderSystems=2

[RudderSystem1]
Mount=Rudder_Upper
Collider=coll_rudder_upper

[RudderSystem2]
Mount=Rudder_Lower
Collider=coll_rudder_lower

[DepthRudderSystems]
NumberOfDepthRudderSystems=2

[DepthRudderSystem1]
# the sail planes act as the forward planes
NumberOfPlanes=2
Plane1=Sail_Plane_Port
Plane2=Sail_Plane_Starboard
MaxAngle=20
Direction=1.0
Collider=coll_sailplanes

[DepthRudderSystem2]
NumberOfPlanes=2
Plane1=Stern_Plane_Port
Plane2=Stern_Plane_Starboard
MaxAngle=30
Direction=-1.0
Collider=coll_sternplanes

[SensorSystems]
NumberOfSensorSystems=7

[SensorSystem1]
# bridge watch; no collider so the boat never loses visual ID
Type=Visual
SystemName=Optics
Mount=Dummy
MountPosition=0,0.222141,0.766243
ModuleType=Inert

[SensorSystem2]
# Type 18 search periscope
Type=Periscope
SystemName=AdvancedOptics
Mount=Mast_Periscope
NightVisionLevel=0.25
OpenSystemAnimation=RaisePeriscope
CloseSystemAnimation=LowerPeriscope
Collider=coll_periscope

[SensorSystem3]
# BPS-15/16 surface search radar
Type=Radar
SystemName=BPS-14_15
Mount=Mast_Radar
OpenSystemAnimation=RaiseRadar
CloseSystemAnimation=LowerRadar
RadarOffset=11     // in feet. Radar height over mount position
Collider=coll_radar_mast

[SensorSystem4]
# bow sphere
Type=Sonar
SystemName=BQQ-10_mw
Mount=Dummy
MountPosition=0,0,1.155027
Collider=coll_bowsonar

[SensorSystem5]
# towed array, from the open mouth of the port plane-tip tube
Type=Sonar
SystemName=TB-29_mw
Mount=Dummy
CablePart=effects/ships/emitters/Towed_Array_Line
AttachmentPointPosition=-0.11936,0.003639,-1.195056
CableLength=300
Depth=200
CableRetractRate=3
CableSinkRate=0.001
MinDeploySpeed=5.0
MaxDeploySpeed=25.0
Collider=coll_towed_array

[SensorSystem6]
Type=ESM
SystemName=Submarine_ESM
Mount=Mast_ESM
OpenSystemAnimation=RaiseESM
CloseSystemAnimation=LowerESM
Collider=coll_esm_mast

[SensorSystem7]
# acoustic intercept: last sensor
Type=Sonar
SystemName=ActiveIntercept_Late
Mount=Dummy
MountPosition=0,0,0

