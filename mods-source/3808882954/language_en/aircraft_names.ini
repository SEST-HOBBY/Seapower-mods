DefaultDescription=The RC-135V/W Rivet Joint is a dedicated electronic reconnaissance aircraft used by the U.S. Air Force and Royal Air Force to provide near-real-time intelligence. Its onboard sensor suite detects, identifies, and geolocates electromagnetic signals, and the crew can distribute collected information through the aircraft's communications suite. Extensively modified from the C-135 airframe, Rivet Joint aircraft are recognizable by their cheek fairings and elongated nose. Due to their role in SIGINT and ELINT, as well as their appearance, the RC-135V/W has aquired the nickname "Snoopy", which it occassionally operates as (SNOOP). 
This later configuration represents the CFM56/F108-powered fleet following the airframe, navigation, and powerplant modernization completed in 2005. USAF RC-135 aircraft are based at Offutt Air Force Base, Nebraska, and operated by the 55th Wing; related RC-135 variants include the Cobra Ball (RC-135S) and Combat Sent (RC-135U).

