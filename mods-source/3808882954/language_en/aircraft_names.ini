DefaultDescription=The RC-135V/W Rivet Joint is a dedicated electronic reconnaissance aircraft used to provide near-real-time intelligence by detecting, identifying, and geolocating electromagnetic signals. Extensively modified from the C-135 airframe, Rivet Joint aircraft are recognizable by their cheek fairings and elongated nose. This early configuration represents the TF33-powered fleet before the CFM56/F108 re-engining and associated avionics modernization completed in 2005. The RC-135 family operates out of Offutt Air Force Base, Nebraska, under the 55th Wing and its predecessor, Strategic Air Command (SAC).
