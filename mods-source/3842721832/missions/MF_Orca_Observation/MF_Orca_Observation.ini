NeutralBiologic2NameOverride=虎鲸 B（按航点游动）
NeutralBiologic2ShortNameOverride=虎鲸 B
Taskforce1StartMessage=虎鲸观察测试|燕鸥号开场停船。虎鲸 A 在船的西北方，距离约 0.9 海里。观察它是否会自行转向、下潜和上浮换气。虎鲸 B 在船的东北方，距离相同。它先向东游向首个航点，途中下潜至 45 英尺，最后一段回到近水面深度。\n\n分别从水面上方和水下观察两头虎鲸。近距离观察时使用 1 倍速，间隔期间可加速。观察到两种行为后即可退出场景。|开始观察

