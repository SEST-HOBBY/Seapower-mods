Name=Orca Observation - Northeast Pacific
Description=An unarmed observation boat and two neutral orcas offshore in the northeast Pacific. Compare autonomous swimming and surfacing with a short waypoint route. Requires the Marine Fauna mod.
Taskforce1Vessel1NameOverride=Survey Boat Tern
Taskforce1Vessel1ShortNameOverride=Tern
NeutralBiologic1NameOverride=Orca A - Autonomous
NeutralBiologic1ShortNameOverride=Orca A
NeutralBiologic2NameOverride=Orca B - Directed
NeutralBiologic2ShortNameOverride=Orca B
Taskforce1StartMessage=Orca observation trial|Tern starts stopped. Look for Orca A about 0.9 nautical miles to the northwest and Orca B the same distance to the northeast. Watch A for independent turns, dives and surfacing. B swims east toward its first waypoint, then descends to 45 feet before returning to a near-surface depth on the last leg.\n\nUse the camera above and below the surface to compare both animals. Run at 1x for close inspection and accelerate between observations. End the scenario when you have seen both behaviors.|Begin observation

[Language_cn]
Name=东北太平洋虎鲸观察
Description=在东北太平洋外海，从一艘无武装观察船上观察两头中立虎鲸，对比自主游动、换气和按航点行进的表现。需要启用海洋动物模组。
