[AmmunitionNames]
# ------------------ AAM ------------------
#空空导弹

# ------------------ SAM ------------------
#对空导弹

plaaf_pl-10=PL-10,,空对空,霹雳-10是中国为第四代和第五代战斗机研制的近距红外制导空空导弹。导弹导引头采用多重红外成像制导技术，具有很强的抗干扰能力，支持头盔显示器随动。导弹支持大离轴，大过载发射条件，拥有近距红外格斗弹中较远的射程。

plaaf_pl-12a=PL-12A,,空对空,霹雳-12是中国空军装备的中程主动雷达制导空空导弹，装备国产第三代和第四代战斗机。霹雳-12A是其改进型，总体性能约相当于AIM-120C-5空空导弹。

plaaf_pl-15=PL-15,折叠弹翼,空对空,霹雳-15是中国空军装备的中远程主动雷达制导空空导弹，采用双脉冲固体火箭发动机，有源相控阵雷达导引头和双向数据链，具备长射程，高末端速度和优异的抗干扰性能。

plaaf_pl-15_s=PL-15,折叠弹翼,空对空,霹雳-15是中国空军装备的中远程主动雷达制导空空导弹，采用双脉冲固体火箭发动机，有源相控阵雷达导引头和双向数据链，具备长射程，高末端速度和优异的抗干扰性能。

plaaf_pl-17=PL-17,,远程空对空,霹雳-17是中国空军装备的远程主动雷达制导空空导弹，主要用于在超远距离上攻击地方辅助和支援飞机目标，包括加油机，预警机，轰炸机等，导弹射程远速度快，但机动性较差，不适合攻击高机动性的目标。

plan_hq-10a=红旗-10A,,舰空导弹,红旗-10A是中国自主研制的近程点防空导弹系统，与近防炮一起构成水面舰艇近防武器系统，装备人民海军054A、056A型导弹护卫舰，052D、055型导弹驱逐舰等主力水面作战舰艇。导弹采用射频搜索加红外制导的复合制导模式，发射间隔短，反应速度快，能有效拦截各类低空掠海目标。导弹采用模块化设计，支持海上重装填，具备良好的持续抗打击能力。
# ---------- Anti-radar Missiles ---------
#反辐射导弹
plaaf_akf-98a=AKF-98A,,反辐射巡航导弹,AKF-98A是中国空军装备的隐身构型反辐射巡航导弹，可利用其雷达低可视特性穿透地方防空网络，对低空导弹阵地和各类雷达阵地目标发动精确打击。

plaaf_yj-91=YJ-91,,反辐射导弹,鹰击-91是中国空军装备的反辐射导弹，是引进自俄罗斯的Kh-31P反辐射导弹的国产版本。

plaaf_ld-8a=LD-8A,,反辐射,雷电-8A反辐射导弹是利用霹雳-15空空导弹构型改进而来的通用反辐射导弹。

plaaf_ld-8a_s=LD-8A,,反辐射,雷电-8A反辐射导弹是利用霹雳-15空空导弹构型改进而来的通用反辐射导弹。
# ---------- Anti-ship Missiles ----------
#反舰导弹
plan_yj-83kh=YJ-83KH,,反舰导弹,鹰击-83KH是中国空军和中国海军航空兵装备的亚音速反舰巡航导弹，其自舰载型鹰击-83反舰导弹发展而来，采用低空掠海飞行剖面和红外成像（IIR）导引头，具备优秀的突防和抗干扰能力。

plan_yj-15=YJ-15,,超音速巡航导弹,鹰击-15是中国海军航空兵装备的超音速反舰巡航导弹，采用冲压发动机和低空掠海飞行剖面，具备射程远，威力大，速度快的特点。
#-----------Land Strike only missiles---------
#对地导弹
plaaf_kd-88=KD-88,,空对地,空地-88导弹是中国空军和海军航空兵装备的多用途空对地导弹，自空射型鹰击-81导弹发展而来，采用电视导引头。
plaaf_akf-98=AKF-98,,子母弹布撒器,AKF-98是中国空军装备的隐身构型反跑道子母弹布撒器，可利用其雷达低可视特性穿透敌方防空网络，对机场跑道等目标发动精确打击。
# ---------- Anti-sub  Missilies ----------
#反潜导弹

# ------------------ RBU ------------------

# --------------- Torpedoes ---------------
#鱼雷

plan_yu-12_air=鱼-12,,轻型反潜鱼雷,鱼-12是中国自主研制的新一代通用反潜轻型鱼雷，可由舰载鱼雷发射器，舰载反潜直升机，固定翼海上巡逻机和反潜助飞鱼雷搭载发射，鱼雷采用热动力泵喷推进，装备新一代主被动声自导导引头。鱼雷具有射程远，速度快，抗干扰能力强，通用性好的特点。

plan_yu-12a=鱼-12A,,轻型反潜鱼雷/反鱼雷鱼雷,鱼-12是中国自主研制的新一代通用反潜轻型鱼雷，可由舰载鱼雷发射器，舰载反潜直升机，固定翼海上巡逻机和反潜助飞鱼雷搭载发射，鱼雷采用热动力泵喷推进，装备新一代主被动声自导导引头。鱼雷具有射程远，速度快，抗干扰能力强，通用性好的特点。鱼-12A具备反鱼雷能力。
# ------------------ Bombs -----------------
#航空炸弹
plaaf_ls-6_250=LS-6 250千克,,滑翔炸弹,雷石-6是使用滑翔套件改装的250公斤通用航空炸弹，GPS制导，主要用于打击固定地面目标。

plaaf_ls-6_500=LS-6 500千克,,滑翔炸弹,雷石-6是使用滑翔套件改装的500公斤通用航空炸弹，GPS制导，主要用于打击固定地面目标。

plaaf_ls-6_500_zc=LS-6 500千克,增程型,滑翔炸弹,雷石-6增程型是使用滑翔套件并加装涡轮喷气发动机改装的500公斤通用航空炸弹，GPS制导，主要用于打击固定地面目标。

plaaf_gb-1000=GB-1000,,激光制导炸弹,1000千克自由落体激光制导炸弹。

plaaf_bbm2=BBM2,,制导滑翔炸弹,CS/BBM2是一种由中国兵器工业集团研发的100公斤级轻型精准制导滑翔炸弹，通常采用卫星导航（GPS/北斗）制导。该炸弹主要用于高效率打击机库、轻型装甲车辆等目标。
