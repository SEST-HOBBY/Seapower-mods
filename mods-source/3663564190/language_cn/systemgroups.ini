RJL-XXX_ESM=H/RJL-XXX ESM|H/RJZ-XXX舰载电子战系统是人民海军装备的第四代舰载组合式综合电子战设备，包括电子支援设备（ESM），雷达告警设备（RWR），主被动有源电子干扰设备（ECM）和无源电子干扰发射器。系统能够根据作战指挥系统传递的威胁目标信息全自动分配干扰频段和干扰类型，有效干扰来袭目标的传感器设备。
RJZ-XXX_RWR=H/RJZ-XXX RWR|H/RJZ-XXX舰载电子战系统是人民海军装备的第四代舰载组合式综合电子战设备，包括电子支援设备（ESM），雷达告警设备（RWR），主被动有源电子干扰设备（ECM）和无源电子干扰发射器。系统能够根据作战指挥系统传递的威胁目标信息全自动分配干扰频段和干扰类型，有效干扰来袭目标的传感器设备。
RKL-500_ESM=K/RKL-500 ESM|K/RKL-500（虚构代号）是人民空军新一代特种飞机装备的综合电子支援和侦查分析设备，具备电磁辐射信号，通讯信号拦截和电子情报分析功能
RKL-600=K/RKL-600 RWR|雷达告警设备
RKL-15=K/RKL-15 RWR|雷达告警设备
RKL-18_ESM=K/RKL-18 ESM|K/RKL-18 ESM（虚构代号）是直-18直升机装备的电子支援设备。
RKL-18=K/RKL-18 RWR|雷达告警设备
RKL-35_ESM=K/RKL-35 ESM|K/RKL-35（虚构代号）是歼-35装备的被动电子态势感知设备。
RKL-35=K/RKL-35 RWR|雷达告警设备

