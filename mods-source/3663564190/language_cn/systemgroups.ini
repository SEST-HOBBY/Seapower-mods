#---------------------------------------- Radar ----------------------------------------
#雷达

#---------- Surface ships ----------
#舰载探测设备
Navigation_radar=导航雷达|导航雷达
#---Air/Air&Surface---
#舰载对空雷达
LJQ-36X=H/LJQ-36X radar|H/LJQ-36X雷达是一种采用AESA体制的新型双波段超低空搜索/水面搜索雷达，工作在X波段（超低空搜索）和I波段（水面搜索）。主要用于填补H/LJG-346A雷达在近距离探测超低空掠海目标时产生的盲区，安装于综合射频桅杆内，该雷达也可为近防武器系统提供目标参数。
LJG-346A=H/LJG-346A|H/LJG-346‘海之星’雷达是中国海军装备的第一种大型双波段主动有源相控阵（AESA）雷达，工作在S波段（搜索/跟踪）和C波段（制导）。H/LJG-346A型雷达是提升探测能力，加强散热性能的改进型。系统共有4个雷达阵面，由液冷管路冷却，单个雷达阵面由中央的S波段阵面和上下两侧的长条形C波段阵面组成，单个S波段阵面T/R组件数量超过5000个，最大搜索距离大于500公里。配合新一代数字化自动指挥控制系统，雷达能够同时跟踪上百个空中目标，自动识别和判断威胁等级并给出攻击指令，引导海红旗-9系列舰空导弹攻击威胁等级最高的目标。
#---Surface only---
#舰载对地雷达
LJQ-3XX=H/LJQ-3XX radar|H/LJQ-3XX雷达是一种新型L波段水面搜索雷达，具备主被动工作模式，为舰载反舰导弹提供目标指示。
