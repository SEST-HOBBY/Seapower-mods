#机载雷达
KLC-600=KLC-600|KLC-600（虚构代号）是空警-600舰载预警机装备的机械扫描有源相控阵雷达，具备作用距离远探测精度高的特点。
KLC-600_low-band_mode=KLC-600低频段模式|KLC-600雷达低频段工作模式，雷达将切换到UHF频段工作，主要用于对隐身目标探测，但作用距离限制为250公里。
KLJ-15=KLJ-15|KLJ-15（虚构代号）是歼-15T舰载战斗机装备的新一代有源相控阵机载雷达。
KLC-4=KLC-4|KLC-4（虚构代号）是直-18JA舰载警戒直升机装备的机械扫描有源相控阵雷达，悬挂于直升机后机身下方，能够为水面舰艇编队提供低空和掠海目标探测和火控引导能力。
KLC-18=KLC-18|KLC-18（虚构代号）是直-18FA舰载反潜直升机装备的水面搜索雷达，具备全向探测能力，可探测潜艇的潜望镜和通气管。
KLJ-35=KLJ-35|KLJ-35（虚构代号）是歼-35舰载战斗机装备的机载有源相控阵雷达。
