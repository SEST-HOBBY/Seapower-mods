#-------- Sequences -------- 动画序列 --------#
[Elevator1MoveDownSequence]
NumberOfSteps=2
Time1=0                // 开始时间
PositionY1=0           // 动画执行方式级坐标轴:Position（X.Y.Z)=位移/Rotation（X.Y.Z)=旋转
Smoothness1=EaseInOut  // 过渡下一步方式：线性.Linear 或者 缓进缓出.EaseInOutstep
Time2=5                // 上一步到此处结束时间（秒）
PositionY2=-0.1602      // 动画执行方式级坐标轴:Position（X.Y.Z)=位移/Rotation（X.Y.Z)=旋转
Smoothness2=EaseInOut  // 过渡下一步方式：线性过渡.Linear 或者 缓进缓出.EaseInOutstep
[Elevator1MoveUpSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionY1=-0.1602
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5                // time in seconds - here for the end
PositionY2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry
[Open_Door_A]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionZ1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5
PositionZ2=-0.2950
Smoothness2=EaseInOut
[Close_Door_A]
NumberOfSteps=2
Time1=0                // time in seconds for the start
PositionZ1=-0.2950
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=5
PositionZ2=0
Smoothness2=EaseInOut

[Deflector1MoveUpSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=0
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=3                // time in seconds - here for the end
RotationX2=60
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry
[Deflector1MoveDownSequence]
NumberOfSteps=2
Time1=0                // time in seconds for the start
RotationX1=60
Smoothness1=EaseInOut  // can be: Linear, EaseInOut - transition to the next step
Time2=3                // time in seconds - here for the end
RotationX2=0
Smoothness2=EaseInOut  // can be: Linear, EaseInOut - is not used here as it's the last entry