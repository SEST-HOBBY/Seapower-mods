plaaf_ls-6_250=LS-6(250kg),Glide Bomb,Land Attack,The LS-6 500-kilogram GPS-guided glide bomb is composed of a 250-kilogram low-drag general-purpose bomb equipped with glide and guidance components, providing stand-off precision strike capabilities.
plaaf_ls-6_500=LS-6(500kg),Glide Bomb,Land Attack,The LS-6 500-kilogram GPS-guided glide bomb is composed of a 500-kilogram low-drag general-purpose bomb equipped with glide and guidance components, providing stand-off precision strike capabilities.

plaaf_ls-6_500_zc=LS-6(500kg),Glide Bomb,Land Attack,The LS-6 500-kilogram GPS-guided glide bomb is composed of a 500-kilogram low-drag general-purpose bomb equipped with turbo jet range-extention, glide kit and guidance components, providing stand-off precision strike capabilities.

plaaf_gb-1000=GB-1000,,Laser-guided bomb,1000kg free-fall laser-guided bomb.

plaaf_bbm2=BBM2,,Glide Bomb,The CS/BBM2 is a 100kg lightweight precision-guided glide bomb developed by China North Industries Group Corporation Limited (NORINCO Group). It typically employs satellite navigation (GPS/BeiDou) guidance and is mainly designed for the efficient engagement of targets such as aircraft hangars and light armored vehicles.
