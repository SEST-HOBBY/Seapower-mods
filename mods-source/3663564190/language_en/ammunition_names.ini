#空空导弹

# ------------------ SAM ------------------
#对空导弹

plaaf_pl-10=PL-10,,AAM,The PL-10 is a short-range infrared-guided air-to-air missile developed by China for fourth and fifth-generation fighter aircraft. The missile's seeker utilizes advanced multi-element imaging infrared (IIR) guidance technology, providing strong resistance to countermeasures and compatibility with helmet-mounted display systems. It supports high off-bore and high-G launch conditions, and possess a relatively long range among short-range infrared missiles.

plaaf_pl-12a=PL-12A,,AAM,The PL-12 is a medium-range active radar homing air-to-air missile in service with the People's Liberation Army Air Force, equipping China's domestic third-generation and fourth-generation fighter jets.The PL-12A is its improved variant, with overall performance roughly equivalent to that of the AIM-120C-5 air-to-air missile.

plaaf_pl-15=PL-15,,AAM,The PL-15 is a medium-to-long-range active radar homing air-to-air missile in service with the People's Liberation Army Air Force.It employs a dual-pulse solid rocket motor, an active electronically scanned array (AESA) radar seeker, and a two-way data link, featuring long range, high terminal velocity, and excellent anti-jamming capabilities.

plaaf_pl-15_s=PL-15,,AAM,The PL-15 is a medium-to-long-range active radar homing air-to-air missile in service with the People's Liberation Army Air Force.It employs a dual-pulse solid rocket motor, an active electronically scanned array (AESA) radar seeker, and a two-way data link, featuring long range, high terminal velocity, and excellent anti-jamming capabilities.

plaaf_pl-17=PL-17,,AAM,The PL-17 is a long-range active radar homing air-to-air missile fielded by the People's Liberation Army Air Force. It is primarily used against hostile auxiliary and support aircraft at very long standoff ranges, that include tankers, AWACSs, and bombers. The missile possesses a very long range and high terminal speed, but it suffers from inferior maneuverability, making it unsuitable for engaging very maneuverable targets.

plan_hq-10a=HQ-10A,,SAM,The HQ-10A is a short-range point air defense missile system developed by China. Together with close-in weapon systems (CIWS), it forms the shipboard close-in defense system for the People's Liberation Army Navy (PLAN).It equips the PLAN’s main surface combatants, including Type 054A and Type 056A frigates, as well as Type 052D and Type 055 guided-missile destroyers. The missile adopts a composite guidance mode of radio frequency (RF) search plus infrared (IR) homing. Featuring short launch intervals and fast response speed, it can effectively intercept various low-altitude sea-skimming targets.Designed with a modular architecture, the missile supports at-sea reload and delivers strong sustained anti-strike capability.
# ---------- Anti-radar Missiles ---------
#反辐射导弹
plaaf_akf-98a=AKF-98A,,ARM,The AKF‑98A is a stealthy anti‑radiation cruise missile fielded by the People’s Liberation Army Air Force (PLAAF).Taking advantage of its low radar observability, it can penetrate hostile air defense networks and conduct precision strikes against SAM sites and various radar installations.

plaaf_yj-91=YJ-91,,ARM,The YJ‑91 is an anti‑radiation missile (ARM) in service with the People’s Liberation Army Air Force (PLAAF), and is the domestic Chinese variant of the Russian Kh‑31P anti‑radiation missile.

plaaf_ld-8a=LD-8A,,ARM,The LD-8A anti-radiation missile (ARM) is a multi-purpose anti-radiation missile modified from the airframe configuration of the PL-15 air-to-air missile.

plaaf_ld-8a_s=LD-8A,,ARM,The LD-8A anti-radiation missile (ARM) is a multi-purpose anti-radiation missile modified from the airframe configuration of the PL-15 air-to-air missile.
# ---------- Anti-ship Missiles ----------
#反舰导弹
plan_yj-83kh=YJ-83KH,Cruise Missile,ASuW,The YJ-83KH is a subsonic anti-ship cruise missile fielded by both the People's Liberation Army Air Force (PLAAF) and the People's Liberation Army Naval Air Force (PLANAF).Derived from the ship-launched YJ-83 anti-ship missile, it features a low-altitude sea-skimming flight profile and an infrared imaging (IIR) seeker, delivering outstanding penetration and anti-jamming capabilities.

plan_yj-15=YJ-15,Cruise Missile,ASuW,The YJ-15 is a supersonic anti-ship cruise missile fielded by the People's Liberation Army Naval Air Force (PLANAF).Powered by a ramjet engine and utilizing a low-altitude sea-skimming flight profile, it features long range, large warhead power, and high speed.
#-----------Land Strike only missiles---------
#对地导弹
plaaf_kd-88=KD-88,,AGM,The KD-88 is a multi-purpose air-to-surface missile in service with the People's Liberation Army Air Force (PLAAF) and People's Liberation Army Naval Air Force (PLANAF).Developed from the air-launched YJ-81 anti-ship missile, it employs a television seeker.
plaaf_akf-98=AKF-98,Cluster munition dispenser,Land Attack,The AKF-98 is a stealth-configured anti-runway cluster bomb dispenser employed by the People's Liberation Army Air Force (PLAAF).Leveraging its low radar observability, it can penetrate enemy air defense networks and conduct precision strikes against targets such as airport runways.
