# --------------- Torpedoes ---------------
#鱼雷
plan_yu-12_ship=Yu-12,Torpedo,ASW,The Yu-12 is China's latest generation of universal lightweight anti-submarine torpedo. It can be launched from shipborne torpedo launchers, anti-submarine helicopters, fixed-wing maritime patrol aircraft, and anti-submarine missiles. The torpedo employs a thermal-powered pump-jet propulsion system and is equipped with a new-generation active/passive acoustic homing seeker. Characterized by extended range, high speed, strong countermeasure resistance, and excellent platform adaptability, it represents a significant advancement in China's anti-submarine warfare capabilities.

plan_yu-12_air=Yu-12,Torpedo,ASW,The Yu-12 is China's latest generation of universal lightweight anti-submarine torpedo. It can be launched from shipborne torpedo launchers, anti-submarine helicopters, fixed-wing maritime patrol aircraft, and anti-submarine missiles. The torpedo employs a thermal-powered pump-jet propulsion system and is equipped with a new-generation active/passive acoustic homing seeker. Characterized by extended range, high speed, strong countermeasure resistance, and excellent platform adaptability, it represents a significant advancement in China's anti-submarine warfare capabilities. 

plan_yu-12a=Yu-12A,Torpedo,ASW/ATT,The Yu-12 is China's latest generation of universal lightweight anti-submarine torpedo. It can be launched from shipborne torpedo launchers, anti-submarine helicopters, fixed-wing maritime patrol aircraft, and anti-submarine missiles. The torpedo employs a thermal-powered pump-jet propulsion system and is equipped with a new-generation active/passive acoustic homing seeker. Characterized by extended range, high speed, strong countermeasure resistance, and excellent platform adaptability. Yu-12A is a anti-torpedo-capable (ATT) variant.
