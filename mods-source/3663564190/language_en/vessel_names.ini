DefaultDescription=The Type 003 aircraft carrier is the first CATOBAR carrier with a full-length straight flight deck independently designed and built by China. It adopts cutting-edge electromagnetic aircraft launch and recovery systems (EMALS and AAG), as well as an integrated electric propulsion system. Its lead ship, PLANS Fujian, is the People's Liberation Army Navy (PLAN)’s third aircraft carrier. Launched in 2022 and commissioned in 2025, it is the largest surface combatant in the PLAN fleet. The commissioning of the Type 003 marks that PLAN carrier design has completely moved away from the ski-jump configuration inherited from Russian and Soviet designs. Its robust aviation operating capabilities have significantly strengthened the PLAN’s air superiority and comprehensive strike power in the far seas. It serves as a powerful asset for the PLAN in conducting anti-access/area denial (A2/AD) operations, safeguarding national sovereignty and maritime interests.
Variant1=PLANS Fujian CV18