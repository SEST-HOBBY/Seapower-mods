# ------------------ CIWS -----------------
#近防武器


Type_1130=H/PJ-11|The H/PJ-11 is deployed aboard the People's Liberation Army Navy's major surface combatants as a universal close-in weapon system (CIWS). Its core component is an 11-barrel 30mm rotary cannon firing Armor-Piercing Fin-Stabilized Discarding Sabot (APFSDS) ammunition at a rate of approximately 10,000 rounds per minute. The turret can traverse at speeds up to 90 degrees per second, and is equipped with independent infrared/electro-optical sensors and a laser rangefinder. Each turret is supported by a dedicated H/LJP-349 fire-control radar for targeting solutions. The system is capable of effectively engaging incoming supersonic sea-skimming missiles, as well as fixed-wing and rotary-wing aircraft, surface vessels and small boats, coastal targets, and floating mines.

