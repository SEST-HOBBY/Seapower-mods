LJQ-36X=H/LJQ-36X radar|The H/LJQ-36X radar is a new dual-band, ultra-low-altitude/surface search radar employing an Active Electronically Scanned Array (AESA) array. It operates in the X-band (for ultra-low-altitude search) and I-band (for surface search). Primarily designed to address the blind zones of the H/LJG-346A radar in detecting close-range, sea-skimming targets, it is integrated with the integrated mast system. This radar can also provide target parameters to close-in weapon systems (CIWS).
LJG-346A=H/LJG-346A|The H/LJG-346 "Sea Star" radar is the first large dual-band active electronically scanned array (AESA) radar system deployed by the Chinese Navy, operating in S-band (for search/tracking) and C-band (for guidance). The upgraded H/LJG-346A variant features enhanced detection capabilities and improved thermal management. The system comprises four radar arrays cooled by liquid cooling circuits. Each array consists of a central S-band panel flanked by elongated C-band panels above and below. A single S-band array contains over 5,000 transmit/receive (T/R) modules, with a maximum detection range exceeding 500 kilometers. Integrated with a new-generation digital automated command-and-control system, the radar can simultaneously track hundreds of aerial targets, automatically identify and assess threat levels, assign engagement priorities, and guide HHQ-9 series surface-to-air missiles to engage the highest-priority threats.
