name: SEST dual-build release source gates

on:
  push:
    branches:
      - release/sest-workshop-20261101
  pull_request:
    paths:
      - 'data/**'
      - 'mods-source/**'
      - 'integration/**'
      - 'tools/**'
      - '.github/workflows/sest-release-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm beta and stable game baselines
        shell: bash
        run: |
          test -d mods-source/_vanilla/original
          test -d data/game-baselines/beta-261026/original
          test -f integration/campaign/setup/sest-profile.ps1
          test -f integration/beta-anchorchain/source/Main.cs
      - name: Run captured Workshop inventory gate
        run: python tools/check_inventory.py
      - name: Run canonical load-order gate
        run: python tools/check_load_order.py
      - name: Run game-version compatibility gate
        run: python tools/check_game_version.py
      - name: Run beta loader source-contract checks
        run: python integration/beta-anchorchain/test_source_contract.py
      - name: Run captured Workshop summary parser tests
        run: python -m unittest discover -s tools/tests -p test_workshop_refresh_summary.py
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $paths = @(
            'tools/capture-all-mod-updates.ps1',
            'integration/campaign/setup/sest-profile.ps1',
            'integration/campaign/setup/sest-setup.ps1',
            'integration/beta-anchorchain/build.ps1',
            'integration/beta-anchorchain/test.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              throw "$path did not parse"
            }
            Write-Host "Parsed: $path"
          }

  build-consolidated-pack:
    needs: source-and-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build all SEST packs from source
        run: python tools/build_all.py --from-scratch
      - name: Validate built dependencies
        run: python tools/check_dependencies.py
      - name: Validate source-to-pack fidelity
        run: python tools/check_pack_fidelity.py
      - name: Validate campaign and Workshop coverage
        run: python tools/check_campaign_coverage.py
      - name: Validate weapon employment
        run: python tools/check_weapon_employment.py
      - name: Validate combat costs
        run: python tools/check_combat_costs.py
