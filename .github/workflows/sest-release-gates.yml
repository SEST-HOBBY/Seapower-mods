name: SEST dual-build release source gates

on:
  pull_request:
    branches:
      - sest-dev/jolly-ride-rptj4t
    paths:
      - 'data/**'
      - 'mods-source/**'
      - 'integration/**'
      - 'tools/**'
      - '.github/workflows/sest-release-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm beta and stable game baselines
        shell: bash
        run: |
          test -d mods-source/_vanilla/original
          test -d data/game-baselines/beta-261026/original
          test -f integration/campaign/setup/sest-profile.ps1
          test -f integration/beta-anchorchain/source/Main.cs
      - name: Run captured Workshop inventory gate
        run: python tools/check_inventory.py
      - name: Run canonical load-order gate
        run: python tools/check_load_order.py
      - name: Run game-version compatibility gate
        run: python tools/check_game_version.py
      - name: Run beta loader source-contract checks
        run: python integration/beta-anchorchain/test_source_contract.py
      - name: Run captured Workshop summary parser tests
        run: python -m unittest discover -s tools/tests -p test_workshop_refresh_summary.py
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $paths = @(
            'tools/capture-context.ps1',
            'tools/capture-all-mod-updates.ps1',
            'tools/tests/test_capture_context.ps1',
            'integration/campaign/setup/sest-profile.ps1',
            'integration/campaign/setup/sest-setup.ps1',
            'integration/beta-anchorchain/build.ps1',
            'integration/beta-anchorchain/test.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              throw "$path did not parse"
            }
            Write-Host "Parsed: $path"
          }

  capture-context-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run real capture script under Windows PowerShell 5.1 StrictMode
        shell: powershell
        run: .\\tools\\tests\\test_capture_context.ps1

      - name: Run Workshop export regression under Windows PowerShell 5.1
        shell: powershell
        run: .\tools\tests\test_export_mod_configs.ps1

  build-consolidated-pack:
    needs: source-and-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SEST builder dependencies
        run: python -m pip install Pillow numpy global-land-mask
      - name: Build all SEST packs from source
        run: python tools/build_all.py --from-scratch
      - name: Validate built dependencies
        run: python tools/check_dependencies.py
      - name: Validate source-to-pack fidelity
        run: python tools/check_pack_fidelity.py
      - name: Validate campaign and Workshop coverage
        run: python tools/check_campaign_coverage.py
      - name: Validate weapon employment
        run: python tools/check_weapon_employment.py
      - name: Validate combat costs
        run: python tools/check_combat_costs.py

      - name: Upload stable 261021 SEST preview pack
        uses: actions/upload-artifact@v4
        with:
          name: SEST-261021-Stable-Preview
          path: integration/dist/SEST_Integration/
          retention-days: 7
          if-no-files-found: error

  beta-schema-probe:
    needs: source-and-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SEST builder dependencies
        run: python -m pip install Pillow numpy global-land-mask
      - name: Select captured beta 261026 game definitions
        shell: bash
        run: |
          test -d data/game-baselines/beta-261026/original
          rm -rf mods-source/_vanilla
          cp -a data/game-baselines/beta-261026 mods-source/_vanilla
      - name: Build beta-specific SEST data pack in disposable CI checkout
        run: python tools/build_all.py --from-scratch
      - name: Validate beta build dependencies
        run: python tools/check_dependencies.py
      - name: Validate beta source-to-pack fidelity
        run: python tools/check_pack_fidelity.py
      - name: Upload beta 261026 SEST preview pack
        uses: actions/upload-artifact@v4
        with:
          name: SEST-261026-Beta-Preview-UnverifiedRuntime
          path: integration/dist/SEST_Integration/
          retention-days: 7
          if-no-files-found: error
